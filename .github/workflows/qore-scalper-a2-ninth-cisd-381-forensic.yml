name: QORE Scalper A2 Ninth CISD 381 Forensic

on:
  push:
    branches:
      - agent/scalper-architect-b-methodology-20261010
    paths:
      - '.github/workflows/qore-scalper-a2-ninth-cisd-381-forensic.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_cisd_381_discrepancy_forensic_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_scalper_cisd_381_discrepancy_forensic_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: scalper-a2-ninth-cisd-381-${{ github.ref }}
  cancel-in-progress: true

env:
  CONTROL_RUN: '38053946695'
  CONTROL_SHA: 'e356e7a52541e99533b25ecfef0ab9c4e9ce03c0'
  SENSOR_RUN: '38071138991'
  SENSOR_SHA: '74f4d9c89cdaaefd220a9a45ba98c2a0376be3d7'
  NATIVE_RUN: '35548099334'
  NATIVE_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Deterministic taxonomy + native bars MFE MAE coverage
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_scalper_cisd_381_discrepancy_forensic_v1.py tests/infrastructure/trader_lab/test_capitalizer_scalper_cisd_381_discrepancy_forensic_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_scalper_cisd_381_discrepancy_forensic_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_scalper_cisd_381_discrepancy_forensic_v1.py

  market:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol: [USDJPY, AUDJPY, AUDUSD, GBPJPY, EURUSD, GBPUSD, XAUUSD, USDCAD, NAS100]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Original V49 frozen source ledger
        uses: actions/download-artifact@v4
        with:
          name: scalper-a2-v49-control-${{ matrix.symbol }}-${{ env.CONTROL_SHA }}
          path: original
          github-token: ${{ github.token }}
          run-id: ${{ env.CONTROL_RUN }}
      - name: Original shadow sensors with 381 mismatches retained
        uses: actions/download-artifact@v4
        with:
          name: scalper-a2-entry-sensor-${{ matrix.symbol }}-${{ env.SENSOR_SHA }}
          path: sensor
          github-token: ${{ github.token }}
          run-id: ${{ env.SENSOR_RUN }}
      - name: Same provider-native M1 for original price excursions
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.NATIVE_SHA }}
          path: native
          github-token: ${{ github.token }}
          run-id: ${{ env.NATIVE_RUN }}
      - name: Fail closed on synthetic/interpolated M1
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path("native/m1-clone-manifest.json").read_text())
          assert d["canonical_symbol"]==os.environ["SYMBOL"]
          assert d["provider_native_m1"] is True
          assert d["synthetic_m1"] is False and d["interpolated_m1"] is False
          assert d["contradictory_m1"] == 0 and d["read_only"] is True
          PY
      - name: Classify and price BOTH source and sensor CISD timestamps
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_cisd_381_discrepancy_forensic_v1 market original sensor native market-output
      - name: Every original opportunity retained, no earlier order issued
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads(Path("market-output/scalper-cisd-381-market.json").read_text())
          assert x["symbol"]==os.environ["SYMBOL"]
          assert x["sources"]==x["classified"]
          assert x["paper_trades_changed"]==0
          assert x["causal_replay_policy_changed"] is False
          assert x["future_bars_used_only_for_labels"] is True
          assert not x["trader_certified"] and not x["live_authorized"]
          print("NINTH CISD DISCREPANCY",x)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-ninth-cisd-${{ matrix.symbol }}-${{ github.sha }}
          path: market-output/
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: scalper-a2-ninth-cisd-*-${{ github.sha }}
          path: market-inputs
          merge-multiple: false
      - name: Reconcile 381 exact discrepancies and source-paired 15 30 60
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_cisd_381_discrepancy_forensic_v1 matrix market-inputs nine-market-output
      - name: Require original 2876 unique IDs, 381 unresolved, no live decisions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("nine-market-output/scalper-cisd-381-nine-market.json").read_text())
          assert x["sources"]==2876 and x["total_mismatches"]==381
          assert x["matched_sources"]==2495
          assert x["trades_reexecuted"]==0
          assert x["authorizes_early_entries"] is False
          assert x["uses_future_outcomes_for_admission"] is False
          assert x["cognitive_master_frame_evaluated"] is False
          print("NINTH CISD CLASSIFICATION",x["type_counts"])
          print("NINTH CISD PAIRED ALL",x["paired_all_discrepancies"])
          for d in ("by_type","by_original_family","by_market"):
              for name,part in x[d].items():
                  print("NINTH CISD BREAKDOWN",d,name,part)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-ninth-cisd-nine-market-${{ github.sha }}
          path: nine-market-output/
          retention-days: 90
          if-no-files-found: error
