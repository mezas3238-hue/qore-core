name: cTrader SDK Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ctrader-sdk-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cTrader optional runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ctrader]"
      - name: Verify SDK contract surface
        run: |
          python - <<'PY'
          import importlib.metadata
          import runpy

          from ctrader_open_api import EndPoints
          from ctrader_open_api.messages.OpenApiMessages_pb2 import (
              ProtoOAAccountAuthReq,
              ProtoOAAccountAuthRes,
              ProtoOAApplicationAuthReq,
              ProtoOAApplicationAuthRes,
              ProtoOAErrorRes,
              ProtoOAGetAccountListByAccessTokenReq,
              ProtoOAGetAccountListByAccessTokenRes,
              ProtoOAGetTrendbarsReq,
              ProtoOAGetTrendbarsRes,
              ProtoOASymbolByIdReq,
              ProtoOASymbolByIdRes,
              ProtoOASymbolsListReq,
              ProtoOASymbolsListRes,
          )
          from ctrader_open_api.messages.OpenApiModelMessages_pb2 import (
              ProtoOATrendbar,
              ProtoOATrendbarPeriod,
          )

          def require_fields(descriptor, *field_names):
              actual = descriptor.fields_by_name
              missing = tuple(name for name in field_names if name not in actual)
              assert not missing, (missing, sorted(actual))
              return actual

          assert importlib.metadata.version("ctrader-open-api") == "0.9.2"
          assert importlib.metadata.version("service-identity") == "24.2.0"
          assert EndPoints.PROTOBUF_DEMO_HOST == "demo.ctraderapi.com"
          assert EndPoints.PROTOBUF_PORT == 5035
          assert ProtoOATrendbarPeriod.Value("M5") == 5

          for message_type in (
              ProtoOAAccountAuthReq,
              ProtoOAAccountAuthRes,
              ProtoOAApplicationAuthReq,
              ProtoOAApplicationAuthRes,
              ProtoOAErrorRes,
              ProtoOAGetAccountListByAccessTokenReq,
              ProtoOAGetAccountListByAccessTokenRes,
              ProtoOAGetTrendbarsReq,
              ProtoOAGetTrendbarsRes,
              ProtoOASymbolByIdReq,
              ProtoOASymbolByIdRes,
              ProtoOASymbolsListReq,
              ProtoOASymbolsListRes,
          ):
              message_type()

          require_fields(
              ProtoOAApplicationAuthReq.DESCRIPTOR,
              "clientId",
              "clientSecret",
          )
          require_fields(
              ProtoOAGetAccountListByAccessTokenReq.DESCRIPTOR,
              "accessToken",
          )
          account_list_fields = require_fields(
              ProtoOAGetAccountListByAccessTokenRes.DESCRIPTOR,
              "permissionScope",
              "ctidTraderAccount",
          )
          account_fields = account_list_fields["ctidTraderAccount"].message_type.fields_by_name
          for field_name in ("ctidTraderAccountId", "isLive"):
              assert field_name in account_fields, (field_name, sorted(account_fields))

          require_fields(
              ProtoOAAccountAuthReq.DESCRIPTOR,
              "ctidTraderAccountId",
              "accessToken",
          )
          require_fields(
              ProtoOAAccountAuthRes.DESCRIPTOR,
              "ctidTraderAccountId",
          )

          require_fields(
              ProtoOASymbolsListReq.DESCRIPTOR,
              "ctidTraderAccountId",
              "includeArchivedSymbols",
          )
          symbols_list_fields = require_fields(
              ProtoOASymbolsListRes.DESCRIPTOR,
              "ctidTraderAccountId",
              "symbol",
          )
          light_symbol_fields = symbols_list_fields["symbol"].message_type.fields_by_name
          for field_name in ("symbolId", "symbolName", "enabled"):
              assert field_name in light_symbol_fields, (
                  field_name,
                  sorted(light_symbol_fields),
              )

          require_fields(
              ProtoOASymbolByIdReq.DESCRIPTOR,
              "ctidTraderAccountId",
              "symbolId",
          )
          symbol_by_id_fields = require_fields(
              ProtoOASymbolByIdRes.DESCRIPTOR,
              "ctidTraderAccountId",
              "symbol",
          )
          full_symbol_fields = symbol_by_id_fields["symbol"].message_type.fields_by_name
          for field_name in ("symbolId", "digits"):
              assert field_name in full_symbol_fields, (
                  field_name,
                  sorted(full_symbol_fields),
              )

          require_fields(
              ProtoOAGetTrendbarsReq.DESCRIPTOR,
              "ctidTraderAccountId",
              "period",
              "symbolId",
              "fromTimestamp",
              "toTimestamp",
              "count",
          )
          trendbar_response_fields = require_fields(
              ProtoOAGetTrendbarsRes.DESCRIPTOR,
              "ctidTraderAccountId",
              "period",
              "trendbar",
              "symbolId",
          )
          assert "hasMore" not in trendbar_response_fields, sorted(
              trendbar_response_fields
          )

          trendbar_fields = ProtoOATrendbar.DESCRIPTOR.fields_by_name
          for field_name in (
              "low",
              "deltaOpen",
              "deltaClose",
              "deltaHigh",
              "utcTimestampInMinutes",
          ):
              assert field_name in trendbar_fields, (
                  field_name,
                  sorted(trendbar_fields),
              )

          module = runpy.run_path(
              "scripts/ctrader_demo_m5_probe.py",
              run_name="ctrader_probe_smoke",
          )
          credentials_type = module["RuntimeCredentials"]
          credentials = credentials_type(
              client_id="fake-client-id",
              client_secret="fake-client-secret",
              access_token="fake-access-token",
          )
          credential_repr = repr(credentials)
          assert "fake-client-secret" not in credential_repr
          assert "fake-access-token" not in credential_repr
          assert "<redacted>" in credential_repr

          wire_failure = module["_wire_failure"]("synthetic-failure")
          assert "synthetic-failure" in wire_failure
          assert "fake-client-secret" not in wire_failure
          assert "fake-access-token" not in wire_failure
          PY
