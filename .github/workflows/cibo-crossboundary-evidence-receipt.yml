name: QORE CIBO Cross-Boundary Evidence Receipt

on:
  pull_request:
    paths:
      - 'src/qore/infrastructure/cibo_crossboundary_evidence_receipt.py'
      - 'src/qore/infrastructure/cibo_receipt_bound_final_integrated_exam.py'
      - 'src/qore/infrastructure/cibo_usd60_prerequisite_receipts.py'
      - 'src/qore/infrastructure/cibo_ce2i_calibration_freeze_manifest.py'
      - 'src/qore/infrastructure/cibo_receipt_bound_calibration_freeze.py'
      - 'src/qore/infrastructure/cibo_receipt_bound_pre_holdout.py'
      - 'tests/infrastructure/test_cibo_crossboundary_evidence_receipt.py'
      - 'tests/infrastructure/test_cibo_receipt_bound_final_integrated_exam.py'
      - 'tests/infrastructure/test_cibo_usd60_prerequisite_receipts.py'
      - 'tests/infrastructure/test_cibo_ce2i_calibration_freeze_manifest.py'
      - 'tests/infrastructure/test_cibo_receipt_bound_calibration_freeze.py'
      - 'tests/infrastructure/test_cibo_receipt_bound_pre_holdout.py'
      - '.github/workflows/cibo-crossboundary-evidence-receipt.yml'
  push:
    paths:
      - 'src/qore/infrastructure/cibo_crossboundary_evidence_receipt.py'
      - 'src/qore/infrastructure/cibo_receipt_bound_final_integrated_exam.py'
      - 'src/qore/infrastructure/cibo_usd60_prerequisite_receipts.py'
      - 'src/qore/infrastructure/cibo_ce2i_calibration_freeze_manifest.py'
      - 'src/qore/infrastructure/cibo_receipt_bound_calibration_freeze.py'
      - 'src/qore/infrastructure/cibo_receipt_bound_pre_holdout.py'
      - 'tests/infrastructure/test_cibo_crossboundary_evidence_receipt.py'
      - 'tests/infrastructure/test_cibo_receipt_bound_final_integrated_exam.py'
      - 'tests/infrastructure/test_cibo_usd60_prerequisite_receipts.py'
      - 'tests/infrastructure/test_cibo_ce2i_calibration_freeze_manifest.py'
      - 'tests/infrastructure/test_cibo_receipt_bound_calibration_freeze.py'
      - 'tests/infrastructure/test_cibo_receipt_bound_pre_holdout.py'
      - '.github/workflows/cibo-crossboundary-evidence-receipt.yml'

jobs:
  crossboundary-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Cross-boundary receipt quality
        run: |
          ruff check \
            src/qore/infrastructure/cibo_crossboundary_evidence_receipt.py \
            src/qore/infrastructure/cibo_receipt_bound_final_integrated_exam.py \
            src/qore/infrastructure/cibo_usd60_prerequisite_receipts.py \
            src/qore/infrastructure/cibo_ce2i_calibration_freeze_manifest.py \
            src/qore/infrastructure/cibo_receipt_bound_calibration_freeze.py \
            src/qore/infrastructure/cibo_receipt_bound_pre_holdout.py \
            tests/infrastructure/test_cibo_crossboundary_evidence_receipt.py \
            tests/infrastructure/test_cibo_receipt_bound_final_integrated_exam.py \
            tests/infrastructure/test_cibo_usd60_prerequisite_receipts.py \
            tests/infrastructure/test_cibo_ce2i_calibration_freeze_manifest.py \
            tests/infrastructure/test_cibo_receipt_bound_calibration_freeze.py \
            tests/infrastructure/test_cibo_receipt_bound_pre_holdout.py
          mypy \
            src/qore/infrastructure/cibo_crossboundary_evidence_receipt.py \
            src/qore/infrastructure/cibo_receipt_bound_final_integrated_exam.py \
            src/qore/infrastructure/cibo_usd60_prerequisite_receipts.py \
            src/qore/infrastructure/cibo_ce2i_calibration_freeze_manifest.py \
            src/qore/infrastructure/cibo_receipt_bound_calibration_freeze.py \
            src/qore/infrastructure/cibo_receipt_bound_pre_holdout.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_crossboundary_evidence_receipt.py \
            tests/infrastructure/test_cibo_receipt_bound_final_integrated_exam.py \
            tests/infrastructure/test_cibo_usd60_prerequisite_receipts.py \
            tests/infrastructure/test_cibo_ce2i_calibration_freeze_manifest.py \
            tests/infrastructure/test_cibo_receipt_bound_calibration_freeze.py \
            tests/infrastructure/test_cibo_receipt_bound_pre_holdout.py
