name: QORE VT-31 Full Consumed Tick Acquisition

on:
  push:
    branches:
      - agent/vt31-historical-tick-resolution-001
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN }}
  QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID }}
  GH_TOKEN: ${{ github.token }}

jobs:
  acquire-consumed-ticks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[ctrader]"
          python -m py_compile scripts/vt31_historical_tick_probe.py
          python -m py_compile scripts/vt31_historical_tick_batch_acquisition.py
      - name: Recover immutable 437-window consumed manifest
        run: |
          set -euo pipefail
          mkdir -p source-manifest
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10425626147/zip" > source-manifest.zip
          unzip -q source-manifest.zip -d source-manifest
          test "$(cat source-manifest/git-sha.txt)" = "493825d2b14946a6ddffe36f6c472fa5d0c3187e"
          (cd source-manifest && sha256sum -c SHA256SUMS)
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('source-manifest/vt31-historical-tick-windows.json').read_text())
          assert p['research_only'] is True
          assert p['opens_new_holdout'] is False
          assert len(p['windows']) == 437
          assert p['counts']['r5']['total'] == 157
          assert p['counts']['r6']['total'] == 159
          assert p['counts']['r8_fresh']['total'] == 121
          PY
      - name: Verify cTrader historical-data credentials without printing values
        run: |
          set -euo pipefail
          for name in QORE_CTRADER_CLIENT_ID QORE_CTRADER_CLIENT_SECRET QORE_CTRADER_ACCESS_TOKEN QORE_CTRADER_REFRESH_TOKEN; do
            test -n "${!name:-}"
          done
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            test -n "$account_id"
            echo "::add-mask::$account_id"
            echo "QORE_CTRADER_DEMO_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          fi
      - name: Acquire BID ASK evidence for all 437 consumed windows
        run: |
          set -euo pipefail
          python scripts/vt31_historical_tick_batch_acquisition.py \
            --manifest source-manifest/vt31-historical-tick-windows.json \
            --output-dir acquisition
      - name: Validate acquisition inventory without imputing failures
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('acquisition/vt31-historical-tick-acquisition-summary.json').read_text())
          assert p['research_only'] is True
          assert p['opens_new_holdout'] is False
          assert p['candidate_status'] == 'NO_R9_NOT_CERTIFIED'
          assert p['source_window_count'] == 437
          classified=sum(p[k] for k in ('available','partial','empty','probe_failure','binding_mismatch'))
          assert classified == 437
          assert len(p['results']) == 437
          print(json.dumps({k:p[k] for k in ('available','partial','empty','probe_failure','binding_mismatch')}, sort_keys=True))
          PY
      - name: Bind deterministic acquisition artifact
        run: |
          set -euo pipefail
          echo "$GITHUB_SHA" > acquisition/git-sha.txt
          echo "10425626147" > acquisition/source-manifest-artifact-id.txt
          find acquisition -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > acquisition/SHA256SUMS
          (cd acquisition && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt31-consumed-historical-ticks-${{ github.sha }}
          path: |
            acquisition/
            source-manifest/vt31-historical-tick-window-summary.json
          retention-days: 90
