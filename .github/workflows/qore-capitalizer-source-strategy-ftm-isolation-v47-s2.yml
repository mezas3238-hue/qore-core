name: QORE Capitalizer Source Strategy FTM Isolation V47 S2

on:
  push:
    branches:
      - agent/capitalizer-canonical-source-remediation-v47-s2-001
    paths:
      - '.github/workflows/qore-capitalizer-source-strategy-ftm-isolation-v47-s2.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_source_strategy_ftm_isolation_v47_s2.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_ftm_raw_population_v47_s1r_c.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_source_strategy_ftm_isolation_v47_s2.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-source-strategy-ftm-isolation-v47-s2-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
  QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,ctrader]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_ftm_raw_population_v47_s1r_c.py \
            src/qore/infrastructure/trader_lab/capitalizer_source_strategy_ftm_isolation_v47_s2.py \
            tests/infrastructure/trader_lab/test_capitalizer_source_strategy_ftm_isolation_v47_s2.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_ftm_raw_population_v47_s1r_c.py \
            src/qore/infrastructure/trader_lab/capitalizer_source_strategy_ftm_isolation_v47_s2.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_source_strategy_ftm_isolation_v47_s2.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {symbol: USDJPY, session: ASIA}
          - {symbol: AUDJPY, session: ASIA}
          - {symbol: AUDUSD, session: ASIA}
          - {symbol: GBPJPY, session: ASIA}
          - {symbol: EURUSD, session: LONDON}
          - {symbol: GBPUSD, session: LONDON}
          - {symbol: XAUUSD, session: NEW_YORK}
          - {symbol: USDCAD, session: NEW_YORK}
          - {symbol: NAS100, session: NEW_YORK}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[ctrader]'
      - name: Verify read-only cTrader inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in QORE_CTRADER_CLIENT_ID QORE_CTRADER_CLIENT_SECRET QORE_CTRADER_ACCESS_TOKEN QORE_CTRADER_REFRESH_TOKEN; do
            test -n "${!name:-}" || { echo "missing required read-only DEMO input: $name" >&2; exit 2; }
          done
      - name: Discover DEMO account when not configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            if ! [[ "$account_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "cTrader DEMO account discovery returned invalid id" >&2
              exit 3
            fi
            echo "::add-mask::$account_id"
            printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          fi
      - name: Download immutable provider-native 10Y M1
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Build separate FTM exact-fill population
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_source_strategy_ftm_isolation_v47_s2 \
            market m1-source \
            --symbol "${{ matrix.symbol }}" \
            --session "${{ matrix.session }}" \
            --output ftm-output
      - name: Enforce FTM market governance
        env:
          SYMBOL: ${{ matrix.symbol }}
          SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          reports=sorted(Path("ftm-output").glob("capitalizer-ftm-s2-*-report.json"))
          assert len(reports) == 3
          for path in reports:
              row=json.loads(path.read_text())
              assert row["identity"] == "QORE_CAPITALIZER_SOURCE_STRATEGY_FTM_ISOLATION_V47_S2"
              assert row["symbol"] == os.environ["SYMBOL"]
              assert row["session"] == os.environ["SESSION"]
              assert row["raw_sweeps"] >= row["continuation_first"]
              assert row["continuation_first"] >= row["continuation_binding"]
              assert row["continuation_binding"] >= row["continuation_m3"]
              assert row["continuation_m3"] >= row["continuation_m3_fvg"]
              assert row["continuation_m3_fvg"] >= row["independent_m1"]
              assert row["independent_m1"] >= row["unambiguous_target"]
              assert row["unambiguous_target"] >= row["routed_ftm"]
              assert row["terminal_outcome_read"] is False
              assert row["economics_calculated"] is False
              assert row["fresh_holdout_opened"] is False
              assert row["trader_certified"] is False

          for path in sorted(Path("ftm-output").glob("capitalizer-ftm-s2-*-fills.jsonl")):
              for line in path.read_text().splitlines():
                  if not line.strip():
                      continue
                  row=json.loads(line)
                  assert row["route"] == "FAILURE_TO_MANIPULATE_CONTINUATION"
                  assert row["exact_provider_tick_fill"] is True
                  assert row["official_v46_adapter_passed"] is True
                  assert row["outcome_used_for_selection"] is False
                  assert row["terminal_outcome_read"] is False
                  assert row["realized_r_read"] is False
                  assert row["fresh_holdout_opened"] is False
                  assert row["trader_certified"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v47-s2-ftm-${{ matrix.symbol }}-${{ github.sha }}
          path: ftm-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v47-s2-ftm-*-${{ github.sha }}
          path: ftm-markets
          merge-multiple: true
      - name: Aggregate FTM exact-fill population
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_source_strategy_ftm_isolation_v47_s2 \
            aggregate ftm-markets \
            --output ftm-aggregate
      - name: Enforce FTM aggregate governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          row=json.loads(
              Path("ftm-aggregate/capitalizer-ftm-s2-aggregate.json").read_text()
          )
          assert row["identity"] == "QORE_CAPITALIZER_SOURCE_STRATEGY_FTM_ISOLATION_V47_S2"
          assert row["predeclaration_comment_id"] == 5901844217
          assert row["market_count"] == 9
          assert row["market_period_reports"] == 27
          assert row["terminal_outcome_read"] is False
          assert row["economics_calculated"] is False
          assert row["fresh_holdout_opened"] is False
          assert row["trader_certified"] is False
          total=sum(v["admitted_exact_fills"] for v in row["periods"].values())
          assert row["funnel"]["admitted_exact_fills"] == total
          if total:
              assert row["next_phase"] == (
                  "FTM_EXACT_FILL_POPULATION_READY_FOR_COMBINED_RECOMPETITION"
              )
          else:
              assert row["next_phase"] == (
                  "FTM_ZERO_ADMITTED_POPULATION_REQUIRES_ROOT_CAUSE"
              )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v47-s2-ftm-aggregate-${{ github.sha }}
          path: ftm-aggregate
          if-no-files-found: error
          retention-days: 90
