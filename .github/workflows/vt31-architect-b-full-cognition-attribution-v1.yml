name: QORE VT31 Architect B Full Cognition Attribution V1
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  push:
    branches:
      - agent/vt31-edge-position-cert-b-001
    paths:
      - scripts/vt31_nas100_full_cognition_attribution_v1.py
      - src/qore/infrastructure/traders/vt31_nas100_position_intelligence.py
      - src/qore/infrastructure/traders/vt31_nas100_reasoning_engine.py
      - src/qore/infrastructure/traders/vt31_nas100_situation_model.py
      - scripts/vt31_nas100_specialist_r1_candidate.py
      - tests/infrastructure/test_vt31_nas100_position_intelligence.py
      - tests/infrastructure/test_vt31_nas100_cognitive_reasoning.py
      - .github/workflows/vt31-architect-b-full-cognition-attribution-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  attribute:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Static and focused cognition gates
        run: |
          set -euo pipefail
          ruff check             scripts/vt31_nas100_full_cognition_attribution_v1.py             scripts/vt31_nas100_specialist_r1_candidate.py             src/qore/infrastructure/traders/vt31_nas100_position_intelligence.py             src/qore/infrastructure/traders/vt31_nas100_reasoning_engine.py             src/qore/infrastructure/traders/vt31_nas100_situation_model.py             tests/infrastructure/test_vt31_nas100_position_intelligence.py             tests/infrastructure/test_vt31_nas100_cognitive_reasoning.py
          pytest -q -o addopts=''             tests/infrastructure/test_vt31_nas100_position_intelligence.py             tests/infrastructure/test_vt31_nas100_cognitive_reasoning.py

      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"

      - name: Run full cognition attribution
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python             scripts/vt31_nas100_full_cognition_attribution_v1.py             "input/${EVIDENCE_PATH}"             --output "result/full-cognition-${PARTITION}.json"             | tee "result/summary-${PARTITION}.json"

      - name: Governance gate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = os.environ["PARTITION"]
          payload = json.loads(
              Path(f"result/full-cognition-{p}.json").read_text()
          )
          g = payload["governance"]
          assert g["consumed_evidence_only"] is True
          assert g["trade_admission_changed"] is False
          assert g["entry_filtering_by_cognition"] is False
          assert g["position_policy_changed"] is False
          assert g["normalized_equal_r_economics"] is True
          assert g["capital_weighted_net_r_used"] is False
          assert g["position_sizing_used"] is False
          assert g["leverage_used"] is False
          assert g["compounding_used"] is False
          assert g["absolute_volume_used"] is False
          assert g["provider_volume_rule_used"] is False
          assert g["terminal_pnl_used_for_runtime_decision"] is False
          assert g["future_journey_label_used"] is False
          assert g["r_runtime_strategy_allowed"] is True
          assert g["maximum_intelligence_required"] is True
          assert g["opens_new_holdout"] is False
          assert g["policy_promoted"] is False

          intelligence = payload["maximum_intelligence"]
          assert intelligence["required_for_candidate_freeze"] is True
          assert intelligence["terminal_trade_count"] >= 0
          if intelligence["candidate_freeze_allowed"]:
              assert intelligence["ready_trade_count"] == intelligence["terminal_trade_count"]
              assert intelligence["blocker_counts"] == {}
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: vt31-architect-b-full-cognition-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 30
