name: QORE VT31 NAS100 Loss Sequence Root Cause V1

on:
  push:
    branches:
      - agent/vt31-nas100-intelligence-pilot-001
    paths:
      - scripts/vt31_nas100_r5_loss_sequence_root_cause_forensics_v1.py
      - .github/workflows/vt31-nas100-r5-loss-sequence-root-cause-v1.yml
  pull_request:
    paths:
      - scripts/vt31_nas100_r5_loss_sequence_root_cause_forensics_v1.py
      - .github/workflows/vt31-nas100-r5-loss-sequence-root-cause-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed_holdout
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Static gate
        run: |
          set -euo pipefail
          python -m py_compile             scripts/vt31_nas100_r5_loss_sequence_root_cause_forensics_v1.py
          ruff check             scripts/vt31_nas100_r5_loss_sequence_root_cause_forensics_v1.py

      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"

      - name: Run loss-sequence root-cause forensics
        run: |
          set -euo pipefail
          python scripts/vt31_nas100_r5_loss_sequence_root_cause_forensics_v1.py             "input/${EVIDENCE_PATH}"             --partition "$PARTITION"             --output "result/loss-sequence-${PARTITION}.json"             | tee "result/summary-${PARTITION}.json"

      - name: Governance gate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          partition = os.environ["PARTITION"]
          path = Path(f"result/loss-sequence-{partition}.json")
          payload = json.loads(path.read_text())
          assert payload["allocation_profile"] == "ALLOC_G_CORE_FAMILY_050"
          g = payload["governance"]
          assert g["consumed_evidence_only"] is True
          assert g["diagnostic_only"] is True
          assert g["post_outcome_fields_diagnostic_only"] is True
          assert g["decision_time_context_separated_from_outcome_labels"] is True
          assert g["trade_authorization_changed"] is False
          assert g["entry_changed"] is False
          assert g["stop_changed"] is False
          assert g["target_changed"] is False
          assert g["allocation_profile_changed"] is False
          assert g["uses_terminal_pnl_at_runtime"] is False
          assert g["uses_fold_identity_at_runtime"] is False
          assert g["uses_calendar_time_at_runtime"] is False
          assert g["opens_new_holdout"] is False
          assert g["policy_promoted"] is False
          assert g["candidate_certified"] is False
          assert g["live_authorized"] is False
          assert g["production_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-loss-sequence-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-nas100-loss-sequence-*-${{ github.sha }}
          path: input
          merge-multiple: true

      - name: Aggregate root-cause evidence
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          folds = {}
          for path in Path("input").glob("loss-sequence-*.json"):
              payload = json.loads(path.read_text())
              folds[payload["partition"]] = payload
          assert set(folds) == {"r5", "r6", "r8", "consumed_holdout"}

          fold_names = ("r5", "r6", "r8", "consumed_holdout")
          features = {
              fold: payload["overall"]["feature_diagnostics"]
              for fold, payload in folds.items()
          }
          common = set.intersection(
              *(set(features[fold]) for fold in fold_names)
          )
          global_severe = {
              fold: Decimal(
                  folds[fold]["overall"]["streak_summary"][
                      "severe_streak_loss_share"
                  ]
              )
              for fold in fold_names
          }

          stable_negative = []
          stable_streak_amplifiers = []
          consumed_specific = []
          regime_inversions = []

          for key in sorted(common):
              per_fold = {fold: features[fold][key] for fold in fold_names}
              if all(int(per_fold[fold]["sample"]) >= 10 for fold in fold_names):
                  means = {
                      fold: Decimal(per_fold[fold]["mean_r"])
                      for fold in fold_names
                  }
                  severe_share = {
                      fold: Decimal(
                          per_fold[fold]["severe_streak_loss_share"]
                      )
                      for fold in fold_names
                  }
                  excess = {
                      fold: severe_share[fold] - global_severe[fold]
                      for fold in fold_names
                  }

                  if all(means[fold] < 0 for fold in fold_names):
                      stable_negative.append(
                          {
                              "state": key,
                              "per_fold": per_fold,
                          }
                      )

                  positive_excess = sum(
                      excess[fold] > 0 for fold in fold_names
                  )
                  if positive_excess >= 3:
                      stable_streak_amplifiers.append(
                          {
                              "state": key,
                              "positive_excess_folds": positive_excess,
                              "severe_streak_share_excess": {
                                  fold: format(excess[fold], "f")
                                  for fold in fold_names
                              },
                              "per_fold": per_fold,
                          }
                      )

                  consumed = per_fold["consumed_holdout"]
                  consumed_excess = excess["consumed_holdout"]
                  if (
                      Decimal(consumed["mean_r"]) < 0
                      and consumed_excess >= Decimal("0.10")
                  ):
                      consumed_specific.append(
                          {
                              "state": key,
                              "consumed_severe_share_excess": format(
                                  consumed_excess,
                                  "f",
                              ),
                              "per_fold": per_fold,
                          }
                      )

                  dev_positive = sum(
                      means[fold] > 0 for fold in ("r5", "r6", "r8")
                  )
                  if dev_positive >= 2 and means["consumed_holdout"] < 0:
                      regime_inversions.append(
                          {
                              "state": key,
                              "development_positive_folds": dev_positive,
                              "per_fold": per_fold,
                          }
                      )

          def rank_excess(item):
              values = [
                  Decimal(value)
                  for value in item[
                      "severe_streak_share_excess"
                  ].values()
              ]
              return sum(values, Decimal(0)) / Decimal(len(values))

          stable_streak_amplifiers.sort(
              key=rank_excess,
              reverse=True,
          )
          consumed_specific.sort(
              key=lambda item: Decimal(
                  item["consumed_severe_share_excess"]
              ),
              reverse=True,
          )

          report = {
              "schema": (
                  "qore.vt31.nas100.r5.loss_sequence_root_cause."
                  "aggregate.v1"
              ),
              "longest_losing_streak_by_fold": {
                  fold: folds[fold]["overall"]["streak_summary"][
                      "longest_losing_streak"
                  ]
                  for fold in fold_names
              },
              "loss_anatomy_by_fold": {
                  fold: folds[fold]["overall"]["loss_anatomy"]
                  for fold in fold_names
              },
              "onset_transitions_by_fold": {
                  fold: folds[fold]["overall"]["onset_transitions"]
                  for fold in fold_names
              },
              "consumed_blocks": folds["consumed_holdout"][
                  "consumed_blocks"
              ],
              "stable_negative_contexts": stable_negative,
              "stable_streak_amplifiers": stable_streak_amplifiers[:40],
              "consumed_specific_streak_amplifiers": consumed_specific[:40],
              "regime_inversions": regime_inversions[:40],
              "governance": {
                  "diagnostic_only": True,
                  "policy_promoted": False,
                  "opens_new_holdout": False,
                  "candidate_certified": False,
              },
          }
          Path("result/aggregate.json").write_text(
              json.dumps(report, sort_keys=True, indent=2) + "\n"
          )
          print(json.dumps(report, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-loss-sequence-aggregate-${{ github.sha }}
          path: result/
          retention-days: 90
