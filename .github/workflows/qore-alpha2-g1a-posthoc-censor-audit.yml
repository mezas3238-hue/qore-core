name: QORE Alpha2 G1A posthoc 48-exclusion anatomy (no new prices)
on:
  push:
    branches: ['research/qore-alpha2-original-intermarket-propagation-20261012']
    paths:
      - '.github/workflows/qore-alpha2-g1a-posthoc-censor-audit.yml'
      - 'src/qore/research/alpha2_g1a_posthoc_anatomy.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  one_signed_report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . 'ruff>=0.5,<1'
      - run: ruff check src/qore/research/alpha2_g1a_posthoc_anatomy.py
      - uses: actions/download-artifact@v4
        with:
          name: alpha2-g1a-paired-gross-panel-b406be34e16e61b7b4c042f31f95cf38a45f4e07
          run-id: '38270999595'
          github-token: ${{ github.token }}
          path: signed-original-result
      - run: |
          python -m qore.research.alpha2_g1a_posthoc_anatomy signed-original-result final-anatomy
          printf '%s\n' "$GITHUB_SHA" > final-anatomy/exact-anatomy-code-head-sha.txt
          (cd final-anatomy && sha256sum alpha2-g1a-posthoc-anatomy.json exact-anatomy-code-head-sha.txt > OUTPUT_SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: alpha2-g1a-censor-posthoc-${{ github.sha }}
          path: final-anatomy/
          retention-days: 90
          if-no-files-found: error
