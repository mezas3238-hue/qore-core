name: QORE CIBO AS-IS Economic Baseline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-as-is-economic-baseline.yml'
      - 'src/qore/infrastructure/cibo_as_is_economic_baseline.py'
      - 'tests/infrastructure/test_cibo_as_is_economic_baseline.py'
      - 'docs/research/CIBO-AS-IS-ECONOMIC-BASELINE-BINDING-PLAN-V1.md'
      - 'docs/research/CIBO-AS-IS-ECONOMIC-BASELINE-MATERIALIZATION-V1.md'
      - 'src/qore/infrastructure/cibo_compound_real_population_binding.py'
  push:
    branches:
      - agent/cibo-certification-architect-a-science-001
    paths:
      - '.github/workflows/cibo-as-is-economic-baseline.yml'
      - 'src/qore/infrastructure/cibo_as_is_economic_baseline.py'
      - 'tests/infrastructure/test_cibo_as_is_economic_baseline.py'
      - 'docs/research/CIBO-AS-IS-ECONOMIC-BASELINE-BINDING-PLAN-V1.md'
      - 'docs/research/CIBO-AS-IS-ECONOMIC-BASELINE-MATERIALIZATION-V1.md'
      - 'src/qore/infrastructure/cibo_compound_real_population_binding.py'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  as-is-economic-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: AS-IS economic baseline quality
        run: |
          ruff check \
            src/qore/infrastructure/cibo_as_is_economic_baseline.py \
            tests/infrastructure/test_cibo_as_is_economic_baseline.py
          python -m py_compile \
            src/qore/infrastructure/cibo_as_is_economic_baseline.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_as_is_economic_baseline.py
