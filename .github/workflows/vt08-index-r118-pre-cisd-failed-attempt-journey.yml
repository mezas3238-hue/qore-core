name: VT08 Index R118 Pre CISD Failed Attempt Journey

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r118-pre-cisd-failed-attempt-journey.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r118_pre_cisd_failed_attempt_journey.py
      - tests/infrastructure/trader_lab/test_vt08_index_r118_pre_cisd_failed_attempt_journey.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r118_pre_cisd_failed_attempt_journey.py

  attribution:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R118 pre-CISD failed-attempt journey attribution
        run: |
          mkdir -p artifacts/report
          python -m qore.infrastructure.trader_lab.vt08_index_r118_pre_cisd_failed_attempt_journey \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r118-pre-cisd-failed-attempt-journey.json

      - name: Verify R118 frozen attribution contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r118-pre-cisd-failed-attempt-journey.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R118_PRE_CISD_FAILED_ATTEMPT_JOURNEY_ATTRIBUTION_001"
          )
          assert report["source_r117"]["run_id"] == 35666961998
          assert report["source_r117"]["artifact_id"] == 10668719511
          assert report["source_r117"]["artifact_digest"] == (
              "sha256:966a40d7fb9ff2ae11a48a2de1a83b5dcec59d1f6a804da1f64f8139ad6bd984"
          )
          expected = {
              "five_year": 1756,
              "recent_two_year": 746,
              "r66_failed_holdout": 546,
          }
          for key, sample in expected.items():
              section = report[key]
              assert section["sample"] == sample
              assert section["expected_sample"] == sample
              assert sum(
                  int(row["sample"])
                  for row in section["by_failed_attempt_bucket"].values()
              ) == sample
              assert sum(
                  int(row["sample"])
                  for row in section["by_prior_extreme_relation"].values()
              ) == sample
              assert section["prior_deeper_than_final_ps_count"] <= (
                  section["failed_attempt_present_count"]
              )

          reset = report["reset_semantics_under_audit"]
          assert reset["implementation_reference"] == "V6._first_cisd"
          assert reset["failed_series_is_discarded"] is True
          assert reset["later_series_can_confirm_new_cisd"] is True
          assert reset["classification_cutoff"] == "CANONICAL_CISD_CONFIRMATION"
          assert reset["numeric_price_threshold_used"] is False
          assert reset["outcome_used_for_classification"] is False
          assert reset["calendar_or_year_used_for_classification"] is False

          contract = report["preregistered_contract"]
          assert contract["rule_change"] is False
          assert contract["standard_only"] is True
          assert contract["same_r102_fixed_weights"] is True
          assert contract["signals_suppressed"] is False
          assert contract["trade_count_changed"] is False
          assert contract["entry_changed"] is False
          assert contract["stop_changed"] is False
          assert contract["target_changed"] is False
          assert contract["runtime_filter_created"] is False
          assert contract["candidate_created"] is False

          gov = report["governance"]
          assert gov["research_only"] is True
          assert gov["candidate_created"] is False
          assert gov["signals_suppressed"] is False
          assert gov["trade_count_changed"] is False
          assert gov["target_changed"] is False
          assert gov["stop_changed"] is False
          assert gov["risk_allocator_changed"] is False
          assert gov["runtime_filter_created"] is False
          assert gov["anchor_14_enabled"] is False
          assert gov["live_authorized"] is False
          assert gov["real_capital_authorized"] is False
          assert gov["production_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r118-pre-cisd-failed-attempt-journey-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
