name: VT08 Index R112 Same M15 Ambiguity Census\n\non:\n  push:\n    branches: [agent/vt08-index-deep-behavior-lab-final]\n    paths:\n      - .github/workflows/vt08-index-r112-same-m15-ambiguity-census.yml\n      - src/qore/infrastructure/trader_lab/vt08_index_r112_same_m15_ambiguity_census.py\n      - tests/infrastructure/trader_lab/test_vt08_index_r112_same_m15_ambiguity_census.py\n\npermissions:\n  actions: read\n  contents: read\n\njobs:\n  quality:\n    runs-on: ubuntu-latest\n    timeout-minutes: 120\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: "3.12"\n      - run: pip install -e ".[dev]"\n      - run: ruff check .\n      - run: mypy src tests\n      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r112_same_m15_ambiguity_census.py\n\n  census:\n    needs: quality\n    runs-on: ubuntu-latest\n    timeout-minutes: 300\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: "3.12"\n      - run: pip install -e ".[dev]"\n\n      - name: Download NAS100 CIBO evidence\n        uses: actions/download-artifact@v4\n        with:\n          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d\n          path: artifacts/NAS100\n          github-token: ${{ secrets.GITHUB_TOKEN }}\n          repository: ${{ github.repository }}\n          run-id: 35166210458\n\n      - name: Download SP500 CIBO evidence\n        uses: actions/download-artifact@v4\n        with:\n          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d\n          path: artifacts/SP500\n          github-token: ${{ secrets.GITHUB_TOKEN }}\n          repository: ${{ github.repository }}\n          run-id: 35166210458\n\n      - name: Download US30 CIBO evidence\n        uses: actions/download-artifact@v4\n        with:\n          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d\n          path: artifacts/US30\n          github-token: ${{ secrets.GITHUB_TOKEN }}\n          repository: ${{ github.repository }}\n          run-id: 35166210458\n\n      - name: Execute R112 same-M15 ambiguity census\n        run: |\n          mkdir -p artifacts/report\n          python -m qore.infrastructure.trader_lab.vt08_index_r112_same_m15_ambiguity_census \\n            --nas100-root artifacts/NAS100 \\n            --sp500-root artifacts/SP500 \\n            --us30-root artifacts/US30 \\n            --out artifacts/report/vt08-index-r112-same-m15-ambiguity-census.json\n\n      - name: Verify R112 governance and frozen surface\n        run: |\n          python - <<'PY'\n          import json\n          from pathlib import Path\n\n          report = json.loads(\n              Path(\n                  "artifacts/report/vt08-index-r112-same-m15-ambiguity-census.json"\n              ).read_text()\n          )\n          assert report["identity"] == (\n              "VT08_INDEX_R112_STANDARD_SAME_M15_AMBIGUITY_CENSUS_001"\n          )\n          assert report["source_r111"]["run_id"] == 35661275019\n          assert report["source_r111"]["artifact_id"] == 10666554085\n          assert report["source_r111"]["artifact_digest"] == (\n              "sha256:f80a38fa197f005ec50f16d7f05ac640e19d86d9aad30c501c5ca45959850ed4"\n          )\n\n          expected = {\n              "five_year": 1756,\n              "recent_two_year": 746,\n              "r66_failed_holdout": 546,\n          }\n          for key, sample in expected.items():\n              section = report[key]\n              assert section["sample"] == sample\n              assert section["expected_sample"] == sample\n              assert section["ambiguity"]["target_first_is_upper_bound_only"] is True\n              assert section["ambiguity"]["all_canonical_ambiguous_exits_are_stop_first"] is True\n\n          precedence = report["precedence_contract"]\n          assert precedence["canonical_same_m15_order"] == "STOP_FIRST"\n          assert precedence["gap_handling_precedes_intrabar_touch"] is True\n          assert precedence["target_r"] == "2.5"\n          assert precedence["target_first_used_as_candidate"] is False\n\n          gov = report["governance"]\n          assert gov["candidate_created"] is False\n          assert gov["signals_suppressed"] is False\n          assert gov["trade_count_changed"] is False\n          assert gov["target_changed"] is False\n          assert gov["stop_changed"] is False\n          assert gov["risk_allocator_changed"] is False\n          assert gov["canonical_stop_first_changed"] is False\n          assert gov["m1_used"] is False\n          assert gov["anchor_14_enabled"] is False\n          assert gov["live_authorized"] is False\n          assert gov["real_capital_authorized"] is False\n          assert gov["production_authorized"] is False\n          PY\n\n      - uses: actions/upload-artifact@v4\n        if: always()\n        with:\n          name: qore-vt08-index-r112-same-m15-ambiguity-census-${{ github.sha }}\n          path: artifacts/report\n          if-no-files-found: error\n          retention-days: 90\n