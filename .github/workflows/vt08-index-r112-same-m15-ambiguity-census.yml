name: VT08 Index R112 Same M15 Ambiguity Census

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r112-same-m15-ambiguity-census.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r112_same_m15_ambiguity_census.py
      - tests/infrastructure/trader_lab/test_vt08_index_r112_same_m15_ambiguity_census.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r112_same_m15_ambiguity_census.py

  census:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R112 same-M15 ambiguity census
        run: |
          mkdir -p artifacts/report
          python -m qore.infrastructure.trader_lab.vt08_index_r112_same_m15_ambiguity_census \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r112-same-m15-ambiguity-census.json

      - name: Verify R112 governance and frozen surface
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r112-same-m15-ambiguity-census.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R112_STANDARD_SAME_M15_AMBIGUITY_CENSUS_001"
          )
          assert report["source_r111"]["run_id"] == 35661275019
          assert report["source_r111"]["artifact_id"] == 10666554085
          assert report["source_r111"]["artifact_digest"] == (
              "sha256:f80a38fa197f005ec50f16d7f05ac640e19d86d9aad30c501c5ca45959850ed4"
          )

          expected = {
              "five_year": 1756,
              "recent_two_year": 746,
              "r66_failed_holdout": 546,
          }
          for key, sample in expected.items():
              section = report[key]
              assert section["sample"] == sample
              assert section["expected_sample"] == sample
              assert section["ambiguity"]["target_first_is_upper_bound_only"] is True
              assert section["ambiguity"]["all_canonical_ambiguous_exits_are_stop_first"] is True

          precedence = report["precedence_contract"]
          assert precedence["canonical_same_m15_order"] == "STOP_FIRST"
          assert precedence["gap_handling_precedes_intrabar_touch"] is True
          assert precedence["target_r"] == "2.5"
          assert precedence["target_first_used_as_candidate"] is False

          gov = report["governance"]
          assert gov["candidate_created"] is False
          assert gov["signals_suppressed"] is False
          assert gov["trade_count_changed"] is False
          assert gov["target_changed"] is False
          assert gov["stop_changed"] is False
          assert gov["risk_allocator_changed"] is False
          assert gov["canonical_stop_first_changed"] is False
          assert gov["m1_used"] is False
          assert gov["anchor_14_enabled"] is False
          assert gov["live_authorized"] is False
          assert gov["real_capital_authorized"] is False
          assert gov["production_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r112-same-m15-ambiguity-census-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
