name: QORE VT31 Architect A Pure Entry Edge Baseline V1

on:
  push:
    branches:
      - agent/vt31-edge-entry-reasoning-a-001
    paths:
      - scripts/vt31_nas100_architect_a_entry_edge_baseline_v1.py
      - scripts/vt31_nas100_specialist_r1_candidate.py
      - src/qore/infrastructure/traders/vt31_nas100_reasoning_engine.py
      - src/qore/infrastructure/traders/vt31_nas100_situation_model.py
      - src/qore/infrastructure/traders/vt31_nas100_market_context_runtime.py
      - src/qore/infrastructure/traders/vt31_nas100_trader_experience_memory.py
      - .github/workflows/vt31-architect-a-pure-entry-edge-baseline-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Static and focused gates
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_architect_a_entry_edge_baseline_v1.py
          ruff check \
            scripts/vt31_nas100_architect_a_entry_edge_baseline_v1.py \
            src/qore/infrastructure/traders/vt31_nas100_reasoning_engine.py \
            src/qore/infrastructure/traders/vt31_nas100_situation_model.py
          python scripts/vt31_nas100_specialist_r1_candidate.py --self-test
      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"
      - name: Run pure entry-edge baseline
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python \
            scripts/vt31_nas100_architect_a_entry_edge_baseline_v1.py \
            "input/${EVIDENCE_PATH}" \
            --output "result/entry-edge-${PARTITION}.json" \
            | tee "result/summary-${PARTITION}.json"
      - name: Governance
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=os.environ["PARTITION"]
          x=json.loads(Path(f"result/entry-edge-{p}.json").read_text())
          g=x["governance"]
          assert g["consumed_evidence_only"] is True
          assert g["architect_a_admission_logic_preserved"] is True
          assert g["forced_common_structural_exit"] is True
          assert g["position_management_optimization_used"] is False
          assert g["target_extension_used"] is False
          assert g["position_sizing_used"] is False
          assert g["leverage_used"] is False
          assert g["compounding_used"] is False
          assert g["capital_weighting_used"] is False
          assert g["absolute_volume_used"] is False
          assert g["future_outcome_used_for_admission"] is False
          assert g["fold_identity_used_for_admission"] is False
          assert g["fresh_holdout_opened"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-architect-a-entry-edge-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-architect-a-entry-edge-*-${{ github.sha }}
          path: input
          merge-multiple: true
      - name: Aggregate admission edge
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          folds=("r5","r6","r8","consumed")
          payloads={
              f:json.loads(Path(f"input/entry-edge-{f}.json").read_text())
              for f in folds
          }
          def d(v):
              return None if v is None else Decimal(str(v))

          report={}
          for fold,p in payloads.items():
              m=p["stress_0_05r"]
              mc=p["monte_carlo"]
              report[fold]={
                  "trade_count":p["trade_count"],
                  "metrics":m,
                  "monte_carlo":mc,
                  "status_counts":p["status_counts"],
                  "owner_directional_gates":{
                      "pf_at_least_1_50":(
                          d(m["profit_factor"]) is not None
                          and d(m["profit_factor"])>=Decimal("1.50")
                      ),
                      "mean_at_least_0_15r":(
                          d(m["mean_r"]) is not None
                          and d(m["mean_r"])>=Decimal("0.15")
                      ),
                      "dd_at_most_10r":d(m["max_drawdown_r"])<=Decimal("10"),
                      "mc_positive_at_least_0_90":(
                          d(mc["positive_terminal_probability"])>=Decimal("0.90")
                      ),
                      "mc_p95_dd_at_most_15r":(
                          d(mc["p95_max_drawdown_r"])<=Decimal("15")
                      ),
                  },
              }

          result={
              "schema":"qore.vt31.nas100.architect_a_entry_edge_baseline.aggregate.v1",
              "head":"${{ github.sha }}",
              "folds":report,
              "all_folds_pf_at_least_1_50":all(
                  x["owner_directional_gates"]["pf_at_least_1_50"]
                  for x in report.values()
              ),
              "all_folds_mean_at_least_0_15r":all(
                  x["owner_directional_gates"]["mean_at_least_0_15r"]
                  for x in report.values()
              ),
              "governance":{
                  "consumed_evidence_only":True,
                  "pure_entry_edge_measurement":True,
                  "sizing_for_certification_forbidden":True,
                  "fresh_holdout_opened":False,
                  "policy_promoted":False,
                  "candidate_frozen":False,
                  "candidate_certified":False,
              },
          }
          Path("result/aggregate.json").write_text(
              json.dumps(result,sort_keys=True,indent=2)+"\n"
          )
          print(json.dumps(result,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-architect-a-entry-edge-aggregate-${{ github.sha }}
          path: result/
          retention-days: 90
