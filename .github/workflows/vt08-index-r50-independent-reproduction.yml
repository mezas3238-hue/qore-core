name: VT08 Index R50 Independent Reproduction

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r50-independent-reproduction.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r50_independent_reproduction.py
      - tests/infrastructure/trader_lab/test_vt08_index_r50_independent_reproduction.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r48_candidate_freeze.py tests/infrastructure/trader_lab/test_vt08_index_r50_independent_reproduction.py

  reproduction:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute independent R47 reproduction
        run: |
          python -m qore.infrastructure.trader_lab.vt08_index_r50_independent_reproduction \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r50-independent-reproduction.json

      - name: Verify independent reproduction
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(Path("artifacts/report/vt08-index-r50-independent-reproduction.json").read_text())
          assert report["identity"] == "VT08_INDEX_R50_R47_INDEPENDENT_REPRODUCTION_001"
          assert report["candidate"]["candidate_id"] == "VT08_INDEX_R47_TRANSPORT_SAFE_STRUCTURAL_DEMOTION_001"
          assert report["candidate"]["rules_changed"] is False
          assert report["candidate"]["retuning_performed"] is False
          assert report["five_year"]["sample"] == 2448
          assert report["recent_two_year"]["sample"] == 1017
          assert report["exact_frozen_economics"] is True
          assert report["independent_trade_ledger_match"] is True
          assert report["independent_validation_pass"] is True
          for window in ("five_year", "recent_two_year"):
              assert report[window]["canonical_match"]["mismatch_count"] == 0
              assert (
                  report[window]["ledger_fingerprint"]
                  == report[window]["canonical_ledger_fingerprint"]
              )
          g=report["governance"]
          assert g["independent_rule_application_implementation"] is True
          assert g["retuning_performed"] is False
          assert g["certified"] is False
          assert g["live_authorized"] is False
          assert g["real_capital_authorized"] is False
          assert g["production_authorized"] is False
          PY

      - name: Upload R50 independent evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-index-r50-independent-reproduction-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
