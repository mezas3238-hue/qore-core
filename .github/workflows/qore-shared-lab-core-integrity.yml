      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/core_stack_v2/shared_lab.py \
            src/qore/infrastructure/core_stack_v2/shared_lab_authority.py \
            src/qore/infrastructure/core_stack_v2/shared_lab_causality.py \
