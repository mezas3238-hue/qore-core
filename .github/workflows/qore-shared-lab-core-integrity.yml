name: QORE Shared Lab Core Integrity

on:
  push:
    branches:
      - agent/qore-shared-lab-001
    paths:
      - src/qore/infrastructure/core_stack_v2/shared_lab.py
      - src/qore/infrastructure/core_stack_v2/shared_lab_tools.py
      - src/qore/infrastructure/core_stack_v2/shared_lab_influence.py
      - src/qore/infrastructure/core_stack_v2/shared_lab_experiments.py
      - src/qore/infrastructure/core_stack_v2/shared_lab_integrity.py
      - src/qore/infrastructure/core_stack_v2/shared_lab_ledger.py
      - src/qore/infrastructure/core_stack_v2/shared_lab_cognition.py
      - tests/infrastructure/test_core_stack_v2_shared_lab.py
      - tests/infrastructure/test_core_stack_v2_shared_lab_tools.py
      - tests/infrastructure/test_core_stack_v2_shared_lab_influence.py
      - tests/infrastructure/test_core_stack_v2_shared_lab_experiments.py
      - tests/infrastructure/test_core_stack_v2_shared_lab_integrity.py
      - tests/infrastructure/test_core_stack_v2_shared_lab_ledger.py
      - tests/infrastructure/test_core_stack_v2_shared_lab_cognition.py
      - .github/workflows/qore-shared-lab-core-integrity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-lab-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Static checks
        run: |
          ruff check \
            src/qore/infrastructure/core_stack_v2/shared_lab.py \
            src/qore/infrastructure/core_stack_v2/shared_lab_tools.py \
            src/qore/infrastructure/core_stack_v2/shared_lab_influence.py \
            src/qore/infrastructure/core_stack_v2/shared_lab_experiments.py \
            src/qore/infrastructure/core_stack_v2/shared_lab_integrity.py \
            src/qore/infrastructure/core_stack_v2/shared_lab_ledger.py \
            src/qore/infrastructure/core_stack_v2/shared_lab_cognition.py \
            tests/infrastructure/test_core_stack_v2_shared_lab.py \
            tests/infrastructure/test_core_stack_v2_shared_lab_tools.py \
            tests/infrastructure/test_core_stack_v2_shared_lab_influence.py \
            tests/infrastructure/test_core_stack_v2_shared_lab_experiments.py \
            tests/infrastructure/test_core_stack_v2_shared_lab_integrity.py \
            tests/infrastructure/test_core_stack_v2_shared_lab_ledger.py \
            tests/infrastructure/test_core_stack_v2_shared_lab_cognition.py
          mypy \
            src/qore/infrastructure/core_stack_v2/shared_lab.py \
            src/qore/infrastructure/core_stack_v2/shared_lab_tools.py \
            src/qore/infrastructure/core_stack_v2/shared_lab_influence.py \
            src/qore/infrastructure/core_stack_v2/shared_lab_experiments.py \
            src/qore/infrastructure/core_stack_v2/shared_lab_integrity.py \
            src/qore/infrastructure/core_stack_v2/shared_lab_ledger.py \
            src/qore/infrastructure/core_stack_v2/shared_lab_cognition.py
      - name: L0/L5/L10 laboratory truth checks
        run: |
          pytest -q \
            tests/infrastructure/test_core_stack_v2_shared_lab.py \
            tests/infrastructure/test_core_stack_v2_shared_lab_tools.py \
            tests/infrastructure/test_core_stack_v2_shared_lab_influence.py \
            tests/infrastructure/test_core_stack_v2_shared_lab_experiments.py \
            tests/infrastructure/test_core_stack_v2_shared_lab_integrity.py \
            tests/infrastructure/test_core_stack_v2_shared_lab_ledger.py \
            tests/infrastructure/test_core_stack_v2_shared_lab_cognition.py
