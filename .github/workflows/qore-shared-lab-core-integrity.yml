name: QORE Shared Lab Core Integrity

on:
  push:
    branches:
      - agent/qore-shared-lab-001
    paths:
      - src/qore/infrastructure/core_stack_v2/shared_lab*.py
      - tests/infrastructure/test_core_stack_v2_shared_lab*.py
      - scripts/shared_lab*.py
      - docs/shared/QORE_SHARED_LAB_*.md
      - .github/workflows/qore-shared-lab-core-integrity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-lab-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/core_stack_v2/shared_lab*.py \
            tests/infrastructure/test_core_stack_v2_shared_lab*.py \
            scripts/shared_lab*.py
      - name: Mypy
        run: |
          mypy src/qore/infrastructure/core_stack_v2/shared_lab*.py
      - name: L0-L10 laboratory truth checks
        run: |
          pytest -q tests/infrastructure/test_core_stack_v2_shared_lab*.py
      - name: Run core self-exam
        run: |
          mkdir -p result/shared-lab
          python scripts/shared_lab_core_self_exam.py \
            --output result/shared-lab/core-self-exam.json
      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-lab-core-self-exam-${{ github.sha }}
          path: result/shared-lab/
          if-no-files-found: error
          retention-days: 90
