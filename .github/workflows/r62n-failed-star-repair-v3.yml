name: Apply bounded R62N failed-star import repair v3

on:
  push:
    branches: [agent/qore-umi14-umi12-final-owner-recert-001]
    paths: [.github/workflows/r62n-failed-star-repair-v3.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qore-umi14-umi12-final-owner-recert-001
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Verify exact staging ancestry
        run: |
          test "$(git rev-parse HEAD^)" = "a72dd6dbbbb6285a44a099b059efc9b2afaa006d"
          test "$(git rev-parse HEAD^^)" = "80013c5bbc050e167f089925776c8fcaf2838709"
          test "$(git rev-parse HEAD^^^)" = "9a3b44e6b19fab5e9cd72ef9013d031b6ef0cc6d"
      - name: Install canonical development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify and apply bounded failed-star repair
        env:
          PATCH_SHA256: '64f862de00e6c3863d9794066cf09c73263193a23b133b3096a489002f5569c6'
          PATCH_ZLIB_B64: ''
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import os
          import zlib

          payload = os.environ['PATCH_ZLIB_B64']
          if hashlib.sha256(payload.encode()).hexdigest() != os.environ['PATCH_SHA256']:
              raise SystemExit('patch payload digest mismatch')
          script = zlib.decompress(base64.b64decode(payload)).decode('utf-8')
          exec(compile(script, '<r62n-failed-star-repair-v3>', 'exec'))
          PY
      - name: Syntax and focused regression
        run: |
          python -m py_compile tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
          pytest -q tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
      - name: Full canonical quality gate
        run: |
          ruff check .
          mypy src tests
          pytest --cov=src/qore --cov-report=term-missing
      - name: Commit validated repair and remove staging
        run: |
          git config user.name "qore-integration-authority"
          git config user.email "qore-integration-authority@users.noreply.github.com"
          git add tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
          git rm .github/workflows/r62n-failed-star-repair.yml
          git rm .github/workflows/r62n-failed-star-repair-v2.yml
          git rm .github/workflows/r62n-failed-star-repair-v3.yml
          git diff --cached --check
          git commit -m "Harden R62N failed-star import ordering"
          git push origin HEAD:agent/qore-umi14-umi12-final-owner-recert-001
