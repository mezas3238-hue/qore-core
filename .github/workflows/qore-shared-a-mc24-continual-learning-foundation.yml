name: QORE Shared A MC24 Continual Learning Foundation

on:
  push:
    branches: [agent/shared-a-cognitive-science-001]
    paths:
      - src/qore/infrastructure/core_stack_v2/continual_learning_governance.py
      - tests/infrastructure/test_core_stack_v2_continual_learning_governance.py
      - scripts/shared_mc24_continual_learning_audit.py
      - .github/workflows/qore-shared-a-mc24-continual-learning-foundation.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and validate
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          mkdir -p result
          ruff check src/qore/infrastructure/core_stack_v2/continual_learning_governance.py tests/infrastructure/test_core_stack_v2_continual_learning_governance.py scripts/shared_mc24_continual_learning_audit.py
          mypy src/qore/infrastructure/core_stack_v2/continual_learning_governance.py
          pytest -q tests/infrastructure/test_core_stack_v2_continual_learning_governance.py
          python scripts/shared_mc24_continual_learning_audit.py | tee result/summary.json
      - name: Validate bounded disposition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/mc24-continual-learning-audit.json").read_text())
          assert p["status"] == "MC24_CONTINUAL_LEARNING_GOVERNANCE_FOUNDATION_PASS"
          assert p["regression_canary_detected"] is True
          assert p["regression_canary_promotion_allowed"] is False
          assert p["real_adaptation_regression_suite_bound"] is False
          assert p["mc24_completed_and_proven"] is False
          PY
      - name: Seal
        run: |
          printf '%s\n' "${GITHUB_SHA}" > result/code-git-sha.txt
          (cd result && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-a-mc24-continual-learning-${{ github.sha }}
          path: result/
          retention-days: 90
      - name: Report
        run: |
          {
            echo "## Shared A MC-24 — Continual Learning foundation"
            echo
            echo "- catastrophic-forgetting canary detected: **True**"
            echo "- silent certified overwrite: **Forbidden**"
            echo "- transportability / half-life gates: **Present**"
            echo "- real adaptation regression suite bound: **False**"
            echo "- MC-24 completed-and-proven: **False**"
          } > result/issue-comment.md
          gh issue comment 638 --body-file result/issue-comment.md
