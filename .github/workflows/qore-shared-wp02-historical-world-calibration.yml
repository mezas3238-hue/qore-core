name: QORE Shared WP02 Historical World Calibration

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - src/qore/infrastructure/core_stack_v2/multi_world_federation.py
      - src/qore/infrastructure/core_stack_v2/world_federation_calibration.py
      - scripts/shared_wp02_world_federation_historical_calibration.py
      - tests/infrastructure/test_core_stack_v2_multi_world_federation.py
      - tests/infrastructure/test_core_stack_v2_world_federation_calibration.py
      - .github/workflows/qore-shared-wp02-historical-world-calibration.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  historical-world-calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Shared
        run: pip install -e ".[dev]"

      - name: Static validation
        run: |
          ruff check             src/qore/infrastructure/core_stack_v2/multi_world_federation.py             src/qore/infrastructure/core_stack_v2/world_federation_calibration.py             scripts/shared_wp02_world_federation_historical_calibration.py             tests/infrastructure/test_core_stack_v2_multi_world_federation.py             tests/infrastructure/test_core_stack_v2_world_federation_calibration.py
          python -m py_compile             src/qore/infrastructure/core_stack_v2/multi_world_federation.py             src/qore/infrastructure/core_stack_v2/world_federation_calibration.py             scripts/shared_wp02_world_federation_historical_calibration.py
          pytest -q             tests/infrastructure/test_core_stack_v2_multi_world_federation.py             tests/infrastructure/test_core_stack_v2_world_federation_calibration.py

      - name: Recover immutable R8 R6 R5 evidence
        run: |
          set -euo pipefail
          mkdir -p input/pure input/r8 input/r6 input/r5 result

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10799064861/zip" > pure.zip
          unzip -q pure.zip -d input/pure
          (cd input/pure && sha256sum -c SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10402199719/zip" > r8.zip
          unzip -q r8.zip -d input/r8
          (cd input/r8 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10389112524/zip" > r6.zip
          unzip -q r6.zip -d input/r6
          (cd input/r6 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10380044761/zip" > r5.zip
          unzip -q r5.zip -d input/r5
          (cd input/r5 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

      - name: Run R8 calibration R6 holdout R5 replication
        run: |
          python scripts/shared_wp02_world_federation_historical_calibration.py             --r8-trades input/pure/r8.json             --r6-trades input/pure/r6.json             --r5-trades input/pure/r5.json             --r8-nas input/r8/fresh/NAS100/market-evidence.json             --r8-sp input/r8/fresh/SP500/market-evidence.json             --r8-us input/r8/fresh/US30/market-evidence.json             --r6-nas input/r6/fresh/NAS100/market-evidence.json             --r6-sp input/r6/fresh/SP500/market-evidence.json             --r6-us input/r6/fresh/US30/market-evidence.json             --r5-nas input/r5/fresh/NAS100/market-evidence.json             --r5-sp input/r5/fresh/SP500/market-evidence.json             --r5-us input/r5/fresh/US30/market-evidence.json             --output result/wp02-historical-world-calibration.json             | tee result/summary.json

      - name: Validate WP02 governance and evidence gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(
              Path("result/wp02-historical-world-calibration.json").read_text()
          )
          assert p["population"] == {"r8": 228, "r6": 278, "r5": 316}
          assert p["calibration_partition"] == "r8"
          assert p["holdout_partition"] == "r6"
          assert p["replication_partition"] == "r5"
          assert p["passes_wp02_historical_calibration"] is True
          assert all(p["gates"].values())

          g = p["governance"]
          assert g["vt31_is_falsification_lab_only"] is True
          assert g["trade_rows_used_only_for_signal_timestamp"] is True
          assert g["trade_direction_used"] is False
          assert g["trade_entry_used"] is False
          assert g["trade_stop_used"] is False
          assert g["trade_target_used"] is False
          assert g["trade_pnl_used"] is False
          assert g["trade_terminal_outcome_used"] is False
          assert g["future_market_used_for_world_evidence"] is False
          assert g["future_market_used_for_evaluation_labels_only"] is True
          assert g["temperature_fit_partition"] == "r8_only"
          assert g["r6_used_for_temperature_fit"] is False
          assert g["r5_used_for_temperature_fit"] is False
          assert g["runtime_default_temperature_mutated"] is False
          assert g["calibration_candidate_promoted_to_universal_shared"] is False
          assert g["shared_order_authority"] is False
          assert g["shared_risk_authority"] is False
          assert g["shared_sizing_authority"] is False
          assert g["shared_execution_authority"] is False
          assert g["live_authorized"] is False
          assert g["production_authorized"] is False
          assert g["real_capital_authorized"] is False
          assert g["merge_authorized"] is False
          PY

      - name: Bind result
        run: |
          echo "${GITHUB_SHA}" > result/git-sha.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd result && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-wp02-historical-world-calibration-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
