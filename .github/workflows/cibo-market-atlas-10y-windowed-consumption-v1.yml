name: QORE CIBO Market Atlas 10Y Windowed Consumption V1

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cibo-market-atlas-20y-v1-001
    paths:
      - '.github/workflows/cibo-market-atlas-10y-windowed-consumption-v1.yml'
      - 'src/qore/infrastructure/trader_lab/cibo_market_atlas_10y_windowed_runtime_v1.py'
      - 'tests/infrastructure/trader_lab/test_cibo_market_atlas_10y_windowed_runtime_v1.py'

concurrency:
  group: qore-cibo-market-atlas-10y-windowed-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
  QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE development dependencies
        run: python -m pip install -e '.[dev,ctrader]'
      - name: Ruff corrected transport gate
        run: |
          ruff check --ignore B009 \
            src/qore/infrastructure/trader_lab/cibo_market_atlas_10y_windowed_runtime_v1.py \
            tests/infrastructure/trader_lab/test_cibo_market_atlas_10y_windowed_runtime_v1.py
      - name: Mypy corrected transport gate
        run: mypy src/qore/infrastructure/trader_lab/cibo_market_atlas_10y_windowed_runtime_v1.py
      - name: Corrected transport tests
        run: pytest -q --no-cov tests/infrastructure/trader_lab/test_cibo_market_atlas_10y_windowed_runtime_v1.py
      - name: Anti-truncation assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/qore/infrastructure/trader_lab/cibo_market_atlas_10y_windowed_runtime_v1.py').read_text()
          request_block = text.split('client.request(', 1)[1].split('client_msg_id=', 1)[0]
          assert '"count"' not in request_block
          assert 'fromTimestamp' in request_block
          assert 'toTimestamp' in request_block
          assert 'MAX_CALENDAR_M5_BARS_PER_CHUNK' in text
          PY

  consume:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        symbol: [AUDJPY, AUDUSD, EURUSD, GBPJPY, GBPUSD, USDCAD, USDJPY, NAS100, SP500, US30, XAUUSD, XAGUSD]
    env:
      QORE_SYMBOL: ${{ matrix.symbol }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE cTrader runtime
        run: python -m pip install -e '.[ctrader]'
      - name: Verify DEMO read-only credential inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in QORE_CTRADER_CLIENT_ID QORE_CTRADER_CLIENT_SECRET QORE_CTRADER_ACCESS_TOKEN QORE_CTRADER_REFRESH_TOKEN; do
            test -n "${!name:-}" || { echo "missing required DEMO input: $name" >&2; exit 2; }
          done
      - name: Discover DEMO account when not configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            if ! [[ "$account_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "cTrader DEMO account discovery returned an invalid id" >&2
              exit 3
            fi
            echo "::add-mask::$account_id"
            printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          fi
      - name: Consume ten-year M5 corpus with strict windows
        id: consume_m5
        continue-on-error: true
        run: |
          mkdir -p "artifacts/${QORE_SYMBOL}"
          python -m qore.infrastructure.trader_lab.cibo_market_atlas_10y_windowed_runtime_v1 \
            "$QORE_SYMBOL" "artifacts/${QORE_SYMBOL}" \
            > "artifacts/${QORE_SYMBOL}/stdout.json"
      - name: Bind immutable git SHA
        if: always()
        shell: bash
        run: |
          mkdir -p "artifacts/${QORE_SYMBOL}"
          printf '%s\n' "$GITHUB_SHA" > "artifacts/${QORE_SYMBOL}/git-sha.txt"
          if [ -f "artifacts/${QORE_SYMBOL}/symbol-consumption-manifest.json" ]; then
            cd "artifacts/${QORE_SYMBOL}"
            sha256sum symbol-consumption-manifest.json MANIFEST_SHA256SUMS.txt git-sha.txt > SYMBOL_SHA256SUMS.txt
          fi
      - name: Upload immutable symbol evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-${{ matrix.symbol }}-${{ github.sha }}
          path: artifacts/${{ matrix.symbol }}
          if-no-files-found: error
          retention-days: 90
      - name: Enforce clean provider payload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.consume_m5.outcome }}' = 'success'
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = Path(f"artifacts/{os.environ['QORE_SYMBOL']}/symbol-consumption-manifest.json")
          payload = json.loads(manifest.read_text())
          assert payload['identity'] == 'CIBO_MARKET_ATLAS_10Y_CONSUMPTION_V1'
          assert payload['raw_integrity_status'] == 'CLEAN_PROVIDER_PAYLOAD'
          assert payload['research_evidence_consumed'] is True
          assert payload['read_only'] is True
          assert payload['demo_eligible'] is False
          assert payload['live_authorized'] is False
          assert payload['real_capital_authorized'] is False
          assert payload['production_authorized'] is False
          PY

  aggregate:
    needs: consume
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-cibo-market-atlas-10y-windowed-*-${{ github.sha }}
          path: artifacts/input
      - name: Build authoritative ten-year consumption index
        run: |
          mkdir -p artifacts/aggregate
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path('artifacts/input').rglob('symbol-consumption-manifest.json'))
          assert len(files) == 12, len(files)
          rows = [json.loads(path.read_text()) for path in files]
          expected = sorted(['AUDJPY','AUDUSD','EURUSD','GBPJPY','GBPUSD','USDCAD','USDJPY','NAS100','SP500','US30','XAUUSD','XAGUSD'])
          assert sorted(row['canonical_symbol'] for row in rows) == expected
          assert all(row['raw_integrity_status'] == 'CLEAN_PROVIDER_PAYLOAD' for row in rows)
          payload = {
              'schema': 'qore.cibo_market_atlas.m5_consumption.aggregate.v1',
              'identity': 'CIBO_MARKET_ATLAS_10Y_CONSUMPTION_V1',
              'transport': 'STRICT_FROM_TO_WINDOWED_V1',
              'target_start': '2016-09-17T00:00:00+00:00',
              'target_end_exclusive': '2026-09-17T00:00:00+00:00',
              'symbol_count': len(rows),
              'total_retained_bars': sum(row['retained_bars'] for row in rows),
              'symbols': rows,
              'research_evidence_consumed': True,
              'demo_eligible': False,
              'live_authorized': False,
              'real_capital_authorized': False,
              'production_authorized': False,
          }
          Path('artifacts/aggregate/ten-year-consumption-index.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n'
          )
          lines = [
              '# CIBO Market Atlas — 10Y Authoritative Consumption Index',
              '',
              f"Retained M5 bars: {payload['total_retained_bars']:,}",
              '',
              '| Canonical | Provider | First M5 | Last M5 | Bars |',
              '|---|---|---:|---:|---:|',
          ]
          for row in sorted(rows, key=lambda item: item['canonical_symbol']):
              lines.append(
                  f"| {row['canonical_symbol']} | {row['provider_symbol']} | "
                  f"{row['earliest_observed_m5']} | {row['latest_observed_m5']} | "
                  f"{row['retained_bars']:,} |"
              )
          Path('artifacts/aggregate/ten-year-consumption-report.md').write_text(
              '\n'.join(lines) + '\n'
          )
          PY
          printf '%s\n' "$GITHUB_SHA" > artifacts/aggregate/git-sha.txt
          cd artifacts/aggregate
          sha256sum ten-year-consumption-index.json ten-year-consumption-report.md git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-aggregate-${{ github.sha }}
          path: artifacts/aggregate
          if-no-files-found: error
          retention-days: 90
