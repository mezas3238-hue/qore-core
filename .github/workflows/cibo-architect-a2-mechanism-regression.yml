name: QORE CIBO Architect A2 Mechanism Regression

on:
  push:
    branches:
      - agent/cibo-architect-a2-capital-science-001
    paths:
      - '.github/workflows/cibo-architect-a2-mechanism-regression.yml'
      - 'src/qore/infrastructure/cibo_*.py'
      - 'tests/infrastructure/test_cibo_*.py'
  pull_request:
    paths:
      - '.github/workflows/cibo-architect-a2-mechanism-regression.yml'
      - 'src/qore/infrastructure/cibo_*.py'
      - 'tests/infrastructure/test_cibo_*.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a2-mechanism-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Regress Architect A2 capital-science mechanisms
        run: |
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_adaptive_compound_speed_economic_gate.py \
            tests/infrastructure/test_cibo_genc9_economic_gate.py \
            tests/infrastructure/test_cibo_genc10_transition_uncertainty_calibration.py \
            tests/infrastructure/test_cibo_genc11_genc13_utility_gate.py \
            tests/infrastructure/test_cibo_genc12_economic_gate.py \
            tests/infrastructure/test_cibo_meta_capital_memory.py \
            tests/infrastructure/test_cibo_governed_capital_science.py \
            tests/infrastructure/test_cibo_compound_cycle_state.py \
            tests/infrastructure/test_cibo_compound_portfolio.py \
            tests/infrastructure/test_cibo_internal_capital_market.py \
            tests/infrastructure/test_cibo_generation_current_control.py \
            tests/infrastructure/test_cibo_protected_base_policy_gate.py \
            tests/infrastructure/test_cibo_protected_base_overlay.py \
            tests/infrastructure/test_cibo_profit_preservation_economic_gate.py \
            tests/infrastructure/test_cibo_compound_path_monte_carlo.py \
            tests/infrastructure/test_cibo_compound_adversarial_stress.py \
            tests/infrastructure/test_cibo_as_is_economic_baseline.py \
            tests/infrastructure/test_cibo_marginal_capital_utility_evidence.py \
            tests/infrastructure/test_cibo_robust_growth_ruin_capacity.py \
            tests/infrastructure/test_cibo_compound_real_population_binding.py
