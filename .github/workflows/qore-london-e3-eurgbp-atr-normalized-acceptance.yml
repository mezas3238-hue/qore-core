name: QORE London E3 EUR GBP ATR-Normalized Asia Acceptance

on:
  push:
    branches:
      - research/london-eurgbp-acceptance-atr-e3-20261011
    paths:
      - '.github/workflows/qore-london-e3-eurgbp-atr-normalized-acceptance.yml'
      - 'src/qore/infrastructure/trader_lab/qore_london_eurgbp_acceptance_atr_e3.py'
      - 'tests/infrastructure/trader_lab/test_qore_london_eurgbp_acceptance_atr_e3.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FROZEN_PATH_RUN: '38150980682'
  FROZEN_PATH_SHA: '125bc37709f36ccf9295f6dbd6cc390b44b266c8'
  E2_H4_RUN: '38152552686'
  E2_H4_SHA: '4d093b1ecd8acba4ebab73156fa583fecf7983a7'
  NATIVE_M1_RUN: '35548099334'
  NATIVE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - name: 'Preregister E3, fail-closed code and source-only causal tests'
        run: |
          test -s docs/research/QORE_LONDON_E3_ATR_NORMALIZED_ACCEPTANCE_PREREG_2026-10-11.md
          python -m compileall -q src/qore/infrastructure/trader_lab/qore_london_eurgbp_acceptance_atr_e3.py
          ruff check --select F,E4,E7,E9 src/qore/infrastructure/trader_lab/qore_london_eurgbp_acceptance_atr_e3.py tests/infrastructure/trader_lab/test_qore_london_eurgbp_acceptance_atr_e3.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_qore_london_eurgbp_acceptance_atr_e3.py

  markets:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 130
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        symbol: [EURUSD, GBPUSD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - name: 'Immutable +60 minute results and original states'
        uses: actions/download-artifact@v4
        with:
          name: london-ttrades-source-only-${{ matrix.symbol }}-${{ env.FROZEN_PATH_SHA }}
          path: frozen
          github-token: ${{ github.token }}
          run-id: ${{ env.FROZEN_PATH_RUN }}
      - name: 'Previous E2 observed-H4 status for missingness diagnostic only'
        uses: actions/download-artifact@v4
        with:
          name: issue775-LONDON-E2-${{ matrix.symbol }}-${{ env.E2_H4_SHA }}
          path: H4-E2
          github-token: ${{ github.token }}
          run-id: ${{ env.E2_H4_RUN }}
      - name: 'Provider native M1 to calculate Asia ATR14 M15 (no future data)'
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.NATIVE_M1_SHA }}
          path: native
          github-token: ${{ github.token }}
          run-id: ${{ env.NATIVE_M1_RUN }}
      - name: 'E3 one market, full census with frozen original outcomes'
        run: |
          python -m qore.infrastructure.trader_lab.qore_london_eurgbp_acceptance_atr_e3 market native frozen H4-E2 MARKET
      - uses: actions/upload-artifact@v4
        with:
          name: issue775-LONDON-E3-${{ matrix.symbol }}-${{ github.sha }}
          path: MARKET/
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: markets
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: issue775-LONDON-E3-*-${{ github.sha }}
          path: MARKET-ROOT
      - name: 'Original vs normalized interaction and shared five-date blocks'
        run: |
          python -m qore.infrastructure.trader_lab.qore_london_eurgbp_acceptance_atr_e3 aggregate MARKET-ROOT E3-FINAL
          python - <<'PY'
          from pathlib import Path
          import json
          x=json.loads(Path("E3-FINAL/qore-london-E3-atr-normalized-acceptance-results.json").read_text())
          assert x["original_hist_458_unchanged"]
          assert x["E3_ATR_0p50_bootstrap"]["n_requested"]==2000
          assert x["OOS_certification"] is False
          assert x["no_trades_PF_SMT_or_cisd_author"]
          cells=x["original_pair_interaction"]["cells"]
          assert (cells["EURUSD|RECLAIM_INSIDE"]["N"],cells["EURUSD|RECLAIM_INSIDE"]["reversal"])==(94,38)
          assert (cells["GBPUSD|ACCEPTED_OUTSIDE"]["N"],cells["GBPUSD|ACCEPTED_OUTSIDE"]["reversal"])==(123,50)
          print("QORE_LONDON_E3_VERIFIED",json.dumps({
            "original":x["original_pair_interaction"],
            "E3":x["E3_ATR_normalized_interaction"],
            "bootstrap":x["E3_ATR_0p50_bootstrap"],
            "h4_coverage":x["original_contrast_by_H4_E2_missingness"],
            "transitions":x["original_to_E3_transitions"],
            "by_e3":x["E3_by_state"],
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: issue775-LONDON-E3-two-pair-aggregate-${{ github.sha }}
          path: E3-FINAL/
          retention-days: 90
          if-no-files-found: error
