name: QORE Shared Global Market Relational Foundation

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - docs/shared/QORE_SHARED_GLOBAL_PERCEPTION_OWNER_DIRECTIVE_006.md
      - docs/shared/QORE_SHARED_GLOBAL_PERCEPTION_ARCHITECTURE_AUDIT_001.md
      - docs/shared/QORE_SHARED_GLOBAL_MARKET_RELATIONAL_INTELLIGENCE_ROADMAP_001.md
      - docs/shared/QORE_SHARED_MAXIMUM_COGNITIVE_CEILING_ROADMAP.md
      - docs/shared/QORE_SHARED_MAXIMUM_PRECERTIFICATION_STANDARD_006.md
      - src/qore/infrastructure/core_stack_v2/global_sensor_registry.py
      - src/qore/infrastructure/core_stack_v2/global_market_relational_graph.py
      - src/qore/infrastructure/core_stack_v2/global_market_intelligence_contract.py
      - src/qore/infrastructure/core_stack_v2/shared_brain_architecture_contract.py
      - src/qore/infrastructure/core_stack_v2/shared_brain_ceiling_program.py
      - tests/infrastructure/test_core_stack_v2_global_sensor_registry.py
      - tests/infrastructure/test_core_stack_v2_global_market_relational_graph.py
      - tests/infrastructure/test_core_stack_v2_global_market_intelligence_contract.py
      - tests/infrastructure/test_core_stack_v2_shared_brain_architecture_contract.py
      - tests/infrastructure/test_core_stack_v2_shared_brain_ceiling_program.py
      - .github/workflows/qore-shared-global-market-relational-foundation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Shared
        run: pip install -e ".[dev]"
      - name: Validate global perception foundation
        run: |
          set -euo pipefail
          ruff check \
            src/qore/infrastructure/core_stack_v2/global_sensor_registry.py \
            src/qore/infrastructure/core_stack_v2/global_market_relational_graph.py \
            src/qore/infrastructure/core_stack_v2/global_market_intelligence_contract.py \
            src/qore/infrastructure/core_stack_v2/shared_brain_architecture_contract.py \
            src/qore/infrastructure/core_stack_v2/shared_brain_ceiling_program.py \
            tests/infrastructure/test_core_stack_v2_global_sensor_registry.py \
            tests/infrastructure/test_core_stack_v2_global_market_relational_graph.py \
            tests/infrastructure/test_core_stack_v2_global_market_intelligence_contract.py \
            tests/infrastructure/test_core_stack_v2_shared_brain_architecture_contract.py \
            tests/infrastructure/test_core_stack_v2_shared_brain_ceiling_program.py
          mypy \
            src/qore/infrastructure/core_stack_v2/global_sensor_registry.py \
            src/qore/infrastructure/core_stack_v2/global_market_relational_graph.py \
            src/qore/infrastructure/core_stack_v2/global_market_intelligence_contract.py
          pytest -q \
            tests/infrastructure/test_core_stack_v2_global_sensor_registry.py \
            tests/infrastructure/test_core_stack_v2_global_market_relational_graph.py \
            tests/infrastructure/test_core_stack_v2_global_market_intelligence_contract.py \
            tests/infrastructure/test_core_stack_v2_shared_brain_architecture_contract.py \
            tests/infrastructure/test_core_stack_v2_shared_brain_ceiling_program.py
