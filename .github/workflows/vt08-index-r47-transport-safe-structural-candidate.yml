name: VT08 Index R47 Transport-Safe Structural Candidate

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r47-transport-safe-structural-candidate.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r47_transport_safe_structural_demotion.py
      - tests/infrastructure/trader_lab/test_vt08_index_r47_transport_safe_structural_demotion.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r47_transport_safe_structural_demotion.py

  dual-window:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R47 dual-window candidate
        run: |
          python -m qore.infrastructure.trader_lab.vt08_index_r47_transport_safe_structural_demotion \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r47-transport-safe-structural-candidate.json

      - name: Verify R47 governance and contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(Path("artifacts/report/vt08-index-r47-transport-safe-structural-candidate.json").read_text())
          assert report["identity"] == "VT08_INDEX_R47_TRANSPORT_SAFE_STRUCTURAL_DEMOTION_001"
          assert report["candidate"]["r42_r43_static_priors_inherited"] is False
          assert report["five_year"]["sample"] == 2448
          assert report["recent_two_year"]["sample"] >= 1000
          assert report["five_year"]["density_pass"] is True
          assert report["recent_two_year"]["density_pass"] is True
          for window in ("five_year", "recent_two_year"):
              assert report[window]["diagnostics"]["suppressed_trade_count"] == 0
              assert report[window]["diagnostics"]["risk_increase_count"] == 0
              assert float(report[window]["primary_conservative_mark_to_market"]["max_drawdown_r"]) <= 6.0
              assert float(report[window]["secondary_conservative_mark_to_market"]["max_drawdown_r"]) <= 6.0
          g=report["governance"]
          assert g["r43_r44_modified"] is False
          assert g["fresh_holdout_claim"] is False
          assert g["grid_search_used"] is False
          assert g["calendar_or_year_runtime_feature"] is False
          assert g["post_entry_outcome_runtime_feature"] is False
          assert g["all_signals_preserved"] is True
          assert g["zero_risk_allowed"] is False
          assert g["freed_risk_reallocated"] is False
          assert g["candidate_frozen"] is False
          assert g["certified"] is False
          assert g["live_authorized"] is False
          assert g["real_capital_authorized"] is False
          assert g["production_authorized"] is False
          PY

      - name: Upload R47 evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-index-r47-transport-safe-structural-candidate-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
