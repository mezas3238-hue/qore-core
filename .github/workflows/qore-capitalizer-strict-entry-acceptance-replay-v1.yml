name: QORE Capitalizer Strict Entry Acceptance Replay V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-strict-entry-acceptance-replay-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_strict_entry_acceptance_replay_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_strict_entry_acceptance_replay_v1.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_dual_source_entry_acceptance_v1.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_source_trader_engine_v2.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-strict-entry-acceptance-replay-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_REPLAY_RUN_ID: '35528346941'
  SOURCE_REPLAY_SHA: 'e0338846170003fd7b346c98883f63257b6cdf45'
  SOURCE_M5_RUN_ID: '35166210458'
  SOURCE_M5_SHA: 'ab782b8e9f890f86a2b6500070f0556b4b685e3d'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check             src/qore/infrastructure/trader_lab/capitalizer_strict_entry_acceptance_replay_v1.py             tests/infrastructure/trader_lab/test_capitalizer_strict_entry_acceptance_replay_v1.py             src/qore/infrastructure/trader_lab/capitalizer_dual_source_entry_acceptance_v1.py             src/qore/infrastructure/trader_lab/capitalizer_source_trader_engine_v2.py
      - name: Mypy
        run: |
          mypy             src/qore/infrastructure/trader_lab/capitalizer_strict_entry_acceptance_replay_v1.py             src/qore/infrastructure/trader_lab/capitalizer_dual_source_entry_acceptance_v1.py             src/qore/infrastructure/trader_lab/capitalizer_source_trader_engine_v2.py
      - name: Focused tests
        run: |
          pytest -q --no-cov             tests/infrastructure/trader_lab/test_capitalizer_strict_entry_acceptance_replay_v1.py             tests/infrastructure/trader_lab/test_capitalizer_dual_source_entry_acceptance_v1.py             tests/infrastructure/trader_lab/test_capitalizer_source_trader_engine_v2.py

  market:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - symbol: USDJPY
            session: ASIA
          - symbol: AUDJPY
            session: ASIA
          - symbol: AUDUSD
            session: ASIA
          - symbol: GBPJPY
            session: ASIA
          - symbol: EURUSD
            session: LONDON
          - symbol: GBPUSD
            session: LONDON
          - symbol: XAUUSD
            session: NEW_YORK
          - symbol: USDCAD
            session: NEW_YORK
          - symbol: NAS100
            session: NEW_YORK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download immutable original replay cell
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-three-session-replay-cell-${{ matrix.symbol }}-${{ env.SOURCE_REPLAY_SHA }}
          path: replay-cell
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_REPLAY_RUN_ID }}
      - name: Download immutable RAW M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-${{ matrix.symbol }}-${{ env.SOURCE_M5_SHA }}
          path: m5
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M5_RUN_ID }}
      - name: Run strict entry admission replay
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_strict_entry_acceptance_replay_v1             market replay-cell m5 market-output
      - name: Enforce replay evidence boundary
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
          EXPECTED_SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ['EXPECTED_SYMBOL']
          session = os.environ['EXPECTED_SESSION']
          result = json.loads(
              (
                  Path('market-output')
                  / f"capitalizer-{symbol.lower()}-strict-entry-acceptance-replay-v1.json"
              ).read_text()
          )
          assert result['identity'] == 'QORE_CAPITALIZER_STRICT_ENTRY_ACCEPTANCE_REPLAY_V1'
          assert result['symbol'] == symbol
          assert result['session'] == session
          assert result['funnel']['total_candidates'] > 0
          assert result['source_entry_conditions_integrated_in_trader'] is True
          assert result['ict_original_primary'] is True
          assert result['ttrades_secondary_refinement'] is True
          assert result['qore_m5_operationalization'] is True
          assert result['m1_evidence_required'] is True
          assert result['m1_evidence_present'] is False
          assert result['full_dual_source_entry_pass_count'] == 0
          assert result['source_faithful_replay_complete'] is False
          assert result['outcome_used_for_selection'] is False
          assert result['numeric_fit_used'] is False
          assert result['rule_promotion_allowed'] is False
          assert result['economic_candidate'] is False
          assert result['trader_certified'] is False
          PY
      - name: Upload market strict-entry report
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-strict-entry-acceptance-v1-${{ matrix.symbol }}-${{ github.sha }}
          path: market-output
          if-no-files-found: error
          retention-days: 90

  matrix:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download nine market reports
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-strict-entry-acceptance-v1-*-${{ github.sha }}
          path: market-reports
          merge-multiple: false
      - name: Build nine-market strict-entry matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_strict_entry_acceptance_replay_v1             matrix market-reports matrix-output
      - name: Enforce matrix governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path(
                  'matrix-output/capitalizer-nine-market-strict-entry-acceptance-replay-v1.json'
              ).read_text()
          )
          assert result['identity'] == 'QORE_CAPITALIZER_NINE_MARKET_STRICT_ENTRY_ACCEPTANCE_REPLAY_V1'
          assert result['complete_nine_market_universe'] is True
          assert len(result['markets']) == 9
          assert result['total_candidates'] == 55532
          assert result['source_entry_conditions_integrated_in_trader'] is True
          assert result['m1_evidence_required'] is True
          assert result['m1_evidence_present'] is False
          assert result['full_dual_source_entry_pass_count'] == 0
          assert result['source_faithful_replay_complete'] is False
          assert result['outcome_used_for_selection'] is False
          assert result['numeric_fit_used'] is False
          assert result['rule_promotion_allowed'] is False
          assert result['economic_candidate'] is False
          assert result['trader_certified'] is False
          PY
      - name: Upload nine-market strict-entry matrix
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-nine-market-strict-entry-acceptance-v1-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
