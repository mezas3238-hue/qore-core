name: QORE Capitalizer V3 WAIT5 LATE60 Hypothesis Expiration Atlas 2Y V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-v3-wait5-late60-hypothesis-expiration-atlas-2y-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v3_wait5_late60_hypothesis_expiration_atlas_2y_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v3_wait5_late60_hypothesis_expiration_atlas_2y_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-v3-wait5-late60-hypothesis-expiration-atlas-2y-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  SUPERSESSION_RUN_ID: '35852419114'
  SUPERSESSION_SHA: '41737c7cb49cf433361bd5f32b14b7aea2cb5439'
  CARRY_RUN_ID: '35855595435'
  CARRY_SHA: '938560118659d682be1568fccbd2975f6be09ec3'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_v3_wait5_late60_hypothesis_expiration_atlas_2y_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_v3_wait5_late60_hypothesis_expiration_atlas_2y_v1.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_v3_wait5_late60_hypothesis_expiration_atlas_2y_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_v3_wait5_late60_hypothesis_expiration_atlas_2y_v1.py

  atlas:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download frozen supersession ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v3-source-first-late60-supersession-census-2y-v1-*-${{ env.SUPERSESSION_SHA }}
          path: supersession-input
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.SUPERSESSION_RUN_ID }}
      - name: Download frozen carry-context ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v3-wait5-late60-carry-context-forensics-2y-v1-*-${{ env.CARRY_SHA }}
          path: carry-input
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.CARRY_RUN_ID }}
      - name: Build outcome-free hypothesis-expiration atlas
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v3_wait5_late60_hypothesis_expiration_atlas_2y_v1 \
            supersession-input carry-input atlas-output
      - name: Enforce structural controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "atlas-output/"
                  "capitalizer-nine-market-v3-wait5-late60-hypothesis-expiration-atlas-2y-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_V3_WAIT5_LATE60_HYPOTHESIS_EXPIRATION_ATLAS_2Y_V1"
          )
          assert report["supersession_rows"] == 376
          assert report["carry_rows"] == 365
          assert report["joined_rows"] == 365
          assert report["unmatched_carry_rows"] == 0
          assert report["unmatched_supersession_rows"] == 11
          assert sum(report["continuity_states"].values()) == 365
          assert report["structural_only"] is True
          assert report["outcome_fields_read"] is False
          assert report["outcome_used_for_classification"] is False
          assert report["strategy_mutated"] is False
          assert report["diagnostic_only"] is True
          assert report["economic_candidate"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["fresh_holdout_claimed"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-nine-market-v3-wait5-late60-hypothesis-expiration-atlas-2y-v1-${{ github.sha }}
          path: atlas-output
          if-no-files-found: error
          retention-days: 90
