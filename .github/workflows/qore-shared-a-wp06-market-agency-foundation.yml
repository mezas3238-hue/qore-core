name: QORE Shared A WP06 Market Agency Foundation

concurrency:
  group: qore-shared-a-wp06-market-agency-foundation
  cancel-in-progress: false

on:
  push:
    branches:
      - agent/shared-a-cognitive-science-001
    paths:
      - src/qore/infrastructure/core_stack_v2/market_agency_model.py
      - tests/infrastructure/test_core_stack_v2_market_agency_model.py
      - .github/workflows/qore-shared-a-wp06-market-agency-foundation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate WP-06 research foundation
        run: |
          ruff check src/qore/infrastructure/core_stack_v2/market_agency_model.py tests/infrastructure/test_core_stack_v2_market_agency_model.py
          mypy src/qore/infrastructure/core_stack_v2/market_agency_model.py
          pytest -q tests/infrastructure/test_core_stack_v2_market_agency_model.py
