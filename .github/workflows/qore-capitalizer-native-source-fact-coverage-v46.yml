name: QORE Capitalizer Native Source Fact Coverage V46

on:
  push:
    branches:
      - agent/capitalizer-native-source-fact-coverage-v46-001
    paths:
      - '.github/workflows/qore-capitalizer-native-source-fact-coverage-v46.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_native_source_faithful_fact_coverage_v46.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_native_source_fact_remediation_v46.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_canonical_historical_replay_adapter_v46.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_native_source_provider_time_coverage_v46.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_native_source_faithful_fact_coverage_v46.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_native_source_fact_remediation_v46.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_canonical_historical_replay_adapter_v46.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_native_source_provider_time_coverage_v46.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-native-source-fact-coverage-v46-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  phase_a:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_native_source_faithful_fact_coverage_v46.py \
            src/qore/infrastructure/trader_lab/capitalizer_native_source_fact_remediation_v46.py \
            src/qore/infrastructure/trader_lab/capitalizer_canonical_historical_replay_adapter_v46.py \
            src/qore/infrastructure/trader_lab/capitalizer_native_source_provider_time_coverage_v46.py \
            tests/infrastructure/trader_lab/test_capitalizer_native_source_faithful_fact_coverage_v46.py \
            tests/infrastructure/trader_lab/test_capitalizer_native_source_fact_remediation_v46.py \
            tests/infrastructure/trader_lab/test_capitalizer_canonical_historical_replay_adapter_v46.py \
            tests/infrastructure/trader_lab/test_capitalizer_native_source_provider_time_coverage_v46.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_native_source_faithful_fact_coverage_v46.py \
            src/qore/infrastructure/trader_lab/capitalizer_native_source_fact_remediation_v46.py \
            src/qore/infrastructure/trader_lab/capitalizer_canonical_historical_replay_adapter_v46.py \
            src/qore/infrastructure/trader_lab/capitalizer_native_source_provider_time_coverage_v46.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_native_source_faithful_fact_coverage_v46.py \
            tests/infrastructure/trader_lab/test_capitalizer_native_source_fact_remediation_v46.py \
            tests/infrastructure/trader_lab/test_capitalizer_canonical_historical_replay_adapter_v46.py \
            tests/infrastructure/trader_lab/test_capitalizer_native_source_provider_time_coverage_v46.py
      - name: Run frozen V46 Phase A
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_native_source_faithful_fact_coverage_v46
      - name: Enforce Phase A governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(
              Path(
                  "audit-output/"
                  "capitalizer-native-source-faithful-fact-coverage-v46.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_NATIVE_SOURCE_FAITHFUL_FACT_COVERAGE_V46"
          )
          assert report["predeclaration_comment_id"] == 5883088393
          assert report["r1_predeclaration_comment_id"] == 5883167207
          assert report["r2_predeclaration_comment_id"] == 5883247470
          assert report["r3_predeclaration_comment_id"] == 5887860668
          assert report["canonical_historical_replay_adapter_status"] == "DETECTOR_READY"
          assert report["blocking_fact_count"] == 0
          assert report["blocking_facts"] == []
          assert report["phase_a_ready"] is True
          assert report["phase_b_authorized"] is True
          assert report["mandatory_fact_count"] == 26
          assert len(report["facts"]) == 26
          assert report["phase_b_executed"] is False
          assert report["strategy_economics_calculated"] is False
          assert report["provider_native_m1_economics_opened"] is False
          assert report["fixed_2r_used_as_canonical_target"] is False
          assert report["synthetic_asian_open_used"] is False
          assert report["synthetic_structural_target_used"] is False
          assert report["outcomes_used"] is False
          assert report["fresh_holdout_opened"] is False
          assert report["runtime_policy_candidate"] is False
          assert report["candidate_count"] == 0
          assert report["trader_certified"] is False
          print(json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-native-source-fact-coverage-v46-${{ github.sha }}
          path: audit-output
          if-no-files-found: error
          retention-days: 90

  phase_b_market:
    needs: phase_a
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {symbol: USDJPY, session: ASIA}
          - {symbol: AUDJPY, session: ASIA}
          - {symbol: AUDUSD, session: ASIA}
          - {symbol: GBPJPY, session: ASIA}
          - {symbol: EURUSD, session: LONDON}
          - {symbol: GBPUSD, session: LONDON}
          - {symbol: XAUUSD, session: NEW_YORK}
          - {symbol: USDCAD, session: NEW_YORK}
          - {symbol: NAS100, session: NEW_YORK}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable provider-native 10Y M1
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Run V46 Phase B market coverage
        env:
          SESSION: ${{ matrix.session }}
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_native_source_provider_time_coverage_v46 \
            market m1-source \
            --session "$SESSION" \
            --output phase-b-output
      - name: Enforce Phase B market governance
        env:
          SYMBOL: ${{ matrix.symbol }}
          SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol=os.environ["SYMBOL"]
          path=Path(
              "phase-b-output/"
              f"capitalizer-v46-phase-b-{symbol.lower()}-coverage.json"
          )
          report=json.loads(path.read_text())
          assert report["identity"] == (
              "QORE_CAPITALIZER_NATIVE_SOURCE_PROVIDER_TIME_COVERAGE_V46_PHASE_B"
          )
          assert report["predeclaration_comment_id"] == 5887937886
          assert report["symbol"] == symbol
          assert report["session"] == os.environ["SESSION"]
          assert len(report["period_rows"]) == 3
          for row in report["period_rows"]:
              assert row["source_run_id"] == 35548099334
              assert row["source_sha"] == (
                  "18c338aedd5013ce65a6cb6408ffbc2e904a6217"
              )
              assert row["provider_native_m1"] is True
              assert row["provider_timeframe_seconds"] == 60
              assert row["outcomes_read"] is False
              assert row["realized_r_read"] is False
              assert row["exit_read"] is False
              assert row["mae_mfe_read"] is False
              assert row["fixed_2r_used"] is False
              assert row["fresh_holdout_opened"] is False
              assert row["candidate_count"] == 0
              assert row["trader_certified"] is False
          assert report["strategy_economics_calculated"] is False
          assert report["fresh_holdout_opened"] is False
          assert report["candidate_count"] == 0
          assert report["trader_certified"] is False
          print(json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v46-phase-b-${{ matrix.symbol }}-${{ github.sha }}
          path: phase-b-output
          if-no-files-found: error
          retention-days: 90

  phase_b_aggregate:
    needs: phase_b_market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download current-run Phase B market reports
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v46-phase-b-*-${{ github.sha }}
          path: phase-b-markets
          merge-multiple: true
      - name: Aggregate frozen 27-row Phase B census
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_native_source_provider_time_coverage_v46 \
            aggregate phase-b-markets \
            --output phase-b-aggregate
      - name: Enforce Phase B aggregate governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(
              Path(
                  "phase-b-aggregate/"
                  "capitalizer-v46-phase-b-aggregate.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_NATIVE_SOURCE_PROVIDER_TIME_COVERAGE_V46_PHASE_B"
          )
          assert report["predeclaration_comment_id"] == 5887937886
          assert report["market_count"] == 9
          assert report["market_period_rows"] == 27
          assert len(report["rows"]) == 27
          assert report["phase_b_executed"] is True
          assert report["strategy_economics_calculated"] is False
          assert report["outcomes_read"] is False
          assert report["fresh_holdout_opened"] is False
          assert report["candidate_count"] == 0
          assert report["trader_certified"] is False
          expected=(
              "CANONICAL_FACT_COVERAGE_READY_FOR_SOURCE_FAITHFUL_ECONOMIC_REPLAY"
              if report["all_27_rows_passed"]
              else "CANONICAL_FACT_DATA_COVERAGE_BLOCKED"
          )
          assert report["next_phase"] == expected
          print(json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v46-phase-b-aggregate-${{ github.sha }}
          path: phase-b-aggregate
          if-no-files-found: error
          retention-days: 90
