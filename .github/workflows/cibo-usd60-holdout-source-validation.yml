name: QORE CIBO Legacy USD60 Holdout Quarantine

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Prove legacy holdout workflow cannot unseal burned data
        run: |
          set -euo pipefail
          mkdir -p holdout-lock
          python scripts/cibo_pre_holdout_gate.py \
            --output holdout-lock/pre-holdout-gate.json \
            > holdout-lock/pre-holdout-gate.stdout.json
          python - <<'PY'
          import json
          from pathlib import Path
          from qore.infrastructure.cibo_ce2i_holdout_registry import (
              BURNED_USD60_HOLDOUT_2017H1_V1,
              CURRENT_FRESH_USD60_HOLDOUT_CANDIDATE,
              candidate_is_burn_clean_for_all_lineages,
          )

          payload = json.loads(
              Path("holdout-lock/pre-holdout-gate.json").read_text()
          )
          assert candidate_is_burn_clean_for_all_lineages(
              BURNED_USD60_HOLDOUT_2017H1_V1
          ) is False
          assert payload["holdout_candidate_id"] == (
              CURRENT_FRESH_USD60_HOLDOUT_CANDIDATE.candidate_id
          )
          assert payload["authorized"] is False
          assert payload["status"] == "LOCKED_UNTOUCHED"
          assert payload["holdout_outcomes_inspected"] is False
          assert payload["holdout_market_data_read"] is False
          PY
      - name: Quality
        run: |
          ruff check \
            src/qore/infrastructure/cibo_ce2i_holdout_registry.py \
            src/qore/infrastructure/cibo_ce2i_pre_holdout_gate.py \
            scripts/cibo_pre_holdout_gate.py \
            tests/infrastructure/test_cibo_ce2i_holdout_registry.py \
            tests/infrastructure/test_cibo_ce2i_pre_holdout_gate.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_ce2i_holdout_registry.py \
            tests/infrastructure/test_cibo_ce2i_pre_holdout_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-legacy-holdout-quarantine-${{ github.sha }}
          path: holdout-lock
          if-no-files-found: error
          retention-days: 90
