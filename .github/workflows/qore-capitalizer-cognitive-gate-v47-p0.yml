name: QORE Capitalizer Cognitive Gate V47 P0

on:
  push:
    branches:
      - agent/capitalizer-cognitive-gate-v47-p0-001
    paths:
      - '.github/workflows/qore-capitalizer-cognitive-gate-v47-p0.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_cognitive_gate_historical_readiness_v47_p0.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_cognitive_gate_historical_readiness_v47_p0.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qore-capitalizer-cognitive-gate-v47-p0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_cognitive_gate_historical_readiness_v47_p0.py \
            tests/infrastructure/trader_lab/test_capitalizer_cognitive_gate_historical_readiness_v47_p0.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_cognitive_gate_historical_readiness_v47_p0.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_cognitive_gate_historical_readiness_v47_p0.py
      - name: Run frozen V47-P0 readiness audit
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cognitive_gate_historical_readiness_v47_p0
      - name: Enforce P0 governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(
              Path(
                  "audit-output/"
                  "capitalizer-cognitive-gate-historical-readiness-v47-p0.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_COGNITIVE_GATE_HISTORICAL_REPLAY_READINESS_V47_P0"
          )
          assert report["predeclaration_comment_id"] == 5889396977
          assert report["constant_pass_to_strategy_used"] is False
          assert report["strategy_economics_calculated"] is False
          assert report["outcomes_read"] is False
          assert report["fresh_holdout_opened"] is False
          assert report["candidate_count"] == 0
          assert report["trader_certified"] is False
          expected=(
              "COGNITIVE_GATE_HISTORICAL_REPLAY_READY"
              if report["historical_cognitive_gate_replay_ready"]
              else "COGNITIVE_GATE_HISTORICAL_REPLAY_BLOCKED_DO_NOT_FORCE_PASS"
          )
          assert report["next_phase"] == expected
          print(json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-cognitive-gate-v47-p0-${{ github.sha }}
          path: audit-output
          if-no-files-found: error
          retention-days: 90
