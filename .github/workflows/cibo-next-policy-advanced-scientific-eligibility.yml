name: QORE CIBO Next Policy Advanced Scientific Eligibility

on:
  push:
    branches:
      - agent/cibo-phase22-next-exam-governance-001
    paths:
      - 'src/qore/infrastructure/cibo_next_policy_advanced_scientific_eligibility.py'
      - 'src/qore/infrastructure/cibo_ce2i_full_surface.py'
      - 'tests/infrastructure/test_cibo_next_policy_advanced_scientific_eligibility.py'
      - 'tests/infrastructure/test_cibo_ce2i_full_surface.py'
      - '.github/workflows/cibo-next-policy-advanced-scientific-eligibility.yml'

permissions:
  contents: read

jobs:
  eligibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Static quality
        run: |
          python -m ruff check \
            src/qore/infrastructure/cibo_next_policy_advanced_scientific_eligibility.py \
            src/qore/infrastructure/cibo_ce2i_full_surface.py \
            tests/infrastructure/test_cibo_next_policy_advanced_scientific_eligibility.py \
            tests/infrastructure/test_cibo_ce2i_full_surface.py
      - name: Preserve V2 default and prove next-policy filter
        run: |
          python -m pytest -q \
            tests/infrastructure/test_cibo_next_policy_advanced_scientific_eligibility.py \
            tests/infrastructure/test_cibo_ce2i_full_surface.py \
            tests/infrastructure/test_cibo_ce2i_regime_selector.py
