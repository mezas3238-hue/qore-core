name: QORE Scalper A1 Second M1 Protected Pivot Native Nine Markets V3

on:
  push:
    branches: [agent/scalper-architect-a-cognition-20261010]
    paths:
      - '.github/workflows/qore-scalper-a1-second-m1-protected-pivot-nine-market-v3.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_a1_m1_second_pivot_forensics_v3.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_a1_m1_second_pivot_forensics_v3.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  V49_RUN: '38053946695'
  V49_SHA: 'e356e7a52541e99533b25ecfef0ab9c4e9ce03c0'
  M1_RUN: '35548099334'
  M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'
  PRIOR_V2_RUN: '38083508578'
  PRIOR_V2_SHA: '2f621b7e536c9d2f3610700b4b418ed5fcd38382'

jobs:
  causal_quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Validate second M1 structural pivot causal invariants
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_a1_m1_second_pivot_forensics_v3.py tests/infrastructure/trader_lab/test_capitalizer_a1_m1_second_pivot_forensics_v3.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_a1_m1_second_pivot_forensics_v3.py tests/infrastructure/trader_lab/test_capitalizer_a1_m1_second_pivot_forensics_v3.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_a1_m1_second_pivot_forensics_v3.py

  market:
    needs: causal_quality
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        symbol: [USDJPY, AUDJPY, AUDUSD, GBPJPY, EURUSD, GBPUSD, XAUUSD, USDCAD, NAS100]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: scalper-a2-v49-control-${{ matrix.symbol }}-${{ env.V49_SHA }}
          path: original-v49
          github-token: ${{ github.token }}
          run-id: ${{ env.V49_RUN }}
      - uses: actions/download-artifact@v4
        with:
          name: scalper-a1-m1-route-protected-${{ matrix.symbol }}-${{ env.PRIOR_V2_SHA }}
          path: prior-v2
          github-token: ${{ github.token }}
          run-id: ${{ env.PRIOR_V2_RUN }}
      - uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.M1_SHA }}
          path: provider-native-m1
          github-token: ${{ github.token }}
          run-id: ${{ env.M1_RUN }}
      - name: Search ALL source-time earlier and later structurally confirmed M1 swings
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_a1_m1_second_pivot_forensics_v3 market provider-native-m1 original-v49 prior-v2 forensic
      - name: Reconcile source book, physical as-of and no hidden trade gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("forensic/scalper-a1-second-pivot-market-summary.json").read_text())
          assert d["source_count"]==d["reconciled_source_ids"]>0
          assert d["source_entries_changed"]==d["added_trade_vetoes"]==0
          assert d["full_master_frame_replayed"] is False and d["certified"] is False
          print("SECOND PIVOT PHYSICAL AUDIT:",json.dumps(d,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-a1-second-m1-pivot-${{ matrix.symbol }}-${{ github.sha }}
          path: forensic/
          retention-days: 90
          if-no-files-found: error

  nine_market_review:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: scalper-a1-second-m1-pivot-*-${{ github.sha }}
          path: per-market-reviews
          merge-multiple: false
      - name: Preserve 2876 source IDs and 1885 preceding intact proofs
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_a1_m1_second_pivot_forensics_v3 matrix per-market-reviews summary
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-a1-second-native-m1-pivot-summary-${{ github.sha }}
          path: summary/
          retention-days: 90
          if-no-files-found: error
