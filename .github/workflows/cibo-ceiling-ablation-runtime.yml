name: QORE CIBO Ceiling Ablation Runtime

on:
  push:
    branches:
      - agent/cibo-ceiling-ablation-sensors-001
    paths:
      - '.github/workflows/cibo-ceiling-ablation-runtime.yml'
      - 'scripts/cibo_single_account_historical_ceiling_replay.py'
      - 'src/qore/infrastructure/cibo_ceiling_ablation.py'
      - 'src/qore/infrastructure/cibo_economic_engine_wiring.py'
      - 'src/qore/infrastructure/cibo_sovereign_capital_runtime.py'
      - 'src/qore/infrastructure/cibo_native_sovereign_capital_runtime.py'
      - 'src/qore/infrastructure/cibo_single_account_sovereign_ceiling_executor.py'
      - 'src/qore/infrastructure/cibo_single_account_historical_ceiling_epoch.py'
      - 'src/qore/infrastructure/cibo_single_account_historical_ceiling_replay.py'
      - 'tests/infrastructure/test_cibo_ceiling_ablation_runtime.py'
      - 'tests/infrastructure/test_cibo_sovereign_capital_runtime_contract.py'
      - 'tests/infrastructure/test_cibo_single_account_sovereign_ceiling_executor.py'
      - 'tests/infrastructure/test_cibo_single_account_historical_ceiling_epoch.py'
      - 'tests/infrastructure/test_cibo_single_account_historical_ceiling_replay.py'

permissions:
  contents: read

concurrency:
  group: qore-cibo-ceiling-ablation-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-ablation-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile and lint
        run: |
          set -euo pipefail
          python -m py_compile             scripts/cibo_single_account_historical_ceiling_replay.py             src/qore/infrastructure/cibo_ceiling_ablation.py             src/qore/infrastructure/cibo_economic_engine_wiring.py             src/qore/infrastructure/cibo_sovereign_capital_runtime.py             src/qore/infrastructure/cibo_native_sovereign_capital_runtime.py             src/qore/infrastructure/cibo_single_account_sovereign_ceiling_executor.py             src/qore/infrastructure/cibo_single_account_historical_ceiling_epoch.py             src/qore/infrastructure/cibo_single_account_historical_ceiling_replay.py
          ruff check             scripts/cibo_single_account_historical_ceiling_replay.py             src/qore/infrastructure/cibo_ceiling_ablation.py             src/qore/infrastructure/cibo_economic_engine_wiring.py             src/qore/infrastructure/cibo_sovereign_capital_runtime.py             src/qore/infrastructure/cibo_native_sovereign_capital_runtime.py             src/qore/infrastructure/cibo_single_account_sovereign_ceiling_executor.py             src/qore/infrastructure/cibo_single_account_historical_ceiling_epoch.py             src/qore/infrastructure/cibo_single_account_historical_ceiling_replay.py             tests/infrastructure/test_cibo_ceiling_ablation_runtime.py
      - name: Test ablation contracts
        run: |
          set -euo pipefail
          pytest -q --no-cov             tests/infrastructure/test_cibo_ceiling_ablation_runtime.py             tests/infrastructure/test_cibo_sovereign_capital_runtime_contract.py             tests/infrastructure/test_cibo_single_account_sovereign_ceiling_executor.py             tests/infrastructure/test_cibo_single_account_historical_ceiling_epoch.py             tests/infrastructure/test_cibo_single_account_historical_ceiling_replay.py
