name: QORE Capitalizer Cognitive Perception Bars Complete Binding 2R V2

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-cognitive-perception-bars-complete-binding-2r-v2.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_cognitive_perception_bars_complete_binding_2r_v2.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_cognitive_perception_bars_complete_binding_2r_v2.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-cognitive-perception-bars-complete-binding-2r-v2-${{ github.sha }}
  cancel-in-progress: false

env:
  PERCEPTION_RUN_ID: '36087252085'
  PERCEPTION_SHA: 'f28bf5238d84a1b5ea3bd61d2598ce465a537456'
  BAR_RUN_ID: '36174145194'
  BAR_SHA: '0595c3b9e22c381aba04a5c69ea9eb97065b6aa8'
  TICK_RUN_ID: '36175205910'
  TICK_SHA: 'b93efffd04c844957f5042c9cf021dc527d534fb'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check             src/qore/infrastructure/trader_lab/capitalizer_cognitive_perception_bars_complete_binding_2r_v2.py             tests/infrastructure/trader_lab/test_capitalizer_cognitive_perception_bars_complete_binding_2r_v2.py
      - name: Mypy
        run: |
          mypy             src/qore/infrastructure/trader_lab/capitalizer_cognitive_perception_bars_complete_binding_2r_v2.py
      - name: Focused tests
        run: |
          pytest -q --no-cov             tests/infrastructure/trader_lab/test_capitalizer_cognitive_perception_bars_complete_binding_2r_v2.py

  audit:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download frozen Perception V1
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cognitive-perception-evidence-binding-audit-2r-v1-${{ env.PERCEPTION_SHA }}
          path: perception-input
          github-token: ${{ github.token }}
          run-id: ${{ env.PERCEPTION_RUN_ID }}
      - name: Download nine historical bar-completeness ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-cognitive-historical-bar-completeness-audit-2r-v1-*-${{ env.BAR_SHA }}
          path: bar-input
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.BAR_RUN_ID }}
      - name: Download provider tick absence resolution
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-provider-absence-tick-revalidation-2r-v1-${{ env.TICK_SHA }}
          path: tick-input
          github-token: ${{ github.token }}
          run-id: ${{ env.TICK_RUN_ID }}
      - name: Build Perception bars-complete V2
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cognitive_perception_bars_complete_binding_2r_v2             perception-input bar-input tick-input perception-v2-output
      - name: Enforce Perception V2 controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "perception-v2-output/"
                  "capitalizer-cognitive-perception-bars-complete-binding-2r-v2.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_COGNITIVE_PERCEPTION_BARS_COMPLETE_BINDING_2R_V2"
          )
          assert report["source_perception_run_id"] == 36087252085
          assert report["source_bar_run_id"] == 36174145194
          assert report["target_r"] == "2.00"
          assert report["control_trades"] == 948
          assert report["bars_complete_state_counts"] == {
              "SUPPORTED_TRUE": 948,
              "SUPPORTED_FALSE": 0,
              "UNBOUND": 0,
          }
          assert report["bars_complete_source_counts"] == {
              "HISTORICAL_NATIVE_M1_CONTIGUOUS": 946,
              "PROVIDER_BID_ASK_NO_TICKS": 2,
          }
          assert report["known_hard_integrity_failure_trades"] == 0
          assert report["fully_known_integrity_except_quote_fresh_trades"] == 948
          assert report["bars_complete_evidence_bound"] is True
          assert report["quote_fresh_evidence_bound"] is False
          assert report["runtime_perception_assessor_called"] is False
          assert report["full_perception_status_supported_trades"] == 0
          assert report["provider_tick_resolution_used"] is True
          assert report["provider_tick_all_absences_explained"] is True
          assert report["unknown_evidence_coerced_to_false"] is False
          assert report["current_trade_outcome_visible_to_binding"] is False
          assert report["missing_evidence_fabricated"] is False
          assert report["perception_v1_control_reproduced"] is True
          assert report["strategy_rules_changed"] is False
          assert report["cognitive_rules_changed"] is False
          assert report["entry_changed"] is False
          assert report["stop_changed"] is False
          assert report["target_changed"] is False
          assert report["max3_changed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-cognitive-perception-bars-complete-binding-2r-v2-${{ github.sha }}
          path: perception-v2-output
          if-no-files-found: error
          retention-days: 90
