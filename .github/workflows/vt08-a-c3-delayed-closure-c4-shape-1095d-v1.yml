name: VT08 A C3 Delayed Closure C4 Causal Shape 1095D V1

on:
  push:
    branches:
      - agent/vt08-5m-methodology-source-20261010
    paths:
      - .github/workflows/vt08-a-c3-delayed-closure-c4-shape-1095d-v1.yml
      - src/qore/infrastructure/trader_lab/vt08_5m_c3_delayed_closure_c4_shape_census_v1.py
      - tests/infrastructure/trader_lab/test_vt08_5m_c3_delayed_closure_c4_shape_census_v1.py
      - src/qore/infrastructure/trader_lab/vt08_5m_ttrades_c2_c3_source_eq_range_v1.py
      - tests/infrastructure/trader_lab/test_vt08_5m_ttrades_c2_c3_source_eq_range_v1.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  causal-c3-c4-shape:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        symbol: [EURJPY, USDCHF, NZDUSD, CADJPY, USDCAD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Ruff tests C3 closure causality DST and C4 EQ
        run: |
          ruff check src/qore/infrastructure/trader_lab/vt08_5m_c3_delayed_closure_c4_shape_census_v1.py tests/infrastructure/trader_lab/test_vt08_5m_c3_delayed_closure_c4_shape_census_v1.py src/qore/infrastructure/trader_lab/vt08_5m_ttrades_c2_c3_source_eq_range_v1.py tests/infrastructure/trader_lab/test_vt08_5m_ttrades_c2_c3_source_eq_range_v1.py
          python -m compileall -q src/qore/infrastructure/trader_lab/vt08_5m_c3_delayed_closure_c4_shape_census_v1.py
          pytest -q tests/infrastructure/trader_lab/test_vt08_5m_c3_delayed_closure_c4_shape_census_v1.py tests/infrastructure/trader_lab/test_vt08_5m_ttrades_c2_c3_source_eq_range_v1.py
      - uses: actions/download-artifact@v4
        with:
          name: qore-vt08-cognitive-5m-fresh-${{ matrix.symbol }}-b2d33e1b4829d8b4afc76983decca8a99131403c
          path: evidence/${{ matrix.symbol }}
          github-token: ${{ github.token }}
          run-id: 35934924907
      - name: Five markets C3 completed H4 shapes ONLY without PnL
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from qore.infrastructure.trader_lab.vt08_5m_c3_delayed_closure_c4_shape_census_v1 import evaluate
          symbol = os.environ["SYMBOL"]
          result = evaluate(Path(f"evidence/{symbol}/market-evidence-1095d.json"))
          Path(f"artifacts/{symbol}-c3-c4-shapes-full.json").write_text(
              json.dumps(result, sort_keys=True, separators=(",", ":")),
              encoding="utf-8",
          )
          summary = {key: result[key] for key in (
              "schema", "market", "source_sha", "stage_counts", "failure_counts",
              "by_year_stage_counts", "source_poi_confirmed", "c4_orders_authorized",
              "cognitive_feature_provenance_complete", "trades_executed",
              "pnl_evaluated", "seven_year_sealed_accessed",
          )}
          Path(f"artifacts/{symbol}-c3-c4-summary.json").write_text(
              json.dumps(summary, sort_keys=True, indent=2), encoding="utf-8",
          )
          print(json.dumps(summary, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vt08-a-c3-closure-c4-shapes-${{ matrix.symbol }}-${{ github.sha }}
          path: artifacts/*
          retention-days: 30
          if-no-files-found: error
