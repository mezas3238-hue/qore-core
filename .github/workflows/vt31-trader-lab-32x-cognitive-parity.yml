name: VT31 Trader Lab Native 32x Cognitive Timewarp No PnL
on:
  push:
    branches:
      - agent/vt31-trader-lab-fast-forward-cognition-parity-20261015
    paths:
      - 'scripts/vt31_original_cog_trader_lab_fast_forward_20261015.py'
      - 'tests/infrastructure/test_vt31_original_cog_trader_lab_fast_forward_20261015.py'
      - 'tests/infrastructure/trader_lab/test_vt31_trader_lab_native_32x_qualification_synthetic_20261015.py'
      - 'docs/research/VT31_TRADER_LAB_FAST_FORWARD_QUALITATIVE_COG_PARITY_PREREG_2026-10-15.md'
      - '.github/workflows/vt31-trader-lab-32x-cognitive-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vt31-g3-original-fast-forward-cognition:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pre-code prereg and G3 original code blobs intact
        run: |
          set -euo pipefail
          git cat-file -t 245f26d0ba4e2125924966b1c927e20f364d0bb1
          git merge-base --is-ancestor 245f26d0ba4e2125924966b1c927e20f364d0bb1 HEAD
          test "$(git hash-object src/qore/infrastructure/traders/vt31_ict_cleanroom/cognition.py)" = d0ab4c15d6e9d24e53224d27bdb2cd96af914fb9
          test "$(git hash-object src/qore/infrastructure/traders/vt31_ict_cleanroom/operations.py)" = 0ce9707314aecb71155de8b57044b6ec028847b2
          test "$(git hash-object docs/research/VT31_G3_DECISION_METODOLOGICA_STOP_FRAMEWORK_FVG_EXIT_V1_2026-10-12.md)" = e99c70b4e018d626fb620d9a21b9314a51abc36d
      - name: Run native Trader Lab 32x contract and G3 original cognition parity
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]' pytest-xdist
          ruff check scripts/vt31_original_cog_trader_lab_fast_forward_20261015.py tests/infrastructure/test_vt31_original_cog_trader_lab_fast_forward_20261015.py tests/infrastructure/trader_lab/test_vt31_trader_lab_native_32x_qualification_synthetic_20261015.py
          python -m py_compile scripts/vt31_original_cog_trader_lab_fast_forward_20261015.py
          mkdir -p evidence
          PYTHONPATH=src:. pytest -q -n 4 -o addopts='' \
            tests/infrastructure/trader_lab/test_vt31_trader_lab_native_32x_qualification_synthetic_20261015.py \
            tests/infrastructure/test_vt31_original_cog_trader_lab_fast_forward_20261015.py \
            tests/infrastructure/trader_lab/test_fast_forward.py \
            tests/infrastructure/test_vt31_original_g3_cog_short_sessions_qualitative_20261015.py \
            tests/infrastructure/test_vt31_original_g3_nypm_cognition_qualitative_20261015.py \
            tests/infrastructure/test_vt31_m0_profile_shadow_attestation_20261015.py \
            tests/infrastructure/test_vt31_ict_cleanroom_cognition.py \
            --junitxml=evidence/junit.xml | tee evidence/tests.txt
          PYTHONPATH=src:. python scripts/vt31_original_cog_trader_lab_fast_forward_20261015.py \
            --out evidence/VT31_G3_TRADERLAB_NATIVE_32X_QUALITATIVE_PARITY.json \
            | tee evidence/summary.json
      - name: Certified schedule parity ONLY not methodology/cognition/Lab L3
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open("evidence/VT31_G3_TRADERLAB_NATIVE_32X_QUALITATIVE_PARITY.json"))
          assert p["prereg_commit"]=="245f26d0ba4e2125924966b1c927e20f364d0bb1"
          assert p["cog_original_sha"]["git_blob_sha1"]=="d0ab4c15d6e9d24e53224d27bdb2cd96af914fb9"
          assert p["actual_native_trader_lab_schedule_used"] is True
          assert p["all_trace_parity"] is True and len(p["cases"])==12
          for x in p["cases"]:
              assert x["normal_1x"]==x["traderlab_simulated_32x"]
              assert x["native_schedule_acceleration_factor"]==32
              assert x["normal_simulated_elapsed_microseconds"]==32*x["accelerated_wall_advance_microseconds"]
              assert x["normal_1x"]["cog_original_traces"][0]["action"]=="WAIT"
              assert x["parity_by_canonical_trace_and_source_sha256"]
              assert not x["real_traderlab_candidate_L3_certified"]
              assert not x["methodology_certified"] and not x["cognition_certified"]
          assert p["native_l3_real_candidate_qualified"] is False
          assert p["speedup_measured_CPU"] is False
          assert p["methodology_certified"] is False and p["cognition_certified"] is False
          assert p["human_cog_ops_signatures_verified"] is False
          assert p["economic_backtest_done"] is False and p["return_pf_dd_sharpe_sortino"] is None
          assert p["broker_orders"]==p["sizing"]==0 and not p["live"]
          print("TRADER_LAB_NATIVE_32X_COG_PARITY_PASS_NO_AUTO_CERTIFICATION")
          PY
          git rev-parse HEAD > evidence/commit_sha.txt
          printf '%s\n' 245f26d0ba4e2125924966b1c927e20f364d0bb1 > evidence/prereg_sha.txt
          printf '%s\n' 'NATIVE_TRADERLAB_SIMULATED_32X_NO_SPEED_CLAIM_NO_PNL_NO_L3' > evidence/scope.txt
          (cd evidence && sha256sum *.json *.xml *.txt > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: vt31-trader-lab-native-32x-cog-parity-${{ github.sha }}
          path: evidence/
          retention-days: 90
          if-no-files-found: error
