name: QORE VT31 NAS100 Intelligence V2A

on:
  push:
    branches:
      - agent/vt31-nas100-intelligence-pilot-001
    paths:
      - scripts/vt31_nas100_intelligence_v2a.py
      - .github/workflows/vt31-nas100-intelligence-v2a.yml
  pull_request:
    paths:
      - scripts/vt31_nas100_intelligence_v2a.py
      - .github/workflows/vt31-nas100-intelligence-v2a.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  v2a-fold:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - partition: r8_fresh
            artifact_id: 10523467443
            digest: 81e4d0f4dcbdfa68d88f025f26789162c8c49c097e93844a2032dd225581f297
          - partition: r6
            artifact_id: 10523433888
            digest: 59123e3f8a8a128448f158cb798b15abfd1b683efdff7435973024fca8f99b9f
          - partition: r5
            artifact_id: 10523314097
            digest: 4050271b86fa04d866ffd557056c32d5a563f583be2e288244d2f23c93d8abe3
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PARTITION: ${{ matrix.partition }}
      SOURCE_ARTIFACT_ID: ${{ matrix.artifact_id }}
      SOURCE_DIGEST: ${{ matrix.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research runtime
        run: pip install -e .[dev]

      - name: Static validation
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_intelligence_v2a.py
          ruff check scripts/vt31_nas100_intelligence_v2a.py

      - name: Recover immutable Market State V2 fold
        run: |
          set -euo pipefail
          digest="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}" --jq .digest)"
          test "$digest" = "sha256:${SOURCE_DIGEST}"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" > source.zip
          echo "${SOURCE_DIGEST}  source.zip" | sha256sum -c -
          mkdir source
          unzip -q source.zip -d source
          (cd source && sha256sum -c SHA256SUMS)
          test -f "source/vt31-nas100-market-state-v2-${PARTITION}.json"

      - name: Run V2A sequence-freshness ablation
        run: |
          set -euo pipefail
          mkdir result
          python scripts/vt31_nas100_intelligence_v2a.py             --input "source/vt31-nas100-market-state-v2-${PARTITION}.json"             --output "result/vt31-nas100-intelligence-v2a-${PARTITION}.json"             | tee result/summary.json

      - name: Governance validation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          partition = os.environ["PARTITION"]
          payload = json.loads(
              Path(f"result/vt31-nas100-intelligence-v2a-{partition}.json").read_text()
          )
          assert payload["research_only"] is True
          assert payload["candidate_frozen"] is False
          assert payload["opens_new_holdout"] is False
          assert payload["live_authorized"] is False
          assert payload["production_authorized"] is False
          contract = payload["causal_contract"]
          assert contract["bucket_predeclared_before_economic_read"] is True
          assert contract["date_level_outcome_lookup"] is False
          assert contract["future_bar_lookup"] is False
          assert contract["post_outcome_runtime_access"] is False
          assert contract["stop_changed"] is False
          assert contract["target_changed"] is False
          assert contract["management_changed"] is False
          print("VT31_NAS100 V2A governance PASS")
          PY

      - name: Bind immutable result
        run: |
          set -euo pipefail
          echo "${GITHUB_SHA}" > result/git-sha.txt
          echo "source-market-state-run=35284479467" > result/source-run.txt
          echo "${SOURCE_ARTIFACT_ID} sha256:${SOURCE_DIGEST}" > result/source-artifact.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-intelligence-v2a-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
