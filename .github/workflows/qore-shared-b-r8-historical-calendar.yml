name: QORE Shared B R8 Historical Calendar Boundary

on:
  push:
    branches:
      - agent/shared-b-global-world-perception-001
    paths:
      - docs/shared/evidence/SHARED_B_R8_HISTORICAL_CALENDAR_AUTHORITY_EVIDENCE_001.json
      - src/qore/infrastructure/core_stack_v2/shared_b_r8_historical_calendar.py
      - scripts/shared_b_r8_historical_calendar.py
      - tests/infrastructure/test_shared_b_r8_historical_calendar.py
      - .github/workflows/qore-shared-b-r8-historical-calendar.yml
  workflow_dispatch:

concurrency:
  group: qore-shared-b-r8-historical-calendar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  B07_RUN_ID: "36782105126"
  B07_ARTIFACT_ID: "11128361589"
  B07_GIT_SHA: "512a007e1ba72e97bea397906b99423d6469bca6"
  R8_MANIFEST_ARTIFACT_ID: "10982052296"
  R8_MANIFEST_PRODUCER_SHA: "99e60783fb270c40ae23805fbb3d16ae76d9c4f2"
  R8_MANIFEST_SHA256: "2f18b9f11d5893effa46ac85c712edd6646d1d90a9de521b235143e42155d191"

jobs:
  historical-calendar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Shared
        run: pip install -e ".[dev]"

      - name: Validate R8 historical calendar reducer
        run: |
          set -euo pipefail
          ruff check \
            src/qore/infrastructure/core_stack_v2/shared_b_r8_historical_calendar.py \
            scripts/shared_b_r8_historical_calendar.py \
            tests/infrastructure/test_shared_b_r8_historical_calendar.py
          mypy \
            src/qore/infrastructure/core_stack_v2/shared_b_r8_historical_calendar.py \
            scripts/shared_b_r8_historical_calendar.py
          pytest -q tests/infrastructure/test_shared_b_r8_historical_calendar.py

      - name: Verify sealed B-07 worklist lineage
        run: |
          set -euo pipefail
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${B07_RUN_ID}" --jq '.status')" = "completed"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${B07_RUN_ID}" --jq '.conclusion')" = "success"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${B07_RUN_ID}" --jq '.head_sha')" = "$B07_GIT_SHA"

      - name: Recover sealed B-07 and R8 inputs
        run: |
          set -euo pipefail
          mkdir -p input/b07 input/r8 result

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${B07_ARTIFACT_ID}/zip" > b07.zip
          unzip -q b07.zip -d input/b07
          (cd input/b07 && sha256sum -c SHA256SUMS)
          b07_file="$(find input/b07 -name shared-b-canonical-calendar-worklist.json -print -quit)"
          test -n "$b07_file"

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${R8_MANIFEST_ARTIFACT_ID}/zip" > r8.zip
          unzip -q r8.zip -d input/r8
          (cd input/r8 && sha256sum -c SHA256SUMS)
          test "$(cat input/r8/git-sha.txt)" = "$R8_MANIFEST_PRODUCER_SHA"
          r8_file="$(find input/r8 -name wp05-v12-r8-tick-acquisition-manifest.json -print -quit)"
          test -n "$r8_file"

          printf 'B07_FILE=%s\n' "$b07_file" >> "$GITHUB_ENV"
          printf 'R8_FILE=%s\n' "$r8_file" >> "$GITHUB_ENV"

      - name: Verify exact frozen R8 horizon
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p=json.loads(Path(os.environ["R8_FILE"]).read_text())
          assert p["identity"] == (
              "QORE_SHARED_WP05_ACTIVE_PERCEPTION_V12_ACQUISITION_MANIFEST_001"
          )
          assert p["manifest_sha256"] == os.environ["R8_MANIFEST_SHA256"]
          assert p["source_min"] == "2016-04-20T14:00:00.000000+00:00"
          assert p["source_max"] == "2018-05-18T19:30:00.000000+00:00"
          assert len(p["windows"]) == 2948
          assert p["target_or_outcome_used_for_selection"] is False
          assert p["fresh_holdout_opened"] is False
          PY

      - name: Build R8 historical calendar frontier
        run: |
          python scripts/shared_b_r8_historical_calendar.py \
            --calendar-worklist "$B07_FILE" \
            --r8-manifest "$R8_FILE" \
            --authority-evidence docs/shared/evidence/SHARED_B_R8_HISTORICAL_CALENDAR_AUTHORITY_EVIDENCE_001.json \
            --output result/shared-b-r8-historical-calendar-frontier.json \
            | tee result/summary.json

      - name: Enforce honest partial historical closure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(
              Path(
                  "result/shared-b-r8-historical-calendar-frontier.json"
              ).read_text()
          )
          assert p["sensor_count"] == 177
          assert p["r8_historical_session_schedule_verified_count"] == 1
          assert p["r8_historical_holiday_calendar_verified_count"] == 0
          assert p["canonical_calendar_verified_count"] == 0
          assert p["calendar_binding_verified_count"] == 0
          assert p["current_schedule_backfilled_into_r8"] is False
          assert p["relational_comparability_authorized"] is False
          assert p["fresh_holdout_opened"] is False
          assert p["productive_authority"] is False
          assert p["b07_complete"] is False
          assert p["b08_complete"] is False
          PY

      - name: Seal B-07 R8 historical calendar evidence
        run: |
          printf '%s\n' "$GITHUB_SHA" > result/code-git-sha.txt
          printf '%s\n' "$GITHUB_RUN_ID" > result/run-id.txt
          sha256sum \
            docs/shared/evidence/SHARED_B_R8_HISTORICAL_CALENDAR_AUTHORITY_EVIDENCE_001.json \
            > result/authority-evidence-sha256.txt
          (
            cd result
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
              | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload B-07 R8 historical calendar evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: qore-shared-b-r8-historical-calendar-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Report B-07 historical calendar frontier
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          gh issue comment 638 --repo "$GITHUB_REPOSITORY" --body "Architect B B-07 R8 historical calendar frontier: run ${GITHUB_RUN_ID}, SHA ${GITHUB_SHA}, artifact ${ARTIFACT_ID}. Frozen R8 horizon is 2016-04-20 through 2018-05-18. JP225/Nikkei 225 now has an official historical session schedule binding for R8 (09:00-11:30 and 12:30-15:00 JST; 5-second index calculation), while the exact 2016-2018 holiday/exception calendar remains OPEN. No current schedule was backfilled, canonical calendar bindings remain 0/177, and relational authority remains CLOSED."
