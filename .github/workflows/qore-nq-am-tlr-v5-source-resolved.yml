name: QORE NQ AM TLR V5 Source-Resolved USTEC 1Y

on:
  workflow_dispatch:
  push:
    branches:
      - agent/nq-am-temporal-liquidity-reversal-v1-001
    paths:
      - '.github/workflows/qore-nq-am-tlr-v5-source-resolved.yml'
      - 'src/qore/infrastructure/trader_lab/nq_am_tlr_v5_source_resolved.py'
      - 'tests/infrastructure/trader_lab/test_nq_am_tlr_v5_source_resolved.py'
      - 'docs/research/QORE-NQ-AM-TLR-V5-SOURCE-RESOLVED-FREEZE.md'

concurrency:
  group: qore-nq-am-tlr-v5-source-resolved-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  QORE_USTEC_SOURCE_RUN_ID: '34981033027'
  QORE_USTEC_SOURCE_ARTIFACT_ID: '10402199719'
  QORE_USTEC_NAS100_SHA256: '4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check --ignore B009 \
            src/qore/infrastructure/trader_lab/nq_am_tlr_v5_source_resolved.py \
            tests/infrastructure/trader_lab/test_nq_am_tlr_v5_source_resolved.py
      - name: Mypy
        run: |
          mypy src/qore/infrastructure/trader_lab/nq_am_tlr_v5_source_resolved.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_nq_am_tlr_v5_source_resolved.py
      - name: Freeze assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          freeze = Path(
              'docs/research/QORE-NQ-AM-TLR-V5-SOURCE-RESOLVED-FREEZE.md'
          ).read_text()
          module = Path(
              'src/qore/infrastructure/trader_lab/'
              'nq_am_tlr_v5_source_resolved.py'
          ).read_text()

          assert 'Monday-only' in freeze
          assert 'No opening M2 hard gate' in freeze
          assert 'No 2SD-distance hard gate' in freeze
          assert 'No 12:00 expiry' in freeze
          assert 'QORE_INFERRED' in freeze
          assert 'SOURCE_UNDEFINED' in freeze
          assert 'IDENTITY = "QORE_NQ_AM_TLR_V5_SOURCE_RESOLVED_001"' in module
          assert 'EVAL_OPEN_NY = date(2016, 4, 20)' in module
          assert 'EVAL_CLOSE_NY = date(2017, 4, 20)' in module
          for flag in (
              'DEMO_ELIGIBLE=false',
              'LIVE_AUTHORIZED=false',
              'REAL_CAPITAL_AUTHORIZED=false',
              'PRODUCTION_AUTHORIZED=false',
          ):
              assert flag in freeze
          PY

  source-resolved-study:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install QORE research runtime
        run: python -m pip install -e .
      - name: Download immutable Core USTEC holdout
        uses: actions/download-artifact@v4
        with:
          name: qore-vt31-r8-fresh-validation-3e9efe7b47f645558926fb1c6f1dc32fe45f50d9
          path: source
          github-token: ${{ github.token }}
          run-id: 34981033027
      - name: Bind exact evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/v5
          test -f source/fresh/NAS100/market-evidence.json
          echo "$QORE_USTEC_NAS100_SHA256  source/fresh/NAS100/market-evidence.json" \
            | sha256sum -c -
          cp source/fresh/NAS100/market-evidence.json artifacts/v5/ustec-holdout.json
      - name: Run source-resolved one-year study
        run: |
          python -m qore.infrastructure.trader_lab.nq_am_tlr_v5_source_resolved \
            artifacts/v5/ustec-holdout.json artifacts/v5/study \
            | tee artifacts/v5/study-stdout.json
      - name: Enforce source authority separation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(Path('artifacts/v5/study/summary.json').read_text())
          assert p['scope'] == 'MONDAY_SOURCE_REPLAY_ONLY'
          assert p['inferred_2sd_has_source_authority'] is False
          assert p['source_stop_defined'] is False
          assert p['source_expiry_defined'] is False
          assert p['diagnostic_selection_authority'] is False
          assert p['demo_eligible'] is False
          assert p['live_authorized'] is False
          assert p['real_capital_authorized'] is False
          assert p['production_authorized'] is False
          print(json.dumps(p, indent=2, sort_keys=True))
          PY
      - name: Bind immutable result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/v5
          printf '%s\n' "$GITHUB_SHA" > artifacts/v5/git-sha.txt
          printf '%s\n' "$QORE_USTEC_SOURCE_RUN_ID" > artifacts/v5/source-run-id.txt
          printf '%s\n' "$QORE_USTEC_SOURCE_ARTIFACT_ID" > artifacts/v5/source-artifact-id.txt
          printf '%s\n' "$QORE_USTEC_NAS100_SHA256" > artifacts/v5/source-evidence-sha256.txt
          sha256sum \
            src/qore/infrastructure/trader_lab/nq_am_tlr_v5_source_resolved.py \
            docs/research/QORE-NQ-AM-TLR-V5-SOURCE-RESOLVED-FREEZE.md \
            > artifacts/v5/input-sha256.txt
          if [ -f artifacts/v5/ustec-holdout.json ]; then
            sha256sum artifacts/v5/ustec-holdout.json >> artifacts/v5/input-sha256.txt
          fi
          find artifacts/v5 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > artifacts/v5/SHA256SUMS.txt
      - name: Upload V5 source-resolved result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qore-nq-am-tlr-v5-source-resolved-${{ github.sha }}
          path: artifacts/v5
          if-no-files-found: error
          retention-days: 90
