name: QORE CIBO Trader Lab Phase 3 CE2I Audit

on:
  push:
    branches:
      - agent/cibo-profitability-lab-001
    paths:
      - '.github/workflows/cibo-trader-lab-phase3-ce2i-audit.yml'
      - 'scripts/cibo_trader_lab_phase3_ce2i_audit.py'
      - 'src/qore/infrastructure/cibo_ce2i_advanced_capital_tools.py'
      - 'src/qore/infrastructure/cibo_ce2i_economic_effects.py'
      - 'src/qore/infrastructure/cibo_ce2i_full_surface.py'
      - 'src/qore/infrastructure/cibo_ce2i_tool_registry.py'
      - 'src/qore/infrastructure/cibo_phase22_v4_chronological_execution.py'
      - 'scripts/cibo_profitability_lab_all_trader.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  phase3-ce2i:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_P0_ARTIFACT_ID: '11276801896'
      SOURCE_P0_HEAD_SHA: 'a33115b631a9addfcd7f270e3c1913ecc6f03e9c'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install -e '.[dev]'

      - name: Static validation
        run: |
          set -euo pipefail
          python -m py_compile scripts/cibo_trader_lab_phase3_ce2i_audit.py
          ruff check scripts/cibo_trader_lab_phase3_ce2i_audit.py

      - name: Recover exact integrated P0 source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p0"
          gh api             "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_P0_ARTIFACT_ID/zip"             > "$RUNNER_TEMP/p0.zip"
          unzip -q "$RUNNER_TEMP/p0.zip" -d "$RUNNER_TEMP/p0"
          test -s "$RUNNER_TEMP/p0/decision-trace.json"
          test -s "$RUNNER_TEMP/p0/lab-result.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "p0"
          result = json.loads((root / "lab-result.json").read_text())
          trace = json.loads((root / "decision-trace.json").read_text())
          assert result["status"] == "COMPLETE"
          assert result["validation_mode"] == (
              "NON_CERTIFYING_REUSED_HOLDOUT_DIAGNOSTIC"
          )
          assert result["governance"]["broker_mutation"] is False
          assert result["governance"]["live"] is False
          assert result["governance"]["production"] is False
          assert result["governance"]["real_capital"] is False
          assert trace["status"] == "OBSERVATIONAL"
          assert trace["trace_sha256"].startswith("sha256:")
          PY

      - name: Audit sequential CE2I phase
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase3"
          python scripts/cibo_trader_lab_phase3_ce2i_audit.py             --decision-trace "$RUNNER_TEMP/p0/decision-trace.json"             --source-head "$SOURCE_P0_HEAD_SHA"             --output "$RUNNER_TEMP/phase3/report.json"

      - name: Verify noncompensatory phase contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "phase3"
                  / "report.json"
              ).read_text()
          )
          assert p["tool_sequence"] == [
              f"T{index:02d}" for index in range(1, 21)
          ]
          assert p["governance"]["sequential_noncompensatory_gate"] is True
          assert p["governance"]["registry_presence_is_not_pass"] is True
          assert p["governance"]["enabled_flag_is_not_pass"] is True
          assert p["governance"]["fresh_oos_claimed"] is False
          assert p["governance"]["broker_mutation"] is False
          assert p["governance"]["live"] is False
          assert p["governance"]["production"] is False
          assert p["governance"]["real_capital"] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-cibo-trader-lab-phase3-ce2i-${{ github.run_id }}
          path: ${{ runner.temp }}/phase3
          if-no-files-found: error
          retention-days: 90

      - name: Enforce Phase 3 before GEN-C unlock
        run: |
          set -euo pipefail
          python scripts/cibo_trader_lab_phase3_ce2i_audit.py             --decision-trace "$RUNNER_TEMP/p0/decision-trace.json"             --source-head "$SOURCE_P0_HEAD_SHA"             --output "$RUNNER_TEMP/phase3/enforced-report.json"             --enforce
