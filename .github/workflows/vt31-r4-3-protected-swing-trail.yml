name: QORE VT-31 R4.3 Protected-Swing Trail

on:
  push:
    branches: [agent/vt31-r2-5-multi-index-validation-001]
    paths:
      - .github/workflows/vt31-r4-3-protected-swing-trail.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -e .
      - name: Download immutable R4.2 and evidence
        run: |
          set -euo pipefail
          mkdir -p r42 evidence/{NAS100,SP500,US30}
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10358799199/zip" > r42.zip
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10350575547/zip" > NAS100.zip
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10351435307/zip" > SP500.zip
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10350622506/zip" > US30.zip
          echo "b37ea231b24ab91c309475973271e5fb984895cf4837c959c07abecc32a14009  r42.zip" > sums
          echo "1a16adc1485ce7f77666fde2261a36dd62beea8cfea1f3a5abcea176a3902cea  NAS100.zip" >> sums
          echo "bcdc7a346cb3a618b277934d21e9ed30583f814c0645862dd48cd8ca3a5a1fc1  SP500.zip" >> sums
          echo "bdfc75724433162bd4d079f581543c09aad75f35406a7a3d2985cd205c89b96c  US30.zip" >> sums
          sha256sum -c sums
          unzip -q r42.zip -d r42
          for m in NAS100 SP500 US30; do unzip -q "$m.zip" -d "evidence/$m"; done
      - name: Replay source-defined protected-swing trailing
        run: |
          python - <<'PY'
          import hashlib,json
          from collections import defaultdict
          from datetime import datetime,timedelta
          from decimal import Decimal
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from qore.infrastructure.trader_lab.vt31_silver_bullet_r2_5_multi_index_research import _metrics,_quartiles
          NY=ZoneInfo("America/New_York"); markets=("NAS100","SP500","US30")
          def dt(x): return datetime.fromisoformat(x.replace("Z","+00:00"))
          def d(x): return Decimal(str(x))
          def candle(xs): return {"opened_at":dt(xs[0]["opened_at"]),"closed_at":dt(xs[-1]["closed_at"]),"open":d(xs[0]["open"]),"high":max(d(x["high"]) for x in xs),"low":min(d(x["low"]) for x in xs),"close":d(xs[-1]["close"])}
          parent=json.loads(Path("r42/vt31-r4-2-correlated-event-research.json").read_text())
          source=parent["result"]["trades"]; evidence={}
          for m in markets:
              raw=json.loads(Path(f"evidence/{m}/market-evidence.json").read_text()); days=defaultdict(list)
              for b in raw["periods"]["M1"]:
                  local=dt(b["opened_at"]).astimezone(NY); days[local.date().isoformat()].append((local,b))
              evidence[m]=days

          def m5(daybars):
              groups=defaultdict(list)
              for local,b in daybars:
                  key=local.replace(minute=(local.minute//5)*5,second=0,microsecond=0)
                  groups[key].append(b)
              return [candle(groups[k]) for k in sorted(groups) if len(groups[k])==5]

          def initial(trade,daybars):
              signal=dt(trade["signal_at"]); candles=[x for x in m5(daybars) if x["closed_at"]<=signal and x["opened_at"].astimezone(NY).hour*60+x["opened_at"].astimezone(NY).minute>=510]
              assert candles and candles[-1]["closed_at"]==signal
              i=len(candles)-1; side=trade["side"]; j=i-1
              opposing=lambda x: x["close"]<x["open"] if side=="long" else x["close"]>x["open"]
              assert j>=0 and opposing(candles[j])
              while j>0 and opposing(candles[j-1]): j-=1
              series=candles[j:i]; stop=min(x["low"] for x in series) if side=="long" else max(x["high"] for x in series)
              entry=candles[i]["close"]
              london=[b for local,b in daybars if 2<=local.hour<5]
              target=max(d(x["high"]) for x in london) if side=="long" else min(d(x["low"]) for x in london)
              return signal,entry,stop,target

          def new_protected(candles,i,side,current_stop,current_close):
              if i<2:return current_stop
              j=i-1; opposing=lambda x: x["close"]<x["open"] if side=="long" else x["close"]>x["open"]
              if not opposing(candles[j]):return current_stop
              while j>0 and opposing(candles[j-1]):j-=1
              if j==0:return current_stop
              series=candles[j:i]
              swept=min(x["low"] for x in series)<candles[j-1]["low"] if side=="long" else max(x["high"] for x in series)>candles[j-1]["high"]
              crossed=candles[i]["close"]>series[0]["open"] if side=="long" else candles[i]["close"]<series[0]["open"]
              if not swept or not crossed:return current_stop
              proposed=min(x["low"] for x in series) if side=="long" else max(x["high"] for x in series)
              if side=="long" and current_stop<proposed<current_close:return proposed
              if side=="short" and current_close<proposed<current_stop:return proposed
              return current_stop

          replay=[]
          for trade in source:
              daybars=evidence[trade["market"]][trade["local_date"]]; signal,entry,initial_stop,target=initial(trade,daybars); risk=abs(entry-initial_stop)
              current_stop=initial_stop; candles=m5(daybars); close_index={x["closed_at"]:i for i,x in enumerate(candles)}
              terminal=None; reason=None
              for local,b in daybars:
                  if dt(b["opened_at"])<signal or local.hour*60+local.minute>=960:continue
                  high=d(b["high"]);low=d(b["low"]); hit_stop=low<=current_stop if trade["side"]=="long" else high>=current_stop; hit_target=high>=target if trade["side"]=="long" else low<=target
                  if hit_stop and hit_target: terminal=None;reason="same-bar-ambiguous";break
                  if hit_stop: terminal=(current_stop-entry)/risk if trade["side"]=="long" else (entry-current_stop)/risk;reason="protected-stop";break
                  if hit_target: terminal=abs(target-entry)/risk;reason="target";break
                  closed=dt(b["closed_at"])
                  if closed in close_index and closed>signal:
                      current_stop=new_protected(candles,close_index[closed],trade["side"],current_stop,d(b["close"]))
              if reason=="same-bar-ambiguous":continue
              if terminal is None:
                  last=[b for local,b in daybars if local.hour*60+local.minute<960][-1]; close=d(last["close"]); terminal=(close-entry)/risk if trade["side"]=="long" else (entry-close)/risk;reason="lifecycle"
              replay.append({**trade,"r_multiple":format(terminal,"f"),"exit_reason":reason,"initial_stop":format(initial_stop,"f"),"terminal_stop":format(current_stop,"f")})
          replay.sort(key=lambda x:(x["signal_at"],x["market"])); agg=_metrics(replay); stress=_metrics(replay,friction=Decimal(".05"))
          bym={m:_metrics([t for t in replay if t["market"]==m],friction=Decimal(".05")) for m in markets}; bys={s:_metrics([t for t in replay if t["side"]==s],friction=Decimal(".05")) for s in ("long","short")}; q=_quartiles(replay); temporal={}
          for m in markets:
              own=[t for t in replay if t["market"]==m]
              for y in sorted({t["local_date"][:4] for t in own}):temporal[f"{m}:{y}"]=_metrics([t for t in own if t["local_date"].startswith(y)],friction=Decimal(".05"))
          eligible=[x for x in temporal.values() if x["sample"]>=10]
          gates={"aggregate_sample_at_least_150":agg["sample"]>=150,"each_market_sample_at_least_30":all(x["sample"]>=30 for x in bym.values()),"aggregate_stressed_mean_positive":Decimal(stress["mean_r"])>0,"aggregate_stressed_pf_at_least_1_10":stress["profit_factor"] is not None and Decimal(stress["profit_factor"])>=Decimal("1.10"),"aggregate_stressed_dd_at_most_20r":Decimal(stress["max_drawdown_r"])<=20,"every_market_stressed_mean_positive":all(Decimal(x["mean_r"])>0 for x in bym.values()),"both_sides_stressed_mean_positive":all(x["sample"] and Decimal(x["mean_r"])>0 for x in bys.values()),"three_of_four_quartiles_positive":sum(Decimal(x["mean_r"])>0 for x in q)>=3,"two_thirds_eligible_temporal_blocks_positive":bool(eligible) and sum(Decimal(x["mean_r"])>0 for x in eligible)*3>=len(eligible)*2}
          contract={"parent_fingerprint":parent["contract_fingerprint"],"source":"https://ttrades.com/stop-loss-mastery-using-protected-swings-for-precise-invalidations/","management":"trail-only-after-new-M5-protected-swing-confirmed-by-sweep-and-close-through-opposing-series","initial_risk_denominator_frozen":True,"fixed_breakeven":False,"markets":list(markets),"hypothesis_count":1}
          result={"aggregate":agg,"stress_0_05r":stress,"market_stress":bym,"side_stress":bys,"quartiles":q,"temporal_blocks":temporal,"gates":gates,"survivor":all(gates.values()),"trades":replay}
          report={"schema":"qore.trader_lab.vt31_r4_3_protected_trail_research.v1","software_sha":"${{ github.sha }}","research_only":True,"consumed_evidence_only":True,"fresh_evidence_opened":False,"contract":contract,"contract_fingerprint":hashlib.sha256(json.dumps(contract,sort_keys=True,separators=(",",":")).encode()).hexdigest(),"result":result,"adjudication":"CANDIDATE_JUSTIFIED_FOR_SEPARATE_FREEZE" if result["survivor"] else "VT31_R4_3_CANDIDATE_NOT_JUSTIFIED","candidate_frozen":False,"demo_eligible":False,"live_authorized":False,"real_capital_authorized":False,"production_authorized":False}
          Path("vt31-r4-3-protected-trail-research.json").write_text(json.dumps(report,sort_keys=True,separators=(",",":"))+"\n")
          print(json.dumps({"adjudication":report["adjudication"],"aggregate":agg,"stress":stress,"markets":{m:x["mean_r"] for m,x in bym.items()},"samples":{m:x["sample"] for m,x in bym.items()},"sides":{s:x["mean_r"] for s,x in bys.items()},"positive_quartiles":sum(Decimal(x["mean_r"])>0 for x in q),"failed":[g for g,p in gates.items() if not p]},sort_keys=True))
          PY
          echo "$GITHUB_SHA" > git-sha.txt
          sha256sum vt31-r4-3-protected-trail-research.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-r4-3-protected-trail-${{ github.sha }}
          path: |
            vt31-r4-3-protected-trail-research.json
            git-sha.txt
            SHA256SUMS
          if-no-files-found: error
          retention-days: 90
