name: QORE Shared A X12 Second Order Blindspot

concurrency:
  group: qore-shared-a-x12-second-order-blindspot
  cancel-in-progress: false

on:
  push:
    branches:
      - agent/shared-a-cognitive-science-001
    paths:
      - src/qore/infrastructure/core_stack_v2/second_order_blindspot_cognition.py
      - tests/infrastructure/test_core_stack_v2_second_order_blindspot_cognition.py
      - .github/workflows/qore-shared-a-x12-second-order-blindspot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate X-12 cognition boundary
        run: |
          ruff check src/qore/infrastructure/core_stack_v2/second_order_blindspot_cognition.py tests/infrastructure/test_core_stack_v2_second_order_blindspot_cognition.py
          mypy src/qore/infrastructure/core_stack_v2/second_order_blindspot_cognition.py
          pytest -q tests/infrastructure/test_core_stack_v2_second_order_blindspot_cognition.py
