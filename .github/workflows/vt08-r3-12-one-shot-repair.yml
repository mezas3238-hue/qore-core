name: QORE VT-08 R3.12 One-Shot Repair

on:
  push:
    branches:
      - agent/vt08-r3-12-adaptive-prop-risk-001
    paths:
      - .github/workflows/vt08-r3-12-one-shot-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R3.12 branch
        uses: actions/checkout@v4
        with:
          ref: agent/vt08-r3-12-adaptive-prop-risk-001
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: pip install -e ".[dev]"
      - name: Apply semantic timezone and typing repair
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path("src/qore/infrastructure/trader_lab/vt08_official_adaptive_monte_carlo_r3_12.py")
          text = main.read_text()

          if "from zoneinfo import ZoneInfo" not in text:
              marker = "from statistics import fmean, median\n"
              if marker not in text:
                  raise SystemExit("statistics import marker not found")
              text = text.replace(marker, marker + "from zoneinfo import ZoneInfo\n", 1)

          if "PathMetrics as StaticPathMetrics" not in text:
              marker = "    PORTFOLIOS,\n    PreparedDay,\n"
              if marker not in text:
                  raise SystemExit("R3.11 import marker not found")
              text = text.replace(
                  marker,
                  "    PORTFOLIOS,\n    PathMetrics as StaticPathMetrics,\n    PreparedDay,\n",
                  1,
              )

          epoch_marker = "    epoch = datetime(2000, 1, 3, tzinfo=UTC)\n"
          if epoch_marker in text:
              text = text.replace(
                  epoch_marker,
                  "    provider_tz = ZoneInfo(profile.daily_reset_timezone)\n"
                  "    epoch_local = datetime(2000, 1, 3, tzinfo=provider_tz)\n",
                  1,
              )
          elif "epoch_local = datetime(2000, 1, 3, tzinfo=provider_tz)" not in text:
              raise SystemExit("epoch marker not found")

          start_marker = "    for simulated_day, source_index in enumerate(indices, start=1):\n"
          entry_marker = "            entry_at = day_start + trade.prepared.entry_offset\n"
          if "source_midnight = datetime.combine(" not in text:
              start = text.index(start_marker)
              entry_end = text.index(entry_marker, start) + len(entry_marker)
              replacement = '''    for simulated_day, source_index in enumerate(indices, start=1):
              if breached:
                  break
              local_day_start = epoch_local + timedelta(days=simulated_day - 1)
              day_start = local_day_start.astimezone(UTC)
              day_end = (local_day_start + timedelta(days=1)).astimezone(UTC)
              close_due(day_start)
              current_month = _month_key(simulated_day)
              if current_month != month.key:
                  daily_floor, max_floor = provider_floors()
                  months.append(
                      _finish_month(
                          month,
                          end_equity=balance,
                          starting_equity=starting,
                          daily_floor=daily_floor,
                          max_loss_floor=max_floor,
                      )
                  )
                  month = MonthAccumulator(current_month, balance, balance)
              reset_balance = balance
              day_start_balance = balance
              source_day = days[source_index]
              for trade in source_day.trades:
                  if not _scope_membership(trade.prepared.source, portfolio):
                      continue
                  source_local = trade.prepared.source.signal_at.astimezone(provider_tz)
                  source_midnight = datetime.combine(
                      source_local.date(), datetime.min.time(), tzinfo=provider_tz
                  )
                  entry_at = day_start + (source_local - source_midnight)
          '''
              text = text[:start] + replacement + text[entry_end:]

          text = text.replace(
              "        close_due(day_start + timedelta(days=1))\n",
              "        close_due(day_end)\n",
          )
          text = text.replace(
              "    raw_by_profile: dict[str, dict[str, list[PathMetrics]]] = {}\n",
              "",
          )
          text = text.replace("        raw_by_profile[profile.profile_id] = raw\n", "")
          text = text.replace(
              "def _static_summary(results: Sequence[object]) -> dict[str, object]:",
              "def _static_summary(results: Sequence[StaticPathMetrics]) -> dict[str, object]:",
          )
          main.write_text(text)

          profiles = Path("src/qore/infrastructure/trader_lab/vt08_prop_firm_profiles_r3_12.py")
          ptext = profiles.read_text().replace(
              'daily_reset_timezone="FundedNextServerTime",',
              'daily_reset_timezone="Europe/Athens",',
          )
          profiles.write_text(ptext)

          tests = Path("tests/infrastructure/trader_lab/test_vt08_official_adaptive_monte_carlo_r3_12.py")
          ttext = tests.read_text().replace(
              'assert funded.daily_reset_timezone == "FundedNextServerTime"',
              'assert funded.daily_reset_timezone == "Europe/Athens"',
          )
          tests.write_text(ttext)
          PY
      - name: Format and autofix without reducing strictness
        run: |
          ruff format \
            src/qore/infrastructure/trader_lab/vt08_official_adaptive_monte_carlo_r3_12.py \
            src/qore/infrastructure/trader_lab/vt08_prop_firm_profiles_r3_12.py \
            tests/infrastructure/trader_lab/test_vt08_official_adaptive_monte_carlo_r3_12.py
          ruff check --fix \
            src/qore/infrastructure/trader_lab/vt08_official_adaptive_monte_carlo_r3_12.py \
            src/qore/infrastructure/trader_lab/vt08_prop_firm_profiles_r3_12.py \
            tests/infrastructure/trader_lab/test_vt08_official_adaptive_monte_carlo_r3_12.py
          ruff check .
          python -m py_compile \
            src/qore/infrastructure/trader_lab/vt08_official_adaptive_monte_carlo_r3_12.py \
            src/qore/infrastructure/trader_lab/vt08_prop_firm_profiles_r3_12.py \
            tests/infrastructure/trader_lab/test_vt08_official_adaptive_monte_carlo_r3_12.py
      - name: Commit exact repaired source and remove one-shot workflow
        run: |
          rm .github/workflows/vt08-r3-12-one-shot-repair.yml
          git config user.name "qore-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(vt08): harden R3.12 reset semantics and full-gate style"
          git push origin HEAD:agent/vt08-r3-12-adaptive-prop-risk-001
