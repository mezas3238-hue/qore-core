name: QORE Shared VT31 Natural DD Reciprocal Sequence Transfer V35

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - scripts/vt31_core_stack_v4_natural_dd_reciprocal_sequence_transfer_v35.py
      - .github/workflows/qore-shared-vt31-natural-dd-reciprocal-sequence-transfer-v35.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  natural-dd-reciprocal-sequence-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Static validation
        run: |
          ruff check scripts/vt31_core_stack_v4_natural_dd_reciprocal_sequence_transfer_v35.py
          python -m py_compile scripts/vt31_core_stack_v4_natural_dd_reciprocal_sequence_transfer_v35.py

      - name: Recover immutable R8/R6 evidence
        run: |
          set -euo pipefail
          mkdir -p input/pure input/cibo input/r8 input/r6 result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10799064861/zip" > pure.zip
          unzip -q pure.zip -d input/pure
          (cd input/pure && sha256sum -c SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10478487667/zip" > cibo.zip
          unzip -q cibo.zip -d input/cibo
          (cd input/cibo && sha256sum -c SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10402199719/zip" > r8.zip
          unzip -q r8.zip -d input/r8
          (cd input/r8 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10389112524/zip" > r6.zip
          unzip -q r6.zip -d input/r6
          (cd input/r6 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

      - name: Run reciprocal consumed-fold transfer
        run: |
          python scripts/vt31_core_stack_v4_natural_dd_reciprocal_sequence_transfer_v35.py \
            --r8-trades input/pure/r8.json \
            --r6-trades input/pure/r6.json \
            --r8-nas input/r8/fresh/NAS100/market-evidence.json \
            --r8-sp input/r8/fresh/SP500/market-evidence.json \
            --r8-us input/r8/fresh/US30/market-evidence.json \
            --r6-nas input/r6/fresh/NAS100/market-evidence.json \
            --r6-sp input/r6/fresh/SP500/market-evidence.json \
            --r6-us input/r6/fresh/US30/market-evidence.json \
            --daily-path input/cibo/DAILY_PATH_LEDGER.jsonl \
            --output result/natural-dd-reciprocal-sequence-transfer-v35.json \
            | tee result/summary.json

      - name: Validate no-actuation and transfer isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(Path("result/natural-dd-reciprocal-sequence-transfer-v35.json").read_text())
          assert p["research_phase"] == "PHASE_1_NATURAL_DD_INTELLIGENCE"
          assert p["status"] == "RECIPROCAL_CONSUMED_FOLD_TRANSFER_NO_ACTUATION"
          assert p["source_hypothesis"] == "COMPOSITE_PRECISION_ORIGIN"
          assert p["challenge_set"] == {"r8":228,"r6":278}
          d=p["discovery_contract"]
          assert d["zero_winners_required"] is True
          assert d["minimum_losses"] == 3
          assert d["minimum_top3_dd_losses"] == 2
          assert d["target_fold_used_for_selection"] is False
          assert d["numeric_threshold_grid_search"] is False
          assert p["r8_to_r6"]["target_fold_not_used_for_rule_selection"] is True
          assert p["r6_to_r8"]["target_fold_not_used_for_rule_selection"] is True

          c=p["phase_1_contract"]
          assert c["same_trade_universe"] is True
          assert c["same_initial_position_size"] is True
          assert c["sizing_used"] is False
          assert c["capital_weighting_used"] is False
          assert c["entry_abstention_used"] is False
          assert c["stop_geometry_mutated"] is False
          assert c["target_geometry_mutated"] is False
          assert c["trailing_used"] is False
          assert c["target_extension_used"] is False
          assert c["realized_dd_reduction_claimed"] is False
          assert c["runtime_outcome_input_used"] is False
          assert c["future_market_input_used"] is False
          assert c["r5_opened"] is False
          assert c["new_holdout_opened"] is False

          g=p["governance"]
          assert g["live_authorized"] is False
          assert g["production_authorized"] is False
          assert g["real_capital_authorized"] is False
          assert g["merge_authorized"] is False

          print(json.dumps({
              "status":p["status"],
              "r8_to_r6":p["r8_to_r6"],
              "r6_to_r8":p["r6_to_r8"],
          },sort_keys=True))
          PY

      - name: Bind result
        run: |
          echo "$GITHUB_SHA" > result/git-sha.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd result && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-vt31-natural-dd-reciprocal-transfer-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
