name: Scalper DCVC Preregistered Native 9-Market Exploratory ABC

on:
  push:
    branches:
      - research/scalper-dcvc-causal-conditional-edge-20261010
    paths:
      - '.github/workflows/qore-scalper-dcvc-preregistered-nine-market.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_dcvc_ab_experiment_v1.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_dcvc_causal_features_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_scalper_dcvc_ab_experiment_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CONTROL_RUN: '38053946695'
  CONTROL_SHA: 'e356e7a52541e99533b25ecfef0ab9c4e9ce03c0'
  NATIVE_RUN: '35548099334'
  NATIVE_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Verify DCVC feature/classifier quality and future leakage negative cases
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_scalper_dcvc_ab_experiment_v1.py src/qore/infrastructure/trader_lab/capitalizer_scalper_dcvc_causal_features_v1.py tests/infrastructure/trader_lab/test_capitalizer_scalper_dcvc_ab_experiment_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_scalper_dcvc_ab_experiment_v1.py src/qore/infrastructure/trader_lab/capitalizer_scalper_dcvc_causal_features_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_scalper_dcvc_ab_experiment_v1.py

  market:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol: [USDJPY, AUDJPY, AUDUSD, GBPJPY, EURUSD, GBPUSD, XAUUSD, USDCAD, NAS100]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: scalper-a2-v49-control-${{ matrix.symbol }}-${{ env.CONTROL_SHA }}
          path: frozen
          github-token: ${{ github.token }}
          run-id: ${{ env.CONTROL_RUN }}
      - uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.NATIVE_SHA }}
          path: native
          github-token: ${{ github.token }}
          run-id: ${{ env.NATIVE_RUN }}
      - name: Confirm source is provider-native and has NO physical bid ask prices
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          m=json.loads(Path("native/m1-clone-manifest.json").read_text())
          assert m["canonical_symbol"]==os.environ["SYMBOL"]
          assert m["provider_native_m1"] and not m["synthetic_m1"]
          assert not m["interpolated_m1"] and m["contradictory_m1"]==0
          assert m["read_only"]
          PY
      - name: Build original-ID as-of features, separate frozen outcomes
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_dcvc_ab_experiment_v1 market frozen native market-output
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-dcvc-source-${{ matrix.symbol }}-${{ github.sha }}
          path: market-output/
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: scalper-dcvc-source-*-${{ github.sha }}
          path: all-nine
      - name: Replay control before selector, frozen DCVC, stress/exposure/random, C fail-closed
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_dcvc_ab_experiment_v1 aggregate all-nine scientific-report
      - name: Record 2876-2020 baseline/source contracts before reporting results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("scientific-report/dcvc-abc-scientific-exploratory.json").read_text())
          assert p["source_opportunities"]==2876 and p["baseline_n"]==2020
          assert p["baseline_control_verified"]
          assert p["C_full_existing_master_frame"]["status"].startswith("BLOCKED")
          assert not p["physical_bid_ask_and_broker_costs_verified"]
          assert not p["OOS_independent"] and not p["certified"]
          print("DCVC_ABC_AGGREGATE",json.dumps({k:v for k,v in p.items() if k in
              ("baseline_n","dcvc_n","A_original_gross","B_dcvc_gross",
               "regimes_unknown","preserved_original_winner_ids",
               "preserved_original_winner_r")},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-dcvc-abc-scientific-nine-market-${{ github.sha }}
          path: scientific-report/
          retention-days: 90
          if-no-files-found: error
