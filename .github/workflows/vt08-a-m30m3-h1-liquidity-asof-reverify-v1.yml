name: VT08 A M30 M3 H1 Liquidity Swing AsOf Reverification V1

on:
  push:
    branches:
      - agent/vt08-5m-methodology-source-20261010
    paths:
      - .github/workflows/vt08-a-m30m3-h1-liquidity-asof-reverify-v1.yml
      - src/qore/infrastructure/trader_lab/vt08_5m_a_m30m3_h1_liquidity_swing_asof_verifier_v1.py
      - tests/infrastructure/trader_lab/test_vt08_5m_a_m30m3_h1_liquidity_swing_asof_verifier_v1.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-reverification:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        symbol: [EURJPY, USDCHF, NZDUSD, CADJPY, USDCAD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Ruff and exact prior H1 pivot anti-lookahead contracts
        run: |
          ruff check src/qore/infrastructure/trader_lab/vt08_5m_a_m30m3_h1_liquidity_swing_asof_verifier_v1.py tests/infrastructure/trader_lab/test_vt08_5m_a_m30m3_h1_liquidity_swing_asof_verifier_v1.py
          pytest -q tests/infrastructure/trader_lab/test_vt08_5m_a_m30m3_h1_liquidity_swing_asof_verifier_v1.py
      - uses: actions/download-artifact@v4
        with:
          name: qore-vt08-cognitive-5m-fresh-${{ matrix.symbol }}-b2d33e1b4829d8b4afc76983decca8a99131403c
          path: base/${{ matrix.symbol }}
          github-token: ${{ github.token }}
          run-id: 35934924907
      - uses: actions/download-artifact@v4
        with:
          name: qore-vt08-m3-fractal-${{ matrix.symbol }}-bc1379d7661aac202495ec67afdd3098473ba723
          path: native-m3/${{ matrix.symbol }}
          github-token: ${{ github.token }}
          run-id: 35941643396
      - name: Independent same-source M3 CISD and PRE-C2 H1 liquidity timestamp audit
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from qore.infrastructure.trader_lab.vt08_5m_a_m30m3_h1_liquidity_swing_asof_verifier_v1 import evaluate
          symbol=os.environ["SYMBOL"]
          m3=list(Path(f"native-m3/{symbol}").rglob("m3-evidence.json"))
          if len(m3)!=1:
              raise SystemExit("native M3 source must exist exactly once")
          output=evaluate(Path(f"base/{symbol}/market-evidence-1095d.json"),m3[0])
          Path(f"artifacts/{symbol}-h1-poi-swing-full.json").write_text(
              json.dumps(output,sort_keys=True,separators=(",",":")),encoding="utf-8"
          )
          summary={k:output[k] for k in (
              "schema","market","prior_geometry_count","counts","per_year",
              "source_external_pivot_geometry_pre_c2_tested",
              "valid_EQ_C2_swing_definition_fully_adjudicated",
              "HTF_POI_significance_verified","source_complete_signals",
              "approved_cognitive_events","orders","fills","pnl_evaluated",
              "sealed_7y_accessed"
          )}
          Path(f"artifacts/{symbol}-h1-poi-swing-summary.json").write_text(
              json.dumps(summary,sort_keys=True,indent=2),encoding="utf-8"
          )
          print(json.dumps(summary,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vt08-a-m30m3-source-h1-pivot-${{ matrix.symbol }}-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
