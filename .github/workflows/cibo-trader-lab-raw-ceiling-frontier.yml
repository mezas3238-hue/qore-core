name: QORE CIBO Raw Ceiling Frontier

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cibo-causal-expectation-leakage-fix-001
    paths:
      - '.github/workflows/cibo-trader-lab-raw-ceiling-frontier.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}/src
  SOURCE_ARTIFACT_ID: '11451743578'
  SOURCE_ARTIFACT_DIGEST: 'sha256:d439957f21e2f79148b5a2fb75a53db6fa448698f17aeb6978f379ed3547f7ea'
  HISTORICAL_SOURCE_ARTIFACT_ID: '11389331836'
  HISTORICAL_SOURCE_ARTIFACT_DIGEST: 'sha256:30177639f660c9647ab70257c2d12c541bdade49ab5582347a3890f920070fee'
  HISTORICAL_CONTROL_ARTIFACT_ID: '11409086692'
  HISTORICAL_CONTROL_ARTIFACT_DIGEST: 'sha256:eeffdc99a736b82bd965ff646b8ca9bf084f50ae414e56e9b3d82961169d7187'

jobs:
  raw-ceiling-frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile raw ceiling frontier
        run: |
          set -euo pipefail
          python -m py_compile             src/qore/infrastructure/trader_lab/cibo_three_mode_capital_lab.py             scripts/cibo_trader_lab_three_mode_ceiling.py

      - name: Recover frozen causal inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/historical-source" "$RUNNER_TEMP/historical-control" "$RUNNER_TEMP/result"

          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" > "$RUNNER_TEMP/source.zip"
          echo "${SOURCE_ARTIFACT_DIGEST#sha256:}  $RUNNER_TEMP/source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/source"
          MANIFEST="$(find "$RUNNER_TEMP/source" -type f -name walk-forward-manifest.json -print -quit)"
          BASELINE="$(find "$RUNNER_TEMP/source" -type f -name walk-forward-replay.json -print -quit)"
          test -n "$MANIFEST" && test -n "$BASELINE"
          echo "MANIFEST=$MANIFEST" >> "$GITHUB_ENV"
          echo "BASELINE=$BASELINE" >> "$GITHUB_ENV"

          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$HISTORICAL_SOURCE_ARTIFACT_ID/zip" > "$RUNNER_TEMP/historical-source.zip"
          echo "${HISTORICAL_SOURCE_ARTIFACT_DIGEST#sha256:}  $RUNNER_TEMP/historical-source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/historical-source.zip" -d "$RUNNER_TEMP/historical-source"
          HISTORICAL_MANIFEST="$(find "$RUNNER_TEMP/historical-source" -type f -name single-account-manifest-native.json -print -quit)"
          test -n "$HISTORICAL_MANIFEST"
          echo "HISTORICAL_MANIFEST=$HISTORICAL_MANIFEST" >> "$GITHUB_ENV"

          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$HISTORICAL_CONTROL_ARTIFACT_ID/zip" > "$RUNNER_TEMP/historical-control.zip"
          echo "${HISTORICAL_CONTROL_ARTIFACT_DIGEST#sha256:}  $RUNNER_TEMP/historical-control.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/historical-control.zip" -d "$RUNNER_TEMP/historical-control"
          HISTORICAL_REPLAY="$(find "$RUNNER_TEMP/historical-control" -type f -name historical-ceiling-replay.json -print -quit)"
          test -n "$HISTORICAL_REPLAY"
          echo "HISTORICAL_REPLAY=$HISTORICAL_REPLAY" >> "$GITHUB_ENV"

      - name: Run raw ceiling cases
        run: |
          set -u
          common=(
            --manifest "$MANIFEST"
            --baseline-replay "$BASELINE"
            --historical-manifest "$HISTORICAL_MANIFEST"
            --historical-replay "$HISTORICAL_REPLAY"
            --distributed-attack-frontier
            --coordinated-economic-group
          )
          run_case() {
            name="$1"; shift
            echo "CASE_START=${name}"
            if python scripts/cibo_trader_lab_three_mode_ceiling.py "${common[@]}" "$@" --output "$RUNNER_TEMP/result/${name}.json"; then
              echo "CASE_OK=${name}"
            else
              echo "CASE_FAILED=${name}"
            fi
          }

          run_case defended-control --attack-multiplier-cap 8 --medium-multiplier-cap 4 --economic-group-bootstrap-cushion-share 0.75

          run_case raw-a08-m04-c075 --ceiling-discovery-mode --attack-multiplier-cap 8  --medium-multiplier-cap 4 --economic-group-bootstrap-cushion-share 0.75
          run_case raw-a12-m04-c075 --ceiling-discovery-mode --attack-multiplier-cap 12 --medium-multiplier-cap 4 --economic-group-bootstrap-cushion-share 0.75
          run_case raw-a16-m04-c075 --ceiling-discovery-mode --attack-multiplier-cap 16 --medium-multiplier-cap 4 --economic-group-bootstrap-cushion-share 0.75
          run_case raw-a24-m04-c075 --ceiling-discovery-mode --attack-multiplier-cap 24 --medium-multiplier-cap 4 --economic-group-bootstrap-cushion-share 0.75
          run_case raw-a32-m04-c075 --ceiling-discovery-mode --attack-multiplier-cap 32 --medium-multiplier-cap 4 --economic-group-bootstrap-cushion-share 0.75
          run_case raw-a50-m04-c075 --ceiling-discovery-mode --attack-multiplier-cap 50 --medium-multiplier-cap 4 --economic-group-bootstrap-cushion-share 0.75

          run_case raw-a16-m06-c075 --ceiling-discovery-mode --attack-multiplier-cap 16 --medium-multiplier-cap 6 --economic-group-bootstrap-cushion-share 0.75
          run_case raw-a24-m06-c075 --ceiling-discovery-mode --attack-multiplier-cap 24 --medium-multiplier-cap 6 --economic-group-bootstrap-cushion-share 0.75
          run_case raw-a16-m08-c075 --ceiling-discovery-mode --attack-multiplier-cap 16 --medium-multiplier-cap 8 --economic-group-bootstrap-cushion-share 0.75
          run_case raw-a24-m08-c075 --ceiling-discovery-mode --attack-multiplier-cap 24 --medium-multiplier-cap 8 --economic-group-bootstrap-cushion-share 0.75

          run_case raw-a16-m06-c085 --ceiling-discovery-mode --attack-multiplier-cap 16 --medium-multiplier-cap 6 --economic-group-bootstrap-cushion-share 0.85
          run_case raw-a16-m06-c095 --ceiling-discovery-mode --attack-multiplier-cap 16 --medium-multiplier-cap 6 --economic-group-bootstrap-cushion-share 0.95

      - name: Validate and rank raw ceiling
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from decimal import Decimal
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "result"
          rows = []
          for pth in sorted(root.glob("*.json")):
              p = json.loads(pth.read_text())
              assert p["decision_count"] == p["trade_count"] == 3368
              assert p["economic_group_report"]["all_entries_preserved"] is True
              f = p["engineering_sensor_report"]["execution_funnel"]
              assert f["final_trade_count"] == 3368
              assert f["sizing_medium_rejected_count"] == 0
              assert f["sizing_medium_deferred_count"] == 0
              assert f["compound_portfolio_withheld_before_execution_engine_count"] == 0
              cap = Decimal(p["ending_total_capital_usd"])
              rows.append({
                  "case": pth.stem,
                  "capital": p["ending_total_capital_usd"],
                  "gain_pct": format((cap - Decimal("60")) / Decimal("60") * Decimal("100"), "f"),
                  "dd": p["max_drawdown_fraction"],
                  "attack": p["attack_trade_count"],
                  "max_multiplier": p["maximum_selected_multiplier"],
                  "ceiling_mode": p["economic_group_report"].get("ceiling_discovery_mode"),
                  "attack_net": p["attack_net_pnl_usd"],
                  "medium_positive": p["medium_compound_positive_net_usd"],
                  "medium_negative": p["medium_compound_negative_net_usd"],
                  "cushion_recycled": p["economic_group_report"]["portfolio_attack_credit_recycled_total_usd"],
              })
          rows.sort(key=lambda x: Decimal(x["capital"]), reverse=True)
          print("RAW_CEILING_TABLE=" + json.dumps(rows, sort_keys=True))
          assert rows, "all raw ceiling cases failed"
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-raw-ceiling-${{ github.run_id }}
          path: ${{ runner.temp }}/result/*.json
          if-no-files-found: error
          retention-days: 90
