name: QORE CIBO Phase22 Turtle Window Integrity

on:
  push:
    branches:
      - agent/cibo-phase22-turtle-window-integrity-001
      - agent/cibo-integrator-ab-001
    paths:
      - 'scripts/cibo_phase22_turtle_window_replay.py'
      - 'scripts/cibo_phase22_eurusd_r38_window_replay.py'
      - 'tests/infrastructure/test_cibo_phase22_turtle_window_replay.py'
      - 'tests/infrastructure/test_cibo_phase22_eurusd_r38_window_replay.py'
      - 'tests/infrastructure/test_cibo_phase22_turtle_fresh_corpus_patch.py'
      - 'docs/research/CIBO-PHASE22-V2-TURTLE-ZERO-POPULATION-FORENSIC-V1.json'
      - '.github/workflows/cibo-phase22-turtle-window-integrity.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Verify formatting and static quality
        run: |
          python -m ruff check \
            scripts/cibo_phase22_turtle_window_replay.py \
            scripts/cibo_phase22_eurusd_r38_window_replay.py \
            tests/infrastructure/test_cibo_phase22_turtle_window_replay.py \
            tests/infrastructure/test_cibo_phase22_eurusd_r38_window_replay.py
      - name: Prove fresh-window propagation and fail-closed contracts
        run: |
          python -m pytest -q \
            tests/infrastructure/test_cibo_phase22_turtle_window_replay.py \
            tests/infrastructure/test_cibo_phase22_eurusd_r38_window_replay.py \
            tests/infrastructure/test_cibo_phase22_turtle_fresh_corpus_patch.py \
            tests/infrastructure/test_cibo_phase22_one_shot_source_preflight.py
      - name: Assert repair grants no replay authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "docs/research/"
              "CIBO-PHASE22-V2-TURTLE-ZERO-POPULATION-FORENSIC-V1.json"
          )
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["phase22_v2_truth"]["one_shot_consumed"] is True
          assert payload["phase22_v2_truth"]["qualification_status"] == "INVALID"
          assert payload["phase22_v2_truth"]["invalid_result_overridden"] is False
          assert payload["remediation"]["rerun_v2_authorized"] is False
          assert payload["remediation"]["second_fresh_execution_authorized"] is False
          assert payload["remediation"]["v2_population_regeneration_authorized"] is False
          assert payload["governance"]["broker_mutation"] is False
          assert payload["governance"]["live_authorized"] is False
          assert payload["governance"]["real_capital_authorized"] is False
          PY
