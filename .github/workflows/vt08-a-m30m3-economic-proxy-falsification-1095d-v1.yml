name: VT08 A Economic Proxy Falsification M30 M3 1095D V1

on:
  push:
    branches: [agent/vt08-5m-methodology-source-20261010]
    paths:
      - .github/workflows/vt08-a-m30m3-economic-proxy-falsification-1095d-v1.yml
      - src/qore/infrastructure/trader_lab/vt08_5m_m30m3_economic_proxy_falsification_v1.py
      - tests/infrastructure/trader_lab/test_vt08_5m_m30m3_economic_proxy_falsification_v1.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  proxy-falsification:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        symbol: [EURJPY, USDCHF, NZDUSD, CADJPY, USDCAD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Ruff and OHLC conservative accounting adversarial contracts
        run: |
          ruff check src/qore/infrastructure/trader_lab/vt08_5m_m30m3_economic_proxy_falsification_v1.py tests/infrastructure/trader_lab/test_vt08_5m_m30m3_economic_proxy_falsification_v1.py
          pytest -q tests/infrastructure/trader_lab/test_vt08_5m_m30m3_economic_proxy_falsification_v1.py
      - uses: actions/download-artifact@v4
        with:
          name: qore-vt08-cognitive-5m-fresh-${{ matrix.symbol }}-b2d33e1b4829d8b4afc76983decca8a99131403c
          path: base/${{ matrix.symbol }}
          github-token: ${{ github.token }}
          run-id: 35934924907
      - uses: actions/download-artifact@v4
        with:
          name: qore-vt08-m3-fractal-${{ matrix.symbol }}-bc1379d7661aac202495ec67afdd3098473ba723
          path: native-m3/${{ matrix.symbol }}
          github-token: ${{ github.token }}
          run-id: 35941643396
      - name: Source M3 economic PROXY falsification first mother per NY market day
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from qore.infrastructure.trader_lab.vt08_5m_m30m3_economic_proxy_falsification_v1 import evaluate_market
          sym=os.environ["SYMBOL"]
          native=list(Path(f"native-m3/{sym}").rglob("m3-evidence.json"))
          if len(native)!=1:
              raise SystemExit("missing/duplicate native M3 evidence")
          result=evaluate_market(
              Path(f"base/{sym}/market-evidence-1095d.json"),native[0],
          )
          Path(f"artifacts/{sym}-economic-proxy-full.json").write_text(
              json.dumps(result,indent=2,sort_keys=True),encoding="utf-8"
          )
          summary={k:result[k] for k in (
              "schema","market","selection_policy",
              "mother_shapes_available","first_mothers_selected",
              "results_per_year","scenarios",
              "author_TTrades_methodology_full",
              "source_PoI_and_EQ_breaker_validated",
              "broker_execution_physical","cognition_full_used",
              "sealed_7y_accessed"
          )}
          Path(f"artifacts/{sym}-economic-proxy-summary.json").write_text(
              json.dumps(summary,indent=2,sort_keys=True),encoding="utf-8"
          )
          print(json.dumps(summary,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vt08-a-m30m3-economic-proxy-${{ matrix.symbol }}-${{ github.sha }}
          path: artifacts/*
          retention-days: 30
          if-no-files-found: error

  combined:
    needs: proxy-falsification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: vt08-a-m30m3-economic-proxy-*
          path: input-artifacts
          merge-multiple: true
      - name: Portfolio chronological combined PF DD in R, no bidask claims
        run: |
          mkdir -p combined
          python - <<'PY'
          import json
          from pathlib import Path
          from qore.infrastructure.trader_lab.vt08_5m_m30m3_economic_proxy_falsification_v1 import aggregate_market_files
          files=sorted(Path("input-artifacts").glob("*-economic-proxy-full.json"))
          if len(files)!=5:
              raise SystemExit(f"expect 5 independent FX market traces, got {len(files)}")
          result=aggregate_market_files(files)
          Path("combined/combined-economic-proxy-summary.json").write_text(
              json.dumps(result,indent=2,sort_keys=True),encoding="utf-8"
          )
          print(json.dumps(result,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vt08-a-m30m3-economic-proxy-combined-${{ github.sha }}
          path: combined/*
          retention-days: 30
          if-no-files-found: error
