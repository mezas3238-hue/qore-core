name: QORE Capitalizer Integrated Three Session Replay V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-integrated-three-session-replay-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_integrated_three_session_replay_v1.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_r0_gross_characterization.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_integrated_three_session_replay_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_r0_gross_characterization.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-integrated-three-session-replay-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_M5_RUN_ID: '35166210458'
  SOURCE_M5_SHA: 'ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  SOURCE_JOURNEY_RUN_ID: '35175979474'
  SOURCE_JOURNEY_SHA: '9cc0f17a2f30846d61b242132547f39391909656'
  SOURCE_TARGET_RUN_ID: '35204892665'
  SOURCE_TARGET_SHA: '2f510461b3360e91d5ee70a72716a76cd6561f16'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check             src/qore/infrastructure/trader_lab/capitalizer_integrated_three_session_replay_v1.py             tests/infrastructure/trader_lab/test_capitalizer_integrated_three_session_replay_v1.py
      - name: Mypy
        run: |
          mypy src/qore/infrastructure/trader_lab/capitalizer_integrated_three_session_replay_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov             tests/infrastructure/trader_lab/test_capitalizer_integrated_three_session_replay_v1.py             tests/infrastructure/trader_lab/test_capitalizer_r0_gross_characterization.py

  replay:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - symbol: USDJPY
            session: ASIA
          - symbol: AUDJPY
            session: ASIA
          - symbol: AUDUSD
            session: ASIA
          - symbol: GBPJPY
            session: ASIA
          - symbol: EURUSD
            session: LONDON
          - symbol: GBPUSD
            session: LONDON
          - symbol: XAUUSD
            session: NEW_YORK
          - symbol: USDCAD
            session: NEW_YORK
          - symbol: NAS100
            session: NEW_YORK
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download immutable consumed M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-${{ matrix.symbol }}-${{ env.SOURCE_M5_SHA }}
          path: m5-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M5_RUN_ID }}
      - name: Download immutable consumed Journey
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-journey-${{ matrix.symbol }}-${{ env.SOURCE_JOURNEY_SHA }}
          path: journey-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_JOURNEY_RUN_ID }}
      - name: Download immutable consumed Target V2
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-target-destination-v2-${{ matrix.symbol }}-${{ env.SOURCE_TARGET_SHA }}
          path: target-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_TARGET_RUN_ID }}
      - name: Run replay cell
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_integrated_three_session_replay_v1             cell m5-source journey-source target-source cell-output
      - name: Enforce replay-cell evidence boundary
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
          EXPECTED_SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ['EXPECTED_SYMBOL']
          session = os.environ['EXPECTED_SESSION']
          path = Path('cell-output') / (
              f"capitalizer-{symbol.lower()}-three-session-replay-cell-v1.json"
          )
          result = json.loads(path.read_text())
          assert result['symbol'] == symbol
          assert result['session'] == session
          assert result['geometry_candidate_count'] > 0
          assert result['source_faithful_entry_confirmed'] is False
          assert result['source_faithful_pre_risk_ready'] == 0
          assert result['m1_evidence_required'] is True
          assert result['m1_evidence_present'] is False
          assert result['source_strategy_status'] == 'WAIT_M1_EVIDENCE'
          assert result['geometry_proxy_only'] is True
          assert result['economic_candidate'] is False
          assert result['rule_promotion_allowed'] is False
          PY
      - name: Upload immutable replay cell
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-three-session-replay-cell-${{ matrix.symbol }}-${{ github.sha }}
          path: cell-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: replay
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download all nine replay cells
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-three-session-replay-cell-*-${{ github.sha }}
          path: replay-input
          merge-multiple: false
      - name: Build integrated three-session replay report
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_integrated_three_session_replay_v1             aggregate replay-input replay-output
      - name: Enforce integrated replay governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path(
                  'replay-output/capitalizer-integrated-three-session-replay-v1.json'
              ).read_text()
          )
          assert result['identity'] == 'QORE_CAPITALIZER_INTEGRATED_THREE_SESSION_REPLAY_V1'
          assert result['full_nine_market_universe'] is True
          assert result['full_three_session_coverage'] is True
          assert len(result['cells']) == 9
          assert len(result['sessions']) == 3
          assert result['proxy_trades'] > 0
          assert result['source_faithful_simulated_executions'] == 0
          assert result['source_faithful_replay_complete'] is False
          assert result['source_strategy_status'] == 'WAIT_M1_EVIDENCE'
          assert result['master_cognitive_frame_replayed'] is False
          assert result['max3_selection_applied_to_proxy_economics'] is False
          assert result['outcome_aware_ranking_used'] is False
          assert result['geometry_proxy_only'] is True
          assert result['economic_candidate'] is False
          assert result['fresh_holdout_claimed'] is False
          assert result['trader_certified'] is False
          assert result['rule_promotion_allowed'] is False
          PY
      - name: Upload immutable integrated replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-integrated-three-session-replay-v1-${{ github.sha }}
          path: replay-output
          if-no-files-found: error
          retention-days: 90
