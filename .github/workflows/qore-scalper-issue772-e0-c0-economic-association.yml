name: Scalper Issue772 E0 C0 Economic Association Nine Market

on:
  push:
    branches:
      - research/scalper-issue772-c0-economic-association-20261011
    paths:
      - '.github/workflows/qore-scalper-issue772-e0-c0-economic-association.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_issue772_c0_economic_association_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_scalper_issue772_c0_economic_association_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  BASELINE_RUN: '38053946695'
  BASELINE_SHA: 'e356e7a52541e99533b25ecfef0ab9c4e9ce03c0'
  C0_RUN: '38115273268'
  C0_SHA: '1e06a09acd2501a6b404195ef7d5d918b2f70b8e'
  M1_RUN: '35548099334'
  M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Check E0 preregistration is frozen before economic execution
        run: |
          test -s docs/research/QORE_SCALPER_ISSUE772_C0_ECONOMIC_ASSOCIATION_PREREG_2026-10-11.md
          python -m compileall -q src/qore/infrastructure/trader_lab/capitalizer_scalper_issue772_c0_economic_association_v1.py
          ruff check --select F,E4,E7,E9 src/qore/infrastructure/trader_lab/capitalizer_scalper_issue772_c0_economic_association_v1.py tests/infrastructure/trader_lab/test_capitalizer_scalper_issue772_c0_economic_association_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_scalper_issue772_c0_economic_association_v1.py

  market:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 160
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol: [USDJPY, AUDJPY, AUDUSD, GBPJPY, EURUSD, GBPUSD, XAUUSD, USDCAD, NAS100]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: scalper-a2-v49-control-${{ matrix.symbol }}-${{ env.BASELINE_SHA }}
          path: frozen
          github-token: ${{ github.token }}
          run-id: ${{ env.BASELINE_RUN }}
      - uses: actions/download-artifact@v4
        with:
          name: scalper-issue772-C0-${{ matrix.symbol }}-${{ env.C0_SHA }}
          path: audit
          github-token: ${{ github.token }}
          run-id: ${{ env.C0_RUN }}
      - uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.M1_SHA }}
          path: native
          github-token: ${{ github.token }}
          run-id: ${{ env.M1_RUN }}
      - name: Independently replay frozen economics keyed by source ID and C0 status
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_issue772_c0_economic_association_v1 market frozen native audit E0-market
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-issue772-E0-${{ matrix.symbol }}-${{ github.sha }}
          path: E0-market/
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: scalper-issue772-E0-*-${{ github.sha }}
          path: nine-market
      - name: Verify exact 2876 IDs, original A2020 economics, bootstrap and market results
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_issue772_c0_economic_association_v1 aggregate nine-market E0-final
          python - <<'PY'
          from pathlib import Path
          import json
          x=json.loads(Path("E0-final/scalper-issue772-E0-economic-association-results.json").read_text())
          assert x["sources"]==2876 and x["A_trades"]==2020
          assert x["partial"]["N"]==382 and x["non_partial"]["N"]==1638
          assert x["h1_signature_changed"]["N"]==382
          assert x["not_causal_and_history_consumed"]
          assert not x["no_certification"] is False
          print("E0_RESEARCH_ONLY",json.dumps({
            "primary":x["primary_delta_R"],
            "CI95":x["primary_bootstrap"]["CI95"],
            "partial":x["partial"],
            "non_partial":x["non_partial"],
            "by_market":x["by_market"],
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-issue772-E0-nine-market-scientific-${{ github.sha }}
          path: E0-final/
          retention-days: 90
          if-no-files-found: error
