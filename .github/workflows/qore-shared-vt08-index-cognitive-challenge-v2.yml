name: QORE Shared VT08 Index Cognitive Challenge V2

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - scripts/vt08_index_shared_cognitive_challenge_v2.py
      - src/qore/infrastructure/core_stack_v2/future_geometry_intelligence.py
      - src/qore/infrastructure/core_stack_v2/transition_intelligence.py
      - .github/workflows/qore-shared-vt08-index-cognitive-challenge-v2.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  shared-vt08-cognitive-challenge-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout Shared
        uses: actions/checkout@v4
        with:
          path: shared

      - name: Checkout VT08 Index PR604 source branch
        uses: actions/checkout@v4
        with:
          ref: agent/vt08-index-deep-behavior-lab-final
          path: vt08

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compose VT08 source with multi-axis Shared intelligence
        run: |
          set -euo pipefail
          mkdir -p vt08/src/qore/infrastructure/core_stack_v2 vt08/scripts
          : > vt08/src/qore/infrastructure/core_stack_v2/__init__.py
          cp shared/src/qore/infrastructure/core_stack_v2/transition_intelligence.py              vt08/src/qore/infrastructure/core_stack_v2/transition_intelligence.py
          cp shared/src/qore/infrastructure/core_stack_v2/future_geometry_intelligence.py              vt08/src/qore/infrastructure/core_stack_v2/future_geometry_intelligence.py
          cp shared/scripts/vt08_index_shared_cognitive_challenge_v2.py              vt08/scripts/vt08_index_shared_cognitive_challenge_v2.py

      - name: Install composite research tree
        run: |
          cd vt08
          pip install -e ".[dev]"

      - name: Static validation
        run: |
          cd vt08
          ruff check scripts/vt08_index_shared_cognitive_challenge_v2.py
          ruff check src/qore/infrastructure/core_stack_v2/transition_intelligence.py
          ruff check src/qore/infrastructure/core_stack_v2/future_geometry_intelligence.py
          python -m py_compile scripts/vt08_index_shared_cognitive_challenge_v2.py
          python -m py_compile src/qore/infrastructure/core_stack_v2/transition_intelligence.py
          python -m py_compile src/qore/infrastructure/core_stack_v2/future_geometry_intelligence.py

      - name: Download NAS100 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: vt08/artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: vt08/artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: vt08/artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Run Shared VT08 multi-axis diagnostic
        run: |
          cd vt08
          mkdir -p artifacts/shared-challenge-v2
          python scripts/vt08_index_shared_cognitive_challenge_v2.py             --nas100-root artifacts/NAS100             --sp500-root artifacts/SP500             --us30-root artifacts/US30             --out artifacts/shared-challenge-v2/vt08-index-shared-cognitive-challenge-v2.json             | tee artifacts/shared-challenge-v2/summary.json

      - name: Validate diagnostic governance and density
        run: |
          cd vt08
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(
              Path(
                  "artifacts/shared-challenge-v2/"
                  "vt08-index-shared-cognitive-challenge-v2.json"
              ).read_text()
          )
          assert p["identity"] == "QORE_SHARED_VT08_INDEX_COGNITIVE_CHALLENGE_V2"
          c=p["challenge"]
          assert c["source_pr"] == 604
          assert c["source_head"] == "5e307ff861df136b92d857693997d8fb950f4d79"
          assert c["official_book"] == "UNIT_R_EQUAL_RISK_PER_OPPORTUNITY"
          assert c["diagnostic_only"] is True
          assert c["execution_route_changed"] is False
          assert c["entry_abstention"] is False
          assert c["signal_suppression"] is False
          assert c["market_removal"] is False
          assert c["calendar_filter"] is False
          assert c["sizing_used"] is False
          assert c["capital_weighting_used"] is False
          assert c["outcome_used_by_classifier"] is False
          assert c["outcome_read_only_after_state_frozen"] is True
          assert c["numeric_threshold_grid_search"] is False
          assert c["future_market_input_used"] is False

          expected = {
              "five_year": 2448,
              "recent_two_year": 1017,
              "r66_consumed_failed_holdout": 773,
          }
          for key, sample in expected.items():
              w=p[key]
              assert w["sample"] == sample
              assert w["canonical_expected"] == sample
              assert w["density_retained"] == "1"
              assert len(w["decisions"]) == sample
              assert sum(w["state_counts"].values()) == sample

          g=p["governance"]
          assert g["research_only"] is True
          assert g["consumed_evidence_only"] is True
          assert g["r66_reopened_as_fresh"] is False
          assert g["fresh_holdout_opened"] is False
          assert g["candidate_certified"] is False
          assert g["vt08_methodology_modified"] is False
          assert g["merge_authorized"] is False
          assert g["live_authorized"] is False
          assert g["production_authorized"] is False
          assert g["real_capital_authorized"] is False

          print(json.dumps({
              "decision":p["decision"],
              "root_cause_model":p["root_cause_model"],
              "five_year_checks":p["five_year"]["hypothesis_checks"],
              "recent_two_year_checks":p["recent_two_year"]["hypothesis_checks"],
              "r66_checks":p["r66_consumed_failed_holdout"]["hypothesis_checks"],
          },sort_keys=True))
          PY

      - name: Bind result
        run: |
          cd vt08/artifacts/shared-challenge-v2
          echo "$GITHUB_SHA" > git-sha.txt
          echo "5e307ff861df136b92d857693997d8fb950f4d79" > vt08-pr604-head.txt
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-vt08-index-cognitive-challenge-v2-${{ github.sha }}
          path: vt08/artifacts/shared-challenge-v2/
          if-no-files-found: error
          retention-days: 90
