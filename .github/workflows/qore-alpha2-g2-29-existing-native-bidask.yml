name: QORE Alpha2 G2 29 real native cTrader bidask two consumed windows SHA QA
on:
  push:
    branches: ['research/qore-alpha2-original-intermarket-propagation-20261012']
    paths:
      - '.github/workflows/qore-alpha2-g2-29-existing-native-bidask.yml'
      - 'src/qore/research/alpha2_g2_29_real_bidask_reuse.py'
      - 'tests/research/test_alpha2_g2_29_real_bidask_reuse.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  one_signed_29_real_source_admission:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . 'pytest>=8,<9' 'ruff>=0.5,<1'
      - name: Pre-source exact G2 prereg original source paper trail
        run: |
          git merge-base --is-ancestor d1727167560e1347999796b0a98f08fa33f85344 "$GITHUB_SHA"
          test -s docs/research/QORE_ALPHA2_G2_SHARED_SOURCE29_BIDASK_REUSE_PREREG_2026-10-12.md
          ruff check src/qore/research/alpha2_g2_29_real_bidask_reuse.py tests/research/test_alpha2_g2_29_real_bidask_reuse.py
          pytest -q -o addopts='' tests/research/test_alpha2_g2_29_real_bidask_reuse.py
      - name: Read original EXACT source artifact — no broker account/secrets required
        uses: actions/download-artifact@v4
        with:
          name: qore-native-G1-29-remaining-BID-ASK-source-NOT-NET-f8262bd7cdea1fbfb2287c3c1fe0dae3be2b0efc
          run-id: '38283737706'
          github-token: ${{ github.token }}
          path: source-original29
      - name: Independently rehash BID/ASK native integer vs decimal only for 2020/2023
        run: |
          python -m qore.research.alpha2_g2_29_real_bidask_reuse source-original29 output
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("output/alpha2-g2-real29-two-past-windows-source-index.json").read_text())
          assert d["status"]=="SOURCE29_TWO_PAST_WINDOWS_SHA_VERIFIED_NOT_NET"
          assert d["market_count"]==29 and len(d["all_29"])==29
          assert d["holdout_2026_quote_values_unread"]
          assert not d["net_costs_history_complete"] and not d["live_order_authorized"]
          PY
          printf '%s\n' "$GITHUB_SHA" > output/exact-code-head-sha.txt
          (cd output && sha256sum alpha2-g2-real29-two-past-windows-source-index.json exact-code-head-sha.txt > OUTPUT_SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: alpha2-g2-real29-two-consumed-windows-source-only-${{ github.sha }}
          path: output/
          retention-days: 90
          if-no-files-found: error
