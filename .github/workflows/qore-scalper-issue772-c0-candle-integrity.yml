name: Scalper Issue772 Gate C0 H1 M15 Native Candle Integrity Nine Market

on:
  push:
    branches:
      - research/scalper-p0-h1-m15-m1-causal-direction-audit-20261011
    paths:
      - '.github/workflows/qore-scalper-issue772-c0-candle-integrity.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_issue772_c0_native_integrity_v1.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_issue772_c0_aggregate_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_scalper_issue772_c0_native_integrity_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  BASELINE_RUN: '38053946695'
  BASELINE_SHA: 'e356e7a52541e99533b25ecfef0ab9c4e9ce03c0'
  M1_RUN: '35548099334'
  M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  prereg_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff mypy pytest no synthetic candles or future information
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_scalper_issue772_c0_native_integrity_v1.py src/qore/infrastructure/trader_lab/capitalizer_scalper_issue772_c0_aggregate_v1.py tests/infrastructure/trader_lab/test_capitalizer_scalper_issue772_c0_native_integrity_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_scalper_issue772_c0_native_integrity_v1.py src/qore/infrastructure/trader_lab/capitalizer_scalper_issue772_c0_aggregate_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_scalper_issue772_c0_native_integrity_v1.py

  market:
    needs: prereg_contract
    runs-on: ubuntu-latest
    timeout-minutes: 160
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol: [USDJPY, AUDJPY, AUDUSD, GBPJPY, EURUSD, GBPUSD, XAUUSD, USDCAD, NAS100]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: scalper-a2-v49-control-${{ matrix.symbol }}-${{ env.BASELINE_SHA }}
          path: frozen
          github-token: ${{ github.token }}
          run-id: ${{ env.BASELINE_RUN }}
      - uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.M1_SHA }}
          path: native
          github-token: ${{ github.token }}
          run-id: ${{ env.M1_RUN }}
      - name: Check original provider native non synthetic no interpolated M1
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os
          m=json.loads(Path("native/m1-clone-manifest.json").read_text())
          assert m["canonical_symbol"]==os.environ["SYMBOL"]
          assert m["provider_native_m1"] and not m["synthetic_m1"]
          assert not m["interpolated_m1"] and m["contradictory_m1"]==0
          assert m["read_only"]
          PY
      - name: C0 legacy H1 M15 bucket ledger and strict provenance conditional
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_issue772_c0_native_integrity_v1 frozen native C0-market
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-issue772-C0-${{ matrix.symbol }}-${{ github.sha }}
          path: |
            C0-market/
            frozen/
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: scalper-issue772-C0-*-${{ github.sha }}
          path: nine-markets
      - name: Reconcile EXACT 2876 and 2020 A and original 20 SHA256 witnesses
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_issue772_c0_aggregate_v1 nine-markets docs/research/issue772/scalper-issue772-20-source-IDs-manifest.json C0-final
      - name: Guard source-only contract, flag all unresolved Gate C fields
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          x=json.loads(Path("C0-final/scalper-issue772-gate-c0-nine-market-results.json").read_text())
          assert x["sources"]==2876 and x["original_A"]==2020
          assert x["sample20_source_IDs_identical"]
          assert x["no_outcomes_loaded"] and not x["certified"]
          assert not x["V49_DCVC_VPS_modified"] and not x["promotable"]
          assert x["original_H1_POI_upstream_provenance_unresolved"]
          assert x["M1_first_online_CISD_unresolved"]
          print("ISSUE772_C0_VERIFIED",json.dumps({
            "all":x["sources"],"A":x["original_A"],
            "bucket_census":x["bucket_census_total"],
            "A_counts":x["counts_original_A_2020"]["counts"],
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-issue772-C0-nine-market-scientific-${{ github.sha }}
          path: C0-final/
          retention-days: 90
          if-no-files-found: error
