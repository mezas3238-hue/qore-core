name: QORE Shared A WP06 V1 Failure Knowledge

concurrency:
  group: qore-shared-a-wp06-v1-failure-knowledge
  cancel-in-progress: false

on:
  push:
    branches:
      - agent/shared-a-cognitive-science-001
    paths:
      - scripts/shared_wp06_v1_failure_knowledge.py
      - .github/workflows/qore-shared-a-wp06-v1-failure-knowledge.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate diagnostic
        run: |
          set -euo pipefail
          mkdir -p input/{r6,r5} result
          ruff check scripts/shared_wp06_v1_failure_knowledge.py
          python -m py_compile scripts/shared_wp06_v1_failure_knowledge.py
      - name: Recover burned R6 R5 source evidence
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10389112524/zip" > r6.zip
          unzip -q r6.zip -d input/r6
          (cd input/r6 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10380044761/zip" > r5.zip
          unzip -q r5.zip -d input/r5
          (cd input/r5 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)
      - name: Generate failure knowledge only
        run: |
          set -euo pipefail
          python scripts/shared_wp06_v1_failure_knowledge.py             --r6-nas input/r6/fresh/NAS100/market-evidence.json             --r6-sp input/r6/fresh/SP500/market-evidence.json             --r6-us input/r6/fresh/US30/market-evidence.json             --r5-nas input/r5/fresh/NAS100/market-evidence.json             --r5-sp input/r5/fresh/SP500/market-evidence.json             --r5-us input/r5/fresh/US30/market-evidence.json             --output result/wp06-v1-failure-knowledge.json             | tee result/summary.json
      - name: Validate non-promotional disposition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/wp06-v1-failure-knowledge.json").read_text())
          assert p["status"] == "WP06_V1_FAILURE_KNOWLEDGE_COMPLETE"
          assert p["parent_v1_status"] == "WP06_MARKET_AGENCY_CALIBRATION_OOS_FALSIFIED"
          assert p["v2_policy_selected"] is False
          assert p["v2_value_demonstrated"] is False
          assert p["numeric_threshold_rescue_selected"] is False
          assert p["burned_r6_r5_used_for_failure_knowledge_only"] is True
          assert p["protected_certification_holdout_opened"] is False
          PY
      - name: Seal result
        run: |
          printf '%s\n' "${GITHUB_SHA}" > result/code-git-sha.txt
          (
            cd result
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-a-wp06-v1-failure-knowledge-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
      - name: Report WP-06 failure knowledge
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p=json.loads(Path("result/wp06-v1-failure-knowledge.json").read_text())
          body="\n".join([
              "## Shared A WP-06 — V1 Failure Knowledge",
              "",
              f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- V2 candidate: **{p['v2_candidate']}**",
              f"- diagnostics: **{p['diagnostics']}**",
              "- V2 policy selected / value demonstrated: **False / False**",
              "- burned R6/R5 used for failure knowledge only: **True**",
              "- protected certification holdout opened: **False**",
          ])+"\n"
          Path("result/issue-comment.md").write_text(body)
          PY
          gh issue comment 644 --body-file result/issue-comment.md
