name: QORE Capitalizer Continuation Value Model V22

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/qore-capitalizer-continuation-value-model-v22.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_continuation_value_model_v22.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_continuation_value_model_v22.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-continuation-value-model-v22-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  V21_RUN_ID: '36264229554'
  V21_ARTIFACT_SHA: '05452328bbf5cbbc4b26210791d13114105e3f9d'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_continuation_value_model_v22.py \
            tests/infrastructure/trader_lab/test_capitalizer_continuation_value_model_v22.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_continuation_value_model_v22.py \
            tests/infrastructure/trader_lab/test_capitalizer_continuation_value_model_v22.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_continuation_value_model_v22.py

  aggregate:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download authoritative V21 reconstructed consumed evidence
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v21-reconstructed-*-${{ env.V21_ARTIFACT_SHA }}
          path: reconstructed
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ env.V21_RUN_ID }}
      - name: Enforce V21 source evidence and consumed identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from qore.infrastructure.trader_lab import (
              capitalizer_cognitive_r_milestone_protection_2r_v1 as milestone,
          )
          from qore.infrastructure.trader_lab import (
              capitalizer_contextual_stability_router_2r_v1 as router,
          )
          from qore.infrastructure.trader_lab import (
              capitalizer_max_recovery_direct_m1_replay_v1 as direct,
          )

          base = Path("reconstructed")
          reports = sorted(
              (base / "v21-evidence").rglob(
                  "capitalizer-*-hypothesis-survival-model-v21.json"
              )
          )
          assert len(reports) == 9
          for path in reports:
              report = json.loads(path.read_text())
              assert report["identity"] == (
                  "QORE_CAPITALIZER_HYPOTHESIS_SURVIVAL_MODEL_V21"
              )
              assert report["canonical_lifecycle_track"] == "HSM_BASE"
              assert report["current_outcome_visible_to_observation"] is False
              assert report["future_bars_visible_to_observation"] is False
              assert report["original_exit_bar_excluded"] is True

          windows = {
              "development-input": (
                  948,
                  base / "development-validation-context",
                  "dev",
              ),
              "validation-input": (
                  1034,
                  base / "development-validation-context",
                  "holdout",
              ),
              "reserved-input": (
                  1088,
                  base / "reserved-context",
                  "reserved",
              ),
          }
          for root_name, (count, context_root, role) in windows.items():
              root = base / root_name
              selected = {
                  mode.value: direct._max3_milestone(
                      direct._load_mode(root, mode=mode)
                  )
                  for mode in milestone.ProtectionMode
              }
              assert {len(rows) for rows in selected.values()} == {count}
              original = direct._load_mode(
                  root,
                  mode=milestone.ProtectionMode.ORIGINAL,
              )
              raw_keys = {(row.symbol, row.entry_at) for row in original}
              selected_keys = {
                  (row.symbol, row.entry_at)
                  for row in selected[milestone.ProtectionMode.ORIGINAL.value]
              }
              contexts = router._load_contexts(context_root, role=role)
              assert set(contexts) == raw_keys
              assert selected_keys <= set(contexts)
              assert len(selected_keys) == count
          PY
      - name: Run V22 counterfactual continuation-value replay
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_continuation_value_model_v22 \
            reconstructed/development-input \
            reconstructed/validation-input \
            reconstructed/reserved-input \
            reconstructed/development-validation-context \
            reconstructed/reserved-context \
            reconstructed/v21-evidence \
            experiment-output
      - name: Enforce V22 causal and economic contract
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          report = json.loads(
              Path(
                  "experiment-output/"
                  "capitalizer-continuation-value-model-v22.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_CONTINUATION_VALUE_MODEL_V22"
          )
          assert report["evaluation"] == (
              "CROSS_PERIOD_COUNTERFACTUAL_CONTINUATION_VALUE"
          )
          assert report["policy"] == "INVALIDATING_CV_W95_POSMEAN_N30_P2"
          assert report["canonical_lifecycle_track"] == "HSM_BASE"
          assert report["departure_r"] == "0.25"
          assert report["minimum_unique_trade_support_per_external_model"] == 30
          assert report["wilson_confidence"] == "0.95"
          assert Decimal(
              report["wilson_lower_probability_must_exceed"]
          ) == Decimal("0.50")
          assert report["persistence_full_m1_bars"] == 2
          assert report["hierarchical_backoff"] == [
              "L0", "L1", "L2", "L3", "L4", "L5"
          ]
          assert report["anti_pseudoreplication"] == (
              "UNIQUE_TRADE_PER_SIGNATURE"
          )
          assert report["all_entries_preserved"] is True
          assert Decimal(report["density_retention"]) == Decimal("1")
          assert report["surface_multiplier_preserved"] is True
          assert report["fixed_target_r"] == "2.00"
          assert report["original_stop_geometry_preserved"] is True
          assert report["max3_preserved"] is True
          assert report["symbol_session_side_time_features_used"] is False
          assert report["current_outcome_visible_to_decision"] is False
          assert report["future_bars_visible_to_decision"] is False
          assert report["original_exit_bar_excluded"] is True
          assert report["unchosen_counterfactual_visible_to_decision"] is False
          assert report["heldout_training_label_visible_to_decision"] is False
          assert report["training_label_uses_final_surface_r"] is True
          assert report["training_label_visible_to_heldout_inference"] is False
          assert report["historical_fresh_oos_available"] is False
          assert report["2018_2020_status"] == "CONSUMED_NOT_FRESH"
          assert report["automatic_policy_promotion"] is False
          assert report["trader_certified"] is False

          control = next(
              row for row in report["results"]
              if row["policy"] == "SURFACE_CONTROL"
          )
          expected = {
              "DEVELOPMENT_2024_2026": (
                  "948",
                  "6.214605199866807668753081488",
              ),
              "CONSUMED_VALIDATION_2022_2024": (
                  "1034",
                  "6.770051846347247537620893924",
              ),
              "CONSUMED_RESERVED_2020_2022": (
                  "1088",
                  "8.74798816650617431130479348",
              ),
          }
          for period, (trades, dd) in expected.items():
              row = control["heldouts"][period]
              assert str(row["trades"]) == trades
              assert str(row["metrics"]["max_drawdown_r"]) == dd

          print(json.dumps(report, sort_keys=True))
          PY
      - name: Upload final V22 evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-continuation-value-model-v22-${{ github.sha }}
          path: experiment-output
          if-no-files-found: error
          retention-days: 90
