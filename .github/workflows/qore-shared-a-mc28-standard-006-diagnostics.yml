name: QORE Shared A MC28 Standard 006 Diagnostics

concurrency:
  group: qore-shared-a-mc28-standard-006-diagnostics
  cancel-in-progress: false

on:
  push:
    branches:
      - agent/shared-a-cognitive-science-001
    paths:
      - src/qore/infrastructure/core_stack_v2/system_blindspot_diagnostics.py
      - tests/infrastructure/test_core_stack_v2_system_blindspot_diagnostics.py
      - scripts/shared_mc28_standard_006_diagnostic_taxonomy.py
      - .github/workflows/qore-shared-a-mc28-standard-006-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and validate
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          mkdir -p result
          ruff check \
            src/qore/infrastructure/core_stack_v2/system_blindspot_diagnostics.py \
            tests/infrastructure/test_core_stack_v2_system_blindspot_diagnostics.py \
            scripts/shared_mc28_standard_006_diagnostic_taxonomy.py
          mypy src/qore/infrastructure/core_stack_v2/system_blindspot_diagnostics.py
          pytest -q tests/infrastructure/test_core_stack_v2_system_blindspot_diagnostics.py
      - name: Verify B evidence gates
        run: |
          set -euo pipefail
          for spec in \
            "36763268609:11119388121" \
            "36764365409:11120521150" \
            "36764376550:11120391213"
          do
            run_id="${spec%%:*}"
            artifact_id="${spec#*:}"
            test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion')" = "success"
            test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" --jq '.expired')" = "false"
          done
      - name: Audit Standard 006 taxonomy
        run: |
          python scripts/shared_mc28_standard_006_diagnostic_taxonomy.py \
            | tee result/summary.json
      - name: Validate fail-closed disposition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/mc28-standard-006-diagnostic-taxonomy.json").read_text())
          assert p["status"] == "MC28_STANDARD_006_DIAGNOSTIC_CONTRACT_PASS_OPEN_5"
          assert p["required_diagnostic_count"] == 8
          assert p["bound_diagnostic_count"] == 3
          assert p["open_diagnostic_count"] == 5
          assert set(p["open_diagnostics"]) == {
              "CLOCK_DRIFT",
              "MAPPING_ERRORS",
              "BROKER_PROVIDER_MISMATCH",
              "EXECUTION_QUALITY_DETERIORATION",
              "MODEL_RUNTIME_INSTABILITY",
          }
          assert p["mc28_completed_and_proven"] is False
          assert p["productive_authority"] is False
          assert p["master_ledger_mutated"] is False
          assert p["protected_certification_holdout_opened"] is False
          PY
      - name: Seal
        run: |
          printf '%s\n' "${GITHUB_SHA}" > result/code-git-sha.txt
          (cd result && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-a-mc28-standard-006-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
      - name: Report
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p=json.loads(Path("result/mc28-standard-006-diagnostic-taxonomy.json").read_text())
          body="\n".join([
              "## Shared A MC-28 — Standard 006 Diagnostic Taxonomy",
              "",
              f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- bound diagnostics: **{p['bound_diagnostic_count']}/8**",
              f"- open diagnostics: **{p['open_diagnostic_count']}/8**",
              f"- open: **{', '.join(p['open_diagnostics'])}**",
              "- old B runtime/inventory blockers satisfied: **True**",
              "- open-world boundary preserved: **True**",
              "- MC-28 completed-and-proven: **False**",
              "- master ledger mutated: **False**",
          ])+"\n"
          Path("result/issue-comment.md").write_text(body)
          PY
          gh issue comment 638 --body-file result/issue-comment.md
