name: QORE Shared VT08 Context Conditioned Economic Shadow V16

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - scripts/vt08_index_shared_context_conditioned_economic_shadow_v16.py
      - scripts/vt08_index_shared_context_conditioned_competing_risk_v15.py
      - .github/workflows/qore-shared-vt08-context-conditioned-economic-v16.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  context-conditioned-economic-shadow-v16:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout Shared
        uses: actions/checkout@v4
        with:
          path: shared

      - name: Checkout VT08 Index PR604 source branch
        uses: actions/checkout@v4
        with:
          ref: agent/vt08-index-deep-behavior-lab-final
          path: vt08

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compose VT08 falsification surface with frozen Shared frontier
        run: |
          set -euo pipefail
          mkdir -p vt08/src/qore/infrastructure/core_stack_v2 vt08/scripts
          : > vt08/src/qore/infrastructure/core_stack_v2/__init__.py
          for file in \
            contracts.py \
            intelligence.py \
            analog_memory.py \
            competing_future_intelligence.py \
            competing_risk_decision_gate.py \
            competing_risk_path_core.py \
            drawdown_phenotype_memory.py \
            environment_intelligence.py \
            future_geometry_intelligence.py \
            instinct_intelligence.py \
            journey_intelligence.py \
            path_intelligence.py \
            perception_engine.py \
            realtime_trade_management.py \
            recovery_failure_intelligence.py \
            terminal_failure_confirmation.py \
            resident_convergence_intelligence.py \
            stop_target_discrimination.py \
            stability_intelligence.py \
            transition_intelligence.py
          do
            cp "shared/src/qore/infrastructure/core_stack_v2/$file" \
               "vt08/src/qore/infrastructure/core_stack_v2/$file"
          done
          for script in \
            vt08_index_shared_cognitive_challenge_v2.py \
            vt08_index_shared_full_stack_no_sizing_v3.py \
            vt08_index_shared_stop_target_discrimination_v6.py \
            vt08_index_shared_terminal_failure_economic_shadow_v7.py \
            vt08_index_shared_competing_risk_calibration_v9.py \
            vt08_index_shared_context_conditioned_competing_risk_v15.py \
            vt08_index_shared_context_conditioned_economic_shadow_v16.py
          do
            cp "shared/scripts/$script" "vt08/scripts/$script"
          done

      - name: Install composite research tree
        run: |
          cd vt08
          pip install -e ".[dev]"
          pip install "numpy>=2,<3" "scikit-learn>=1.5,<2"

      - name: Static validation
        run: |
          cd vt08
          ruff check scripts/vt08_index_shared_context_conditioned_economic_shadow_v16.py
          python -m py_compile scripts/vt08_index_shared_context_conditioned_economic_shadow_v16.py

      - name: Download frozen V6 consumed ledger
        uses: actions/download-artifact@v4
        with:
          name: qore-shared-vt08-stop-target-discrimination-v6-1a534d0ae735efef4dcbc0c0be4b110ceaa80501
          path: vt08/artifacts/v6
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36131607443

      - name: Download NAS100 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: vt08/artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: vt08/artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: vt08/artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Run V16 economic shadow
        run: |
          set -euo pipefail
          cd vt08
          mkdir -p artifacts/shared-v16
          python scripts/vt08_index_shared_context_conditioned_economic_shadow_v16.py \
            --v6-json artifacts/v6/vt08-index-shared-stop-target-discrimination-v6.json \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/shared-v16/vt08-index-shared-context-conditioned-economic-v16.json \
            | tee artifacts/shared-v16/summary.json

      - name: Validate V16 governance
        run: |
          cd vt08
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(
              Path(
                  "artifacts/shared-v16/"
                  "vt08-index-shared-context-conditioned-economic-v16.json"
              ).read_text()
          )
          assert p["identity"] == "QORE_SHARED_VT08_CONTEXT_CONDITIONED_ECONOMIC_SHADOW_V16"
          assert p["source_v6_run"] == 36131607443
          assert p["source_v15_run"] == 36141968333
          assert p["source_v15_head"] == "4ad057663740b450f97188ed25b896ce62da5a82"
          assert p["frozen_policy_cell"] == "path_state=CONTESTED&environment_state=FRAGILE|P>=0.900"
          assert p["v15_validation_pass_required"] is True
          assert p["research_only"] is True
          assert p["consumed_evidence_only"] is True
          assert p["fresh_holdout_opened"] is False

          expected={
              "five_year":2448,
              "recent_two_year":1017,
              "r66_consumed_failed_holdout":773,
          }
          for key,sample in expected.items():
              w=p["windows"][key]
              assert w["sample"] == sample
              assert w["canonical_expected"] == sample
              assert w["density_retained_shadow"] == "1"
              assert w["policy_cell"] == p["frozen_policy_cell"]
              assert w["combined_exit_count"] >= w["v15_context_selected_exit_count"]
              assert "primary_profit_factor" in w["economic_delta_vs_baseline"]
              assert "primary_conservative_mtm_dd_improvement_r" in w["economic_delta_vs_baseline"]
              assert "primary_profit_factor" in w["incremental_economic_delta_vs_v7"]
              c=w["contract"]
              assert c["shadow_only"] is True
              assert c["same_trade_count"] is True
              assert c["same_initial_position_size"] is True
              assert c["sizing_used"] is False
              assert c["risk_weighting_used"] is False
              assert c["signal_suppression_used"] is False
              assert c["stop_mutation_used"] is False
              assert c["target_mutation_used"] is False
              assert c["trailing_used"] is False
              assert c["target_extension_used"] is False
              assert c["only_frozen_v7_or_v15_exit_change"] is True
              assert c["future_outcome_input_used"] is False
              assert c["realized_outcome_used_for_scoring_only"] is True

          g=p["governance"]
          assert g["runtime_actuation"] is False
          assert g["live_authorized"] is False
          assert g["production_authorized"] is False
          assert g["real_capital_authorized"] is False
          assert g["merge_authorized"] is False
          PY

      - name: Bind result
        run: |
          cd vt08/artifacts/shared-v16
          echo "$GITHUB_SHA" > shared-git-sha.txt
          echo "36131607443" > source-v6-run.txt
          echo "36141968333" > source-v15-run.txt
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-vt08-context-conditioned-economic-v16-${{ github.sha }}
          path: vt08/artifacts/shared-v16/
          if-no-files-found: error
          retention-days: 90
