name: QORE CIBO Atlas VT31 Root Cause Attribution

on:
  push:
    branches: [agent/cibo-atlas-vt31-market-specialists-001]
    paths:
      - scripts/cibo_atlas_vt31_root_cause_attribution.py
      - .github/workflows/cibo-atlas-vt31-root-cause-attribution.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  root-cause-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research runtime
        run: pip install -e .[dev]
      - name: Static validation
        run: |
          set -euo pipefail
          python -m py_compile scripts/cibo_atlas_vt31_root_cause_attribution.py
          ruff check --ignore E501 scripts/cibo_atlas_vt31_root_cause_attribution.py
          mypy src/qore/infrastructure/cibo_atlas_market_lab.py
          python scripts/cibo_atlas_vt31_root_cause_attribution.py --self-test
      - name: Recover immutable definitive forensics
        run: |
          set -euo pipefail
          artifact_id=10440468729
          expected=2d6a2c609a0fb0caf11f936623ed4907450e0f9a8581b4f6b54997b89b743b65
          digest="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" --jq .digest)"
          test "$digest" = "sha256:${expected}"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > forensics.zip
          echo "${expected}  forensics.zip" | sha256sum -c -
          mkdir forensics
          unzip -q forensics.zip -d forensics
          (cd forensics && sha256sum -c SHA256SUMS)
          test "$(cat forensics/git-sha.txt)" = "ac05b3c84433bf052b494bbc5b803e98de66e571"
          test -f forensics/vt31-tick-corrected-deep-forensics.json
          printf '%s\n' "$artifact_id" > forensics-artifact-id.txt
          printf '%s\n' "$digest" > forensics-artifact-digest.txt
      - name: Recover immutable full gap05 Atlas
        run: |
          set -euo pipefail
          artifact_id=10467818090
          expected=e613fbd237e54a7b91dce4aee8874585057ac41395560052978b7fd2f4139cc9
          digest="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" --jq .digest)"
          test "$digest" = "sha256:${expected}"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > atlas.zip
          echo "${expected}  atlas.zip" | sha256sum -c -
          mkdir atlas
          unzip -q atlas.zip -d atlas
          (cd atlas && sha256sum -c SHA256SUMS)
          test "$(cat atlas/git-sha.txt)" = "65a3b329b8ecabab948381b57c6612aa3f86354d"
          test -f atlas/cibo-atlas-vt31-historical-market-scanner-gap05.json
          test -f atlas/cibo-atlas-vt31-market-day-matrix-gap05.csv
          printf '%s\n' "$artifact_id" > atlas-artifact-id.txt
          printf '%s\n' "$digest" > atlas-artifact-digest.txt
      - name: Build root-cause attribution
        run: |
          set -euo pipefail
          mkdir result
          python scripts/cibo_atlas_vt31_root_cause_attribution.py \
            --forensics forensics/vt31-tick-corrected-deep-forensics.json \
            --scanner atlas/cibo-atlas-vt31-historical-market-scanner-gap05.json \
            --matrix atlas/cibo-atlas-vt31-market-day-matrix-gap05.csv \
            --output-dir result
      - name: Validate causal governance and conservation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('result/cibo-atlas-vt31-root-cause-attribution.json').read_text())
          assert p['schema']=='qore.cibo_atlas.vt31.root_cause_attribution.v1'
          assert p['research_only'] is True and p['selection_prohibited'] is True
          assert p['opens_new_holdout'] is False
          assert p['candidate_status']=='NO_R9_NOT_CERTIFIED'
          assert p['live_authorized'] is False and p['production_authorized'] is False
          assert p['terminal_root_count']==618
          assert p['stop_root_count']==463
          assert p['proof_contract']['source_objective_beyond_2r_for_all_terminal_rows'] is True
          assert p['proof_contract']['does_not_prove_stop_should_be_widened'] is True
          assert set(p['by_market'])=={'NAS100','SP500','US30'}
          assert sum(p['by_market'][m]['terminal_count'] for m in p['by_market'])==618
          assert sum(p['by_market'][m]['stop_count'] for m in p['by_market'])==463
          print(json.dumps({'stops':p['stop_root_count'],'demonstrated':p['demonstrated_exit_before_eventual_source_objective_count'],'rate':p['demonstrated_rate_of_all_stops'],'by_market':p['by_market'],'cross_index':p['demonstrated_cross_index_states']},sort_keys=True))
          PY
      - name: Bind immutable attribution artifact
        run: |
          set -euo pipefail
          echo "$GITHUB_SHA" > result/git-sha.txt
          cp forensics-artifact-id.txt forensics-artifact-digest.txt result/
          cp atlas-artifact-id.txt atlas-artifact-digest.txt result/
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-atlas-vt31-root-cause-attribution-${{ github.sha }}
          path: result/
          retention-days: 90
