name: QORE Turtle Soup XAUUSD R19 Full CIBO Memory Trailing Brain

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-xauusd-r3-forensics-001
    paths:
      - '.github/workflows/turtle-soup-xauusd-r19-full-cibo-memory-trailing-brain.yml'
      - 'src/qore/infrastructure/trader_lab/cibo_xauusd_trader_memory_bridge_v1.py'
      - 'tests/infrastructure/trader_lab/test_cibo_xauusd_trader_memory_bridge_v1.py'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r19_full_cibo_memory_trailing_brain.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r19_full_cibo_memory_trailing_brain.py'

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-XAUUSD-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-XAUUSD-2f510461b3360e91d5ee70a72716a76cd6561f16'
  DOSSIER_RUN_ID: '35291722997'
  DOSSIER_ARTIFACT: 'qore-cibo-xauusd-market-intelligence-v1-8068f78df709b9a1702f14264f76c653140c9c1f'
  R18_RUN_ID: '35290461593'
  R18_ARTIFACT: 'qore-turtle-soup-xauusd-r18-memory-brain-6b81ebed525226d2fa9c543a9f2a5794dbfa37fa'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check --ignore E501,I001 \
            src/qore/infrastructure/trader_lab/cibo_xauusd_trader_memory_bridge_v1.py \
            tests/infrastructure/trader_lab/test_cibo_xauusd_trader_memory_bridge_v1.py \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r19_full_cibo_memory_trailing_brain.py \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r19_full_cibo_memory_trailing_brain.py
      - name: Mypy focused gate
        run: |
          mypy --disable-error-code attr-defined \
            src/qore/infrastructure/trader_lab/cibo_xauusd_trader_memory_bridge_v1.py \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r19_full_cibo_memory_trailing_brain.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_cibo_xauusd_trader_memory_bridge_v1.py \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r19_full_cibo_memory_trailing_brain.py

  replay-2y:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable consumed XAUUSD M5 corpus
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download immutable consumed XAUUSD Target Destination V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Download official CIBO XAUUSD 10Y intelligence dossier
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.DOSSIER_ARTIFACT }}
          path: cibo-dossier
          github-token: ${{ github.token }}
          run-id: ${{ env.DOSSIER_RUN_ID }}
      - name: Download immutable R18 reference
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.R18_ARTIFACT }}
          path: r18-reference
          github-token: ${{ github.token }}
          run-id: ${{ env.R18_RUN_ID }}
      - name: Run full-CIBO memory static vs trailing replay
        run: |
          mkdir -p r19-output
          python -m qore.infrastructure.trader_lab.turtle_soup_xauusd_r19_full_cibo_memory_trailing_brain \
            source-xauusd target-xauusd cibo-dossier r18-reference r19-output \
            > r19-output/stdout.json
          printf '%s\n' "$GITHUB_SHA" > r19-output/git-sha.txt
      - name: Enforce memory, trailing, and governance contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('r19-output/r19-full-cibo-trailing-report.json').read_text())
          assert p['identity']=='TURTLE_SOUP_XAUUSD_R19_FULL_CIBO_MEMORY_TRAILING_BRAIN_V1'
          assert p['window']['open']=='2024-09-17T00:00:00+00:00'
          assert p['window']['close']=='2026-09-17T00:00:00+00:00'
          assert p['reproduction']['retained_bars']==707716
          m=p['full_cibo_memory']
          assert m['bridge']['governed_cibo_memory_store'] is True
          assert m['bridge']['dossier_identity']=='CIBO_XAUUSD_MARKET_INTELLIGENCE_DOSSIER_V1'
          assert m['official_dossier_run_id']==35291722997
          assert m['official_dossier_artifact_id']==10526391489
          assert m['memory_store_used_by_decision_engine'] is True
          t=p['trailing_contract']
          assert t['stop_can_only_improve'] is True
          assert t['stop_can_never_be_widened'] is True
          assert t['new_stop_effective_no_earlier_than_next_bar'] is True
          assert t['same_bar_future_knowledge_used'] is False
          assert p['variants']['FULL_CIBO_STATIC']['executed_trades'] > 0
          assert p['variants']['FULL_CIBO_TRAILING']['executed_trades'] > 0
          d=p['decision_contract']
          assert d['r3_pnl_router_used'] is False
          assert d['full_cibo_e1_memory_controls_entry_permission'] is False
          assert d['pnl_score_used'] is False
          assert d['profit_probability_used'] is False
          g=p['governance']
          assert g['fresh_holdout_consumed'] is False
          assert g['rule_promoted'] is False
          assert g['live_authorized'] is False
          assert g['real_capital_authorized'] is False
          PY
      - name: Hash immutable R19 result
        run: |
          cd r19-output
          sha256sum \
            r19-full-cibo-trailing-report.json \
            r19-full-cibo-static-trades.json \
            r19-full-cibo-trailing-trades.json \
            stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-xauusd-r19-full-cibo-trailing-${{ github.sha }}
          path: r19-output
          if-no-files-found: error
          retention-days: 90
