name: QORE CIBO USD60 Pre-Exam Readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-usd60-pre-exam-readiness.yml'
      - 'src/qore/infrastructure/cibo_usd60_exam_readiness.py'
      - 'src/qore/infrastructure/cibo_ce2i_usd60_six_month_certification.py'
      - 'src/qore/infrastructure/cibo_ce2i_usd60_robust_capacity.py'
      - 'src/qore/infrastructure/cibo_arch_b_forward_economic_manifest.py'
      - 'tests/infrastructure/test_cibo_usd60_exam_readiness.py'
      - 'tests/infrastructure/test_cibo_ce2i_usd60_six_month_certification.py'
      - 'tests/infrastructure/test_cibo_ce2i_usd60_robust_capacity.py'
      - 'docs/research/CIBO-B-USD60-PRE-EXAM-READINESS-V1.md'
  push:
    branches:
      - agent/cibo-certification-architect-b-integration-001
    paths:
      - '.github/workflows/cibo-usd60-pre-exam-readiness.yml'
      - 'src/qore/infrastructure/cibo_usd60_exam_readiness.py'
      - 'src/qore/infrastructure/cibo_ce2i_usd60_six_month_certification.py'
      - 'src/qore/infrastructure/cibo_ce2i_usd60_robust_capacity.py'
      - 'src/qore/infrastructure/cibo_arch_b_forward_economic_manifest.py'
      - 'tests/infrastructure/test_cibo_usd60_exam_readiness.py'
      - 'tests/infrastructure/test_cibo_ce2i_usd60_six_month_certification.py'
      - 'tests/infrastructure/test_cibo_ce2i_usd60_robust_capacity.py'
      - 'docs/research/CIBO-B-USD60-PRE-EXAM-READINESS-V1.md'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  usd60-pre-exam-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: USD60 pre-exam gate quality
        run: |
          ruff check \
            src/qore/infrastructure/cibo_usd60_exam_readiness.py \
            src/qore/infrastructure/cibo_arch_b_forward_economic_manifest.py \
            tests/infrastructure/test_cibo_usd60_exam_readiness.py
          mypy \
            src/qore/infrastructure/cibo_usd60_exam_readiness.py \
            src/qore/infrastructure/cibo_arch_b_forward_economic_manifest.py
          python -m py_compile \
            src/qore/infrastructure/cibo_usd60_exam_readiness.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_usd60_exam_readiness.py \
            tests/infrastructure/test_cibo_ce2i_usd60_six_month_certification.py \
            tests/infrastructure/test_cibo_ce2i_usd60_robust_capacity.py \
            tests/infrastructure/test_cibo_arch_b_forward_economic_manifest.py
