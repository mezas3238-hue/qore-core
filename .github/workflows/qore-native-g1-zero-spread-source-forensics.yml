name: QORE Native G1 zero spread same-ms source forensic 29 real feeds NO NET

on:
  push:
    branches:
      - research/qore-native-g1-zero-spread-same-ms-forensics-20261012
    paths:
      - '.github/workflows/qore-native-g1-zero-spread-source-forensics.yml'
      - 'src/qore/infrastructure/trader_lab/qore_native_g1_zero_spread_same_ms_forensics_v1.py'
      - 'tests/infrastructure/trader_lab/test_qore_native_g1_zero_spread_same_ms_forensics_v1.py'
      - 'docs/research/QORE_NATIVE_G1_ZERO_SPREAD_SAME_MS_PREREG_2026-10-12.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  real29_zero_spread_forensics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research QA only
        run: python -m pip install -e '.[dev]'
      - name: Check frozen forensic hypothesis and synthetic causality
        run: |
          set -euo pipefail
          test -s docs/research/QORE_NATIVE_G1_ZERO_SPREAD_SAME_MS_PREREG_2026-10-12.md
          ruff check --select F,E4,E7,E9 src/qore/infrastructure/trader_lab/qore_native_g1_zero_spread_same_ms_forensics_v1.py tests/infrastructure/trader_lab/test_qore_native_g1_zero_spread_same_ms_forensics_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_qore_native_g1_zero_spread_same_ms_forensics_v1.py
      - name: Restore immutable original 29 cTrader BID ASK source artifact
        uses: actions/download-artifact@v4
        with:
          name: qore-native-G1-29-remaining-BID-ASK-source-NOT-NET-f8262bd7cdea1fbfb2287c3c1fe0dae3be2b0efc
          run-id: '38283737706'
          github-token: ${{ github.token }}
          path: original-source
      - name: Full parent SHA audit and clock age sensitivity across all 29 markets
        run: |
          set -euo pipefail
          python -m qore.infrastructure.trader_lab.qore_native_g1_zero_spread_same_ms_forensics_v1 original-source zero-forensics
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("zero-forensics/G1_29_SOURCE_ZERO_SIMULTANEITY_NOT_NET.json").read_text())
          assert x["markets_verified"]==29
          assert x["parent_qa_agreement_exact"]
          assert x["zero_total"]==5727
          assert sum(x["zero_age_bins"].values())==5727
          assert not x["historical_NET_authorized"]
          assert not x["historical_broker_zero_spread_semantics_verified"]
          assert x["certified_traders"]==0
          print("G1_ZERO_SPREAD_SOURCE_FORENSICS_COUNTS_PASS; NO_NET")
          PY
          printf '%s\n' "$GITHUB_SHA" > zero-forensics/auditor-head-sha.txt
          (cd zero-forensics && sha256sum *.json auditor-head-sha.txt > AUDIT_REPORT_SHA256SUMS.txt)
      - name: Upload aggregated source QA only, no provider prices
        uses: actions/upload-artifact@v4
        with:
          name: qore-native-G1-zero-spread-source-forensics-NOT-NET-${{ github.sha }}
          path: zero-forensics/
          retention-days: 90
          if-no-files-found: error
