name: QORE VT31 NAS100 Reasoning Sovereignty Conflict V1

on:
  push:
    branches:
      - agent/vt31-nas100-intelligence-pilot-001
    paths:
      - scripts/vt31_nas100_r5_reasoning_sovereignty_conflict_forensics_v1.py
      - .github/workflows/vt31-nas100-r5-reasoning-sovereignty-conflict-v1.yml
  pull_request:
    paths:
      - scripts/vt31_nas100_r5_reasoning_sovereignty_conflict_forensics_v1.py
      - .github/workflows/vt31-nas100-r5-reasoning-sovereignty-conflict-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed_holdout
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Static gate
        run: |
          set -euo pipefail
          python -m py_compile             scripts/vt31_nas100_r5_reasoning_sovereignty_conflict_forensics_v1.py
          ruff check             scripts/vt31_nas100_r5_reasoning_sovereignty_conflict_forensics_v1.py

      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"

      - name: Run reasoning sovereignty conflict forensics
        run: |
          set -euo pipefail
          python scripts/vt31_nas100_r5_reasoning_sovereignty_conflict_forensics_v1.py             "input/${EVIDENCE_PATH}"             --partition "$PARTITION"             --output "result/reasoning-conflict-${PARTITION}.json"             | tee "result/summary-${PARTITION}.json"

      - name: Governance gate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          partition = os.environ["PARTITION"]
          path = Path(f"result/reasoning-conflict-{partition}.json")
          payload = json.loads(path.read_text())
          assert payload["allocation_profile"] == "ALLOC_G_CORE_FAMILY_050"
          g = payload["governance"]
          assert g["consumed_evidence_only"] is True
          assert g["diagnostic_only"] is True
          assert g["reasoning_state_captured_pre_fallback"] is True
          assert g["post_outcome_fields_diagnostic_only"] is True
          assert g["trade_authorization_changed"] is False
          assert g["entry_changed"] is False
          assert g["stop_changed"] is False
          assert g["target_changed"] is False
          assert g["allocation_profile_changed"] is False
          assert g["uses_terminal_pnl_at_runtime"] is False
          assert g["uses_fold_identity_at_runtime"] is False
          assert g["uses_calendar_time_at_runtime"] is False
          assert g["opens_new_holdout"] is False
          assert g["policy_promoted"] is False
          assert g["candidate_certified"] is False
          assert g["live_authorized"] is False
          assert g["production_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-reasoning-conflict-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-nas100-reasoning-conflict-*-${{ github.sha }}
          path: input
          merge-multiple: true

      - name: Aggregate reasoning conflict evidence
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          folds = {}
          for path in Path("input").glob("reasoning-conflict-*.json"):
              payload = json.loads(path.read_text())
              folds[payload["partition"]] = payload
          assert set(folds) == {"r5", "r6", "r8", "consumed_holdout"}

          names = ("r5", "r6", "r8", "consumed_holdout")

          contradiction_keys = set.intersection(
              *(
                  set(
                      folds[fold]["first_trade_analysis"][
                          "contradiction_codes"
                      ]
                  )
                  for fold in names
              )
          )
          stable_harmful = []
          for code in sorted(contradiction_keys):
              per_fold = {
                  fold: folds[fold]["first_trade_analysis"][
                      "contradiction_codes"
                  ][code]
                  for fold in names
              }
              if all(int(per_fold[fold]["sample"]) >= 5 for fold in names):
                  negative = sum(
                      Decimal(per_fold[fold]["mean_r"]) < 0
                      for fold in names
                  )
                  if negative >= 3:
                      stable_harmful.append(
                          {
                              "code": code,
                              "negative_folds": negative,
                              "per_fold": per_fold,
                          }
                      )

          uncertainty_keys = set.intersection(
              *(
                  set(
                      folds[fold]["first_trade_analysis"][
                          "uncertainty_codes"
                      ]
                  )
                  for fold in names
              )
          )
          stable_uncertainty = []
          for code in sorted(uncertainty_keys):
              per_fold = {
                  fold: folds[fold]["first_trade_analysis"][
                      "uncertainty_codes"
                  ][code]
                  for fold in names
              }
              if all(int(per_fold[fold]["sample"]) >= 5 for fold in names):
                  negative = sum(
                      Decimal(per_fold[fold]["mean_r"]) < 0
                      for fold in names
                  )
                  if negative >= 3:
                      stable_uncertainty.append(
                          {
                              "code": code,
                              "negative_folds": negative,
                              "per_fold": per_fold,
                          }
                      )

          report = {
              "schema": (
                  "qore.vt31.nas100.r5.reasoning_sovereignty_conflict."
                  "aggregate.v1"
              ),
              "by_fold": {
                  fold: {
                      "by_core_action": folds[fold][
                          "first_trade_analysis"
                      ]["by_core_action"],
                      "by_authorization_reason": folds[fold][
                          "first_trade_analysis"
                      ]["by_authorization_reason"],
                      "override_conflict": folds[fold][
                          "first_trade_analysis"
                      ]["override_conflict"],
                  }
                  for fold in names
              },
              "stable_harmful_contradictions": stable_harmful,
              "stable_harmful_uncertainty": stable_uncertainty,
              "consumed_blocks": folds["consumed_holdout"][
                  "consumed_blocks"
              ],
              "governance": {
                  "diagnostic_only": True,
                  "policy_promoted": False,
                  "opens_new_holdout": False,
                  "candidate_certified": False,
              },
          }
          Path("result/aggregate.json").write_text(
              json.dumps(report, sort_keys=True, indent=2) + "\n"
          )
          print(json.dumps(report, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-reasoning-conflict-aggregate-${{ github.sha }}
          path: result/
          retention-days: 90
