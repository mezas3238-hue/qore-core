name: QORE Capitalizer Multi-Position Causal Episode Simulator V36

on:
  push:
    branches:
      - agent/capitalizer-multiposition-episode-v36-001
    paths:
      - '.github/workflows/qore-capitalizer-multi-position-causal-episode-simulator-v36.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_multi_position_causal_episode_simulator_v36.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_multi_position_causal_episode_simulator_v36.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  V21_RUN_ID: '36264229554'
  V21_ARTIFACT_SHA: '05452328bbf5cbbc4b26210791d13114105e3f9d'
  TRANSITION_RUN_ID: '36332714846'
  TRANSITION_ARTIFACT: 'qore-capitalizer-counterfactual-portfolio-episode-simulator-v1-sharded-9c24cdf22e633a09701c6f22c04211b1ddfc3ee0'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_multi_position_causal_episode_simulator_v36.py \
            tests/infrastructure/trader_lab/test_capitalizer_multi_position_causal_episode_simulator_v36.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_multi_position_causal_episode_simulator_v36.py \
            tests/infrastructure/trader_lab/test_capitalizer_multi_position_causal_episode_simulator_v36.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_multi_position_causal_episode_simulator_v36.py

  experiment:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download authoritative reconstructed consumed evidence
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v21-reconstructed-*-${{ env.V21_ARTIFACT_SHA }}
          path: reconstructed
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ env.V21_RUN_ID }}
      - name: Download authoritative single-action transition evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TRANSITION_ARTIFACT }}
          path: transitions
          github-token: ${{ github.token }}
          run-id: ${{ env.TRANSITION_RUN_ID }}
      - name: Run V36 exact multi-position episode simulator
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_multi_position_causal_episode_simulator_v36 \
            reconstructed/development-input \
            reconstructed/validation-input \
            reconstructed/reserved-input \
            reconstructed/development-validation-context \
            reconstructed/reserved-context \
            transitions/capitalizer-counterfactual-portfolio-episode-simulator-v1-transitions.jsonl \
            experiment-output
      - name: Enforce V36 frozen contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(
              Path(
                  "experiment-output/"
                  "capitalizer-multi-position-causal-episode-simulator-v36.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_MULTI_POSITION_CAUSAL_EPISODE_SIMULATOR_V36"
          )
          assert report["source_transition_identity"] == (
              "QORE_CAPITALIZER_COUNTERFACTUAL_PORTFOLIO_EPISODE_SIMULATOR_V1"
          )
          assert report["transition_seed_selection"] == (
              "PER_MAX_DD_ENTRANT_TAIL_MIN_AND_VALUE_MAX"
          )
          assert report["seed_selection_numeric_threshold_added"] is False
          assert report["concurrency_requirement"] == (
              "DISTINCT_ENTRANTS_ACTIVE_AT_AT_LEAST_ONE_CAUSAL_TRIGGER"
          )
          assert report["pair_replay"] == "EXACT_DYNAMIC_PLAN_WITH_FEEDBACK"
          assert report["downstream_surface_mode_recomputed"] is True
          assert report["downstream_surface_multiplier_recomputed"] is True
          assert report["memory_recomputed"] is True
          assert report["same_entrant_identities"] is True
          assert report["density_retention"] == "1"
          assert report["new_protection_geometry_created"] is False
          assert report["sizing_changed"] is False
          assert report["max3_preserved"] is True
          assert report["outcome_aware_diagnostic"] is True
          assert report["runtime_policy_candidate"] is False
          assert report["fresh_holdout_opened"] is False
          assert report["candidate_count"] == 0
          assert report["trader_certified"] is False
          expected={
              "DEVELOPMENT_2024_2026":948,
              "CONSUMED_VALIDATION_2022_2024":1034,
              "CONSUMED_RESERVED_2020_2022":1088,
          }
          for row in report["results"]:
              assert row["surface"]["trades"] == expected[row["period"]]
              assert row["same_entrant_identities"] is True
              assert row["density_retention"] == "1"
              assert row["candidate_concurrent_pair_count"] >= (
                  row["valid_exact_pair_count"]
              )
              assert row["candidate_concurrent_pair_count"] == (
                  row["valid_exact_pair_count"]
                  + row["invalid_after_feedback_pair_count"]
              )
          print(json.dumps(report, sort_keys=True))
          PY
      - name: Upload V36 evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-multi-position-causal-episode-simulator-v36-${{ github.sha }}
          path: experiment-output
          if-no-files-found: error
          retention-days: 90
