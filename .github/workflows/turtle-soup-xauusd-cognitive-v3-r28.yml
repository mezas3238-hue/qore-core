name: QORE Turtle Soup XAUUSD Cognitive V3 R28

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-xauusd-specialist-memory-v1-001
    paths:
      - '.github/workflows/turtle-soup-xauusd-cognitive-v3-r28.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_xauusd_specialist_cognitive_memory_v3.py'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r28_validated_specialist_brain.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_xauusd_specialist_cognitive_memory_v3.py'

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-XAUUSD-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-XAUUSD-2f510461b3360e91d5ee70a72716a76cd6561f16'
  V2_RUN_ID: '35305072887'
  V2_SHA: '1c5f302af3cb77dcdb11351f62fa196eb0ba39e2'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check --ignore E501,I001             src/qore/infrastructure/trader_lab/turtle_soup_xauusd_specialist_cognitive_memory_v3.py             src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r28_validated_specialist_brain.py             tests/infrastructure/trader_lab/test_turtle_soup_xauusd_specialist_cognitive_memory_v3.py
      - name: Mypy focused gate
        run: |
          mypy --disable-error-code attr-defined             src/qore/infrastructure/trader_lab/turtle_soup_xauusd_specialist_cognitive_memory_v3.py             src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r28_validated_specialist_brain.py
      - name: Focused tests
        run: |
          pytest -q --no-cov             tests/infrastructure/trader_lab/test_turtle_soup_xauusd_specialist_cognitive_memory_v3.py

  cognitive-v3-and-r28:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable XAUUSD raw master
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download immutable Target Destination V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Download structural Cognitive V2 evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-turtle-soup-xauusd-structural-specialist-v2-r27-${{ env.V2_SHA }}
          path: structural-v2
          github-token: ${{ github.token }}
          run-id: ${{ env.V2_RUN_ID }}
      - name: Build Cognitive Memory V3 economic validation overlay
        run: |
          mkdir -p cognitive-v3
          python -m qore.infrastructure.trader_lab.turtle_soup_xauusd_specialist_cognitive_memory_v3             structural-v2 cognitive-v3 > cognitive-v3/stdout.json
      - name: Enforce V3 contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('cognitive-v3/turtle-soup-xauusd-specialist-cognitive-memory-v3-report.json').read_text())
          assert p['identity']=='TURTLE_SOUP_XAUUSD_SPECIALIST_COGNITIVE_MEMORY_V3'
          d=p['decision_contract']
          assert d['causal_structure_frozen_before_economic_validation'] is True
          assert d['regime_definition_frozen_before_economic_validation'] is True
          assert d['target_support_frozen_before_economic_validation'] is True
          assert d['management_posture_frozen_before_economic_validation'] is True
          assert d['economic_validation_uses_full_lifecycle'] is True
          assert d['economic_validation_friction_r']=='0.10'
          assert d['calendar_year_rule'] is False
          assert d['economic_mean_magnitude_used_for_target_ranking'] is False
          assert d['r27_result_used_as_input'] is False
          g=p['governance']
          assert g['fresh_holdout_consumed'] is False
          assert g['candidate_promoted'] is False
          PY
      - name: Run R28 replay
        run: |
          mkdir -p r28-output
          python -m qore.infrastructure.trader_lab.turtle_soup_xauusd_r28_validated_specialist_brain             source-xauusd target-xauusd cognitive-v3 r28-output             > r28-output/stdout.json
          printf '%s\n' "$GITHUB_SHA" > r28-output/git-sha.txt
      - name: Enforce R28 contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('r28-output/r28-validated-specialist-brain-report.json').read_text())
          assert p['identity']=='TURTLE_SOUP_XAUUSD_R28_VALIDATED_SPECIALIST_BRAIN_V1'
          d=p['decision_sources']
          assert d['master_memory_remains_immutable'] is True
          assert d['r26_result_used_as_decision_input'] is False
          assert d['r27_result_used_as_decision_input'] is False
          c=p['decision_contract']
          assert c['causal_structure_precedes_economic_validation'] is True
          assert c['situation_definition_uses_economic_results'] is False
          assert c['regime_definition_uses_economic_results'] is False
          assert c['management_posture_selected_by_economic_results'] is False
          assert c['economic_validation_uses_full_lifecycle_net_010'] is True
          assert c['economic_mean_magnitude_ranks_targets'] is False
          assert c['calendar_year_regime_rule'] is False
          assert c['context_only_can_authorize'] is False
          g=p['governance']
          assert g['fresh_holdout_consumed'] is False
          assert g['candidate_promoted'] is False
          assert g['live_authorized'] is False
          assert g['real_capital_authorized'] is False
          PY
      - name: Package and hash evidence
        run: |
          mkdir -p package
          cp cognitive-v3/turtle-soup-xauusd-specialist-cognitive-memory-v3-report.json package/
          cp cognitive-v3/turtle-soup-xauusd-specialist-cognitive-memory-v3.json package/
          cp r28-output/r28-validated-specialist-brain-report.json package/
          cp r28-output/r28-validated-specialist-brain-trades.json package/
          cp r28-output/git-sha.txt package/
          cd package
          sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-xauusd-cognitive-v3-r28-${{ github.sha }}
          path: package
          if-no-files-found: error
          retention-days: 90
