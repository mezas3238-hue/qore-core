name: QORE Shared STI2 V1 Failure Diagnostic

concurrency:
  group: qore-shared-sti2-v1-failure-diagnostic
  cancel-in-progress: true

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - scripts/shared_sti2_v1_failure_diagnostic.py
      - .github/workflows/qore-shared-sti2-v1-failure-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Shared
        run: pip install -e ".[dev]"

      - name: Validate diagnostic
        run: |
          set -euo pipefail
          mkdir -p result input/policy input/r6 input/r5
          ruff check scripts/shared_sti2_v1_failure_diagnostic.py
          python -m py_compile scripts/shared_sti2_v1_failure_diagnostic.py

      - name: Recover frozen STI-2 V1 and consumed evidence
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11066845312/zip" > policy.zip
          unzip -q policy.zip -d input/policy
          (cd input/policy && sha256sum -c SHA256SUMS)
          test -f input/policy/sti2-source-only-policy.json
          test -f input/policy/sti2-causal-replay.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("input/policy/sti2-causal-replay.json").read_text())
          assert p["value_status"] == "STI2_V1_FALSIFIED_ON_CONSUMED_EVIDENCE"
          assert p["protected_holdout_opened"] is False
          PY

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10389112524/zip" > r6.zip
          unzip -q r6.zip -d input/r6
          (cd input/r6 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10380044761/zip" > r5.zip
          unzip -q r5.zip -d input/r5
          (cd input/r5 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

      - name: Extract falsification knowledge
        run: |
          set -euo pipefail
          python scripts/shared_sti2_v1_failure_diagnostic.py             --policy input/policy/sti2-source-only-policy.json             --r6-nas input/r6/fresh/NAS100/market-evidence.json             --r6-sp input/r6/fresh/SP500/market-evidence.json             --r6-us input/r6/fresh/US30/market-evidence.json             --r5-nas input/r5/fresh/NAS100/market-evidence.json             --r5-sp input/r5/fresh/SP500/market-evidence.json             --r5-us input/r5/fresh/US30/market-evidence.json             --output result/sti2-v1-failure-diagnostic.json             | tee result/summary.json

      - name: Validate no V1 rescue
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/sti2-v1-failure-diagnostic.json").read_text())
          assert p["status"] == "V1_FAILURE_KNOWLEDGE_EXTRACTED_NO_RETUNING"
          g=p["governance"]
          assert g["v1_policy_changed"] is False
          assert g["v1_thresholds_changed"] is False
          assert g["v1_reopened"] is False
          assert g["v2_policy_selected"] is False
          assert g["future_outcome_used_for_v1_decision"] is False
          assert g["consumed_evidence_only"] is True
          assert g["protected_certification_holdout_opened"] is False
          assert g["productive_authority"] is False
          for name in ("r6","r5"):
              row=p["partitions"][name]
              assert row["sample_count"] > 0
              assert sum(row["confusion_counts"].values()) == row["sample_count"]
              assert row["confusion_counts"]["FN"] > 0
              assert row["v2_hypothesis_candidates"]
          PY

      - name: Bind evidence
        run: |
          printf '%s\n' "${GITHUB_SHA}" > result/code-git-sha.txt
          (
            cd result
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0               | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-sti2-v1-failure-diagnostic-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Report V1 failure knowledge
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p=json.loads(Path("result/sti2-v1-failure-diagnostic.json").read_text())
          lines=[
              "## Shared STI-2 — V1 Failure Knowledge Diagnostic",
              "",
              f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- run: `{os.environ['GITHUB_RUN_ID']}`",
              "- V1 reopened: **False**",
              "- V1 thresholds/policy changed: **False / False**",
              "- protected certification holdout opened: **False**",
              "",
          ]
          for name in ("r6","r5"):
              row=p["partitions"][name]
              lines.append(f"### {name.upper()}")
              lines.append(
                  f"- confusion: **{row['confusion_counts']}**"
              )
              for item in row["v2_hypothesis_candidates"]:
                  lines.append(
                      f"- candidate: **{item['hypothesis']}** — {item['meaning']}"
                  )
              lines.append("")
          lines.append(
              "These are mechanistic research hypotheses, not a selected V2 policy."
          )
          Path("result/issue-comment.md").write_text("\n".join(lines)+"\n")
          PY
          gh issue comment 638 --body-file result/issue-comment.md
