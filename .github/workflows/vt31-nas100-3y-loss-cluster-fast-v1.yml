name: QORE VT31 NY 3Y Fast Runner Loss Cluster Audit V1

on:
  push:
    branches:
      - agent/vt31-architect-operations-cert-20261009
    paths:
      - scripts/vt31_nas100_3y_loss_cluster_fast_audit_v1.py
      - .github/workflows/vt31-nas100-3y-loss-cluster-fast-v1.yml
  workflow_dispatch:

concurrency:
  group: vt31-ny-3y-loss-cluster-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  FROZEN_BASELINE_HEAD: 8f91ee489d33c1fa0b90972270d4ac6c32fcca32
  FROZEN_BASELINE_ARTIFACT_ID: "11459439466"

jobs:
  frozen-3y-fast-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fast static and causal-governance gates
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_3y_loss_cluster_fast_audit_v1.py
          python scripts/vt31_nas100_3y_loss_cluster_fast_audit_v1.py --self-test

      - name: Recover frozen consumed 3Y control without market reacquisition
        run: |
          set -euo pipefail
          mkdir -p baseline result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FROZEN_BASELINE_ARTIFACT_ID}/zip" > frozen-baseline.zip
          unzip -q frozen-baseline.zip -d baseline
          test "$(cat baseline/git-sha.txt)" = "$FROZEN_BASELINE_HEAD"
          test -s baseline/3y-replay.json
          test -s baseline/3y-adjudication.json
          if [ -f baseline/SHA256SUMS ]; then
            (cd baseline && sha256sum -c SHA256SUMS)
          fi

      - name: Audit true loss clusters on frozen NY baseline
        run: |
          set -euo pipefail
          python scripts/vt31_nas100_3y_loss_cluster_fast_audit_v1.py \
            --replay baseline/3y-replay.json \
            --adjudication baseline/3y-adjudication.json \
            --output result/ny-3y-loss-cluster-audit.json \
            | tee result/ny-3y-loss-cluster-summary.json

      - name: Frozen reality and no-promotion gates
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          x = json.loads(Path("result/ny-3y-loss-cluster-audit.json").read_text())
          assert x["base_id"] == "VT31_NAS100_OWNER_3Y_BASE_001"
          assert x["trade_count"] == 55
          assert x["max_losing_streak"] == 23
          assert Decimal(x["max_drawdown_r"]) > Decimal("6")
          assert x["existing_control_certification_pass"] is False
          g = x["governance"]
          assert g["no_trade_or_policy_change"] is True
          assert g["no_runtime_use_of_terminal_outcome"] is True
          assert g["fresh_holdout_opened"] is False
          assert g["candidate_certified"] is False
          assert g["live_authorized"] is False
          PY

      - name: Fingerprint output and identify exact code
        run: |
          set -euo pipefail
          echo "$GITHUB_SHA" > result/git-sha.txt
          echo "$FROZEN_BASELINE_HEAD" > result/control-head.txt
          echo "$FROZEN_BASELINE_ARTIFACT_ID" > result/control-artifact-id.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd result && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-ny-3y-fast-loss-cluster-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
