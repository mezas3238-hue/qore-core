name: QORE Scalper A2 Frozen H1 Target Asymmetry

on:
  push:
    branches:
      - agent/scalper-architect-b-methodology-20261010
    paths:
      - '.github/workflows/qore-scalper-a2-h1-target-asymmetry.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_h1_target_asymmetry_audit_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_scalper_h1_target_asymmetry_audit_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-scalper-a2-h1-target-asymmetry-${{ github.ref }}
  cancel-in-progress: true

env:
  V49_CONTROL_RUN: '38053946695'
  V49_CONTROL_SHA: 'e356e7a52541e99533b25ecfef0ab9c4e9ce03c0'

jobs:
  exact_target:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install -e '.[dev]'
      - name: Reject incomplete source-ledger or target/stop provenance
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_scalper_h1_target_asymmetry_audit_v1.py tests/infrastructure/trader_lab/test_capitalizer_scalper_h1_target_asymmetry_audit_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_scalper_h1_target_asymmetry_audit_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_scalper_h1_target_asymmetry_audit_v1.py
      - name: Download identical frozen V49 9-market source and full-target exits
        uses: actions/download-artifact@v4
        with:
          pattern: scalper-a2-v49-control-*-${{ env.V49_CONTROL_SHA }}
          path: frozen-v49
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.V49_CONTROL_RUN }}
      - name: Reconcile target price H1 witness vs M15 swing for all sources
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_h1_target_asymmetry_audit_v1 frozen-v49 target-audit
      - name: Verify exact 9-market full-target R and no policy change
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("target-audit/scalper-a2-v49-target-asymmetry.json").read_text())
          assert report["source_opportunities"] == 2876
          assert report["economic_replays"] == 2876
          assert report["selected_after_max3"] == 2020
          assert report["excluded_before_max3"] == 856
          assert report["selected"]["target_exits"] == 1030
          assert report["selected"]["stop_exits"] == 609
          assert report["selected"]["session_exits"] == 381
          assert report["selected"]["no_partial_exits_observed"] is True
          assert report["h1_target_witness_independently_replayed_with_m1"] is False
          assert not report["trader_certified"] and not report["live_authorized"]
          print("H1 TARGET R DISTRIBUTION", report["selected"])
          for dim in ("session", "market", "trigger_family", "exit_reason"):
              for key, value in report["selected_by"][dim].items():
                  print("TARGET GEOMETRY", dim, key, value)
          PY
      - name: Preserve every source target-stop outcome row
        uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-h1-target-asymmetry-${{ github.sha }}
          path: target-audit/
          if-no-files-found: error
          retention-days: 90
