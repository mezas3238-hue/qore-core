name: QORE VT08 Latest PS Density Recovery V1

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vt08-cognitive-expansion-5m-v1-001
    paths:
      - .github/workflows/vt08-latest-ps-density-recovery-v1.yml

permissions:
  contents: read
  actions: read

jobs:
  latest-ps:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        symbol: [EURJPY, USDCHF, NZDUSD, CADJPY, USDCAD]
        profile: [M15_STANDARD, M5_FRACTAL, M3_FRACTAL]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Download immutable M15/M5 base evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-vt08-cognitive-5m-fresh-${{ matrix.symbol }}-b2d33e1b4829d8b4afc76983decca8a99131403c
          path: evidence/${{ matrix.symbol }}
          github-token: ${{ github.token }}
          run-id: 35934924907
      - name: Download immutable M3 profile evidence
        uses: actions/download-artifact@v4
        with:
          pattern: qore-vt08-m3-fractal-${{ matrix.symbol }}-bc1379d7661aac202495ec67afdd3098473ba723
          path: m3/${{ matrix.symbol }}
          github-token: ${{ github.token }}
          run-id: 35941643396
      - name: Run source-adjudicated latest PS profile
        env:
          SYMBOL: ${{ matrix.symbol }}
          PROFILE: ${{ matrix.profile }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from qore.infrastructure.trader_lab.vt08_cognitive_latest_ps_density_recovery_v1 import (
              evaluate,
          )

          symbol = os.environ["SYMBOL"]
          profile = os.environ["PROFILE"]
          base = Path(f"evidence/{symbol}/market-evidence-1095d.json")
          m3 = Path(f"m3/{symbol}/m3/{symbol}/m3-evidence.json")
          if not m3.exists():
              matches = list(Path(f"m3/{symbol}").rglob("m3-evidence.json"))
              if len(matches) != 1:
                  raise SystemExit(f"expected exactly one M3 evidence file, found {len(matches)}")
              m3 = matches[0]
          report = evaluate(
              base,
              profile=profile,
              m3_path=m3 if profile == "M3_FRACTAL" else None,
          )
          name = profile.lower().replace("_", "-")
          Path(f"artifacts/{symbol}-{name}-latest-ps.json").write_text(
              json.dumps(report, sort_keys=True, separators=(",", ":")),
              encoding="utf-8",
          )
          print(json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-latest-ps-${{ matrix.symbol }}-${{ matrix.profile }}-${{ github.sha }}
          path: artifacts
          if-no-files-found: error
          retention-days: 30
