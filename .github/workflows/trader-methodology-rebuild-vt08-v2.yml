name: QORE VT-08 CRT H4 AMD V2 Source-Executable

on:
  pull_request:
    branches:
      - agent/trader-methodology-rebuild-v2-001
    paths:
      - .github/workflows/trader-methodology-rebuild-vt08-v2.yml
      - docs/research/trader-lab/VT-08-V2-SOURCE-AUDIT-EXECUTABLE.md
      - src/qore/infrastructure/traders/vt08_crt_h4_amd_v2.py
      - src/qore/infrastructure/ctrader_demo_lab_vt08_v2_probe.py
      - src/qore/infrastructure/trader_lab/vt08_crt_h4_amd_v2_backtest.py
      - src/qore/infrastructure/trader_lab/vt08_crt_h4_amd_v2_full_research.py
      - tests/infrastructure/traders/test_vt08_crt_h4_amd_v2.py
      - tests/infrastructure/test_ctrader_demo_lab_vt08_v2_probe.py
      - tests/infrastructure/trader_lab/test_vt08_crt_h4_amd_v2_backtest.py
      - tests/infrastructure/trader_lab/test_vt08_crt_h4_amd_v2_full_research.py
  push:
    branches:
      - agent/vt08-v2-source-completion-001
    paths:
      - .github/workflows/trader-methodology-rebuild-vt08-v2.yml
      - docs/research/VT08-CRT-H4-AMD-V2-SOURCE-FREEZE.md
      - docs/research/VT08-OWNER-OPERATING-SCOPE.md
      - docs/research/trader-lab/VT-08-V2-SOURCE-AUDIT-EXECUTABLE.md
      - src/qore/infrastructure/traders/vt08_crt_h4_amd_v2.py
      - src/qore/infrastructure/ctrader_demo_lab_vt08_v2_probe.py
      - src/qore/infrastructure/trader_lab/vt08_crt_h4_amd_v2_backtest.py
      - src/qore/infrastructure/trader_lab/vt08_crt_h4_amd_v2_full_research.py
      - tests/infrastructure/traders/test_vt08_crt_h4_amd_v2.py
      - tests/infrastructure/test_ctrader_demo_lab_vt08_v2_probe.py
      - tests/infrastructure/trader_lab/test_vt08_crt_h4_amd_v2_backtest.py
      - tests/infrastructure/trader_lab/test_vt08_crt_h4_amd_v2_full_research.py
  workflow_dispatch:

concurrency:
  group: qore-vt08-v2-source-executable-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
  QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}
  QORE_DEMO_LAB_LOOKBACK_DAYS: "760"
  QORE_SOFTWARE_SHA: ${{ github.sha }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact V2 head
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff full gate
        run: ruff check .
      - name: Mypy full gate
        run: mypy src tests
      - name: VT-08 V2 source-fidelity gate
        run: |
          pytest -q \
            tests/infrastructure/traders/test_vt08_crt_h4_amd_v2.py \
            tests/infrastructure/test_ctrader_demo_lab_vt08_v2_probe.py \
            tests/infrastructure/trader_lab/test_vt08_crt_h4_amd_v2_backtest.py \
            tests/infrastructure/trader_lab/test_vt08_crt_h4_amd_v2_full_research.py
      - name: Pytest full quality gate
        run: pytest --cov=src/qore --cov-report=term-missing

  trader-lab-10-market:
    if: ${{ contains(github.event.head_commit.message || '', 'run-vt08-v2-source-audit') || github.event_name == 'workflow_dispatch' }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        symbol:
          - EURUSD
          - GBPUSD
          - USDJPY
          - AUDUSD
          - USDCAD
          - GBPJPY
          - AUDJPY
          - NAS100
          - SP500
          - US30
    env:
      QORE_DEMO_LAB_SYMBOL: ${{ matrix.symbol }}
    steps:
      - name: Checkout exact V2 head
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QORE and cTrader runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ctrader]"
      - name: Verify DEMO inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in QORE_CTRADER_CLIENT_ID QORE_CTRADER_CLIENT_SECRET QORE_CTRADER_ACCESS_TOKEN QORE_CTRADER_REFRESH_TOKEN QORE_DEMO_LAB_SYMBOL; do
            if [ -z "${!name:-}" ]; then
              echo "missing required DEMO research input: ${name}" >&2
              exit 2
            fi
          done
          if [ "${QORE_DEMO_LAB_LOOKBACK_DAYS}" -le 730 ]; then
            echo "VT-08 V2 requires acquisition margin beyond 730 days" >&2
            exit 2
          fi
      - name: Discover authorized DEMO account if needed
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            if ! [[ "$account_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "cTrader DEMO account discovery returned invalid id" >&2
              exit 3
            fi
            echo "::add-mask::$account_id"
            printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          fi
      - name: Collect video-required M15 evidence
        run: |
          root="artifacts/vt08-v2/${QORE_DEMO_LAB_SYMBOL}"
          mkdir -p "$root"
          python -m qore.infrastructure.ctrader_demo_lab_vt08_v2_probe > "$root/market-evidence.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          symbol = os.environ["QORE_DEMO_LAB_SYMBOL"]
          root = Path(f"artifacts/vt08-v2/{symbol}")
          p = json.loads((root / "market-evidence.json").read_text())
          assert p["schema"] == "qore.ctrader_demo.vt08_crt_h4_amd_v2_evidence.v3"
          assert p["environment"] == "demo" and p["read_only"] is True
          assert p["account_is_live"] is False and p["canonical_symbol"] == symbol
          assert p["software_sha"] == os.environ["GITHUB_SHA"]
          assert set(p["periods"]) == {"M15"}
          assert p["d1_is_mandatory_gate"] is False
          assert p["required_coverage_days"] == 730
          assert p["coverage"]["span_seconds"] >= 730 * 86400
          PY
      - name: Run owner-scoped source-bound economic replay
        run: |
          root="artifacts/vt08-v2/${QORE_DEMO_LAB_SYMBOL}"
          python -m qore.infrastructure.trader_lab.vt08_crt_h4_amd_v2_backtest "$root/market-evidence.json" > "$root/source-audit.json"
          printf '%s\n' "$GITHUB_SHA" > "$root/git-sha.txt"
          python - <<'PY'
          import json, os
          from pathlib import Path
          symbol = os.environ["QORE_DEMO_LAB_SYMBOL"]
          p = json.loads(Path(f"artifacts/vt08-v2/{symbol}/source-audit.json").read_text())
          assert p["schema"] == "qore.trader_lab.vt08_crt_h4_amd_v2_economic_replay.v4"
          assert p["source_fidelity_mode"] is True
          assert p["human_owner_operating_scope"] is True
          assert p["operating_timezone"] == "America/New_York"
          assert p["forex_operating_h4_anchors"] == [1, 5, 9]
          assert p["futures_operating_h4_anchors"] == [2, 6, 10]
          assert p["prior_13468_campaign_valid_for_economics"] is False
          assert p["symbol"] == symbol and p["software_sha"] == os.environ["GITHUB_SHA"]
          assert p["source_judgment_required_count"] + p["automatic_setup_count"] == p["mechanical_candidate_count"]
          assert p["filled_count"] <= p["automatic_setup_count"]
          assert p["win_count"] + p["loss_count"] + p["censored_count"] == p["filled_count"]
          assert p["economic_backtest_authorized"] is True
          PY
      - name: Package Trader Lab source-fidelity evidence
        run: |
          root="artifacts/vt08-v2/${QORE_DEMO_LAB_SYMBOL}"
          python -m qore.infrastructure.trader_lab.vt08_crt_h4_amd_v2_full_research "$root/source-audit.json" "$root" > "$root/research-run-summary.stdout.json"
      - name: Verify economics remain separate from promotion authority
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          symbol = os.environ["QORE_DEMO_LAB_SYMBOL"]
          root = Path(f"artifacts/vt08-v2/{symbol}")
          required = {"market-evidence.json","source-audit.json","git-sha.txt","walk-forward.json","characterization.json","stress.json","monte-carlo.json","failure-analysis.json","story-forensics.json","hypothesis-register.json","research-summary.json","research-run-summary.stdout.json"}
          missing = sorted(name for name in required if not (root / name).is_file())
          assert not missing, missing
          summary = json.loads((root / "research-summary.json").read_text())
          assert summary["source_fidelity_mode"] is True
          assert summary["economic_result_available"] is True
          assert summary["filled_count"] <= summary["automatic_setup_count"]
          assert summary["demo_eligible"] is False
          stress = json.loads((root / "stress.json").read_text())
          monte = json.loads((root / "monte-carlo.json").read_text())
          assert stress["status"] in {"run", "insufficient-sample"}
          assert monte["status"] in {"run", "insufficient-sample"}
          PY
      - name: Upload sanitized per-market source-fidelity evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-v2-source-executable-${{ matrix.symbol }}-${{ github.sha }}
          path: artifacts/vt08-v2/${{ matrix.symbol }}
          if-no-files-found: error
          retention-days: 30

  multi-market-evidence:
    needs: trader-lab-10-market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download all ten owner-scope source-fidelity artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: qore-vt08-v2-source-executable-*-${{ github.sha }}
          path: artifacts/vt08-v2-multi-market
      - name: Aggregate owner-scope source-bound economics
        run: |
          mkdir -p artifacts/vt08-v2-aggregate
          python - <<'PY'
          import json, os
          from pathlib import Path
          expected = {"EURUSD","GBPUSD","USDJPY","AUDUSD","USDCAD","GBPJPY","AUDJPY","NAS100","SP500","US30"}
          audits = [json.loads(p.read_text()) for p in sorted(Path("artifacts/vt08-v2-multi-market").rglob("source-audit.json"))]
          summaries = [json.loads(p.read_text()) for p in sorted(Path("artifacts/vt08-v2-multi-market").rglob("research-summary.json"))]
          assert len(audits) == len(summaries) == 10
          assert {p["symbol"] for p in audits} == expected
          assert all(p["software_sha"] == os.environ["GITHUB_SHA"] for p in audits)
          assert all(p["human_owner_operating_scope"] is True for p in audits)
          assert all(p["economic_backtest_authorized"] is True for p in audits)
          candidate_count = sum(p["mechanical_candidate_count"] for p in audits)
          setups = sum(p["automatic_setup_count"] for p in audits)
          filled = sum(p["filled_count"] for p in audits)
          unfilled = sum(p["unfilled_count"] for p in audits)
          wins = sum(p["win_count"] for p in audits)
          losses = sum(p["loss_count"] for p in audits)
          censored = sum(p["censored_count"] for p in audits)
          total_r = sum(float(p["total_r"]) for p in audits)
          resolved = wins + losses
          payload = {
              "schema": "qore.trader_lab.vt08_crt_h4_amd_v2_10_market_owner_scope.v1",
              "research_only": True,
              "source_fidelity_mode": True,
              "human_owner_operating_scope": True,
              "operating_timezone": "America/New_York",
              "forex_operating_h4_anchors": [1, 5, 9],
              "futures_operating_h4_anchors": [2, 6, 10],
              "invalidates_prior_13468_campaign": True,
              "software_sha": os.environ["GITHUB_SHA"],
              "market_count": 10,
              "symbols": sorted(expected),
              "mechanical_candidate_count": candidate_count,
              "source_judgment_required_count": candidate_count - setups,
              "automatic_setup_count": setups,
              "filled_count": filled,
              "unfilled_count": unfilled,
              "win_count": wins,
              "loss_count": losses,
              "censored_count": censored,
              "win_rate": None if not resolved else wins / resolved,
              "expectancy_r": None if not filled else total_r / filled,
              "total_r": total_r,
              "economic_result_available": True,
              "per_market": sorted(summaries, key=lambda p: p["symbol"]),
              "governed_lifecycle_authority": False,
              "demo_eligible": False,
          }
          root = Path("artifacts/vt08-v2-aggregate")
          (root / "ten-market-owner-scope-economic-replay.json").write_text(json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n")
          (root / "git-sha.txt").write_text(os.environ["GITHUB_SHA"] + "\n")
          PY
      - name: Upload ten-market owner-scope aggregate
        uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-v2-source-executable-10-market-${{ github.sha }}
          path: artifacts/vt08-v2-aggregate
          if-no-files-found: error
          retention-days: 30
