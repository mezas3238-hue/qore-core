name: QORE VT-08 CRT H4 AMD V2 Trader Lab

on:
  push:
    branches:
      - agent/trader-methodology-rebuild-v2-001
    paths:
      - .github/workflows/trader-methodology-rebuild-vt08-v2.yml
      - src/qore/infrastructure/traders/vt08_crt_h4_amd_v2.py
      - src/qore/infrastructure/ctrader_demo_lab_vt08_v2_probe.py
      - src/qore/infrastructure/trader_lab/vt08_crt_h4_amd_v2_backtest.py
      - src/qore/infrastructure/trader_lab/vt08_crt_h4_amd_v2_full_research.py
      - tests/infrastructure/traders/test_vt08_crt_h4_amd_v2.py
      - tests/infrastructure/test_ctrader_demo_lab_vt08_v2_probe.py
      - tests/infrastructure/trader_lab/test_vt08_crt_h4_amd_v2_backtest.py
      - tests/infrastructure/trader_lab/test_vt08_crt_h4_amd_v2_full_research.py
  workflow_dispatch:

concurrency:
  group: qore-vt08-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
  QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}
  QORE_DEMO_LAB_LOOKBACK_DAYS: "760"
  QORE_SOFTWARE_SHA: ${{ github.sha }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact V2 branch head
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff full gate
        run: ruff check .
      - name: Mypy full gate
        run: mypy src tests
      - name: VT-08 V2 source fidelity and Trader Lab focused gate
        run: |
          pytest -q \
            tests/infrastructure/traders/test_vt08_crt_h4_amd_v2.py \
            tests/infrastructure/test_ctrader_demo_lab_vt08_v2_probe.py \
            tests/infrastructure/trader_lab/test_vt08_crt_h4_amd_v2_backtest.py \
            tests/infrastructure/trader_lab/test_vt08_crt_h4_amd_v2_full_research.py
      - name: Pytest full quality gate
        run: pytest --cov=src/qore --cov-report=term-missing

  trader-lab-11-market:
    if: ${{ contains(github.event.head_commit.message || '', 'run-vt08-research') || github.event_name == 'workflow_dispatch' }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        symbol:
          - EURUSD
          - GBPUSD
          - USDJPY
          - AUDUSD
          - USDCAD
          - XAUUSD
          - NAS100
          - SP500
          - GBPJPY
          - AUDJPY
          - US30
    env:
      QORE_DEMO_LAB_SYMBOL: ${{ matrix.symbol }}
    steps:
      - name: Checkout exact V2 branch head
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QORE and cTrader runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ctrader]"
      - name: Verify required DEMO inputs without printing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            QORE_CTRADER_CLIENT_ID \
            QORE_CTRADER_CLIENT_SECRET \
            QORE_CTRADER_ACCESS_TOKEN \
            QORE_CTRADER_REFRESH_TOKEN \
            QORE_DEMO_LAB_SYMBOL
          do
            if [ -z "${!name:-}" ]; then
              echo "missing required DEMO research input: ${name}" >&2
              exit 2
            fi
          done
          if [ "${QORE_DEMO_LAB_LOOKBACK_DAYS}" -le 730 ]; then
            echo "VT-08 V2 requires acquisition margin beyond 730 days" >&2
            exit 2
          fi
      - name: Discover the single authorized DEMO account when not configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            if ! [[ "$account_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "cTrader DEMO account discovery returned an invalid id" >&2
              exit 3
            fi
            echo "::add-mask::$account_id"
            printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          fi
      - name: Collect two-year source-required M15 evidence
        run: |
          mkdir -p "artifacts/vt08-v2/${QORE_DEMO_LAB_SYMBOL}"
          python -m qore.infrastructure.ctrader_demo_lab_vt08_v2_probe \
            > "artifacts/vt08-v2/${QORE_DEMO_LAB_SYMBOL}/market-evidence.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["QORE_DEMO_LAB_SYMBOL"]
          payload = json.loads(
              Path(f"artifacts/vt08-v2/{symbol}/market-evidence.json").read_text()
          )
          assert payload["schema"] == "qore.ctrader_demo.vt08_crt_h4_amd_v2_m15_evidence.v1"
          assert payload["environment"] == "demo"
          assert payload["read_only"] is True
          assert payload["account_is_live"] is False
          assert payload["canonical_symbol"] == symbol
          assert payload["symbol"]["symbol_name"] == symbol
          assert payload["decision_timeframe"] == "M15"
          assert payload["required_coverage_days"] == 730
          assert payload["software_sha"] == os.environ["GITHUB_SHA"]
          assert set(payload["periods"]) == {"M15"}
          assert payload["coverage"]["span_seconds"] >= 730 * 24 * 60 * 60
          assert payload["provider_symbol_name"]
          PY
      - name: Run source-bound VT-08 V2 historical research
        run: |
          python -m qore.infrastructure.trader_lab.vt08_crt_h4_amd_v2_backtest \
            "artifacts/vt08-v2/${QORE_DEMO_LAB_SYMBOL}/market-evidence.json" \
            > "artifacts/vt08-v2/${QORE_DEMO_LAB_SYMBOL}/backtest.json"
          printf '%s\n' "$GITHUB_SHA" > "artifacts/vt08-v2/${QORE_DEMO_LAB_SYMBOL}/git-sha.txt"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["QORE_DEMO_LAB_SYMBOL"]
          payload = json.loads(Path(f"artifacts/vt08-v2/{symbol}/backtest.json").read_text())
          assert payload["schema"] == "qore.trader_lab.vt08_crt_h4_amd_v2_backtest.v1"
          assert payload["research_only"] is True
          assert payload["symbol"] == symbol
          assert payload["software_sha"] == os.environ["GITHUB_SHA"]
          assert payload["execution_model"] == "source-m15-cisd-entry-h4-close-stop-first-v1"
          assert payload["long_trade_count"] + payload["short_trade_count"] == payload["terminal_sample_size"]
          assert payload["continuation_count"] + payload["reversal_count"] == payload["terminal_sample_size"]
          PY
      - name: Run full Trader Lab evidence stages
        run: |
          python -m qore.infrastructure.trader_lab.vt08_crt_h4_amd_v2_full_research \
            "artifacts/vt08-v2/${QORE_DEMO_LAB_SYMBOL}/backtest.json" \
            "artifacts/vt08-v2/${QORE_DEMO_LAB_SYMBOL}" \
            > "artifacts/vt08-v2/${QORE_DEMO_LAB_SYMBOL}/research-run-summary.stdout.json"
      - name: Verify complete research evidence family and authority boundary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["QORE_DEMO_LAB_SYMBOL"]
          root = Path(f"artifacts/vt08-v2/{symbol}")
          required = {
              "market-evidence.json",
              "backtest.json",
              "git-sha.txt",
              "walk-forward.json",
              "characterization.json",
              "stress.json",
              "monte-carlo.json",
              "failure-analysis.json",
              "story-forensics.json",
              "hypothesis-register.json",
              "research-summary.json",
              "research-run-summary.stdout.json",
          }
          missing = sorted(name for name in required if not (root / name).is_file())
          assert not missing, missing
          walk = json.loads((root / "walk-forward.json").read_text())
          assert walk["source_frozen_configuration"] is True
          assert walk["parameter_search_performed"] is False
          assert walk["in_sample_fraction"] == "0.70"
          assert walk["oos_fraction"] == "0.30"
          assert walk["holdout_governance"]["state"] == "consumed_for_research"
          assert walk["holdout_governance"]["post_change_reuse_as_independent_holdout_prohibited"] is True
          assert walk["holdout_governance"]["fresh_previously_unseen_holdout_required_after_any_change"] is True
          summary = json.loads((root / "research-summary.json").read_text())
          assert summary["symbol"] == symbol
          assert summary["software_sha"] == os.environ["GITHUB_SHA"]
          assert summary["demo_eligible"] is False
          assert summary["governed_lifecycle_authority"] is False
          stress = json.loads((root / "stress.json").read_text())
          monte = json.loads((root / "monte-carlo.json").read_text())
          assert stress["governed_stage_authority"] is False
          assert monte["governed_stage_authority"] is False
          story = json.loads((root / "story-forensics.json").read_text())
          backtest = json.loads((root / "backtest.json").read_text())
          assert story["episode_count"] == backtest["terminal_sample_size"]
          PY
      - name: Upload sanitized per-market VT-08 V2 research evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-v2-${{ matrix.symbol }}-${{ github.sha }}
          path: artifacts/vt08-v2/${{ matrix.symbol }}
          if-no-files-found: error
          retention-days: 30

  multi-market-evidence:
    needs: trader-lab-11-market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download all eleven per-market artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: qore-vt08-v2-*-${{ github.sha }}
          path: artifacts/vt08-v2-multi-market
      - name: Aggregate eleven-market evidence without promotion authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/vt08-v2-aggregate
          python - <<'PY'
          import json
          import os
          from decimal import Decimal
          from pathlib import Path

          expected = {
              "EURUSD", "GBPUSD", "USDJPY", "AUDUSD", "USDCAD", "XAUUSD",
              "NAS100", "SP500", "GBPJPY", "AUDJPY", "US30",
          }
          summaries = []
          for path in sorted(Path("artifacts/vt08-v2-multi-market").rglob("research-summary.json")):
              summaries.append(json.loads(path.read_text()))
          symbols = {item["symbol"] for item in summaries}
          assert len(summaries) == 11, len(summaries)
          assert symbols == expected, (symbols, expected)
          assert all(item["software_sha"] == os.environ["GITHUB_SHA"] for item in summaries)
          total_sample = sum(int(item["terminal_sample_size"]) for item in summaries)
          weighted_total = sum(
              Decimal(item["all_history"]["expectancy_r"]) * int(item["terminal_sample_size"])
              for item in summaries
          )
          weighted_expectancy = weighted_total / total_sample if total_sample else Decimal(0)
          payload = {
              "schema": "qore.trader_lab.vt08_crt_h4_amd_v2_11_market_aggregate.v1",
              "research_only": True,
              "software_sha": os.environ["GITHUB_SHA"],
              "market_count": 11,
              "symbols": sorted(symbols),
              "terminal_sample_size": total_sample,
              "weighted_expectancy_r": format(weighted_expectancy, "f"),
              "oos_pass_market_count": sum(bool(item["oos_pass"]) for item in summaries),
              "stress_pass_market_count": sum(bool(item["stress_pass"]) for item in summaries),
              "monte_carlo_pass_market_count": sum(bool(item["monte_carlo_pass"]) for item in summaries),
              "per_market": sorted(summaries, key=lambda item: item["symbol"]),
              "governed_lifecycle_authority": False,
              "demo_eligible": False,
              "cross_market_result_is_research_evidence_not_promotion": True,
          }
          Path("artifacts/vt08-v2-aggregate/eleven-market-summary.json").write_text(
              json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n"
          )
          Path("artifacts/vt08-v2-aggregate/git-sha.txt").write_text(
              os.environ["GITHUB_SHA"] + "\n"
          )
          PY
      - name: Upload eleven-market aggregate
        uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-v2-11-market-aggregate-${{ github.sha }}
          path: artifacts/vt08-v2-aggregate
          if-no-files-found: error
          retention-days: 30
