name: QORE VT-08 CRT H4 AMD V2 Reconstructed Trader Lab

on:
  push:
    branches:
      - agent/trader-methodology-rebuild-v2-001
    paths:
      - .github/workflows/trader-methodology-rebuild-vt08-v2.yml
      - docs/research/VT08-CRT-H4-AMD-V2-SOURCE-FREEZE.md
      - src/qore/infrastructure/traders/vt08_crt_h4_amd_v2.py
      - src/qore/infrastructure/ctrader_demo_lab_vt08_v2_probe.py
      - src/qore/infrastructure/trader_lab/vt08_crt_h4_amd_v2_backtest.py
      - src/qore/infrastructure/trader_lab/vt08_crt_h4_amd_v2_full_research.py
      - tests/infrastructure/traders/test_vt08_crt_h4_amd_v2.py
      - tests/infrastructure/test_ctrader_demo_lab_vt08_v2_probe.py
      - tests/infrastructure/trader_lab/test_vt08_crt_h4_amd_v2_backtest.py
      - tests/infrastructure/trader_lab/test_vt08_crt_h4_amd_v2_full_research.py
  workflow_dispatch:

concurrency:
  group: qore-vt08-v2-reconstructed-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
  QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}
  QORE_DEMO_LAB_LOOKBACK_DAYS: "760"
  QORE_SOFTWARE_SHA: ${{ github.sha }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact V2 head
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff full gate
        run: ruff check .
      - name: Mypy full gate
        run: mypy src tests
      - name: VT-08 V2 reconstruction fidelity gate
        run: |
          pytest -q \
            tests/infrastructure/traders/test_vt08_crt_h4_amd_v2.py \
            tests/infrastructure/test_ctrader_demo_lab_vt08_v2_probe.py \
            tests/infrastructure/trader_lab/test_vt08_crt_h4_amd_v2_backtest.py \
            tests/infrastructure/trader_lab/test_vt08_crt_h4_amd_v2_full_research.py
      - name: Pytest full quality gate
        run: pytest --cov=src/qore --cov-report=term-missing

  trader-lab-11-market:
    if: ${{ contains(github.event.head_commit.message || '', 'run-vt08-v2-rebuild') || github.event_name == 'workflow_dispatch' }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        symbol:
          - EURUSD
          - GBPUSD
          - USDJPY
          - AUDUSD
          - USDCAD
          - XAUUSD
          - NAS100
          - SP500
          - GBPJPY
          - AUDJPY
          - US30
    env:
      QORE_DEMO_LAB_SYMBOL: ${{ matrix.symbol }}
    steps:
      - name: Checkout exact V2 head
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QORE and cTrader runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ctrader]"
      - name: Verify DEMO inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in QORE_CTRADER_CLIENT_ID QORE_CTRADER_CLIENT_SECRET QORE_CTRADER_ACCESS_TOKEN QORE_CTRADER_REFRESH_TOKEN QORE_DEMO_LAB_SYMBOL; do
            if [ -z "${!name:-}" ]; then
              echo "missing required DEMO research input: ${name}" >&2
              exit 2
            fi
          done
          if [ "${QORE_DEMO_LAB_LOOKBACK_DAYS}" -le 730 ]; then
            echo "VT-08 V2 reconstruction requires acquisition margin beyond 730 days" >&2
            exit 2
          fi
      - name: Discover authorized DEMO account if needed
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            if ! [[ "$account_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "cTrader DEMO account discovery returned invalid id" >&2
              exit 3
            fi
            echo "::add-mask::$account_id"
            printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          fi
      - name: Collect M15 plus provider D1 evidence
        run: |
          root="artifacts/vt08-v2/${QORE_DEMO_LAB_SYMBOL}"
          mkdir -p "$root"
          python -m qore.infrastructure.ctrader_demo_lab_vt08_v2_probe > "$root/market-evidence.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          symbol = os.environ["QORE_DEMO_LAB_SYMBOL"]
          root = Path(f"artifacts/vt08-v2/{symbol}")
          p = json.loads((root / "market-evidence.json").read_text())
          assert p["schema"] == "qore.ctrader_demo.vt08_crt_h4_amd_v2_evidence.v2"
          assert p["environment"] == "demo" and p["read_only"] is True
          assert p["account_is_live"] is False and p["canonical_symbol"] == symbol
          assert p["software_sha"] == os.environ["GITHUB_SHA"]
          assert set(p["periods"]) == {"M15", "D1"}
          assert p["required_coverage_days"] == 730
          assert p["coverage"]["M15"]["span_seconds"] >= 730 * 86400
          assert p["coverage"]["D1"]["span_seconds"] >= 730 * 86400
          assert p["source_sequence_policy"]["maximum_setups_per_market_day"] == 1
          PY
      - name: Run corrected source-bound historical research
        run: |
          root="artifacts/vt08-v2/${QORE_DEMO_LAB_SYMBOL}"
          python -m qore.infrastructure.trader_lab.vt08_crt_h4_amd_v2_backtest "$root/market-evidence.json" > "$root/backtest.json"
          printf '%s\n' "$GITHUB_SHA" > "$root/git-sha.txt"
          python - <<'PY'
          import json, os
          from pathlib import Path
          symbol = os.environ["QORE_DEMO_LAB_SYMBOL"]
          p = json.loads(Path(f"artifacts/vt08-v2/{symbol}/backtest.json").read_text())
          assert p["schema"] == "qore.trader_lab.vt08_crt_h4_amd_v2_backtest.v2"
          assert p["invalidates_prior_campaign"] is True
          assert p["symbol"] == symbol and p["software_sha"] == os.environ["GITHUB_SHA"]
          assert p["execution_model"] == "source-daily-bias-one-sequence-m15-cisd-target-stop-censor-v2"
          assert p["setup_count"] <= p["decision_days"]
          assert p["long_trade_count"] + p["short_trade_count"] == p["setup_count"]
          assert p["target_count"] + p["stop_count"] == p["terminal_sample_size"]
          assert p["terminal_sample_size"] + p["h4_close_censored_count"] + p["gap_censored_count"] == p["setup_count"]
          PY
      - name: Run full Trader Lab evidence stages
        run: |
          root="artifacts/vt08-v2/${QORE_DEMO_LAB_SYMBOL}"
          python -m qore.infrastructure.trader_lab.vt08_crt_h4_amd_v2_full_research "$root/backtest.json" "$root" > "$root/research-run-summary.stdout.json"
      - name: Verify governance and evidence family
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          symbol = os.environ["QORE_DEMO_LAB_SYMBOL"]
          root = Path(f"artifacts/vt08-v2/{symbol}")
          required = {"market-evidence.json","backtest.json","git-sha.txt","walk-forward.json","characterization.json","stress.json","monte-carlo.json","failure-analysis.json","story-forensics.json","hypothesis-register.json","research-summary.json","research-run-summary.stdout.json"}
          missing = sorted(name for name in required if not (root / name).is_file())
          assert not missing, missing
          summary = json.loads((root / "research-summary.json").read_text())
          assert summary["invalidates_prior_campaign"] is True
          assert summary["demo_eligible"] is False
          assert summary["governed_lifecycle_authority"] is False
          char = json.loads((root / "characterization.json").read_text())
          assert char["positive_h4_close_mark_is_win"] is False
          stress = json.loads((root / "stress.json").read_text())
          monte = json.loads((root / "monte-carlo.json").read_text())
          assert stress["governed_stage_authority"] is False
          assert monte["governed_stage_authority"] is False
          PY
      - name: Upload sanitized per-market reconstructed V2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-v2-reconstructed-${{ matrix.symbol }}-${{ github.sha }}
          path: artifacts/vt08-v2/${{ matrix.symbol }}
          if-no-files-found: error
          retention-days: 30

  multi-market-evidence:
    needs: trader-lab-11-market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download all eleven reconstructed artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: qore-vt08-v2-reconstructed-*-${{ github.sha }}
          path: artifacts/vt08-v2-multi-market
      - name: Aggregate exact outcome counts
        run: |
          mkdir -p artifacts/vt08-v2-aggregate
          python - <<'PY'
          import json, os
          from decimal import Decimal
          from pathlib import Path
          expected = {"EURUSD","GBPUSD","USDJPY","AUDUSD","USDCAD","XAUUSD","NAS100","SP500","GBPJPY","AUDJPY","US30"}
          backtests = [json.loads(p.read_text()) for p in sorted(Path("artifacts/vt08-v2-multi-market").rglob("backtest.json"))]
          summaries = [json.loads(p.read_text()) for p in sorted(Path("artifacts/vt08-v2-multi-market").rglob("research-summary.json"))]
          assert len(backtests) == len(summaries) == 11
          assert {p["symbol"] for p in backtests} == expected
          assert all(p["software_sha"] == os.environ["GITHUB_SHA"] for p in backtests)
          setups = sum(p["setup_count"] for p in backtests)
          terminal = sum(p["terminal_sample_size"] for p in backtests)
          targets = sum(p["target_count"] for p in backtests)
          stops = sum(p["stop_count"] for p in backtests)
          censored = sum(p["h4_close_censored_count"] + p["gap_censored_count"] for p in backtests)
          assert targets + stops == terminal
          assert terminal + censored == setups
          weighted = sum(Decimal(p["terminal_expectancy_r"]) * p["terminal_sample_size"] for p in backtests)
          payload = {
              "schema": "qore.trader_lab.vt08_crt_h4_amd_v2_11_market_aggregate.v2",
              "research_only": True,
              "invalidates_prior_13468_campaign": True,
              "software_sha": os.environ["GITHUB_SHA"],
              "market_count": 11,
              "symbols": sorted(expected),
              "setup_count": setups,
              "terminal_sample_size": terminal,
              "target_count": targets,
              "stop_count": stops,
              "censored_count": censored,
              "weighted_terminal_expectancy_r": format(weighted / terminal if terminal else Decimal(0), "f"),
              "per_market": sorted(summaries, key=lambda p: p["symbol"]),
              "governed_lifecycle_authority": False,
              "demo_eligible": False,
          }
          root = Path("artifacts/vt08-v2-aggregate")
          (root / "eleven-market-summary.json").write_text(json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n")
          (root / "git-sha.txt").write_text(os.environ["GITHUB_SHA"] + "\n")
          PY
      - name: Upload reconstructed 11-market aggregate
        uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-v2-reconstructed-11-market-${{ github.sha }}
          path: artifacts/vt08-v2-aggregate
          if-no-files-found: error
          retention-days: 30
