name: QORE Native 24 M1 Broker Safety Regression (NO Capture)

on:
  push:
    branches:
      - research/qore-native-icmarkets-universe33-m1-capture-20261012
    paths:
      - '.github/workflows/qore-native-icmarkets-m1-offline-security.yml'
      - 'src/qore/infrastructure/trader_lab/qore_native_icmarkets_missing_m5_capture_v1.py'

permissions:
  contents: read

jobs:
  security_no_network:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,ctrader]'
      - name: Validate latest M1 source with blocked trading/mutation requests
        run: |
          set -euo pipefail
          ruff check --select F,E4,E7,E9 src/qore/infrastructure/trader_lab/qore_native_icmarkets_missing_m1_capture_v1.py src/qore/infrastructure/trader_lab/qore_native_icmarkets_missing_m5_capture_v1.py tests/infrastructure/trader_lab/test_qore_native_icmarkets_missing_m1_capture_v1.py
          PYTHONPATH=src python -m unittest discover -s tests/infrastructure/trader_lab -p 'test_qore_native_icmarkets_missing_m1_capture_v1.py' -v
          PYTHONPATH=src python - <<'PY'
          from qore.infrastructure.trader_lab.qore_native_icmarkets_missing_m5_capture_v1 import _ReadOnlyIcMarketsHistoryClient
          from qore.kernel.result import Failure
          instance=object.__new__(_ReadOnlyIcMarketsHistoryClient)
          forbidden=("ProtoOANewOrderReq","ProtoOACancelOrderReq","ProtoOAModifyOrderReq","ProtoOAReconcileReq","ProtoOARefreshTokenReq")
          for name in forbidden:
              outcome=instance.request(name, {}, client_msg_id="security-regression", timeout_seconds=1.0)
              assert isinstance(outcome, Failure), name
              assert "HISTORY_ONLY_MESSAGE_NOT_ALLOWED" in str(outcome.error), name
          allowed=_ReadOnlyIcMarketsHistoryClient._HISTORY_ONLY_REQUEST_NAMES
          assert allowed == frozenset({
              "ProtoOAApplicationAuthReq",
              "ProtoOAGetAccountListByAccessTokenReq",
              "ProtoOAAccountAuthReq",
              "ProtoOASymbolsListReq",
              "ProtoOASymbolByIdReq",
              "ProtoOAGetTrendbarsReq",
          })
          print("QORE_M1_24_HISTORY_ONLY_HARD_STOP_VALIDATED")
          PY
