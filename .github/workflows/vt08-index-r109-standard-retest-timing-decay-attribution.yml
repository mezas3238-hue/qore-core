name: VT08 Index R109 Standard Retest Timing Decay Attribution

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r109-standard-retest-timing-decay-attribution.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r109_standard_retest_timing_decay_attribution.py
      - tests/infrastructure/trader_lab/test_vt08_index_r109_standard_retest_timing_decay_attribution.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r109_standard_retest_timing_decay_attribution.py

  attribution:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R109 retest timing attribution
        run: |
          mkdir -p artifacts/report
          python -m qore.infrastructure.trader_lab.vt08_index_r109_standard_retest_timing_decay_attribution \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r109-standard-retest-timing-decay-attribution.json

      - name: Verify R109 frozen diagnostic contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r109-standard-retest-timing-decay-attribution.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R109_STANDARD_RETEST_TIMING_DECAY_ATTRIBUTION_001"
          )
          assert report["source_r108"]["run_id"] == 35588274260
          assert report["source_r108"]["artifact_id"] == 10633277043
          assert report["source_r108"]["artifact_digest"] == (
              "sha256:dabea18405b56a58f9c0cf69aa2e60b7f9efd30788ed4a1f4372c9d7cdc33564"
          )
          expected = {
              "five_year": 1049,
              "recent_two_year": 452,
              "r66_failed_holdout": 318,
          }
          for key, sample in expected.items():
              assert report[key]["sample"] == sample
              assert report[key]["expected_sample"] == sample
          diag = report["preregistered_diagnostics"]
          assert diag["rule_change"] is False
          assert diag["same_r108_retest_sample"] is True
          assert diag["pre_retest_mfe_excludes_fill_bar"] is True
          assert diag["runtime_filter_created"] is False
          gov = report["governance"]
          assert gov["research_only"] is True
          assert gov["candidate_created"] is False
          assert gov["signals_suppressed"] is False
          assert gov["trade_count_changed"] is False
          assert gov["target_changed"] is False
          assert gov["stop_changed"] is False
          assert gov["risk_allocator_changed"] is False
          assert gov["anchor_14_enabled"] is False
          assert gov["live_authorized"] is False
          assert gov["real_capital_authorized"] is False
          assert gov["production_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r109-standard-retest-timing-decay-attribution-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
