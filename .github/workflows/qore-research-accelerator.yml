name: QORE Research Accelerator isolated verification

on:
  pull_request:
    paths:
      - 'src/qore/infrastructure/research_accelerator/**'
      - 'tests/infrastructure/research_accelerator/**'
      - '.github/workflows/qore-research-accelerator.yml'
  push:
    branches: ['research/qore-accelerator-5layers-ultrafast-20261013']

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Tests
        run: pytest -q -o addopts='' tests/infrastructure/research_accelerator
      - name: Syntax
        run: python -m compileall -q src/qore/infrastructure/research_accelerator
      - name: CLI
        run: python -m qore.infrastructure.research_accelerator.ultrafast --help
