name: QORE Capitalizer MAX_RECOVERY Target Sensitivity 2Y V2

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-max-recovery-target-sensitivity-2y-v2.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_max_recovery_target_sensitivity_2y_v2.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_max_recovery_target_sensitivity_2y_v2.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-max-recovery-target-sensitivity-2y-v2-${{ github.sha }}
  cancel-in-progress: false

env:
  FINAL_RUN_ID: '35937212875'
  FINAL_SHA: 'd94cb30a4312780861a2aeaac21f567077cea401'
  ARBITRATION_RUN_ID: '35929691710'
  ARBITRATION_SHA: '93fcd53cca8b56ab9a3de596881435a5573b65ac'
  STOP_ATLAS_RUN_ID: '35863455539'
  STOP_ATLAS_SHA: 'd55b380fe9be21cee59023c2d6ed4cb3ebc84052'
  FUNNEL_RUN_ID: '35847723760'
  FUNNEL_SHA: 'e099f14092c8ab547137b6a3e59a3a1df9344b9e'
  REARM_RUN_ID: '35934425045'
  REARM_SHA: '3fca2555ca6161817809f58c07c9606d8f187cbe'
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check             src/qore/infrastructure/trader_lab/capitalizer_max_recovery_target_sensitivity_2y_v2.py             tests/infrastructure/trader_lab/test_capitalizer_max_recovery_target_sensitivity_2y_v2.py
      - name: Mypy
        run: |
          mypy             src/qore/infrastructure/trader_lab/capitalizer_max_recovery_target_sensitivity_2y_v2.py
      - name: Focused tests
        run: |
          pytest -q --no-cov             tests/infrastructure/trader_lab/test_capitalizer_max_recovery_target_sensitivity_2y_v2.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {symbol: USDJPY, session: ASIA}
          - {symbol: AUDJPY, session: ASIA}
          - {symbol: AUDUSD, session: ASIA}
          - {symbol: GBPJPY, session: ASIA}
          - {symbol: EURUSD, session: LONDON}
          - {symbol: GBPUSD, session: LONDON}
          - {symbol: XAUUSD, session: NEW_YORK}
          - {symbol: USDCAD, session: NEW_YORK}
          - {symbol: NAS100, session: NEW_YORK}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-max-recovery-final-2y-v1-${{ matrix.symbol }}-${{ env.FINAL_SHA }}
          path: final-source
          github-token: ${{ github.token }}
          run-id: ${{ env.FINAL_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-v3-source-first-no-rearm-closeback-arbitration-2y-v1-${{ matrix.symbol }}-${{ env.ARBITRATION_SHA }}
          path: arbitration-source
          github-token: ${{ github.token }}
          run-id: ${{ env.ARBITRATION_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-v3-source-first-wait5-stop-invalid-geometry-atlas-2y-v1-${{ matrix.symbol }}-${{ env.STOP_ATLAS_SHA }}
          path: stop-source
          github-token: ${{ github.token }}
          run-id: ${{ env.STOP_ATLAS_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-v3-source-first-wait5-funnel-atlas-2y-v1-${{ matrix.symbol }}-${{ env.FUNNEL_SHA }}
          path: funnel-source
          github-token: ${{ github.token }}
          run-id: ${{ env.FUNNEL_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-v3-source-first-wait-rejected-parallel-rearm-atlas-2y-v1-${{ matrix.symbol }}-${{ env.REARM_SHA }}
          path: rearm-source
          github-token: ${{ github.token }}
          run-id: ${{ env.REARM_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Run corrected target sensitivity
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_max_recovery_target_sensitivity_2y_v2             market final-source arbitration-source stop-source funnel-source rearm-source m1-source target-output             --session ${{ matrix.session }}
      - name: Enforce market controls
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
          EXPECTED_SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"]
          report = json.loads(
              (
                  Path("target-output")
                  / f"capitalizer-{symbol.lower()}-max-recovery-target-sensitivity-2y-v2.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_MAX_RECOVERY_TARGET_SENSITIVITY_2Y_V2"
          )
          assert report["symbol"] == symbol
          assert report["session"] == os.environ["EXPECTED_SESSION"]
          assert report["target_grid_r"] == [
              "1.00", "1.25", "1.50", "1.75", "2.00",
              "2.25", "2.50", "2.75", "3.00",
          ]
          assert report["target_hit_realized_r_equals_target_r"] is True
          assert report["supersedes_target_sensitivity_v1"] is True
          assert report["v1_defect"] == "TARGET_HIT_REALIZED_R_HARDCODED_TO_2"
          assert report["selection_changed"] is False
          assert report["entry_changed"] is False
          assert report["stop_changed"] is False
          assert report["h1_deadline_changed"] is False
          assert report["max3_changed"] is False
          assert report["only_target_r_varied"] is True
          assert report["outcome_used_for_admission"] is False
          assert report["target_selected"] is False
          assert report["fresh_holdout_required_after_selection"] is True
          assert report["automatic_promotion_allowed"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-max-recovery-target-sensitivity-2y-v2-${{ matrix.symbol }}-${{ github.sha }}
          path: target-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-max-recovery-target-sensitivity-2y-v2-*-${{ github.sha }}
          path: target-input
          merge-multiple: false
      - name: Build corrected nine-market target sensitivity
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_max_recovery_target_sensitivity_2y_v2             matrix target-input matrix-output
      - name: Enforce aggregate controls
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          report = json.loads(
              Path(
                  "matrix-output/"
                  "capitalizer-nine-market-max-recovery-target-sensitivity-2y-v2.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_NINE_MARKET_MAX_RECOVERY_TARGET_SENSITIVITY_2Y_V2"
          )
          assert report["market_count"] == 9
          assert report["final_raw_trades"] == 963
          assert report["final_max3_trades"] == 948
          assert report["baseline_target_r"] == "2.00"
          assert report["baseline_control_reproduced"] is True
          assert len(report["variants"]) == 9
          assert report["target_hit_realized_r_equals_target_r"] is True
          assert report["supersedes_target_sensitivity_v1"] is True
          assert report["v1_defect"] == "TARGET_HIT_REALIZED_R_HARDCODED_TO_2"

          by_target = {
              row["target_r"]: row["metrics"]
              for row in report["variants"]
          }
          assert by_target["2.00"] == report["baseline_metrics"]
          assert Decimal(by_target["2.00"]["profit_factor"]) == Decimal(
              "1.466020472120789368123727041"
          )
          assert Decimal(by_target["2.00"]["max_drawdown_r"]) == Decimal(
              "12.93584837435268644582248142"
          )

          assert report["selection_changed"] is False
          assert report["entry_changed"] is False
          assert report["stop_changed"] is False
          assert report["h1_deadline_changed"] is False
          assert report["max3_changed"] is False
          assert report["only_target_r_varied"] is True
          assert report["outcome_used_for_admission"] is False
          assert report["target_selected"] is False
          assert report["fresh_holdout_required_after_selection"] is True
          assert report["automatic_promotion_allowed"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-nine-market-target-sensitivity-2y-v2-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
