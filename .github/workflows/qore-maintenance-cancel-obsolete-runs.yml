name: QORE Maintenance Cancel Obsolete Runs

on:
  push:
    branches:
      - agent/shared-b-global-world-perception-001
    paths:
      - .github/workflows/qore-maintenance-cancel-obsolete-runs.yml

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: agent/cibo-integrator-ab-001
    steps:
      - name: Cancel every superseded active run on target branch
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          head="$(gh api "/repos/${repo}/branches/${TARGET_BRANCH}" --jq '.commit.sha')"
          echo "target_head=${head}"

          : > active.tsv
          for status in queued in_progress; do
            gh api --paginate               "/repos/${repo}/actions/runs?branch=${TARGET_BRANCH}&status=${status}&per_page=100"               --jq '.workflow_runs[] | [.id,.head_sha,.path] | @tsv'               >> active.tsv
          done

          sort -u active.tsv -o active.tsv
          total="$(wc -l < active.tsv | tr -d ' ')"
          echo "active_before=${total}"

          declare -A kept_path
          cancelled=0
          already_terminal=0
          failed=0
          kept=0

          while IFS=$'\t' read -r id sha path; do
            [ -n "${id}" ] || continue
            cancel=false

            if [ "${sha}" != "${head}" ]; then
              cancel=true
            elif [ -n "${kept_path[${path}]+x}" ]; then
              cancel=true
            else
              kept_path["${path}"]="${id}"
              kept=$((kept+1))
            fi

            if [ "${cancel}" = false ]; then
              echo "keep ${id} ${path}"
              continue
            fi

            status="$(gh api "/repos/${repo}/actions/runs/${id}" --jq '.status' 2>/dev/null || true)"
            case "${status}" in
              queued|in_progress|waiting|requested|pending)
                if gh api -X POST "/repos/${repo}/actions/runs/${id}/cancel" >/dev/null 2>&1; then
                  echo "cancelled ${id} ${path} (${status}, sha=${sha})"
                  cancelled=$((cancelled+1))
                else
                  echo "cancel request failed ${id} ${path} (${status})"
                  failed=$((failed+1))
                fi
                ;;
              completed|"")
                echo "already terminal or unavailable ${id} (${status:-unknown})"
                already_terminal=$((already_terminal+1))
                ;;
              *)
                echo "unexpected state ${id} (${status})"
                failed=$((failed+1))
                ;;
            esac
          done < <(sort -t$'\t' -k1,1nr active.tsv)

          echo "kept_current_head=${kept}"
          echo "cancelled=${cancelled}"
          echo "already_terminal=${already_terminal}"
          echo "failed=${failed}"
          test "${failed}" -eq 0
