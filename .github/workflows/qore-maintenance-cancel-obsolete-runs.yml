name: QORE Maintenance Cancel Obsolete Runs

on:
  push:
    branches:
      - agent/shared-b-global-world-perception-001
    paths:
      - .github/workflows/qore-maintenance-cancel-obsolete-runs.yml

concurrency:
  group: qore-maintenance-cancel-obsolete-runs
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: agent/cibo-integrator-ab-001
    steps:
      - name: Build exact residual cancellation set
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          head="$(gh api "/repos/${repo}/branches/${TARGET_BRANCH}" --jq '.commit.sha')"
          echo "TARGET_HEAD=${head}" >> "$GITHUB_ENV"

          : > active.tsv
          for status in queued in_progress; do
            gh api --paginate               "/repos/${repo}/actions/runs?branch=${TARGET_BRANCH}&status=${status}&per_page=100"               --jq '.workflow_runs[] | [.id,.head_sha,.path] | @tsv'               >> active.tsv
          done
          sort -u active.tsv -o active.tsv

          TARGET_HEAD="$head" python -c '
          import os
          from pathlib import Path
          head=os.environ["TARGET_HEAD"]
          rows=[]
          for line in Path("active.tsv").read_text().splitlines():
              if line.strip():
                  run_id,sha,path=line.split("\t",2)
                  rows.append((int(run_id),sha,path))
          keep={}
          for run_id,sha,path in sorted(rows, reverse=True):
              if sha == head and path not in keep:
                  keep[path]=run_id
          cancel=[
              run_id for run_id,sha,path in rows
              if sha != head or keep.get(path) != run_id
          ]
          Path("cancel-ids.txt").write_text(
              "".join(f"{x}\n" for x in sorted(cancel))
          )
          print(f"active_snapshot={len(rows)}")
          print(f"keep_current_head={len(keep)}")
          print(f"cancel_candidates={len(cancel)}")
          '

      - name: Cancel residual with throttled retries
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          cancelled=0
          terminal=0
          failed=0
          : > failures.txt

          while read -r id; do
            [ -n "$id" ] || continue
            success=false
            for attempt in 1 2 3 4 5 6; do
              body="$(mktemp)"
              headers="$(mktemp)"
              code="$(curl -sS -D "$headers" -o "$body" -w "%{http_code}"                 -X POST                 -H "Authorization: Bearer ${GH_TOKEN}"                 -H "Accept: application/vnd.github+json"                 -H "X-GitHub-Api-Version: 2022-11-28"                 "https://api.github.com/repos/${repo}/actions/runs/${id}/cancel")"
              case "$code" in
                202)
                  echo "cancelled ${id}"
                  cancelled=$((cancelled+1))
                  success=true
                  ;;
                409)
                  echo "already_terminal ${id}"
                  terminal=$((terminal+1))
                  success=true
                  ;;
                403)
                  retry="$(awk 'BEGIN{IGNORECASE=1} /^retry-after:/ {gsub("\r","",$2); print $2}' "$headers" | tail -1)"
                  [ -n "$retry" ] || retry=5
                  echo "rate_limited ${id} attempt=${attempt} retry_after=${retry}"
                  sleep "$retry"
                  ;;
                *)
                  echo "cancel_http_${code} ${id}"
                  ;;
              esac
              rm -f "$body" "$headers"
              if [ "$success" = true ]; then
                break
              fi
            done
            if [ "$success" != true ]; then
              echo "$id" >> failures.txt
              failed=$((failed+1))
            fi
            sleep 0.20
          done < cancel-ids.txt

          echo "cancelled=${cancelled}"
          echo "already_terminal=${terminal}"
          echo "failed=${failed}"
          test "$failed" -eq 0

      - name: Verify zero obsolete active runs
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          head="$(gh api "/repos/${repo}/branches/${TARGET_BRANCH}" --jq '.commit.sha')"

          : > remaining.tsv
          for status in queued in_progress; do
            gh api --paginate               "/repos/${repo}/actions/runs?branch=${TARGET_BRANCH}&status=${status}&per_page=100"               --jq '.workflow_runs[] | [.id,.head_sha,.path] | @tsv'               >> remaining.tsv
          done

          TARGET_HEAD="$head" python -c '
          import os
          from pathlib import Path
          head=os.environ["TARGET_HEAD"]
          rows=[]
          for line in Path("remaining.tsv").read_text().splitlines():
              if line.strip():
                  run_id,sha,path=line.split("\t",2)
                  rows.append((int(run_id),sha,path))
          old=[row for row in rows if row[1] != head]
          seen={}
          dup=[]
          for row in sorted(rows, reverse=True):
              if row[1] != head:
                  continue
              if row[2] in seen:
                  dup.append(row)
              else:
                  seen[row[2]]=row
          print(f"remaining_active={len(rows)}")
          print(f"remaining_current_head={sum(row[1] == head for row in rows)}")
          print(f"remaining_old_sha={len(old)}")
          print(f"remaining_head_duplicates={len(dup)}")
          raise SystemExit(2 if old or dup else 0)
          '
