name: QORE Maintenance Cancel Obsolete Runs

on:
  push:
    branches:
      - agent/shared-b-global-world-perception-001
    paths:
      - .github/workflows/qore-maintenance-cancel-obsolete-runs.yml

concurrency:
  group: qore-maintenance-cancel-obsolete-runs
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: agent/cibo-integrator-ab-001
    steps:
      - name: Drain superseded active runs
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"

          for pass in 1 2 3 4; do
            head="$(gh api "/repos/${repo}/branches/${TARGET_BRANCH}" --jq '.commit.sha')"
            echo "pass=${pass} target_head=${head}"

            : > active.tsv
            for status in queued in_progress; do
              gh api --paginate                 "/repos/${repo}/actions/runs?branch=${TARGET_BRANCH}&status=${status}&per_page=100"                 --jq '.workflow_runs[] | [.id,.head_sha,.path] | @tsv'                 >> active.tsv
            done
            sort -u active.tsv -o active.tsv

            TARGET_HEAD="$head" python - <<'PY'
            import os
            from pathlib import Path

            head = os.environ["TARGET_HEAD"]
            rows = []
            for line in Path("active.tsv").read_text().splitlines():
                if not line.strip():
                    continue
                run_id, sha, path = line.split("\t", 2)
                rows.append((int(run_id), sha, path))

            keep_by_path = {}
            for run_id, sha, path in sorted(rows, reverse=True):
                if sha == head and path not in keep_by_path:
                    keep_by_path[path] = run_id

            cancel = [
                run_id
                for run_id, sha, path in rows
                if sha != head or keep_by_path.get(path) != run_id
            ]
            Path("cancel-ids.txt").write_text(
                "".join(f"{item}\n" for item in sorted(cancel))
            )
            print(f"active_snapshot={len(rows)}")
            print(f"keep_current_head={len(keep_by_path)}")
            print(f"cancel_candidates={len(cancel)}")
            PY

            candidates="$(wc -l < cancel-ids.txt | tr -d ' ')"
            if [ "$candidates" -eq 0 ]; then
              echo "cleanup_complete_on_pass=${pass}"
              break
            fi

            export repo GH_TOKEN
            xargs -P 8 -n 1 bash -c '
              id="$1"
              code="$(curl -sS -o /dev/null -w "%{http_code}"                 -X POST                 -H "Authorization: Bearer ${GH_TOKEN}"                 -H "Accept: application/vnd.github+json"                 -H "X-GitHub-Api-Version: 2022-11-28"                 "https://api.github.com/repos/${repo}/actions/runs/${id}/cancel")"
              case "$code" in
                202) echo "cancelled ${id}" ;;
                409) echo "already_terminal ${id}" ;;
                *) echo "cancel_http_${code} ${id}" ;;
              esac
            ' _ < cancel-ids.txt | tee "cancel-results-${pass}.txt"

            bad="$(grep -c '^cancel_http_' "cancel-results-${pass}.txt" || true)"
            cancelled="$(grep -c '^cancelled ' "cancel-results-${pass}.txt" || true)"
            terminal="$(grep -c '^already_terminal ' "cancel-results-${pass}.txt" || true)"
            echo "pass_${pass}_cancelled=${cancelled}"
            echo "pass_${pass}_already_terminal=${terminal}"
            echo "pass_${pass}_bad=${bad}"
            test "$bad" -eq 0
          done

      - name: Verify zero obsolete active runs
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          head="$(gh api "/repos/${repo}/branches/${TARGET_BRANCH}" --jq '.commit.sha')"
          : > remaining.tsv
          for status in queued in_progress; do
            gh api --paginate               "/repos/${repo}/actions/runs?branch=${TARGET_BRANCH}&status=${status}&per_page=100"               --jq '.workflow_runs[] | [.id,.head_sha,.path] | @tsv'               >> remaining.tsv
          done

          TARGET_HEAD="$head" python - <<'PY'
          import os
          from pathlib import Path

          head = os.environ["TARGET_HEAD"]
          rows = []
          for line in Path("remaining.tsv").read_text().splitlines():
              if line.strip():
                  run_id, sha, path = line.split("\t", 2)
                  rows.append((int(run_id), sha, path))

          old = [row for row in rows if row[1] != head]
          seen = {}
          dup = []
          for row in sorted(rows, reverse=True):
              if row[1] != head:
                  continue
              if row[2] in seen:
                  dup.append(row)
              else:
                  seen[row[2]] = row

          print(f"remaining_active={len(rows)}")
          print(f"remaining_current_head={sum(row[1] == head for row in rows)}")
          print(f"remaining_old_sha={len(old)}")
          print(f"remaining_head_duplicates={len(dup)}")
          if old or dup:
              raise SystemExit(2)
          PY
