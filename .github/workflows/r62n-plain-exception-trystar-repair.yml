name: R62N plain exception TryStar repair

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qore-umi14-umi12-final-owner-recert-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Apply repair
        run: python .github/scripts/r62n_plain_exception_trystar_patch.py
      - name: Validate bounded repair
        run: |
          ruff check tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
          mypy tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
          pytest -q tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
      - name: Publish clean target only
        run: |
          rm .github/scripts/r62n_plain_exception_trystar_patch.py
          rm .github/workflows/r62n-plain-exception-trystar-repair.yml
          git config user.name 'mezas3238-hue'
          git config user.email 'mezas3238@gmail.com'
          git add tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py .github/scripts/r62n_plain_exception_trystar_patch.py .github/workflows/r62n-plain-exception-trystar-repair.yml
          git commit -m 'Handle plain exceptions through except-star fallback'
          git push origin HEAD:agent/qore-umi14-umi12-final-owner-recert-001
