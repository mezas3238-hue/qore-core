name: QORE TEMP R29 EXACT HEAD QG

on:
  push:
    branches: [agent/qg-r29-d5251008]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact R29 corrected candidate
        uses: actions/checkout@v4
        with:
          ref: 4258cfe1222b8de42f807d388d507d9368db4fb7
      - name: Verify exact candidate binding
        run: test "$(git rev-parse HEAD)" = "4258cfe1222b8de42f807d388d507d9368db4fb7"
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src tests
      - name: Pytest
        run: pytest --cov=src/qore --cov-report=term-missing
