name: QORE Shared WP05 V12 Microstructure Foundation

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - src/qore/infrastructure/core_stack_v2/active_perception_v12_microstructure_foundation.py
      - tests/infrastructure/test_core_stack_v2_active_perception_v12_microstructure_foundation.py
      - .github/workflows/qore-shared-wp05-active-perception-v12-microstructure-foundation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Shared
        run: pip install -e ".[dev]"
      - name: Validate causal microstructure foundation
        run: |
          set -euo pipefail
          ruff check             src/qore/infrastructure/core_stack_v2/active_perception_v12_microstructure_foundation.py             tests/infrastructure/test_core_stack_v2_active_perception_v12_microstructure_foundation.py
          mypy             src/qore/infrastructure/core_stack_v2/active_perception_v12_microstructure_foundation.py
          python -m py_compile             src/qore/infrastructure/core_stack_v2/active_perception_v12_microstructure_foundation.py
          pytest -q             tests/infrastructure/test_core_stack_v2_active_perception_v12_microstructure_foundation.py
