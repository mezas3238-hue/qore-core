name: QORE CIBO Final Exam Control Receipt V2

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/qore/infrastructure/cibo_final_exam_control_receipt.py'
      - 'src/qore/infrastructure/cibo_receipt_bound_final_integrated_exam_v2.py'
      - 'src/qore/infrastructure/cibo_arch_a_final_exam_closure_controls.py'
      - 'src/qore/infrastructure/cibo_arch_a_final_exam_scientific_controls.py'
      - 'src/qore/infrastructure/cibo_arch_a_final_source_truth_control.py'
      - 'src/qore/infrastructure/cibo_arch_a_final_pre_exam_control.py'
      - 'src/qore/infrastructure/cibo_arch_a_final_exam_system_controls.py'
      - 'tests/infrastructure/test_cibo_final_exam_control_receipt.py'
      - 'tests/infrastructure/test_cibo_receipt_bound_final_integrated_exam_v2.py'
      - 'tests/infrastructure/test_cibo_arch_a_final_exam_closure_controls.py'
      - 'tests/infrastructure/test_cibo_arch_a_final_exam_scientific_controls.py'
      - 'tests/infrastructure/test_cibo_arch_a_final_source_truth_control.py'
      - 'tests/infrastructure/test_cibo_arch_a_final_pre_exam_control.py'
      - 'tests/infrastructure/test_cibo_arch_a_final_exam_system_controls.py'
      - '.github/workflows/cibo-final-exam-control-receipt-v2.yml'

permissions:
  contents: read

jobs:
  final-exam-control-receipt-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Final exam receipt-bound V2 quality
        run: |
          ruff check \
            src/qore/infrastructure/cibo_final_exam_control_receipt.py \
            src/qore/infrastructure/cibo_receipt_bound_final_integrated_exam_v2.py \
            src/qore/infrastructure/cibo_arch_a_final_exam_closure_controls.py \
            src/qore/infrastructure/cibo_arch_a_final_exam_scientific_controls.py \
            src/qore/infrastructure/cibo_arch_a_final_source_truth_control.py \
            src/qore/infrastructure/cibo_arch_a_final_pre_exam_control.py \
            src/qore/infrastructure/cibo_arch_a_final_exam_system_controls.py \
            tests/infrastructure/test_cibo_final_exam_control_receipt.py \
            tests/infrastructure/test_cibo_receipt_bound_final_integrated_exam_v2.py \
            tests/infrastructure/test_cibo_arch_a_final_exam_closure_controls.py \
            tests/infrastructure/test_cibo_arch_a_final_exam_scientific_controls.py \
            tests/infrastructure/test_cibo_arch_a_final_source_truth_control.py \
            tests/infrastructure/test_cibo_arch_a_final_pre_exam_control.py \
            tests/infrastructure/test_cibo_arch_a_final_exam_system_controls.py
          mypy \
            src/qore/infrastructure/cibo_final_exam_control_receipt.py \
            src/qore/infrastructure/cibo_receipt_bound_final_integrated_exam_v2.py \
            src/qore/infrastructure/cibo_arch_a_final_exam_closure_controls.py \
            src/qore/infrastructure/cibo_arch_a_final_exam_scientific_controls.py \
            src/qore/infrastructure/cibo_arch_a_final_source_truth_control.py \
            src/qore/infrastructure/cibo_arch_a_final_pre_exam_control.py \
            src/qore/infrastructure/cibo_arch_a_final_exam_system_controls.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_final_exam_control_receipt.py \
            tests/infrastructure/test_cibo_receipt_bound_final_integrated_exam_v2.py \
            tests/infrastructure/test_cibo_arch_a_final_exam_closure_controls.py \
            tests/infrastructure/test_cibo_arch_a_final_exam_scientific_controls.py \
            tests/infrastructure/test_cibo_arch_a_final_source_truth_control.py \
            tests/infrastructure/test_cibo_arch_a_final_pre_exam_control.py \
            tests/infrastructure/test_cibo_arch_a_final_exam_system_controls.py
