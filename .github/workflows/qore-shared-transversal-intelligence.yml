name: QORE Shared Transversal Intelligence

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - src/qore/infrastructure/core_stack_v2/architecture_freeze.py
      - src/qore/infrastructure/core_stack_v2/compatibility.py
      - src/qore/infrastructure/core_stack_v2/stability_intelligence.py
      - src/qore/infrastructure/core_stack_v2/journey_intelligence.py
      - src/qore/infrastructure/core_stack_v2/transition_intelligence.py
      - src/qore/infrastructure/core_stack_v2/environment_intelligence.py
      - src/qore/infrastructure/core_stack_v2/path_intelligence.py
      - src/qore/infrastructure/core_stack_v2/instinct_intelligence.py
      - src/qore/infrastructure/core_stack_v2/__init__.py
      - tests/infrastructure/test_core_stack_v2_transversal_intelligence.py
      - tests/infrastructure/test_core_stack_v2_instinct_intelligence.py
      - .github/workflows/qore-shared-transversal-intelligence.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transversal-intelligence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Static validation
        run: |
          ruff check             src/qore/infrastructure/core_stack_v2/architecture_freeze.py             src/qore/infrastructure/core_stack_v2/compatibility.py             src/qore/infrastructure/core_stack_v2/stability_intelligence.py             src/qore/infrastructure/core_stack_v2/journey_intelligence.py             src/qore/infrastructure/core_stack_v2/transition_intelligence.py             src/qore/infrastructure/core_stack_v2/environment_intelligence.py             src/qore/infrastructure/core_stack_v2/path_intelligence.py             src/qore/infrastructure/core_stack_v2/instinct_intelligence.py             src/qore/infrastructure/core_stack_v2/__init__.py             tests/infrastructure/test_core_stack_v2_transversal_intelligence.py
          python -m py_compile             src/qore/infrastructure/core_stack_v2/architecture_freeze.py             src/qore/infrastructure/core_stack_v2/compatibility.py             src/qore/infrastructure/core_stack_v2/stability_intelligence.py             src/qore/infrastructure/core_stack_v2/journey_intelligence.py             src/qore/infrastructure/core_stack_v2/transition_intelligence.py             src/qore/infrastructure/core_stack_v2/environment_intelligence.py             src/qore/infrastructure/core_stack_v2/path_intelligence.py             src/qore/infrastructure/core_stack_v2/instinct_intelligence.py             src/qore/infrastructure/core_stack_v2/__init__.py
      - name: Transversal architecture tests
        run: |
          pytest -q             tests/infrastructure/test_core_stack_v2_transversal_intelligence.py             tests/infrastructure/test_core_stack_v2_instinct_intelligence.py             tests/infrastructure/test_core_stack_v2_foundation.py             tests/infrastructure/test_core_stack_v2_runtime.py
      - name: Governance assertions
        run: |
          python - <<'PY'
          from qore.infrastructure.core_stack_v2 import (
              compatibility_manifest,
              superintelligence_freeze_contract,
          )

          freeze = superintelligence_freeze_contract()
          scope = freeze["transversal_scope"]
          assert scope["shared_core_is_qore_wide"] is True
          assert scope["shared_core_is_not_a_vt31_module"] is True
          assert scope["vt31_role"] == "PRIMARY_FALSIFICATION_LAB_ONLY"
          assert freeze["generic_ontology_law"]["trader_specific_ontology_forbidden_in_shared_core"] is True
          assert freeze["multi_trader_validation"]["required_after_vt31"] is True

          manifest = compatibility_manifest()
          assert manifest["shared_scope"] == "ALL_ENABLED_QORE_TRADERS_VIA_ADAPTER"
          assert manifest["default_new_trader_status"] == "ADAPTER_REQUIRED"
          assert manifest["governance"]["shared_core_is_qore_wide"] is True
          assert manifest["governance"]["vt08_forex_excluded"] is True
          print("TRANSVERSAL_SHARED_GOVERNANCE=PASS")
          PY
