name: QORE Scalper A1 Original Source Session Clock NY DST Nine Markets

on:
  push:
    branches: [agent/scalper-architect-a-cognition-20261010]
    paths:
      - '.github/workflows/qore-scalper-a1-real-source-session-clock-dst-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_a1_native_source_session_clock_attestation_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_a1_native_source_session_clock_attestation_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  V49_RUN: '38053946695'
  V49_SHA: 'e356e7a52541e99533b25ecfef0ab9c4e9ce03c0'

jobs:
  source_clock_attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Causal session and DST regressions
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_a1_native_source_session_clock_attestation_v1.py tests/infrastructure/trader_lab/test_capitalizer_a1_native_source_session_clock_attestation_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_a1_native_source_session_clock_attestation_v1.py tests/infrastructure/trader_lab/test_capitalizer_a1_native_source_session_clock_attestation_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_a1_native_source_session_clock_attestation_v1.py
      - name: Load all original V49 opportunities, never choose only winners
        uses: actions/download-artifact@v4
        with:
          pattern: scalper-a2-v49-control-*-${{ env.V49_SHA }}
          path: original-v49
          github-token: ${{ github.token }}
          run-id: ${{ env.V49_RUN }}
          merge-multiple: false
      - name: Reconstruct 2876 source research session and author clock distinctions
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_a1_native_source_session_clock_attestation_v1 original-v49 source-clock-results
      - name: Assert all identities/no new veto and retained clock distinctions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("source-clock-results/scalper-a1-native-nine-market-clock-summary.json").read_text())
          assert d["markets"]==9 and d["original_source_ids"]==2876
          assert d["source_entries_removed"]==0 and d["new_vetoes"]==0
          assert not d["session_bucket_equals_author_killzone"]
          assert not d["asian_open_author_clock_attested"]
          assert not d["broker_bid_ask_attested"]
          assert d["cognitive_pf"] is None and d["cognitive_drawdown_r"] is None
          assert not d["author_certified"] and not d["live_authorized"]
          print("NATIVE ORIGINAL SESSION CLOCK:",json.dumps(d,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-a1-original-source-session-clock-9market-${{ github.sha }}
          path: source-clock-results/
          if-no-files-found: error
          retention-days: 90
