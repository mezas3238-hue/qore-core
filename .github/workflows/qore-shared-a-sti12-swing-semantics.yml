name: QORE Shared A STI12 Swing Semantics

concurrency:
  group: qore-shared-a-sti12-swing-semantics
  cancel-in-progress: false

on:
  push:
    branches:
      - agent/shared-a-cognitive-science-001
    paths:
      - scripts/shared_sti12_swing_semantics.py
      - .github/workflows/qore-shared-a-sti12-swing-semantics.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  semantics:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate swing semantics
        run: |
          set -euo pipefail
          mkdir -p result
          ruff check src/qore/infrastructure/core_stack_v2/shared_swing_trader_support.py tests/infrastructure/test_core_stack_v2_shared_swing_trader_support.py scripts/shared_sti12_swing_semantics.py
          mypy src/qore/infrastructure/core_stack_v2/shared_swing_trader_support.py
          pytest -q tests/infrastructure/test_core_stack_v2_shared_swing_trader_support.py
          python scripts/shared_sti12_swing_semantics.py | tee result/summary.json
      - name: Validate scoped completion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/sti12-swing-semantics.json").read_text())
          assert p["status"] == "STI12_SWING_RESEARCH_SEMANTICS_COMPLETED_AND_PROVEN"
          assert p["all_four_families_present"] is True
          assert p["h1_h4_d1_w1_interface_present"] is True
          assert p["runtime_swing_trader_created"] is False
          assert p["swing_trader_certified"] is False
          assert p["predictive_value_claimed"] is False
          assert p["economic_value_claimed"] is False
          assert p["sti12_completed_and_proven"] is True
          PY
      - name: Seal result
        run: |
          printf '%s\n' "${GITHUB_SHA}" > result/code-git-sha.txt
          (
            cd result
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-a-sti12-swing-semantics-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
      - name: Report STI12
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p=json.loads(Path("result/sti12-swing-semantics.json").read_text())
          body="\n".join([
              "## Shared A STI-12 — Swing Research Semantics",
              "",
              f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- disposition: **{p['status']}**",
              f"- four families present: **{p['all_four_families_present']}**",
              f"- H1/H4/D1/W1 interface present: **{p['h1_h4_d1_w1_interface_present']}**",
              "- runtime Swing Trader created/certified: **False / False**",
              "- predictive/economic value claimed: **False / False**",
              "- protected certification holdout opened: **False**",
          ])+"\n"
          Path("result/issue-comment.md").write_text(body)
          PY
          gh issue comment 638 --body-file result/issue-comment.md
