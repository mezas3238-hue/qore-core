name: QORE Capitalizer Pre-entry Cross-Market Event-Time V42

on:
  push:
    branches:
      - agent/capitalizer-preentry-cross-market-event-time-v42-001
    paths:
      - '.github/workflows/qore-capitalizer-preentry-cross-market-event-time-v42.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_preentry_cross_market_event_time_state_v42.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_preentry_cross_market_event_time_separability_v42.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_preentry_cross_market_event_time_state_v42.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-preentry-cross-market-event-time-v42-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'
  SOURCE_V38_RUN_ID: '36495104604'
  SOURCE_V38_SELECTED_ARTIFACT: 'qore-capitalizer-v38-geometry-selected-resume-3aa4ee3c181c1fe10fce087b904e6e797770a87d'
  V21_RUN_ID: '36264229554'
  V21_ARTIFACT_SHA: '05452328bbf5cbbc4b26210791d13114105e3f9d'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_preentry_cross_market_event_time_state_v42.py \
            src/qore/infrastructure/trader_lab/capitalizer_preentry_cross_market_event_time_separability_v42.py \
            tests/infrastructure/trader_lab/test_capitalizer_preentry_cross_market_event_time_state_v42.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_preentry_cross_market_event_time_state_v42.py \
            src/qore/infrastructure/trader_lab/capitalizer_preentry_cross_market_event_time_separability_v42.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_preentry_cross_market_event_time_state_v42.py

  experiment:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable source artifacts by public ID with SHA-256 verification
        shell: bash
        run: |
          set -euo pipefail

          download_artifact() {
            local id="$1"
            local digest="$2"
            local destination="$3"
            local zip="artifact-${id}.zip"
            mkdir -p "${destination}"
            curl --fail --location --silent --show-error \
              --retry 4 --retry-delay 2 --retry-all-errors \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: qore-core-v42-research" \
              "https://api.github.com/repos/mezas3238-hue/qore-core/actions/artifacts/${id}/zip" \
              -o "${zip}"
            echo "${digest}  ${zip}" | sha256sum -c -
            unzip -q -o "${zip}" -d "${destination}"
            rm -f "${zip}"
          }

          # Immutable provider-native M1 clone, source run 35548099334.
          download_artifact 10617557766 0474dc66e7e9ff9f24a96827a85ffaaed3dc7ace201e422b73340f68ca073686 \
            "m1-all/qore-capitalizer-cibo-10y-native-m1-USDJPY-${SOURCE_M1_SHA}"
          download_artifact 10618120956 2fa9bce24faaa72716bd4efe7b213806147c96a79729c2b3613dd3ed8e7d0aa7 \
            "m1-all/qore-capitalizer-cibo-10y-native-m1-AUDJPY-${SOURCE_M1_SHA}"
          download_artifact 10618116387 858ad966c04dfe24ead37e1a4c3f5d698609d3762dff0307199e62ccbf98123e \
            "m1-all/qore-capitalizer-cibo-10y-native-m1-AUDUSD-${SOURCE_M1_SHA}"
          download_artifact 10618826746 2723cd6e4a2aebddf236c13e6398558f31011ba3c40e5759043964b0dde57c25 \
            "m1-all/qore-capitalizer-cibo-10y-native-m1-GBPJPY-${SOURCE_M1_SHA}"
          download_artifact 10618547852 891caa0aae3b665bc09d1cc3f16c00bcb7baef61bce18bbe69db97100516f353 \
            "m1-all/qore-capitalizer-cibo-10y-native-m1-EURUSD-${SOURCE_M1_SHA}"
          download_artifact 10618811910 c9840b4ad46871fd578c92c99a10fbd663e06bf99b708186bed4e5b85466040d \
            "m1-all/qore-capitalizer-cibo-10y-native-m1-GBPUSD-${SOURCE_M1_SHA}"
          download_artifact 10619681073 1dad5a1b57e8a606fa33616d97faf75bf1ab2431b4603e0036bfb9f832fa1fde \
            "m1-all/qore-capitalizer-cibo-10y-native-m1-XAUUSD-${SOURCE_M1_SHA}"
          download_artifact 10619306654 0a577295d6a3d9e889f805325e40facdff44a3c23fefe23cf1c2ac1c6faa173a \
            "m1-all/qore-capitalizer-cibo-10y-native-m1-USDCAD-${SOURCE_M1_SHA}"
          download_artifact 10618862813 d5f45e6594dfb8c5c5931c10ad4e3459f8a159fef8bfbe8d73dc11015996498c \
            "m1-all/qore-capitalizer-cibo-10y-native-m1-NAS100-${SOURCE_M1_SHA}"

          # Reconciled V38 entrant identities, authoritative resume run 36495104604.
          download_artifact 11003255761 f95edee75d5ec88a1aadaedbd80f55837c28e7066d9c5381c4a70dc4f8eb12ef \
            selected-geometry

          # Authoritative V21 reconstructed selected populations, run 36264229554.
          download_artifact 10914715285 caa40bca2c87262f2ec60772cbab0fd30cd0dc6160cad86bcb9e93049a196f6c reconstructed
          download_artifact 10914665868 78c18ccf31479b3a6849d3263440bee495e77c4a0c7e420621d20a93107837cb reconstructed
          download_artifact 10914561456 e5f5077b4eeaf05cb9249a17e12279e15e204b5fe667c4f8af08fae38d8f57c1 reconstructed
          download_artifact 10914199618 f07753707946f5d08ddf3c7533cf905f653a52b4afc67e821ba06ae05b1254ea reconstructed
          download_artifact 10914138724 ad5cda2f9e97ce4389f5c7b50f549e9cbd7ab0558b5db772331d8b9540ea2b93 reconstructed
          download_artifact 10913983773 c0efa0f205c307f91b2c6316d2d020b06eec4added46c143ecafd3d81e0a0fe9 reconstructed
          download_artifact 10913923737 82be4815fdaba543a8db6c1318df875edadbc54a9ea0d368060fd2364ec0014d reconstructed
          download_artifact 10913787623 ec05d94d203e4b17b5554bb38545589f8e2a8d058bf86794ef886e4f4e8b8088 reconstructed
          download_artifact 10913527657 0b02e0ae6ea65315fa7b16442e7b6849bcb2af20b4c0cc932ead882a300ec3ce reconstructed

      - name: Build all nine frozen V42 peer snapshot ledgers
        run: |
          set -euo pipefail
          SYMBOLS=(USDJPY AUDJPY AUDUSD GBPJPY EURUSD GBPUSD XAUUSD USDCAD NAS100)
          for SYMBOL in "${SYMBOLS[@]}"; do
            ROOT="m1-all/qore-capitalizer-cibo-10y-native-m1-${SYMBOL}-${SOURCE_M1_SHA}"
            test -d "${ROOT}/RAW_M1_LEDGER"
            python -m qore.infrastructure.trader_lab.capitalizer_preentry_cross_market_event_time_state_v42 \
              "${SYMBOL}" \
              "${ROOT}" \
              selected-geometry \
              snapshot-output
          done
      - name: Enforce V42 peer causal boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          reports=sorted(
              Path("snapshot-output").glob(
                  "capitalizer-v42-peer-*-event-state-report.json"
              )
          )
          assert len(reports) == 9, len(reports)
          expected={
              "DEVELOPMENT_2024_2026":948,
              "CONSUMED_VALIDATION_2022_2024":1034,
              "CONSUMED_RESERVED_2020_2022":1088,
          }
          for path in reports:
              report=json.loads(path.read_text())
              assert report["identity"] == (
                  "QORE_CAPITALIZER_PREENTRY_CROSS_MARKET_EVENT_TIME_STATE_V42"
              )
              assert report["max_fresh_age_seconds"] == 60
              assert report["total_rows"] == 3070
              assert report["stale_peer_price_imputation_used"] is False
              assert report["future_bar_used"] is False
              assert report["outcome_used"] is False
              assert report["exit_used"] is False
              assert report["mae_mfe_used"] is False
              assert report["fresh_holdout_opened"] is False
              assert report["runtime_policy_candidate"] is False
              assert report["trader_certified"] is False
              for period,count in expected.items():
                  row=report["period_counts"][period]
                  assert row["rows"] == count
                  assert row["fresh"] + row["stale_or_missing"] == count
      - name: Run frozen V42 cross-era information frontier
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_preentry_cross_market_event_time_separability_v42 \
            reconstructed/development-input \
            reconstructed/validation-input \
            reconstructed/reserved-input \
            snapshot-output \
            experiment-output
      - name: Enforce frozen V42 contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path=Path(
              "experiment-output/"
              "capitalizer-preentry-cross-market-event-time-separability-v42.json"
          )
          report=json.loads(path.read_text())
          assert report["identity"] == (
              "QORE_CAPITALIZER_PREENTRY_CROSS_MARKET_EVENT_TIME_STATE_SEPARABILITY_V42"
          )
          assert report["predeclaration_comment_id"] == 5881287609
          assert report["feature_dimension"] == 18
          assert report["max_peer_age_seconds"] == 60
          assert report["candidate_market_excluded"] is True
          assert report["stale_peer_price_imputation_used"] is False
          assert report["entrant_drop_on_peer_staleness"] is False
          assert report["availability_identity_bits_used"] is False
          assert report["v11_features_used"] is False
          assert report["v38_geometry_features_used"] is False
          assert report["v40_m1_path_features_used"] is False
          assert report["v41_tick_microstructure_features_used"] is False
          assert report["stop_target_labels_used_as_features"] is False
          assert report["current_outcome_visible_to_features"] is False
          assert report["future_exit_visible_to_features"] is False
          assert report["future_mfe_mae_visible_to_features"] is False
          assert report["symbol_identity_feature_used"] is False
          assert report["peer_symbol_identity_feature_used"] is False
          assert report["date_identity_feature_used"] is False
          assert report["session_identity_feature_used"] is False
          assert report["two_external_worlds_required"] is True
          assert report["threshold_grid_searched"] is False
          assert report["policy_economics_run"] is False
          assert report["admission_changed"] is False
          assert report["sizing_changed"] is False
          assert report["protection_changed"] is False
          assert report["runtime_policy_candidate"] is False
          assert report["fresh_holdout_opened"] is False
          assert report["trader_certified"] is False
          expected={
              "DEVELOPMENT_2024_2026":948,
              "CONSUMED_VALIDATION_2022_2024":1034,
              "CONSUMED_RESERVED_2020_2022":1088,
          }
          for period,count in expected.items():
              coverage=report["coverage_by_period"][period]
              assert coverage["selected_entrants"] == count
              assert coverage["cross_market_states"] == count
              assert coverage["coverage"] == "1"
              assert coverage["missing"] == 0
              assert coverage["extra"] == 0
              assert coverage["candidate_market_excluded"] is True
              assert coverage["stale_peer_price_imputation_used"] is False
          assert len(report["heldout_results"]) == 3
          print(json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-preentry-cross-market-event-time-v42-${{ github.sha }}
          path: |
            snapshot-output
            experiment-output
          if-no-files-found: error
          retention-days: 90
