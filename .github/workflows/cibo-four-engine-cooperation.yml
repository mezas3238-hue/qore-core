name: QORE CIBO Four Engine Cooperation Fast Lab

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cibo-four-engine-cooperation-001
    paths:
      - '.github/workflows/cibo-four-engine-cooperation.yml'
      - 'src/qore/infrastructure/trader_lab/cibo_three_mode_capital_lab.py'
      - 'scripts/cibo_trader_lab_three_mode_ceiling.py'
      - 'tests/infrastructure/trader_lab/test_cibo_three_mode_capital_lab.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-cibo-four-engine-cooperation-${{ github.sha }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}/src
  SOURCE_ARTIFACT_ID: '11451743578'
  SOURCE_ARTIFACT_DIGEST: 'sha256:d439957f21e2f79148b5a2fb75a53db6fa448698f17aeb6978f379ed3547f7ea'
  HISTORICAL_SOURCE_ARTIFACT_ID: '11389331836'
  HISTORICAL_SOURCE_ARTIFACT_DIGEST: 'sha256:30177639f660c9647ab70257c2d12c541bdade49ab5582347a3890f920070fee'
  HISTORICAL_CONTROL_ARTIFACT_ID: '11409086692'
  HISTORICAL_CONTROL_ARTIFACT_DIGEST: 'sha256:eeffdc99a736b82bd965ff646b8ca9bf084f50ae414e56e9b3d82961169d7187'

jobs:
  cooperation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile and contract check
        run: |
          set -euo pipefail
          python -m py_compile \
            src/qore/infrastructure/trader_lab/cibo_three_mode_capital_lab.py \
            scripts/cibo_trader_lab_three_mode_ceiling.py
          python -m unittest -q \
            tests.infrastructure.trader_lab.test_cibo_three_mode_capital_lab

      - name: Recover frozen causal inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/historical-source" "$RUNNER_TEMP/historical-control" "$RUNNER_TEMP/result"

          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID" > "$RUNNER_TEMP/source.meta.json"
          jq -e --arg digest "$SOURCE_ARTIFACT_DIGEST" '.expired == false and .digest == $digest' "$RUNNER_TEMP/source.meta.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" > "$RUNNER_TEMP/source.zip"
          echo "${SOURCE_ARTIFACT_DIGEST#sha256:}  $RUNNER_TEMP/source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/source"
          MANIFEST="$(find "$RUNNER_TEMP/source" -type f -name walk-forward-manifest.json -print -quit)"
          BASELINE="$(find "$RUNNER_TEMP/source" -type f -name walk-forward-replay.json -print -quit)"
          test -n "$MANIFEST" && test -n "$BASELINE"

          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$HISTORICAL_SOURCE_ARTIFACT_ID" > "$RUNNER_TEMP/historical-source.meta.json"
          jq -e --arg digest "$HISTORICAL_SOURCE_ARTIFACT_DIGEST" '.expired == false and .digest == $digest' "$RUNNER_TEMP/historical-source.meta.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$HISTORICAL_SOURCE_ARTIFACT_ID/zip" > "$RUNNER_TEMP/historical-source.zip"
          echo "${HISTORICAL_SOURCE_ARTIFACT_DIGEST#sha256:}  $RUNNER_TEMP/historical-source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/historical-source.zip" -d "$RUNNER_TEMP/historical-source"
          HISTORICAL_MANIFEST="$(find "$RUNNER_TEMP/historical-source" -type f -name single-account-manifest-native.json -print -quit)"
          test -n "$HISTORICAL_MANIFEST"

          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$HISTORICAL_CONTROL_ARTIFACT_ID" > "$RUNNER_TEMP/historical-control.meta.json"
          jq -e --arg digest "$HISTORICAL_CONTROL_ARTIFACT_DIGEST" '.expired == false and .digest == $digest' "$RUNNER_TEMP/historical-control.meta.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$HISTORICAL_CONTROL_ARTIFACT_ID/zip" > "$RUNNER_TEMP/historical-control.zip"
          echo "${HISTORICAL_CONTROL_ARTIFACT_DIGEST#sha256:}  $RUNNER_TEMP/historical-control.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/historical-control.zip" -d "$RUNNER_TEMP/historical-control"
          HISTORICAL_REPLAY="$(find "$RUNNER_TEMP/historical-control" -type f -name historical-ceiling-replay.json -print -quit)"
          test -n "$HISTORICAL_REPLAY"

          echo "MANIFEST=$MANIFEST" >> "$GITHUB_ENV"
          echo "BASELINE=$BASELINE" >> "$GITHUB_ENV"
          echo "HISTORICAL_MANIFEST=$HISTORICAL_MANIFEST" >> "$GITHUB_ENV"
          echo "HISTORICAL_REPLAY=$HISTORICAL_REPLAY" >> "$GITHUB_ENV"

      - name: Run four-engine cooperation
        run: |
          set -euo pipefail
          python scripts/cibo_trader_lab_three_mode_ceiling.py \
            --manifest "$MANIFEST" \
            --baseline-replay "$BASELINE" \
            --historical-manifest "$HISTORICAL_MANIFEST" \
            --historical-replay "$HISTORICAL_REPLAY" \
            --four-engine-cooperation-frontier \
            --medium-multiplier-cap 4 \
            --output "$RUNNER_TEMP/result/cibo-four-engine-cooperation.json"

      - name: Enforce four-engine cooperation invariants
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from decimal import Decimal
          from pathlib import Path

          p = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "result"
                  / "cibo-four-engine-cooperation.json"
              ).read_text()
          )
          assert p["research_lane"] == (
              "HISTORICAL_PRIOR_NATIVE_FOUR_ENGINE_COOPERATION_FRONTIER"
          )
          assert p["decision_count"] == 3368
          assert p["trade_count"] == 3368
          assert p["trade_mode_counts"].get("MEDIUM", 0) == 3368
          assert p["trade_mode_counts"].get("ATTACK", 0) == 0
          assert p["governance"]["four_engine_cooperation_frontier"] is True
          assert p["governance"]["four_engine_portfolio_aligned_sizing"] is True
          assert p["governance"]["outcome_used_for_predecision"] is False
          assert Decimal(p["ending_total_capital_usd"]) > 0
          assert Decimal(
              p["cooperative_portfolio_sovereign_breach_usd"]
          ) == 0

          coop = p["four_engine_cooperation_report"]
          assert coop["enabled"] is True
          assert coop["joint_decision_count"] == 3368
          assert coop["sizing_above_one_count"] > 0
          assert coop["compound_growth_enabled_count"] > 0
          assert coop["portfolio_growth_enabled_count"] > 0
          assert coop["leverage_above_one_count"] > 0
          assert coop["all_entries_preserve_minimum_1x"] is True

          funnel = p["engineering_sensor_report"]["execution_funnel"]
          assert funnel["final_trade_count"] == 3368
          assert funnel["sizing_medium_rejected_count"] == 0
          assert funnel["sizing_medium_deferred_count"] == 0
          assert funnel[
              "compound_portfolio_withheld_before_execution_engine_count"
          ] == 0

          print(json.dumps({
              "ending_total_capital_usd": p["ending_total_capital_usd"],
              "ending_sovereign_bank_usd": p["ending_sovereign_bank_usd"],
              "ending_portfolio_cushion_usd": p[
                  "ending_portfolio_cushion_usd"
              ],
              "max_drawdown_fraction": p["max_drawdown_fraction"],
              "maximum_selected_multiplier": p[
                  "maximum_selected_multiplier"
              ],
              "medium_compound_positive_net_usd": p[
                  "medium_compound_positive_net_usd"
              ],
              "medium_compound_negative_net_usd": p[
                  "medium_compound_negative_net_usd"
              ],
              "cooperative_portfolio_net_pnl_usd": p[
                  "cooperative_portfolio_net_pnl_usd"
              ],
              "cooperative_portfolio_turnover_usd": p[
                  "cooperative_portfolio_turnover_usd"
              ],
              "four_engine_cooperation_report": coop,
              "economic_bottleneck_ranking": p[
                  "engineering_sensor_report"
              ]["bottleneck_ranking"],
          }, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-cibo-four-engine-cooperation-${{ github.run_id }}
          path: ${{ runner.temp }}/result/cibo-four-engine-cooperation.json
          if-no-files-found: warn
          retention-days: 90
