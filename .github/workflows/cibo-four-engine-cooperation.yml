name: QORE CIBO Four Engine Cooperation Fast Lab

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cibo-four-engine-cooperation-001
      - agent/cibo-dd-selective-custody-001
      - agent/cibo-dd-activated-custody-001
      - agent/cibo-dd-mfe-selective-001
      - agent/cibo-dd-trader-adaptive-001
      - agent/cibo-dd-staged-custody-002
    paths:
      - '.github/workflows/cibo-four-engine-cooperation.yml'
      - 'src/qore/infrastructure/trader_lab/cibo_three_mode_capital_lab.py'
      - 'src/qore/infrastructure/cibo_position_lifecycle.py'
      - 'scripts/cibo_trader_lab_three_mode_ceiling.py'
      - 'tests/infrastructure/trader_lab/test_cibo_three_mode_capital_lab.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-cibo-four-engine-cooperation-${{ github.sha }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}/src
  SOURCE_ARTIFACT_ID: '11451743578'
  SOURCE_ARTIFACT_DIGEST: 'sha256:d439957f21e2f79148b5a2fb75a53db6fa448698f17aeb6978f379ed3547f7ea'
  HISTORICAL_SOURCE_ARTIFACT_ID: '11389331836'
  HISTORICAL_SOURCE_ARTIFACT_DIGEST: 'sha256:30177639f660c9647ab70257c2d12c541bdade49ab5582347a3890f920070fee'
  HISTORICAL_CONTROL_ARTIFACT_ID: '11409086692'
  HISTORICAL_CONTROL_ARTIFACT_DIGEST: 'sha256:eeffdc99a736b82bd965ff646b8ca9bf084f50ae414e56e9b3d82961169d7187'
  ATLAS_AUDJPY_ARTIFACT_ID: '10476530915'
  ATLAS_AUDJPY_DIGEST: 'sha256:a416085cfcef04003ae89debaad360304a0c4c8bac65b3bf2b439a8a4b7098bf'
  ATLAS_EURUSD_ARTIFACT_ID: '10475354631'
  ATLAS_EURUSD_DIGEST: 'sha256:e0fa9e316b79ba61c338161a57508359d4c6afe2fbf97d3f50f1e27c2d359a86'
  ATLAS_GBPJPY_ARTIFACT_ID: '10475453293'
  ATLAS_GBPJPY_DIGEST: 'sha256:b68e74b2afa54295f891c11cde19e12e92db4192930496036c7ebb372474e415'
  ATLAS_GBPUSD_ARTIFACT_ID: '10475449182'
  ATLAS_GBPUSD_DIGEST: 'sha256:77d5b65ce3c6763e3ac5f620e4167d4ef071bfe1c13746cd5ca7ad9788268dcf'
  ATLAS_NAS100_ARTIFACT_ID: '10476153072'
  ATLAS_NAS100_DIGEST: 'sha256:87ae8095feadce23c5026cda4dada49765d44d0baa2237b5bd7704ccc8deb863'
  ATLAS_XAUUSD_ARTIFACT_ID: '10476557530'
  ATLAS_XAUUSD_DIGEST: 'sha256:dcb905b11380e3d4e1a4dc621e269bb75d2886806dd662e260d21d1d15362e08'

jobs:
  cooperation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile and contract check
        run: |
          set -euo pipefail
          python -m py_compile \
            src/qore/infrastructure/trader_lab/cibo_three_mode_capital_lab.py \
            scripts/cibo_trader_lab_three_mode_ceiling.py
          python -m unittest -q \
            tests.infrastructure.trader_lab.test_cibo_three_mode_capital_lab

      - name: Recover frozen causal inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/historical-source" "$RUNNER_TEMP/historical-control" "$RUNNER_TEMP/result"

          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID" > "$RUNNER_TEMP/source.meta.json"
          jq -e --arg digest "$SOURCE_ARTIFACT_DIGEST" '.expired == false and .digest == $digest' "$RUNNER_TEMP/source.meta.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" > "$RUNNER_TEMP/source.zip"
          echo "${SOURCE_ARTIFACT_DIGEST#sha256:}  $RUNNER_TEMP/source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/source"
          MANIFEST="$(find "$RUNNER_TEMP/source" -type f -name walk-forward-manifest.json -print -quit)"
          BASELINE="$(find "$RUNNER_TEMP/source" -type f -name walk-forward-replay.json -print -quit)"
          test -n "$MANIFEST" && test -n "$BASELINE"

          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$HISTORICAL_SOURCE_ARTIFACT_ID" > "$RUNNER_TEMP/historical-source.meta.json"
          jq -e --arg digest "$HISTORICAL_SOURCE_ARTIFACT_DIGEST" '.expired == false and .digest == $digest' "$RUNNER_TEMP/historical-source.meta.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$HISTORICAL_SOURCE_ARTIFACT_ID/zip" > "$RUNNER_TEMP/historical-source.zip"
          echo "${HISTORICAL_SOURCE_ARTIFACT_DIGEST#sha256:}  $RUNNER_TEMP/historical-source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/historical-source.zip" -d "$RUNNER_TEMP/historical-source"
          HISTORICAL_MANIFEST="$(find "$RUNNER_TEMP/historical-source" -type f -name single-account-manifest-native.json -print -quit)"
          test -n "$HISTORICAL_MANIFEST"

          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$HISTORICAL_CONTROL_ARTIFACT_ID" > "$RUNNER_TEMP/historical-control.meta.json"
          jq -e --arg digest "$HISTORICAL_CONTROL_ARTIFACT_DIGEST" '.expired == false and .digest == $digest' "$RUNNER_TEMP/historical-control.meta.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$HISTORICAL_CONTROL_ARTIFACT_ID/zip" > "$RUNNER_TEMP/historical-control.zip"
          echo "${HISTORICAL_CONTROL_ARTIFACT_DIGEST#sha256:}  $RUNNER_TEMP/historical-control.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/historical-control.zip" -d "$RUNNER_TEMP/historical-control"
          HISTORICAL_REPLAY="$(find "$RUNNER_TEMP/historical-control" -type f -name historical-ceiling-replay.json -print -quit)"
          test -n "$HISTORICAL_REPLAY"

          echo "MANIFEST=$MANIFEST" >> "$GITHUB_ENV"
          echo "BASELINE=$BASELINE" >> "$GITHUB_ENV"
          echo "HISTORICAL_MANIFEST=$HISTORICAL_MANIFEST" >> "$GITHUB_ENV"
          echo "HISTORICAL_REPLAY=$HISTORICAL_REPLAY" >> "$GITHUB_ENV"

          mkdir -p "$RUNNER_TEMP/atlas"
          for SYMBOL in AUDJPY EURUSD GBPJPY GBPUSD NAS100 XAUUSD; do
            ID_VAR="ATLAS_${SYMBOL}_ARTIFACT_ID"
            DIGEST_VAR="ATLAS_${SYMBOL}_DIGEST"
            ARTIFACT_ID="${!ID_VAR}"
            ARTIFACT_DIGEST="${!DIGEST_VAR}"
            ZIP="$RUNNER_TEMP/atlas-${SYMBOL}.zip"
            ROOT="$RUNNER_TEMP/atlas/${SYMBOL}"
            mkdir -p "$ROOT"
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$ZIP"
            echo "${ARTIFACT_DIGEST#sha256:}  $ZIP" | sha256sum -c -
            unzip -q "$ZIP" \
              'RAW_M5_LEDGER/2019.jsonl' \
              'RAW_M5_LEDGER/2020.jsonl' \
              'RAW_M5_LEDGER/2021.jsonl' \
              'RAW_M5_LEDGER/2022.jsonl' \
              -d "$ROOT"
          done

      - name: Run four-engine cooperation
        run: |
          set -euo pipefail
          python scripts/cibo_trader_lab_three_mode_ceiling.py \
            --manifest "$MANIFEST" \
            --baseline-replay "$BASELINE" \
            --historical-manifest "$HISTORICAL_MANIFEST" \
            --historical-replay "$HISTORICAL_REPLAY" \
            --four-engine-cooperation-frontier \
            --medium-multiplier-cap 4 \
            --output "$RUNNER_TEMP/result/cibo-four-engine-cooperation.json"

      - name: Run causal loss-containment frontier
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/result/cibo-four-engine-loss-cut-failures.tsv"
          for SPEC in \
            "s035d0:-0.20:-0.35:2:180:0.25:0:0.50:R43_GBPUSD,R34_XAUUSD,R38_GBPJPY,R42_AUDJPY" \
            "s045d0:-0.20:-0.45:2:180:0.25:0:0.50:R43_GBPUSD,R34_XAUUSD,R38_GBPJPY,R42_AUDJPY" \
            "s055d0:-0.20:-0.55:2:180:0.25:0:0.50:R43_GBPUSD,R34_XAUUSD,R38_GBPJPY,R42_AUDJPY" \
            "s035d10:-0.20:-0.35:2:180:0.25:0.10:0.50:R43_GBPUSD,R34_XAUUSD,R38_GBPJPY,R42_AUDJPY" \
            "s045d10:-0.20:-0.45:2:180:0.25:0.10:0.50:R43_GBPUSD,R34_XAUUSD,R38_GBPJPY,R42_AUDJPY" \
            "s055d10:-0.20:-0.55:2:180:0.25:0.10:0.50:R43_GBPUSD,R34_XAUUSD,R38_GBPJPY,R42_AUDJPY"; do
            IFS=':' read -r LABEL THRESHOLD SECOND_STAGE CONFIRMATIONS MAX_MINUTES MAX_FAVORABLE DD_ACTIVATION CLOSE_FRACTION TRADERS <<< "$SPEC"
            TRADER_ARGS=()
            IFS=',' read -ra TRADER_IDS <<< "$TRADERS"
            for TRADER_ID in "${TRADER_IDS[@]}"; do
              TRADER_ARGS+=(--lifecycle-adverse-loss-cut-trader-id "$TRADER_ID")
            done
            if python scripts/cibo_trader_lab_three_mode_ceiling.py \
              --manifest "$MANIFEST" \
              --baseline-replay "$BASELINE" \
              --historical-manifest "$HISTORICAL_MANIFEST" \
              --historical-replay "$HISTORICAL_REPLAY" \
              --four-engine-cooperation-frontier \
              --medium-multiplier-cap 4 \
              --lifecycle-source-root "AUDJPY=$RUNNER_TEMP/atlas/AUDJPY" \
              --lifecycle-source-root "EURUSD=$RUNNER_TEMP/atlas/EURUSD" \
              --lifecycle-source-root "GBPJPY=$RUNNER_TEMP/atlas/GBPJPY" \
              --lifecycle-source-root "GBPUSD=$RUNNER_TEMP/atlas/GBPUSD" \
              --lifecycle-source-root "NAS100=$RUNNER_TEMP/atlas/NAS100" \
              --lifecycle-source-root "XAUUSD=$RUNNER_TEMP/atlas/XAUUSD" \
              --lifecycle-feature ADVERSE_LOSS_CUT \
              --lifecycle-adverse-loss-cut-r "$THRESHOLD" \
              --lifecycle-adverse-loss-cut-second-stage-r "$SECOND_STAGE" \
              --lifecycle-adverse-loss-cut-confirmation-bars "$CONFIRMATIONS" \
              --lifecycle-adverse-loss-cut-max-elapsed-minutes "$MAX_MINUTES" \
              --lifecycle-adverse-loss-cut-max-favorable-r "$MAX_FAVORABLE" \
              --lifecycle-drawdown-activation-fraction "$DD_ACTIVATION" \
              --lifecycle-adverse-loss-cut-close-fraction "$CLOSE_FRACTION" \
              "${TRADER_ARGS[@]}" \
              --output "$RUNNER_TEMP/result/cibo-four-engine-loss-cut-${LABEL}.json" \
              > "$RUNNER_TEMP/result/cibo-four-engine-loss-cut-${LABEL}.log" 2>&1; then
              cat "$RUNNER_TEMP/result/cibo-four-engine-loss-cut-${LABEL}.log"
            else
              STATUS=$?
              cat "$RUNNER_TEMP/result/cibo-four-engine-loss-cut-${LABEL}.log"
              printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
                "$LABEL" "$THRESHOLD" "$SECOND_STAGE" "$CONFIRMATIONS" "$MAX_MINUTES" "$MAX_FAVORABLE" "$DD_ACTIVATION" "$CLOSE_FRACTION" "$TRADERS" "$STATUS" >> \
                "$RUNNER_TEMP/result/cibo-four-engine-loss-cut-failures.tsv"
            fi
          done

      - name: Enforce four-engine cooperation invariants
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from decimal import Decimal
          from pathlib import Path

          p = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "result"
                  / "cibo-four-engine-cooperation.json"
              ).read_text()
          )
          assert p["research_lane"] == (
              "HISTORICAL_PRIOR_NATIVE_FOUR_ENGINE_COOPERATION_FRONTIER"
          )
          assert p["decision_count"] == 3368
          assert p["trade_count"] == 3368
          assert p["trade_mode_counts"].get("MEDIUM", 0) == 3368
          assert p["trade_mode_counts"].get("ATTACK", 0) == 0
          assert p["governance"]["four_engine_cooperation_frontier"] is True
          assert p["governance"]["four_engine_portfolio_aligned_sizing"] is True
          assert p["governance"]["outcome_used_for_predecision"] is False
          assert Decimal(p["ending_total_capital_usd"]) > 0
          assert Decimal(
              p["cooperative_portfolio_sovereign_breach_usd"]
          ) == 0

          coop = p["four_engine_cooperation_report"]
          assert coop["enabled"] is True
          assert coop["joint_decision_count"] == 3368
          assert coop["sizing_above_one_count"] > 0
          assert coop["compound_growth_enabled_count"] > 0
          assert coop["portfolio_growth_enabled_count"] > 0
          assert coop["leverage_above_one_count"] > 0
          assert coop["all_entries_preserve_minimum_1x"] is True

          funnel = p["engineering_sensor_report"]["execution_funnel"]
          assert funnel["final_trade_count"] == 3368
          assert funnel["sizing_medium_rejected_count"] == 0
          assert funnel["sizing_medium_deferred_count"] == 0
          assert funnel[
              "compound_portfolio_withheld_before_execution_engine_count"
          ] == 0

          frontier = []
          for filename, threshold, second_stage, confirmations, max_minutes, max_favorable, dd_activation, close_fraction, traders in (
              ("cibo-four-engine-loss-cut-s035d0.json", "-0.20", "-0.35", 2, 180, "0.25", "0", "0.50", "R43_GBPUSD,R34_XAUUSD,R38_GBPJPY,R42_AUDJPY"),
              ("cibo-four-engine-loss-cut-s045d0.json", "-0.20", "-0.45", 2, 180, "0.25", "0", "0.50", "R43_GBPUSD,R34_XAUUSD,R38_GBPJPY,R42_AUDJPY"),
              ("cibo-four-engine-loss-cut-s055d0.json", "-0.20", "-0.55", 2, 180, "0.25", "0", "0.50", "R43_GBPUSD,R34_XAUUSD,R38_GBPJPY,R42_AUDJPY"),
              ("cibo-four-engine-loss-cut-s035d10.json", "-0.20", "-0.35", 2, 180, "0.25", "0.10", "0.50", "R43_GBPUSD,R34_XAUUSD,R38_GBPJPY,R42_AUDJPY"),
              ("cibo-four-engine-loss-cut-s045d10.json", "-0.20", "-0.45", 2, 180, "0.25", "0.10", "0.50", "R43_GBPUSD,R34_XAUUSD,R38_GBPJPY,R42_AUDJPY"),
              ("cibo-four-engine-loss-cut-s055d10.json", "-0.20", "-0.55", 2, 180, "0.25", "0.10", "0.50", "R43_GBPUSD,R34_XAUUSD,R38_GBPJPY,R42_AUDJPY"),
          ):             candidate_path = (
                  Path(os.environ["RUNNER_TEMP"]) / "result" / filename
              )
              if not candidate_path.exists():
                  frontier.append({
                      "threshold_r": threshold,
                      "confirmation_bars": confirmations,
                      "max_elapsed_minutes": max_minutes,
                      "max_favorable_r": max_favorable,
                      "drawdown_activation_fraction": dd_activation,
                      "close_fraction": close_fraction,
                      "status": "RUN_FAILED",
                  })
                  continue
              guarded = json.loads(candidate_path.read_text())
              assert guarded["decision_count"] == guarded["trade_count"] == 3368
              assert guarded["governance"]["four_engine_cooperation_frontier"] is True
              assert guarded["governance"]["position_lifecycle_consumed"] is True
              assert guarded["position_lifecycle_report"]["enabled_feature_codes"] == [
                  "ADVERSE_LOSS_CUT"
              ]
              assert guarded["position_lifecycle_report"]["adverse_loss_cut_r"] == threshold
              assert guarded["position_lifecycle_report"][
                  "adverse_loss_cut_confirmation_bars"
              ] == confirmations
              assert guarded["position_lifecycle_report"][
                  "adverse_loss_cut_max_elapsed_minutes"
              ] == max_minutes
              assert guarded["position_lifecycle_report"][
                  "adverse_loss_cut_max_favorable_r"
              ] == max_favorable
              assert guarded["position_lifecycle_report"][
                  "drawdown_activation_fraction"
              ] == dd_activation
              assert guarded["position_lifecycle_report"][
                  "adverse_loss_cut_close_fraction"
              ] == close_fraction
              assert guarded["position_lifecycle_report"][
                  "adverse_loss_cut_second_stage_r"
              ] == second_stage
              assert guarded["position_lifecycle_report"][
                  "adverse_loss_cut_trader_ids"
              ] == sorted(traders.split(","))
              assert guarded["position_lifecycle_report"]["outcome_used_for_trigger"] is False
              guarded_funnel = guarded["engineering_sensor_report"]["execution_funnel"]
              assert guarded_funnel["final_trade_count"] == 3368
              assert guarded_funnel["sizing_medium_rejected_count"] == 0
              assert guarded_funnel["sizing_medium_deferred_count"] == 0
              assert guarded_funnel["causal_conservation_check"] is True
              frontier.append({
                  "threshold_r": threshold,
                  "confirmation_bars": confirmations,
                  "max_elapsed_minutes": max_minutes,
                  "max_favorable_r": max_favorable,
                  "drawdown_activation_fraction": dd_activation,
                  "close_fraction": close_fraction,
                  "second_stage_r": second_stage,
                  "trader_ids": sorted(traders.split(",")),
                  "activated_entry_count": guarded["position_lifecycle_report"][
                      "activated_entry_count"
                  ],
                  "activated_changed_outcome_count": guarded[
                      "position_lifecycle_report"
                  ]["activated_changed_outcome_count"],
                  "status": "SUCCESS",
                  "ending_total_capital_usd": guarded["ending_total_capital_usd"],
                  "max_drawdown_fraction": guarded["max_drawdown_fraction"],
                  "changed_outcome_count": guarded["position_lifecycle_report"][
                      "changed_outcome_count"
                  ],
                  "action_counts": guarded["position_lifecycle_report"]["action_counts"],
              })

          print(json.dumps({
              "ending_total_capital_usd": p["ending_total_capital_usd"],
              "ending_sovereign_bank_usd": p["ending_sovereign_bank_usd"],
              "ending_portfolio_cushion_usd": p[
                  "ending_portfolio_cushion_usd"
              ],
              "max_drawdown_fraction": p["max_drawdown_fraction"],
              "maximum_selected_multiplier": p[
                  "maximum_selected_multiplier"
              ],
              "medium_compound_positive_net_usd": p[
                  "medium_compound_positive_net_usd"
              ],
              "medium_compound_negative_net_usd": p[
                  "medium_compound_negative_net_usd"
              ],
              "cooperative_portfolio_net_pnl_usd": p[
                  "cooperative_portfolio_net_pnl_usd"
              ],
              "cooperative_portfolio_turnover_usd": p[
                  "cooperative_portfolio_turnover_usd"
              ],
              "four_engine_cooperation_report": coop,
              "causal_loss_cut_frontier": frontier,
              "economic_bottleneck_ranking": p[
                  "engineering_sensor_report"
              ]["bottleneck_ranking"],
          }, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-cibo-four-engine-cooperation-${{ github.run_id }}
          path: ${{ runner.temp }}/result
          if-no-files-found: warn
          retention-days: 90
