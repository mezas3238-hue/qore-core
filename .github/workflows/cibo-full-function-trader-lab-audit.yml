name: QORE CIBO Full Function Trader Lab Audit

on:
  push:
    branches:
      - agent/cibo-profitability-lab-001
    paths:
      - '.github/workflows/cibo-full-function-trader-lab-audit.yml'
      - 'scripts/cibo_full_function_trader_lab_audit.py'
      - 'scripts/cibo_cognitive_trader_lab_audit.py'
      - 'src/qore/infrastructure/trader_lab/cibo_functional_receipt.py'
      - 'src/qore/infrastructure/cibo/**'
      - 'src/qore/governance/cibo/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  full-function-trader-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_ARTIFACT_ID: '11261743257'
      SOURCE_HEAD_SHA: 'bc7909f2f28fbfa1bef1b83768499a28f634409a'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Recover retained Trader Lab population
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" > "$RUNNER_TEMP/source.zip"
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/source"
          test -s "$RUNNER_TEMP/source/decision-trace.json"
      - name: Execute CF01 through CF20 sequentially
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/full-function-trader-lab"
          python scripts/cibo_full_function_trader_lab_audit.py             --decision-trace "$RUNNER_TEMP/source/decision-trace.json"             --source-head "$SOURCE_HEAD_SHA"             --output "$RUNNER_TEMP/full-function-trader-lab/audit.json"
      - name: Enforce 20 gates x 7 retained Trader lanes
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads((Path(os.environ['RUNNER_TEMP'])/'full-function-trader-lab'/'audit.json').read_text())
          assert p['candidate_count'] == 7
          assert p['function_gate_count'] == 20
          assert p['all_functions_pass'] is True
          assert p['next_stage_unlocked'] == 'CIBO_COMPOUND_TRADER_LAB'
          assert set(p['lanes']) == {
              'VT08_FOREX','R34_XAUUSD','R38_EURUSD','R43_GBPUSD',
              'R38_GBPJPY','R42_AUDJPY','VT31_NAS100'
          }
          for lane in p['lanes'].values():
              assert lane['status'] == 'PASS'
              assert lane['gate_count'] == 20
              assert all(g['status'] == 'PASS' for g in lane['gates'])
              assert all(g['broker_mutation'] is False for g in lane['gates'])
              assert all(g['live'] is False for g in lane['gates'])
              assert all(g['production'] is False for g in lane['gates'])
              assert all(g['real_capital'] is False for g in lane['gates'])
          PY
      - name: Revalidate Trader Lab authority contract
        run: pytest -q --no-cov tests/infrastructure/trader_lab/test_cibo_functional_receipt.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-cibo-full-function-trader-lab-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/full-function-trader-lab
          if-no-files-found: warn
          retention-days: 90
