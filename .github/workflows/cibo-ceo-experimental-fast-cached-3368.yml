name: CIBO CEO FAST 3368 Native Receipts -> 4 Motors -> QDLE RESEARCH
on:
  workflow_dispatch:
  push:
    branches:
      - agent/cibo-sovereign-integration-p0-20261008
    paths:
      - ".github/workflows/cibo-ceo-experimental-fast-cached-3368.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: cibo-ceo-fast-3368-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONPATH: src
  GH_SOURCE_SIGNALS_ARTIFACT: "11451743578"
  GH_SOURCE_SIGNALS_DIGEST: "d439957f21e2f79148b5a2fb75a53db6fa448698f17aeb6978f379ed3547f7ea"
  NATIVE_PREVIOUS_PROVEN_REPLAY_ARTIFACT: "11588089131"
  NATIVE_PREVIOUS_PROVEN_REPLAY_DIGEST: "eebf6de43da63aadc200a3783109246188d46e0fcdd7da127f07eff815d6cec6"
  NATIVE_SOURCE_CODE_SHA: "55b6242c1cb0587bbc74a7becf65636e0a0b5fa0"
  QORE_LIVE_TRADING: "false"
jobs:
  fast-ceo-offline-physical-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CEO OFFLINE only; preserve real errors and source provenance
        run: |
          test "$QORE_LIVE_TRADING" = false
          python -m py_compile scripts/qdle_3368_dual_ledger_replay.py scripts/cibo_ceo_experimental_replay_audit.py
          echo "CEO_EXPERIMENT_RESEARCH_ONLY; Historic Native source code SHA=$NATIVE_SOURCE_CODE_SHA"
      - name: Restore exact original opportunities and previously completed Native cognitive result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ceo-fast"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$GH_SOURCE_SIGNALS_ARTIFACT/zip" > "$RUNNER_TEMP/ceo-fast/signals.zip"
          echo "$GH_SOURCE_SIGNALS_DIGEST  $RUNNER_TEMP/ceo-fast/signals.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ceo-fast/signals.zip" walk-forward-manifest.json -d "$RUNNER_TEMP/ceo-fast"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$NATIVE_PREVIOUS_PROVEN_REPLAY_ARTIFACT/zip" > "$RUNNER_TEMP/ceo-fast/native.zip"
          echo "$NATIVE_PREVIOUS_PROVEN_REPLAY_DIGEST  $RUNNER_TEMP/ceo-fast/native.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ceo-fast/native.zip" cibo-native-baseline.json -d "$RUNNER_TEMP/ceo-fast"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'ceo-fast'
          manifest=json.loads((p/'walk-forward-manifest.json').read_text())
          native=json.loads((p/'cibo-native-baseline.json').read_text())
          assert len(manifest['opportunities'])==3368
          assert len(native['decision_receipts'])==3368
          assert native['governance']['certification_claimed'] is False
          print("PINNED_SEALED_NATIVE_AUTHORIZATIONS", sum(float(x['authorized_volume'])>0 for x in native['decision_receipts']))
          PY
      - name: Reproduce full QDLE 4-motor physical research without native selection baseline
        run: |
          python scripts/qdle_3368_dual_ledger_replay.py \
            --manifest "$RUNNER_TEMP/ceo-fast/walk-forward-manifest.json" \
            --motor-policy independent_four_motors \
            --min-policy broker_grid \
            --ndx-roundtrip-fee-proxy-usd-per-lot 20 \
            --provider-trailing-usd disabled --swap-proxy off \
            --output "$RUNNER_TEMP/ceo-fast/qdle-four-motors-independent.json"
      - name: Apply 3368 sealed Native CIBO causal approvals to four economic motors and QDLE physical lot reservation
        run: |
          python scripts/qdle_3368_dual_ledger_replay.py \
            --manifest "$RUNNER_TEMP/ceo-fast/walk-forward-manifest.json" \
            --motor-policy independent_four_motors \
            --experimental-native-ceiling-report "$RUNNER_TEMP/ceo-fast/cibo-native-baseline.json" \
            --experimental-native-lane-policy all_bank \
            --min-policy broker_grid \
            --ndx-roundtrip-fee-proxy-usd-per-lot 20 \
            --provider-trailing-usd disabled --swap-proxy off \
            --output "$RUNNER_TEMP/ceo-fast/cibo-native-4motor-qdle-joint-research.json"
      - name: Full matched signal, PnL/fees/capital/DD audit with labelled hypothetical management
        run: |
          python scripts/cibo_ceo_experimental_replay_audit.py \
            --manifest "$RUNNER_TEMP/ceo-fast/walk-forward-manifest.json" \
            --native "$RUNNER_TEMP/ceo-fast/cibo-native-baseline.json" \
            --qdle "$RUNNER_TEMP/ceo-fast/qdle-four-motors-independent.json" \
            --joined "$RUNNER_TEMP/ceo-fast/cibo-native-4motor-qdle-joint-research.json" \
            --output "$RUNNER_TEMP/ceo-fast/ceo-fast-comparative-report.json"
          python - <<'PY'
          import json,os,pathlib
          r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'ceo-fast'/'ceo-fast-comparative-report.json').read_text())
          assert r['paired_unique_signal_count']==3368
          assert r['native_cibo_4motor_qdle_joint_research_projection']['broker_fills']==0
          assert r['native_and_qdle_pnl_are_not_economically_comparable']
          print('CE0_FAST_RESEARCH_FINAL',json.dumps(r['native_cibo_4motor_qdle_joint_research_projection'],sort_keys=True))
          PY
      - name: Upload complete research evidence, no fake MT5 deals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cibo-ceo-fast-native-fourmotor-qdle-3368-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ceo-fast/ceo-fast-comparative-report.json
            ${{ runner.temp }}/ceo-fast/cibo-native-4motor-qdle-joint-research.json
            ${{ runner.temp }}/ceo-fast/qdle-four-motors-independent.json
          if-no-files-found: warn
