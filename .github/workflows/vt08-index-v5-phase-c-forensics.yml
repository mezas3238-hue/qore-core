name: VT08 Index V5 Phase C Regime Forensics

on:
  push:
    branches: [agent/vt08-index-v5-phase-b-ideal-formation-001]
    paths:
      - .github/workflows/vt08-index-v5-phase-c-forensics.yml
      - src/qore/infrastructure/trader_lab/vt08_index_v5_phase_c_regime_forensics.py
      - tests/infrastructure/trader_lab/test_vt08_index_v5_phase_c_regime_forensics.py
      - docs/research/VT08-INDEX-V5-PHASE-C-REGIME-FORENSICS-PREREGISTRATION-001.md

permissions:
  actions: read
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_v5_phase_c_regime_forensics.py
      - name: Full QORE gate
        run: pytest --cov=src/qore --cov-report=term-missing
  forensics:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - name: Download frozen V4 census
        uses: actions/download-artifact@v4
        with:
          name: qore-vt08-index-v4-root-cause-forensics-27d4742cda6f691b359d106c2b6fe8eb2b044fc4
          path: artifacts/v4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34805546975
      - name: Execute Phase C regime forensics
        run: |
          mkdir -p artifacts/v5-phase-c
          python -m qore.infrastructure.trader_lab.vt08_index_v5_phase_c_regime_forensics --census-csv artifacts/v4/vt08-index-v4-regime-feature-census.csv --output-json artifacts/v5-phase-c/vt08-index-v5-phase-c-regime-forensics.json
          printf '%s\n' "$GITHUB_SHA" > artifacts/v5-phase-c/git-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-index-v5-phase-c-${{ github.sha }}
          path: artifacts/v5-phase-c
          if-no-files-found: error
          retention-days: 90
