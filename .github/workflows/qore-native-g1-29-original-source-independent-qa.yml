name: QORE Native G1 real 29 original BID ASK SHA UTC asof second-auditor

on:
  push:
    branches:
      - research/qore-native-g1-29-source-independent-qa-20261012
    paths:
      - '.github/workflows/qore-native-g1-29-original-source-independent-qa.yml'
      - 'src/qore/infrastructure/trader_lab/qore_native_g1_remaining29_independent_qa_v1.py'
      - 'tests/infrastructure/trader_lab/test_qore_native_g1_remaining29_independent_qa_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source29_independent_sha_asof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research-only lightweight QA
        run: python -m pip install -e '.[dev]'
      - name: Run synthetic negative source custody and causal tests
        run: |
          set -euo pipefail
          ruff check --select F,E4,E7,E9 src/qore/infrastructure/trader_lab/qore_native_g1_remaining29_independent_qa_v1.py tests/infrastructure/trader_lab/test_qore_native_g1_remaining29_independent_qa_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_qore_native_g1_remaining29_independent_qa_v1.py
      - name: Verify GitHub immutable artifact HEAD ID and ZIP digest metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          from qore.infrastructure.trader_lab.qore_native_g1_remaining29_independent_qa_v1 import (
              ORIGINAL_RUN,ORIGINAL_HEAD,ORIGINAL_ARTIFACT_ID,ORIGINAL_ZIP_SHA256,
          )
          url="https://api.github.com/repos/mezas3238-hue/qore-core/actions/artifacts/"+str(ORIGINAL_ARTIFACT_ID)
          request=urllib.request.Request(url,headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
          })
          with urllib.request.urlopen(request, timeout=15) as r: data=json.load(r)
          assert data["id"]==ORIGINAL_ARTIFACT_ID and data["expired"] is False
          assert data["digest"]=="sha256:"+ORIGINAL_ZIP_SHA256
          assert data["workflow_run"]["id"]==ORIGINAL_RUN
          assert data["workflow_run"]["head_sha"]==ORIGINAL_HEAD
          print("G1_ORIGINAL_29_SOURCE_CUSTODY_METADATA_PASS")
          PY
      - name: Restore exact original source29 ZIP from earlier successful code
        uses: actions/download-artifact@v4
        with:
          name: qore-native-G1-29-remaining-BID-ASK-source-NOT-NET-f8262bd7cdea1fbfb2287c3c1fe0dae3be2b0efc
          run-id: '38283737706'
          github-token: ${{ github.token }}
          path: original-source
      - name: Verify all 29 manifests 377 SHAs 111451 integer ticks and causal quality
        run: |
          set -euo pipefail
          python -m qore.infrastructure.trader_lab.qore_native_g1_remaining29_independent_qa_v1 original-source original-source-audit
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("original-source-audit/source-29-independent-QA-NOT-NET.json")
          r=json.loads(p.read_text())
          assert r["status"]=="REAL_29_SOURCE_SHA_ASOF_PASS_NO_NET"
          assert r["source_market_manifests_verified"]==29
          assert r["source_market_files_sha_verified"]==377
          assert r["new_bid_ticks"]==55154 and r["new_ask_ticks"]==56297
          assert r["new_native_ticks"]==111451
          quality=r["asof_source_quality_totals"]
          assert quality["zero_spread"]>=0 and quality["crossed_spread"]>=0
          assert sum(quality.values())>0
          assert not r["historical_NET_authorized"]
          assert not r["broker_native_protobuf_independently_archived"]
          assert r["certified_traders"]==0
          print("G1_REAL_29_NATIVE_SOURCE_SHA_ASOF_PASS_WITH_SPREAD_QUARANTINE; NO NET")
          PY
          printf '%s\n' "$GITHUB_SHA" > original-source-audit/auditor-head-sha.txt
          (cd original-source-audit && sha256sum source-29-independent-QA-NOT-NET.json auditor-head-sha.txt > AUDIT_REPORT_SHA256SUMS.txt)
      - name: Publish source QA summary only no raw provider quotes
        uses: actions/upload-artifact@v4
        with:
          name: qore-native-G1-29-independent-source-QA-NOT-NET-${{ github.sha }}
          path: original-source-audit/
          retention-days: 90
          if-no-files-found: error
