name: QORE Capitalizer OB Penetration Intelligence V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-ob-penetration-intelligence-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_ob_penetration_intelligence_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_ob_penetration_intelligence_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-ob-penetration-intelligence-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'
  SOURCE_5Y_RUN_ID: '35548659988'
  SOURCE_5Y_SHA: 'e7cc3ed4497cb5e51303de374d7e3c6eedaebcdd'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_ob_penetration_intelligence_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_ob_penetration_intelligence_v1.py
      - name: Mypy
        run: |
          mypy src/qore/infrastructure/trader_lab/capitalizer_ob_penetration_intelligence_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_ob_penetration_intelligence_v1.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {symbol: USDJPY, session: ASIA}
          - {symbol: AUDJPY, session: ASIA}
          - {symbol: AUDUSD, session: ASIA}
          - {symbol: GBPJPY, session: ASIA}
          - {symbol: EURUSD, session: LONDON}
          - {symbol: GBPUSD, session: LONDON}
          - {symbol: XAUUSD, session: NEW_YORK}
          - {symbol: USDCAD, session: NEW_YORK}
          - {symbol: NAS100, session: NEW_YORK}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install -e .
      - name: Download immutable native-M1 clone
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Download consumed 5Y native-M1 replay
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-5y-holdout-replay-${{ matrix.symbol }}-${{ env.SOURCE_5Y_SHA }}
          path: replay-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_5Y_RUN_ID }}
      - name: Measure Order Block penetration paths
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_ob_penetration_intelligence_v1 \
            market replay-source m1-source penetration-output
      - name: Enforce penetration governance
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
          EXPECTED_SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"]
          path = Path("penetration-output") / (
              f"capitalizer-{symbol.lower()}-ob-penetration-intelligence-v1.json"
          )
          report = json.loads(path.read_text())
          assert report["identity"] == "QORE_CAPITALIZER_OB_PENETRATION_INTELLIGENCE_V1"
          assert report["symbol"] == symbol
          assert report["session"] == os.environ["EXPECTED_SESSION"]
          assert report["source_trade_count"] > 0
          assert report["broker_historical_tick_size_present"] is False
          assert report["provider_quote_increment_definition"] == "10^-digits"
          assert report["buffer_authorized"] is False
          assert report["entry_failure_proven"] is False
          assert report["outcome_used_for_entry_selection"] is False
          assert report["methodology_changed"] is False
          assert report["entry_changed"] is False
          assert report["target_changed"] is False
          assert report["fresh_holdout_claimed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["economic_candidate"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - name: Upload penetration intelligence
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-ob-penetration-${{ matrix.symbol }}-${{ github.sha }}
          path: penetration-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install -e .
      - name: Download nine penetration dossiers
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-ob-penetration-*-${{ github.sha }}
          path: penetration-input
          merge-multiple: false
      - name: Build nine-market penetration matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_ob_penetration_intelligence_v1 \
            matrix penetration-input matrix-output
      - name: Enforce nine-market boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "matrix-output/capitalizer-nine-market-ob-penetration-matrix-v1.json"
              ).read_text()
          )
          assert report["identity"] == "QORE_CAPITALIZER_NINE_MARKET_OB_PENETRATION_MATRIX_V1"
          assert report["market_count"] == 9
          assert report["source_trade_count"] == 10991
          assert report["broker_historical_tick_size_present"] is False
          assert report["buffer_authorized"] is False
          assert report["entry_failure_proven"] is False
          assert report["outcome_used_for_entry_selection"] is False
          assert report["methodology_changed"] is False
          assert report["entry_changed"] is False
          assert report["target_changed"] is False
          assert report["fresh_holdout_claimed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["economic_candidate"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - name: Upload nine-market penetration matrix
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-nine-market-ob-penetration-v1-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
