name: QORE Trader Lab First Cohort Backtest

on:
  push:
    branches:
      - agent/qore-demo-first-execution-vertical-cert-001
    paths:
      - .github/workflows/trader-lab-first-cohort-backtest.yml
      - src/qore/infrastructure/trader_lab/first_cohort_backtest.py
      - src/qore/infrastructure/trader_lab/first_cohort_walk_forward.py
      - src/qore/infrastructure/trader_lab/first_cohort_multi_pair_walk_forward.py
      - src/qore/infrastructure/trader_lab/first_cohort_characterization.py
      - src/qore/infrastructure/trader_lab/first_cohort_characterization_aggregate.py
      - src/qore/infrastructure/trader_lab/first_cohort_failure_analysis.py
      - src/qore/infrastructure/trader_lab/first_cohort_failure_analysis_aggregate.py
      - src/qore/infrastructure/trader_lab/first_cohort_hypothesis_register.py
      - src/qore/infrastructure/trader_lab/first_cohort_research_dossiers.py
      - src/qore/infrastructure/traders/evaluators.py
      - src/qore/infrastructure/traders/instrument_binding.py
      - src/qore/infrastructure/traders/primitives.py
      - src/qore/infrastructure/ctrader_demo_lab_probe.py
      - src/qore/infrastructure/ctrader_demo_lab_long_horizon_probe.py
      - src/qore/infrastructure/ctrader_demo_account_discovery.py
      - src/qore/infrastructure/ctrader_open_api_client.py

concurrency:
  group: qore-trader-lab-first-cohort-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
  QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}
  QORE_DEMO_LAB_LOOKBACK_DAYS: "760"
  QORE_SOFTWARE_SHA: ${{ github.sha }}

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        symbol:
          - EURUSD
          - GBPUSD
          - USDJPY
          - AUDUSD
          - USDCAD
          - XAUUSD
    env:
      QORE_DEMO_LAB_SYMBOL: ${{ matrix.symbol }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QORE and cTrader runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ctrader]"
      - name: Verify required DEMO inputs without printing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            QORE_CTRADER_CLIENT_ID \
            QORE_CTRADER_CLIENT_SECRET \
            QORE_CTRADER_ACCESS_TOKEN \
            QORE_CTRADER_REFRESH_TOKEN \
            QORE_DEMO_LAB_SYMBOL
          do
            if [ -z "${!name:-}" ]; then
              echo "missing required DEMO runtime input: ${name}" >&2
              exit 2
            fi
          done
          if [ "${QORE_DEMO_LAB_LOOKBACK_DAYS}" -le 730 ]; then
            echo "Trader Lab acquisition requires margin beyond 730 effective days" >&2
            exit 2
          fi
      - name: Discover the single authorized DEMO account when not configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            if ! [[ "$account_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "cTrader DEMO account discovery returned an invalid id" >&2
              exit 3
            fi
            echo "::add-mask::$account_id"
            printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          fi
      - name: Collect two-year read-only cTrader DEMO market evidence
        run: |
          mkdir -p "artifacts/first-cohort-backtest/${QORE_DEMO_LAB_SYMBOL}"
          python -m qore.infrastructure.ctrader_demo_lab_long_horizon_probe \
            > "artifacts/first-cohort-backtest/${QORE_DEMO_LAB_SYMBOL}/market-evidence.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["QORE_DEMO_LAB_SYMBOL"]
          payload = json.loads(
              Path(
                  f"artifacts/first-cohort-backtest/{symbol}/market-evidence.json"
              ).read_text()
          )
          assert payload["environment"] == "demo"
          assert payload["read_only"] is True
          assert payload["account_is_live"] is False
          assert payload["symbol"]["symbol_name"] == symbol
          assert payload["requested_lookback_days"] > 730
          assert payload["required_coverage_days"] == 730
          assert payload["acquisition_margin_days"] >= 1
          assert payload["software_sha"] == os.environ["GITHUB_SHA"]
          assert payload["historical_chunk_days"] == 14
          assert payload["historical_page_count"] == 5000
          assert payload["two_year_required_periods"] == ["M5", "M15", "H4"]
          assert payload["auxiliary_m1_lookback_days"] == 30
          assert set(payload["periods"]) == {"M1", "M5", "M15", "H4"}
          assert all(payload["periods"][period] for period in ("M5", "M15", "H4"))
          coverage = payload["coverage"]
          assert all(
              coverage[period]["span_seconds"] >= 730 * 24 * 60 * 60
              for period in ("M5", "M15", "H4")
          )
          PY
      - name: Backtest VT-01 VT-08 VT-09 VT-17 VT-31
        run: |
          python -m qore.infrastructure.trader_lab.first_cohort_backtest \
            "artifacts/first-cohort-backtest/${QORE_DEMO_LAB_SYMBOL}/market-evidence.json" \
            > "artifacts/first-cohort-backtest/${QORE_DEMO_LAB_SYMBOL}/backtest.json"
          printf '%s\n' "$GITHUB_SHA" \
            > "artifacts/first-cohort-backtest/${QORE_DEMO_LAB_SYMBOL}/git-sha.txt"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["QORE_DEMO_LAB_SYMBOL"]
          payload = json.loads(
              Path(
                  f"artifacts/first-cohort-backtest/{symbol}/backtest.json"
              ).read_text()
          )
          assert payload["environment"] == "demo"
          assert payload["read_only"] is True
          assert payload["symbol"] == symbol
          assert payload["execution_model"] == (
              "limit-3bar-fill-24bar-hold-stop-first-v1"
          )
          assert payload["software_sha"] == os.environ["GITHUB_SHA"]
          assert [item["trader_code"] for item in payload["results"]] == [
              "vt-01", "vt-08", "vt-09", "vt-17", "vt-31"
          ]
          assert all(item["sample_size"] >= 0 for item in payload["results"])
          PY
      - name: Walk-forward screen and untouched OOS validation
        run: |
          python -m qore.infrastructure.trader_lab.first_cohort_walk_forward \
            "artifacts/first-cohort-backtest/${QORE_DEMO_LAB_SYMBOL}/market-evidence.json" \
            > "artifacts/first-cohort-backtest/${QORE_DEMO_LAB_SYMBOL}/walk-forward.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["QORE_DEMO_LAB_SYMBOL"]
          payload = json.loads(
              Path(
                  f"artifacts/first-cohort-backtest/{symbol}/walk-forward.json"
              ).read_text()
          )
          assert payload["schema"] == "qore.trader_lab.first_cohort_walk_forward.v2"
          assert payload["environment"] == "demo"
          assert payload["read_only"] is True
          assert payload["symbol"] == symbol
          assert payload["software_sha"] == os.environ["GITHUB_SHA"]
          assert payload["in_sample_fraction"] == "0.70"
          assert payload["oos_fraction"] == "0.30"
          assert [item["trader_code"] for item in payload["results"]] == [
              "vt-01", "vt-08", "vt-09", "vt-17", "vt-31"
          ]
          assert all(
              len(item["assessments"]) == item["assessed_configurations"]
              for item in payload["results"]
          )
          PY
      - name: Generate deterministic deep Trader characterization
        run: |
          python -m qore.infrastructure.trader_lab.first_cohort_characterization \
            "artifacts/first-cohort-backtest/${QORE_DEMO_LAB_SYMBOL}/market-evidence.json" \
            "artifacts/first-cohort-backtest/${QORE_DEMO_LAB_SYMBOL}/walk-forward.json" \
            > "artifacts/first-cohort-backtest/${QORE_DEMO_LAB_SYMBOL}/characterization.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["QORE_DEMO_LAB_SYMBOL"]
          payload = json.loads(
              Path(
                  f"artifacts/first-cohort-backtest/{symbol}/characterization.json"
              ).read_text()
          )
          assert payload["environment"] == "demo"
          assert payload["read_only"] is True
          assert payload["symbol"] == symbol
          assert payload["software_sha"] == os.environ["GITHUB_SHA"]
          assert payload["holdout_governance"]["state"] == "consumed_for_research"
          assert [item["trader_code"] for item in payload["results"]] == [
              "vt-01", "vt-08", "vt-09", "vt-17", "vt-31"
          ]
          assert all(item["profiles"] for item in payload["results"])
          PY
      - name: Generate deterministic per-Trader failure analysis
        run: |
          python -m qore.infrastructure.trader_lab.first_cohort_failure_analysis \
            "artifacts/first-cohort-backtest/${QORE_DEMO_LAB_SYMBOL}/backtest.json" \
            "artifacts/first-cohort-backtest/${QORE_DEMO_LAB_SYMBOL}/walk-forward.json" \
            > "artifacts/first-cohort-backtest/${QORE_DEMO_LAB_SYMBOL}/failure-analysis.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["QORE_DEMO_LAB_SYMBOL"]
          payload = json.loads(
              Path(
                  f"artifacts/first-cohort-backtest/{symbol}/failure-analysis.json"
              ).read_text()
          )
          assert payload["schema"] == "qore.trader_lab.first_cohort_failure_analysis.v1"
          assert payload["environment"] == "demo"
          assert payload["read_only"] is True
          assert payload["research_only"] is True
          assert payload["symbol"] == symbol
          assert payload["software_sha"] == os.environ["GITHUB_SHA"]
          governance = payload["holdout_governance"]
          assert governance["post_change_reuse_as_independent_holdout_prohibited"] is True
          assert governance["new_previously_unseen_holdout_required_after_any_hypothesis_change"] is True
          assert [item["trader_code"] for item in payload["results"]] == [
              "vt-01", "vt-08", "vt-09", "vt-17", "vt-31"
          ]
          PY
      - name: Upload sanitized per-instrument research evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-first-cohort-${{ matrix.symbol }}-${{ github.sha }}
          path: artifacts/first-cohort-backtest/${{ matrix.symbol }}
          if-no-files-found: error
          retention-days: 30

  multi-pair:
    needs: backtest
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QORE research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Download all six per-instrument artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: qore-first-cohort-*-${{ github.sha }}
          path: artifacts/multi-pair
      - name: Run pooled six-instrument walk-forward and untouched OOS screen
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t evidence < <(
            find artifacts/multi-pair -name market-evidence.json -type f | sort
          )
          if [ "${#evidence[@]}" -ne 6 ]; then
            echo "expected exactly six market-evidence files" >&2
            exit 4
          fi
          mkdir -p artifacts/first-cohort-multi-pair
          python -m qore.infrastructure.trader_lab.first_cohort_multi_pair_walk_forward \
            "${evidence[@]}" \
            > artifacts/first-cohort-multi-pair/multi-pair-walk-forward.json
          printf '%s\n' "$GITHUB_SHA" \
            > artifacts/first-cohort-multi-pair/git-sha.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path("artifacts/first-cohort-multi-pair/multi-pair-walk-forward.json").read_text()
          )
          assert payload["environment"] == "demo"
          assert payload["read_only"] is True
          assert payload["pair_count"] == 6
          assert payload["software_sha"] == os.environ["GITHUB_SHA"]
          assert payload["symbols"] == [
              "AUDUSD", "EURUSD", "GBPUSD", "USDCAD", "USDJPY", "XAUUSD"
          ]
          assert [item["trader_code"] for item in payload["results"]] == [
              "vt-01", "vt-08", "vt-09", "vt-17", "vt-31"
          ]
          assert 0 <= payload["robust_candidate_count"] <= 5
          PY
      - name: Aggregate six-instrument characterization
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t characterizations < <(
            find artifacts/multi-pair -name characterization.json -type f | sort
          )
          if [ "${#characterizations[@]}" -ne 6 ]; then
            echo "expected exactly six characterization files" >&2
            exit 5
          fi
          python -m \
            qore.infrastructure.trader_lab.first_cohort_characterization_aggregate \
            "${characterizations[@]}" \
            > artifacts/first-cohort-multi-pair/characterization-aggregate.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path("artifacts/first-cohort-multi-pair/characterization-aggregate.json").read_text()
          )
          assert payload["software_sha"] == os.environ["GITHUB_SHA"]
          assert payload["instrument_count"] == 6
          assert [item["trader_code"] for item in payload["results"]] == [
              "vt-01", "vt-08", "vt-09", "vt-17", "vt-31"
          ]
          PY
      - name: Aggregate six-instrument failure analysis
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t analyses < <(
            find artifacts/multi-pair -name failure-analysis.json -type f | sort
          )
          if [ "${#analyses[@]}" -ne 6 ]; then
            echo "expected exactly six failure-analysis files" >&2
            exit 5
          fi
          python -m qore.infrastructure.trader_lab.first_cohort_failure_analysis_aggregate \
            artifacts/first-cohort-multi-pair/multi-pair-walk-forward.json \
            "${analyses[@]}" \
            > artifacts/first-cohort-multi-pair/failure-analysis-aggregate.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path("artifacts/first-cohort-multi-pair/failure-analysis-aggregate.json").read_text()
          )
          assert payload["schema"] == (
              "qore.trader_lab.first_cohort_failure_analysis_aggregate.v1"
          )
          assert payload["instrument_count"] == 6
          assert payload["software_sha"] == os.environ["GITHUB_SHA"]
          assert [item["trader_code"] for item in payload["results"]] == [
              "vt-01", "vt-08", "vt-09", "vt-17", "vt-31"
          ]
          assert payload["holdout_governance"][
              "new_previously_unseen_holdout_required_after_any_hypothesis_change"
          ] is True
          PY
      - name: Build governed hypothesis register
        run: |
          python -m qore.infrastructure.trader_lab.first_cohort_hypothesis_register \
            artifacts/first-cohort-multi-pair/failure-analysis-aggregate.json \
            artifacts/first-cohort-multi-pair/characterization-aggregate.json \
            artifacts/first-cohort-multi-pair/multi-pair-walk-forward.json \
            "$GITHUB_SHA" \
            > artifacts/first-cohort-multi-pair/hypothesis-register.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path("artifacts/first-cohort-multi-pair/hypothesis-register.json").read_text()
          )
          assert payload["environment"] == "demo"
          assert payload["holdout_governance"][
              "consumed_holdout_cannot_certify_modified_strategy"
          ] is True
          assert payload["software_sha"] == os.environ["GITHUB_SHA"]
          PY
      - name: Build five final dossiers and governed comparative registers
        run: |
          python -m qore.infrastructure.trader_lab.first_cohort_research_dossiers \
            artifacts/multi-pair \
            artifacts/first-cohort-multi-pair \
            artifacts/first-cohort-multi-pair \
            "$GITHUB_SHA"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/first-cohort-multi-pair")
          codes = ("vt-01", "vt-08", "vt-09", "vt-17", "vt-31")
          for code in codes:
              dossier = json.loads(
                  (root / f"{code}-deep-characterization-dossier.json").read_text()
              )
              assert dossier["trader_code"] == code
              assert dossier["software_sha"] == os.environ["GITHUB_SHA"]
              assert dossier["promotion"]["demo_eligible"] is False
              assert dossier["holdout_governance"][
                  "consumed_holdout_cannot_certify_modified_strategy"
              ] is True
          comparative = json.loads(
              (root / "first-cohort-comparative-deep-characterization-report.json").read_text()
          )
          assert comparative["five_dossiers_complete"] is True
          promotion = json.loads((root / "promotion-report.json").read_text())
          assert promotion["demo_eligible_count"] == 0
          assert promotion["software_sha"] == os.environ["GITHUB_SHA"]
          PY
      - name: Upload pooled six-instrument research evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-first-cohort-multi-pair-${{ github.sha }}
          path: artifacts/first-cohort-multi-pair
          if-no-files-found: error
          retention-days: 30
