name: QORE Capitalizer Entry Pathway Edge V44

on:
  push:
    branches:
      - agent/capitalizer-entry-pathway-edge-v44-001
    paths:
      - '.github/workflows/qore-capitalizer-entry-pathway-edge-v44.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_entry_pathway_edge_attribution_v44.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_entry_pathway_edge_attribution_v44.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-entry-pathway-edge-v44-${{ github.ref }}
  cancel-in-progress: true

env:
  V21_RUN_ID: '36264229554'
  V21_ARTIFACT_SHA: '05452328bbf5cbbc4b26210791d13114105e3f9d'
  V38_RUN_ID: '36495104604'
  V38_SELECTED_ARTIFACT: 'qore-capitalizer-v38-geometry-selected-resume-3aa4ee3c181c1fe10fce087b904e6e797770a87d'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_entry_pathway_edge_attribution_v44.py \
            tests/infrastructure/trader_lab/test_capitalizer_entry_pathway_edge_attribution_v44.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_entry_pathway_edge_attribution_v44.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_entry_pathway_edge_attribution_v44.py

  audit:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download reconstructed consumed evidence
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v21-reconstructed-*-${{ env.V21_ARTIFACT_SHA }}
          path: reconstructed
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ env.V21_RUN_ID }}
      - name: Download exact selected V38 provenance ledger
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V38_SELECTED_ARTIFACT }}
          path: selected-geometry
          github-token: ${{ github.token }}
          run-id: ${{ env.V38_RUN_ID }}
      - name: Run V44 entry-pathway attribution
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_entry_pathway_edge_attribution_v44 \
            --development-root reconstructed/development-input \
            --validation-root reconstructed/validation-input \
            --reserved-root reconstructed/reserved-input \
            --selected-geometry-root selected-geometry \
            --output audit-output
      - name: Enforce frozen V44 governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(
              Path(
                  "audit-output/"
                  "capitalizer-entry-pathway-edge-attribution-v44.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_ENTRY_PATHWAY_EDGE_ATTRIBUTION_V44"
          )
          assert report["predeclaration_comment_id"] == 5882972050
          assert report["population_counts"] == {
              "development": 948,
              "validation": 1034,
              "reserved": 1088,
          }
          assert report["sample_law"] == {
              "min_trades": 30,
              "min_wins": 10,
              "min_losses": 10,
          }
          for row in report["period_coverage"].values():
              assert row["coverage"] == "1"
              assert row["missing"] == 0
              assert row["extra"] == 0
          assert report["pathway_filtering_authorized"] is False
          assert report["classifier_used"] is False
          assert report["threshold_grid_searched"] is False
          assert report["symbol_conditioned_policy"] is False
          assert report["session_conditioned_policy"] is False
          assert report["date_conditioned_policy"] is False
          assert report["admission_changed"] is False
          assert report["density_changed"] is False
          assert report["sizing_changed"] is False
          assert report["protection_changed"] is False
          assert report["stop_target_changed"] is False
          assert report["fresh_holdout_opened"] is False
          assert report["runtime_policy_candidate"] is False
          assert report["candidate_count"] == 0
          assert report["trader_certified"] is False
          print(json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-entry-pathway-edge-v44-${{ github.sha }}
          path: audit-output
          if-no-files-found: error
          retention-days: 90
