name: QORE CIBO Architect A2 Scientific Closure

on:
  push:
    branches:
      - agent/cibo-architect-a2-capital-science-001
    paths:
      - '.github/workflows/cibo-architect-a2-scientific-closure.yml'
      - 'src/qore/infrastructure/cibo_arch_a2_scientific_closure.py'
      - 'tests/infrastructure/test_cibo_arch_a2_scientific_closure.py'
  pull_request:
    paths:
      - '.github/workflows/cibo-architect-a2-scientific-closure.yml'
      - 'src/qore/infrastructure/cibo_arch_a2_scientific_closure.py'
      - 'tests/infrastructure/test_cibo_arch_a2_scientific_closure.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a2-scientific-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Prove A2 ownership and closure packet
        run: |
          ruff check \
            src/qore/infrastructure/cibo_arch_a2_scientific_closure.py \
            tests/infrastructure/test_cibo_arch_a2_scientific_closure.py
          mypy src/qore/infrastructure/cibo_arch_a2_scientific_closure.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_arch_a2_scientific_closure.py
