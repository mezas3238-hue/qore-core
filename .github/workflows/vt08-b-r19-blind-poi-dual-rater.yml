name: VT08 B R19 Blind Dual-Rater POI Review Queue
on:
  workflow_dispatch:
  push:
    branches: [agent/vt08-5m-cognition-replay-20261010]
    paths:
      - src/qore/infrastructure/trader_lab/vt08_b_r19_blind_dual_rater_poi_queue_v1.py
      - tests/infrastructure/trader_lab/test_vt08_b_r19_blind_dual_rater_poi_queue_v1.py
      - .github/workflows/vt08-b-r19-blind-poi-dual-rater.yml
permissions:
  contents: read
  actions: read
jobs:
  frozen-original-blind-samples:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        market: [EURJPY, USDCHF, NZDUSD, CADJPY, USDCAD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Ruff and preregistered sample anti-forgery tests
        run: |
          ruff check src/qore/infrastructure/trader_lab/vt08_b_r19_blind_dual_rater_poi_queue_v1.py tests/infrastructure/trader_lab/test_vt08_b_r19_blind_dual_rater_poi_queue_v1.py
          pytest -q tests/infrastructure/trader_lab/test_vt08_b_r19_blind_dual_rater_poi_queue_v1.py
      - uses: actions/download-artifact@v4
        with:
          name: vt08-b-r18-pre-cisd-poi-${{ matrix.market }}-9349cc84ee245c68291db60b4613411453061c94
          path: r18/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 38902918264
      - name: Create source-only, outcome-blind dual-review worksheet
        env:
          MARKET: ${{ matrix.market }}
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json, os
          from pathlib import Path
          from qore.infrastructure.trader_lab.vt08_b_r19_blind_dual_rater_poi_queue_v1 import (
              build_blind_review_queue, digest,
          )
          m=os.environ["MARKET"]
          files=list(Path("r18",m).rglob(m+"-VT08-B-R18-preCISD-H1-POI-source.json"))
          if len(files)!=1:
              raise SystemExit("R19 missing exact signed R18 source")
          src=json.loads(files[0].read_text(encoding="utf-8"))
          result=build_blind_review_queue(src,market=m)
          if (result["selected_category_counts"].get("BULLISH_FVG_TOUCHED_PRE_CISD")!=10
              or result["selected_category_counts"].get("CONTROL_NO_THREE_H1_FVG")!=10
              or result["rater_A_signed"] or result["rater_B_signed"]
              or result["source_complete_entries"] or result["broker_fills"]
              or result["alpha_programs_authorized"]):
              raise SystemExit("R19 fabricated review consent or altered strata")
          dest=Path("evidence",m+"-VT08-R19-blind-POI-review-packet.json")
          dest.write_text(
              json.dumps(result,sort_keys=True,separators=(",",":"),allow_nan=False),
              encoding="utf-8",
          )
          print(json.dumps({
              "market":m, "original":result["original_r18_cases"],
              "counts":result["selected_category_counts"],
              "chosen":result["selected_source_only_cases"],
              "sha256":digest(result), "rater_signatures":0,
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vt08-b-r19-blind-poi-${{ matrix.market }}-${{ github.sha }}
          path: evidence/*.json
          if-no-files-found: error
          retention-days: 30
