name: QORE VT31 NAS100 3Y Relax-All-Four Economics V1

on:
  push:
    branches:
      - agent/vt31-edge-position-cert-b-001
    paths:
      - scripts/vt31_nas100_3y_relax_all_four_economics_v1.py
      - .github/workflows/vt31-nas100-3y-relax-all-four-economics-v1.yml
  workflow_dispatch:

concurrency:
  group: vt31-nas100-3y-relax-all-four-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  trader-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install research runtime
        run: pip install -e ".[dev]"

      - name: Static gates
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_3y_relax_all_four_economics_v1.py
          ruff check scripts/vt31_nas100_3y_relax_all_four_economics_v1.py

      - name: Recover canonical single 3Y evidence
        run: |
          set -euo pipefail
          artifact_name="qore-vt31-nas100-owner-3y-base-v1"
          count="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100"             --jq '[.artifacts[] | select(.expired == false)] | length')"
          test "$count" = "1"
          artifact_id="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100"             --jq '[.artifacts[] | select(.expired == false)][0].id')"
          mkdir -p input/NAS100 result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          python - <<'PY'
          import json
          from pathlib import Path

          x=json.loads(Path("input/NAS100/market-evidence.json").read_text())
          assert x["base_id"] == "VT31_NAS100_OWNER_3Y_BASE_001"
          assert x["base_start_at"] == "2023-10-01T00:00:00+00:00"
          assert x["base_end_exclusive"] == "2026-10-01T00:00:00+00:00"
          assert x["coverage_sufficient"] is True
          assert x["legacy_r5_r6_r8_operating_folds_used"] is False
          PY

      - name: Replay only viable density candidate
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python scripts/vt31_nas100_3y_relax_all_four_economics_v1.py             input/NAS100/market-evidence.json             --output result/relax-all-four-economics.json             | tee result/relax-all-four-summary.json

      - name: Governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          x=json.loads(Path("result/relax-all-four-economics.json").read_text())
          assert x["base_id"] == "VT31_NAS100_OWNER_3Y_BASE_001"
          assert x["variant"] == "RELAX_ALL_FOUR"
          assert x["selection"]["selection_map_parity"] is True
          g=x["governance"]
          assert g["single_contiguous_3y_base"] is True
          assert g["legacy_r5_r6_r8_operating_folds_used"] is False
          assert g["outcome_used_for_action"] is False
          assert g["future_information_used_for_action"] is False
          assert g["position_sizing_used"] is False
          assert g["dynamic_sizing_used"] is False
          assert g["leverage_used"] is False
          assert g["compounding_used"] is False
          assert g["portfolio_weighting_used"] is False
          assert g["capital_weighting_used"] is False
          assert g["policy_promoted"] is False
          assert g["candidate_certified"] is False
          PY

      - name: Bind result
        run: |
          set -euo pipefail
          echo "$GITHUB_SHA" > result/git-sha.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd result && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-3y-relax-all-four-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
