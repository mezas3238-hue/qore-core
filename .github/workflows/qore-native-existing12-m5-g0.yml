name: QORE Native Existing12 10Y M5 G0 Independent Source Integrity

on:
  push:
    branches:
      - research/qore-native-existing12-m5-g0-normal-regimes-20261011
    paths:
      - '.github/workflows/qore-native-existing12-m5-g0.yml'
      - 'src/qore/infrastructure/trader_lab/qore_native_existing12_m5_g0_v1.py'
      - 'tests/infrastructure/trader_lab/test_qore_native_existing12_m5_g0_v1.py'
      - 'docs/research/QORE_NATIVE_EXISTING12_M5_G0_PREREG_SOURCE_ONLY_2026-10-11.md'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: qore-existing12-m5-g0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrity_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Research Python plus quality dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify source-only contract, original-source prereg and tests
        run: |
          test -s docs/research/QORE_NATIVE_EXISTING12_M5_G0_PREREG_SOURCE_ONLY_2026-10-11.md
          ruff check --select F,E4,E7,E9 src/qore/infrastructure/trader_lab/qore_native_existing12_m5_g0_v1.py tests/infrastructure/trader_lab/test_qore_native_existing12_m5_g0_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_qore_native_existing12_m5_g0_v1.py

  original_twelve_sources:
    needs: integrity_contract
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        symbol: [AUDJPY, AUDUSD, EURUSD, GBPJPY, GBPUSD, NAS100, SP500, US30, USDCAD, USDJPY, XAGUSD, XAUUSD]
    env:
      SOURCE_SYMBOL: ${{ matrix.symbol }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local research source only, no cTrader SDK connection
        run: python -m pip install -e .
      - name: Recover original frozen aggregate M5 manifest (12 assets)
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-aggregate-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          run-id: '35166210458'
          github-token: ${{ github.token }}
          path: original-aggregate
      - name: Recover original ten-year M5 provider-native archive only
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-${{ matrix.symbol }}-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          run-id: '35166210458'
          github-token: ${{ github.token }}
          path: original-native-m5
      - name: Rehash 11 raw years and recount M5, UTC H4 and D1 presence — NO RETURNS
        run: |
          python -m qore.infrastructure.trader_lab.qore_native_existing12_m5_g0_v1 "$SOURCE_SYMBOL" original-native-m5 original-aggregate result-existing12
          python - <<'PY'
          import os,json
          from pathlib import Path
          s=os.environ["SOURCE_SYMBOL"]
          r=json.loads(Path(f"result-existing12/native-existing12-m5-{s}-g0.json").read_text())
          assert r["status"]=="G0_M5_SOURCE_INTEGRITY_PASS"
          assert r["source_symbol"]==s
          assert r["all_11_years_raw_and_quality_sha256_verified"] is True
          assert len(r["yearly"])==11
          assert r["native_m5_bars"]==sum(y["native_m5_bars"] for y in r["yearly"])
          assert r["price_values_or_economic_outcomes_accessed"] is False
          assert r["returns_or_volatility_calculated"] is False
          assert r["historical_spreads_bidask_verified"] is False
          assert r["G1_authorized"] is False
          assert r["broker_h4_d1_candles_certified"] is False
          PY
          printf '%s\n' "$GITHUB_SHA" > result-existing12/code-head-sha.txt
      - name: Publish source-only symbol witness even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qore-native-existing12-m5-g0-${{ matrix.symbol }}-${{ github.sha }}
          path: result-existing12/
          retention-days: 90
          if-no-files-found: warn

  twelve_only_aggregate:
    needs: original_twelve_sources
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve exactly twelve source-only witnesses from current run
        uses: actions/download-artifact@v4
        with:
          pattern: qore-native-existing12-m5-g0-*-${{ github.sha }}
          path: original-12-audits
      - name: Independently aggregate counts and enforce 12/12 integrity
        run: |
          mkdir -p result-g0-aggregate
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path("original-12-audits")
          source=list(root.rglob("native-existing12-m5-*-g0.json"))
          expected=set("AUDJPY AUDUSD EURUSD GBPJPY GBPUSD NAS100 SP500 US30 USDCAD USDJPY XAGUSD XAUUSD".split())
          if len(source)!=len(expected):
              raise ValueError("expected exactly 12 source G0 witnesses")
          rows=[]
          for path in source:
              witness=path.with_name(path.name+".sha256")
              expected_hash=witness.read_text().split()[0]
              if hashlib.sha256(path.read_bytes()).hexdigest()!=expected_hash:
                  raise ValueError("source result integrity hash mismatch")
              row=json.loads(path.read_text())
              if row["status"]!="G0_M5_SOURCE_INTEGRITY_PASS":
                  raise ValueError("source-only verification not passed")
              if (row["price_values_or_economic_outcomes_accessed"] is not False
                  or row["G1_authorized"] is not False):
                  raise ValueError("market outcomes or unauthorized promotion")
              rows.append(row)
          if {r["source_symbol"] for r in rows} != expected:
              raise ValueError("G0 market roster mismatch")
          rows.sort(key=lambda r:r["source_symbol"])
          total=sum(r["native_m5_bars"] for r in rows)
          if total!=8726985:
              raise ValueError(f"original provider 12-market M5 total differs: {total}")
          out={
              "identity":"QORE_NATIVE_EXISTING12_10Y_M5_SOURCE_G0_V1",
              "status":"G0_12_OF_12_ORIGINAL_M5_SOURCE_PASS",
              "symbols":[{"symbol":r["source_symbol"],
                          "provider":r["provider_symbol"],
                          "native_m5_bars":r["native_m5_bars"],
                          "first_utc":r["first_utc"],"last_utc":r["last_utc"],
                          "complete_H4_utc":r["h4_calendar_utc_presence_only"]["complete_utc_blocks"],
                          "complete_D1_utc":r["d1_calendar_utc_presence_only"]["complete_utc_blocks"],
                          "raw_sha_all_years_verified":True} for r in rows],
              "source_12_market_total_m5":total,
              "original_source_run":35166210458,
              "original_manifest_sha":"47f5763d7ea2c10dd32fa40a84d7480c8124f1a512b623c1299ef2ba7b8c51c2",
              "H4_D1_are_UTC_presence_not_broker_candles":True,
              "provider_broker_session_calendar_verified":False,
              "broker_costs_spreads_verified":False,
              "no_OHLC_economic_analysis":True,
              "G1_authorized":False,
              "21_new_symbols_included":False,
              "no_vps_mt5_live_or_trade":True,
          }
          Path("result-g0-aggregate/existing12-M5-G0-final.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          for row in out["symbols"]:
              print(row["symbol"],row["native_m5_bars"],row["complete_H4_utc"],row["complete_D1_utc"])
          print("QORE_NATIVE_EXISTING12_M5",out["status"],total)
          PY
          printf '%s\n' "$GITHUB_SHA" > result-g0-aggregate/code-head-sha.txt
          (cd result-g0-aggregate && sha256sum existing12-M5-G0-final.json code-head-sha.txt > OUTPUT_SHA256SUMS.txt)
      - name: Publish aggregate integrity and UTC-time presence only
        uses: actions/upload-artifact@v4
        with:
          name: qore-native-existing12-m5-g0-final-${{ github.sha }}
          path: result-g0-aggregate/
          retention-days: 90
          if-no-files-found: error
