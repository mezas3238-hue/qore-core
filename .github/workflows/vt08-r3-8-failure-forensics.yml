name: QORE VT-08 R3.8 Failure Forensics

on:
  pull_request:
    branches:
      - agent/vt08-r3-8-b01-backtest-001
    paths:
      - "src/qore/infrastructure/trader_lab/vt08_b01_failure_forensics_r3_8.py"
      - "tests/infrastructure/trader_lab/test_vt08_b01_failure_forensics_r3_8.py"
      - ".github/workflows/vt08-r3-8-failure-forensics.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff gate
        run: ruff check .
      - name: Mypy gate
        run: mypy src tests
      - name: Focused failure-forensics tests
        run: pytest -q tests/infrastructure/trader_lab/test_vt08_b01_failure_forensics_r3_8.py

  forensics:
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QORE runtime
        run: pip install -e .
      - name: Download frozen R3.8 research artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34693803930
          pattern: qore-vt08-r3-8-*
          path: retained
      - name: Verify exactly seven retained Trader Lab reports
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t reports < <(find retained -type f -name trader-lab.json | sort)
          printf 'reports=%s\n' "${#reports[@]}"
          test "${#reports[@]}" -eq 7
          printf '%s\n' "${reports[@]}" > trader-lab-paths.txt
      - name: Run frozen failure forensics
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t reports < trader-lab-paths.txt
          python -m qore.infrastructure.trader_lab.vt08_b01_failure_forensics_r3_8 "${reports[@]}" > vt08-r3-8-failure-forensics.json
          python - <<'PY'
          import json
          p=json.load(open('vt08-r3-8-failure-forensics.json', encoding='utf-8'))
          assert p['baseline_frozen'] is True
          assert p['current_evidence_consumed'] is True
          assert p['independent_validation_reuse_prohibited'] is True
          assert p['demo_eligible'] is False
          print('sample_size=', p['pooled']['sample_size'])
          print('oos_pass_markets=', p['oos_pass_markets'])
          print('stress_pass_markets=', p['stress_pass_markets'])
          print('hypotheses=', len(p['hypothesis_register']))
          PY
      - name: Upload failure-forensics evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-r3-8-failure-forensics-${{ github.sha }}
          path: vt08-r3-8-failure-forensics.json
          if-no-files-found: error
          retention-days: 30
