name: QORE VT08 Protection Attribution Forensics V1

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vt08-cognitive-expansion-5m-v1-001
    paths:
      - .github/workflows/vt08-protection-attribution-forensics-v1.yml

permissions:
  contents: read
  actions: read

jobs:
  attribution:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        symbol: [CADJPY, NZDUSD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Download immutable 1095d evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-vt08-cognitive-5m-fresh-${{ matrix.symbol }}-b2d33e1b4829d8b4afc76983decca8a99131403c
          path: evidence/${{ matrix.symbol }}
          github-token: ${{ github.token }}
          run-id: 35934924907
      - name: Attribute aggressive protection delta
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from qore.infrastructure.trader_lab.vt08_cognitive_protection_attribution_forensics_v1 import (
              evaluate,
          )

          symbol = os.environ["SYMBOL"]
          report = evaluate(
              Path(f"evidence/{symbol}/market-evidence-1095d.json")
          )
          Path(f"artifacts/{symbol}-protection-attribution.json").write_text(
              json.dumps(report, sort_keys=True, separators=(",", ":")),
              encoding="utf-8",
          )
          print(json.dumps({
              "market": report["market"],
              "overall": report["overall"],
              "chronological_thirds": report["chronological_thirds"],
              "by_causal_axis": report["by_causal_axis"],
          }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-protection-attribution-${{ matrix.symbol }}-${{ github.sha }}
          path: artifacts/${{ matrix.symbol }}-protection-attribution.json
          if-no-files-found: error
          retention-days: 30
