name: QORE CIBO Cognitive Trader Lab Runtime Audit

on:
  push:
    branches:
      - agent/cibo-profitability-lab-001
    paths:
      - '.github/workflows/cibo-cognitive-trader-lab-runtime-audit.yml'
      - 'scripts/cibo_cognitive_trader_lab_audit.py'
      - 'docs/research/CIBO-COGNITIVE-TRADER-LAB-AUDIT-TRIGGER.json'

permissions:
  contents: read
  actions: read

jobs:
  trader-lab-runtime-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_ARTIFACT_ID: '11261743257'
      SOURCE_HEAD_SHA: 'bc7909f2f28fbfa1bef1b83768499a28f634409a'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Recover retained Trader Lab evidence
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" > "$RUNNER_TEMP/source.zip"
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/source"
          test -s "$RUNNER_TEMP/source/decision-trace.json"
      - name: Execute sequential Trader Lab cognitive audit
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cognitive-trader-lab"
          python scripts/cibo_cognitive_trader_lab_audit.py \
            --decision-trace "$RUNNER_TEMP/source/decision-trace.json" \
            --source-head "$SOURCE_HEAD_SHA" \
            --output "$RUNNER_TEMP/cognitive-trader-lab/audit.json"
      - name: Enforce all 18 phases x 7 traders
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads((Path(os.environ['RUNNER_TEMP'])/'cognitive-trader-lab'/'audit.json').read_text())
          assert p['candidate_count'] == 7
          assert p['phase_count'] == 18
          assert p['all_phases_green'] is True
          assert all(x['status'] == 'GREEN' for x in p['phases'])
          assert all(x['outputs_consumed_by_next_phase'] is True for x in p['phases'])
          PY
      - name: Preserve legacy quarantine
        run: |
          python scripts/cibo_legacy_stack_quarantine.py
          pytest -q --no-cov tests/infrastructure/test_cibo_legacy_stack_quarantine.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-cibo-cognitive-trader-lab-runtime-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/cognitive-trader-lab
          if-no-files-found: warn
          retention-days: 90
