name: R62G transported builtins repair

on:
  push:
    branches:
      - agent/qore-umi14-umi12-final-owner-recert-001
    paths:
      - '.github/workflows/r62g-builtins-transport-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qore-umi14-umi12-final-owner-recert-001
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Apply bounded transport repair
        run: python .github/scripts/r62g_builtins_transport_patch.py
      - name: Validate repair
        run: |
          ruff check tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62g_guards.py
          mypy tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62g_guards.py
          pytest -q tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62g_guards.py
          pytest -q tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
      - name: Publish clean target only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62g_guards.py
          git commit -m 'Generalize R62G builtins module transport semantics'
          git rm .github/scripts/r62g_builtins_transport_patch.py .github/workflows/r62g-builtins-transport-repair.yml
          git commit -m 'Remove R62G transport repair staging'
          git push origin HEAD:agent/qore-umi14-umi12-final-owner-recert-001
