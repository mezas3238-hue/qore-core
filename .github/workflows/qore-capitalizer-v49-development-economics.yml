name: QORE Capitalizer V49 Development Economics

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-v49-development-economics.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_high_frequency_capacity_census_v49.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_high_frequency_trader_v49.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v49_development_economics.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v49_development_economics.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-v49-development-economics-${{ github.sha }}
  cancel-in-progress: false

env:
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_high_frequency_capacity_census_v49.py \
            src/qore/infrastructure/trader_lab/capitalizer_high_frequency_trader_v49.py \
            src/qore/infrastructure/trader_lab/capitalizer_v49_development_economics.py \
            tests/infrastructure/trader_lab/test_capitalizer_v49_development_economics.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_high_frequency_capacity_census_v49.py \
            src/qore/infrastructure/trader_lab/capitalizer_high_frequency_trader_v49.py \
            src/qore/infrastructure/trader_lab/capitalizer_v49_development_economics.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_v49_development_economics.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - symbol: USDJPY
            session: ASIA
          - symbol: AUDJPY
            session: ASIA
          - symbol: AUDUSD
            session: ASIA
          - symbol: GBPJPY
            session: ASIA
          - symbol: EURUSD
            session: LONDON
          - symbol: GBPUSD
            session: LONDON
          - symbol: XAUUSD
            session: NEW_YORK
          - symbol: USDCAD
            session: NEW_YORK
          - symbol: NAS100
            session: NEW_YORK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download retained provider-native M1
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Verify M1 provenance
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("m1-source/m1-clone-manifest.json").read_text())
          assert manifest["canonical_symbol"] == os.environ["EXPECTED_SYMBOL"]
          assert manifest["provider_native_m1"] is True
          assert manifest["synthetic_m1"] is False
          assert manifest["interpolated_m1"] is False
          assert manifest["contradictory_m1"] == 0
          assert manifest["read_only"] is True
          PY
      - name: Build frozen V49 development opportunities
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_high_frequency_capacity_census_v49 \
            market m1-source capacity-output --session "${{ matrix.session }}"
      - name: Replay development economics
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v49_development_economics \
            market capacity-output m1-source economic-output
      - name: Enforce market economic boundary
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
          EXPECTED_SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"]
          path = Path("economic-output") / (
              f"capitalizer-{symbol.lower()}-v49-development-economics.json"
          )
          result = json.loads(path.read_text())
          assert result["symbol"] == symbol
          assert result["session"] == os.environ["EXPECTED_SESSION"]
          assert result["window_start"] == "2025-09-17T00:00:00+00:00"
          assert result["window_end_exclusive"] == "2026-09-17T00:00:00+00:00"
          assert result["outcome_used_for_selection"] is False
          assert result["fresh_holdout_used"] is False
          assert result["daily_used"] is False
          assert result["h4_used"] is False
          assert result["development_only"] is True
          assert result["trader_certified"] is False
          assert result["live_authorized"] is False
          PY
      - name: Upload market economics
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v49-dev-econ-${{ matrix.symbol }}-${{ github.sha }}
          path: economic-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download nine market economic artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v49-dev-econ-*-${{ github.sha }}
          path: market-economics
          merge-multiple: false
      - name: Build V49 portfolio economic matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v49_development_economics \
            matrix market-economics matrix-output
      - name: Enforce development-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("matrix-output/capitalizer-v49-development-economic-matrix.json").read_text()
          )
          assert result["window_start"] == "2025-09-17T00:00:00+00:00"
          assert result["window_end_exclusive"] == "2026-09-17T00:00:00+00:00"
          assert result["development_only"] is True
          assert result["reserved_holdout_reopened"] is False
          assert result["fresh_holdout_used"] is False
          assert result["decision_timeframes"] == ["H1", "M15", "M1"]
          assert result["daily_used"] is False
          assert result["h4_used"] is False
          assert result["outcome_aware_selection"] is False
          assert result["cibo_sizing_applied"] is False
          assert result["risk_allocator_applied"] is False
          assert result["trader_certified"] is False
          assert result["live_authorized"] is False
          assert result["real_capital_authorized"] is False
          PY
      - name: Upload aggregate economic matrix
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v49-development-economics-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 180
