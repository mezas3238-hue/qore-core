name: QORE Capitalizer Cognitive Regime Evidence Binding Audit 2R V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-cognitive-regime-evidence-binding-audit-2r-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_cognitive_regime_evidence_binding_audit_2r_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_cognitive_regime_evidence_binding_audit_2r_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-cognitive-regime-evidence-binding-audit-2r-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  REBASE_RUN_ID: '36078677895'
  REBASE_SHA: 'cfc04849c8bbfd6565310d89456f5e367ea880f7'
  MICRO_RUN_ID: '35805397236'
  MICRO_SHA: 'e3be1ed5dda60ab3a53257287c9471ce247d2554'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_cognitive_regime_evidence_binding_audit_2r_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_cognitive_regime_evidence_binding_audit_2r_v1.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_cognitive_regime_evidence_binding_audit_2r_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_cognitive_regime_evidence_binding_audit_2r_v1.py

  audit:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download true-2R cognitive rebase
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cognitive-economic-rebase-2r-v1-${{ env.REBASE_SHA }}
          path: rebase-input
          github-token: ${{ github.token }}
          run-id: ${{ env.REBASE_RUN_ID }}
      - name: Download outcome-free M3/M5 context ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v3-m3-microstructure-context-2y-v1-*-${{ env.MICRO_SHA }}
          path: micro-input
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.MICRO_RUN_ID }}
      - name: Build true-2R regime evidence binding audit
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cognitive_regime_evidence_binding_audit_2r_v1 \
            rebase-input micro-input regime-output
      - name: Enforce regime evidence binding controls
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          report = json.loads(
              Path(
                  "regime-output/"
                  "capitalizer-cognitive-regime-evidence-binding-audit-2r-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_COGNITIVE_REGIME_EVIDENCE_BINDING_AUDIT_2R_V1"
          )
          assert report["source_rebase_run_id"] == 36078677895
          assert report["source_micro_run_id"] == 35805397236
          assert report["target_r"] == "2.00"
          assert report["control_trades"] == 948
          assert report["micro_context_rows_available"] == 8099
          assert report["micro_context_outcome_free"] is True
          assert report["future_evidence_violations"] == 0
          assert report["regime_evidence_bound_trades"] > 0
          assert report["regime_evidence_bound_trades"] <= 948
          assert (
              report["regime_evidence_bound_trades"]
              + report["regime_evidence_unbound_trades"]
              == 948
          )
          coverage = Decimal(report["regime_evidence_coverage"])
          assert Decimal("0") < coverage <= Decimal("1")
          assert report["by_provenance"]["CAUSAL_ARBITRATION_BASE"]["trades"] == 840
          assert (
              report["by_provenance"]["PROTECTED_SWING_GEOMETRY_RESCUE"]["trades"]
              == 105
          )
          assert report["by_provenance"]["WAIT_REJECTED_PARALLEL_REARM"]["trades"] == 3
          assert report["regime_family_id_selected"] is False
          assert report["regime_intelligence_supported"] is False
          assert report["descriptive_regime_evidence_only"] is True
          assert report["current_trade_outcome_visible_to_binding"] is False
          assert report["missing_evidence_fabricated"] is False
          assert report["rebase_control_reproduced"] is True
          assert report["strategy_rules_changed"] is False
          assert report["cognitive_rules_changed"] is False
          assert report["entry_changed"] is False
          assert report["stop_changed"] is False
          assert report["target_changed"] is False
          assert report["max3_changed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-cognitive-regime-evidence-binding-audit-2r-v1-${{ github.sha }}
          path: regime-output
          if-no-files-found: error
          retention-days: 90
