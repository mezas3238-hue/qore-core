name: QORE CIBO Trader Lab Runtime Audit

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cibo-trader-lab-ultrafast-widefix-20261008-001
      - agent/cibo-causal-expectation-leakage-fix-001
    paths:
      - scripts/cibo_trader_lab_runtime_audit.py
      - .github/workflows/cibo-trader-lab-runtime-audit.yml
      - '.github/workflows/cibo-trader-lab-*.yml'
  pull_request:
    paths:
      - scripts/cibo_trader_lab_runtime_audit.py
      - .github/workflows/cibo-trader-lab-runtime-audit.yml

permissions:
  contents: read

jobs:
  inventory-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit legacy CIBO research workflows
        run: python scripts/cibo_trader_lab_runtime_audit.py
      - name: Upload verified inventory
        uses: actions/upload-artifact@v4
        with:
          name: cibo-trader-lab-slow-workflow-inventory-${{ github.run_id }}
          path: cibo-trader-lab-runtime-audit.json
          retention-days: 30
          if-no-files-found: error
