name: QORE VT08 CRT PURE Cognitive Gate

on:
  push:
    branches:
      - agent/vt08-crt-pure-source-identity-001
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff CRT PURE
        run: |
          ruff check \
            src/qore/infrastructure/traders/crt_pure_identity.py \
            src/qore/infrastructure/traders/crt_pure_source_registry.py \
            src/qore/infrastructure/traders/crt_pure_source_corpus.py \
            src/qore/infrastructure/traders/crt_pure_strategy_identity_memory.py \
            src/qore/infrastructure/traders/crt_pure_methodology_candidate.py \
            src/qore/infrastructure/traders/crt_pure_candidate_replay.py \
            src/qore/infrastructure/traders/crt_pure_cognitive_contract.py \
            src/qore/infrastructure/traders/crt_pure_cognitive_state.py \
            src/qore/infrastructure/traders/crt_pure_position_intelligence.py \
            src/qore/infrastructure/traders/crt_pure_cross_market_cognition.py \
            tests/infrastructure/traders/test_crt_pure_identity.py \
            tests/infrastructure/traders/test_crt_pure_source_registry.py \
            tests/infrastructure/traders/test_crt_pure_strategy_identity_memory.py \
            tests/infrastructure/traders/test_crt_pure_methodology_candidate.py \
            tests/infrastructure/traders/test_crt_pure_candidate_replay.py \
            tests/infrastructure/traders/test_crt_pure_cognitive_architecture.py \
            tests/infrastructure/traders/test_crt_pure_source_corpus_and_cross_market.py
      - name: Mypy CRT PURE
        run: |
          mypy \
            src/qore/infrastructure/traders/crt_pure_identity.py \
            src/qore/infrastructure/traders/crt_pure_source_registry.py \
            src/qore/infrastructure/traders/crt_pure_source_corpus.py \
            src/qore/infrastructure/traders/crt_pure_strategy_identity_memory.py \
            src/qore/infrastructure/traders/crt_pure_cognitive_contract.py \
            src/qore/infrastructure/traders/crt_pure_cognitive_state.py \
            src/qore/infrastructure/traders/crt_pure_position_intelligence.py \
            src/qore/infrastructure/traders/crt_pure_cross_market_cognition.py
      - name: Pytest CRT PURE
        run: |
          pytest -q \
            tests/infrastructure/traders/test_crt_pure_identity.py \
            tests/infrastructure/traders/test_crt_pure_source_registry.py \
            tests/infrastructure/traders/test_crt_pure_strategy_identity_memory.py \
            tests/infrastructure/traders/test_crt_pure_cognitive_architecture.py \
            tests/infrastructure/traders/test_crt_pure_source_corpus_and_cross_market.py
