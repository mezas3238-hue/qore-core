name: Scalper Issue770 Posthoc Paired Direction Day Cluster

on:
  push:
    branches:
      - research/scalper-p0-entry-quality-1to1-20261011
    paths:
      - '.github/workflows/qore-scalper-issue770-posthoc-paired-sign.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_issue770_posthoc_paired_sign_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_scalper_issue770_posthoc_paired_sign_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  ORIGINAL_RUN: '38109948508'
  ORIGINAL_SHA: '0a7125ffaad66b4262b0f0ede58a3ced3564b1f7'

jobs:
  retrospective_secondary:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Quality + test no new strategy/inversion authorization
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_scalper_issue770_posthoc_paired_sign_v1.py tests/infrastructure/trader_lab/test_capitalizer_scalper_issue770_posthoc_paired_sign_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_scalper_issue770_posthoc_paired_sign_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_scalper_issue770_posthoc_paired_sign_v1.py
      - uses: actions/download-artifact@v4
        with:
          name: scalper-issue770-P0-1to1-nine-market-scientific-${{ env.ORIGINAL_SHA }}
          path: frozen-2020
          github-token: ${{ github.token }}
          run-id: ${{ env.ORIGINAL_RUN }}
      - name: Run POSTHOC ONLY paired 2000x 5-day blocks and clustered sign null
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_issue770_posthoc_paired_sign_v1 frozen-2020 posthoc-report
      - name: Audit non-live, no OOS, original unchanged, exact 2020
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("posthoc-report/scalper-issue770-posthoc-cluster-paired.json").read_text())
          assert x["source_intents"]==2020 and x["run_is_posthoc"]
          assert not x["primary_1to1_replay_changed"] and not x["confirmatory_pvalue"]
          assert not x["certified"]
          for key in ("pure_1to1","session_capped_1to1"):
              z=x[key]
              assert z["n_original_intents"]==2020
              assert z["paired_resolved_count"]+z["both_censored"]==2020
              assert z["original_resolved_only"]==0 and z["reverse_resolved_only"]==0
              assert z["posthoc_followup_NOT_preregistered"]
              assert not z["sign_reversal_trade_authority"]
              assert not z["independent_holdout"]
          print("ISSUE770_POSTHOC_AUDIT",json.dumps({
              k:x[k]["mean_opposite_minus_original_gross_R"]
              for k in ("pure_1to1","session_capped_1to1")
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-issue770-P0-posthoc-paired-direction-cluster-${{ github.sha }}
          path: posthoc-report/
          retention-days: 90
          if-no-files-found: error
