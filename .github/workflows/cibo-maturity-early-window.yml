name: QORE CIBO Maturity Early Window

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cibo-causal-expectation-leakage-fix-001
    paths:
      - '.github/workflows/cibo-maturity-early-window.yml'

permissions:
  contents: read
  actions: read

jobs:
  early-window:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      FROZEN_ARTIFACT_ID: '11389331836'
      FROZEN_ARTIFACT_DIGEST: 'sha256:30177639f660c9647ab70257c2d12c541bdade49ab5582347a3890f920070fee'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Recover frozen source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/frozen" "$RUNNER_TEMP/early"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$FROZEN_ARTIFACT_ID" > "$RUNNER_TEMP/frozen.meta.json"
          jq -e --arg digest "$FROZEN_ARTIFACT_DIGEST" '.expired == false and .digest == $digest' "$RUNNER_TEMP/frozen.meta.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$FROZEN_ARTIFACT_ID/zip" > "$RUNNER_TEMP/frozen.zip"
          echo "${FROZEN_ARTIFACT_DIGEST#sha256:}  $RUNNER_TEMP/frozen.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/frozen.zip" -d "$RUNNER_TEMP/frozen"
          MANIFEST="$(find "$RUNNER_TEMP/frozen" -type f -name single-account-manifest-native.json -print -quit)"
          test -n "$MANIFEST"
          echo "MANIFEST=$MANIFEST" >> "$GITHUB_ENV"
      - name: Build full causal walk-forward manifest
        run: |
          set -euo pipefail
          python scripts/cibo_build_walk_forward_expectation_manifest.py \
            --manifest "$MANIFEST" \
            --output "$RUNNER_TEMP/early/full-walk-forward.json" \
            --receipt "$RUNNER_TEMP/early/full-receipt.json"
      - name: Freeze 2019 diagnostic window
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          from qore.infrastructure.cibo_single_account_manifest_integrity import (
              reseal_single_account_manifest,
          )

          root = Path(os.environ["RUNNER_TEMP"]) / "early"
          payload = json.loads((root / "full-walk-forward.json").read_text())
          cutoff = "2019-12-31T23:59:59+00:00"
          rows = [
              row for row in payload["opportunities"]
              if row["market_decision_at"] <= cutoff
          ]
          assert rows
          payload["opportunities"] = rows
          payload["opportunity_decision_count"] = len(rows)
          payload["decision_epoch_count"] = len(
              {row["decision_epoch_id"] for row in rows}
          )
          payload["trader_ids"] = sorted({row["trader_id"] for row in rows})
          counts = Counter(row["trader_id"] for row in rows)
          payload["trader_opportunity_counts"] = dict(sorted(counts.items()))
          payload["first_market_decision_at"] = rows[0]["market_decision_at"]
          payload["last_market_decision_at"] = rows[-1]["market_decision_at"]
          payload["research_window"] = {
              "kind": "BURNED_EARLY_WINDOW_DIAGNOSTIC",
              "cutoff": cutoff,
              "certification_claimed": False,
          }
          payload = reseal_single_account_manifest(payload)
          (root / "early-manifest.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps({
              "opportunities": len(rows),
              "epochs": payload["decision_epoch_count"],
              "first": payload["first_market_decision_at"],
              "last": payload["last_market_decision_at"],
          }, sort_keys=True))
          PY
      - name: Execute maturity-repaired early replay
        run: |
          set -euo pipefail
          python scripts/cibo_single_account_historical_ceiling_replay.py \
            --manifest "$RUNNER_TEMP/early/early-manifest.json" \
            --output "$RUNNER_TEMP/early/early-replay.json" \
            --progress-every 50
      - name: Audit four-engine cooperation
        run: |
          set -euo pipefail
          python scripts/cibo_four_engine_cooperation_report.py \
            --replay "$RUNNER_TEMP/early/early-replay.json" \
            --output "$RUNNER_TEMP/early/four-engine-cooperation.json"
          jq '{
            decision_count,
            module_summary,
            cooperation_pattern_counts,
            handoff_consistency_counts,
            compound_applicable_count,
            compound_allowed_count,
            maximum_selected_leverage_multiplier,
            selected_multiplier_above_four_count,
            portfolio_and_leverage_share_exact_output_surface,
            bottleneck_candidates
          }' "$RUNNER_TEMP/early/four-engine-cooperation.json"

      - name: Summarize early survival
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from collections import Counter, defaultdict
          from decimal import Decimal
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "early"
          replay = json.loads((root / "early-replay.json").read_text())
          capital = Decimal("60")
          peak = capital
          max_dd = Decimal(0)
          by_trader = defaultdict(Decimal)
          settlements = sorted(
              replay["settlement_receipts"],
              key=lambda row: (row["settled_at"], row["signal_fingerprint"]),
          )
          for item in settlements:
              pnl = Decimal(item["realized_net_pnl_usd"])
              capital += pnl
              peak = max(peak, capital)
              max_dd = max(max_dd, peak - capital)
              by_trader[item["trader_id"]] += pnl
          leverage = Counter(
              str(item["adaptive_leverage_multiplier"])
              for item in replay["decision_receipts"]
          )
          result = {
              "schema": "qore.cibo.maturity-early-window.v1",
              "initial_capital_usd": "60",
              "ending_capital_usd": format(capital, "f"),
              "peak_capital_usd": format(peak, "f"),
              "maximum_drawdown_usd": format(max_dd, "f"),
              "settlement_count": len(settlements),
              "selected_decision_count": sum(
                  item["risk_decision"] in {"ALLOW", "REDUCE"}
                  for item in replay["decision_receipts"]
              ),
              "leverage_counts": dict(sorted(leverage.items())),
              "net_pnl_by_trader_usd": {
                  key: format(value, "f")
                  for key, value in sorted(by_trader.items())
              },
              "future_outcome_used": False,
              "research_only": True,
              "certification_claimed": False,
          }
          (root / "early-summary.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(result, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-cibo-maturity-early-window-${{ github.run_id }}
          path: ${{ runner.temp }}/early
          if-no-files-found: warn
