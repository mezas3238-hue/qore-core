name: QORE CIBO Phase22 V3 Source Receipt

on:
  push:
    branches:
      - agent/cibo-integrator-ab-001
      - agent/cibo-next-policy-sovereign-integration-001
    paths:
      - 'src/qore/infrastructure/cibo_phase22_v3_source_receipt.py'
      - 'tests/infrastructure/test_cibo_phase22_v3_source_receipt.py'
      - '.github/workflows/cibo-phase22-v3-source-receipt.yml'

permissions:
  contents: read

jobs:
  receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Static quality
        run: |
          python -m ruff check \
            src/qore/infrastructure/cibo_phase22_v3_source_receipt.py \
            tests/infrastructure/test_cibo_phase22_v3_source_receipt.py
      - name: Receipt contract
        run: |
          python -m pytest -q \
            tests/infrastructure/test_cibo_phase22_v3_source_receipt.py
      - name: Emit canonical source receipt fingerprint
        run: |
          mkdir -p artifacts
          python - <<'PY' | tee artifacts/source-receipt-fingerprint.json
          import json
          from qore.infrastructure.cibo_phase22_v3_source_receipt import (
              PHASE22_V3_SOURCE_RECEIPT,
              phase22_v3_source_receipt_sha256,
          )
          print(json.dumps({
              "schema": "qore.cibo.phase22.v3-source-receipt-fingerprint.v1",
              "candidate_id": PHASE22_V3_SOURCE_RECEIPT.candidate_id,
              "source_receipt_sha256": phase22_v3_source_receipt_sha256(),
              "source_validation_complete": True,
              "source_outcomes_inspected": False,
              "trader_logic_executed": False,
              "broker_mutation": False,
              "fresh_trader_execution_authorized": False,
          }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-phase22-v3-source-receipt-${{ github.sha }}
          path: artifacts/source-receipt-fingerprint.json
          if-no-files-found: error
          retention-days: 90
