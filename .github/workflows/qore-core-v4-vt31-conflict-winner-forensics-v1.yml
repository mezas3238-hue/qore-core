name: QORE Core V4 VT31 Conflict Winner Forensics

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - scripts/vt31_core_stack_v4_conflict_winner_forensics_v1.py
      - .github/workflows/qore-core-v4-vt31-conflict-winner-forensics-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  forensics:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Static validation
        run: |
          ruff check scripts/vt31_core_stack_v4_conflict_winner_forensics_v1.py
          python -m py_compile scripts/vt31_core_stack_v4_conflict_winner_forensics_v1.py
      - name: Recover consumed R8 R6 evidence
        run: |
          set -euo pipefail
          mkdir -p input/pure input/cibo input/r8 input/r6 result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10799064861/zip" > pure.zip
          unzip -q pure.zip -d input/pure
          (cd input/pure && sha256sum -c SHA256SUMS)
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10478487667/zip" > cibo.zip
          unzip -q cibo.zip -d input/cibo
          (cd input/cibo && sha256sum -c SHA256SUMS)
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10402199719/zip" > r8.zip
          unzip -q r8.zip -d input/r8
          echo "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb  input/r8/fresh/NAS100/market-evidence.json" | sha256sum -c -
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10389112524/zip" > r6.zip
          unzip -q r6.zip -d input/r6
          echo "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581  input/r6/fresh/NAS100/market-evidence.json" | sha256sum -c -
      - name: Run conflict winner forensics
        run: |
          python scripts/vt31_core_stack_v4_conflict_winner_forensics_v1.py             --r8-trades input/pure/r8.json             --r6-trades input/pure/r6.json             --r8-raw input/r8/fresh/NAS100/market-evidence.json             --r6-raw input/r6/fresh/NAS100/market-evidence.json             --daily-path input/cibo/DAILY_PATH_LEDGER.jsonl             --output result/conflict-winner-forensics.json             | tee result/summary.json
      - name: Governance gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/conflict-winner-forensics.json").read_text())
          g=p["governance"]
          assert g["r5_opened"] is False
          assert g["outcome_used_for_decision"] is False
          assert g["outcome_used_for_diagnostics_only"] is True
          assert g["live_authorized"] is False
          assert g["merge_authorized"] is False
          PY
      - name: Bind result
        run: |
          echo "$GITHUB_SHA" > result/git-sha.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd result && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-core-v4-vt31-conflict-winner-forensics-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
