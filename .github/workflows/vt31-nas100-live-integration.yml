name: QORE VT31 NAS100 Live Integration

on:
  push:
    branches:
      - agent/turtle-soup-gbpusd-r43-live-core-integration-001
    paths:
      - src/qore/infrastructure/vt31_nas100_live.py
      - src/qore/infrastructure/vt31_nas100_state.py
      - src/qore/infrastructure/trader_execution_profile.py
      - scripts/vt31_nas100_live_policy.py
      - scripts/vt31_nas100_runtime_adapter.py
      - scripts/qore_fundednext_runtime.py
      - tests/infrastructure/test_vt31_nas100_live_runtime.py
      - .github/workflows/vt31-nas100-live-integration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Syntax
        run: |
          python -m py_compile src/qore/infrastructure/vt31_nas100_live.py
          python -m py_compile src/qore/infrastructure/vt31_nas100_state.py
          python -m py_compile src/qore/infrastructure/trader_execution_profile.py
          python -m py_compile scripts/vt31_nas100_live_policy.py
          python -m py_compile scripts/vt31_nas100_runtime_adapter.py
          PYTHONPATH=scripts python -c "import vt31_nas100_runtime_adapter"
          python -m py_compile scripts/qore_fundednext_runtime.py
      - name: Ruff
        run: |
          ruff check src/qore/infrastructure/vt31_nas100_live.py \
            src/qore/infrastructure/vt31_nas100_state.py \
            src/qore/infrastructure/trader_execution_profile.py \
            scripts/vt31_nas100_live_policy.py \
            scripts/vt31_nas100_runtime_adapter.py \
            tests/infrastructure/test_vt31_nas100_live_runtime.py
      - name: Mypy
        run: |
          mypy src/qore/infrastructure/vt31_nas100_live.py \
            src/qore/infrastructure/vt31_nas100_state.py \
            src/qore/infrastructure/trader_execution_profile.py
      - name: Focused tests
        run: |
          pytest -q tests/infrastructure/test_vt31_nas100_live_runtime.py \
            tests/infrastructure/test_account_wide_risk.py \
            tests/infrastructure/test_account_wide_risk_ledger.py \
            tests/infrastructure/test_fundednext_runtime_script_contract.py
