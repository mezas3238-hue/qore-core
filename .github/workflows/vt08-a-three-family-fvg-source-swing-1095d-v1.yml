name: VT08 A Three Family FVG Source Swing 1095D V1

on:
  push:
    branches:
      - agent/vt08-5m-methodology-source-20261010
    paths:
      - .github/workflows/vt08-a-three-family-fvg-source-swing-1095d-v1.yml
      - src/qore/infrastructure/trader_lab/vt08_5m_three_family_fvg_causal_shape_census_v1.py
      - src/qore/infrastructure/trader_lab/vt08_5m_ttrades_source_swing_asof_contract_v1.py
      - tests/infrastructure/trader_lab/test_vt08_5m_three_family_fvg_causal_shape_census_v1.py
      - tests/infrastructure/trader_lab/test_vt08_5m_ttrades_source_swing_asof_contract_v1.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  three-family-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        symbol: [EURJPY, USDCHF, NZDUSD, CADJPY, USDCAD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Code quality and causal negative fixtures before source replay
        run: |
          ruff check src/qore/infrastructure/trader_lab/vt08_5m_three_family_fvg_causal_shape_census_v1.py src/qore/infrastructure/trader_lab/vt08_5m_ttrades_source_swing_asof_contract_v1.py tests/infrastructure/trader_lab/test_vt08_5m_three_family_fvg_causal_shape_census_v1.py tests/infrastructure/trader_lab/test_vt08_5m_ttrades_source_swing_asof_contract_v1.py
          pytest -q tests/infrastructure/trader_lab/test_vt08_5m_three_family_fvg_causal_shape_census_v1.py tests/infrastructure/trader_lab/test_vt08_5m_ttrades_source_swing_asof_contract_v1.py
      - uses: actions/download-artifact@v4
        with:
          name: qore-vt08-cognitive-5m-fresh-${{ matrix.symbol }}-b2d33e1b4829d8b4afc76983decca8a99131403c
          path: evidence/${{ matrix.symbol }}
          github-token: ${{ github.token }}
          run-id: 35934924907
      - name: Genuine as-of market FVG+CISD+PS census no fills
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from qore.infrastructure.trader_lab.vt08_5m_three_family_fvg_causal_shape_census_v1 import audit_market
          sym=os.environ["SYMBOL"]
          out=audit_market(Path(f"evidence/{sym}/market-evidence-1095d.json"))
          Path(f"artifacts/{sym}-three-families-full.json").write_text(
              json.dumps(out,sort_keys=True,separators=(",",":")),encoding="utf-8"
          )
          summary={k:out[k] for k in (
              "schema","market","counts","counts_per_calendar_year",
              "structural_proof_only","source_poi_priority_fully_reconstructed",
              "cognitive_ready","authorized_orders","fills",
              "pnl_evaluated","sealed_7y_accessed"
          )}
          Path(f"artifacts/{sym}-three-families-summary.json").write_text(
              json.dumps(summary,sort_keys=True,indent=2),encoding="utf-8"
          )
          print(json.dumps(summary,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vt08-a-three-family-fvg-swing-${{ matrix.symbol }}-${{ github.sha }}
          path: artifacts/*
          retention-days: 30
          if-no-files-found: error
