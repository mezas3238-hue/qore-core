name: QORE VT31 NAS100 Specialist R1 Consumed WFO

on:
  push:
    branches:
      - agent/vt31-nas100-intelligence-pilot-001
    paths:
      - scripts/vt31_nas100_specialist_r1_candidate.py
      - src/qore/infrastructure/traders/vt31_nas100_*.py
      - .github/workflows/vt31-nas100-specialist-r1-consumed-wfo.yml
  workflow_dispatch:

concurrency:
  group: -github-workflows-vt31-nas100-specialist-r1-consumed-wfo-yml-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  specialist-fold:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - partition: r8_fresh
            evidence_artifact: 10402199719
            evidence_digest: 9f5df4eba1882cb498b4e3657176f34a7c27083f3ac1af7856ebddf01447f34d
          - partition: r6
            evidence_artifact: 10389112524
            evidence_digest: 9b0f3a05dc76b5dd83e5e3610266484bee1b79595dbbaacdff1d799115ad58b9
          - partition: r5
            evidence_artifact: 10380044761
            evidence_digest: 828335b99cd51c663e3f0f095df5137e881da3d7e8da741da8ca116a0400edf8
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PARTITION: ${{ matrix.partition }}
      EVIDENCE_ARTIFACT: ${{ matrix.evidence_artifact }}
      EVIDENCE_DIGEST: ${{ matrix.evidence_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research runtime
        run: pip install -e .[dev]

      - name: Static and contract validation
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_specialist_r1_candidate.py
          ruff check scripts/vt31_nas100_specialist_r1_candidate.py
          python scripts/vt31_nas100_specialist_r1_candidate.py --self-test

      - name: Recover immutable consumed NAS100 fold
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${EVIDENCE_ARTIFACT}/zip" > evidence.zip
          echo "${EVIDENCE_DIGEST}  evidence.zip" | sha256sum -c -
          mkdir evidence
          unzip -q evidence.zip -d evidence
          if [ -f evidence/SHA256SUMS ]; then
            (cd evidence && sha256sum -c SHA256SUMS)
          fi
          test -f evidence/fresh/NAS100/market-evidence.json

      - name: Replay intelligent NAS100 specialist
        run: |
          set -euo pipefail
          mkdir result
          python scripts/vt31_nas100_specialist_r1_candidate.py             evidence/fresh/NAS100/market-evidence.json             --output "result/vt31-nas100-specialist-r1-${PARTITION}.json"             | tee result/summary.json

      - name: Development gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p=os.environ["PARTITION"]
          payload=json.loads(Path(f"result/vt31-nas100-specialist-r1-{p}.json").read_text())
          assert payload["candidate_id"] == "VT31_NAS100_SPECIALIST_R1"
          assert payload["research_only"] is True
          assert payload["candidate_frozen"] is False
          assert payload["opens_new_holdout"] is False
          assert payload["live_authorized"] is False
          assert payload["production_authorized"] is False
          runtime=payload["contract"]["runtime_intelligence"]
          assert runtime["date_level_cibo_lookup"] is False
          assert runtime["future_bar_lookup"] is False
          assert runtime["cross_index_required"] is False
          for trace in payload["reasoning_trace"]:
              assert trace["outcome_fields_used_for_decision"] is False
          Path("result/development-gates.json").write_text(
              json.dumps({
                  "passes": payload["passes_development_gates"],
                  "gates": payload["development_gates"],
              }, sort_keys=True, indent=2) + "\n"
          )
          print(json.dumps({
              "partition": p,
              "stress": payload["stress_0_05r"],
              "mc": payload["monte_carlo"],
              "target_plan_counts": payload["target_plan_counts"],
          }, sort_keys=True))
          PY

      - name: Bind immutable result
        run: |
          set -euo pipefail
          echo "${GITHUB_SHA}" > result/git-sha.txt
          echo "${EVIDENCE_ARTIFACT} sha256:${EVIDENCE_DIGEST}" > result/evidence-source.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-specialist-r1-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Development promotion gate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          partition = os.environ["PARTITION"]
          payload = json.loads(
              Path(
                  f"result/vt31-nas100-specialist-r1-{partition}.json"
              ).read_text()
          )
          assert payload["passes_development_gates"] is True, (
              payload["development_gates"]
          )
          PY
