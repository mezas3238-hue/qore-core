name: QORE Turtle Soup XAUUSD R22 Subtype Resolved Full CIBO Brain

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-xauusd-r3-forensics-001
    paths:
      - '.github/workflows/turtle-soup-xauusd-r22-subtype-resolved-full-cibo-brain.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r22_subtype_resolved_full_cibo_brain.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r22_subtype_resolved_full_cibo_brain.py'

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-XAUUSD-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-XAUUSD-2f510461b3360e91d5ee70a72716a76cd6561f16'
  DOSSIER_RUN_ID: '35291722997'
  DOSSIER_ARTIFACT: 'qore-cibo-xauusd-market-intelligence-v1-8068f78df709b9a1702f14264f76c653140c9c1f'
  R21_RUN_ID: '35294750075'
  R21_ARTIFACT: 'qore-turtle-soup-xauusd-r21-subtype-memory-621653ed66b95b46d46730f123ec7172062c4145'
  R20_RUN_ID: '35293022991'
  R20_ARTIFACT: 'qore-turtle-soup-xauusd-r20-adaptive-cibo-trailing-e0274afcdd7f257054e4678838bed7ec4bc8a982'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check --ignore E501,I001 \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r22_subtype_resolved_full_cibo_brain.py \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r22_subtype_resolved_full_cibo_brain.py
      - name: Mypy focused gate
        run: |
          mypy --disable-error-code attr-defined \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r22_subtype_resolved_full_cibo_brain.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r22_subtype_resolved_full_cibo_brain.py

  replay-2y:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable consumed XAUUSD M5 corpus
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download immutable consumed XAUUSD Target Destination V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Download official CIBO XAUUSD 10Y intelligence dossier
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.DOSSIER_ARTIFACT }}
          path: cibo-dossier
          github-token: ${{ github.token }}
          run-id: ${{ env.DOSSIER_RUN_ID }}
      - name: Download frozen R21 subtype memory
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.R21_ARTIFACT }}
          path: r21-subtypes
          github-token: ${{ github.token }}
          run-id: ${{ env.R21_RUN_ID }}
      - name: Download immutable R20 reference
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.R20_ARTIFACT }}
          path: r20-reference
          github-token: ${{ github.token }}
          run-id: ${{ env.R20_RUN_ID }}
      - name: Run subtype-resolved 2Y replay
        run: |
          mkdir -p r22-output
          python -m qore.infrastructure.trader_lab.turtle_soup_xauusd_r22_subtype_resolved_full_cibo_brain \
            source-xauusd target-xauusd cibo-dossier r21-subtypes r20-reference r22-output \
            > r22-output/stdout.json
          printf '%s\n' "$GITHUB_SHA" > r22-output/git-sha.txt
      - name: Enforce subtype resolution and governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('r22-output/r22-subtype-resolved-report.json').read_text())
          assert p['identity']=='TURTLE_SOUP_XAUUSD_R22_SUBTYPE_RESOLVED_FULL_CIBO_BRAIN_V1'
          assert p['window']['open']=='2024-09-17T00:00:00+00:00'
          assert p['window']['close']=='2026-09-17T00:00:00+00:00'
          assert p['reproduction']['retained_bars']==707716
          s=p['subtype_memory']
          assert s['stable_recoverable_signatures']==23
          assert s['stable_wait_signatures']==0
          assert s['stable_abstain_signatures']==5
          assert s['unresolved_is_forced_entry'] is False
          d=p['decision_contract']
          assert d['cautious_mixed_use_subtype_gate'] is True
          assert d['generic_retest_for_unresolved'] is False
          assert d['r11_known_invalid_respected'] is True
          assert d['r11_conflicted_respected'] is True
          assert d['pnl_used_for_subtype_decision'] is False
          assert p['behavior']['executed_trades'] > 0
          g=p['governance']
          assert g['fresh_holdout_consumed'] is False
          assert g['candidate_promoted'] is False
          assert g['live_authorized'] is False
          assert g['real_capital_authorized'] is False
          PY
      - name: Hash immutable R22 result
        run: |
          cd r22-output
          sha256sum \
            r22-subtype-resolved-report.json \
            r22-subtype-resolved-trades.json \
            stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-xauusd-r22-subtype-resolved-${{ github.sha }}
          path: r22-output
          if-no-files-found: error
          retention-days: 90
