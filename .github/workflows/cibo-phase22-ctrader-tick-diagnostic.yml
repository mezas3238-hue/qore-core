name: QORE CIBO Phase22 cTrader Tick Diagnostic

on:
  push:
    branches:
      - agent/cibo-certification-architect-b-integration-001
    paths:
      - '.github/workflows/cibo-phase22-ctrader-tick-diagnostic.yml'
      - 'scripts/cibo_phase22_ctrader_tick_diagnostic.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
  QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,ctrader]'
      - name: Quality
        run: |
          ruff check scripts/cibo_phase22_ctrader_tick_diagnostic.py
          mypy --disable-error-code=import-untyped \
            scripts/cibo_phase22_ctrader_tick_diagnostic.py
      - name: Verify DEMO credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            QORE_CTRADER_CLIENT_ID \
            QORE_CTRADER_CLIENT_SECRET \
            QORE_CTRADER_ACCESS_TOKEN \
            QORE_CTRADER_REFRESH_TOKEN
          do
            test -n "${!name:-}" || exit 2
          done
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            echo "::add-mask::$account_id"
            printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          fi
      - name: Probe historical ticks read-only
        run: |
          mkdir -p phase22-tick-diagnostic
          python scripts/cibo_phase22_ctrader_tick_diagnostic.py \
            --output phase22-tick-diagnostic/tick-diagnostic.json \
            > phase22-tick-diagnostic/stdout.json
      - name: Enforce read-only provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(
              Path("phase22-tick-diagnostic/tick-diagnostic.json")
              .read_text(encoding="utf-8")
          )
          assert p["status"] == "COMPLETE"
          assert p["environment"] == "demo"
          assert p["broker_mutation_performed"] is False
          assert p["holdout_outcomes_used"] is False
          assert p["fundednext_touched"] is False
          assert p["vps_touched"] is False
          assert p["live_authorized"] is False
          assert p["real_capital_authorized"] is False
          PY
      - name: Seal diagnostic
        run: |
          printf '%s\n' "$GITHUB_SHA" > phase22-tick-diagnostic/git-sha.txt
          cd phase22-tick-diagnostic
          sha256sum tick-diagnostic.json stdout.json git-sha.txt > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-phase22-tick-diagnostic-${{ github.sha }}
          path: phase22-tick-diagnostic
          if-no-files-found: error
          retention-days: 90
