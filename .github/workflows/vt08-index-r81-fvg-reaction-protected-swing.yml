name: VT08 Index R81 FVG Reaction Protected Swing

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r81-fvg-reaction-protected-swing.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r81_fvg_reaction_protected_swing.py
      - tests/infrastructure/trader_lab/test_vt08_index_r81_fvg_reaction_protected_swing.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r81_fvg_reaction_protected_swing.py

  research:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R81 FVG-reaction Protected-Swing falsification
        run: |
          python -m qore.infrastructure.trader_lab.vt08_index_r81_fvg_reaction_protected_swing \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r81-fvg-reaction-protected-swing.json

      - name: Verify R81 source-bound architecture and governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r81-fvg-reaction-protected-swing.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R81_FVG_REACTION_PROTECTED_SWING_RECOVERY_001"
          )
          assert report["source_evidence"]["r79"]["run_id"] == 35516202970
          assert report["source_evidence"]["r79"]["artifact_id"] == 10606254504
          assert report["source_evidence"]["r80"]["run_id"] == 35516661428
          assert report["source_evidence"]["r80"]["artifact_id"] == 10607051824

          contract = report["protected_swing_contract"]
          assert contract["family"] == "FVG_REACTION"
          assert contract["requires_post_touch_directional_fvg"] is True
          assert contract["series_must_be_born_on_opposing_fvg_touch"] is True
          assert contract["requires_close_through_original_series_open"] is True
          assert contract["protected_swing_is_series_extreme"] is True
          assert contract["same_existing_continuation_rule"] is True
          assert contract["same_same_c2_body_rule"] is True
          assert contract["canonical_target_r_kept_for_isolation"] == "2.5"
          assert contract["target_grid_searched"] is False

          assert report["five_year"]["canonical_sample"] == 2448
          assert report["recent_two_year"]["canonical_sample"] == 1017
          assert report["r66_failed_holdout"]["canonical_sample"] == 773
          assert report["decision"] == (
              "R81_FVG_REACTION_PS_FALSIFICATION_COMPLETE_NO_CANDIDATE"
          )

          governance = report["governance"]
          assert governance["research_only"] is True
          assert governance["fresh_holdout_claim"] is False
          assert governance["single_source_bound_ps_family"] is True
          assert governance["future_information_used"] is False
          assert governance["generic_persistent_cisd_reused"] is False
          assert governance["fvg_reaction_required"] is True
          assert governance["canonical_signals_suppressed"] is False
          assert governance["daily_bias_changed"] is False
          assert governance["anchors_changed"] is False
          assert governance["target_changed"] is False
          assert governance["candidate_created"] is False
          assert governance["trader_certified"] is False
          assert governance["live_authorized"] is False
          assert governance["real_capital_authorized"] is False
          assert governance["production_authorized"] is False
          PY

      - name: Upload R81 evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r81-fvg-reaction-protected-swing-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: warn
          retention-days: 90
