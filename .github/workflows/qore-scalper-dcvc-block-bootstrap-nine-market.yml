name: Scalper DCVC Paired Block Bootstrap Native 9-Market

on:
  push:
    branches:
      - research/scalper-dcvc-causal-conditional-edge-20261010
    paths:
      - '.github/workflows/qore-scalper-dcvc-block-bootstrap-nine-market.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_dcvc_block_bootstrap_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_scalper_dcvc_block_bootstrap_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN: '38107014488'
  SOURCE_SHA: '9d1f073960d4a422a40f8c982ec312f115f95af7'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Static quality and time-dependence negative fixtures
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_scalper_dcvc_block_bootstrap_v1.py tests/infrastructure/trader_lab/test_capitalizer_scalper_dcvc_block_bootstrap_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_scalper_dcvc_block_bootstrap_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_scalper_dcvc_block_bootstrap_v1.py
      - uses: actions/download-artifact@v4
        with:
          pattern: scalper-dcvc-source-*-${{ env.SOURCE_SHA }}
          path: original-nine
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
      - uses: actions/download-artifact@v4
        with:
          name: scalper-dcvc-abc-scientific-nine-market-${{ env.SOURCE_SHA }}
          path: selected-abc
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
      - name: Paired 5 observed-day block resamples, frozen labels/decisions
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_dcvc_block_bootstrap_v1 original-nine selected-abc bootstrap-report
      - name: No OOS, no bid ask, no full cognition or certification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("bootstrap-report/dcvc-conditional-edge-block-bootstrap.json").read_text())
          assert x["draws"]==500 and x["block_size_observed_days"]==5
          assert x["paired_original_baseline_n"]==2020 and x["dcvc_selected_n"]==266
          assert x["block_dependence_respected"] and not x["bootstrap_used_in_causal_selection"]
          assert not x["confirmatory_OOS"] and not x["broker_costs_physically_proven"]
          assert not x["C_full_master_frame_executed"] and not x["certified"]
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-dcvc-9market-conditional-block-bootstrap-${{ github.sha }}
          path: bootstrap-report/
          retention-days: 90
          if-no-files-found: error
