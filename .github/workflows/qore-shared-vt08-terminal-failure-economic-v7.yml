name: QORE Shared VT08 Terminal Failure Economic Shadow V7

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - scripts/vt08_index_shared_terminal_failure_economic_shadow_v7.py
      - scripts/vt08_index_shared_stop_target_discrimination_v6.py
      - src/qore/infrastructure/core_stack_v2/**
      - tests/infrastructure/test_core_stack_v2_terminal_failure_confirmation.py
      - .github/workflows/qore-shared-vt08-terminal-failure-economic-v7.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  shared-vt08-terminal-economic-v7:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout Shared
        uses: actions/checkout@v4
        with:
          path: shared

      - name: Checkout VT08 Index PR604 source branch
        uses: actions/checkout@v4
        with:
          ref: agent/vt08-index-deep-behavior-lab-final
          path: vt08

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compose VT08 falsification surface with Shared terminal stack
        run: |
          set -euo pipefail
          mkdir -p vt08/src/qore/infrastructure/core_stack_v2 vt08/scripts
          : > vt08/src/qore/infrastructure/core_stack_v2/__init__.py
          for file in \
            contracts.py \
            intelligence.py \
            analog_memory.py \
            competing_future_intelligence.py \
            competing_risk_decision_gate.py \
            competing_risk_path_core.py \
            drawdown_phenotype_memory.py \
            environment_intelligence.py \
            future_geometry_intelligence.py \
            instinct_intelligence.py \
            journey_intelligence.py \
            path_intelligence.py \
            perception_engine.py \
            realtime_trade_management.py \
            recovery_failure_intelligence.py \
            terminal_failure_confirmation.py \
            resident_convergence_intelligence.py \
            stop_target_discrimination.py \
            stability_intelligence.py \
            transition_intelligence.py
          do
            cp "shared/src/qore/infrastructure/core_stack_v2/$file" \
               "vt08/src/qore/infrastructure/core_stack_v2/$file"
          done
          cp shared/scripts/vt08_index_shared_cognitive_challenge_v2.py \
             vt08/scripts/vt08_index_shared_cognitive_challenge_v2.py
          cp shared/scripts/vt08_index_shared_full_stack_no_sizing_v3.py \
             vt08/scripts/vt08_index_shared_full_stack_no_sizing_v3.py
          cp shared/scripts/vt08_index_shared_stop_target_discrimination_v6.py \
             vt08/scripts/vt08_index_shared_stop_target_discrimination_v6.py
          cp shared/scripts/vt08_index_shared_terminal_failure_economic_shadow_v7.py \
             vt08/scripts/vt08_index_shared_terminal_failure_economic_shadow_v7.py

      - name: Install composite research tree
        run: |
          cd vt08
          pip install -e ".[dev]"

      - name: Static validation
        run: |
          cd vt08
          ruff check scripts/vt08_index_shared_terminal_failure_economic_shadow_v7.py
          python -m py_compile scripts/vt08_index_shared_terminal_failure_economic_shadow_v7.py
          ruff check src/qore/infrastructure/core_stack_v2/terminal_failure_confirmation.py
          python -m py_compile src/qore/infrastructure/core_stack_v2/terminal_failure_confirmation.py

      - name: Enforce terminal confirmation contract
        run: |
          cd shared
          PYTHONPATH=src pytest -q \
            tests/infrastructure/test_core_stack_v2_terminal_failure_confirmation.py \
            tests/infrastructure/test_core_stack_v2_competing_risk_path_core.py \
            tests/infrastructure/test_core_stack_v2_recovery_failure_intelligence.py

      - name: Download NAS100 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: vt08/artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: vt08/artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: vt08/artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Run terminal failure economic shadow
        run: |
          set -euo pipefail
          cd vt08
          mkdir -p artifacts/shared-terminal-economic-v7
          python scripts/vt08_index_shared_terminal_failure_economic_shadow_v7.py \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/shared-terminal-economic-v7/vt08-index-shared-terminal-economic-v7.json \
            | tee artifacts/shared-terminal-economic-v7/summary.json

      - name: Validate economic shadow contract
        run: |
          cd vt08
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(
              Path(
                  "artifacts/shared-terminal-economic-v7/"
                  "vt08-index-shared-terminal-economic-v7.json"
              ).read_text()
          )
          assert p["identity"] == "QORE_SHARED_VT08_INDEX_TERMINAL_FAILURE_ECONOMIC_SHADOW_V7"
          c=p["challenge"]
          assert c["source_pr"] == 604
          assert c["source_head"] == "5e307ff861df136b92d857693997d8fb950f4d79"
          assert c["shared_is_only_cognitive_engine"] is True
          assert c["vt08_cognition_used_by_shared"] is False
          assert c["vt31_cognition_used_by_shared"] is False
          assert c["same_opportunity_universe"] is True
          assert c["same_initial_position_size"] is True
          assert c["sizing_used"] is False
          assert c["trailing_used"] is False
          assert c["target_extension_used"] is False

          expected={
              "five_year":2448,
              "recent_two_year":1017,
              "r66_consumed_failed_holdout":773,
          }
          for key,sample in expected.items():
              w=p[key]
              assert w["sample"] == sample
              assert w["canonical_expected"] == sample
              assert w["density_retained_shadow"] == "1"
              phase=w["phase_1_contract"]
              assert phase["shadow_only"] is True
              assert phase["same_trade_count"] is True
              assert phase["same_initial_position_size"] is True
              assert phase["sizing_used"] is False
              assert phase["risk_weighting_used"] is False
              assert phase["signal_suppression_used"] is False
              assert phase["stop_mutation_used"] is False
              assert phase["target_mutation_used"] is False
              assert phase["trailing_used"] is False
              assert phase["target_extension_used"] is False
              assert phase["terminal_confirmation_only_exit_change"] is True
              assert "primary_profit_factor" in w["economic_delta"]
              assert "primary_conservative_mtm_dd_improvement_r" in w["economic_delta"]
              assert "net_shadow_utility_r" in w

          g=p["governance"]
          assert g["research_only"] is True
          assert g["consumed_evidence_only"] is True
          assert g["fresh_holdout_opened"] is False
          assert g["live_authorized"] is False
          assert g["production_authorized"] is False
          assert g["real_capital_authorized"] is False
          assert g["merge_authorized"] is False
          PY

      - name: Bind result
        run: |
          cd vt08/artifacts/shared-terminal-economic-v7
          echo "$GITHUB_SHA" > shared-git-sha.txt
          echo "5e307ff861df136b92d857693997d8fb950f4d79" > vt08-pr604-head.txt
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-vt08-terminal-economic-v7-${{ github.sha }}
          path: vt08/artifacts/shared-terminal-economic-v7/
          if-no-files-found: error
          retention-days: 90
