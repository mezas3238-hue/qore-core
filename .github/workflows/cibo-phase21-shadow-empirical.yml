name: QORE CIBO Phase21 Shadow Empirical Screen

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cibo-certification-architect-b-integration-001
    paths:
      - '.github/workflows/cibo-phase21-shadow-empirical.yml'
      - 'src/qore/infrastructure/cibo_ce2i_phase21_historical_shadow.py'
      - 'scripts/cibo_phase21_historical_shadow_empirical.py'
      - 'tests/infrastructure/test_cibo_ce2i_phase21_historical_shadow.py'
      - 'docs/research/CIBO-PHASE21-HISTORICAL-SHADOW-SCREEN-V1.md'
  pull_request:
    paths:
      - '.github/workflows/cibo-phase21-shadow-empirical.yml'
      - 'src/qore/infrastructure/cibo_ce2i_phase21_historical_shadow.py'
      - 'scripts/cibo_phase21_historical_shadow_empirical.py'
      - 'tests/infrastructure/test_cibo_ce2i_phase21_historical_shadow.py'
      - 'docs/research/CIBO-PHASE21-HISTORICAL-SHADOW-SCREEN-V1.md'

permissions:
  contents: read
  actions: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  GH_TOKEN: ${{ github.token }}

jobs:
  phase21-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install -e '.[dev]'

      - name: Quality
        run: |
          ruff check \
            src/qore/infrastructure/cibo_ce2i_phase21_historical_shadow.py \
            scripts/cibo_phase21_historical_shadow_empirical.py \
            tests/infrastructure/test_cibo_ce2i_phase21_historical_shadow.py
          mypy \
            src/qore/infrastructure/cibo_ce2i_phase21_historical_shadow.py \
            scripts/cibo_phase21_historical_shadow_empirical.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_ce2i_phase21_historical_shadow.py

      - name: Recover immutable seven-lineage Phase18 evidence
        run: |
          set -euo pipefail
          mkdir -p source/{gbpjpy,gbpusd,audjpy,eurusd,xauusd,vt08,vt31}
          mkdir -p phase21-output

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10909937201/zip" > gbpjpy.zip
          echo "b59d8c045a0e86f0e22fb0044dc04eb6dff0f17de4c9f7c7389b903adc443956  gbpjpy.zip" | sha256sum -c -
          unzip -q gbpjpy.zip -d source/gbpjpy

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10910093452/zip" > gbpusd.zip
          echo "93c9c4872543938571eb6ab12e242bde4ec9e7682f056593efde59f88b4579c9  gbpusd.zip" | sha256sum -c -
          unzip -q gbpusd.zip -d source/gbpusd

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10910875686/zip" > audjpy.zip
          echo "7b40e1be53ce0508106b036c68ce4ebb3155bc5c14875144634e365cfb988de5  audjpy.zip" | sha256sum -c -
          unzip -q audjpy.zip -d source/audjpy

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10910397898/zip" > eurusd.zip
          echo "71bb5ce12b7cfc8f2d17b89dcf907b8b74f4a2257f2055adbe9e9d619c324774  eurusd.zip" | sha256sum -c -
          unzip -q eurusd.zip -d source/eurusd

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10910328640/zip" > xauusd.zip
          echo "aade958d597032bad08c56043a6c48c145b8ab263f032f2b65c147fd3db7aadd  xauusd.zip" | sha256sum -c -
          unzip -q xauusd.zip -d source/xauusd

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10913050112/zip" > vt08.zip
          echo "8543a33962d24d3f5346981328df78d145286fc8af9387d73eca85519922f568  vt08.zip" | sha256sum -c -
          unzip -q vt08.zip -d source/vt08

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10912945588/zip" > vt31.zip
          echo "2200392deeb081525720430a816e8f82b18d7333c61a05eb197632ed24849e15  vt31.zip" | sha256sum -c -
          unzip -q vt31.zip -d source/vt31

          for directory in gbpjpy gbpusd audjpy eurusd xauusd vt08 vt31; do
            (cd "source/${directory}" && sha256sum -c SHA256SUMS.txt)
          done

      - name: Run post-TRAIN Phase21 shadow screen
        run: |
          python -m scripts.cibo_phase21_historical_shadow_empirical \
            --gbpjpy source/gbpjpy/phase18-gbpjpy-r38-bound-trades.jsonl \
            --gbpusd source/gbpusd/phase18-gbpusd-r43-bound-trades.jsonl \
            --audjpy source/audjpy/phase18-audjpy-r42-bound-trades.jsonl \
            --eurusd source/eurusd/phase18-eurusd-r38-bound-trades.jsonl \
            --xauusd source/xauusd/phase18-xauusd-r34-bound-trades.jsonl \
            --vt08 source/vt08/phase18-vt08-r315-fundednext-trades.jsonl \
            --vt31 source/vt31/phase18-vt31-v4-bound-trades.jsonl \
            --output phase21-output/phase21-shadow-screen.json \
            > phase21-output/phase21-shadow-stdout.json

      - name: Enforce shadow empirical gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path(
                  "phase21-output/phase21-shadow-screen.json"
              ).read_text(encoding="utf-8")
          )
          screen = payload["screen"]
          assert payload["status"] == "PASS"
          assert screen["passed"] is True
          assert screen["validation_rows"] == 332
          assert screen["selected_outcomes"] == 256
          assert screen["represented_lineages"] == 7
          assert screen["decision_epochs"] >= 80
          assert screen["distinct_trading_days"] >= 20
          assert len(screen["folds"]) == 4
          assert all(row["baseline_outcomes"] >= 40 for row in screen["folds"])
          assert all(row["represented_lineages"] == 7 for row in screen["folds"])
          assert screen["policy"]["realized_delta_ncu"] > "0"
          assert (
              float(screen["policy"]["realized_delta_ncu"])
              >= float(screen["baseline"]["realized_delta_ncu"])
          )
          assert (
              float(screen["policy"]["max_drawdown_ncu"])
              <= float(screen["baseline"]["max_drawdown_ncu"])
          )
          assert screen["monte_carlo"]["simulation_count"] == 1000
          assert (
              float(
                  screen["monte_carlo"][
                      "policy_median_ending_delta_ncu"
                  ]
              )
              >= float(
                  screen["monte_carlo"][
                      "baseline_median_ending_delta_ncu"
                  ]
              )
          )
          assert (
              float(screen["monte_carlo"]["policy_p95_drawdown_ncu"])
              <= float(screen["monte_carlo"]["baseline_p95_drawdown_ncu"])
          )
          assert screen["monte_carlo"]["policy_capacity_breach_paths"] == 0
          assert screen["monte_carlo"]["baseline_capacity_breach_paths"] == 0
          assert payload["governance"]["final_holdout_2017h1_read"] is False
          PY

      - name: Seal evidence
        run: |
          printf '%s\n' "$EVIDENCE_SHA" > phase21-output/git-sha.txt
          cd phase21-output
          sha256sum \
            phase21-shadow-screen.json \
            phase21-shadow-stdout.json \
            git-sha.txt > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-phase21-shadow-${{ env.EVIDENCE_SHA }}
          path: phase21-output
          if-no-files-found: error
          retention-days: 90
