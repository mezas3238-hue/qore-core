name: QORE Capitalizer Cognitive R Milestone Protection 2R V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-cognitive-r-milestone-protection-2r-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_cognitive_r_milestone_protection_2r_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_cognitive_r_milestone_protection_2r_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-cognitive-r-milestone-protection-2r-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  TARGET_RUN_ID: '36077843102'
  TARGET_SHA: 'a47de3b491b4468527c945d6eff3afbbaec82d4e'
  M1_RUN_ID: '35548099334'
  M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_cognitive_r_milestone_protection_2r_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_cognitive_r_milestone_protection_2r_v1.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_cognitive_r_milestone_protection_2r_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_cognitive_r_milestone_protection_2r_v1.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol:
          - USDJPY
          - AUDJPY
          - AUDUSD
          - GBPJPY
          - EURUSD
          - GBPUSD
          - XAUUSD
          - USDCAD
          - NAS100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download corrected target sensitivity ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-max-recovery-target-sensitivity-2y-v2-*-${{ env.TARGET_SHA }}
          path: target-input
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Download immutable provider-native M1
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.M1_SHA }}
          path: m1-input
          github-token: ${{ github.token }}
          run-id: ${{ env.M1_RUN_ID }}
      - name: Run causal R-milestone protection
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cognitive_r_milestone_protection_2r_v1 \
            market target-input m1-input protection-output --symbol "${{ matrix.symbol }}"
      - name: Enforce market invariants
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"]
          report = json.loads(
              (
                  Path("protection-output")
                  / f"capitalizer-{symbol.lower()}-cognitive-r-milestone-protection-2r-v1.json"
              ).read_text()
          )
          assert report["symbol"] == symbol
          assert report["target_r"] == "2.00"
          assert report["market_trades"] > 0
          assert report["original_reproduction_mismatches"] == 0
          assert report["entries_changed"] is False
          assert report["original_stop_changed_at_entry"] is False
          assert report["target_changed"] is False
          assert report["max3_changed"] is False
          assert report["protection_next_bar_only"] is True
          assert report["same_bar_order_inferred"] is False
          assert report["stop_can_widen"] is False
          assert report["mode_selected"] is False
          assert report["trader_certified"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-cognitive-r-milestone-protection-2r-v1-${{ matrix.symbol }}-${{ github.sha }}
          path: protection-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-cognitive-r-milestone-protection-2r-v1-*-${{ github.sha }}
          path: protection-input
          merge-multiple: false
      - name: Build nine-market protection matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cognitive_r_milestone_protection_2r_v1 \
            matrix protection-input matrix-output
      - name: Enforce aggregate controls
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          report = json.loads(
              Path(
                  "matrix-output/"
                  "capitalizer-nine-market-cognitive-r-milestone-protection-2r-v1.json"
              ).read_text()
          )
          assert report["market_count"] == 9
          assert report["trades"] == 948
          assert report["density_retention"] == "1"
          control = report["control_metrics"]
          assert Decimal(control["profit_factor"]) == Decimal(
              "1.466020472120789368123727041"
          )
          assert Decimal(control["total_r"]) == Decimal(
              "153.9927998412621697329314877"
          )
          assert Decimal(control["max_drawdown_r"]) == Decimal(
              "12.93584837435268644582248142"
          )
          assert report["protection_next_bar_only"] is True
          assert report["same_bar_order_inferred"] is False
          assert report["stop_can_widen"] is False
          assert report["mode_selected"] is False
          assert report["automatic_promotion_allowed"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-nine-market-cognitive-r-milestone-protection-2r-v1-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
