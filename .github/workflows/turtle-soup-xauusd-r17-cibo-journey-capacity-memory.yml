name: QORE Turtle Soup XAUUSD R17 CIBO Journey Capacity Memory

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-xauusd-r3-forensics-001
    paths:
      - '.github/workflows/turtle-soup-xauusd-r17-cibo-journey-capacity-memory.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r17_cibo_journey_capacity_memory.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r17_cibo_journey_capacity_memory.py'

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-XAUUSD-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-XAUUSD-2f510461b3360e91d5ee70a72716a76cd6561f16'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check --ignore E501,I001 \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r17_cibo_journey_capacity_memory.py \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r17_cibo_journey_capacity_memory.py
      - name: Mypy focused gate
        run: |
          mypy --disable-error-code attr-defined \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r17_cibo_journey_capacity_memory.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r17_cibo_journey_capacity_memory.py

  memory:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable consumed XAUUSD M5 corpus
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download immutable consumed XAUUSD Target Destination V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Build structural journey-capacity memory
        run: |
          mkdir -p r17-output
          python -m qore.infrastructure.trader_lab.turtle_soup_xauusd_r17_cibo_journey_capacity_memory \
            source-xauusd target-xauusd r17-output > r17-output/stdout.json
          printf '%s\n' "$GITHUB_SHA" > r17-output/git-sha.txt
      - name: Enforce memory governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('r17-output/r17-capacity-memory-report.json').read_text())
          assert p['identity']=='TURTLE_SOUP_XAUUSD_R17_CIBO_JOURNEY_CAPACITY_MEMORY_V1'
          assert p['reproduction']['retained_bars']==707716
          assert p['reproduction']['routed_setups']==12768
          assert p['reproduction']['unmatched']==4
          assert p['reproduction']['capacity_observations'] > 0
          k=p['knowledge_contract']
          assert k['pnl_used'] is False
          assert k['profit_probability_used'] is False
          assert k['automatic_threshold_search'] is False
          assert k['return_maximising_feature_selection'] is False
          assert k['weekday_is_context_not_rule'] is True
          assert k['session_is_context_not_rule'] is True
          assert k['post_entry_depth_allowed_as_live_input'] is False
          assert k['rule_promoted'] is False
          g=p['governance']
          assert g['fresh_holdout_consumed'] is False
          assert g['no_target_extension_rule_promoted'] is True
          assert g['live_authorized'] is False
          assert g['real_capital_authorized'] is False
          PY
      - name: Hash immutable R17 result
        run: |
          cd r17-output
          sha256sum r17-capacity-memory-report.json r17-capacity-ledger.json stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-xauusd-r17-capacity-memory-${{ github.sha }}
          path: r17-output
          if-no-files-found: error
          retention-days: 90
