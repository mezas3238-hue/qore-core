name: VT08 Index R64 Canonical Economic Binding

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r64-canonical-economic-binding.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r64_canonical_economic_binding.py
      - tests/infrastructure/trader_lab/test_vt08_index_r64_canonical_economic_binding.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r64_canonical_economic_binding.py

  binding:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Build R64 canonical economic binding
        run: |
          python -m qore.infrastructure.trader_lab.vt08_index_r64_canonical_economic_binding \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r64-canonical-economic-binding.json

      - name: Verify exact reconciliation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r64-canonical-economic-binding.json"
              ).read_text()
          )
          assert report["decision"] == (
              "PASS_R64_CANONICAL_BINDING_CONTINUE_LIFECYCLE"
          )
          assert report["reconciliation"]["five_year_sample"] == 2448
          assert report["reconciliation"]["recent_two_year_sample"] == 1017
          assert report["reconciliation"]["combined_sample"] == 3465
          assert report["reconciliation"]["total_r_exact_match"] is True
          assert report["canonical_binding"]["markets"] == [
              "NAS100", "SP500", "US30"
          ]
          assert report["governance"]["candidate_retuned"] is False
          assert report["governance"]["trader_certified"] is False
          assert report["governance"]["live_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-index-r64-canonical-economic-binding-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
