name: QORE CIBO Cognitive Semantic Remediation

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cibo-function-economic-sensors-001
    paths:
      - '.github/workflows/cibo-cognitive-semantic-remediation.yml'
      - 'src/qore/infrastructure/cibo_native_max_cognitive_episode.py'
      - 'src/qore/infrastructure/cibo_cognitive_reach_sensors.py'
      - 'src/qore/infrastructure/cibo_single_account_manifest_economics.py'
      - 'tests/infrastructure/test_cibo_native_maximum_intelligence.py'
      - 'tests/infrastructure/test_cibo_cognitive_reach_sensors.py'
      - 'tests/infrastructure/test_cibo_single_account_manifest_economics.py'

permissions:
  contents: read

concurrency:
  group: qore-cibo-cognitive-semantic-remediation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-cognitive-remediation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Compile and lint cognitive remediation
        run: |
          set -euo pipefail
          python -m py_compile             src/qore/infrastructure/cibo_native_max_cognitive_episode.py             src/qore/infrastructure/cibo_cognitive_reach_sensors.py             src/qore/infrastructure/cibo_single_account_manifest_economics.py
          ruff check             src/qore/infrastructure/cibo_native_max_cognitive_episode.py             src/qore/infrastructure/cibo_cognitive_reach_sensors.py             src/qore/infrastructure/cibo_single_account_manifest_economics.py             tests/infrastructure/test_cibo_native_maximum_intelligence.py             tests/infrastructure/test_cibo_cognitive_reach_sensors.py             tests/infrastructure/test_cibo_single_account_manifest_economics.py

      - name: Prove semantic cognition and sensor truth
        run: |
          set -euo pipefail
          pytest -q --no-cov             tests/infrastructure/test_cibo_native_maximum_intelligence.py             tests/infrastructure/test_cibo_cognitive_reach_sensors.py             tests/infrastructure/test_cibo_single_account_manifest_economics.py
