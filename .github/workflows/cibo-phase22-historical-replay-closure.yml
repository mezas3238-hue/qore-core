name: QORE CIBO Phase22 Historical Replay Closure Contract

on:
  push:
    branches:
      - agent/cibo-integrator-ab-001
    paths:
      - '.github/workflows/cibo-phase22-historical-replay-closure.yml'
      - 'src/qore/infrastructure/cibo_phase22_historical_policy_replay.py'
      - 'src/qore/infrastructure/cibo_phase22_historical_replay_sealing.py'
      - 'src/qore/infrastructure/cibo_phase22_historical_replay_settlement.py'
      - 'src/qore/infrastructure/cibo_phase22_historical_replay_stores.py'
      - 'src/qore/infrastructure/cibo_phase22_store_bundle.py'
      - 'src/qore/infrastructure/cibo_phase22_store_contract.py'
      - 'src/qore/infrastructure/cibo_phase22_one_shot_batch.py'
      - 'src/qore/infrastructure/cibo_phase22_one_shot_guard.py'
      - 'src/qore/infrastructure/cibo_phase22_consumption_ledger.py'
      - 'src/qore/infrastructure/cibo_ce2i_phase22_holdout_gate.py'
      - 'tests/infrastructure/test_cibo_phase22_historical_policy_replay.py'
      - 'tests/infrastructure/test_cibo_phase22_historical_replay_sealing.py'
      - 'tests/infrastructure/test_cibo_phase22_historical_replay_settlement.py'
      - 'tests/infrastructure/test_cibo_phase22_historical_replay_stores.py'
      - 'tests/infrastructure/test_cibo_ce2i_phase22_qualification.py'
      - 'tests/infrastructure/test_cibo_phase22_one_shot_batch.py'
      - 'tests/infrastructure/test_cibo_phase22_one_shot_guard.py'
      - 'tests/infrastructure/test_cibo_phase22_consumption_ledger.py'
      - 'tests/infrastructure/test_cibo_phase22_store_contract.py'
  pull_request:
    paths:
      - '.github/workflows/cibo-phase22-historical-replay-closure.yml'
      - 'src/qore/infrastructure/cibo_phase22_historical_replay_sealing.py'
      - 'src/qore/infrastructure/cibo_phase22_historical_replay_stores.py'
      - 'src/qore/infrastructure/cibo_phase22_historical_replay_settlement.py'
      - 'src/qore/infrastructure/cibo_ce2i_phase22_holdout_gate.py'

permissions:
  contents: read

concurrency:
  group: cibo-phase22-historical-replay-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Validate crash-safe historical replay closure
        run: |
          ruff check             src/qore/infrastructure/cibo_phase22_historical_replay_sealing.py             src/qore/infrastructure/cibo_phase22_historical_replay_stores.py             src/qore/infrastructure/cibo_phase22_historical_replay_settlement.py             src/qore/infrastructure/cibo_phase22_store_bundle.py             src/qore/infrastructure/cibo_ce2i_phase22_holdout_gate.py             tests/infrastructure/test_cibo_phase22_historical_replay_sealing.py             tests/infrastructure/test_cibo_phase22_historical_replay_stores.py
          mypy             src/qore/infrastructure/cibo_phase22_historical_replay_sealing.py             src/qore/infrastructure/cibo_phase22_historical_replay_stores.py
          pytest -q --no-cov             tests/infrastructure/test_cibo_phase22_historical_policy_replay.py             tests/infrastructure/test_cibo_phase22_historical_replay_sealing.py             tests/infrastructure/test_cibo_phase22_historical_replay_settlement.py             tests/infrastructure/test_cibo_phase22_historical_replay_stores.py             tests/infrastructure/test_cibo_ce2i_phase22_qualification.py             tests/infrastructure/test_cibo_phase22_one_shot_batch.py             tests/infrastructure/test_cibo_phase22_one_shot_guard.py             tests/infrastructure/test_cibo_phase22_consumption_ledger.py             tests/infrastructure/test_cibo_phase22_store_contract.py
