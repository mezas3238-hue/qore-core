name: CIBO USD60 6M Full Architecture Integrated V5

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cibo-60usd-6m-full-architecture-v5-001
    paths:
      - '.github/workflows/cibo-60usd-6m-full-architecture-v5.yml'
      - 'scripts/cibo_60usd_6m_full_architecture_v5.py'
      - 'scripts/cibo_full_architecture_v4_probe.py'
      - 'src/qore/infrastructure/cibo_*.py'

permissions:
  contents: read
  actions: read

env:
  EVIDENCE_SHA: ${{ github.sha }}
  GH_TOKEN: ${{ github.token }}

jobs:
  integrated-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Quality
        run: |
          ruff check             scripts/cibo_60usd_6m_full_architecture_v5.py             scripts/cibo_full_architecture_v4_probe.py
          python -m py_compile             scripts/cibo_60usd_6m_full_architecture_v5.py             scripts/cibo_full_architecture_v4_probe.py

      - name: Functional coverage of every currently executable CIBO contract
        run: |
          mkdir -p experiment-output
          python scripts/cibo_full_architecture_v4_probe.py             --output experiment-output/full-architecture-probe.json             > experiment-output/full-architecture-probe-stdout.json

      - name: Recover immutable seven-Trader Phase18 evidence
        run: |
          set -euo pipefail
          mkdir -p source/{gbpjpy,gbpusd,audjpy,eurusd,xauusd,vt08,vt31}

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10909937201/zip" > gbpjpy.zip
          echo "b59d8c045a0e86f0e22fb0044dc04eb6dff0f17de4c9f7c7389b903adc443956  gbpjpy.zip" | sha256sum -c -
          unzip -q gbpjpy.zip -d source/gbpjpy

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10910093452/zip" > gbpusd.zip
          echo "93c9c4872543938571eb6ab12e242bde4ec9e7682f056593efde59f88b4579c9  gbpusd.zip" | sha256sum -c -
          unzip -q gbpusd.zip -d source/gbpusd

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10910875686/zip" > audjpy.zip
          echo "7b40e1be53ce0508106b036c68ce4ebb3155bc5c14875144634e365cfb988de5  audjpy.zip" | sha256sum -c -
          unzip -q audjpy.zip -d source/audjpy

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10910397898/zip" > eurusd.zip
          echo "71bb5ce12b7cfc8f2d17b89dcf907b8b74f4a2257f2055adbe9e9d619c324774  eurusd.zip" | sha256sum -c -
          unzip -q eurusd.zip -d source/eurusd

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10910328640/zip" > xauusd.zip
          echo "aade958d597032bad08c56043a6c48c145b8ab263f032f2b65c147fd3db7aadd  xauusd.zip" | sha256sum -c -
          unzip -q xauusd.zip -d source/xauusd

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10913050112/zip" > vt08.zip
          echo "8543a33962d24d3f5346981328df78d145286fc8af9387d73eca85519922f568  vt08.zip" | sha256sum -c -
          unzip -q vt08.zip -d source/vt08

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10912945588/zip" > vt31.zip
          echo "2200392deeb081525720430a816e8f82b18d7333c61a05eb197632ed24849e15  vt31.zip" | sha256sum -c -
          unzip -q vt31.zip -d source/vt31

          for directory in gbpjpy gbpusd audjpy eurusd xauusd vt08 vt31; do
            (cd "source/${directory}" && sha256sum -c SHA256SUMS.txt)
          done

      - name: Run integrated six-month V5
        run: |
          python scripts/cibo_60usd_6m_full_architecture_v5.py             --gbpjpy source/gbpjpy/phase18-gbpjpy-r38-bound-trades.jsonl             --gbpusd source/gbpusd/phase18-gbpusd-r43-bound-trades.jsonl             --audjpy source/audjpy/phase18-audjpy-r42-bound-trades.jsonl             --eurusd source/eurusd/phase18-eurusd-r38-bound-trades.jsonl             --xauusd source/xauusd/phase18-xauusd-r34-bound-trades.jsonl             --vt08 source/vt08/phase18-vt08-r315-fundednext-trades.jsonl             --vt31 source/vt31/phase18-vt31-v4-bound-trades.jsonl             --start 2022-01-01T00:00:00+00:00             --end 2022-07-01T00:00:00+00:00             --output-dir experiment-output             > experiment-output/replay-v5-stdout.json

      - name: Verify V5 invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          probe = json.loads(
              Path("experiment-output/full-architecture-probe.json").read_text()
          )
          report = json.loads(
              Path("experiment-output/report-v5.json").read_text()
          )
          assert probe["all_currently_executable_tools_exercised"] is True
          assert report["experiment_id"] == (
              "CIBO_60USD_6M_FULL_ARCHITECTURE_INTEGRATED_V5"
          )
          p = report["portfolio"]
          assert p["opportunities"] == 541
          assert p["opportunities_forwarded_to_cibo"] == 541
          expected = {
              "R38_GBPJPY": 92,
              "R43_GBPUSD": 95,
              "R42_AUDJPY": 87,
              "R38_EURUSD": 82,
              "R34_XAUUSD": 79,
              "VT08_FOREX": 31,
              "VT31_NAS100": 75,
          }
          assert len(report["per_trader"]) == 7
          for trader, count in expected.items():
              row = report["per_trader"][trader]
              assert row["opportunities"] == count
              assert row["opportunities_forwarded_to_cibo"] == count

          for code in ("T01", "T05"):
              assert report["tool_execution_counts"][code] > 0
          assert report["evidence_boundary"]["t07_pnl_active"] is False
          assert report["evidence_boundary"]["t14_pnl_active"] is False

          ledger = [
              json.loads(line)
              for line in Path(
                  "experiment-output/trade-ledger-v5.jsonl"
              ).read_text().splitlines()
              if line.strip()
          ]
          entry_rows = [row for row in ledger if row["event"] == "ENTRY"]
          assert len(entry_rows) == 541
          PY

      - name: Build combined V5 report
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          probe = json.loads(
              Path("experiment-output/full-architecture-probe.json").read_text()
          )
          replay = json.loads(
              Path("experiment-output/report-v5.json").read_text()
          )
          combined = {
              "schema": "qore.cibo.research.full-architecture-v5.bundle",
              "git_sha": os.environ["EVIDENCE_SHA"],
              "functional_architecture_probe": probe,
              "integrated_economic_replay": replay,
          }
          Path("experiment-output/V5-FULL-REPORT.json").write_text(
              json.dumps(combined, indent=2, sort_keys=True) + "\n"
          )
          PY
          cat experiment-output/V5-SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Seal V5 evidence
        run: |
          printf '%s\n' "$EVIDENCE_SHA" > experiment-output/git-sha.txt
          cd experiment-output
          sha256sum             full-architecture-probe.json             full-architecture-probe-stdout.json             report-v5.json             trade-ledger-v5.jsonl             per-trader-v5.csv             V5-SUMMARY.md             V5-FULL-REPORT.json             replay-v5-stdout.json             v5-profit-capital-ledger.json             v5-released-risk-ledger.json             git-sha.txt > V5-SHA256SUMS.txt
          sha256sum -c V5-SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cibo-60usd-6m-full-architecture-integrated-v5-${{ env.EVIDENCE_SHA }}
          path: experiment-output
          if-no-files-found: error
          retention-days: 90
