name: QORE Native 29 markets - 27 plus CADJPY CADCHF M5 G0 only

on:
  push:
    branches:
      - research/qore-native-cohort29-cad-candidates-g0-20261012
    paths:
      - '.github/workflows/qore-native-cohort29-source-g0.yml'
      - 'src/qore/infrastructure/trader_lab/qore_native_cohort29_cadjpy_cadchf_m5_g0_v1.py'
      - 'tests/infrastructure/trader_lab/test_qore_native_cohort29_cadjpy_cadchf_m5_g0_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-native29-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Fixed roster, digest and no economic data
        run: |
          ruff check --select F,E4,E7,E9 src/qore/infrastructure/trader_lab/qore_native_cohort29_cadjpy_cadchf_m5_g0_v1.py tests/infrastructure/trader_lab/test_qore_native_cohort29_cadjpy_cadchf_m5_g0_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_qore_native_cohort29_cadjpy_cadchf_m5_g0_v1.py

  source_sha_year_11:
    needs: source_contract
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        symbol: [CADJPY, CADCHF]
    env:
      SYMBOL: ${{ matrix.symbol }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download original read-only IC Markets DEMO M5 10Y capture
        uses: actions/download-artifact@v4
        with:
          name: qore-native-icmarkets-10Y-provider-M5-${{ matrix.symbol }}-e0ca5a13c866a19d8505c68cffc473598984b340
          run-id: '38193802541'
          github-token: ${{ github.token }}
          path: source-native
      - name: Rehash all 11 original annual RAW and QUALITY SHA + chronological M5 timestamps
        run: |
          python -m qore.infrastructure.trader_lab.qore_native_cohort29_cadjpy_cadchf_m5_g0_v1 audit "$SYMBOL" source-native sha-witness
          python - <<'PY'
          import json,os
          from pathlib import Path
          name=os.environ["SYMBOL"]
          data=json.loads(Path(f"sha-witness/native-29-added-{name}.json").read_text())
          assert data["symbol"]==name
          assert data["status"]=="G0_NEW_PROVIDER_M5_SHA_PASS"
          assert len(data["years"])==11 and data["m5_bars"]>0
          assert data["source_integrity_checked"] is True
          assert data["ohlc_prices_returns_or_pnl_analyzed"] is False
          assert data["g1_net_authorized"] is False
          PY
          printf '%s\n' "$GITHUB_SHA" > sha-witness/code-head-sha.txt
      - name: Original source integrity witness per symbol
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qore-native-29-added-${{ matrix.symbol }}-${{ github.sha }}
          path: sha-witness/
          retention-days: 90
          if-no-files-found: warn

  combine_exact_29:
    needs: source_sha_year_11
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Fetch frozen exact original 27-market G0 SHA manifest
        uses: actions/download-artifact@v4
        with:
          name: qore-native-cohort27-unified-56b07172bdded93f9fafadedf614c770a2a2dc40
          run-id: '38204152494'
          github-token: ${{ github.token }}
          path: frozen-27
      - name: Fetch two independently verified and frozen SHA witnesses only
        uses: actions/download-artifact@v4
        with:
          pattern: qore-native-29-added-*-${{ github.sha }}
          path: extra-two
      - name: Emit SHA-linked 29-source manifest without copying broker price bars
        run: |
          python -m qore.infrastructure.trader_lab.qore_native_cohort29_cadjpy_cadchf_m5_g0_v1 combine frozen-27 extra-two final29
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("final29/qore-native-unified-29-m5.json").read_text())
          assert data["source_count"]==29
          assert data["parent_27_original_bars"]==19905871
          assert len(data["markets"])==29
          assert data["source_broker_boundaries_preserved"]
          assert data["cross_source_prices_not_concatenated"]
          assert data["ohlc_outcomes_not_examined"]
          assert data["net_economics_authorized"] is False
          assert data["traders_certified"]==0
          assert data["production_untouched"] is True
          PY
          printf '%s\n' "$GITHUB_SHA" > final29/code-head-sha.txt
          (cd final29 && sha256sum qore-native-unified-29-m5.json code-head-sha.txt > OUTPUT_SHA256SUMS.txt)
      - name: Publish immutable SHA source manifest of 29
        uses: actions/upload-artifact@v4
        with:
          name: qore-native-unified29-source-${{ github.sha }}
          path: final29/
          retention-days: 90
          if-no-files-found: error
