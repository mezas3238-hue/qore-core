name: QORE Shared STI6 STI8 Real Position Intelligence

concurrency:
  group: qore-shared-sti6-sti8-position-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - src/qore/infrastructure/core_stack_v2/shared_continuation_positive_tail_intelligence.py
      - src/qore/infrastructure/core_stack_v2/shared_position_threat_intelligence.py
      - tests/infrastructure/test_core_stack_v2_shared_continuation_positive_tail_intelligence.py
      - tests/infrastructure/test_core_stack_v2_shared_position_threat_intelligence.py
      - scripts/shared_sti6_sti8_real_position_intelligence.py
      - .github/workflows/qore-shared-sti6-sti8-real-position-intelligence.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  causal-position-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Shared
        run: pip install -e ".[dev]"

      - name: Validate STI-6 and STI-8 engines
        run: |
          set -euo pipefail
          mkdir -p result input/pure input/r8 input/r6
          ruff check \
            src/qore/infrastructure/core_stack_v2/shared_continuation_positive_tail_intelligence.py \
            src/qore/infrastructure/core_stack_v2/shared_position_threat_intelligence.py \
            tests/infrastructure/test_core_stack_v2_shared_continuation_positive_tail_intelligence.py \
            tests/infrastructure/test_core_stack_v2_shared_position_threat_intelligence.py \
            scripts/shared_sti6_sti8_real_position_intelligence.py
          mypy \
            src/qore/infrastructure/core_stack_v2/shared_continuation_positive_tail_intelligence.py \
            src/qore/infrastructure/core_stack_v2/shared_position_threat_intelligence.py
          python -m py_compile \
            src/qore/infrastructure/core_stack_v2/shared_continuation_positive_tail_intelligence.py \
            src/qore/infrastructure/core_stack_v2/shared_position_threat_intelligence.py \
            scripts/shared_sti6_sti8_real_position_intelligence.py
          pytest -q \
            tests/infrastructure/test_core_stack_v2_shared_continuation_positive_tail_intelligence.py \
            tests/infrastructure/test_core_stack_v2_shared_position_threat_intelligence.py \
            --junitxml=result/junit.xml

      - name: Recover immutable trade and market evidence
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10799064861/zip" > pure.zip
          unzip -q pure.zip -d input/pure
          (cd input/pure && sha256sum -c SHA256SUMS)
          test -f input/pure/r8.json
          test -f input/pure/r6.json

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10402199719/zip" > r8.zip
          unzip -q r8.zip -d input/r8
          (cd input/r8 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10389112524/zip" > r6.zip
          unzip -q r6.zip -d input/r6
          (cd input/r6 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

      - name: Freeze source-only R8 position policies
        run: |
          set -euo pipefail
          python scripts/shared_sti6_sti8_real_position_intelligence.py \
            --mode freeze \
            --r8-trades input/pure/r8.json \
            --r8-nas input/r8/fresh/NAS100/market-evidence.json \
            --r8-sp input/r8/fresh/SP500/market-evidence.json \
            --r8-us input/r8/fresh/US30/market-evidence.json \
            --output result/sti6-sti8-source-only-policies.json \
            | tee result/freeze-summary.json

          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(
              Path("result/sti6-sti8-source-only-policies.json").read_text()
          )
          assert p["mode"] == "SOURCE_ONLY_POLICY_FREEZE"
          assert p["r8_trade_count"] > 0
          assert p["r8_source_observation_count"] > 0
          assert p["future_market_data_read_for_freeze"] is False
          assert p["future_trade_outcomes_read_for_freeze"] is False
          assert p["pnl_used_for_freeze"] is False
          assert p["r5_opened"] is False
          assert p["protected_holdout_opened"] is False
          assert p["productive_authority"] is False
          assert len(p["sti6_policy_fingerprint"]) == 64
          assert len(p["sti8_policy_fingerprint"]) == 64
          PY

      - name: Execute frozen causal R6 position replay
        run: |
          set -euo pipefail
          python scripts/shared_sti6_sti8_real_position_intelligence.py \
            --mode evaluate \
            --policy result/sti6-sti8-source-only-policies.json \
            --r6-trades input/pure/r6.json \
            --r6-nas input/r6/fresh/NAS100/market-evidence.json \
            --r6-sp input/r6/fresh/SP500/market-evidence.json \
            --r6-us input/r6/fresh/US30/market-evidence.json \
            --output result/sti6-sti8-causal-position-replay.json \
            | tee result/replay-summary.json

      - name: Validate scientific disposition without forcing a pass
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(
              Path("result/sti6-sti8-causal-position-replay.json").read_text()
          )
          assert p["engine_state"] == (
              "ENGINE_IMPLEMENTED_REAL_DATA_BOUND_CAUSAL_REPLAY_EXECUTED"
          )
          assert p["r6_trade_count"] > 0
          assert p["r6_source_observation_count"] > 0
          assert p["sti6"]["signal_value_status"] in {
              "SIGNAL_VALUE_DEMONSTRATED_R6",
              "STI6_V1_FALSIFIED_ON_CONSUMED_R6",
          }
          assert p["sti8"]["signal_value_status"] in {
              "SIGNAL_VALUE_DEMONSTRATED_R6",
              "STI8_V1_FALSIFIED_ON_CONSUMED_R6",
          }
          assert p["sti6"]["economic_position_management_value_proven"] is False
          assert p["sti8"]["economic_position_management_value_proven"] is False
          assert p["source_only_engine"] is True
          assert p["future_data_used_for_intelligence"] is False
          assert p["terminal_outcome_used_offline_for_evaluation"] is True
          assert p["outcome_used_for_policy_freeze"] is False
          assert p["r5_opened"] is False
          assert p["protected_holdout_opened"] is False
          assert p["trader_methodology_mutated"] is False
          assert p["mandatory_hold_or_exit_authority"] is False
          assert p["productive_authority"] is False
          PY

      - name: Bind evidence
        run: |
          set -euo pipefail
          printf '%s\n' "${GITHUB_SHA}" > result/code-git-sha.txt
          (
            cd result
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
              | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-sti6-sti8-real-position-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Report STI-6 / STI-8 scientific state
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p=json.loads(
              Path("result/sti6-sti8-causal-position-replay.json").read_text()
          )
          s6=p["sti6"]
          s8=p["sti8"]
          body="\n".join([
              "## Shared STI-6 / STI-8 — REAL Open-Position Intelligence",
              "",
              f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- engine state: **{p['engine_state']}**",
              f"- R6 trades / causal observations: **{p['r6_trade_count']} / {p['r6_source_observation_count']}**",
              f"- STI-6 signal state: **{s6['signal_value_status']}**",
              f"- STI-6 winner precision/recall: **{s6['winner_precision_bps']}/{s6['winner_recall_bps']} bps**",
              f"- STI-6 positive-tail precision/recall: **{s6['positive_tail_precision_bps']}/{s6['positive_tail_recall_bps']} bps**",
              f"- STI-8 signal state: **{s8['signal_value_status']}**",
              f"- STI-8 loss precision/recall: **{s8['loss_precision_bps']}/{s8['loss_recall_bps']} bps**",
              f"- STI-8 false-threat/missed-loss: **{s8['false_threat_on_nonlosses_bps']}/{s8['missed_loss_bps']} bps**",
              "- economic position-management value proven: **False**",
              "- R5 opened: **False**",
              "- protected certification holdout opened: **False**",
              "- mandatory HOLD/EXIT authority: **False**",
              "- productive authority: **False**",
              "",
              "A predictive PASS would still not certify position-management economic value.",
          ])+"\n"
          Path("result/issue-comment.md").write_text(body)
          PY
          gh issue comment 638 --body-file result/issue-comment.md
