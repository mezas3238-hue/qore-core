name: QORE CIBO Trader Lab 3x1Y VT31 Slice

on:
  push:
    branches:
      - agent/cibo-t02-science-architect-2-001
    paths:
      - '.github/workflows/cibo-trader-lab-3x1y-vt31-slice.yml'
      - 'scripts/cibo_vt31_1y_group_slice.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  VT31_PHASE18_ARTIFACT_ID: '10912945588'
  VT31_PHASE18_ARTIFACT_DIGEST: 'sha256:2200392deeb081525720430a816e8f82b18d7333c61a05eb197632ed24849e15'

jobs:
  vt31-three-groups:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'

      - name: Validate slicer
        run: |
          set -euo pipefail
          python -m py_compile scripts/cibo_vt31_1y_group_slice.py
          ruff check scripts/cibo_vt31_1y_group_slice.py

      - name: Recover immutable VT31 Phase18 evidence
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vt31-source"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$VT31_PHASE18_ARTIFACT_ID" > "$RUNNER_TEMP/vt31.meta.json"
          jq -e --arg digest "$VT31_PHASE18_ARTIFACT_DIGEST" '.expired == false and .digest == $digest' "$RUNNER_TEMP/vt31.meta.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$VT31_PHASE18_ARTIFACT_ID/zip" > "$RUNNER_TEMP/vt31.zip"
          echo "${VT31_PHASE18_ARTIFACT_DIGEST#sha256:}  $RUNNER_TEMP/vt31.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/vt31.zip" -d "$RUNNER_TEMP/vt31-source"
          test -s "$RUNNER_TEMP/vt31-source/phase18-vt31-v4-bound-trades.jsonl"

      - name: Slice three fixed one-year groups
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vt31-groups"
          for group in GROUP_1 GROUP_2 GROUP_3; do
            mkdir -p "$RUNNER_TEMP/vt31-groups/$group"
            python scripts/cibo_vt31_1y_group_slice.py               --source "$RUNNER_TEMP/vt31-source/phase18-vt31-v4-bound-trades.jsonl"               --group-id "$group"               --output "$RUNNER_TEMP/vt31-groups/$group/vt31-group-lane.json"
          done

      - name: Enforce VT31 populations
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'vt31-groups'
          minimum={'GROUP_1':100,'GROUP_2':100,'GROUP_3':100}
          for group in ('GROUP_1','GROUP_2','GROUP_3'):
              p=json.loads((root/group/'vt31-group-lane.json').read_text())
              assert p['trader_id']=='VT31_NAS100'
              assert p['sample_size'] >= minimum[group]
              assert len(p['trades']) == p['sample_size']
              assert all(str(row['signal_fingerprint']).startswith('sha256:') for row in p['trades'])
              g=p['governance']
              assert g['methodology_changed'] is False
              assert g['outcome_aware_selection'] is False
              for key in ('fresh_oos_claimed','certification_claimed','broker_mutation','live','production','real_capital'):
                  assert g[key] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-trader-lab-3x1y-vt31-${{ github.run_id }}
          path: ${{ runner.temp }}/vt31-groups
          if-no-files-found: error
          retention-days: 90
