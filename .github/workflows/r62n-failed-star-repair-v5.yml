name: Apply bounded R62N failed-star import repair v5

on:
  push:
    branches: [agent/qore-umi14-umi12-final-owner-recert-001]
    paths: [.github/workflows/r62n-failed-star-repair-v5.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qore-umi14-umi12-final-owner-recert-001
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Verify exact staging ancestry
        run: |
          test "$(git rev-parse HEAD^)" = "5ada1bdc282400fc68f058e8d6d78b9e8357af44"
          test "$(git rev-parse HEAD^^^^^)" = "9a3b44e6b19fab5e9cd72ef9013d031b6ef0cc6d"
      - name: Install canonical development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Reapply verified semantic payload and strict-type witnesses
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import re
          import zlib
          from pathlib import Path

          workflow = Path('.github/workflows/r62n-failed-star-repair-v4.yml').read_text()
          payload_match = re.search(r"PATCH_ZLIB_B64: '([^']+)'", workflow)
          digest_match = re.search(r"PATCH_SHA256: '([^']+)'", workflow)
          if payload_match is None or digest_match is None:
              raise SystemExit('verified v4 payload metadata not found')
          payload = payload_match.group(1)
          if hashlib.sha256(payload.encode()).hexdigest() != digest_match.group(1):
              raise SystemExit('verified v4 payload digest mismatch')
          script = zlib.decompress(base64.b64decode(payload)).decode('utf-8')
          compile(script, '<r62n-failed-star-repair-v5>', 'exec')
          exec(compile(script, '<r62n-failed-star-repair-v5>', 'exec'))

          path = Path('tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py')
          text = path.read_text()
          replacements = {
              '    module.b = builtins.eval\n': '    setattr(module, "b", builtins.eval)\n',
              '    module.__all__ = order\n': '    setattr(module, "__all__", order)\n',
              '    module.__all__ = ["dynamic_alias"]\n': '    setattr(module, "__all__", ["dynamic_alias"])\n',
              '    module.dynamic_alias = builtins.eval\n': '    setattr(module, "dynamic_alias", builtins.eval)\n',
          }
          expected_counts = {
              '    module.b = builtins.eval\n': 1,
              '    module.__all__ = order\n': 2,
              '    module.__all__ = ["dynamic_alias"]\n': 1,
              '    module.dynamic_alias = builtins.eval\n': 1,
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != expected_counts[old]:
                  raise SystemExit(f'unexpected strict-typing anchor count for {old!r}: {count}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Syntax focused Ruff and Mypy
        run: |
          python -m py_compile tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
          ruff check tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
          mypy tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
          pytest -q tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
      - name: Full canonical quality gate
        run: |
          ruff check .
          mypy src tests
          pytest --cov=src/qore --cov-report=term-missing
      - name: Commit validated repair and remove staging
        run: |
          git config user.name "qore-integration-authority"
          git config user.email "qore-integration-authority@users.noreply.github.com"
          git add tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
          git rm .github/workflows/r62n-failed-star-repair.yml
          git rm .github/workflows/r62n-failed-star-repair-v2.yml
          git rm .github/workflows/r62n-failed-star-repair-v3.yml
          git rm .github/workflows/r62n-failed-star-repair-v4.yml
          git rm .github/workflows/r62n-failed-star-repair-v5.yml
          git diff --cached --check
          git commit -m "Harden R62N failed-star import ordering"
          git push origin HEAD:agent/qore-umi14-umi12-final-owner-recert-001
