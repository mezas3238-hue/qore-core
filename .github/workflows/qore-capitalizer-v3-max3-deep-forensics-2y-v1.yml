name: QORE Capitalizer V3 MAX3 Deep Forensics 2Y V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-v3-max3-deep-forensics-2y-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v3_max3_deep_forensics_2y_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v3_max3_deep_forensics_2y_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  BASELINE_RUN_ID: '35806006221'
  BASELINE_SHA: '7f9b9efc82376bb5edbea42379a0a3cf3e72a94a'
  MICRO_RUN_ID: '35805397236'
  MICRO_SHA: 'e3be1ed5dda60ab3a53257287c9471ce247d2554'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_v3_max3_deep_forensics_2y_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_v3_max3_deep_forensics_2y_v1.py
      - name: Mypy
        run: mypy src/qore/infrastructure/trader_lab/capitalizer_v3_max3_deep_forensics_2y_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_v3_max3_deep_forensics_2y_v1.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        symbol: [USDJPY, AUDJPY, AUDUSD, GBPJPY, EURUSD, GBPUSD, XAUUSD, USDCAD, NAS100]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download exact frozen V3 MAX3 ledger
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-nine-market-v3-frozen-replay-2y-v1-${{ env.BASELINE_SHA }}
          path: baseline-source
          github-token: ${{ github.token }}
          run-id: ${{ env.BASELINE_RUN_ID }}
      - name: Download frozen M5 context
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-v3-m3-microstructure-context-2y-v1-${{ matrix.symbol }}-${{ env.MICRO_SHA }}
          path: micro-source
          github-token: ${{ github.token }}
          run-id: ${{ env.MICRO_RUN_ID }}
      - name: Run exact MAX3 deep forensics
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v3_max3_deep_forensics_2y_v1 \
            market baseline-source micro-source forensic-output --symbol ${{ matrix.symbol }}
      - name: Enforce forensic governance
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"]
          report = json.loads(
              (
                  Path("forensic-output")
                  / f"capitalizer-{symbol.lower()}-v3-max3-deep-forensics-2y-v1.json"
              ).read_text()
          )
          assert report["identity"] == "QORE_CAPITALIZER_V3_MAX3_DEEP_FORENSICS_2Y_V1"
          assert report["symbol"] == symbol
          assert report["trades"] > 0
          assert report["source_max3_ledger"] is True
          assert report["outcome_aware_forensics"] is True
          assert report["decision_time_feature_allowed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["economic_candidate"] is False
          assert report["source_methodology_modified"] is False
          assert report["fresh_holdout_claimed"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v3-max3-deep-forensics-2y-v1-${{ matrix.symbol }}-${{ github.sha }}
          path: forensic-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v3-max3-deep-forensics-2y-v1-*-${{ github.sha }}
          path: forensic-input
          merge-multiple: false
      - name: Build nine-market deep matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v3_max3_deep_forensics_2y_v1 \
            matrix forensic-input matrix-output
      - name: Enforce MAX3 control
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "matrix-output/"
                  "capitalizer-nine-market-v3-max3-deep-forensics-2y-v1.json"
              ).read_text()
          )
          assert report["market_count"] == 9
          assert report["trades"] == 474
          assert report["max3_control_reproduced"] is True
          assert report["source_max3_ledger"] is True
          assert report["outcome_aware_forensics"] is True
          assert report["rule_promotion_allowed"] is False
          assert report["economic_candidate"] is False
          assert report["source_methodology_modified"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-nine-market-v3-max3-deep-forensics-2y-v1-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
