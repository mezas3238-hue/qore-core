name: QORE VT31 A B Admission Integration Frontier V1

on:
  push:
    branches:
      - agent/vt31-edge-position-cert-b-001
    paths:
      - scripts/vt31_nas100_a_b_admission_integration_frontier_v1.py
      - scripts/vt31_nas100_h3_dol2_composition_frontier_v1.py
      - scripts/vt31_nas100_post_1r_full_cognition_management_frontier_v2.py
      - scripts/vt31_nas100_full_cognition_attribution_v1.py
      - scripts/vt31_nas100_dol2_cognitive_protection_frontier_v1.py
      - scripts/vt31_nas100_target_depth_economic_frontier_v2.py
      - scripts/vt31_nas100_specialist_r1_candidate.py
      - src/qore/infrastructure/traders/vt31_nas100_reasoning_engine.py
      - src/qore/infrastructure/traders/vt31_nas100_situation_model.py
      - src/qore/infrastructure/traders/vt31_nas100_market_context_runtime.py
      - .github/workflows/vt31-a-b-admission-integration-frontier-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Static and focused gates
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/vt31_nas100_a_b_admission_integration_frontier_v1.py \
            scripts/vt31_nas100_h3_dol2_composition_frontier_v1.py
          ruff check \
            scripts/vt31_nas100_a_b_admission_integration_frontier_v1.py \
            scripts/vt31_nas100_h3_dol2_composition_frontier_v1.py
          pytest -q -o addopts='' \
            tests/infrastructure/test_vt31_nas100_position_intelligence.py \
            tests/infrastructure/test_vt31_nas100_post_entry_cognitive_runtime.py
      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"
      - name: Run A+B admission integration frontier
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python \
            scripts/vt31_nas100_a_b_admission_integration_frontier_v1.py \
            "input/${EVIDENCE_PATH}" \
            --output "result/a-b-admission-${PARTITION}.json" \
            | tee "result/summary-${PARTITION}.json"
      - name: Governance
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=os.environ["PARTITION"]
          x=json.loads(Path(f"result/a-b-admission-{p}.json").read_text())
          assert x["comparator_id"] == (
              "VT31_BSIDE_H3_W5_DOL2_PS2_RESEARCH_COMPARATOR_001"
          )
          g=x["governance"]
          assert g["consumed_evidence_only"] is True
          assert g["a_hypotheses_predeclared"] is True
          assert g["a_hypotheses_discovered_on_consumed_evidence"] is True
          assert g["order_block_positive_evidence_frontier_predeclared"] is True
          assert g["order_block_positive_evidence_frontier_development_only"] is True
          assert g["b_comparator_fixed"] is True
          assert g["b_h3_horizon_m1"] == 3
          assert g["b_soft_dol1_window_m1"] == 5
          assert g["b_target"] == "FULL_COGNITION_DOL2"
          assert g["maximum_cognition_branch_used"] is True
          assert g["m15_context_present_in_entry_state"] is True
          assert g["runtime_policy_changed"] is False
          assert g["entry_price_changed"] is False
          assert g["initial_stop_changed"] is False
          assert g["b_position_logic_changed"] is False
          assert g["position_sizing_used"] is False
          assert g["leverage_used"] is False
          assert g["compounding_used"] is False
          assert g["capital_weighting_used"] is False
          assert g["absolute_volume_used"] is False
          assert g["fold_identity_used_for_action"] is False
          assert g["future_outcome_used_for_action"] is False
          assert g["residual_clustering_diagnostics_observation_only"] is True
          assert g["residual_clustering_diagnostics_action_authority"] is False
          assert g["residual_multivariate_diagnostics_observation_only"] is True
          assert g["residual_multivariate_diagnostics_action_authority"] is False
          assert g["remaining_order_block_diagnostics_observation_only"] is True
          assert g["remaining_order_block_diagnostics_action_authority"] is False
          assert g["residual_preferred_variant"] == (
              "A_ABSTAIN_ORDER_BLOCK_AGE_0_2M_OR_EXPANDED"
          )
          assert g["fresh_holdout_opened"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-a-b-admission-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-a-b-admission-*-${{ github.sha }}
          path: input
          merge-multiple: true
      - name: Adjudicate A+B admission integration
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          folds=("r5","r6","r8","consumed")
          candidates=(
              "A_ABSTAIN_EXPANDED_REFERENCE",
              "A_ABSTAIN_ORDER_BLOCK",
              "A_ABSTAIN_ORDER_BLOCK_AGE_0_2M",
              "A_ABSTAIN_ORDER_BLOCK_OR_EXPANDED",
              "A_ABSTAIN_ORDER_BLOCK_AGE_0_2M_OR_EXPANDED",
              "A_EXPANDED_OB_REQUIRE_SHORT",
              "A_EXPANDED_OB_REQUIRE_AGE_11M",
              "A_EXPANDED_OB_REQUIRE_SHORT_AGE_11M",
              "A_EXPANDED_OB_REQUIRE_SHORT_RECLAIM_15M",
          )
          payloads={
              fold:json.loads(
                  Path(f"input/a-b-admission-{fold}.json").read_text()
              )
              for fold in folds
          }

          def d(value):
              return Decimal(str(value))

          def pf_value(metrics):
              value=metrics["profit_factor"]
              if value is None:
                  if metrics["losses"] == 0 and metrics["wins"] > 0:
                      return Decimal("Infinity")
                  return Decimal(0)
              return d(value)

          report={}
          for variant in candidates:
              per_fold={}
              pf_ok=mean_ok=dd_ok=density_ok=0
              winners_all=True
              temporal_all=True
              for fold in folds:
                  control=payloads[fold]["variants"]["CONTROL_B_W5"]
                  cand=payloads[fold]["variants"][variant]
                  bm=control["stress_0_05r"]
                  cm=cand["stress_0_05r"]
                  wp=cand["winner_preservation"]

                  pf_non=pf_value(cm)>=pf_value(bm)
                  mean_non=d(cm["mean_r"])>=d(bm["mean_r"])
                  dd_non=d(cm["max_drawdown_r"])<=d(bm["max_drawdown_r"])
                  density_non=d(cand["relative_density"])>=Decimal("0.75")
                  winner_non=(
                      d(wp["winner_count_preservation"])>=Decimal("0.80")
                      and d(wp["winner_r_preservation"])>=Decimal("0.90")
                  )
                  pf_ok+=int(pf_non)
                  mean_ok+=int(mean_non)
                  dd_ok+=int(dd_non)
                  density_ok+=int(density_non)
                  winners_all &= winner_non

                  blocks={}
                  common=(
                      set(control["halfyear_stress"])
                      & set(cand["halfyear_stress"])
                  )
                  for key in sorted(common):
                      delta=(
                          d(cand["halfyear_stress"][key]["mean_r"])
                          - d(control["halfyear_stress"][key]["mean_r"])
                      )
                      ok=delta>=0
                      temporal_all &= ok
                      blocks[key]={
                          "mean_r_delta":format(delta,"f"),
                          "nondegrade":ok,
                      }

                  per_fold[fold]={
                      "control":bm,
                      "candidate":cm,
                      "monte_carlo":cand["monte_carlo"],
                      "relative_density":cand["relative_density"],
                      "removed_trade_count":cand["removed_trade_count"],
                      "removed_metrics":cand["removed_metrics"],
                      "removed_context":cand["removed_context"],
                      "sequence_diagnostics":cand["sequence_diagnostics"],
                      "residual_multivariate_groups":(
                          cand["residual_multivariate_groups"]
                      ),
                      "remaining_order_block_traces":(
                          cand["remaining_order_block_traces"]
                      ),
                      "winner_preservation":wp,
                      "pf_nondegrade":pf_non,
                      "mean_nondegrade":mean_non,
                      "dd_nondegrade":dd_non,
                      "density_floor_pass":density_non,
                      "winner_floor_pass":winner_non,
                      "halfyears":blocks,
                  }

              consumed=per_fold["consumed"]
              consumed_gates={
                  "pf_at_least_1_50":(
                      pf_value(consumed["candidate"])>=Decimal("1.50")
                  ),
                  "mean_at_least_0_15r":(
                      d(consumed["candidate"]["mean_r"])>=Decimal("0.15")
                  ),
                  "dd_at_most_6r":(
                      d(consumed["candidate"]["max_drawdown_r"])
                      <= Decimal("6")
                  ),
                  "mc_positive_at_least_0_90":(
                      d(consumed["monte_carlo"]["positive_terminal_probability"])
                      >= Decimal("0.90")
                  ),
                  "mc_p95_dd_at_most_15r":(
                      d(consumed["monte_carlo"]["p95_max_drawdown_r"])
                      <= Decimal("15")
                  ),
              }
              survivor=(
                  pf_ok==4
                  and mean_ok==4
                  and dd_ok==4
                  and density_ok==4
                  and winners_all
              )
              report[variant]={
                  "folds":per_fold,
                  "pf_nondegrade_folds":pf_ok,
                  "mean_nondegrade_folds":mean_ok,
                  "dd_nondegrade_folds":dd_ok,
                  "density_floor_folds":density_ok,
                  "winner_preservation_all_folds":winners_all,
                  "halfyears_all_nondegrade":temporal_all,
                  "consumed_owner_direction":consumed_gates,
                  "development_survivor":survivor,
                  "promotion_authorized":False,
              }

          preferred="A_ABSTAIN_ORDER_BLOCK_AGE_0_2M_OR_EXPANDED"
          residual=report[preferred]["folds"]
          fields=(
              "entry_family",
              "side",
              "h1_state",
              "m15_state",
              "prior_day_state",
              "reference_volatility_state",
              "position_in_prior_day_range",
          )
          stable_negative=[]
          historical_positive_recent_flip=[]
          for field in fields:
              maps={}
              for fold in folds:
                  profiles=(
                      residual[fold]["sequence_diagnostics"]
                      ["context_outcome_attribution"][field]
                  )
                  maps[fold]={item["value"]:item for item in profiles}
              common=set.intersection(
                  *(set(maps[fold]) for fold in folds)
              )
              for value in sorted(common):
                  rows={fold:maps[fold][value] for fold in folds}
                  samples={fold:int(rows[fold]["sample"]) for fold in folds}
                  means={
                      fold:d(rows[fold]["mean_stressed_r"])
                      for fold in folds
                  }
                  if (
                      all(samples[fold]>=2 for fold in folds)
                      and all(means[fold]<0 for fold in folds)
                  ):
                      stable_negative.append({
                          "field":field,
                          "value":value,
                          "samples":samples,
                          "mean_stressed_r":{
                              fold:format(means[fold],"f")
                              for fold in folds
                          },
                      })
                  if (
                      all(samples[fold]>=2 for fold in folds)
                      and all(means[fold]>0 for fold in ("r5","r6","r8"))
                      and means["consumed"]<0
                  ):
                      historical_positive_recent_flip.append({
                          "field":field,
                          "value":value,
                          "samples":samples,
                          "mean_stressed_r":{
                              fold:format(means[fold],"f")
                              for fold in folds
                          },
                      })

          group_maps={
              fold:residual[fold]["residual_multivariate_groups"]
              for fold in folds
          }
          common_groups=set.intersection(
              *(set(group_maps[fold]) for fold in folds)
          )
          multivariate_stable_negative=[]
          multivariate_historical_positive_recent_flip=[]
          for key in sorted(common_groups):
              samples={
                  fold:int(group_maps[fold][key]["sample"])
                  for fold in folds
              }
              means={
                  fold:d(
                      group_maps[fold][key]["stress_0_05r"]["mean_r"]
                  )
                  for fold in folds
              }
              if (
                  all(samples[fold]>=2 for fold in folds)
                  and all(means[fold]<0 for fold in folds)
              ):
                  multivariate_stable_negative.append({
                      "class":key,
                      "samples":samples,
                      "mean_stressed_r":{
                          fold:format(means[fold],"f")
                          for fold in folds
                      },
                  })
              if (
                  all(samples[fold]>=2 for fold in folds)
                  and all(means[fold]>0 for fold in ("r5","r6","r8"))
                  and means["consumed"]<0
              ):
                  multivariate_historical_positive_recent_flip.append({
                      "class":key,
                      "samples":samples,
                      "mean_stressed_r":{
                          fold:format(means[fold],"f")
                          for fold in folds
                      },
                  })

          result={
              "schema":"qore.vt31.nas100.a_b_admission_integration.aggregate.v1",
              "head":"${{ github.sha }}",
              "comparator_id":"VT31_BSIDE_H3_W5_DOL2_PS2_RESEARCH_COMPARATOR_001",
              "variants":report,
              "development_survivors":[
                  name for name,item in report.items()
                  if item["development_survivor"]
              ],
              "temporal_development_survivors":[
                  name for name,item in report.items()
                  if item["development_survivor"]
                  and item["halfyears_all_nondegrade"]
              ],
              "remaining_order_blocks":{
                  "preferred_variant":preferred,
                  "by_fold":{
                      fold:residual[fold]["remaining_order_block_traces"]
                      for fold in folds
                  },
                  "action_authority":False,
              },
              "residual_multivariate":{
                  "preferred_variant":preferred,
                  "stable_negative_classes":multivariate_stable_negative,
                  "historical_positive_recent_flip_classes":(
                      multivariate_historical_positive_recent_flip
                  ),
                  "minimum_sample_each_fold":2,
                  "action_authority":False,
              },
              "residual_clustering":{
                  "preferred_variant":preferred,
                  "stable_negative_classes":stable_negative,
                  "historical_positive_recent_flip_classes":(
                      historical_positive_recent_flip
                  ),
                  "longest_losing_streaks":{
                      fold:residual[fold]["sequence_diagnostics"][
                          "longest_losing_streak"
                      ]
                      for fold in folds
                  },
                  "worst_rolling_5":{
                      fold:residual[fold]["sequence_diagnostics"][
                          "worst_rolling_5"
                      ]
                      for fold in folds
                  },
              },
              "governance":{
                  "consumed_evidence_only":True,
                  "same_evidence_contributed_to_hypothesis_discovery":True,
                  "results_are_not_promotion_evidence":True,
                  "b_comparator_unchanged":True,
                  "runtime_policy_changed":False,
                  "residual_clustering_observation_only":True,
                  "residual_clustering_action_authority":False,
                  "residual_multivariate_observation_only":True,
                  "residual_multivariate_action_authority":False,
                  "remaining_order_blocks_observation_only":True,
                  "remaining_order_blocks_action_authority":False,
                  "sizing_for_certification_forbidden":True,
                  "fresh_holdout_opened":False,
                  "policy_promoted":False,
                  "candidate_frozen":False,
                  "candidate_certified":False,
              },
          }
          Path("result/aggregate.json").write_text(
              json.dumps(result,sort_keys=True,indent=2)+"\n"
          )
          print(json.dumps(result,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-a-b-admission-aggregate-${{ github.sha }}
          path: result/
          retention-days: 90
