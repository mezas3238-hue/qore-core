name: QORE Shared WP05 Mechanism Confirmation V11 Foundation

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - docs/shared/QORE_SHARED_WP05_V11_MECHANISM_CONFIRMATION_PREREGISTRATION.md
      - src/qore/infrastructure/core_stack_v2/temporal_hierarchy_mechanism_confirmation_v11.py
      - scripts/shared_wp05_mechanism_confirmation_v11.py
      - tests/infrastructure/test_core_stack_v2_temporal_hierarchy_mechanism_confirmation_v11.py
      - tests/infrastructure/test_shared_wp05_mechanism_confirmation_v11_protocol.py
      - .github/workflows/qore-shared-wp05-mechanism-confirmation-v11-foundation.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  mechanism-confirmation-v11-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Announce WP05 V11 foundation validation
        run: |
          gh issue comment 643 --body "WP-05 V11 foundation validation started — Git SHA `${GITHUB_SHA}`, run `${GITHUB_RUN_ID}`. Two-of-three sequential mechanism confirmation only; no R8/R6/R5 scientific execution and fresh holdout remains CLOSED."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Shared
        run: pip install -e ".[dev]"

      - name: Static and adversarial validation
        run: |
          ruff check             src/qore/infrastructure/core_stack_v2/temporal_hierarchy_mechanism_confirmation_v11.py             scripts/shared_wp05_mechanism_confirmation_v11.py             tests/infrastructure/test_core_stack_v2_temporal_hierarchy_mechanism_confirmation_v11.py             tests/infrastructure/test_shared_wp05_mechanism_confirmation_v11_protocol.py
          mypy src/qore/infrastructure/core_stack_v2/temporal_hierarchy_mechanism_confirmation_v11.py
          python -m py_compile             src/qore/infrastructure/core_stack_v2/temporal_hierarchy_mechanism_confirmation_v11.py             scripts/shared_wp05_mechanism_confirmation_v11.py
          pytest -q             tests/infrastructure/test_core_stack_v2_temporal_hierarchy_mechanism_confirmation_v11.py             tests/infrastructure/test_shared_wp05_mechanism_confirmation_v11_protocol.py             tests/infrastructure/test_core_stack_v2_temporal_hierarchy_sequential_changepoint_v10.py             tests/infrastructure/test_core_stack_v2_temporal_hierarchy_target_contract.py             tests/infrastructure/test_shared_wp05_structural_failure_target_v2.py

      - name: Report WP05 V11 foundation GREEN
        if: success()
        run: |
          gh issue comment 643 --body "WP-05 V11 foundation GREEN — Git SHA `${GITHUB_SHA}`, run `${GITHUB_RUN_ID}`. Frozen mechanism groups, t0-no-confirm, two-of-three confirmation, R8-only fit/calibration, deterministic fingerprints, anti-future leakage and no-authority invariants passed. Scientific consumed execution has not started; fresh holdout remains CLOSED."

      - name: Report WP05 V11 foundation failure
        if: failure()
        run: |
          gh issue comment 643 --body "WP-05 V11 foundation FAILED technically — Git SHA `${GITHUB_SHA}`, run `${GITHUB_RUN_ID}`. Do not execute V11 consumed evidence or alter preregistered science until repaired. Fresh holdout remains CLOSED."
