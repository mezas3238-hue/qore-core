name: QORE CIBO Market Atlas Journey 10Y V1

on:
  push:
    branches:
      - agent/cibo-market-atlas-20y-v1-001
    paths:
      - '.github/workflows/cibo-market-atlas-journey-10y-v1.yml'
      - 'src/qore/infrastructure/trader_lab/cibo_market_atlas_journey_extractor_v1.py'
      - 'src/qore/infrastructure/trader_lab/cibo_market_atlas_cross_index_fast_v1.py'
      - 'tests/infrastructure/trader_lab/test_cibo_market_atlas_journey_extractor_v1.py'
      - 'tests/infrastructure/trader_lab/test_cibo_market_atlas_cross_index_fast_v1.py'
      - 'docs/research/CIBO-MARKET-ATLAS-JOURNEY-LAYER-V1.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-cibo-market-atlas-journey-10y-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: '35166210458'
  SOURCE_GIT_SHA: 'ab782b8e9f890f86a2b6500070f0556b4b685e3d'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/cibo_market_atlas_journey_extractor_v1.py \
            src/qore/infrastructure/trader_lab/cibo_market_atlas_cross_index_fast_v1.py \
            tests/infrastructure/trader_lab/test_cibo_market_atlas_journey_extractor_v1.py \
            tests/infrastructure/trader_lab/test_cibo_market_atlas_cross_index_fast_v1.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/cibo_market_atlas_journey_extractor_v1.py \
            src/qore/infrastructure/trader_lab/cibo_market_atlas_cross_index_fast_v1.py \
            tests/infrastructure/trader_lab/test_cibo_market_atlas_journey_extractor_v1.py \
            tests/infrastructure/trader_lab/test_cibo_market_atlas_cross_index_fast_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_cibo_market_atlas_journey_extractor_v1.py \
            tests/infrastructure/trader_lab/test_cibo_market_atlas_cross_index_fast_v1.py
      - name: Governance assertions
        run: |
          python - <<'PY'
          from qore.infrastructure.trader_lab import cibo_market_atlas_journey_extractor_v1 as j
          assert j.SOURCE_RUN_ID == 35166210458
          assert j.SOURCE_GIT_SHA == 'ab782b8e9f890f86a2b6500070f0556b4b685e3d'
          assert j.IDENTITY == 'CIBO_MARKET_JOURNEY_LAYER_V1'
          assert len(j.LEDGER_NAMES) == 7
          PY

  journey:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        symbol:
          - AUDJPY
          - AUDUSD
          - EURUSD
          - GBPJPY
          - GBPUSD
          - USDCAD
          - USDJPY
          - NAS100
          - SP500
          - US30
          - XAUUSD
          - XAGUSD
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download immutable 10Y source artifact
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-${{ matrix.symbol }}-${{ env.SOURCE_GIT_SHA }}
          path: source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Build Journey ledgers
        run: |
          python -m qore.infrastructure.trader_lab.cibo_market_atlas_journey_extractor_v1 \
            symbol source journey
      - name: Enforce Journey manifest
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('journey/journey-manifest.json').read_text())
          assert manifest['identity'] == 'CIBO_MARKET_JOURNEY_LAYER_V1'
          assert manifest['source_run_id'] == 35166210458
          assert manifest['source_git_sha'] == 'ab782b8e9f890f86a2b6500070f0556b4b685e3d'
          assert manifest['symbol'] == os.environ['EXPECTED_SYMBOL']
          assert manifest['retained_m5_bars'] > 0
          assert manifest['ledger_counts']['MARKET_JOURNEY_LEDGER'] > 0
          assert manifest['ledger_counts']['DAILY_PATH_LEDGER'] > 0
          assert manifest['demo_eligible'] is False
          assert manifest['live_authorized'] is False
          assert manifest['real_capital_authorized'] is False
          assert manifest['production_authorized'] is False
          PY
      - name: Upload immutable Journey artifact
        uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-market-journey-${{ matrix.symbol }}-${{ github.sha }}
          path: journey
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: journey
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download all Journey artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: qore-cibo-market-journey-*-${{ github.sha }}
          path: journeys
      - name: Build cross-index ledger and authoritative Journey index
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from qore.infrastructure.trader_lab.cibo_market_atlas_cross_index_fast_v1 import build_cross_index

          manifests = {}
          for path in Path('journeys').rglob('journey-manifest.json'):
              payload = json.loads(path.read_text())
              manifests[payload['symbol']] = (path.parent, payload)
          expected = {'AUDJPY','AUDUSD','EURUSD','GBPJPY','GBPUSD','USDCAD','USDJPY','NAS100','SP500','US30','XAUUSD','XAGUSD'}
          assert set(manifests) == expected

          cross = build_cross_index(
              manifests['NAS100'][0] / 'MARKET_JOURNEY_LEDGER.jsonl',
              manifests['SP500'][0] / 'MARKET_JOURNEY_LEDGER.jsonl',
              manifests['US30'][0] / 'MARKET_JOURNEY_LEDGER.jsonl',
              Path('aggregate'),
          )
          rows = []
          for symbol in sorted(manifests):
              root, manifest = manifests[symbol]
              rows.append({
                  'symbol': symbol,
                  'provider_symbol': manifest['provider_symbol'],
                  'retained_m5_bars': manifest['retained_m5_bars'],
                  'behavior_event_count': manifest['behavior_event_count'],
                  'ledger_counts': manifest['ledger_counts'],
                  'ledger_sha256': manifest['ledger_sha256'],
              })
          index = {
              'schema': 'qore.cibo_market_atlas.journey_10y_index.v1',
              'identity': 'CIBO_MARKET_JOURNEY_LAYER_V1',
              'source_run_id': 35166210458,
              'source_git_sha': 'ab782b8e9f890f86a2b6500070f0556b4b685e3d',
              'symbols': rows,
              'cross_index_rows': cross['rows'],
              'cross_index_aggregation': cross['aggregation_transport'],
              'evidence_status': 'CONSUMED_RESEARCH_EVIDENCE',
              'demo_eligible': False,
              'live_authorized': False,
              'real_capital_authorized': False,
              'production_authorized': False,
          }
          out = Path('aggregate/journey-10y-index.json')
          out.write_text(json.dumps(index, indent=2, sort_keys=True) + '\n')
          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          Path('aggregate/journey-10y-index.sha256').write_text(digest + '\n')
          assert cross['rows'] > 0
          assert cross['aggregation_transport'] == 'BINARY_SEARCH_NEAREST_V1'
          PY
      - name: Upload authoritative Journey aggregate
        uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-market-journey-10y-aggregate-${{ github.sha }}
          path: aggregate
          if-no-files-found: error
          retention-days: 90
