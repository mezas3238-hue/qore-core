name: QORE Scalper Methodology Audit

on:
  push:
    branches:
      - agent/scalper-architect-b-methodology-20261010
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scalper-methodology-${{ github.ref }}
  cancel-in-progress: true

jobs:
  methodology_quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research requirements
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff methodology source and tests
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_scalper_author_route_audit_v1.py \
            src/qore/infrastructure/trader_lab/capitalizer_scalper_caller_audit_v1.py \
            src/qore/infrastructure/trader_lab/capitalizer_scalper_v49_v50_g_waterfall_v1.py \
            src/qore/infrastructure/trader_lab/capitalizer_high_frequency_capacity_census_v49.py \
            src/qore/infrastructure/trader_lab/capitalizer_scalper_certification_standard_v2.py \
            tests/infrastructure/trader_lab/test_capitalizer_scalper_author_route_audit_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_scalper_caller_audit_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_scalper_v49_v50_g_waterfall_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_v49_h1_target_causality.py \
            tests/infrastructure/trader_lab/test_capitalizer_v49_source_alternative_contract.py \
            tests/infrastructure/trader_lab/test_capitalizer_scalper_certification_standard_v2.py
      - name: Mypy methodology and certification
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_scalper_v49_v50_g_waterfall_v1.py \
            src/qore/infrastructure/trader_lab/capitalizer_scalper_caller_audit_v1.py \
            src/qore/infrastructure/trader_lab/capitalizer_scalper_author_route_audit_v1.py \
            src/qore/infrastructure/trader_lab/capitalizer_high_frequency_capacity_census_v49.py \
            src/qore/infrastructure/trader_lab/capitalizer_scalper_certification_standard_v2.py
      - name: Pytest methodology regressions
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_scalper_v49_v50_g_waterfall_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_scalper_author_route_audit_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_scalper_caller_audit_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_v49_h1_target_causality.py \
            tests/infrastructure/trader_lab/test_capitalizer_v49_source_alternative_contract.py \
            tests/infrastructure/trader_lab/test_capitalizer_scalper_certification_standard_v2.py \
            tests/infrastructure/trader_lab/test_capitalizer_high_frequency_capacity_census_v49.py
      - name: Static caller census for QORE source gates
        run: |
          mkdir -p artifacts
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_caller_audit_v1 \
            --source-root src \
            --json-out artifacts/scalper-entry-caller-census.json \
            | tee artifacts/scalper-entry-caller-census.log
      - name: Upload caller evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scalper-entry-caller-census
          path: artifacts/scalper-entry-caller-census.*
          if-no-files-found: warn

  full_quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research requirements
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff repo
        run: ruff check .
      - name: Mypy repo
        run: mypy src tests
      - name: Pytest critical cross-track invariants
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_v53_winner_preserving_rearm_economics.py \
            tests/infrastructure/trader_lab/test_capitalizer_v54_causal_m1_stop_ladder_rescue.py \
            tests/infrastructure/trader_lab/test_capitalizer_v54_structural_partial_runner.py
