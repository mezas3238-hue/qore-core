name: QORE Shared Lab Global Exam

on:
  push:
    branches:
      - agent/qore-shared-lab-001
    paths:
      - "src/qore/infrastructure/core_stack_v2/shared_lab*.py"
      - "tests/infrastructure/test_core_stack_v2_shared_lab*.py"
      - ".github/workflows/qore-shared-lab-global-exam.yml"
  pull_request:
    paths:
      - "src/qore/infrastructure/core_stack_v2/shared_lab*.py"
      - "tests/infrastructure/test_core_stack_v2_shared_lab*.py"
      - ".github/workflows/qore-shared-lab-global-exam.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  global-laboratory-exam:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Integrated laboratory regression
        run: |
          pytest -q tests/infrastructure/test_core_stack_v2_shared_lab_global_exam.py
      - name: Emit sovereign laboratory receipt
        run: |
          mkdir -p result/shared-lab
          python -m qore.infrastructure.core_stack_v2.shared_lab_global_exam \
            > result/shared-lab/global-laboratory-exam.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("result/shared-lab/global-laboratory-exam.json")
          payload = json.loads(path.read_text())
          assert payload["passed"] is True
          assert payload["global_l10_pass"] is True
          assert payload["readiness_blockers"] == []
          assert payload["laboratory_available_for_shared_validation"] is True
          assert payload["protected_holdout_opened"] is False
          assert payload["productive_authority"] is False
          print("QORE_SHARED_LAB_GLOBAL_EXAM=PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-lab-global-exam-${{ github.sha }}
          path: result/shared-lab/global-laboratory-exam.json
          if-no-files-found: error
          retention-days: 90
