name: VT08 Index R21 Concurrent Quality Budget

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r21-concurrent-quality-budget.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r21_concurrent_quality_budget.py
      - tests/infrastructure/trader_lab/test_vt08_index_r21_concurrent_quality_budget.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r21_concurrent_quality_budget.py

  research:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R21 concurrent quality budget search
        run: |
          python -m qore.infrastructure.trader_lab.vt08_index_r21_concurrent_quality_budget             --nas100-root artifacts/NAS100             --sp500-root artifacts/SP500             --us30-root artifacts/US30             --out artifacts/report/vt08-index-r21-concurrent-quality-budget.json

      - name: Verify Owner architecture
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(
              Path("artifacts/report/vt08-index-r21-concurrent-quality-budget.json").read_text()
          )
          assert report["identity"] == "VT08_INDEX_R21_CONCURRENT_QUALITY_BUDGET_001"
          c=report["contract"]
          assert c["cross_market_concurrency_required"] is True
          assert c["signal_suppression_allowed"] is False
          assert c["global_single_position_rule"] is False
          assert c["primary_portfolio_dd_max_r"] == "6"
          assert report["best"]["sample"] == 1574
          assert report["best"]["diagnostics"]["suppressed_trade_count"] == 0
          g=report["governance"]
          assert g["all_trades_preserved"] is True
          assert g["same_timestamp_batch_allocation"] is True
          assert g["pro_rata_portfolio_budget"] is True
          assert g["future_outcome_used_for_new_signal_risk"] is False
          assert g["zero_risk_allowed"] is False
          assert g["live_authorized"] is False
          assert g["real_capital_authorized"] is False
          assert g["production_authorized"] is False
          PY

      - name: Build summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path("artifacts/report")
          r=json.loads(
              (root/"vt08-index-r21-concurrent-quality-budget.json").read_text()
          )
          b=r["best"]
          p=b["primary"]
          s=b["secondary"]
          pm=b["primary_conservative_mark_to_market"]
          sm=b["secondary_conservative_mark_to_market"]
          d=b["diagnostics"]
          lines=[
              "# VT08 INDEX R21 Concurrent Quality Budget",
              "",
              f"- schemes: {r['scheme_count']}",
              f"- finalists with MTM: {r['full_mtm_finalist_count']}",
              f"- goal candidates: {r['goal_candidate_count']}",
              f"- best scheme: {b['scheme']['scheme_id']}",
              f"- trades: {b['sample']}",
              f"- suppressed trades: {d['suppressed_trade_count']}",
              f"- max concurrent: {d['max_concurrent_open_positions']}",
              f"- max committed risk: {d['max_committed_structural_risk_r']}R",
              f"- budget scaled batches: {d['budget_scaled_batches']}",
              "",
              "## Primary -0.05R",
              f"- PF: {p['profit_factor']}",
              f"- realized DD: {p['max_drawdown_r']}R",
              f"- concurrent conservative DD: {pm['max_drawdown_r']}R",
              f"- total: {p['total_r']}R",
              "",
              "## Secondary -0.10R",
              f"- PF: {s['profit_factor']}",
              f"- realized DD: {s['max_drawdown_r']}R",
              f"- concurrent conservative DD: {sm['max_drawdown_r']}R",
              f"- total: {s['total_r']}R",
              f"- goal pass: {b['goal_pass']}",
          ]
          (root/"VT08_INDEX_R21_CONCURRENT_QUALITY_BUDGET_SUMMARY.md").write_text(
              "\n".join(lines)+"\n"
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-index-r21-concurrent-quality-budget-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
