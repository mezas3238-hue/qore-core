name: QORE Capitalizer V3 Step4 Trade Delta Provenance 2Y V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-v3-step4-trade-delta-provenance-2y-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v3_step4_trade_delta_provenance_2y_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v3_step4_trade_delta_provenance_2y_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-v3-step4-trade-delta-provenance-2y-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  V3_RUN_ID: '35806006221'
  V3_SHA: '7f9b9efc82376bb5edbea42379a0a3cf3e72a94a'
  STEP4_RUN_ID: '35810309765'
  STEP4_SHA: 'd436fc6b70e64f457dc4615869a8e28d4347c4f2'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_v3_step4_trade_delta_provenance_2y_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_v3_step4_trade_delta_provenance_2y_v1.py
      - name: Mypy
        run: |
          mypy src/qore/infrastructure/trader_lab/capitalizer_v3_step4_trade_delta_provenance_2y_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_v3_step4_trade_delta_provenance_2y_v1.py

  reconcile:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download frozen V3 market ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v3-frozen-replay-2y-v1-*-${{ env.V3_SHA }}
          path: v3-source
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.V3_RUN_ID }}
      - name: Download frozen Step-4 market ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v3-cisd-or-m5-aligned-2y-v1-*-${{ env.STEP4_SHA }}
          path: step4-source
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.STEP4_RUN_ID }}
      - name: Reconcile trade ledgers
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v3_step4_trade_delta_provenance_2y_v1 \
            v3-source step4-source report-output
      - name: Enforce reconciliation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "report-output/"
                  "capitalizer-v3-step4-trade-delta-provenance-2y-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_V3_STEP4_TRADE_DELTA_PROVENANCE_2Y_V1"
          )
          assert report["v3_raw_control_reproduced"] is True
          assert report["step4_raw_control_reproduced"] is True
          assert report["v3_max3_control_reproduced"] is True
          assert report["step4_max3_control_reproduced"] is True
          assert report["raw_delta_reconciled"] is True
          assert report["max3_delta_reconciled"] is True
          assert report["v3_raw_trades"] == 475
          assert report["step4_raw_trades"] == 495
          assert report["v3_max3_trades"] == 474
          assert report["step4_max3_trades"] == 494
          assert report["strategy_mutated"] is False
          assert report["outcome_used_for_admission"] is False
          assert report["diagnostic_only"] is True
          assert report["economic_candidate"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v3-step4-trade-delta-provenance-2y-v1-${{ github.sha }}
          path: report-output
          if-no-files-found: error
          retention-days: 90
