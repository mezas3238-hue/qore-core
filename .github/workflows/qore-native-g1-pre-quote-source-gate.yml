name: QORE Native G1 PRE native quote source format integrity - NO NET

on:
  push:
    branches:
      - research/qore-native-g1-quote-source-integrity-20261012
    paths:
      - 'src/qore/infrastructure/trader_lab/qore_native_g1_pre_quote_source_gate_v1.py'
      - 'tests/infrastructure/trader_lab/test_qore_native_g1_pre_quote_source_gate_v1.py'
      - 'src/qore/infrastructure/trader_lab/qore_native_g1_pre_native_side_join_v1.py'
      - 'tests/infrastructure/trader_lab/test_qore_native_g1_pre_native_side_join_v1.py'
      - '.github/workflows/qore-native-g1-pre-quote-source-gate.yml'
      - 'docs/research/QORE_NATIVE_G1_PRE_NATIVE_TICKS_SOURCE_PLAN_2026-10-12.md'
  pull_request:
    branches:
      - research/qore-native-master-handoff-33x7-bidask-e3-20261012
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic_contract_tests_only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install -e '.[dev]' 'numpy>=2,<3'
      - name: Verify fail-closed G1-PRE source contract
        run: |
          set -euo pipefail
          ruff check --select F,E4,E7,E9 src/qore/infrastructure/trader_lab/qore_native_g1_pre_quote_source_gate_v1.py src/qore/infrastructure/trader_lab/qore_native_g1_pre_native_side_join_v1.py tests/infrastructure/trader_lab/test_qore_native_g1_pre_quote_source_gate_v1.py tests/infrastructure/trader_lab/test_qore_native_g1_pre_native_side_join_v1.py
          python -m compileall -q src/qore/infrastructure/trader_lab/qore_native_g1_pre_quote_source_gate_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_qore_native_g1_pre_quote_source_gate_v1.py tests/infrastructure/trader_lab/test_qore_native_g1_pre_native_side_join_v1.py
      - name: Declare source integrity CI scope
        run: |
          echo "SYNTHETIC CONTRACT TESTS ONLY, 0 REAL BROKER QUOTE RECORDS READ"
          echo "G1 NET BLOCKED / 0 OF 3 CERTIFIED / NO LIVE OR PAPER ORDERS"
