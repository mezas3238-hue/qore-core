name: QORE Capitalizer Source Strategy Gross Economics V47 S2B

on:
  push:
    branches:
      - agent/capitalizer-canonical-source-remediation-v47-s2-001
    paths:
      - '.github/workflows/qore-capitalizer-source-strategy-gross-economics-v47-s2b.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_source_strategy_gross_economics_v47_s2b.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_source_strategy_gross_economics_v47_s2b.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-source-strategy-gross-economics-v47-s2b-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_S2A_RUN_ID: '36642644284'
  SOURCE_S2A_SHA: 'ff6c9745690dde76520aecf608e44401622a1074'
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
  QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,ctrader]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_source_strategy_gross_economics_v47_s2b.py \
            tests/infrastructure/trader_lab/test_capitalizer_source_strategy_gross_economics_v47_s2b.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_source_strategy_gross_economics_v47_s2b.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_source_strategy_gross_economics_v47_s2b.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol:
          - USDJPY
          - AUDJPY
          - AUDUSD
          - GBPJPY
          - EURUSD
          - GBPUSD
          - XAUUSD
          - USDCAD
          - NAS100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[ctrader]'
      - name: Verify read-only cTrader inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in QORE_CTRADER_CLIENT_ID QORE_CTRADER_CLIENT_SECRET QORE_CTRADER_ACCESS_TOKEN QORE_CTRADER_REFRESH_TOKEN; do
            test -n "${!name:-}" || { echo "missing required read-only DEMO input: $name" >&2; exit 2; }
          done
      - name: Discover DEMO account when not configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            if ! [[ "$account_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "cTrader DEMO account discovery returned invalid id" >&2
              exit 3
            fi
            echo "::add-mask::$account_id"
            printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          fi
      - name: Download frozen S2-A MAX3 population
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-v47-s2a-aggregate-${{ env.SOURCE_S2A_SHA }}
          path: s2a-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_S2A_RUN_ID }}
      - name: Download immutable provider-native 10Y M1
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Replay frozen gross lifecycle
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_source_strategy_gross_economics_v47_s2b \
            market s2a-source m1-source \
            --symbol "${{ matrix.symbol }}" \
            --output s2b-output
      - name: Enforce market governance
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path=Path("s2b-output") / f"capitalizer-s2b-{os.environ['SYMBOL'].lower()}-report.json"
          report=json.loads(path.read_text())
          assert report["identity"] == "QORE_CAPITALIZER_V47_S2B_FROZEN_GROSS_ECONOMICS"
          assert report["source_s2a_run_id"] == 36642644284
          assert report["source_s2a_sha"] == "ff6c9745690dde76520aecf608e44401622a1074"
          assert report["replayed_rows"] == report["frozen_population_rows"]
          assert report["candidate_reselected"] is False
          assert report["costs_applied"] is False
          assert report["fresh_holdout_opened"] is False
          assert report["trader_certified"] is False

          trades=Path("s2b-output") / f"capitalizer-s2b-{os.environ['SYMBOL'].lower()}-trades.jsonl"
          for line in trades.read_text().splitlines():
              if not line.strip():
                  continue
              row=json.loads(line)
              assert row["identity"] == report["identity"]
              assert row["source_identity"] == "QORE_CAPITALIZER_SOURCE_STRATEGY_ISOLATION_V47_S2"
              assert row["route"] == "FRACTAL_SCALP_CONTINUATION"
              assert row["candidate_reselected"] is False
              assert row["stop_changed"] is False
              assert row["target_changed"] is False
              assert row["costs_applied"] is False
              assert row["fresh_holdout_opened"] is False
              assert row["trader_certified"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v47-s2b-${{ matrix.symbol }}-${{ github.sha }}
          path: s2b-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v47-s2b-*-${{ github.sha }}
          path: s2b-markets
          merge-multiple: true
      - name: Aggregate frozen gross economics
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_source_strategy_gross_economics_v47_s2b \
            aggregate s2b-markets \
            --output s2b-aggregate
      - name: Enforce aggregate governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(
              Path("s2b-aggregate/capitalizer-s2b-gross-economics.json").read_text()
          )
          assert report["identity"] == "QORE_CAPITALIZER_V47_S2B_FROZEN_GROSS_ECONOMICS"
          assert report["predeclaration_comment_id"] == 5901733888
          assert report["source_s2a_run_id"] == 36642644284
          assert report["source_s2a_sha"] == "ff6c9745690dde76520aecf608e44401622a1074"
          assert report["frozen_population_rows"] == 91
          assert report["periods"]["reserved"]["trades"] == 30
          assert report["periods"]["validation"]["trades"] == 30
          assert report["periods"]["development"]["trades"] == 31
          assert report["overall"]["trades"] == 91
          assert report["population_reselected"] is False
          assert report["costs_applied"] is False
          assert report["fresh_holdout_opened"] is False
          assert report["full_cognitive_gate_replayed"] is False
          assert report["ftm_stream_included"] is False
          assert report["trader_certified"] is False
          assert report["next_phase"] == "S2B_GROSS_ECONOMICS_READY_FOR_ADJUDICATION"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v47-s2b-aggregate-${{ github.sha }}
          path: s2b-aggregate
          if-no-files-found: error
          retention-days: 90
