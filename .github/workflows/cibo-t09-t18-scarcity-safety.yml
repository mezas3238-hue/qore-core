name: QORE CIBO T09 T18 Scarcity Safety Gate

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-t09-t18-scarcity-safety.yml'
      - 'src/qore/infrastructure/cibo_t09_t18_scarcity_safety_gate.py'
      - 'tests/infrastructure/test_cibo_t09_t18_scarcity_safety_gate.py'
      - 'docs/research/CIBO-T09-T18-NONCOMPENSATORY-SCARCITY-SAFETY-GATE-V1.md'
      - 'docs/research/CIBO-MASTER-OPEN-WORK-LEDGER-V1.json'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  t09-t18-scarcity-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: T09/T18 non-compensatory scarcity safety contract
        run: |
          ruff check \
            src/qore/infrastructure/cibo_t09_t18_scarcity_safety_gate.py \
            tests/infrastructure/test_cibo_t09_t18_scarcity_safety_gate.py
          mypy src/qore/infrastructure/cibo_t09_t18_scarcity_safety_gate.py
          python -m py_compile \
            src/qore/infrastructure/cibo_t09_t18_scarcity_safety_gate.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_t09_t18_scarcity_safety_gate.py
