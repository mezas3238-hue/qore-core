name: QORE CIBO T09 T18 Scarcity Safety Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-t09-t18-scarcity-safety.yml'
      - 'src/qore/infrastructure/cibo_t09_t18_scarcity_safety_gate.py'
      - 'tests/infrastructure/test_cibo_t09_t18_scarcity_safety_gate.py'
      - 'docs/research/CIBO-T09-T18-NONCOMPENSATORY-SCARCITY-SAFETY-GATE-V1.md'
      - 'docs/research/CIBO-MASTER-OPEN-WORK-LEDGER-V1.json'
  push:
    branches:
      - agent/cibo-certification-architect-a-science-001
      - agent/cibo-integrator-ab-001
    paths:
      - '.github/workflows/cibo-t09-t18-scarcity-safety.yml'
      - 'src/qore/infrastructure/cibo_t09_t18_scarcity_safety_gate.py'
      - 'tests/infrastructure/test_cibo_t09_t18_scarcity_safety_gate.py'
      - 'docs/research/CIBO-T09-T18-NONCOMPENSATORY-SCARCITY-SAFETY-GATE-V1.md'
      - 'docs/research/CIBO-MASTER-OPEN-WORK-LEDGER-V1.json'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  t09-t18-scarcity-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src/qore/infrastructure/cibo_t09_t18_scarcity_safety_gate.py tests/infrastructure/test_cibo_t09_t18_scarcity_safety_gate.py
      - name: mypy
        run: mypy src/qore/infrastructure/cibo_t09_t18_scarcity_safety_gate.py
      - name: pytest
        run: pytest -q --no-cov tests/infrastructure/test_cibo_t09_t18_scarcity_safety_gate.py
