name: VT08 Index R119 Previous Source Day Alignment

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r119-previous-source-day-alignment.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r119_previous_source_day_alignment.py
      - tests/infrastructure/trader_lab/test_vt08_index_r119_previous_source_day_alignment.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r119_previous_source_day_alignment.py

  attribution:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R119 previous source-day alignment attribution
        run: |
          mkdir -p artifacts/report
          python -m qore.infrastructure.trader_lab.vt08_index_r119_previous_source_day_alignment \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r119-previous-source-day-alignment.json

      - name: Verify R119 frozen attribution contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r119-previous-source-day-alignment.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R119_PREVIOUS_SOURCE_DAY_ALIGNMENT_ATTRIBUTION_001"
          )
          assert report["source_r118"]["run_id"] == 35667373524
          assert report["source_r118"]["artifact_id"] == 10669755410
          assert report["source_r118"]["artifact_digest"] == (
              "sha256:0a5fd516e7d3c795171b31f63a0eabf957ddb35ad27a934c6ba2746c7032421a"
          )

          expected = {
              "five_year": 1756,
              "recent_two_year": 746,
              "r66_failed_holdout": 546,
          }
          for key, sample in expected.items():
              section = report[key]
              assert section["sample"] == sample
              assert section["expected_sample"] == sample
              assert sum(
                  int(row["sample"])
                  for row in section["previous_source_day_alignment"].values()
              ) == sample
              assert sum(
                  int(row["sample"])
                  for row in section["alignment_x_relation"].values()
              ) == sample
              assert sum(
                  int(row["sample"])
                  for row in section["alignment_x_last_state"].values()
              ) == sample

          freeze = report["v4_semantic_freeze"]
          assert freeze["source_day_reconstruction"] == "EXACT_V4_SOURCE_DAYS"
          assert freeze["previous_alignment"] == (
              "BODY_SIGN_EQUALS_SIDE_SIGN_ELSE_OPPOSED"
          )
          assert freeze["source_days_requested"] == 2
          assert freeze["v4_retained_source_days_original"] == 3
          assert freeze["classification_consumed_source_days"] == 2
          assert freeze["numeric_price_threshold_used"] is False
          assert freeze["outcome_used_for_classification"] is False
          assert freeze["calendar_or_year_used_for_classification"] is False

          gov = report["governance"]
          assert gov["research_only"] is True
          assert gov["candidate_created"] is False
          assert gov["signals_suppressed"] is False
          assert gov["trade_count_changed"] is False
          assert gov["target_changed"] is False
          assert gov["stop_changed"] is False
          assert gov["risk_allocator_changed"] is False
          assert gov["runtime_filter_created"] is False
          assert gov["anchor_14_enabled"] is False
          assert gov["live_authorized"] is False
          assert gov["real_capital_authorized"] is False
          assert gov["production_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r119-previous-source-day-alignment-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
