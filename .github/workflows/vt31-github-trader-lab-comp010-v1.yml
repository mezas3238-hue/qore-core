name: QORE VT31 GitHub Trader Lab Comparator010 V1

on:
  push:
    branches:
      - agent/vt31-edge-position-cert-b-001
    paths:
      - scripts/vt31_nas100_comp010_live_context_adverse_exit_v1.py
      - scripts/vt31_nas100_comp010_stitched_adjudicator_v1.py
      - scripts/vt31_ultrafast_scientific_replay_lab.py
      - .github/workflows/vt31-github-trader-lab-comp010-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  trader-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install research runtime
        run: pip install -e ".[dev]"

      - name: Static gates
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/vt31_nas100_comp010_live_context_adverse_exit_v1.py \
            scripts/vt31_nas100_comp010_stitched_adjudicator_v1.py \
            scripts/vt31_ultrafast_scientific_replay_lab.py
          ruff check \
            scripts/vt31_nas100_comp010_live_context_adverse_exit_v1.py \
            scripts/vt31_nas100_comp010_stitched_adjudicator_v1.py \
            scripts/vt31_ultrafast_scientific_replay_lab.py

      - name: Recover four immutable consumed evidence folds in parallel
        run: |
          set -euo pipefail
          mkdir -p input/{r5,r6,r8,consumed} result

          fetch_fold() {
            fold="$1"
            artifact="$2"
            expected="$3"
            evidence_path="$4"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact}/zip" \
              > "input/${fold}.zip"
            unzip -q "input/${fold}.zip" -d "input/${fold}"
            test -f "input/${fold}/${evidence_path}"
            actual="$(sha256sum "input/${fold}/${evidence_path}" | awk '{print $1}')"
            test "${actual}" = "${expected}"
          }

          fetch_fold r5 10380044761 \
            7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7 \
            fresh/NAS100/market-evidence.json &
          p1=$!
          fetch_fold r6 10389112524 \
            cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581 \
            fresh/NAS100/market-evidence.json &
          p2=$!
          fetch_fold r8 10402199719 \
            4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb \
            fresh/NAS100/market-evidence.json &
          p3=$!
          fetch_fold consumed 10557487418 \
            acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09 \
            NAS100/market-evidence.json &
          p4=$!

          wait "$p1" "$p2" "$p3" "$p4"

      - name: Run ultrafast four-fold Trader Lab
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python scripts/vt31_ultrafast_scientific_replay_lab.py \
            --target-script scripts/vt31_nas100_comp010_live_context_adverse_exit_v1.py \
            --fold r5=input/r5/fresh/NAS100/market-evidence.json \
            --fold r6=input/r6/fresh/NAS100/market-evidence.json \
            --fold r8=input/r8/fresh/NAS100/market-evidence.json \
            --fold consumed=input/consumed/NAS100/market-evidence.json \
            --output-dir result/lab \
            --cache-dir result/cache \
            --heartbeat-seconds 1

      - name: Adjudicate stitched DD and frozen Sharpe
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python \
            scripts/vt31_nas100_comp010_stitched_adjudicator_v1.py \
            --fold r5=result/lab/folds/r5/result.json \
            --fold r6=result/lab/folds/r6/result.json \
            --fold r8=result/lab/folds/r8/result.json \
            --fold consumed=result/lab/folds/consumed/result.json \
            --output result/comp010-stitched-adjudication.json \
            | tee result/comp010-stitched-summary.json

      - name: Governance and control parity
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          x=json.loads(
              Path("result/comp010-stitched-adjudication.json").read_text()
          )
          control=x["variants"]["COMP006_CONTROL"]
          assert Decimal(
              control["drawdown_episode"]["max_drawdown_r"]
          ) == Decimal("10.1496554650811747544085540")
          assert Decimal(
              control["risk_adjusted"]["annualized_sharpe"]
          ) == Decimal("1.276669451759115528152190315657251")

          g=x["governance"]
          assert g["consumed_evidence_only"] is True
          assert g["fresh_holdout_opened"] is False
          assert g["pure_edge_only"] is True
          assert g["metric_conventions_retuned"] is False
          assert g["position_sizing_used"] is False
          assert g["dynamic_sizing_used"] is False
          assert g["leverage_used"] is False
          assert g["compounding_used"] is False
          assert g["portfolio_weighting_used"] is False
          assert g["capital_weighting_used"] is False
          assert g["candidate_certified"] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-github-trader-lab-comp010-${{ github.sha }}
          path: result/
          retention-days: 90
