name: QORE Turtle Soup GBPJPY R36 Candidate Freeze

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/turtle-soup-gbpjpy-r36-candidate-freeze.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_r36_candidate_freeze.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_gbpjpy_r36_candidate_freeze.py'
  push:
    branches:
      - agent/turtle-soup-gbpjpy-specialist-memory-v1-001
    paths:
      - '.github/workflows/turtle-soup-gbpjpy-r36-candidate-freeze.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_r36_candidate_freeze.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_gbpjpy_r36_candidate_freeze.py'

permissions:
  contents: read
  actions: read

env:
  R35_RUN_ID: '35370716933'
  R35_ARTIFACT: 'qore-turtle-soup-gbpjpy-r35-confidence-tier-03465666dc235e06002f189d4db476813150960e'

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Focused quality
        run: |
          ruff check --ignore E501,I001 \
            src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_r36_candidate_freeze.py \
            tests/infrastructure/trader_lab/test_turtle_soup_gbpjpy_r36_candidate_freeze.py
          mypy --disable-error-code attr-defined \
            src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_r36_candidate_freeze.py
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_turtle_soup_gbpjpy_r36_candidate_freeze.py
      - name: Download exact passing R35 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.R35_ARTIFACT }}
          path: r35-source
          github-token: ${{ github.token }}
          run-id: ${{ env.R35_RUN_ID }}
      - name: Freeze exact R35 candidate
        run: |
          mkdir -p r36-output
          python -m qore.infrastructure.trader_lab.turtle_soup_gbpjpy_r36_candidate_freeze \
            r35-source r36-output > r36-output/stdout.json
          printf '%s\n' "$GITHUB_SHA" > r36-output/git-sha.txt
      - name: Enforce freeze governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('r36-output/r36-candidate-freeze-manifest.json').read_text())
          assert p['identity']=='TURTLE_SOUP_GBPJPY_R36_CONFIDENCE_CANDIDATE_001'
          assert p['status']=='FROZEN_FOR_5Y_VALIDATION'
          assert p['development_2y_result']['trades']==371
          assert p['development_2y_result']['profit_factor_scaled_net_010']=='1.917321619841829026960123251'
          assert p['development_2y_result']['max_drawdown_scaled_r']=='5.34575969539718361901697478'
          assert p['next_stage']['fresh_holdout_status']=='SEALED_UNTOUCHED'
          g=p['governance']
          assert g['candidate_frozen'] is True
          assert g['trader_certified'] is False
          assert g['live_authorized'] is False
          assert g['real_capital_authorized'] is False
          assert g['merge_authorized'] is False
          PY
      - name: Hash frozen evidence
        run: |
          cd r36-output
          sha256sum r36-candidate-freeze-manifest.json stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-gbpjpy-r36-candidate-freeze-${{ github.sha }}
          path: r36-output
          if-no-files-found: error
          retention-days: 90
