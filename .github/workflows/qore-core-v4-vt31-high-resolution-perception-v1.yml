name: QORE Core V4 VT31 High Resolution Perception

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - scripts/vt31_core_stack_v4_high_resolution_perception_v1.py
      - .github/workflows/qore-core-v4-vt31-high-resolution-perception-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  high-resolution:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Static validation
        run: |
          ruff check scripts/vt31_core_stack_v4_high_resolution_perception_v1.py
          python -m py_compile scripts/vt31_core_stack_v4_high_resolution_perception_v1.py

      - name: Recover immutable VT31 pure trades CIBO and raw M1
        run: |
          set -euo pipefail
          mkdir -p input/pure input/cibo input/r8 input/r6 input/r5 result

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10799064861/zip" > pure.zip
          unzip -q pure.zip -d input/pure
          (cd input/pure && sha256sum -c SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10478487667/zip" > cibo.zip
          unzip -q cibo.zip -d input/cibo
          (cd input/cibo && sha256sum -c SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10402199719/zip" > r8.zip
          unzip -q r8.zip -d input/r8
          echo "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb  input/r8/fresh/NAS100/market-evidence.json" | sha256sum -c -

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10389112524/zip" > r6.zip
          unzip -q r6.zip -d input/r6
          echo "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581  input/r6/fresh/NAS100/market-evidence.json" | sha256sum -c -

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10380044761/zip" > r5.zip
          unzip -q r5.zip -d input/r5
          echo "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7  input/r5/fresh/NAS100/market-evidence.json" | sha256sum -c -

      - name: Run high-resolution causal falsification
        run: |
          python scripts/vt31_core_stack_v4_high_resolution_perception_v1.py             --r8-trades input/pure/r8.json             --r6-trades input/pure/r6.json             --r5-trades input/pure/r5.json             --r8-raw input/r8/fresh/NAS100/market-evidence.json             --r6-raw input/r6/fresh/NAS100/market-evidence.json             --r5-raw input/r5/fresh/NAS100/market-evidence.json             --daily-path input/cibo/DAILY_PATH_LEDGER.jsonl             --output result/high-resolution.json             | tee result/summary.json

      - name: Governance and binding gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/high-resolution.json").read_text())
          assert p["challenge_set"] == {"trades":822,"losses":711,"wins":111}
          g=p["governance"]
          assert g["methodology_modified"] is False
          assert g["current_outcome_used"] is False
          assert g["future_m1_used"] is False
          assert g["r5_retuned"] is False
          assert g["shared_order_authority"] is False
          assert g["shared_risk_authority"] is False
          assert g["live_authorized"] is False
          assert g["merge_authorized"] is False
          print(json.dumps({
              "economic_status":p["economic_status"],
              "passes_high_resolution":p["passes_high_resolution"],
              "frozen_policy":p["frozen_policy"],
              "evaluation":p["evaluation"],
              "gates":p.get("gates"),
          },sort_keys=True))
          PY

      - name: Bind result
        run: |
          echo "$GITHUB_SHA" > result/git-sha.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd result && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: qore-core-v4-vt31-high-resolution-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
