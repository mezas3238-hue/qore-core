name: QORE CIBO Final Integrated Exam Assembly

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/qore/infrastructure/cibo_final_integrated_exam_assembly.py'
      - 'tests/infrastructure/test_cibo_final_integrated_exam_assembly.py'
      - '.github/workflows/cibo-final-integrated-exam-assembly.yml'

permissions:
  contents: read

jobs:
  final-integrated-assembly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Exact 18 receipt assembly
        run: |
          ruff check \
            src/qore/infrastructure/cibo_final_integrated_exam_assembly.py \
            tests/infrastructure/test_cibo_final_integrated_exam_assembly.py
          mypy src/qore/infrastructure/cibo_final_integrated_exam_assembly.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_final_integrated_exam_assembly.py
