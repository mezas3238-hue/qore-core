name: QORE Capitalizer V3 SOURCE_FIRST FVG Maturation Census 2Y V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-v3-source-first-fvg-maturation-census-2y-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v3_source_first_fvg_maturation_census_2y_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v3_source_first_fvg_maturation_census_2y_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-v3-source-first-fvg-maturation-census-2y-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  FVG_ATLAS_RUN_ID: '35863834011'
  FVG_ATLAS_SHA: 'd04453ac596a46186d69f1e7e4df94c0576d1b53'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_v3_source_first_fvg_maturation_census_2y_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_v3_source_first_fvg_maturation_census_2y_v1.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_v3_source_first_fvg_maturation_census_2y_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_v3_source_first_fvg_maturation_census_2y_v1.py

  census:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download frozen FVG-missing ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v3-source-first-fvg-missing-atlas-2y-v1-*-${{ env.FVG_ATLAS_SHA }}
          path: fvg-atlas-source
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.FVG_ATLAS_RUN_ID }}
      - name: Run outcome-free FVG maturation census
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v3_source_first_fvg_maturation_census_2y_v1 \
            fvg-atlas-source census-output
      - name: Enforce frozen controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "census-output/"
                  "capitalizer-nine-market-v3-source-first-fvg-maturation-census-2y-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_V3_SOURCE_FIRST_FVG_MATURATION_CENSUS_2Y_V1"
          )
          assert report["rows"] == 322
          assert report["same_side_fvg_before_deadline"] == 289
          assert report["opposed_fvg_before_deadline"] == 246
          assert sum(report["delay_from_mss_minutes"].values()) == 289
          assert sum(report["remaining_h1_minutes"].values()) == 289
          assert sum(report["fvg_order"].values()) == 322
          assert report["outcome_fields_read"] is False
          assert report["outcome_used_for_classification"] is False
          assert report["strategy_mutated"] is False
          assert report["diagnostic_only"] is True
          assert report["economic_candidate"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["fresh_holdout_claimed"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-nine-market-v3-source-first-fvg-maturation-census-2y-v1-${{ github.sha }}
          path: census-output
          if-no-files-found: error
          retention-days: 90
