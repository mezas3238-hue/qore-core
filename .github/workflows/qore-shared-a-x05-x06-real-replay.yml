name: QORE Shared A X05 X06 Real Replay

concurrency:
  group: qore-shared-a-x05-x06-real-replay
  cancel-in-progress: false

on:
  push:
    branches:
      - agent/shared-a-cognitive-science-001
    paths:
      - scripts/shared_x05_x06_position_trajectory_memory_replay.py
      - .github/workflows/qore-shared-a-x05-x06-real-replay.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Recover immutable position source evidence
        run: |
          set -euo pipefail
          mkdir -p input/{pure,r6,r5} result
          ruff check scripts/shared_x05_x06_position_trajectory_memory_replay.py
          python -m py_compile scripts/shared_x05_x06_position_trajectory_memory_replay.py
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10799064861/zip" > pure.zip
          unzip -q pure.zip -d input/pure
          (cd input/pure && sha256sum -c SHA256SUMS)
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10389112524/zip" > r6.zip
          unzip -q r6.zip -d input/r6
          (cd input/r6 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10380044761/zip" > r5.zip
          unzip -q r5.zip -d input/r5
          (cd input/r5 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)
      - name: Replay trajectory memory
        run: |
          set -euo pipefail
          python scripts/shared_x05_x06_position_trajectory_memory_replay.py             --r6-trades input/pure/r6.json             --r6-nas input/r6/fresh/NAS100/market-evidence.json             --r6-sp input/r6/fresh/SP500/market-evidence.json             --r6-us input/r6/fresh/US30/market-evidence.json             --r5-trades input/pure/r5.json             --r5-nas input/r5/fresh/NAS100/market-evidence.json             --r5-sp input/r5/fresh/SP500/market-evidence.json             --r5-us input/r5/fresh/US30/market-evidence.json             --output result/x05-x06-real-replay.json             | tee result/summary.json
      - name: Validate bounded disposition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/x05-x06-real-replay.json").read_text())
          assert p["status"] == "X05_X06_REAL_DATA_BOUND_CAUSAL_REPLAY_PASS"
          assert p["proof"]["source_time_points_only"] is True
          assert p["proof"]["future_market_used_by_memory"] is False
          assert p["proof"]["future_outcome_used_by_memory"] is False
          assert p["proof"]["pnl_used_by_memory"] is False
          assert p["proof"]["position_management_authority"] is False
          assert p["scientific_claims"]["trajectory_memory_economic_value_demonstrated"] is False
          assert p["governance"]["protected_certification_holdout_opened"] is False
          PY
      - name: Seal result
        run: |
          printf '%s\n' "${GITHUB_SHA}" > result/code-git-sha.txt
          (
            cd result
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-a-x05-x06-real-replay-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
      - name: Report X-05/X-06
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p=json.loads(Path("result/x05-x06-real-replay.json").read_text())
          body="\n".join([
              "## Shared A X-05/X-06 — Position Journey / Trajectory Memory Real Replay",
              "",
              f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- disposition: **{p['status']}**",
              f"- R6: **{p['results']['r6']}**",
              f"- R5: **{p['results']['r5']}**",
              "- source-time points only: **True**",
              "- future/outcome/PnL used by memory: **False / False / False**",
              "- position-management authority: **False**",
              "- economic value demonstrated: **False**",
          ])+"\n"
          Path("result/issue-comment.md").write_text(body)
          PY
          gh issue comment 638 --body-file result/issue-comment.md
