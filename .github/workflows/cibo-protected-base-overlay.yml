name: QORE CIBO Protected Base Overlay

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-protected-base-overlay.yml'
      - 'src/qore/infrastructure/cibo_protected_base_overlay.py'
      - 'tests/infrastructure/test_cibo_protected_base_overlay.py'
      - 'docs/research/CIBO-MASTER-OPEN-WORK-LEDGER-V1.json'
  push:
    branches:
      - agent/cibo-capital-efficiency-sizing-lab-001
    paths:
      - '.github/workflows/cibo-protected-base-overlay.yml'
      - 'src/qore/infrastructure/cibo_protected_base_overlay.py'
      - 'tests/infrastructure/test_cibo_protected_base_overlay.py'
      - 'docs/research/CIBO-MASTER-OPEN-WORK-LEDGER-V1.json'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  protected-base-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Protected-base overlay quality
        run: |
          ruff check \
            src/qore/infrastructure/cibo_protected_base_overlay.py \
            tests/infrastructure/test_cibo_protected_base_overlay.py
          mypy src/qore/infrastructure/cibo_protected_base_overlay.py
          python -m py_compile \
            src/qore/infrastructure/cibo_protected_base_overlay.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_protected_base_overlay.py
