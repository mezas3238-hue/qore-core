name: QORE VT31 ICT Silver Bullet 3Y Causal PDH PDL Capacity Fast V1

on:
  push:
    branches:
      - agent/vt31-architect-operations-cert-20261009
    paths:
      - scripts/vt31_ict_silver_bullet_3y_pdh_pdl_causal_capacity_v1.py
      - .github/workflows/vt31-ict-silver-bullet-3y-pdh-pdl-capacity-fast-v1.yml
  workflow_dispatch:

concurrency:
  group: vt31-ict-causal-pdh-pdl-3y-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  FROZEN_3Y_EVIDENCE_ID: "11459859004"

jobs:
  causal-prior-day-fvg-capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate self-tests and Python syntax
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_ict_silver_bullet_3y_pdh_pdl_causal_capacity_v1.py
          python scripts/vt31_ict_silver_bullet_3y_pdh_pdl_causal_capacity_v1.py --self-test
          python -m pip install 'ijson>=3.3,<4'

      - name: Restore immutable previously consumed NAS100 M1
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FROZEN_3Y_EVIDENCE_ID}/zip" > frozen-3y.zip
          unzip -q frozen-3y.zip -d input
          test -s input/NAS100/market-evidence.json
          if [ -f input/EVIDENCE-SHA256SUMS ]; then
            (cd input && sha256sum -c EVIDENCE-SHA256SUMS)
          fi

      - name: Test 3Y original ICT clock and previous completed NY day DOL
        run: |
          set -euo pipefail
          python scripts/vt31_ict_silver_bullet_3y_pdh_pdl_causal_capacity_v1.py \
            --evidence input/NAS100/market-evidence.json \
            --output result/ict-3y-causal-pdh-pdl-fvg-capacity.json \
            | tee result/ict-3y-causal-pdh-pdl-fvg-summary.json

      - name: Methodology gate not economic replay nor broker fill
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('result/ict-3y-causal-pdh-pdl-fvg-capacity.json').read_text())
          assert x['base_id'] == 'VT31_NAS100_OWNER_3Y_BASE_001'
          assert x['m1_bars'] == 1059784
          assert set(x['models']) == {'VT31_LONDON', 'VT31_NY_AM', 'VT31_NY_PM'}
          g=x['governance']
          assert g['first_selected_candidate_from_asof_only'] is True
          assert g['prior_day_only_after_ny_midnight_close'] is True
          assert g['pdh_pdl_only_one_dol_family_not_universal_ict_requirement'] is True
          assert g['outcomes_used_for_selection'] is False
          assert g['m1_intrabar_touch_not_a_verified_fill'] is True
          assert g['fresh_holdout_opened'] is False
          assert g['candidate_certified'] is False
          for name, item in x['models'].items():
              assert item['trade_count'] == 'NOT_PROVEN'
              assert item['profit_factor'] == 'NOT_COMPUTABLE_WITHOUT_EXECUTION'
              assert item['drawdown_r'] == 'NOT_COMPUTABLE_WITHOUT_EXECUTION'
              assert item['complete_source_hour_days'] >= 700
              assert item['days_with_subsequent_intrawindow_midpoint_touch'] <= item['days_with_first_pdh_pdl_10point_fvg_hypothesis']
              assert item['days_with_first_pdh_pdl_10point_fvg_hypothesis'] <= item['complete_source_hour_days']
          PY

      - name: Reproducibility hash
        run: |
          set -euo pipefail
          echo "$GITHUB_SHA" > result/git-sha.txt
          echo "$FROZEN_3Y_EVIDENCE_ID" > result/immutable-3y-evidence-artifact-id.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd result && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-ict-3y-causal-pdh-pdl-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
