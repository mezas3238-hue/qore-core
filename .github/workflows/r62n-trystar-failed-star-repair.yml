name: Apply bounded R62N TryStar failed-star repair

on:
  push:
    branches: [agent/qore-umi14-umi12-final-owner-recert-001]
    paths: [.github/workflows/r62n-trystar-failed-star-repair.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qore-umi14-umi12-final-owner-recert-001
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Verify exact staging ancestry
        run: |
          test "$(git rev-parse HEAD^)" = "35d48570b93473da7bfd4ae0a50073bc253cba76"
      - name: Install canonical development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Apply bounded TryStar scanner repair and regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py")
          text = path.read_text()

          signature = (
              "    def _scan_flow_failed_star_exception_paths(\n"
              "        self,\n"
              "        node: ast.Try,\n"
              "        environment: dict[str, _Value],\n"
              "    ) -> None:\n"
          )
          replacement = (
              "    def _scan_flow_failed_star_exception_paths(\n"
              "        self,\n"
              "        node: ast.Try | ast.TryStar,\n"
              "        environment: dict[str, _Value],\n"
              "    ) -> None:\n"
          )
          if text.count(signature) != 1:
              raise SystemExit("unexpected failed-star flow signature count")
          text = text.replace(signature, replacement, 1)

          old_match = '''                match = _r62n_handler_match(
                    _r62n_exception_name(raised_outcome.state),
                    handler.type,
                    raised_outcome.state[0],
                )
                if match is False:
                    next_unhandled.append(raised_outcome)
                    continue
'''
          new_match = '''                if isinstance(node, ast.TryStar):
                    may_handle, fully_handled = _r62n_trystar_handler_partition(
                        _r62n_exception_group_members(raised_outcome.state),
                        handler.type,
                        raised_outcome.state[0],
                    )
                    match: bool | None = True if may_handle else False
                else:
                    match = _r62n_handler_match(
                        _r62n_exception_name(raised_outcome.state),
                        handler.type,
                        raised_outcome.state[0],
                    )
                    fully_handled = match is True
                if match is False:
                    next_unhandled.append(raised_outcome)
                    continue
'''
          if text.count(old_match) != 1:
              raise SystemExit("unexpected failed-star handler match count")
          text = text.replace(old_match, new_match, 1)

          old_unhandled = '''                if match is None:
                    next_unhandled.append(raised_outcome)
'''
          new_unhandled = '''                if match is None or not fully_handled:
                    next_unhandled.append(raised_outcome)
'''
          if text.count(old_unhandled) != 1:
              raise SystemExit("unexpected failed-star unhandled count")
          text = text.replace(old_unhandled, new_unhandled, 1)

          old_scan = '''        if isinstance(node, ast.Try):
            self._scan_flow_failed_star_exception_paths(node, environment)
'''
          new_scan = '''        if isinstance(node, (ast.Try, ast.TryStar)):
            self._scan_flow_failed_star_exception_paths(node, environment)
'''
          if text.count(old_scan) != 1:
              raise SystemExit("unexpected scan dispatch count")
          text = text.replace(old_scan, new_scan, 1)

          test_anchor = "\ndef test_r62n_unknown_star_import_taints_new_call_names() -> None:\n"
          if text.count(test_anchor) != 1:
              raise SystemExit("unexpected TryStar regression anchor count")
          regression = r'''

def test_r62n_failed_star_trystar_preserves_partial_binding() -> None:
    module_name = "qore_r62n_trystar_star_regression"
    module = _R62NStarImportModule(module_name)
    module.__all__ = ["b", "missing"]
    module.b = _py_builtins.eval
    sys.modules[module_name] = module
    try:
        dangerous = (
            "b = len\n"
            "try:\n"
            f"    from {module_name} import *\n"
            "except* AttributeError:\n"
            "    result = b(\"1+1\")\n"
        )
        safe = (
            "b = len\n"
            "try:\n"
            "    try:\n"
            f"        from {module_name} import *\n"
            "    finally:\n"
            "        b = lambda _: 3\n"
            "except* AttributeError:\n"
            "    result = b(\"abc\")\n"
        )
        assert _runtime_result(dangerous) == 2
        assert _runtime_result(safe) == 3
        assert _r62n_dynamic_execution_markers_from_source(dangerous)
        assert _r62n_dynamic_execution_markers_from_source(safe) == ()
    finally:
        sys.modules.pop(module_name, None)

'''
          text = text.replace(test_anchor, regression + test_anchor, 1)
          path.write_text(text)
          PY
      - name: Focused validation
        run: |
          python -m py_compile tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
          ruff check tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
          mypy tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
          pytest -q tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
      - name: Full canonical quality gate
        run: |
          ruff check .
          mypy src tests
          pytest --cov=src/qore --cov-report=term-missing
      - name: Commit validated repair and remove staging
        run: |
          git config user.name "qore-integration-authority"
          git config user.email "qore-integration-authority@users.noreply.github.com"
          git add tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
          git rm .github/workflows/r62n-trystar-failed-star-repair.yml
          git diff --cached --check
          git commit -m "Cover failed-star TryStar exception paths"
          git push origin HEAD:agent/qore-umi14-umi12-final-owner-recert-001
