name: CRT Trader - operational certification readiness (NO ORDERS)

on:
  push:
    branches:
      - research/crt-r4a-34-holdout-2y-20261111
    paths:
      - ".github/workflows/crt-r4a-operational-certification-readiness.yml"
      - "research/crt_r4a_holdout/crt_operational_release_preflight.py"
      - "research/crt_r4a_holdout/data/manifest.json"
      - "research/crt_r4a_holdout/tests/test_crt_operational_release_preflight.py"
      - "src/qore/infrastructure/ctrader_open_api_transport.py"
      - "src/qore/infrastructure/ctrader_demo_execution_codec.py"
      - "src/qore/infrastructure/traders/crt_r4a_*"
      - "tests/infrastructure/traders/test_crt_r4a_*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-scientific-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QORE QA dependencies without broker authentication
        run: pip install -e '.[dev]'
      - name: Validate synthetic candidate, broker-native bracket and certification blockers
        run: |
          python -m pytest -q tests/infrastructure/traders/test_crt_r4a_protected_candidate.py tests/infrastructure/traders/test_crt_r4a_native_bracket.py research/crt_r4a_holdout/tests/test_crt_operational_release_preflight.py
      - name: Generate definitive read-only release preflight
        run: |
          python -m research.crt_r4a_holdout.crt_operational_release_preflight --repo . --out crt-operational-readiness.json
          python -c "import json; d=json.load(open('crt-operational-readiness.json')); assert d['status']=='BLOCKED_NOT_CERTIFIABLE'; assert d['release_authorized'] is False; assert d['live_execution_allowed'] is False"
          echo "RELEASE=BLOCKED_NOT_CERTIFIABLE; ZERO_ORDER_SUBMISSIONS" >> "$GITHUB_STEP_SUMMARY"
          echo "PROVIDER_PROTECTIVE_SLTP=BLOCKED; 34/34 ECONOMIC CERTIFICATION=PENDING" >> "$GITHUB_STEP_SUMMARY"
      - name: Save non-secret scientific and operational gate
        uses: actions/upload-artifact@v4
        with:
          name: qore-crt-real-trader-certification-blockers-no-live
          path: crt-operational-readiness.json
          retention-days: 30
