name: QORE Capitalizer V50-R M1 Rearm Capacity

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - 'src/qore/infrastructure/trader_lab/capitalizer_v50_target_stop_intelligence.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v50_target_stop_intelligence.py'
      - '.github/workflows/qore-capitalizer-v50-r-rearm-capacity.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v50_m1_rearm_contract.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v50_m1_rearm_capacity.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v50_m1_rearm_contract.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v50_m1_rearm_capacity.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # A V50-R run is an expensive deterministic census. A newer source commit must not
  # cancel a run that already passed quality and started consuming retained M1.
  group: qore-capitalizer-v50-r-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE development dependencies
        run: python -m pip install -e '.[dev]'
      - name: V50 stop-integrity regression
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_v50_target_stop_intelligence.py \
            tests/infrastructure/trader_lab/test_capitalizer_v50_target_stop_intelligence.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_v50_target_stop_intelligence.py
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_v50_target_stop_intelligence.py
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_v50_m1_rearm_contract.py \
            src/qore/infrastructure/trader_lab/capitalizer_v50_m1_rearm_capacity.py \
            tests/infrastructure/trader_lab/test_capitalizer_v50_m1_rearm_contract.py \
            tests/infrastructure/trader_lab/test_capitalizer_v50_m1_rearm_capacity.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_v50_m1_rearm_contract.py \
            src/qore/infrastructure/trader_lab/capitalizer_v50_m1_rearm_capacity.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_v50_m1_rearm_contract.py \
            tests/infrastructure/trader_lab/test_capitalizer_v50_m1_rearm_capacity.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - symbol: USDJPY
            session: ASIA
          - symbol: AUDJPY
            session: ASIA
          - symbol: AUDUSD
            session: ASIA
          - symbol: GBPJPY
            session: ASIA
          - symbol: EURUSD
            session: LONDON
          - symbol: GBPUSD
            session: LONDON
          - symbol: XAUUSD
            session: NEW_YORK
          - symbol: USDCAD
            session: NEW_YORK
          - symbol: NAS100
            session: NEW_YORK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download retained provider-native M1
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Verify M1 provenance
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("m1-source/m1-clone-manifest.json").read_text())
          assert manifest["canonical_symbol"] == os.environ["EXPECTED_SYMBOL"]
          assert manifest["provider_native_m1"] is True
          assert manifest["synthetic_m1"] is False
          assert manifest["interpolated_m1"] is False
          assert manifest["contradictory_m1"] == 0
          assert manifest["read_only"] is True
          PY
      - name: Run V50-R rearm capacity
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v50_m1_rearm_capacity \
            market m1-source rearm-output --session "${{ matrix.session }}"
      - name: Enforce pre-economic boundary
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
          EXPECTED_SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"].lower()
          result = json.loads(
              (Path("rearm-output") / f"capitalizer-{symbol}-v50-r-rearm-capacity.json").read_text()
          )
          assert result["symbol"] == os.environ["EXPECTED_SYMBOL"]
          assert result["session"] == os.environ["EXPECTED_SESSION"]
          assert result["outcome_used"] is False
          assert result["economics_used"] is False
          assert result["reserved_holdout_reopened"] is False
          assert result["fresh_holdout_used"] is False
          assert result["development_only"] is True
          assert result["runtime_policy_candidate"] is False
          PY
      - name: Upload rearm capacity
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v50-r-${{ matrix.symbol }}-${{ github.sha }}
          path: rearm-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download nine rearm artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v50-r-*-${{ github.sha }}
          path: rearm-markets
          merge-multiple: false
      - name: Build V50-R matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v50_m1_rearm_capacity \
            matrix rearm-markets matrix-output
      - name: Upload V50-R matrix
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v50-r-matrix-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 180
