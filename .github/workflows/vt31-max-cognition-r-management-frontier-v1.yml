name: QORE VT31 Maximum Cognition R Management Frontier V1

on:
  push:
    branches:
      - agent/vt31-edge-position-cert-b-001
    paths:
      - scripts/vt31_nas100_max_cognition_r_management_frontier_v1.py
      - .github/workflows/vt31-max-cognition-r-management-frontier-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Static gate
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_max_cognition_r_management_frontier_v1.py
          ruff check scripts/vt31_nas100_max_cognition_r_management_frontier_v1.py

      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"

      - name: Run maximum-cognition R frontier
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python scripts/vt31_nas100_max_cognition_r_management_frontier_v1.py             "input/${EVIDENCE_PATH}"             --output "result/max-cog-r-${PARTITION}.json"             | tee "result/summary-${PARTITION}.json"

      - name: Governance gate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=os.environ["PARTITION"]
          x=json.loads(Path(f"result/max-cog-r-{p}.json").read_text())
          g=x["governance"]
          assert g["full_cognitive_accounting_required_for_every_trade"] is True
          assert g["maximum_intelligence_required_for_candidate_freeze"] is True
          assert g["same_admission_population"] is True
          assert g["entry_changed"] is False
          assert g["r_runtime_strategy_allowed"] is True
          assert g["r_used_for_volume"] is False
          assert g["position_sizing_used"] is False
          assert g["leverage_used"] is False
          assert g["compounding_used"] is False
          assert g["capital_weighting_used"] is False
          assert g["future_outcome_used_for_threshold_selection"] is False
          assert g["fresh_holdout_opened"] is False
          counts={v["trade_count"] for v in x["variants"].values()}
          assert len(counts) == 1
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-max-cognition-r-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-max-cognition-r-*-${{ github.sha }}
          path: input
          merge-multiple: true

      - name: Aggregate maximum-cognition R frontier
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          folds=("r5","r6","r8","consumed")
          variants=(
              "URGENCY_HIGH_BE3",
              "URGENCY_NONLOW_BE4",
              "URGENCY_HYBRID_HIGH3_MIXED4",
              "DESTINATION_SHALLOW3_NEUTRAL4_DEEP_HOLD",
              "FULL_COGNITION_HYBRID",
          )
          payloads={
              f:json.loads(Path(f"input/max-cog-r-{f}.json").read_text())
              for f in folds
          }
          def d(v): return Decimal(str(v))

          report={}
          for variant in variants:
              per_fold={}
              pf_non=mean_non=dd_non=0
              winner_ok=True
              changed=0
              for fold in folds:
                  b=payloads[fold]["variants"]["STRUCTURAL_ONLY"]
                  c=payloads[fold]["variants"][variant]
                  bm=b["stress_0_05r"]
                  cm=c["stress_0_05r"]
                  wp=c["winner_preservation_vs_structural"]
                  pf_ok=(
                      bm["profit_factor"] is not None
                      and cm["profit_factor"] is not None
                      and d(cm["profit_factor"]) >= d(bm["profit_factor"])
                  )
                  mean_ok=d(cm["mean_r"]) >= d(bm["mean_r"])
                  dd_ok=d(cm["max_drawdown_r"]) <= d(bm["max_drawdown_r"])
                  pf_non += int(pf_ok)
                  mean_non += int(mean_ok)
                  dd_non += int(dd_ok)
                  wc=d(wp["winner_count_preservation"])
                  wr=d(wp["winner_r_preservation"])
                  winner_ok &= wc >= d("0.80") and wr >= d("0.90")
                  changed += c["breakeven_armed_count"]
                  per_fold[fold]={
                      "baseline":bm,
                      "candidate":cm,
                      "winner_preservation":wp,
                      "breakeven_armed_count":c["breakeven_armed_count"],
                      "selected_threshold_counts":c["selected_threshold_counts"],
                      "cognitive_counts":c["cognitive_counts"],
                      "pf_nondegrade":pf_ok,
                      "mean_nondegrade":mean_ok,
                      "dd_nondegrade":dd_ok,
                  }
              report[variant]={
                  "folds":per_fold,
                  "pf_nondegrade_folds":pf_non,
                  "mean_nondegrade_folds":mean_non,
                  "dd_nondegrade_folds":dd_non,
                  "winner_preservation_all_folds":winner_ok,
                  "armed_count_total":changed,
                  "cross_fold_research_survivor":(
                      pf_non >= 3
                      and mean_non >= 3
                      and dd_non >= 3
                      and winner_ok
                      and changed > 0
                  ),
              }

          payload={
              "schema":"qore.vt31.nas100.max_cognition_r_management_frontier.aggregate.v1",
              "head":"${{ github.sha }}",
              "variants":report,
              "governance":{
                  "full_cognition_selects_r_management":True,
                  "maximum_intelligence_required_for_candidate_freeze":True,
                  "sizing_for_certification_forbidden":True,
                  "fresh_holdout_opened":False,
                  "policy_promoted":False,
                  "candidate_frozen":False,
                  "candidate_certified":False,
              },
          }
          Path("result/aggregate.json").write_text(
              json.dumps(payload,sort_keys=True,indent=2)+"\n"
          )
          print(json.dumps(payload,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-max-cognition-r-aggregate-${{ github.sha }}
          path: result/
          retention-days: 90
