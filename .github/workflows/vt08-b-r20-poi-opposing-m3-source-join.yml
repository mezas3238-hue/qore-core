name: VT08 B R20 POI To Opposing M3 Series Native Join
on:
  workflow_dispatch:
  push:
    branches: [agent/vt08-5m-cognition-replay-20261010]
    paths:
      - src/qore/infrastructure/trader_lab/vt08_b_r20_poi_opposing_run_causal_join_v1.py
      - tests/infrastructure/trader_lab/test_vt08_b_r20_poi_opposing_run_causal_join_v1.py
      - .github/workflows/vt08-b-r20-poi-opposing-m3-source-join.yml
permissions:
  contents: read
  actions: read
jobs:
  original-native-r18-r19-bearish-series-causal:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        market: [EURJPY, USDCHF, NZDUSD, CADJPY, USDCAD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Ruff and causal series negative controls
        run: |
          ruff check src/qore/infrastructure/trader_lab/vt08_b_r20_poi_opposing_run_causal_join_v1.py tests/infrastructure/trader_lab/test_vt08_b_r20_poi_opposing_run_causal_join_v1.py
          pytest -q tests/infrastructure/trader_lab/test_vt08_b_r20_poi_opposing_run_causal_join_v1.py
      - uses: actions/download-artifact@v4
        with:
          name: vt08-a-frozen-m30m3-firstfail-${{ matrix.market }}-394116f13449fc310d7fbc5f0b5f60aa1bb247d4
          path: r3/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 38715560333
      - uses: actions/download-artifact@v4
        with:
          name: qore-vt08-m3-fractal-${{ matrix.market }}-bc1379d7661aac202495ec67afdd3098473ba723
          path: native-m3/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 35941643396
      - uses: actions/download-artifact@v4
        with:
          name: vt08-b-r18-pre-cisd-poi-${{ matrix.market }}-9349cc84ee245c68291db60b4613411453061c94
          path: r18/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 38902918264
      - uses: actions/download-artifact@v4
        with:
          name: vt08-b-r19-blind-poi-${{ matrix.market }}-e999e127be84a1ebb9d3e8b1d13e110cfa2cb51a
          path: r19/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 38903529731
      - name: Prove pre-CISD original M3 FVG vs bearish opposing run causal position
        env:
          MARKET: ${{ matrix.market }}
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json, os
          from pathlib import Path
          from qore.infrastructure.trader_lab.vt08_b_r20_poi_opposing_run_causal_join_v1 import (
              audit_r20, digest,
          )
          m=os.environ["MARKET"]
          patterns=[
              ("r3",m+"-frozen-source-firstfail.json"),
              ("native-m3","m3-evidence.json"),
              ("r18",m+"-VT08-B-R18-preCISD-H1-POI-source.json"),
              ("r19",m+"-VT08-R19-blind-POI-review-packet.json"),
          ]
          paths=[]
          for parent,filename in patterns:
              matches=list(Path(parent,m).rglob(filename))
              if len(matches)!=1:
                  raise SystemExit("R20 missing singular SHA-pinned original source "+filename)
              paths.append(matches[0])
          frozen=json.loads(paths[0].read_text(encoding="utf-8"))
          src18=json.loads(paths[2].read_text(encoding="utf-8"))
          src19=json.loads(paths[3].read_text(encoding="utf-8"))
          result=audit_r20(frozen,src18,src19,market=m,native_m3=paths[1])
          expected={"EURJPY":538,"USDCHF":518,"NZDUSD":550,"CADJPY":516,"USDCAD":535}
          if (result["original_cases"]!=expected[m] or
              result["counts"]["all_original_source_cases"]!=expected[m] or
              result["source_authorized_entries"] or result["genuine_human_A_signoffs"] or
              result["genuine_human_B_signoffs"] or result["broker_fills"] or
              result["cognitive_admissions"] or result["holdout_7y_accessed"] or
              result["sizing_used"] or result["profit_factor"] is not None):
              raise SystemExit("R20 changed census/author gate or contaminated VT08")
          dest=Path("evidence",m+"-VT08-B-R20-original-M3-POI-run-join.json")
          dest.write_text(
              json.dumps(result,sort_keys=True,separators=(",",":"),allow_nan=False),
              encoding="utf-8",
          )
          print(json.dumps({
              "market":m,"source_cases":result["original_cases"],
              "blind_cases":result["blind_review_cases"],
              "counts":result["counts"],"sha256":digest(result),
              "author_entries":result["source_authorized_entries"],
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vt08-b-r20-causal-poi-${{ matrix.market }}-${{ github.sha }}
          path: evidence/*.json
          if-no-files-found: error
          retention-days: 30
