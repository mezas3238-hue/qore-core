name: VT08 Index R33 Causal POI Health Governor

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r33-causal-poi-health-governor.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r33_causal_poi_health_governor.py
      - tests/infrastructure/trader_lab/test_vt08_index_r33_causal_poi_health_governor.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r33_causal_poi_health_governor.py

  research:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R33 causal POI health governor
        run: |
          python -m qore.infrastructure.trader_lab.vt08_index_r33_causal_poi_health_governor \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r33-causal-poi-health-governor.json

      - name: Verify causal governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(Path("artifacts/report/vt08-index-r33-causal-poi-health-governor.json").read_text())
          assert report["identity"] == "VT08_INDEX_R33_CAUSAL_POI_HEALTH_GOVERNOR_001"
          assert 2300 <= report["sample"] <= 2500
          c=report["contract"]
          assert c["all_signals_preserved"] is True
          g=report["governance"]
          assert g["calendar_year_used_for_decision"] is False
          assert g["future_outcome_used_for_new_signal_risk"] is False
          assert g["static_r28_fvg_quality_hierarchy_used"] is False
          assert g["experience_memory_dimension"] == "poi_family_rolling_health"
          assert g["signal_suppression_allowed"] is False
          assert g["zero_risk_allowed"] is False
          assert g["live_authorized"] is False
          assert g["real_capital_authorized"] is False
          assert g["production_authorized"] is False
          PY

      - name: Upload R33 evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-index-r33-causal-poi-health-governor-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
