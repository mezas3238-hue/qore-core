name: QORE Scalper A2 MAX3 Censoring Evidence

on:
  push:
    branches:
      - agent/scalper-architect-b-methodology-20261010
    paths:
      - '.github/workflows/qore-scalper-a2-max3-counterfactual-audit.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_max3_counterfactual_audit_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_scalper_max3_counterfactual_audit_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-scalper-a2-max3-censoring-${{ github.ref }}
  cancel-in-progress: true

env:
  FROZEN_V49_CONTROL_RUN_ID: '38053946695'
  FROZEN_V49_CONTROL_SHA: 'e356e7a52541e99533b25ecfef0ab9c4e9ce03c0'

jobs:
  max3_counterfactual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research requirements
        run: python -m pip install -e '.[dev]'
      - name: Static and test contract
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_scalper_max3_counterfactual_audit_v1.py tests/infrastructure/trader_lab/test_capitalizer_scalper_max3_counterfactual_audit_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_scalper_max3_counterfactual_audit_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_scalper_max3_counterfactual_audit_v1.py
      - name: Download prior nine-market V49 simulated outcome ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: scalper-a2-v49-control-*-${{ env.FROZEN_V49_CONTROL_SHA }}
          path: frozen-v49-ledgers
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.FROZEN_V49_CONTROL_RUN_ID }}
      - name: Verify source run contains nine exact market artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("frozen-v49-ledgers")
          markers = sorted(root.rglob("capitalizer-*-v49-development-economics-trades.jsonl"))
          assert len(markers) == 9, f"9 original V49 market ledgers required, got {len(markers)}"
          assert len(list(root.rglob("capitalizer-*-v49-development-economics.json"))) == 9
          PY
      - name: Measure excluded counterfactuals vs MAX3 chronological selected
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_max3_counterfactual_audit_v1 \
            frozen-v49-ledgers max3-analysis
      - name: Post-hoc evidence only, no certification or selection changes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("max3-analysis/scalper-a2-v49-max3-counterfactual.json")
          r = json.loads(p.read_text())
          assert r["source_simulated_economic_rows"] == 2876
          assert r["max3_selected"] == 2020
          assert r["max3_excluded_simulated_counterfactuals"] == 856
          assert r["no_outcome_aware_reranking"] is True
          assert r["can_infer_ex_ante_policy_improvement"] is False
          assert r["excluded_outcomes_are_not_executed_fills"] is True
          assert r["trader_certified"] is False and r["live_authorized"] is False
          print("SELECTED: ", r["selected"])
          print("EXCLUDED COUNTERFACTUAL:", r["excluded_counterfactual"])
          PY
      - name: Archive post-hoc MAX3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-max3-counterfactual-${{ github.sha }}
          path: max3-analysis/
          retention-days: 90
          if-no-files-found: error
