name: QORE Turtle Soup EURUSD R36 Candidate Freeze

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-eurusd-specialist-memory-v1-001
    paths:
      - '.github/workflows/turtle-soup-eurusd-r36-candidate-freeze.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_eurusd_r36_candidate_freeze.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_eurusd_r36_candidate_freeze.py'

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: '35325383868'
  SOURCE_ARTIFACT: 'qore-turtle-soup-eurusd-r36-structural-fragility-governor-bcf11b8a040b343eb89dcb1faa463cef150d68a6'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check --ignore E501,I001 src/qore/infrastructure/trader_lab/turtle_soup_eurusd_r36_candidate_freeze.py tests/infrastructure/trader_lab/test_turtle_soup_eurusd_r36_candidate_freeze.py
      - run: mypy --disable-error-code attr-defined src/qore/infrastructure/trader_lab/turtle_soup_eurusd_r36_candidate_freeze.py
      - run: pytest -q --no-cov tests/infrastructure/trader_lab/test_turtle_soup_eurusd_r36_candidate_freeze.py

  freeze:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: r36-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Freeze exact R36 candidate
        run: |
          mkdir -p freeze-output
          python -m qore.infrastructure.trader_lab.turtle_soup_eurusd_r36_candidate_freeze r36-source freeze-output > freeze-output/stdout.json
          printf '%s\n' "$GITHUB_SHA" > freeze-output/freeze-code-sha.txt
      - name: Enforce freeze governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('freeze-output/r36-candidate-freeze-manifest.json').read_text())
          assert p['status']=='FROZEN_FOR_5Y_VALIDATION'
          assert p['development_2y_result']['trades']==366
          assert p['development_2y_result']['profit_factor_scaled_net_010']=='3.235289727084444144145496287'
          assert p['development_2y_result']['max_drawdown_scaled_r']=='3.83972573211060055575442915'
          assert p['frozen_contract']['risk_governor']=='FRAGILITY_050_025_010'
          assert p['frozen_contract']['single_position_busy'] is True
          assert p['next_stage']['fresh_holdout_status']=='SEALED_UNTOUCHED'
          g=p['governance']
          assert g['candidate_frozen'] is True
          assert g['fresh_holdout_consumed'] is False
          assert g['live_authorized'] is False
          assert g['real_capital_authorized'] is False
          PY
      - name: Hash freeze evidence
        run: |
          cd freeze-output
          sha256sum r36-candidate-freeze-manifest.json stdout.json freeze-code-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-eurusd-r36-candidate-freeze-${{ github.sha }}
          path: freeze-output
          if-no-files-found: error
          retention-days: 90
