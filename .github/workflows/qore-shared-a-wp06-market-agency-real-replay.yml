name: QORE Shared A WP06 Market Agency Real Replay

concurrency:
  group: qore-shared-a-wp06-market-agency-real-replay
  cancel-in-progress: false

on:
  push:
    branches:
      - agent/shared-a-cognitive-science-001
    paths:
      - scripts/shared_wp06_market_agency_replay.py
      - .github/workflows/qore-shared-a-wp06-market-agency-real-replay.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Recover immutable source evidence
        run: |
          set -euo pipefail
          mkdir -p input/{r6,r5} result
          ruff check scripts/shared_wp06_market_agency_replay.py
          python -m py_compile scripts/shared_wp06_market_agency_replay.py
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10389112524/zip" > r6.zip
          unzip -q r6.zip -d input/r6
          (cd input/r6 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10380044761/zip" > r5.zip
          unzip -q r5.zip -d input/r5
          (cd input/r5 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)
      - name: Replay Market Agency on real source observations
        run: |
          set -euo pipefail
          python scripts/shared_wp06_market_agency_replay.py             --r6-nas input/r6/fresh/NAS100/market-evidence.json             --r6-sp input/r6/fresh/SP500/market-evidence.json             --r6-us input/r6/fresh/US30/market-evidence.json             --r5-nas input/r5/fresh/NAS100/market-evidence.json             --r5-sp input/r5/fresh/SP500/market-evidence.json             --r5-us input/r5/fresh/US30/market-evidence.json             --output result/wp06-market-agency-real-replay.json             | tee result/summary.json
      - name: Validate bounded scientific state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/wp06-market-agency-real-replay.json").read_text())
          assert p["status"] == "WP06_MARKET_AGENCY_ENGINE_REAL_DATA_BOUND_REPLAY_PASS"
          assert p["proof"]["future_market_read"] is False
          assert p["proof"]["future_outcome_read"] is False
          assert p["proof"]["actor_identity_claimed"] is False
          assert p["scientific_claims"]["wp06_exit_gate_pass"] is False
          assert p["governance"]["wp05_dependency_closed"] is False
          assert p["governance"]["wp06_close_authorized"] is False
          assert p["governance"]["protected_certification_holdout_opened"] is False
          PY
      - name: Seal result
        run: |
          printf '%s\n' "${GITHUB_SHA}" > result/code-git-sha.txt
          (
            cd result
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-a-wp06-market-agency-real-replay-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
      - name: Report WP-06 research foundation
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p=json.loads(Path("result/wp06-market-agency-real-replay.json").read_text())
          body="\n".join([
              "## Shared A WP-06 / MC-17 — Market Agency Real Replay",
              "",
              f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- disposition: **{p['status']}**",
              f"- R6: **{p['results']['r6']}**",
              f"- R5: **{p['results']['r5']}**",
              "- actor identity claimed: **False**",
              "- future/outcome/Trader methodology read: **False / False / False**",
              "- WP-05 dependency closed: **False**",
              "- WP-06 exit gate pass: **False**",
              "- productive authority: **False**",
          ])+"\n"
          Path("result/issue-comment.md").write_text(body)
          PY
          gh issue comment 644 --body-file result/issue-comment.md
