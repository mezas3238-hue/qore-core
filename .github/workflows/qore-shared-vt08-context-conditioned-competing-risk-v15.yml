name: QORE Shared VT08 Context Conditioned Competing Risk V15

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - scripts/vt08_index_shared_context_conditioned_competing_risk_v15.py
      - scripts/vt08_index_shared_competing_risk_calibration_v9.py
      - .github/workflows/qore-shared-vt08-context-conditioned-competing-risk-v15.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  context-conditioned-competing-risk-v15:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout Shared
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: |
          pip install -e ".[dev]"
          pip install "numpy>=2,<3" "scikit-learn>=1.5,<2"
      - name: Static validation
        run: |
          ruff check scripts/vt08_index_shared_context_conditioned_competing_risk_v15.py
          python -m py_compile scripts/vt08_index_shared_context_conditioned_competing_risk_v15.py
      - name: Download frozen V6 consumed ledger
        uses: actions/download-artifact@v4
        with:
          name: qore-shared-vt08-stop-target-discrimination-v6-1a534d0ae735efef4dcbc0c0be4b110ceaa80501
          path: artifacts/v6
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36131607443
      - name: Run V15 context conditioned competing risk
        run: |
          set -euo pipefail
          mkdir -p artifacts/v15
          python scripts/vt08_index_shared_context_conditioned_competing_risk_v15.py \
            --v6-json artifacts/v6/vt08-index-shared-stop-target-discrimination-v6.json \
            --out artifacts/v15/vt08-index-shared-context-conditioned-competing-risk-v15.json \
            | tee artifacts/v15/summary.json
      - name: Validate V15 governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("artifacts/v15/vt08-index-shared-context-conditioned-competing-risk-v15.json").read_text())
          assert p["identity"] == "QORE_SHARED_VT08_CONTEXT_CONDITIONED_COMPETING_RISK_V15"
          assert p["source_v6_run"] == 36131607443
          assert p["source_v9_run"] == 36134739656
          assert p["source_v13_run"] == 36141181714
          assert p["source_v14_run"] == 36141583773
          assert p["research_only"] is True
          assert p["consumed_evidence_only"] is True
          assert p["v9_model_reused"] is True
          assert p["context_conditioning_generic_only"] is True
          assert p["symbol_identity_in_inference_rule"] is False
          assert p["market_identity_used_for_offline_robustness_only"] is True
          assert p["runtime_outcome_input"] is False
          assert p["future_market_input"] is False
          assert p["sizing_used"] is False
          assert p["risk_weighting_used"] is False
          assert p["runtime_actuation"] is False
          for key in ("five_year","recent_two_year","r66_consumed_failed_holdout"):
              assert p["windows"][key]["status"] in {"ADMIT_FOR_VALIDATION","ADMIT_FOR_ECONOMIC_SHADOW","REJECT"}
              assert p["windows"][key]["sample"] > 0
          print(json.dumps({
              "validation_pass":p["validation_pass"],
              "selected_cell_count":len(p["selected_cells"]),
              "selected_cells":p["selected_cells"],
              "windows":p["windows"],
          },sort_keys=True))
          PY
      - name: Bind result
        run: |
          cd artifacts/v15
          echo "$GITHUB_SHA" > shared-git-sha.txt
          echo "36131607443" > source-v6-run.txt
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-vt08-context-conditioned-competing-risk-v15-${{ github.sha }}
          path: artifacts/v15/
          if-no-files-found: error
          retention-days: 90
