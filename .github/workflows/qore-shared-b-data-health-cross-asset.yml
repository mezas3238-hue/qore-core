name: QORE Shared B Data Health Cross-Asset Replication

on:
  push:
    branches:
      - agent/shared-b-global-world-perception-001
    paths:
      - src/qore/infrastructure/core_stack_v2/shared_b_global_data_health.py
      - tests/infrastructure/test_shared_b_global_data_health.py
      - scripts/shared_b_global_data_health_cross_asset_replay.py
      - .github/workflows/qore-shared-b-data-health-cross-asset.yml
  workflow_dispatch:

concurrency:
  group: qore-shared-b-data-health-cross-asset-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  RAW_RUN_ID: "36746337433"
  RAW_ARTIFACT_ID: "11113260581"
  RAW_GIT_SHA: "80c83baf2538195e2c8ece17e286e80603aae571"
  RAW_ARTIFACT_DIGEST: "sha256:2d763ed01e66e223ba384ae3273db07beb7337dc6aede71bd4bc02aea69d839f"

jobs:
  replicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Shared
        run: pip install -e ".[dev]"

      - name: Validate B-09 freshness and replay code
        run: |
          set -euo pipefail
          ruff check             src/qore/infrastructure/core_stack_v2/shared_b_global_data_health.py             tests/infrastructure/test_shared_b_global_data_health.py             scripts/shared_b_global_data_health_cross_asset_replay.py
          mypy             src/qore/infrastructure/core_stack_v2/shared_b_global_data_health.py             scripts/shared_b_global_data_health_cross_asset_replay.py
          pytest -q tests/infrastructure/test_shared_b_global_data_health.py

      - name: Verify immutable B-03 upstream
        run: |
          set -euo pipefail
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RAW_RUN_ID}" --jq '.status')" = "completed"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RAW_RUN_ID}" --jq '.conclusion')" = "success"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RAW_RUN_ID}" --jq '.head_sha')" = "$RAW_GIT_SHA"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RAW_ARTIFACT_ID}" --jq '.workflow_run.id')" = "$RAW_RUN_ID"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RAW_ARTIFACT_ID}" --jq '.digest')" = "$RAW_ARTIFACT_DIGEST"

      - name: Recover sealed cross-asset raw evidence
        run: |
          set -euo pipefail
          mkdir -p input/raw result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RAW_ARTIFACT_ID}/zip" > raw.zip
          unzip -q raw.zip -d input/raw
          test -f input/raw/SHA256SUMS
          (cd input/raw && sha256sum -c SHA256SUMS)
          test -f input/raw/shared-b-cross-asset-raw-manifest.json

      - name: Execute real cross-asset data-health replication
        run: |
          set -euo pipefail
          python scripts/shared_b_global_data_health_cross_asset_replay.py             --raw-root input/raw             --raw-manifest input/raw/shared-b-cross-asset-raw-manifest.json             --output result/shared-b-data-health-cross-asset-replication.json             | tee result/summary.json

      - name: Enforce honest B-09 disposition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(
              Path(
                  "result/shared-b-data-health-cross-asset-replication.json"
              ).read_text()
          )
          assert p["status"] == "REAL_CROSS_ASSET_DATA_HEALTH_REPLICATION_PASS"
          assert p["real_cross_asset_symbol_count"] >= 2
          assert p["real_source_sample_count"] > 0
          assert p["scenario_check_count"] > 0
          assert p["fresh_download_cannot_reset_market_event_freshness"] is True
          assert p["fault_flags_only_for_state_isolation"] is True
          assert p["provider_and_retrieval_timestamps_rewritten"] is False
          assert p["stale_relation_empirical_isolation_complete"] is False
          assert p["target_or_outcome_read"] is False
          assert p["r6_r5_read"] is False
          assert p["fresh_holdout_opened"] is False
          assert p["broker_mutation"] is False
          assert p["productive_authority"] is False
          for row in p["symbol_reports"]:
              if row["source_sample_count"] <= 0:
                  continue
              assert row["scenario_check_count"] == (
                  row["source_sample_count"] * p["scenario_count"]
              )
              assert all(
                  value == row["source_sample_count"]
                  for value in row["scenario_correct_counts"].values()
              )
          PY

      - name: Seal B-09 cross-asset evidence
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > result/code-git-sha.txt
          printf '%s\n' "$GITHUB_RUN_ID" > result/run-id.txt
          printf '%s\n' "$RAW_RUN_ID" > result/upstream-run-id.txt
          printf '%s\n' "$RAW_ARTIFACT_ID" > result/upstream-artifact-id.txt
          (
            cd result
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0               | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload B-09 cross-asset evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: qore-shared-b-data-health-cross-asset-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Report B-09 cross-asset replication
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p=json.loads(
              Path(
                  "result/shared-b-data-health-cross-asset-replication.json"
              ).read_text()
          )
          lines=[
              "## Architect B — B-09 real cross-asset data-health replication",
              "",
              f"- Git SHA: \`{os.environ['GITHUB_SHA']}\`",
              f"- run: \`{os.environ['GITHUB_RUN_ID']}\`",
              f"- artifact: \`{os.environ['ARTIFACT_ID']}\`",
              f"- real cross-asset symbols: **{p['real_cross_asset_symbol_count']}**",
              f"- real source samples: **{p['real_source_sample_count']}**",
              f"- deterministic scenario checks: **{p['scenario_check_count']}**",
              "- freshly downloaded historical quote cannot become fresh market evidence: **PASS**",
              "- provider/feed/degradation/crossed/impossible/unknown states: **PASS**",
              "- provider/retrieval timestamps rewritten: **False**",
              "- stale-relation empirical isolation: **OPEN, gated by B-07/B-08**",
              "- Target/outcome read: **False**",
              "- R6/R5 read: **False**",
              "- fresh holdout opened: **False**",
              "- productive authority: **False**",
          ]
          Path("result/issue-comment.md").write_text("\n".join(lines)+"\n")
          PY
          gh issue comment 638 --repo "$GITHUB_REPOSITORY" --body-file result/issue-comment.md
