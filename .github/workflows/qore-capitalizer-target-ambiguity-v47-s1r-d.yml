name: QORE Capitalizer Target Ambiguity V47 S1R D

on:
  push:
    branches:
      - agent/capitalizer-target-ambiguity-v47-s1r-d-001
    paths:
      - '.github/workflows/qore-capitalizer-target-ambiguity-v47-s1r-d.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_target_ambiguity_v47_s1r_d.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_canonical_structural_targets_v47_s0.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_canonical_source_context_binders_v47_s0.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_source_strategy_isolation_v47_s1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_target_ambiguity_v47_s1r_d.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-target-ambiguity-v47-s1r-d-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_target_ambiguity_v47_s1r_d.py \
            tests/infrastructure/trader_lab/test_capitalizer_target_ambiguity_v47_s1r_d.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_target_ambiguity_v47_s1r_d.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_target_ambiguity_v47_s1r_d.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {symbol: USDJPY, session: ASIA}
          - {symbol: AUDJPY, session: ASIA}
          - {symbol: AUDUSD, session: ASIA}
          - {symbol: GBPJPY, session: ASIA}
          - {symbol: EURUSD, session: LONDON}
          - {symbol: GBPUSD, session: LONDON}
          - {symbol: XAUUSD, session: NEW_YORK}
          - {symbol: USDCAD, session: NEW_YORK}
          - {symbol: NAS100, session: NEW_YORK}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable provider-native 10Y M1
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Run target ambiguity census
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_target_ambiguity_v47_s1r_d \
            market m1-source \
            --symbol "${{ matrix.symbol }}" \
            --session "${{ matrix.session }}" \
            --output target-output
      - name: Enforce market governance
        env:
          SYMBOL: ${{ matrix.symbol }}
          SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          paths=sorted(Path("target-output").glob("capitalizer-v47-s1r-d-target-*.json"))
          assert len(paths) == 3
          for path in paths:
              row=json.loads(path.read_text())
              assert row["identity"] == "QORE_CAPITALIZER_STRUCTURAL_TARGET_AMBIGUITY_CENSUS_V47_S1R_D"
              assert row["symbol"] == os.environ["SYMBOL"]
              assert row["session"] == os.environ["SESSION"]
              assert sum(row["ambiguity_counts"].values()) == row["aligned_h1_strict_m15_events"]
              assert row["resolved_under_current_s0"] + row["unresolved_under_current_s0"] == row["aligned_h1_strict_m15_events"]
              assert row["target_policy_changed"] is False
              assert row["nearest_target_priority_used"] is False
              assert row["rr_priority_used"] is False
              assert row["outcome_priority_used"] is False
              assert row["terminal_outcome_read"] is False
              assert row["economics_calculated"] is False
              assert row["fresh_holdout_opened"] is False
              assert row["trader_certified"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v47-s1r-d-target-${{ matrix.symbol }}-${{ github.sha }}
          path: target-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v47-s1r-d-target-*-${{ github.sha }}
          path: target-markets
          merge-multiple: true
      - name: Aggregate target ambiguity census
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_target_ambiguity_v47_s1r_d \
            aggregate target-markets \
            --output target-aggregate
      - name: Enforce aggregate governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          row=json.loads(
              Path("target-aggregate/capitalizer-v47-s1r-d-target-aggregate.json").read_text()
          )
          assert row["identity"] == "QORE_CAPITALIZER_STRUCTURAL_TARGET_AMBIGUITY_CENSUS_V47_S1R_D"
          assert row["predeclaration_comment_id"] == 5896534113
          assert row["market_period_reports"] == 27
          assert row["market_count"] == 9
          assert sum(row["ambiguity_counts"].values()) == row["aligned_h1_strict_m15_events"]
          assert row["resolved_under_current_s0"] + row["unresolved_under_current_s0"] == row["aligned_h1_strict_m15_events"]
          assert row["target_policy_changed"] is False
          assert row["nearest_target_priority_used"] is False
          assert row["rr_priority_used"] is False
          assert row["outcome_priority_used"] is False
          assert row["terminal_outcome_read"] is False
          assert row["economics_calculated"] is False
          assert row["fresh_holdout_opened"] is False
          assert row["trader_certified"] is False
          assert row["diagnosis"] in {
              "MULTI_TARGET_AMBIGUITY_DOMINATES_UNRESOLVED_POPULATION",
              "ZERO_TARGET_AVAILABILITY_DOMINATES_UNRESOLVED_POPULATION",
              "TARGET_AMBIGUITY_AND_AVAILABILITY_TIED",
          }
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v47-s1r-d-target-aggregate-${{ github.sha }}
          path: target-aggregate
          if-no-files-found: error
          retention-days: 90
