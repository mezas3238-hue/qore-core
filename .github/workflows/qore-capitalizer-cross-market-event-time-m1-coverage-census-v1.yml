name: QORE Capitalizer Cross-Market Event-Time M1 Coverage Census V1

on:
  push:
    branches:
      - agent/capitalizer-cross-market-event-time-coverage-census-001
    paths:
      - '.github/workflows/qore-capitalizer-cross-market-event-time-m1-coverage-census-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_cross_market_event_time_m1_coverage_census_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_cross_market_event_time_m1_coverage_census_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-cross-market-event-time-m1-coverage-census-v1-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'
  SOURCE_V38_RUN_ID: '36495104604'
  SOURCE_V38_SELECTED_ARTIFACT: 'qore-capitalizer-v38-geometry-selected-resume-3aa4ee3c181c1fe10fce087b904e6e797770a87d'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_cross_market_event_time_m1_coverage_census_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_cross_market_event_time_m1_coverage_census_v1.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_cross_market_event_time_m1_coverage_census_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_cross_market_event_time_m1_coverage_census_v1.py

  peer_market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        peer_symbol: [USDJPY, AUDJPY, AUDUSD, GBPJPY, EURUSD, GBPUSD, XAUUSD, USDCAD, NAS100]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable provider-native peer M1
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.peer_symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Download reconciled V38 entrant identities
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_V38_SELECTED_ARTIFACT }}
          path: selected-geometry
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_V38_RUN_ID }}
      - name: Build event-time coverage census
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cross_market_event_time_m1_coverage_census_v1 \
            market \
            --peer-symbol "${{ matrix.peer_symbol }}" \
            --m1-root m1-source \
            --selected-geometry-root selected-geometry \
            --output coverage-output
      - name: Enforce outcome-blind coverage contract
        env:
          PEER_SYMBOL: ${{ matrix.peer_symbol }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol=os.environ["PEER_SYMBOL"]
          path=Path(
              "coverage-output/"
              f"capitalizer-cross-market-event-time-m1-coverage-"
              f"{symbol.lower()}-v1.json"
          )
          report=json.loads(path.read_text())
          assert report["identity"] == (
              "QORE_CAPITALIZER_CROSS_MARKET_EVENT_TIME_M1_COVERAGE_CENSUS_V1"
          )
          assert report["peer_symbol"] == symbol
          assert len(report["periods"]) == 3
          expected={"development":948,"validation":1034,"reserved":1088}
          for row in report["periods"]:
              assert row["entrant_count"] == expected[row["slug"]]
              assert row["expected_entrants"] == expected[row["slug"]]
              assert row["future_bar_used"] is False
              assert row["outcome_used_for_coverage"] is False
              assert row["exit_used_for_coverage"] is False
          assert report["thresholds_are_admission_gates"] is False
          assert report["bar_prices_used_for_coverage_decision"] is False
          assert report["terminal_outcomes_used_for_coverage_decision"] is False
          assert report["stop_target_labels_evaluated"] is False
          assert report["separability_run"] is False
          assert report["policy_economics_run"] is False
          assert report["fresh_holdout_opened"] is False
          assert report["runtime_policy_candidate"] is False
          assert report["trader_certified"] is False
          print(json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-cross-market-event-time-m1-coverage-${{ matrix.peer_symbol }}-${{ github.sha }}
          path: coverage-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: peer_market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-cross-market-event-time-m1-coverage-*-${{ github.sha }}
          path: coverage-input
          merge-multiple: true
      - name: Build coverage matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cross_market_event_time_m1_coverage_census_v1 \
            matrix \
            --root coverage-input \
            --output matrix-output
      - name: Enforce census-only matrix
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path=Path(
              "matrix-output/"
              "capitalizer-cross-market-event-time-m1-coverage-matrix-v1.json"
          )
          report=json.loads(path.read_text())
          assert report["identity"] == (
              "QORE_CAPITALIZER_CROSS_MARKET_EVENT_TIME_M1_COVERAGE_MATRIX_V1"
          )
          assert report["peer_market_count"] == 9
          assert report["period_market_rows"] == 27
          assert report["descriptive_only"] is True
          assert report["representation_frozen"] is False
          assert report["labels_opened_for_this_census"] is False
          assert report["separability_run"] is False
          assert report["fresh_holdout_opened"] is False
          assert report["runtime_policy_candidate"] is False
          assert report["trader_certified"] is False
          print(json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-cross-market-event-time-m1-coverage-matrix-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
