name: QORE VT31 ICT Frozen NY 55-Trades Fidelity Fast Audit V1

on:
  push:
    branches:
      - agent/vt31-architect-operations-cert-20261009
    paths:
      - scripts/vt31_ict_silver_bullet_ny_3y_admitted_trade_fidelity_audit_v1.py
      - .github/workflows/vt31-ict-silver-bullet-admitted-fidelity-fast-v1.yml
  workflow_dispatch:

concurrency:
  group: vt31-ict-ny-admitted-fidelity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  FROZEN_3Y_EVIDENCE_ID: "11459859004"
  FROZEN_3Y_BASELINE_ID: "11459439466"
  FROZEN_3Y_BASELINE_SHA: 8f91ee489d33c1fa0b90972270d4ac6c32fcca32

jobs:
  frozen-original-ict-fvg-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static + no-future-data tests
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_ict_silver_bullet_ny_3y_admitted_trade_fidelity_audit_v1.py
          python scripts/vt31_ict_silver_bullet_ny_3y_admitted_trade_fidelity_audit_v1.py --self-test
          python -m pip install 'ijson>=3.3,<4'
      - name: Restore frozen 3Y market plus original 55 admitted ledger
        run: |
          set -euo pipefail
          mkdir -p input baseline result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FROZEN_3Y_EVIDENCE_ID}/zip" > market.zip
          unzip -q market.zip -d input
          if [ -f input/EVIDENCE-SHA256SUMS ]; then
            (cd input && sha256sum -c EVIDENCE-SHA256SUMS)
          fi
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FROZEN_3Y_BASELINE_ID}/zip" > baseline.zip
          unzip -q baseline.zip -d baseline
          test "$(cat baseline/git-sha.txt)" = "$FROZEN_3Y_BASELINE_SHA"
          test -s input/NAS100/market-evidence.json
          test -s baseline/3y-replay.json
      - name: Attribute source-faithful raw FVG to actual admitted NY signals
        run: |
          set -euo pipefail
          python scripts/vt31_ict_silver_bullet_ny_3y_admitted_trade_fidelity_audit_v1.py \
            --evidence input/NAS100/market-evidence.json \
            --frozen-replay baseline/3y-replay.json \
            --output result/ict-ny-3y-55-admitted-fvg-audit.json \
            | tee result/ict-ny-3y-55-admitted-fvg-summary.json
      - name: Do not mistake FVG proximity for original ICT certification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("result/ict-ny-3y-55-admitted-fvg-audit.json").read_text())
          assert x["base_id"] == "VT31_NAS100_OWNER_3Y_BASE_001"
          assert x["frozen_control_trade_count"] == 55
          assert sum(x["counts_by_source_support"].values()) == 55
          g = x["governance"]
          assert g["observed_fvg_not_proof_selected_thesis"] is True
          assert g["full_ict_source_fidelity_certified"] is False
          assert g["no_runtime_use_of_outcome"] is True
          assert g["fresh_holdout_opened"] is False
          assert g["live_authorized"] is False
          PY
      - name: Hash forensic result
        run: |
          echo "$GITHUB_SHA" > result/git-sha.txt
          echo "$FROZEN_3Y_BASELINE_ID" > result/baseline-artifact-id.txt
          echo "$FROZEN_3Y_EVIDENCE_ID" > result/evidence-artifact-id.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd result && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-ict-ny-frozen-55-trade-fidelity-${{ github.sha }}
          path: result/
          retention-days: 90
          if-no-files-found: error
