name: QORE Capitalizer Full ICT Density Scanner 1Y V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-full-ict-density-scanner-1y-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_full_ict_density_scanner_1y_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_full_ict_density_scanner_1y_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-full-ict-density-scanner-1y-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_full_ict_density_scanner_1y_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_full_ict_density_scanner_1y_v1.py
      - name: Mypy
        run: |
          mypy src/qore/infrastructure/trader_lab/capitalizer_full_ict_density_scanner_1y_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_full_ict_density_scanner_1y_v1.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {symbol: USDJPY, session: ASIA}
          - {symbol: AUDJPY, session: ASIA}
          - {symbol: AUDUSD, session: ASIA}
          - {symbol: GBPJPY, session: ASIA}
          - {symbol: EURUSD, session: LONDON}
          - {symbol: GBPUSD, session: LONDON}
          - {symbol: XAUUSD, session: NEW_YORK}
          - {symbol: USDCAD, session: NEW_YORK}
          - {symbol: NAS100, session: NEW_YORK}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable native-M1 clone
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Run full-density ICT scanner
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_full_ict_density_scanner_1y_v1 \
            market m1-source replay-output \
            --session "${{ matrix.session }}"
      - name: Enforce scanner research boundary
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
          EXPECTED_SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"]
          path = Path("replay-output") / (
              f"capitalizer-{symbol.lower()}-full-ict-density-scanner-1y-v1.json"
          )
          report = json.loads(path.read_text())
          assert report["identity"] == "QORE_CAPITALIZER_FULL_ICT_DENSITY_SCANNER_1Y_V1"
          assert report["symbol"] == symbol
          assert report["session"] == os.environ["EXPECTED_SESSION"]
          assert report["window_start"] == "2025-09-17T00:00:00+00:00"
          assert report["window_end_exclusive"] == "2026-09-17T00:00:00+00:00"
          assert report["operating_sessions_scanned"] > 0
          assert report["sessions_with_htf_bias"] > 0
          assert report["sessions_with_objective"] > 0
          assert report["old_candidate_ledger_used"] is False
          assert report["old_raid_rejection_gate_used"] is False
          assert report["htf_context_changed_from_frozen_capitalizer_route"] is False
          assert report["order_block_required"] is False
          assert report["synthetic_m1_used"] is False
          assert report["interpolated_m1_used"] is False
          assert report["qore_session_bucket_is_ict_killzone"] is False
          assert report["fresh_holdout_claimed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["economic_candidate"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-full-ict-density-scanner-1y-${{ matrix.symbol }}-${{ github.sha }}
          path: replay-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-full-ict-density-scanner-1y-*-${{ github.sha }}
          path: replay-input
          merge-multiple: false
      - name: Build nine-market density matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_full_ict_density_scanner_1y_v1 \
            matrix replay-input matrix-output
      - name: Enforce nine-market boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "matrix-output/capitalizer-nine-market-full-ict-density-scanner-1y-matrix-v1.json"
              ).read_text()
          )
          assert report["identity"] == "QORE_CAPITALIZER_NINE_MARKET_FULL_ICT_DENSITY_1Y_MATRIX_V1"
          assert report["market_count"] == 9
          assert report["window_start"] == "2025-09-17T00:00:00+00:00"
          assert report["window_end_exclusive"] == "2026-09-17T00:00:00+00:00"
          assert report["operating_sessions_scanned"] > 0
          assert report["sessions_with_htf_bias"] > 0
          assert report["m1_raid_events"] > 0
          assert report["m1_displacement_events_after_raid"] > 0
          assert report["m1_mss_events_after_raid"] > 0
          assert report["m1_fvg_events_after_mss"] > 0
          assert report["raw_trades"] > 0
          assert report["max3_selected_trades"] > 0
          assert report["raw_stop_exits"] >= 0
          assert report["raw_target_exits"] >= 0
          assert report["max3_stop_exits"] >= 0
          assert report["max3_target_exits"] >= 0
          assert report["old_candidate_ledger_used"] is False
          assert report["old_raid_rejection_gate_used"] is False
          assert report["order_block_required"] is False
          assert report["qore_session_bucket_is_ict_killzone"] is False
          assert report["fresh_holdout_claimed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["economic_candidate"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-nine-market-full-ict-density-scanner-1y-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
