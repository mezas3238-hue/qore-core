name: QORE Capitalizer V3 SOURCE_FIRST Residual M3 Bottleneck Atlas 2Y V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-v3-source-first-residual-m3-bottleneck-atlas-2y-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v3_source_first_residual_m3_bottleneck_atlas_2y_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v3_source_first_residual_m3_bottleneck_atlas_2y_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-v3-source-first-residual-m3-bottleneck-atlas-2y-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  SEMANTICS_RUN_ID: '35813315103'
  SEMANTICS_SHA: '722b6abe4fc570fc47cbfb67ff64a6a93c1fb160'
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_v3_source_first_residual_m3_bottleneck_atlas_2y_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_v3_source_first_residual_m3_bottleneck_atlas_2y_v1.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_v3_source_first_residual_m3_bottleneck_atlas_2y_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_v3_source_first_residual_m3_bottleneck_atlas_2y_v1.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {symbol: USDJPY, session: ASIA}
          - {symbol: AUDJPY, session: ASIA}
          - {symbol: AUDUSD, session: ASIA}
          - {symbol: GBPJPY, session: ASIA}
          - {symbol: EURUSD, session: LONDON}
          - {symbol: GBPUSD, session: LONDON}
          - {symbol: XAUUSD, session: NEW_YORK}
          - {symbol: USDCAD, session: NEW_YORK}
          - {symbol: NAS100, session: NEW_YORK}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download frozen boundary-semantics ledger
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-v3-cisd-boundary-semantics-census-2y-v1-${{ matrix.symbol }}-${{ env.SEMANTICS_SHA }}
          path: semantics-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SEMANTICS_RUN_ID }}
      - name: Download immutable native-M1 clone
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Run residual SOURCE_FIRST M3 atlas
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v3_source_first_residual_m3_bottleneck_atlas_2y_v1 \
            market semantics-source m1-source atlas-output --session ${{ matrix.session }}
      - name: Enforce market controls
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
          EXPECTED_SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"]
          report = json.loads(
              (
                  Path("atlas-output")
                  / f"capitalizer-{symbol.lower()}-v3-source-first-residual-m3-bottleneck-atlas-2y-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_V3_SOURCE_FIRST_RESIDUAL_M3_BOTTLENECK_ATLAS_2Y_V1"
          )
          assert report["symbol"] == symbol
          assert report["session"] == os.environ["EXPECTED_SESSION"]
          assert report["closebacks"] == (
              report["source_first_mss"] + report["residual_closebacks"]
          )
          assert sum(report["terminal_blockers"].values()) == report["residual_closebacks"]
          assert report["thresholds_changed"] is False
          assert report["source_first_semantics_changed"] is False
          assert report["outcome_fields_read"] is False
          assert report["outcome_used_for_classification"] is False
          assert report["strategy_mutated"] is False
          assert report["diagnostic_only"] is True
          assert report["economic_candidate"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["fresh_holdout_claimed"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v3-source-first-residual-m3-bottleneck-atlas-2y-v1-${{ matrix.symbol }}-${{ github.sha }}
          path: atlas-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v3-source-first-residual-m3-bottleneck-atlas-2y-v1-*-${{ github.sha }}
          path: atlas-input
          merge-multiple: false
      - name: Build nine-market residual M3 matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v3_source_first_residual_m3_bottleneck_atlas_2y_v1 \
            matrix atlas-input matrix-output
      - name: Enforce aggregate controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "matrix-output/"
                  "capitalizer-nine-market-v3-source-first-residual-m3-bottleneck-atlas-2y-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_NINE_MARKET_V3_SOURCE_FIRST_"
              "RESIDUAL_M3_BOTTLENECK_ATLAS_2Y_V1"
          )
          assert report["market_count"] == 9
          assert report["closebacks"] == 8099
          assert report["closeback_control_reproduced"] is True
          assert report["source_first_mss"] == 2692
          assert report["source_first_control_reproduced"] is True
          assert report["residual_closebacks"] == 5407
          assert report["residual_control_reproduced"] is True
          assert sum(report["terminal_blockers"].values()) == 5407
          assert report["thresholds_changed"] is False
          assert report["source_first_semantics_changed"] is False
          assert report["outcome_fields_read"] is False
          assert report["outcome_used_for_classification"] is False
          assert report["strategy_mutated"] is False
          assert report["diagnostic_only"] is True
          assert report["economic_candidate"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["fresh_holdout_claimed"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-nine-market-v3-source-first-residual-m3-bottleneck-atlas-2y-v1-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
