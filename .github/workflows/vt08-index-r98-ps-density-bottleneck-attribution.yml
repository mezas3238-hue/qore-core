name: VT08 Index R98 Protected Swing Density Bottleneck Attribution

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r98-ps-density-bottleneck-attribution.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r98_ps_density_bottleneck_attribution.py
      - tests/infrastructure/trader_lab/test_vt08_index_r98_ps_density_bottleneck_attribution.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r98_ps_density_bottleneck_attribution.py

  forensics:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R98 bottleneck attribution
        run: |
          mkdir -p artifacts/report
          python -m qore.infrastructure.trader_lab.vt08_index_r98_ps_density_bottleneck_attribution \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r98-ps-density-bottleneck-attribution.json

      - name: Verify R98 governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r98-ps-density-bottleneck-attribution.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R98_PROTECTED_SWING_DENSITY_BOTTLENECK_ATTRIBUTION_001"
          )
          assert report["source_r97"]["run_id"] == 35535136703
          assert report["source_r97"]["artifact_id"] == 10613125272
          assert report["source_r97"]["artifact_digest"] == (
              "sha256:97864b91f41ff6578d5c16ebb98a88559795e2698110cb7297d4afad949eebf7"
          )

          contract = report["attribution_contract"]
          assert contract["primary_model"] == "D1_H4_M15"
          assert contract["r84_liquidity_rule_unchanged"] is True
          assert contract["r84_original_h4_fvg_rule_measured"] is True
          assert contract["causal_m15_fvg_alternative_measured"] is True
          assert contract["m15_fvg_must_exist_before_reaction_touch"] is True
          assert contract["m15_fvg_reaction_must_follow_h4_poi_touch"] is True
          assert contract["generic_cisd_control_measured"] is True
          assert contract["pnl_evaluated"] is False
          assert contract["candidate_created"] is False

          for key in ("five_year", "recent_two_year", "r66_failed_holdout"):
              section = report[key]
              assert "funnel_totals" in section
              assert "sequential_h4_losses" in section
              assert "execution_surfaces" in section
              assert section["execution_surfaces"][
                  "decoupled_m15_ps_continuation"
              ] >= section["execution_surfaces"][
                  "r84_baseline_ps_continuation"
              ]
              assert section["execution_surfaces"][
                  "generic_post_touch_cisd_continuation"
              ] >= section["execution_surfaces"][
                  "decoupled_m15_ps_continuation"
              ]

          assert report["decision"] == (
              "R98_PS_DENSITY_BOTTLENECK_ATTRIBUTION_COMPLETE_NO_TRADES"
          )

          gov = report["governance"]
          assert gov["forensics_only"] is True
          assert gov["consumed_evidence_only"] is True
          assert gov["fresh_holdout_claim"] is False
          assert gov["future_information_used"] is False
          assert gov["pnl_evaluated"] is False
          assert gov["risk_changed"] is False
          assert gov["target_changed"] is False
          assert gov["anchors_changed"] is False
          assert gov["numeric_threshold_search"] is False
          assert gov["market_or_anchor_selection_by_outcome"] is False
          assert gov["candidate_created"] is False
          assert gov["trader_certified"] is False
          assert gov["live_authorized"] is False
          assert gov["real_capital_authorized"] is False
          assert gov["production_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r98-ps-density-bottleneck-attribution-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
