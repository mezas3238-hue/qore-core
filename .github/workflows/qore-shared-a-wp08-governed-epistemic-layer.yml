name: QORE Shared A WP08 Governed Epistemic Layer

concurrency:
  group: qore-shared-a-wp08-governed-epistemic-layer
  cancel-in-progress: false

on:
  push:
    branches:
      - agent/shared-a-cognitive-science-001
    paths:
      - src/qore/infrastructure/core_stack_v2/governed_epistemic_layer.py
      - tests/infrastructure/test_core_stack_v2_governed_epistemic_layer.py
      - scripts/shared_wp08_governed_epistemic_layer.py
      - .github/workflows/qore-shared-a-wp08-governed-epistemic-layer.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  epistemic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and validate
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          mkdir -p input/{mc09,mc15,x10,mc23} result
          ruff check \
            src/qore/infrastructure/core_stack_v2/governed_epistemic_layer.py \
            tests/infrastructure/test_core_stack_v2_governed_epistemic_layer.py \
            scripts/shared_wp08_governed_epistemic_layer.py
          mypy src/qore/infrastructure/core_stack_v2/governed_epistemic_layer.py
          pytest -q tests/infrastructure/test_core_stack_v2_governed_epistemic_layer.py

      - name: Verify immutable epistemic evidence
        run: |
          set -euo pipefail
          for spec in \
            "36754966932:11116522138" \
            "36726927463:11102652639" \
            "36731394336:11104578542" \
            "36782458472:11128786574"
          do
            run_id="${spec%%:*}"
            artifact_id="${spec#*:}"
            test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')" = "completed"
            test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion')" = "success"
            test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" --jq '.expired')" = "false"
          done

      - name: Recover exact epistemic artifacts
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11116522138/zip" > mc09.zip
          unzip -q mc09.zip -d input/mc09
          (cd input/mc09 && sha256sum -c SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11102652639/zip" > mc15.zip
          unzip -q mc15.zip -d input/mc15
          (cd input/mc15 && sha256sum -c SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11104578542/zip" > x10.zip
          unzip -q x10.zip -d input/x10
          (cd input/x10 && sha256sum -c SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11128786574/zip" > mc23.zip
          unzip -q mc23.zip -d input/mc23
          (cd input/mc23 && sha256sum -c SHA256SUMS)

      - name: Integrate governed epistemics
        run: |
          python scripts/shared_wp08_governed_epistemic_layer.py \
            --mc09 input/mc09/mc09-belief-calibration-v2.json \
            --mc15 input/mc15/mc15-six-source-uncertainty-v2.json \
            --x10 input/x10/x10-contradiction-map.json \
            --mc23 input/mc23/mc23-real-novelty-detection.json \
            --output result/wp08-governed-epistemic-layer.json \
            | tee result/summary.json

      - name: Validate WP08 closure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/wp08-governed-epistemic-layer.json").read_text())
          assert p["status"] == "WP08_GOVERNED_EPISTEMIC_LAYER_COMPLETED_AND_PROVEN"
          assert all(p["upstream"].values())
          assert p["population_novelty_incidence_is_probability"] is False
          assert p["uncertainty_index_is_probability"] is False
          assert p["deterministic_integration"] is True
          assert p["adverse_evidence_cannot_increase_assertiveness"] is True
          assert p["trading_command"] is False
          assert p["methodology_authority"] is False
          assert p["sizing_authority"] is False
          assert p["capital_authority"] is False
          assert p["risk_authority"] is False
          assert p["execution_authority"] is False
          assert p["wp08_completed_and_proven"] is True
          assert p["master_ledger_mutated"] is False
          assert p["protected_certification_holdout_opened"] is False
          PY

      - name: Seal
        run: |
          printf '%s\n' "${GITHUB_SHA}" > result/code-git-sha.txt
          (cd result && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-a-wp08-epistemic-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Report
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p=json.loads(Path("result/wp08-governed-epistemic-layer.json").read_text())
          body="\n".join([
              "## Shared A WP-08 — Governed Epistemic Layer",
              "",
              f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- run: `{os.environ['GITHUB_RUN_ID']}`",
              "- calibrated belief + uncertainty + contradiction + novelty: **Integrated**",
              f"- integrated state: **{p['integrated_state']}**",
              f"- assertiveness ceiling: **{p['assertiveness_ceiling_bps']} bps**",
              "- uncertainty index represented as calibrated probability: **False**",
              "- novelty incidence represented as calibrated probability: **False**",
              "- adverse evidence can raise assertiveness: **False**",
              "- downstream authority: **None**",
              "- WP-08 completed-and-proven: **True**",
              "- protected certification holdout opened: **False**",
          ])+"\n"
          Path("result/issue-comment.md").write_text(body)
          PY
          gh issue comment 638 --body-file result/issue-comment.md
