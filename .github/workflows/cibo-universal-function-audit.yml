name: QORE CIBO Universal Function Audit

on:
  push:
    branches:
      - agent/cibo-universal-tool-runtime-repair-001
    paths:
      - 'src/qore/infrastructure/**'
      - 'scripts/cibo_universal_function_audit.py'
      - 'tests/infrastructure/test_cibo_*.py'
      - 'tests/infrastructure/trader_lab/test_cibo_*.py'
      - '.github/workflows/cibo-universal-function-audit.yml'
  pull_request:
    branches:
      - agent/cibo-integrator-ab-001
    paths:
      - 'src/qore/infrastructure/**'
      - 'scripts/cibo_universal_function_audit.py'
      - 'tests/infrastructure/test_cibo_*.py'
      - 'tests/infrastructure/trader_lab/test_cibo_*.py'
      - '.github/workflows/cibo-universal-function-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-01-ce2i-capability:
    name: "01 AUDIT+TEST CE2I T01-T20 + Capability Lab"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Static contract audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from qore.infrastructure.cibo_ce2i_tool_registry import CE2I_TOOL_REGISTRY

          expected = tuple(f"T{i:02d}" for i in range(1, 21))
          actual = tuple(item.code for item in CE2I_TOOL_REGISTRY)
          assert actual == expected, (actual, expected)
          required = (
              "src/qore/infrastructure/cibo_universal_capability_runtime.py",
              "src/qore/infrastructure/cibo_ce2i_advanced_actions.py",
              "tests/infrastructure/test_cibo_universal_capability_runtime.py",
              "tests/infrastructure/test_cibo_ce2i_advanced_actions.py",
              "tests/infrastructure/trader_lab/test_cibo_ce2i_t01_t20_functional_probe.py",
          )
          for path in required:
              assert Path(path).is_file(), path
          print("PHASE_01_AUDIT=PASS")
          PY
      - name: Behavioral test
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --no-cov             tests/infrastructure/test_cibo_ce2i_*.py             tests/infrastructure/test_cibo_universal_capability_runtime.py             tests/infrastructure/test_cibo_capital_management_authority.py             tests/infrastructure/test_cibo_phase22_historical_policy_replay.py
          echo "PHASE_01_BEHAVIOR=PASS"
      - name: Trader Lab functional run T01-T20
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_cibo_ce2i_t01_t20_functional_probe.py
          echo "PHASE_01_TRADER_LAB=PASS"

  phase-02-cognitive:
    name: "02 AUDIT+TEST Cognitive CF01-CF19"
    needs: phase-01-ce2i-capability
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Audit and behavioral test
        shell: bash
        run: |
          set -euo pipefail
          test -f src/qore/infrastructure/cibo_capability_exam_cognitive_coverage.py
          test -f tests/infrastructure/test_cibo_universal_capability_runtime.py
          python -m pytest -q --no-cov             tests/infrastructure/test_cibo_cognitive_*.py             tests/infrastructure/test_cibo_reused_holdout_capability_exam.py             tests/infrastructure/test_cibo_universal_capability_runtime.py
          echo "PHASE_02_INTERNAL=PASS"
      - name: Trader Lab functional run CF01-CF19
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_cibo_cognitive_cf01_cf19_manifest.py \
            tests/infrastructure/trader_lab/test_cibo_cognitive_cf01_cf19_functional_probe.py \
            tests/infrastructure/test_cibo/test_market_monitoring.py \
            tests/infrastructure/test_cibo/test_specialist_mesh.py \
            tests/infrastructure/test_cibo_trader_manager.py \
            tests/infrastructure/test_cibo_trader_development_review.py \
            tests/infrastructure/test_cibo/test_trader_academy.py \
            tests/infrastructure/test_cibo/test_opportunity_search.py \
            tests/infrastructure/test_cibo/test_portfolio_intelligence.py \
            tests/infrastructure/test_cibo/test_economic_journals.py \
            tests/infrastructure/test_cibo/test_quantitative_intelligence.py \
            tests/infrastructure/test_cibo/test_research_director.py \
            tests/infrastructure/test_cibo/test_executive_recommendation.py \
            tests/infrastructure/test_cibo/test_core_health.py \
            tests/infrastructure/test_cibo/test_executive_planner.py \
            tests/governance/test_cibo/test_ceo_dialogue.py \
            tests/infrastructure/test_cibo/test_trader_voice.py \
            tests/infrastructure/test_cibo/test_self_evaluation_learning.py
          echo "PHASE_02_TRADER_LAB=PASS"

  phase-03-cma-risk-settlement:
    name: "03 AUDIT+TEST CMA + QORE Risk + Settlement"
    needs: phase-02-cognitive
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Audit and behavioral test
        shell: bash
        run: |
          set -euo pipefail
          test -f src/qore/infrastructure/cibo_capital_management_authority.py
          test -f src/qore/infrastructure/account_wide_risk.py
          python -m pytest -q --no-cov             tests/infrastructure/test_cibo_capital_management_authority.py             tests/infrastructure/test_cibo_cma_*.py             tests/infrastructure/test_cibo_risk_*.py             tests/infrastructure/test_cibo_risk_integration_closure.py
          echo "PHASE_03_INTERNAL=PASS"
      - name: Trader Lab functional run CMA + QORE Risk + Settlement
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_cibo_cma_risk_settlement_functional_probe.py
          echo "PHASE_03_TRADER_LAB=PASS"

  phase-04-compound:
    name: "04 AUDIT+TEST CIBO Compound"
    needs: phase-03-cma-risk-settlement
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Audit and behavioral test
        shell: bash
        run: |
          set -euo pipefail
          test -f src/qore/infrastructure/cibo_compound_cycle_state.py
          test -f src/qore/infrastructure/cibo_compound_market_cycle.py
          python -m pytest -q --no-cov             tests/infrastructure/test_cibo_compound_*.py
          echo "PHASE_04_INTERNAL=PASS"
      - name: Trader Lab functional run CIBO Compound
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_cibo_compound_functional_probe.py \
            tests/infrastructure/trader_lab/test_cibo_compound_core_functional_probe.py \
            tests/infrastructure/test_cibo_compound_cycle_state.py \
            tests/infrastructure/test_cibo_compound_floor.py \
            tests/infrastructure/test_cibo_compound_floor_store.py \
            tests/infrastructure/test_cibo_compound_market_cycle.py \
            tests/infrastructure/test_cibo_compound_cycle_replay.py \
            tests/infrastructure/test_cibo_compound_causal_ablation.py \
            tests/infrastructure/test_cibo_compound_real_population_binding.py
          echo "PHASE_04_TRADER_LAB=PASS"

  phase-05-compound-portfolio:
    name: "05 AUDIT+TEST Compound Portfolio + Internal Capital Market"
    needs: phase-04-compound
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Audit and behavioral test
        shell: bash
        run: |
          set -euo pipefail
          test -f src/qore/infrastructure/cibo_core_compound_portfolio.py
          test -f src/qore/infrastructure/cibo_internal_capital_market.py
          python -m pytest -q --no-cov             tests/infrastructure/test_cibo_core_compound_portfolio.py             tests/infrastructure/test_cibo_compound_portfolio.py             tests/infrastructure/test_cibo_internal_capital_market.py             tests/infrastructure/test_cibo_phase22_chronological_execution.py
          echo "PHASE_05_INTERNAL=PASS"
      - name: Trader Lab functional run Compound Portfolio + Internal Capital Market
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_cibo_compound_portfolio_icm_functional_probe.py \
            tests/infrastructure/trader_lab/test_cibo_compound_portfolio_functional_probe.py \
            tests/infrastructure/test_cibo_core_compound_portfolio.py \
            tests/infrastructure/test_cibo_compound_portfolio.py \
            tests/infrastructure/test_cibo_internal_capital_market.py \
            tests/infrastructure/test_cibo_phase22_chronological_execution.py
          echo "PHASE_05_TRADER_LAB=PASS"

  phase-06-economic-systems:
    name: "06 AUDIT+TEST Capital generations + MC + Stress + Replication"
    needs: phase-05-compound-portfolio
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Audit and behavioral test
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --no-cov             tests/infrastructure/test_cibo_compound_cycle_state.py             tests/infrastructure/test_cibo_compound_market_cycle.py             tests/infrastructure/test_cibo_compound_causal_ablation.py             tests/infrastructure/test_cibo_compound_path_monte_carlo.py             tests/infrastructure/test_cibo_compound_adversarial_stress.py             tests/infrastructure/test_cibo_compound_temporal_replication.py
          echo "PHASE_06_INTERNAL=PASS"
      - name: Trader Lab functional run Generations + MC + Stress + Replication
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_cibo_economic_systems_functional_probe.py \
            tests/infrastructure/test_cibo_compound_path_monte_carlo.py \
            tests/infrastructure/test_cibo_compound_adversarial_stress.py \
            tests/infrastructure/test_cibo_compound_temporal_replication.py
          echo "PHASE_06_TRADER_LAB=PASS"

  phase-07-protection-truth:
    name: "07 AUDIT+TEST Protected Base + Profit Protection + Capital Truth"
    needs: phase-06-economic-systems
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Audit and behavioral test
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --no-cov             tests/infrastructure/test_cibo_integrated_capital_*.py             tests/infrastructure/test_cibo_protected_base_*.py             tests/infrastructure/test_cibo_profit_preservation_*.py
          echo "PHASE_07_INTERNAL=PASS"
      - name: Trader Lab functional run Protected Base + Profit Protection + Capital Truth
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_cibo_protection_truth_functional_probe.py \
            tests/infrastructure/test_cibo_integrated_capital_truth.py \
            tests/infrastructure/test_cibo_protected_base_overlay.py \
            tests/infrastructure/test_cibo_profit_preservation_shadow.py
          echo "PHASE_07_TRADER_LAB=PASS"

  phase-08-genc:
    name: "08 AUDIT+TEST GEN-C economic controls"
    needs: phase-07-protection-truth
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Audit and behavioral test
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --no-cov             tests/infrastructure/test_cibo_genc*.py             tests/infrastructure/test_cibo_generation_current_control.py
          echo "PHASE_08_INTERNAL=PASS"
      - name: Trader Lab functional run exact GEN-C2-GEN-C14
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_cibo_genc_surface_functional_probe.py
          python - <<'PY' > "$RUNNER_TEMP/genc-tests.txt"
          import json
          from pathlib import Path

          payload = json.loads(
              Path("docs/research/CIBO-MASTER-OPEN-WORK-LEDGER-V1.json")
              .read_text(encoding="utf-8")
          )
          expected = {f"GEN-C{index}" for index in range(2, 15)}
          targets = set()
          for row in payload["workstreams"]:
              if row["id"] not in expected:
                  continue
              for ref in row.get("evidence_refs", ()):
                  if str(ref).startswith("tests/"):
                      targets.add(str(ref))
          for target in sorted(targets):
              print(target)
          PY
          mapfile -t genc_targets < "$RUNNER_TEMP/genc-tests.txt"
          test "${#genc_targets[@]}" -gt 0
          python -m pytest -q --no-cov "${genc_targets[@]}"
          echo "PHASE_08_TRADER_LAB=PASS"

  phase-09-end-to-end:
    name: "09 AUDIT+TEST End-to-End CIBO Capability"
    needs: phase-08-genc
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: End-to-end behavioral test
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --no-cov             tests/infrastructure/test_cibo_reused_holdout_capability_exam.py             tests/infrastructure/test_cibo_universal_capability_runtime.py             tests/infrastructure/test_cibo_phase22_chronological_execution.py             tests/infrastructure/test_cibo_phase22_historical_policy_replay.py             tests/infrastructure/test_cibo_phase22_fresh_capital_projection.py
          echo "PHASE_09=PASS"

  runtime-truth:
    name: "10 Global runtime truth audit"
    needs: phase-09-end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Audit global runtime integration
        shell: bash
        run: |
          set +e
          python scripts/cibo_universal_function_audit.py             --output "$RUNNER_TEMP/cibo-universal-function-audit.json"
          rc=$?
          cat "$RUNNER_TEMP/cibo-universal-function-audit.json"
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cibo-universal-function-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/cibo-universal-function-audit.json
          if-no-files-found: error
          retention-days: 90

  approval:
    name: "11 CIBO all-or-nothing approval"
    needs: runtime-truth
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce global AND
        shell: bash
        run: |
          set -euo pipefail
          echo "ALL_PHASES_AND_RUNTIME_TRUTH=PASS"
          echo "APPROVAL_ALLOWED=true"
