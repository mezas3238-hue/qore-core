name: QORE Turtle Soup AUDJPY R33 Subfamily Discovery

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/turtle-soup-audjpy-r33-subfamily-discovery.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_audjpy_r33_rank1_subfamily_discovery.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_audjpy_r33_rank1_subfamily_discovery.py'
  push:
    branches:
      - agent/turtle-soup-audjpy-specialist-memory-v1-001
    paths:
      - '.github/workflows/turtle-soup-audjpy-r33-subfamily-discovery.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_audjpy_r33_rank1_subfamily_discovery.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_audjpy_r33_rank1_subfamily_discovery.py'

permissions:
  contents: write
  actions: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  V2_RUN_ID: '35383377176'
  V2_ARTIFACT: 'qore-turtle-soup-audjpy-structural-specialist-v2-r27-e0bec233ed40197a1e969786b24a9dc8a1e5869f'

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Focused quality
        run: |
          ruff check --ignore E501,I001 \
            src/qore/infrastructure/trader_lab/turtle_soup_audjpy_r33_rank1_subfamily_discovery.py \
            tests/infrastructure/trader_lab/test_turtle_soup_audjpy_r33_rank1_subfamily_discovery.py
          mypy --disable-error-code attr-defined \
            src/qore/infrastructure/trader_lab/turtle_soup_audjpy_r33_rank1_subfamily_discovery.py
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_turtle_soup_audjpy_r33_rank1_subfamily_discovery.py
      - name: Download exact Cognitive V2 R27 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V2_ARTIFACT }}
          path: v2-r27
          github-token: ${{ github.token }}
          run-id: ${{ env.V2_RUN_ID }}
      - name: Discover and freeze AUDJPY rank1 subfamilies
        run: |
          mkdir -p r33-output
          python -m qore.infrastructure.trader_lab.turtle_soup_audjpy_r33_rank1_subfamily_discovery \
            v2-r27 r33-output > r33-output/stdout.json
          printf '%s\n' "$EVIDENCE_SHA" > r33-output/git-sha.txt
      - name: Enforce family governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('r33-output/r33-rank1-subfamily-discovery-report.json').read_text())
          assert p['identity']=='TURTLE_SOUP_AUDJPY_R33_RANK1_SUBFAMILY_DISCOVERY_V1'
          c=p['candidate_contract']
          assert c['features_are_pre_entry_only'] is True
          assert c['calendar_fields_forbidden'] is True
          assert c['target_route_not_a_family_feature'] is True
          assert c['target_rank_fixed_to_one'] is True
          assert c['required_positive_chronological_quintiles']==5
          assert p['governance']['fresh_holdout_consumed'] is False
          f=json.loads(Path('r33-output/r33-rank1-subfamily-freeze.json').read_text())
          assert f['status']=='FROZEN_FOR_2Y_ENSEMBLE_REPLAY'
          assert f['fresh_holdout_status']=='SEALED_UNTOUCHED'
          PY
      - name: Hash R33 evidence
        run: |
          cd r33-output
          sha256sum r33-rank1-subfamily-discovery-report.json r33-rank1-subfamily-freeze.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-audjpy-r33-subfamily-discovery-${{ env.EVIDENCE_SHA }}
          path: r33-output
          if-no-files-found: error
          retention-days: 90

# R33_FRONTIER_RETRIGGER


  publish-status:
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs: [quality, discover]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/turtle-soup-audjpy-specialist-memory-v1-001
      - name: Download successful R33 artifact
        if: needs.discover.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: qore-turtle-soup-audjpy-r33-subfamily-discovery-${{ env.EVIDENCE_SHA }}
          path: published-r33
      - name: Write auditable R33 status
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          DISCOVERY_RESULT: ${{ needs.discover.result }}
          RUN_SHA: ${{ env.EVIDENCE_SHA }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p docs/research/results
          python - <<'PY'
          import json, os
          from pathlib import Path
          out={'identity':'TURTLE_SOUP_AUDJPY_R33_SUBFAMILY_STATUS','workflow_run_id':int(os.environ['RUN_ID']),'workflow_sha':os.environ['RUN_SHA'],'quality_result':os.environ['QUALITY_RESULT'],'discovery_result':os.environ['DISCOVERY_RESULT']}
          report=Path('published-r33/r33-rank1-subfamily-discovery-report.json')
          freeze=Path('published-r33/r33-rank1-subfamily-freeze.json')
          sums=Path('published-r33/SHA256SUMS.txt')
          if report.exists(): out['report']=json.loads(report.read_text())
          if freeze.exists(): out['freeze']=json.loads(freeze.read_text())
          if sums.exists(): out['sha256sums']=sums.read_text().splitlines()
          Path('docs/research/results/TURTLE-SOUP-AUDJPY-R33-SUBFAMILY-LATEST.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - name: Commit R33 status
        run: |
          git config user.name 'qore-research-bot'
          git config user.email 'qore-research-bot@users.noreply.github.com'
          git add docs/research/results/TURTLE-SOUP-AUDJPY-R33-SUBFAMILY-LATEST.json
          git commit -m "research(audjpy): record R33 subfamily discovery" || exit 0
          git push origin HEAD:agent/turtle-soup-audjpy-specialist-memory-v1-001
