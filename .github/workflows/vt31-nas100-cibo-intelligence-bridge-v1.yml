name: QORE VT31 NAS100 CIBO Intelligence Bridge V1

on:
  push:
    branches:
      - agent/vt31-nas100-intelligence-pilot-001
    paths:
      - scripts/vt31_nas100_cibo_intelligence_bridge_v1.py
      - .github/workflows/vt31-nas100-cibo-intelligence-bridge-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  CIBO_ARTIFACT_ID: 10478487667
  CIBO_DIGEST: 17c8d1909152d87ed67a05cd986fa9cca39b2ac92598d36822c38e8afccde192

jobs:
  bridge-fold:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - partition: r8_fresh
            state_artifact: 10523467443
            state_digest: 81e4d0f4dcbdfa68d88f025f26789162c8c49c097e93844a2032dd225581f297
          - partition: r6
            state_artifact: 10523433888
            state_digest: 59123e3f8a8a128448f158cb798b15abfd1b683efdff7435973024fca8f99b9f
          - partition: r5
            state_artifact: 10523314097
            state_digest: 4050271b86fa04d866ffd557056c32d5a563f583be2e288244d2f23c93d8abe3
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PARTITION: ${{ matrix.partition }}
      STATE_ARTIFACT: ${{ matrix.state_artifact }}
      STATE_DIGEST: ${{ matrix.state_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research runtime
        run: pip install -e .[dev]

      - name: Static validation
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_cibo_intelligence_bridge_v1.py
          ruff check scripts/vt31_nas100_cibo_intelligence_bridge_v1.py

      - name: Recover immutable CIBO Atlas
        run: |
          set -euo pipefail
          digest="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CIBO_ARTIFACT_ID}" --jq .digest)"
          test "$digest" = "sha256:${CIBO_DIGEST}"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CIBO_ARTIFACT_ID}/zip" > cibo.zip
          echo "${CIBO_DIGEST}  cibo.zip" | sha256sum -c -
          mkdir cibo
          unzip -q cibo.zip -d cibo
          (cd cibo && sha256sum -c SHA256SUMS)
          test -f cibo/STRUCTURE_TOUCH_LEDGER.jsonl
          test -f cibo/MARKET_JOURNEY_LEDGER.jsonl
          test -f cibo/PRE_DEPARTURE_SEQUENCE_LEDGER.jsonl

      - name: Recover immutable Market State V2 fold
        run: |
          set -euo pipefail
          digest="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${STATE_ARTIFACT}" --jq .digest)"
          test "$digest" = "sha256:${STATE_DIGEST}"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${STATE_ARTIFACT}/zip" > state.zip
          echo "${STATE_DIGEST}  state.zip" | sha256sum -c -
          mkdir state
          unzip -q state.zip -d state
          (cd state && sha256sum -c SHA256SUMS)

      - name: Build CIBO intelligence bridge
        run: |
          set -euo pipefail
          mkdir result
          python scripts/vt31_nas100_cibo_intelligence_bridge_v1.py \
            --ledger-dir cibo \
            --market-state "state/vt31-nas100-market-state-v2-${PARTITION}.json" \
            --output "result/vt31-nas100-cibo-intelligence-bridge-${PARTITION}.json" \
            | tee result/summary.json

      - name: Causal firewall validation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          partition = os.environ['PARTITION']
          payload = json.loads(
              Path(f'result/vt31-nas100-cibo-intelligence-bridge-{partition}.json').read_text()
          )
          assert payload['schema'] == 'qore.vt31.nas100.cibo_intelligence_bridge.v1'
          assert payload['research_only'] is True
          assert payload['selection_prohibited'] is True
          assert payload['runtime_policy_selected'] is False
          assert payload['candidate_frozen'] is False
          assert payload['opens_new_holdout'] is False
          assert payload['live_authorized'] is False
          assert payload['production_authorized'] is False
          firewall = payload['causal_firewall']
          assert firewall['historical_knowledge_is_aggregate_only'] is True
          assert firewall['runtime_date_level_outcome_lookup'] is False
          assert firewall['runtime_future_structure_touch_lookup'] is False
          assert firewall['runtime_future_peer_breach_lookup'] is False
          assert firewall['runtime_future_peer_confirmation_lookup'] is False
          prohibited = set(firewall['runtime_post_outcome_fields_prohibited'])
          assert 'day_regime' in prohibited
          assert 'departure_pivot_at' in prohibited
          assert 'opposite_boundary_hit_by_16' in prohibited
          assert 'terminal_r' in prohibited
          assert payload['runtime_observation_count'] > 0
          print('VT31_NAS100 CIBO intelligence causal firewall PASS')
          PY

      - name: Bind immutable result
        run: |
          set -euo pipefail
          echo "${GITHUB_SHA}" > result/git-sha.txt
          echo "${CIBO_ARTIFACT_ID} sha256:${CIBO_DIGEST}" > result/cibo-source.txt
          echo "${STATE_ARTIFACT} sha256:${STATE_DIGEST}" > result/state-source.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-cibo-intelligence-bridge-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
