name: QORE VT31 GitHub Trader Lab Cognitive Sensors V1

on:
  push:
    branches:
      - agent/vt31-edge-position-cert-b-001
    paths:
      - src/qore/infrastructure/traders/vt31_nas100_cognitive_telemetry.py
      - src/qore/infrastructure/traders/vt31_nas100_cognitive_plumbing.py
      - src/qore/infrastructure/traders/vt31_nas100_reasoning_engine.py
      - tests/infrastructure/test_vt31_nas100_cognitive_reasoning.py
      - tests/infrastructure/test_vt31_nas100_cibo_causal_structure.py
      - src/qore/infrastructure/traders/vt31_nas100_post_entry_cognitive_runtime.py
      - tests/infrastructure/test_vt31_nas100_post_entry_cognitive_runtime.py
      - scripts/vt31_nas100_specialist_r1_candidate.py
      - scripts/vt31_nas100_full_cognition_attribution_v1.py
      - scripts/vt31_nas100_live_cognitive_breaker_protection_frontier_v1.py
      - scripts/vt31_nas100_comp010_live_context_adverse_exit_v1.py
      - scripts/vt31_nas100_comp009_causal_trace_prepare_v1.py
      - scripts/vt31_nas100_cognitive_sensor_audit_v1.py
      - .github/workflows/vt31-cognitive-sensor-audit-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Static and sensor semantics
        run: |
          set -euo pipefail
          python -m py_compile             src/qore/infrastructure/traders/vt31_nas100_cognitive_telemetry.py             scripts/vt31_nas100_cognitive_sensor_audit_v1.py
          ruff check             src/qore/infrastructure/traders/vt31_nas100_cognitive_telemetry.py             src/qore/infrastructure/traders/vt31_nas100_post_entry_cognitive_runtime.py             scripts/vt31_nas100_cognitive_sensor_audit_v1.py             tests/infrastructure/test_vt31_nas100_post_entry_cognitive_runtime.py
          pytest -q -o addopts='' tests/infrastructure/test_vt31_nas100_post_entry_cognitive_runtime.py
          python - <<'PY'
          from qore.infrastructure.traders.vt31_nas100_cognitive_telemetry import (
              observe_cognitive_actuation,
          )

          x=observe_cognitive_actuation(
              expected_action="EXIT",
              routed_actions=(),
          )
          assert x.status == "OUTPUT_NOT_ROUTED"
          assert x.read_only is True
          assert x.policy_authority is False
          y=observe_cognitive_actuation(
              expected_action="HOLD",
              routed_actions=(),
          )
          assert y.status == "ALIGNED_NO_ACTION"
          PY

  prepare:
    needs: static
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - fold: r5
            artifact: "10380044761"
            expected: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            path: "fresh/NAS100/market-evidence.json"
          - fold: r6
            artifact: "10389112524"
            expected: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            path: "fresh/NAS100/market-evidence.json"
          - fold: r8
            artifact: "10402199719"
            expected: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            path: "fresh/NAS100/market-evidence.json"
          - fold: consumed
            artifact: "10557487418"
            expected: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            path: "NAS100/market-evidence.json"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Prepare sensor ledger
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ matrix.artifact }}/zip" > input/evidence.zip
          unzip -q input/evidence.zip -d input/unpacked
          source="input/unpacked/${{ matrix.path }}"
          test -f "$source"
          test "$(sha256sum "$source" | awk '{print $1}')" = "${{ matrix.expected }}"
          PYTHONPATH=scripts python             scripts/vt31_nas100_comp009_causal_trace_prepare_v1.py             "$source"             --output "result/${{ matrix.fold }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-sensor-ledger-${{ matrix.fold }}-${{ github.sha }}
          path: result/${{ matrix.fold }}.json
          retention-days: 90

  audit:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-sensor-ledger-*-${{ github.sha }}
          path: input
          merge-multiple: true
      - name: Aggregate cognitive sensors
        run: |
          mkdir -p result
          python scripts/vt31_nas100_cognitive_sensor_audit_v1.py             --fold r5=input/r5.json             --fold r6=input/r6.json             --fold r8=input/r8.json             --fold consumed=input/consumed.json             --output result/cognitive-sensor-audit.json             | tee result/cognitive-sensor-summary.json
      - name: Fail closed on missing sensors
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          x=json.loads(Path("result/cognitive-sensor-audit.json").read_text())
          assert x["cognitive_call_count"] > 0
          assert x["sensor_integrity"]["missing_sensor_call_count"] == 0
          assert x["governance"]["read_only"] is True
          assert x["governance"]["fresh_holdout_opened"] is False
          assert x["governance"]["candidate_certified"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-cognitive-sensor-audit-${{ github.sha }}
          path: result/
          retention-days: 90
