name: QORE Native London Reentry G1 DEV (EURJPY USDCHF No OAuth)

on:
  workflow_dispatch:
  push:
    branches:
      - research/qore-native-london-reentry-g1-dev-20261011
    paths:
      - '.github/workflows/qore-native-london-reentry-g1-dev-20261011.yml'
      - 'docs/research/QORE_NATIVE_LONDON_REENTRY_G1_FROZEN_DEV_PREREG_2026-10-11.md'
      - 'src/qore/infrastructure/trader_lab/qore_native_london_reentry_g1_dev_v1.py'
      - 'tests/infrastructure/trader_lab/test_qore_native_london_reentry_g1_dev_v1.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-native-london-g1-dev-${{ github.sha }}
  cancel-in-progress: false

jobs:
  causal_quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development test tools
        run: python -m pip install -e '.[dev]'
      - name: Freeze pre-data research contract
        run: |
          test -s docs/research/QORE_NATIVE_LONDON_REENTRY_G1_FROZEN_DEV_PREREG_2026-10-11.md
          python - <<'PY'
          from pathlib import Path
          p=Path("src/qore/infrastructure/trader_lab/qore_native_london_reentry_g1_dev_v1.py").read_text()
          assert "RESERVED_CUTOFF" in p and "iter_pre_cutoff" in p
          assert "SOURCE_SHA" in p and "BOOTSTRAPS = 2000" in p
          assert "QORE_CTRADER" not in p
          PY
      - name: Ruff syntax and accidental unused imports
        run: |
          ruff check --select F,E4,E7,E9 src/qore/infrastructure/trader_lab/qore_native_london_reentry_g1_dev_v1.py tests/infrastructure/trader_lab/test_qore_native_london_reentry_g1_dev_v1.py
      - name: Run causal fixtures including DST, sealed-boundary and stop-first
        run: |
          pytest -q --no-cov tests/infrastructure/trader_lab/test_qore_native_london_reentry_g1_dev_v1.py

  historical_dev:
    needs: causal_quality
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package (NO cTrader SDK or credentials)
        run: python -m pip install -e .
      - name: Restore ORIGINAL EURJPY archived 7Y DEMO source (no OAuth)
        uses: actions/download-artifact@v4
        with:
          name: qore-vt08-expansion-7y-EURJPY-6958ea0c4f183020b5248b413af998065c6662da
          run-id: '36079229139'
          github-token: ${{ github.token }}
          path: original-eurjpy
      - name: Restore ORIGINAL USDCHF archived 7Y DEMO source (no OAuth)
        uses: actions/download-artifact@v4
        with:
          name: qore-vt08-expansion-7y-USDCHF-6958ea0c4f183020b5248b413af998065c6662da
          run-id: '36079229139'
          github-token: ${{ github.token }}
          path: original-usdchf
      - name: Execute FROZEN 3Y London vs placebo developmental experiment
        run: |
          python -m qore.infrastructure.trader_lab.qore_native_london_reentry_g1_dev_v1 original-eurjpy original-usdchf results | tee trial-stdout.json
      - name: Validate provenance, noncertification, and retained unfiltered outcomes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('results/g1-london-reentry-report.json').read_text())
          assert j['identity']=='QORE_NATIVE_LONDON_REENTRY_G1_FIXED_DEV_V1'
          assert j['research_only'] is True
          assert j['vt08_reserved_data_read'] is False
          assert j['virgin_oos_claimed'] is False
          assert j['no_execution_costs_available'] is True
          assert j['broker_executable_pf_claimed'] is False
          assert j['verdict'] in ['DEV_UNDERPOWERED','DEV_NO_SUPPORT','DEV_GROSS_POTENTIAL']
          assert {m['symbol'] for m in j['source_manifests']}=={'EURJPY','USDCHF'}
          assert all(m['sealed_outcomes_read'] is False for m in j['source_manifests'])
          assert all(m['ctrader_oauth_used'] is False for m in j['source_manifests'])
          assert all(m['vt08_reserved_cutoff_utc']=='2023-09-24T23:45:00+00:00' for m in j['source_manifests'])
          n=sum(1 for _ in Path('results/g1-london-reentry-trades.jsonl').open())
          assert n==j['trades_total']
          print('G1_RESEARCH_VERDICT',j['verdict'], 'TRADES',n)
          PY
          printf '%s\n' "$GITHUB_SHA" > results/code-head-sha.txt
          printf '%s\n' 'PREREG_COMMIT=dfe4af6918e172843ad71c1f5a9d4d86481520be' > results/frozen-prereg-sha.txt
          (cd results && sha256sum g1-london-reentry-report.json g1-london-reentry-trades.jsonl code-head-sha.txt frozen-prereg-sha.txt > ROOT_SHA256SUMS.txt)
      - name: Publish immutable research evidence (never OHLC source or secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qore-native-london-reentry-g1-dev-${{ github.sha }}
          path: |
            results/
            trial-stdout.json
          retention-days: 90
          if-no-files-found: warn
