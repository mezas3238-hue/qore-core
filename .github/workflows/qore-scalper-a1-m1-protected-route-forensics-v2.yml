name: QORE Scalper A1 Real M1 Protected-Swing Route Forensics V2 Nine Markets

on:
  push:
    branches: [agent/scalper-architect-a-cognition-20261010]
    paths:
      - '.github/workflows/qore-scalper-a1-m1-protected-route-forensics-v2.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_a1_m1_protected_route_forensics_v2.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_a1_m1_protected_route_forensics_v2.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  V49_RUN: '38053946695'
  V49_SHA: 'e356e7a52541e99533b25ecfef0ab9c4e9ce03c0'
  NATIVE_M1_RUN: '35548099334'
  NATIVE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  causal_fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Verify exact as-of M1 protected pivot without retrospective price
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_a1_m1_protected_route_forensics_v2.py tests/infrastructure/trader_lab/test_capitalizer_a1_m1_protected_route_forensics_v2.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_a1_m1_protected_route_forensics_v2.py tests/infrastructure/trader_lab/test_capitalizer_a1_m1_protected_route_forensics_v2.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_a1_m1_protected_route_forensics_v2.py

  native_m1:
    needs: causal_fidelity
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        symbol: [USDJPY, AUDJPY, AUDUSD, GBPJPY, EURUSD, GBPUSD, XAUUSD, USDCAD, NAS100]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: scalper-a2-v49-control-${{ matrix.symbol }}-${{ env.V49_SHA }}
          path: original-v49
          github-token: ${{ github.token }}
          run-id: ${{ env.V49_RUN }}
      - uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.NATIVE_M1_SHA }}
          path: native-m1
          github-token: ${{ github.token }}
          run-id: ${{ env.NATIVE_M1_RUN }}
      - name: Review each original route and structurally protected swing before M1 decision
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_a1_m1_protected_route_forensics_v2 market native-m1 original-v49 market-m1-review
      - name: Original opportunities untouched, no added hard filters
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("market-m1-review/scalper-a1-m1-protection-market-summary.json").read_text())
          assert d["original_opportunities"]==d["verified_source_ids"]>0
          assert d["source_entries_modified"]==0 and d["new_entry_vetoes"]==0
          assert d["full_nine_market_master_frame_claimed"] is False
          assert not d["live_authorized"]
          assert d["extended_causal_m1_proof_count"]>=d["strict_original_m1_proof_count"]
          print("M1 NATIVE CAUSAL ROUTE FORENSICS",json.dumps(d,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-a1-m1-route-protected-${{ matrix.symbol }}-${{ github.sha }}
          path: market-m1-review/
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: native_m1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: scalper-a1-m1-route-protected-*-${{ github.sha }}
          path: nine-m1-route-books
          merge-multiple: false
      - name: Require 2876 source IDs, exactly 1244 prior strict proofs, no new vetoes
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_a1_m1_protected_route_forensics_v2 matrix nine-m1-route-books results
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-a1-nine-market-m1-route-classification-${{ github.sha }}
          path: results/
          retention-days: 90
          if-no-files-found: error
