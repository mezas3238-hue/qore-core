    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned historical decoder from original Trader Lab
        uses: actions/checkout@v4
        with:
          ref: fe9de467102e86dbd355c09c5099830af28a694c
          path: legacy-crt-lab
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download original 10Y native M5 in ephemeral private runner
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          repository: ${{ github.repository }}
          run-id: ${{ matrix.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-m5-private
      - name: Audit source SHA and run causal A/B integrated detector; event counts ONLY
        shell: bash
        env:
          SOURCE_ROOT: ${{ runner.temp }}/native-m5-private
          SYMBOL: ${{ matrix.symbol }}
          FAMILY: ${{ matrix.family }}
          COHORT: ${{ matrix.cohort }}
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/legacy-crt-lab:$GITHUB_WORKSPACE" \
            python -m research.crt_r4a_holdout.archived_integrated_engine_probe \
              --root "$SOURCE_ROOT" --symbol "$SYMBOL" \
              --family "$FAMILY" --cohort "$COHORT" |
              tee "$RUNNER_TEMP/integrated.json"
          echo "HOLDOUT=ALREADY_CONSUMED_RESEARCH_NOT_VIRGIN" >> "$GITHUB_STEP_SUMMARY"
          echo "CRT_F_ENGINE_PARITY=NOT_VERIFIED; ORDERS=NONE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: qore-crt-r4a-integrated-${{ matrix.symbol }}
          path: ${{ runner.temp }}/integrated.json
          retention-days: 21
      - name: Destroy all raw broker candles
        if: always()
        run: rm -rf "${{ runner.temp }}/native-m5-private"

  aggregate-33:
    needs: original-33-streamed-CRT
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download all 33 independently SHA-verified event-only summaries
        uses: actions/download-artifact@v4
        with:
          pattern: qore-crt-r4a-integrated-*
          path: ${{ runner.temp }}/all-33-event-summaries
          merge-multiple: false
      - name: Verify immutable 33 source universe and combine no-PnL counts
        run: |
          python -m research.crt_r4a_holdout.aggregate_integrated_detector \
            --root "${{ runner.temp }}/all-33-event-summaries" \
            --outdir reports/crt-r4a-integrated-33
          echo "REPORT=INTEGRATED_33_MARKETS_CAUSAL_EVENTS_ONLY" >> "$GITHUB_STEP_SUMMARY"
          echo "NO_TRADES_NO_PNL_NO_PINE_PARITY_NO_FRESH_HOLDOUT" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve complete result without raw candles
        uses: actions/upload-artifact@v4
        with:
          name: qore-crt-r4a-integrated-33-markets-2024-2025-report
          path: reports/crt-r4a-integrated-33/
          retention-days: 30
