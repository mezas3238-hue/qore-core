name: QORE Turtle Soup XAUUSD R3 CIBO Journey 10Y Binding Repair

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-xauusd-r3-cibo-journey-router-001
    paths:
      - '.github/workflows/turtle-soup-xauusd-r3-cibo-journey-10y-binding-repair.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r3_cibo_journey_binding_repair.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-turtle-soup-xauusd-r3-binding-repair-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-XAUUSD-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-XAUUSD-2f510461b3360e91d5ee70a72716a76cd6561f16'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff binding repair
        run: ruff check --ignore E501 src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r3_cibo_journey_binding_repair.py
      - name: Compile binding repair
        run: python -m py_compile src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r3_cibo_journey_binding_repair.py
      - name: Preserve frozen R3 quality tests
        run: pytest -q --no-cov tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r3_cibo_journey.py

  replay:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download immutable consumed XAUUSD M5 corpus
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download immutable consumed XAUUSD Target Destination V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Verify immutable source provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          raw = list(Path('source-xauusd').rglob('symbol-consumption-manifest.json'))
          target = list(Path('target-xauusd').rglob('target-destination-v2-manifest.json'))
          assert len(raw) == 1 and len(target) == 1
          m = json.loads(raw[0].read_text())
          t = json.loads(target[0].read_text())
          assert m['identity'] == 'CIBO_MARKET_ATLAS_10Y_CONSUMPTION_V1'
          assert m['canonical_symbol'] == 'XAUUSD'
          assert m['retained_bars'] == 707716
          assert t['identity'] == 'CIBO_TARGET_DESTINATION_V2_SUPPORTED_REFERENCE_UNIVERSE'
          assert t['symbol'] == 'XAUUSD'
          assert t['candidate_rows'] == 177435
          assert t['resolved_departures'] == 40641
          PY
      - name: Execute frozen R3 with fail-closed binding repair
        run: |
          mkdir -p r3-output
          python -m qore.infrastructure.trader_lab.turtle_soup_xauusd_r3_cibo_journey_binding_repair \
            source-xauusd target-xauusd r3-output > r3-output/stdout.json
          printf '%s\n' "$GITHUB_SHA" > r3-output/git-sha.txt
      - name: Enforce binding-only repair and R3 governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('r3-output/report.json').read_text())
          assert p['identity'] == 'TURTLE_SOUP_XAUUSD_R3_CIBO_JOURNEY_ROUTER'
          assert p['retained_m5_bars'] == 707716
          assert p['binding_repair']['economic_mechanics_changed'] is False
          assert p['binding_repair']['ambiguous_keys_are_abstentions'] is True
          assert p['binding_repair']['ambiguous_source_opposite_keys'] == 13
          assert p['governance']['fresh_holdout'] is False
          assert p['governance']['validation_block_used_for_fit'] is False
          assert p['governance']['positive_score_trade_filter'] is False
          assert p['governance']['post_entry_leakage_allowed'] is False
          assert p['governance']['automatic_promotion_allowed'] is False
          assert p['governance']['live_authorized'] is False
          PY
      - name: Hash immutable R3 result
        run: |
          cd r3-output
          sha256sum report.json router.json trades-full.json trades-validation.json stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-xauusd-r3-cibo-journey-binding-repair-${{ github.sha }}
          path: r3-output
          if-no-files-found: error
          retention-days: 90
