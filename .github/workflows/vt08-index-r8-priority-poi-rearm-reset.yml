name: VT08 Index R8 Priority POI Rearm Reset

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r8-priority-poi-rearm-reset.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r8_priority_poi_rearm_reset.py
      - tests/infrastructure/trader_lab/test_vt08_index_r8_priority_poi_rearm_reset.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r8_priority_poi_rearm_reset.py

  replay:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Download NAS100 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458
      - name: Download SP500 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458
      - name: Download US30 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458
      - name: Execute R8 structural reset replay
        run: |
          python -m qore.infrastructure.trader_lab.vt08_index_r8_priority_poi_rearm_reset             --nas100-root artifacts/NAS100             --sp500-root artifacts/SP500             --us30-root artifacts/US30             --out artifacts/report/vt08-index-r8-priority-poi-rearm-reset.json
      - name: Verify governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("artifacts/report/vt08-index-r8-priority-poi-rearm-reset.json").read_text())
          assert report["identity"] == "VT08_INDEX_R8_PRIORITY_POI_REARM_RESET_001"
          assert report["window"]["status"] == "CONSUMED_DEVELOPMENT"
          assert report["window"]["fresh_certification_holdout"] is False
          assert report["target_candidate_count"] == 4
          assert report["causal_changes"]["structural_rearm"] is True
          assert report["causal_changes"]["specialist_management_reset"] is True
          g=report["governance"]
          assert g["candidate_promoted"] is False
          assert g["live_authorized"] is False
          assert g["real_capital_authorized"] is False
          assert g["production_authorized"] is False
          PY
      - name: Build summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("artifacts/report")
          r=json.loads((root/"vt08-index-r8-priority-poi-rearm-reset.json").read_text())
          lines=["# VT08 INDEX R8 Priority-POI + Rearm Reset",""]
          for row in r["candidates"]:
              lines += [
                f"## Target {row['target_r']}R",
                f"- trades: {row['sample']}",
                f"- density pass: {row['density_pass']}",
                f"- rearm trades: {row['rearm_trade_count']}",
                f"- raw PF05: {row['raw_primary']['profit_factor']}",
                f"- raw DD05: {row['raw_primary']['max_drawdown_r']}R",
                f"- raw total05: {row['raw_primary']['total_r']}R",
                f"- governed PF05: {row['governed_primary']['profit_factor']}",
                f"- governed DD05: {row['governed_primary']['max_drawdown_r']}R",
                f"- governed PF10: {row['governed_secondary']['profit_factor']}",
                f"- governed DD10: {row['governed_secondary']['max_drawdown_r']}R",
                "",
              ]
          (root/"VT08_INDEX_R8_PRIORITY_POI_REARM_RESET_SUMMARY.md").write_text("\n".join(lines)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-index-r8-priority-poi-rearm-reset-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
