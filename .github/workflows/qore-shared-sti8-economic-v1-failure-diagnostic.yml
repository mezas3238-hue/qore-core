name: QORE Shared STI8 Economic V1 Failure Diagnostic

concurrency:
  group: qore-shared-sti8-economic-v1-failure-diagnostic
  cancel-in-progress: true

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - scripts/shared_sti8_economic_v1_failure_diagnostic.py
      - .github/workflows/qore-shared-sti8-economic-v1-failure-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Shared
        run: pip install -e ".[dev]"

      - name: Validate diagnostic
        run: |
          set -euo pipefail
          mkdir -p result input/policy input/pure input/r6 input/r5 input/oos-result input/oos-raw
          ruff check scripts/shared_sti8_economic_v1_failure_diagnostic.py
          python -m py_compile scripts/shared_sti8_economic_v1_failure_diagnostic.py

      - name: Recover frozen policy and burned evidence
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11065709899/zip" > policy.zip
          unzip -q policy.zip -d input/policy
          (cd input/policy && sha256sum -c SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10799064861/zip" > pure.zip
          unzip -q pure.zip -d input/pure
          (cd input/pure && sha256sum -c SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10389112524/zip" > r6.zip
          unzip -q r6.zip -d input/r6
          (cd input/r6 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10380044761/zip" > r5.zip
          unzip -q r5.zip -d input/r5
          (cd input/r5 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11071394080/zip" > oos-result.zip
          unzip -q oos-result.zip -d input/oos-result
          (cd input/oos-result && sha256sum -c SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11070988924/zip" > oos-raw.zip
          unzip -q oos-raw.zip -d input/oos-raw
          (cd input/oos-raw && sha256sum -c SHA256SUMS)

      - name: Extract STI-8 response failure knowledge
        run: |
          set -euo pipefail
          python scripts/shared_sti8_economic_v1_failure_diagnostic.py             --policy input/policy/sti6-sti8-source-only-policies.json             --r6-trades input/pure/r6.json             --r6-nas input/r6/fresh/NAS100/market-evidence.json             --r6-sp input/r6/fresh/SP500/market-evidence.json             --r6-us input/r6/fresh/US30/market-evidence.json             --r5-trades input/pure/r5.json             --r5-nas input/r5/fresh/NAS100/market-evidence.json             --r5-sp input/r5/fresh/SP500/market-evidence.json             --r5-us input/r5/fresh/US30/market-evidence.json             --oos-trades input/oos-result/sti8-oos-trades.json             --oos-nas input/oos-raw/fresh/NAS100/market-evidence.json             --oos-sp input/oos-raw/fresh/SP500/market-evidence.json             --oos-us input/oos-raw/fresh/US30/market-evidence.json             --output result/sti8-economic-v1-failure-diagnostic.json             | tee result/summary.json

      - name: Validate no response-policy rescue
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(
              Path("result/sti8-economic-v1-failure-diagnostic.json").read_text()
          )
          assert p["status"] == (
              "V1_RESPONSE_FAILURE_KNOWLEDGE_EXTRACTED_NO_RETUNING"
          )
          g=p["governance"]
          assert g["sti8_engine_changed"] is False
          assert g["sti8_thresholds_changed"] is False
          assert g["economic_response_v1_reopened"] is False
          assert g["v2_response_policy_selected"] is False
          assert g["burned_evidence_only"] is True
          assert g["protected_certification_holdout_opened"] is False
          assert g["productive_authority"] is False
          for name in ("r6","r5","oos"):
              row=p["partitions"][name]
              assert row["trade_count"] > 0
              assert row["source_observation_count"] > 0
              assert row["group_counts"]["THREATENED_LOSS"] > 0
              assert row["group_counts"]["THREATENED_WINNER"] > 0
              assert row["v2_response_hypothesis_candidates"]
          assert p["cross_partition_hypotheses"]
          PY

      - name: Bind diagnostic evidence
        run: |
          printf '%s\n' "${GITHUB_SHA}" > result/code-git-sha.txt
          (
            cd result
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0               | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-sti8-economic-v1-failure-diagnostic-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Report STI-8 V1 response failure knowledge
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p=json.loads(
              Path("result/sti8-economic-v1-failure-diagnostic.json").read_text()
          )
          lines=[
              "## Shared STI-8 — Economic Response V1 Failure Diagnostic",
              "",
              f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- cross-partition hypotheses: **{p['cross_partition_hypotheses']}**",
              "- STI-8 engine/thresholds changed: **False / False**",
              "- V2 response policy selected: **False**",
              "- protected certification holdout opened: **False**",
              "",
          ]
          for name in ("r6","r5","oos"):
              row=p["partitions"][name]
              lines.extend([
                  f"### {name.upper()}",
                  f"- groups: **{row['group_counts']}**",
                  f"- threatened-winner minus threatened-loss deltas: **{row['threatened_winner_minus_loss_delta_bps']}**",
                  f"- threat scopes: **{row['scope_histograms']}**",
                  "",
              ])
          lines.append(
              "These are mechanism candidates for a new Trader-owned response hypothesis; V1 remains falsified."
          )
          Path("result/issue-comment.md").write_text("\n".join(lines)+"\n")
          PY
          gh issue comment 638 --body-file result/issue-comment.md
