name: QORE CIBO A1 T08 Phase22 OOS Binding

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-a1-t08-phase22-oos-binding.yml'
      - 'src/qore/infrastructure/cibo_a1_t08_phase22_oos_binding.py'
      - 'tests/infrastructure/test_cibo_a1_t08_phase22_oos_binding.py'
      - 'docs/research/CIBO-A1-T08-PHASE22-OOS-POPULATION-BINDING-V1.md'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  a1-t08-phase22-oos-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: A1 T08 Phase22 OOS population binding
        run: |
          ruff check \
            src/qore/infrastructure/cibo_a1_t08_phase22_oos_binding.py \
            tests/infrastructure/test_cibo_a1_t08_phase22_oos_binding.py
          mypy \
            src/qore/infrastructure/cibo_a1_t08_phase22_oos_binding.py
          python -m py_compile \
            src/qore/infrastructure/cibo_a1_t08_phase22_oos_binding.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_a1_t08_phase22_oos_binding.py
