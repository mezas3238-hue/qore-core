name: QORE Shared B Metals Economic Component Semantics

on:
  push:
    branches:
      - agent/shared-b-global-world-perception-001
    paths:
      - src/qore/infrastructure/core_stack_v2/shared_b_metals_component_semantics.py
      - tests/infrastructure/test_shared_b_metals_component_semantics.py
      - .github/workflows/qore-shared-b-metals-component-semantics.yml
  workflow_dispatch:

concurrency:
  group: qore-shared-b-metals-component-semantics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  COMMODITY_RUN_ID: "36755839843"
  COMMODITY_ARTIFACT_ID: "11115769948"
  COMMODITY_GIT_SHA: "52092649a3f78e6449e52288786e1839a58ff916"

jobs:
  semantics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Shared
        run: pip install -e ".[dev]"

      - name: Validate metals component semantics
        run: |
          set -euo pipefail
          ruff check \
            src/qore/infrastructure/core_stack_v2/shared_b_metals_component_semantics.py \
            tests/infrastructure/test_shared_b_metals_component_semantics.py
          mypy \
            src/qore/infrastructure/core_stack_v2/shared_b_metals_component_semantics.py
          pytest -q tests/infrastructure/test_shared_b_metals_component_semantics.py

      - name: Verify exact sealed commodity lineage
        run: |
          set -euo pipefail
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${COMMODITY_RUN_ID}" --jq '.status')" = "completed"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${COMMODITY_RUN_ID}" --jq '.conclusion')" = "success"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${COMMODITY_RUN_ID}" --jq '.head_sha')" = "$COMMODITY_GIT_SHA"
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${COMMODITY_ARTIFACT_ID}/zip" > commodity.zip
          unzip -q commodity.zip -d input
          (cd input && sha256sum -c SHA256SUMS)
          test -f input/shared-b-commodity-observation-identity-pack.json

      - name: Build exact metals component semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from qore.infrastructure.core_stack_v2.shared_b_metals_component_semantics import (
              build_metals_economic_component_semantics,
          )

          pack=json.loads(
              Path(
                  "input/shared-b-commodity-observation-identity-pack.json"
              ).read_text()
          )
          out=build_metals_economic_component_semantics(pack)
          Path(
              "result/shared-b-metals-component-semantics.json"
          ).write_text(json.dumps(out,sort_keys=True,indent=2)+"\n")
          PY

      - name: Enforce component versus benchmark boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(
              Path(
                  "result/shared-b-metals-component-semantics.json"
              ).read_text()
          )
          assert p["identity"] == "SHARED_B_METALS_ECONOMIC_COMPONENT_SEMANTICS_001"
          assert p["metals_sensor_count"] == 11
          assert p["component_verified_sensor_count"] == 11
          assert tuple(p["unique_economic_metal_codes"]) == (
              "XAG","XAU","XPD","XPT"
          )
          assert p[
              "provider_neutral_benchmark_identity_verified_count"
          ] == 0
          assert p["venue_identity_verified_count"] == 0
          assert p["tradable_product_identity_verified_count"] == 0
          assert p["component_identity_is_benchmark_identity"] is False
          assert p["symbol_similarity_used_as_benchmark_proof"] is False
          assert p["target_or_outcome_read"] is False
          assert p["r6_r5_read"] is False
          assert p["fresh_holdout_opened"] is False
          assert p["broker_mutation"] is False
          assert p["relational_claims_authorized"] is False
          assert p["productive_authority"] is False
          assert p["b06_complete"] is False
          assert p["b15_complete"] is False
          PY

      - name: Seal B-15 component evidence
        run: |
          printf '%s\n' "$GITHUB_SHA" > result/code-git-sha.txt
          printf '%s\n' "$GITHUB_RUN_ID" > result/run-id.txt
          (
            cd result
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
              | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload metals component semantics
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: qore-shared-b-metals-component-semantics-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Report B-15 component frontier
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          gh issue comment 638 --repo "$GITHUB_REPOSITORY" --body "Architect B B-15 metals component semantics: run ${GITHUB_RUN_ID}, SHA ${GITHUB_SHA}, artifact ${ARTIFACT_ID}. The exact 11 sealed METALS references all carry component-verified QORE metal/currency identities (XAG/XAU/XPD/XPT versus AUD/CHF/EUR/GBP/JPY/USD). This does NOT promote them to a provider-neutral benchmark, exchange venue, tradable product, front contract or continuous series: all such authority remains 0 and B-06/B-15 remain OPEN."
