name: QORE Capitalizer UTC001 Statistical Adjudication V1

on:
  push:
    branches:
      - agent/capitalizer-utc001-stat-adjudication-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-utc001-stat-adjudication-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_utc001_statistical_adjudication_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_utc001_statistical_adjudication_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-utc001-stat-adjudication-v1-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_RUN_ID: '36419550146'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_utc001_statistical_adjudication_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_utc001_statistical_adjudication_v1.py
      - name: Mypy
        run: |
          mypy src/qore/infrastructure/trader_lab/capitalizer_utc001_statistical_adjudication_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_utc001_statistical_adjudication_v1.py

  audit:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - period: CONSUMED_VALIDATION_2022_2024
            slug: validation
            artifact: qore-capitalizer-consumed-certification-audit-v2-validation-a2231a543aacce63b6e834e04d59f66b81f11363
            window_start: '2022-09-17'
            window_end: '2024-09-17'
          - period: CONSUMED_RESERVED_2020_2022
            slug: reserved
            artifact: qore-capitalizer-consumed-certification-audit-v2-reserved-a2231a543aacce63b6e834e04d59f66b81f11363
            window_start: '2020-09-17'
            window_end: '2022-09-17'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Adjudicate exact exam years
        env:
          PERIOD: ${{ matrix.period }}
          WINDOW_START: ${{ matrix.window_start }}
          WINDOW_END: ${{ matrix.window_end }}
          SLUG: ${{ matrix.slug }}
        run: |
          python - <<'PY'
          import json
          import os
          from dataclasses import asdict
          from datetime import date
          from pathlib import Path

          from qore.infrastructure.trader_lab import (
              capitalizer_scalper_utc001_consumed_audit_v1 as audit,
          )
          from qore.infrastructure.trader_lab import (
              capitalizer_utc001_statistical_adjudication_v1 as stat,
          )

          rows=audit._load_rows(
              Path("source/capitalizer-scalper-consumed-certification-audit-v2-ledger.jsonl")
          )
          years=audit._split_exam_years(
              rows,
              window_start=date.fromisoformat(os.environ["WINDOW_START"]),
              window_end_exclusive=date.fromisoformat(os.environ["WINDOW_END"]),
          )
          reports=[]
          for index,(start,end,year_rows) in enumerate(years,start=1):
              result=stat.adjudicate(year_rows)
              reports.append({
                  "period_id":f'{os.environ["PERIOD"]}:YEAR_{index}',
                  "window_start":start.isoformat(),
                  "window_end_exclusive":end.isoformat(),
                  **asdict(result),
              })
          payload={
              "identity":"QORE_CAPITALIZER_UTC001_STATISTICAL_ADJUDICATION_MATRIX_V1",
              "source_period":os.environ["PERIOD"],
              "sample_contract":{
                  "min_trades":stat.MIN_TRADES,
                  "min_wins":stat.MIN_WINS,
                  "min_losses":stat.MIN_LOSSES,
                  "min_active_months":stat.MIN_ACTIVE_MONTHS,
              },
              "loss_cluster_contract":{
                  "alpha":str(float(stat.LOSS_CLUSTER_ALPHA)),
                  "max_pure_loss_cluster_r":str(stat.MAX_PURE_LOSS_CLUSTER_R),
                  "exact_permutation_null":True,
              },
              "exam_years":reports,
              "fresh_holdout_used":False,
              "strategy_changed":False,
              "trader_certified":False,
          }
          out=Path("output")
          out.mkdir()
          (out/f'capitalizer-utc001-stat-adjudication-{os.environ["SLUG"]}-v1.json').write_text(
              json.dumps(payload,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps(payload,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-utc001-stat-adjudication-${{ matrix.slug }}-${{ github.sha }}
          path: output
          if-no-files-found: error
          retention-days: 90
