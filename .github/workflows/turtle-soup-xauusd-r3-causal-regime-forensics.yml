name: QORE Turtle Soup XAUUSD R3 Causal Regime Forensics

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-xauusd-r3-forensics-001
    paths:
      - '.github/workflows/turtle-soup-xauusd-r3-causal-regime-forensics.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r3_causal_regime_forensics.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r3_causal_regime_forensics.py'

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-XAUUSD-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-XAUUSD-2f510461b3360e91d5ee70a72716a76cd6561f16'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check --ignore E501,I001 \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r3_causal_regime_forensics.py \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r3_causal_regime_forensics.py
      - name: Mypy focused gate
        run: mypy --disable-error-code var-annotated src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r3_causal_regime_forensics.py
      - name: Focused tests
        run: pytest -q --no-cov tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r3_causal_regime_forensics.py

  forensics:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download immutable consumed XAUUSD M5 corpus
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download immutable consumed XAUUSD Target Destination V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Execute causal pre-entry regime forensics
        run: |
          mkdir -p causal-output
          python -m qore.infrastructure.trader_lab.turtle_soup_xauusd_r3_causal_regime_forensics \
            source-xauusd target-xauusd causal-output > causal-output/stdout.json
          printf '%s\n' "$GITHUB_SHA" > causal-output/git-sha.txt
      - name: Enforce diagnostic-only governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('causal-output/causal-regime-forensics.json').read_text())
          assert p['identity']=='TURTLE_SOUP_XAUUSD_R3_CAUSAL_REGIME_FORENSICS_V1'
          assert p['evidence_status']=='CONSUMED_R3_AND_CIBO_10Y_CAUSAL_DIAGNOSTIC_NOT_FRESH_HOLDOUT'
          assert p['reproduction']['retained_bars']==707716
          assert p['reproduction']['ambiguous_source_opposite_keys']==13
          assert p['full']['trades']==5885
          assert p['diagnosis']['rules_promoted'] is False
          assert p['diagnosis']['fresh_holdout_consumed'] is False
          assert p['governance']['automatic_filter_promotion'] is False
          assert p['governance']['live_authorized'] is False
          assert p['governance']['real_capital_authorized'] is False
          assert p['governance']['production_authorized'] is False
          PY
      - name: Hash immutable causal forensic result
        run: |
          cd causal-output
          sha256sum causal-regime-forensics.json enriched-trades.json stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-xauusd-r3-causal-regime-forensics-${{ github.sha }}
          path: causal-output
          if-no-files-found: error
          retention-days: 90
