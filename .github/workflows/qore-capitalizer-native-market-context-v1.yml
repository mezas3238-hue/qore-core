name: QORE Capitalizer Native Market Context V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-native-market-context-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_native_market_context_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_native_market_context_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-native-market-context-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  DIRECT_RUN_ID: '36196002610'
  DIRECT_SHA: 'ddd00209e50d5ec16c8cb94f34e9e5e95f401839'
  M1_RUN_ID: '35548099334'
  M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_native_market_context_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_native_market_context_v1.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_native_market_context_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_native_market_context_v1.py

  context:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        role: [dev, holdout]
        symbol:
          - USDJPY
          - AUDJPY
          - AUDUSD
          - GBPJPY
          - EURUSD
          - GBPUSD
          - XAUUSD
          - USDCAD
          - NAS100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download direct-M1 trade artifact
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-max-recovery-direct-m1-${{ matrix.role }}-${{ matrix.symbol }}-${{ env.DIRECT_SHA }}
          path: direct-input
          github-token: ${{ github.token }}
          run-id: ${{ env.DIRECT_RUN_ID }}
      - name: Download provider-native M1
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.M1_SHA }}
          path: m1-input
          github-token: ${{ github.token }}
          run-id: ${{ env.M1_RUN_ID }}
      - name: Bind native causal context
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_native_market_context_v1 \
            direct-input m1-input context-output --role "${{ matrix.role }}"
      - name: Enforce context causality
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
          EXPECTED_ROLE: ${{ matrix.role }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          paths = list(Path("context-output").glob("*.json"))
          assert len(paths) == 1
          report = json.loads(paths[0].read_text())
          assert report["symbol"] == os.environ["EXPECTED_SYMBOL"]
          assert report["role"] == os.environ["EXPECTED_ROLE"]
          assert report["trades"] > 0
          assert report["context_rows"] == report["trades"]
          assert report["bars_after_entry_used"] is False
          assert report["unconfirmed_pivots_used"] is False
          assert report["outcome_visible_to_context"] is False
          assert report["target_result_visible_to_context"] is False
          assert report["milestone_result_visible_to_context"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-native-market-context-v1-${{ matrix.role }}-${{ matrix.symbol }}-${{ github.sha }}
          path: context-output
          if-no-files-found: error
          retention-days: 90
