name: QORE CIBO Final Integrated Exam Architect B Ledger Reconciliation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/qore/infrastructure/cibo_final_integrated_exam_arch_b_ledger_reconciliation.py'
      - 'tests/infrastructure/test_cibo_final_integrated_exam_arch_b_ledger_reconciliation.py'
      - '.github/workflows/cibo-final-integrated-exam-arch-b-ledger-reconciliation.yml'

permissions:
  contents: read

jobs:
  arch-b-ledger-reconciliation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Exact ten-row B disposition admission
        run: |
          ruff check \
            src/qore/infrastructure/cibo_final_integrated_exam_arch_b_ledger_reconciliation.py \
            tests/infrastructure/test_cibo_final_integrated_exam_arch_b_ledger_reconciliation.py
          mypy \
            src/qore/infrastructure/cibo_final_integrated_exam_arch_b_ledger_reconciliation.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_final_integrated_exam_arch_b_ledger_reconciliation.py
