name: TEMP Architect Story Forensics Adjudication

on:
  push:
    branches:
      - agent/trader-story-forensics-architect-adjudication-001
    paths:
      - .github/architect-adjudication-trigger

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact architect branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply fail-closed Architect patch
        run: python .github/architect_story_forensics_patch.py
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff focused candidate
        run: |
          ruff check src/qore/infrastructure/trader_lab/first_cohort_story_forensics.py \
            tests/infrastructure/trader_lab/test_architect_story_forensics_adjudication.py
      - name: Mypy focused candidate
        run: |
          mypy src/qore/infrastructure/trader_lab/first_cohort_story_forensics.py \
            tests/infrastructure/trader_lab/test_architect_story_forensics_adjudication.py
      - name: Pytest Story Forensics regressions
        run: |
          pytest -q \
            tests/infrastructure/trader_lab/test_architect_story_forensics_adjudication.py \
            tests/infrastructure/trader_lab/test_first_cohort_story_forensics.py
      - name: Verify mutation scope
        run: |
          git diff --exit-code -- .github/architect_story_forensics_patch.py .github/workflows/architect-story-forensics-adjudication.yml .github/architect-adjudication-trigger
          CHANGED="$(git diff --name-only | sort)"
          printf '%s\n' "$CHANGED"
          test "$CHANGED" = "$(printf '%s\n' \
            src/qore/infrastructure/trader_lab/first_cohort_story_forensics.py \
            tests/infrastructure/trader_lab/test_architect_story_forensics_adjudication.py | sort)"
      - name: Commit verified candidate
        run: |
          git config user.name "qore-architect-bot"
          git config user.email "qore-architect-bot@users.noreply.github.com"
          git add \
            src/qore/infrastructure/trader_lab/first_cohort_story_forensics.py \
            tests/infrastructure/trader_lab/test_architect_story_forensics_adjudication.py
          git commit -m "fix(trader-lab): preserve story evidence chronology"
          git push origin HEAD:${GITHUB_REF_NAME}
