name: QORE Capitalizer V3 SOURCE_FIRST WAIT5 FVG LAG2 Fresh Holdout 2Y V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-v3-source-first-wait5-fvg-lag2-fresh-holdout-2y-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v3_source_first_wait5_fvg_lag2_fresh_holdout_2y_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v3_source_first_wait5_fvg_lag2_fresh_holdout_2y_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-v3-source-first-wait5-fvg-lag2-fresh-holdout-2y-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_v3_source_first_wait5_fvg_lag2_fresh_holdout_2y_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_v3_source_first_wait5_fvg_lag2_fresh_holdout_2y_v1.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_v3_source_first_wait5_fvg_lag2_fresh_holdout_2y_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_v3_source_first_wait5_fvg_lag2_fresh_holdout_2y_v1.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {symbol: USDJPY, session: ASIA}
          - {symbol: AUDJPY, session: ASIA}
          - {symbol: AUDUSD, session: ASIA}
          - {symbol: GBPJPY, session: ASIA}
          - {symbol: EURUSD, session: LONDON}
          - {symbol: GBPUSD, session: LONDON}
          - {symbol: XAUUSD, session: NEW_YORK}
          - {symbol: USDCAD, session: NEW_YORK}
          - {symbol: NAS100, session: NEW_YORK}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable native-M1 clone
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Run paired FVG LAG2 fresh holdout
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v3_source_first_wait5_fvg_lag2_fresh_holdout_2y_v1 \
            market m1-source holdout-output --session ${{ matrix.session }}
      - name: Enforce market controls
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
          EXPECTED_SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"]
          report = json.loads(
              (
                  Path("holdout-output")
                  / f"capitalizer-{symbol.lower()}-v3-source-first-wait5-fvg-lag2-fresh-holdout-2y-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_V3_SOURCE_FIRST_WAIT5_FVG_LAG2_"
              "FRESH_HOLDOUT_2Y_V1"
          )
          assert report["symbol"] == symbol
          assert report["session"] == os.environ["EXPECTED_SESSION"]
          assert report["holdout_start"] == "2022-09-17T00:00:00+00:00"
          assert report["holdout_end_exclusive"] == "2024-09-17T00:00:00+00:00"
          assert report["non_overlapping_with_development"] is True
          assert report["max_confirmation_lag_minutes"] == 2
          assert report["same_source_first_mss_preserved"] is True
          assert report["same_original_m3_displacement_required"] is True
          assert report["same_original_causal_ob_required"] is True
          assert report["opposed_fvg_before_completion_rejected"] is True
          assert report["fill_before_fvg_confirmation_forbidden"] is True
          assert report["same_wait5_preserved"] is True
          assert report["same_stop_preserved"] is True
          assert report["same_target_preserved"] is True
          assert report["same_h1_deadline_preserved"] is True
          assert report["max3_contract_preserved"] is True
          assert report["outcome_used_for_admission"] is False
          assert report["holdout_outcome_used_for_rule_change"] is False
          assert report["fresh_holdout_for_lag2_rule"] is True
          assert report["rule_promotion_allowed"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v3-source-first-wait5-fvg-lag2-fresh-holdout-2y-v1-${{ matrix.symbol }}-${{ github.sha }}
          path: holdout-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v3-source-first-wait5-fvg-lag2-fresh-holdout-2y-v1-*-${{ github.sha }}
          path: holdout-input
          merge-multiple: false
      - name: Build paired fresh-holdout matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v3_source_first_wait5_fvg_lag2_fresh_holdout_2y_v1 \
            matrix holdout-input matrix-output
      - name: Enforce aggregate controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "matrix-output/"
                  "capitalizer-nine-market-v3-source-first-wait5-fvg-lag2-fresh-holdout-2y-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_NINE_MARKET_V3_SOURCE_FIRST_WAIT5_FVG_LAG2_"
              "FRESH_HOLDOUT_2Y_V1"
          )
          assert report["market_count"] == 9
          assert report["holdout_start"] == "2022-09-17T00:00:00+00:00"
          assert report["holdout_end_exclusive"] == "2024-09-17T00:00:00+00:00"
          assert report["non_overlapping_with_development"] is True
          assert report["max_confirmation_lag_minutes"] == 2
          assert report["same_source_first_mss_preserved"] is True
          assert report["same_original_m3_displacement_required"] is True
          assert report["same_original_causal_ob_required"] is True
          assert report["opposed_fvg_before_completion_rejected"] is True
          assert report["fill_before_fvg_confirmation_forbidden"] is True
          assert report["same_wait5_preserved"] is True
          assert report["same_stop_preserved"] is True
          assert report["same_target_preserved"] is True
          assert report["same_h1_deadline_preserved"] is True
          assert report["max3_contract_preserved"] is True
          assert report["outcome_used_for_admission"] is False
          assert report["holdout_outcome_used_for_rule_change"] is False
          assert report["fresh_holdout_for_lag2_rule"] is True
          assert report["automatic_promotion_allowed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-nine-market-v3-source-first-wait5-fvg-lag2-fresh-holdout-2y-v1-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
