name: QORE Native G0B Existing12 observed clocks and cost gate (no outcomes)

on:
  push:
    branches:
      - research/qore-native-g0b-sessions-cost-gates-20261012
    paths:
      - '.github/workflows/qore-native-g0b-existing12-observed-clock.yml'
      - 'src/qore/infrastructure/trader_lab/qore_native_g0b_sessions_cost_gates_v1.py'
      - 'tests/infrastructure/trader_lab/test_qore_native_g0b_sessions_cost_gates_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-native-g0b-observed-clock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Research-only structural tests; no broker access or economic outcome
        run: |
          ruff check --select F,E4,E7,E9 src/qore/infrastructure/trader_lab/qore_native_g0b_sessions_cost_gates_v1.py tests/infrastructure/trader_lab/test_qore_native_g0b_sessions_cost_gates_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_qore_native_g0b_sessions_cost_gates_v1.py

  observed_clock_matrix:
    needs: offline_gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        symbol: [AUDJPY, AUDUSD, EURUSD, GBPJPY, GBPUSD, NAS100, SP500, US30, USDCAD, USDJPY, XAGUSD, XAUUSD]
    env:
      SOURCE_SYMBOL: ${{ matrix.symbol }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Original 12-market frozen aggregate 10Y M5 (no broker API)
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-aggregate-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          run-id: '35166210458'
          github-token: ${{ github.token }}
          path: original-aggregate
      - name: Original provider-native M5 RAW annual ledger (SHA required)
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-${{ matrix.symbol }}-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          run-id: '35166210458'
          github-token: ${{ github.token }}
          path: original-native-m5
      - name: Revalidate G0 SHA, report observed clocks in NY/UTC, never candle economics
        run: |
          python -m qore.infrastructure.trader_lab.qore_native_g0b_sessions_cost_gates_v1 "$SOURCE_SYMBOL" original-native-m5 original-aggregate g0b-witness
          python - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(Path(f'g0b-witness/qore-native-g0b-{os.environ["SOURCE_SYMBOL"]}.json').read_text())
          assert data["g0_original_raw_sha_verified"] is True
          assert data["status"]=="BLOCKED_BROKER_SESSIONS_COSTS_AND_NEWS_ASOF"
          assert data["economic_evidence_gate"]["g1_net_authorized"] is False
          assert data["timestamp_clock_census"]["broker_rollover_and_dst_verified"] is False
          assert data["analysis_contains_ohlc_or_pnl"] is False
          PY
          printf '%s\n' "$GITHUB_SHA" > g0b-witness/code-head-sha.txt
      - name: Preserve per-symbol G0B witness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qore-native-g0b-observed-${{ matrix.symbol }}-${{ github.sha }}
          path: g0b-witness/
          retention-days: 90
          if-no-files-found: warn

  twelve_only_aggregate:
    needs: observed_clock_matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve only current SHA of the twelve structural witnesses
        uses: actions/download-artifact@v4
        with:
          pattern: qore-native-g0b-observed-*-${{ github.sha }}
          path: g0b-matrix
      - name: Verify SHA, exact universe, count and non-authorization
        run: |
          mkdir -p g0b-final
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          paths=list(Path("g0b-matrix").rglob("qore-native-g0b-*.json"))
          expected=set("AUDJPY AUDUSD EURUSD GBPJPY GBPUSD NAS100 SP500 US30 USDCAD USDJPY XAGUSD XAUUSD".split())
          if len(paths)!=12:
              raise ValueError(f"only {len(paths)} market witnesses, expected exactly 12")
          rows=[]
          for path in paths:
              chk=path.with_name(path.name+".sha256")
              if not chk.exists() or hashlib.sha256(path.read_bytes()).hexdigest()!=chk.read_text().split()[0]:
                  raise ValueError(f"bad JSON hash witness: {path.name}")
              x=json.loads(path.read_text())
              if not x["g0_original_raw_sha_verified"] or x["analysis_contains_ohlc_or_pnl"]:
                  raise ValueError("G0 source not verified or economics accessed")
              if x["economic_evidence_gate"]["g1_net_authorized"] is not False:
                  raise ValueError("unexpected G1 authorization")
              rows.append(x)
          if {row["symbol"] for row in rows}!=expected:
              raise ValueError("wrong symbol roster")
          total=sum(row["timestamp_clock_census"]["bars"] for row in rows)
          if total!=8726985:
              raise ValueError(f"source total mismatch: {total}")
          out={
              "identity":"QORE_NATIVE_EXISTING12_G0B_OBSERVED_CLOCK_AGGREGATE_V1",
              "source_run":35166210458,"symbols":sorted(rows,key=lambda x:x["symbol"]),
              "native_m5_bars_verified":total,
              "twelve_original_shas_revalidated":True,
              "broker_session_calendar_verified":False,
              "historical_costs_verified":False,
              "no_news_calendar_known_asof_verified":False,
              "G1_net_authorized":False,
              "no_market_outcomes_accessed":True,
              "status":"G0B_STRUCTURAL_OBSERVED_ONLY_P1_BROKER_CALENDAR_BLOCKED",
          }
          path=Path("g0b-final/qore-native-g0b-aggregate.json")
          path.write_text(json.dumps(out,sort_keys=True,indent=2)+"\n")
          print(out["status"],"bars",total,"markets",len(rows))
          PY
          printf '%s\n' "$GITHUB_SHA" > g0b-final/code-head-sha.txt
          (cd g0b-final && sha256sum qore-native-g0b-aggregate.json code-head-sha.txt > OUTPUT_SHA256SUMS.txt)
      - name: Publish structural evidence, not strategies
        uses: actions/upload-artifact@v4
        with:
          name: qore-native-g0b-existing12-aggregate-${{ github.sha }}
          path: g0b-final/
          retention-days: 90
          if-no-files-found: error
