name: VT08 A TTrades Written M30M3 Stop Evidence 1095D V1

on:
  push:
    branches:
      - agent/vt08-5m-methodology-source-20261010
    paths:
      - .github/workflows/vt08-a-m30m3-written-author-stop-1095d-v1.yml
      - src/qore/infrastructure/trader_lab/vt08_5m_a_ttrades_m30m3_stop_authority_contract_v1.py
      - tests/infrastructure/trader_lab/test_vt08_5m_a_ttrades_m30m3_stop_authority_contract_v1.py
      - src/qore/infrastructure/trader_lab/vt08_5m_a_author_stop_gate_market_audit_v1.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  written-stop-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        symbol: [EURJPY, USDCHF, NZDUSD, CADJPY, USDCAD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Ruff and fail-closed author example anti-lookahead tests
        run: |
          ruff check src/qore/infrastructure/trader_lab/vt08_5m_a_ttrades_m30m3_stop_authority_contract_v1.py src/qore/infrastructure/trader_lab/vt08_5m_a_author_stop_gate_market_audit_v1.py tests/infrastructure/trader_lab/test_vt08_5m_a_ttrades_m30m3_stop_authority_contract_v1.py
          pytest -q tests/infrastructure/trader_lab/test_vt08_5m_a_ttrades_m30m3_stop_authority_contract_v1.py
      - uses: actions/download-artifact@v4
        with:
          name: qore-vt08-cognitive-5m-fresh-${{ matrix.symbol }}-b2d33e1b4829d8b4afc76983decca8a99131403c
          path: base/${{ matrix.symbol }}
          github-token: ${{ github.token }}
          run-id: 35934924907
      - uses: actions/download-artifact@v4
        with:
          name: qore-vt08-m3-fractal-${{ matrix.symbol }}-bc1379d7661aac202495ec67afdd3098473ba723
          path: native-m3/${{ matrix.symbol }}
          github-token: ${{ github.token }}
          run-id: 35941643396
      - name: Independent M3 M15 evidence audit author rule A but stop inputs D
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from qore.infrastructure.trader_lab.vt08_5m_a_author_stop_gate_market_audit_v1 import audit_market_stop_example
          market=os.environ["SYMBOL"]
          native=list(Path(f"native-m3/{market}").rglob("m3-evidence.json"))
          if len(native)!=1:
              raise SystemExit("exactly one source-native M3 cTrader evidence required")
          output=audit_market_stop_example(
              Path(f"base/{market}/market-evidence-1095d.json"),native[0]
          )
          Path(f"artifacts/{market}-author-stop-full.json").write_text(
              json.dumps(output,sort_keys=True,separators=(",",":")),encoding="utf-8"
          )
          summary={k:output[k] for k in (
              "schema","market","counts","author_rule_written",
              "author_eq_reference_before_c2_verified",
              "author_breaker_low_selection_verified",
              "author_poi_selection_verified","candidate_events_source_complete",
              "cognitive_approved_signals","orders","fills","pnl_evaluated",
              "sealed_7y_accessed"
          )}
          Path(f"artifacts/{market}-author-stop-summary.json").write_text(
              json.dumps(summary,sort_keys=True,indent=2),encoding="utf-8"
          )
          print(json.dumps(summary,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vt08-a-m30m3-author-stop-${{ matrix.symbol }}-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
