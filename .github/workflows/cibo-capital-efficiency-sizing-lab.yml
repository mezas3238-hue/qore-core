name: CIBO Capital Management Authority CE2I

on:
  push:
    branches:
      - agent/cibo-capital-efficiency-sizing-lab-001
  pull_request:
    branches:
      - agent/ctrader-demo-live-behavior-lab-001

jobs:
  cibo-capital-management:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check             src/qore/infrastructure/cibo_capital_efficiency_sizing_lab.py             src/qore/infrastructure/cibo_capital_efficiency_reconstruction.py             src/qore/infrastructure/cibo_capital_management_authority.py             src/qore/infrastructure/cibo_capital_source_ledger.py             src/qore/infrastructure/cibo_ce2i_tool_registry.py             src/qore/infrastructure/cibo_trader_opportunity_adapter.py             src/qore/infrastructure/cibo_economic_floor.py             src/qore/infrastructure/cibo_capital_state_machine.py             src/qore/infrastructure/cibo_cma_risk_request.py             scripts/cibo_ce2i_sizing_reconstruction_report.py             tests/infrastructure/test_cibo_capital_efficiency_sizing_lab.py             tests/infrastructure/test_cibo_capital_efficiency_reconstruction.py             tests/infrastructure/test_cibo_capital_management_authority.py             tests/infrastructure/test_cibo_capital_source_ledger.py             tests/infrastructure/test_cibo_ce2i_tool_registry.py             tests/infrastructure/test_cibo_trader_opportunity_adapter.py             tests/infrastructure/test_cibo_economic_floor.py             tests/infrastructure/test_cibo_capital_state_machine.py             tests/infrastructure/test_cibo_cma_risk_request.py

      - name: Compile passive integration
        run: |
          python -m py_compile             src/qore/infrastructure/ctrader_demo_free_sink.py             scripts/cibo_ce2i_sizing_reconstruction_report.py

      - name: Mypy
        run: |
          mypy             src/qore/infrastructure/cibo_capital_efficiency_sizing_lab.py             src/qore/infrastructure/cibo_capital_efficiency_reconstruction.py             src/qore/infrastructure/cibo_capital_management_authority.py             src/qore/infrastructure/cibo_capital_source_ledger.py             src/qore/infrastructure/cibo_ce2i_tool_registry.py             src/qore/infrastructure/cibo_trader_opportunity_adapter.py             src/qore/infrastructure/cibo_economic_floor.py             src/qore/infrastructure/cibo_capital_state_machine.py             src/qore/infrastructure/cibo_cma_risk_request.py             scripts/cibo_ce2i_sizing_reconstruction_report.py             tests/infrastructure/test_cibo_capital_efficiency_sizing_lab.py             tests/infrastructure/test_cibo_capital_efficiency_reconstruction.py             tests/infrastructure/test_cibo_capital_management_authority.py             tests/infrastructure/test_cibo_capital_source_ledger.py             tests/infrastructure/test_cibo_ce2i_tool_registry.py             tests/infrastructure/test_cibo_trader_opportunity_adapter.py             tests/infrastructure/test_cibo_economic_floor.py             tests/infrastructure/test_cibo_capital_state_machine.py             tests/infrastructure/test_cibo_cma_risk_request.py

      - name: Pytest
        run: |
          pytest -q             tests/infrastructure/test_cibo_capital_efficiency_sizing_lab.py             tests/infrastructure/test_cibo_capital_efficiency_reconstruction.py             tests/infrastructure/test_cibo_capital_management_authority.py             tests/infrastructure/test_cibo_capital_source_ledger.py             tests/infrastructure/test_cibo_ce2i_tool_registry.py             tests/infrastructure/test_cibo_trader_opportunity_adapter.py             tests/infrastructure/test_cibo_economic_floor.py             tests/infrastructure/test_cibo_capital_state_machine.py             tests/infrastructure/test_cibo_cma_risk_request.py
