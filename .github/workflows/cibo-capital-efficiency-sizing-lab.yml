name: CIBO Capital Efficiency Sizing Lab

on:
  push:
    branches:
      - agent/cibo-capital-efficiency-sizing-lab-001
  pull_request:
    branches:
      - agent/ctrader-demo-live-behavior-lab-001

jobs:
  capital-efficiency-sizing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check             src/qore/infrastructure/cibo_capital_efficiency_sizing_lab.py             tests/infrastructure/test_cibo_capital_efficiency_sizing_lab.py

      - name: Mypy
        run: |
          mypy             src/qore/infrastructure/cibo_capital_efficiency_sizing_lab.py             tests/infrastructure/test_cibo_capital_efficiency_sizing_lab.py

      - name: Pytest
        run: |
          pytest -q tests/infrastructure/test_cibo_capital_efficiency_sizing_lab.py
