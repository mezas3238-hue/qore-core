name: VT31 COG V3 continuous M1 tape seal fail closed research
on:
  push:
    branches:
      - agent/vt31-m0m4-continuous-tape-seal-cog-v3-20261015
    paths:
      - 'docs/research/VT31_COG_V3_CONTINUOUS_M1_TAPE_SEAL_PREREG_2026-10-15.md'
      - 'scripts/vt31_m0m4_continuous_tape_seal_cog_v3_20261015.py'
      - 'tests/infrastructure/test_vt31_m0m4_continuous_tape_seal_cog_v3_20261015.py'
      - '.github/workflows/vt31-cog-v3-continuous-seal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cognitiva-memory-integrity-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 80
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify prereg was earlier and G3 code/contract never changed
        run: |
          set -euo pipefail
          git cat-file -t 3a1c637811c6c2c648abc688d45bff22ddbc4c54
          git merge-base --is-ancestor 3a1c637811c6c2c648abc688d45bff22ddbc4c54 HEAD
          test "$(git hash-object src/qore/infrastructure/traders/vt31_ict_cleanroom/cognition.py)" = d0ab4c15d6e9d24e53224d27bdb2cd96af914fb9
          test "$(git hash-object src/qore/infrastructure/traders/vt31_ict_cleanroom/operations.py)" = 0ce9707314aecb71155de8b57044b6ec028847b2
          test "$(git hash-object docs/research/VT31_G3_DECISION_METODOLOGICA_STOP_FRAMEWORK_FVG_EXIT_V1_2026-10-12.md)" = e99c70b4e018d626fb620d9a21b9314a51abc36d
      - name: Run V3 rolling-seal falsifiers with V2 and M0/M4 regressions
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]' pytest-xdist
          ruff check scripts/vt31_m0m4_continuous_tape_seal_cog_v3_20261015.py tests/infrastructure/test_vt31_m0m4_continuous_tape_seal_cog_v3_20261015.py
          python -m py_compile scripts/vt31_m0m4_continuous_tape_seal_cog_v3_20261015.py
          mkdir -p evidence
          PYTHONPATH=src:. pytest -q -n 4 -o addopts='' \
            tests/infrastructure/test_vt31_m0m4_continuous_tape_seal_cog_v3_20261015.py \
            tests/infrastructure/test_vt31_m0_m4_context_memory_cog_candidate_20261015.py \
            tests/infrastructure/test_vt31_m4_closed_m1_author_gate_20261015.py \
            tests/infrastructure/test_vt31_m4_ob_breaker_author_evidence_gate_20261015.py \
            tests/infrastructure/test_vt31_m0_temporal_admission_20261015.py \
            tests/infrastructure/test_vt31_m0_real_cog_invocation_20261015.py \
            tests/infrastructure/test_vt31_m0_predecision_method_router_20261015.py \
            tests/infrastructure/test_vt31_ttrades_source_first_g3_cognitive_proposal_20261015.py \
            tests/infrastructure/test_vt31_ict_cleanroom_cognition.py \
            --junitxml=evidence/junit.xml | tee evidence/tests.txt
          PYTHONPATH=src:. python scripts/vt31_m0m4_continuous_tape_seal_cog_v3_20261015.py \
            --out evidence/VT31_COG_V3_M0_SEAL_8_CASES.json \
            | tee evidence/summary.json
      - name: Enforce eight prereg scenarios, no false certificates or activity
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('evidence/VT31_COG_V3_M0_SEAL_8_CASES.json'))
          assert p['prereg_commit']=='3a1c637811c6c2c648abc688d45bff22ddbc4c54'
          assert len(p['cases'])==8
          assert sum(c['seal_count'] is not None for c in p['cases'])==4
          assert all(c['action']=='WAIT' for c in p['cases'])
          assert not p['owner_m0_signed'] and not p['author_m3_m4_m5_certified']
          assert not p['independent_cog_ops_human_signed']
          assert not p['native_cog_integrated']
          assert not p['methodology_certified'] and not p['cognition_certified']
          assert not p['live'] and p['broker_orders']==p['sizing']==0
          print('VT31_COG_V3_FULL_OBSERVED_TAPE_SEAL_RESEARCH_ONLY')
          PY
          git rev-parse HEAD > evidence/commit_sha.txt
          printf '%s\n' 3a1c637811c6c2c648abc688d45bff22ddbc4c54 > evidence/prereg_sha.txt
          printf '%s\n' 'COG_V3_RESEARCH_ONLY_NO_LIVE_NO_OMS_NO_SIZING' > evidence/scope.txt
          (cd evidence && sha256sum *.json *.xml *.txt > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: vt31-cog-v3-continuous-seal-${{ github.sha }}
          path: evidence/
          retention-days: 90
          if-no-files-found: error
