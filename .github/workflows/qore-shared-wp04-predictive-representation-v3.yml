name: QORE Shared WP04 Predictive Representation V3

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - src/qore/infrastructure/core_stack_v2/representation_predictive_v3.py
      - scripts/shared_wp04_predictive_representation_v3.py
      - tests/infrastructure/test_core_stack_v2_representation_predictive_v3.py
      - .github/workflows/qore-shared-wp04-predictive-representation-v3.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  predictive-representation-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Announce WP04 V3 temporal representation run
        run: |
          gh issue comment 642 --body "WP-04 V3 temporal predictive representation run started — Git SHA \`${GITHUB_SHA}\`, GitHub Actions run \`${GITHUB_RUN_ID}\`. R8/R6/R5 are consumed development evidence; future state is training-only; named target labels and fresh holdout remain closed."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Shared
        run: pip install -e ".[dev]"

      - name: Static and adversarial contract validation
        run: |
          ruff check \
            src/qore/infrastructure/core_stack_v2/representation_predictive_v3.py \
            scripts/shared_wp04_predictive_representation_v3.py \
            tests/infrastructure/test_core_stack_v2_representation_predictive_v3.py
          python -m py_compile \
            src/qore/infrastructure/core_stack_v2/representation_predictive_v3.py \
            scripts/shared_wp04_predictive_representation_v3.py
          pytest -q \
            tests/infrastructure/test_core_stack_v2_representation_predictive_v3.py

      - name: Recover immutable consumed R8 R6 R5 market evidence
        run: |
          set -euo pipefail
          mkdir -p input/r8 input/r6 input/r5 result

          download_artifact() {
            local artifact_id="$1"
            local output="$2"
            local tmp="${output}.tmp"
            rm -f "$tmp"
            for attempt in 1 2 3 4; do
              if gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$tmp"; then
                mv "$tmp" "$output"
                return 0
              fi
              rm -f "$tmp"
              sleep $((attempt * 30))
            done
            return 1
          }

          download_artifact 10402199719 r8.zip
          unzip -q r8.zip -d input/r8
          (cd input/r8 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

          download_artifact 10389112524 r6.zip
          unzip -q r6.zip -d input/r6
          (cd input/r6 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

          download_artifact 10380044761 r5.zip
          unzip -q r5.zip -d input/r5
          (cd input/r5 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

      - name: Run target-blind temporal predictive representation V3
        run: |
          python scripts/shared_wp04_predictive_representation_v3.py \
            --r8-nas input/r8/fresh/NAS100/market-evidence.json \
            --r8-sp input/r8/fresh/SP500/market-evidence.json \
            --r8-us input/r8/fresh/US30/market-evidence.json \
            --r6-nas input/r6/fresh/NAS100/market-evidence.json \
            --r6-sp input/r6/fresh/SP500/market-evidence.json \
            --r6-us input/r6/fresh/US30/market-evidence.json \
            --r5-nas input/r5/fresh/NAS100/market-evidence.json \
            --r5-sp input/r5/fresh/SP500/market-evidence.json \
            --r5-us input/r5/fresh/US30/market-evidence.json \
            --output result/wp04-predictive-representation-v3.json \
            | tee result/summary.json

      - name: Validate scientific protocol and holdout lock
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(
              Path("result/wp04-predictive-representation-v3.json").read_text()
          )
          assert p["protocol_pass"] is True
          assert p["exit_gate_pass"] is False
          assert p["fresh_holdout_opened"] is False
          assert p["status"] in {
              "WP04_V3_TEMPORAL_REPRESENTATION_FROZEN_FOR_PROBE",
              "WP04_V3_TEMPORAL_REPRESENTATION_FALSIFIED",
          }

          for partition in ("r8", "r6", "r5"):
              assert p["transition_counts"][partition] >= 6000

          model=p["model"]
          assert model["horizon_minutes"] == 30
          assert model["discovery_partition"] == "r8"
          assert model["development_partitions"] == ["r6","r5"]
          assert model["feature_count"] >= 50
          assert model["ontology_count"] >= 10
          assert model["training_future_market_used"] is True
          assert model["runtime_future_market_used"] is False
          assert model["named_evaluation_target_used"] is False
          assert model["candidate_count"] >= model["selected_concept_count"]
          assert (
              model["rejected_candidate_count"]
              == model["candidate_count"] - model["selected_concept_count"]
          )
          for concept in model["concepts"]:
              for diagnostic in concept["diagnostics"]:
                  assert diagnostic["passes"] is True

          g=p["governance"]
          assert g["r8_r6_r5_are_consumed_development"] is True
          assert g["future_state_prediction_training_only"] is True
          assert g["runtime_future_market_used"] is False
          assert g["named_evaluation_targets_used_for_discovery"] is False
          assert g["trade_outcomes_used"] is False
          assert g["trade_pnl_used"] is False
          assert g["symbol_identity_feature_used"] is False
          assert g["partition_identity_feature_used"] is False
          assert g["fresh_holdout_opened"] is False
          assert g["fresh_holdout_required_after_probe_freeze"] is True
          assert g["global_qore_validation_still_required"] is True
          assert g["knowledge_auto_promotion"] is False
          assert g["shared_methodology_authority"] is False
          assert g["shared_sizing_authority"] is False
          assert g["shared_risk_authority"] is False
          assert g["shared_order_authority"] is False
          assert g["shared_execution_authority"] is False
          assert g["live_authorized"] is False
          assert g["production_authorized"] is False
          assert g["real_capital_authorized"] is False
          assert g["merge_authorized"] is False
          PY

      - name: Bind result
        run: |
          echo "${GITHUB_SHA}" > result/git-sha.txt
          (
            cd result
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-wp04-predictive-representation-v3-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Report WP04 V3 temporal representation result
        if: always()
        run: |
          if [ ! -f result/wp04-predictive-representation-v3.json ]; then
            gh issue comment 642 --body "WP-04 V3 run \`${GITHUB_RUN_ID}\` did not produce a scientific payload. Inspect workflow failure; fresh holdout remains closed."
            exit 0
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path

          p=json.loads(
              Path("result/wp04-predictive-representation-v3.json").read_text()
          )
          model=p.get("model",{})
          lines=[
              "## WP-04 V3 temporal predictive representation result",
              "",
              f"- Git SHA: \`{os.environ['GITHUB_SHA']}\`",
              f"- GitHub Actions run: \`{os.environ['GITHUB_RUN_ID']}\`",
              f"- status: **{p['status']}**",
              f"- protocol_pass: **{p['protocol_pass']}**",
              f"- representation_frozen_for_probe: **{p.get('representation_frozen_for_probe', False)}**",
              f"- transition counts: {p.get('transition_counts', {})}",
              f"- candidate concepts: {model.get('candidate_count',0)}",
              f"- selected temporal concepts: {model.get('selected_concept_count',0)}",
              f"- rejected candidates: {model.get('rejected_candidate_count',0)}",
              "- future state used for training only: **True**",
              "- runtime future information used: **False**",
              "- named evaluation targets used for discovery: **False**",
              "- fresh holdout opened: **False**",
              "",
              "Selected temporal concepts:",
          ]
          concepts=model.get("concepts",[])
          if concepts:
              for concept in concepts:
                  ds=", ".join(
                      f"{d['partition']}:align={d['future_profile_alignment_bps']}bps,strength={d['predictive_strength_ratio_milli']/1000:.3f},source_scale={d['source_scale_ratio_milli']/1000:.3f}"
                      for d in concept["diagnostics"]
                  )
                  lines.append(
                      f"- \`{concept['concept_id']}\` predictive={concept['discovery_predictive_strength_bps']}bps, invariance={concept['temporal_invariance_bps']}bps; {ds}"
                  )
          else:
              lines.append("- none; V3 source-only temporal hypothesis falsified")

          if p.get("representation_frozen_for_probe"):
              lines.append(
                  "Next legal step: consumed target diagnostics with this exact representation; fresh holdout remains closed."
              )
          else:
              lines.append(
                  "Do not open fresh evidence; redesign representation mechanism from consumed evidence."
              )
          Path("result/wp04-v3-issue-update.md").write_text(
              "\n".join(lines)+"\n"
          )
          PY
          gh issue comment 642 --body-file result/wp04-v3-issue-update.md
