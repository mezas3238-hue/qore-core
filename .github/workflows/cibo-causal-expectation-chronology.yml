name: QORE CIBO Causal Expectation Chronology

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cibo-causal-expectation-leakage-fix-001
    paths:
      - '.github/workflows/cibo-causal-expectation-chronology.yml'
      - 'src/qore/infrastructure/cibo_ce2i_phase20_train_prior.py'
      - 'src/qore/infrastructure/cibo_single_account_manifest_economics.py'
      - 'src/qore/infrastructure/cibo_native_max_cognitive_episode.py'
      - 'tests/infrastructure/test_cibo_ce2i_phase20_train_prior.py'
      - 'tests/infrastructure/test_cibo_single_account_manifest_economics.py'
      - 'tests/infrastructure/test_cibo_native_maximum_intelligence.py'

permissions:
  contents: read

concurrency:
  group: qore-cibo-causal-expectation-chronology-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chronology:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Compile and lint
        run: |
          set -euo pipefail
          python -m py_compile             src/qore/infrastructure/cibo_ce2i_phase20_train_prior.py             src/qore/infrastructure/cibo_single_account_manifest_economics.py             tests/infrastructure/test_cibo_ce2i_phase20_train_prior.py             tests/infrastructure/test_cibo_single_account_manifest_economics.py
          ruff check             src/qore/infrastructure/cibo_ce2i_phase20_train_prior.py             src/qore/infrastructure/cibo_single_account_manifest_economics.py             tests/infrastructure/test_cibo_ce2i_phase20_train_prior.py             tests/infrastructure/test_cibo_single_account_manifest_economics.py

      - name: Prove evidence chronology
        run: |
          set -euo pipefail
          pytest -q --no-cov             tests/infrastructure/test_cibo_ce2i_phase20_train_prior.py             tests/infrastructure/test_cibo_single_account_manifest_economics.py
