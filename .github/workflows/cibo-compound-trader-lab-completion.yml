name: QORE CIBO Compound Trader Lab Completion

# RETIRED AUTO-PATH: manual-only legacy evidence; automatic execution moved to QORE GitHub Trader Lab Fast.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  cc10-pc01:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_ARTIFACT_ID: '11261743257'
      SOURCE_HEAD_SHA: 'bc7909f2f28fbfa1bef1b83768499a28f634409a'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Recover retained Trader Lab population
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" > "$RUNNER_TEMP/source.zip"
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/source"
          test -s "$RUNNER_TEMP/source/decision-trace.json"
      - name: Revalidate universal temporal gate and weighted constant math
        run: |
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_compound_constant_statistics.py \
            tests/infrastructure/test_cibo_compound_temporal_population_assessment.py \
            tests/infrastructure/test_cibo_protected_reinvestment_policy.py
      - name: Execute full prerequisite chain then CC10-CC16 and PC01
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/compound-completion"
          python scripts/cibo_compound_trader_lab_completion_audit.py \
            --decision-trace "$RUNNER_TEMP/source/decision-trace.json" \
            --source-head "$SOURCE_HEAD_SHA" \
            --output "$RUNNER_TEMP/compound-completion/audit.json"
      - name: Enforce sequential completion and portfolio constants
        run: |
          python - <<'PY'
          import json
          import os
          from decimal import Decimal
          from pathlib import Path

          p = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "compound-completion"
                  / "audit.json"
              ).read_text()
          )
          assert p["candidate_count"] == len(p["lanes"]) > 0
          assert p["compound_gate_count"] == 16
          assert p["portfolio_gate_count"] == 1
          assert p["all_cc01_cc16_pass"] is True
          assert p["all_pc01_pass"] is True
          assert p["all_compound_and_portfolio_functions_pass"] is True
          stats = p["compound_portfolio_constant_summary"]
          assert stats["system"] == "COMPOUND_PORTFOLIO"
          assert stats["observation_count"] == p["candidate_count"]
          mn = Decimal(stats["minimum_constant"])
          wa = Decimal(stats["weighted_average_constant"])
          mx = Decimal(stats["maximum_constant"])
          assert Decimal(0) <= mn <= wa <= mx
          assert Decimal(stats["total_source_capital_usd"]) > 0
          assert p["global_portfolio"]["account_count"] == p["candidate_count"]
          assert p["global_portfolio"]["read_only"] is True
          assert p["global_portfolio"]["cross_account_transfer_authority"] is False
          assert p["global_portfolio"]["runtime_authority"] is False
          assert p["governance"]["forward_observed_claimed"] is False
          assert p["governance"]["economic_replication_claimed"] is False
          assert p["governance"]["certification_claimed"] is False
          for lane in p["lanes"].values():
              assert lane["status"] == "PASS"
              assert lane["compound_gate_count"] == 16
              assert lane["portfolio_gate_count"] == 1
              assert len(lane["gates"]) == 17
              assert all(g["technical_status"] == "PASS" for g in lane["gates"])
              assert all(g["broker_mutation"] is False for g in lane["gates"])
          PY
      - name: Static integrity
        run: |
          python -m compileall -q \
            scripts/cibo_compound_trader_lab_completion_audit.py \
            src/qore/infrastructure/cibo_compound_constant_statistics.py \
            src/qore/infrastructure/cibo_compound_temporal_replication_gate.py \
            src/qore/infrastructure/cibo_protected_reinvestment_policy.py
          ruff check \
            scripts/cibo_compound_trader_lab_completion_audit.py \
            src/qore/infrastructure/cibo_compound_constant_statistics.py \
            src/qore/infrastructure/cibo_compound_temporal_replication_gate.py \
            src/qore/infrastructure/cibo_protected_reinvestment_policy.py \
            tests/infrastructure/test_cibo_compound_constant_statistics.py \
            tests/infrastructure/test_cibo_compound_temporal_population_assessment.py \
            tests/infrastructure/test_cibo_protected_reinvestment_policy.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-cibo-compound-trader-lab-completion-${{ github.run_id }}
          path: ${{ runner.temp }}/compound-completion
          if-no-files-found: warn
          retention-days: 90
