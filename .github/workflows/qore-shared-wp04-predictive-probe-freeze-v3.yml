name: QORE Shared WP04 Predictive Probe Freeze V3

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - src/qore/infrastructure/core_stack_v2/representation_predictive_v3.py
      - src/qore/infrastructure/core_stack_v2/representation_predictive_probe_v3.py
      - scripts/shared_wp04_predictive_representation_v3.py
      - scripts/shared_wp04_predictive_probe_freeze_v3.py
      - tests/infrastructure/test_core_stack_v2_representation_predictive_v3.py
      - tests/infrastructure/test_core_stack_v2_representation_predictive_probe_v3.py
      - .github/workflows/qore-shared-wp04-predictive-probe-freeze-v3.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  predictive-probe-freeze-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Announce WP04 V3 probe-freeze run
        run: |
          gh issue comment 642 --body "WP-04 V3 consumed predictive probe-freeze run started — Git SHA \`${GITHUB_SHA}\`, GitHub Actions run \`${GITHUB_RUN_ID}\`. Temporal representation is frozen first; R8/R6/R5 named targets are consumed diagnostics only; fresh holdout remains closed."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Shared
        run: pip install -e ".[dev]"

      - name: Static and predictive-probe contract validation
        run: |
          ruff check \
            src/qore/infrastructure/core_stack_v2/representation_predictive_v3.py \
            src/qore/infrastructure/core_stack_v2/representation_predictive_probe_v3.py \
            scripts/shared_wp04_predictive_representation_v3.py \
            scripts/shared_wp04_predictive_probe_freeze_v3.py \
            tests/infrastructure/test_core_stack_v2_representation_predictive_v3.py \
            tests/infrastructure/test_core_stack_v2_representation_predictive_probe_v3.py
          python -m py_compile \
            src/qore/infrastructure/core_stack_v2/representation_predictive_v3.py \
            src/qore/infrastructure/core_stack_v2/representation_predictive_probe_v3.py \
            scripts/shared_wp04_predictive_representation_v3.py \
            scripts/shared_wp04_predictive_probe_freeze_v3.py
          pytest -q \
            tests/infrastructure/test_core_stack_v2_representation_predictive_v3.py \
            tests/infrastructure/test_core_stack_v2_representation_predictive_probe_v3.py

      - name: Recover immutable consumed R8 R6 R5 market evidence
        run: |
          set -euo pipefail
          mkdir -p input/r8 input/r6 input/r5 result

          download_artifact() {
            local artifact_id="$1"
            local output="$2"
            local tmp="${output}.tmp"
            rm -f "$tmp"
            for attempt in 1 2 3 4; do
              if gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$tmp"; then
                mv "$tmp" "$output"
                return 0
              fi
              rm -f "$tmp"
              sleep $((attempt * 30))
            done
            return 1
          }

          download_artifact 10402199719 r8.zip
          unzip -q r8.zip -d input/r8
          (cd input/r8 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

          download_artifact 10389112524 r6.zip
          unzip -q r6.zip -d input/r6
          (cd input/r6 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

          download_artifact 10380044761 r5.zip
          unzip -q r5.zip -d input/r5
          (cd input/r5 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

      - name: Run consumed predictive target diagnostics and freeze probe
        run: |
          python scripts/shared_wp04_predictive_probe_freeze_v3.py \
            --r8-nas input/r8/fresh/NAS100/market-evidence.json \
            --r8-sp input/r8/fresh/SP500/market-evidence.json \
            --r8-us input/r8/fresh/US30/market-evidence.json \
            --r6-nas input/r6/fresh/NAS100/market-evidence.json \
            --r6-sp input/r6/fresh/SP500/market-evidence.json \
            --r6-us input/r6/fresh/US30/market-evidence.json \
            --r5-nas input/r5/fresh/NAS100/market-evidence.json \
            --r5-sp input/r5/fresh/SP500/market-evidence.json \
            --r5-us input/r5/fresh/US30/market-evidence.json \
            --output result/wp04-predictive-probe-freeze-v3.json \
            | tee result/summary.json

      - name: Validate scientific protocol and holdout lock
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(
              Path("result/wp04-predictive-probe-freeze-v3.json").read_text()
          )
          assert p["protocol_pass"] is True
          assert p["exit_gate_pass"] is False
          assert p["fresh_holdout_opened"] is False
          assert p["status"] in {
              "WP04_V3_PROBE_FROZEN_FOR_ONE_SHOT_HOLDOUT",
              "WP04_V3_TARGET_DIAGNOSTIC_FALSIFIED_BEFORE_HOLDOUT",
          }

          r=p["representation"]
          assert len(r["fingerprint"]) == 64
          assert r["horizon_minutes"] == 30
          assert r["selected_concept_count"] >= 1
          assert r["training_future_market_used"] is True
          assert r["runtime_future_market_used"] is False
          assert r["named_evaluation_target_used"] is False

          diagnostics=p["leave_one_partition_out_consumed_diagnostics"]
          assert set(diagnostics) == {"r8","r6","r5"}
          for partition, summary in diagnostics.items():
              assert summary["target_count"] == 8
              assert summary["minimum_positive_target_count"] == 4
              assert summary["minimum_pooled_incremental_bps"] == 0
              for target in summary["targets"]:
                  assert target["partition"] == partition
                  assert target["holdout_refit"] is False
                  assert target["runtime_future_market_used"] is False
                  assert target["identity_used"] is False
                  assert target["knowledge_promotion_authority"] is False

          if p["probe_frozen_for_holdout"]:
              assert p["development_gate_pass"] is True
              assert len(p["final_frozen_probes"]) == 8
              assert len({
                  item["probe_fingerprint"]
                  for item in p["final_frozen_probes"]
              }) == 8
              for probe in p["final_frozen_probes"]:
                  assert probe["calibration_partitions"] == ["r8","r6","r5"]
                  assert probe["representation_training_future_only"] is True
                  assert probe["runtime_future_market_used"] is False
                  assert probe["holdout_used_for_fit"] is False
                  assert probe["identity_used"] is False
                  assert probe["knowledge_promotion_authority"] is False
          else:
              assert p["development_gate_pass"] is False
              assert p["final_frozen_probes"] == []

          g=p["governance"]
          assert g["r8_r6_r5_are_consumed_development"] is True
          assert g["representation_frozen_before_named_targets"] is True
          assert g["future_state_prediction_training_only"] is True
          assert g["runtime_future_market_used"] is False
          assert g["leave_one_out_is_not_fresh_holdout"] is True
          assert g["fresh_holdout_opened"] is False
          assert g["fresh_holdout_must_not_refit_representation"] is True
          assert g["fresh_holdout_must_not_refit_probe"] is True
          assert g["final_wp04_gate_minimum_incremental_bps_unchanged"] == 100
          assert g["final_wp04_gate_minimum_positive_targets_unchanged"] == 4
          assert g["identity_shortcut_used"] is False
          assert g["trade_outcome_or_pnl_used"] is False
          assert g["knowledge_auto_promotion"] is False
          assert g["shared_methodology_authority"] is False
          assert g["shared_sizing_authority"] is False
          assert g["shared_risk_authority"] is False
          assert g["shared_order_authority"] is False
          assert g["shared_execution_authority"] is False
          assert g["live_authorized"] is False
          assert g["production_authorized"] is False
          assert g["real_capital_authorized"] is False
          assert g["merge_authorized"] is False
          PY

      - name: Bind result
        run: |
          echo "${GITHUB_SHA}" > result/git-sha.txt
          (
            cd result
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-wp04-predictive-probe-freeze-v3-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Report WP04 V3 probe-freeze result
        if: always()
        run: |
          if [ ! -f result/wp04-predictive-probe-freeze-v3.json ]; then
            gh issue comment 642 --body "WP-04 V3 predictive probe-freeze run \`${GITHUB_RUN_ID}\` did not produce a scientific payload. Inspect workflow failure; fresh holdout remains closed."
            exit 0
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path

          p=json.loads(
              Path("result/wp04-predictive-probe-freeze-v3.json").read_text()
          )
          d=p["leave_one_partition_out_consumed_diagnostics"]
          lines=[
              "## WP-04 V3 consumed predictive probe-freeze result",
              "",
              f"- Git SHA: \`{os.environ['GITHUB_SHA']}\`",
              f"- GitHub Actions run: \`{os.environ['GITHUB_RUN_ID']}\`",
              f"- status: **{p['status']}**",
              f"- protocol_pass: **{p['protocol_pass']}**",
              f"- development_gate_pass: **{p['development_gate_pass']}**",
              f"- probe_frozen_for_holdout: **{p['probe_frozen_for_holdout']}**",
              f"- representation fingerprint: \`{p['representation']['fingerprint']}\`",
              f"- temporal concepts: {p['representation']['selected_concept_count']}",
              f"- R8 consumed LOO incremental info: **{d['r8']['pooled_incremental_information_bps']} bps**, positive {d['r8']['positive_target_count']}/{d['r8']['target_count']}",
              f"- R6 consumed LOO incremental info: **{d['r6']['pooled_incremental_information_bps']} bps**, positive {d['r6']['positive_target_count']}/{d['r6']['target_count']}",
              f"- R5 consumed LOO incremental info: **{d['r5']['pooled_incremental_information_bps']} bps**, positive {d['r5']['positive_target_count']}/{d['r5']['target_count']}",
              "- these are consumed development diagnostics, not fresh holdout evidence",
              "- final WP-04 holdout gate remains >=100 bps pooled + >=4/8 positive",
              "- fresh holdout opened: **False**",
          ]
          if p["probe_frozen_for_holdout"]:
              lines.append(
                  f"- frozen probe count: {len(p['final_frozen_probes'])}"
              )
              lines.append(
                  "Next legal step: preregister an independent one-shot holdout and evaluate the exact frozen fingerprints without refit."
              )
          else:
              lines.append(
                  "V3 target diagnostics falsified the predictive representation before holdout; do not spend fresh evidence."
              )
          Path("result/wp04-v3-probe-issue-update.md").write_text(
              "\n".join(lines)+"\n"
          )
          PY
          gh issue comment 642 --body-file result/wp04-v3-probe-issue-update.md
