name: QORE CIBO GEN-C3..GEN-C6 Economic Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-genc3-genc6-economic-gate.yml'
      - 'src/qore/infrastructure/cibo_genc3_genc6_economic_gate.py'
      - 'tests/infrastructure/test_cibo_genc3_genc6_economic_gate.py'
      - 'docs/research/CIBO-GEN-C3-GEN-C6-NONCOMPENSATORY-ECONOMIC-GATE-V1.md'
      - 'docs/research/CIBO-MASTER-OPEN-WORK-LEDGER-V1.json'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  genc3-genc6-economic-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: GEN-C3..GEN-C6 non-compensatory economic contract
        run: |
          ruff check \
            src/qore/infrastructure/cibo_genc3_genc6_economic_gate.py \
            tests/infrastructure/test_cibo_genc3_genc6_economic_gate.py
          mypy src/qore/infrastructure/cibo_genc3_genc6_economic_gate.py
          python -m py_compile \
            src/qore/infrastructure/cibo_genc3_genc6_economic_gate.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_genc3_genc6_economic_gate.py
