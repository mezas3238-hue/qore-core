name: QORE Alpha2 ONE predeclared daily 252d TSMOM 5-session 33-market gross test
on:
  push:
    branches: ['research/qore-alpha2-original-intermarket-propagation-20261012']
    paths:
      - '.github/workflows/qore-alpha2-tsmom-daily-one-experiment.yml'
      - 'src/qore/research/alpha2_tsmom_daily_weekly.py'
      - 'src/qore/research/alpha2_tsmom_daily_weekly_panel.py'
      - 'tests/research/test_alpha2_tsmom_daily_weekly.py'
      - 'tests/research/test_alpha2_tsmom_daily_weekly_panel.py'
      - 'docs/research/QORE_ALPHA2_TSMOM_DAILY_WEEKLY_SINGLE_TEST_PREREG_2026-10-12.md'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: alpha2-one-daily-TSMOM-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prereg_and_synthetic_causality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . 'pytest>=8,<9' 'ruff>=0.5,<1'
      - name: Freeze exact original prereg before any prices consumed
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1c46194e3b5e9165504f0ff9d41eb1dee57f0b42 "$GITHUB_SHA"
          test -s docs/research/QORE_ALPHA2_TSMOM_DAILY_WEEKLY_SINGLE_TEST_PREREG_2026-10-12.md
          ruff check src/qore/research/alpha2_tsmom_daily_weekly.py src/qore/research/alpha2_tsmom_daily_weekly_panel.py tests/research/test_alpha2_tsmom_daily_weekly.py tests/research/test_alpha2_tsmom_daily_weekly_panel.py
          pytest -q -o addopts='' tests/research/test_alpha2_tsmom_daily_weekly.py tests/research/test_alpha2_tsmom_daily_weekly_panel.py
  original12_daily_source:
    needs: prereg_and_synthetic_causality
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        symbol: [AUDJPY, AUDUSD, EURUSD, GBPJPY, GBPUSD, NAS100, SP500, US30, USDCAD, USDJPY, XAGUSD, XAUUSD]
    env:
      SYMBOL: ${{ matrix.symbol }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: qore-native-final33-source-manifest-dba0e0c3b61e430d3ed51abab562ebd92060a0ff
          run-id: '38207337960'
          github-token: ${{ github.token }}
          path: signed33
      - uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-aggregate-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          run-id: '35166210458'
          github-token: ${{ github.token }}
          path: atlas-aggregate
      - uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-${{ matrix.symbol }}-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          run-id: '35166210458'
          github-token: ${{ github.token }}
          path: original-native
      - name: Original 11y yearly SHA then read pre-embargo DAILY source only
        run: |
          set -euo pipefail
          python -m qore.research.alpha2_tsmom_daily_weekly "$SYMBOL" original-native signed33 tsmom-worker --aggregate12 atlas-aggregate
          printf '%s\n' "$GITHUB_SHA" > tsmom-worker/exact-code-head-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: alpha2-tsmom-daily-${{ matrix.symbol }}-${{ github.sha }}
          path: tsmom-worker/
          retention-days: 90
          if-no-files-found: error
  new21_daily_source:
    needs: prereg_and_synthetic_causality
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        symbol: [USDCHF, NZDUSD, EURGBP, EURJPY, EURCHF, EURCAD, EURAUD, EURNZD, GBPCHF, GBPCAD, GBPAUD, GBPNZD, AUDCAD, AUDCHF, AUDNZD, CADJPY, CADCHF, CHFJPY, NZDJPY, NZDCAD, NZDCHF]
    env:
      SYMBOL: ${{ matrix.symbol }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: qore-native-final33-source-manifest-dba0e0c3b61e430d3ed51abab562ebd92060a0ff
          run-id: '38207337960'
          github-token: ${{ github.token }}
          path: signed33
      - uses: actions/download-artifact@v4
        with:
          name: qore-native-icmarkets-10Y-provider-M5-${{ matrix.symbol }}-e0ca5a13c866a19d8505c68cffc473598984b340
          run-id: '38193802541'
          github-token: ${{ github.token }}
          path: original-native
      - name: Original 11y SHA then read pre-embargo DAILY source only
        run: |
          set -euo pipefail
          python -m qore.research.alpha2_tsmom_daily_weekly "$SYMBOL" original-native signed33 tsmom-worker
          printf '%s\n' "$GITHUB_SHA" > tsmom-worker/exact-code-head-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: alpha2-tsmom-daily-${{ matrix.symbol }}-${{ github.sha }}
          path: tsmom-worker/
          retention-days: 90
          if-no-files-found: error
  all33_one_weekly_gross_screen:
    needs: [original12_daily_source, new21_daily_source]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: alpha2-tsmom-daily-*-${{ github.sha }}
          path: tsmom-exact33
      - name: 33 independent source SHA and single signed 4week CI gross test
        run: |
          set -euo pipefail
          python -m qore.research.alpha2_tsmom_daily_weekly_panel tsmom-exact33 tsmom-panel --head "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("tsmom-panel/alpha2-tsmom-33-weekly-gross-exploratory-panel.json").read_text())
          assert x["universe_markets"]==33 and len(x["per_market"])==33
          assert x["original12"]==12 and x["new21"]==21
          assert x["historical_2016_2024_panel_was_previously_exposed"]
          assert not x["broker_NET_PF_Sharpe_DD_computed"] and not x["UTC001_certified"]
          assert not x["capital_portfolio_broker_contract_comparable"] and x["orders"]==0
          assert x["status"] in (
              "INCONCLUSIVE_UNDERPOWERED",
              "TSMOM_EXPLORATORY_GROSS_SCREEN_FAIL",
              "TSMOM_EXPLORATORY_GROSS_SCREEN_FAIL_NONDISCRIMINATIVE_CONTROL",
              "TSMOM_EXPLORATORY_GROSS_SIGNAL_REQUIRES_TRUE_OOS",
          )
          PY
          printf '%s\n' "$GITHUB_SHA" > tsmom-panel/exact-code-head-sha.txt
          (cd tsmom-panel && sha256sum *.json exact-code-head-sha.txt > OUTPUT_SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: alpha2-TSMOM-D1-ONE-GROSS33-panel-${{ github.sha }}
          path: tsmom-panel/
          retention-days: 90
          if-no-files-found: error
