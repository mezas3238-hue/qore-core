name: VT08 Cognitive 5M Research Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vt08-5m-cognition-replay-20261010
    paths:
      - src/qore/infrastructure/traders/vt08_cognitive_5m_research_scope.py
      - src/qore/infrastructure/traders/vt08_cognitive_situation_model.py
      - src/qore/infrastructure/traders/vt08_cognitive_reasoning.py
      - src/qore/infrastructure/traders/vt08_cognitive_journey_intelligence.py
      - src/qore/infrastructure/trader_lab/vt08_cognitive_5m_consumed_gate_v1.py
      - tests/infrastructure/trader_lab/test_vt08_cognitive_5m_consumed_gate_v1.py
      - tests/infrastructure/traders/test_vt08_cognitive_v1_*.py
      - .github/workflows/vt08-cognitive-5m-research-bridge.yml

permissions:
  contents: read

jobs:
  cognitive-research:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Ruff cognitive research
        run: |
          ruff check src/qore/infrastructure/traders/vt08_cognitive_*.py src/qore/infrastructure/trader_lab/vt08_cognitive_5m_consumed_gate_v1.py tests/infrastructure/traders/test_vt08_cognitive_v1_*.py tests/infrastructure/trader_lab/test_vt08_cognitive_5m_consumed_gate_v1.py
      - name: Mypy cognitive research
        run: |
          mypy src/qore/infrastructure/traders/vt08_cognitive_*.py src/qore/infrastructure/trader_lab/vt08_cognitive_5m_consumed_gate_v1.py
      - name: Pytest cognitive research regression
        run: |
          pytest -q tests/infrastructure/traders/test_vt08_cognitive_v1_*.py tests/infrastructure/trader_lab/test_vt08_cognitive_5m_consumed_gate_v1.py
