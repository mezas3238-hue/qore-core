name: VT08 Cognitive 5M Research Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vt08-5m-cognition-replay-20261010
    paths:
      - src/qore/infrastructure/traders/vt08_cognitive_5m_research_scope.py
      - src/qore/infrastructure/traders/vt08_cognitive_situation_model.py
      - src/qore/infrastructure/traders/vt08_cognitive_reasoning.py
      - src/qore/infrastructure/traders/vt08_cognitive_journey_intelligence.py
      - src/qore/infrastructure/trader_lab/vt08_cognitive_5m_consumed_gate_v1.py
      - src/qore/infrastructure/trader_lab/vt08_5m_a_to_b_candidate_readiness_v1.py
      - tests/infrastructure/trader_lab/test_vt08_cognitive_5m_consumed_gate_v1.py
      - tests/infrastructure/trader_lab/test_vt08_5m_a_to_b_candidate_readiness_v1.py
      - tests/infrastructure/trader_lab/test_vt08_5m_a_to_b_live_contract_bridge.py
      - tests/infrastructure/traders/test_vt08_cognitive_v1_*.py
      - .github/workflows/vt08-cognitive-5m-research-bridge.yml

permissions:
  contents: read

jobs:
  cognitive-research:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Pin Architect A's exact reviewed methodology proposal; never follow its
      # moving branch head when certifying compatibility.
      - uses: actions/checkout@v4
        with:
          ref: 6e537cd8a8a01d9817802383c736baf5688f2a0f
          path: architect_a_frozen
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Ruff cognitive research
        run: |
          ruff check src/qore/infrastructure/traders/vt08_cognitive_*.py src/qore/infrastructure/trader_lab/vt08_cognitive_5m_consumed_gate_v1.py src/qore/infrastructure/trader_lab/vt08_5m_a_to_b_candidate_readiness_v1.py tests/infrastructure/traders/test_vt08_cognitive_v1_*.py tests/infrastructure/trader_lab/test_vt08_cognitive_5m_consumed_gate_v1.py tests/infrastructure/trader_lab/test_vt08_5m_a_to_b_*.py
      - name: Mypy cognitive research
        run: |
          mypy src/qore/infrastructure/traders/vt08_cognitive_*.py src/qore/infrastructure/trader_lab/vt08_cognitive_5m_consumed_gate_v1.py src/qore/infrastructure/trader_lab/vt08_5m_a_to_b_candidate_readiness_v1.py
      - name: Pytest cognitive research regression
        run: |
          pytest -q tests/infrastructure/traders/test_vt08_cognitive_v1_*.py tests/infrastructure/trader_lab/test_vt08_cognitive_5m_consumed_gate_v1.py tests/infrastructure/trader_lab/test_vt08_5m_a_to_b_*.py
      - name: Frozen Architect A source-contract integration (real module)
        env:
          VT08_ARCHITECT_A_FROZEN_MODULE: architect_a_frozen/src/qore/infrastructure/trader_lab/vt08_5m_candidate_event_v1.py
        run: |
          pytest -q tests/infrastructure/trader_lab/test_vt08_5m_a_to_b_live_contract_bridge.py
