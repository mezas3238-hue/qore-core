name: QORE VT31 Post-1R Full Cognition Management Frontier V2

on:
  push:
    branches:
      - agent/vt31-edge-position-cert-b-001
    paths:
      - scripts/vt31_nas100_post_1r_full_cognition_management_frontier_v2.py
      - scripts/vt31_nas100_full_cognition_attribution_v1.py
      - src/qore/infrastructure/traders/vt31_nas100_position_intelligence.py
      - src/qore/infrastructure/traders/vt31_nas100_post_entry_cognitive_runtime.py
      - src/qore/infrastructure/traders/vt31_nas100_reasoning_engine.py
      - src/qore/infrastructure/traders/vt31_nas100_situation_model.py
      - tests/infrastructure/test_vt31_nas100_position_intelligence.py
      - tests/infrastructure/test_vt31_nas100_post_entry_cognitive_runtime.py
      - .github/workflows/vt31-post-1r-full-cognition-management-frontier-v2.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Static and focused gates
        run: |
          set -euo pipefail
          python -m py_compile             scripts/vt31_nas100_post_1r_full_cognition_management_frontier_v2.py             src/qore/infrastructure/traders/vt31_nas100_position_intelligence.py             src/qore/infrastructure/traders/vt31_nas100_post_entry_cognitive_runtime.py             src/qore/infrastructure/traders/vt31_nas100_reasoning_engine.py
          ruff check             scripts/vt31_nas100_post_1r_full_cognition_management_frontier_v2.py             src/qore/infrastructure/traders/vt31_nas100_position_intelligence.py             src/qore/infrastructure/traders/vt31_nas100_post_entry_cognitive_runtime.py             src/qore/infrastructure/traders/vt31_nas100_reasoning_engine.py             tests/infrastructure/test_vt31_nas100_position_intelligence.py             tests/infrastructure/test_vt31_nas100_post_entry_cognitive_runtime.py
          pytest -q -o addopts=''             tests/infrastructure/test_vt31_nas100_position_intelligence.py             tests/infrastructure/test_vt31_nas100_post_entry_cognitive_runtime.py

      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"

      - name: Run full-cognition management frontier
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python             scripts/vt31_nas100_post_1r_full_cognition_management_frontier_v2.py             "input/${EVIDENCE_PATH}"             --output "result/full-cognition-post1r-${PARTITION}.json"             | tee "result/summary-${PARTITION}.json"

      - name: Governance gate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          p=os.environ["PARTITION"]
          x=json.loads(
              Path(f"result/full-cognition-post1r-{p}.json").read_text()
          )
          g=x["governance"]
          assert g["full_post_entry_reasoning_reassessed"] is True
          assert g["full_cognition_required_before_management_action"] is True
          assert g["contextual_management_readiness_required_before_action"] is True
          assert g["maximum_intelligence_required_for_candidate_freeze"] is True
          assert g["blocked_cognition_falls_back_to_structural_baseline"] is True
          assert g["same_sovereign_admission_population"] is True
          assert g["future_outcome_used_for_runtime_action"] is False
          assert g["r_used_for_volume"] is False
          assert g["position_sizing_used"] is False
          assert g["leverage_used"] is False
          assert g["compounding_used"] is False
          assert g["capital_weighting_used"] is False
          assert g["absolute_volume_used"] is False
          assert g["fresh_holdout_opened"] is False
          counts={v["trade_count"] for v in x["variants"].values()}
          assert len(counts) == 1
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-post1r-full-cognition-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-post1r-full-cognition-*-${{ github.sha }}
          path: input
          merge-multiple: true

      - name: Aggregate full-cognition frontier
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          folds=("r5","r6","r8","consumed")
          variants=(
              "H2_FULL_COGNITION",
              "H3_FULL_COGNITION",
              "H5_FULL_COGNITION",
          )
          payloads={
              f:json.loads(
                  Path(f"input/full-cognition-post1r-{f}.json").read_text()
              )
              for f in folds
          }
          def d(value):
              return Decimal(str(value))

          report={}
          for variant in variants:
              per_fold={}
              pf_non=mean_non=dd_non=0
              winner_ok=True
              temporal_ok=True
              management_ready_actions=management_blocked_actions=0
              max_ready_actions=max_blocked_actions=0
              for fold in folds:
                  b=payloads[fold]["variants"]["STRUCTURAL_ONLY"]
                  c=payloads[fold]["variants"][variant]
                  bm=b["stress_0_05r"]
                  cm=c["stress_0_05r"]
                  wp=c["winner_preservation_vs_structural"]

                  pf_ok=(
                      bm["profit_factor"] is not None
                      and cm["profit_factor"] is not None
                      and d(cm["profit_factor"]) >= d(bm["profit_factor"])
                  )
                  mean_ok=d(cm["mean_r"]) >= d(bm["mean_r"])
                  dd_ok=d(cm["max_drawdown_r"]) <= d(bm["max_drawdown_r"])
                  pf_non += int(pf_ok)
                  mean_non += int(mean_ok)
                  dd_non += int(dd_ok)
                  wc=d(wp["winner_count_preservation"])
                  wr=d(wp["winner_r_preservation"])
                  winner_ok &= wc >= d("0.80") and wr >= d("0.90")

                  blocks={}
                  for key in sorted(
                      set(b["halfyear_stress"]) & set(c["halfyear_stress"])
                  ):
                      bb=b["halfyear_stress"][key]
                      cc=c["halfyear_stress"][key]
                      mean_delta=d(cc["mean_r"])-d(bb["mean_r"])
                      total_delta=d(cc["total_r"])-d(bb["total_r"])
                      block_ok=mean_delta >= 0 and total_delta >= 0
                      temporal_ok &= block_ok
                      blocks[key]={
                          "mean_delta":format(mean_delta,"f"),
                          "total_delta":format(total_delta,"f"),
                          "nondegrade":block_ok,
                      }

                  management_ready_actions += c["management_ready_action_count"]
                  management_blocked_actions += c[
                      "management_blocked_action_count"
                  ]
                  max_ready_actions += c[
                      "maximum_intelligence_ready_action_count"
                  ]
                  max_blocked_actions += c[
                      "maximum_intelligence_blocked_action_count"
                  ]
                  per_fold[fold]={
                      "baseline":bm,
                      "candidate":cm,
                      "monte_carlo":c["monte_carlo"],
                      "winner_preservation":wp,
                      "persistence_state_counts":c["persistence_state_counts"],
                      "full_cognition_action_counts":c[
                          "full_cognition_action_counts"
                      ],
                      "management_ready_action_count":c[
                          "management_ready_action_count"
                      ],
                      "management_blocked_action_count":c[
                          "management_blocked_action_count"
                      ],
                      "maximum_intelligence_ready_action_count":c[
                          "maximum_intelligence_ready_action_count"
                      ],
                      "maximum_intelligence_blocked_action_count":c[
                          "maximum_intelligence_blocked_action_count"
                      ],
                      "pf_nondegrade":pf_ok,
                      "mean_nondegrade":mean_ok,
                      "dd_nondegrade":dd_ok,
                      "halfyears":blocks,
                  }

              report[variant]={
                  "folds":per_fold,
                  "pf_nondegrade_folds":pf_non,
                  "mean_nondegrade_folds":mean_non,
                  "dd_nondegrade_folds":dd_non,
                  "winner_preservation_all_folds":winner_ok,
                  "all_halfyears_nondegrade":temporal_ok,
                  "management_ready_action_count_total":management_ready_actions,
                  "management_blocked_action_count_total":management_blocked_actions,
                  "maximum_intelligence_ready_action_count_total":max_ready_actions,
                  "maximum_intelligence_blocked_action_count_total":max_blocked_actions,
                  "cross_fold_research_survivor":(
                      pf_non >= 3
                      and mean_non >= 3
                      and dd_non >= 3
                      and winner_ok
                      and temporal_ok
                      and management_ready_actions > 0
                  ),
              }

          out={
              "schema":"qore.vt31.nas100.post_1r_full_cognition_management_frontier.aggregate.v2",
              "head":"${{ github.sha }}",
              "variants":report,
              "governance":{
                  "full_post_entry_reasoning_reassessed":True,
                  "contextual_management_readiness_required_before_action":True,
                  "maximum_intelligence_required_for_candidate_freeze":True,
                  "sizing_for_certification_forbidden":True,
                  "fresh_holdout_opened":False,
                  "policy_promoted":False,
                  "candidate_frozen":False,
                  "candidate_certified":False,
              },
          }
          Path("result/aggregate.json").write_text(
              json.dumps(out,sort_keys=True,indent=2)+"\n"
          )
          print(json.dumps(out,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-post1r-full-cognition-aggregate-${{ github.sha }}
          path: result/
          retention-days: 90
