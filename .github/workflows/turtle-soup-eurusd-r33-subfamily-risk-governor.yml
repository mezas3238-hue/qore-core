name: QORE Turtle Soup EURUSD R33 Subfamily Risk Governor

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-eurusd-specialist-memory-v1-001
    paths:
      - '.github/workflows/turtle-soup-eurusd-r33-subfamily-risk-governor.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_eurusd_r33_subfamily_risk_governor.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_eurusd_r33_subfamily_risk_governor.py'

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-EURUSD-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-EURUSD-2f510461b3360e91d5ee70a72716a76cd6561f16'
  R28_RUN_ID: '35319457546'
  R28_ARTIFACT: 'qore-turtle-soup-eurusd-cognitive-v3-r28-e6879bbdd3844751af075269ddd93db6d3f9b9e1'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check --ignore E501,I001 \
            src/qore/infrastructure/trader_lab/turtle_soup_eurusd_r33_subfamily_risk_governor.py \
            tests/infrastructure/trader_lab/test_turtle_soup_eurusd_r33_subfamily_risk_governor.py
      - name: Mypy focused gate
        run: |
          mypy --disable-error-code attr-defined \
            src/qore/infrastructure/trader_lab/turtle_soup_eurusd_r33_subfamily_risk_governor.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_turtle_soup_eurusd_r33_subfamily_risk_governor.py

  replay:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable EURUSD raw master
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-eurusd
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download immutable Target Destination V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target-eurusd
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Download Cognitive V3
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.R28_ARTIFACT }}
          path: cognitive-v3
          github-token: ${{ github.token }}
          run-id: ${{ env.R28_RUN_ID }}
      - name: Run fixed R33 experiments
        run: |
          mkdir -p r33-output
          python -m qore.infrastructure.trader_lab.turtle_soup_eurusd_r33_subfamily_risk_governor \
            source-eurusd target-eurusd cognitive-v3 r33-output \
            > r33-output/stdout.json
          printf '%s\n' "$GITHUB_SHA" > r33-output/git-sha.txt
      - name: Enforce R33 governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('r33-output/r33-subfamily-risk-governor-report.json').read_text())
          assert p['identity']=='TURTLE_SOUP_EURUSD_R33_SUBFAMILY_RISK_GOVERNOR_LAB_V1'
          c=p['experiment_contract']
          assert c['fresh_holdout_consumed'] is False
          assert c['r30_core_preserved'] is True
          assert c['expansion_only_when_r30_abstains'] is True
          assert c['expansion_target_rank']==1
          assert c['actual_active_cibo_dol_price_used'] is True
          assert c['entry_changed'] is False
          assert c['c2_changed'] is False
          assert c['cisd_changed'] is False
          assert c['protected_swing_changed'] is False
          assert c['structural_rearm_changed'] is False
          assert c['risk_governor_suppresses_trades'] is False
          assert c['risk_governor_pretrade_state_only'] is True
          a=p['predeclared_acceptance']
          assert a['minimum_trades']==350
          assert a['minimum_scaled_net_010_profit_factor']=='1.90'
          assert a['maximum_scaled_net_010_drawdown_r']=='6.0'
          g=p['governance']
          assert g['candidate_replaced'] is False
          assert g['fresh_holdout_consumed'] is False
          assert g['live_authorized'] is False
          assert g['real_capital_authorized'] is False
          PY
      - name: Hash R33 evidence
        run: |
          cd r33-output
          sha256sum r33-subfamily-risk-governor-report.json stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-eurusd-r33-subfamily-risk-governor-${{ github.sha }}
          path: r33-output
          if-no-files-found: error
          retention-days: 90
