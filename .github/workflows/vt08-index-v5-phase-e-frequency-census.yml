name: VT08 Index V5 Phase E Frequency Census

on:
  push:
    branches: [agent/vt08-index-v5-phase-e-frequency-recovery-001]
    paths:
      - .github/workflows/vt08-index-v5-phase-e-frequency-census.yml
      - src/qore/infrastructure/trader_lab/vt08_index_v5_phase_e_frequency_census.py
      - docs/research/VT08-INDEX-V5-PHASE-E-FREQUENCY-RECOVERY-PREREGISTRATION-001.md

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - name: Full QORE gate
        run: pytest --cov=src/qore --cov-report=term-missing

  census:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"

      - name: Download consumed 2022-23 evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-vt08-index-v3-fresh-decision-106a34282fe8eac2f8c466bcc8502d4ec8d73855
          path: artifacts/v3
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34798973408

      - name: Download consumed 2023-24 evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-vt08-index-v2-fresh-r2-decision-58dd289646de8814449f836ad617a51342eba0da
          path: artifacts/v2
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34795405536

      - name: Download consumed development evidence
        uses: actions/download-artifact@v4
        with:
          pattern: qore-vt08-v2-source-executable-*-a5b9c6e0d65539c1f755dda8bb3d7ce7b1a839b0
          path: artifacts/dev
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34661791159

      - name: Execute frequency-loss census
        shell: bash
        run: |
          set -euo pipefail
          nas="$(find artifacts/dev -path '*NAS100*' -name market-evidence.json -print -quit)"
          sp="$(find artifacts/dev -path '*SP500*' -name market-evidence.json -print -quit)"
          us="$(find artifacts/dev -path '*US30*' -name market-evidence.json -print -quit)"
          test -n "$nas" && test -n "$sp" && test -n "$us"
          mkdir -p artifacts/report
          python -m qore.infrastructure.trader_lab.vt08_index_v5_phase_e_frequency_census \
            --v3-nas100 artifacts/v3/truncated/NAS100.json \
            --v3-sp500 artifacts/v3/truncated/SP500.json \
            --v3-us30 artifacts/v3/truncated/US30.json \
            --v2-nas100 artifacts/v2/truncated/NAS100.json \
            --v2-sp500 artifacts/v2/truncated/SP500.json \
            --v2-us30 artifacts/v2/truncated/US30.json \
            --development-nas100 "$nas" \
            --development-sp500 "$sp" \
            --development-us30 "$us" \
            --out artifacts/report/vt08-index-v5-phase-e-frequency-census.json
          printf '%s\n' "$GITHUB_SHA" > artifacts/report/git-sha.txt
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('artifacts/report/vt08-index-v5-phase-e-frequency-census.json').read_text())
          assert p['candidate_freeze_permitted'] is False
          assert p['holdout_open_permitted'] is False
          assert set(p['windows']) == {'2022_23','2023_24','2024_26'}
          print(json.dumps(p['windows'], sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-index-v5-phase-e-frequency-census-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
