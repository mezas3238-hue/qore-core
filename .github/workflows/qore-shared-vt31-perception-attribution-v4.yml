name: QORE Shared VT31 Perception Attribution V4

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - scripts/vt31_core_stack_v4_perception_attribution_v4.py
      - .github/workflows/qore-shared-vt31-perception-attribution-v4.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Static validation
        run: |
          ruff check scripts/vt31_core_stack_v4_perception_attribution_v4.py
          python -m py_compile scripts/vt31_core_stack_v4_perception_attribution_v4.py
      - name: Recover immutable R8 discovery evidence
        run: |
          set -euo pipefail
          mkdir -p input/pure input/cibo input/r8 result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10799064861/zip" > pure.zip
          unzip -q pure.zip -d input/pure
          (cd input/pure && sha256sum -c SHA256SUMS)
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10478487667/zip" > cibo.zip
          unzip -q cibo.zip -d input/cibo
          (cd input/cibo && sha256sum -c SHA256SUMS)
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10402199719/zip" > r8.zip
          unzip -q r8.zip -d input/r8
          echo "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb  input/r8/fresh/NAS100/market-evidence.json" | sha256sum -c -
      - name: Run perception attribution
        run: |
          python scripts/vt31_core_stack_v4_perception_attribution_v4.py             --r8-trades input/pure/r8.json             --r8-raw input/r8/fresh/NAS100/market-evidence.json             --daily-path input/cibo/DAILY_PATH_LEDGER.jsonl             --output result/perception-attribution-v4.json             | tee result/summary.json
      - name: Governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/perception-attribution-v4.json").read_text())
          assert p["partition"] == "R8_DISCOVERY_ONLY"
          assert p["sample"] == 228
          g=p["governance"]
          assert g["r6_consumed"] is False
          assert g["r5_consumed"] is False
          assert g["runtime_policy_created"] is False
          assert g["current_outcome_as_runtime_input"] is False
          assert g["future_m1_used"] is False
          assert g["capital_weighting_used"] is False
          PY
      - name: Bind result
        run: |
          echo "$GITHUB_SHA" > result/git-sha.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-vt31-perception-attribution-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
