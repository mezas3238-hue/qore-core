name: QORE Shared STI8 R5 Frozen Replication V1

concurrency:
  group: qore-shared-sti8-r5-replication-v1
  cancel-in-progress: false

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - scripts/shared_sti8_r5_replication_v1.py
      - .github/workflows/qore-shared-sti8-r5-replication-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  r5-replication:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Shared
        run: pip install -e ".[dev]"

      - name: Validate replication harness before R5 open
        run: |
          set -euo pipefail
          mkdir -p result input/policy input/pure input/r5
          ruff check scripts/shared_sti8_r5_replication_v1.py
          python -m py_compile scripts/shared_sti8_r5_replication_v1.py

          SOURCE_SHA="711788d89521e051ab3969a9006830068381693e"
          for path in             scripts/shared_sti6_sti8_real_position_intelligence.py             src/qore/infrastructure/core_stack_v2/shared_continuation_positive_tail_intelligence.py             src/qore/infrastructure/core_stack_v2/shared_position_threat_intelligence.py
          do
            test "$(git rev-parse "$SOURCE_SHA:$path")" = "$(git rev-parse "HEAD:$path")"
          done

      - name: Recover exact frozen R8 policy and R6 evidence artifact
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11065709899/zip" > policy.zip
          unzip -q policy.zip -d input/policy
          (cd input/policy && sha256sum -c SHA256SUMS)
          test -f input/policy/sti6-sti8-source-only-policies.json
          test -f input/policy/sti6-sti8-causal-position-replay.json
          test "$(cat input/policy/code-git-sha.txt)" = "711788d89521e051ab3969a9006830068381693e"

          python - <<'PY'
          import json
          from pathlib import Path

          f=json.loads(Path("input/policy/sti6-sti8-source-only-policies.json").read_text())
          r=json.loads(Path("input/policy/sti6-sti8-causal-position-replay.json").read_text())
          assert f["mode"] == "SOURCE_ONLY_POLICY_FREEZE"
          assert f["future_trade_outcomes_read_for_freeze"] is False
          assert f["pnl_used_for_freeze"] is False
          assert f["r5_opened"] is False
          assert f["protected_holdout_opened"] is False
          assert r["sti8"]["signal_value_status"] == "SIGNAL_VALUE_DEMONSTRATED_R6"
          assert r["sti8"]["gate_pass"] is True
          assert r["r5_opened"] is False
          assert r["protected_holdout_opened"] is False
          PY

      - name: Enforce one-shot STI-8 R5 replication open
        run: |
          set -euo pipefail
          marker_name="qore-shared-sti8-r5-replication-v1-open-marker"
          count="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${marker_name}" --jq '.artifacts | length')"
          test "$count" = "0"
          cat > result/r5-open-marker.json <<'JSON'
          {
            "identity": "QORE_SHARED_STI8_R5_REPLICATION_V1",
            "source_engine_sha": "711788d89521e051ab3969a9006830068381693e",
            "source_policy_artifact_id": 11065709899,
            "source_policy_artifact_digest": "sha256:10c9941d119878159dfe10ae57997ebe18d638c0fcde07cb5bed176e5a18a415",
            "replication_partition": "r5",
            "policy_retuning_authorized": false,
            "engine_retuning_authorized": false,
            "protected_certification_holdout_opened": false,
            "productive_authority": false
          }
          JSON

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-sti8-r5-replication-v1-open-marker
          path: result/r5-open-marker.json
          if-no-files-found: error
          retention-days: 90

      - name: Recover immutable R5 trade and market evidence once
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10799064861/zip" > pure.zip
          unzip -q pure.zip -d input/pure
          (cd input/pure && sha256sum -c SHA256SUMS)
          test -f input/pure/r5.json

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10380044761/zip" > r5.zip
          unzip -q r5.zip -d input/r5
          (cd input/r5 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)
          test -f input/r5/fresh/NAS100/market-evidence.json
          test -f input/r5/fresh/SP500/market-evidence.json
          test -f input/r5/fresh/US30/market-evidence.json

      - name: Execute exact frozen STI-8 V1 on R5
        run: |
          set -euo pipefail
          python scripts/shared_sti8_r5_replication_v1.py             --policy input/policy/sti6-sti8-source-only-policies.json             --r5-trades input/pure/r5.json             --r5-nas input/r5/fresh/NAS100/market-evidence.json             --r5-sp input/r5/fresh/SP500/market-evidence.json             --r5-us input/r5/fresh/US30/market-evidence.json             --output result/sti8-r5-replication-v1.json             | tee result/summary.json

      - name: Validate replication disposition without forcing PASS
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(Path("result/sti8-r5-replication-v1.json").read_text())
          assert p["replication_partition"] == "r5"
          assert p["frozen_source_sha"] == "711788d89521e051ab3969a9006830068381693e"
          assert p["frozen_policy_artifact_id"] == 11065709899
          assert p["engine_state"] == "EXACT_FROZEN_ENGINE_REPLAYED_ON_CONSUMED_R5"
          assert p["replication_status"] in {
              "STI8_V1_REPLICATION_PASS_R5",
              "STI8_V1_REPLICATION_FALSIFIED_R5",
          }
          assert p["r5_trade_count"] > 0
          assert p["r5_source_observation_count"] > 0
          assert p["engine_or_policy_retuned_after_r6"] is False
          assert p["r5_used_for_threshold_fit"] is False
          assert p["future_data_used_for_intelligence"] is False
          assert p["terminal_outcome_used_offline_for_evaluation"] is True
          assert p["protected_certification_holdout_opened"] is False
          assert p["economic_position_management_value_proven"] is False
          assert p["productive_authority"] is False
          PY

      - name: Bind replication evidence
        run: |
          set -euo pipefail
          printf '%s\n' "${GITHUB_SHA}" > result/code-git-sha.txt
          (
            cd result
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0               | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-sti8-r5-replication-v1-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Report STI-8 R5 replication
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p=json.loads(Path("result/sti8-r5-replication-v1.json").read_text())
          s=p["sti8"]
          body="\n".join([
              "## Shared STI-8 — Frozen R5 Replication V1",
              "",
              f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- source engine SHA: `{p['frozen_source_sha']}`",
              f"- replication status: **{p['replication_status']}**",
              f"- R5 trades / causal observations: **{p['r5_trade_count']} / {p['r5_source_observation_count']}**",
              f"- loss precision/recall: **{s['loss_precision_bps']}/{s['loss_recall_bps']} bps**",
              f"- false-threat/missed-loss: **{s['false_threat_on_nonlosses_bps']}/{s['missed_loss_bps']} bps**",
              f"- median true-threat lead: **{s['median_true_threat_lead_minutes']} min**",
              "- engine/policy retuned after R6: **False**",
              "- economic position-management value proven: **False**",
              "- protected certification holdout opened: **False**",
              "- productive authority: **False**",
          ])+"\n"
          Path("result/issue-comment.md").write_text(body)
          PY
          gh issue comment 638 --body-file result/issue-comment.md
