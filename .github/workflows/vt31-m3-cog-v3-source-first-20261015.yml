name: VT31 M3 COG V3 Source First CISD Stateful WAIT Ultra Fast Parity
on:
  push:
    branches:
      - agent/vt31-m3-cog-v3-first-cisd-20261015
    paths:
      - 'docs/research/VT31_M3_COG_V3_SOURCE_FIRST_CISD_PREREG_2026-10-15.md'
      - 'scripts/vt31_m3_source_first_cisd_cognition_v3_20261015.py'
      - 'tests/infrastructure/test_vt31_m3_source_first_cisd_cognition_v3_20261015.py'
      - '.github/workflows/vt31-m3-cog-v3-source-first-20261015.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  MARKET_SHA: '0563370fd021ad091392eb26f60cda0d3356d38c801fc1c2083cceafc5043cfa'
  NATIVE_SHA: '1556766c1831190b5459bf93404081412200ba7d'
  CENSUS_SHA: '35bd317ddfed60e09523287de51347683d98e613'
jobs:
  vt31-m3-cognitive-v3-real-m1-author-first-open:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 40
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin original COG OPS source-first prereg and immutable V2
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 3e9400c4e46abafc212cbdffe0ae9cc17c4633b7 HEAD
          test "$(git hash-object src/qore/infrastructure/traders/vt31_ict_cleanroom/cognition.py)" = d0ab4c15d6e9d24e53224d27bdb2cd96af914fb9
          test "$(git hash-object src/qore/infrastructure/traders/vt31_ict_cleanroom/operations.py)" = 0ce9707314aecb71155de8b57044b6ec028847b2
          test "$(git hash-object scripts/vt31_m3_ttrades_cog_wait_v2_20261015.py)" = 2ab6a7b0fdbe31de6bef17fb2d8eb8cc4055d751
          test "$(git hash-object scripts/vt31_m3_cisd_first_series_source_witness_20261015.py)" = 492c5bbc563a37d174b1d549ffdb7d869c777e2e
          git fetch --no-tags --depth=1 origin "$NATIVE_SHA"
          git show "$NATIVE_SHA:scripts/vt31_ttrades_am_native_cog_v1_20261014.py" > scripts/vt31_ttrades_am_native_cog_v1_20261014.py
          test "$(git hash-object scripts/vt31_ttrades_am_native_cog_v1_20261014.py)" = 407c5959c8cf2268ff210fbbe8bb07b91d2f4510
          git fetch --no-tags --depth=1 origin "$CENSUS_SHA"
          git show "$CENSUS_SHA:scripts/vt31_ttrades_am_method_m1_census_20261014.py" > scripts/vt31_ttrades_am_method_m1_census_20261014.py
          test "$(git hash-object scripts/vt31_ttrades_am_method_m1_census_20261014.py)" = 43a219e21237acfddc773a7c78ab6103d3839168
          git show "$CENSUS_SHA:tests/infrastructure/test_vt31_ttrades_am_method_m1_census_20261014.py" > tests/infrastructure/test_vt31_ttrades_am_method_m1_census_20261014.py
      - name: Adversarial stateful WAIT invalidation target and FIRST OPEN
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]' 'ijson>=3.3,<4'
          mkdir -p evidence
          ruff check scripts/vt31_m3_source_first_cisd_cognition_v3_20261015.py tests/infrastructure/test_vt31_m3_source_first_cisd_cognition_v3_20261015.py
          PYTHONPATH=src:. pytest -q -o addopts='' \
            tests/infrastructure/test_vt31_m3_source_first_cisd_cognition_v3_20261015.py \
            tests/infrastructure/test_vt31_m3_cisd_first_series_source_witness_20261015.py \
            tests/infrastructure/test_vt31_m3_ttrades_cog_wait_v2_20261015.py \
            tests/infrastructure/test_vt31_ttrades_am_method_m1_census_20261014.py \
            --junitxml=evidence/junit.xml | tee evidence/tests.txt
      - name: Retrieve canonical authentic NAS100 market M1 and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11459859004/zip" > source.zip
          unzip -q source.zip -d source
          echo "${MARKET_SHA}  source/NAS100/market-evidence.json" | sha256sum -c -
      - name: Compare actual 483 COG V3 source states to FIRST OPEN oracle and Ultra Fast
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src:. python scripts/vt31_m3_source_first_cisd_cognition_v3_20261015.py \
            --market source/NAS100/market-evidence.json --parity \
            --out evidence/VT31_M3_COG_V3_STATEFUL_CISD_REAL_M1.json \
            | tee evidence/summary.json
          python - <<'PY'
          import json
          p=json.load(open("evidence/VT31_M3_COG_V3_STATEFUL_CISD_REAL_M1.json"))
          assert p["prereg_commit"]=="3e9400c4e46abafc212cbdffe0ae9cc17c4633b7"
          assert p["source_original_M1_count"]==1059784
          assert p["frozen_contexts"]==483 and p["frozen_days"]==775
          assert p["cognitive_v3_per_case_matches_first_series_oracle_968"] is True
          assert p["scalar_ultrafast_full_casebook_SHA_match"] is True
          assert p["first_series_source_components"]=={
            "AUTHOR_FIRST_SERIES_CLOSE_COMPONENT":441,
            "LEGACY_LAST_ONLY_FALSE_PROMOTION":22,
            "NO_SOURCE_FIRST_SERIES_CLOSE_OBSERVED":20,
          }
          assert sum(p["end_of_session_cognitive_revocation_states"].values())==483
          assert all(not x["v3_cognitive_decision_emitted"] for x in p["all_483_original_source_cognitive_states"])
          assert p["M3_author_full_method_certified"] is False
          assert p["M3_cognition_runtime_certified"] is False
          assert p["M4_author_full_entry_certified"] is False
          assert p["M5_causative_swing_certified"] is False
          assert p["M6_two_independent_signatures"] is False
          assert p["trader_certified"] is False
          assert p["vt31_sizing"] is False
          assert p["orders_ack_fills"]==0 and p["live_authorized"] is False
          print("VT31_COG_V3_SOURCE_FIRST_CISD_ORACLE_ULTRAFAST_PARITY_PASS_NO_TRADES")
          PY
      - name: Store only nonraw research cognitive receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/code_sha.txt
          printf '%s\n' 'M3_COG_V3_SOURCE_FIRST_CISD_NO_ENTRY_PNL_SIZING_OR_LIVE' > evidence/scope.txt
          (cd evidence && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vt31-m3-cog-v3-source-first-ultrafast-${{ github.sha }}
          path: evidence/
          retention-days: 90
          if-no-files-found: warn
