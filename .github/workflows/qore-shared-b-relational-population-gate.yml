name: QORE Shared B Relational Population Gate

on:
  push:
    branches:
      - agent/shared-b-global-world-perception-001
    paths:
      - src/qore/infrastructure/core_stack_v2/shared_b_relational_population_gate.py
      - tests/infrastructure/test_shared_b_relational_population_gate.py
      - .github/workflows/qore-shared-b-relational-population-gate.yml
  workflow_dispatch:

concurrency:
  group: qore-shared-b-relational-population-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  B08_RUN_ID: "36782678259"
  B08_ARTIFACT_ID: "11128307917"
  B08_GIT_SHA: "f5b657a81f693b0e21a08d141fe0fb9d009ed920"
  REL_RUN_ID: "36755296952"
  REL_ARTIFACT_ID: "11116372968"
  REL_GIT_SHA: "2e082c6a68b4ba72137c4a8c75c767a59f4e2b29"
  DIV_RUN_ID: "36757804153"
  DIV_ARTIFACT_ID: "11116897631"
  DIV_GIT_SHA: "de618f3c8f9d00acb4253eaad5541e2e002b6cac"

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Shared
        run: pip install -e ".[dev]"
      - name: Validate relational population gate
        run: |
          set -euo pipefail
          ruff check \
            src/qore/infrastructure/core_stack_v2/shared_b_relational_population_gate.py \
            tests/infrastructure/test_shared_b_relational_population_gate.py
          mypy src/qore/infrastructure/core_stack_v2/shared_b_relational_population_gate.py
          pytest -q tests/infrastructure/test_shared_b_relational_population_gate.py
      - name: Verify exact sealed upstream lineages
        run: |
          set -euo pipefail
          for spec in \
            "${B08_RUN_ID}:${B08_GIT_SHA}" \
            "${REL_RUN_ID}:${REL_GIT_SHA}" \
            "${DIV_RUN_ID}:${DIV_GIT_SHA}"
          do
            run_id="${spec%%:*}"
            sha="${spec#*:}"
            test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')" = "completed"
            test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion')" = "success"
            test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.head_sha')" = "$sha"
          done
      - name: Recover sealed architecture and B-08 evidence
        run: |
          set -euo pipefail
          mkdir -p input/b08 input/rel input/div result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${B08_ARTIFACT_ID}/zip" > b08.zip
          unzip -q b08.zip -d input/b08
          (cd input/b08 && sha256sum -c SHA256SUMS)
          test -f input/b08/shared-b-temporal-governance-readiness.json

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${REL_ARTIFACT_ID}/zip" > rel.zip
          unzip -q rel.zip -d input/rel
          (cd input/rel && sha256sum -c SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${DIV_ARTIFACT_ID}/zip" > div.zip
          unzip -q div.zip -d input/div
          (cd input/div && sha256sum -c SHA256SUMS)
      - name: Build fail-closed relational population gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from qore.infrastructure.core_stack_v2.shared_b_relational_population_gate import (
              build_relational_population_gate,
          )
          b08=json.loads(
              Path("input/b08/shared-b-temporal-governance-readiness.json").read_text()
          )
          out=build_relational_population_gate(
              temporal_readiness=b08,
              b10_b12_architecture_verified=True,
              b13_architecture_verified=True,
          )
          Path("result/shared-b-relational-population-gate.json").write_text(
              json.dumps(out,sort_keys=True,indent=2)+"\n"
          )
          PY
      - name: Enforce empirical population remains closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/shared-b-relational-population-gate.json").read_text())
          assert p["status"] == "RELATIONAL_EMPIRICAL_POPULATION_CLOSED_BY_B08"
          assert p["global_graph_population_authorized"] is False
          assert p["relationship_lifecycle_population_authorized"] is False
          assert p["lead_lag_population_authorized"] is False
          assert p["structural_divergence_population_authorized"] is False
          assert p["causal_relation_claim_authorized"] is False
          assert p["stale_relation_empirical_isolation_authorized"] is False
          assert p["not_comparable_is_valid_terminal_state"] is True
          assert p["automatic_threshold_invention"] is False
          assert p["target_or_outcome_read"] is False
          assert p["r6_r5_read"] is False
          assert p["fresh_holdout_opened"] is False
          assert p["broker_mutation"] is False
          assert p["productive_authority"] is False
          assert not any(p[f"b{x}_complete"] for x in (10,11,12,13))
          assert len(p["gate_fingerprint_sha256"]) == 64
          PY
      - name: Seal B-10..B-13 population gate
        run: |
          printf '%s\n' "$GITHUB_SHA" > result/code-git-sha.txt
          printf '%s\n' "$GITHUB_RUN_ID" > result/run-id.txt
          (
            cd result
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
              | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - name: Upload relational population gate
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: qore-shared-b-relational-population-gate-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
      - name: Report B-10..B-13 population gate
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          gh issue comment 638 --repo "$GITHUB_REPOSITORY" --body "Architect B B-10..B-13 relational population gate: run ${GITHUB_RUN_ID}, SHA ${GITHUB_SHA}, artifact ${ARTIFACT_ID}. B-10/B-11/B-12/B-13 architectures are bound to the sealed B-08 readiness state. Because B-08 is NOT_READY, empirical graph population, relationship lifecycle population, lead/lag population, structural-divergence population, causal claims and STALE_RELATION isolation are all CLOSED. NOT_COMPARABLE remains a valid terminal state; no thresholds or relations were invented."
