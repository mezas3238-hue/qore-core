name: QORE Capitalizer Cognitive Destination Departure Information Atlas 2R V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-cognitive-destination-departure-information-atlas-2r-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_cognitive_destination_departure_information_atlas_2r_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_cognitive_destination_departure_information_atlas_2r_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-cognitive-destination-departure-information-atlas-2r-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  REBASE_RUN_ID: '36078677895'
  REBASE_SHA: 'cfc04849c8bbfd6565310d89456f5e367ea880f7'
  DESTINATION_RUN_ID: '36085887285'
  DESTINATION_SHA: 'c0529ca61dfd57cc7f3168bcee68751ef5651335'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check             src/qore/infrastructure/trader_lab/capitalizer_cognitive_destination_departure_information_atlas_2r_v1.py             tests/infrastructure/trader_lab/test_capitalizer_cognitive_destination_departure_information_atlas_2r_v1.py
      - name: Mypy
        run: |
          mypy             src/qore/infrastructure/trader_lab/capitalizer_cognitive_destination_departure_information_atlas_2r_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov             tests/infrastructure/trader_lab/test_capitalizer_cognitive_destination_departure_information_atlas_2r_v1.py

  atlas:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download true-2R cognitive rebase
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cognitive-economic-rebase-2r-v1-${{ env.REBASE_SHA }}
          path: rebase-input
          github-token: ${{ github.token }}
          run-id: ${{ env.REBASE_RUN_ID }}
      - name: Download strict departure-time Destination binding
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cognitive-destination-departure-binding-audit-2r-v1-${{ env.DESTINATION_SHA }}
          path: destination-input
          github-token: ${{ github.token }}
          run-id: ${{ env.DESTINATION_RUN_ID }}
      - name: Build Destination departure information atlas
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cognitive_destination_departure_information_atlas_2r_v1             rebase-input destination-input destination-info-output
      - name: Enforce Destination information controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "destination-info-output/"
                  "capitalizer-cognitive-destination-departure-information-atlas-2r-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_COGNITIVE_DESTINATION_DEPARTURE_INFORMATION_ATLAS_2R_V1"
          )
          assert report["source_rebase_run_id"] == 36078677895
          assert report["source_destination_run_id"] == 36085887285
          assert report["target_r"] == "2.00"
          assert report["control_trades"] == 948
          assert report["destination_bound_trades"] == 82
          assert report["destination_unbound_trades"] == 866
          assert report["feature_count"] == 5
          assert report["minimum_descriptive_support"] == 5
          assert report["unbound_is_not_destination_absent"] is True
          assert report["nearest_distance_not_used_for_cell_selection"] is True
          assert report["numeric_destination_thresholds_added"] is False
          assert report["target_result_fields_read"] is False
          assert report["target_touch_fields_used"] is False
          assert report["destination_current_at_entry_supported"] is False
          assert report["destination_available_at_entry_supported"] is False
          assert report["destination_intelligence_supported"] is False
          assert report["current_outcome_used_to_define_cells"] is False
          assert report["current_outcome_used_for_post_cell_metrics"] is True
          assert report["automatic_cell_selection"] is False
          assert report["runtime_rule_selected"] is False
          assert report["rebase_control_reproduced"] is True
          assert report["destination_binding_control_reproduced"] is True
          assert report["strategy_rules_changed"] is False
          assert report["cognitive_rules_changed"] is False
          assert report["entry_changed"] is False
          assert report["stop_changed"] is False
          assert report["target_changed"] is False
          assert report["max3_changed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-cognitive-destination-departure-information-atlas-2r-v1-${{ github.sha }}
          path: destination-info-output
          if-no-files-found: error
          retention-days: 90
