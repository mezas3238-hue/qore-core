name: QORE Shared Integrator Reconciliation

on:
  push:
    branches:
      - agent/shared-integration-001
      - agent/qore-core-stack-v2-shared-001
    paths:
      - "src/qore/infrastructure/core_stack_v2/shared_integrator_reconciliation.py"
      - "src/qore/infrastructure/core_stack_v2/shared_zero_open_work.py"
      - "tests/infrastructure/test_shared_integrator_reconciliation.py"
      - "scripts/shared_integrator_reconciliation_v1.py"
      - ".github/workflows/qore-shared-integrator-reconciliation.yml"
  pull_request:
    paths:
      - "src/qore/infrastructure/core_stack_v2/shared_integrator_reconciliation.py"
      - "src/qore/infrastructure/core_stack_v2/shared_zero_open_work.py"
      - "tests/infrastructure/test_shared_integrator_reconciliation.py"
      - "scripts/shared_integrator_reconciliation_v1.py"

concurrency:
  group: qore-shared-integrator-reconciliation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest pytest-cov
      - run: pytest -q tests/infrastructure/test_shared_integrator_reconciliation.py
      - run: python scripts/shared_integrator_reconciliation_v1.py
