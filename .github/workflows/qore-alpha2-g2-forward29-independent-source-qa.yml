name: QORE Alpha2 G2 29 DEMO original prospective source independent SHA QA
on:
  push:
    branches: ['research/qore-alpha2-original-intermarket-propagation-20261012']
    paths:
      - '.github/workflows/qore-alpha2-g2-forward29-independent-source-qa.yml'
      - 'src/qore/research/alpha2_g2_29_forward_original_independent_qa.py'
      - 'tests/research/test_alpha2_g2_29_forward_original_independent_qa.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source29_original_prospective_independent_qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . 'ruff>=0.5,<1' 'pytest>=8,<9'
      - name: PRE-registered new source QA before original 29 market quote outcomes read
        run: |
          git merge-base --is-ancestor 09c01e6d4c3b05844b7d1638d760efb4bab9fcf4 "$GITHUB_SHA"
          test -s docs/research/QORE_ALPHA2_G2_29_FORWARD_SOURCE_INDEPENDENT_SHA_QA_PREREG_2026-10-12.md
          ruff check src/qore/research/alpha2_g2_29_forward_original_independent_qa.py tests/research/test_alpha2_g2_29_forward_original_independent_qa.py
          pytest -q -o addopts='' tests/research/test_alpha2_g2_29_forward_original_independent_qa.py
      - name: Download only original exact 29 market DEMO firstseen artifact no secrets, no orders
        uses: actions/download-artifact@v4
        with:
          name: alpha2-g2-forward-exact29-demo-firstseen-NOT-NET-33068c720fedb3d358a2f73e7323508abd8365f6
          run-id: '38298399112'
          github-token: ${{ github.token }}
          path: original-demo29
      - name: Reverify every original SHA, 29 chronology, every symbol BIDASK and class independently
        run: |
          python -m qore.research.alpha2_g2_29_forward_original_independent_qa original-demo29 independent29
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("independent29/alpha2-g2-29-independent-forward-demospot-QA.json").read_text())
          assert d["market_count"]==29 and d["markets_with_two_sides"]==29
          assert d["status"]=="G2_29_DEMO_FIRSTRECEIPT_ORIGINAL_SHA_AND_SIDE_QA_PASS_NOT_NET"
          assert d["event_count"]==1033
          assert d["raw_prices_republished"] is False
          assert not d["UTC001_certified"] and not d["broker_actual_NET_certified"]
          assert d["orders"]==0
          PY
          printf '%s\n' "$GITHUB_SHA" > independent29/exact-code-head-sha.txt
          (cd independent29 && sha256sum *.json exact-code-head-sha.txt > OUTPUT_SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: alpha2-g2-29-independent-forward-source-QA-${{ github.sha }}
          path: independent29/
          retention-days: 90
          if-no-files-found: error
