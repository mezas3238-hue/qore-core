name: QORE Turtle Soup GBPUSD R32 Causal Memory Defragmentation

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-gbpusd-specialist-memory-v1-001
    paths:
      - '.github/workflows/turtle-soup-gbpusd-r32-causal-memory-defragmentation.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_gbpusd_r32_causal_memory_defragmentation.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_gbpusd_r32_causal_memory_defragmentation.py'

permissions:
  contents: write
  actions: read

env:
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-GBPUSD-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-GBPUSD-2f510461b3360e91d5ee70a72716a76cd6561f16'
  V2_RUN_ID: '35339237432'
  V2_ARTIFACT: 'qore-turtle-soup-gbpusd-structural-specialist-v2-r27-b7005f4dab80376f3bdd5ce199e37f425ab99633'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check --ignore E501,I001 \
            src/qore/infrastructure/trader_lab/turtle_soup_gbpusd_r32_causal_memory_defragmentation.py \
            tests/infrastructure/trader_lab/test_turtle_soup_gbpusd_r32_causal_memory_defragmentation.py
      - name: Mypy focused gate
        run: |
          mypy --disable-error-code attr-defined \
            src/qore/infrastructure/trader_lab/turtle_soup_gbpusd_r32_causal_memory_defragmentation.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_turtle_soup_gbpusd_r32_causal_memory_defragmentation.py

  replay_job:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable GBPUSD raw master
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-gbpusd
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download immutable Target Destination V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target-gbpusd
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Download immutable Cognitive V2 observations
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V2_ARTIFACT }}
          path: cognitive-v2
          github-token: ${{ github.token }}
          run-id: ${{ env.V2_RUN_ID }}
      - name: Run fixed R32 memory de-fragmentation experiments
        run: |
          mkdir -p r32-output
          python -m qore.infrastructure.trader_lab.turtle_soup_gbpusd_r32_causal_memory_defragmentation \
            source-gbpusd target-gbpusd cognitive-v2 r32-output \
            > r32-output/stdout.json
          printf '%s\n' "$GITHUB_SHA" > r32-output/git-sha.txt
      - name: Enforce R32 governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('r32-output/r32-causal-memory-defragmentation-report.json').read_text())
          assert p['identity']=='TURTLE_SOUP_GBPUSD_R32_CAUSAL_MEMORY_DEFRAGMENTATION_LAB_V1'
          c=p['experiment_contract']
          assert c['fresh_holdout_consumed'] is False
          assert c['actual_dol_price_always_used'] is True
          assert c['route_family_only_pools_memory'] is True
          assert c['entry_changed'] is False
          assert c['c2_changed'] is False
          assert c['cisd_changed'] is False
          assert c['protected_swing_changed'] is False
          assert c['structural_rearm_changed'] is False
          assert c['regime_features_pre_entry_only'] is True
          assert c['nearest_validated_dol_policy'] is True
          a=p['predeclared_acceptance']
          assert a['minimum_trades']==350
          assert a['minimum_net_010_profit_factor']=='1.90'
          assert a['maximum_net_010_drawdown_r']=='6.0'
          assert a['maximum_net_010_losing_streak']==3
          g=p['governance']
          assert g['candidate_replaced'] is False
          assert g['fresh_holdout_consumed'] is False
          assert g['live_authorized'] is False
          assert g['real_capital_authorized'] is False
          PY
      - name: Hash R32 evidence
        run: |
          cd r32-output
          sha256sum r32-causal-memory-defragmentation-report.json stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-gbpusd-r32-causal-memory-defragmentation-${{ github.sha }}
          path: r32-output
          if-no-files-found: error
          retention-days: 90

  publish_status:
    if: always()
    needs: [quality, replay_job]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/turtle-soup-gbpusd-specialist-memory-v1-001
      - name: Download successful research artifact
        if: needs.replay_job.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: qore-turtle-soup-gbpusd-r32-causal-memory-defragmentation-${{ github.sha }}
          path: published-result
      - name: Write auditable status
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          RESEARCH_RESULT: ${{ needs.replay_job.result }}
          RUN_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p docs/research/results
          python - <<'PY'
          import json, os
          from pathlib import Path
          out={
            'identity':'TURTLE_SOUP_GBPUSD_R32_DEFRAGMENTATION_STATUS',
            'workflow_run_id':int(os.environ['RUN_ID']),
            'workflow_sha':os.environ['RUN_SHA'],
            'quality_result':os.environ['QUALITY_RESULT'],
            'research_result':os.environ['RESEARCH_RESULT'],
          }
          matches=list(Path('published-result').rglob('r32-causal-memory-defragmentation-report.json'))
          if len(matches)==1:
            out['r32_report']=json.loads(matches[0].read_text())
          sums=list(Path('published-result').rglob('SHA256SUMS.txt'))
          if len(sums)==1:
            out['sha256sums']=sums[0].read_text().splitlines()
          Path('docs/research/results/TURTLE-SOUP-GBPUSD-R32-DEFRAGMENTATION-LATEST.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - name: Commit status
        run: |
          git config user.name 'qore-research-bot'
          git config user.email 'qore-research-bot@users.noreply.github.com'
          git add docs/research/results/TURTLE-SOUP-GBPUSD-R32-DEFRAGMENTATION-LATEST.json
          git commit -m "research(gbpusd): record TURTLE_SOUP_GBPUSD_R32_DEFRAGMENTATION_STATUS" || exit 0
          git push origin HEAD:agent/turtle-soup-gbpusd-specialist-memory-v1-001
