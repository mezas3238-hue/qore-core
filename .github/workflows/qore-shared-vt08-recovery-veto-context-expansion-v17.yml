name: QORE Shared VT08 Recovery Veto Context Expansion V17

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - scripts/vt08_index_shared_recovery_veto_context_expansion_v17.py
      - .github/workflows/qore-shared-vt08-recovery-veto-context-expansion-v17.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recovery-veto-context-expansion-v17:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout Shared
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: |
          pip install -e ".[dev]"
          pip install "numpy>=2,<3" "scikit-learn>=1.5,<2"
      - name: Static validation
        run: |
          ruff check scripts/vt08_index_shared_recovery_veto_context_expansion_v17.py
          python -m py_compile scripts/vt08_index_shared_recovery_veto_context_expansion_v17.py
      - name: Download frozen V6 consumed ledger
        uses: actions/download-artifact@v4
        with:
          name: qore-shared-vt08-stop-target-discrimination-v6-1a534d0ae735efef4dcbc0c0be4b110ceaa80501
          path: artifacts/v6
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36131607443
      - name: Run V17 recovery-veto expansion
        run: |
          set -euo pipefail
          mkdir -p artifacts/v17
          python scripts/vt08_index_shared_recovery_veto_context_expansion_v17.py \
            --v6-json artifacts/v6/vt08-index-shared-stop-target-discrimination-v6.json \
            --out artifacts/v17/vt08-index-shared-recovery-veto-context-expansion-v17.json \
            | tee artifacts/v17/summary.json
      - name: Validate V17 governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(
              Path(
                  "artifacts/v17/"
                  "vt08-index-shared-recovery-veto-context-expansion-v17.json"
              ).read_text()
          )
          assert p["identity"] == "QORE_SHARED_VT08_RECOVERY_VETO_CONTEXT_EXPANSION_V17"
          assert p["source_v6_run"] == 36131607443
          assert p["source_v15_run"] == 36141968333
          assert p["source_v16_run"] == 36142389500
          assert p["research_only"] is True
          assert p["consumed_evidence_only"] is True
          assert p["base_cell_frozen"] == "path_state=CONTESTED&environment_state=FRAGILE|P>=0.900"
          assert p["expansion_cell_frozen"] == "trajectory_state=DIVERGING&geometry_state=TERMINAL_COLLAPSE|P>=0.900"
          assert p["adverse_context_threshold_retuned"] is False
          assert p["veto_family_preregistered"] is True
          assert p["veto_selection_train_window_only"] is True
          assert p["runtime_outcome_input"] is False
          assert p["future_market_input"] is False
          assert p["market_identity_in_inference_rule"] is False
          assert p["calendar_or_fold_identity_in_inference_rule"] is False
          assert p["sizing_used"] is False
          assert p["risk_weighting_used"] is False
          assert p["runtime_actuation"] is False

          expected = {
              "five_year": 2448,
              "recent_two_year": 1017,
              "r66_consumed_failed_holdout": 773,
          }
          for key, sample in expected.items():
              w=p["windows"][key]
              assert w["sample"] == sample
              assert w["status"] in {
                  "ADMIT_FOR_VALIDATION",
                  "ADMIT_FOR_ECONOMIC_SHADOW",
                  "REJECT",
              }
              assert "v15_control" in w
              assert "v17_combined" in w
              assert "beats_v15_loss_recall" in w

          print(json.dumps({
              "validation_pass":p["validation_pass"],
              "selected_veto":p["selected_veto"],
              "windows":p["windows"],
          },sort_keys=True))
          PY
      - name: Bind result
        run: |
          cd artifacts/v17
          echo "$GITHUB_SHA" > shared-git-sha.txt
          echo "36131607443" > source-v6-run.txt
          echo "36141968333" > source-v15-run.txt
          echo "36142389500" > source-v16-run.txt
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-vt08-recovery-veto-context-expansion-v17-${{ github.sha }}
          path: artifacts/v17/
          if-no-files-found: error
          retention-days: 90
