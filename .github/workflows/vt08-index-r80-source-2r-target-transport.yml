name: VT08 Index R80 Source 2R Target Transport

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r80-source-2r-target-transport.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r80_source_2r_target_transport.py
      - tests/infrastructure/trader_lab/test_vt08_index_r80_source_2r_target_transport.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r80_source_2r_target_transport.py

  research:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R80 source 2R transport
        run: |
          python -m qore.infrastructure.trader_lab.vt08_index_r80_source_2r_target_transport \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r80-source-2r-target-transport.json

      - name: Verify R80 source-only target correction
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r80-source-2r-target-transport.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R80_SOURCE_AUTHORIZED_2R_TARGET_TRANSPORT_001"
          )
          assert report["source_r79"]["run_id"] == 35516202970
          assert report["source_r79"]["artifact_id"] == 10606254504

          target = report["target_contract"]
          assert target["canonical_research_target_r"] == "2.5"
          assert target["source_authorized_target_r"] == "2"
          assert target["target_grid_searched"] is False
          assert target["v6_target_bound"] is True

          assert report["five_year"]["canonical_2_5r"]["sample"] == 2448
          assert report["recent_two_year"]["canonical_2_5r"]["sample"] == 1017
          assert report["r66_failed_holdout"]["canonical_2_5r"]["sample"] == 773
          assert report["five_year"]["source_2r"]["sample"] == 2448
          assert report["recent_two_year"]["source_2r"]["sample"] == 1017
          assert report["r66_failed_holdout"]["source_2r"]["sample"] == 773

          assert report["decision"] == (
              "R80_SOURCE_2R_TARGET_TRANSPORT_COMPLETE_NO_CANDIDATE"
          )
          governance = report["governance"]
          assert governance["research_only"] is True
          assert governance["fresh_holdout_claim"] is False
          assert governance["single_source_authorized_target"] is True
          assert governance["future_information_used"] is False
          assert governance["signal_surface_changed"] is False
          assert governance["signals_suppressed"] is False
          assert governance["daily_bias_changed"] is False
          assert governance["anchors_changed"] is False
          assert governance["poi_changed"] is False
          assert governance["cisd_changed"] is False
          assert governance["protected_swing_changed"] is False
          assert governance["entry_changed"] is False
          assert governance["stop_changed"] is False
          assert governance["allocator_architecture_changed"] is False
          assert governance["target_changed_for_research"] is True
          assert governance["candidate_created"] is False
          assert governance["trader_certified"] is False
          assert governance["live_authorized"] is False
          assert governance["real_capital_authorized"] is False
          assert governance["production_authorized"] is False
          PY

      - name: Upload R80 evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r80-source-2r-target-transport-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: warn
          retention-days: 90
