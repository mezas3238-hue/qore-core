name: QORE CIBO Phase 18 VT08 R315 Chronological Replay

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-phase18-vt08-r315-replay.yml'
      - 'scripts/cibo_phase18_vt08_r315_policy_replay.py'
      - 'scripts/cibo_phase18_vt08_score.py'
      - 'src/qore/infrastructure/cibo_ce2i_chronological_replay.py'
      - 'tests/infrastructure/test_cibo_ce2i_chronological_replay.py'
      - 'tests/infrastructure/trader_lab/test_cibo_phase18_vt08_r315_policy_replay.py'
  push:
    branches:
      - agent/cibo-capital-efficiency-sizing-lab-001
    paths:
      - '.github/workflows/cibo-phase18-vt08-r315-replay.yml'
      - 'scripts/cibo_phase18_vt08_r315_policy_replay.py'
      - 'scripts/cibo_phase18_vt08_score.py'
      - 'src/qore/infrastructure/cibo_ce2i_chronological_replay.py'
      - 'tests/infrastructure/test_cibo_ce2i_chronological_replay.py'
      - 'tests/infrastructure/trader_lab/test_cibo_phase18_vt08_r315_policy_replay.py'

permissions:
  contents: read
  actions: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  HOLDOUT_RUN_ID: '34759027136'
  HOLDOUT_ARTIFACT_ID: '10318827002'
  HOLDOUT_ARTIFACT: 'qore-vt08-r3-15-independent-holdout-64bc2ab4809c39e4a2b2c72aa8c0e8ec1c709222'
  HOLDOUT_SHA: '64bc2ab4809c39e4a2b2c72aa8c0e8ec1c709222'
  HOLDOUT_DIGEST: '73aad16176f2f5335b47fff6510f8f3ce586e2d0a291dd6056c4d3c9e57f9ae4'
  RISK_RUN_ID: '34733491533'
  RISK_ARTIFACT_ID: '10309794877'
  RISK_ARTIFACT: 'qore-vt08-r3-12-adaptive-prop-risk-6a09be314a5c8b6a17822ea141a41d521aaf8655'
  RISK_SHA: '6a09be314a5c8b6a17822ea141a41d521aaf8655'
  RISK_DIGEST: '6b1ccbeac047b1d06d0b9eee7c24443d2ab03d7a9f33389dbc7ab34adba51d77'
  GH_TOKEN: ${{ github.token }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Focused quality
        run: |
          ruff check \
            scripts/cibo_phase18_vt08_r315_policy_replay.py \
            scripts/cibo_phase18_vt08_score.py \
            src/qore/infrastructure/cibo_ce2i_chronological_replay.py \
            tests/infrastructure/test_cibo_ce2i_chronological_replay.py \
            tests/infrastructure/trader_lab/test_cibo_phase18_vt08_r315_policy_replay.py
          mypy \
            scripts/cibo_phase18_vt08_r315_policy_replay.py \
            scripts/cibo_phase18_vt08_score.py \
            src/qore/infrastructure/cibo_ce2i_chronological_replay.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_ce2i_chronological_replay.py \
            tests/infrastructure/trader_lab/test_cibo_phase18_vt08_r315_policy_replay.py

  replay-vt08:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout CIBO evidence head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install -e .

      - name: Authenticate immutable VT08 R315 and R312 evidence
        run: |
          set -euo pipefail
          mkdir -p evidence/holdout evidence/risk phase18-output

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${HOLDOUT_ARTIFACT_ID}/zip" \
            > holdout.zip
          echo "${HOLDOUT_DIGEST}  holdout.zip" | sha256sum -c -
          unzip -q holdout.zip -d evidence/holdout
          test "$(tr -d '\r\n' < evidence/holdout/git-sha.txt)" = "${HOLDOUT_SHA}"

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RISK_ARTIFACT_ID}/zip" \
            > risk.zip
          echo "${RISK_DIGEST}  risk.zip" | sha256sum -c -
          unzip -q risk.zip -d evidence/risk
          test "$(tr -d '\r\n' < evidence/risk/git-sha.txt)" = "${RISK_SHA}"
          test "$(tr -d '\r\n' < evidence/risk/risk-policy-fingerprint.txt)" = \
            "dfb3fc8217b9895356ed19f8d7e1ee47fae765d39a9bb2e72e14c4ac41fad1f5"

      - name: Reconstruct frozen legacy capital policy causally
        run: |
          python scripts/cibo_phase18_vt08_r315_policy_replay.py \
            --holdout evidence/holdout/holdout-summary.json \
            --risk-policy evidence/risk/adaptive-prop-firm-risk-policy.json \
            --output phase18-output \
            > phase18-output/policy-replay-stdout.json

      - name: Score VT08 with generic CIBO Phase 18 replay
        run: |
          python scripts/cibo_phase18_vt08_score.py \
            --bound phase18-output/phase18-vt08-r315-fundednext-trades.jsonl \
            --policy-report phase18-output/phase18-vt08-r315-policy-report.json \
            --output phase18-output/phase18-vt08-r315-generic-score.json \
            > phase18-output/generic-score-stdout.json

      - name: Enforce Phase 18 governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(
              Path('phase18-output/phase18-vt08-r315-policy-report.json').read_text()
          )
          score=json.loads(
              Path('phase18-output/phase18-vt08-r315-generic-score.json').read_text()
          )
          assert report['rows'] == 124
          assert report['portfolio'] == 'B_COMBINED'
          assert report['canonical_profile'] == 'FUNDEDNEXT_STELLAR_2STEP_2026_09_12'
          assert report['technical_geometry']['holdout_reopened'] is False
          assert report['legacy_capital_policy']['broker_quantity_applied'] is False
          assert report['legacy_capital_policy']['execution_cost_applied'] is False
          assert report['provider_economics']['status'] == 'CALIBRATION_REQUIRED'
          assert report['provider_economics']['usd_cibo_sizing_comparison_authorized'] is False
          assert report['governance']['research_only'] is True
          assert report['governance']['live_authorized'] is False
          assert report['governance']['real_capital_authorized'] is False
          assert score['trader_id'] == 'VT08_FOREX'
          assert score['unit'] == 'R25'
          assert score['trades'] == 124
          assert score['pre_broker_capital_policy_only'] is True
          assert score['usd_cibo_sizing_comparison_authorized'] is False
          PY

      - name: Hash Phase 18 evidence
        run: |
          printf '%s\n' "$EVIDENCE_SHA" > phase18-output/git-sha.txt
          printf '%s\n' "$HOLDOUT_SHA" > phase18-output/vt08-holdout-source-sha.txt
          printf '%s\n' "$RISK_SHA" > phase18-output/vt08-risk-source-sha.txt
          cd phase18-output
          sha256sum \
            phase18-vt08-r315-fundednext-trades.jsonl \
            phase18-vt08-r315-policy-report.json \
            phase18-vt08-r315-generic-score.json \
            policy-replay-stdout.json \
            generic-score-stdout.json \
            git-sha.txt \
            vt08-holdout-source-sha.txt \
            vt08-risk-source-sha.txt > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-phase18-vt08-r315-${{ env.EVIDENCE_SHA }}
          path: phase18-output
          if-no-files-found: error
          retention-days: 90
