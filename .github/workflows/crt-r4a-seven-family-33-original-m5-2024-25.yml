    steps:
      - uses: actions/checkout@v4
      - name: Checkout historical decoder at original research source commit
        uses: actions/checkout@v4
        with:
          ref: fe9de467102e86dbd355c09c5099830af28a694c
          path: legacy-crt-lab
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recover exact original broker source OHLC in private runner
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          repository: ${{ github.repository }}
          run-id: ${{ matrix.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/private-source
      - name: Audit source SHA and derive seven causal research events (NO TRADES)
        shell: bash
        env:
          SOURCE_ROOT: ${{ runner.temp }}/private-source
          SYMBOL: ${{ matrix.symbol }}
          FAMILY: ${{ matrix.family }}
          COHORT: ${{ matrix.cohort }}
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/legacy-crt-lab:$GITHUB_WORKSPACE" \
            python -m research.crt_r4a_holdout.archived_integrated_engine_probe \
              --root "$SOURCE_ROOT" --symbol "$SYMBOL" \
              --family "$FAMILY" --cohort "$COHORT" |
              tee "$RUNNER_TEMP/integrated.json"
          echo "7_FAMILY_EVENT_ROUTES=RESEARCH_ONLY" >> "$GITHUB_STEP_SUMMARY"
          echo "2024_25=CONSUMED; PINE_PARITY=NO; ORDERS=0" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: qore-crt-r4a-seven-${{ matrix.symbol }}
          path: ${{ runner.temp }}/integrated.json
          retention-days: 21
      - name: Delete raw broker source
        if: always()
        run: rm -rf "${{ runner.temp }}/private-source"

  aggregate-seven-family:
    needs: original-source-seven-family
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test source/ownership/economic gates of the seven-family census
        run: python -m unittest research.crt_r4a_holdout.tests.test_aggregate_seven_family_events -v
      - name: Download exact 33 source-specific event-only summaries
        uses: actions/download-artifact@v4
        with:
          pattern: qore-crt-r4a-seven-*
          path: ${{ runner.temp }}/seven-family-reports
          merge-multiple: false
      - name: Reconcile seven independent models and publish each source
        run: |
          python -m research.crt_r4a_holdout.aggregate_seven_family_events \
            --root "${{ runner.temp }}/seven-family-reports" \
            --outdir reports/r4a-seven-family-33-2024-25
          echo "MODEL_COUNT=7; MARKET_COUNT=33; ALL_NO_TRADES" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: qore-crt-r4a-seven-family-33-market-causal-events-no-pnl
          path: reports/r4a-seven-family-33-2024-25/
          retention-days: 30
