name: QORE Scalper A2 Eleventh CISD Prefix Membership 9Market

on:
  push:
    branches:
      - agent/scalper-architect-b-methodology-20261010
    paths:
      - '.github/workflows/qore-scalper-a2-eleventh-cisd-membership-nine-market.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_a2_eleventh_cisd_prefix_membership_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_scalper_a2_eleventh_cisd_prefix_membership_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: scalper-a2-eleventh-cisd-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_RUN: '38095562104'
  SOURCE_SHA: 'a442a0d844b13cb4d013107b1b3721624abf574d'

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Per-ID original route vs first-online and epistemic proof rules
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_scalper_a2_eleventh_cisd_prefix_membership_v1.py tests/infrastructure/trader_lab/test_capitalizer_scalper_a2_eleventh_cisd_prefix_membership_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_scalper_a2_eleventh_cisd_prefix_membership_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_scalper_a2_eleventh_cisd_prefix_membership_v1.py

  market:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol: [USDJPY, AUDJPY, AUDUSD, GBPJPY, EURUSD, GBPUSD, XAUUSD, USDCAD, NAS100]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: scalper-a2-cisd-prefix-${{ matrix.symbol }}-${{ env.SOURCE_SHA }}
          path: source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
      - run: python -m qore.infrastructure.trader_lab.capitalizer_scalper_a2_eleventh_cisd_prefix_membership_v1 market source market-output
      - name: No unfounded LOOKAHEAD_EVENT verdict
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads(Path("market-output/scalper-eleventh-cisd-membership-market.json").read_text())
          assert x["symbol"]==os.environ["SYMBOL"] and x["sources"]>0
          assert x["unresolved_all_candidate_membership"]==x["sources"]
          assert x["changes_admission"]==0 and not x["author_certified"]
          print("SOURCE FIRST ROUTE AT PREFIX",x)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-eleventh-cisd-membership-${{ matrix.symbol }}-${{ github.sha }}
          path: market-output/
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: scalper-a2-eleventh-cisd-membership-*-${{ github.sha }}
          path: market-inputs
      - run: python -m qore.infrastructure.trader_lab.capitalizer_scalper_a2_eleventh_cisd_prefix_membership_v1 matrix market-inputs nine-market-output
      - name: Original 2876 ids, first-selection contradiction 381, no overclaim
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("nine-market-output/scalper-eleventh-cisd-membership-nine-market.json").read_text())
          assert x["markets"]==9 and x["sources"]==2876
          assert x["future_dependent_offline_first_selection"]==381
          assert x["original_event_absent_from_every_asof_candidate_not_yet_proven"] is True
          assert x["changed_admissions"]==0 and x["paper_pf"] is None
          print("ELEVENTH CISD CAUSAL MEMBERSHIP",x)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-eleventh-cisd-membership-nine-market-${{ github.sha }}
          path: nine-market-output/
          retention-days: 90
          if-no-files-found: error
