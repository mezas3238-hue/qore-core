name: QORE Scalper A1 Nine-Market Native-M1 As-Of World Witness

on:
  push:
    branches:
      - agent/scalper-architect-a-cognition-20261010
    paths:
      - '.github/workflows/qore-scalper-a1-nine-market-native-m1-world-witness.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_a1_native_nine_market_bar_witness_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_a1_native_nine_market_bar_witness_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: scalper-a1-provider-native-nine-market-witness-${{ github.ref }}
  cancel-in-progress: false

env:
  V49_RUN: '38053946695'
  V49_SHA: 'e356e7a52541e99533b25ecfef0ab9c4e9ce03c0'
  NATIVE_M1_RUN: '35548099334'
  NATIVE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  source_barrier_census:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Validate native nine-market barrier code
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_a1_native_nine_market_bar_witness_v1.py tests/infrastructure/trader_lab/test_capitalizer_a1_native_nine_market_bar_witness_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_a1_native_nine_market_bar_witness_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_a1_native_nine_market_bar_witness_v1.py
      - name: Download exact nine original V49 source books
        uses: actions/download-artifact@v4
        with:
          pattern: scalper-a2-v49-control-*-${{ env.V49_SHA }}
          path: source-v49
          github-token: ${{ github.token }}
          run-id: ${{ env.V49_RUN }}
          merge-multiple: false
      - name: Freeze all unique M1 decision instants from 2876 original sources
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_a1_native_nine_market_bar_witness_v1 times source-v49 source-timestamps/times.json
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-a1-nine-market-original-m1-times-${{ github.sha }}
          path: source-timestamps/
          if-no-files-found: error

  source_market_native_m1:
    needs: source_barrier_census
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        symbol: [USDJPY, AUDJPY, AUDUSD, GBPJPY, EURUSD, GBPUSD, XAUUSD, USDCAD, NAS100]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download global 2876-source observed barrier instants
        uses: actions/download-artifact@v4
        with:
          name: scalper-a1-nine-market-original-m1-times-${{ github.sha }}
          path: decision-times
      - name: Download pinned read-only provider-native M1 for this market
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.NATIVE_M1_SHA }}
          path: native-m1
          github-token: ${{ github.token }}
          run-id: ${{ env.NATIVE_M1_RUN }}
      - name: Build only real as-of closed-M1 observations, no invented market state
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_a1_native_nine_market_bar_witness_v1 market native-m1 decision-times/times.json ${{ matrix.symbol }} market-witness
      - name: Upload provider-native synchronized market observations
        uses: actions/upload-artifact@v4
        with:
          name: scalper-a1-native-nine-world-${{ matrix.symbol }}-${{ github.sha }}
          path: market-witness/
          retention-days: 90
          if-no-files-found: error

  global_world_evidence_census:
    needs: source_market_native_m1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Read all nine matched native M1 world witnesses
        uses: actions/download-artifact@v4
        with:
          pattern: scalper-a1-native-nine-world-*-${{ github.sha }}
          path: nine-native-witnesses
          merge-multiple: false
      - name: Prove as-of nine-market source coverage without false cognitive attestation
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          reports=[json.loads(p.read_text()) for p in
                   sorted(Path("nine-native-witnesses").rglob("scalper-a1-market-witness-report.json"))]
          assert len(reports)==9
          assert len({r["market"] for r in reports})==9
          n=reports[0]["barriers"]
          assert n>0 and all(r["barriers"]==n for r in reports)
          assert all(not r["broker_quote_attested"] and not r["regime_attested"]
                     and not r["full_master_frame_attested"] for r in reports)
          bundles=[]
          for path in sorted(Path("nine-native-witnesses").rglob("scalper-a1-native-market-witness.jsonl")):
              rows=[json.loads(line) for line in path.read_text().splitlines() if line.strip()]
              assert len(rows)==n
              bundles.append(rows)
          assert len(bundles)==9
          assert all(len({bundle[i]["decision_at"] for bundle in bundles})==1 for i in range(n))
          asof=Counter()
          complete=0
          for i in range(n):
              available=sum(bool(bundle[i]["has_exact_predecision_m1"]) for bundle in bundles)
              asof[str(available)]+=1
              complete+=int(available==9)
          result={"identity":"QORE_SCALPER_A1_REAL_PROVIDER_NATIVE_NINE_MARKET_BAR_WITNESS",
                  "markets":9,"original_unique_decision_instants":n,
                  "all_nine_exact_closed_m1":complete,
                  "nine_market_exact_m1_distribution":dict(sorted(asof.items())),
                  "source_opportunities":2876,
                  "source_state_provenance":"NATIVE_CLOSED_M1_ONLY",
                  "broker_bid_ask_attested":False,"regime_evidence_attested":False,
                  "full_master_frame_replayed":False,
                  "cognitive_profit_factor":None,"cognitive_drawdown_r":None,
                  "trader_certified":False,"live_authorized":False}
          Path("world-evidence-summary").mkdir(exist_ok=True)
          Path("world-evidence-summary/summary.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\\n")
          print(json.dumps(result,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-a1-provider-native-nine-world-observation-summary-${{ github.sha }}
          path: world-evidence-summary/
          retention-days: 90
          if-no-files-found: error
