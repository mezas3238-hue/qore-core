name: QORE CIBO Compound Path History

on:
  pull_request:
    paths:
      - 'src/qore/infrastructure/cibo_compound_path_history.py'
      - 'tests/infrastructure/test_cibo_compound_path_history.py'
      - '.github/workflows/cibo-compound-path-history.yml'
  push:
    branches:
      - agent/cibo-integrator-ab-001
    paths:
      - 'src/qore/infrastructure/cibo_compound_path_history.py'
      - 'tests/infrastructure/test_cibo_compound_path_history.py'
      - '.github/workflows/cibo-compound-path-history.yml'

permissions:
  contents: read

jobs:
  compound-path-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src/qore/infrastructure/cibo_compound_path_history.py tests/infrastructure/test_cibo_compound_path_history.py
      - name: mypy
        run: mypy src/qore/infrastructure/cibo_compound_path_history.py
      - name: pytest
        run: pytest -q --no-cov tests/infrastructure/test_cibo_compound_path_history.py
