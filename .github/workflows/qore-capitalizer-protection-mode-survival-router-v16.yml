name: QORE Capitalizer Protection Mode Survival Router V16

on:
  workflow_dispatch:


permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-protection-mode-survival-router-v16-${{ github.sha }}
  cancel-in-progress: false

env:
  DEV_DIRECT_RUN_ID: '36196002610'
  DEV_DIRECT_SHA: 'ddd00209e50d5ec16c8cb94f34e9e5e95f401839'
  DEV_CONTEXT_RUN_ID: '36211415438'
  DEV_CONTEXT_SHA: 'c652b1e5a5181ba95ac6f10ea5c95bf808a0c8a7'
  RESERVED_SOURCE_RUN_ID: '36215082659'
  RESERVED_SOURCE_SHA: '9132b8b74938b8f142d946ab8717bf66840a18d2'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_protection_mode_survival_router_v16.py \
            tests/infrastructure/trader_lab/test_capitalizer_protection_mode_survival_router_v16.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_protection_mode_survival_router_v16.py \
            tests/infrastructure/trader_lab/test_capitalizer_protection_mode_survival_router_v16.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_protection_mode_survival_router_v16.py

  experiment:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download development ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-max-recovery-direct-m1-dev-*-${{ env.DEV_DIRECT_SHA }}
          path: development-input
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.DEV_DIRECT_RUN_ID }}
      - name: Download validation ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-max-recovery-direct-m1-holdout-*-${{ env.DEV_DIRECT_SHA }}
          path: validation-input
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.DEV_DIRECT_RUN_ID }}
      - name: Download development and validation contexts
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-native-market-context-v1-*-${{ env.DEV_CONTEXT_SHA }}
          path: development-validation-context
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.DEV_CONTEXT_RUN_ID }}
      - name: Download consumed reserved ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-max-recovery-direct-m1-reserved-*-${{ env.RESERVED_SOURCE_SHA }}
          path: reserved-input
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.RESERVED_SOURCE_RUN_ID }}
      - name: Download consumed reserved contexts
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-native-market-context-v1-reserved-*-${{ env.RESERVED_SOURCE_SHA }}
          path: reserved-context
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.RESERVED_SOURCE_RUN_ID }}
      - name: Run V16 Pareto protection router
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_protection_mode_survival_router_v16 \
            development-input validation-input reserved-input \
            development-validation-context reserved-context experiment-output
      - name: Enforce V16 causal mode-routing contract
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          report = json.loads(
              Path(
                  "experiment-output/"
                  "capitalizer-protection-mode-survival-router-v16.json"
              ).read_text()
          )
          assert report["evaluation"] == (
              "DEVELOPMENT_FROZEN_PARETO_PROTECTION_MODE_ROUTER"
          )
          assert report["development_period"] == "DEVELOPMENT_2024_2026"
          assert report["strict_oos_periods"] == [
              "CONSUMED_VALIDATION_2022_2024",
              "CONSUMED_RESERVED_2020_2022",
          ]
          assert report["all_entries_preserved"] is True
          assert Decimal(report["density_retention"]) == Decimal("1")
          assert report["surface_exposure_multipliers_preserved"] is True
          assert report["original_stop_geometry_preserved"] is True
          assert report["target_r"] == "2.00"
          assert report["max3_preserved"] is True
          assert report[
              "development_counterfactual_modes_used_for_training_only"
          ] is True
          assert report["oos_counterfactual_modes_visible_to_decision"] is False
          assert report["current_outcome_visible_to_decision"] is False
          assert report["market_session_retrospective_filters_used"] is False
          assert report["weighted_utility_used"] is False
          assert report["pareto_dominance_required_for_mode_promotion"] is True
          for result in report["results"]:
              for row in result["heldouts"].values():
                  assert Decimal(row["density_retention"]) == Decimal("1")
          assert report["automatic_policy_promotion"] is False
          assert report["trader_certified"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-protection-mode-survival-router-v16-${{ github.sha }}
          path: experiment-output
          retention-days: 90
