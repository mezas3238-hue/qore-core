name: QORE R34 XAUUSD Live Core Integration

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-xauusd-r34-live-core-integration-001
    paths:
      - '.github/workflows/turtle-soup-xauusd-r34-live-core-integration.yml'
      - 'src/qore/infrastructure/r34_xauusd_live.py'
      - 'src/qore/infrastructure/account_wide_risk.py'
      - 'src/qore/infrastructure/fundednext_live_guard.py'
      - 'src/qore/infrastructure/fundednext_live_mt5.py'
      - 'src/qore/infrastructure/fundednext_mt5_clock.py'
      - 'scripts/qore_fundednext_runtime.py'
      - 'scripts/fundednext_mt5_no_send_probe.py'
      - 'scripts/fundednext_mt5_order_check_probe.py'
      - 'tests/infrastructure/test_r34_xauusd_live.py'
      - 'tests/infrastructure/test_fundednext_mt5_clock.py'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check --ignore E501,I001 src/qore/infrastructure/r34_xauusd_live.py src/qore/infrastructure/account_wide_risk.py src/qore/infrastructure/fundednext_live_guard.py src/qore/infrastructure/fundednext_live_mt5.py src/qore/infrastructure/fundednext_mt5_clock.py scripts/qore_fundednext_runtime.py tests/infrastructure/test_r34_xauusd_live.py tests/infrastructure/test_fundednext_mt5_clock.py
      - name: Mypy focused gate
        run: |
          mypy --disable-error-code attr-defined src/qore/infrastructure/r34_xauusd_live.py src/qore/infrastructure/fundednext_mt5_clock.py scripts/qore_fundednext_runtime.py
      - name: Focused integration tests
        run: |
          pytest -q --no-cov tests/infrastructure/test_r34_xauusd_live.py tests/infrastructure/test_fundednext_mt5_clock.py tests/infrastructure/test_account_wide_risk.py tests/infrastructure/test_account_wide_risk_ledger.py tests/infrastructure/test_fundednext_execution_bridge.py tests/infrastructure/test_fundednext_live_safety.py tests/infrastructure/test_fundednext_live_mt5.py tests/infrastructure/test_fundednext_mt5.py tests/infrastructure/test_fundednext_operational.py
      - name: Enforce R34 production governance
        run: |
          python - <<'PY'
          from decimal import Decimal
          from pathlib import Path

          from qore.infrastructure.account_wide_risk import TraderLineage
          from qore.infrastructure.fundednext_live_guard import CERTIFIED_LIVE_DIRECTIONS
          from qore.infrastructure.r34_xauusd_live import (
              BASE_RISK_FRACTION,
              FAMILY_SET,
              GOVERNOR,
              IDENTITY,
          )

          assert IDENTITY == "TURTLE_SOUP_XAUUSD_R34"
          assert FAMILY_SET == "R33_FIVE_FAMILY"
          assert GOVERNOR == "DD_2_4_SCALE_075_025"
          assert BASE_RISK_FRACTION == Decimal("0.002")
          assert TraderLineage.R34_XAUUSD.value == "R34_XAUUSD"
          assert CERTIFIED_LIVE_DIRECTIONS["XAUUSD"] == frozenset({"long", "short"})

          runtime = Path("scripts/qore_fundednext_runtime.py").read_text()
          assert "TraderLineage.R34_XAUUSD" in runtime
          assert "_EXCLUDED_LEGACY_TRADERS" in runtime
          assert "\"VT09\"" in runtime
          assert "Vt09TurtleSoup" not in runtime
          assert "r34_single_position_busy" in runtime
          assert "R34_24H" in runtime
          assert '"vt08_strategy_timezone": "America/New_York"' in runtime
          assert "normalise_fundednext_server_epoch" in runtime
          assert "_HISTORY_M15_BARS" in runtime
          no_send = Path("scripts/fundednext_mt5_no_send_probe.py").read_text()
          order_check = Path("scripts/fundednext_mt5_order_check_probe.py").read_text()
          assert "XAUUSD" in no_send
          assert "XAUUSD" in order_check
          PY
