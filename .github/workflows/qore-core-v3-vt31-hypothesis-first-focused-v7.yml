name: QORE Core V3 VT31 Hypothesis First Focused V7

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - scripts/vt31_core_stack_v3_hypothesis_first_focused_v7.py
      - .github/workflows/qore-core-v3-vt31-hypothesis-first-focused-v7.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  focused-hypothesis:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Static validation
        run: |
          ruff check scripts/vt31_core_stack_v3_hypothesis_first_focused_v7.py
          python -m py_compile scripts/vt31_core_stack_v3_hypothesis_first_focused_v7.py
      - name: Recover immutable evidence
        run: |
          set -euo pipefail
          mkdir -p input/pure input/cibo input/r8 input/r6 input/r5 result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10799064861/zip" > pure.zip
          unzip -q pure.zip -d input/pure
          (cd input/pure && sha256sum -c SHA256SUMS)
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10478487667/zip" > cibo.zip
          unzip -q cibo.zip -d input/cibo
          (cd input/cibo && sha256sum -c SHA256SUMS)
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10402199719/zip" > r8.zip
          unzip -q r8.zip -d input/r8
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10389112524/zip" > r6.zip
          unzip -q r6.zip -d input/r6
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10380044761/zip" > r5.zip
          unzip -q r5.zip -d input/r5
      - name: Run focused hypothesis-first falsification
        run: |
          python scripts/vt31_core_stack_v3_hypothesis_first_focused_v7.py             --r8-json input/pure/r8.json             --r6-json input/pure/r6.json             --r5-json input/pure/r5.json             --daily-path input/cibo/DAILY_PATH_LEDGER.jsonl             --r8-nas input/r8/fresh/NAS100/market-evidence.json             --r8-sp500 input/r8/fresh/SP500/market-evidence.json             --r8-us30 input/r8/fresh/US30/market-evidence.json             --r6-nas input/r6/fresh/NAS100/market-evidence.json             --r6-sp500 input/r6/fresh/SP500/market-evidence.json             --r6-us30 input/r6/fresh/US30/market-evidence.json             --r5-nas input/r5/fresh/NAS100/market-evidence.json             --r5-sp500 input/r5/fresh/SP500/market-evidence.json             --r5-us30 input/r5/fresh/US30/market-evidence.json             --output result/hypothesis-first-focused-v7.json             | tee result/summary.json
      - name: Governance gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/hypothesis-first-focused-v7.json").read_text())
          assert p["challenge_set"] == {"trades":822,"losses":711,"wins":111}
          g=p["governance"]
          assert g["perception_precedes_hypothesis"] is True
          assert g["hypothesis_precedes_memory"] is True
          assert g["memory_can_create_current_evidence"] is False
          assert g["memory_can_reject_alone"] is False
          assert g["current_outcome_used"] is False
          assert g["journey_management_used"] is False
          assert g["capital_risk_weighting_used"] is False
          assert g["r5_retuned"] is False
          assert g["live_authorized"] is False
          assert g["merge_authorized"] is False
          print(json.dumps({
            "economic_status":p["economic_status"],
            "passes_shared_hypothesis":p["passes_shared_hypothesis"],
            "frozen_policy":p["frozen_policy"],
            "evaluation":p["evaluation"],
            "gates":p["gates"],
          },sort_keys=True))
          PY
      - name: Bind result
        run: |
          echo "$GITHUB_SHA" > result/git-sha.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd result && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-core-v3-vt31-hypothesis-first-focused-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
