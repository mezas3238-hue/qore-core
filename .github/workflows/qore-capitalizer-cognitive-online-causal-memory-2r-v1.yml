name: QORE Capitalizer Cognitive Online Causal Memory 2R V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-cognitive-online-causal-memory-2r-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_cognitive_online_causal_memory_2r_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_cognitive_online_causal_memory_2r_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-cognitive-online-causal-memory-2r-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  REBASE_RUN_ID: '36078677895'
  REBASE_SHA: 'cfc04849c8bbfd6565310d89456f5e367ea880f7'
  M3_RUN_ID: '36177149363'
  M3_SHA: '2d3cb599a9a6eb5566a7374e17317a43d4d6a6b0'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_cognitive_online_causal_memory_2r_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_cognitive_online_causal_memory_2r_v1.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_cognitive_online_causal_memory_2r_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_cognitive_online_causal_memory_2r_v1.py

  experiment:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download true-2R cognitive rebase
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cognitive-economic-rebase-2r-v1-${{ env.REBASE_SHA }}
          path: rebase-input
          github-token: ${{ github.token }}
          run-id: ${{ env.REBASE_RUN_ID }}
      - name: Download all true-2R M3 market ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-cognitive-m3-stop-protection-true-2r-v2-*-${{ env.M3_SHA }}
          path: m3-input
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.M3_RUN_ID }}
      - name: Run prequential causal-memory engine
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cognitive_online_causal_memory_2r_v1 \
            rebase-input m3-input experiment-output
      - name: Enforce economic integrity
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          report = json.loads(
              Path(
                  "experiment-output/"
                  "capitalizer-cognitive-online-causal-memory-2r-v1.json"
              ).read_text()
          )
          assert report["control_trades"] == 948
          assert report["policy_count"] == 8
          assert report["position_mode_count"] == 3
          assert report["result_count"] == 24
          assert report["prequential_only_prior_closed_outcomes"] is True
          assert report["blocked_trades_do_not_enter_memory"] is True
          assert report["current_trade_outcome_visible_to_decision"] is False
          assert report["feature_thresholds_outcome_tuned"] is False

          baseline = report["baseline_original_metrics"]
          assert baseline["trades"] == 948
          assert Decimal(baseline["profit_factor"]) == Decimal(
              "1.466020472120789368123727041"
          )
          assert Decimal(baseline["total_r"]) == Decimal(
              "153.9927998412621697329314877"
          )
          assert Decimal(baseline["max_drawdown_r"]) == Decimal(
              "12.93584837435268644582248142"
          )

          for row in report["results"]:
              assert row["decision_outcome_leakage"] is False
              assert row["kept_trades"] + row["blocked_trades"] == 948
              assert Decimal(row["density_retention"]) > 0
          assert report["automatic_policy_selection"] is False
          assert report["runtime_rule_selected"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-cognitive-online-causal-memory-2r-v1-${{ github.sha }}
          path: experiment-output
          if-no-files-found: error
          retention-days: 90
