name: QORE VT31 A B Breaker Pretarget Protection Frontier V1

on:
  push:
    branches:
      - agent/vt31-edge-position-cert-b-001
    paths:
      - scripts/vt31_nas100_ab_breaker_pretarget_protection_frontier_v1.py
      - scripts/vt31_nas100_h3_dol2_composition_frontier_v1.py
      - scripts/vt31_nas100_a_b_admission_integration_frontier_v1.py
      - .github/workflows/vt31-ab-breaker-pretarget-protection-frontier-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Static gate
        run: |
          set -euo pipefail
          python -m py_compile             scripts/vt31_nas100_ab_breaker_pretarget_protection_frontier_v1.py             scripts/vt31_nas100_h3_dol2_composition_frontier_v1.py
          ruff check             scripts/vt31_nas100_ab_breaker_pretarget_protection_frontier_v1.py             scripts/vt31_nas100_h3_dol2_composition_frontier_v1.py

      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"

      - name: Run pure-edge breaker protection frontier
        run: |
          set -euo pipefail
          python scripts/vt31_nas100_ab_breaker_pretarget_protection_frontier_v1.py             "input/${EVIDENCE_PATH}"             --output "result/ab-breaker-protection-${PARTITION}.json"             | tee "result/summary-${PARTITION}.json"

      - name: Governance gate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path(f"result/ab-breaker-protection-{os.environ['PARTITION']}.json").read_text())
          assert p["fixed_admission"] == "A_EXPANDED_OB_REQUIRE_SHORT_AGE_11M"
          assert p["fixed_position_stack"] == "H3_W5_DOL2_PS2"
          g=p["governance"]
          assert g["breaker_protection_closed_m1_only"] is True
          assert g["breaker_protection_effective_next_m1"] is True
          assert g["breaker_stop_improvement_only"] is True
          assert g["initial_stop_widening"] is False
          assert g["position_sizing_used"] is False
          assert g["dynamic_sizing_used"] is False
          assert g["leverage_used"] is False
          assert g["compounding_used"] is False
          assert g["capital_weighting_used"] is False
          assert g["future_outcome_used_for_action"] is False
          assert g["fold_identity_used_for_action"] is False
          assert g["fresh_holdout_opened"] is False
          assert g["policy_promoted"] is False
          assert g["candidate_certified"] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-ab-breaker-protection-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-ab-breaker-protection-*-${{ github.sha }}
          path: input
          merge-multiple: true

      - name: Aggregate frontier
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          def d(v): return Decimal(str(v))
          def pf(m):
              value=m["profit_factor"]
              return Decimal("Infinity") if value is None and int(m["wins"])>0 and int(m["losses"])==0 else (Decimal("-Infinity") if value is None else d(value))

          folds={}
          for path in Path("input").glob("ab-breaker-protection-*.json"):
              fold=path.stem.replace("ab-breaker-protection-","")
              folds[fold]=json.loads(path.read_text())
          assert set(folds)=={"r5","r6","r8","consumed"}

          names=("BREAKER_PS1","BREAKER_PS2")
          summary={}
          survivors=[]
          for name in names:
              per={}
              survivor=True
              for fold,payload in folds.items():
                  control=payload["variants"]["CONTROL_AB"]
                  cand=payload["variants"][name]
                  cm=control["stress_0_05r"]; nm=cand["stress_0_05r"]
                  wp=cand["winner_preservation_vs_control"]
                  pf_non=pf(nm)>=pf(cm)
                  mean_non=d(nm["mean_r"])>=d(cm["mean_r"])
                  dd_non=d(nm["max_drawdown_r"])<=d(cm["max_drawdown_r"])
                  winner=(
                      d(wp["winner_count_preservation"])>=Decimal("0.80")
                      and d(wp["winner_r_preservation"])>=Decimal("0.90")
                  )
                  common=set(control["halfyear_stress"]) & set(cand["halfyear_stress"])
                  temporal=all(
                      d(cand["halfyear_stress"][k]["mean_r"])>=d(control["halfyear_stress"][k]["mean_r"])
                      and d(cand["halfyear_stress"][k]["max_drawdown_r"])<=d(control["halfyear_stress"][k]["max_drawdown_r"])
                      for k in common
                  )
                  survivor=survivor and pf_non and mean_non and dd_non and winner and temporal
                  per[fold]={
                      "control":cm,
                      "candidate":nm,
                      "monte_carlo":cand["monte_carlo"],
                      "changed_trade_count":cand["changed_trade_count_vs_control"],
                      "protection_committed_count":cand["pretarget_breaker_ps_committed_count"],
                      "winner_preservation":wp,
                      "pf_nondegrade":pf_non,
                      "mean_nondegrade":mean_non,
                      "dd_nondegrade":dd_non,
                      "temporal_nondegrade":temporal,
                  }
              consumed=per["consumed"]
              owner={
                  "pf_at_least_1_50":pf(consumed["candidate"])>=Decimal("1.50"),
                  "mean_at_least_0_15r":d(consumed["candidate"]["mean_r"])>=Decimal("0.15"),
                  "dd_at_most_6r":d(consumed["candidate"]["max_drawdown_r"])<=Decimal("6"),
                  "mc_positive_at_least_0_90":d(consumed["monte_carlo"]["positive_terminal_probability"])>=Decimal("0.90"),
                  "mc_p95_dd_at_most_15r":d(consumed["monte_carlo"]["p95_max_drawdown_r"])<=Decimal("15"),
              }
              summary[name]={
                  "cross_fold_development_survivor":survivor,
                  "folds":per,
                  "consumed_owner_direction":owner,
              }
              if survivor:
                  survivors.append(name)

          report={
              "schema":"qore.vt31.nas100.ab_breaker_pretarget_protection.aggregate.v1",
              "development_survivors":survivors,
              "variants":summary,
              "governance":{
                  "consumed_evidence_only":True,
                  "sizing_for_certification_forbidden":True,
                  "fresh_holdout_opened":False,
                  "policy_promoted":False,
                  "candidate_frozen":False,
                  "candidate_certified":False,
              },
          }
          Path("result/aggregate.json").write_text(json.dumps(report,sort_keys=True,indent=2)+"\n")
          print(json.dumps(report,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-ab-breaker-protection-aggregate-${{ github.sha }}
          path: result/
          retention-days: 90
