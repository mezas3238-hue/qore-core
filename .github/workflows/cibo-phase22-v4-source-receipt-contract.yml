name: QORE CIBO Phase22 V4 Source Receipt Contract

on:
  push:
    branches:
      - agent/cibo-v4-successor-001
    paths:
      - 'src/qore/infrastructure/cibo_phase22_v4_source_receipt.py'
      - 'tests/infrastructure/test_cibo_phase22_v4_source_receipt.py'
      - '.github/workflows/cibo-phase22-v4-source-receipt-contract.yml'

permissions:
  contents: read

jobs:
  receipt-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Static quality
        run: |
          python -m ruff check             src/qore/infrastructure/cibo_phase22_v4_source_receipt.py             tests/infrastructure/test_cibo_phase22_v4_source_receipt.py
          python -m mypy             src/qore/infrastructure/cibo_phase22_v4_source_receipt.py
      - name: Receipt contract
        run: |
          python -m pytest -q --no-cov             tests/infrastructure/test_cibo_phase22_v4_source_receipt.py
