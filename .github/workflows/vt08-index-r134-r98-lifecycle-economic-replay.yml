name: VT08 Index R134 R98 Lifecycle Economic Replay

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r134-r98-lifecycle-economic-replay.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r134_r98_lifecycle_economic_replay.py
      - tests/infrastructure/trader_lab/test_vt08_index_r134_r98_lifecycle_economic_replay.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r134_r98_lifecycle_economic_replay.py

  replay:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R134 R98 lifecycle economic replay
        run: |
          mkdir -p artifacts/report
          python -m qore.infrastructure.trader_lab.vt08_index_r134_r98_lifecycle_economic_replay \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r134-r98-lifecycle-economic-replay.json

      - name: Verify R134 replay contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/"
                  "vt08-index-r134-r98-lifecycle-economic-replay.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R134_R98_DYNAMIC_LIFECYCLE_ECONOMIC_REPLAY_001"
          )
          assert report["source_r133"]["run_id"] == 36174956716
          assert report["source_r133"]["artifact_id"] == 10882800411

          expected = {
              "five_year": 2448,
              "recent_two_year": 1017,
              "r66_failed_holdout": 773,
          }
          for key, canonical in expected.items():
              section = report[key]
              assert section["canonical_sample"] == canonical
              assert section["r98_exact_union_sample"] == (
                  section["exact_overlap_with_canonical"]
                  + section["added_only_sample"]
              )
              assert section["hypothetical_exact_combined_density"] == (
                  canonical + section["added_only_sample"]
              )
              assert section["added_only_economics"]["secondary"]["sample"] == (
                  section["added_only_sample"]
              )

          contract = report["replay_contract"]
          assert contract["target_r"] == "2.5"
          assert contract["same_bar_ordering"] == "STOP_FIRST"
          assert contract["risk_allocator_applied"] is False
          assert contract["shared_classification_before_outcome_attachment"] is True
          assert contract["canonical_overlap_removed_exactly"] is True
          assert contract["fuzzy_dedup_used"] is False
          assert contract["candidate_selected"] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r134-r98-lifecycle-economic-replay-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
