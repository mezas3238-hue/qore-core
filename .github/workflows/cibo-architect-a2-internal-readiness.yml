name: QORE CIBO Architect A2 Internal Readiness

on:
  push:
    branches:
      - agent/cibo-architect-a2-capital-science-001
    paths:
      - '.github/workflows/cibo-architect-a2-internal-readiness.yml'
      - 'src/qore/infrastructure/cibo_arch_a2_internal_readiness.py'
      - 'src/qore/infrastructure/cibo_arch_a2_scientific_closure.py'
      - 'tests/infrastructure/test_cibo_arch_a2_internal_readiness.py'
      - 'docs/research/CIBO-MASTER-OPEN-WORK-LEDGER-V1.json'
  pull_request:
    paths:
      - '.github/workflows/cibo-architect-a2-internal-readiness.yml'
      - 'src/qore/infrastructure/cibo_arch_a2_internal_readiness.py'
      - 'src/qore/infrastructure/cibo_arch_a2_scientific_closure.py'
      - 'tests/infrastructure/test_cibo_arch_a2_internal_readiness.py'
      - 'docs/research/CIBO-MASTER-OPEN-WORK-LEDGER-V1.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a2-internal-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Prove A2 has zero hidden engineering debt
        run: |
          ruff check \
            src/qore/infrastructure/cibo_arch_a2_internal_readiness.py \
            tests/infrastructure/test_cibo_arch_a2_internal_readiness.py
          mypy src/qore/infrastructure/cibo_arch_a2_internal_readiness.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_arch_a2_internal_readiness.py
