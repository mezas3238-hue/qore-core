name: QORE Scalper A2 2x2 M15 M1 Stop Noise Factorial

on:
  push:
    branches:
      - agent/scalper-architect-b-methodology-20261010
    paths:
      - '.github/workflows/qore-scalper-a2-stop-noise-factorial.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_stop_noise_factorial_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_scalper_stop_noise_factorial_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: scalper-a2-2x2-stop-noise-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_M1_RUN: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'
  ORIGINAL_V49_RUN: '38053946695'
  ORIGINAL_V49_SHA: 'e356e7a52541e99533b25ecfef0ab9c4e9ce03c0'

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Verify immutable as-of pivot/noise methodology
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_scalper_stop_noise_factorial_v1.py tests/infrastructure/trader_lab/test_capitalizer_scalper_stop_noise_factorial_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_scalper_stop_noise_factorial_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_scalper_stop_noise_factorial_v1.py

  market:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol: [USDJPY, AUDJPY, AUDUSD, GBPJPY, EURUSD, GBPUSD, XAUUSD, USDCAD, NAS100]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download ORIGINAL independent 9-market V49 economic + source manifests
        uses: actions/download-artifact@v4
        with:
          name: scalper-a2-v49-control-${{ matrix.symbol }}-${{ env.ORIGINAL_V49_SHA }}
          path: frozen-v49
          github-token: ${{ github.token }}
          run-id: ${{ env.ORIGINAL_V49_RUN }}
      - name: Download matching native historical M1 (never synthetic)
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: native-m1
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN }}
      - name: Validate exact provider-native M1 market manifest
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          m=json.loads(Path("native-m1/m1-clone-manifest.json").read_text())
          assert m["canonical_symbol"]==os.environ["EXPECTED_SYMBOL"]
          assert m["provider_native_m1"] is True
          assert m["synthetic_m1"] is False and m["interpolated_m1"] is False
          assert m["contradictory_m1"]==0 and m["read_only"] is True
          PY
      - name: Run identical H1 destination four-arm M15/M1 risk replay
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_stop_noise_factorial_v1 \
            market frozen-v49 native-m1 frozen-v49 factorial-market
      - name: Assert original structural baseline exactly reproduced
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          x=json.loads(Path("factorial-market/scalper-stop-noise-market.json").read_text())
          assert x["symbol"]==os.environ["EXPECTED_SYMBOL"]
          assert x["source_opportunities"]==x["baseline_trades_replayed_and_identical"]
          assert x["same_h1_target_all_arms"] is True
          assert x["outcomes_used_for_gate"] is False
          assert x["full_master_frame_evaluated"] is False
          assert x["trader_certified"] is False and x["live_authorized"] is False
          print("FACTORIAL MARKET", x)
          PY
      - name: Publish all four arm ledgers and source-level noise WHY
        uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-stop-factorial-${{ matrix.symbol }}-${{ github.sha }}
          path: factorial-market/
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download all 9 factorial source-identical outputs
        uses: actions/download-artifact@v4
        with:
          pattern: scalper-a2-stop-factorial-*-${{ github.sha }}
          path: nine-market-factorial
          merge-multiple: false
      - name: Apply exactly the frozen first-3-per-session chronological MAX3
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_stop_noise_factorial_v1 \
            matrix nine-market-factorial factorial-matrix
      - name: Fail if baseline changed and block retrospective policy promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("factorial-matrix/scalper-stop-noise-factorial-matrix.json").read_text())
          assert r["source_market_count"]==9 and r["source_opportunities"]==2876
          assert r["original_baseline_selected"]==2020
          assert r["original_baseline_winners"]==1167
          assert r["same_h1_target_all_arms"] is True
          assert r["all_policies_research_only"] is True
          assert r["neither_master_frame_nor_real_broker_costs_tested"] is True
          assert r["trader_certified"] is False and r["live_authorized"] is False
          b=r["arms"]["M15_NOISE_OFF"]
          assert b["post_max3"]==2020
          assert b["gross"]["wins"]==1167
          assert float(b["gross"]["profit_factor"])>0.6644
          assert float(b["gross"]["profit_factor"])<0.6645
          for arm,data in r["arms"].items():
              print("FACTORIAL ARM", arm, data)
          print("ASOF LOCAL NOISE COUNTS",r["predecision_m1_noise_reasons"])
          PY
      - name: Publish matched-source outcomes without certifying
        uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-stop-noise-factorial-matrix-${{ github.sha }}
          path: factorial-matrix/
          if-no-files-found: error
          retention-days: 90
