name: QORE VT31 Sovereign Post-1R Cognition Calibration V2

on:
  push:
    branches:
      - agent/vt31-edge-position-cert-b-001
    paths:
      - scripts/vt31_nas100_sovereign_post_1r_cognition_calibration_v2.py
      - .github/workflows/vt31-sovereign-post-1r-cognition-calibration-v2.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Static gate
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_sovereign_post_1r_cognition_calibration_v2.py
          ruff check scripts/vt31_nas100_sovereign_post_1r_cognition_calibration_v2.py

      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"

      - name: Run sovereign post-1R cognition calibration
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python scripts/vt31_nas100_sovereign_post_1r_cognition_calibration_v2.py             "input/${EVIDENCE_PATH}"             --partition "${PARTITION}"             --output "result/post1r-${PARTITION}.json"             | tee "result/summary-${PARTITION}.json"

      - name: Governance gate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=os.environ["PARTITION"]
          x=json.loads(Path(f"result/post1r-{p}.json").read_text())
          g=x["governance"]
          assert g["specialist_replay_is_admission_authority"] is True
          assert g["trade_admission_changed"] is False
          assert g["future_labels_research_only"] is True
          assert g["future_labels_used_for_runtime_decision"] is False
          assert g["maximum_cognition_required"] is True
          assert g["r_used_for_volume"] is False
          assert g["position_sizing_used"] is False
          assert g["leverage_used"] is False
          assert g["compounding_used"] is False
          assert g["capital_weighting_used"] is False
          assert g["fresh_holdout_opened"] is False
          assert all(
              row["maximum_cognition_verified"] is True
              for row in x["rows"]
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-sovereign-post1r-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-sovereign-post1r-*-${{ github.sha }}
          path: input
          merge-multiple: true

      - name: Aggregate journey calibration
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from collections import defaultdict
          from decimal import Decimal
          from pathlib import Path

          folds=("r5","r6","r8","consumed")
          payloads={
              f:json.loads(Path(f"input/post1r-{f}.json").read_text())
              for f in folds
          }
          rows=[]
          for f,p in payloads.items():
              for row in p["rows"]:
                  row=dict(row)
                  row["fold"]=f
                  rows.append(row)

          def rate(items,key):
              if not items:
                  return None
              return format(
                  Decimal(sum(bool(x[key]) for x in items))
                  / Decimal(len(items)),
                  "f",
              )

          cross={}
          for horizon in (2,3,5):
              hrows=[x for x in rows if x["horizon_closed_bars"]==horizon]
              groups=defaultdict(list)
              for row in hrows:
                  key=(
                      row["entry_management_context"],
                      row["entry_destination_state"],
                      row["persistence_state"],
                  )
                  groups[key].append(row)
              cross[str(horizon)]={
                  "|".join(key):{
                      "sample":len(items),
                      "folds":sorted({x["fold"] for x in items}),
                      "eventual_3r_plus_rate":rate(items,"future_label_eventual_3r_plus"),
                      "eventual_5r_plus_rate":rate(items,"future_label_eventual_5r_plus"),
                      "giveback_after_1r_rate":rate(items,"future_label_giveback_after_1r"),
                  }
                  for key,items in sorted(groups.items())
              }

          report={
              "schema":"qore.vt31.nas100.sovereign_post_1r_cognition_calibration.aggregate.v2",
              "head":"${{ github.sha }}",
              "fold_trade_counts":{
                  f:payloads[f]["sovereign_trade_count"] for f in folds
              },
              "fold_observation_counts":{
                  f:payloads[f]["observation_count"] for f in folds
              },
              "cross_fold_cognition_persistence":cross,
              "governance":{
                  "consumed_evidence_only":True,
                  "future_labels_research_only":True,
                  "runtime_policy_promoted":False,
                  "fresh_holdout_opened":False,
                  "candidate_frozen":False,
                  "candidate_certified":False,
              },
          }
          Path("result/aggregate.json").write_text(
              json.dumps(report,sort_keys=True,indent=2)+"\n"
          )
          print(json.dumps(report,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-sovereign-post1r-aggregate-${{ github.sha }}
          path: result/
          retention-days: 90
