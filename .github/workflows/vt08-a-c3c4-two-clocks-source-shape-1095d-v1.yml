name: VT08 A C3 C4 Two Clocks Source Shape 1095D V1

on:
  push:
    branches:
      - agent/vt08-5m-methodology-source-20261010
    paths:
      - .github/workflows/vt08-a-c3c4-two-clocks-source-shape-1095d-v1.yml
      - src/qore/infrastructure/trader_lab/vt08_5m_c3_c4_separate_causal_snapshots_v1.py
      - tests/infrastructure/trader_lab/test_vt08_5m_c3_c4_separate_causal_snapshots_v1.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  c3-c4-temporal:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        symbol: [EURJPY, USDCHF, NZDUSD, CADJPY, USDCAD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Ruff and adversarial no-lookahead causal tests
        run: |
          ruff check src/qore/infrastructure/trader_lab/vt08_5m_c3_c4_separate_causal_snapshots_v1.py tests/infrastructure/trader_lab/test_vt08_5m_c3_c4_separate_causal_snapshots_v1.py
          python -m compileall -q src/qore/infrastructure/trader_lab/vt08_5m_c3_c4_separate_causal_snapshots_v1.py
          pytest -q tests/infrastructure/trader_lab/test_vt08_5m_c3_c4_separate_causal_snapshots_v1.py
      - uses: actions/download-artifact@v4
        with:
          name: qore-vt08-cognitive-5m-fresh-${{ matrix.symbol }}-b2d33e1b4829d8b4afc76983decca8a99131403c
          path: evidence/${{ matrix.symbol }}
          github-token: ${{ github.token }}
          run-id: 35934924907
      - name: Independent source-timestamp shape reconstruction no PnL
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from qore.infrastructure.trader_lab.vt08_5m_c3_c4_separate_causal_snapshots_v1 import audit_market
          sym = os.environ["SYMBOL"]
          results = audit_market(Path(f"evidence/{sym}/market-evidence-1095d.json"))
          Path(f"artifacts/{sym}-two-clocks-source-full.json").write_text(
              json.dumps(results, sort_keys=True, separators=(",", ":")),
              encoding="utf-8",
          )
          summary = {k: results[k] for k in (
              "schema", "market", "counts",
              "c3_continuation_family_overlap_under_frozen_c2_partition",
              "unverified_poi", "candidate_event_approved", "cognitive_ready",
              "trades_executed", "pnl_evaluated", "sealed_7y_accessed",
          )}
          Path(f"artifacts/{sym}-two-clocks-summary.json").write_text(
              json.dumps(summary, sort_keys=True, indent=2), encoding="utf-8",
          )
          print(json.dumps(summary, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vt08-a-c3c4-two-clocks-${{ matrix.symbol }}-${{ github.sha }}
          path: artifacts/*
          retention-days: 30
          if-no-files-found: error
