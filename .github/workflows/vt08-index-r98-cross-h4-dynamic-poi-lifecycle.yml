name: VT08 Index R98 Cross H4 Dynamic POI Lifecycle

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r98-cross-h4-dynamic-poi-lifecycle.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r98_cross_h4_dynamic_poi_lifecycle.py
      - tests/infrastructure/trader_lab/test_vt08_index_r98_cross_h4_dynamic_poi_lifecycle.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r98_cross_h4_dynamic_poi_lifecycle.py

  forensics:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R98 cross-H4 dynamic lifecycle census
        run: |
          mkdir -p artifacts/report
          python -m qore.infrastructure.trader_lab.vt08_index_r98_cross_h4_dynamic_poi_lifecycle \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r98-cross-h4-dynamic-poi-lifecycle.json

      - name: Verify R98 governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r98-cross-h4-dynamic-poi-lifecycle.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R98_CROSS_H4_DYNAMIC_POI_LIFECYCLE_001"
          )
          assert report["source_r97"]["run_id"] == 35535136703
          assert report["source_r97"]["artifact_id"] == 10613125272
          assert report["source_r97"]["artifact_digest"] == (
              "sha256:97864b91f41ff6578d5c16ebb98a88559795e2698110cb7297d4afad949eebf7"
          )
          contract = report["dynamic_lifecycle_contract"]
          assert contract["primary_model"] == "D1_H4_M15"
          assert contract["start_requires_closed_ideal_formation"] is True
          assert contract["later_ideal_formation_replaces_prior_lifecycle"] is True
          assert contract["numeric_h4_ttl"] is None
          assert contract["poi_priority"] == ["fvg", "relevant-swing", "cisd"]
          assert contract["poi_rebuilt_after_every_new_ps"] is True
          assert contract["new_ps_can_form_across_h4_boundaries"] is True
          assert contract["one_execution_per_active_ps"] is True
          assert contract["continuation_outside_owner_anchor_consumes_ps"] is True
          assert contract["execution_anchors_ny"] == [22, 2, 6, 10]
          assert contract["owner_disabled_14_preserved"] is True
          assert contract["context_only_18_preserved"] is True
          assert contract["pnl_evaluated"] is False

          assert report["five_year"]["canonical_signal_reference"] == 2448
          assert report["recent_two_year"]["canonical_signal_reference"] == 1017
          assert report["r66_failed_holdout"]["canonical_signal_reference"] == 773
          assert report["decision"] == (
              "R98_CROSS_H4_DYNAMIC_POI_LIFECYCLE_CENSUS_COMPLETE_NO_TRADES"
          )

          gov = report["governance"]
          assert gov["forensics_only"] is True
          assert gov["consumed_evidence_only"] is True
          assert gov["fresh_holdout_claim"] is False
          assert gov["source_primary_model_only"] is True
          assert gov["future_information_used"] is False
          assert gov["numeric_ttl_search"] is False
          assert gov["pnl_evaluated"] is False
          assert gov["risk_changed"] is False
          assert gov["target_changed"] is False
          assert gov["anchors_changed"] is False
          assert gov["market_or_anchor_selection_by_outcome"] is False
          assert gov["candidate_created"] is False
          assert gov["trader_certified"] is False
          assert gov["live_authorized"] is False
          assert gov["real_capital_authorized"] is False
          assert gov["production_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r98-cross-h4-dynamic-poi-lifecycle-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
