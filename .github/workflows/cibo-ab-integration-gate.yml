name: QORE CIBO A+B Integrator Reconciliation

on:
  pull_request:
    paths:
      - "docs/research/CIBO-AB-INTEGRATION-ACCEPTANCE-V1.json"
      - "docs/research/CIBO-AB-CHILD-DELTA-ACCOUNTING-V1.json"
      - "docs/research/CIBO-AB-CHILD-DELTA-ACCOUNTING-V1.json"
      - "docs/research/CIBO-MASTER-OPEN-WORK-LEDGER-V1.json"
      - "scripts/cibo_ab_integration_gate.py"
      - "tests/infrastructure/test_cibo_ab_integration_gate.py"
      - "scripts/cibo_zero_open_work_gate.py"
      - "src/qore/infrastructure/cibo_a1_*.py"
      - "src/qore/infrastructure/cibo_arch_a2_*.py"
      - "src/qore/infrastructure/cibo_arch2_*.py"
      - "src/qore/infrastructure/cibo_t08_factor_correlation_lineage.py"
      - "src/qore/infrastructure/cibo_ce2i_phase20_t09_t18_phase22_true_scarcity_lineage.py"
      - "src/qore/infrastructure/cibo_ce2i_phase20_t15_reservation_counterfactual.py"
      - "tests/infrastructure/test_cibo_a1_*.py"
      - "tests/infrastructure/test_cibo_arch_a2_*.py"
      - "tests/infrastructure/test_cibo_arch2_*.py"
      - "tests/infrastructure/test_cibo_t08_factor_correlation_lineage.py"
      - "tests/infrastructure/test_cibo_ce2i_phase20_t09_t18_phase22_true_scarcity_lineage.py"
      - "tests/infrastructure/test_cibo_ce2i_phase20_t15_reservation_counterfactual.py"
      - ".github/workflows/cibo-ab-integration-gate.yml"
  push:
    paths:
      - "docs/research/CIBO-AB-INTEGRATION-ACCEPTANCE-V1.json"
      - "docs/research/CIBO-MASTER-OPEN-WORK-LEDGER-V1.json"
      - "scripts/cibo_ab_integration_gate.py"
      - "tests/infrastructure/test_cibo_ab_integration_gate.py"
      - "scripts/cibo_zero_open_work_gate.py"
      - "src/qore/infrastructure/cibo_a1_*.py"
      - "src/qore/infrastructure/cibo_arch_a2_*.py"
      - "src/qore/infrastructure/cibo_arch2_*.py"
      - "src/qore/infrastructure/cibo_t08_factor_correlation_lineage.py"
      - "src/qore/infrastructure/cibo_ce2i_phase20_t09_t18_phase22_true_scarcity_lineage.py"
      - "src/qore/infrastructure/cibo_ce2i_phase20_t15_reservation_counterfactual.py"
      - "tests/infrastructure/test_cibo_a1_*.py"
      - "tests/infrastructure/test_cibo_arch_a2_*.py"
      - "tests/infrastructure/test_cibo_arch2_*.py"
      - "tests/infrastructure/test_cibo_t08_factor_correlation_lineage.py"
      - "tests/infrastructure/test_cibo_ce2i_phase20_t09_t18_phase22_true_scarcity_lineage.py"
      - "tests/infrastructure/test_cibo_ce2i_phase20_t15_reservation_counterfactual.py"
      - ".github/workflows/cibo-ab-integration-gate.yml"

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: python -m pip install -e '.[dev]'
      - name: Quality and syntax
        run: |
          ruff check \
            scripts/cibo_ab_integration_gate.py \
            scripts/cibo_zero_open_work_gate.py \
            tests/infrastructure/test_cibo_ab_integration_gate.py \
            tests/infrastructure/test_cibo_zero_open_work_gate.py
          python -m py_compile \
            scripts/cibo_ab_integration_gate.py \
            scripts/cibo_zero_open_work_gate.py
          python -m json.tool \
            docs/research/CIBO-AB-INTEGRATION-ACCEPTANCE-V1.json \
            >/dev/null
          python -m json.tool \
            docs/research/CIBO-AB-CHILD-DELTA-ACCOUNTING-V1.json \
            >/dev/null
          python -m json.tool \
            docs/research/CIBO-MASTER-OPEN-WORK-LEDGER-V1.json \
            >/dev/null
      - name: Validate staged A+B reconciliation
        run: python scripts/cibo_ab_integration_gate.py
      - name: Run integrator and zero-open gate tests
        run: |
          pytest -q \
            tests/infrastructure/test_cibo_ab_integration_gate.py \
            tests/infrastructure/test_cibo_zero_open_work_gate.py

  child-intake-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: python -m pip install -e '.[dev]'
      - name: Validate A1 A2 B2 additive contracts
        run: |
          ruff check \
            src/qore/infrastructure/cibo_a1_*.py \
            src/qore/infrastructure/cibo_arch_a2_*.py \
            src/qore/infrastructure/cibo_arch2_*.py \
            src/qore/infrastructure/cibo_t08_factor_correlation_lineage.py \
            src/qore/infrastructure/cibo_ce2i_phase20_t09_t18_phase22_true_scarcity_lineage.py \
            src/qore/infrastructure/cibo_ce2i_phase20_t15_reservation_counterfactual.py \
            tests/infrastructure/test_cibo_a1_*.py \
            tests/infrastructure/test_cibo_arch_a2_*.py \
            tests/infrastructure/test_cibo_arch2_*.py \
            tests/infrastructure/test_cibo_t08_factor_correlation_lineage.py \
            tests/infrastructure/test_cibo_ce2i_phase20_t09_t18_phase22_true_scarcity_lineage.py \
            tests/infrastructure/test_cibo_ce2i_phase20_t15_reservation_counterfactual.py
          mypy \
            src/qore/infrastructure/cibo_a1_*.py \
            src/qore/infrastructure/cibo_arch_a2_*.py \
            src/qore/infrastructure/cibo_arch2_*.py \
            src/qore/infrastructure/cibo_t08_factor_correlation_lineage.py \
            src/qore/infrastructure/cibo_ce2i_phase20_t09_t18_phase22_true_scarcity_lineage.py \
            src/qore/infrastructure/cibo_ce2i_phase20_t15_reservation_counterfactual.py
          pytest -q \
            tests/infrastructure/test_cibo_a1_*.py \
            tests/infrastructure/test_cibo_arch_a2_*.py \
            tests/infrastructure/test_cibo_arch2_*.py \
            tests/infrastructure/test_cibo_t08_factor_correlation_lineage.py \
            tests/infrastructure/test_cibo_ce2i_phase20_t09_t18_phase22_true_scarcity_lineage.py \
            tests/infrastructure/test_cibo_ce2i_phase20_t15_reservation_counterfactual.py
