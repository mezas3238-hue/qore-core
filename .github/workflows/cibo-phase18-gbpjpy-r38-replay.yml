name: QORE CIBO Phase 18 GBPJPY R38 Chronological Replay

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-phase18-gbpjpy-r38-replay.yml'
      - 'src/qore/infrastructure/cibo_ce2i_chronological_replay.py'
      - 'src/qore/infrastructure/trader_lab/cibo_phase18_gbpjpy_r37_geometry_replay.py'
      - 'tests/infrastructure/test_cibo_ce2i_chronological_replay.py'
      - 'tests/infrastructure/trader_lab/test_cibo_phase18_gbpjpy_r37_geometry_replay.py'
  push:
    branches:
      - agent/cibo-capital-efficiency-sizing-lab-001
    paths:
      - '.github/workflows/cibo-phase18-gbpjpy-r38-replay.yml'
      - 'src/qore/infrastructure/cibo_ce2i_chronological_replay.py'
      - 'src/qore/infrastructure/trader_lab/cibo_phase18_gbpjpy_r37_geometry_replay.py'
      - 'tests/infrastructure/test_cibo_ce2i_chronological_replay.py'
      - 'tests/infrastructure/trader_lab/test_cibo_phase18_gbpjpy_r37_geometry_replay.py'

permissions:
  contents: read
  actions: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-GBPJPY-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-GBPJPY-2f510461b3360e91d5ee70a72716a76cd6561f16'
  V2_RUN_ID: '35349300927'
  V2_ARTIFACT: 'qore-turtle-soup-gbpjpy-structural-specialist-v2-r27-00fb870826e0cbd30179fe44cbdd6707448be0da'
  FREEZE_RUN_ID: '35371045165'
  FREEZE_ARTIFACT: 'qore-turtle-soup-gbpjpy-r36-candidate-freeze-035b8772a023fc0a57697aecbcb1a302173491cd'
  R37_RUN_ID: '35371203863'
  R37_ARTIFACT: 'qore-turtle-soup-gbpjpy-r37-frozen-r36-5y-validation-eb62226e05f63cf94c1940634de676c55285e6dd'
  R38_RUN_ID: '35374273535'
  R38_ARTIFACT: 'qore-turtle-soup-gbpjpy-r38-5y-fragility-dda5ab344a122b875e68548cb4e9825acb7b1c27'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Focused quality
        run: |
          ruff check \
            src/qore/infrastructure/cibo_ce2i_chronological_replay.py \
            src/qore/infrastructure/trader_lab/cibo_phase18_gbpjpy_r37_geometry_replay.py \
            tests/infrastructure/test_cibo_ce2i_chronological_replay.py \
            tests/infrastructure/trader_lab/test_cibo_phase18_gbpjpy_r37_geometry_replay.py
          mypy --disable-error-code attr-defined \
            src/qore/infrastructure/cibo_ce2i_chronological_replay.py \
            src/qore/infrastructure/trader_lab/cibo_phase18_gbpjpy_r37_geometry_replay.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_ce2i_chronological_replay.py \
            tests/infrastructure/trader_lab/test_cibo_phase18_gbpjpy_r37_geometry_replay.py

  replay-gbpjpy:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable GBPJPY raw master
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-gbpjpy
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download immutable Target Destination V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target-gbpjpy
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Download exact Cognitive V2 R27 evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V2_ARTIFACT }}
          path: v2-r27
          github-token: ${{ github.token }}
          run-id: ${{ env.V2_RUN_ID }}
      - name: Download exact R36 freeze
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FREEZE_ARTIFACT }}
          path: r36-freeze
          github-token: ${{ github.token }}
          run-id: ${{ env.FREEZE_RUN_ID }}
      - name: Download exact R37 source ledger
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.R37_ARTIFACT }}
          path: r37-source
          github-token: ${{ github.token }}
          run-id: ${{ env.R37_RUN_ID }}
      - name: Download exact R38 final ledger
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.R38_ARTIFACT }}
          path: r38-final
          github-token: ${{ github.token }}
          run-id: ${{ env.R38_RUN_ID }}
      - name: Reproduce exact frozen geometry
        run: |
          mkdir -p phase18-output
          python -m qore.infrastructure.trader_lab.cibo_phase18_gbpjpy_r37_geometry_replay \
            source-gbpjpy target-gbpjpy v2-r27 r36-freeze phase18-output \
            > phase18-output/replay-stdout.json
      - name: Bind geometry to R37 and final R38 evidence
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from decimal import Decimal
          from pathlib import Path

          def load_jsonl(path: Path):
              return [
                  json.loads(line)
                  for line in path.read_text().splitlines()
                  if line.strip()
              ]

          generated = load_jsonl(
              Path('phase18-output/phase18-gbpjpy-r37-geometry-trades.jsonl')
          )
          r37 = load_jsonl(Path('r37-source/r37-5y-scaled-trades.jsonl'))
          r38 = load_jsonl(Path('r38-final/r38-5y-corrected-trades.jsonl'))

          assert len(generated) == len(r37) == len(r38) == 897

          bound = []
          for index, (geometry, base, final) in enumerate(
              zip(generated, r37, r38, strict=True)
          ):
              for key, value in base.items():
                  assert geometry[key] == value, (index, key, geometry[key], value)

              assert final['entry_at'] == base['entry_at']
              assert final['exit_at'] == base['exit_at']
              assert final['side'] == base['side']
              assert final['posture'] == base['posture']
              assert final['source_scheme'] == base['source_scheme']
              assert final['authority_tier'] == base['authority_tier']
              assert final['validation_class'] == base['validation_class']
              assert final['target_rank'] == base['target_rank']
              assert final['target_route'] == base['target_route']
              assert final['exit_reason'] == base['exit_reason']
              assert final['raw_net_010_r'] == base['raw_net_010_r']
              assert final['base_risk_scale'] == base['risk_scale']
              assert final['base_scaled_net_010_r'] == base['scaled_net_010_r']

              signal_at = datetime.fromisoformat(geometry['signal_at'])
              entry_at = datetime.fromisoformat(geometry['entry_at'])
              assert signal_at <= entry_at
              entry = Decimal(geometry['entry_price'])
              stop = Decimal(geometry['structural_stop'])
              target = Decimal(geometry['technical_target'])
              if geometry['side'] == 'long':
                  assert stop < entry < target
              else:
                  assert target < entry < stop

              row = dict(geometry)
              row.update(
                  {
                      'legacy_r38_final_risk_scale': final['final_risk_scale'],
                      'legacy_r38_corrected_scaled_net_010_r': final[
                          'corrected_scaled_net_010_r'
                      ],
                      'legacy_r38_fragility_flags': final['fragility_flags'],
                      'legacy_r38_fragility_flag_count': final[
                          'fragility_flag_count'
                      ],
                      'legacy_r38_structural_overlay_scale': final[
                          'structural_overlay_scale'
                      ],
                      'economics_status': 'R_DENOMINATED_ONLY',
                  }
              )
              bound.append(row)

          out = Path('phase18-output/phase18-gbpjpy-r38-bound-trades.jsonl')
          out.write_text(
              ''.join(json.dumps(row, sort_keys=True) + '\n' for row in bound)
          )

          final_report = json.loads(
              Path(
                  'r38-final/r38-5y-structural-fragility-correction-report.json'
              ).read_text()
          )
          result = final_report['result_5y']
          assert result['acceptance_pass'] is True
          assert result['trades'] == 897
          assert result['profit_factor_scaled_net_010'] == (
              '1.852918712035185462516517131'
          )
          assert result['total_scaled_net_010_r'] == (
              '92.83988286566161467727272231'
          )
          assert result['max_drawdown_r'] == (
              '5.06150896610739539086014902'
          )
          assert result['positive_annual_blocks'] == 5

          report = {
              'schema': 'qore.cibo.phase18.gbpjpy_r38_bound_replay.v1',
              'identity': 'CIBO_PHASE18_GBPJPY_R38_BOUND_REPLAY_V1',
              'status': (
                  'R_DENOMINATED_GEOMETRY_REPLAY_GREEN_'
                  'PROVIDER_CALIBRATION_REQUIRED'
              ),
              'rows': len(bound),
              'parity': {
                  'r37_row_for_row': True,
                  'r38_population_row_for_row': True,
                  'same_signals': True,
                  'same_entry': True,
                  'same_structural_stop': True,
                  'same_technical_target': True,
                  'same_market_path': True,
              },
              'provider_economics': {
                  'status': 'CALIBRATION_REQUIRED',
                  'usd_cibo_sizing_comparison_authorized': False,
                  'reason': (
                      'exact historical provider spread, commission, slippage, '
                      'margin and tick-value calibration is not yet bound'
                  ),
              },
              'source_evidence': {
                  'raw_run_id': 35166210458,
                  'raw_artifact_id': 10475453293,
                  'target_artifact_id': 10489327009,
                  'r27_artifact_id': 10549575964,
                  'r36_freeze_artifact_id': 10558097201,
                  'r37_run_id': 35371203863,
                  'r37_artifact_id': 10558603038,
                  'r37_digest': (
                      'sha256:0c005ed71d7476fb48aa901a347ed833772e4729'
                      'f341b800abca1a9b29cbf7c9'
                  ),
                  'r38_run_id': 35374273535,
                  'r38_artifact_id': 10559826734,
                  'r38_digest': (
                      'sha256:a999feaf90c5fbf2c23a006faff6d591d7f3ede'
                      '697c34f11dafa510afa5d5846'
                  ),
              },
              'legacy_r38_result_5y': result,
              'governance': {
                  'research_only': True,
                  'demo_execution_authorized': False,
                  'live_authorized': False,
                  'real_capital_authorized': False,
                  'merge_authorized': False,
              },
          }
          Path('phase18-output/phase18-gbpjpy-r38-bound-report.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n'
          )
          PY
      - name: Hash Phase 18 evidence
        run: |
          printf '%s\n' "$EVIDENCE_SHA" > phase18-output/git-sha.txt
          cd phase18-output
          sha256sum \
            phase18-gbpjpy-r37-geometry-report.json \
            phase18-gbpjpy-r37-geometry-trades.jsonl \
            phase18-gbpjpy-r38-bound-report.json \
            phase18-gbpjpy-r38-bound-trades.jsonl \
            replay-stdout.json \
            git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-phase18-gbpjpy-r38-geometry-${{ env.EVIDENCE_SHA }}
          path: phase18-output
          if-no-files-found: error
          retention-days: 90
