name: QORE VT-31 Deep Multi-Index Behavior Findings

on:
  push:
    branches:
      - agent/vt31-historical-tick-resolution-001
    paths:
      - .github/workflows/vt31-behavior-findings.yml
      - scripts/vt31_behavior_findings.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  findings:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile findings renderer
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_behavior_findings.py

      - name: Recover immutable behavior observatory artifact
        run: |
          set -euo pipefail
          artifact_id=10456718122
          expected=fb760dee626e767ee6d68cc552a2d4dd03858ba216dac65a2f0f150b5d3cb75e
          digest="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" --jq .digest)"
          test "$digest" = "sha256:${expected}"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > observatory.zip
          echo "${expected}  observatory.zip" | sha256sum -c -
          mkdir observatory
          unzip -q observatory.zip -d observatory
          (cd observatory && sha256sum -c SHA256SUMS)
          test "$(cat observatory/git-sha.txt)" = "622cdd2bc3d994def7c10d10cb8ce640249623ae"
          test -f observatory/vt31-behavior-observatory.json
          printf '%s\n' "$artifact_id" > source-observatory-artifact-id.txt
          printf '%s\n' "$digest" > source-observatory-artifact-digest.txt

      - name: Render deep findings
        run: |
          set -euo pipefail
          mkdir result
          python scripts/vt31_behavior_findings.py \
            --observatory observatory/vt31-behavior-observatory.json \
            --output result/vt31-behavior-findings.json \
            --markdown result/vt31-behavior-findings.md

      - name: Validate findings governance
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('result/vt31-behavior-findings.json').read_text())
          assert p['schema']=='qore.vt31.multi_index_behavior_findings.v1'
          assert p['research_only'] is True and p['opens_new_holdout'] is False
          assert p['selection_prohibited'] is True and p['candidate_status']=='NO_R9_NOT_CERTIFIED'
          assert set(p['market_profiles'])=={'NAS100','SP500','US30'}
          assert len(p['regime_profiles'])==6
          print(json.dumps(p,sort_keys=True))
          PY

      - name: Bind immutable findings artifact
        run: |
          set -euo pipefail
          cp source-observatory-artifact-id.txt result/
          cp source-observatory-artifact-digest.txt result/
          echo "$GITHUB_SHA" > result/git-sha.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-deep-multi-index-behavior-findings-${{ github.sha }}
          path: result/
          retention-days: 90
