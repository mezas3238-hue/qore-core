name: QORE VT31 NAS100 R5 CORE Breaker Structural Protection V1

on:
  push:
    branches:
      - agent/vt31-nas100-intelligence-pilot-001
    paths:
      - scripts/vt31_nas100_r5_core_breaker_structural_protection_frontier_v1.py
      - scripts/vt31_nas100_r5_corrective_management_frontier_v1.py
      - .github/workflows/vt31-nas100-r5-core-breaker-structural-protection-v1.yml
  pull_request:
    paths:
      - scripts/vt31_nas100_r5_core_breaker_structural_protection_frontier_v1.py
      - scripts/vt31_nas100_r5_corrective_management_frontier_v1.py
      - .github/workflows/vt31-nas100-r5-core-breaker-structural-protection-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed_holdout
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Static gate
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/vt31_nas100_r5_core_breaker_structural_protection_frontier_v1.py \
            scripts/vt31_nas100_r5_corrective_management_frontier_v1.py
          ruff check \
            scripts/vt31_nas100_r5_core_breaker_structural_protection_frontier_v1.py \
            scripts/vt31_nas100_r5_corrective_management_frontier_v1.py

      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"

      - name: Run CORE breaker structural protection frontier
        run: |
          set -euo pipefail
          python scripts/vt31_nas100_r5_core_breaker_structural_protection_frontier_v1.py \
            "input/${EVIDENCE_PATH}" \
            --partition "$PARTITION" \
            --output "result/core-breaker-protection-${PARTITION}.json" \
            | tee "result/summary-${PARTITION}.json"

      - name: Governance gate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          partition=os.environ["PARTITION"]
          p=json.loads(Path(f"result/core-breaker-protection-{partition}.json").read_text())
          assert p["base_profile"] == "ALLOC_G_CORE_FAMILY_050"
          g=p["governance"]
          assert g["consumed_evidence_only"] is True
          assert g["entry_changed"] is False
          assert g["initial_stop_changed"] is False
          assert g["initial_stop_widening"] is False
          assert g["target_changed"] is False
          assert g["lifecycle_changed"] is False
          assert g["protective_swing_confirmed_on_closed_m1"] is True
          assert g["protective_stop_effective_next_bar"] is True
          assert g["single_protective_stop_move_max"] is True
          assert g["full_structural_target_plan_only"] is True
          assert g["rearm_recomputed_after_managed_exit"] is True
          assert g["uses_terminal_pnl_at_runtime"] is False
          assert g["uses_fold_identity_at_runtime"] is False
          assert g["uses_calendar_time_at_runtime"] is False
          assert g["opens_new_holdout"] is False
          assert g["policy_promoted"] is False
          assert g["candidate_certified"] is False
          assert g["live_authorized"] is False
          assert g["production_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-r5-core-breaker-protection-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-nas100-r5-core-breaker-protection-*-${{ github.sha }}
          path: input
          merge-multiple: true

      - name: Aggregate structural protection
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from pathlib import Path

          folds={}
          for path in Path("input").glob("core-breaker-protection-*.json"):
              p=json.loads(path.read_text())
              folds[p["partition"]]=p
          assert set(folds)=={"r5","r6","r8","consumed_holdout"}

          names=set(next(iter(folds.values()))["variants"])
          passing=[]
          summary={}
          for name in sorted(names):
              per_fold={}
              all_pass=True
              for fold,payload in sorted(folds.items()):
                  item=payload["variants"][name]
                  passed=bool(item["passes_all_objectives"])
                  all_pass=all_pass and passed
                  per_fold[fold]={
                      "trade_count":item["trade_count"],
                      "first_trade_count":item["first_trade_count"],
                      "rearm_trade_count":item["rearm_trade_count"],
                      "protection_applied_count":item["protection_applied_count"],
                      "protected_exit_reasons":item["protected_exit_reasons"],
                      "metrics":item["metrics"],
                      "monte_carlo":item["monte_carlo"],
                      "annual_blocks":item["annual_blocks"],
                      "objectives":item["objectives"],
                      "passes_all_objectives":passed,
                  }
              if all_pass:
                  passing.append(name)
              summary[name]=per_fold

          report={
              "schema":"qore.vt31.nas100.r5.core_breaker_structural_protection_frontier.aggregate.v1",
              "base_profile":"ALLOC_G_CORE_FAMILY_050",
              "development_passing":passing,
              "variant_summary":summary,
              "governance":{
                  "consumed_evidence_only":True,
                  "policy_promoted":False,
                  "opens_new_holdout":False,
                  "candidate_certified":False,
              },
          }
          Path("result/aggregate.json").write_text(
              json.dumps(report,sort_keys=True,indent=2)+"\n"
          )
          print(json.dumps(report,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-r5-core-breaker-protection-aggregate-${{ github.sha }}
          path: result/
          retention-days: 90
