name: QORE Shared Integrator B Observability Closure

on:
  push:
    branches:
      - agent/shared-integration-b-observability-001
  pull_request:
    paths:
      - "src/qore/infrastructure/core_stack_v2/shared_b_core_broker_observability.py"
      - "src/qore/infrastructure/core_stack_v2/shared_b_sensor_blindspot_engine.py"
      - "src/qore/infrastructure/core_stack_v2/shared_b_unknown_world.py"
      - "tests/infrastructure/test_shared_b_core_broker_observability.py"
      - "tests/infrastructure/test_shared_b_sensor_blindspot_engine.py"
      - "tests/infrastructure/test_shared_b_unknown_world.py"
      - "scripts/shared_b_core_broker_real_replication.py"
      - "scripts/shared_b_blindspot_inventory_audit.py"
      - ".github/workflows/qore-shared-integrator-b-observability-validation.yml"

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ctrader]"
      - name: Static and unit validation
        run: |
          set -euo pipefail
          ruff check             src/qore/infrastructure/core_stack_v2/shared_b_core_broker_observability.py             src/qore/infrastructure/core_stack_v2/shared_b_sensor_blindspot_engine.py             src/qore/infrastructure/core_stack_v2/shared_b_unknown_world.py             tests/infrastructure/test_shared_b_core_broker_observability.py             tests/infrastructure/test_shared_b_sensor_blindspot_engine.py             tests/infrastructure/test_shared_b_unknown_world.py             scripts/shared_b_core_broker_real_replication.py             scripts/shared_b_blindspot_inventory_audit.py
          mypy             src/qore/infrastructure/core_stack_v2/shared_b_core_broker_observability.py             src/qore/infrastructure/core_stack_v2/shared_b_sensor_blindspot_engine.py             src/qore/infrastructure/core_stack_v2/shared_b_unknown_world.py
          pytest -q             tests/infrastructure/test_shared_b_core_broker_observability.py             tests/infrastructure/test_shared_b_sensor_blindspot_engine.py             tests/infrastructure/test_shared_b_unknown_world.py
      - name: Recover sealed terminal evidence
        run: |
          set -euo pipefail
          mkdir -p evidence/b18 evidence/b19 evidence/b20
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11120521150/zip" > b18.zip
          unzip -q b18.zip -d evidence/b18
          (cd evidence/b18 && sha256sum -c SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11120391213/zip" > b19.zip
          unzip -q b19.zip -d evidence/b19
          (cd evidence/b19 && sha256sum -c SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11119388121/zip" > b20.zip
          unzip -q b20.zip -d evidence/b20
          (cd evidence/b20 && sha256sum -c SHA256SUMS)
      - name: Verify combined closure claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from qore.infrastructure.core_stack_v2.shared_zero_open_work import (
              SharedWorkState,
              build_shared_master_open_work_ledger,
          )

          b18=json.loads(Path("evidence/b18/shared-b-core-broker-real-replication.json").read_text())
          assert b18["status"] == "REAL_READ_ONLY_CORE_BROKER_REPLICATION_PASS"
          assert b18["core_runtime_executed"] is True
          assert b18["core_runtime_deterministic_rebuild"] is True
          assert b18["broker_mutation"] is False
          assert b18["productive_authority"] is False

          b19=json.loads(Path("evidence/b19/shared-b-blindspot-declared-scope-inventory.json").read_text())
          assert b19["status"] == "DECLARED_SCOPE_INVENTORY_COMPLETE_OPEN_WORLD_PRESERVED"
          assert b19["provider_sensor_inventory_count"] == 177
          assert b19["agricultural_requirement_count"] == 16
          assert b19["coverage_inventory_complete"] is True
          assert b19["open_world_boundary"] is True
          assert b19["all_unknown_unknowns_eliminated"] is False
          assert b19["productive_authority"] is False

          b20=json.loads(Path("evidence/b20/shared-b-observability-blindspot-unknown-world.json").read_text())
          assert b20["unknown_world_semantics_contract_pass"] is True
          assert b20["second_order_blindspot_engine_contract_pass"] is True
          assert b20["fresh_holdout_opened"] is False
          assert b20["broker_mutation"] is False
          assert b20["productive_authority"] is False

          by_id={item.work_id:item for item in build_shared_master_open_work_ledger()}
          assert by_id["MC-28"].state is not SharedWorkState.COMPLETED_AND_PROVEN
          PY
