name: QORE Capitalizer Historical Bid Ask Census V1

on:
  push:
    branches:
      - agent/capitalizer-ctrader-bidask-census-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-historical-bidask-census-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_ctrader_historical_bidask_availability_census_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_ctrader_historical_bidask_availability_census_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-historical-bidask-census-v1-${{ github.ref }}
  cancel-in-progress: true

env:
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
  QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_ctrader_historical_bidask_availability_census_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_ctrader_historical_bidask_availability_census_v1.py
      - name: Mypy
        run: |
          mypy src/qore/infrastructure/trader_lab/capitalizer_ctrader_historical_bidask_availability_census_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_ctrader_historical_bidask_availability_census_v1.py

  census:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol: [USDJPY, AUDJPY, AUDUSD, GBPJPY, EURUSD, GBPUSD, XAUUSD, USDCAD, NAS100]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[ctrader]'
      - name: Verify read-only cTrader inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in QORE_CTRADER_CLIENT_ID QORE_CTRADER_CLIENT_SECRET QORE_CTRADER_ACCESS_TOKEN QORE_CTRADER_REFRESH_TOKEN; do
            test -n "${!name:-}" || { echo "missing required read-only DEMO input: $name" >&2; exit 2; }
          done
      - name: Discover DEMO account when not configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            if ! [[ "$account_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "cTrader DEMO account discovery returned invalid id" >&2
              exit 3
            fi
            echo "::add-mask::$account_id"
            printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          fi
      - name: Run metadata-only consumed-period Bid Ask census
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_ctrader_historical_bidask_availability_census_v1 \
            market "${{ matrix.symbol }}" census-output
      - name: Enforce metadata-only boundary
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report=json.loads(
              Path(
                  "census-output/"
                  "capitalizer-ctrader-bidask-availability-census-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_CTRADER_HISTORICAL_BID_ASK_AVAILABILITY_CENSUS_V1"
          )
          assert report["canonical_symbol"] == os.environ["SYMBOL"]
          assert report["anchor_count"] == 6
          assert report["request_count"] == 12
          assert report["prices_retained"] is False
          assert report["spread_computed"] is False
          assert report["trade_outcomes_read"] is False
          assert report["fresh_holdout_touched"] is False
          assert report["cost_certification_satisfied"] is False
          print(json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-bidask-census-${{ matrix.symbol }}-${{ github.sha }}
          path: census-output
          if-no-files-found: error
          retention-days: 90

  matrix:
    needs: census
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-bidask-census-*-${{ github.sha }}
          path: census-input
          merge-multiple: false
      - name: Build availability matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_ctrader_historical_bidask_availability_census_v1 \
            matrix census-input
      - name: Enforce no cost claim
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(
              Path(
                  "census-input/matrix-output/"
                  "capitalizer-ctrader-bidask-availability-matrix-v1.json"
              ).read_text()
          )
          assert report["market_count"] == 9
          assert report["anchor_count_per_market"] == 6
          assert report["prices_retained"] is False
          assert report["spread_computed"] is False
          assert report["trade_outcomes_read"] is False
          assert report["fresh_holdout_touched"] is False
          assert report["cost_certification_satisfied"] is False
          print(json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-bidask-availability-matrix-v1-${{ github.sha }}
          path: census-input/matrix-output
          if-no-files-found: error
          retention-days: 90
