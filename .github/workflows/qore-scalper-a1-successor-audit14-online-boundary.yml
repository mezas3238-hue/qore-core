name: Scalper A1 Successor Audit14 Online Boundary

on:
  push:
    branches:
      - agent/scalper-successor-a1-online-handoff-20261010
    paths:
      - '.github/workflows/qore-scalper-a1-successor-audit14-online-boundary.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_a1_audit14_online_predecision_bridge_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_a1_audit14_online_predecision_bridge_v1.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated_online_boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python quality requirements
        run: python -m pip install -e '.[dev]'
      - name: Source and tests Ruff
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_a1_audit14_online_predecision_bridge_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_a1_audit14_online_predecision_bridge_v1.py
      - name: Production source Mypy
        run: mypy src/qore/infrastructure/trader_lab/capitalizer_a1_audit14_online_predecision_bridge_v1.py
      - name: Fail-closed negative regression fixtures
        run: |
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_a1_audit14_online_predecision_bridge_v1.py
