name: QORE VT08 Cognitive Core Stack Robustness V1

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vt08-cognitive-expansion-5m-v1-001
    paths:
      - .github/workflows/vt08-cognitive-core-stack-robustness-v1.yml

permissions:
  contents: read
  actions: read

jobs:
  robustness:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        symbol: [EURJPY, NZDUSD, CADJPY]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Download immutable 1095d evidence artifact
        uses: actions/download-artifact@v4
        with:
          name: qore-vt08-cognitive-5m-fresh-${{ matrix.symbol }}-b2d33e1b4829d8b4afc76983decca8a99131403c
          path: evidence/${{ matrix.symbol }}
          github-token: ${{ github.token }}
          run-id: 35934924907
      - name: Run frozen robustness suite
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from qore.infrastructure.trader_lab.vt08_cognitive_core_stack_robustness_v1 import (
              evaluate,
          )

          symbol = os.environ["SYMBOL"]
          path = Path(f"evidence/{symbol}/market-evidence-1095d.json")
          report = evaluate(path)
          out = Path(f"artifacts/{symbol}-core-stack-robustness.json")
          out.write_text(
              json.dumps(report, sort_keys=True, separators=(",", ":")),
              encoding="utf-8",
          )
          print(json.dumps({
              "market": report["market"],
              "trade_count": report["trade_count"],
              "full_metrics": report["full_metrics"],
              "monte_carlo": report["monte_carlo"],
              "stress_002": report["stress"]["0.02"],
              "remove_top_1": report["extreme_winner_dependence"]["remove_top_1"],
              "gates": report["gates"],
              "decision": report["decision"],
          }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-core-stack-robustness-${{ matrix.symbol }}-${{ github.sha }}
          path: artifacts/${{ matrix.symbol }}-core-stack-robustness.json
          if-no-files-found: error
          retention-days: 30
