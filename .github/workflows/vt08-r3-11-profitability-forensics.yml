name: QORE VT-08 R3.11 Profitability Forensics

on:
  push:
    branches:
      - agent/vt08-r3-11-profitability-forensics-001
    paths:
      - .github/workflows/vt08-r3-11-profitability-forensics.yml
      - tests/infrastructure/traders/test_vt08_b01_r3_11_profitability_forensics.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror-symmetry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact R3.11 head
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff gate
        run: ruff check tests/infrastructure/traders/test_vt08_b01_r3_11_profitability_forensics.py
      - name: Mypy gate
        run: mypy src tests/infrastructure/traders/test_vt08_b01_r3_11_profitability_forensics.py
      - name: VT-08 mirror symmetry gate
        run: |
          pytest -q \
            tests/infrastructure/traders/test_vt08_b01_r3_11_profitability_forensics.py \
            tests/infrastructure/traders/test_vt08_b01_r3_8.py
