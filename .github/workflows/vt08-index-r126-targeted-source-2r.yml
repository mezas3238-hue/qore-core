name: VT08 Index R126 Targeted Source 2R

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r126-targeted-source-2r.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r126_targeted_source_2r.py
      - tests/infrastructure/trader_lab/test_vt08_index_r126_targeted_source_2r.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r126_targeted_source_2r.py

  ablation:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R126 targeted source-authorized 2R ablation
        run: |
          mkdir -p artifacts/report
          python -m qore.infrastructure.trader_lab.vt08_index_r126_targeted_source_2r \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r126-targeted-source-2r.json

      - name: Verify R126 frozen ablation contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/"
                  "vt08-index-r126-targeted-source-2r.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R126_TARGETED_SOURCE_AUTHORIZED_2R_ABLATION_001"
          )
          assert report["source_r125"]["run_id"] == 36059043366
          assert report["source_r125"]["artifact_id"] == 10834116084
          assert report["source_r125"]["artifact_digest"] == (
              "sha256:203ac657aefac8762fb3f38c66f90931"
              "21626d5ed7460cea48fdc596b61c0192"
          )

          expected = {
              "five_year": (2448, 1756, 235),
              "recent_two_year": (1017, 746, 110),
              "r66_failed_holdout": (773, 546, 101),
          }
          for key, (canonical, standard, target) in expected.items():
              section = report[key]
              assert section["canonical_sample"] == canonical
              assert section["standard_sample"] == standard
              assert section["target_state_sample"] == target
              assert section["source_target_r"] == "2"
              assert section["full_portfolio"]["baseline_2_5r"]["sample"] == canonical
              assert (
                  section["full_portfolio"]["targeted_source_2r"]["sample"]
                  == canonical
              )

          contract = report["source_contract"]
          assert contract["source_target_r"] == "2"
          assert contract["canonical_research_target_r"] == "2.5"
          assert contract["target_grid_searched"] is False
          assert contract["entry_changed"] is False
          assert contract["protected_swing_stop_changed"] is False
          assert contract["signal_surface_changed"] is False
          assert contract["signals_suppressed"] is False

          gov = report["governance"]
          assert gov["research_only"] is True
          assert gov["single_preregistered_variant"] is True
          assert gov["signals_suppressed"] is False
          assert gov["trade_count_changed"] is False
          assert gov["entry_changed"] is False
          assert gov["protected_swing_stop_changed"] is False
          assert gov["risk_changed"] is False
          assert gov["candidate_created"] is False
          assert gov["live_authorized"] is False
          assert gov["real_capital_authorized"] is False
          assert gov["production_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r126-targeted-source-2r-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
