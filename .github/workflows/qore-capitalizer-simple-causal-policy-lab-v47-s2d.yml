name: QORE Capitalizer Simple Causal Policy Lab V47 S2D

on:
  push:
    branches:
      - agent/capitalizer-canonical-source-remediation-v47-s2-001
    paths:
      - '.github/workflows/qore-capitalizer-simple-causal-policy-lab-v47-s2d.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_simple_causal_policy_lab_v47_s2d.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_simple_causal_policy_lab_v47_s2d.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_S2A_RUN_ID: '36642644284'
  SOURCE_S2A_SHA: 'ff6c9745690dde76520aecf608e44401622a1074'
  SOURCE_S2B_RUN_ID: '36651366703'
  SOURCE_S2B_SHA: '59d826f3b24031e52e6c0f32e8cca1ecfb4d0524'

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Quality
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_simple_causal_policy_lab_v47_s2d.py \
            tests/infrastructure/trader_lab/test_capitalizer_simple_causal_policy_lab_v47_s2d.py
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_simple_causal_policy_lab_v47_s2d.py
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_simple_causal_policy_lab_v47_s2d.py
      - name: Download frozen S2-A population
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-v47-s2a-aggregate-${{ env.SOURCE_S2A_SHA }}
          path: s2a
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_S2A_RUN_ID }}
      - name: Download frozen S2-B economics
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-v47-s2b-aggregate-${{ env.SOURCE_S2B_SHA }}
          path: s2b
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_S2B_RUN_ID }}
      - name: Run Development-only simple policy lab
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_simple_causal_policy_lab_v47_s2d \
            s2a s2b \
            --output lab-output
      - name: Enforce no cross-period selection leakage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          row=json.loads(
              Path("lab-output/capitalizer-v47-s2d-simple-policy-lab.json").read_text()
          )
          assert row["identity"] == "QORE_CAPITALIZER_V47_S2D_SIMPLE_CAUSAL_ADMISSION_POLICY_LAB"
          assert row["predeclaration_comment_id"] == 5902089060
          assert row["source_s2a_run_id"] == 36642644284
          assert row["source_s2b_run_id"] == 36651366703
          assert row["validation_used_for_policy_selection"] is False
          assert row["reserved_used_for_policy_selection"] is False
          assert row["fresh_holdout_opened"] is False
          assert row["rule_promoted_to_final_trader"] is False
          assert row["trader_certified"] is False
          assert row["decision"] in {
              "SIMPLE_CAUSAL_POLICY_FAMILY_FALSIFIED",
              "DEVELOPMENT_POLICY_FROZEN_FOR_CONSUMED_TRANSPORT",
          }
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v47-s2d-simple-policy-lab-${{ github.sha }}
          path: lab-output
          if-no-files-found: error
          retention-days: 90
