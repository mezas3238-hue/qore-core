name: QORE Native thirtieth source CHFJPY original cTrader M5 G0

on:
  push:
    branches:
      - research/qore-native-cohort30-chfjpy-sha-g0-20261012
    paths:
      - '.github/workflows/qore-native-cohort30-chfjpy-g0.yml'
      - 'src/qore/infrastructure/trader_lab/qore_native_cohort30_chfjpy_m5_g0_v1.py'
      - 'tests/infrastructure/trader_lab/test_qore_native_cohort30_chfjpy_m5_g0_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-native-chfjpy30-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: |
          ruff check --select F,E4,E7,E9 src/qore/infrastructure/trader_lab/qore_native_cohort30_chfjpy_m5_g0_v1.py tests/infrastructure/trader_lab/test_qore_native_cohort30_chfjpy_m5_g0_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_qore_native_cohort30_chfjpy_m5_g0_v1.py

  original_chfjpy_11years:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Original IC Markets DEMO native M5 CHFJPY source read-only
        uses: actions/download-artifact@v4
        with:
          name: qore-native-icmarkets-10Y-provider-M5-CHFJPY-e0ca5a13c866a19d8505c68cffc473598984b340
          run-id: '38193802541'
          github-token: ${{ github.token }}
          path: original-chfjpy
      - name: Audit 11-year RAW SHA, QUALITY SHA, provider identity and M5 timestamps
        run: |
          python -m qore.infrastructure.trader_lab.qore_native_cohort30_chfjpy_m5_g0_v1 audit original-chfjpy chfjpy-proof
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("chfjpy-proof/qore-native-added-CHFJPY-30.json").read_text())
          assert d["status"]=="G0_NEW_PROVIDER_M5_SHA_PASS"
          assert d["symbol"]=="CHFJPY"
          assert d["m5_bars"]>0
          assert len(d["years"])==11
          assert d["source_integrity_checked"] is True
          assert d["ohlc_prices_returns_or_pnl_analyzed"] is False
          assert d["g1_net_authorized"] is False
          PY
          printf '%s\n' "$GITHUB_SHA" > chfjpy-proof/exact-head-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-native-30-chfjpy-sha-${{ github.sha }}
          path: chfjpy-proof/
          retention-days: 90
          if-no-files-found: warn

  union30:
    needs: original_chfjpy_11years
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: qore-native-unified29-source-c550e2f12195a018494a1c580c371dca21941a99
          run-id: '38205083910'
          github-token: ${{ github.token }}
          path: immutable29
      - uses: actions/download-artifact@v4
        with:
          name: qore-native-30-chfjpy-sha-${{ github.sha }}
          path: signed-chfjpy
      - name: Sign immutable source-only 30 market manifest
        run: |
          python -m qore.infrastructure.trader_lab.qore_native_cohort30_chfjpy_m5_g0_v1 combine immutable29 signed-chfjpy unified30
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("unified30/qore-native-unified-30-m5.json").read_text())
          assert d["market_count"]==30
          assert d["parent_29_bars"]==21396360
          assert d["ohlc_outcomes_not_read"] is True
          assert d["net_certification_authorized"] is False
          assert d["production_untouched"] is True
          assert d["traders_certified"]==0
          PY
          printf '%s\n' "$GITHUB_SHA" > unified30/code-head-sha.txt
          (cd unified30 && sha256sum qore-native-unified-30-m5.json code-head-sha.txt > OUTPUT_SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-native-unified30-source-${{ github.sha }}
          path: unified30/
          retention-days: 90
          if-no-files-found: error
