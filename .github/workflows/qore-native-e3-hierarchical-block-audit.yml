name: QORE Native E3 method-level 1 2 4-week bootstrap and descriptive shrinkage

on:
  push:
    branches:
      - research/qore-native-e3-hierarchical-block-bootstrap-20261012
    paths:
      - '.github/workflows/qore-native-e3-hierarchical-block-audit.yml'
      - 'src/qore/infrastructure/trader_lab/qore_native_e3_multiblock_method_shrinkage_v1.py'
      - 'tests/infrastructure/trader_lab/test_qore_native_e3_multiblock_method_shrinkage_v1.py'
      - 'docs/research/QORE_NATIVE_E3_POSTHOC_HIERARCHICAL_BLOCK_BOOTSTRAP_PROTOCOL_2026-10-12.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-native-e3-multiblock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate_and_aggregate_original_e1_outcomes_only:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research numerical and static validation only
        run: python -m pip install -e '.[dev]' 'numpy>=2,<3'
      - name: Verify posthoc analysis specification ancestor and causal tests
        run: |
          set -euo pipefail
          git cat-file -e 2a053e762268c2f4f22238d200599a7adf4726f7^{commit}
          git merge-base --is-ancestor 2a053e762268c2f4f22238d200599a7adf4726f7 "$GITHUB_SHA"
          test -s docs/research/QORE_NATIVE_E3_POSTHOC_HIERARCHICAL_BLOCK_BOOTSTRAP_PROTOCOL_2026-10-12.md
          ruff check --select F,E4,E7,E9 src/qore/infrastructure/trader_lab/qore_native_e3_multiblock_method_shrinkage_v1.py tests/infrastructure/trader_lab/test_qore_native_e3_multiblock_method_shrinkage_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_qore_native_e3_multiblock_method_shrinkage_v1.py
      - name: Download 33 signed original E1 outcomes from one exact tested SHA (NO M5)
        uses: actions/download-artifact@v4
        with:
          pattern: qore-native-e1-seven-*-dfe78f115957a40f4188c30e78bd7f88c2ce6c42
          run-id: '38257207836'
          github-token: ${{ github.token }}
          path: original-e1-signed-33
      - name: Seven method posthoc sensitivity preserving multiseason cross-asset covariance
        run: |
          set -euo pipefail
          python -m qore.infrastructure.trader_lab.qore_native_e3_multiblock_method_shrinkage_v1 original-e1-signed-33 e3-signed-output
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("e3-signed-output/qore-native-e3-seven-method-block-shrinkage-posthoc.json").read_text())
          assert x["identity"]=="QORE_NATIVE_E3_POSTHOC_SEVEN_METHOD_MULTIWEEK_SHRINKAGE_V1"
          assert x["source_e1_code_head"]=="dfe78f115957a40f4188c30e78bd7f88c2ce6c42"
          assert x["source_33_signed_market_witnesses"]==33
          assert x["source_7_methods_per_market"]==7 and x["total_cells_source"]==231
          assert x["original_2024_plus_OHLC_unopened"] and x["traders_certified"]==0
          assert x["no_new_raw_provider_prices_downloaded"]
          for key in ("development","temporal_diagnostic"):
              p=x[key]
              assert p["cell_count"]==231 and p["markets"]==33
              assert len(p["all_231_market_shrinkage_descriptors"])==231
              assert set(p["block_sensitivities"])=={"1","2","4"}
              for block in p["block_sensitivities"].values():
                  assert len(block["seven_methods"])==7
                  assert len(block["four_families_by_method_descriptive"])==28
                  assert block["common_week_calendar_across_231"]
                  assert block["replicates"]==4000
          assert len(x["cross_period_seven_method_descriptive_screen"])==7
          PY
          printf '%s\n' "$GITHUB_SHA" > e3-signed-output/exact-E3-code-head-sha.txt
          (cd e3-signed-output && sha256sum qore-native-e3-seven-method-block-shrinkage-posthoc.json exact-E3-code-head-sha.txt > OUTPUT_SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-native-e3-original33-seven-method-robustness-${{ github.sha }}
          path: e3-signed-output/
          retention-days: 90
          if-no-files-found: error
