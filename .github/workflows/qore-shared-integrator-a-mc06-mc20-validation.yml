name: QORE Shared Integrator A MC06 MC20 Validation

on:
  push:
    branches:
      - agent/shared-integration-a-mc06-mc20-001
  pull_request:
    paths:
      - "src/qore/infrastructure/core_stack_v2/latent_state_reconstruction.py"
      - "src/qore/infrastructure/core_stack_v2/stability_engine.py"
      - "src/qore/infrastructure/core_stack_v2/stability_operational_binding.py"
      - "src/qore/infrastructure/core_stack_v2/shared_zero_open_work.py"
      - "tests/infrastructure/test_core_stack_v2_latent_state_reconstruction.py"
      - "tests/infrastructure/test_core_stack_v2_stability_engine.py"
      - "tests/infrastructure/test_core_stack_v2_stability_operational_binding.py"
      - "scripts/shared_mc06_latent_state_real_replay.py"
      - "scripts/shared_mc06_latent_state_temporal_stability.py"
      - "scripts/shared_mc20_stability_engine_real_replay.py"
      - "scripts/shared_mc20_operational_stability_binding.py"
      - ".github/workflows/qore-shared-integrator-a-mc06-mc20-validation.yml"

concurrency:
  group: qore-shared-integrator-a-mc06-mc20-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Static and unit validation
        run: |
          set -euo pipefail
          ruff check             src/qore/infrastructure/core_stack_v2/latent_state_reconstruction.py             src/qore/infrastructure/core_stack_v2/stability_engine.py             src/qore/infrastructure/core_stack_v2/stability_operational_binding.py             src/qore/infrastructure/core_stack_v2/shared_zero_open_work.py             tests/infrastructure/test_core_stack_v2_latent_state_reconstruction.py             tests/infrastructure/test_core_stack_v2_stability_engine.py             tests/infrastructure/test_core_stack_v2_stability_operational_binding.py             scripts/shared_mc06_latent_state_real_replay.py             scripts/shared_mc06_latent_state_temporal_stability.py             scripts/shared_mc20_stability_engine_real_replay.py             scripts/shared_mc20_operational_stability_binding.py
          mypy             src/qore/infrastructure/core_stack_v2/latent_state_reconstruction.py             src/qore/infrastructure/core_stack_v2/stability_engine.py             src/qore/infrastructure/core_stack_v2/stability_operational_binding.py
          pytest -q             tests/infrastructure/test_core_stack_v2_latent_state_reconstruction.py             tests/infrastructure/test_core_stack_v2_stability_engine.py             tests/infrastructure/test_core_stack_v2_stability_operational_binding.py             tests/infrastructure/test_core_stack_v2_shared_zero_open_work.py
      - name: Verify canonical ledger closure boundaries
        run: |
          python - <<'PY'
          from qore.infrastructure.core_stack_v2.shared_zero_open_work import (
              SharedWorkState,
              build_shared_master_open_work_ledger,
          )
          by_id={item.work_id:item for item in build_shared_master_open_work_ledger()}
          assert by_id["MC-06"].state is SharedWorkState.COMPLETED_AND_PROVEN
          assert by_id["MC-20"].state is SharedWorkState.COMPLETED_AND_PROVEN
          assert by_id["MC-28"].state is not SharedWorkState.COMPLETED_AND_PROVEN
          PY
      - name: Recover sealed terminal evidence
        run: |
          set -euo pipefail
          mkdir -p input/mc06 input/mc20
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11125192281/zip" > mc06.zip
          unzip -q mc06.zip -d input/mc06
          (cd input/mc06 && sha256sum -c SHA256SUMS)
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11125287784/zip" > mc20.zip
          unzip -q mc20.zip -d input/mc20
          (cd input/mc20 && sha256sum -c SHA256SUMS)
      - name: Verify terminal scientific claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          mc06=json.loads(
              Path("input/mc06/mc06-latent-state-temporal-stability.json").read_text()
          )
          assert mc06["status"] == "MC06_LATENT_STATE_TEMPORAL_STABILITY_PASS"
          assert mc06["mc06_completed_and_proven"] is True
          assert mc06["future_market_used"] is False
          assert mc06["outcome_used"] is False
          assert mc06["protected_certification_holdout_opened"] is False

          mc20=json.loads(
              Path("input/mc20/mc20-operational-stability-binding.json").read_text()
          )
          assert mc20["status"] == "MC20_STABILITY_ENGINE_COMPLETED_AND_PROVEN"
          assert mc20["qore_core_operational_telemetry_bound"] is True
          assert mc20["provider_broker_operational_telemetry_bound"] is True
          assert mc20["domains_distinct"] is True
          assert mc20["market_price_used_as_core_health_proxy"] is False
          assert mc20["market_price_used_as_provider_health_proxy"] is False
          assert mc20["same_timestamp_cross_domain_fusion_claimed"] is False
          assert mc20["productive_authority"] is False
          assert mc20["mc20_completed_and_proven"] is True
          assert mc20["protected_certification_holdout_opened"] is False
          PY
