name: QORE CIBO Phase22 Fresh Capital Projection

on:
  push:
    branches:
      - agent/cibo-integrator-ab-001
    paths:
      - '.github/workflows/cibo-phase22-fresh-capital-projection.yml'
      - 'src/qore/infrastructure/cibo_phase22_fresh_capital_projection.py'
      - 'src/qore/infrastructure/cibo_phase22_provider_numeric_execution.py'
      - 'src/qore/infrastructure/cibo_phase22_fresh_opportunity_batch.py'
      - 'tests/infrastructure/test_cibo_phase22_fresh_capital_projection.py'
  pull_request:
    paths:
      - '.github/workflows/cibo-phase22-fresh-capital-projection.yml'
      - 'src/qore/infrastructure/cibo_phase22_fresh_capital_projection.py'
      - 'tests/infrastructure/test_cibo_phase22_fresh_capital_projection.py'

permissions:
  contents: read

jobs:
  projection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Validate outcome-blind provider-normalized capital projection
        run: |
          ruff check \
            src/qore/infrastructure/cibo_phase22_fresh_capital_projection.py \
            tests/infrastructure/test_cibo_phase22_fresh_capital_projection.py
          mypy \
            src/qore/infrastructure/cibo_phase22_fresh_capital_projection.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_phase22_fresh_capital_projection.py
