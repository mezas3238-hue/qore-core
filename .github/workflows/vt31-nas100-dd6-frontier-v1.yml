name: QORE VT31 NAS100 DD6 Frontier V1

on:
  push:
    branches:
      - agent/vt31-nas100-intelligence-pilot-001
    paths:
      - scripts/vt31_nas100_causal_hybrid_rearm_v1.py
      - .github/workflows/vt31-nas100-dd6-frontier-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  QORE_DD6_FRONTIER_ONLY: "1"

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
          - partition: r8_fresh
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Static gate
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_causal_hybrid_rearm_v1.py
          ruff check scripts/vt31_nas100_causal_hybrid_rearm_v1.py
      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p evidence result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d evidence
          path="evidence/fresh/NAS100/market-evidence.json"
          test -f "$path"
          actual="$(sha256sum "$path" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"
      - name: Run focused DD6 frontier
        run: |
          set -euo pipefail
          python scripts/vt31_nas100_causal_hybrid_rearm_v1.py             evidence/fresh/NAS100/market-evidence.json             --partition "$PARTITION"             --output "result/dd6-${PARTITION}.json"             | tee result/summary.json
      - name: Governance gate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=os.environ["PARTITION"]
          payload=json.loads(Path(f"result/dd6-{p}.json").read_text())
          g=payload["governance"]
          assert g["dd6_frontier_only"] is True
          assert g["global_risk_scalar_uses_terminal_pnl"] is False
          assert g["global_risk_scalar_uses_fold_identity"] is False
          assert g["global_risk_scalar_changes_trade_count"] is False
          assert g["adaptive_rearm_budget_uses_prior_activity_only"] is True
          assert g["policy_promoted"] is False
          assert g["opens_new_holdout"] is False
          PY
      - name: Bind
        run: |
          set -euo pipefail
          echo "$GITHUB_SHA" > result/git-sha.txt
          echo "$ARTIFACT_ID" > result/source-evidence-artifact-id.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd result && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-dd6-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-nas100-dd6-*-${{ github.sha }}
          path: input
          merge-multiple: true
      - name: Aggregate DD6 gate
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from pathlib import Path

          folds={}
          for path in Path("input").glob("dd6-*.json"):
              p=json.loads(path.read_text())
              folds[p["partition"]]=p
          assert set(folds)=={"r5","r6","r8_fresh"},folds.keys()

          common=set.intersection(*[
              set(p["variants"]) for p in folds.values()
          ])
          rows=[]
          for name in sorted(common):
              if "RISK_SCALAR_" not in name:
                  continue
              fold_rows=[]
              for fold,p in sorted(folds.items()):
                  item=p["variants"][name]
                  fold_rows.append({
                      "partition":fold,
                      "trade_count":item["trade_count"],
                      "pf":item["metrics"]["profit_factor"],
                      "dd":item["metrics"]["max_drawdown_r"],
                      "mc_positive":item["monte_carlo"]["positive_terminal_probability"],
                      "mc_p95_dd":item["monte_carlo"]["p95_max_drawdown_r"],
                  })
              passes=all(
                  300 <= r["trade_count"] <= 350
                  and r["pf"] is not None
                  and float(r["pf"]) >= 2.0
                  and float(r["dd"]) <= 6.0
                  and float(r["mc_positive"]) >= 0.90
                  and float(r["mc_p95_dd"]) <= 15.0
                  for r in fold_rows
              )
              rows.append({"variant":name,"folds":fold_rows,"passes":passes})

          report={
              "schema":"qore.vt31.nas100.dd6_frontier.aggregate.v1",
              "objective":{
                  "trade_count":"300-350",
                  "profit_factor_floor":"2.0",
                  "observed_dd_ceiling_r":"6.0",
                  "mc_positive_floor":"0.90",
                  "mc_p95_dd_ceiling_r":"15.0",
              },
              "variants":rows,
              "passing":[r["variant"] for r in rows if r["passes"]],
              "policy_promoted":False,
              "opens_new_holdout":False,
              "live_authorized":False,
              "production_authorized":False,
          }
          Path("result/dd6-aggregate.json").write_text(
              json.dumps(report,sort_keys=True,indent=2)+"\n"
          )
          print(json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-dd6-aggregate-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
