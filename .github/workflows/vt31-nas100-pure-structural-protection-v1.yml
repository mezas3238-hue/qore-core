name: QORE VT31 NAS100 Pure Structural Protection V1
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  push:
    branches:
      - agent/vt31-edge-position-cert-b-001
    paths:
      - scripts/vt31_nas100_pure_structural_protection_v1.py
      - scripts/vt31_nas100_pure_market_exit_baseline_v1.py
      - .github/workflows/vt31-nas100-pure-structural-protection-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Static gate
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_pure_structural_protection_v1.py
          ruff check scripts/vt31_nas100_pure_structural_protection_v1.py

      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"

      - name: Run pure structural protection
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python scripts/vt31_nas100_pure_structural_protection_v1.py             "input/${EVIDENCE_PATH}"             --partition "${PARTITION}"             --output "result/pure-protection-${PARTITION}.json"             | tee "result/summary-${PARTITION}.json"

      - name: Sovereign governance gate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=os.environ["PARTITION"]
          x=json.loads(Path(f"result/pure-protection-{p}.json").read_text())
          r=x["runtime_governance"]
          for key in (
              "r_used_for_admission",
              "r_used_for_entry",
              "r_used_for_invalidation",
              "r_used_for_stop_movement",
              "r_used_for_breakeven",
              "r_used_for_target",
              "r_used_for_exit",
              "r_used_for_trailing",
              "r_used_for_partials",
              "r_used_for_volume",
              "sizing_used",
              "leverage_used",
              "compounding_used",
              "capital_weighting_used",
          ):
              assert r[key] is False, key
          assert r["volume_agnostic"] is True
          assert r["r_role"] == "post_trade_evaluation_only"
          g=x["governance"]
          assert g["runtime_r_thresholds_used"] is False
          assert g["protection_source"] == "confirmed-M1-protective-swing"
          assert g["maximum_structural_protection_moves"] == 1
          assert g["opens_new_holdout"] is False
          assert g["live_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-pure-structural-protection-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-pure-structural-protection-*-${{ github.sha }}
          path: input
          merge-multiple: true

      - name: Adjudicate sovereign structural survivor
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          folds=("r5","r6","r8","consumed")
          baseline="PURE_MARKET_BASELINE"
          candidate="LBB_PATH_SHALLOW_PS1_PURE"
          payloads={
              f:json.loads(Path(f"input/pure-protection-{f}.json").read_text())
              for f in folds
          }
          def d(v): return Decimal(str(v))
          report={}
          all_fold=True
          temporal_all=True
          for f in folds:
              b=payloads[f]["variant_reports"][baseline]
              c=payloads[f]["variant_reports"][candidate]
              bm=b["normalized_metrics"]
              cm=c["normalized_metrics"]
              w=c["winner_preservation_vs_pure_baseline"]
              gates={
                  "pf_nondegrade":(
                      bm["profit_factor"] is not None
                      and cm["profit_factor"] is not None
                      and d(cm["profit_factor"])>=d(bm["profit_factor"])
                  ),
                  "mean_nondegrade":d(cm["mean_r"])>=d(bm["mean_r"]),
                  "dd_nondegrade":d(cm["max_drawdown_r"])<=d(bm["max_drawdown_r"]),
                  "winner_count_ge_80":d(w["winner_count_preservation"])>=d("0.80"),
                  "winner_r_ge_90":d(w["winner_r_preservation"])>=d("0.90"),
              }
              all_fold &= all(gates.values())
              temporal={}
              if f!="consumed":
                  for block in sorted(
                      set(b["halfyear_metrics"]) & set(c["halfyear_metrics"])
                  ):
                      delta=(
                          d(c["halfyear_metrics"][block]["mean_r"])
                          - d(b["halfyear_metrics"][block]["mean_r"])
                      )
                      temporal[block]={
                          "mean_r_delta":format(delta,"f"),
                          "nondegrade":delta>=0,
                      }
                      temporal_all &= delta>=0
              report[f]={
                  "baseline":bm,
                  "candidate":cm,
                  "winner_preservation":w,
                  "armed_count":c["armed_count"],
                  "gates":gates,
                  "temporal":temporal,
              }

          survivor=all_fold and temporal_all
          aggregate={
              "schema":"qore.vt31.nas100.pure_structural_protection.aggregate.v1",
              "head":"${{ github.sha }}",
              "folds":report,
              "cross_fold_gates_pass":all_fold,
              "r5_r6_r8_halfyears_nondegrade":temporal_all,
              "sovereign_survivor":survivor,
              "adjudication":(
                  "PURE_EDGE_STRUCTURAL_SURVIVOR"
                  if survivor
                  else "NOT_SUPPORTED"
              ),
              "governance":{
                  "runtime_r_thresholds_used":False,
                  "r_role":"post_trade_evaluation_only",
                  "absolute_volume_used":False,
                  "fresh_holdout_opened":False,
                  "policy_promoted":False,
                  "candidate_certified":False,
              },
          }
          Path("result/aggregate.json").write_text(
              json.dumps(aggregate,sort_keys=True,indent=2)+"\n"
          )
          print(json.dumps(aggregate,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-pure-structural-protection-aggregate-${{ github.sha }}
          path: result/
          retention-days: 90
