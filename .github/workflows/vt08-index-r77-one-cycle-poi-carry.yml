name: VT08 Index R77 One Cycle POI Carry

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r77-one-cycle-poi-carry.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r77_one_cycle_poi_carry.py
      - tests/infrastructure/trader_lab/test_vt08_index_r77_one_cycle_poi_carry.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r77_one_cycle_poi_carry.py

  research:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R77 one-cycle carry falsification
        run: |
          python -m qore.infrastructure.trader_lab.vt08_index_r77_one_cycle_poi_carry \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r77-one-cycle-poi-carry.json

      - name: Verify R77 bounded architecture and governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r77-one-cycle-poi-carry.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R77_ONE_CYCLE_STRICT_POI_CARRY_FALSIFICATION_001"
          )
          assert report["source_r76"]["run_id"] == 35513608607
          assert report["source_r76"]["artifact_id"] == 10605463569
          assert report["carry_contract"]["only_when_exact_source_poi_absent"] is True
          assert report["carry_contract"]["formed_exactly_h4_cycles_before"] == 2
          assert report["carry_contract"]["strictly_untouched_before_anchor"] is True
          assert report["carry_contract"]["family_hierarchy"] == [
              "fvg",
              "relevant-swing",
              "cisd",
          ]
          assert report["carry_contract"]["indefinite_poi_persistence_claimed"] is False
          assert report["five_year"]["canonical_sample"] == 2448
          assert report["recent_two_year"]["canonical_sample"] == 1017
          assert report["r66_failed_holdout"]["canonical_sample"] == 773
          assert report["decision"] == (
              "R77_ONE_CYCLE_POI_CARRY_FALSIFICATION_COMPLETE_NO_CANDIDATE"
          )
          governance = report["governance"]
          assert governance["research_only"] is True
          assert governance["fresh_holdout_claim"] is False
          assert governance["single_bounded_architecture"] is True
          assert governance["future_information_used"] is False
          assert governance["calendar_or_year_runtime_feature"] is False
          assert governance["canonical_signals_suppressed"] is False
          assert governance["older_than_one_cycle_poi_admitted"] is False
          assert governance["risk_allocator_applied_to_added_signals"] is False
          assert governance["candidate_created"] is False
          assert governance["trader_certified"] is False
          assert governance["live_authorized"] is False
          assert governance["real_capital_authorized"] is False
          assert governance["production_authorized"] is False
          PY

      - name: Upload R77 evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r77-one-cycle-poi-carry-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: warn
          retention-days: 90
