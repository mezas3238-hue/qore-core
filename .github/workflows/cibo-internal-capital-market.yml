name: QORE CIBO GEN-C6 Internal Capital Market

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-internal-capital-market.yml'
      - 'src/qore/infrastructure/cibo_internal_capital_market.py'
      - 'src/qore/infrastructure/cibo_internal_capital_market_store.py'
      - 'src/qore/infrastructure/cibo_internal_capital_market_oos_binding.py'
      - 'src/qore/infrastructure/cibo_internal_capital_market_population.py'
      - 'src/qore/infrastructure/cibo_t20_capital_release_evidence.py'
      - 'src/qore/infrastructure/cibo_marginal_capital_utility_evidence.py'
      - 'src/qore/infrastructure/cibo_sequential_compounding_shadow_policy.py'
      - 'src/qore/infrastructure/cibo_sequential_compounding_shadow_store.py'
      - 'src/qore/infrastructure/cibo_ce2i_portfolio_allocation_ledger.py'
      - 'tests/infrastructure/test_cibo_internal_capital_market.py'
      - 'tests/infrastructure/test_cibo_t20_capital_release_evidence.py'
      - 'docs/research/CIBO-GEN-C6-INTERNAL-CAPITAL-MARKET-SHADOW-PREREGISTRATION-V1.md'
      - 'docs/research/CIBO-CE2I-ADR-003-SOVEREIGN-CAPITAL-INTELLIGENCE-COMPOUNDING.md'
      - 'docs/research/CIBO-SOVEREIGN-CAPITAL-INTELLIGENCE-COMPOUNDING-MASTER-ROADMAP-V3.md'
  push:
    branches:
      - agent/cibo-capital-efficiency-sizing-lab-001
    paths:
      - '.github/workflows/cibo-internal-capital-market.yml'
      - 'src/qore/infrastructure/cibo_internal_capital_market.py'
      - 'src/qore/infrastructure/cibo_internal_capital_market_store.py'
      - 'src/qore/infrastructure/cibo_internal_capital_market_oos_binding.py'
      - 'src/qore/infrastructure/cibo_internal_capital_market_population.py'
      - 'src/qore/infrastructure/cibo_marginal_capital_utility_evidence.py'
      - 'src/qore/infrastructure/cibo_t20_capital_release_evidence.py'
      - 'src/qore/infrastructure/cibo_sequential_compounding_shadow_policy.py'
      - 'src/qore/infrastructure/cibo_sequential_compounding_shadow_store.py'
      - 'src/qore/infrastructure/cibo_ce2i_portfolio_allocation_ledger.py'
      - 'tests/infrastructure/test_cibo_internal_capital_market.py'
      - 'docs/research/CIBO-GEN-C6-INTERNAL-CAPITAL-MARKET-SHADOW-PREREGISTRATION-V1.md'
      - 'tests/infrastructure/test_cibo_t20_capital_release_evidence.py'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  internal-capital-market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: GEN-C6 internal capital market quality
        run: |
          ruff check \
            src/qore/infrastructure/cibo_internal_capital_market.py \
            src/qore/infrastructure/cibo_internal_capital_market_store.py \
            src/qore/infrastructure/cibo_internal_capital_market_oos_binding.py \
            src/qore/infrastructure/cibo_internal_capital_market_population.py \
            src/qore/infrastructure/cibo_t20_capital_release_evidence.py \
            tests/infrastructure/test_cibo_internal_capital_market.py \
            tests/infrastructure/test_cibo_t20_capital_release_evidence.py
          python -m py_compile \
            src/qore/infrastructure/cibo_internal_capital_market.py \
            src/qore/infrastructure/cibo_internal_capital_market_store.py \
            src/qore/infrastructure/cibo_internal_capital_market_oos_binding.py \
            src/qore/infrastructure/cibo_internal_capital_market_population.py \
            src/qore/infrastructure/cibo_t20_capital_release_evidence.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_internal_capital_market.py \
            tests/infrastructure/test_cibo_t20_capital_release_evidence.py
