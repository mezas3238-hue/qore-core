name: QORE VT31 NAS100 Reversal vs Expansion Forensics V1

on:
  push:
    branches:
      - agent/vt31-nas100-intelligence-pilot-001
    paths:
      - scripts/vt31_nas100_reversal_vs_expansion_forensics_v1.py
      - .github/workflows/vt31-nas100-reversal-vs-expansion-forensics-v1.yml
  pull_request:
    paths:
      - scripts/vt31_nas100_reversal_vs_expansion_forensics_v1.py
      - .github/workflows/vt31-nas100-reversal-vs-expansion-forensics-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed_holdout
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Freeze Silver Bullet and static gate
        run: |
          set -euo pipefail
          test "$(git hash-object src/qore/infrastructure/traders/vt31_silver_bullet_r2_2.py)" = "3e66f4532c67e62ab2eef7ac376bb86ef7011f73"
          python -m py_compile scripts/vt31_nas100_reversal_vs_expansion_forensics_v1.py
          ruff check scripts/vt31_nas100_reversal_vs_expansion_forensics_v1.py

      - name: Recover immutable M1 evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"

      - name: Run reversal-vs-expansion forensics
        run: |
          set -euo pipefail
          python scripts/vt31_nas100_reversal_vs_expansion_forensics_v1.py             "input/${EVIDENCE_PATH}"             --partition "$PARTITION"             --output "result/reversal-vs-expansion-${PARTITION}.json"             | tee "result/summary-${PARTITION}.json"

      - name: Governance gate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          partition = os.environ["PARTITION"]
          payload = json.loads(
              Path(
                  f"result/reversal-vs-expansion-{partition}.json"
              ).read_text()
          )
          freeze = payload["silver_bullet_freeze"]
          assert freeze["source_sha256"] == "bd729056fadc30d20045e4677240b3a6cbb65123ced317e7413b6ffe81936ddf"
          assert freeze["methodology_id"] == "ttrades-am-silver-bullet-nq-r2.2"
          assert freeze["source_module_modified"] is False
          g = payload["governance"]
          assert g["silver_bullet_modified"] is False
          assert g["m1_source_confirmation_only"] is True
          assert g["source_native_population_includes_non_executable_translation"] is True
          assert g["execution_translation_is_feature_not_admission_gate"] is True
          assert g["h4_primary_causal_feature"] is False
          assert g["h1_trend_primary_causal_feature"] is False
          assert g["future_journey_label_research_only"] is True
          assert g["future_journey_label_allowed_at_runtime"] is False
          assert g["terminal_pnl_used_as_feature"] is False
          assert g["uses_fold_identity_at_runtime"] is False
          assert g["opens_new_holdout"] is False
          assert g["policy_promoted"] is False
          assert g["candidate_certified"] is False
          assert g["live_authorized"] is False
          assert g["real_capital_authorized"] is False
          assert g["production_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-reversal-expansion-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-nas100-reversal-expansion-*-${{ github.sha }}
          path: input
          merge-multiple: true

      - name: Aggregate 4-of-4 causal states
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          folds = {}
          for path in Path("input").glob(
              "reversal-vs-expansion-*.json"
          ):
              payload = json.loads(path.read_text())
              folds[payload["partition"]] = payload
          assert set(folds) == {
              "r5", "r6", "r8", "consumed_holdout"
          }

          names = ("r5", "r6", "r8", "consumed_holdout")
          baselines = {
              fold: folds[fold]["overall"]
              for fold in names
          }
          maps = {
              fold: folds[fold]["feature_diagnostics"]
              for fold in names
          }
          common = set.intersection(
              *(set(maps[fold]) for fold in names)
          )

          reversal_enriched = []
          invalidation_enriched = []
          mixed = []

          for state in sorted(common):
              per_fold = {
                  fold: maps[fold][state]
                  for fold in names
              }
              if min(
                  int(per_fold[fold]["resolved_sample"])
                  for fold in names
              ) < 10:
                  continue

              reversal_delta = {}
              invalidation_delta = {}
              for fold in names:
                  reversal_delta[fold] = (
                      Decimal(
                          per_fold[fold]["reversal_completion_rate"]
                      )
                      - Decimal(
                          baselines[fold]["reversal_completion_rate"]
                      )
                  )
                  invalidation_delta[fold] = (
                      Decimal(
                          per_fold[fold][
                              "source_invalidation_first_rate"
                          ]
                      )
                      - Decimal(
                          baselines[fold][
                              "source_invalidation_first_rate"
                          ]
                      )
                  )

              item = {
                  "state": state,
                  "min_resolved_sample_per_fold": min(
                      int(per_fold[fold]["resolved_sample"])
                      for fold in names
                  ),
                  "per_fold": per_fold,
                  "reversal_delta_vs_fold": {
                      fold: format(reversal_delta[fold], "f")
                      for fold in names
                  },
                  "invalidation_delta_vs_fold": {
                      fold: format(invalidation_delta[fold], "f")
                      for fold in names
                  },
              }

              if all(
                  reversal_delta[fold] > 0
                  and invalidation_delta[fold] < 0
                  for fold in names
              ):
                  reversal_enriched.append(item)
              elif all(
                  reversal_delta[fold] < 0
                  and invalidation_delta[fold] > 0
                  for fold in names
              ):
                  invalidation_enriched.append(item)
              else:
                  mixed.append(item)

          reversal_enriched.sort(
              key=lambda item: -int(
                  item["min_resolved_sample_per_fold"]
              )
          )
          invalidation_enriched.sort(
              key=lambda item: -int(
                  item["min_resolved_sample_per_fold"]
              )
          )

          report = {
              "schema": (
                  "qore.vt31.nas100.reversal_vs_expansion."
                  "aggregate.v1"
              ),
              "baseline_by_fold": baselines,
              "stable_reversal_enriched_states": reversal_enriched,
              "stable_invalidation_enriched_states": (
                  invalidation_enriched
              ),
              "mixed_or_unstable_states": mixed,
              "governance": {
                  "silver_bullet_modified": False,
                  "diagnostic_only": True,
                  "minimum_resolved_sample_per_fold": 10,
                  "requires_direction_4_of_4": True,
                  "future_labels_runtime_forbidden": True,
                  "opens_new_holdout": False,
                  "policy_promoted": False,
                  "candidate_certified": False,
              },
          }
          Path("result/aggregate.json").write_text(
              json.dumps(report, sort_keys=True, indent=2) + "\n"
          )
          print(json.dumps(report, sort_keys=True))
          PY

      - name: Bind artifact
        run: |
          set -euo pipefail
          echo "$GITHUB_SHA" > result/git-sha.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd result && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-reversal-expansion-aggregate-${{ github.sha }}
          path: result/
          retention-days: 90
