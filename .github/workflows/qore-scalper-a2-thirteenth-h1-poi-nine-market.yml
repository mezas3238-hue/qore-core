name: QORE Scalper A2 Audit13 H1 C2 POI Provenance 9Market

on:
  push:
    branches:
      - agent/scalper-architect-b-methodology-20261010
    paths:
      - '.github/workflows/qore-scalper-a2-thirteenth-h1-poi-nine-market.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_a2_thirteenth_h1_poi_native_audit_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_scalper_a2_thirteenth_h1_poi_native_audit_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: scalper-a2-audit13-h1-poi-${{ github.ref }}
  cancel-in-progress: true

env:
  CONTROL_RUN: '38053946695'
  CONTROL_SHA: 'e356e7a52541e99533b25ecfef0ab9c4e9ce03c0'
  NATIVE_RUN: '35548099334'
  NATIVE_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: H1 POI source evidence cannot authorize orders
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_scalper_a2_thirteenth_h1_poi_native_audit_v1.py tests/infrastructure/trader_lab/test_capitalizer_scalper_a2_thirteenth_h1_poi_native_audit_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_scalper_a2_thirteenth_h1_poi_native_audit_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_scalper_a2_thirteenth_h1_poi_native_audit_v1.py

  market:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol: [USDJPY, AUDJPY, AUDUSD, GBPJPY, EURUSD, GBPUSD, XAUUSD, USDCAD, NAS100]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: scalper-a2-v49-control-${{ matrix.symbol }}-${{ env.CONTROL_SHA }}
          path: original
          github-token: ${{ github.token }}
          run-id: ${{ env.CONTROL_RUN }}
      - uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.NATIVE_SHA }}
          path: native
          github-token: ${{ github.token }}
          run-id: ${{ env.NATIVE_RUN }}
      - name: Provider M1 manifest exact, raw immutable
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path("native/m1-clone-manifest.json").read_text())
          assert d["canonical_symbol"]==os.environ["SYMBOL"]
          assert d["provider_native_m1"] and not d["synthetic_m1"]
          assert not d["interpolated_m1"] and d["contradictory_m1"]==0
          assert d["read_only"]
          PY
      - name: Reconstruct native H1 C2 C3 source POI and 60/60 completion per source ID
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_a2_thirteenth_h1_poi_native_audit_v1 market original native market-output
      - name: No author certification from QORE source self-match
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("market-output/scalper-audit13-h1poi-market.json").read_text())
          assert x["sources"]>0 and x["changed_admissions"]==0
          assert not x["independent_author_POI_timeframe_attested"]
          print("C2 H1 POI NATIVE",x)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-audit13-h1poi-${{ matrix.symbol }}-${{ github.sha }}
          path: market-output/
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: scalper-a2-audit13-h1poi-*-${{ github.sha }}
          path: market-inputs
      - run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_a2_thirteenth_h1_poi_native_audit_v1 matrix market-inputs nine-market-output
      - name: 2638 C2 and 238 C3 source remain frozen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("nine-market-output/scalper-audit13-h1poi-nine-market.json").read_text())
          assert r["markets"]==9 and r["sources"]==2876
          assert r["counts"]["C2"]==2638 and r["counts"]["C3"]==238
          assert r["no_admission_changes"] and r["paper_pf"] is None
          print("AUDIT13 NATIVE C2 POI",r)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-audit13-h1poi-nine-market-${{ github.sha }}
          path: nine-market-output/
          retention-days: 90
          if-no-files-found: error
