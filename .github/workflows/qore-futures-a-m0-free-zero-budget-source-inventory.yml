name: QORE Futures A M0 zero-budget public source inventory

on:
  push:
    branches:
      - research/qore-commodity-futures-mission-a-data-contract-20261013
    paths:
      - '.github/workflows/qore-futures-a-m0-free-zero-budget-source-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public_archives_metadata_only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download only free public archives in volatile runner RAM and summarize structure
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import hashlib
          import io
          import json
          import re
          import urllib.error
          import urllib.request
          import zipfile
          from datetime import date
          from pathlib import Path

          # No accounts, API keys, payment, cookies or scraping authentication.
          sources = [
              ("TURTLE_CL", "CL", "https://www.turtletrader.com/cddata/cl.zip"),
              ("TURTLE_GC", "GC", "https://www.turtletrader.com/cddata/gc.zip"),
              ("TURTLE_HG", "HG", "https://www.turtletrader.com/cddata/hg.zip"),
              ("TURTLE_ZC", "ZC", "https://www.turtletrader.com/cddata/c.zip"),
              ("TURTLE_ZS", "ZS", "https://www.turtletrader.com/cddata/s.zip"),
              (
                  "ACADEMIC_17",
                  "ALL",
                  "https://raw.githubusercontent.com/SSEconomics/"
                  "commodity-spot-and-futures-data/main/Futures%20Data.zip",
              ),
          ]
          output = {
              "project": "QORE_FUTURES_A_M0",
              "audit_kind": "FREE_PUBLIC_ZIP_METADATA_ONLY_NOT_CERTIFICATION",
              "cash_spent_usd": 0,
              "permission_to_republish_raw_prices": False,
              "proof_of_research_license": False,
              "PnL_calculated": False,
              "missing_root_from_turtle": "NG",
              "observations": [],
          }
          archive_max = 48 * 1024 * 1024
          member_max = 10 * 1024 * 1024
          total_uncompressed_max = 512 * 1024 * 1024
          date8 = re.compile(rb"(?<!\d)(?:19|20)\d{6}(?!\d)")
          date10 = re.compile(rb"(?<!\d)(?:19|20)\d{2}-\d{2}-\d{2}(?!\d)")

          def detect_dates(line):
              values = []
              for match in date8.findall(line[:140]):
                  text = match.decode("ascii")
                  try:
                      values.append(date(int(text[:4]), int(text[4:6]), int(text[6:8])))
                  except ValueError:
                      pass
              for match in date10.findall(line[:140]):
                  try:
                      values.append(date.fromisoformat(match.decode("ascii")))
                  except ValueError:
                      pass
              return [d for d in values if 1950 <= d.year <= 2026]

          for key, root, url in sources:
              entry = {
                  "id": key, "root": root, "url": url,
                  "archive_access": "FAILED_OR_UNCHECKED", "is_zip": False,
              }
              try:
                  req = urllib.request.Request(
                      url, headers={"User-Agent": "QORE-RD-SOURCE-METADATA-ONLY/1.0"}
                  )
                  with urllib.request.urlopen(req, timeout=30) as response:
                      original = response.read(archive_max + 1)
                  if len(original) > archive_max:
                      raise ValueError("ARCHIVE_OVER_48_MIB_SOURCE_GATE")
                  entry["http_byte_length"] = len(original)
                  entry["zip_sha256"] = hashlib.sha256(original).hexdigest()
                  with zipfile.ZipFile(io.BytesIO(original)) as z:
                      infos = [i for i in z.infolist() if not i.is_dir()]
                      entry["is_zip"] = True
                      entry["member_count"] = len(infos)
                      entry["file_extension_histogram"] = {}
                      entry["file_name_examples"] = [i.filename[:90] for i in infos[:8]]
                      entry["file_name_last_examples"] = [
                          i.filename[:90] for i in infos[-8:]
                      ]
                      entry["text_first_row_masked"] = None
                      entry["total_uncompressed_bytes"] = sum(i.file_size for i in infos)
                      if entry["total_uncompressed_bytes"] > total_uncompressed_max:
                          raise ValueError("ZIP_BOMB_UNCOMPRESSED_LIMIT")
                      if len(infos) > 3000:
                          raise ValueError("ZIP_TOO_MANY_MEMBERS")
                      for item in infos:
                          ext = Path(item.filename).suffix.lower() or "NO_EXT"
                          hist = entry["file_extension_histogram"]
                          hist[ext] = hist.get(ext, 0) + 1
                      by_date_min = None
                      by_date_max = None
                      dates_found = 0
                      member_date_coverage = 0
                      for info in infos:
                          if info.file_size > member_max:
                              continue
                          ext = Path(info.filename).suffix.lower()
                          if ext not in (".txt", ".csv", ".dat"):
                              continue
                          dates_in_member = 0
                          with z.open(info, "r") as fp:
                              for line in fp:
                                  if entry["text_first_row_masked"] is None and line.strip():
                                      entry["text_first_row_masked"] = re.sub(
                                          rb"[0-9]", b"#", line[:145]
                                      ).decode("latin-1").strip()
                                  dates = detect_dates(line)
                                  for d in dates:
                                      dates_in_member += 1
                                      dates_found += 1
                                      if by_date_min is None or d < by_date_min:
                                          by_date_min = d
                                      if by_date_max is None or d > by_date_max:
                                          by_date_max = d
                          if dates_in_member:
                              member_date_coverage += 1
                      entry["min_observed_date_in_text_rows"] = (
                          by_date_min.isoformat() if by_date_min else None
                      )
                      entry["max_observed_date_in_text_rows"] = (
                          by_date_max.isoformat() if by_date_max else None
                      )
                      entry["text_rows_containing_date"] = dates_found
                      entry["text_members_with_date"] = member_date_coverage
                      entry["members_explicitly_separate_contracts_verified"] = False
                      entry["2012_2024_contract_level_eligible_coverage_proved"] = False
                      entry["canonical_futures_settlement_and_publication_verified"] = False
                      entry["archive_access"] = "SUCCESS_METADATA_ONLY"
              except (OSError, ValueError, zipfile.BadZipFile) as exc:
                  entry["error_class"] = type(exc).__name__
                  entry["error_description"] = str(exc)[:140]
              output["observations"].append(entry)
              print(json.dumps(entry, sort_keys=True))

          Path("free_source_inventory_metadata.json").write_text(
              json.dumps(output, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print("SOURCE_QUALIFICATION=NOT_CERTIFIED_NO_PNL_NO_BROKER_NET")
          PY
      - name: Upload only metadata/URL/sha/coverage, NEVER raw futures bars or zip
        uses: actions/upload-artifact@v4
        with:
          name: futures-a-m0-free-sources-metadata-only
          path: free_source_inventory_metadata.json
          retention-days: 30
