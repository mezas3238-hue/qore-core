name: QORE Capitalizer V3 Only Causal Series Atlas 2Y V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-v3-only-causal-series-atlas-2y-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v3_only_causal_series_atlas_2y_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v3_only_causal_series_atlas_2y_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-v3-only-causal-series-atlas-2y-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  SEMANTICS_RUN_ID: '35813315103'
  SEMANTICS_SHA: '722b6abe4fc570fc47cbfb67ff64a6a93c1fb160'
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_v3_only_causal_series_atlas_2y_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_v3_only_causal_series_atlas_2y_v1.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_v3_only_causal_series_atlas_2y_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_v3_only_causal_series_atlas_2y_v1.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {symbol: USDJPY}
          - {symbol: AUDJPY}
          - {symbol: AUDUSD}
          - {symbol: GBPJPY}
          - {symbol: EURUSD}
          - {symbol: GBPUSD}
          - {symbol: XAUUSD}
          - {symbol: USDCAD}
          - {symbol: NAS100}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download frozen boundary-semantics ledger
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-v3-cisd-boundary-semantics-census-2y-v1-${{ matrix.symbol }}-${{ env.SEMANTICS_SHA }}
          path: semantics-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SEMANTICS_RUN_ID }}
      - name: Download immutable native-M1 clone
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Run outcome-free V3-only causal-series atlas
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v3_only_causal_series_atlas_2y_v1 \
            market semantics-source m1-source atlas-output
      - name: Enforce market controls
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"]
          report = json.loads(
              (
                  Path("atlas-output")
                  / f"capitalizer-{symbol.lower()}-v3-only-causal-series-atlas-2y-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_V3_ONLY_CAUSAL_SERIES_ATLAS_2Y_V1"
          )
          assert report["symbol"] == symbol
          assert report["v3_only_rows"] > 0
          assert sum(report["causal_classes"].values()) == report["v3_only_rows"]
          assert report["outcome_fields_read"] is False
          assert report["outcome_used_for_classification"] is False
          assert report["future_event_used_for_classification"] is False
          assert report["strategy_mutated"] is False
          assert report["diagnostic_only"] is True
          assert report["economic_candidate"] is False
          assert report["rule_promotion_allowed"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v3-only-causal-series-atlas-2y-v1-${{ matrix.symbol }}-${{ github.sha }}
          path: atlas-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v3-only-causal-series-atlas-2y-v1-*-${{ github.sha }}
          path: atlas-input
          merge-multiple: false
      - name: Build nine-market V3-only causal-series matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v3_only_causal_series_atlas_2y_v1 \
            matrix atlas-input matrix-output
      - name: Enforce aggregate controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "matrix-output/"
                  "capitalizer-nine-market-v3-only-causal-series-atlas-2y-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_NINE_MARKET_V3_ONLY_CAUSAL_SERIES_ATLAS_2Y_V1"
          )
          assert report["market_count"] == 9
          assert report["v3_only_rows"] == 87
          assert report["v3_only_control_reproduced"] is True
          assert sum(report["causal_classes"].values()) == 87
          assert report["outcome_fields_read"] is False
          assert report["outcome_used_for_classification"] is False
          assert report["future_event_used_for_classification"] is False
          assert report["strategy_mutated"] is False
          assert report["diagnostic_only"] is True
          assert report["economic_candidate"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["fresh_holdout_claimed"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-nine-market-v3-only-causal-series-atlas-2y-v1-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
