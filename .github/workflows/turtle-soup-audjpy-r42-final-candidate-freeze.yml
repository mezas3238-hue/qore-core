name: QORE Turtle Soup AUDJPY R42 Final Candidate Freeze

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-audjpy-specialist-memory-v1-001
    paths:
      - '.github/workflows/turtle-soup-audjpy-r42-final-candidate-freeze.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_audjpy_r42_final_candidate_freeze.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_audjpy_r42_final_candidate_freeze.py'

permissions:
  contents: read
  actions: read

env:
  R41_RUN_ID: '35399430491'
  R41_ARTIFACT: 'qore-turtle-soup-audjpy-r41-5y-fragility-correction-2976255f2459a17603b0b9385b4c249a720463b8'

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Focused quality
        run: |
          ruff check --ignore E501,I001 \
            src/qore/infrastructure/trader_lab/turtle_soup_audjpy_r42_final_candidate_freeze.py \
            tests/infrastructure/trader_lab/test_turtle_soup_audjpy_r42_final_candidate_freeze.py
          mypy --disable-error-code attr-defined \
            src/qore/infrastructure/trader_lab/turtle_soup_audjpy_r42_final_candidate_freeze.py
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_turtle_soup_audjpy_r42_final_candidate_freeze.py
      - name: Download exact passing R41 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.R41_ARTIFACT }}
          path: r41-source
          github-token: ${{ github.token }}
          run-id: ${{ env.R41_RUN_ID }}
      - name: Freeze exact R41 candidate
        run: |
          mkdir -p r42-output
          python -m qore.infrastructure.trader_lab.turtle_soup_audjpy_r42_final_candidate_freeze \
            r41-source r42-output > r42-output/stdout.json
          printf '%s\n' "$GITHUB_SHA" > r42-output/git-sha.txt
      - name: Enforce final freeze governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('r42-output/r42-final-candidate-freeze-manifest.json').read_text())
          assert p['identity']=='TURTLE_SOUP_AUDJPY_R42_FINAL_CANDIDATE_001'
          assert p['status']=='FROZEN_FOR_FINAL_ROBUSTNESS'
          assert p['consumed_5y_result']['trades']==1039
          assert p['consumed_5y_result']['max_drawdown_scaled_r']=='5.293573269867727808258117465'
          assert p['consumed_2y_result']['trades']==422
          assert p['next_stage']['fresh_holdout_status']=='SEALED_UNTOUCHED'
          assert p['governance']['candidate_frozen'] is True
          assert p['governance']['trader_certified'] is False
          assert p['governance']['merge_authorized'] is False
          PY
      - name: Hash freeze evidence
        run: |
          cd r42-output
          sha256sum r42-final-candidate-freeze-manifest.json stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-audjpy-r42-final-freeze-${{ github.sha }}
          path: r42-output
          if-no-files-found: error
          retention-days: 90
