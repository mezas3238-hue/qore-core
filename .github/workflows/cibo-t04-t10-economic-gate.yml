name: QORE CIBO CE2I T04 T10 Economic Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-t04-t10-economic-gate.yml'
      - 'src/qore/infrastructure/cibo_ce2i_t04_t10_economic_gate.py'
      - 'tests/infrastructure/test_cibo_ce2i_t04_t10_economic_gate.py'
      - 'docs/research/CIBO-CE2I-T04-T10-NONCOMPENSATORY-ECONOMIC-GATE-V1.md'
      - 'docs/research/CIBO-MASTER-OPEN-WORK-LEDGER-V1.json'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  t04-t10-economic-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: T04/T10 non-compensatory economic contract
        run: |
          ruff check \
            src/qore/infrastructure/cibo_ce2i_t04_t10_economic_gate.py \
            tests/infrastructure/test_cibo_ce2i_t04_t10_economic_gate.py
          mypy src/qore/infrastructure/cibo_ce2i_t04_t10_economic_gate.py
          python -m py_compile \
            src/qore/infrastructure/cibo_ce2i_t04_t10_economic_gate.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_ce2i_t04_t10_economic_gate.py
