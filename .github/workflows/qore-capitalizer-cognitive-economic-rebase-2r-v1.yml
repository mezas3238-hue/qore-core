name: QORE Capitalizer Cognitive Economic Rebase 2R V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-cognitive-economic-rebase-2r-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_cognitive_economic_rebase_2r_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_cognitive_economic_rebase_2r_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-cognitive-economic-rebase-2r-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  BINDING_RUN_ID: '36065651404'
  BINDING_SHA: '1d910f5c3550ac481c28390671a86ceb011597e3'
  TARGET_V2_RUN_ID: '36077843102'
  TARGET_V2_SHA: 'a47de3b491b4468527c945d6eff3afbbaec82d4e'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check             src/qore/infrastructure/trader_lab/capitalizer_cognitive_economic_rebase_2r_v1.py             tests/infrastructure/trader_lab/test_capitalizer_cognitive_economic_rebase_2r_v1.py
      - name: Mypy
        run: |
          mypy             src/qore/infrastructure/trader_lab/capitalizer_cognitive_economic_rebase_2r_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov             tests/infrastructure/trader_lab/test_capitalizer_cognitive_economic_rebase_2r_v1.py

  rebase:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download source-bound cognitive ledger
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cognitive-evidence-binding-audit-2y-v2-${{ env.BINDING_SHA }}
          path: binding-input
          github-token: ${{ github.token }}
          run-id: ${{ env.BINDING_RUN_ID }}
      - name: Download corrected target V2 market ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-max-recovery-target-sensitivity-2y-v2-*-${{ env.TARGET_V2_SHA }}
          path: target-v2-input
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_V2_RUN_ID }}
      - name: Build true-2R cognitive rebase
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cognitive_economic_rebase_2r_v1             binding-input target-v2-input rebase-output
      - name: Enforce 2R rebase controls
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          report = json.loads(
              Path(
                  "rebase-output/"
                  "capitalizer-cognitive-economic-rebase-2r-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_COGNITIVE_ECONOMIC_REBASE_2R_V1"
          )
          assert report["source_binding_run_id"] == 36065651404
          assert report["source_target_v2_run_id"] == 36077843102
          assert report["target_r"] == "2.00"
          assert report["control_trades"] == 948

          metrics = report["control_metrics"]
          assert metrics["trades"] == 948
          assert metrics["stop_exits"] == 275
          assert metrics["wins"] == 483
          assert metrics["losses"] == 465
          assert Decimal(metrics["profit_factor"]) == Decimal(
              "1.466020472120789368123727041"
          )
          assert Decimal(metrics["total_r"]) == Decimal(
              "153.9927998412621697329314877"
          )
          assert Decimal(metrics["max_drawdown_r"]) == Decimal(
              "12.93584837435268644582248142"
          )
          assert metrics["max_losing_streak"] == 7

          assert report["source_microstructure_reused"] is True
          assert report["source_microstructure_rows"] == 948
          assert report["portfolio_journey_recomputed_from_2r_lifecycle"] is True
          assert report["old_1r_dynamic_state_reused"] is False

          delta = report["dynamic_state_delta_vs_binding_v2"]
          assert delta["trades_with_any_dynamic_change"] > 0
          assert delta["active_position_count_changed"] > 0
          assert delta["prior_closed_trade_count_changed"] > 0
          assert delta["prior_realized_r_changed"] > 0
          assert delta["slot_state_changed"] == 0
          assert delta["source_microstructure_changed"] == 0

          assert (
              report["simultaneous_candidates_are_not_prior_active_exposure"]
              is True
          )
          assert report["binding_v2_source_control_reproduced"] is True
          assert report["current_outcome_visible_to_cognitive_state"] is False
          assert report["current_outcome_attached_for_post_audit"] is True
          assert report["target_v1_non2r_economics_superseded"] is True
          assert report["selection_changed"] is False
          assert report["entry_changed"] is False
          assert report["stop_changed"] is False
          assert report["target_changed_from_original_2r"] is False
          assert report["max3_changed"] is False
          assert report["cognitive_rule_selected"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-cognitive-economic-rebase-2r-v1-${{ github.sha }}
          path: rebase-output
          if-no-files-found: error
          retention-days: 90
