name: QORE VT31 Sovereign LBB Structural Survivor V2
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  push:
    branches:
      - agent/vt31-edge-position-cert-b-001
    paths:
      - scripts/vt31_nas100_sovereign_lbb_structural_survivor_v2.py
      - .github/workflows/vt31-nas100-sovereign-lbb-structural-survivor-v2.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Static gate
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_sovereign_lbb_structural_survivor_v2.py
          ruff check scripts/vt31_nas100_sovereign_lbb_structural_survivor_v2.py

      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"

      - name: Run sovereign LBB survivor
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python scripts/vt31_nas100_sovereign_lbb_structural_survivor_v2.py             "input/${EVIDENCE_PATH}"             --output "result/lbb-${PARTITION}.json"             | tee "result/summary-${PARTITION}.json"

      - name: Sovereign governance gate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=os.environ["PARTITION"]
          x=json.loads(Path(f"result/lbb-{p}.json").read_text())
          g=x["governance"]
          assert g["specialist_replay_is_admission_authority"] is True
          assert g["identical_admission_population"] is True
          assert g["trade_admission_changed"] is False
          assert g["entry_changed"] is False
          assert g["runtime_r_decision_authority"] is False
          assert g["runtime_volume_decision_authority"] is False
          assert g["position_sizing_used"] is False
          assert g["leverage_used"] is False
          assert g["compounding_used"] is False
          assert g["capital_weighting_used"] is False
          assert g["partial_exit_used"] is False
          assert g["maximum_structural_protection_moves"] == 1
          assert g["r_role"] == "post_trade_evaluation_only"
          assert g["fresh_holdout_opened"] is False
          baseline=x["variants"]["PURE_MARKET_BASELINE"]
          candidate=x["variants"]["LBB_PATH_SHALLOW_PS1_PURE_V2"]
          assert baseline["trade_count"] == candidate["trade_count"]
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-sovereign-lbb-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-sovereign-lbb-*-${{ github.sha }}
          path: input
          merge-multiple: true

      - name: Adjudicate sovereign LBB survivor
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          folds=("r5","r6","r8","consumed")
          base="PURE_MARKET_BASELINE"
          cand="LBB_PATH_SHALLOW_PS1_PURE_V2"
          payloads={
              f:json.loads(Path(f"input/lbb-{f}.json").read_text())
              for f in folds
          }
          def d(v): return Decimal(str(v))

          fold_reports={}
          cross_fold=True
          temporal=True
          for f in folds:
              b=payloads[f]["variants"][base]
              c=payloads[f]["variants"][cand]
              bm=b["stress_0_05r"]
              cm=c["stress_0_05r"]
              w=c["winner_preservation_vs_baseline"]
              gates={
                  "same_trade_count":b["trade_count"]==c["trade_count"],
                  "pf_nondegrade":(
                      bm["profit_factor"] is not None
                      and cm["profit_factor"] is not None
                      and d(cm["profit_factor"])>=d(bm["profit_factor"])
                  ),
                  "mean_nondegrade":d(cm["mean_r"])>=d(bm["mean_r"]),
                  "total_nondegrade":d(cm["total_r"])>=d(bm["total_r"]),
                  "dd_nondegrade":d(cm["max_drawdown_r"])<=d(bm["max_drawdown_r"]),
                  "winner_count_ge_80":d(w["winner_count_preservation"])>=d("0.80"),
                  "winner_r_ge_90":d(w["winner_r_preservation"])>=d("0.90"),
                  "no_winner_to_loser":w["baseline_winner_to_loser_count"]==0,
              }
              cross_fold &= all(gates.values())

              blocks={}
              for key in sorted(
                  set(b["halfyear_stress"]) & set(c["halfyear_stress"])
              ):
                  bb=b["halfyear_stress"][key]
                  cc=c["halfyear_stress"][key]
                  mean_delta=d(cc["mean_r"])-d(bb["mean_r"])
                  total_delta=d(cc["total_r"])-d(bb["total_r"])
                  block_pass=mean_delta>=0 and total_delta>=0
                  blocks[key]={
                      "mean_delta":format(mean_delta,"f"),
                      "total_delta":format(total_delta,"f"),
                      "nondegrade":block_pass,
                  }
                  temporal &= block_pass

              fold_reports[f]={
                  "baseline":bm,
                  "candidate":cm,
                  "winner_preservation":w,
                  "eligible_count":c["eligible_count"],
                  "armed_count":c["protection_armed_count"],
                  "changed_trade_count":payloads[f]["changed_trade_count"],
                  "changed_delta_total_r":payloads[f]["changed_delta_total_r"],
                  "gates":gates,
                  "halfyears":blocks,
              }

          survivor=cross_fold and temporal
          report={
              "schema":"qore.vt31.nas100.sovereign_lbb_structural_survivor.aggregate.v2",
              "head":"${{ github.sha }}",
              "folds":fold_reports,
              "cross_fold_gates_pass":cross_fold,
              "all_halfyears_nondegrade":temporal,
              "sovereign_survivor":survivor,
              "adjudication":(
                  "PURE_EDGE_STRUCTURAL_SURVIVOR"
                  if survivor
                  else "NOT_SUPPORTED"
              ),
              "governance":{
                  "specialist_replay_admission_authority":True,
                  "runtime_r_decision_authority":False,
                  "runtime_volume_decision_authority":False,
                  "fresh_holdout_opened":False,
                  "policy_promoted":False,
                  "candidate_certified":False,
                  "live_authorized":False,
              },
          }
          Path("result/aggregate.json").write_text(
              json.dumps(report,sort_keys=True,indent=2)+"\n"
          )
          print(json.dumps(report,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-sovereign-lbb-aggregate-${{ github.sha }}
          path: result/
          retention-days: 90
