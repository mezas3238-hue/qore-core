name: QORE Capitalizer Intratrade Hypothesis Invalidation V18

on:
  workflow_dispatch:


permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-intratrade-hypothesis-invalidation-v18-${{ github.sha }}
  cancel-in-progress: false

env:
  DEV_DIRECT_RUN_ID: '36196002610'
  DEV_DIRECT_SHA: 'ddd00209e50d5ec16c8cb94f34e9e5e95f401839'
  DEV_CONTEXT_RUN_ID: '36211415438'
  DEV_CONTEXT_SHA: 'c652b1e5a5181ba95ac6f10ea5c95bf808a0c8a7'
  RESERVED_SOURCE_RUN_ID: '36215082659'
  RESERVED_SOURCE_SHA: '9132b8b74938b8f142d946ab8717bf66840a18d2'
  M1_RUN_ID: '35548099334'
  M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_intratrade_hypothesis_invalidation_v18.py \
            tests/infrastructure/trader_lab/test_capitalizer_intratrade_hypothesis_invalidation_v18.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_intratrade_hypothesis_invalidation_v18.py \
            tests/infrastructure/trader_lab/test_capitalizer_intratrade_hypothesis_invalidation_v18.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_intratrade_hypothesis_invalidation_v18.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        symbol:
          - USDJPY
          - AUDJPY
          - AUDUSD
          - GBPJPY
          - EURUSD
          - GBPUSD
          - XAUUSD
          - USDCAD
          - NAS100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download development direct-M1 ledger
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-max-recovery-direct-m1-dev-${{ matrix.symbol }}-${{ env.DEV_DIRECT_SHA }}
          path: development-input
          github-token: ${{ github.token }}
          run-id: ${{ env.DEV_DIRECT_RUN_ID }}
      - name: Download validation direct-M1 ledger
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-max-recovery-direct-m1-holdout-${{ matrix.symbol }}-${{ env.DEV_DIRECT_SHA }}
          path: validation-input
          github-token: ${{ github.token }}
          run-id: ${{ env.DEV_DIRECT_RUN_ID }}
      - name: Download reserved direct-M1 ledger
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-max-recovery-direct-m1-reserved-${{ matrix.symbol }}-${{ env.RESERVED_SOURCE_SHA }}
          path: reserved-input
          github-token: ${{ github.token }}
          run-id: ${{ env.RESERVED_SOURCE_RUN_ID }}
      - name: Download immutable native M1
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.M1_SHA }}
          path: m1-input
          github-token: ${{ github.token }}
          run-id: ${{ env.M1_RUN_ID }}
      - name: Build causal invalidation triggers
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_intratrade_hypothesis_invalidation_v18 \
            market development-input validation-input reserved-input m1-input event-output \
            --symbol "${{ matrix.symbol }}"
      - name: Enforce market causal contract
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"]
          report = json.loads(
              (
                  Path("event-output")
                  / f"capitalizer-{symbol.lower()}-intratrade-hypothesis-invalidation-v18.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_INTRATRADE_HYPOTHESIS_INVALIDATION_V18"
          )
          assert report["symbol"] == symbol
          assert set(report["source_trade_counts"]) == {
              "DEVELOPMENT_2024_2026",
              "CONSUMED_VALIDATION_2022_2024",
              "CONSUMED_RESERVED_2020_2022",
          }
          assert report["current_outcome_visible_to_trigger"] is False
          assert report["future_bars_visible_to_trigger"] is False
          assert report["original_exit_bar_excluded"] is True
          assert report["same_bar_stop_target_ambiguity_can_trigger"] is False
          assert report["market_session_specific_thresholds_used"] is False
          assert report["strategy_rules_changed"] is False
          assert report["trader_certified"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-intratrade-hypothesis-invalidation-v18-${{ matrix.symbol }}-${{ github.sha }}
          path: event-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download V18 market triggers
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-intratrade-hypothesis-invalidation-v18-*-${{ github.sha }}
          path: event-input
          merge-multiple: false
      - name: Download development ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-max-recovery-direct-m1-dev-*-${{ env.DEV_DIRECT_SHA }}
          path: development-input
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.DEV_DIRECT_RUN_ID }}
      - name: Download validation ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-max-recovery-direct-m1-holdout-*-${{ env.DEV_DIRECT_SHA }}
          path: validation-input
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.DEV_DIRECT_RUN_ID }}
      - name: Download development and validation contexts
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-native-market-context-v1-*-${{ env.DEV_CONTEXT_SHA }}
          path: development-validation-context
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.DEV_CONTEXT_RUN_ID }}
      - name: Download consumed reserved ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-max-recovery-direct-m1-reserved-*-${{ env.RESERVED_SOURCE_SHA }}
          path: reserved-input
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.RESERVED_SOURCE_RUN_ID }}
      - name: Download consumed reserved contexts
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-native-market-context-v1-reserved-*-${{ env.RESERVED_SOURCE_SHA }}
          path: reserved-context
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.RESERVED_SOURCE_RUN_ID }}
      - name: Run V18 portfolio replay
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_intratrade_hypothesis_invalidation_v18 \
            aggregate development-input validation-input reserved-input \
            development-validation-context reserved-context event-input experiment-output
      - name: Enforce V18 portfolio contract
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          report = json.loads(
              Path(
                  "experiment-output/"
                  "capitalizer-intratrade-hypothesis-invalidation-v18.json"
              ).read_text()
          )
          assert report["evaluation"] == (
              "CAUSAL_FAILURE_TO_DEPART_INTRATRADE_INVALIDATION"
          )
          assert report["all_entries_preserved"] is True
          assert Decimal(report["density_retention"]) == Decimal("1")
          assert report["surface_multiplier_preserved"] is True
          assert report["fixed_target_r"] == "2.00"
          assert report["original_stop_geometry_preserved"] is True
          assert report["max3_preserved"] is True
          assert report["current_outcome_visible_to_trigger"] is False
          assert report["future_bars_visible_to_trigger"] is False
          assert report["original_exit_bar_excluded"] is True
          assert report["trigger_must_precede_surface_exit"] is True
          assert report["market_session_specific_thresholds_used"] is False
          assert report["current_outcome_visible_to_decision"] is False
          assert report["unchosen_counterfactual_visible_to_decision"] is False
          assert report["full_source_recompetition_required_before_freeze"] is True
          assert report["fresh_holdout_reserved"] == "2018-09-17_TO_2020-09-17"
          control = next(
              row for row in report["results"]
              if row["policy"] == "SURFACE_CONTROL"
          )
          expected = {
              "DEVELOPMENT_2024_2026": ("948", "6.214605199866807668753081488"),
              "CONSUMED_VALIDATION_2022_2024": ("1034", "6.770051846347247537620893924"),
              "CONSUMED_RESERVED_2020_2022": ("1088", "8.74798816650617431130479348"),
          }
          for period, (trades, dd) in expected.items():
              row = control["heldouts"][period]
              assert str(row["trades"]) == trades
              assert str(row["metrics"]["max_drawdown_r"]) == dd
          assert report["automatic_policy_promotion"] is False
          assert report["trader_certified"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-intratrade-hypothesis-invalidation-v18-${{ github.sha }}
          path: experiment-output
          if-no-files-found: error
          retention-days: 90
