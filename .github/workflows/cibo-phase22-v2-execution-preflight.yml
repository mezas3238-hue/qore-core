name: QORE CIBO Phase22 V2 Execution Preflight

on:
  push:
    branches:
      - agent/cibo-integrator-ab-001
    paths:
      - '.github/workflows/cibo-phase22-v2-execution-preflight.yml'
      - 'src/qore/infrastructure/cibo_phase22_execution_manifest.py'
      - 'src/qore/infrastructure/cibo_phase22_dual_evidence_plan.py'
      - 'src/qore/infrastructure/cibo_phase22_demo_empirical_provider_receipt.py'
      - 'src/qore/infrastructure/cibo_phase22_provider_execution_calibration_receipt.py'
      - 'src/qore/infrastructure/cibo_phase22_provider_numeric_execution_receipt.py'
      - 'src/qore/infrastructure/cibo_phase22_store_contract.py'
      - 'src/qore/infrastructure/cibo_phase22_one_shot_guard.py'
      - 'tests/infrastructure/test_cibo_phase22_execution_manifest.py'
      - 'tests/infrastructure/test_cibo_phase22_store_contract.py'
      - 'tests/infrastructure/test_cibo_phase22_one_shot_guard.py'
  pull_request:
    paths:
      - '.github/workflows/cibo-phase22-v2-execution-preflight.yml'
      - 'src/qore/infrastructure/cibo_phase22_execution_manifest.py'
      - 'src/qore/infrastructure/cibo_phase22_dual_evidence_plan.py'
      - 'src/qore/infrastructure/cibo_phase22_demo_empirical_provider_receipt.py'
      - 'src/qore/infrastructure/cibo_phase22_provider_execution_calibration_receipt.py'
      - 'src/qore/infrastructure/cibo_phase22_store_contract.py'
      - 'src/qore/infrastructure/cibo_phase22_one_shot_guard.py'
      - 'tests/infrastructure/test_cibo_phase22_execution_manifest.py'
      - 'tests/infrastructure/test_cibo_phase22_store_contract.py'
      - 'tests/infrastructure/test_cibo_phase22_one_shot_guard.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'

      - name: Quality
        run: |
          ruff check \
            src/qore/infrastructure/cibo_phase22_execution_manifest.py \
            src/qore/infrastructure/cibo_phase22_provider_execution_calibration_receipt.py \
            src/qore/infrastructure/cibo_phase22_provider_numeric_execution_receipt.py \
            src/qore/infrastructure/cibo_phase22_store_contract.py \
            src/qore/infrastructure/cibo_phase22_one_shot_guard.py \
            tests/infrastructure/test_cibo_phase22_execution_manifest.py \
            tests/infrastructure/test_cibo_phase22_provider_execution_calibration_receipt.py \
            tests/infrastructure/test_cibo_phase22_provider_numeric_execution_receipt.py \
            tests/infrastructure/test_cibo_phase22_store_contract.py \
            tests/infrastructure/test_cibo_phase22_one_shot_guard.py
          mypy \
            src/qore/infrastructure/cibo_phase22_execution_manifest.py \
            src/qore/infrastructure/cibo_phase22_provider_execution_calibration_receipt.py \
            src/qore/infrastructure/cibo_phase22_provider_numeric_execution_receipt.py \
            src/qore/infrastructure/cibo_phase22_store_contract.py \
            src/qore/infrastructure/cibo_phase22_one_shot_guard.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_phase22_execution_manifest.py \
            tests/infrastructure/test_cibo_phase22_provider_execution_calibration_receipt.py \
            tests/infrastructure/test_cibo_phase22_provider_numeric_execution_receipt.py \
            tests/infrastructure/test_cibo_phase22_store_contract.py \
            tests/infrastructure/test_cibo_phase22_one_shot_guard.py

      - name: Emit immutable manifest and fail-closed preflight
        run: |
          mkdir -p phase22-v2-preflight
          python - <<'PY'
          import json
          from pathlib import Path

          from qore.infrastructure.cibo_phase22_execution_manifest import (
              build_phase22_execution_manifest,
          )
          from qore.infrastructure.cibo_phase22_one_shot_guard import (
              Phase22OneShotGuardStatus,
              assess_phase22_one_shot_guard,
          )
          from qore.infrastructure.cibo_phase22_store_contract import (
              phase22_store_contract_payload,
          )

          manifest = build_phase22_execution_manifest()
          guard = assess_phase22_one_shot_guard()
          assert guard.status is Phase22OneShotGuardStatus.CONSUMED
          assert guard.execution_claimed is True
          assert guard.fresh_outcomes_already_emitted is True
          assert guard.authorized_to_create_durable_claim is False
          assert guard.authorized_to_emit_first_fresh_outcome is False
          assert guard.productive_authority is False

          out = Path("phase22-v2-preflight")
          (out / "execution-manifest.json").write_text(
              json.dumps(manifest.payload(), indent=2, sort_keys=True) + "\n"
          )
          (out / "store-contract.json").write_text(
              json.dumps(
                  phase22_store_contract_payload(),
                  indent=2,
                  sort_keys=True,
              ) + "\n"
          )
          (out / "one-shot-preflight.json").write_text(
              json.dumps(guard.payload(), indent=2, sort_keys=True) + "\n"
          )
          PY
          printf '%s\n' "$EVIDENCE_SHA" > phase22-v2-preflight/git-sha.txt
          cd phase22-v2-preflight
          sha256sum \
            execution-manifest.json \
            store-contract.json \
            one-shot-preflight.json \
            git-sha.txt > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-phase22-v2-execution-preflight-${{ env.EVIDENCE_SHA }}
          path: phase22-v2-preflight
          if-no-files-found: error
          retention-days: 90
