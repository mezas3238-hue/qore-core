name: QORE CIBO cTrader DEMO Account Capability

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-ctrader-demo-account-capability.yml'
      - 'src/qore/infrastructure/cibo_ctrader_demo_account_capability.py'
      - 'tests/infrastructure/test_cibo_ctrader_demo_account_capability.py'
      - 'docs/research/CIBO-CTRADER-DEMO-ACCOUNT-CAPABILITY-V1.md'
  push:
    branches:
      - agent/cibo-certification-architect-b-integration-001
    paths:
      - '.github/workflows/cibo-ctrader-demo-account-capability.yml'
      - 'src/qore/infrastructure/cibo_ctrader_demo_account_capability.py'
      - 'tests/infrastructure/test_cibo_ctrader_demo_account_capability.py'
      - 'docs/research/CIBO-CTRADER-DEMO-ACCOUNT-CAPABILITY-V1.md'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  account-capability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: cTrader DEMO capability quality
        run: |
          ruff check \
            src/qore/infrastructure/cibo_ctrader_demo_account_capability.py \
            tests/infrastructure/test_cibo_ctrader_demo_account_capability.py
          mypy src/qore/infrastructure/cibo_ctrader_demo_account_capability.py
          python -m py_compile \
            src/qore/infrastructure/cibo_ctrader_demo_account_capability.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_ctrader_demo_account_capability.py
