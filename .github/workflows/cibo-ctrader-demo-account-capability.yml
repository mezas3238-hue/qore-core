name: QORE CIBO cTrader DEMO Account Capability

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-ctrader-demo-account-capability.yml'
      - 'src/qore/infrastructure/cibo_ctrader_demo_account_capability.py'
      - 'src/qore/infrastructure/cibo_ctrader_demo_capability_registry.py'
      - 'scripts/cibo_ctrader_demo_account_capability_probe.py'
      - 'tests/infrastructure/test_cibo_ctrader_demo_account_capability.py'
      - 'tests/infrastructure/test_cibo_ctrader_demo_capability_registry.py'
      - 'tests/infrastructure/test_cibo_ctrader_demo_account_capability_probe.py'
      - 'docs/research/CIBO-CTRADER-DEMO-ACCOUNT-CAPABILITY-V1.md'
      - 'docs/research/CIBO-T16-T17-PROVIDER-CAPABILITY-RECONCILIATION-V1.md'
  push:
    branches:
      - agent/cibo-certification-architect-b-integration-001
      - agent/cibo-integrator-ab-001
    paths:
      - '.github/workflows/cibo-ctrader-demo-account-capability.yml'
      - 'src/qore/infrastructure/cibo_ctrader_demo_account_capability.py'
      - 'src/qore/infrastructure/cibo_ctrader_demo_capability_registry.py'
      - 'scripts/cibo_ctrader_demo_account_capability_probe.py'
      - 'tests/infrastructure/test_cibo_ctrader_demo_account_capability.py'
      - 'tests/infrastructure/test_cibo_ctrader_demo_capability_registry.py'
      - 'tests/infrastructure/test_cibo_ctrader_demo_account_capability_probe.py'
      - 'docs/research/CIBO-CTRADER-DEMO-ACCOUNT-CAPABILITY-V1.md'
      - 'docs/research/CIBO-T16-T17-PROVIDER-CAPABILITY-RECONCILIATION-V1.md'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  account-capability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src/qore/infrastructure/cibo_ctrader_demo_account_capability.py src/qore/infrastructure/cibo_ctrader_demo_capability_registry.py scripts/cibo_ctrader_demo_account_capability_probe.py tests/infrastructure/test_cibo_ctrader_demo_account_capability.py tests/infrastructure/test_cibo_ctrader_demo_capability_registry.py tests/infrastructure/test_cibo_ctrader_demo_account_capability_probe.py
      - name: mypy
        run: mypy src/qore/infrastructure/cibo_ctrader_demo_account_capability.py src/qore/infrastructure/cibo_ctrader_demo_capability_registry.py
      - name: py_compile
        run: python -m py_compile src/qore/infrastructure/cibo_ctrader_demo_account_capability.py src/qore/infrastructure/cibo_ctrader_demo_capability_registry.py scripts/cibo_ctrader_demo_account_capability_probe.py
      - name: pytest
        run: pytest -q --no-cov tests/infrastructure/test_cibo_ctrader_demo_account_capability.py tests/infrastructure/test_cibo_ctrader_demo_capability_registry.py tests/infrastructure/test_cibo_ctrader_demo_account_capability_probe.py
