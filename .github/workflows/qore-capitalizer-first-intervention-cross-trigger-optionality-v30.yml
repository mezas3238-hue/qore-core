name: QORE Capitalizer First-Intervention Cross-Trigger Optionality V30

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-first-intervention-cross-trigger-optionality-v30-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  V21_RUN_ID: '36264229554'
  V21_ARTIFACT_SHA: '05452328bbf5cbbc4b26210791d13114105e3f9d'
  V29_RUN_ID: '36283499014'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_first_intervention_cross_trigger_optionality_v30.py \
            tests/infrastructure/trader_lab/test_capitalizer_first_intervention_cross_trigger_optionality_v30.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_first_intervention_cross_trigger_optionality_v30.py \
            tests/infrastructure/trader_lab/test_capitalizer_first_intervention_cross_trigger_optionality_v30.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_first_intervention_cross_trigger_optionality_v30.py

  aggregate:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download authoritative reconstructed consumed evidence
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v21-reconstructed-*-${{ env.V21_ARTIFACT_SHA }}
          path: reconstructed
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ env.V21_RUN_ID }}
      - name: Download authoritative V29 native-M1 trigger states
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v29-trigger-state-*
          path: trigger-states
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ env.V29_RUN_ID }}
      - name: Run V30 first-intervention cross-trigger policy
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_first_intervention_cross_trigger_optionality_v30 \
            reconstructed/development-input \
            reconstructed/validation-input \
            reconstructed/reserved-input \
            reconstructed/development-validation-context \
            reconstructed/reserved-context \
            trigger-states \
            experiment-output
      - name: Enforce V30 contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "experiment-output/"
                  "capitalizer-first-intervention-cross-trigger-optionality-v30.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_FIRST_INTERVENTION_CROSS_TRIGGER_OPTIONALITY_V30"
          )
          assert report["evaluation"] == (
              "FIRST_SURFACE_INTERVENTION_CROSS_TRIGGER_MODE_ROUTING"
          )
          assert report["policy"] == (
              "FIRST_INTERVENTION_ROBUST_CROSS_TRIGGER_POSDELTA_NONDOWNSIDE"
          )
          assert report["source_trigger_state_run_id"] == 36283499014
          assert report["source_m1_run_id"] == 35548099334
          assert report["feature_dimension"] == 75
          assert report["l2_prior_strength_effective_trades"] == "12.0"
          assert report["decision_time"] == (
              "CAUSAL_SURFACE_FIRST_ACTUAL_PROTECTION_INTERVENTION"
          )
          assert report["single_decision_per_trade"] is True
          assert report["sequential_reevaluation_enabled"] is False
          assert report["later_trigger_commitment_enabled"] is True
          assert report["original_as_existing_mode_action"] is True
          assert report["native_m1_trigger_state_reused_from_v29"] is True
          assert report["trigger_time_portfolio_state_used"] is False
          assert report["trigger_time_cross_market_state_used"] is False
          assert len(report["eligible_actions_by_family"]["TRIGGER_050"]) == 9
          assert len(report["eligible_actions_by_family"]["TRIGGER_075"]) == 7
          assert len(report["eligible_actions_by_family"]["TRIGGER_100"]) == 4
          assert report["all_entries_preserved"] is True
          assert report["density_retention"] == "1"
          assert report["same_entrant_identities"] is True
          assert report["fixed_target_r"] == "2.00"
          assert report["original_stop_geometry_preserved_at_entry"] is True
          assert report["new_protection_geometry_created"] is False
          assert report["max3_preserved"] is True
          assert report["max3_slot_recycling"] is False
          assert report["chosen_prior_outcomes_recompute_future_state"] is True
          assert report["current_outcome_visible_to_decision"] is False
          assert report["heldout_counterfactual_visible_to_decision"] is False
          assert report["future_after_trigger_visible_to_decision"] is False
          assert report["activation_bar_ohlc_visible_to_decision"] is False
          assert report[
              "symbol_session_side_time_identity_features_used"
          ] is False
          assert report["historical_fresh_oos_available"] is False
          assert report["2018_2020_status"] == "CONSUMED_NOT_FRESH"
          assert report["trader_certified"] is False

          expected = {
              "DEVELOPMENT_2024_2026": 948,
              "CONSUMED_VALIDATION_2022_2024": 1034,
              "CONSUMED_RESERVED_2020_2022": 1088,
          }
          for row in report["results"]:
              assert row["trades"] == expected[row["period"]]
              assert row["density_retention"] == "1"
              assert row["first_intervention_decision_count"] > 0

          feature_dimensions = []
          for period_rows in report["model_diagnostics"].values():
              assert len(period_rows) == 3
              for family_rows in period_rows.values():
                  for action in family_rows.values():
                      if not action["available"]:
                          continue
                      assert action["training_trades"] > 0
                      assert action["feature_dimension"] == 75
                      feature_dimensions.append(action["feature_dimension"])
          assert feature_dimensions
          assert len(set(feature_dimensions)) == 1

          print(json.dumps(report, sort_keys=True))
          PY
      - name: Upload V30 evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-first-intervention-cross-trigger-optionality-v30-${{ github.sha }}
          path: experiment-output
          if-no-files-found: error
          retention-days: 90
