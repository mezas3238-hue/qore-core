name: QORE CIBO A1 Phase22 Scientific Consumption

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-a1-phase22-scientific-consumption.yml'
      - 'src/qore/infrastructure/cibo_a1_phase22_scientific_consumption.py'
      - 'tests/infrastructure/test_cibo_a1_phase22_scientific_consumption.py'
      - 'docs/research/CIBO-A1-PHASE22-SCIENTIFIC-CONSUMPTION-MANIFEST-V1.md'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  a1-phase22-scientific-consumption:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: A1 Phase22 scientific consumption manifest
        run: |
          ruff check \
            src/qore/infrastructure/cibo_a1_phase22_scientific_consumption.py \
            tests/infrastructure/test_cibo_a1_phase22_scientific_consumption.py
          mypy \
            src/qore/infrastructure/cibo_a1_phase22_scientific_consumption.py
          python -m py_compile \
            src/qore/infrastructure/cibo_a1_phase22_scientific_consumption.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_a1_phase22_scientific_consumption.py
