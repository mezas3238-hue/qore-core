name: QORE Scalper A2 C3 Native 9Market Paired Geometry

on:
  push:
    branches:
      - agent/scalper-architect-b-methodology-20261010
    paths:
      - '.github/workflows/qore-scalper-a2-c3-native-nine-market-geometry.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_a2_c3_native_geometry_census_v1.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_c3_source_variants_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_scalper_a2_c3_native_geometry_census_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_scalper_c3_source_variants_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-scalper-a2-c3-native-nine-${{ github.ref }}
  cancel-in-progress: true

env:
  CONTROL_RUN: '38053946695'
  CONTROL_SHA: 'e356e7a52541e99533b25ecfef0ab9c4e9ce03c0'
  NATIVE_RUN: '35548099334'
  NATIVE_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: C3 geometry quality and causal native fixtures
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_scalper_a2_c3_native_geometry_census_v1.py tests/infrastructure/trader_lab/test_capitalizer_scalper_a2_c3_native_geometry_census_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_scalper_a2_c3_native_geometry_census_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_scalper_a2_c3_native_geometry_census_v1.py tests/infrastructure/trader_lab/test_capitalizer_scalper_c3_source_variants_v1.py

  market:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol: [USDJPY, AUDJPY, AUDUSD, GBPJPY, EURUSD, GBPUSD, XAUUSD, USDCAD, NAS100]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Frozen original source ID ledger
        uses: actions/download-artifact@v4
        with:
          name: scalper-a2-v49-control-${{ matrix.symbol }}-${{ env.CONTROL_SHA }}
          path: original
          github-token: ${{ github.token }}
          run-id: ${{ env.CONTROL_RUN }}
      - name: Provider-native M1 bars for complete H1 only
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.NATIVE_SHA }}
          path: native
          github-token: ${{ github.token }}
          run-id: ${{ env.NATIVE_RUN }}
      - name: Fail closed if native manifest is not real
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path("native/m1-clone-manifest.json").read_text())
          assert d["canonical_symbol"]==os.environ["SYMBOL"]
          assert d["provider_native_m1"] is True
          assert d["synthetic_m1"] is False and d["interpolated_m1"] is False
          assert d["contradictory_m1"] == 0 and d["read_only"] is True
          PY
      - name: Compare December vs January C3 geom on every exact H1 triple
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_a2_c3_native_geometry_census_v1 market original native market-output
      - name: Assert all original IDs carried and no C3 admission changed
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads(Path("market-output/scalper-c3-native-market.json").read_text())
          assert x["symbol"]==os.environ["SYMBOL"]
          assert x["sources"]>0 and x["consecutive_h1_triples"]>0
          assert sum(x["geometry_counts"].values())==x["consecutive_h1_triples"]
          assert x["trades_reexecuted"]==0 and x["admissions_changed"]==0
          assert x["poi_and_ltf_cisd_not_independently_attested"] is True
          assert not x["authorizes_trading"]
          print("PAIRED C3 REAL NATIVE GEOMETRY",x)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-c3-native-${{ matrix.symbol }}-${{ github.sha }}
          path: market-output/
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: scalper-a2-c3-native-*-${{ github.sha }}
          path: market-inputs
          merge-multiple: false
      - name: Reconcile 9 market source and exact H1 geometry counts
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_a2_c3_native_geometry_census_v1 matrix market-inputs nine-market-output
      - name: Refuse certification or PF without POI and LTF CISD
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("nine-market-output/scalper-c3-native-nine-market.json").read_text())
          assert x["markets"]==9 and x["sources"]==2876
          assert sum(x["geometry_counts"].values())==x["consecutive_h1_triples"]
          assert x["master_frame_evaluated"] is False
          assert x["paper_pf"] is None and x["paper_max_dd_r"] is None
          assert x["source_geometry_not_full_methodology"] is True
          print("GEOMETRY ONLY C3 9MARKET",x["geometry_counts"])
          print("ORIGINAL V49 C3 BASIS",x["sources_c3_basis"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-c3-native-nine-market-${{ github.sha }}
          path: nine-market-output/
          retention-days: 90
          if-no-files-found: error
