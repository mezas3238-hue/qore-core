name: VT08 Index R110 Standard Entry PS Geometry Attribution

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r110-standard-entry-ps-geometry-attribution.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r110_standard_entry_ps_geometry_attribution.py
      - tests/infrastructure/trader_lab/test_vt08_index_r110_standard_entry_ps_geometry_attribution.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r110_standard_entry_ps_geometry_attribution.py

  attribution:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: \${{ secrets.GITHUB_TOKEN }}
          repository: \${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: \${{ secrets.GITHUB_TOKEN }}
          repository: \${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: \${{ secrets.GITHUB_TOKEN }}
          repository: \${{ github.repository }}
          run-id: 35166210458

      - name: Execute R110 entry / PS geometry attribution
        run: |
          mkdir -p artifacts/report
          python -m qore.infrastructure.trader_lab.vt08_index_r110_standard_entry_ps_geometry_attribution \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r110-standard-entry-ps-geometry-attribution.json

      - name: Verify R110 frozen diagnostic contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r110-standard-entry-ps-geometry-attribution.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R110_STANDARD_ENTRY_PS_GEOMETRY_ATTRIBUTION_001"
          )
          assert report["source_r109"]["run_id"] == 35588958471
          assert report["source_r109"]["artifact_id"] == 10633686630
          assert report["source_r109"]["artifact_digest"] == (
              "sha256:8c964890737439fe5c9473bc9d0eb2de2645f5d359f8d7bb99f5b14fefad51e0"
          )

          expected = {
              "five_year": (1756, 1049),
              "recent_two_year": (746, 452),
              "r66_failed_holdout": (546, 318),
          }
          for key, (sample, retest) in expected.items():
              section = report[key]
              assert section["sample"] == sample
              assert section["expected_sample"] == sample
              assert section["retest_available_count"] == retest
              dimensions = section["dimensions"]
              for name in (
                  "risk_to_preentry_h4_range",
                  "cisd_to_entry_distance",
                  "breakout_extension",
                  "continuation_body",
                  "directional_close_location",
                  "cisd_to_entry_age",
                  "poi_touch_to_entry_age",
                  "h4_phase",
                  "remaining_h4",
                  "period",
              ):
                  assert name in dimensions
                  assert sum(
                      int(row["sample"])
                      for row in dimensions[name].values()
                  ) == sample

          contract = report["preregistered_contract"]
          assert contract["rule_change"] is False
          assert contract["same_r102_fixed_weights"] is True
          assert contract["standard_only"] is True
          assert contract["classification_cutoff"] == "CONTINUATION_CLOSE"
          assert contract["future_h4_prices_used"] is False
          assert contract["outcome_used_for_bucket"] is False
          assert contract["calendar_or_year_used_for_bucket"] is False
          assert contract["runtime_filter_created"] is False

          gov = report["governance"]
          assert gov["research_only"] is True
          assert gov["consumed_evidence_only"] is True
          assert gov["candidate_created"] is False
          assert gov["signals_suppressed"] is False
          assert gov["trade_count_changed"] is False
          assert gov["target_changed"] is False
          assert gov["stop_changed"] is False
          assert gov["risk_allocator_changed"] is False
          assert gov["anchor_14_enabled"] is False
          assert gov["live_authorized"] is False
          assert gov["real_capital_authorized"] is False
          assert gov["production_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r110-standard-entry-ps-geometry-attribution-\${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
