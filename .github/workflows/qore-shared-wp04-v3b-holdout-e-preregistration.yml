name: QORE Shared WP04 V3B HOLDOUT_E Preregistration

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - scripts/shared_wp04_predictive_holdout_e_probe_v3b.py
      - scripts/shared_wp04_predictive_nonlinear_holdout_e_eval_v3b.py
      - src/qore/infrastructure/ctrader_demo_lab_vt31_v2_probe.py
      - tests/infrastructure/test_ctrader_demo_lab_vt31_v2_probe.py
      - .github/workflows/qore-shared-wp04-v3b-holdout-e-preregistration.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  holdout-e-preregistration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Announce HOLDOUT_E preregistration
        run: |
          gh issue comment 642 --body "WP-04 V3B HOLDOUT_E preregistration started — Git SHA \`${GITHUB_SHA}\`, run \`${GITHUB_RUN_ID}\`. Zero cTrader data access; HOLDOUT_E and REPLICATION_D remain sealed."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies without broker access
        run: pip install -e ".[dev,ctrader]"

      - name: Static and unit validation
        run: |
          ruff check \
            src/qore/infrastructure/ctrader_demo_lab_vt31_v2_probe.py \
            tests/infrastructure/test_ctrader_demo_lab_vt31_v2_probe.py \
            scripts/shared_wp04_predictive_holdout_e_probe_v3b.py \
            scripts/shared_wp04_predictive_nonlinear_holdout_e_eval_v3b.py
          python -m py_compile \
            scripts/shared_wp04_predictive_holdout_e_probe_v3b.py \
            scripts/shared_wp04_predictive_nonlinear_holdout_e_eval_v3b.py
          pytest -q tests/infrastructure/test_ctrader_demo_lab_vt31_v2_probe.py

      - name: Validate frozen HOLDOUT_E contract
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import inspect
          import shared_wp04_predictive_holdout_e_probe_v3b as collector
          import shared_wp04_predictive_nonlinear_holdout_e_eval_v3b as evaluator
          from qore.infrastructure.ctrader_demo_lab_vt31_v2_probe import (
              _REQUIRED_COVERAGE_DAYS,
              collect_vt31_v2_m1_evidence,
          )

          assert _REQUIRED_COVERAGE_DAYS == 730
          sig=inspect.signature(collect_vt31_v2_m1_evidence)
          assert sig.parameters["minimum_coverage_days"].default == 730

          assert collector.HOLDOUT_START.isoformat() == "2026-07-13T00:00:00+00:00"
          assert collector.HOLDOUT_END_EXCLUSIVE.isoformat() == "2026-09-25T00:00:00+00:00"
          assert collector.MINIMUM_COVERAGE_DAYS == 60
          assert collector.PURPOSE == "WP04_V3B_REPLACEMENT_ONE_SHOT_HOLDOUT_E"

          assert evaluator.HOLDOUT_PARTITION == "holdout_e"
          assert evaluator.HOLDOUT_START.isoformat() == "2026-07-13T00:00:00+00:00"
          assert evaluator.HOLDOUT_END_EXCLUSIVE.isoformat() == "2026-09-25T00:00:00+00:00"
          assert evaluator.MINIMUM_POOLED_INCREMENTAL_BPS == 100
          assert evaluator.MINIMUM_POSITIVE_TARGETS == 4
          PY

      - name: Assert zero evidence access
        run: |
          test -z "${QORE_CTRADER_ACCESS_TOKEN:-}"
          test -z "${QORE_CTRADER_REFRESH_TOKEN:-}"
          test -z "${QORE_CTRADER_DEMO_ACCESS_TOKEN:-}"
          test -z "${QORE_CTRADER_DEMO_REFRESH_TOKEN:-}"
          test ! -d fresh
          test ! -d input
          test ! -d result

      - name: Report HOLDOUT_E preregistration GREEN
        run: |
          gh issue comment 642 --body "WP-04 V3B HOLDOUT_E preregistration GREEN — Git SHA \`${GITHUB_SHA}\`, run \`${GITHUB_RUN_ID}\`. E locked to 2026-07-13..2026-09-25 with >=60 days provider span; gate remains >=100 bps pooled + >=4/8 targets positive. A/C remain CONSUMED_INVALID; B remains sealed; D remains sealed for replication only if E passes. No cTrader credentials or fresh evidence were opened."
