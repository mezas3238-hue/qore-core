name: Apply R62N exception and ordering repair

on:
  push:
    branches: [agent/qore-umi14-umi12-final-owner-recert-001]
    paths: [.github/workflows/r62n-exception-order-fix.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qore-umi14-umi12-final-owner-recert-001
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Apply repair
        env:
          PATCH_ZLIB_B64: ''
        run: |
          python - <<'PY'
          import base64, os, zlib
          payload = base64.b64decode(os.environ['PATCH_ZLIB_B64'])
          script = zlib.decompress(payload).decode('utf-8')
          exec(compile(script, '<r62n-patch>', 'exec'))
          PY
          python -m py_compile tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
      - name: Deterministic witnesses
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('tests/infrastructure').resolve()))
          n = importlib.import_module('test_universal_cross_asset_conformance_final_owner_r62n_guards')
          cases = {
              'safe_final': ('import builtins as b\ndef run():\n    return getattr(globals()["b"], "eval", lambda _: 3)("1+1")\ntry:\n    raise RuntimeError\nexcept RuntimeError:\n    b = len\nfinally:\n    result = run()\n', 3, False),
              'safe_mismatch': ('import builtins as b\ndef run():\n    return getattr(globals()["b"], "eval", lambda _: 3)("1+1")\ntry:\n    try:\n        raise ValueError\n    except KeyError:\n        result = run()\nexcept ValueError:\n    b = len\n    result = run()\n', 3, False),
              'safe_namedexpr': ('import builtins as b\ndef run():\n    return getattr(globals()["b"], "eval", lambda _: 3)("1+1")\ntry:\n    ((b := len), 1 / 0)\nexcept ZeroDivisionError:\n    result = run()\n', 3, False),
              'danger_namedexpr': ('import builtins\ndef run():\n    return getattr(globals()["b"], "eval", lambda _: 3)("1+1")\nb = len\ntry:\n    ((b := builtins), 1 / 0)\nexcept ZeroDivisionError:\n    result = run()\n', 2, True),
              'danger_implicit': ('def run():\n    return getattr(globals()["b"], "eval", lambda _: 3)("1+1")\ntry:\n    import builtins as b\n    1 / 0\nexcept ZeroDivisionError:\n    result = run()\nb = len\n', 2, True),
          }
          for name, (source, expected_runtime, expected_marker) in cases.items():
              namespace = {}
              exec(compile(source, '<staging>', 'exec', dont_inherit=True), namespace)
              markers = n._r62n_dynamic_execution_markers_from_source(source)
              print(name, namespace.get('result'), markers)
              assert namespace.get('result') == expected_runtime
              assert bool(markers) is expected_marker
          PY
      - name: Commit repair and remove staging workflow
        run: |
          set -euo pipefail
          git config user.name 'qore-integration-authority'
          git config user.email 'qore-integration-authority@users.noreply.github.com'
          git rm .github/workflows/r62n-exception-order-fix.yml
          git add tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
          git commit -m 'Harden R62N exception matching and ordering'
          git push origin HEAD:agent/qore-umi14-umi12-final-owner-recert-001
