name: QORE Scalper A2 Audit13 First-Online CISD Paired 9Market

on:
  push:
    branches:
      - agent/scalper-architect-b-methodology-20261010
    paths:
      - '.github/workflows/qore-scalper-a2-thirteenth-online-paired-nine-market.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_a2_thirteenth_cisd_stream_pairs_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_scalper_a2_thirteenth_cisd_stream_pairs_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: scalper-a2-audit13-online-${{ github.ref }}
  cancel-in-progress: true

env:
  CISD_RUN: '38095562104'
  CISD_SHA: 'a442a0d844b13cb4d013107b1b3721624abf574d'
  CONTROL_RUN: '38053946695'
  CONTROL_SHA: 'e356e7a52541e99533b25ecfef0ab9c4e9ce03c0'
  NATIVE_RUN: '35548099334'
  NATIVE_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Quality and streaming causality tests
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_scalper_a2_thirteenth_cisd_stream_pairs_v1.py tests/infrastructure/trader_lab/test_capitalizer_scalper_a2_thirteenth_cisd_stream_pairs_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_scalper_a2_thirteenth_cisd_stream_pairs_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_scalper_a2_thirteenth_cisd_stream_pairs_v1.py

  market:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol: [USDJPY, AUDJPY, AUDUSD, GBPJPY, EURUSD, GBPUSD, XAUUSD, USDCAD, NAS100]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: scalper-a2-v49-control-${{ matrix.symbol }}-${{ env.CONTROL_SHA }}
          path: original
          github-token: ${{ github.token }}
          run-id: ${{ env.CONTROL_RUN }}
      - uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.NATIVE_SHA }}
          path: native
          github-token: ${{ github.token }}
          run-id: ${{ env.NATIVE_RUN }}
      - uses: actions/download-artifact@v4
        with:
          name: scalper-a2-cisd-prefix-${{ matrix.symbol }}-${{ env.CISD_SHA }}
          path: cisd
          github-token: ${{ github.token }}
          run-id: ${{ env.CISD_RUN }}
      - name: Verify independent native M1, zero synthetic interpolation
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path("native/m1-clone-manifest.json").read_text())
          assert d["canonical_symbol"]==os.environ["SYMBOL"]
          assert d["provider_native_m1"] is True and d["synthetic_m1"] is False
          assert d["interpolated_m1"] is False and d["contradictory_m1"]==0
          assert d["read_only"] is True
          PY
      - name: Emit first event on discovery bar, measure paired forward horizons
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_a2_thirteenth_cisd_stream_pairs_v1 market original cisd native market-output
      - name: Verify ledger and no fictitious trade economics
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads(Path("market-output/scalper-thirteenth-stream-market.json").read_text())
          assert x["symbol"]==os.environ["SYMBOL"] and x["sources"]>0
          assert x["admission_changes"]==0 and x["trades_reexecuted"]==0
          assert x["frozen_381_window_disagreement"]>=0
          assert not x["author_certified"] and x["paper_pf"] is None
          print("AUDIT13 ONLINE PAIRS",x)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-audit13-stream-${{ matrix.symbol }}-${{ github.sha }}
          path: market-output/
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: scalper-a2-audit13-stream-*-${{ github.sha }}
          path: market-inputs
      - run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_a2_thirteenth_cisd_stream_pairs_v1 matrix market-inputs nine-market-output
      - name: All original IDs and no fabricated PF or DD
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("nine-market-output/scalper-thirteenth-stream-nine-market.json").read_text())
          assert x["markets"]==9 and x["sources"]==2876
          assert x["original_max3"]==2020 and x["admissions_changed"]==0
          assert x["cohorts"]["FROZEN_381"]["source_opportunities"]==381
          assert x["cohorts"]["FROZEN_2495"]["source_opportunities"]==2495
          assert x["paper_pf"] is None and x["paper_dd"] is None
          print("AUDIT13 PAIRED ONLINE 9MARKET",x)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-audit13-stream-nine-market-${{ github.sha }}
          path: nine-market-output/
          retention-days: 90
          if-no-files-found: error
