name: QORE Shared B Canonical Calendar Qualification Worklist

on:
  push:
    branches:
      - agent/shared-b-global-world-perception-001
    paths:
      - src/qore/infrastructure/core_stack_v2/shared_b_canonical_calendar_worklist.py
      - scripts/shared_b_canonical_calendar_worklist.py
      - tests/infrastructure/test_shared_b_canonical_calendar_worklist.py
      - .github/workflows/qore-shared-b-canonical-calendar-worklist.yml
  workflow_dispatch:

concurrency:
  group: qore-shared-b-canonical-calendar-worklist-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  FRONTIER_RUN_ID: "36775635034"
  FRONTIER_ARTIFACT_ID: "11125412870"
  FRONTIER_GIT_SHA: "d4956bd7fa02830be56648338c871a78c00374bd"
  FX_RUN_ID: "36765945116"
  FX_ARTIFACT_ID: "11123210080"
  FX_GIT_SHA: "2451df782dd2d82c61b2a03f084c0251399efe31"
  COMMODITY_RUN_ID: "36755839843"
  COMMODITY_ARTIFACT_ID: "11115769948"
  COMMODITY_GIT_SHA: "52092649a3f78e6449e52288786e1839a58ff916"

jobs:
  worklist:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Shared
        run: pip install -e ".[dev]"

      - name: Validate calendar worklist reducer
        run: |
          set -euo pipefail
          ruff check \
            src/qore/infrastructure/core_stack_v2/shared_b_canonical_calendar_worklist.py \
            scripts/shared_b_canonical_calendar_worklist.py \
            tests/infrastructure/test_shared_b_canonical_calendar_worklist.py
          mypy \
            src/qore/infrastructure/core_stack_v2/shared_b_canonical_calendar_worklist.py \
            scripts/shared_b_canonical_calendar_worklist.py
          pytest -q tests/infrastructure/test_shared_b_canonical_calendar_worklist.py

      - name: Verify exact sealed upstream lineages
        run: |
          set -euo pipefail
          for spec in \
            "${FRONTIER_RUN_ID}:${FRONTIER_GIT_SHA}" \
            "${FX_RUN_ID}:${FX_GIT_SHA}" \
            "${COMMODITY_RUN_ID}:${COMMODITY_GIT_SHA}"
          do
            run_id="${spec%%:*}"
            sha="${spec#*:}"
            test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')" = "completed"
            test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion')" = "success"
            test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.head_sha')" = "$sha"
          done

      - name: Recover sealed upstream artifacts
        run: |
          set -euo pipefail
          mkdir -p input/frontier input/fx input/commodity result

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FRONTIER_ARTIFACT_ID}/zip" > frontier.zip
          unzip -q frontier.zip -d input/frontier
          (cd input/frontier && sha256sum -c SHA256SUMS)
          frontier_file="$(find input/frontier -name shared-b-global-identity-frontier-v3.json -print -quit)"
          test -n "$frontier_file"

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FX_ARTIFACT_ID}/zip" > fx.zip
          unzip -q fx.zip -d input/fx
          (cd input/fx && sha256sum -c SHA256SUMS)
          fx_file="$(find input/fx -name shared-b-fx-market-hours-boundary.json -print -quit)"
          test -n "$fx_file"

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${COMMODITY_ARTIFACT_ID}/zip" > commodity.zip
          unzip -q commodity.zip -d input/commodity
          (cd input/commodity && sha256sum -c SHA256SUMS)
          commodity_file="$(find input/commodity -name shared-b-commodity-observation-identity-pack.json -print -quit)"
          test -n "$commodity_file"

          printf 'FRONTIER_FILE=%s\n' "$frontier_file" >> "$GITHUB_ENV"
          printf 'FX_FILE=%s\n' "$fx_file" >> "$GITHUB_ENV"
          printf 'COMMODITY_FILE=%s\n' "$commodity_file" >> "$GITHUB_ENV"

      - name: Build exact 177-sensor calendar worklist
        run: |
          python scripts/shared_b_canonical_calendar_worklist.py \
            --identity-frontier "$FRONTIER_FILE" \
            --fx-hours-boundary "$FX_FILE" \
            --commodity-pack "$COMMODITY_FILE" \
            --output result/shared-b-canonical-calendar-worklist.json \
            | tee result/summary.json

      - name: Enforce zero fabricated calendar bindings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(
              Path("result/shared-b-canonical-calendar-worklist.json").read_text()
          )
          assert p["identity"] == "SHARED_B_CANONICAL_CALENDAR_QUALIFICATION_WORKLIST_001"
          assert p["status"] == "EXACT_177_SENSOR_CALENDAR_WORKLIST_FROZEN"
          assert p["sensor_count"] == 177
          assert p["canonical_calendar_verified_count"] == 0
          assert p["calendar_binding_verified_count"] == 0
          assert p["qualification_record_count"] == 177
          assert p["category_counts"] == {
              "FX_DISTRIBUTED_OTC_CALENDAR_UNRESOLVED": 60,
              "INDEX_CURRENT_REFERENCE_CALENDAR_UNRESOLVED": 11,
              "INDEX_LEGACY_CALENDAR_BINDING_FORBIDDEN": 2,
              "INDEX_IDENTITY_BLOCKED": 12,
              "CRYPTO_IDENTITY_AND_MARKET_STRUCTURE_BLOCKED": 73,
              "DATED_FUTURES_CALENDAR_VERSION_UNRESOLVED": 5,
              "COMMODITY_REFERENCE_CALENDAR_SEMANTICS_UNRESOLVED": 14,
          }
          assert p["provider_schedule_is_canonical_calendar"] is False
          assert p["automatic_calendar_inference"] is False
          assert p["calendar_worklist_complete"] is True
          assert p["canonical_calendar_registry_complete"] is False
          assert p["relational_comparability_authorized"] is False
          assert p["target_or_outcome_read"] is False
          assert p["r6_r5_read"] is False
          assert p["fresh_holdout_opened"] is False
          assert p["historical_market_data_read"] is False
          assert p["broker_mutation"] is False
          assert p["productive_authority"] is False
          assert p["b07_complete"] is False
          assert p["b08_complete"] is False
          assert len(p["worklist_fingerprint_sha256"]) == 64
          PY

      - name: Seal B-07 calendar qualification worklist
        run: |
          printf '%s\n' "$GITHUB_SHA" > result/code-git-sha.txt
          printf '%s\n' "$GITHUB_RUN_ID" > result/run-id.txt
          (
            cd result
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
              | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload B-07 calendar worklist
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: qore-shared-b-canonical-calendar-worklist-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Report B-07 exact calendar blockers
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          gh issue comment 638 --repo "$GITHUB_REPOSITORY" --body "Architect B B-07 calendar qualification worklist: run ${GITHUB_RUN_ID}, SHA ${GITHUB_SHA}, artifact ${ARTIFACT_ID}. Exact 177-sensor blocker matrix frozen: 60 FX distributed-OTC calendar unresolved; 11 current official indices require calculation-calendar binding; 2 legacy indices require historical versioning; 12 indices identity-blocked; 73 crypto identity/market-structure blocked; 5 dated futures require versioned session calendars; 14 commodity reference objects require explicit temporal semantics. Canonical calendar bindings remain 0/177 by design; provider schedule was not promoted. B-07/B-08 remain OPEN."
