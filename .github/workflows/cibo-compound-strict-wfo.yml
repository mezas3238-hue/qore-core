name: QORE CIBO Compound Strict Walk-Forward

on:
  push:
    branches:
      - agent/cibo-profitability-lab-001
    paths:
      - '.github/workflows/cibo-compound-strict-wfo.yml'
      - 'scripts/cibo_compound_strict_walk_forward.py'
      - 'scripts/cibo_compound_protected_capital_reality_exam.py'
      - 'scripts/cibo_compound_trader_lab_side_capital_sweep.py'
      - 'src/qore/infrastructure/cibo_protected_reinvestment_policy.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  strict-wfo:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_ARTIFACT_ID: '11261743257'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install -e '.[dev]'

      - name: Static validation
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/cibo_compound_strict_walk_forward.py \
            scripts/cibo_compound_protected_capital_reality_exam.py \
            scripts/cibo_compound_trader_lab_side_capital_sweep.py
          ruff check \
            scripts/cibo_compound_strict_walk_forward.py \
            scripts/cibo_compound_protected_capital_reality_exam.py \
            scripts/cibo_compound_trader_lab_side_capital_sweep.py \
            src/qore/infrastructure/cibo_protected_reinvestment_policy.py \
            tests/infrastructure/test_cibo_protected_reinvestment_policy.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_protected_reinvestment_policy.py

      - name: Recover retained Trader Lab decision trace
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" \
            > "$RUNNER_TEMP/source.zip"
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/source"
          test -s "$RUNNER_TEMP/source/decision-trace.json"

      - name: Execute past-only strict WFO
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/strict-wfo"
          python scripts/cibo_compound_strict_walk_forward.py \
            --decision-trace "$RUNNER_TEMP/source/decision-trace.json" \
            --output "$RUNNER_TEMP/strict-wfo/report.json"

      - name: Verify causal train-test contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "strict-wfo"
                  / "report.json"
              ).read_text()
          )
          assert p["method"]["block_count"] == 5
          assert p["method"]["test_fold_count"] == 4
          assert p["method"]["test_parameter_frozen"] is True
          assert p["method"]["test_outcome_used_for_selection"] is False
          assert p["method"]["population_gate_used"] is False
          assert p["method"]["fresh_oos_claimed"] is False
          assert p["governance"]["broker_mutation"] is False
          assert p["governance"]["live"] is False
          assert p["governance"]["production"] is False
          assert p["governance"]["real_capital"] is False
          for surface in ("cibo_compound", "compound_portfolio"):
              assert p[surface]["fold_count"] == 4
              for fold in p[surface]["folds"]:
                  assert fold["selection_source"] == "TRAIN_BLOCK_ONLY"
                  assert fold["test_outcome_used_for_selection"] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-cibo-compound-strict-wfo-${{ github.run_id }}
          path: ${{ runner.temp }}/strict-wfo
          if-no-files-found: error
          retention-days: 90

      - name: Enforce strict four-of-four both surfaces
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "strict-wfo"
                  / "report.json"
              ).read_text()
          )
          assert p["gate_verdict"] == "PASS_STRICT_4_OF_4_BOTH_SURFACES", p
          PY
