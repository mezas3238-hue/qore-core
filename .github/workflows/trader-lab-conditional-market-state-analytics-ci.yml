name: QORE Trader Lab Conditional Market-State Analytics CI

on:
  push:
    branches:
      - agent/trader-lab-conditional-market-state-analytics-001
  pull_request:
    branches:
      - agent/qore-demo-first-execution-vertical-cert-001

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QORE development runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src tests
      - name: Focused conditional analytics tests
        run: pytest tests/infrastructure/trader_lab/test_conditional_market_state_analytics.py
      - name: Full pytest with coverage
        run: pytest --cov=src/qore --cov-report=term-missing
