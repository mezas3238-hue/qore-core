name: VT08 B R15 Source V2 Corrected EQ and POI Hierarchy
on:
  workflow_dispatch:
  push:
    branches:
      - agent/vt08-5m-cognition-replay-20261010
    paths:
      - src/qore/infrastructure/trader_lab/vt08_b_r15_v2_eq_poi_source_v1.py
      - tests/infrastructure/trader_lab/test_vt08_b_r15_v2_eq_poi_source_v1.py
      - .github/workflows/vt08-b-r15-v2-source-eq-poi-audit.yml
permissions:
  contents: read
  actions: read
jobs:
  native-m3-v2-source-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        market: [EURJPY, USDCHF, NZDUSD, CADJPY, USDCAD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Ruff and source-matrix adversarial tests
        run: |
          ruff check src/qore/infrastructure/trader_lab/vt08_b_r15_v2_eq_poi_source_v1.py tests/infrastructure/trader_lab/test_vt08_b_r15_v2_eq_poi_source_v1.py
          pytest -q tests/infrastructure/trader_lab/test_vt08_b_r15_v2_eq_poi_source_v1.py
      - uses: actions/download-artifact@v4
        with:
          name: vt08-a-frozen-m30m3-firstfail-${{ matrix.market }}-394116f13449fc310d7fbc5f0b5f60aa1bb247d4
          path: frozen-r3/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 38715560333
      - uses: actions/download-artifact@v4
        with:
          name: qore-vt08-m3-fractal-${{ matrix.market }}-bc1379d7661aac202495ec67afdd3098473ba723
          path: original-m3/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 35941643396
      - name: Recompute V2 alternate EQ on physical native bullish C2
        env:
          MARKET: ${{ matrix.market }}
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json, os
          from pathlib import Path
          from qore.infrastructure.trader_lab.vt08_b_r15_v2_eq_poi_source_v1 import (
              audit_frozen_bullish_eq, digest,
          )
          m=os.environ["MARKET"]
          a=list(Path("frozen-r3",m).rglob(m+"-frozen-source-firstfail.json"))
          n=list(Path("original-m3",m).rglob("m3-evidence.json"))
          if len(a)!=1 or len(n)!=1:
              raise SystemExit("R15 missing original immutable R3/M3 source")
          original=json.loads(a[0].read_text(encoding="utf-8"))
          out=audit_frozen_bullish_eq(
              original,market=m,original_native_m3=n[0],
          )
          expected={"EURJPY":538,"USDCHF":518,"NZDUSD":550,"CADJPY":516,"USDCAD":535}
          if out["frozen_cases"]!=expected[m] or out["counts"]["physical_bullish_c2"]!=expected[m]:
              raise SystemExit("R15 original cohort or C2 body altered")
          if (out["author_EQ_trade_authorized"] or out["author_POI_trade_authorized"]
              or out["author_complete_entries"] or out["broker_fills"] or out["real_cognitive_admissions"]):
              raise SystemExit("R15 false original TTrades authority")
          dest=Path("evidence",m+"-B-R15-V2-EQ-POI-source.json")
          dest.write_text(
              json.dumps(out,sort_keys=True,separators=(",",":"),allow_nan=False),
              encoding="utf-8",
          )
          print(json.dumps({
              "market":m,"cases":out["frozen_cases"],
              "counts":out["counts"],"sha256":digest(out),
              "source_complete":out["author_complete_entries"],
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vt08-b-r15-v2-eq-poi-${{ matrix.market }}-${{ github.sha }}
          path: evidence/*.json
          if-no-files-found: error
          retention-days: 30
