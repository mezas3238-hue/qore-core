name: QORE Capitalizer V3 Source First CISD 2Y V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-v3-source-first-cisd-2y-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v3_source_first_cisd_v1.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v3_source_first_cisd_2y_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v3_source_first_cisd_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v3_source_first_cisd_2y_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-v3-source-first-cisd-2y-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_v3_source_first_cisd_v1.py \
            src/qore/infrastructure/trader_lab/capitalizer_v3_source_first_cisd_2y_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_v3_source_first_cisd_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_v3_source_first_cisd_2y_v1.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_v3_source_first_cisd_v1.py \
            src/qore/infrastructure/trader_lab/capitalizer_v3_source_first_cisd_2y_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_v3_source_first_cisd_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_v3_source_first_cisd_2y_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_v3_source_first_cisd_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_v3_source_first_cisd_2y_v1.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {symbol: USDJPY, session: ASIA}
          - {symbol: AUDJPY, session: ASIA}
          - {symbol: AUDUSD, session: ASIA}
          - {symbol: GBPJPY, session: ASIA}
          - {symbol: EURUSD, session: LONDON}
          - {symbol: GBPUSD, session: LONDON}
          - {symbol: XAUUSD, session: NEW_YORK}
          - {symbol: USDCAD, session: NEW_YORK}
          - {symbol: NAS100, session: NEW_YORK}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable native-M1 clone
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Run isolated source-first CISD replay
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v3_source_first_cisd_2y_v1 \
            market m1-source replay-output --session ${{ matrix.session }}
      - name: Enforce market isolation
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
          EXPECTED_SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"]
          report = json.loads(
              (
                  Path("replay-output")
                  / f"capitalizer-{symbol.lower()}-v3-source-first-cisd-2y-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_V3_SOURCE_FIRST_CISD_2Y_V1"
          )
          assert report["symbol"] == symbol
          assert report["session"] == os.environ["EXPECTED_SESSION"]
          assert report["boundary_semantics"] == (
              "FIRST_OPPOSING_OPEN_AFTER_SWEEP_PERSISTS"
          )
          assert report["variant_only_change"] == "M3_CISD_BOUNDARY_SEMANTICS"
          for key in (
              "sweep_changed",
              "m5_closeback_changed",
              "swing_break_changed",
              "body_threshold_changed",
              "atr_threshold_changed",
              "fvg_changed",
              "fill_changed",
              "stop_changed",
              "target_changed",
              "lifecycle_changed",
              "max3_changed",
              "outcome_used_for_admission",
              "fresh_holdout_claimed",
              "economic_candidate",
              "rule_promotion_allowed",
              "trader_certified",
              "live_authorized",
              "real_capital_authorized",
          ):
              assert report[key] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v3-source-first-cisd-2y-v1-${{ matrix.symbol }}-${{ github.sha }}
          path: replay-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v3-source-first-cisd-2y-v1-*-${{ github.sha }}
          path: replay-input
          merge-multiple: false
      - name: Build nine-market source-first matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v3_source_first_cisd_2y_v1 \
            matrix replay-input matrix-output
      - name: Enforce aggregate isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "matrix-output/"
                  "capitalizer-nine-market-v3-source-first-cisd-2y-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_NINE_MARKET_V3_SOURCE_FIRST_CISD_2Y_V1"
          )
          assert report["market_count"] == 9
          assert report["baseline_max3_trades"] == 474
          assert report["boundary_semantics"] == (
              "FIRST_OPPOSING_OPEN_AFTER_SWEEP_PERSISTS"
          )
          assert report["variant_only_change"] == "M3_CISD_BOUNDARY_SEMANTICS"
          for key in (
              "sweep_changed",
              "m5_closeback_changed",
              "swing_break_changed",
              "body_threshold_changed",
              "atr_threshold_changed",
              "fvg_changed",
              "fill_changed",
              "stop_changed",
              "target_changed",
              "lifecycle_changed",
              "max3_changed",
              "outcome_used_for_admission",
              "fresh_holdout_claimed",
              "economic_candidate",
              "rule_promotion_allowed",
              "trader_certified",
              "live_authorized",
              "real_capital_authorized",
          ):
              assert report[key] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-nine-market-v3-source-first-cisd-2y-v1-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
