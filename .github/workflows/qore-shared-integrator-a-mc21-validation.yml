name: QORE Shared Integrator A MC21 Validation

on:
  push:
    branches:
      - agent/shared-integration-a-mc21-001
  pull_request:
    paths:
      - "src/qore/infrastructure/core_stack_v2/scientific_society.py"
      - "tests/infrastructure/test_core_stack_v2_scientific_society.py"
      - "scripts/shared_mc21_real_engine_society_cycle.py"
      - "scripts/shared_mc21_scientific_society_audit.py"
      - ".github/workflows/qore-shared-integrator-a-mc21-validation.yml"

concurrency:
  group: qore-shared-integrator-a-mc21-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Static and unit validation
        run: |
          set -euo pipefail
          ruff check             src/qore/infrastructure/core_stack_v2/scientific_society.py             src/qore/infrastructure/core_stack_v2/shared_zero_open_work.py             tests/infrastructure/test_core_stack_v2_scientific_society.py             scripts/shared_mc21_real_engine_society_cycle.py             scripts/shared_mc21_scientific_society_audit.py
          mypy src/qore/infrastructure/core_stack_v2/scientific_society.py
          pytest -q             tests/infrastructure/test_core_stack_v2_scientific_society.py             tests/infrastructure/test_core_stack_v2_shared_zero_open_work.py
      - name: Verify closure boundaries
        run: |
          python - <<'PY'
          from qore.infrastructure.core_stack_v2.shared_zero_open_work import (
              SharedWorkState,
              build_shared_master_open_work_ledger,
          )
          by_id={item.work_id:item for item in build_shared_master_open_work_ledger()}
          assert by_id["MC-21"].state is SharedWorkState.COMPLETED_AND_PROVEN
          assert by_id["MC-23"].state is not SharedWorkState.COMPLETED_AND_PROVEN
          assert by_id["MC-26"].state is not SharedWorkState.COMPLETED_AND_PROVEN
          assert by_id["MC-28"].state is not SharedWorkState.COMPLETED_AND_PROVEN
          PY
      - name: Recover sealed MC21 evidence
        run: |
          set -euo pipefail
          mkdir -p input/mc21
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11126741246/zip" > mc21.zip
          unzip -q mc21.zip -d input/mc21
          (cd input/mc21 && sha256sum -c SHA256SUMS)
      - name: Verify terminal MC21 claim
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(
              Path("input/mc21/mc21-real-engine-society-cycle.json").read_text()
          )
          assert p["status"] == "MC21_SCIENTIFIC_SOCIETY_COMPLETED_AND_PROVEN"
          assert p["required_role_count"] == 12
          assert p["real_engine_bound_role_count"] == 12
          assert p["all_roles_real_engine_bound"] is True
          assert p["verdict"] == "REJECTED_BY_FALSIFICATION"
          assert p["material_falsifier_roles"]
          assert p["minority_falsification_preserved"] is True
          assert p["simple_majority_voting_used"] is False
          assert p["sti5_v1_falsification_preserved"] is True
          assert p["knowledge_promotion_authority"] is False
          assert p["methodology_authority"] is False
          assert p["execution_authority"] is False
          assert p["risk_authority"] is False
          assert p["sizing_authority"] is False
          assert p["productive_authority"] is False
          assert p["mc21_completed_and_proven"] is True
          assert p["master_ledger_mutated"] is False
          assert p["protected_certification_holdout_opened"] is False
          PY
