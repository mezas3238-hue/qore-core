name: QORE Shared B Core Broker Real Replication

on:
  push:
    branches:
      - agent/shared-b-global-world-perception-001
    paths:
      - src/qore/infrastructure/core_stack_v2/shared_b_core_broker_observability.py
      - tests/infrastructure/test_shared_b_core_broker_observability.py
      - scripts/shared_b_core_broker_real_replication.py
      - .github/workflows/qore-shared-b-core-broker-real-replication.yml
  workflow_dispatch:

concurrency:
  group: qore-shared-b-core-broker-real-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  RAW_RUN_ID: "36746337433"
  RAW_ARTIFACT_ID: "11113260581"
  RAW_GIT_SHA: "80c83baf2538195e2c8ece17e286e80603aae571"
  EXPECTED_CATALOG_SHA256: "4c10aede99704b937caa772e1ae07257c8e12c3d0644c06ca751b6885b9a363f"

jobs:
  replicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
      QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
      QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
      QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
      QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Shared + cTrader
        run: pip install -e ".[dev,ctrader]"

      - name: Validate B-18 contracts and real-replication code
        run: |
          set -euo pipefail
          ruff check             src/qore/infrastructure/core_stack_v2/shared_b_core_broker_observability.py             tests/infrastructure/test_shared_b_core_broker_observability.py             scripts/shared_b_core_broker_real_replication.py
          mypy             src/qore/infrastructure/core_stack_v2/shared_b_core_broker_observability.py             scripts/shared_b_core_broker_real_replication.py
          pytest -q tests/infrastructure/test_shared_b_core_broker_observability.py

      - name: Verify authorized DEMO inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in             QORE_CTRADER_CLIENT_ID             QORE_CTRADER_CLIENT_SECRET             QORE_CTRADER_ACCESS_TOKEN             QORE_CTRADER_REFRESH_TOKEN
          do
            test -n "${!name:-}" || { echo "missing ${name}" >&2; exit 2; }
          done
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            [[ "$account_id" =~ ^[1-9][0-9]*$ ]]
            echo "::add-mask::$account_id"
            printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          else
            echo "::add-mask::$QORE_CTRADER_DEMO_ACCOUNT_ID"
          fi

      - name: Verify and recover sealed B-03 raw evidence
        run: |
          set -euo pipefail
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RAW_RUN_ID}" --jq '.status')" = "completed"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RAW_RUN_ID}" --jq '.conclusion')" = "success"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RAW_RUN_ID}" --jq '.head_sha')" = "$RAW_GIT_SHA"
          mkdir -p input/raw result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RAW_ARTIFACT_ID}/zip" > raw.zip
          unzip -q raw.zip -d input/raw
          (cd input/raw && sha256sum -c SHA256SUMS)
          test -f input/raw/shared-b-cross-asset-raw-manifest.json

      - name: Execute real read-only Core Broker replication
        run: |
          set -euo pipefail
          python scripts/shared_b_core_broker_real_replication.py             --raw-root input/raw             --raw-manifest input/raw/shared-b-cross-asset-raw-manifest.json             --expected-catalog-sha256 "$EXPECTED_CATALOG_SHA256"             --output result/shared-b-core-broker-real-replication.json             | tee result/summary.json

      - name: Enforce no-mutation observational result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(
              Path("result/shared-b-core-broker-real-replication.json").read_text()
          )
          assert p["identity"] == "SHARED_B_CORE_BROKER_REAL_REPLICATION_001"
          assert p["status"] == "REAL_READ_ONLY_CORE_BROKER_REPLICATION_PASS"
          assert p["core_runtime_executed"] is True
          assert p["core_runtime_deterministic_rebuild"] is True
          assert p["provider_catalog_matches_frozen"] is True
          assert p["enabled_symbol_count"] == 177
          assert len(p["system_assessments"]) == 3
          assert {
              row["system_kind"] for row in p["system_assessments"]
          } == {"PROVIDER","BROKER","CORE_COMPONENT"}
          assert all(
              row["state"] in {"HEALTHY","DEGRADED","UNAVAILABLE"}
              for row in p["system_assessments"]
          )
          assert all(
              row["mutation_authority"] is False
              and row["restart_authority"] is False
              and row["order_authority"] is False
              and row["risk_authority"] is False
              and row["sizing_authority"] is False
              and row["capital_authority"] is False
              for row in p["system_assessments"]
          )
          assert p["read_only_message_firewall"] is True
          assert p["target_or_outcome_read"] is False
          assert p["r6_r5_read"] is False
          assert p["fresh_holdout_opened"] is False
          assert p["broker_mutation"] is False
          assert p["productive_authority"] is False
          PY

      - name: Seal B-18 real evidence
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > result/code-git-sha.txt
          printf '%s\n' "$GITHUB_RUN_ID" > result/run-id.txt
          (
            cd result
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0               | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload B-18 real replication
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: qore-shared-b-core-broker-real-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Report B-18 real runtime result
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p=json.loads(
              Path("result/shared-b-core-broker-real-replication.json").read_text()
          )
          states=", ".join(
              f"{row['system_kind']}={row['state']}"
              for row in p["system_assessments"]
          )
          body="\n".join([
              "## Architect B — B-18 real read-only Core/Broker replication",
              "",
              f"- Git SHA: {os.environ['GITHUB_SHA']}",
              f"- run: {os.environ['GITHUB_RUN_ID']}",
              f"- artifact: {os.environ['ARTIFACT_ID']}",
              f"- systems: **{states}**",
              "- cTrader DEMO catalogue still 177 and frozen digest match: **True**",
              "- CoreStackV2Runtime executed on sealed real provider tick: **True**",
              "- deterministic Core rebuild: **PASS**",
              "- broker mutation/restart/order/Risk/sizing/capital authority: **False**",
              "- Target/outcome/R6/R5/fresh holdout opened: **False**",
          ])+"\n"
          Path("result/issue-comment.md").write_text(body)
          PY
          gh issue comment 638 --repo "$GITHUB_REPOSITORY" --body-file result/issue-comment.md
