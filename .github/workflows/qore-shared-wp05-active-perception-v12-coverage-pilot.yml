name: QORE Shared WP05 Active Perception V12 Coverage Pilot

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - src/qore/infrastructure/core_stack_v2/active_perception_v12_coverage_pilot.py
      - scripts/shared_wp05_active_perception_v12_coverage_pilot.py
      - tests/infrastructure/test_core_stack_v2_active_perception_v12_coverage_pilot.py
      - .github/workflows/qore-shared-wp05-active-perception-v12-coverage-pilot.yml
  workflow_dispatch:

concurrency:
  group: qore-shared-wp05-v12-coverage-pilot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
  QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}
  V12_MANIFEST_SHA256: 2f18b9f11d5893effa46ac85c712edd6646d1d90a9de521b235143e42155d191

jobs:
  r8-provider-history-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Shared + cTrader runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ctrader]"

      - name: Validate pilot code
        run: |
          set -euo pipefail
          ruff check \
            src/qore/infrastructure/core_stack_v2/active_perception_v12_coverage_pilot.py \
            scripts/shared_wp05_active_perception_v12_coverage_pilot.py \
            tests/infrastructure/test_core_stack_v2_active_perception_v12_coverage_pilot.py
          mypy \
            src/qore/infrastructure/core_stack_v2/active_perception_v12_coverage_pilot.py \
            scripts/shared_wp05_active_perception_v12_coverage_pilot.py
          python -m py_compile \
            src/qore/infrastructure/core_stack_v2/active_perception_v12_coverage_pilot.py \
            scripts/shared_wp05_active_perception_v12_coverage_pilot.py
          pytest -q \
            tests/infrastructure/test_core_stack_v2_active_perception_v12_coverage_pilot.py \
            tests/infrastructure/test_ctrader_historical_tick_data.py \
            tests/infrastructure/test_ctrader_historical_tick_collector.py \
            tests/infrastructure/test_historical_quote_side_evidence.py \
            tests/infrastructure/test_historical_quote_side_shards.py \
            tests/infrastructure/test_ctrader_open_api_permission_scope.py

      - name: Verify required DEMO secrets are present without printing them
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            QORE_CTRADER_CLIENT_ID \
            QORE_CTRADER_CLIENT_SECRET \
            QORE_CTRADER_ACCESS_TOKEN \
            QORE_CTRADER_REFRESH_TOKEN
          do
            if [ -z "${!name:-}" ]; then
              echo "missing required DEMO runtime input: ${name}" >&2
              exit 2
            fi
          done

      - name: Discover the single authorized DEMO account when not configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            if ! [[ "$account_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "cTrader DEMO account discovery returned an invalid id" >&2
              exit 3
            fi
            echo "::add-mask::$account_id"
            printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          else
            echo "::add-mask::$QORE_CTRADER_DEMO_ACCOUNT_ID"
          fi

      - name: Recover immutable consumed R8 market evidence
        run: |
          set -euo pipefail
          mkdir -p input/r8 result
          for attempt in 1 2 3 4; do
            if gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10402199719/zip" > r8.zip; then
              break
            fi
            rm -f r8.zip
            sleep $((attempt * 30))
          done
          test -s r8.zip
          unzip -q r8.zip -d input/r8
          (cd input/r8 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

      - name: Rebuild and bind frozen R8 acquisition manifest
        run: |
          set -euo pipefail
          python scripts/shared_wp05_active_perception_v12_acquisition_manifest.py \
            --r8-nas input/r8/fresh/NAS100/market-evidence.json \
            --r8-sp input/r8/fresh/SP500/market-evidence.json \
            --r8-us input/r8/fresh/US30/market-evidence.json \
            --provider-symbol USTEC \
            --output result/wp05-v12-r8-tick-acquisition-manifest.json \
            > result/manifest-summary.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = json.loads(
              Path("result/wp05-v12-r8-tick-acquisition-manifest.json").read_text()
          )
          assert p["identity"] == (
              "QORE_SHARED_WP05_ACTIVE_PERCEPTION_V12_ACQUISITION_MANIFEST_001"
          )
          assert p["partition"] == "r8"
          assert p["manifest_sha256"] == os.environ["V12_MANIFEST_SHA256"]
          assert p["target_or_outcome_used_for_selection"] is False
          assert p["r6_r5_read_for_selection"] is False
          assert p["fresh_holdout_opened"] is False
          PY

      - name: Run outcome-blind provider-history coverage pilot
        run: |
          set -euo pipefail
          python scripts/shared_wp05_active_perception_v12_coverage_pilot.py \
            --manifest result/wp05-v12-r8-tick-acquisition-manifest.json \
            --expected-manifest-sha256 "$V12_MANIFEST_SHA256" \
            --output-dir result/coverage-pilot \
            | tee result/coverage-pilot-summary.json

      - name: Validate pilot governance and evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(
              Path("result/coverage-pilot/coverage-pilot-report.json").read_text()
          )
          assert p["identity"] == (
              "QORE_SHARED_WP05_ACTIVE_PERCEPTION_V12_COVERAGE_PILOT_001"
          )
          assert p["partition"] == "r8"
          assert p["selection_rule"] == (
              "FIRST_Q1_MID_Q3_LAST_BY_MANIFEST_ORDINAL"
          )
          assert 1 <= len(p["selected_manifest_indices"]) <= 5
          assert p["read_only_message_firewall"] is True
          assert p["coverage_status"] in {
              "full_bid_ask_history",
              "partial_bid_ask_history",
              "no_history",
          }
          assert len(p["selection_sha256"]) == 64
          assert len(p["dataset_sha256"]) == 64
          assert p["target_or_outcome_used_for_selection"] is False
          assert p["target_or_outcome_read"] is False
          assert p["r6_r5_read"] is False
          assert p["fresh_holdout_opened"] is False
          assert p["shared_methodology_authority"] is False
          assert p["shared_sizing_authority"] is False
          assert p["shared_risk_authority"] is False
          assert p["shared_order_authority"] is False
          assert p["shared_execution_authority"] is False
          reports=p["window_reports"]
          if p["coverage_status"] == "full_bid_ask_history":
              assert all(
                  item["bid_count"] > 0 and item["ask_count"] > 0
                  for item in reports
              )
          if p["coverage_status"] == "no_history":
              assert all(
                  item["bid_count"] == 0 and item["ask_count"] == 0
                  for item in reports
              )
          PY

      - name: Bind coverage-pilot artifact
        if: always()
        run: |
          if [ -f result/coverage-pilot/coverage-pilot-report.json ]; then
            printf '%s\n' "$GITHUB_SHA" > result/coverage-pilot/git-sha.txt
            (
              cd result/coverage-pilot
              find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            )
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-shared-wp05-v12-r8-coverage-pilot-${{ github.sha }}
          path: |
            result/wp05-v12-r8-tick-acquisition-manifest.json
            result/manifest-summary.json
            result/coverage-pilot-summary.json
            result/coverage-pilot
          if-no-files-found: warn
          retention-days: 90

      - name: Report V12 coverage pilot
        if: always()
        run: |
          if [ ! -f result/coverage-pilot/coverage-pilot-report.json ]; then
            gh issue comment 643 --body "WP-05 V12 R8 provider-history coverage pilot `${GITHUB_RUN_ID}` failed technically before a valid sanitized coverage report was produced. No target/outcome, R6/R5 or fresh holdout was opened."
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p=json.loads(
              Path("result/coverage-pilot/coverage-pilot-report.json").read_text()
          )
          lines=[
              "## WP-05 V12 R8 provider-history coverage pilot",
              "",
              f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- GitHub Actions run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- selection: **{p['selection_rule']}**",
              f"- selected manifest indices: **{p['selected_manifest_indices']}**",
              f"- provider symbol: **{p['provider_symbol']}**",
              f"- coverage status: **{p['coverage_status']}**",
              f"- BID ticks retained: **{p['bid_tick_count']}**",
              f"- ASK ticks retained: **{p['ask_tick_count']}**",
              f"- immutable shards: **{p['shard_count']}**",
              f"- dataset SHA256: `{p['dataset_sha256']}`",
              "- acquisition used the V12 read-only message firewall",
              "- selection was manifest-ordinal only; no target/outcome was read",
              "- R6/R5 remain CLOSED",
              "- fresh holdout remains CLOSED",
              "- this pilot tests provider historical observability only; it is not scientific sensor admission",
          ]
          Path("result/coverage-pilot-issue.md").write_text(
              "\n".join(lines)+"\n"
          )
          PY
          gh issue comment 643 --body-file result/coverage-pilot-issue.md
