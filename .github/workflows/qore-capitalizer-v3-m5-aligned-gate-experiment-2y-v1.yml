name: QORE Capitalizer V3 M5 Aligned Gate Experiment 2Y V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-v3-m5-aligned-gate-experiment-2y-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v3_m5_aligned_gate_experiment_2y_v1.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v3_m5_directional_state_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v3_m5_aligned_gate_experiment_2y_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-v3-m5-aligned-gate-experiment-2y-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  V3_RUN_ID: '35806006221'
  V3_SHA: '7f9b9efc82376bb5edbea42379a0a3cf3e72a94a'
  MICRO_RUN_ID: '35805397236'
  MICRO_SHA: 'e3be1ed5dda60ab3a53257287c9471ce247d2554'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_v3_m5_aligned_gate_experiment_2y_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_v3_m5_aligned_gate_experiment_2y_v1.py
      - name: Mypy
        run: |
          mypy src/qore/infrastructure/trader_lab/capitalizer_v3_m5_aligned_gate_experiment_2y_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_v3_m5_aligned_gate_experiment_2y_v1.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        include:
          - {symbol: USDJPY, session: ASIA}
          - {symbol: AUDJPY, session: ASIA}
          - {symbol: AUDUSD, session: ASIA}
          - {symbol: GBPJPY, session: ASIA}
          - {symbol: EURUSD, session: LONDON}
          - {symbol: GBPUSD, session: LONDON}
          - {symbol: XAUUSD, session: NEW_YORK}
          - {symbol: USDCAD, session: NEW_YORK}
          - {symbol: NAS100, session: NEW_YORK}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download frozen V3 2Y market ledger
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-v3-frozen-replay-2y-v1-${{ matrix.symbol }}-${{ env.V3_SHA }}
          path: replay-source
          github-token: ${{ github.token }}
          run-id: ${{ env.V3_RUN_ID }}
      - name: Download frozen M5 context ledger
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-v3-m3-microstructure-context-2y-v1-${{ matrix.symbol }}-${{ env.MICRO_SHA }}
          path: micro-source
          github-token: ${{ github.token }}
          run-id: ${{ env.MICRO_RUN_ID }}
      - name: Apply frozen M5 ALIGNED gate
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v3_m5_aligned_gate_experiment_2y_v1 \
            market replay-source micro-source experiment-output
      - name: Enforce informational boundary
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
          EXPECTED_SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"]
          path = Path("experiment-output") / (
              f"capitalizer-{symbol.lower()}-v3-m5-aligned-gate-experiment-2y-v1.json"
          )
          report = json.loads(path.read_text())
          assert report["identity"] == (
              "QORE_CAPITALIZER_V3_M5_ALIGNED_GATE_EXPERIMENT_2Y_V1"
          )
          assert report["state_identity"] == "QORE_CAPITALIZER_V3_M5_DIRECTIONAL_STATE_V1"
          assert report["symbol"] == symbol
          assert report["session"] == os.environ["EXPECTED_SESSION"]
          assert sum(report["state_counts"].values()) == report["baseline_raw_trades"]
          assert report["aligned_raw_trades"] == report["state_counts"]["ALIGNED"]
          assert report["gate_uses_closeback_time_information_only"] is True
          assert report["neutral_is_fail_closed"] is True
          assert report["v3_signal_recomputed"] is False
          assert report["strategy_mutated"] is False
          assert report["stop_mutated"] is False
          assert report["target_mutated"] is False
          assert report["outcome_used_for_admission"] is False
          assert report["diagnostic_only"] is True
          assert report["economic_candidate"] is False
          assert report["fresh_holdout_claimed"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v3-m5-aligned-gate-experiment-2y-v1-${{ matrix.symbol }}-${{ github.sha }}
          path: experiment-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v3-m5-aligned-gate-experiment-2y-v1-*-${{ github.sha }}
          path: experiment-input
          merge-multiple: false
      - name: Build portfolio experiment matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v3_m5_aligned_gate_experiment_2y_v1 \
            matrix experiment-input matrix-output
      - name: Enforce aggregate controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "matrix-output/"
                  "capitalizer-nine-market-v3-m5-aligned-gate-experiment-2y-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_NINE_MARKET_V3_M5_ALIGNED_GATE_EXPERIMENT_2Y_V1"
          )
          assert report["market_count"] == 9
          assert report["baseline_raw_control_reproduced"] is True
          assert report["baseline_raw_trades"] == 475
          assert sum(report["state_counts_on_baseline_raw_trades"].values()) == 475
          assert report["aligned_raw_trades"] == (
              report["state_counts_on_baseline_raw_trades"]["ALIGNED"]
          )
          assert report["aligned_max3_trades"] <= report["aligned_raw_trades"]
          assert report["max3_reapplied_after_gate"] is True
          assert report["gate_uses_closeback_time_information_only"] is True
          assert report["neutral_is_fail_closed"] is True
          assert report["v3_signal_recomputed"] is False
          assert report["strategy_mutated"] is False
          assert report["stop_mutated"] is False
          assert report["target_mutated"] is False
          assert report["outcome_used_for_admission"] is False
          assert report["diagnostic_only"] is True
          assert report["economic_candidate"] is False
          assert report["fresh_holdout_claimed"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-nine-market-v3-m5-aligned-gate-experiment-2y-v1-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
