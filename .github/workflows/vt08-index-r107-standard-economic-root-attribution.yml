name: VT08 Index R107 Standard Economic Root Attribution

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r107-standard-economic-root-attribution.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r107_standard_economic_root_attribution.py
      - tests/infrastructure/trader_lab/test_vt08_index_r107_standard_economic_root_attribution.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r107_standard_economic_root_attribution.py

  forensics:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R107 economic-root attribution
        run: |
          mkdir -p artifacts/report
          python -m qore.infrastructure.trader_lab.vt08_index_r107_standard_economic_root_attribution \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r107-standard-economic-root-attribution.json

      - name: Verify R107 governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r107-standard-economic-root-attribution.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R107_STANDARD_ECONOMIC_ROOT_ATTRIBUTION_001"
          )
          assert report["source_r106"]["run_id"] == 35557035781
          assert report["source_r106"]["artifact_id"] == 10620887519
          assert report["source_r106"]["artifact_digest"] == (
              "sha256:6a58a578618ba34bdb960a08d12649220d457823b59e16d871e7cb6f31933efc"
          )
          assert report["source_contract"]["canonical_research_target_r"] == "2.5"
          assert report["source_contract"]["source_initial_target_r"] == "2"
          assert report["source_contract"]["close_or_retest_same_setup"] is True
          assert report["source_contract"]["retest_creates_new_setup"] is False
          assert report["five_year"]["canonical_sample"] == 2448
          assert report["recent_two_year"]["canonical_sample"] == 1017
          assert report["r66_failed_holdout"]["canonical_sample"] == 773
          assert report["five_year"]["standard_sample"] == 1756
          assert report["recent_two_year"]["standard_sample"] == 746
          assert report["r66_failed_holdout"]["standard_sample"] == 546

          for key in ("five_year", "recent_two_year", "r66_failed_holdout"):
              section = report[key]
              assert (
                  section["floor_saturation"]["floor_count"]
                  + section["floor_saturation"]["above_floor_count"]
                  == section["standard_sample"]
              )
              assert section["source_2r_counterfactual"]["target_grid_searched"] is False
              assert section["source_2r_counterfactual"]["allocator_recomputed"] is False
              assert section["retest_coverage"]["retest_is_alternate_same_setup"] is True
              assert section["retest_coverage"]["pnl_replayed_at_retest"] is False

          assert report["decision"] == (
              "R107_STANDARD_ECONOMIC_ROOT_ATTRIBUTION_COMPLETE_NO_RULE_CHANGE"
          )
          gov = report["governance"]
          assert gov["forensics_only"] is True
          assert gov["consumed_evidence_only"] is True
          assert gov["fresh_holdout_claim"] is False
          assert gov["signal_surface_changed"] is False
          assert gov["signals_suppressed"] is False
          assert gov["runtime_target_changed"] is False
          assert gov["runtime_entry_changed"] is False
          assert gov["allocator_recomputed_for_counterfactual"] is False
          assert gov["target_grid_searched"] is False
          assert gov["retest_pnl_evaluated"] is False
          assert gov["candidate_created"] is False
          assert gov["trader_certified"] is False
          assert gov["live_authorized"] is False
          assert gov["real_capital_authorized"] is False
          assert gov["production_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r107-standard-economic-root-attribution-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
