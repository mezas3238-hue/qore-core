name: QORE Capitalizer Market Stop State Family Lab V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-market-stop-state-family-lab-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_market_stop_state_family_lab_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_market_stop_state_family_lab_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-market-stop-state-family-lab-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  SOURCE_FORENSIC_RUN_ID: '35583377247'
  SOURCE_FORENSIC_SHA: 'e69998808dbbb0f57a51622c096b0a4f30006af1'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_market_stop_state_family_lab_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_market_stop_state_family_lab_v1.py
      - name: Mypy
        run: |
          mypy src/qore/infrastructure/trader_lab/capitalizer_market_stop_state_family_lab_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_market_stop_state_family_lab_v1.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol:
          - AUDJPY
          - AUDUSD
          - EURUSD
          - GBPJPY
          - GBPUSD
          - NAS100
          - USDCAD
          - USDJPY
          - XAUUSD
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install -e .
      - name: Download consumed M1 forensic dossier
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-m1-loss-causal-forensics-${{ matrix.symbol }}-${{ env.SOURCE_FORENSIC_SHA }}
          path: forensic-input
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_FORENSIC_RUN_ID }}
      - name: Build exact pre-trade state families
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_market_stop_state_family_lab_v1 \
            market forensic-input state-family-output
      - name: Enforce no outcome-defined families or buffer promotion
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"]
          path = Path("state-family-output") / (
              f"capitalizer-{symbol.lower()}-market-stop-state-families-v1.json"
          )
          report = json.loads(path.read_text())
          assert report["identity"] == "QORE_CAPITALIZER_MARKET_STOP_STATE_FAMILY_LAB_V1"
          assert report["symbol"] == symbol
          assert report["source_trade_count"] > 0
          assert report["family_count"] > 0
          assert report["family_key_uses_outcome"] is False
          assert report["exact_state_families_built"] is True
          assert report["buffer_candidate_frozen"] is False
          assert report["fresh_holdout_claimed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["economic_candidate"] is False
          assert report["trader_certified"] is False
          PY
      - name: Upload market state-family dossier
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-market-stop-state-family-${{ matrix.symbol }}-${{ github.sha }}
          path: state-family-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install -e .
      - name: Download nine state-family dossiers
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-market-stop-state-family-*-${{ github.sha }}
          path: state-family-input
          merge-multiple: false
      - name: Build nine-market state-family matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_market_stop_state_family_lab_v1 \
            matrix state-family-input matrix-output
      - name: Enforce research-only matrix
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "matrix-output/capitalizer-nine-market-stop-state-family-matrix-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_NINE_MARKET_STOP_STATE_FAMILY_MATRIX_V1"
          )
          assert report["market_count"] == 9
          assert report["total_trades"] == 10991
          assert report["total_families"] > 0
          assert report["family_key_uses_outcome"] is False
          assert report["buffer_candidate_frozen"] is False
          assert report["fresh_holdout_claimed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["economic_candidate"] is False
          assert report["trader_certified"] is False
          PY
      - name: Upload nine-market state-family matrix
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-nine-market-stop-state-family-matrix-v1-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
