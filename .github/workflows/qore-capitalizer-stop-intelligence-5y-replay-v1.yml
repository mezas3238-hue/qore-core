name: QORE Capitalizer Stop Intelligence 5Y Replay V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-stop-intelligence-5y-replay-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_market_stop_intelligence_5y_replay_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_market_stop_intelligence_5y_replay_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-stop-intelligence-5y-replay-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'
  SOURCE_5Y_RUN_ID: '35548659988'
  SOURCE_5Y_SHA: 'e7cc3ed4497cb5e51303de374d7e3c6eedaebcdd'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_market_stop_intelligence_5y_replay_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_market_stop_intelligence_5y_replay_v1.py
      - name: Mypy
        run: |
          mypy src/qore/infrastructure/trader_lab/capitalizer_market_stop_intelligence_5y_replay_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_market_stop_intelligence_5y_replay_v1.py

  market_replay:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {symbol: USDJPY, session: ASIA}
          - {symbol: AUDJPY, session: ASIA}
          - {symbol: AUDUSD, session: ASIA}
          - {symbol: GBPJPY, session: ASIA}
          - {symbol: EURUSD, session: LONDON}
          - {symbol: GBPUSD, session: LONDON}
          - {symbol: XAUUSD, session: NEW_YORK}
          - {symbol: USDCAD, session: NEW_YORK}
          - {symbol: NAS100, session: NEW_YORK}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install -e .
      - name: Download immutable 10Y native-M1 clone
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Download consumed recent 5Y native-M1 replay
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-5y-holdout-replay-${{ matrix.symbol }}-${{ env.SOURCE_5Y_SHA }}
          path: replay-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_5Y_RUN_ID }}
      - name: Replay Stop Intelligence on exact accepted entries
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_market_stop_intelligence_5y_replay_v1 \
            market replay-source m1-source stop-replay-output
      - name: Enforce 5Y replay governance
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
          EXPECTED_SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"]
          path = Path("stop-replay-output") / (
              f"capitalizer-{symbol.lower()}-stop-intelligence-5y-replay-v1.json"
          )
          report = json.loads(path.read_text())
          assert report["identity"] == "QORE_CAPITALIZER_MARKET_STOP_INTELLIGENCE_5Y_REPLAY_V1"
          assert report["stop_engine_identity"] == "QORE_CAPITALIZER_MARKET_STOP_COGNITIVE_ENGINE_V1"
          assert report["symbol"] == symbol
          assert report["session"] == os.environ["EXPECTED_SESSION"]
          assert report["source_trade_count"] > 0
          assert report["structural_executed_trades"] > 0
          assert report["entry_changed"] is False
          assert report["target_changed"] is False
          assert report["methodology_changed"] is False
          assert report["execution_buffer_ticks"] == "0"
          assert report["adaptive_buffer_frozen"] is False
          assert report["qore_risk_sizing_simulated"] is False
          assert report["spread_slippage_latency_applied"] is False
          assert report["fresh_holdout_claimed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["economic_candidate"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - name: Upload market Stop Intelligence replay
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-stop-intelligence-5y-${{ matrix.symbol }}-${{ github.sha }}
          path: stop-replay-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market_replay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install -e .
      - name: Download nine 5Y Stop Intelligence replays
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-stop-intelligence-5y-*-${{ github.sha }}
          path: replay-input
          merge-multiple: false
      - name: Build nine-market 5Y matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_market_stop_intelligence_5y_replay_v1 \
            matrix replay-input matrix-output
      - name: Enforce matrix boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "matrix-output/capitalizer-nine-market-stop-intelligence-5y-matrix-v1.json"
              ).read_text()
          )
          assert report["identity"] == "QORE_CAPITALIZER_NINE_MARKET_STOP_INTELLIGENCE_5Y_MATRIX_V1"
          assert report["market_count"] == 9
          assert report["source_trade_count"] == 10991
          assert report["structural_executed_trades"] > 0
          assert report["source_window"] == "2021-09-17_TO_2026-09-17"
          assert report["entry_changed"] is False
          assert report["target_changed"] is False
          assert report["methodology_changed"] is False
          assert report["execution_buffer_ticks"] == "0"
          assert report["adaptive_buffer_frozen"] is False
          assert report["qore_risk_sizing_simulated"] is False
          assert report["spread_slippage_latency_applied"] is False
          assert report["fresh_holdout_claimed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["economic_candidate"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - name: Upload nine-market 5Y Stop Intelligence matrix
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-nine-market-stop-intelligence-5y-v1-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
