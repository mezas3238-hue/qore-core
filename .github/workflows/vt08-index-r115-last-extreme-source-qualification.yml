name: VT08 Index R115 Last Extreme Source Qualification

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r115-last-extreme-source-qualification.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r115_last_extreme_source_qualification.py
      - tests/infrastructure/trader_lab/test_vt08_index_r115_last_extreme_source_qualification.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r115_last_extreme_source_qualification.py

  attribution:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R115 last-extreme source qualification
        run: |
          mkdir -p artifacts/report
          python -m qore.infrastructure.trader_lab.vt08_index_r115_last_extreme_source_qualification \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r115-last-extreme-source-qualification.json

      - name: Verify R115 frozen attribution contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r115-last-extreme-source-qualification.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R115_LAST_EXTREME_SOURCE_QUALIFICATION_ATTRIBUTION_001"
          )
          assert report["source_r114"]["run_id"] == 35665635210
          assert report["source_r114"]["artifact_id"] == 10669476302
          assert report["source_r114"]["artifact_digest"] == (
              "sha256:134027f3bc4c246c9316cc38df1de5bab6e01ac71a04eacb8516ad88280eaec7"
          )

          expected = {
              "five_year": 1756,
              "recent_two_year": 746,
              "r66_failed_holdout": 546,
          }
          for key, sample in expected.items():
              section = report[key]
              assert section["sample"] == sample
              assert section["expected_sample"] == sample
              assert sum(
                  int(row["sample"])
                  for row in section["by_last_state"].values()
              ) == sample
              assert sum(
                  int(row["sample"])
                  for row in section["by_last_qualification"].values()
              ) == sample
              assert sum(
                  int(row["sample"])
                  for row in section["by_source_qualification_family"].values()
              ) == sample

          contract = report["preregistered_contract"]
          assert contract["rule_change"] is False
          assert contract["standard_only"] is True
          assert contract["same_r102_fixed_weights"] is True
          assert contract["classification_cutoff"] == "CISD_CONFIRMATION"
          assert contract["r82_source_qualification_reused_exactly"] is True
          assert contract["r114_anatomy_reused_exactly"] is True
          assert contract["outcome_used_for_classification"] is False
          assert contract["calendar_or_year_used_for_classification"] is False
          assert contract["runtime_filter_created"] is False

          gov = report["governance"]
          assert gov["research_only"] is True
          assert gov["candidate_created"] is False
          assert gov["signals_suppressed"] is False
          assert gov["trade_count_changed"] is False
          assert gov["target_changed"] is False
          assert gov["stop_changed"] is False
          assert gov["risk_allocator_changed"] is False
          assert gov["runtime_filter_created"] is False
          assert gov["anchor_14_enabled"] is False
          assert gov["live_authorized"] is False
          assert gov["real_capital_authorized"] is False
          assert gov["production_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r115-last-extreme-source-qualification-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
