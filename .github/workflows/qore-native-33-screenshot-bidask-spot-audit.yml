name: QORE Native 33 owner BID ASK screenshot one-spot source audit NOT historic NET

on:
  push:
    branches:
      - research/qore-native-33-bidask-visual-snapshot-20261012
    paths:
      - '.github/workflows/qore-native-33-screenshot-bidask-spot-audit.yml'
      - 'docs/research/data/QORE_NATIVE_USER_BIDASK_SCREENSHOTS_33_SPOT_TRANSCRIPTION_2026-10-12.json'
      - 'src/qore/infrastructure/trader_lab/qore_native_g1_screenshot_bidask_spot_audit_v1.py'
      - 'tests/infrastructure/trader_lab/test_qore_native_g1_screenshot_bidask_spot_audit_v1.py'
      - 'docs/research/QORE_NATIVE_33_USER_BIDASK_SCREENSHOT_PROVENANCE_AND_SPREAD_GATE_2026-10-12.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze_owner_one_snapshot_33_quote_spreads:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install static Python research checks only
        run: python -m pip install -e '.[dev]'
      - name: Assert visually transcribed 33 snapshot prices are NOT history or execution
        run: |
          set -euo pipefail
          ruff check --select F,E4,E7,E9 src/qore/infrastructure/trader_lab/qore_native_g1_screenshot_bidask_spot_audit_v1.py tests/infrastructure/trader_lab/test_qore_native_g1_screenshot_bidask_spot_audit_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_qore_native_g1_screenshot_bidask_spot_audit_v1.py
          python -m qore.infrastructure.trader_lab.qore_native_g1_screenshot_bidask_spot_audit_v1 docs/research/data/QORE_NATIVE_USER_BIDASK_SCREENSHOTS_33_SPOT_TRANSCRIPTION_2026-10-12.json audited-spreads
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("audited-spreads/qore-native-33-spot-bidask-spreads-audited.json").read_text())
          assert r["visible_quote_coverage_33"]==33
          assert r["eligible_for_spot_spread_descriptive_comparison"]==30
          assert r["zero_display_spread_anomaly"]==["GBPUSD"]
          assert len(r["unverified_index_contract_aliases"])==2
          assert not r["historical_bidask_2016_2024_reconstructed"]
          assert not r["platform_broker_account_verified"]
          assert r["traders_certified"]==0 and r["production_untouched"]
          print("SNAPSHOT_BIDASK_33_33_SPREAD_SPOT_ONLY_NOT_G1_HISTORICAL_NET")
          PY
          printf '%s\n' "$GITHUB_SHA" > audited-spreads/exact-head-sha.txt
          (cd audited-spreads && sha256sum qore-native-33-spot-bidask-spreads-audited.json exact-head-sha.txt > OUTPUT_SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-native-owner-33-screenshot-bidask-spot-only-${{ github.sha }}
          path: audited-spreads/
          retention-days: 90
          if-no-files-found: error
