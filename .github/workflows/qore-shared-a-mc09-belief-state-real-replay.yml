name: QORE Shared A MC09 Belief State Real Replay

concurrency:
  group: qore-shared-a-mc09-belief-state-real-replay
  cancel-in-progress: false

on:
  push:
    branches:
      - agent/shared-a-cognitive-science-001
    paths:
      - scripts/shared_mc09_belief_state_real_position_replay.py
      - .github/workflows/qore-shared-a-mc09-belief-state-real-replay.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Recover immutable position source evidence
        run: |
          set -euo pipefail
          mkdir -p input/{pure,r6,r5} result
          ruff check scripts/shared_mc09_belief_state_real_position_replay.py
          python -m py_compile scripts/shared_mc09_belief_state_real_position_replay.py

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10799064861/zip" > pure.zip
          unzip -q pure.zip -d input/pure
          (cd input/pure && sha256sum -c SHA256SUMS)
          test -f input/pure/r6.json
          test -f input/pure/r5.json

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10389112524/zip" > r6.zip
          unzip -q r6.zip -d input/r6
          (cd input/r6 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10380044761/zip" > r5.zip
          unzip -q r5.zip -d input/r5
          (cd input/r5 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

      - name: Replay current belief state on real causal sequences
        run: |
          set -euo pipefail
          python scripts/shared_mc09_belief_state_real_position_replay.py             --r6-trades input/pure/r6.json             --r6-nas input/r6/fresh/NAS100/market-evidence.json             --r6-sp input/r6/fresh/SP500/market-evidence.json             --r6-us input/r6/fresh/US30/market-evidence.json             --r5-trades input/pure/r5.json             --r5-nas input/r5/fresh/NAS100/market-evidence.json             --r5-sp input/r5/fresh/SP500/market-evidence.json             --r5-us input/r5/fresh/US30/market-evidence.json             --output result/mc09-belief-state-real-replay.json             | tee result/summary.json

      - name: Validate bounded MC-09 state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/mc09-belief-state-real-replay.json").read_text())
          assert p["status"] == "MC09_BELIEF_STATE_ENGINE_REAL_DATA_BOUND_CAUSAL_REPLAY_PASS"
          assert p["proof"]["real_position_sequences"] is True
          assert p["proof"]["causal_source_only"] is True
          assert p["proof"]["future_market_used"] is False
          assert p["proof"]["future_outcome_used"] is False
          assert p["proof"]["pnl_used"] is False
          assert p["scientific_claims"]["belief_calibration_demonstrated"] is False
          assert p["scientific_claims"]["oos_value_demonstrated"] is False
          assert p["scientific_claims"]["mc09_completed_and_proven"] is False
          assert p["governance"]["protected_certification_holdout_opened"] is False
          PY

      - name: Seal result
        run: |
          printf '%s\n' "${GITHUB_SHA}" > result/code-git-sha.txt
          (
            cd result
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-a-mc09-belief-state-real-replay-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
      - name: Report MC-09 foundation
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p=json.loads(Path("result/mc09-belief-state-real-replay.json").read_text())
          body="\n".join([
              "## Shared A MC-09 — Explicit Belief State Real Replay",
              "",
              f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- disposition: **{p['status']}**",
              f"- R6: **{p['results']['r6']}**",
              f"- R5: **{p['results']['r5']}**",
              "- future/outcome/PnL used: **False / False / False**",
              "- belief calibration demonstrated: **False**",
              "- OOS value demonstrated: **False**",
              "- MC-09 completed-and-proven: **False**",
              "- protected certification holdout opened: **False**",
          ])+"\n"
          Path("result/issue-comment.md").write_text(body)
          PY
          gh issue comment 638 --body-file result/issue-comment.md
