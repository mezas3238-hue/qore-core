name: QORE CIBO Phase22 Next Exam Source Availability

on:
  push:
    branches:
      - agent/cibo-next-policy-sovereign-integration-001
    paths:
      - 'src/qore/infrastructure/cibo_phase22_next_exam_source_availability.py'
      - 'tests/infrastructure/test_cibo_phase22_next_exam_source_availability.py'
      - '.github/workflows/cibo-phase22-next-exam-source-availability.yml'

concurrency:
  group: cibo-phase22-next-exam-source-availability-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
  QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}

jobs:
  source-availability:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,ctrader]'
      - name: Static and unit quality
        run: |
          python -m ruff check \
            src/qore/infrastructure/cibo_phase22_next_exam_source_availability.py \
            tests/infrastructure/test_cibo_phase22_next_exam_source_availability.py
          python -m pytest -q \
            tests/infrastructure/test_cibo_phase22_next_exam_source_availability.py \
            tests/infrastructure/test_cibo_phase22_next_exam_governance.py \
            tests/infrastructure/test_cibo_next_policy_code_bundle_lineage.py \
            tests/infrastructure/test_cibo_next_policy_advanced_scientific_eligibility.py
      - name: Verify DEMO read-only credential inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in QORE_CTRADER_CLIENT_ID QORE_CTRADER_CLIENT_SECRET QORE_CTRADER_ACCESS_TOKEN QORE_CTRADER_REFRESH_TOKEN; do
            test -n "${!name:-}" || { echo "missing required DEMO input: $name" >&2; exit 2; }
          done
      - name: Discover DEMO account when not configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            [[ "$account_id" =~ ^[1-9][0-9]*$ ]] || exit 3
            echo "::add-mask::$account_id"
            printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          fi
      - name: Probe preregistered V3 boundaries read-only
        run: |
          mkdir -p artifacts
          python -m qore.infrastructure.cibo_phase22_next_exam_source_availability \
            artifacts/source-availability.json \
            > artifacts/source-availability.stdout.json
      - name: Enforce non-mutating source-only governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("artifacts/source-availability.json").read_text()
          )
          assert payload["candidate_id"] == (
              "CIBO_USD60_6M_HOLDOUT_2015-04-19_2015-10-19_V3"
          )
          assert payload["window"]["start"] == "2015-04-19T00:00:00+00:00"
          assert payload["window"]["end_exclusive"] == "2015-10-19T00:00:00+00:00"
          assert payload["candidate_burn_clean"] is True
          assert payload["probe_count"] == 10
          assert payload["required_surface_count"] == 10
          assert payload["source_available"] is True
          assert payload["status"] == "SOURCE_AVAILABLE"
          assert payload["trader_logic_executed"] is False
          assert payload["outcomes_inspected"] is False
          assert payload["broker_mutation"] is False
          assert payload["positions_opened"] == 0
          assert payload["positions_closed"] == 0
          assert payload["orders_created"] == 0
          assert payload["orders_modified"] == 0
          assert payload["orders_cancelled"] == 0
          assert payload["allowed_broker_request_types"] == [
              "ProtoOAGetTrendbarsReq",
              "ProtoOASymbolsListReq",
          ]
          assert payload["live_authorized"] is False
          assert payload["real_capital_authorized"] is False
          assert payload["production_authorized"] is False
          PY
      - name: Seal source availability evidence
        run: |
          printf '%s\n' "$GITHUB_SHA" > artifacts/git-sha.txt
          cd artifacts
          sha256sum \
            source-availability.json \
            source-availability.stdout.json \
            git-sha.txt \
            > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-phase22-next-exam-source-availability-${{ github.sha }}
          path: artifacts
          if-no-files-found: error
          retention-days: 90
