name: QORE CIBO cTrader DEMO Provider Economics Calibration

on:
  push:
    branches:
      - agent/cibo-capital-efficiency-sizing-lab-001
      - agent/cibo-certification-architect-b-integration-001
    paths:
      - '.github/workflows/cibo-ctrader-demo-provider-economics.yml'
      - 'src/qore/infrastructure/cibo_ctrader_demo_provider_economics.py'
      - 'src/qore/infrastructure/cibo_ctrader_demo_account_capability.py'
      - 'src/qore/infrastructure/cibo_ctrader_demo_capability_registry.py'
      - 'src/qore/infrastructure/cibo_ctrader_demo_instrument_taxonomy.py'
      - 'src/qore/infrastructure/cibo_ce2i_provider_economics_evidence.py'
      - 'src/qore/infrastructure/cibo_ce2i_provider_economics_provenance.py'
      - 'src/qore/infrastructure/cibo_ce2i_provider_economics_component_freeze.py'
      - 'src/qore/infrastructure/cibo_ce2i_provider_execution_calibration.py'
      - 'src/qore/infrastructure/cibo_ce2i_t17_limited_risk_capability.py'
      - 'src/qore/infrastructure/ctrader_open_api_client.py'
      - 'scripts/cibo_ctrader_demo_provider_economics_probe.py'
      - 'scripts/cibo_ctrader_demo_account_capability_probe.py'
      - 'scripts/cibo_phase20_provider_execution_calibration.py'
      - 'tests/infrastructure/test_cibo_ctrader_demo_provider_economics.py'
      - 'tests/infrastructure/test_cibo_ctrader_demo_account_capability_probe.py'
      - 'tests/infrastructure/test_cibo_ctrader_demo_instrument_taxonomy.py'
      - 'tests/infrastructure/test_cibo_ce2i_provider_economics_evidence.py'
      - 'tests/infrastructure/test_cibo_ce2i_provider_economics_provenance.py'
      - 'tests/infrastructure/test_cibo_ce2i_provider_economics_component_freeze.py'
      - 'tests/infrastructure/test_cibo_ce2i_provider_execution_calibration.py'
      - 'tests/infrastructure/test_cibo_ce2i_t17_limited_risk_capability.py'
      - 'tests/infrastructure/test_cibo_phase20_provider_execution_calibration_export.py'
      - 'docs/research/CIBO-B-PROVIDER-ECONOMICS-COMPONENT-FREEZE-V1.md'
  pull_request:
    paths:
      - '.github/workflows/cibo-ctrader-demo-provider-economics.yml'
      - 'src/qore/infrastructure/cibo_ctrader_demo_provider_economics.py'
      - 'src/qore/infrastructure/cibo_ctrader_demo_account_capability.py'
      - 'src/qore/infrastructure/cibo_ctrader_demo_capability_registry.py'
      - 'src/qore/infrastructure/cibo_ctrader_demo_instrument_taxonomy.py'
      - 'src/qore/infrastructure/cibo_ce2i_provider_economics_evidence.py'
      - 'src/qore/infrastructure/cibo_ce2i_provider_economics_provenance.py'
      - 'src/qore/infrastructure/cibo_ce2i_provider_economics_component_freeze.py'
      - 'src/qore/infrastructure/cibo_ce2i_provider_execution_calibration.py'
      - 'src/qore/infrastructure/cibo_ce2i_t17_limited_risk_capability.py'
      - 'src/qore/infrastructure/ctrader_open_api_client.py'
      - 'scripts/cibo_ctrader_demo_provider_economics_probe.py'
      - 'scripts/cibo_ctrader_demo_account_capability_probe.py'
      - 'scripts/cibo_phase20_provider_execution_calibration.py'
      - 'tests/infrastructure/test_cibo_ctrader_demo_provider_economics.py'
      - 'tests/infrastructure/test_cibo_ctrader_demo_account_capability_probe.py'
      - 'tests/infrastructure/test_cibo_ctrader_demo_instrument_taxonomy.py'
      - 'tests/infrastructure/test_cibo_ce2i_provider_economics_evidence.py'
      - 'tests/infrastructure/test_cibo_ce2i_provider_economics_provenance.py'
      - 'tests/infrastructure/test_cibo_ce2i_provider_economics_component_freeze.py'
      - 'tests/infrastructure/test_cibo_ce2i_provider_execution_calibration.py'
      - 'tests/infrastructure/test_cibo_ce2i_t17_limited_risk_capability.py'
      - 'tests/infrastructure/test_cibo_phase20_provider_execution_calibration_export.py'
      - 'docs/research/CIBO-B-PROVIDER-ECONOMICS-COMPONENT-FREEZE-V1.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
  QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}

jobs:
  provider-economics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cTrader-capable development environment
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ctrader]"

      - name: Quality
        run: |
          ruff check \
            src/qore/infrastructure/cibo_ctrader_demo_provider_economics.py \
            src/qore/infrastructure/cibo_ctrader_demo_account_capability.py \
            src/qore/infrastructure/cibo_ctrader_demo_capability_registry.py \
            src/qore/infrastructure/cibo_ctrader_demo_instrument_taxonomy.py \
            src/qore/infrastructure/cibo_ce2i_provider_economics_evidence.py \
            src/qore/infrastructure/cibo_ce2i_provider_economics_provenance.py \
            src/qore/infrastructure/cibo_ce2i_provider_economics_component_freeze.py \
            src/qore/infrastructure/cibo_ce2i_provider_execution_calibration.py \
            src/qore/infrastructure/cibo_ce2i_t17_limited_risk_capability.py \
            src/qore/infrastructure/ctrader_open_api_client.py \
            scripts/cibo_ctrader_demo_provider_economics_probe.py \
            scripts/cibo_ctrader_demo_account_capability_probe.py \
            scripts/cibo_phase20_provider_execution_calibration.py \
            tests/infrastructure/test_cibo_ctrader_demo_provider_economics.py \
            tests/infrastructure/test_cibo_ctrader_demo_account_capability_probe.py \
            tests/infrastructure/test_cibo_ctrader_demo_instrument_taxonomy.py \
            tests/infrastructure/test_cibo_ce2i_provider_economics_evidence.py \
            tests/infrastructure/test_cibo_ce2i_provider_economics_provenance.py \
            tests/infrastructure/test_cibo_ce2i_provider_economics_component_freeze.py \
            tests/infrastructure/test_cibo_ce2i_provider_execution_calibration.py \
            tests/infrastructure/test_cibo_ce2i_t17_limited_risk_capability.py \
            tests/infrastructure/test_cibo_phase20_provider_execution_calibration_export.py
          mypy \
            src/qore/infrastructure/cibo_ctrader_demo_provider_economics.py \
            src/qore/infrastructure/cibo_ctrader_demo_account_capability.py \
            src/qore/infrastructure/cibo_ctrader_demo_capability_registry.py \
            src/qore/infrastructure/cibo_ctrader_demo_instrument_taxonomy.py \
            src/qore/infrastructure/cibo_ce2i_provider_economics_evidence.py \
            src/qore/infrastructure/cibo_ce2i_provider_economics_provenance.py \
            src/qore/infrastructure/cibo_ce2i_provider_economics_component_freeze.py \
            src/qore/infrastructure/cibo_ce2i_provider_execution_calibration.py \
            src/qore/infrastructure/cibo_ce2i_t17_limited_risk_capability.py \
            scripts/cibo_ctrader_demo_provider_economics_probe.py \
            scripts/cibo_ctrader_demo_account_capability_probe.py \
            scripts/cibo_phase20_provider_execution_calibration.py
          python -m py_compile \
            src/qore/infrastructure/cibo_ce2i_provider_economics_evidence.py \
            src/qore/infrastructure/cibo_ce2i_provider_economics_provenance.py \
            src/qore/infrastructure/cibo_ce2i_provider_economics_component_freeze.py \
            src/qore/infrastructure/cibo_ce2i_provider_execution_calibration.py \
            src/qore/infrastructure/cibo_ce2i_t17_limited_risk_capability.py \
            scripts/cibo_ctrader_demo_account_capability_probe.py \
            scripts/cibo_phase20_provider_execution_calibration.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_ctrader_demo_provider_economics.py \
            tests/infrastructure/test_cibo_ctrader_demo_account_capability_probe.py \
            tests/infrastructure/test_cibo_ctrader_demo_instrument_taxonomy.py \
            tests/infrastructure/test_cibo_ce2i_provider_economics_evidence.py \
            tests/infrastructure/test_cibo_ce2i_provider_economics_provenance.py \
            tests/infrastructure/test_cibo_ce2i_provider_economics_component_freeze.py \
            tests/infrastructure/test_cibo_ce2i_provider_execution_calibration.py \
            tests/infrastructure/test_cibo_ce2i_t17_limited_risk_capability.py \
            tests/infrastructure/test_cibo_phase20_provider_execution_calibration_export.py

      - name: Verify DEMO credentials without printing them
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            QORE_CTRADER_CLIENT_ID \
            QORE_CTRADER_CLIENT_SECRET \
            QORE_CTRADER_ACCESS_TOKEN \
            QORE_CTRADER_REFRESH_TOKEN
          do
            test -n "${!name:-}" || {
              echo "::error::missing required cTrader DEMO secret: $name"
              exit 1
            }
          done
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          fi

      - name: Collect provider economics read-only
        run: |
          mkdir -p provider-economics
          python scripts/cibo_ctrader_demo_provider_economics_probe.py \
            --output provider-economics/provider-economics.json \
            > provider-economics/provider-economics.stdout.json
          python scripts/cibo_ctrader_demo_account_capability_probe.py \
            --output provider-economics/account-capability.json \
            > provider-economics/account-capability.stdout.json

      - name: Enforce no-mutation/no-history governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("provider-economics/provider-economics.json").read_text()
          )
          assert payload["provider_key"] == "ctrader-demo"
          assert payload["environment"] == "demo"
          assert payload["broker_mutation_performed"] is False
          assert payload["historical_exact_claimed"] is False
          assert payload["holdout_outcomes_used"] is False
          assert payload["target_aware"] is False
          assert payload["slippage_empirically_calibrated"] is False
          assert payload["execution_model_ready"] is False
          assert set(payload["symbols"]) == {
              "AUDJPY", "EURUSD", "GBPJPY",
              "GBPUSD", "NAS100", "XAUUSD",
          }
          for symbol, row in payload["symbols"].items():
              assert row["source"] == "CTRADER_OPEN_API_READ_ONLY", symbol
              assert row["provider"] == "ctrader-demo", symbol
              assert row["effective_period"] == (
                  "POINT_IN_TIME_AT_OBSERVED_AT"
              ), symbol
              assert row["observed_at"], symbol
              assert row["provenance"] == (
                  "PROVIDER_NATIVE_SYMBOL_SPOT_AND_EXPECTED_MARGIN"
              ), symbol

          capability = json.loads(
              Path("provider-economics/account-capability.json").read_text()
          )
          assert capability["provider_key"] == "ctrader-demo"
          assert capability["environment"] == "demo"
          assert capability["account_type"] in {
              "HEDGED", "NETTED", "SPREAD_BETTING", "UNKNOWN"
          }
          assert capability["catalog_sha256"].startswith("sha256:")
          assert capability["symbol_count"] > 0
          assert isinstance(capability["taxonomy_binding_complete"], bool)
          if capability["taxonomy_binding_complete"]:
              assert capability["taxonomy_sha256"].startswith("sha256:")
              assert capability["asset_classes"]
              assert capability["symbol_categories"]
          assert isinstance(capability["option_taxonomy_candidates"], list)
          assert capability["broker_mutation_performed"] is False
          assert capability["t16_hedge_instrument_certified"] is False
          assert capability["t17_option_structure_certified"] is False
          assert capability["productive_authority"] is False
          PY

      - name: Seal provider economics evidence
        run: |
          printf '%s\n' "$EVIDENCE_SHA" > provider-economics/git-sha.txt
          cd provider-economics
          sha256sum \
            provider-economics.json \
            provider-economics.stdout.json \
            account-capability.json \
            account-capability.stdout.json \
            git-sha.txt > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-provider-economics-${{ env.EVIDENCE_SHA }}
          path: provider-economics
          if-no-files-found: error
          retention-days: 90
