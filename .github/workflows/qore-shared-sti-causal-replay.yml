name: QORE Shared STI Causal Replay Contracts

concurrency:
  group: qore-shared-sti-causal-replay-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - src/qore/infrastructure/core_stack_v2/shared_trader_causal_replay.py
      - src/qore/infrastructure/core_stack_v2/shared_position_world_lineage.py
      - src/qore/infrastructure/core_stack_v2/shared_trader_intelligence.py
      - tests/infrastructure/test_core_stack_v2_shared_trader_causal_replay.py
      - docs/shared/QORE_SHARED_STI_CAUSAL_HISTORICAL_REPLAY_CONTRACT_001.md
      - .github/workflows/qore-shared-sti-causal-replay.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Shared
        run: pip install -e ".[dev]"

      - name: Validate causal replay contracts
        run: |
          set -euo pipefail
          mkdir -p result
          ruff check \
            src/qore/infrastructure/core_stack_v2/shared_trader_causal_replay.py \
            tests/infrastructure/test_core_stack_v2_shared_trader_causal_replay.py
          mypy \
            src/qore/infrastructure/core_stack_v2/shared_trader_causal_replay.py
          pytest -q \
            tests/infrastructure/test_core_stack_v2_shared_trader_causal_replay.py \
            --junitxml=result/junit.xml

      - name: Seal causal replay contract evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root=ET.parse("result/junit.xml").getroot()
          suites=(root,) if root.tag == "testsuite" else tuple(root.findall("testsuite"))
          tests=sum(int(item.attrib.get("tests", "0")) for item in suites)
          failures=sum(int(item.attrib.get("failures", "0")) for item in suites)
          errors=sum(int(item.attrib.get("errors", "0")) for item in suites)
          if tests <= 0:
              raise SystemExit("STI causal replay refuses zero-test evidence")
          if failures + errors:
              raise SystemExit("STI causal replay refuses failing evidence")

          pack={
              "identity":"QORE_SHARED_STI_CAUSAL_REPLAY_CONTRACT_EVIDENCE_001",
              "head":os.environ["GITHUB_SHA"],
              "run_id":int(os.environ["GITHUB_RUN_ID"]),
              "test_count":tests,
              "failure_count":failures+errors,
              "future_market_data_authorized":False,
              "future_outcome_authorized":False,
              "future_report_authorized":False,
              "future_weather_authorized":False,
              "future_roll_state_authorized":False,
              "outcome_aware_policy_mutation_authorized":False,
              "protected_holdout_opened":False,
              "historical_dataset_run_executed":False,
              "productive_behavior_authority":False,
          }
          Path("result/sti-causal-replay-contract-evidence.json").write_text(
              json.dumps(pack,sort_keys=True,indent=2)+"\n"
          )
          PY
          printf '%s\n' "$GITHUB_SHA" > result/code-git-sha.txt
          (
            cd result
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
              | sort -z | xargs -0 sha256sum > SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-sti-causal-replay-${{ github.sha }}
          path: result
          retention-days: 90

      - name: Report causal replay status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence=json.loads(
              Path("result/sti-causal-replay-contract-evidence.json").read_text()
          )
          body="\n".join([
              "## Shared STI — Causal Replay Contract",
              "",
              f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- tests: **{evidence['test_count']}** / failures: **{evidence['failure_count']}**",
              "- future market/outcome/report/weather/roll evidence: **Forbidden**",
              "- outcome-aware policy mutation: **Forbidden**",
              "- historical dataset run executed: **False**",
              "- protected Shared holdout opened: **False**",
              "- productive behavior authority: **False**",
          ])+"\n"
          Path("result/issue-comment.md").write_text(body)
          PY
          gh issue comment 638 --body-file result/issue-comment.md
