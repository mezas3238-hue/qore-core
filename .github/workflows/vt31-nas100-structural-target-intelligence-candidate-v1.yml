name: QORE VT31 NAS100 Structural Target Intelligence Candidate V1

on:
  push:
    branches:
      - agent/vt31-nas100-hypothesis-lifecycle-v1
    paths:
      - scripts/vt31_nas100_structural_target_intelligence_candidate_v1.py
      - .github/workflows/vt31-nas100-structural-target-intelligence-candidate-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed_holdout
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Static gate
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_structural_target_intelligence_candidate_v1.py
          ruff check scripts/vt31_nas100_structural_target_intelligence_candidate_v1.py
      - name: Candidate self-test
        run: |
          set -euo pipefail
          mkdir -p result
          python scripts/vt31_nas100_structural_target_intelligence_candidate_v1.py \
            --self-test | tee result/self-test.json
      - name: Recover immutable evidence
        run: |
          set -euo pipefail
          mkdir -p input
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"
      - name: Replay frozen candidate
        run: |
          set -euo pipefail
          python scripts/vt31_nas100_structural_target_intelligence_candidate_v1.py \
            "input/${EVIDENCE_PATH}" \
            --partition "$PARTITION" \
            --output "result/candidate-${PARTITION}.json" \
            | tee "result/summary-${PARTITION}.json"
      - name: Frozen governance gate
        run: |
          python - <<'PY'
          import json, os
          from decimal import Decimal
          from pathlib import Path
          p=json.loads(Path(f"result/candidate-{os.environ['PARTITION']}.json").read_text())
          assert p["candidate_id"] == "VT31_NAS100_STRUCTURAL_TARGET_INTELLIGENCE_V1"
          assert p["candidate_frozen"] is True
          assert p["trade_count"] >= 300
          m=p["metrics"]
          mc=p["monte_carlo"]
          assert m["profit_factor"] is not None
          assert Decimal(str(m["profit_factor"])) >= Decimal("1.50")
          assert Decimal(str(m["max_drawdown_r"])) <= Decimal("6")
          assert Decimal(str(mc["positive_terminal_probability"])) >= Decimal("0.90")
          assert Decimal(str(mc["p95_max_drawdown_r"])) <= Decimal("15")
          assert p["live_authorized"] is False
          assert p["real_capital_authorized"] is False
          assert p["production_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-structural-target-candidate-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-nas100-structural-target-candidate-*-${{ github.sha }}
          path: input
          merge-multiple: true
      - name: Bind frozen candidate
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from pathlib import Path
          rows={}
          fingerprint=None
          for path in Path("input").glob("candidate-*.json"):
              p=json.loads(path.read_text())
              rows[p["partition"]]=p
              if fingerprint is None:
                  fingerprint=p["contract_fingerprint"]
              assert p["contract_fingerprint"] == fingerprint
          assert set(rows)=={"r5","r6","r8","consumed_holdout"}
          report={
              "schema":"qore.vt31.nas100.structural_target_intelligence_candidate.aggregate.v1",
              "candidate_id":"VT31_NAS100_STRUCTURAL_TARGET_INTELLIGENCE_V1",
              "contract_fingerprint":fingerprint,
              "partitions":rows,
              "candidate_frozen":True,
              "five_year_opened":False,
              "live_authorized":False,
              "real_capital_authorized":False,
              "production_authorized":False,
          }
          Path("result/aggregate.json").write_text(json.dumps(report,sort_keys=True,indent=2)+"\n")
          print(json.dumps({"candidate_id":report["candidate_id"],"contract_fingerprint":fingerprint},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-structural-target-candidate-aggregate-${{ github.sha }}
          path: result/
          retention-days: 90
