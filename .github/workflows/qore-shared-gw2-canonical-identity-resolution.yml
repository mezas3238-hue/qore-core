name: QORE Shared GW2 Canonical Identity Resolution

concurrency:
  group: qore-shared-gw2-canonical-identity-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - scripts/shared_gw2_canonical_identity_resolution.py
      - .github/workflows/qore-shared-gw2-canonical-identity-resolution.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  GEN2_RUN_ID: "36623131862"
  GEN2_ARTIFACT_ID: "11059307341"
  GEN2_GIT_SHA: "f5fcd0c9552466132f6f47bb124805e49e774493"
  GW1_RUN_ID: "36641140388"
  GW1_ARTIFACT_ID: "11066159026"
  GW1_GIT_SHA: "a86e3571286622e8129e649ec17fea3cf784a6cc"

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Shared
        run: pip install -e ".[dev]"

      - name: Validate GW-2 resolver
        run: |
          set -euo pipefail
          mkdir -p input/gen2 input/gw1 result
          ruff check scripts/shared_gw2_canonical_identity_resolution.py
          python -m py_compile scripts/shared_gw2_canonical_identity_resolution.py

      - name: Recover sealed GEN-2 identity baseline
        run: |
          set -euo pipefail
          status="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GEN2_RUN_ID}" --jq '.status')"
          conclusion="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GEN2_RUN_ID}" --jq '.conclusion')"
          head_sha="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GEN2_RUN_ID}" --jq '.head_sha')"
          test "$status" = "completed"
          test "$conclusion" = "success"
          test "$head_sha" = "$GEN2_GIT_SHA"

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${GEN2_ARTIFACT_ID}/zip" > gen2.zip
          unzip -q gen2.zip -d input/gen2
          (cd input/gen2/result && sha256sum -c SHA256SUMS)
          test "$(cat input/gen2/result/gen2-code-git-sha.txt)" = "$GEN2_GIT_SHA"
          test -f input/gen2/result/provider-schedule-catalog.json
          test -f input/gen2/result/canonical-calendar-mapping-registry.json

      - name: Recover sealed GW-1 real multi-asset matrix
        run: |
          set -euo pipefail
          status="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GW1_RUN_ID}" --jq '.status')"
          conclusion="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GW1_RUN_ID}" --jq '.conclusion')"
          head_sha="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GW1_RUN_ID}" --jq '.head_sha')"
          test "$status" = "completed"
          test "$conclusion" = "success"
          test "$head_sha" = "$GW1_GIT_SHA"

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${GW1_ARTIFACT_ID}/zip" > gw1.zip
          unzip -q gw1.zip -d input/gw1
          (cd input/gw1 && sha256sum -c SHA256SUMS)
          test "$(cat input/gw1/code-git-sha.txt)" = "$GW1_GIT_SHA"
          test -f input/gw1/global-multi-asset-provider-capability.json

      - name: Resolve real provider identity evidence obligations
        run: |
          set -euo pipefail
          python scripts/shared_gw2_canonical_identity_resolution.py             --provider-schedule input/gen2/result/provider-schedule-catalog.json             --mapping-registry input/gen2/result/canonical-calendar-mapping-registry.json             --gw1-matrix input/gw1/global-multi-asset-provider-capability.json             --output result/gw2-canonical-identity-resolution.json             | tee result/summary.json

      - name: Validate fail-closed canonical identity state
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(
              Path("result/gw2-canonical-identity-resolution.json").read_text()
          )
          assert p["identity"] == "QORE_SHARED_GW2_CANONICAL_IDENTITY_RESOLUTION_001"
          assert p["status"] == "GW2_REAL_PROVIDER_IDENTITY_EVIDENCE_BOUND_UNRESOLVED"
          assert p["record_count"] == 104
          summaries={row["family"]:row for row in p["family_summaries"]}
          assert summaries["FX"]["candidate_count"] == 60
          assert summaries["EQUITY_INDICES"]["candidate_count"] == 25
          assert summaries["METALS"]["candidate_count"] == 16
          assert summaries["ENERGY"]["candidate_count"] == 3
          assert p["canonical_identity_verified_count"] == 0
          assert p["canonical_identity_unresolved_count"] == 104
          assert p["provider_symbol_is_canonical_identity"] is False
          assert p["provider_native_metadata_is_canonical_proof"] is False
          assert p["automatic_identity_inference"] is False
          assert p["sensor_admission_authorized"] is False
          assert p["relational_claims_authorized"] is False
          assert p["historical_market_data_read"] is False
          assert p["target_or_outcome_read"] is False
          assert p["protected_holdout_opened"] is False
          assert p["productive_authority"] is False
          assert len(p["resolution_fingerprint_sha256"]) == 64
          assert all(
              row["canonical_identity_verified"] is False
              for row in p["records"]
          )
          assert all(
              "EXTERNAL_CANONICAL_IDENTITY_EVIDENCE_REQUIRED"
              in row["resolution_blockers"]
              for row in p["records"]
          )
          PY

      - name: Bind GW-2 evidence
        run: |
          set -euo pipefail
          printf '%s\n' "${GITHUB_SHA}" > result/code-git-sha.txt
          (
            cd result
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0               | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-gw2-canonical-identity-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Report GW-2 identity state
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p=json.loads(
              Path("result/gw2-canonical-identity-resolution.json").read_text()
          )
          summaries={row["family"]:row for row in p["family_summaries"]}
          lines=[
              "## Shared GW-2 — Canonical Identity Resolution",
              "",
              f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- real provider candidates evaluated: **{p['record_count']}**",
              f"- FX: **{summaries['FX']['candidate_count']}**",
              f"- Equity indices: **{summaries['EQUITY_INDICES']['candidate_count']}**",
              f"- Metals: **{summaries['METALS']['candidate_count']}**",
              f"- Energy: **{summaries['ENERGY']['candidate_count']}**",
              f"- provider-descriptor complete: **{sum(row['provider_descriptor_complete_count'] for row in p['family_summaries'])}**",
              f"- canonical identities verified: **{p['canonical_identity_verified_count']}**",
              f"- canonical identities unresolved: **{p['canonical_identity_unresolved_count']}**",
              "- provider symbol == canonical identity: **False**",
              "- automatic identity inference: **False**",
              "- relational claims authorized: **False**",
              "- protected holdout opened: **False**",
              "",
              "GW-2 is now bound to real provider evidence; unresolved identity is explicit rather than fabricated.",
          ]
          Path("result/issue-comment.md").write_text("\n".join(lines)+"\n")
          PY
          gh issue comment 638 --body-file result/issue-comment.md
