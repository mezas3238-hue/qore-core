name: VT08 Index R120 Daily Bias Mechanism Attribution

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r120-daily-bias-mechanism.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r120_daily_bias_mechanism.py
      - tests/infrastructure/trader_lab/test_vt08_index_r120_daily_bias_mechanism.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r120_daily_bias_mechanism.py

  attribution:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R120 daily-bias mechanism attribution
        run: |
          mkdir -p artifacts/report
          python -m qore.infrastructure.trader_lab.vt08_index_r120_daily_bias_mechanism \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r120-daily-bias-mechanism.json

      - name: Verify R120 frozen attribution contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r120-daily-bias-mechanism.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R120_DAILY_BIAS_MECHANISM_ATTRIBUTION_001"
          )
          assert report["source_r119"]["run_id"] == 35791895806
          assert report["source_r119"]["artifact_id"] == 10721819322
          assert report["source_r119"]["artifact_digest"] == (
              "sha256:99a03b8a00e150c16c868fbbede903973f4d14914c0c0dbe931e13249a94a17a"
          )

          expected = {
              "five_year": 1756,
              "recent_two_year": 746,
              "r66_failed_holdout": 546,
          }
          for key, sample in expected.items():
              section = report[key]
              assert section["sample"] == sample
              assert section["expected_sample"] == sample
              for group in (
                  "bias_mechanism",
                  "mechanism_x_previous_alignment",
                  "mechanism_x_current_alignment",
                  "mechanism_x_relation",
                  "mechanism_x_last_state",
                  "mechanism_x_market",
                  "mechanism_x_side",
                  "mechanism_x_anchor",
              ):
                  assert sum(
                      int(row["sample"])
                      for row in section[group].values()
                  ) == sample

          contract = report["source_contract"]
          assert contract["daily_bias_function"] == "resolve_daily_bias"
          assert contract["source_day_pair"] == (
              "EXACT_CURRENT_V7_SOURCE_CORRECTED_SOURCE_DAY_PAIR"
          )
          assert contract["classification_cutoff"] == "H4_DECISION_OPEN"
          assert contract["mechanisms"] == [
              "CLOSE_BREAKOUT",
              "SWEEP_REVERSAL",
          ]
          assert contract["numeric_price_threshold_used"] is False
          assert contract["outcome_used_for_classification"] is False
          assert contract["calendar_or_year_used_for_classification"] is False

          gov = report["governance"]
          assert gov["research_only"] is True
          assert gov["candidate_created"] is False
          assert gov["signals_suppressed"] is False
          assert gov["trade_count_changed"] is False
          assert gov["target_changed"] is False
          assert gov["stop_changed"] is False
          assert gov["risk_allocator_changed"] is False
          assert gov["runtime_filter_created"] is False
          assert gov["anchor_14_enabled"] is False
          assert gov["live_authorized"] is False
          assert gov["real_capital_authorized"] is False
          assert gov["production_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r120-daily-bias-mechanism-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
