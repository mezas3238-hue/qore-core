name: QORE Scalper A2 Native M1 MFE MAE Forensics

on:
  push:
    branches:
      - agent/scalper-architect-b-methodology-20261010
    paths:
      - '.github/workflows/qore-scalper-a2-v49-mfe-mae-native-m1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_mfe_mae_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_scalper_mfe_mae_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: scalper-a2-native-mfe-mae-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'
  FROZEN_V49_RUN_ID: '38053946695'
  FROZEN_V49_SHA: 'e356e7a52541e99533b25ecfef0ab9c4e9ce03c0'

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research-only package
        run: python -m pip install -e '.[dev]'
      - name: Validate MFE MAE semantics and fail-closed bar provenance
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_scalper_mfe_mae_v1.py tests/infrastructure/trader_lab/test_capitalizer_scalper_mfe_mae_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_scalper_mfe_mae_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_scalper_mfe_mae_v1.py

  market:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol: [USDJPY, AUDJPY, AUDUSD, GBPJPY, EURUSD, GBPUSD, XAUUSD, USDCAD, NAS100]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only research code
        run: python -m pip install -e .
      - name: Download exact frozen V49 replay ledger and market report
        uses: actions/download-artifact@v4
        with:
          name: scalper-a2-v49-control-${{ matrix.symbol }}-${{ env.FROZEN_V49_SHA }}
          path: v49-control
          github-token: ${{ github.token }}
          run-id: ${{ env.FROZEN_V49_RUN_ID }}
      - name: Download same provider-native M1 observed for V49
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: native-m1
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Verify M1 raw provenance and read-only status
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          m = json.loads(Path("native-m1/m1-clone-manifest.json").read_text())
          assert m["canonical_symbol"] == os.environ["EXPECTED_SYMBOL"]
          assert m["provider_native_m1"] is True
          assert m["synthetic_m1"] is False
          assert m["interpolated_m1"] is False
          assert m["contradictory_m1"] == 0
          assert m["read_only"] is True
          PY
      - name: Trace all V49 simulated trade M1 bars until actual simulator exit
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_mfe_mae_v1 \
            market v49-control native-m1 mfe-market
      - name: Verify market output and prevent hindsight optimization
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          r = json.loads(Path("mfe-market/scalper-a2-mfe-mae-market.json").read_text())
          rows = sum(bool(l.strip()) for l in Path("mfe-market/scalper-a2-mfe-mae-trades.jsonl").open(encoding="utf-8"))
          assert r["symbol"] == os.environ["EXPECTED_SYMBOL"]
          assert r["source_simulated_trades"] == rows
          assert r["hindsight_only"] is True
          assert r["terminal_m1_intrabar_order_unknown"] is True
          assert r["no_change_to_admission_or_execution"] is True
          assert r["trader_certified"] is False and r["live_authorized"] is False
          PY
      - name: Retain per-trade MFE/MAE envelopes
        uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-mfe-mae-${{ matrix.symbol }}-${{ github.sha }}
          path: mfe-market/
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download all nine original-source excursion reports
        uses: actions/download-artifact@v4
        with:
          pattern: scalper-a2-mfe-mae-*-${{ github.sha }}
          path: native-m1-evidence
          merge-multiple: false
      - name: Full nine-market MFE/MAE and chronological MAX3 reconciliation
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_mfe_mae_v1 \
            matrix native-m1-evidence mfe-matrix
      - name: Present gross structural diagnosis, never imply executable highs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("mfe-matrix/scalper-a2-mfe-mae-matrix.json").read_text())
          assert r["source_simulated_trades"] == 2876
          assert r["max3_selected"] == 2020
          assert r["max3_excluded"] == 856
          assert r["terminal_extrema_are_not_intrabar_executable"] is True
          assert r["trader_certified"] is False and r["live_authorized"] is False
          print("MFE/MAE SELECTED:", r["selected"])
          for dimension in ("session", "market", "trigger_family", "exit_reason"):
              for key, row in r["selected_by"][dimension].items():
                  print("MFE/MAE SEGMENT", dimension, key, row)
          PY
      - name: Publish nonexecuting nine-market evidence
        uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-nine-market-mfe-mae-${{ github.sha }}
          path: mfe-matrix/
          retention-days: 90
          if-no-files-found: error
