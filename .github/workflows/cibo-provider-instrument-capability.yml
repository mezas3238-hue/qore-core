name: QORE CIBO Provider Instrument Capability

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-provider-instrument-capability.yml'
      - 'src/qore/infrastructure/cibo_instrument_capability_registry.py'
      - 'tests/infrastructure/test_cibo_instrument_capability_registry.py'
      - 'docs/research/CIBO-SOVEREIGN-CAPITAL-AMPLIFICATION-WORLD-CUP-MISSION-V1.md'
      - 'docs/research/CIBO-WORLD-CUP-SOVEREIGN-CAPITAL-AMPLIFICATION-GAP-MATRIX-V1.md'
  push:
    branches:
      - agent/cibo-capital-efficiency-sizing-lab-001
    paths:
      - '.github/workflows/cibo-provider-instrument-capability.yml'
      - 'src/qore/infrastructure/cibo_instrument_capability_registry.py'
      - 'tests/infrastructure/test_cibo_instrument_capability_registry.py'
      - 'docs/research/CIBO-SOVEREIGN-CAPITAL-AMPLIFICATION-WORLD-CUP-MISSION-V1.md'
      - 'docs/research/CIBO-WORLD-CUP-SOVEREIGN-CAPITAL-AMPLIFICATION-GAP-MATRIX-V1.md'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  provider-instrument-capability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Provider capability registry quality
        run: |
          ruff check \
            src/qore/infrastructure/cibo_instrument_capability_registry.py \
            tests/infrastructure/test_cibo_instrument_capability_registry.py
          mypy \
            src/qore/infrastructure/cibo_instrument_capability_registry.py
          python -m py_compile \
            src/qore/infrastructure/cibo_instrument_capability_registry.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_instrument_capability_registry.py
