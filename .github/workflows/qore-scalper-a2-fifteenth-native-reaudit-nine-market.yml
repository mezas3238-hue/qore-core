name: QORE Scalper A2 Audit15 Native H1 Null MFE CISD 9Market

on:
  push:
    branches:
      - agent/scalper-architect-b-methodology-20261010
    paths:
      - '.github/workflows/qore-scalper-a2-fifteenth-native-reaudit-nine-market.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_a2_fifteenth_native_forensics_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_scalper_a2_fifteenth_native_forensics_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: scalper-a2-fifteenth-native-${{ github.ref }}
  cancel-in-progress: true

env:
  SELECTION_RUN: '38104905157'
  SELECTION_SHA: '58a726b059872459f5430fdb6fce61aad6e2e5cf'
  ECON_RUN: '38102352779'
  ECON_SHA: 'b4d35fe99b99a96dac3728610258fe5a4ab20c15'
  CONTROL_RUN: '38053946695'
  CONTROL_SHA: 'e356e7a52541e99533b25ecfef0ab9c4e9ce03c0'
  NATIVE_RUN: '35548099334'
  NATIVE_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Native M1 H1 random/selected 1997 MFE/MAE stage chain contracts
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_scalper_a2_fifteenth_native_forensics_v1.py tests/infrastructure/trader_lab/test_capitalizer_scalper_a2_fifteenth_native_forensics_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_scalper_a2_fifteenth_native_forensics_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_scalper_a2_fifteenth_native_forensics_v1.py

  market:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol: [USDJPY, AUDJPY, AUDUSD, GBPJPY, EURUSD, GBPUSD, XAUUSD, USDCAD, NAS100]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: scalper-a2-audit15-residual-nine-market-${{ env.SELECTION_SHA }}
          path: selection
          run-id: ${{ env.SELECTION_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: scalper-a2-v49-control-${{ matrix.symbol }}-${{ env.CONTROL_SHA }}
          path: control
          run-id: ${{ env.CONTROL_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: scalper-a2-audit14-gross-${{ matrix.symbol }}-${{ env.ECON_SHA }}
          path: economics
          run-id: ${{ env.ECON_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.NATIVE_SHA }}
          path: native
          run-id: ${{ env.NATIVE_RUN }}
          github-token: ${{ github.token }}
      - name: Verify independent no-synthetic native M1 source
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads(Path("native/m1-clone-manifest.json").read_text())
          assert x["canonical_symbol"]==os.environ["SYMBOL"]
          assert x["provider_native_m1"] and not x["synthetic_m1"]
          assert not x["interpolated_m1"] and x["contradictory_m1"]==0
          assert x["read_only"]
          PY
      - name: Rebuild native M1 winning excursion, random H1 and first route stages
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_a2_fifteenth_native_forensics_v1 market selection control economics native market-output
      - name: Assert original economics & online 1997 identity cannot be lost
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("market-output/audit15-native-market.json").read_text())
          assert r["provider_native_M1"] and not r["uses_future_outcomes_to_select"]
          assert not r["physical_bid_ask_available"]
          assert r["baseline_selected"]>0 and r["online_selected"]>0
          print("AUDIT15 NATIVE SELECTED MARKET",r)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-audit15-native-${{ matrix.symbol }}-${{ github.sha }}
          path: market-output/
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: scalper-a2-audit15-native-*-${{ github.sha }}
          path: all-native
      - run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_a2_fifteenth_native_forensics_v1 matrix all-native nine-output
      - name: No cohort drift and no claimed broker profitability
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("nine-output/audit15-native-nine-market.json").read_text())
          assert r["markets"]==9 and r["V49_MAX3"]==2020 and r["ONLINE_MAX3"]==1997
          assert r["no_fitted_rules_or_filters"] and r["outcome_labels_hindsight_only"]
          assert not r["physical_execution_costs_present"]
          print("AUDIT15 REPLAYED NATIVE FORENSICS",r)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-audit15-native-nine-market-${{ github.sha }}
          path: nine-output/
          retention-days: 90
          if-no-files-found: error
