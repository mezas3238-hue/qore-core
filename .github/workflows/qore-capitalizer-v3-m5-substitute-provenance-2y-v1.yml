name: QORE Capitalizer V3 M5 Substitute Provenance 2Y V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-v3-m5-substitute-provenance-2y-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v3_m5_substitute_provenance_2y_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v3_m5_substitute_provenance_2y_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-v3-m5-substitute-provenance-2y-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  BOTTLENECK_RUN_ID: '35804015774'
  BOTTLENECK_SHA: '8cd1f83221f8e89c9586f0a241e18f91ad5ac0fc'
  MICRO_RUN_ID: '35805397236'
  MICRO_SHA: 'e3be1ed5dda60ab3a53257287c9471ce247d2554'
  STEP4_RUN_ID: '35810309765'
  STEP4_SHA: 'd436fc6b70e64f457dc4615869a8e28d4347c4f2'
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_v3_m5_substitute_provenance_2y_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_v3_m5_substitute_provenance_2y_v1.py
      - name: Mypy
        run: |
          mypy src/qore/infrastructure/trader_lab/capitalizer_v3_m5_substitute_provenance_2y_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_v3_m5_substitute_provenance_2y_v1.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {symbol: USDJPY, session: ASIA}
          - {symbol: AUDJPY, session: ASIA}
          - {symbol: AUDUSD, session: ASIA}
          - {symbol: GBPJPY, session: ASIA}
          - {symbol: EURUSD, session: LONDON}
          - {symbol: GBPUSD, session: LONDON}
          - {symbol: XAUUSD, session: NEW_YORK}
          - {symbol: USDCAD, session: NEW_YORK}
          - {symbol: NAS100, session: NEW_YORK}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download frozen bottleneck cell
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-m3-mss-bottleneck-forensics-2y-v1-${{ matrix.symbol }}-${{ env.BOTTLENECK_SHA }}
          path: bottleneck-source
          github-token: ${{ github.token }}
          run-id: ${{ env.BOTTLENECK_RUN_ID }}
      - name: Download frozen M5 context
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-v3-m3-microstructure-context-2y-v1-${{ matrix.symbol }}-${{ env.MICRO_SHA }}
          path: micro-source
          github-token: ${{ github.token }}
          run-id: ${{ env.MICRO_RUN_ID }}
      - name: Download frozen Step-4 market artifact
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-v3-cisd-or-m5-aligned-2y-v1-${{ matrix.symbol }}-${{ env.STEP4_SHA }}
          path: step4-source
          github-token: ${{ github.token }}
          run-id: ${{ env.STEP4_RUN_ID }}
      - name: Download immutable native-M1 clone
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Run substitute provenance atlas
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v3_m5_substitute_provenance_2y_v1 \
            market bottleneck-source micro-source step4-source m1-source provenance-output
      - name: Enforce market invariants
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
          EXPECTED_SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"]
          report = json.loads(
              (
                  Path("provenance-output")
                  / f"capitalizer-{symbol.lower()}-v3-m5-substitute-provenance-2y-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_V3_M5_SUBSTITUTE_PROVENANCE_2Y_V1"
          )
          assert report["symbol"] == symbol
          assert report["session"] == os.environ["EXPECTED_SESSION"]
          assert sum(report["by_original_first_blocker"].values()) == report["substitute_confirmations"]
          assert sum(report["by_provenance"].values()) == report["substitute_confirmations"]
          assert report["step4_raw_substitute_trades"] <= report["substitute_confirmations"]
          assert report["strategy_mutated"] is False
          assert report["outcome_used_for_admission"] is False
          assert report["diagnostic_only"] is True
          assert report["economic_candidate"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v3-m5-substitute-provenance-2y-v1-${{ matrix.symbol }}-${{ github.sha }}
          path: provenance-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v3-m5-substitute-provenance-2y-v1-*-${{ github.sha }}
          path: provenance-input
          merge-multiple: false
      - name: Build nine-market provenance matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v3_m5_substitute_provenance_2y_v1 \
            matrix provenance-input matrix-output
      - name: Enforce aggregate controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "matrix-output/"
                  "capitalizer-nine-market-v3-m5-substitute-provenance-2y-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_NINE_MARKET_V3_M5_SUBSTITUTE_PROVENANCE_2Y_V1"
          )
          assert report["market_count"] == 9
          assert report["substitute_confirmations"] == 44
          assert report["step4_confirmation_control_reproduced"] is True
          assert report["cisd_first_blocker_substitutes"] == 28
          assert report["cisd_v2_subset_control_reproduced"] is True
          assert report["substitutes_outside_cisd_first_blocker"] == 16
          assert sum(report["by_provenance"].values()) == 44
          assert report["strategy_mutated"] is False
          assert report["outcome_used_for_admission"] is False
          assert report["diagnostic_only"] is True
          assert report["economic_candidate"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-nine-market-v3-m5-substitute-provenance-2y-v1-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
