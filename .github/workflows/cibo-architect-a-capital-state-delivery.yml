name: QORE CIBO Architect A Capital State Delivery

on:
  pull_request:
    paths:
      - 'src/qore/infrastructure/cibo_arch_a_capital_state_delivery.py'
      - 'tests/infrastructure/test_cibo_arch_a_capital_state_delivery.py'
      - '.github/workflows/cibo-architect-a-capital-state-delivery.yml'
  push:
    branches:
      - agent/cibo-integrator-ab-001
    paths:
      - 'src/qore/infrastructure/cibo_arch_a_capital_state_delivery.py'
      - 'tests/infrastructure/test_cibo_arch_a_capital_state_delivery.py'
      - '.github/workflows/cibo-architect-a-capital-state-delivery.yml'

permissions:
  contents: read

jobs:
  capital-state-delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Architect A capital-state delivery quality
        run: |
          ruff check             src/qore/infrastructure/cibo_arch_a_capital_state_delivery.py             tests/infrastructure/test_cibo_arch_a_capital_state_delivery.py
          mypy             src/qore/infrastructure/cibo_arch_a_capital_state_delivery.py
          pytest -q --no-cov             tests/infrastructure/test_cibo_arch_a_capital_state_delivery.py             tests/infrastructure/test_cibo_integrated_capital_forward_binding.py
