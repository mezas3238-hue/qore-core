name: QORE VT31 DOL2 Cognitive Protection Frontier V1

on:
  push:
    branches:
      - agent/vt31-edge-position-cert-b-001
    paths:
      - scripts/vt31_nas100_dol2_cognitive_protection_frontier_v1.py
      - .github/workflows/vt31-dol2-cognitive-protection-frontier-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Static gate
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_dol2_cognitive_protection_frontier_v1.py
          ruff check scripts/vt31_nas100_dol2_cognitive_protection_frontier_v1.py
      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"
      - name: Run DOL2 cognition protection frontier
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python scripts/vt31_nas100_dol2_cognitive_protection_frontier_v1.py             "input/${EVIDENCE_PATH}"             --output "result/dol2-protection-${PARTITION}.json"             | tee "result/summary-${PARTITION}.json"
      - name: Governance gate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=os.environ["PARTITION"]
          x=json.loads(Path(f"result/dol2-protection-{p}.json").read_text())
          g=x["governance"]
          assert g["starting_mechanism_is_full_cognition_dol2"] is True
          assert g["windows_predeclared"] == [3,5]
          assert g["protection_confirmations_predeclared"] == [1,2]
          assert g["one_protection_move_maximum"] is True
          assert g["protection_effective_next_m1"] is True
          assert g["same_sovereign_terminal_population"] is True
          assert g["initial_stop_never_widened"] is True
          assert g["position_sizing_used"] is False
          assert g["leverage_used"] is False
          assert g["compounding_used"] is False
          assert g["capital_weighting_used"] is False
          assert g["future_outcome_used_for_action"] is False
          assert g["fresh_holdout_opened"] is False
          counts={v["trade_count"] for v in x["variants"].values()}
          assert len(counts) == 1
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-dol2-protection-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-dol2-protection-*-${{ github.sha }}
          path: input
          merge-multiple: true
      - name: Adjudicate DOL2 protection
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          folds=("r5","r6","r8","consumed")
          payloads={
              f:json.loads(Path(f"input/dol2-protection-{f}.json").read_text())
              for f in folds
          }
          variants=[
              "W3_DOL2_COG_NO_PROTECTION",
              "W3_DOL2_COG_PS1",
              "W3_DOL2_COG_PS2",
              "W5_DOL2_COG_NO_PROTECTION",
              "W5_DOL2_COG_PS1",
              "W5_DOL2_COG_PS2",
              "W3_DOL2_STRICT_COG_NO_PROTECTION",
              "W3_DOL2_STRICT_COG_PS2",
              "W5_DOL2_STRICT_COG_NO_PROTECTION",
              "W5_DOL2_STRICT_COG_PS2",
          ]
          def d(v): return Decimal(str(v))

          report={}
          for variant in variants:
              per_fold={}
              pf=mean=dd=0
              winners=True
              temporal=True
              protected=0
              extended=0
              for fold in folds:
                  base=payloads[fold]["variants"]["DOL1_HARD_EXIT"]
                  cand=payloads[fold]["variants"][variant]
                  bm=base["stress_0_05r"]; cm=cand["stress_0_05r"]
                  wp=cand["winner_preservation_vs_dol1"]
                  pf_ok=d(cm["profit_factor"])>=d(bm["profit_factor"])
                  mean_ok=d(cm["mean_r"])>=d(bm["mean_r"])
                  dd_ok=d(cm["max_drawdown_r"])<=d(bm["max_drawdown_r"])
                  pf+=int(pf_ok); mean+=int(mean_ok); dd+=int(dd_ok)
                  winners &= (
                      d(wp["winner_count_preservation"])>=d("0.80")
                      and d(wp["winner_r_preservation"])>=d("0.90")
                  )
                  protected += cand["protection_committed_count"]
                  extended += cand["extension_activated_count"]
                  blocks={}
                  if fold!="consumed":
                      for key in sorted(set(base["halfyear_stress"]) & set(cand["halfyear_stress"])):
                          delta=d(cand["halfyear_stress"][key]["mean_r"])-d(base["halfyear_stress"][key]["mean_r"])
                          ok=delta>=0
                          temporal &= ok
                          blocks[key]={"mean_r_delta":format(delta,"f"),"nondegrade":ok}
                  per_fold[fold]={
                      "baseline":bm,"candidate":cm,
                      "winner_preservation":wp,
                      "pf_nondegrade":pf_ok,"mean_nondegrade":mean_ok,
                      "dd_nondegrade":dd_ok,
                      "extension_activated_count":cand["extension_activated_count"],
                      "protection_committed_count":cand["protection_committed_count"],
                      "halfyears":blocks,
                  }
              consumed=per_fold["consumed"]
              consumed_ok=(
                  consumed["pf_nondegrade"]
                  and consumed["mean_nondegrade"]
                  and consumed["dd_nondegrade"]
              )
              survivor=(
                  pf>=3 and mean>=3 and dd>=3 and winners
                  and consumed_ok and extended>0
              )
              promo=(
                  pf==4 and mean==4 and dd>=3 and winners
                  and temporal and consumed_ok and extended>0
              )
              report[variant]={
                  "folds":per_fold,
                  "pf_nondegrade_folds":pf,
                  "mean_nondegrade_folds":mean,
                  "dd_nondegrade_folds":dd,
                  "winner_preservation_all_folds":winners,
                  "halfyears_nondegrade":temporal,
                  "consumed_nondegrade":consumed_ok,
                  "extension_activated_total":extended,
                  "protection_committed_total":protected,
                  "research_survivor":survivor,
                  "promotion_grade_consumed_witness":promo,
              }

          result={
              "schema":"qore.vt31.nas100.dol2_cognitive_protection.aggregate.v1",
              "head":"${{ github.sha }}",
              "variants":report,
              "research_survivors":[v for v,x in report.items() if x["research_survivor"]],
              "promotion_grade_consumed_witnesses":[v for v,x in report.items() if x["promotion_grade_consumed_witness"]],
              "governance":{
                  "consumed_evidence_only":True,
                  "sizing_for_certification_forbidden":True,
                  "fresh_holdout_opened":False,
                  "policy_promoted":False,
                  "candidate_frozen":False,
                  "candidate_certified":False,
              },
          }
          Path("result/aggregate.json").write_text(
              json.dumps(result,sort_keys=True,indent=2)+"\n"
          )
          print(json.dumps(result,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-dol2-protection-aggregate-${{ github.sha }}
          path: result/
          retention-days: 90
