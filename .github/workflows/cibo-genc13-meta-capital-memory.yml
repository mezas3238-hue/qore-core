name: QORE CIBO GEN-C13 Meta-Capital Memory Skeptic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-genc13-meta-capital-memory.yml'
      - 'src/qore/infrastructure/cibo_meta_capital_memory.py'
      - 'tests/infrastructure/test_cibo_meta_capital_memory.py'
      - 'docs/research/CIBO-GEN-C13-META-CAPITAL-MEMORY-SKEPTIC-V1.md'
      - 'docs/research/CIBO-MASTER-OPEN-WORK-LEDGER-V1.json'
  push:
    branches:
      - agent/cibo-capital-efficiency-sizing-lab-001
    paths:
      - '.github/workflows/cibo-genc13-meta-capital-memory.yml'
      - 'src/qore/infrastructure/cibo_meta_capital_memory.py'
      - 'tests/infrastructure/test_cibo_meta_capital_memory.py'
      - 'docs/research/CIBO-GEN-C13-META-CAPITAL-MEMORY-SKEPTIC-V1.md'
      - 'docs/research/CIBO-MASTER-OPEN-WORK-LEDGER-V1.json'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  genc13-meta-capital-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: GEN-C13 quality and leakage-firewall invariants
        run: |
          ruff check \
            src/qore/infrastructure/cibo_meta_capital_memory.py \
            tests/infrastructure/test_cibo_meta_capital_memory.py
          mypy src/qore/infrastructure/cibo_meta_capital_memory.py
          python -m py_compile \
            src/qore/infrastructure/cibo_meta_capital_memory.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_meta_capital_memory.py
