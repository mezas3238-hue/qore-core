name: QORE GitHub Trader Lab Fast - CIBO QDLE Experimental
on:
  push:
    branches: [agent/github-trader-lab-001]
    paths: ['.github/workflows/github-trader-lab-cibo-qdle-experimental.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: qore-lab-fast-cibo-qdle
  cancel-in-progress: true
jobs:
  cibo-qdle-3368:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ff40a990a1ecaa30d0f1a055b77184b235d1d30a
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve pinned research inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cibo-qdle"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/11451743578/zip" > "$RUNNER_TEMP/cibo-qdle/source.zip"
          echo "d439957f21e2f79148b5a2fb75a53db6fa448698f17aeb6978f379ed3547f7ea  $RUNNER_TEMP/cibo-qdle/source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/cibo-qdle/source.zip" walk-forward-manifest.json -d "$RUNNER_TEMP/cibo-qdle"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/11588089131/zip" > "$RUNNER_TEMP/cibo-qdle/native.zip"
          echo "eebf6de43da63aadc200a3783109246188d46e0fcdd7da127f07eff815d6cec6  $RUNNER_TEMP/cibo-qdle/native.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/cibo-qdle/native.zip" cibo-native-baseline.json -d "$RUNNER_TEMP/cibo-qdle"
      - name: Replay 3368 Native CIBO approvals through four motors and QDLE
        env:
          PYTHONPATH: src
        run: |
          python scripts/qdle_3368_dual_ledger_replay.py \
            --manifest "$RUNNER_TEMP/cibo-qdle/walk-forward-manifest.json" \
            --experimental-native-ceiling-report "$RUNNER_TEMP/cibo-qdle/cibo-native-baseline.json" \
            --motor-policy independent_four_motors \
            --experimental-native-lane-policy all_bank \
            --min-policy broker_grid \
            --ndx-roundtrip-fee-proxy-usd-per-lot 20 \
            --provider-trailing-usd disabled \
            --swap-proxy off \
            --output "$RUNNER_TEMP/cibo-qdle/joint-research.json"
      - name: Assert empirical physical research invariants
        run: |
          python - <<'PY'
          import json,os,pathlib
          r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"cibo-qdle"/"joint-research.json").read_text())
          assert r["signal_count"]==r["unique_signal_count"]==3368
          assert r["native_cibo_cognitive_decisions_consumed"]==3368
          assert r["research_financed_proposals"]+r["research_unfundable_or_invalid"]==3368
          assert r["real_fundednext_fills"]==0 and r["certified"] is False
          print("TRADER_LAB_FAST_RESULT", {k:r[k] for k in ("research_financed_proposals","qore_ending_capital_usd","max_closed_equity_drawdown_pct","profit_factor_proxy","opening_commission_paid_proxy_usd","closing_commission_paid_proxy_usd")})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trader-lab-fast-cibo-qdle-3368-${{ github.run_id }}
          path: ${{ runner.temp }}/cibo-qdle/joint-research.json
          if-no-files-found: warn
