name: QORE Shared X10 Contradiction Map Replication

concurrency:
  group: qore-shared-x10-contradiction-map
  cancel-in-progress: true

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - src/qore/infrastructure/core_stack_v2/shared_contradiction_map.py
      - tests/infrastructure/test_core_stack_v2_shared_contradiction_map.py
      - scripts/shared_x10_contradiction_map_replay.py
      - .github/workflows/qore-shared-x10-contradiction-map.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  replicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Shared
        run: pip install -e ".[dev]"

      - name: Validate causal contradiction engine
        run: |
          set -euo pipefail
          mkdir -p result input/r8 input/r6 input/r5
          ruff check             src/qore/infrastructure/core_stack_v2/shared_contradiction_map.py             tests/infrastructure/test_core_stack_v2_shared_contradiction_map.py             scripts/shared_x10_contradiction_map_replay.py
          mypy src/qore/infrastructure/core_stack_v2/shared_contradiction_map.py
          python -m py_compile             src/qore/infrastructure/core_stack_v2/shared_contradiction_map.py             scripts/shared_x10_contradiction_map_replay.py
          pytest -q             tests/infrastructure/test_core_stack_v2_shared_contradiction_map.py             --junitxml=result/junit.xml

      - name: Recover immutable R8 R6 R5 market evidence
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10402199719/zip" > r8.zip
          unzip -q r8.zip -d input/r8
          (cd input/r8 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10389112524/zip" > r6.zip
          unzip -q r6.zip -d input/r6
          (cd input/r6 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10380044761/zip" > r5.zip
          unzip -q r5.zip -d input/r5
          (cd input/r5 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

      - name: Execute replicated contradiction proof
        run: |
          set -euo pipefail
          python scripts/shared_x10_contradiction_map_replay.py             --r8-nas input/r8/fresh/NAS100/market-evidence.json             --r8-sp input/r8/fresh/SP500/market-evidence.json             --r8-us input/r8/fresh/US30/market-evidence.json             --r6-nas input/r6/fresh/NAS100/market-evidence.json             --r6-sp input/r6/fresh/SP500/market-evidence.json             --r6-us input/r6/fresh/US30/market-evidence.json             --r5-nas input/r5/fresh/NAS100/market-evidence.json             --r5-sp input/r5/fresh/SP500/market-evidence.json             --r5-us input/r5/fresh/US30/market-evidence.json             --output result/x10-contradiction-map.json             | tee result/summary.json

      - name: Enforce replicated epistemic proof
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/x10-contradiction-map.json").read_text())
          assert p["status"] == "X10_COMPLETED_AND_PROVEN_REPLICATED_REAL_DATA"
          assert p["all_pass"] is True
          for partition in ("r8","r6","r5"):
              row=p["partitions"][partition]
              assert row["source_observation_count"] > 0
              assert row["all_pass"] is True
              assert row["causal_cutoff_pass_count"] == row["source_observation_count"]
              assert row["contradiction_stress_monotonic_pass_count"] == row["source_observation_count"]
              assert row["missing_evidence_penalty_pass_count"] == row["source_observation_count"]
          proof=p["proof"]
          assert proof["future_evidence_rejected"] is True
          assert proof["assertiveness_decreases_with_contradiction"] is True
          assert proof["assertiveness_decreases_with_missing_evidence"] is True
          g=p["governance"]
          assert g["protected_certification_holdout_opened"] is False
          assert g["productive_authority"] is False
          PY

      - name: Bind evidence
        run: |
          set -euo pipefail
          printf '%s\n' "${GITHUB_SHA}" > result/code-git-sha.txt
          (
            cd result
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0               | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-x10-contradiction-map-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Report X10 proof
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p=json.loads(Path("result/x10-contradiction-map.json").read_text())
          observations=sum(
              int(row["source_observation_count"])
              for row in p["partitions"].values()
          )
          body="\n".join([
              "## Shared X-10 — Causal Contradiction Map",
              "",
              f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- disposition: **{p['status']}**",
              f"- real causal observations: **{observations}** across R8/R6/R5",
              "- contradiction stress lowers/holds assertiveness: **PASS**",
              "- missing-evidence stress lowers/holds assertiveness: **PASS**",
              "- future evidence rejected: **PASS**",
              "- protected certification holdout opened: **False**",
              "- productive authority: **False**",
          ])+"\n"
          Path("result/issue-comment.md").write_text(body)
          PY
          gh issue comment 638 --body-file result/issue-comment.md
