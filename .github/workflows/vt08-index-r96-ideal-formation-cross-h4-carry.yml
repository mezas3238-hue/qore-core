name: VT08 Index R96 Ideal Formation Cross H4 Carry

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r96-ideal-formation-cross-h4-carry.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r96_ideal_formation_cross_h4_carry.py
      - tests/infrastructure/trader_lab/test_vt08_index_r96_ideal_formation_cross_h4_carry.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r96_ideal_formation_cross_h4_carry.py

  forensics:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R96 cross-H4 carry census
        run: |
          mkdir -p artifacts/report
          python -m qore.infrastructure.trader_lab.vt08_index_r96_ideal_formation_cross_h4_carry \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r96-ideal-formation-cross-h4-carry.json

      - name: Verify R96 governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r96-ideal-formation-cross-h4-carry.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R96_IDEAL_FORMATION_CROSS_H4_PS_CARRY_001"
          )
          assert report["source_r95"]["run_id"] == 35531957789
          assert report["source_r95"]["artifact_id"] == 10611990582
          assert report["source_r95"]["artifact_digest"] == (
              "sha256:1bfa717e1172768d00fc6e615cd8b37d58695fb7b41ba8fa83390cab2c3533c5"
          )

          contract = report["source_contract"]
          assert contract["primary_model"] == "D1_H4_M15"
          assert contract["formation_requires_c2_or_c3_closure"] is True
          assert contract["formation_requires_source_exact_m15_ps"] is True
          assert contract["ps_must_survive_formation_close"] is True
          assert contract["carry_scope"] == "IMMEDIATE_NEXT_H4_ONLY"
          assert contract["execution_h4_must_be_owner_authorized"] is True
          assert contract["owner_execution_anchors_ny"] == [22, 2, 6, 10]
          assert contract["owner_disabled_14_preserved"] is True
          assert contract["context_only_18_preserved"] is True
          assert contract["bias_must_persist"] is True
          assert contract["execution"] == "EXACT_V6_M15_CONTINUATION"
          assert contract["positional_entry_added"] is False
          assert contract["stale_multi_h4_deferral"] is False
          assert contract["pnl_evaluated"] is False

          assert report["five_year"]["canonical_signal_reference"] == 2448
          assert report["recent_two_year"]["canonical_signal_reference"] == 1017
          assert report["r66_failed_holdout"]["canonical_signal_reference"] == 773
          assert report["decision"] == (
              "R96_IDEAL_FORMATION_CROSS_H4_CARRY_CENSUS_COMPLETE_NO_TRADES"
          )

          gov = report["governance"]
          assert gov["forensics_only"] is True
          assert gov["consumed_evidence_only"] is True
          assert gov["fresh_holdout_claim"] is False
          assert gov["source_primary_model_only"] is True
          assert gov["future_information_used"] is False
          assert gov["pnl_evaluated"] is False
          assert gov["risk_changed"] is False
          assert gov["target_changed"] is False
          assert gov["anchors_changed"] is False
          assert gov["candidate_created"] is False
          assert gov["trader_certified"] is False
          assert gov["live_authorized"] is False
          assert gov["real_capital_authorized"] is False
          assert gov["production_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r96-ideal-formation-cross-h4-carry-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
