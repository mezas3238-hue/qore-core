name: QORE CIBO Generation Current Control Seal

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-generation-current-control.yml'
      - 'scripts/cibo_generation_current_control_freeze.py'
      - 'src/qore/infrastructure/cibo_generation_current_control.py'
      - 'tests/infrastructure/test_cibo_generation_current_control.py'
      - 'docs/research/CIBO-GENERATION-CURRENT-CONTROL-CANDIDATE-V1.md'
      - 'docs/research/CIBO-GENERATION-CURRENT-CONTROL-CI-EVIDENCE-V1.json'
      - 'docs/research/CIBO-MASTER-OPEN-WORK-LEDGER-V1.json'
  push:
    branches:
      - agent/cibo-capital-efficiency-sizing-lab-001
    paths:
      - '.github/workflows/cibo-generation-current-control.yml'
      - 'scripts/cibo_generation_current_control_freeze.py'
      - 'src/qore/infrastructure/cibo_generation_current_control.py'
      - 'tests/infrastructure/test_cibo_generation_current_control.py'
      - 'docs/research/CIBO-GENERATION-CURRENT-CONTROL-CANDIDATE-V1.md'
      - 'docs/research/CIBO-GENERATION-CURRENT-CONTROL-CI-EVIDENCE-V1.json'
      - 'docs/research/CIBO-MASTER-OPEN-WORK-LEDGER-V1.json'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  seal-current-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Current-control contract quality
        run: |
          ruff check \
            scripts/cibo_generation_current_control_freeze.py \
            src/qore/infrastructure/cibo_generation_current_control.py \
            tests/infrastructure/test_cibo_generation_current_control.py
          mypy \
            scripts/cibo_generation_current_control_freeze.py \
            src/qore/infrastructure/cibo_generation_current_control.py
          python -m py_compile \
            scripts/cibo_generation_current_control_freeze.py \
            src/qore/infrastructure/cibo_generation_current_control.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_generation_current_control.py
      - name: Materialize immutable pre-C8 control seal
        run: |
          python scripts/cibo_generation_current_control_freeze.py
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/cibo_generation_current_control_v1.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["schema"] == "CIBO_GENERATION_CURRENT_CONTROL_SEAL_V1"
          manifest = payload["manifest"]
          assert manifest["control_id"] == "CIBO_GENERATION_CURRENT_CONTROL_V1"
          assert manifest["git_sha"] == "87d98ced8d56b275823c4472392923ba6a11d769"
          assert manifest["all_required_ci_green"] is True
          assert manifest["holdout_2017h1_untouched"] is True
          assert manifest["phase20_v3_mutated"] is False
          assert manifest["outcome_data_used_to_select_control"] is False
          assert payload["economic_baseline_measurement"]["bound"] is False
          assert payload["economic_baseline_measurement"][
              "synthetic_measurement_used"
          ] is False
          PY
      - name: Upload immutable control seal
        uses: actions/upload-artifact@v4
        with:
          name: cibo-generation-current-control-v1
          path: artifacts/cibo_generation_current_control_v1.json
          if-no-files-found: error
