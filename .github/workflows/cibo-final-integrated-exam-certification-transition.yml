name: QORE CIBO Final Integrated Exam Certification Transition

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/qore/infrastructure/cibo_final_integrated_exam_certification_transition.py'
      - 'tests/infrastructure/test_cibo_final_integrated_exam_certification_transition.py'
      - '.github/workflows/cibo-final-integrated-exam-certification-transition.yml'

permissions:
  contents: read

jobs:
  certification-transition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: 62-to-64 and certification seal contract
        run: |
          ruff check \
            src/qore/infrastructure/cibo_final_integrated_exam_certification_transition.py \
            tests/infrastructure/test_cibo_final_integrated_exam_certification_transition.py
          mypy \
            src/qore/infrastructure/cibo_final_integrated_exam_certification_transition.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_final_integrated_exam_certification_transition.py
