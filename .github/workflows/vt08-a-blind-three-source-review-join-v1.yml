name: VT08 A Blind Three-Source Methodology Review Join

on:
  push:
    branches:
      - agent/vt08-5m-methodology-source-20261010
    paths:
      - .github/workflows/vt08-a-blind-three-source-review-join-v1.yml
      - src/qore/infrastructure/trader_lab/vt08_a_blind_three_source_review_join_v1.py
      - tests/infrastructure/trader_lab/test_vt08_a_blind_three_source_review_join_v1.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  independent-ready-blind-review-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        market: [EURJPY, USDCHF, NZDUSD, CADJPY, USDCAD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Test source identity, math, no semantic/fill promotion
        run: |
          ruff check src/qore/infrastructure/trader_lab/vt08_a_blind_three_source_review_join_v1.py tests/infrastructure/trader_lab/test_vt08_a_blind_three_source_review_join_v1.py
          pytest -q tests/infrastructure/trader_lab/test_vt08_a_blind_three_source_review_join_v1.py
      - uses: actions/download-artifact@v4
        with:
          name: vt08-a-author-conditional-eq-${{ matrix.market }}-57a6fa70f8a14ff26a6249b39d1f3e4725aa0a4c
          path: source-eq/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 38747954308
      - uses: actions/download-artifact@v4
        with:
          name: vt08-a-h1-untouched-source-${{ matrix.market }}-4ee9930a576f8185299fb4f7e376191511fb0ed7
          path: source-target/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 38763309669
      - uses: actions/download-artifact@v4
        with:
          name: vt08-a-h1-basic-swing-${{ matrix.market }}-3b0b1fd0052ef7ee38f4c117613b476836889b49
          path: source-swing/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 38764229960
      - name: Join all frozen candidates, do not discard negatives/ambiguities
        env:
          MARKET: ${{ matrix.market }}
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json,os
          from pathlib import Path
          from qore.infrastructure.trader_lab.vt08_a_blind_three_source_review_join_v1 import (
              join_blind_source_reviews,report_sha256,
          )
          m=os.environ["MARKET"]
          def read(base,suffix):
              paths=list(Path(base,m).rglob(m+suffix))
              if len(paths)!=1:
                  raise SystemExit(f"one immutable source artifact expected: {base}")
              return json.loads(paths[0].read_text(encoding="utf-8"))
          eq=read("source-eq","-conditional-eq-review.json")
          target=read("source-target","-h1-observed-untouched-witnesses.json")
          swing=read("source-swing","-h1-basic-swing-source-witness.json")
          result=join_blind_source_reviews(eq,target,swing)
          frozen={"EURJPY":538,"USDCHF":518,"NZDUSD":550,"CADJPY":516,"USDCAD":535}[m]
          if result["frozen_event_count"]!=frozen:
              raise SystemExit("full 2657 universe drift")
          if result["source_complete_entries"] or result["broker_fills"]:
              raise SystemExit("synthetic source promoted into economic evidence")
          dst=Path("evidence",m+"-three-source-blind-review.json")
          dst.write_text(
              json.dumps(result,sort_keys=True,separators=(",",":"),allow_nan=False),
              encoding="utf-8",
          )
          print(json.dumps({
              "market":m,
              "events":result["frozen_event_count"],
              "categories":result["category_counts"],
              "review_sha256":report_sha256(result),
              "source_complete":result["source_complete_entries"],
              "profit_factor":result["profit_factor"],
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vt08-a-blind-three-source-${{ matrix.market }}-${{ github.sha }}
          path: evidence/*.json
          retention-days: 30
          if-no-files-found: error
