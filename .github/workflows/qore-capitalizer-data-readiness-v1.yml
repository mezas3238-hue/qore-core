name: QORE Capitalizer Data Readiness V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-data-readiness-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_data_readiness.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_research_lineage.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_behavior_lab.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-data-readiness-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_M5_RUN_ID: '35166210458'
  SOURCE_M5_GIT_SHA: 'ab782b8e9f890f86a2b6500070f0556b4b685e3d'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check --ignore E501 \
            src/qore/infrastructure/trader_lab/capitalizer_data_readiness.py \
            src/qore/infrastructure/trader_lab/capitalizer_research_lineage.py \
            tests/infrastructure/trader_lab/test_capitalizer_behavior_lab.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_data_readiness.py \
            src/qore/infrastructure/trader_lab/capitalizer_research_lineage.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_behavior_lab.py

  readiness:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download immutable consumed Atlas aggregate
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-aggregate-${{ env.SOURCE_M5_GIT_SHA }}
          path: atlas-aggregate
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M5_RUN_ID }}
      - name: Run Capitalizer data readiness audit
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_data_readiness \
            atlas-aggregate/ten-year-consumption-index.json \
            capitalizer-data-readiness
      - name: Enforce consumed-evidence governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  'capitalizer-data-readiness/capitalizer-data-readiness-v1.json'
              ).read_text()
          )
          assert report['market_count'] == 9
          assert report['ready_markets'] == 9
          assert report['all_markets_ready_for_development'] is True
          assert report['fresh_holdout_eligible'] is False
          assert report['retained_m5_bars'] > 6_500_000
          for market in report['markets']:
              assert market['raw_integrity_status'] == 'CLEAN_PROVIDER_PAYLOAD'
              assert market['research_evidence_consumed'] is True
              assert market['fresh_holdout_eligible'] is False
          PY
      - name: Upload immutable Capitalizer data-readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-data-readiness-v1-${{ github.sha }}
          path: capitalizer-data-readiness
          if-no-files-found: error
          retention-days: 90
