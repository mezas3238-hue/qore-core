name: QORE VT08 CRT PURE R2-CI Three Ledger Source Audit

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vt08-crt-pure-source-identity-001
    paths:
      - '.github/workflows/vt08-crt-pure-r2ci-three-ledger-audit.yml'
      - 'src/qore/infrastructure/trader_lab/vt08_crt_pure_r2ci_three_ledger_identity.py'
      - 'tests/infrastructure/trader_lab/test_vt08_crt_pure_r2ci_three_ledger_identity.py'

permissions:
  contents: read
  actions: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,ctrader]'
      - name: Strict source equivalence gates
        run: |
          ruff check src/qore/infrastructure/trader_lab/vt08_crt_pure_r2ci_three_ledger_identity.py tests/infrastructure/trader_lab/test_vt08_crt_pure_r2ci_three_ledger_identity.py
          mypy src/qore/infrastructure/trader_lab/vt08_crt_pure_r2ci_three_ledger_identity.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_vt08_crt_pure_r2ci_three_ledger_identity.py

  audit:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - market: AUDUSD
            r2f_artifact: qore-vt08-crt-pure-r2f-AUDUSD-24c5d2b8cc4e9f15d42d4d5396e72997fc5af8e3
            r2g_artifact: qore-vt08-crt-pure-r2g-AUDUSD-a9fe37e9c69aaad592cd0163d9847540a7f5760a
            original_run: 36173116494
            original_artifact: qore-vt08-crt-pure-r2cc-audusd-f0973808af1a6e342b71ba179ccecb1c43a7913c
          - market: USDJPY
            r2f_artifact: qore-vt08-crt-pure-r2f-USDJPY-24c5d2b8cc4e9f15d42d4d5396e72997fc5af8e3
            r2g_artifact: qore-vt08-crt-pure-r2g-USDJPY-a9fe37e9c69aaad592cd0163d9847540a7f5760a
            original_run: 36173125334
            original_artifact: qore-vt08-crt-pure-r2cd-usdjpy-e49ed06db7e9fc5095e856491fcd68de7f61aca0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[ctrader]'
      - name: Download immutable original R2-F
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.r2f_artifact }}
          repository: ${{ github.repository }}
          run-id: '35811162435'
          github-token: ${{ github.token }}
          path: evidence/r2f
      - name: Download immutable original R2-G
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.r2g_artifact }}
          repository: ${{ github.repository }}
          run-id: '35811391351'
          github-token: ${{ github.token }}
          path: evidence/r2g
      - name: Download original long-history selected ledger
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.original_artifact }}
          repository: ${{ github.repository }}
          run-id: ${{ matrix.original_run }}
          github-token: ${{ github.token }}
          path: evidence/control
      - name: Three-way source identity and prior-selected equivalence
        shell: bash
        run: |
          set -euo pipefail
          for f in evidence/r2f/hypotheses.jsonl evidence/r2f/report.json evidence/r2g/trades.jsonl evidence/r2g/report.json evidence/control/delayed.jsonl; do
            test -s "$f"
          done
          mkdir -p artifacts/${{ matrix.market }}
          sha256sum evidence/r2f/hypotheses.jsonl evidence/r2f/report.json evidence/r2g/trades.jsonl evidence/r2g/report.json evidence/control/delayed.jsonl | tee artifacts/${{ matrix.market }}/source_sha256.txt
          python -m qore.infrastructure.trader_lab.vt08_crt_pure_r2ci_three_ledger_identity \
            artifacts/${{ matrix.market }} --market ${{ matrix.market }} \
            --r2f-ledger evidence/r2f/hypotheses.jsonl \
            --r2f-report evidence/r2f/report.json \
            --r2g-ledger evidence/r2g/trades.jsonl \
            --r2g-report evidence/r2g/report.json \
            --frozen-control evidence/control/delayed.jsonl \
            | tee artifacts/${{ matrix.market }}/stdout.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-r2ci-${{ matrix.market }}-${{ github.sha }}
          path: artifacts/${{ matrix.market }}
          if-no-files-found: warn
          retention-days: 90
