name: QORE CIBO Phase22 EURUSD R38 Replay Freeze

on:
  pull_request:
    paths:
      - '.github/workflows/cibo-phase22-eurusd-r38-replay-freeze.yml'
      - 'scripts/cibo_phase22_eurusd_r38_window_replay.py'
      - 'tests/infrastructure/test_cibo_phase22_eurusd_r38_window_replay.py'
      - 'scripts/cibo_phase18_eurusd_geometry_patch.py'
      - 'scripts/cibo_phase18_eurusd_bind.py'
      - 'scripts/cibo_phase18_eurusd_score.py'
  push:
    branches:
      - agent/cibo-certification-architect-b-integration-001
    paths:
      - '.github/workflows/cibo-phase22-eurusd-r38-replay-freeze.yml'
      - 'scripts/cibo_phase22_eurusd_r38_window_replay.py'
      - 'tests/infrastructure/test_cibo_phase22_eurusd_r38_window_replay.py'
      - 'scripts/cibo_phase18_eurusd_geometry_patch.py'
      - 'scripts/cibo_phase18_eurusd_bind.py'
      - 'scripts/cibo_phase18_eurusd_score.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  EURUSD_SOURCE_SHA: '324fb91d44a6fa328e66de2e22ace7386630c7aa'
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-EURUSD-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-EURUSD-2f510461b3360e91d5ee70a72716a76cd6561f16'
  R28_RUN_ID: '35319457546'
  R28_ARTIFACT: 'qore-turtle-soup-eurusd-cognitive-v3-r28-e6879bbdd3844751af075269ddd93db6d3f9b9e1'
  FREEZE_RUN_ID: '35326864091'
  FREEZE_ARTIFACT: 'qore-turtle-soup-eurusd-r36-candidate-freeze-4fef686b9fc669ad64a5a85fb2c899fae9b42a74'
  R38_RUN_ID: '35327677519'
  R38_ARTIFACT: 'qore-turtle-soup-eurusd-r38-5y-structural-risk-correction-324fb91d44a6fa328e66de2e22ace7386630c7aa'

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout CIBO evidence head
        uses: actions/checkout@v4

      - name: Checkout immutable EURUSD source code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EURUSD_SOURCE_SHA }}
          path: eurusd-code

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install -e '.[dev]'

      - name: Validate adapter quality
        run: |
          ruff check \
            scripts/cibo_phase22_eurusd_r38_window_replay.py \
            tests/infrastructure/test_cibo_phase22_eurusd_r38_window_replay.py
          mypy scripts/cibo_phase22_eurusd_r38_window_replay.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_phase22_eurusd_r38_window_replay.py

      - name: Verify exact source commit
        run: |
          test "$(git -C eurusd-code rev-parse HEAD)" = "$EURUSD_SOURCE_SHA"

      - name: Instrument exact R38 source for serialization only
        run: |
          python scripts/cibo_phase18_eurusd_geometry_patch.py \
            eurusd-code/src/qore/infrastructure/trader_lab/turtle_soup_eurusd_r38_5y_structural_risk_correction.py \
            eurusd-code/src/qore/infrastructure/trader_lab/cibo_phase18_eurusd_r38_geometry_replay.py
          python -m py_compile \
            eurusd-code/src/qore/infrastructure/trader_lab/cibo_phase18_eurusd_r38_geometry_replay.py

      - name: Download immutable EURUSD dependencies
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-eurusd
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target-eurusd
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.R28_ARTIFACT }}
          path: cognitive-v3
          github-token: ${{ github.token }}
          run-id: ${{ env.R28_RUN_ID }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.FREEZE_ARTIFACT }}
          path: r36-freeze
          github-token: ${{ github.token }}
          run-id: ${{ env.FREEZE_RUN_ID }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.R38_ARTIFACT }}
          path: r38-source
          github-token: ${{ github.token }}
          run-id: ${{ env.R38_RUN_ID }}

      - name: Reproduce consumed Phase18 through Phase22 adapter
        env:
          PYTHONPATH: ${{ github.workspace }}/eurusd-code/src
        run: |
          mkdir -p phase22-parity
          python scripts/cibo_phase22_eurusd_r38_window_replay.py \
            --mode PARITY \
            --module-path eurusd-code/src/qore/infrastructure/trader_lab/cibo_phase18_eurusd_r38_geometry_replay.py \
            --raw-root source-eurusd \
            --target-root target-eurusd \
            --cognitive-root cognitive-v3 \
            --freeze-root r36-freeze \
            --output-dir phase22-parity \
            > phase22-parity/adapter-stdout.json

      - name: Require exact R38 row parity
        run: |
          python scripts/cibo_phase18_eurusd_bind.py \
            --geometry phase22-parity/phase18-eurusd-r38-geometry-trades.jsonl \
            --r38 r38-source/r38-5y-corrected-trades.jsonl \
            --r38-report r38-source/r38-5y-correction-report.json \
            --output phase22-parity
          python scripts/cibo_phase18_eurusd_score.py \
            --bound phase22-parity/phase18-eurusd-r38-bound-trades.jsonl \
            --output phase22-parity/phase22-eurusd-r38-parity-score.json

      - name: Enforce no fresh holdout access
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(
              Path(
                  "phase22-parity/phase22-eurusd-r38-window-replay-receipt.json"
              ).read_text()
          )
          assert p["mode"] == "PARITY"
          assert p["rows"] == 863
          assert p["methodology_parameters_modified"] is False
          assert p["fresh_holdout_accessed"] is False
          assert p["fresh_outcomes_executed"] is False
          assert p["productive_authority"] is False
          PY

      - name: Seal parity evidence
        run: |
          printf '%s\n' "$EURUSD_SOURCE_SHA" > phase22-parity/eurusd-source-sha.txt
          cd phase22-parity
          sha256sum \
            phase18-eurusd-r38-geometry-trades.jsonl \
            phase18-eurusd-r38-bound-trades.jsonl \
            phase22-eurusd-r38-parity-score.json \
            phase22-eurusd-r38-window-replay-receipt.json \
            eurusd-source-sha.txt > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-phase22-eurusd-r38-parity-${{ github.sha }}
          path: phase22-parity
          if-no-files-found: error
          retention-days: 90
