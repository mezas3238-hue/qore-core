name: QORE Capitalizer USDJPY Forward Response V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-usdjpy-forward-response-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_forward_response.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-usdjpy-forward-response-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-USDJPY-ab782b8e9f890f86a2b6500070f0556b4b685e3d'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check --ignore E501 \
            src/qore/infrastructure/trader_lab/capitalizer_forward_response.py
      - name: Mypy
        run: |
          mypy src/qore/infrastructure/trader_lab/capitalizer_forward_response.py
      - name: Focused outcome-separation tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_microstructure_discovery.py \
            -k 'forward_response'

  response:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download immutable consumed USDJPY M5 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: usdjpy-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Build outcome-only forward response
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_forward_response \
            usdjpy-source \
            forward-output
      - name: Enforce no-leakage governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('forward-output/capitalizer-usdjpy-forward-response-v1.json')
          result = json.loads(path.read_text())
          assert result['identity'] == 'QORE_CAPITALIZER_FORWARD_RESPONSE_V1'
          assert result['symbol'] == 'USDJPY'
          assert result['session'] == 'ASIA'
          assert result['total_labeled_responses'] > 0
          assert result['causal_feature_allowed'] is False
          assert result['rule_promotion_allowed'] is False
          horizons = {row['horizon_minutes'] for row in result['aggregates']}
          assert horizons == {5, 10, 15, 30, 60}
          events = {row['event'] for row in result['aggregates']}
          assert 'HIGH_RAID_REJECTION' in events
          assert 'LOW_RAID_REJECTION' in events
          assert 'HIGH_ACCEPTANCE' in events
          assert 'LOW_ACCEPTANCE' in events
          PY
      - name: Upload immutable forward-response evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-usdjpy-forward-response-v1-${{ github.sha }}
          path: forward-output
          if-no-files-found: error
          retention-days: 90
