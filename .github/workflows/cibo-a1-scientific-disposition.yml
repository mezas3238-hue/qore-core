name: QORE CIBO A1 Scientific Disposition Contract

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-a1-scientific-disposition.yml'
      - 'src/qore/infrastructure/cibo_a1_scientific_disposition.py'
      - 'tests/infrastructure/test_cibo_a1_scientific_disposition.py'
      - 'docs/research/CIBO-A1-SCIENTIFIC-DISPOSITION-CONTRACT-V1.md'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  a1-scientific-disposition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: A1 scientific disposition contract
        run: |
          ruff check \
            src/qore/infrastructure/cibo_a1_scientific_disposition.py \
            tests/infrastructure/test_cibo_a1_scientific_disposition.py
          mypy \
            src/qore/infrastructure/cibo_a1_scientific_disposition.py
          python -m py_compile \
            src/qore/infrastructure/cibo_a1_scientific_disposition.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_a1_scientific_disposition.py
