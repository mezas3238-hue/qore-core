name: VT08 Index R84 Source Exact PS Event Census

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r84-source-exact-ps-event-census.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r84_source_exact_ps_event_census.py
      - tests/infrastructure/trader_lab/test_vt08_index_r84_source_exact_ps_event_census.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r84_source_exact_ps_event_census.py

  forensics:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R84 source-exact PS event census
        run: |
          python -m qore.infrastructure.trader_lab.vt08_index_r84_source_exact_ps_event_census \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r84-source-exact-ps-event-census.json

      - name: Verify R84 no-trade census governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r84-source-exact-ps-event-census.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R84_SOURCE_EXACT_PROTECTED_SWING_EVENT_CENSUS_001"
          )
          assert report["source_r83"]["run_id"] == 35519881915
          assert report["source_r83"]["artifact_id"] == 10607958272

          source = report["source_contract"]
          assert source["protected_swing_primary_source_date"] == "2025-08-06"
          assert source["ic_cisd_primary_source_date"] == "2026-06-13"
          assert source["liquidity_sweep_requires_post_touch_extreme"] is True
          assert source["fvg_reaction_uses_exact_original_source_fvg"] is True
          assert source["numeric_separation_threshold"] is None

          assert report["five_year"]["canonical_signal_sample_reference"] == 2448
          assert report["recent_two_year"]["canonical_signal_sample_reference"] == 1017
          assert report["r66_failed_holdout"]["canonical_signal_sample_reference"] == 773
          assert report["decision"] == (
              "R84_SOURCE_EXACT_PS_EVENT_CENSUS_COMPLETE_NO_TRADES_CREATED"
          )

          governance = report["governance"]
          assert governance["forensics_only"] is True
          assert governance["consumed_evidence_only"] is True
          assert governance["fresh_holdout_claim"] is False
          assert governance["provider_observations_only"] is True
          assert governance["future_information_used"] is False
          assert governance["pnl_evaluated"] is False
          assert governance["continuation_required"] is False
          assert governance["entries_created"] is False
          assert governance["signals_created"] is False
          assert governance["signals_suppressed"] is False
          assert governance["risk_changed"] is False
          assert governance["target_changed"] is False
          assert governance["candidate_created"] is False
          assert governance["trader_certified"] is False
          assert governance["live_authorized"] is False
          assert governance["real_capital_authorized"] is False
          assert governance["production_authorized"] is False
          PY

      - name: Upload R84 evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r84-source-exact-ps-event-census-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: warn
          retention-days: 90
