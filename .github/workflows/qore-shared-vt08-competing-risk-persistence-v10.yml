name: QORE Shared VT08 Competing Risk Persistence V10

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - scripts/vt08_index_shared_competing_risk_persistence_v10.py
      - .github/workflows/qore-shared-vt08-competing-risk-persistence-v10.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  competing-risk-persistence-v10:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout Shared
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: pip install -e ".[dev]"

      - name: Static validation
        run: |
          ruff check scripts/vt08_index_shared_competing_risk_persistence_v10.py
          python -m py_compile scripts/vt08_index_shared_competing_risk_persistence_v10.py

      - name: Download frozen V6 consumed ledger
        uses: actions/download-artifact@v4
        with:
          name: qore-shared-vt08-stop-target-discrimination-v6-1a534d0ae735efef4dcbc0c0be4b110ceaa80501
          path: artifacts/v6
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36131607443

      - name: Download frozen V9 calibration
        uses: actions/download-artifact@v4
        with:
          name: qore-shared-vt08-competing-risk-calibration-v9-d221648977a4b4fe02ac88dfe9f1136ba375c04a
          path: artifacts/v9
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36134739656

      - name: Run V10 temporal posterior persistence
        run: |
          mkdir -p artifacts/v10
          python scripts/vt08_index_shared_competing_risk_persistence_v10.py             --v6-json artifacts/v6/vt08-index-shared-stop-target-discrimination-v6.json             --v9-json artifacts/v9/vt08-index-shared-competing-risk-calibration-v9.json             --out artifacts/v10/vt08-index-shared-competing-risk-persistence-v10.json             | tee artifacts/v10/summary.json

      - name: Validate V10 governance
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          p=json.loads(
              Path(
                  "artifacts/v10/"
                  "vt08-index-shared-competing-risk-persistence-v10.json"
              ).read_text()
          )
          assert p["identity"] == "QORE_SHARED_VT08_COMPETING_RISK_PERSISTENCE_V10"
          assert p["source_v6_run"] == 36131607443
          assert p["source_v9_run"] == 36134739656
          assert p["v9_model_frozen"] is True
          assert p["research_only"] is True
          assert p["consumed_evidence_only"] is True
          assert p["runtime_actuation"] is False
          assert p["sizing_used"] is False
          assert p["risk_weighting_used"] is False
          assert p["trailing_used"] is False
          assert p["target_extension_used"] is False
          assert p["train_window"] == "five_year"
          assert p["validation_windows"] == [
              "recent_two_year",
              "r66_consumed_failed_holdout",
          ]
          assert p["policy_search"]["recovery_active_or_restored_veto"] is True
          assert p["policy_search"]["must_beat_v7_control_recall"] is True

          policy=p["selected_policy"]
          if policy is not None:
              assert Decimal(policy["threshold"]) >= Decimal("0.750")
              assert policy["persistence_observations"] in {2,3,4,5}

          for key in (
              "five_year",
              "recent_two_year",
              "r66_consumed_failed_holdout",
          ):
              w=p["windows"][key]
              assert w["status"] in {
                  "ADMIT_FOR_ECONOMIC_SHADOW",
                  "REJECT",
              }
              assert "precision" in w
              assert "loss_recall" in w
              assert "winner_mark_rate" in w
              assert "median_lead_bars" in w
              assert "beats_control_v7_recall" in w

          print(json.dumps({
              "validation_pass":p["validation_pass"],
              "selected_policy":p["selected_policy"],
              "windows":p["windows"],
          },sort_keys=True))
          PY
        env:
          PYTHONPATH: .
      - name: Bind result
        run: |
          cd artifacts/v10
          echo "$GITHUB_SHA" > shared-git-sha.txt
          echo "36131607443" > source-v6-run.txt
          echo "36134739656" > source-v9-run.txt
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-vt08-competing-risk-persistence-v10-${{ github.sha }}
          path: artifacts/v10/
          if-no-files-found: error
          retention-days: 90
