name: QORE CIBO Forecast Confidence Remediation

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cibo-function-economic-sensors-001
    paths:
      - '.github/workflows/cibo-forecast-confidence-remediation.yml'
      - 'src/qore/infrastructure/cibo_full_economic_digital_twin.py'
      - 'src/qore/infrastructure/cibo_single_account_ceiling_state.py'
      - 'src/qore/infrastructure/cibo_single_account_historical_ceiling_state.py'
      - 'src/qore/infrastructure/cibo_single_account_manifest_economics.py'
      - 'src/qore/infrastructure/cibo_portfolio_allocation_engine.py'
      - 'tests/infrastructure/test_cibo_full_economic_digital_twin.py'
      - 'tests/infrastructure/test_cibo_single_account_manifest_economics.py'

permissions:
  contents: read

concurrency:
  group: qore-cibo-forecast-confidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-forecast-confidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Show exact Ruff normalization
        run: |
          set -euo pipefail
          ruff check --fix src/qore/infrastructure/cibo_single_account_ceiling_state.py
          git diff -- src/qore/infrastructure/cibo_single_account_ceiling_state.py
          exit 1

      - name: Prove forecast confidence contract
        run: |
          set -euo pipefail
          pytest -q --no-cov             tests/infrastructure/test_cibo_full_economic_digital_twin.py             tests/infrastructure/test_cibo_single_account_manifest_economics.py
