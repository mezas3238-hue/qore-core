name: TEMP Architect Story Provenance

on:
  push:
    branches:
      - agent/trader-story-forensics-architect-provenance-001
    paths:
      - .github/architect-story-provenance-trigger

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact provenance branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply fail-closed provenance patch
        run: python .github/architect_story_provenance_patch.py
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff focused candidate
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/first_cohort_story_forensics.py \
            src/qore/infrastructure/trader_lab/story_forensics_visual_package.py \
            tests/infrastructure/trader_lab/test_first_cohort_story_forensics.py \
            tests/infrastructure/trader_lab/test_story_forensics_visual_package.py
      - name: Mypy focused candidate
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/first_cohort_story_forensics.py \
            src/qore/infrastructure/trader_lab/story_forensics_visual_package.py \
            tests/infrastructure/trader_lab/test_first_cohort_story_forensics.py \
            tests/infrastructure/trader_lab/test_story_forensics_visual_package.py
      - name: Pytest provenance regressions
        run: |
          pytest -q \
            tests/infrastructure/trader_lab/test_first_cohort_story_forensics.py \
            tests/infrastructure/trader_lab/test_story_forensics_visual_package.py
      - name: Verify mutation scope
        run: |
          git diff --exit-code -- .github/architect_story_provenance_patch.py .github/workflows/architect-story-provenance.yml .github/architect-story-provenance-trigger
          CHANGED="$(git diff --name-only | sort -u)"
          EXPECTED="$(printf '%s\n' \
            src/qore/infrastructure/trader_lab/first_cohort_story_forensics.py \
            src/qore/infrastructure/trader_lab/story_forensics_visual_package.py \
            tests/infrastructure/trader_lab/test_first_cohort_story_forensics.py \
            tests/infrastructure/trader_lab/test_story_forensics_visual_package.py | sort)"
          printf '%s\n' "$CHANGED"
          test "$CHANGED" = "$EXPECTED"
      - name: Commit verified provenance candidate
        run: |
          git config user.name "qore-architect-bot"
          git config user.email "qore-architect-bot@users.noreply.github.com"
          git add \
            src/qore/infrastructure/trader_lab/first_cohort_story_forensics.py \
            src/qore/infrastructure/trader_lab/story_forensics_visual_package.py \
            tests/infrastructure/trader_lab/test_first_cohort_story_forensics.py \
            tests/infrastructure/trader_lab/test_story_forensics_visual_package.py
          git commit -m "fix(trader-lab): bind Story Forensics to exact evidence artifacts"
          git push origin HEAD:${GITHUB_REF_NAME}
