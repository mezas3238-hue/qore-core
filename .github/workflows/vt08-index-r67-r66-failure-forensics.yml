name: VT08 Index R67 R66 Failure Forensics

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r67-r66-failure-forensics.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r67_r66_failure_forensics.py
      - tests/infrastructure/trader_lab/test_vt08_index_r67_r66_failure_forensics.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r67_r66_failure_forensics.py

  forensics:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R67 R66 failure forensics
        run: |
          python -m qore.infrastructure.trader_lab.vt08_index_r67_r66_failure_forensics \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r67-r66-failure-forensics.json

      - name: Verify R67 reconstructs the failed identity without retuning
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r67-r66-failure-forensics.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R67_R66_FRESH_HOLDOUT_FAILURE_FORENSICS_001"
          )
          assert report["source_failure"]["decision"] == (
              "FAIL_R66_FRESH_HOLDOUT_REJECT_FROZEN_IDENTITY"
          )
          assert report["candidate"]["candidate_retuned"] is False
          assert report["candidate"]["replacement_candidate_created"] is False
          assert report["five_year"]["sample"] == 2448
          assert report["recent_two_year"]["sample"] == 1017
          assert report["r66_failed_holdout"]["sample"] == 773
          assert report["density_failure"]["shortfall_trades"] == 227
          assert (
              Decimal(
                  str(report["r66_failed_holdout"]["primary"]["total_r"])
              )
              < 0
          )
          assert (
              Decimal(
                  str(report["r66_failed_holdout"]["secondary"]["total_r"])
              )
              < 0
          )
          assert report["decision"] == (
              "R67_FORENSICS_COMPLETE_NO_NEW_CANDIDATE"
          )
          governance = report["governance"]
          assert governance["forensics_only"] is True
          assert governance["r66_is_consumed_failure_evidence"] is True
          assert governance["fresh_holdout_claim"] is False
          assert governance["frozen_r58_r59_modified"] is False
          assert governance["calendar_or_year_used_as_runtime_feature"] is False
          assert governance["signal_suppression_performed"] is False
          assert governance["risk_retuning_performed"] is False
          assert governance["r66_gates_lowered"] is False
          assert governance["r66_window_changed"] is False
          assert governance["trader_certified"] is False
          assert governance["live_authorized"] is False
          assert governance["real_capital_authorized"] is False
          assert governance["production_authorized"] is False
          PY

      - name: Upload R67 evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r67-r66-failure-forensics-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: warn
          retention-days: 90
