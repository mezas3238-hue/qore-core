name: QORE Turtle Soup R5 Classic Tick Resolution

on:
  push:
    branches:
      - agent/turtle-soup-candidate-r5-classic-tick-resolution-001
    paths:
      - .github/workflows/turtle-soup-candidate-r5-classic-ticks.yml
      - src/qore/infrastructure/trader_lab/turtle_soup_candidate_r5_classic_tick_targets.py
      - src/qore/infrastructure/trader_lab/turtle_soup_candidate_r5_classic_tick_probe.py
      - src/qore/infrastructure/trader_lab/turtle_soup_candidate_r5_classic_tick_runtime.py
      - docs/research/TURTLE-SOUP-CANDIDATE-R5-CLASSIC-TICK-RESOLUTION-FREEZE.md

concurrency:
  group: qore-turtle-soup-r5-classic-ticks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
  QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        symbol:
          - EURUSD
          - GBPUSD
          - USDJPY
          - AUDUSD
          - USDCAD
          - GBPJPY
          - AUDJPY
    env:
      QORE_TURTLE_SOUP_SYMBOL: ${{ matrix.symbol }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cTrader runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ctrader]"

      - name: Verify required read-only inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            QORE_CTRADER_CLIENT_ID \
            QORE_CTRADER_CLIENT_SECRET \
            QORE_CTRADER_ACCESS_TOKEN \
            QORE_CTRADER_REFRESH_TOKEN \
            QORE_TURTLE_SOUP_SYMBOL
          do
            if [ -z "${!name:-}" ]; then
              echo "missing required market-data input: ${name}" >&2
              exit 2
            fi
          done

      - name: Discover authorized read-only cTrader account when not configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            if ! [[ "$account_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "cTrader account discovery returned an invalid id" >&2
              exit 3
            fi
            echo "::add-mask::$account_id"
            printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          fi

      - name: Collect BID ticks for frozen Classic ambiguity minutes
        run: |
          set -euo pipefail
          dir="artifacts/turtle-soup-r5-classic-ticks/${QORE_TURTLE_SOUP_SYMBOL}"
          mkdir -p "$dir"
          python -m qore.infrastructure.trader_lab.turtle_soup_candidate_r5_classic_tick_runtime \
            --symbol "$QORE_TURTLE_SOUP_SYMBOL" \
            --software-sha "$GITHUB_SHA" \
            --output "$dir/tick-evidence.json"
          printf '%s\n' "$GITHUB_SHA" > "$dir/git-sha.txt"

      - name: Enforce R5 tick evidence governance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["QORE_TURTLE_SOUP_SYMBOL"]
          path = Path(
              f"artifacts/turtle-soup-r5-classic-ticks/{symbol}/tick-evidence.json"
          )
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["schema"] == (
              "qore.trader_lab.turtle_soup_candidate_r5.classic_tick_evidence.v1"
          )
          assert payload["read_only"] is True
          assert payload["research_only"] is True
          assert payload["fresh_oos_consumed"] is False
          assert payload["research_identity"] == "turtle-soup-candidate-r5"
          assert payload["selection_reason"] == (
              "resolve-only-R1-CLASSIC-M1-INTRABAR_PATH_AMBIGUOUS"
          )
          assert payload["quote_type"] == "BID"
          assert payload["native_quote_type_value"] == 1
          assert payload["symbol"] == symbol
          assert payload["software_sha"] == os.environ["GITHUB_SHA"]
          assert len(payload["target_manifest_digest_sha256"]) == 64
          assert len(payload["evidence_digest_sha256"]) == 64
          assert payload["target_count"] == len(payload["minutes"])
          assert (
              payload["available_target_count"] + payload["unavailable_target_count"]
              == payload["target_count"]
          )
          PY

      - name: Upload immutable R5 Classic tick evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-r5-classic-ticks-${{ matrix.symbol }}-${{ github.sha }}
          path: artifacts/turtle-soup-r5-classic-ticks/${{ matrix.symbol }}
          if-no-files-found: error
          retention-days: 30
