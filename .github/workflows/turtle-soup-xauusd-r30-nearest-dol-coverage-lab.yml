name: QORE Turtle Soup XAUUSD R30 Nearest DOL Coverage Lab

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-xauusd-specialist-memory-v1-001
    paths:
      - '.github/workflows/turtle-soup-xauusd-r30-nearest-dol-coverage-lab.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r30_nearest_dol_coverage_lab.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r30_nearest_dol_coverage_lab.py'

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-XAUUSD-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-XAUUSD-2f510461b3360e91d5ee70a72716a76cd6561f16'
  R28_RUN_ID: '35305338898'
  R28_ARTIFACT: 'qore-turtle-soup-xauusd-cognitive-v3-r28-c35f8414ce59e26a36cdda27c2a964a426c3e5ba'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check --ignore E501,I001 \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r30_nearest_dol_coverage_lab.py \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r30_nearest_dol_coverage_lab.py
      - name: Mypy focused gate
        run: |
          mypy --disable-error-code attr-defined \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r30_nearest_dol_coverage_lab.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r30_nearest_dol_coverage_lab.py

  coverage-lab:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable XAUUSD raw master
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download immutable Target Destination V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Download Cognitive V3
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.R28_ARTIFACT }}
          path: cognitive-v3
          github-token: ${{ github.token }}
          run-id: ${{ env.R28_RUN_ID }}
      - name: Run fixed R30 experiments
        run: |
          mkdir -p r30-output
          python -m qore.infrastructure.trader_lab.turtle_soup_xauusd_r30_nearest_dol_coverage_lab \
            source-xauusd target-xauusd cognitive-v3 r30-output \
            > r30-output/stdout.json
          printf '%s\n' "$GITHUB_SHA" > r30-output/git-sha.txt
      - name: Enforce experiment governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('r30-output/r30-nearest-dol-coverage-lab-report.json').read_text())
          assert p['identity']=='TURTLE_SOUP_XAUUSD_R30_NEAREST_DOL_COVERAGE_LAB_V1'
          c=p['experiment_contract']
          assert c['fresh_holdout_consumed'] is False
          assert c['nearest_validated_dol_policy'] is True
          assert c['entry_changed'] is False
          assert c['c2_changed'] is False
          assert c['cisd_changed'] is False
          assert c['protected_swing_changed'] is False
          assert c['regime_model_changed'] is False
          assert c['economic_magnitude_ranks_targets'] is False
          assert c['recovery_requires_rank1'] is True
          assert c['recovery_requires_anatomy_structure'] is True
          assert c['recovery_requires_same_target_regime_journey_validation'] is True
          a=p['predeclared_acceptance']
          assert a['minimum_trades']==250
          assert a['minimum_net_010_profit_factor']=='1.80'
          assert a['maximum_net_010_drawdown_r']=='8.0'
          assert a['maximum_net_010_losing_streak']==3
          g=p['governance']
          assert g['candidate_replaced'] is False
          assert g['fresh_holdout_consumed'] is False
          assert g['live_authorized'] is False
          assert g['real_capital_authorized'] is False
          PY
      - name: Hash R30 evidence
        run: |
          cd r30-output
          sha256sum r30-nearest-dol-coverage-lab-report.json stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-xauusd-r30-nearest-dol-coverage-lab-${{ github.sha }}
          path: r30-output
          if-no-files-found: error
          retention-days: 90
