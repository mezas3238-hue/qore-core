name: QORE Turtle Soup XAUUSD R11 Positive Validity Candidate Contract

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-xauusd-r3-forensics-001
    paths:
      - '.github/workflows/turtle-soup-xauusd-r11-positive-validity-candidate.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r11_positive_validity_candidate_contract.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r11_positive_validity_candidate_contract.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check --ignore E501,I001 \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r11_positive_validity_candidate_contract.py \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r11_positive_validity_candidate_contract.py
      - name: Mypy focused gate
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r11_positive_validity_candidate_contract.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r11_positive_validity_candidate_contract.py
      - name: Build immutable candidate contract
        run: |
          mkdir -p r11-candidate-output
          python - <<'PY'
          from pathlib import Path
          from qore.infrastructure.trader_lab.turtle_soup_xauusd_r11_positive_validity_candidate_contract import write_manifest
          write_manifest(Path("r11-candidate-output/positive-validity-candidate.json"))
          PY
          printf '%s\n' "$GITHUB_SHA" > r11-candidate-output/git-sha.txt
      - name: Enforce frozen evidence and governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('r11-candidate-output/positive-validity-candidate.json').read_text())
          assert p['identity']=='TURTLE_SOUP_XAUUSD_R11_BREAK_A_MULTICHANNEL_VALIDITY_CANDIDATE_001'
          assert p['status']=='FROZEN_RESEARCH_CANDIDATE_AWAITING_INDEPENDENT_VALIDATION'
          assert p['consumed_evidence']['source_run_id']==35282212625
          assert p['consumed_evidence']['source_artifact_id']==10522679602
          assert p['consumed_evidence']['pre_entry_recognized']==31
          assert p['consumed_evidence']['binary_auditable']==30
          assert p['consumed_evidence']['dol_capable']==21
          assert p['hypothesis']['predicts_profit'] is False
          assert p['validation_contract']['family_signature_mutable_after_freeze'] is False
          assert p['validation_contract']['anchor_thresholds_mutable_after_freeze'] is False
          assert p['validation_contract']['fresh_holdout_opened_by_this_contract'] is False
          assert p['governance']['candidate_promoted_to_operating_rule'] is False
          assert p['governance']['fresh_holdout_consumed'] is False
          assert p['governance']['demo_eligible'] is False
          assert p['governance']['live_authorized'] is False
          assert p['governance']['real_capital_authorized'] is False
          assert p['governance']['production_authorized'] is False
          PY
      - name: Hash immutable candidate contract
        run: |
          cd r11-candidate-output
          sha256sum positive-validity-candidate.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-xauusd-r11-positive-validity-candidate-${{ github.sha }}
          path: r11-candidate-output
          if-no-files-found: error
          retention-days: 90
