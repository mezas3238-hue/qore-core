name: QORE VT31 NonBreaker Reloss Momentum V1
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  push:
    branches:
      - agent/vt31-edge-position-cert-b-001
    paths:
      - scripts/vt31_nas100_nonbreaker_reloss_momentum_v1.py
      - docs/research/VT31_ARCH2_NONBREAKER_RELOSS_MOMENTUM_PLAN_001.md
      - .github/workflows/vt31-nonbreaker-reloss-momentum-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Static gate
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_nonbreaker_reloss_momentum_v1.py
          ruff check             scripts/vt31_nas100_nonbreaker_reloss_momentum_v1.py             scripts/vt31_nas100_market_native_momentum_swing_protection_v1.py
      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"
      - name: Run nonbreaker reloss momentum
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python             scripts/vt31_nas100_nonbreaker_reloss_momentum_v1.py             "input/${EVIDENCE_PATH}"             --output "result/nonbreaker-reloss-${PARTITION}.json"             | tee "result/summary-${PARTITION}.json"
      - name: Governance gate
        run: |
          python - <<'PY'
          import json, os
          from decimal import Decimal
          from pathlib import Path
          p=os.environ["PARTITION"]
          payload=json.loads(Path(f"result/nonbreaker-reloss-{p}.json").read_text())
          g=payload["governance"]
          assert g["trade_admission_changed"] is False
          assert g["entry_changed"] is False
          assert g["initial_structural_invalidation_changed"] is False
          assert g["primary_structural_target_changed"] is False
          assert g["breaker_management_changed"] is False
          assert g["runtime_r_decision_authority"] is False
          assert g["runtime_volume_decision_authority"] is False
          assert g["position_sizing_used"] is False
          assert g["leverage_used"] is False
          assert g["compounding_used"] is False
          assert g["capital_weighting_used"] is False
          assert g["fixed_profit_threshold_used"] is False
          assert g["fresh_holdout_opened"] is False
          v=payload["variants"]["NONBREAKER_RELOSS_MOMENTUM_SWING_ONCE"]
          assert v["breaker_changed_trade_count"] == 0
          assert all(row["entry_family"] != "breaker" for row in v["changed_rows"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nonbreaker-reloss-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-nonbreaker-reloss-*-${{ github.sha }}
          path: input
          merge-multiple: true
      - name: Adjudicate frozen gates
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          folds=("r5","r6","r8","consumed")
          variant="NONBREAKER_RELOSS_MOMENTUM_SWING_ONCE"
          def d(x): return Decimal(str(x))
          def pf_nondegrade(base,cand):
              b=base.get("profit_factor")
              c=cand.get("profit_factor")
              if b is None:
                  return c is None
              if c is None:
                  return True
              return d(c) >= d(b)

          payloads={
              f:json.loads(Path(f"input/nonbreaker-reloss-{f}.json").read_text())
              for f in folds
          }
          per_fold={}
          for f in folds:
              b=payloads[f]["variants"]["BASELINE"]
              c=payloads[f]["variants"][variant]
              bm=b["stress_0_05r"]
              cm=c["stress_0_05r"]
              w=c["winner_preservation_vs_baseline"]

              halfyear={}
              temporal_pass=True
              for key,base_block in b["halfyear_stress"].items():
                  cand_block=c["halfyear_stress"][key]
                  block_gates={
                      "sample_equal":int(cand_block["sample"])==int(base_block["sample"]),
                      "total_nondegrade":d(cand_block["total_r"])>=d(base_block["total_r"]),
                      "mean_nondegrade":d(cand_block["mean_r"])>=d(base_block["mean_r"]),
                      "pf_nondegrade":pf_nondegrade(base_block,cand_block),
                      "dd_nondegrade":d(cand_block["max_drawdown_r"])<=d(base_block["max_drawdown_r"]),
                  }
                  halfyear[key]={"gates":block_gates,"passes":all(block_gates.values())}
                  temporal_pass=temporal_pass and all(block_gates.values())

              changed=c["changed_rows"]
              gates={
                  "terminal_population_equal":int(c["trade_count"])==int(b["trade_count"]),
                  "pf_nondegrade":pf_nondegrade(bm,cm),
                  "mean_nondegrade":d(cm["mean_r"])>=d(bm["mean_r"]),
                  "total_nondegrade":d(cm["total_r"])>=d(bm["total_r"]),
                  "dd_nondegrade":d(cm["max_drawdown_r"])<=d(bm["max_drawdown_r"]),
                  "winner_count_ge_80":d(w["winner_count_preservation"])>=d("0.80"),
                  "winner_r_ge_90":d(w["winner_r_preservation"])>=d("0.90"),
                  "no_breaker_changed":int(c["breaker_changed_trade_count"])==0,
                  "all_changed_nonbreaker":all(row["entry_family"]!="breaker" for row in changed),
                  "no_changed_trade_degraded":all(d(row["delta_r"])>=0 for row in changed),
                  "halfyear_nondegrade":temporal_pass,
              }
              per_fold[f]={
                  "baseline":bm,
                  "candidate":cm,
                  "winner_preservation":w,
                  "changed_trade_count":c["changed_trade_count"],
                  "protection_armed_count":c["protection_armed_count"],
                  "halfyear":halfyear,
                  "gates":gates,
                  "passes":all(gates.values()),
              }

          survivor=all(x["passes"] for x in per_fold.values())
          changed_total=sum(x["changed_trade_count"] for x in per_fold.values())
          adjudication=(
              "SUPPORTED_CONSUMED_RESEARCH_WITNESS"
              if survivor and changed_total>0
              else ("NO_EFFECT" if changed_total==0 else "NOT_SUPPORTED")
          )
          out={
              "schema":"qore.vt31.nas100.nonbreaker_reloss_momentum.aggregate.v1",
              "head":"${{ github.sha }}",
              "variant":variant,
              "folds":per_fold,
              "cross_fold_survivor":survivor,
              "changed_trade_count_total":changed_total,
              "adjudication":adjudication,
              "governance":{
                  "runtime_r_decision_authority":False,
                  "runtime_volume_decision_authority":False,
                  "fresh_holdout_opened":False,
                  "candidate_frozen":False,
                  "policy_promoted":False,
              },
          }
          Path("aggregate.json").write_text(json.dumps(out,sort_keys=True,indent=2)+"\n")
          print(json.dumps(out,sort_keys=True))
          if not survivor:
              raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nonbreaker-reloss-aggregate-${{ github.sha }}
          path: aggregate.json
          retention-days: 90
