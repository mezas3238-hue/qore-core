name: QORE Capitalizer V49 High Frequency Capacity

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-v49-high-frequency-capacity.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_high_frequency_identity_v49.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_high_frequency_density_gate_v49.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_h1_context_state_v49.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_high_frequency_decision_graph_v49.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_high_frequency_capacity_census_v49.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_high_frequency_identity_v49.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_high_frequency_density_gate_v49.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_h1_context_state_v49.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_high_frequency_decision_graph_v49.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_high_frequency_capacity_census_v49.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-v49-hf-capacity-${{ github.sha }}
  cancel-in-progress: false

env:
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_high_frequency_identity_v49.py \
            src/qore/infrastructure/trader_lab/capitalizer_high_frequency_density_gate_v49.py \
            src/qore/infrastructure/trader_lab/capitalizer_h1_context_state_v49.py \
            src/qore/infrastructure/trader_lab/capitalizer_high_frequency_decision_graph_v49.py \
            src/qore/infrastructure/trader_lab/capitalizer_high_frequency_capacity_census_v49.py \
            tests/infrastructure/trader_lab/test_capitalizer_high_frequency_identity_v49.py \
            tests/infrastructure/trader_lab/test_capitalizer_high_frequency_density_gate_v49.py \
            tests/infrastructure/trader_lab/test_capitalizer_h1_context_state_v49.py \
            tests/infrastructure/trader_lab/test_capitalizer_high_frequency_decision_graph_v49.py \
            tests/infrastructure/trader_lab/test_capitalizer_high_frequency_capacity_census_v49.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_high_frequency_identity_v49.py \
            src/qore/infrastructure/trader_lab/capitalizer_high_frequency_density_gate_v49.py \
            src/qore/infrastructure/trader_lab/capitalizer_h1_context_state_v49.py \
            src/qore/infrastructure/trader_lab/capitalizer_high_frequency_decision_graph_v49.py \
            src/qore/infrastructure/trader_lab/capitalizer_high_frequency_capacity_census_v49.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_high_frequency_identity_v49.py \
            tests/infrastructure/trader_lab/test_capitalizer_high_frequency_density_gate_v49.py \
            tests/infrastructure/trader_lab/test_capitalizer_h1_context_state_v49.py \
            tests/infrastructure/trader_lab/test_capitalizer_high_frequency_decision_graph_v49.py \
            tests/infrastructure/trader_lab/test_capitalizer_high_frequency_capacity_census_v49.py

  census:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - symbol: USDJPY
            session: ASIA
          - symbol: AUDJPY
            session: ASIA
          - symbol: AUDUSD
            session: ASIA
          - symbol: GBPJPY
            session: ASIA
          - symbol: EURUSD
            session: LONDON
          - symbol: GBPUSD
            session: LONDON
          - symbol: XAUUSD
            session: NEW_YORK
          - symbol: USDCAD
            session: NEW_YORK
          - symbol: NAS100
            session: NEW_YORK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download retained provider-native M1
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Verify M1 provenance
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path("m1-source/m1-clone-manifest.json").read_text())
          assert result["canonical_symbol"] == os.environ["EXPECTED_SYMBOL"]
          assert result["provider_native_m1"] is True
          assert result["synthetic_m1"] is False
          assert result["interpolated_m1"] is False
          assert result["contradictory_m1"] == 0
          assert result["read_only"] is True
          PY
      - name: Run V49 market capacity census
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_high_frequency_capacity_census_v49 \
            market m1-source market-output --session "${{ matrix.session }}"
      - name: Enforce H1 M15 M1 epistemic boundary
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
          EXPECTED_SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"]
          path = Path("market-output") / f"capitalizer-{symbol.lower()}-v49-hf-capacity.json"
          result = json.loads(path.read_text())
          assert result["identity"] == "QORE_CAPITALIZER_V49_HIGH_FREQUENCY_CAPACITY_CENSUS"
          assert result["symbol"] == symbol
          assert result["session"] == os.environ["EXPECTED_SESSION"]
          assert result["daily_used"] is False
          assert result["h4_used"] is False
          assert result["outcome_used"] is False
          assert result["economics_used"] is False
          assert result["fresh_holdout_used"] is False
          assert result["live_authorized"] is False
          PY
      - name: Upload market capacity
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v49-hf-capacity-${{ matrix.symbol }}-${{ github.sha }}
          path: market-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: census
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download nine market artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v49-hf-capacity-*-${{ github.sha }}
          path: market-reports
          merge-multiple: false
      - name: Build V49 capacity matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_high_frequency_capacity_census_v49 \
            matrix market-reports matrix-output
      - name: Upload aggregate before density adjudication
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v49-high-frequency-capacity-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
      - name: Enforce high-frequency capacity gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path(
                  "matrix-output/capitalizer-v49-nine-market-high-frequency-capacity.json"
              ).read_text()
          )
          assert result["identity"] == (
              "QORE_CAPITALIZER_V49_NINE_MARKET_HIGH_FREQUENCY_CAPACITY"
          )
          assert result["decision_timeframes"] == ["H1", "M15", "M1"]
          assert result["daily_used"] is False
          assert result["h4_used"] is False
          assert result["outcome_used"] is False
          assert result["economics_used"] is False
          assert result["fresh_holdout_used"] is False
          assert result["density_decision"] == "HIGH_FREQUENCY_CAPACITY_PASS"
          assert result["source_complete_opportunities"] >= 500
          assert all(result["by_session"].get(name, 0) >= 100 for name in (
              "ASIA",
              "LONDON",
              "NEW_YORK",
          ))
          assert result["trader_certified"] is False
          assert result["live_authorized"] is False
          PY
