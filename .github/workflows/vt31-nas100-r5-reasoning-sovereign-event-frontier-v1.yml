name: QORE VT31 NAS100 Reasoning Sovereign Event Frontier V1

on:
  push:
    branches:
      - agent/vt31-nas100-intelligence-pilot-001
    paths:
      - scripts/vt31_nas100_r5_corrective_management_frontier_v1.py
      - scripts/vt31_nas100_r5_reasoning_sovereign_event_frontier_v1.py
      - .github/workflows/vt31-nas100-r5-reasoning-sovereign-event-frontier-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed_holdout
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Static gate
        run: |
          set -euo pipefail
          python -m py_compile             scripts/vt31_nas100_r5_corrective_management_frontier_v1.py             scripts/vt31_nas100_r5_reasoning_sovereign_event_frontier_v1.py
          ruff check             scripts/vt31_nas100_r5_corrective_management_frontier_v1.py             scripts/vt31_nas100_r5_reasoning_sovereign_event_frontier_v1.py
      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"
      - name: Run reasoning-sovereign frontier
        run: |
          set -euo pipefail
          python scripts/vt31_nas100_r5_reasoning_sovereign_event_frontier_v1.py             "input/${EVIDENCE_PATH}"             --partition "$PARTITION"             --output "result/sovereign-${PARTITION}.json"             | tee "result/summary-${PARTITION}.json"
      - name: Governance gate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          partition = os.environ["PARTITION"]
          payload = json.loads(
              Path(f"result/sovereign-{partition}.json").read_text()
          )
          g = payload["governance"]
          assert g["consumed_evidence_only"] is True
          assert g["new_event_requires_new_raid"] is True
          assert g["new_event_requires_new_confirmation"] is True
          assert g["new_event_requires_new_decision"] is True
          assert g["sovereign_routes_require_reasoning_execute"] is True
          assert g["uses_terminal_pnl_at_runtime"] is False
          assert g["uses_fold_identity_at_runtime"] is False
          assert g["uses_calendar_time_at_runtime"] is False
          assert g["opens_new_holdout"] is False
          assert g["policy_promoted"] is False
          assert g["candidate_certified"] is False
          assert g["live_authorized"] is False
          assert g["production_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-sovereign-event-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-nas100-sovereign-event-*-${{ github.sha }}
          path: input
          merge-multiple: true
      - name: Aggregate
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from pathlib import Path
          folds = {}
          for path in Path("input").glob("sovereign-*.json"):
              payload = json.loads(path.read_text())
              folds[payload["partition"]] = payload
          assert set(folds) == {"r5", "r6", "r8", "consumed_holdout"}
          variants = next(iter(folds.values()))["variants"].keys()
          report = {
              "schema": "qore.vt31.nas100.r5.reasoning_sovereign_event_frontier.aggregate.v1",
              "variants": {
                  variant: {
                      fold: {
                          "trade_count": folds[fold]["variants"][variant]["trade_count"],
                          "first_trade_count": folds[fold]["variants"][variant]["first_trade_count"],
                          "rearm_trade_count": folds[fold]["variants"][variant]["rearm_trade_count"],
                          "metrics": folds[fold]["variants"][variant]["metrics"],
                          "monte_carlo": folds[fold]["variants"][variant]["monte_carlo"],
                          "objectives": folds[fold]["variants"][variant]["objectives"],
                          "first_diagnostics": folds[fold]["variants"][variant]["first_diagnostics"],
                          "rearm_diagnostics": folds[fold]["variants"][variant]["rearm_diagnostics"],
                      }
                      for fold in ("r5", "r6", "r8", "consumed_holdout")
                  }
                  for variant in variants
              },
              "governance": {
                  "development_only": True,
                  "opens_new_holdout": False,
                  "policy_promoted": False,
                  "candidate_certified": False,
              },
          }
          Path("result/aggregate.json").write_text(
              json.dumps(report, sort_keys=True, indent=2) + "\n"
          )
          print(json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-sovereign-event-aggregate-${{ github.sha }}
          path: result/
          retention-days: 90
