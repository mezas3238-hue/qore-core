name: QORE VT31 NAS100 OCO Structural Rearm Forensics V1

on:
  push:
    branches:
      - agent/vt31-nas100-intelligence-pilot-001
    paths:
      - scripts/vt31_nas100_oco_structural_rearm_forensics_v1.py
      - scripts/vt31_nas100_entry_intelligence_oco_lab_v1.py
      - scripts/vt31_nas100_structural_rearm_density_frontier_v1.py
      - scripts/vt31_nas100_structural_rearm_quality_frontier_v1.py
      - scripts/vt31_nas100_specialist_r1_candidate.py
      - .github/workflows/vt31-nas100-oco-structural-rearm-forensics-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
          - partition: r8_fresh
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
    env:
      GH_TOKEN: ${{ github.token }}
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Static causal gate
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_oco_structural_rearm_forensics_v1.py
          ruff check scripts/vt31_nas100_oco_structural_rearm_forensics_v1.py
      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p evidence result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d evidence
          path="evidence/fresh/NAS100/market-evidence.json"
          test -f "$path"
          actual="$(sha256sum "$path" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"
      - name: Run OCO rearm forensics
        run: |
          set -euo pipefail
          python scripts/vt31_nas100_oco_structural_rearm_forensics_v1.py             evidence/fresh/NAS100/market-evidence.json             --partition "$PARTITION"             --output "result/oco-rearm-${PARTITION}.json"             | tee result/summary.json
      - name: Governance gate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=os.environ["PARTITION"]
          payload=json.loads(Path(f"result/oco-rearm-{p}.json").read_text())
          g=payload["governance"]
          assert g["consumed_evidence_only"] is True
          assert g["groups_defined_before_second_terminal_outcome"] is True
          assert g["previous_trade_result_is_known_before_rearm_decision"] is True
          assert g["second_terminal_pnl_used_at_runtime"] is False
          assert g["future_bars_used_to_authorize_rearm"] is False
          assert g["fold_identity_used_by_runtime_rule"] is False
          assert g["one_trade_max_per_source_event"] is True
          assert g["new_raid_confirmation_decision_required"] is True
          assert g["policy_promoted"] is False
          assert g["opens_new_holdout"] is False
          PY
      - name: Bind result
        run: |
          set -euo pipefail
          echo "$GITHUB_SHA" > result/git-sha.txt
          echo "$ARTIFACT_ID" > result/source-evidence-artifact-id.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd result && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-oco-rearm-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-nas100-oco-rearm-*-${{ github.sha }}
          path: input
          merge-multiple: true
      - name: Aggregate cross-fold rearm associations
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from pathlib import Path

          folds={}
          for path in Path("input").glob("oco-rearm-*.json"):
              p=json.loads(path.read_text())
              folds[p["partition"]]=p
          assert set(folds)=={"r5","r6","r8_fresh"},folds.keys()

          association_rows=[]
          names=sorted(next(iter(folds.values()))["by_interaction"])
          for name in names:
              common=set.intersection(*[
                  set(p["by_interaction"][name]) for p in folds.values()
              ])
              for key in sorted(common):
                  per_fold={}
                  samples=[]
                  pfs=[]
                  means=[]
                  for fold,p in sorted(folds.items()):
                      m=p["by_interaction"][name][key]
                      per_fold[fold]=m
                      samples.append(int(m["sample"]))
                      means.append(float(m["mean_r"]))
                      pf=m["profit_factor"]
                      pfs.append(None if pf is None else float(pf))
                  if min(samples)>=8 and all(
                      pf is not None and pf>=1.20 for pf in pfs
                  ) and all(mean>0 for mean in means):
                      status="CONSISTENT_POSITIVE"
                  elif min(samples)>=8 and all(
                      pf is not None and pf<1.0 for pf in pfs
                  ) and all(mean<0 for mean in means):
                      status="CONSISTENT_NEGATIVE"
                  else:
                      status="MIXED_OR_SPARSE"
                  association_rows.append({
                      "interaction":name,
                      "key":key,
                      "status":status,
                      "folds":per_fold,
                  })

          report={
              "schema":"qore.vt31.nas100.oco_structural_rearm_forensics.aggregate.v1",
              "folds":{
                  name:{
                      "first_oco_terminal_count":p["first_oco_terminal_count"],
                      "second_rearm_terminal_count":p["second_rearm_terminal_count"],
                      "combined_capacity_count":p["combined_capacity_count"],
                      "first_oco_metrics":p["first_oco_metrics"],
                      "second_rearm_metrics":p["second_rearm_metrics"],
                  }
                  for name,p in sorted(folds.items())
              },
              "associations":association_rows,
              "consistent_positive":[
                  row for row in association_rows
                  if row["status"]=="CONSISTENT_POSITIVE"
              ],
              "consistent_negative":[
                  row for row in association_rows
                  if row["status"]=="CONSISTENT_NEGATIVE"
              ],
              "policy_promoted":False,
              "opens_new_holdout":False,
          }
          Path("result/oco-rearm-aggregate.json").write_text(
              json.dumps(report,sort_keys=True,indent=2)+"\n"
          )
          print(json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-oco-rearm-aggregate-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
