name: QORE CIBO Phase22 Next Exam Source Collectors Quality

on:
  push:
    branches:
      - agent/cibo-next-policy-sovereign-integration-001
    paths:
      - 'src/qore/infrastructure/cibo_phase22_next_exam_m5_source.py'
      - 'src/qore/infrastructure/cibo_phase22_next_exam_m1_source.py'
      - 'tests/infrastructure/test_cibo_phase22_next_exam_m5_source.py'
      - 'tests/infrastructure/test_cibo_phase22_next_exam_m1_source.py'
      - '.github/workflows/cibo-phase22-next-exam-source-collectors-quality.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,ctrader]'
      - name: Static quality
        run: |
          python -m ruff check \
            src/qore/infrastructure/cibo_phase22_next_exam_m5_source.py \
            src/qore/infrastructure/cibo_phase22_next_exam_m1_source.py \
            tests/infrastructure/test_cibo_phase22_next_exam_m5_source.py \
            tests/infrastructure/test_cibo_phase22_next_exam_m1_source.py
      - name: Unit quality
        run: |
          python -m pytest -q \
            tests/infrastructure/test_cibo_phase22_next_exam_m5_source.py \
            tests/infrastructure/test_cibo_phase22_next_exam_m1_source.py \
            tests/infrastructure/test_cibo_phase22_next_exam_source_availability.py
