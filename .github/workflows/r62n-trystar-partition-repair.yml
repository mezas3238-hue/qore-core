name: Apply bounded R62N TryStar subgroup partition repair

on:
  push:
    branches: [agent/qore-umi14-umi12-final-owner-recert-001]
    paths: [.github/workflows/r62n-trystar-partition-repair.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qore-umi14-umi12-final-owner-recert-001
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Verify exact semantic base and staging-only delta
        run: |
          test "$(git rev-parse HEAD^)" = "4e8247487a7b49e20dbf2bf5ffe059e7d69e12a5"
          git merge-base --is-ancestor 903c0e2e221f51df705873f90ff9ec18d58101fe HEAD
          test "$(git rev-parse 903c0e2e221f51df705873f90ff9ec18d58101fe:tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py)" = "95d4ffbf9479310e7a5bfd2ad5652ffec54c96fc"
          test "$(git rev-parse HEAD:tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py)" = "95d4ffbf9479310e7a5bfd2ad5652ffec54c96fc"
          python - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/r62n-trystar-failed-star-repair.yml',
              '.github/workflows/r62n-trystar-partition-repair.yml',
              '.github/scripts/r62n_trystar_partition_patch.py',
          }
          changed = set(subprocess.check_output([
              'git', 'diff', '--name-only',
              '903c0e2e221f51df705873f90ff9ec18d58101fe..HEAD',
          ], text=True).splitlines())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'unexpected pre-repair semantic delta: {sorted(unexpected)}')
          print('staging-only delta verified:', sorted(changed))
          PY
      - name: Install canonical development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Apply TryStar subgroup partition and exact successor repair
        run: python .github/scripts/r62n_trystar_partition_patch.py
      - name: Focused validation
        run: |
          python -m py_compile tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
          ruff check tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
          mypy tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
          pytest -q tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
      - name: Full canonical quality gate
        run: |
          ruff check .
          mypy src tests
          pytest --cov=src/qore --cov-report=term-missing
      - name: Commit validated repair and remove staging
        run: |
          git config user.name "qore-integration-authority"
          git config user.email "qore-integration-authority@users.noreply.github.com"
          git add tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
          git rm .github/scripts/r62n_trystar_partition_patch.py
          git rm .github/workflows/r62n-trystar-partition-repair.yml
          git diff --cached --check
          git commit -m "Partition R62N TryStar failed-star exception groups"
          git push origin HEAD:agent/qore-umi14-umi12-final-owner-recert-001
