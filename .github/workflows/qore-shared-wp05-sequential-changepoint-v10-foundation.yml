name: QORE Shared WP05 Sequential ChangePoint V10 Foundation

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - docs/shared/QORE_SHARED_WP05_V10_CAUSAL_SEQUENTIAL_CHANGEPOINT_PREREGISTRATION.md
      - src/qore/infrastructure/core_stack_v2/temporal_hierarchy_sequential_changepoint_v10.py
      - tests/infrastructure/test_core_stack_v2_temporal_hierarchy_sequential_changepoint_v10.py
      - tests/infrastructure/test_shared_wp05_sequential_changepoint_v10_protocol.py
      - scripts/shared_wp05_sequential_changepoint_v10.py
      - .github/workflows/qore-shared-wp05-sequential-changepoint-v10-foundation.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  sequential-changepoint-v10-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Announce WP05 V10 foundation validation
        run: |
          gh issue comment 643 --body "WP-05 V10 foundation validation started — Git SHA \`${GITHUB_SHA}\`, run \`${GITHUB_RUN_ID}\`. Causal 0/3/5/10/15m early-warning architecture only; no R8/R6/R5 scientific execution and fresh holdout remains CLOSED."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Shared
        run: pip install -e ".[dev]"

      - name: Static and adversarial validation
        run: |
          ruff check             src/qore/infrastructure/core_stack_v2/temporal_hierarchy_sequential_changepoint_v10.py             tests/infrastructure/test_core_stack_v2_temporal_hierarchy_sequential_changepoint_v10.py             tests/infrastructure/test_shared_wp05_sequential_changepoint_v10_protocol.py             scripts/shared_wp05_sequential_changepoint_v10.py
          mypy src/qore/infrastructure/core_stack_v2/temporal_hierarchy_sequential_changepoint_v10.py
          python -m py_compile             src/qore/infrastructure/core_stack_v2/temporal_hierarchy_sequential_changepoint_v10.py             scripts/shared_wp05_sequential_changepoint_v10.py
          pytest -q             tests/infrastructure/test_core_stack_v2_temporal_hierarchy_sequential_changepoint_v10.py             tests/infrastructure/test_shared_wp05_sequential_changepoint_v10_protocol.py             tests/infrastructure/test_core_stack_v2_temporal_hierarchy_target_contract.py             tests/infrastructure/test_shared_wp05_structural_failure_target_v2.py

      - name: Report WP05 V10 foundation GREEN
        if: success()
        run: |
          gh issue comment 643 --body "WP-05 V10 foundation GREEN — Git SHA \`${GITHUB_SHA}\`, run \`${GITHUB_RUN_ID}\`. Causal checkpoint isolation, sequential abstention, R8-only freeze protocol, source-vs-sequential diagnostic, deterministic fingerprints, mypy and no-authority invariants passed. Scientific consumed execution has not started; fresh holdout remains CLOSED."

      - name: Report WP05 V10 foundation failure
        if: failure()
        run: |
          gh issue comment 643 --body "WP-05 V10 foundation FAILED technically — Git SHA \`${GITHUB_SHA}\`, run \`${GITHUB_RUN_ID}\`. Do not execute V9 consumed evidence or alter preregistered gates until repaired. Fresh holdout remains CLOSED."
