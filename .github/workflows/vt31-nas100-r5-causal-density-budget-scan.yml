name: QORE VT31 NAS100 R5 Causal Density Budget Scan

on:
  push:
    branches:
      - agent/vt31-nas100-intelligence-pilot-001
    paths:
      - scripts/vt31_nas100_r5_causal_density_budget_scan.py
      - .github/workflows/vt31-nas100-r5-causal-density-budget-scan.yml
  workflow_dispatch:

concurrency:
  group: vt31-nas100-r5-causal-density-budget-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  r5:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Static gate
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_r5_causal_density_budget_scan.py
          ruff check scripts/vt31_nas100_r5_causal_density_budget_scan.py

      - name: Recover immutable R5 evidence
        run: |
          set -euo pipefail
          mkdir -p evidence result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10380044761/zip" > evidence.zip
          unzip -q evidence.zip -d evidence
          path="evidence/fresh/NAS100/market-evidence.json"
          test -f "$path"
          actual="$(sha256sum "$path" | awk '{print $1}')"
          test "$actual" = "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"

      - name: Run focused budget scan
        run: |
          set -euo pipefail
          python scripts/vt31_nas100_r5_causal_density_budget_scan.py             evidence/fresh/NAS100/market-evidence.json             --output result/r5-budget-scan.json             | tee result/summary.json

      - name: Governance gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(Path("result/r5-budget-scan.json").read_text())
          g=p["governance"]
          assert g["date_level_core_nontrade_oracle_used"] is False
          assert g["wait_release_is_clock_and_core_state_causal"] is True
          assert g["secondary_fill_before_authorization_allowed"] is False
          assert g["scout_fill_before_authorization_allowed"] is False
          assert g["post_outcome_field_used_for_entry"] is False
          assert g["opens_new_holdout"] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-r5-budget-scan-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
