name: QORE Turtle Soup XAUUSD R15 CIBO First Market Brain

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-xauusd-r3-forensics-001
    paths:
      - '.github/workflows/turtle-soup-xauusd-r15-cibo-first-market-brain.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r15_cibo_first_market_brain.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r15_cibo_first_market_brain.py'

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-XAUUSD-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-XAUUSD-2f510461b3360e91d5ee70a72716a76cd6561f16'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check --ignore E501,I001 \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r15_cibo_first_market_brain.py \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r15_cibo_first_market_brain.py
      - name: Mypy focused gate
        run: |
          mypy --disable-error-code attr-defined \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r15_cibo_first_market_brain.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r15_cibo_first_market_brain.py

  replay-2y:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable consumed XAUUSD M5 corpus
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download immutable consumed XAUUSD Target Destination V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Run CIBO-first autonomous 2Y replay
        run: |
          mkdir -p r15-output
          python -m qore.infrastructure.trader_lab.turtle_soup_xauusd_r15_cibo_first_market_brain \
            source-xauusd target-xauusd r15-output > r15-output/stdout.json
          printf '%s\n' "$GITHUB_SHA" > r15-output/git-sha.txt
      - name: Enforce brain architecture and governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('r15-output/r15-market-brain-report.json').read_text())
          assert p['identity']=='TURTLE_SOUP_XAUUSD_R15_CIBO_FIRST_MARKET_BRAIN_V1'
          assert p['window']['open']=='2024-09-17T00:00:00+00:00'
          assert p['window']['close']=='2026-09-17T00:00:00+00:00'
          assert p['reproduction']['retained_bars']==707716
          b=p['brain_contract']
          assert b['r3_pnl_router_used'] is False
          assert b['market_context_before_entry'] is True
          assert b['r11_assessed_before_execution'] is True
          assert b['known_invalid_respected'] is True
          assert b['conflicted_respected'] is True
          assert b['protected_swing_is_structural_stop'] is True
          assert b['fixed_r_target_used'] is False
          assert b['active_cibo_dol_ladder_used'] is True
          assert b['pnl_score_used'] is False
          assert b['probability_of_profit_used'] is False
          assert b['year_as_trade_feature'] is False
          assert b['post_entry_information_used_for_decision'] is False
          assert p['behavior']['executed_trades'] > 0
          assert p['governance']['fresh_holdout_consumed'] is False
          assert p['governance']['no_rule_promoted'] is True
          assert p['governance']['live_authorized'] is False
          assert p['governance']['real_capital_authorized'] is False
          PY
      - name: Hash immutable R15 result
        run: |
          cd r15-output
          sha256sum r15-market-brain-report.json r15-market-brain-trades.json r15-market-brain-decisions.json stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-xauusd-r15-cibo-first-market-brain-${{ github.sha }}
          path: r15-output
          if-no-files-found: error
          retention-days: 90
