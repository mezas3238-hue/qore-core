name: QORE Scalper A2 Audit14 First-Online Gross Replay NineMarket

on:
  push:
    branches:
      - agent/scalper-architect-b-methodology-20261010
    paths:
      - '.github/workflows/qore-scalper-a2-fourteenth-causal-first-gross-replay.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_a2_fourteenth_causal_first_economics_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_scalper_a2_fourteenth_causal_first_economics_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: scalper-a2-fourteenth-replay-${{ github.ref }}
  cancel-in-progress: true

env:
  CONTROL_RUN: '38053946695'
  CONTROL_SHA: 'e356e7a52541e99533b25ecfef0ab9c4e9ce03c0'
  ONLINE_RUN: '38099916845'
  ONLINE_SHA: '82e5adc9656bc28b70724fc44695d0fd642651ab'
  NATIVE_RUN: '35548099334'
  NATIVE_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: No new execution authority, strict types and replay contracts
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_scalper_a2_fourteenth_causal_first_economics_v1.py tests/infrastructure/trader_lab/test_capitalizer_scalper_a2_fourteenth_causal_first_economics_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_scalper_a2_fourteenth_causal_first_economics_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_scalper_a2_fourteenth_causal_first_economics_v1.py

  market:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol: [USDJPY, AUDJPY, AUDUSD, GBPJPY, EURUSD, GBPUSD, XAUUSD, USDCAD, NAS100]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: scalper-a2-v49-control-${{ matrix.symbol }}-${{ env.CONTROL_SHA }}
          path: frozen
          github-token: ${{ github.token }}
          run-id: ${{ env.CONTROL_RUN }}
      - uses: actions/download-artifact@v4
        with:
          name: scalper-a2-audit13-stream-${{ matrix.symbol }}-${{ env.ONLINE_SHA }}
          path: online
          github-token: ${{ github.token }}
          run-id: ${{ env.ONLINE_RUN }}
      - uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.NATIVE_SHA }}
          path: native
          github-token: ${{ github.token }}
          run-id: ${{ env.NATIVE_RUN }}
      - name: Provider OHLC is genuine but has no synchronized physical BID/ASK
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          m=json.loads(Path("native/m1-clone-manifest.json").read_text())
          assert m["canonical_symbol"]==os.environ["SYMBOL"]
          assert m["provider_native_m1"] and not m["synthetic_m1"]
          assert not m["interpolated_m1"] and m["contradictory_m1"]==0
          assert m["read_only"]
          PY
      - name: Replay all source IDs with first online close, M15 stop, as-of H1 target, STOP-FIRST and session exit
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_a2_fourteenth_causal_first_economics_v1 market frozen online native market-output
      - name: Copy exact frozen V49 original economics for nine-market MAX3 control
        run: |
          python - <<'PY'
          from pathlib import Path
          from shutil import copyfile
          found=tuple(Path("frozen").rglob("capitalizer-*-v49-development-economics-trades.jsonl"))
          assert len(found)==1
          copyfile(found[0],Path("market-output")/found[0].name)
          PY
      - name: Prohibit real cost claims and other markets
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads(Path("market-output/scalper-audit14-market.json").read_text())
          assert x["symbol"]==os.environ["SYMBOL"]
          assert x["sources"]==x["original_economics_reconciled"]
          assert x["physical_bid_ask_available"] is False
          assert x["real_broker_costs_applied"] is False
          assert x["new_trade_authority"] is False
          print("AUDIT14 GROSS CAUSAL FIRST MARKET",x)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-audit14-gross-${{ matrix.symbol }}-${{ github.sha }}
          path: market-output/
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: scalper-a2-audit14-gross-*-${{ github.sha }}
          path: frozen-nine-market-results
      - run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_a2_fourteenth_causal_first_economics_v1 matrix frozen-nine-market-results nine-market-output
      - name: Original 2876 IDs, original 2020 MAX3 and 0 physical broker cost claim
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("nine-market-output/scalper-audit14-nine-market.json").read_text())
          assert x["markets"]==9 and x["sources"]==2876
          assert x["frozen_381"]==381 and x["online_different"]==1090
          assert x["baseline_v49_max3"]==2020
          assert x["costs_bid_ask_present"] is False
          assert x["trader_certifiable"] is False
          print("AUDIT14 FULL GROSS SOURCE ANCHORED 9MARKET",x)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-audit14-gross-nine-market-${{ github.sha }}
          path: nine-market-output/
          retention-days: 90
          if-no-files-found: error
