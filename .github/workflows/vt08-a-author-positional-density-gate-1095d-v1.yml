name: VT08 A Author Positional Density Gate 1095D V1

on:
  push:
    branches:
      - agent/vt08-5m-methodology-source-20261010
    paths:
      - .github/workflows/vt08-a-author-positional-density-gate-1095d-v1.yml
      - src/qore/infrastructure/trader_lab/vt08_5m_a_positional_density_gate_audit_v1.py
      - tests/infrastructure/trader_lab/test_vt08_5m_a_positional_density_gate_audit_v1.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  positional-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        symbol: [EURJPY, USDCHF, NZDUSD, CADJPY, USDCAD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Ruff and positional as-of anti-lookahead contract tests
        run: |
          ruff check src/qore/infrastructure/trader_lab/vt08_5m_a_positional_density_gate_audit_v1.py tests/infrastructure/trader_lab/test_vt08_5m_a_positional_density_gate_audit_v1.py
          pytest -q tests/infrastructure/trader_lab/test_vt08_5m_a_positional_density_gate_audit_v1.py
      - uses: actions/download-artifact@v4
        with:
          name: qore-vt08-cognitive-5m-fresh-${{ matrix.symbol }}-b2d33e1b4829d8b4afc76983decca8a99131403c
          path: evidence/${{ matrix.symbol }}
          github-token: ${{ github.token }}
          run-id: 35934924907
      - name: Reconstruct 1095D genuine source positional density upper bound
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from qore.infrastructure.trader_lab.vt08_5m_a_positional_density_gate_audit_v1 import evaluate
          sym=os.environ["SYMBOL"]
          output=evaluate(Path(f"evidence/{sym}/market-evidence-1095d.json"))
          Path(f"artifacts/{sym}-positional-full.json").write_text(
              json.dumps(output,sort_keys=True,separators=(",",":")),encoding="utf-8"
          )
          summary={k:output[k] for k in (
              "schema","market","stage_counts","yearly_stage_counts",
              "mechanical_upper_bound_only",
              "poi_high_low_opposing_candle_not_fully_adjudicated",
              "cognitive_ready","orders","fills","pnl_evaluated",
              "sealed_7y_accessed"
          )}
          Path(f"artifacts/{sym}-positional-summary.json").write_text(
              json.dumps(summary,sort_keys=True,indent=2),encoding="utf-8"
          )
          print(json.dumps(summary,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vt08-a-positional-gate-${{ matrix.symbol }}-${{ github.sha }}
          path: artifacts/*
          retention-days: 30
          if-no-files-found: error
