name: Scalper A1 Audit14 Outcome-Blind Native Nine-Market

on:
  push:
    branches:
      - agent/scalper-successor-a1-online-handoff-20261010
    paths:
      - '.github/workflows/qore-scalper-a1-successor-audit14-native-nine-market.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_a1_audit14_online_predecision_bridge_v1.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_a1_audit14_online_native_ledger_runner_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CONTROL_RUN: '38053946695'
  CONTROL_SHA: 'e356e7a52541e99533b25ecfef0ab9c4e9ce03c0'
  AUDIT14_RUN: '38102352779'
  AUDIT14_SHA: 'b4d35fe99b99a96dac3728610258fe5a4ab20c15'

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff and Mypy on history-facing A1 boundary
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_a1_audit14_online_predecision_bridge_v1.py src/qore/infrastructure/trader_lab/capitalizer_a1_audit14_online_native_ledger_runner_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_a1_audit14_online_predecision_bridge_v1.py src/qore/infrastructure/trader_lab/capitalizer_a1_audit14_online_native_ledger_runner_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_a1_audit14_online_predecision_bridge_v1.py

  market:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol: [USDJPY, AUDJPY, AUDUSD, GBPJPY, EURUSD, GBPUSD, XAUUSD, USDCAD, NAS100]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: scalper-a2-v49-control-${{ matrix.symbol }}-${{ env.CONTROL_SHA }}
          path: frozen
          github-token: ${{ github.token }}
          run-id: ${{ env.CONTROL_RUN }}
      - uses: actions/download-artifact@v4
        with:
          name: scalper-a2-audit14-gross-${{ matrix.symbol }}-${{ env.AUDIT14_SHA }}
          path: audit14
          github-token: ${{ github.token }}
          run-id: ${{ env.AUDIT14_RUN }}
      - name: Project raw Audit14 into pre-decision-only witnesses
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_a1_audit14_online_native_ledger_runner_v1 market frozen audit14 market-result
      - name: Validate market accounting and absence of future payoff
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          m=json.loads(Path('market-result/a1-audit14-predecision-market.json').read_text())
          rows=[json.loads(x) for x in Path('market-result/a1-audit14-predecision-witnesses.jsonl').read_text().splitlines()]
          assert len(rows)==m['source_ids_reconciled'] and len(rows)>0
          assert {r['symbol'] for r in rows}=={os.environ['SYMBOL']}
          assert m['ex_post_outcomes_forwarded'] is False
          assert m['paper_trades_executed']==0 and m['master_frame_invoked'] is False
          assert all('gross_r' not in r and 'candidate_exit_reason' not in r and 'h1_state_until' not in r for r in rows)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-a1-audit14-causal-${{ matrix.symbol }}-${{ github.sha }}
          path: market-result/
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: scalper-a1-audit14-causal-*-${{ github.sha }}
          path: nine-raw
      - name: Strict 2876 ID and nine-market identity parity
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_a1_audit14_online_native_ledger_runner_v1 aggregate nine-raw nine-result
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('nine-result/a1-audit14-predecision-nine-market.json').read_text())
          assert p['markets']==9 and p['source_ids_reconciled']==2876
          assert p['first_online_changed_from_v49']==1090
          assert p['static_381_cohort']==381
          assert p['pre_max3_statuses'].get('ELIGIBLE')==2816
          assert p['winner_outcomes_or_mfe_forwarded'] is False
          assert p['master_frame_historical_run'] is False
          assert p['scalper_certified'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-a1-audit14-causal-nine-market-${{ github.sha }}
          path: nine-result/
          retention-days: 90
          if-no-files-found: error
