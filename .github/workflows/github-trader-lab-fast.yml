name: QORE GitHub Trader Lab Fast

on:
  push:
    branches:
      - agent/github-trader-lab-001
    paths:
      - 'tools/github_trader_lab/**'
      - '.github/workflows/github-trader-lab-fast.yml'
  workflow_dispatch:
    inputs:
      profile_path:
        description: 'Trader Lab profile path'
        required: false
        type: string
      subject_ref:
        description: 'Subject Git ref'
        required: false
        type: string
  workflow_call:
    inputs:
      profile_path:
        description: 'Trader Lab profile path'
        required: false
        type: string
      subject_ref:
        description: 'Subject Git ref'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-github-trader-lab-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trader-lab-fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout independent Trader Lab
        uses: actions/checkout@v4
        with:
          ref: agent/github-trader-lab-001
          path: lab

      - name: Resolve request
        id: request
        shell: bash
        env:
          INPUT_PROFILE: ${{ inputs.profile_path || '' }}
          INPUT_SUBJECT_REF: ${{ inputs.subject_ref || '' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          lab=Path("lab").resolve()
          request=json.loads((lab/"tools/github_trader_lab/run-request.json").read_text())
          profile_path=Path(os.environ.get("INPUT_PROFILE") or request["profile_path"])
          subject_ref=os.environ.get("INPUT_SUBJECT_REF") or request["subject_ref"]
          if profile_path.is_absolute() or ".." in profile_path.parts:
              raise SystemExit("profile_path must stay in lab checkout")
          full=lab/profile_path
          profile=json.loads(full.read_text())
          if profile.get("schema") != "qore.github-trader-lab.profile.v2":
              raise SystemExit("fast Trader Lab requires profile v2")
          digest=hashlib.sha256(full.read_bytes()).hexdigest()
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as out:
              out.write(f"profile_path={profile_path.as_posix()}\n")
              out.write(f"profile_id={profile['profile_id']}\n")
              out.write(f"profile_sha={digest}\n")
              out.write(f"subject_ref={subject_ref}\n")
          print(json.dumps({
              "profile_id": profile["profile_id"],
              "subject": profile["subject"],
              "subject_ref": subject_ref,
              "profile_sha": digest
          }, sort_keys=True))
          PY

      - name: Checkout subject
        uses: actions/checkout@v4
        with:
          repository: mezas3238-hue/qore-core
          ref: ${{ steps.request.outputs.subject_ref }}
          path: subject

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fingerprint prepared-ledger dependencies
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          raw="$(python lab/tools/github_trader_lab/fingerprint.py \
            --profile "lab/${{ steps.request.outputs.profile_path }}" \
            --subject-root subject \
            --lab-root lab)"
          echo "$raw"
          fp="$(printf '%s\n' "$raw" | sed -n 's/^fingerprint=//p')"
          legacy_fp="$(printf '%s\n' "$raw" | sed -n 's/^legacy_fingerprint=//p')"
          evidence_fp="$(printf '%s\n' "$raw" | sed -n 's/^evidence_fingerprint=//p')"
          count="$(printf '%s\n' "$raw" | sed -n 's/^file_count=//p')"
          test -n "$fp"
          test -n "$legacy_fp"
          test -n "$evidence_fp"
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"
          echo "legacy_fingerprint=$legacy_fp" >> "$GITHUB_OUTPUT"
          echo "evidence_fingerprint=$evidence_fp" >> "$GITHUB_OUTPUT"
          echo "file_count=$count" >> "$GITHUB_OUTPUT"

      - name: Restore immutable evidence cache
        uses: actions/cache@v4
        with:
          path: .qore-cache/github-trader-lab/evidence
          key: qore-github-trader-lab-evidence-v3-${{ steps.prep.outputs.evidence_fingerprint }}
          restore-keys: |
            qore-github-trader-lab-evidence-v2-${{ steps.request.outputs.profile_sha }}

      - name: Recover and verify evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python lab/tools/github_trader_lab/evidence.py \
            --profile "lab/${{ steps.request.outputs.profile_path }}" \
            --output-dir ".qore-cache/github-trader-lab/evidence"

      - name: Restore prepared causal ledger
        id: prepared-cache
        uses: actions/cache@v4
        with:
          path: .qore-cache/github-trader-lab/prepared
          key: qore-github-trader-lab-prepared-v2-${{ steps.prep.outputs.fingerprint }}
          restore-keys: |
            qore-github-trader-lab-prepared-v1-${{ steps.prep.outputs.legacy_fingerprint }}

      - name: Restore scientific Monte Carlo cache
        id: science-cache
        uses: actions/cache@v4
        with:
          path: .qore-cache/github-trader-lab/science-mc
          key: qore-github-trader-lab-science-mc-v1-${{ github.sha }}
          restore-keys: |
            qore-github-trader-lab-science-mc-v1-


      - name: Migrate legacy prepared ledger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          profile=json.loads(
              Path("lab/${{ steps.request.outputs.profile_path }}").read_text()
          )
          root=Path(".qore-cache/github-trader-lab/prepared")
          root.mkdir(parents=True, exist_ok=True)
          for lane in profile["lanes"]:
              target=root/f"{lane}.json"
              if target.is_file():
                  continue
              matches=[
                  path for path in root.glob(f"*/{lane}.json")
                  if path.is_file()
              ]
              if len(matches) == 1:
                  shutil.copy2(matches[0], target)
                  print(
                      f"QORE_TRADER_LAB_CACHE_MIGRATION "
                      f"lane={lane} source={matches[0]} target={target}"
                  )
          PY

      - name: Enforce single automatic Trader Lab path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root=Path("subject/.github/workflows")
          allowed={"cibo-trader-lab-fast-bridge.yml"}
          offenders=[]
          for path in sorted(root.glob("cibo-trader-lab-*.yml")):
              if path.name in allowed:
                  continue
              lines=path.read_text(encoding="utf-8").splitlines()
              try:
                  on_index=lines.index("on:")
              except ValueError:
                  continue
              for line in lines[on_index+1:]:
                  if line and not line.startswith(" ") and not line.startswith("#"):
                      break
                  if line.startswith("  push:"):
                      offenders.append(path.as_posix())
                      break
          if offenders:
              raise SystemExit(
                  "automatic specialized Trader Lab workflows are forbidden; "
                  "use QORE GitHub Trader Lab Fast: " + ", ".join(offenders)
              )
          print("QORE_TRADER_LAB_ARCHITECTURE_GUARD=PASS")
          PY

      - name: Static preflight
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            lab/tools/github_trader_lab/realtime.py \
            lab/tools/github_trader_lab/science.py \
            lab/tools/github_trader_lab/certification.py \
            lab/tools/github_trader_lab/loss_compression.py \
            lab/tools/github_trader_lab/fingerprint.py \
            lab/tools/github_trader_lab/fast_runner.py \
            lab/tools/github_trader_lab/adapters/vt31_comp003_prepare.py \
            lab/tools/github_trader_lab/adapters/vt31_comp006_fast.py \
            lab/tools/github_trader_lab/adapters/cibo_three_mode_suite_prepare.py \
            lab/tools/github_trader_lab/adapters/cibo_three_mode_suite_fast.py
          echo "prepared_cache_hit=${{ steps.prepared-cache.outputs.cache-hit }}"
          echo "prepared_dependency_files=${{ steps.prep.outputs.file_count }}"

      - name: Execute hot replay and full scientific battery
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/subject/src:${{ github.workspace }}/subject/scripts:${{ github.workspace }}/lab/tools/github_trader_lab
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/github-trader-lab-fast"
          prepared=".qore-cache/github-trader-lab/prepared"
          mkdir -p "$out" "$prepared"
          python lab/tools/github_trader_lab/fast_runner.py \
            --profile "lab/${{ steps.request.outputs.profile_path }}" \
            --lab-root "${{ github.workspace }}/lab" \
            --subject-root "${{ github.workspace }}/subject" \
            --evidence-dir "${{ github.workspace }}/.qore-cache/github-trader-lab/evidence" \
            --prepared-dir "${{ github.workspace }}/$prepared" \
            --science-cache-dir "${{ github.workspace }}/.qore-cache/github-trader-lab/science-mc" \
            --output-dir "$out" \
            | tee "$out/console.log"

      - name: Publish performance and science headline
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/github-trader-lab-fast"
          if test -f "$out/headline.json"; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          h=json.loads((Path(os.environ["RUNNER_TEMP"])/"github-trader-lab-fast"/"headline.json").read_text())
          print("# QORE GitHub Trader Lab — Fast")
          print()
          print(f"- Hot compute: {h['hot_compute_seconds']} s")
          print(f"- Replay/filter stage: {h['experiment_replay_seconds']} s")
          print(f"- Loss compression report: {h.get('loss_compression_seconds', 0)} s")
          print(f"- Full scientific battery: {h['scientific_battery_seconds']} s")
          print(f"- Certification readiness: {h['certification_readiness_seconds']} s")
          print(f"- Runner internal total: {h['runner_total_seconds']} s")
          print(f"- Development survivors: {h['development_survivors']}")
          print(f"- ≤6R survivors: {h['hard_dd_survivors']}")
          print(f"- Scientific passes: {h['scientific_passes']}")
          print(f"- Monte Carlo cache: {h.get('monte_carlo_cache', {})}")
          print(f"- Walk-forward OOS present: {h['walk_forward_oos_present']}")
          print(f"- Fresh OOS present: {h['fresh_oos_present']}")
          print()
          print("## Certification readiness")
          for name, status in h["certification_readiness"].items():
              metrics=h["primary_risk_adjusted"][name]
              print(
                  f"- {name}: {status}; "
                  f"Sharpe={metrics['sharpe']}; "
                  f"Sortino={metrics['sortino']}; "
                  f"Recovery={metrics['recovery_factor']}; "
                  f"CVaR5={metrics['cvar_05_r']}R"
              )
          loss_path=Path(os.environ["RUNNER_TEMP"])/"github-trader-lab-fast"/"loss-compression-report.json"
          if loss_path.is_file():
              loss=json.loads(loss_path.read_text())
              print()
              print("## CIBO DD + Gross Loss Compression")
              print()
              print("| Variant | Verdict | Capital | Prod. retention | DD | ΔDD pp | Gross loss | Gross loss saved | PF |")
              print("|---|---|---:|---:|---:|---:|---:|---:|---:|")
              for name,row in loss["variants"].items():
                  retention=row["production_retention_fraction"]
                  retention_text="n/a" if retention is None else f"{float(retention)*100:.2f}%"
                  saved=row["gross_loss_saved_vs_control_usd"]
                  print(
                      f"| {name} | {row['verdict']} | "
                      f"${float(row['ending_capital_usd']):,.2f} | "
                      f"{retention_text} | "
                      f"{float(row['max_drawdown_fraction'])*100:.2f}% | "
                      f"{float(row['drawdown_reduction_percentage_points']):.2f} | "
                      f"${float(row['gross_loss_usd']):,.2f} | "
                      f"${float(saved):,.2f} | "
                      f"{row['profit_factor']} |"
                  )
              print()
              print(f"- Strict wins: {loss['summary']['strict_wins']}")
              print(f"- Pareto frontier: {loss['summary']['pareto_frontier']}")
              print(f"- Best DD: {loss['summary']['best_drawdown']}")
              print(f"- Best gross loss: {loss['summary']['best_gross_loss']}")
              print(f"- Target DD survivors: {loss['summary']['target_drawdown_survivors']}")
          print()
          print("- Fresh holdout opened by Trader Lab: false")
          print("- Certification claimed: false")
          PY
          fi

      - name: Upload laboratory record
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-github-trader-lab-fast-${{ steps.request.outputs.profile_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/github-trader-lab-fast
          if-no-files-found: error
          retention-days: 90
