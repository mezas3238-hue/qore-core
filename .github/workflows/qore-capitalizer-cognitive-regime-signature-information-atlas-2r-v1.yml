name: QORE Capitalizer Cognitive Regime Signature Information Atlas 2R V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-cognitive-regime-signature-information-atlas-2r-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_cognitive_regime_signature_information_atlas_2r_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_cognitive_regime_signature_information_atlas_2r_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-cognitive-regime-signature-information-atlas-2r-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  REBASE_RUN_ID: '36078677895'
  REBASE_SHA: 'cfc04849c8bbfd6565310d89456f5e367ea880f7'
  REGIME_RUN_ID: '36084861252'
  REGIME_SHA: 'd1dae0c77512b49ba8817a3ba896ec73801e30da'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_cognitive_regime_signature_information_atlas_2r_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_cognitive_regime_signature_information_atlas_2r_v1.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_cognitive_regime_signature_information_atlas_2r_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_cognitive_regime_signature_information_atlas_2r_v1.py

  atlas:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download true-2R cognitive rebase
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cognitive-economic-rebase-2r-v1-${{ env.REBASE_SHA }}
          path: rebase-input
          github-token: ${{ github.token }}
          run-id: ${{ env.REBASE_RUN_ID }}
      - name: Download regime evidence binding
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cognitive-regime-evidence-binding-audit-2r-v1-${{ env.REGIME_SHA }}
          path: regime-input
          github-token: ${{ github.token }}
          run-id: ${{ env.REGIME_RUN_ID }}
      - name: Build regime signature information atlas
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cognitive_regime_signature_information_atlas_2r_v1 \
            rebase-input regime-input signature-output
      - name: Enforce regime signature controls
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          report = json.loads(
              Path(
                  "signature-output/"
                  "capitalizer-cognitive-regime-signature-information-atlas-2r-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_COGNITIVE_REGIME_SIGNATURE_INFORMATION_ATLAS_2R_V1"
          )
          assert report["source_rebase_run_id"] == 36078677895
          assert report["source_regime_binding_run_id"] == 36084861252
          assert report["target_r"] == "2.00"
          assert report["control_trades"] == 948
          assert report["control_metrics"]["stops"] == 275
          assert Decimal(report["control_metrics"]["max_drawdown_r"]) == Decimal(
              "12.93584837435268644582248142"
          )
          assert report["regime_evidence_bound_trades"] == 789
          assert report["regime_evidence_unbound_trades"] == 159
          assert report["unbound_reason_counts"] == {
              "NO_M5_CLOSEBACK_TOKEN": 108,
              "TOKEN_WITHOUT_EXACT_CONTEXT_MATCH": 51,
          }
          assert report["signature_cell_count"] == 12
          assert report["minimum_descriptive_support"] == 20
          assert report["supported_signature_cell_count"] == 8
          assert report["signature_membership_known_by_entry"] is True
          assert report["numeric_microstructure_thresholds_added"] is False
          assert report["regime_family_id_selected"] is False
          assert report["regime_intelligence_supported"] is False
          assert report["current_outcome_used_to_define_signature"] is False
          assert report["current_outcome_used_for_post_signature_metrics"] is True
          assert report["automatic_signature_selection"] is False
          assert report["runtime_rule_selected"] is False
          assert report["rebase_control_reproduced"] is True
          assert report["regime_binding_control_reproduced"] is True
          assert report["strategy_rules_changed"] is False
          assert report["cognitive_rules_changed"] is False
          assert report["entry_changed"] is False
          assert report["stop_changed"] is False
          assert report["target_changed"] is False
          assert report["max3_changed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-cognitive-regime-signature-information-atlas-2r-v1-${{ github.sha }}
          path: signature-output
          if-no-files-found: error
          retention-days: 90
