name: QORE Capitalizer Source Strategy Isolation V47 S1

on:
  push:
    branches:
      - agent/capitalizer-source-strategy-isolation-v47-s1-001
    paths:
      - '.github/workflows/qore-capitalizer-source-strategy-isolation-v47-s1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_source_strategy_isolation_v47_s1.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_canonical_source_candidate_assembly_v47_s0.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_canonical_source_context_binders_v47_s0.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_canonical_structural_targets_v47_s0.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_canonical_historical_replay_adapter_v46.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_source_strategy_isolation_v47_s1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-source-strategy-isolation-v47-s1-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
  QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,ctrader]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_source_strategy_isolation_v47_s1.py \
            tests/infrastructure/trader_lab/test_capitalizer_source_strategy_isolation_v47_s1.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_source_strategy_isolation_v47_s1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_source_strategy_isolation_v47_s1.py

  s1a_market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - {symbol: USDJPY, session: ASIA}
          - {symbol: AUDJPY, session: ASIA}
          - {symbol: AUDUSD, session: ASIA}
          - {symbol: GBPJPY, session: ASIA}
          - {symbol: EURUSD, session: LONDON}
          - {symbol: GBPUSD, session: LONDON}
          - {symbol: XAUUSD, session: NEW_YORK}
          - {symbol: USDCAD, session: NEW_YORK}
          - {symbol: NAS100, session: NEW_YORK}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[ctrader]'
      - name: Verify read-only cTrader inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in QORE_CTRADER_CLIENT_ID QORE_CTRADER_CLIENT_SECRET QORE_CTRADER_ACCESS_TOKEN QORE_CTRADER_REFRESH_TOKEN; do
            test -n "${!name:-}" || { echo "missing required read-only DEMO input: $name" >&2; exit 2; }
          done
      - name: Discover DEMO account when not configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            if ! [[ "$account_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "cTrader DEMO account discovery returned invalid id" >&2
              exit 3
            fi
            echo "::add-mask::$account_id"
            printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          fi
      - name: Download immutable provider-native 10Y M1
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Build S1-A canonical population and exact fills
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_source_strategy_isolation_v47_s1 \
            s1a-market m1-source \
            --symbol "${{ matrix.symbol }}" \
            --session "${{ matrix.session }}" \
            --output s1a-output
      - name: Enforce S1-A market governance
        env:
          SYMBOL: ${{ matrix.symbol }}
          SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root=Path("s1a-output")
          reports=sorted(root.glob("capitalizer-s1a-*-report.json"))
          assert len(reports) == 3
          periods=set()
          for path in reports:
              report=json.loads(path.read_text())
              periods.add(report["period"])
              assert report["identity"] == "QORE_CAPITALIZER_SOURCE_STRATEGY_ISOLATION_V47_S1"
              assert report["symbol"] == os.environ["SYMBOL"]
              assert report["session"] == os.environ["SESSION"]
              assert report["source_m1_run_id"] == 35548099334
              assert report["source_m1_sha"] == "18c338aedd5013ce65a6cb6408ffbc2e904a6217"
              assert report["full_source_window_census"] is True
              assert report["provider_native_m1"] is True
              assert report["exact_tick_fill_required"] is True
              assert report["outcome_used_for_selection"] is False
              assert report["terminal_outcome_read"] is False
              assert report["realized_r_read"] is False
              assert report["strategy_economics_calculated"] is False
              assert report["fresh_holdout_opened"] is False
              assert report["candidate_promotion_allowed"] is False
              assert report["trader_certified"] is False
          assert periods == {"reserved","validation","development"}

          for path in sorted(root.glob("capitalizer-s1a-*-fills.jsonl")):
              for line in path.read_text().splitlines():
                  if not line.strip():
                      continue
                  row=json.loads(line)
                  assert row["cognitive_gate_source"] == (
                      "EXOGENOUS_PASS_FOR_SOURCE_STRATEGY_ISOLATION"
                  )
                  assert row["provider_native_m1"] is True
                  assert row["exact_provider_tick_fill"] is True
                  assert row["official_v46_adapter_passed"] is True
                  assert row["provider_tick_count"] > 0
                  assert row["provider_request_count"] > 0
                  assert row["outcome_used_for_selection"] is False
                  assert row["terminal_outcome_read"] is False
                  assert row["realized_r_read"] is False
                  assert row["fresh_holdout_opened"] is False
                  assert row["full_trader_fidelity_claimed"] is False
                  assert row["candidate_promotion_allowed"] is False
                  assert row["trader_certified"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v47-s1a-${{ matrix.symbol }}-${{ github.sha }}
          path: s1a-output
          if-no-files-found: error
          retention-days: 90

  s1a_aggregate:
    needs: s1a_market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download all S1-A market artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v47-s1a-*-${{ github.sha }}
          path: s1a-markets
          merge-multiple: true
      - name: Apply frozen chronological MAX3
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_source_strategy_isolation_v47_s1 \
            s1a-aggregate s1a-markets \
            --output s1a-aggregate
      - name: Enforce S1-A aggregate governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(
              Path("s1a-aggregate/capitalizer-s1a-aggregate.json").read_text()
          )
          assert report["identity"] == "QORE_CAPITALIZER_SOURCE_STRATEGY_ISOLATION_V47_S1"
          assert report["predeclaration_comment_id"] == 5894199332
          assert report["semantic_amendment_a1_comment_id"] == 5894211842
          assert report["semantic_amendment_a2_comment_id"] == 5894267606
          assert report["semantic_amendment_a3_comment_id"] == 5894871975
          assert report["market_period_reports"] == 27
          assert report["market_count"] == 9
          assert report["full_source_window_census"] is True
          assert report["exact_provider_tick_fill"] is True
          assert report["cognitive_gate_source"] == (
              "EXOGENOUS_PASS_FOR_SOURCE_STRATEGY_ISOLATION"
          )
          assert report["terminal_outcome_read"] is False
          assert report["realized_r_read"] is False
          assert report["strategy_economics_calculated"] is False
          assert report["fresh_holdout_opened"] is False
          assert report["full_trader_fidelity_claimed"] is False
          assert report["candidate_promotion_allowed"] is False
          assert report["trader_certified"] is False
          assert set(report["periods"]) == {"reserved","validation","development"}
          for row in report["periods"].values():
              assert row["max3_is_ceiling_not_quota"] is True
              assert row["outcome_used_for_selection"] is False
              assert row["max3_selected_fills"] <= row["admitted_exact_fills"]
          assert report["next_phase"] == (
              "S1A_POPULATION_READY_FOR_FROZEN_GROSS_ECONOMICS"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v47-s1a-aggregate-${{ github.sha }}
          path: s1a-aggregate
          if-no-files-found: error
          retention-days: 90
