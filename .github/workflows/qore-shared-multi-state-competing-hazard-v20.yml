name: QORE Shared Multi State Competing Hazard V20

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - src/qore/infrastructure/core_stack_v2/multi_state_competing_hazard.py
      - tests/infrastructure/test_core_stack_v2_multi_state_competing_hazard.py
      - scripts/shared_multi_state_competing_hazard_v20.py
      - .github/workflows/qore-shared-multi-state-competing-hazard-v20.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  multi-state-competing-hazard-v20:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout Shared
        uses: actions/checkout@v4
        with:
          path: shared

      - name: Checkout frozen external falsification surface
        uses: actions/checkout@v4
        with:
          ref: agent/vt08-index-deep-behavior-lab-final
          path: surface

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compose autonomous Shared research surface
        run: |
          set -euo pipefail
          mkdir -p surface/src/qore/infrastructure/core_stack_v2 surface/scripts
          : > surface/src/qore/infrastructure/core_stack_v2/__init__.py
          cp shared/src/qore/infrastructure/core_stack_v2/multi_state_competing_hazard.py \
             surface/src/qore/infrastructure/core_stack_v2/multi_state_competing_hazard.py
          cp shared/tests/infrastructure/test_core_stack_v2_multi_state_competing_hazard.py \
             surface/tests/infrastructure/test_core_stack_v2_multi_state_competing_hazard.py
          for script in \
            vt08_index_shared_competing_risk_calibration_v9.py \
            vt08_index_shared_context_conditioned_competing_risk_v15.py \
            shared_autonomous_nonlinear_loss_risk_ensemble_v19.py \
            shared_multi_state_competing_hazard_v20.py
          do
            cp "shared/scripts/$script" "surface/scripts/$script"
          done

      - name: Install composite research tree
        run: |
          cd surface
          pip install -e ".[dev]"
          pip install "numpy>=2,<3" "scikit-learn>=1.5,<2"

      - name: Static and unit validation
        run: |
          set -euo pipefail
          cd surface
          ruff check \
            src/qore/infrastructure/core_stack_v2/multi_state_competing_hazard.py \
            tests/infrastructure/test_core_stack_v2_multi_state_competing_hazard.py \
            scripts/shared_multi_state_competing_hazard_v20.py
          python -m py_compile \
            src/qore/infrastructure/core_stack_v2/multi_state_competing_hazard.py \
            scripts/shared_multi_state_competing_hazard_v20.py
          mypy src/qore/infrastructure/core_stack_v2/multi_state_competing_hazard.py
          pytest -q tests/infrastructure/test_core_stack_v2_multi_state_competing_hazard.py

      - name: Download frozen consumed path ledger
        uses: actions/download-artifact@v4
        with:
          name: qore-shared-vt08-stop-target-discrimination-v6-1a534d0ae735efef4dcbc0c0be4b110ceaa80501
          path: surface/artifacts/v6
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36131607443

      - name: Run V20 multi-state competing hazard
        run: |
          set -euo pipefail
          cd surface
          mkdir -p artifacts/shared-v20
          python scripts/shared_multi_state_competing_hazard_v20.py \
            --v6-json artifacts/v6/vt08-index-shared-stop-target-discrimination-v6.json \
            --out artifacts/shared-v20/shared-multi-state-competing-hazard-v20.json \
            | tee artifacts/shared-v20/summary.json

      - name: Validate V20 governance
        run: |
          set -euo pipefail
          cd surface
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(
              Path(
                  "artifacts/shared-v20/"
                  "shared-multi-state-competing-hazard-v20.json"
              ).read_text()
          )
          assert p["identity"] == "QORE_SHARED_MULTI_STATE_COMPETING_HAZARD_V20"
          assert p["research_only"] is True
          assert p["shared_autonomous_model"] is True
          assert p["multi_state_target"] is True
          assert p["final_loss_binary_target"] is False
          assert p["first_class_contested_state"] is True
          assert p["independent_winner_veto"] is True
          assert p["consumed_evidence_only"] is True
          assert p["fresh_holdout_opened"] is False
          assert p["runtime_current_position_pnl_used"] is False
          assert p["runtime_terminal_outcome_used"] is False
          assert p["runtime_future_market_used"] is False
          assert p["runtime_symbol_identity_used"] is False
          assert p["runtime_methodology_identity_used"] is False
          assert p["runtime_calendar_identity_used"] is False
          assert p["runtime_fold_identity_used"] is False
          assert p["sizing_used"] is False
          assert p["risk_weighting_used"] is False
          assert p["runtime_actuation"] is False
          assert p["training_future_event_labels_used_offline_only"] is True
          assert p["model"]["threshold_search_used"] is False
          assert p["horizon_bars"] == 5
          assert set(p["causes"]) == {
              "NO_EVENT","TERMINAL","RECOVERY","STOP","TARGET"
          }
          expected={
              "five_year":2448,
              "recent_two_year":1017,
              "r66_consumed_failed_holdout":773,
          }
          for key,sample in expected.items():
              w=p["windows"][key]
              assert w["sample"] == sample
              assert w["observations"] > 0
              assert set(w["event_counts"]) == set(p["causes"])
              assert w["status"] in {"ADMIT_FOR_ECONOMIC_SHADOW","REJECT"}

          print(json.dumps({
              "validation_pass":p["validation_pass"],
              "feature_count":p["feature_count"],
              "windows":p["windows"],
          },sort_keys=True))
          PY

      - name: Bind result
        run: |
          cd surface/artifacts/shared-v20
          echo "$GITHUB_SHA" > shared-git-sha.txt
          echo "36131607443" > source-v6-run.txt
          echo "36141968333" > source-v15-run.txt
          echo "36146517470" > source-v19-run.txt
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-multi-state-competing-hazard-v20-${{ github.sha }}
          path: surface/artifacts/shared-v20/
          if-no-files-found: error
          retention-days: 90
