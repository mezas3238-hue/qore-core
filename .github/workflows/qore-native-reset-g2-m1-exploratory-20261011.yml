name: QORE Native RESET G2 One Native cTrader M1 Sensitivity (NO OAUTH)

on:
  push:
    branches:
      - research/qore-native-reset-fix-g2-m1-exploratory-20261011
    paths:
      - '.github/workflows/qore-native-reset-g2-m1-exploratory-20261011.yml'
      - 'src/qore/infrastructure/trader_lab/qore_native_reset_fix_g2_m1_exploratory_v1.py'
      - 'tests/infrastructure/trader_lab/test_qore_native_reset_fix_g2_m1_exploratory_v1.py'
      - 'docs/research/QORE_NATIVE_RESET_FIX_G2_M1_SINGLE_EXPLORATORY_PREREG_2026-10-11.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-native-reset-m1-exploratory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local tests, no remote cTrader SDK
        run: python -m pip install -e '.[dev]'
      - name: Verify immutable post-G1 single-sensitivity prereg and technical quality
        run: |
          test -s docs/research/QORE_NATIVE_RESET_FIX_G2_M1_SINGLE_EXPLORATORY_PREREG_2026-10-11.md
          python - <<'PY'
          from pathlib import Path
          code=Path("src/qore/infrastructure/trader_lab/qore_native_reset_fix_g2_m1_exploratory_v1.py").read_text()
          assert "PREREG_SHA = \"3d96c55b06d376b26fc9e501be9fe9d2539f59b4\"" in code
          assert "M1_ARTIFACT = 10618547852" in code
          assert "M1_WINDOWS" in code and "16 * 60 + 3" in code and "16 * 60 + 15" in code
          assert "g1.build_events" in code and "g1.stratified_means" in code
          assert "ProtoOAGet" not in code and "ctrader_open_api" not in code
          PY
          ruff check --select F,E4,E7,E9 src/qore/infrastructure/trader_lab/qore_native_reset_fix_g2_m1_exploratory_v1.py tests/infrastructure/trader_lab/test_qore_native_reset_fix_g2_m1_exploratory_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_qore_native_reset_fix_g2_m1_exploratory_v1.py tests/infrastructure/trader_lab/test_qore_native_reset_fix_g1_v1.py

  archive_native_m1_trial:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local QORE code only (no cTrader API, no OAuth)
        run: python -m pip install -e .
      - name: Reuse archived CIBO EURUSD M5 G1 source identically
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-EURUSD-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          run-id: '35166210458'
          github-token: ${{ github.token }}
          path: cibo-native-m5-g1
      - name: Reuse previously archived CIBO 10Y EURUSD M1 directly
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-EURUSD-18c338aedd5013ce65a6cb6408ffbc2e904a6217
          run-id: '35548099334'
          github-token: ${{ github.token }}
          path: cibo-native-m1-10y
      - name: One locked 16:03 to 16:15 London tail vs placebo 14:03 to 14:15
        id: analyse
        run: |
          mkdir -p g2-m1-results
          python -m qore.infrastructure.trader_lab.qore_native_reset_fix_g2_m1_exploratory_v1 cibo-native-m5-g1 cibo-native-m1-10y g2-m1-results | tee g2-execution-stdout.json
      - name: Confirm every published row is backed by native cTrader M1 and hash witnesses
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("g2-m1-results/g2-m1-report.json").read_text())
          assert j["identity"]=="QORE_NATIVE_RESET_FIX_G2_CTRADER_M1_EXPLORATORY_V1"
          assert j["prereg_sha"]=="3d96c55b06d376b26fc9e501be9fe9d2539f59b4"
          assert j["native_m1_source"]["source_artifact"]==10618547852
          assert j["native_m1_source"]["provider_native"] is True
          assert j["g1_m5_source"]["source_artifact_id"]==10475354631
          assert j["reserved_2014_2016_raw_not_opened"] is True
          assert j["no_vps_no_live_no_trader_certification"] is True
          assert j["bidask_not_required_for_gross_signal"] is True
          assert j["profit_factor_sharpe_sortino_pnl_not_estimated"] is True
          assert j["verdict"] in (
            "DEV_M1_UNDERPOWERED", "DEV_M1_GROSS_NO_SUPPORT",
            "DEV_M1_GROSS_SIGNAL_FOR_COST_AUDIT",
          )
          individual=Path("g2-m1-results/g2-m1-joint-days.jsonl")
          count=sum(1 for _ in individual.open())
          assert count==j["m1_matched_days"]
          print("RESEARCH_NATIVE_M1_ONLY",j["verdict"],"DAYS",count)
          PY
          printf '%s\n' "$GITHUB_SHA" > g2-m1-results/code-head-sha.txt
          printf '%s\n' 'PREREG_SHA=3d96c55b06d376b26fc9e501be9fe9d2539f59b4' > g2-m1-results/prereg-sha.txt
          (cd g2-m1-results && sha256sum *.json *.jsonl *.txt > OUTPUT_SHA256SUMS.txt)
      - name: Immutable evidence even if trial fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qore-native-reset-g2-m1-exploratory-${{ github.sha }}
          path: |
            g2-m1-results/
            g2-execution-stdout.json
          retention-days: 90
          if-no-files-found: warn
