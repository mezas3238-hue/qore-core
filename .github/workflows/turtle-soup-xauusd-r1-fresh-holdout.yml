name: QORE Turtle Soup XAUUSD R1 Fresh Holdout 2015-2016

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-xauusd-r1-001
    paths:
      - '.github/workflows/turtle-soup-xauusd-r1-fresh-holdout.yml'
      - 'docs/research/TURTLE-SOUP-XAUUSD-R1-FREEZE.md'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r1.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r1.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-turtle-soup-xauusd-r1-${{ github.ref }}
  cancel-in-progress: false

env:
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
  QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check --ignore E501,F401 \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r1.py \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r1.py
      - name: Mypy focused gate
        run: mypy src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r1.py
      - name: Focused XAUUSD R1 tests
        run: pytest -q --no-cov tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r1.py
      - name: Governance assertions before evidence access
        run: |
          python - <<'PY'
          from datetime import UTC, datetime
          from pathlib import Path
          from qore.infrastructure.trader_lab import turtle_soup_xauusd_r1 as r1

          freeze = Path('docs/research/TURTLE-SOUP-XAUUSD-R1-FREEZE.md').read_text()
          assert r1.IDENTITY == 'TURTLE_SOUP_XAUUSD_R1'
          assert r1.HOLDOUT_ID == 'TURTLE_SOUP_XAUUSD_R1_FRESH_2015_2016'
          assert r1.SYMBOL == 'XAUUSD'
          assert r1.ACQUISITION_OPEN == datetime(2015, 1, 1, tzinfo=UTC)
          assert r1.EVAL_OPEN == datetime(2015, 3, 1, tzinfo=UTC)
          assert r1.EVAL_CLOSE == datetime(2016, 3, 1, tzinfo=UTC)
          assert r1.PRIMARY_FRICTION_R == r1.Decimal('0.05')
          assert r1.STRESS_FRICTION_R == r1.Decimal('0.10')
          assert 'No replacement interval is authorized after any holdout evidence access.' in freeze
          assert 'prior-body alignment filter' in freeze
          assert 'FVG-required filter' in freeze
          assert 'minimum projected-R gate' in freeze
          assert 'UNRESOLVED_NO_FROZEN_C3_CONTRACT' in freeze
          assert '2015-03-01T00:00:00Z' in freeze
          assert '2016-03-01T00:00:00Z' in freeze
          PY

  preregistration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Emit immutable preregistration before evidence access
        run: |
          set -euo pipefail
          mkdir -p artifacts/preregistration
          cp docs/research/TURTLE-SOUP-XAUUSD-R1-FREEZE.md artifacts/preregistration/
          cp src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r1.py artifacts/preregistration/
          printf '%s\n' "$GITHUB_SHA" > artifacts/preregistration/git-sha.txt
          cd artifacts/preregistration
          sha256sum TURTLE-SOUP-XAUUSD-R1-FREEZE.md turtle_soup_xauusd_r1.py git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-xauusd-r1-preregistration-${{ github.sha }}
          path: artifacts/preregistration
          if-no-files-found: error
          retention-days: 90

  fresh-holdout:
    needs: [quality, preregistration]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE + cTrader runtime
        run: python -m pip install -e '.[ctrader]'
      - name: Verify frozen DEMO read-only credential inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in QORE_CTRADER_CLIENT_ID QORE_CTRADER_CLIENT_SECRET QORE_CTRADER_ACCESS_TOKEN QORE_CTRADER_REFRESH_TOKEN; do
            test -n "${!name:-}" || { echo "missing required DEMO input: $name" >&2; exit 2; }
          done
      - name: Discover DEMO account when not configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            if ! [[ "$account_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "cTrader DEMO account discovery returned an invalid id" >&2
              exit 3
            fi
            echo "::add-mask::$account_id"
            printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          fi
      - name: Mark sealed evidence access attempt
        run: |
          mkdir -p artifacts/xauusd-r1/result
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          marker = {
              'identity': 'TURTLE_SOUP_XAUUSD_R1',
              'holdout_id': 'TURTLE_SOUP_XAUUSD_R1_FRESH_2015_2016',
              'git_sha': os.environ['GITHUB_SHA'],
              'evaluation_open': '2015-03-01T00:00:00+00:00',
              'evaluation_close': '2016-03-01T00:00:00+00:00',
              'evidence_access_attempted': True,
              'replacement_interval_authorized': False,
          }
          Path('artifacts/xauusd-r1/evidence-access-marker.json').write_text(
              json.dumps(marker, indent=2, sort_keys=True) + '\n'
          )
          PY
      - name: Collect frozen one-year XAUUSD M5 holdout
        run: |
          python -m qore.infrastructure.trader_lab.turtle_soup_xauusd_r1 \
            collect artifacts/xauusd-r1/market-evidence.json
          sha256sum artifacts/xauusd-r1/market-evidence.json > artifacts/xauusd-r1/market-evidence.sha256
      - name: Execute frozen XAUUSD R1 once
        run: |
          python -m qore.infrastructure.trader_lab.turtle_soup_xauusd_r1 \
            replay artifacts/xauusd-r1/market-evidence.json artifacts/xauusd-r1/result \
            > artifacts/xauusd-r1/result/stdout.json
          printf '%s\n' "$GITHUB_SHA" > artifacts/xauusd-r1/result/git-sha.txt
      - name: Enforce result governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('artifacts/xauusd-r1/result/report.json').read_text())
          assert p['identity'] == 'TURTLE_SOUP_XAUUSD_R1'
          assert p['holdout_id'] == 'TURTLE_SOUP_XAUUSD_R1_FRESH_2015_2016'
          assert p['symbol'] == 'XAUUSD'
          assert p['evidence_status'] == 'FRESH_HOLDOUT_CONSUMED_ON_EXECUTION'
          assert p['research_outcome'] in {
              'OOS_SURVIVED_RESEARCH_GATE_NOT_CERTIFIED',
              'R1_REJECTED_FOR_PROMOTION',
          }
          assert p['automatic_certification_allowed'] is False
          assert p['demo_eligible'] is False
          assert p['live_authorized'] is False
          assert p['real_capital_authorized'] is False
          assert p['production_authorized'] is False
          assert p['canonical_trader_code'] == 'CODE_UNASSIGNED'
          c = p['candidate_contract']
          assert c['session_filter'] is None
          assert c['prior_body_filter'] is None
          assert c['fvg_filter'] is None
          assert c['equal_liquidity_filter'] is None
          assert c['minimum_projected_r'] is None
          assert c['c3_contract'] == 'UNRESOLVED_NO_FROZEN_C3_CONTRACT'
          PY
      - name: Hash immutable result
        shell: bash
        run: |
          cd artifacts/xauusd-r1/result
          sha256sum report.json trades.json stdout.json git-sha.txt > SHA256SUMS.txt
      - name: Upload immutable holdout evidence and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-xauusd-r1-holdout-${{ github.sha }}
          path: artifacts/xauusd-r1
          if-no-files-found: error
          retention-days: 90
