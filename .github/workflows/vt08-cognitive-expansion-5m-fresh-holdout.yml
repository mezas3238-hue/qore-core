name: QORE VT08 Cognitive Expansion 5M Fresh Holdout

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vt08-cognitive-expansion-5m-v1-001
    paths:
      - .github/workflows/vt08-cognitive-expansion-5m-fresh-holdout.yml

permissions:
  contents: read

jobs:
  fresh:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        symbol: [EURJPY, USDCHF, NZDUSD, CADJPY, USDCAD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cTrader runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ctrader]"
      - name: Discover authorized DEMO account
        env:
          QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID }}
          QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET }}
          QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN }}
          QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
          if ! [[ "$account_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "cTrader DEMO account discovery returned an invalid id" >&2
            exit 3
          fi
          echo "::add-mask::$account_id"
          printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
      - name: Collect 1095-day read-only evidence
        env:
          QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID }}
          QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET }}
          QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN }}
          QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN }}
          QORE_DEMO_LAB_LOOKBACK_DAYS: "1095"
          QORE_DEMO_LAB_SYMBOL: ${{ matrix.symbol }}
          QORE_SOFTWARE_SHA: ${{ github.sha }}
        run: |
          mkdir -p "artifacts/vt08-fresh-${QORE_DEMO_LAB_SYMBOL}"
          python -m qore.infrastructure.ctrader_demo_lab_long_horizon_probe >             "artifacts/vt08-fresh-${QORE_DEMO_LAB_SYMBOL}/market-evidence-1095d.json"
      - name: Validate fresh holdout boundary
        env:
          QORE_DEMO_LAB_SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          symbol = os.environ["QORE_DEMO_LAB_SYMBOL"]
          root = Path(f"artifacts/vt08-fresh-{symbol}")
          evidence = json.loads((root / "market-evidence-1095d.json").read_text())
          assert evidence["environment"] == "demo"
          assert evidence["read_only"] is True
          assert evidence["account_is_live"] is False
          assert evidence["symbol"]["symbol_name"] == symbol
          assert evidence["requested_lookback_days"] == 1095
          first = datetime.fromisoformat(evidence["periods"]["M15"][0]["opened_at"])
          boundary = datetime.fromisoformat("2024-08-25T21:00:00+00:00")
          assert first < boundary
          assert (boundary - first).days >= 300
          PY
      - name: Run frozen Core Stack fresh holdout
        env:
          QORE_DEMO_LAB_SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from qore.infrastructure.trader_lab.vt08_cognitive_core_stack_fresh_holdout_v1 import (
              evaluate_fresh_market,
          )

          symbol = os.environ["QORE_DEMO_LAB_SYMBOL"]
          root = Path(f"artifacts/vt08-fresh-{symbol}")
          report = evaluate_fresh_market(root / "market-evidence-1095d.json")
          (root / "fresh-holdout.json").write_text(
              json.dumps(report, sort_keys=True, separators=(",", ":")),
              encoding="utf-8",
          )
          print(json.dumps({
              "market": report["market"],
              "decision": report["decision"],
              "gates": report["gates"],
              "baseline": report["baseline"],
              "core_stack": report["core_stack"],
              "evidence": report["evidence"],
          }, sort_keys=True))
          PY
      - name: Upload fresh evidence and result
        uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-cognitive-5m-fresh-${{ matrix.symbol }}-${{ github.sha }}
          path: artifacts/vt08-fresh-${{ matrix.symbol }}
          if-no-files-found: error
          retention-days: 30
