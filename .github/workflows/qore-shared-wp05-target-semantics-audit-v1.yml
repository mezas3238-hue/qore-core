name: QORE Shared WP05 Target Semantics Audit V1

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - src/qore/infrastructure/core_stack_v2/temporal_hierarchy_target_contract.py
      - tests/infrastructure/test_core_stack_v2_temporal_hierarchy_target_contract.py
      - scripts/shared_wp05_target_semantics_audit_v1.py
      - .github/workflows/qore-shared-wp05-target-semantics-audit-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  target-semantics-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Announce WP05 target-semantics audit
        run: |
          gh issue comment 643 --body "WP-05 target-semantics audit started — Git SHA \`${GITHUB_SHA}\`, run \`${GITHUB_RUN_ID}\`. Audit only: current target remains unchanged; consumed R8/R6/R5 only; fresh holdout remains closed."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Shared
        run: pip install -e ".[dev]"

      - name: Static and adversarial validation
        run: |
          ruff check \
            src/qore/infrastructure/core_stack_v2/temporal_hierarchy_target_contract.py \
            tests/infrastructure/test_core_stack_v2_temporal_hierarchy_target_contract.py \
            scripts/shared_wp05_target_semantics_audit_v1.py
          python -m py_compile \
            src/qore/infrastructure/core_stack_v2/temporal_hierarchy_target_contract.py \
            scripts/shared_wp05_target_semantics_audit_v1.py
          pytest -q tests/infrastructure/test_core_stack_v2_temporal_hierarchy_target_contract.py

      - name: Recover immutable consumed R8 R6 R5 market evidence
        run: |
          set -euo pipefail
          mkdir -p input/r8 input/r6 input/r5 result

          download_artifact() {
            local artifact_id="$1"
            local output="$2"
            local tmp="${output}.tmp"
            rm -f "$tmp"
            for attempt in 1 2 3 4; do
              if gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$tmp"; then
                mv "$tmp" "$output"
                return 0
              fi
              rm -f "$tmp"
              sleep $((attempt * 30))
            done
            return 1
          }

          download_artifact 10402199719 r8.zip
          unzip -q r8.zip -d input/r8
          (cd input/r8 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

          download_artifact 10389112524 r6.zip
          unzip -q r6.zip -d input/r6
          (cd input/r6 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

          download_artifact 10380044761 r5.zip
          unzip -q r5.zip -d input/r5
          (cd input/r5 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

      - name: Run WP05 consumed target-semantics audit
        run: |
          python scripts/shared_wp05_target_semantics_audit_v1.py \
            --r8-nas input/r8/fresh/NAS100/market-evidence.json \
            --r8-sp input/r8/fresh/SP500/market-evidence.json \
            --r8-us input/r8/fresh/US30/market-evidence.json \
            --r6-nas input/r6/fresh/NAS100/market-evidence.json \
            --r6-sp input/r6/fresh/SP500/market-evidence.json \
            --r6-us input/r6/fresh/US30/market-evidence.json \
            --r5-nas input/r5/fresh/NAS100/market-evidence.json \
            --r5-sp input/r5/fresh/SP500/market-evidence.json \
            --r5-us input/r5/fresh/US30/market-evidence.json \
            --output result/wp05-target-semantics-audit-v1.json \
            | tee result/summary.json

      - name: Validate audit protocol
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/wp05-target-semantics-audit-v1.json").read_text())
          assert p["protocol_pass"] is True
          assert p["fresh_holdout_opened"] is False
          assert p["semantic_contract"]["audit_changes_target"] is False
          assert p["semantic_contract"]["audit_fits_model"] is False
          g=p["governance"]
          assert g["target_changed"] is False
          assert g["threshold_changed"] is False
          assert g["shared_methodology_authority"] is False
          assert g["shared_sizing_authority"] is False
          assert g["shared_risk_authority"] is False
          assert g["shared_order_authority"] is False
          assert g["shared_execution_authority"] is False
          assert g["live_authorized"] is False
          assert g["production_authorized"] is False
          assert g["real_capital_authorized"] is False
          assert g["merge_authorized"] is False
          PY

      - name: Bind result
        run: |
          echo "${GITHUB_SHA}" > result/git-sha.txt
          (
            cd result
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-wp05-target-semantics-audit-v1-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Report target-semantics audit
        if: always()
        run: |
          if [ ! -f result/wp05-target-semantics-audit-v1.json ]; then
            gh issue comment 643 --body "WP-05 target-semantics audit run \`${GITHUB_RUN_ID}\` did not produce a scientific payload. Target remains unchanged; fresh holdout remains closed."
            exit 0
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path("result/wp05-target-semantics-audit-v1.json").read_text())
          lines=[
              "## WP-05 target-semantics audit",
              "",
              f"- Git SHA: \`{os.environ['GITHUB_SHA']}\`",
              f"- GitHub Actions run: \`{os.environ['GITHUB_RUN_ID']}\`",
              f"- status: **{p['status']}**",
              f"- protocol_pass: **{p['protocol_pass']}**",
              f"- target_contract_pass: **{p['target_contract_pass']}**",
              "- audit changed target: **False**",
              "- fresh holdout opened: **False**",
              "",
              "Directional semantics:",
          ]
          for partition in ("r8","r6","r5"):
              e=p["evaluations"][partition]
              lines.append(
                  f"- {partition.upper()}: baseline={e['baseline_opposition_count']}; identifiable={e['directionally_identifiable_count']}; aligned={e['directionally_aligned_count']} ({e['directional_alignment_bps']} bps); inverted={e['directionally_inverted_count']} ({e['directional_inversion_bps']} bps); terminal inverted={e['terminal_inverted_count']}"
              )
          if p["target_contract_pass"]:
              lines.append("Consumed target direction is consistent with the higher-timeframe structural-failure question.")
          else:
              lines.append("Current consumed target is directionally inconsistent with the WP-05 higher-timeframe structural-failure question. Do not reinterpret prior V1-V4 results as a valid high-timeframe failure target until the target contract is repaired and preregistered.")
          Path("result/wp05-target-audit-issue-update.md").write_text("\n".join(lines)+"\n")
          PY
          gh issue comment 643 --body-file result/wp05-target-audit-issue-update.md
