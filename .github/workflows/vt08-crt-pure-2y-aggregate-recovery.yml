name: QORE VT08 CRT PURE 2Y Aggregate Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vt08-crt-pure-source-identity-001
    paths:
      - '.github/workflows/vt08-crt-pure-2y-aggregate-recovery.yml'

permissions:
  contents: read
  actions: read

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install replay runtime
        run: python -m pip install -e '.[ctrader]'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: mezas3238-hue/qore-core
          run-id: 35587579844
          pattern: qore-vt08-crt-pure-2y-*-eb0ec4ac61cac92d4147069ee15b1d1cff87af37
          path: artifacts/input
      - name: Aggregate preserved successful market replays
        shell: bash
        run: |
          mkdir -p artifacts/aggregate
          python - <<'PY'
          import json
          from pathlib import Path
          from qore.infrastructure.trader_lab.vt08_crt_pure_2y_replay import ReplayTrade, build_report
          from qore.infrastructure.traders.crt_pure_identity import CrtPureMarket

          per_market = {}
          all_trade_files = list(Path('artifacts/input').rglob('trades.jsonl'))
          assert len(all_trade_files) == 3, all_trade_files
          for market in CrtPureMarket:
              matches = [p for p in all_trade_files if market.value in str(p.parent)]
              assert len(matches) == 1, (market.value, matches)
              rows = [
                  ReplayTrade(**json.loads(line))
                  for line in matches[0].read_text().splitlines()
                  if line.strip()
              ]
              per_market[market] = tuple(rows)

          report = build_report(per_market)
          out = Path('artifacts/aggregate/crt-pure-2y-baseline-report.json')
          out.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          print('CRT_2Y_RESULT_JSON=' + json.dumps(report, sort_keys=True))
          PY
          printf '%s\n' "$GITHUB_SHA" > artifacts/aggregate/git-sha.txt
          cd artifacts/aggregate
          sha256sum crt-pure-2y-baseline-report.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-crt-pure-2y-recovered-aggregate-${{ github.sha }}
          path: artifacts/aggregate
          if-no-files-found: error
          retention-days: 90
