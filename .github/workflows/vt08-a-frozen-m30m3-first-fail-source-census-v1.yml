name: VT08 A Frozen Bullish M30M3 C2 Source First Fail Census

on:
  push:
    branches:
      - agent/vt08-5m-methodology-source-20261010
    paths:
      - .github/workflows/vt08-a-frozen-m30m3-first-fail-source-census-v1.yml
      - src/qore/infrastructure/trader_lab/vt08_a_m30m3_frozen_family_source_funnel_v1.py
      - tests/infrastructure/trader_lab/test_vt08_a_m30m3_frozen_family_source_funnel_v1.py
      - docs/research/VT08_A_FROZEN_M30M3_BULLISH_FIRST_FAIL_COUNTS_2026-10-15.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  frozen-geometry-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        market: [EURJPY, USDCHF, NZDUSD, CADJPY, USDCAD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Ruff and frozen-family adversarial no-lookahead
        run: |
          ruff check src/qore/infrastructure/trader_lab/vt08_a_m30m3_frozen_family_source_funnel_v1.py tests/infrastructure/trader_lab/test_vt08_a_m30m3_frozen_family_source_funnel_v1.py
          pytest -q tests/infrastructure/trader_lab/test_vt08_a_m30m3_frozen_family_source_funnel_v1.py
      - uses: actions/download-artifact@v4
        with:
          name: qore-vt08-cognitive-5m-fresh-${{ matrix.market }}-b2d33e1b4829d8b4afc76983decca8a99131403c
          path: native-m15/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 35934924907
      - uses: actions/download-artifact@v4
        with:
          name: qore-vt08-m3-fractal-${{ matrix.market }}-bc1379d7661aac202495ec67afdd3098473ba723
          path: native-m3/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 35941643396
      - name: Full census of fixed bullish family C2 on native data, not economic test
        env:
          MARKET: ${{ matrix.market }}
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json,os
          from pathlib import Path
          from qore.infrastructure.trader_lab.vt08_a_m30m3_frozen_family_source_funnel_v1 import run
          market=os.environ["MARKET"]
          source=list(Path("native-m3",market).rglob("m3-evidence.json"))
          if len(source)!=1:
              raise SystemExit("exactly one native M3 source required")
          native15=Path("native-m15",market,"market-evidence-1095d.json")
          report=run(market,source[0],native15)
          Path("evidence",f"{market}-frozen-source-firstfail.json").write_text(
              json.dumps(report,sort_keys=True,separators=(",",":")),encoding="utf-8"
          )
          frozen=json.loads(Path(
              "docs/research/VT08_A_FROZEN_M30M3_BULLISH_FIRST_FAIL_COUNTS_2026-10-15.json"
          ).read_text())
          expected=frozen["market_rows"][market]
          for actual_key,expected_key in (
              ("source_m3_sha256","m3_raw_sha256"),
              ("source_m15_sha256","m15_raw_sha256"),
              ("c2_windows_total","c2_windows_total"),
              ("stage_counts","stage_counts"),
          ):
              if report[actual_key] != expected[expected_key]:
                  raise SystemExit(f"FROZEN_M30M3_SOURCE_DRIFT: {market} {actual_key}")
          assert (report["all_unique_proxy_cases_with_raw_receipts"]
                  == report["stage_counts"][
                      "UNIQUE_M3_CISD_PS_SHAPE_REQUIRES_AUTHOR_ADJUDICATION"
                  ])
          print(json.dumps({
              "market":report["market"],
              "c2_windows_total":report["c2_windows_total"],
              "stage_counts":report["stage_counts"],
              "full_unique_proxy_cases":report["all_unique_proxy_cases_with_raw_receipts"],
              "earliest_per_ny_day_upper_bound":report[
                  "earliest_unique_proxy_per_market_ny_day_upper_bound"
              ],
              "unique_pre_c2_h1_source_available":report[
                  "unique_ps_proxy_cases_with_three_closed_pre_c2_h1"
              ],
              "unique_h1_ny_day_upper_bound":report[
                  "distinct_ny_days_with_h1_and_unique_ps_proxy"
              ],
              "frozen_source_sha_verified":True,
              "source_complete_entries":report["source_complete_entries"],
              "pnl_evaluated":report["pnl_evaluated"],
              "sealed_holdout_accessed":report["sealed_holdout_accessed"],
          },sort_keys=True))
          if sum(report["stage_counts"].values()) != report["c2_windows_total"]:
              raise SystemExit("first-fail accounting inconsistent")
          if report["source_complete_entries"] != 0 or report["pnl_evaluated"]:
              raise SystemExit("improper method/economic promotion")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vt08-a-frozen-m30m3-firstfail-${{ matrix.market }}-${{ github.sha }}
          path: evidence/*.json
          retention-days: 30
          if-no-files-found: error
