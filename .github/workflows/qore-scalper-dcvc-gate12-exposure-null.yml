name: Scalper DCVC Gate1 Exposure Null Gate2 Frozen Anatomy

on:
  push:
    branches:
      - research/scalper-dcvc-causal-conditional-edge-20261010
    paths:
      - '.github/workflows/qore-scalper-dcvc-gate12-exposure-null.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_dcvc_gate12_exposure_anatomy_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_scalper_dcvc_gate12_exposure_anatomy_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CONTROLLED_RUN: '38107014488'
  CONTROLLED_SHA: '9d1f073960d4a422a40f8c982ec312f115f95af7'

jobs:
  gate12:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Quality, anti-hindsight controls and MAX3 causal source contracts
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_scalper_dcvc_gate12_exposure_anatomy_v1.py tests/infrastructure/trader_lab/test_capitalizer_scalper_dcvc_gate12_exposure_anatomy_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_scalper_dcvc_gate12_exposure_anatomy_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_scalper_dcvc_gate12_exposure_anatomy_v1.py
      - uses: actions/download-artifact@v4
        with:
          pattern: scalper-dcvc-source-*-${{ env.CONTROLLED_SHA }}
          path: frozen-nine
          github-token: ${{ github.token }}
          run-id: ${{ env.CONTROLLED_RUN }}
      - uses: actions/download-artifact@v4
        with:
          name: scalper-dcvc-abc-scientific-nine-market-${{ env.CONTROLLED_SHA }}
          path: frozen-original-abc
          github-token: ${{ github.token }}
          run-id: ${{ env.CONTROLLED_RUN }}
      - name: Run preregistered 2k full-universe null, 2k A-only, 1k sensitivity, 1k effect power and Gate2
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_dcvc_gate12_exposure_anatomy_v1 frozen-nine frozen-original-abc gate12-results
      - name: Assert unchanged V01, no C, no live, no broker net/OOS
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("gate12-results/dcvc-gate1-gate2-scientific-results.json").read_text())
          assert p["source_ids_reconciled"]==2876
          assert p["original_A_trades"]==2020 and p["frozen_B_trades"]==266
          assert p["GATE1_primary_no_posthoc_daily_B_counts"]["replications"]==2000
          assert not p["GATE1_primary_no_posthoc_daily_B_counts"]["conditioning_B_counts_per_day"]
          assert p["GATE1_A_first3_population_sensitivity"]["replications"]==2000
          assert p["GATE1_posthoc_B_symbol_session_marginal_sensitivity"]["replications"]==1000
          assert p["GATE1_power_diagnostic"]["simulation_count"]==1000
          assert p["GATE2_anatomy"]["selected_fallback_UNKNOWN"]==181
          assert p["GATE2_anatomy"]["selected_original_B"]==266
          assert not p["DCVC_v01_parameters_changed"]
          assert not p["synchronized_physical_bid_ask"]
          assert not p["independent_OOS"]
          assert not p["master_frame_C_executed"]
          assert not p["trade_or_production_authority"] and not p["certified"]
          print("AUDIT_GATE1_2_VERIFIED",json.dumps({
              "sample":p["frozen_B_trades"],
              "gate2_selected_by_reason":p["GATE2_anatomy"]["selected_by_reason"],
              "gate2_positive":p["GATE2_anatomy"]["selected_positive_posterior_only"],
              "gate1_global_pvalues":p["GATE1_primary_no_posthoc_daily_B_counts"]["holm_adjusted_three_endpoints"],
              "MDE80":p["GATE1_power_diagnostic"]["smallest_grid_shift_at_least_80pct_power_R"],
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-dcvc-gate12-2000x-null-1000x-power-${{ github.sha }}
          path: gate12-results/
          retention-days: 90
          if-no-files-found: error
