name: QORE Turtle Soup GBPJPY Coverage R30 R32

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/turtle-soup-gbpjpy-coverage-r30-r32.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_r30_nearest_dol_coverage_lab.py'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_r32_causal_memory_defragmentation.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_gbpjpy_r30_nearest_dol_coverage_lab.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_gbpjpy_r32_causal_memory_defragmentation.py'
  push:
    branches:
      - agent/turtle-soup-gbpjpy-specialist-memory-v1-001
    paths:
      - '.github/workflows/turtle-soup-gbpjpy-coverage-r30-r32.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_r30_nearest_dol_coverage_lab.py'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_r32_causal_memory_defragmentation.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_gbpjpy_r30_nearest_dol_coverage_lab.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_gbpjpy_r32_causal_memory_defragmentation.py'

permissions:
  contents: read
  actions: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-GBPJPY-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-GBPJPY-2f510461b3360e91d5ee70a72716a76cd6561f16'
  V2_RUN_ID: '35349300927'
  V2_ARTIFACT: 'qore-turtle-soup-gbpjpy-structural-specialist-v2-r27-00fb870826e0cbd30179fe44cbdd6707448be0da'
  V3_RUN_ID: '35349638944'
  V3_ARTIFACT: 'qore-turtle-soup-gbpjpy-cognitive-v3-r28-6567e259ff2fab642bbf39b0f68c13d9f00e1624'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check --ignore E501,I001 \
            src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_r30_nearest_dol_coverage_lab.py \
            src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_r32_causal_memory_defragmentation.py \
            tests/infrastructure/trader_lab/test_turtle_soup_gbpjpy_r30_nearest_dol_coverage_lab.py \
            tests/infrastructure/trader_lab/test_turtle_soup_gbpjpy_r32_causal_memory_defragmentation.py
      - name: Mypy focused gate
        run: |
          mypy --disable-error-code attr-defined \
            src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_r30_nearest_dol_coverage_lab.py \
            src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_r32_causal_memory_defragmentation.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_turtle_soup_gbpjpy_r30_nearest_dol_coverage_lab.py \
            tests/infrastructure/trader_lab/test_turtle_soup_gbpjpy_r32_causal_memory_defragmentation.py

  coverage:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable GBPJPY raw master
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-gbpjpy
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download immutable Target Destination V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target-gbpjpy
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Download exact Cognitive V2 R27 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V2_ARTIFACT }}
          path: v2-r27
          github-token: ${{ github.token }}
          run-id: ${{ env.V2_RUN_ID }}
      - name: Download exact Cognitive V3 R28 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V3_ARTIFACT }}
          path: v3-r28
          github-token: ${{ github.token }}
          run-id: ${{ env.V3_RUN_ID }}
      - name: Run R30 nearest-DOL coverage
        run: |
          mkdir -p r30-output
          python -m qore.infrastructure.trader_lab.turtle_soup_gbpjpy_r30_nearest_dol_coverage_lab \
            source-gbpjpy target-gbpjpy v3-r28 r30-output > r30-output/stdout.json
      - name: Run R32 causal memory defragmentation
        run: |
          mkdir -p r32-output
          python -m qore.infrastructure.trader_lab.turtle_soup_gbpjpy_r32_causal_memory_defragmentation \
            source-gbpjpy target-gbpjpy v2-r27 r32-output > r32-output/stdout.json
      - name: Enforce GBPJPY 2Y owner gate contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for pth in [
              'r30-output/r30-nearest-dol-coverage-lab-report.json',
              'r32-output/r32-causal-memory-defragmentation-report.json',
          ]:
              p=json.loads(Path(pth).read_text())
              a=p['predeclared_acceptance']
              assert int(a['minimum_trades']) == 350
              assert a['minimum_net_010_profit_factor'] == '1.90'
              assert a['maximum_net_010_drawdown_r'] == '6.0'
              assert p['governance']['fresh_holdout_consumed'] is False
          r32=json.loads(Path('r32-output/r32-causal-memory-defragmentation-report.json').read_text())
          c=r32['experiment_contract']
          assert c['actual_dol_price_always_used'] is True
          assert c['route_family_only_pools_memory'] is True
          assert c['entry_changed'] is False
          assert c['c2_changed'] is False
          assert c['cisd_changed'] is False
          assert c['protected_swing_changed'] is False
          PY
      - name: Hash coverage evidence
        run: |
          mkdir -p package
          cp r30-output/r30-nearest-dol-coverage-lab-report.json package/
          cp r32-output/r32-causal-memory-defragmentation-report.json package/
          printf '%s\n' "$EVIDENCE_SHA" > package/git-sha.txt
          cd package
          sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-gbpjpy-coverage-r30-r32-${{ env.EVIDENCE_SHA }}
          path: package
          if-no-files-found: error
          retention-days: 90
