name: QORE VT08 CRT PURE Cognitive Foundation

on:
  push:
    branches:
      - agent/vt08-crt-pure-source-identity-001
    paths:
      - .github/workflows/vt08-crt-pure-cognitive-foundation.yml
      - src/qore/infrastructure/traders/crt_pure_identity.py
      - src/qore/infrastructure/traders/crt_pure_source_registry.py
      - src/qore/infrastructure/traders/crt_pure_cognitive_contract.py
      - src/qore/infrastructure/traders/crt_pure_cognitive_state.py
      - src/qore/infrastructure/traders/crt_pure_position_intelligence.py
      - tests/infrastructure/traders/test_crt_pure_identity.py
      - tests/infrastructure/traders/test_crt_pure_source_registry.py
      - tests/infrastructure/traders/test_crt_pure_cognitive_architecture.py
      - docs/research/VT08-CRT-PURE-SOURCE-IDENTITY-FREEZE-001.md
      - docs/research/VT08-CRT-PURE-HYBRID-COGNITIVE-FOUNDATION-001.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff CRT PURE
        run: |
          ruff check \
            src/qore/infrastructure/traders/crt_pure_identity.py \
            src/qore/infrastructure/traders/crt_pure_source_registry.py \
            src/qore/infrastructure/traders/crt_pure_cognitive_contract.py \
            src/qore/infrastructure/traders/crt_pure_cognitive_state.py \
            src/qore/infrastructure/traders/crt_pure_position_intelligence.py \
            tests/infrastructure/traders/test_crt_pure_identity.py \
            tests/infrastructure/traders/test_crt_pure_source_registry.py \
            tests/infrastructure/traders/test_crt_pure_cognitive_architecture.py
      - name: Mypy CRT PURE
        run: |
          mypy \
            src/qore/infrastructure/traders/crt_pure_identity.py \
            src/qore/infrastructure/traders/crt_pure_source_registry.py \
            src/qore/infrastructure/traders/crt_pure_cognitive_contract.py \
            src/qore/infrastructure/traders/crt_pure_cognitive_state.py \
            src/qore/infrastructure/traders/crt_pure_position_intelligence.py
      - name: Pytest CRT PURE
        run: |
          pytest -q \
            tests/infrastructure/traders/test_crt_pure_identity.py \
            tests/infrastructure/traders/test_crt_pure_source_registry.py \
            tests/infrastructure/traders/test_crt_pure_cognitive_architecture.py
