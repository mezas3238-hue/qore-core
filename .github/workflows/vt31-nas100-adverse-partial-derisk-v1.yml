name: QORE VT31 NAS100 Adverse Partial DeRisk V1

on:
  push:
    branches:
      - agent/vt31-nas100-hypothesis-lifecycle-v1
    paths:
      - scripts/vt31_nas100_adverse_partial_derisk_frontier_v1.py
      - .github/workflows/vt31-nas100-adverse-partial-derisk-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed_holdout
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Static gate
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_adverse_partial_derisk_frontier_v1.py
          ruff check scripts/vt31_nas100_adverse_partial_derisk_frontier_v1.py
      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"
      - name: Run adverse partial de-risk frontier
        run: |
          set -euo pipefail
          python scripts/vt31_nas100_adverse_partial_derisk_frontier_v1.py \
            "input/${EVIDENCE_PATH}" \
            --partition "$PARTITION" \
            --output "result/adverse-partial-${PARTITION}.json" \
            | tee "result/summary-${PARTITION}.json"
      - name: Governance gate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path(f"result/adverse-partial-{os.environ['PARTITION']}.json").read_text())
          g=p["governance"]
          assert g["consumed_evidence_only"] is True
          assert g["new_adverse_partial_capability_was_missing_from_core"] is True
          assert g["rules_derived_from_stable_4of4_doa_forensics"] is True
          assert g["closed_m1_checkpoint_only"] is True
          assert g["partial_realized_next_m1_open"] is True
          assert g["runner_keeps_original_management"] is True
          assert g["trade_count_changed"] is False
          assert g["trade_admission_changed"] is False
          assert g["silver_bullet_changed"] is False
          assert g["uses_terminal_pnl_to_trigger_partial"] is False
          assert g["uses_outcome_class_at_runtime"] is False
          assert g["opens_new_holdout"] is False
          assert g["policy_promoted"] is False
          assert g["candidate_certified"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-adverse-partial-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-nas100-adverse-partial-*-${{ github.sha }}
          path: input
          merge-multiple: true
      - name: Aggregate adverse partial frontier
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from pathlib import Path
          folds={}
          for path in Path("input").glob("adverse-partial-*.json"):
              p=json.loads(path.read_text())
              folds[p["partition"]]=p
          assert set(folds)=={"r5","r6","r8","consumed_holdout"}
          variants=set(next(iter(folds.values()))["variants"])
          passing=[]
          summary={}
          for variant in sorted(variants):
              per_fold={}
              all_pass=True
              for fold,p in sorted(folds.items()):
                  item=p["variants"][variant]
                  passed=bool(item["passes_economic_objectives"])
                  all_pass=all_pass and passed
                  per_fold[fold]={
                      "trade_count":item["trade_count"],
                      "spec":item["spec"],
                      "partial_applied_count":item["partial_applied_count"],
                      "status_counts":item["status_counts"],
                      "metrics":item["metrics"],
                      "monte_carlo":item["monte_carlo"],
                      "annual_blocks":item["annual_blocks"],
                      "objectives":item["objectives"],
                      "passes_economic_objectives":passed,
                  }
              if all_pass:
                  passing.append(variant)
              summary[variant]=per_fold
          report={
              "schema":"qore.vt31.nas100.adverse_partial_derisk_frontier.aggregate.v1",
              "base_profile":"ALLOC_G_CORE_FAMILY_050",
              "base_state_shield":"SHIELD_060",
              "base_loss_cluster_shield":"LOSS_CLUSTER_SHIELD_060",
              "breaker_management":"LOCK025_AFTER_CLOSED_1R",
              "development_passing":passing,
              "variant_summary":summary,
              "governance":{
                  "consumed_evidence_only":True,
                  "opens_new_holdout":False,
                  "policy_promoted":False,
                  "candidate_certified":False,
              },
          }
          Path("result/aggregate.json").write_text(json.dumps(report,sort_keys=True,indent=2)+"\n")
          print(json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-adverse-partial-aggregate-${{ github.sha }}
          path: result/
          retention-days: 90
