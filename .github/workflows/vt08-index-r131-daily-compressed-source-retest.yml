name: VT08 Index R131 Daily Compressed Source Retest

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r131-daily-compressed-source-retest.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r131_daily_compressed_source_retest.py
      - tests/infrastructure/trader_lab/test_vt08_index_r131_daily_compressed_source_retest.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r131_daily_compressed_source_retest.py

  ablation:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R131 daily-compressed source-retest ablation
        run: |
          mkdir -p artifacts/report
          python -m qore.infrastructure.trader_lab.vt08_index_r131_daily_compressed_source_retest \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r131-daily-compressed-source-retest.json

      - name: Verify R131 frozen ablation contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/"
                  "vt08-index-r131-daily-compressed-source-retest.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R131_DAILY_COMPRESSED_SOURCE_RETEST_ABLATION_001"
          )
          assert report["source_r130"]["run_id"] == 36077074851
          assert report["source_r130"]["artifact_id"] == 10839674224
          assert report["source_r130"]["artifact_digest"] == (
              "sha256:5cbf36ba630f60af21726d5dc4259d6d"
              "8e2024f92d405a003a6c60ba5a64cfa5"
          )

          expected = {
              "five_year": (2448, 1756, 104),
              "recent_two_year": (1017, 746, 50),
              "r66_failed_holdout": (773, 546, 37),
          }
          for key, (canonical, standard, target) in expected.items():
              section = report[key]
              assert section["canonical_sample"] == canonical
              assert section["standard_sample"] == standard
              assert section["target_sample"] == target
              assert section["retest_count"] + section["fallback_count"] == target
              assert section["full_portfolio"]["baseline"]["sample"] == canonical
              assert (
                  section["full_portfolio"]["targeted_retest"]["sample"]
                  == canonical
              )

          contract = report["preregistered_contract"]
          assert contract["recent_daily_range_state"] == "compressed"
          assert contract["same_setup_only"] is True
          assert contract["retest_creates_second_trade"] is False
          assert contract["canonical_fallback_when_no_retest"] is True
          assert contract["signals_suppressed"] is False
          assert contract["trade_count_changed"] is False

          gov = report["governance"]
          assert gov["research_only"] is True
          assert gov["single_preregistered_variant"] is True
          assert gov["calendar_or_year_runtime_feature"] is False
          assert gov["signals_suppressed"] is False
          assert gov["trade_count_changed"] is False
          assert gov["risk_changed"] is False
          assert gov["market_removed"] is False
          assert gov["candidate_created"] is False
          assert gov["live_authorized"] is False
          assert gov["production_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r131-daily-compressed-source-retest-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
