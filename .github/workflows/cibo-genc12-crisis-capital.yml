name: QORE CIBO GEN-C12 Crisis Capital Intelligence

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-genc12-crisis-capital.yml'
      - 'src/qore/infrastructure/cibo_crisis_capital_intelligence.py'
      - 'src/qore/infrastructure/cibo_genc12_economic_gate.py'
      - 'tests/infrastructure/test_cibo_crisis_capital_intelligence.py'
      - 'tests/infrastructure/test_cibo_genc12_economic_gate.py'
      - 'docs/research/CIBO-GEN-C12-CRISIS-CAPITAL-INTELLIGENCE-V1.md'
      - 'docs/research/CIBO-GEN-C12-NONCOMPENSATORY-ECONOMIC-GATE-V1.md'
      - 'docs/research/CIBO-MASTER-OPEN-WORK-LEDGER-V1.json'
  push:
    branches:
      - agent/cibo-capital-efficiency-sizing-lab-001
    paths:
      - '.github/workflows/cibo-genc12-crisis-capital.yml'
      - 'src/qore/infrastructure/cibo_crisis_capital_intelligence.py'
      - 'src/qore/infrastructure/cibo_genc12_economic_gate.py'
      - 'tests/infrastructure/test_cibo_crisis_capital_intelligence.py'
      - 'tests/infrastructure/test_cibo_genc12_economic_gate.py'
      - 'docs/research/CIBO-GEN-C12-CRISIS-CAPITAL-INTELLIGENCE-V1.md'
      - 'docs/research/CIBO-GEN-C12-NONCOMPENSATORY-ECONOMIC-GATE-V1.md'
      - 'docs/research/CIBO-MASTER-OPEN-WORK-LEDGER-V1.json'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  genc12-crisis-capital:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: GEN-C12 quality and crisis-boundary invariants
        run: |
          ruff check \
            src/qore/infrastructure/cibo_crisis_capital_intelligence.py \
            src/qore/infrastructure/cibo_genc12_economic_gate.py \
            tests/infrastructure/test_cibo_crisis_capital_intelligence.py \
            tests/infrastructure/test_cibo_genc12_economic_gate.py
          mypy \
            src/qore/infrastructure/cibo_crisis_capital_intelligence.py \
            src/qore/infrastructure/cibo_genc12_economic_gate.py
          python -m py_compile \
            src/qore/infrastructure/cibo_crisis_capital_intelligence.py \
            src/qore/infrastructure/cibo_genc12_economic_gate.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_crisis_capital_intelligence.py \
            tests/infrastructure/test_cibo_genc12_economic_gate.py
