  contract-evidence:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Emit provider uncertainty contract evidence
        run: |
          mkdir -p phase20-output
          cat > phase20-output/empty-forward-evidence.json <<'JSON'
          {"schema":"CIBO_PHASE20D_FORWARD_EVIDENCE_BOOK_V4","generation":0,"decisions":[],"outcomes":[]}
          JSON
          cat > phase20-output/empty-forward-policy.json <<'JSON'
          {"schema":"CIBO_PHASE20D_FORWARD_POLICY_BOOK_V1","generation":0,"decisions":[]}
          JSON
          python scripts/cibo_phase20_provider_uncertainty_contract.py \
            --output phase20-output/phase20-provider-uncertainty-contract.json \
            > phase20-output/provider-uncertainty-stdout.json
          python scripts/cibo_phase20_counterfactual_stress_matrix.py \
            --output phase20-output/phase20-counterfactual-stress-matrix.json \
            > phase20-output/counterfactual-stress-stdout.json
          python scripts/cibo_phase20_capital_state_monte_carlo_contract.py \
            --output phase20-output/phase20-capital-state-monte-carlo-contract.json \
            > phase20-output/capital-state-monte-carlo-stdout.json
          python scripts/cibo_phase20_mechanism_certification.py \
            --output phase20-output/phase20-mechanism-certification.json \
            > phase20-output/mechanism-certification-stdout.json
          python scripts/cibo_phase20_operational_mechanism_certification.py \
            --output phase20-output/phase20-operational-mechanism-certification.json \
            > phase20-output/operational-mechanism-certification-stdout.json
          python scripts/cibo_phase20_capital_action_certification.py \
            --output phase20-output/phase20-capital-action-certification.json \
            > phase20-output/capital-action-certification-stdout.json
          python scripts/cibo_phase20_interaction_ablation.py \
            --output phase20-output/phase20-interaction-ablation.json \
            > phase20-output/interaction-ablation-stdout.json
          python scripts/cibo_phase20_robust_allocator_contract.py \
            --output phase20-output/phase20-robust-allocator-contract.json \
            > phase20-output/robust-allocator-stdout.json
          python scripts/cibo_phase20_forecastless_mpc_contract.py \
            --output phase20-output/phase20-forecastless-mpc-contract.json \
            > phase20-output/forecastless-mpc-stdout.json
          python scripts/cibo_phase20_policy_candidate_freeze.py \
            --output phase20-output/phase20-policy-candidate-freeze.json \
            > phase20-output/policy-candidate-freeze-stdout.json
          python scripts/cibo_phase20_forward_evidence_contract.py \
            --output phase20-output/phase20-forward-evidence-contract.json \
            > phase20-output/forward-evidence-stdout.json
          python scripts/cibo_phase20_forward_store_contract.py \
            --output phase20-output/phase20-forward-store-contract.json \
            > phase20-output/forward-store-stdout.json
          python scripts/cibo_phase20_forward_collector_contract.py \
            --output phase20-output/phase20-forward-collector-contract.json \
            > phase20-output/forward-collector-stdout.json
          python scripts/cibo_phase20_qualification_plan.py \
            --output phase20-output/phase20-qualification-plan.json \
            > phase20-output/qualification-plan-stdout.json
          python scripts/cibo_phase20_forward_qualification.py \
            --evidence-store phase20-output/empty-forward-evidence.json \
            --policy-store phase20-output/empty-forward-policy.json \
            --git-sha "$EVIDENCE_SHA" \
            --output phase20-output/phase20-forward-qualification-empty-contract.json \
            > phase20-output/forward-qualification-stdout.json
          python scripts/cibo_phase21_policy_freeze_contract.py \
            --output phase20-output/phase21-policy-freeze-contract.json \
            > phase20-output/phase21-policy-freeze-stdout.json
          python scripts/cibo_phase22_holdout_gate_contract.py \
            --output phase20-output/phase22-holdout-lineage-contract.json \
            > phase20-output/phase22-holdout-lineage-stdout.json
          python scripts/cibo_phase22_holdout_qualification_contract.py \
            --output phase20-output/phase22-holdout-qualification-contract.json \
            > phase20-output/phase22-holdout-qualification-stdout.json
          python scripts/cibo_final_certification_contract.py \
            --output phase20-output/cibo-final-certification-contract.json \
            > phase20-output/cibo-final-certification-stdout.json
          python scripts/cibo_phase20_failure_engineering.py \
            --output phase20-output/phase20-failure-engineering.json \
            > phase20-output/failure-engineering-stdout.json
          python scripts/cibo_phase20_failure_engineering_b.py \
            --output phase20-output/phase20-failure-engineering-b.json \
            > phase20-output/failure-engineering-b-stdout.json
      - name: Seal Phase 20 provider uncertainty evidence
        run: |
          printf '%s\n' "$EVIDENCE_SHA" > phase20-output/git-sha.txt
          cd phase20-output
          sha256sum \
            phase20-provider-uncertainty-contract.json \
            provider-uncertainty-stdout.json \
            phase20-counterfactual-stress-matrix.json \
            counterfactual-stress-stdout.json \
            phase20-capital-state-monte-carlo-contract.json \
            capital-state-monte-carlo-stdout.json \
            phase20-mechanism-certification.json \
            mechanism-certification-stdout.json \
            phase20-operational-mechanism-certification.json \
            operational-mechanism-certification-stdout.json \
            phase20-capital-action-certification.json \
            capital-action-certification-stdout.json \
            phase20-interaction-ablation.json \
            interaction-ablation-stdout.json \
            phase20-robust-allocator-contract.json \
            robust-allocator-stdout.json \
            phase20-forecastless-mpc-contract.json \
            forecastless-mpc-stdout.json \
            phase20-policy-candidate-freeze.json \
            policy-candidate-freeze-stdout.json \
            phase20-forward-evidence-contract.json \
            forward-evidence-stdout.json \
            phase20-forward-store-contract.json \
            forward-store-stdout.json \
            phase20-forward-collector-contract.json \
            forward-collector-stdout.json \
            phase20-qualification-plan.json \
            qualification-plan-stdout.json \
            phase20-forward-qualification-empty-contract.json \
            forward-qualification-stdout.json \
            phase21-policy-freeze-contract.json \
            phase21-policy-freeze-stdout.json \
            phase22-holdout-lineage-contract.json \
            phase22-holdout-lineage-stdout.json \
            phase22-holdout-qualification-contract.json \
            phase22-holdout-qualification-stdout.json \
            cibo-final-certification-contract.json \
            cibo-final-certification-stdout.json \
            empty-forward-evidence.json \
            empty-forward-policy.json \
            phase20-failure-engineering.json \
            failure-engineering-stdout.json \
            phase20-failure-engineering-b.json \
            failure-engineering-b-stdout.json \
            git-sha.txt > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-phase20-provider-uncertainty-${{ env.EVIDENCE_SHA }}
          path: phase20-output
          if-no-files-found: error
          retention-days: 90
