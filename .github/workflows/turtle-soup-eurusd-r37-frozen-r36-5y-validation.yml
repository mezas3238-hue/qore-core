name: QORE Turtle Soup EURUSD R37 Frozen R36 5Y Validation

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-eurusd-specialist-memory-v1-001
    paths:
      - '.github/workflows/turtle-soup-eurusd-r37-frozen-r36-5y-validation.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_eurusd_r37_frozen_r36_5y_validation.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_eurusd_r37_frozen_r36_5y_validation.py'

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-EURUSD-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-EURUSD-2f510461b3360e91d5ee70a72716a76cd6561f16'
  R28_RUN_ID: '35319457546'
  R28_ARTIFACT: 'qore-turtle-soup-eurusd-cognitive-v3-r28-e6879bbdd3844751af075269ddd93db6d3f9b9e1'
  FREEZE_RUN_ID: '35326864091'
  FREEZE_ARTIFACT: 'qore-turtle-soup-eurusd-r36-candidate-freeze-4fef686b9fc669ad64a5a85fb2c899fae9b42a74'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check --ignore E501,I001 src/qore/infrastructure/trader_lab/turtle_soup_eurusd_r37_frozen_r36_5y_validation.py tests/infrastructure/trader_lab/test_turtle_soup_eurusd_r37_frozen_r36_5y_validation.py
      - run: mypy --disable-error-code attr-defined src/qore/infrastructure/trader_lab/turtle_soup_eurusd_r37_frozen_r36_5y_validation.py
      - run: pytest -q --no-cov tests/infrastructure/trader_lab/test_turtle_soup_eurusd_r37_frozen_r36_5y_validation.py

  replay-5y:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-eurusd
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target-eurusd
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.R28_ARTIFACT }}
          path: cognitive-v3
          github-token: ${{ github.token }}
          run-id: ${{ env.R28_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.FREEZE_ARTIFACT }}
          path: r36-freeze
          github-token: ${{ github.token }}
          run-id: ${{ env.FREEZE_RUN_ID }}
      - name: Run exact frozen 5Y validation
        run: |
          mkdir -p r37-output
          python -m qore.infrastructure.trader_lab.turtle_soup_eurusd_r37_frozen_r36_5y_validation source-eurusd target-eurusd cognitive-v3 r36-freeze r37-output > r37-output/stdout.json
          printf '%s\n' "$GITHUB_SHA" > r37-output/git-sha.txt
      - name: Enforce governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('r37-output/r37-5y-validation-report.json').read_text())
          assert p['identity']=='TURTLE_SOUP_EURUSD_R37_FROZEN_R36_5Y_VALIDATION_V1'
          assert p['window']['open']=='2021-09-17T00:00:00+00:00'
          assert p['window']['close']=='2026-09-17T00:00:00+00:00'
          assert p['window']['fresh_holdout'] is False
          assert p['window']['historical_status']=='CONSUMED_ROBUSTNESS_VALIDATION'
          c=p['frozen_contract_verification']
          assert all(v is False for v in c.values())
          a=p['predeclared_acceptance']
          assert a['minimum_trades']==800
          assert a['minimum_scaled_net_010_profit_factor']=='1.50'
          assert a['maximum_scaled_net_010_drawdown_r']=='6.0'
          g=p['governance']
          assert g['candidate_rules_frozen'] is True
          assert g['5y_validation_consumed'] is True
          assert g['fresh_holdout_consumed'] is False
          assert g['candidate_certified'] is False
          assert g['live_authorized'] is False
          assert g['real_capital_authorized'] is False
          PY
      - name: Hash 5Y evidence
        run: |
          cd r37-output
          sha256sum r37-5y-validation-report.json r37-5y-scaled-trades.jsonl stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-eurusd-r37-frozen-r36-5y-validation-${{ github.sha }}
          path: r37-output
          if-no-files-found: error
          retention-days: 90
