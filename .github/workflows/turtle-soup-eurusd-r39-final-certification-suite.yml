name: QORE Turtle Soup EURUSD R39 Final Certification Suite

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-eurusd-specialist-memory-v1-001
    paths:
      - '.github/workflows/turtle-soup-eurusd-r39-final-certification-suite.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_eurusd_r39_final_certification_suite.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_eurusd_r39_final_certification_suite.py'

permissions:
  contents: read
  actions: read

env:
  R38_RUN_ID: '35327677519'
  R38_ARTIFACT: 'qore-turtle-soup-eurusd-r38-5y-structural-risk-correction-324fb91d44a6fa328e66de2e22ace7386630c7aa'
  FREEZE_RUN_ID: '35327938780'
  FREEZE_ARTIFACT: 'qore-turtle-soup-eurusd-r38-candidate-freeze-8590a4de93cad1d334a0644003916170c1f2a193'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check --ignore E501,I001             src/qore/infrastructure/trader_lab/turtle_soup_eurusd_r39_final_certification_suite.py             tests/infrastructure/trader_lab/test_turtle_soup_eurusd_r39_final_certification_suite.py
      - name: Mypy focused gate
        run: |
          mypy --disable-error-code attr-defined             src/qore/infrastructure/trader_lab/turtle_soup_eurusd_r39_final_certification_suite.py
      - name: Focused tests
        run: |
          pytest -q --no-cov             tests/infrastructure/trader_lab/test_turtle_soup_eurusd_r39_final_certification_suite.py

  certify:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download exact official R38 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.R38_ARTIFACT }}
          path: r38-source
          github-token: ${{ github.token }}
          run-id: ${{ env.R38_RUN_ID }}
      - name: Download exact R38 freeze artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FREEZE_ARTIFACT }}
          path: r38-freeze
          github-token: ${{ github.token }}
          run-id: ${{ env.FREEZE_RUN_ID }}
      - name: Execute WFO Monte Carlo stress slippage robustness certification
        run: |
          mkdir -p r39-output
          python -m qore.infrastructure.trader_lab.turtle_soup_eurusd_r39_final_certification_suite             r38-source r38-freeze r39-output > r39-output/stdout.json
          echo "$GITHUB_SHA" > r39-output/git-sha.txt
      - name: Enforce fail-closed certification contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('r39-output/r39-final-certification-report.json').read_text())
          assert report['identity']=='TURTLE_SOUP_EURUSD_R39_FINAL_CERTIFICATION_SUITE_V1'
          contract=report['certification_contract']
          assert contract['internal_qore_research_certification'] is True
          assert contract['external_regulatory_certification'] is False
          assert contract['rules_reoptimized_after_r38_freeze'] is False
          assert contract['fresh_holdout_consumed'] is False
          assert contract['fail_closed'] is True
          gates=report['gate_results']
          status=report['certification']['status']
          certified=report['certification']['certified']
          assert certified == all(gates.values())
          assert status == ('TRADER_CERTIFIED' if certified else 'NOT_CERTIFIED')
          g=report['governance']
          assert g['fresh_holdout_consumed'] is False
          assert g['live_authorized'] is False
          assert g['real_capital_authorized'] is False
          assert g['production_authorized'] is False
          assert g['merge_authorized'] is False
          assert g['certification_does_not_authorize_live_capital'] is True
          PY
      - name: Hash certification evidence
        run: |
          cd r39-output
          sha256sum r39-final-certification-report.json r39-certification-manifest.json stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-eurusd-r39-final-certification-${{ github.sha }}
          path: r39-output
          if-no-files-found: error
          retention-days: 90
