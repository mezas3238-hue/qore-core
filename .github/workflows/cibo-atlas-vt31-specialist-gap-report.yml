name: QORE CIBO Atlas VT31 Specialist Gap Report

on:
  push:
    branches: [agent/cibo-atlas-vt31-market-specialists-001]
    paths:
      - scripts/cibo_atlas_vt31_specialist_gap_report.py
      - .github/workflows/cibo-atlas-vt31-specialist-gap-report.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  specialist-gap-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research runtime
        run: pip install -e .[dev]
      - name: Static validation
        run: |
          set -euo pipefail
          python -m py_compile scripts/cibo_atlas_vt31_specialist_gap_report.py
          ruff check --ignore N802,E501 scripts/cibo_atlas_vt31_specialist_gap_report.py
          mypy src/qore/infrastructure/cibo_atlas_market_lab.py
          python scripts/cibo_atlas_vt31_specialist_gap_report.py --self-test
      - name: Recover immutable historical Atlas
        run: |
          set -euo pipefail
          artifact_id=10467004744
          expected=a969d2c3a5da29fc44a07adae65b49d275bc0e5844001f82ea721d571635423b
          digest="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" --jq .digest)"
          test "$digest" = "sha256:${expected}"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > atlas.zip
          echo "${expected}  atlas.zip" | sha256sum -c -
          mkdir atlas
          unzip -q atlas.zip -d atlas
          (cd atlas && sha256sum -c SHA256SUMS)
          test "$(cat atlas/git-sha.txt)" = "735cfc1edb193dbf6c2337f9b771cea8ca70dc0f"
          test -f atlas/cibo-atlas-vt31-historical-market-scanner.json
          test -f atlas/cibo-atlas-vt31-market-day-matrix.csv
          printf '%s\n' "$artifact_id" > atlas-artifact-id.txt
          printf '%s\n' "$digest" > atlas-artifact-digest.txt
      - name: Render specialist gap report
        run: |
          set -euo pipefail
          mkdir result
          python scripts/cibo_atlas_vt31_specialist_gap_report.py \
            --scanner atlas/cibo-atlas-vt31-historical-market-scanner.json \
            --matrix atlas/cibo-atlas-vt31-market-day-matrix.csv \
            --output-dir result
      - name: Validate research governance
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('result/cibo-atlas-vt31-specialist-gap-report.json').read_text())
          assert p['schema']=='qore.cibo_atlas.vt31.specialist_gap_report.v1'
          assert p['research_only'] is True
          assert p['selection_prohibited'] is True
          assert p['opens_new_holdout'] is False
          assert p['candidate_status']=='NO_R9_NOT_CERTIFIED'
          assert p['live_authorized'] is False and p['production_authorized'] is False
          assert set(p['specialists'])=={'NAS100','SP500','US30'}
          assert p['hypothesis_policy']['automatic_parameter_change'] is False
          assert p['hypothesis_policy']['automatic_market_drop'] is False
          print(json.dumps(p['specialists'], sort_keys=True))
          print(json.dumps({'cross_index':p['cross_index_diagnostics']}, sort_keys=True))
          PY
      - name: Bind immutable diagnostic artifact
        run: |
          set -euo pipefail
          echo "$GITHUB_SHA" > result/git-sha.txt
          cp atlas-artifact-id.txt atlas-artifact-digest.txt result/
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-atlas-vt31-specialist-gap-report-${{ github.sha }}
          path: result/
          retention-days: 90
