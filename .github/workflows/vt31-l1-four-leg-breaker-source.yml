name: VT31 L1 four-leg breaker versus pivot-only source witness (NO TRADES)
on:
  push:
    branches:
      - agent/vt31-l1-breaker-four-leg-source-20261014
    paths:
      - 'scripts/vt31_l1_breaker_four_leg_source_20261014.py'
      - 'tests/infrastructure/test_vt31_l1_breaker_four_leg_source_20261014.py'
      - 'docs/research/VT31_L1_M4_TTRADES_FOUR_LEG_BREAKER_SOURCE_PREREG_2026-10-14.md'
      - '.github/workflows/vt31-l1-four-leg-breaker-source.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  SOURCE_ARTIFACT: '11459859004'
  SOURCE_SHA: '0563370fd021ad091392eb26f60cda0d3356d38c801fc1c2083cceafc5043cfa'
jobs:
  causal-4leg-breaker-research-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check prereg before code and original G3 immutable blobs
        run: |
          set -euo pipefail
          git cat-file -t 833fd1746659c6034cfcd49c816fb5c4804dedb1
          git merge-base --is-ancestor 833fd1746659c6034cfcd49c816fb5c4804dedb1 HEAD
          test "$(git hash-object src/qore/infrastructure/traders/vt31_ict_cleanroom/cognition.py)" = d0ab4c15d6e9d24e53224d27bdb2cd96af914fb9
          test "$(git hash-object src/qore/infrastructure/traders/vt31_ict_cleanroom/operations.py)" = 0ce9707314aecb71155de8b57044b6ec028847b2
          test "$(git hash-object docs/research/VT31_G3_DECISION_METODOLOGICA_STOP_FRAMEWORK_FVG_EXIT_V1_2026-10-12.md)" = e99c70b4e018d626fb620d9a21b9314a51abc36d
      - name: Install dependencies, Ruff, compile, full VT31 research regression
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]' 'ijson>=3.3,<4'
          ruff check scripts/vt31_l1_breaker_four_leg_source_20261014.py tests/infrastructure/test_vt31_l1_breaker_four_leg_source_20261014.py
          python -m py_compile scripts/vt31_l1_breaker_four_leg_source_20261014.py
          mkdir -p evidence
          PYTHONPATH=src:. pytest -q -o addopts='' \
            tests/infrastructure/test_vt31_l1_breaker_four_leg_source_20261014.py \
            tests/infrastructure/test_vt31_l1_m5_stop_source_conflict_20261014.py \
            tests/infrastructure/test_vt31_l1_research_binding_20261014.py \
            tests/infrastructure/test_vt31_l3_m1_source_parity_20261014.py \
            tests/infrastructure/test_vt31_m4_m5_ttrades_fvg_path_20261014.py \
            tests/infrastructure/test_vt31_ttrades_am_method_m1_census_20261014.py \
            tests/infrastructure/test_vt31_ttrades_am_native_cog_v1_20261014.py \
            tests/infrastructure/test_vt31_ict_dol_source_v1_20261014.py \
            tests/infrastructure/test_vt31_mc_p2_ttrades_native_h1_20261014.py \
            tests/infrastructure/test_vt31_cog_evidence_v2_20261014.py \
            tests/infrastructure/test_vt31_methodology_cognitive_source_fidelity_20261014.py \
            tests/infrastructure/test_vt31_ict_cleanroom_cognition.py \
            tests/infrastructure/test_vt31_ict_cleanroom_ops.py \
            tests/infrastructure/test_vt31_ict_cleanroom_m1_execution.py \
            tests/infrastructure/test_vt31_g3_mss_anchor_optin.py \
            --junitxml=evidence/junit.xml | tee evidence/tests.txt
      - name: Download actual previously inspected 3Y NAS100 and byte-check
        run: |
          set -euo pipefail
          mkdir -p input
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT}/zip" > original.zip
          unzip -q original.zip -d input
          test -s input/NAS100/market-evidence.json
          echo "${SOURCE_SHA}  input/NAS100/market-evidence.json" | sha256sum -c -
      - name: Full 3Y structural four-leg benchmark, NOT tradable breaker
        run: |
          set -euo pipefail
          PYTHONPATH=src:. python scripts/vt31_l1_breaker_four_leg_source_20261014.py \
            --market input/NAS100/market-evidence.json \
            --out evidence/VT31_L1_FOUR_LEG_BREAKER_DEVELOPMENT_CENSUS.json \
            | tee evidence/summary.json
      - name: Strict no-pass/zero-economic assertions and artifact hashes
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open("evidence/VT31_L1_FOUR_LEG_BREAKER_DEVELOPMENT_CENSUS.json"))
          assert p["source_sha256"]=="0563370fd021ad091392eb26f60cda0d3356d38c801fc1c2083cceafc5043cfa"
          assert p["prereg_commit"]=="833fd1746659c6034cfcd49c816fb5c4804dedb1"
          assert p["original_m1_count"]==1059784
          assert p["total_ny_days"]==775 and len(p["all_cases"])==775
          assert sum(p["status_counts"].values())==775
          assert p["status_counts"].get("INCOMPLETE_09_10")==6
          for x in p["all_cases"]:
              assert not x["author_breaker_certified"]
              assert not x["four_leg_pivot_rule_author_attributed"]
              assert not x["retest_or_entry_executed"]
          assert p["author_breaker_certified"] is False
          assert p["candidate_binding_reused_as_certification"] is False
          assert p["trader_lab_L1_qualified"] is False
          assert p["trader_lab_L2_to_L10_qualified"] is False
          assert p["broker_orders"]==p["entry_fills"]==p["risk_sizing"]==0
          assert p["financial_edge_established"] is False
          assert p["fresh_holdout"] is False and p["live_authorized"] is False
          print("QORE_STRICT_BREAKER_SOURCE_ONLY_NO_AUTHOR_CERTIFICATION_NO_TRADE")
          PY
          git rev-parse HEAD > evidence/commit_sha.txt
          printf '%s\n' 833fd1746659c6034cfcd49c816fb5c4804dedb1 > evidence/prereg_sha.txt
          printf '%s\n' 'NO_AUTHOR_BREAKER_CERTIFIED_NO_L1_L10_PASS_NO_OOS_NO_FILL_NO_LIVE' > evidence/scope.txt
          (cd evidence && sha256sum *.json *.xml *.txt > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: vt31-four-leg-breaker-source-${{ github.sha }}
          path: evidence/
          retention-days: 90
          if-no-files-found: error
