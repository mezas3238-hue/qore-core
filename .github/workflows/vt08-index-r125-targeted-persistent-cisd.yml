name: VT08 Index R125 Targeted Persistent CISD

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r125-targeted-persistent-cisd.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r125_targeted_persistent_cisd.py
      - tests/infrastructure/trader_lab/test_vt08_index_r125_targeted_persistent_cisd.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r125_targeted_persistent_cisd.py

  ablation:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R125 targeted persistent-CISD replacement
        run: |
          mkdir -p artifacts/report
          python -m qore.infrastructure.trader_lab.vt08_index_r125_targeted_persistent_cisd \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r125-targeted-persistent-cisd.json

      - name: Verify R125 frozen ablation contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/"
                  "vt08-index-r125-targeted-persistent-cisd.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R125_TARGETED_PERSISTENT_CISD_REPLACEMENT_001"
          )
          assert report["source_r124"]["run_id"] == 36058115950
          assert report["source_r124"]["artifact_id"] == 10832559781
          assert report["source_r124"]["artifact_digest"] == (
              "sha256:e77c6302cf6b0b6e94332bc9ea0bad4f"
              "308ceccf85d111818e08e306b2cb7865"
          )

          expected = {
              "five_year": (2448, 1756, 235),
              "recent_two_year": (1017, 746, 110),
              "r66_failed_holdout": (773, 546, 101),
          }
          for key, (canonical, standard, target) in expected.items():
              section = report[key]
              assert section["canonical_sample"] == canonical
              assert section["standard_sample"] == standard
              assert section["target_state_sample"] == target
              assert (
                  section["persistent_replacement_count"]
                  + section["canonical_fallback_count"]
                  == target
              )
              assert sum(section["routing_reasons"].values()) == target
              assert section["full_portfolio"]["baseline"]["sample"] == canonical
              assert (
                  section["full_portfolio"][
                      "persistent_replacement"
                  ]["sample"]
                  == canonical
              )

          contract = report["preregistered_contract"]
          assert contract["canonical_signal_surface_preserved"] is True
          assert contract["signals_suppressed"] is False
          assert contract["trade_count_changed"] is False

          gov = report["governance"]
          assert gov["research_only"] is True
          assert gov["single_preregistered_variant"] is True
          assert gov["signals_suppressed"] is False
          assert gov["trade_count_changed"] is False
          assert gov["candidate_created"] is False
          assert gov["live_authorized"] is False
          assert gov["real_capital_authorized"] is False
          assert gov["production_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r125-targeted-persistent-cisd-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
