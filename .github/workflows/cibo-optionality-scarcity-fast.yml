name: QORE CIBO Optionality Scarcity Fast Gate

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cibo-optionality-scarcity-wiring-001
    paths:
      - '.github/workflows/cibo-optionality-scarcity-fast.yml'
      - 'src/qore/infrastructure/cibo_ce2i_optionality.py'
      - 'src/qore/infrastructure/cibo_sovereign_capital_runtime.py'
      - 'src/qore/infrastructure/cibo_account_sizing_authority.py'
      - 'src/qore/infrastructure/cibo_capital_science_runtime_bridge.py'
      - 'tests/infrastructure/test_cibo_ce2i_optionality.py'
      - 'tests/infrastructure/test_cibo_full_economic_digital_twin.py'
      - 'tests/infrastructure/test_cibo_sovereign_capital_runtime_contract.py'
      - 'tests/infrastructure/test_cibo_account_sizing_authority.py'
      - 'tests/infrastructure/test_cibo_capital_science_runtime_bridge.py'

permissions:
  contents: read

concurrency:
  group: qore-cibo-optionality-scarcity-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Validate optionality scarcity seam
        run: |
          set -euo pipefail
          python -m py_compile \
            src/qore/infrastructure/cibo_ce2i_optionality.py \
            src/qore/infrastructure/cibo_sovereign_capital_runtime.py
          ruff check \
            src/qore/infrastructure/cibo_ce2i_optionality.py \
            src/qore/infrastructure/cibo_sovereign_capital_runtime.py \
            tests/infrastructure/test_cibo_ce2i_optionality.py \
            tests/infrastructure/test_cibo_full_economic_digital_twin.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_ce2i_optionality.py \
            tests/infrastructure/test_cibo_full_economic_digital_twin.py \
            tests/infrastructure/test_cibo_sovereign_capital_runtime_contract.py \
            tests/infrastructure/test_cibo_account_sizing_authority.py \
            tests/infrastructure/test_cibo_capital_science_runtime_bridge.py
