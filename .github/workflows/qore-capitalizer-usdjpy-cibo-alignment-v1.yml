name: QORE Capitalizer USDJPY CIBO Alignment Forensics V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-usdjpy-cibo-alignment-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_cibo_alignment_forensics.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_cibo_alignment_forensics.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-usdjpy-cibo-alignment-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_M5_RUN_ID: '35166210458'
  SOURCE_M5_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-USDJPY-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  SOURCE_JOURNEY_RUN_ID: '35175979474'
  SOURCE_JOURNEY_ARTIFACT: 'qore-cibo-market-journey-USDJPY-9cc0f17a2f30846d61b242132547f39391909656'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check --ignore E501 \
            src/qore/infrastructure/trader_lab/capitalizer_cibo_alignment_forensics.py \
            tests/infrastructure/trader_lab/test_capitalizer_cibo_alignment_forensics.py
      - name: Mypy
        run: |
          mypy src/qore/infrastructure/trader_lab/capitalizer_cibo_alignment_forensics.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_cibo_alignment_forensics.py

  forensics:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download immutable consumed USDJPY M5 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_M5_ARTIFACT }}
          path: m5-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M5_RUN_ID }}
      - name: Download immutable consumed USDJPY Journey artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_JOURNEY_ARTIFACT }}
          path: journey-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_JOURNEY_RUN_ID }}
      - name: Run exact causal CIBO alignment forensics
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cibo_alignment_forensics \
            m5-source \
            journey-source \
            cibo-alignment-output
      - name: Enforce consumed-evidence and no-promotion governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              'cibo-alignment-output/'
              'capitalizer-usdjpy-cibo-alignment-v1.json'
          )
          result = json.loads(path.read_text())
          assert result['identity'] == 'QORE_CAPITALIZER_CIBO_ALIGNMENT_FORENSICS_V1'
          assert result['symbol'] == 'USDJPY'
          assert result['session'] == 'ASIA'
          assert result['evidence_status'] == 'CONSUMED_RESEARCH_EVIDENCE'
          assert result['context_fields_causal'] is True
          assert result['outcome_fields_causal'] is False
          assert result['lookback_tuning_used'] is False
          assert result['rule_promotion_allowed'] is False
          assert result['candidate_freeze_allowed'] is False
          assert result['total_labeled_responses'] > 0
          tags = {row['context_tag'] for row in result['aggregates']}
          assert 'NO_EXACT_CIBO_EVENT' in tags
          assert 'DEPARTURE_ALIGNED_H1' in tags
          assert 'DEPARTURE_OPPOSED_H1' in tags
          PY
      - name: Upload immutable CIBO alignment evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-usdjpy-cibo-alignment-v1-${{ github.sha }}
          path: cibo-alignment-output
          if-no-files-found: error
          retention-days: 90
