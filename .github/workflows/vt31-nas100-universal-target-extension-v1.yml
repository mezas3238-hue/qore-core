name: QORE VT31 NAS100 Universal Target Extension V1

on:
  push:
    branches:
      - agent/vt31-edge-position-cert-b-001
    paths:
      - scripts/vt31_nas100_universal_target_extension_frontier_v1.py
      - .github/workflows/vt31-nas100-universal-target-extension-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Static gate
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_universal_target_extension_frontier_v1.py
          ruff check scripts/vt31_nas100_universal_target_extension_frontier_v1.py
      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"
      - name: Run universal target frontier
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python scripts/vt31_nas100_universal_target_extension_frontier_v1.py             "input/${EVIDENCE_PATH}"             --partition "${PARTITION}"             --output "result/target-${PARTITION}.json"             | tee "result/summary-${PARTITION}.json"
      - name: Governance gate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=os.environ["PARTITION"]
          x=json.loads(Path(f"result/target-{p}.json").read_text())
          g=x["governance"]
          assert g["trade_admission_changed"] is False
          assert g["entry_changed"] is False
          assert g["initial_stop_changed"] is False
          assert g["baseline_3r_breakeven_preserved"] is True
          assert g["lifecycle_changed"] is False
          assert g["target_selected_pre_fill"] is True
          assert g["future_extension_runtime_input"] is False
          assert g["terminal_pnl_runtime_input"] is False
          assert g["normalized_equal_r_economics"] is True
          assert g["capital_weighted_net_r_used"] is False
          assert g["position_sizing_used"] is False
          assert g["leverage_used"] is False
          assert g["compounding_used"] is False
          assert g["absolute_volume_used"] is False
          assert g["provider_volume_rule_used"] is False
          assert g["partial_exit_required"] is False
          assert g["opens_new_holdout"] is False
          assert g["policy_promoted"] is False
          assert g["candidate_certified"] is False
          assert g["live_authorized"] is False
          assert g["real_capital_authorized"] is False
          assert g["production_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-universal-target-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-universal-target-*-${{ github.sha }}
          path: input
          merge-multiple: true
      - name: Aggregate frontier
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          folds=("r5","r6","r8","consumed")
          variants=(
              "BASELINE_DOL1",
              "DEEP_DOL2",
              "FVG_DEEP_DOL2",
              "FVG_DEEP_SUPPORTIVE_DOL2",
          )
          payloads={
              f:json.loads(Path(f"input/target-{f}.json").read_text())
              for f in folds
          }
          def d(v): return Decimal(str(v))

          summary={}
          for v in variants:
              summary[v]={}
              for f in folds:
                  r=payloads[f]["variant_reports"][v]
                  summary[v][f]={
                      "terminal_count":r["terminal_count"],
                      "extended_trade_count":r["extended_trade_count"],
                      "metrics":r["normalized_metrics"],
                      "winner_preservation":r["winner_preservation_vs_baseline"],
                      "side_metrics":r["side_metrics"],
                      "halfyear_metrics":r["halfyear_metrics"],
                  }

          baseline="BASELINE_DOL1"
          gates={}
          for v in variants[1:]:
              fold_gates={}
              for f in folds:
                  c=summary[v][f]["metrics"]
                  b=summary[baseline][f]["metrics"]
                  w=summary[v][f]["winner_preservation"]
                  fold_gates[f]={
                      "pf_nondegrade":(
                          c["profit_factor"] is not None
                          and b["profit_factor"] is not None
                          and d(c["profit_factor"])>=d(b["profit_factor"])
                      ),
                      "mean_nondegrade":d(c["mean_r"])>=d(b["mean_r"]),
                      "dd_nondegrade":d(c["max_drawdown_r"])<=d(b["max_drawdown_r"]),
                      "winner_count_ge_80":(
                          w is not None
                          and d(w["winner_count_preservation"])>=d("0.80")
                      ),
                      "winner_r_ge_90":(
                          w is not None
                          and d(w["winner_r_preservation"])>=d("0.90")
                      ),
                  }
              gates[v]={
                  "folds":fold_gates,
                  "cross_fold_survivor":all(
                      all(x.values()) for x in fold_gates.values()
                  ),
              }

          report={
              "schema":"qore.vt31.nas100.universal_target_extension.aggregate.v1",
              "head":"${{ github.sha }}",
              "summary":summary,
              "gates":gates,
              "survivors":[
                  v for v in variants[1:]
                  if gates[v]["cross_fold_survivor"]
              ],
              "governance":{
                  "consumed_evidence_only":True,
                  "partial_exit_required":False,
                  "absolute_volume_used":False,
                  "fresh_holdout_opened":False,
                  "policy_promoted":False,
                  "candidate_certified":False,
              },
          }
          Path("result/aggregate.json").write_text(
              json.dumps(report,sort_keys=True,indent=2)+"\n"
          )
          print(json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-universal-target-aggregate-${{ github.sha }}
          path: result/
          retention-days: 90
