name: QORE Shared VT08 Competing Risk Calibration V9

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - scripts/vt08_index_shared_competing_risk_calibration_v9.py
      - .github/workflows/qore-shared-vt08-competing-risk-calibration-v9.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  competing-risk-calibration-v9:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout Shared
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: |
          pip install -e ".[dev]"
          pip install "scikit-learn==1.8.0"

      - name: Static validation
        run: |
          ruff check scripts/vt08_index_shared_competing_risk_calibration_v9.py
          python -m py_compile scripts/vt08_index_shared_competing_risk_calibration_v9.py

      - name: Download frozen V6 consumed ledger
        uses: actions/download-artifact@v4
        with:
          name: qore-shared-vt08-stop-target-discrimination-v6-1a534d0ae735efef4dcbc0c0be4b110ceaa80501
          path: artifacts/v6
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36131607443

      - name: Run V9 competing-risk calibration
        run: |
          mkdir -p artifacts/v9
          python scripts/vt08_index_shared_competing_risk_calibration_v9.py             --v6-json artifacts/v6/vt08-index-shared-stop-target-discrimination-v6.json             --out artifacts/v9/vt08-index-shared-competing-risk-calibration-v9.json             | tee artifacts/v9/summary.json

      - name: Validate V9 governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(
              Path(
                  "artifacts/v9/"
                  "vt08-index-shared-competing-risk-calibration-v9.json"
              ).read_text()
          )
          assert p["identity"] == "QORE_SHARED_VT08_COMPETING_RISK_CALIBRATION_V9"
          assert p["source_v6_run"] == 36131607443
          assert p["source_shared_head"] == "1a534d0ae735efef4dcbc0c0be4b110ceaa80501"
          assert p["research_only"] is True
          assert p["consumed_evidence_only"] is True
          assert p["train_window"] == "five_year"
          assert p["validation_windows"] == [
              "recent_two_year",
              "r66_consumed_failed_holdout",
          ]
          assert p["outcome_used_for_offline_training_only"] is True
          assert p["runtime_outcome_input"] is False
          assert p["future_market_input"] is False
          assert p["sizing_used"] is False
          assert p["risk_weighting_used"] is False
          assert p["trailing_used"] is False
          assert p["target_extension_used"] is False
          assert p["runtime_actuation"] is False
          assert p["model"]["type"] == "L2_LOGISTIC_COMPETING_RISK_RESEARCH"

          for key in (
              "five_year",
              "recent_two_year",
              "r66_consumed_failed_holdout",
          ):
              w=p["windows"][key]
              assert w["status"] in {
                  "ADMIT_FOR_NEXT_RESEARCH",
                  "REJECT",
              }
              assert "weighted_brier" in w
              assert "weighted_auc" in w
              assert "precision" in w
              assert "loss_recall" in w
              assert "winner_mark_rate" in w
              assert "median_lead_bars" in w

          print(json.dumps({
              "validation_pass":p["validation_pass"],
              "threshold":p["model"]["threshold"],
              "training":p["training_threshold_metrics"],
              "recent_two_year":p["windows"]["recent_two_year"],
              "r66":p["windows"]["r66_consumed_failed_holdout"],
          },sort_keys=True))
          PY

      - name: Bind result
        run: |
          cd artifacts/v9
          echo "$GITHUB_SHA" > shared-git-sha.txt
          echo "36131607443" > source-v6-run.txt
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-vt08-competing-risk-calibration-v9-${{ github.sha }}
          path: artifacts/v9/
          if-no-files-found: error
          retention-days: 90
