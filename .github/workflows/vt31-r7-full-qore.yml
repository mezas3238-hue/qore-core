name: QORE VT-31 R7 Full QORE

on:
  push:
    branches:
      - agent/vt31-r7-raid-resolution-001
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy strict project gate
        run: mypy src tests
      - name: Pytest full project gate
        run: pytest --cov=src/qore --cov-report=term-missing
