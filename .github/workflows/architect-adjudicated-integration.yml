name: TEMP Architect Adjudicated Story Integration

on:
  push:
    branches:
      - agent/trader-story-forensics-adjudicated-integration-001
    paths:
      - .github/architect-adjudicated-integration-trigger

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact adjudicated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply Work plus Architect provenance hardening
        run: python .github/architect_story_provenance_patch.py
      - name: Apply Architect thesis-panel integrity hardening
        run: python .github/architect_thesis_panel_integrity_patch.py
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff adjudicated candidate
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/first_cohort_story_forensics.py \
            src/qore/infrastructure/trader_lab/story_forensics_visual_package.py \
            src/qore/infrastructure/trader_lab/story_forensics_eleven_market_thesis.py \
            tests/infrastructure/trader_lab/test_first_cohort_story_forensics.py \
            tests/infrastructure/trader_lab/test_story_forensics_visual_package.py \
            tests/infrastructure/trader_lab/test_story_forensics_eleven_market_thesis.py
      - name: Mypy adjudicated candidate
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/first_cohort_story_forensics.py \
            src/qore/infrastructure/trader_lab/story_forensics_visual_package.py \
            src/qore/infrastructure/trader_lab/story_forensics_eleven_market_thesis.py \
            tests/infrastructure/trader_lab/test_first_cohort_story_forensics.py \
            tests/infrastructure/trader_lab/test_story_forensics_visual_package.py \
            tests/infrastructure/trader_lab/test_story_forensics_eleven_market_thesis.py
      - name: Pytest adjudicated regressions
        run: |
          pytest -q \
            tests/infrastructure/trader_lab/test_first_cohort_story_forensics.py \
            tests/infrastructure/trader_lab/test_first_cohort_market_story_forensics.py \
            tests/infrastructure/trader_lab/test_first_cohort_market_thesis_evidence.py \
            tests/infrastructure/trader_lab/test_first_cohort_eleven_market_research_dossier.py \
            tests/infrastructure/trader_lab/test_story_forensics_visual_package.py \
            tests/infrastructure/trader_lab/test_story_forensics_eleven_market_thesis.py \
            tests/infrastructure/trader_lab/test_story_forensics_lightweight_renderer.py \
            tests/infrastructure/trader_lab/test_story_forensics_filmstrip_renderer.py \
            tests/infrastructure/trader_lab/test_story_forensics_review_panel.py \
            tests/infrastructure/trader_lab/test_story_forensics_session_intelligence.py
      - name: Verify exact mutation scope
        run: |
          git diff --exit-code -- \
            .github/architect_story_provenance_patch.py \
            .github/architect_thesis_panel_integrity_patch.py \
            .github/workflows/architect-adjudicated-integration.yml \
            .github/architect-adjudicated-integration-trigger
          CHANGED="$(git diff --name-only | sort -u)"
          EXPECTED="$(printf '%s\n' \
            src/qore/infrastructure/trader_lab/first_cohort_story_forensics.py \
            src/qore/infrastructure/trader_lab/story_forensics_visual_package.py \
            src/qore/infrastructure/trader_lab/story_forensics_eleven_market_thesis.py \
            tests/infrastructure/trader_lab/test_first_cohort_story_forensics.py \
            tests/infrastructure/trader_lab/test_story_forensics_visual_package.py \
            tests/infrastructure/trader_lab/test_story_forensics_eleven_market_thesis.py | sort)"
          printf '%s\n' "$CHANGED"
          test "$CHANGED" = "$EXPECTED"
      - name: Commit verified adjudicated hardening
        run: |
          git config user.name "qore-architect-bot"
          git config user.email "qore-architect-bot@users.noreply.github.com"
          git add \
            src/qore/infrastructure/trader_lab/first_cohort_story_forensics.py \
            src/qore/infrastructure/trader_lab/story_forensics_visual_package.py \
            src/qore/infrastructure/trader_lab/story_forensics_eleven_market_thesis.py \
            tests/infrastructure/trader_lab/test_first_cohort_story_forensics.py \
            tests/infrastructure/trader_lab/test_story_forensics_visual_package.py \
            tests/infrastructure/trader_lab/test_story_forensics_eleven_market_thesis.py
          git commit -m "fix(trader-lab): close adjudicated Story integrity gaps"
          git push origin HEAD:${GITHUB_REF_NAME}
