name: QORE CIBO Architect A2 Capital Science Engineering Closure

on:
  push:
    branches:
      - agent/cibo-architect-a2-capital-science-001
    paths:
      - '.github/workflows/cibo-architect-a2-capital-science-engineering-closure.yml'
      - 'src/qore/infrastructure/cibo_arch_a2_integrator_handoff.py'
      - 'tests/infrastructure/test_cibo_arch_a2_integrator_handoff.py'
      - 'docs/research/CIBO-ARCH-A2-CAPITAL-SCIENCE-ENGINEERING-CLOSURE-V1.md'
  pull_request:
    paths:
      - '.github/workflows/cibo-architect-a2-capital-science-engineering-closure.yml'
      - 'src/qore/infrastructure/cibo_arch_a2_integrator_handoff.py'
      - 'tests/infrastructure/test_cibo_arch_a2_integrator_handoff.py'
      - 'docs/research/CIBO-ARCH-A2-CAPITAL-SCIENCE-ENGINEERING-CLOSURE-V1.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capital-science-engineering-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Prove Capital Science local engineering closure
        run: |
          ruff check \
            src/qore/infrastructure/cibo_arch_a2_integrator_handoff.py \
            tests/infrastructure/test_cibo_arch_a2_integrator_handoff.py
          mypy src/qore/infrastructure/cibo_arch_a2_integrator_handoff.py
          python -m py_compile \
            src/qore/infrastructure/cibo_arch_a2_integrator_handoff.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_arch_a2_integrator_handoff.py
