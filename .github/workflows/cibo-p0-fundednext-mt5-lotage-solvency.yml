name: CIBO P0 FundedNext MT5 Lotage Solvency Tests
on:
  push:
    branches: [agent/cibo-p0-fundednext-real-mt5-lotage-financing-001]
    paths:
      - '.github/workflows/cibo-p0-fundednext-mt5-lotage-solvency.yml'
      - 'src/qore/infrastructure/trader_lab/cibo_fundednext_mt5_lotage_p0.py'
      - 'tests/trader_lab/test_cibo_fundednext_mt5_lotage_p0.py'
      - 'src/qore/infrastructure/trader_lab/cibo_four_motor_fundednext_p0.py'
      - 'tests/trader_lab/test_cibo_four_motor_fundednext_p0.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  broker-executable-sizing-without-fake-orders:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Six-market MT5 profit and margin tests; risk < USD3 including costs
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m py_compile src/qore/infrastructure/trader_lab/cibo_fundednext_mt5_lotage_p0.py
          python -m unittest discover -s tests/trader_lab -p 'test_cibo_fundednext_mt5_lotage_p0.py' -v
          echo 'CIBO_P0_MT5_6_MARKETS_RISK_FUNDED_TESTS=PASS'
