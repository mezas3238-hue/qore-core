name: QORE Capitalizer V3 SOURCE_FIRST WAIT5 LATE60 CE50 2Y V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-v3-source-first-wait5-late60-ce50-2y-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v3_source_first_wait5_late60_ce50_2y_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v3_source_first_wait5_late60_ce50_2y_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-v3-source-first-wait5-late60-ce50-2y-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  WAIT5_RUN_ID: '35844549291'
  WAIT5_SHA: '32bd64963a34b762723416c01cf8a016fd86daab'
  FUNNEL_RUN_ID: '35847723760'
  FUNNEL_SHA: 'e099f14092c8ab547137b6a3e59a3a1df9344b9e'
  ANATOMY_RUN_ID: '35849395559'
  ANATOMY_SHA: 'e5f928eba549500bb9af10d90d5c07fb05e83b78'
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_v3_source_first_wait5_late60_ce50_2y_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_v3_source_first_wait5_late60_ce50_2y_v1.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_v3_source_first_wait5_late60_ce50_2y_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_v3_source_first_wait5_late60_ce50_2y_v1.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol: [USDJPY, AUDJPY, AUDUSD, GBPJPY, EURUSD, GBPUSD, XAUUSD, USDCAD, NAS100]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download frozen WAIT5 market ledger
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-v3-source-first-wait5-2y-v1-${{ matrix.symbol }}-${{ env.WAIT5_SHA }}
          path: wait5-source
          github-token: ${{ github.token }}
          run-id: ${{ env.WAIT5_RUN_ID }}
      - name: Download frozen funnel atlas
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-v3-source-first-wait5-funnel-atlas-2y-v1-${{ matrix.symbol }}-${{ env.FUNNEL_SHA }}
          path: funnel-source
          github-token: ${{ github.token }}
          run-id: ${{ env.FUNNEL_RUN_ID }}
      - name: Download frozen fill-miss anatomy
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-v3-source-first-fill-miss-anatomy-2y-v1-${{ matrix.symbol }}-${{ env.ANATOMY_SHA }}
          path: anatomy-source
          github-token: ${{ github.token }}
          run-id: ${{ env.ANATOMY_RUN_ID }}
      - name: Download immutable native-M1 clone
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Run isolated WAIT5 LATE60 CE50 replay
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v3_source_first_wait5_late60_ce50_2y_v1 \
            market wait5-source funnel-source anatomy-source m1-source ce50-output
      - name: Enforce market invariants
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"]
          report = json.loads(
              (
                  Path("ce50-output")
                  / f"capitalizer-{symbol.lower()}-v3-source-first-wait5-late60-ce50-2y-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_V3_SOURCE_FIRST_WAIT5_LATE60_CE50_2Y_V1"
          )
          assert report["symbol"] == symbol
          assert report["variant_only_change"] == (
              "WAIT5_NORMAL_FILL_MISSING_LATE60_CE50_ONLY"
          )
          assert report["same_source_first_mss_preserved"] is True
          assert report["same_fvg_zone_preserved"] is True
          assert report["same_ce50_definition_preserved"] is True
          assert report["post_h1_overlap_entry_allowed"] is False
          assert report["same_stop_preserved"] is True
          assert report["same_target_rule_preserved"] is True
          assert report["entry_window_extended_minutes"] == 60
          assert report["new_mss_allowed"] is False
          assert report["new_fvg_allowed"] is False
          assert report["outcome_used_for_admission"] is False
          assert report["fresh_holdout_claimed"] is False
          assert report["economic_candidate"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v3-source-first-wait5-late60-ce50-2y-v1-${{ matrix.symbol }}-${{ github.sha }}
          path: ce50-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v3-source-first-wait5-late60-ce50-2y-v1-*-${{ github.sha }}
          path: ce50-input
          merge-multiple: false
      - name: Build nine-market CE50 matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v3_source_first_wait5_late60_ce50_2y_v1 \
            matrix ce50-input matrix-output
      - name: Enforce aggregate controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "matrix-output/"
                  "capitalizer-nine-market-v3-source-first-wait5-late60-ce50-2y-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_NINE_MARKET_V3_SOURCE_FIRST_WAIT5_LATE60_CE50_2Y_V1"
          )
          assert report["market_count"] == 9
          assert report["baseline_wait5_raw_control"] == 1003
          assert report["baseline_wait5_raw_control_reproduced"] is True
          assert report["clean_late_rows"] == 376
          assert report["clean_late_control_reproduced"] is True
          assert report["variant_only_change"] == (
              "WAIT5_NORMAL_FILL_MISSING_LATE60_CE50_ONLY"
          )
          assert report["post_h1_overlap_entry_allowed"] is False
          assert report["outcome_used_for_admission"] is False
          assert report["fresh_holdout_claimed"] is False
          assert report["economic_candidate"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-nine-market-v3-source-first-wait5-late60-ce50-2y-v1-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
