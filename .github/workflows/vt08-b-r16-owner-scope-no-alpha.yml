name: VT08 B R16 Owner Scope Excludes QORE Alpha

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vt08-5m-cognition-replay-20261010
    paths:
      - src/qore/infrastructure/trader_lab/vt08_b_r16_owner_scope_no_alpha_v1.py
      - tests/infrastructure/trader_lab/test_vt08_b_r16_owner_scope_no_alpha_v1.py
      - .github/workflows/vt08-b-r16-owner-scope-no-alpha.yml
      - docs/research/VT08_OWNER_SCOPE_CURRENT_ONLY_NO_QORE_ALPHA_2026-10-15.md

permissions:
  contents: read
  actions: read

jobs:
  owner-source-only-vt08-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        market: [EURJPY, USDCHF, NZDUSD, CADJPY, USDCAD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - name: Lint and adversarial excluded-program regression
        run: |
          ruff check src/qore/infrastructure/trader_lab/vt08_b_r16_owner_scope_no_alpha_v1.py tests/infrastructure/trader_lab/test_vt08_b_r16_owner_scope_no_alpha_v1.py
          pytest -q tests/infrastructure/trader_lab/test_vt08_b_r16_owner_scope_no_alpha_v1.py
      - uses: actions/download-artifact@v4
        with:
          name: vt08-a-frozen-m30m3-firstfail-${{ matrix.market }}-394116f13449fc310d7fbc5f0b5f60aa1bb247d4
          path: a-r3/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 38715560333
      - name: Audit all original VT08 source-positive identities, no alpha leakage
        env:
          MARKET: ${{ matrix.market }}
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json, os
          from pathlib import Path
          from qore.infrastructure.trader_lab.vt08_b_r16_owner_scope_no_alpha_v1 import (
              audit_frozen_source_program_scope, assert_single_vt08_current_manifest,
              AUTHORITY,
          )
          market=os.environ["MARKET"]
          paths=list(Path("a-r3",market).rglob(market+"-frozen-source-firstfail.json"))
          if len(paths)!=1:
              raise SystemExit("R16 requires pinned original frozen VT08 source")
          report=json.loads(paths[0].read_text(encoding="utf-8"))
          result=audit_frozen_source_program_scope(report,expected_market=market)
          src_manifest={
              **AUTHORITY, "sizing_used":False,
              "holdout_7y_accessed":False, "orders_enabled":False,
              "author_source_complete":False, "cognitive_admitted":False,
              "broker_fills":0,
          }
          assert_single_vt08_current_manifest(src_manifest)
          if (result["alternate_programs_authorized"] != 0 or
              result["source_author_complete"] != 0 or
              result["cognitive_admissions"] != 0 or
              result["broker_fills"] != 0):
              raise SystemExit("R16 forbidden track or false authorization")
          evidence=Path("evidence",market+"-VT08-owner-excludes-alpha.json")
          evidence.write_text(
              json.dumps(result,sort_keys=True,separators=(",",":"),allow_nan=False),
              encoding="utf-8",
          )
          print(json.dumps(result,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vt08-b-r16-no-alpha-${{ matrix.market }}-${{ github.sha }}
          path: evidence/*.json
          if-no-files-found: error
          retention-days: 30
