name: QORE VT31 NAS100 Live Path Consistency Audit V1

on:
  push:
    branches:
      - agent/vt31-nas100-hypothesis-lifecycle-v1
    paths:
      - scripts/vt31_nas100_live_path_consistency_audit_v1.py
      - .github/workflows/vt31-nas100-live-path-consistency-audit-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed_holdout
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Static gate
        run: |
          python -m py_compile scripts/vt31_nas100_live_path_consistency_audit_v1.py
          ruff check scripts/vt31_nas100_live_path_consistency_audit_v1.py
      - name: Recover evidence
        run: |
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"
      - name: Audit live path consistency
        run: |
          python scripts/vt31_nas100_live_path_consistency_audit_v1.py \
            "input/${EVIDENCE_PATH}" \
            --partition "$PARTITION" \
            --output "result/audit-${PARTITION}.json" \
            | tee "result/summary-${PARTITION}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-live-path-audit-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-live-path-audit-*-${{ github.sha }}
          path: input
          merge-multiple: true
      - name: Aggregate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          folds={}
          for path in Path("input").glob("audit-*.json"):
              p=json.loads(path.read_text())
              folds[p["partition"]]=p
          assert set(folds)=={"r5","r6","r8","consumed_holdout"}
          report={
              "schema":"qore.vt31.nas100.live_path_consistency_audit.aggregate.v1",
              "all_folds_path_consistent":all(p["path_consistent_for_single_position"] for p in folds.values()),
              "folds":{k:{"counts":v["counts"],"path_consistent":v["path_consistent_for_single_position"]} for k,v in sorted(folds.items())},
          }
          Path("aggregate.json").write_text(json.dumps(report,sort_keys=True,indent=2)+"\n")
          print(json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-live-path-audit-aggregate-${{ github.sha }}
          path: aggregate.json
          retention-days: 90
