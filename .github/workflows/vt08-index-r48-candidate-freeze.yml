name: VT08 Index R48 Candidate Freeze

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r48-candidate-freeze.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r48_candidate_freeze.py
      - tests/infrastructure/trader_lab/test_vt08_index_r48_candidate_freeze.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r48_candidate_freeze.py

  freeze:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Materialize immutable R47 freeze
        run: |
          python -m qore.infrastructure.trader_lab.vt08_index_r48_candidate_freeze \
            --out artifacts/report/vt08-index-r48-candidate-freeze.json

      - name: Verify frozen identity and governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(Path("artifacts/report/vt08-index-r48-candidate-freeze.json").read_text())
          assert report["freeze_id"] == "VT08_INDEX_R48_R47_CANDIDATE_FREEZE_001"
          assert report["candidate_id"] == "VT08_INDEX_R47_TRANSPORT_SAFE_STRUCTURAL_DEMOTION_001"
          assert report["candidate_rule_fingerprint"] == "013bffb847dff546cdb2a31ac9931bdb1336596c540f6a72c5c729d1762c36c8"
          assert report["dependency_contract_matches"] is True
          assert report["five_year"]["sample"] == 2448
          assert report["recent_two_year"]["sample"] == 1017
          g=report["governance"]
          assert g["candidate_frozen"] is True
          assert g["robustness_retuning_permitted"] is False
          assert g["walk_forward_retuning_permitted"] is False
          assert g["stress_retuning_permitted"] is False
          assert g["bootstrap_retuning_permitted"] is False
          assert g["certified"] is False
          assert g["live_authorized"] is False
          assert g["real_capital_authorized"] is False
          assert g["production_authorized"] is False
          PY

      - name: Upload R48 freeze evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-index-r48-candidate-freeze-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
