name: QORE Capitalizer V48 Three Session Scalping Census

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-v48-three-session-scalp-census.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_generic_scalp_census_v48.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_three_session_coverage_gate_v48.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_ttrades_structural_cisd_v48.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_ttrades_m1_cisd_observer_v48.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_ttrades_continuation_v48.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_ttrades_m1_fvg_cisd_continuation_v48.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_source_observation_detectors_v2.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_source_poi_v2.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_generic_scalp_census_v48.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_three_session_coverage_gate_v48.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_ttrades_structural_cisd_v48.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_ttrades_continuation_v48.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_ttrades_m1_fvg_cisd_continuation_v48.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-v48-three-session-scalp-census-${{ github.sha }}
  cancel-in-progress: false

env:
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_generic_scalp_census_v48.py \
            src/qore/infrastructure/trader_lab/capitalizer_three_session_coverage_gate_v48.py \
            src/qore/infrastructure/trader_lab/capitalizer_ttrades_structural_cisd_v48.py \
            src/qore/infrastructure/trader_lab/capitalizer_ttrades_continuation_v48.py \
            src/qore/infrastructure/trader_lab/capitalizer_ttrades_m1_fvg_cisd_continuation_v48.py \
            tests/infrastructure/trader_lab/test_capitalizer_generic_scalp_census_v48.py \
            tests/infrastructure/trader_lab/test_capitalizer_three_session_coverage_gate_v48.py \
            tests/infrastructure/trader_lab/test_capitalizer_ttrades_structural_cisd_v48.py \
            tests/infrastructure/trader_lab/test_capitalizer_ttrades_continuation_v48.py \
            tests/infrastructure/trader_lab/test_capitalizer_ttrades_m1_fvg_cisd_continuation_v48.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_generic_scalp_census_v48.py \
            src/qore/infrastructure/trader_lab/capitalizer_three_session_coverage_gate_v48.py \
            src/qore/infrastructure/trader_lab/capitalizer_ttrades_structural_cisd_v48.py \
            src/qore/infrastructure/trader_lab/capitalizer_ttrades_continuation_v48.py \
            src/qore/infrastructure/trader_lab/capitalizer_ttrades_m1_fvg_cisd_continuation_v48.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_generic_scalp_census_v48.py \
            tests/infrastructure/trader_lab/test_capitalizer_three_session_coverage_gate_v48.py \
            tests/infrastructure/trader_lab/test_capitalizer_ttrades_structural_cisd_v48.py \
            tests/infrastructure/trader_lab/test_capitalizer_ttrades_continuation_v48.py \
            tests/infrastructure/trader_lab/test_capitalizer_ttrades_m1_fvg_cisd_continuation_v48.py

  census:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - symbol: USDJPY
            session: ASIA
          - symbol: AUDJPY
            session: ASIA
          - symbol: AUDUSD
            session: ASIA
          - symbol: GBPJPY
            session: ASIA
          - symbol: EURUSD
            session: LONDON
          - symbol: GBPUSD
            session: LONDON
          - symbol: XAUUSD
            session: NEW_YORK
          - symbol: USDCAD
            session: NEW_YORK
          - symbol: NAS100
            session: NEW_YORK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download retained provider-native M1
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Verify retained M1 provenance
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path("m1-source/m1-clone-manifest.json").read_text())
          assert result["identity"] == "QORE_CAPITALIZER_CIBO_10Y_NATIVE_M1_CLONE_V1"
          assert result["canonical_symbol"] == os.environ["EXPECTED_SYMBOL"]
          assert result["target_start"] == "2016-09-17T00:00:00+00:00"
          assert result["target_end_exclusive"] == "2026-09-17T00:00:00+00:00"
          assert result["provider_native_m1"] is True
          assert result["synthetic_m1"] is False
          assert result["interpolated_m1"] is False
          assert result["contradictory_m1"] == 0
          assert result["read_only"] is True
          assert result["live_authorized"] is False
          assert result["real_capital_authorized"] is False
          PY
      - name: Run V48 pre-economic market census
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_generic_scalp_census_v48 \
            market m1-source market-output --session "${{ matrix.session }}"
      - name: Enforce market census epistemic boundary
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
          EXPECTED_SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"]
          path = Path("market-output") / (
              f"capitalizer-{symbol.lower()}-v48-scalp-pre-economic-census.json"
          )
          result = json.loads(path.read_text())
          assert result["identity"] == "QORE_CAPITALIZER_V48_GENERIC_SCALP_PRE_ECONOMIC_CENSUS"
          assert result["symbol"] == symbol
          assert result["session"] == os.environ["EXPECTED_SESSION"]
          assert result["census_is_lower_bound"] is True
          assert result["continuation_families_implemented"] == [
              "LIQUIDITY_SWEEP_CISD",
              "FVG_RETRACE_CISD",
          ]
          assert result["fvg_cisd_continuation_implemented"] is True
          assert result["outcome_used"] is False
          assert result["economics_calculated"] is False
          assert result["fresh_holdout_used"] is False
          assert result["trader_certified"] is False
          assert result["live_authorized"] is False
          assert result["real_capital_authorized"] is False
          assert result["source_complete_opportunities"] >= 0
          PY
      - name: Upload market census
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v48-scalp-census-${{ matrix.symbol }}-${{ github.sha }}
          path: market-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: census
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download nine market census artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v48-scalp-census-*-${{ github.sha }}
          path: market-reports
          merge-multiple: false
      - name: Build V48 three-session matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_generic_scalp_census_v48 \
            matrix market-reports matrix-output
      - name: Upload matrix before coverage adjudication
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v48-three-session-scalp-census-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
      - name: Enforce three-session pre-economic operability gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path(
                  "matrix-output/capitalizer-v48-nine-market-three-session-scalp-census.json"
              ).read_text()
          )
          assert result["identity"] == (
              "QORE_CAPITALIZER_V48_NINE_MARKET_THREE_SESSION_SCALP_CENSUS"
          )
          assert result["market_count"] == 9
          assert result["session_count"] == 3
          assert result["missing_market_rows"] == []
          assert result["empty_sessions"] == []
          assert result["coverage_decision"] == "COMPLETE_PRE_ECONOMIC"
          assert set(result["by_session"]) == {"ASIA", "LONDON", "NEW_YORK"}
          assert result["census_is_lower_bound"] is True
          assert result["h4_routes_included"] is False
          assert result["outcome_used"] is False
          assert result["economics_calculated"] is False
          assert result["fresh_holdout_used"] is False
          assert result["trader_certified"] is False
          assert result["live_authorized"] is False
          assert result["real_capital_authorized"] is False
          PY
