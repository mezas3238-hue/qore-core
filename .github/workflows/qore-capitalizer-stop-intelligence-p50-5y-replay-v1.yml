name: QORE Capitalizer Stop Intelligence P50 5Y Replay V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-stop-intelligence-p50-5y-replay-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_stop_intelligence_p50_5y_replay_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_stop_intelligence_p50_5y_replay_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-stop-intelligence-p50-5y-replay-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'
  HOLD_FORENSICS_RUN_ID: '35583377247'
  HOLD_FORENSICS_SHA: 'e69998808dbbb0f57a51622c096b0a4f30006af1'
  HOLD_PEN_RUN_ID: '35592309957'
  HOLD_PEN_SHA: 'd7b4f397ae88b1e3dc1ad558e2ccb2284268aea5'
  CONTEXT_RUN_ID: '35617959607'
  ENVELOPE_RUN_ID: '35617959576'
  MODEL_SHA: '04e81fb09512c7998911c5815285865de40b3583'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_stop_intelligence_p50_5y_replay_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_stop_intelligence_p50_5y_replay_v1.py
      - name: Mypy
        run: |
          mypy src/qore/infrastructure/trader_lab/capitalizer_stop_intelligence_p50_5y_replay_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_stop_intelligence_p50_5y_replay_v1.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {symbol: USDJPY, session: ASIA}
          - {symbol: AUDJPY, session: ASIA}
          - {symbol: AUDUSD, session: ASIA}
          - {symbol: GBPJPY, session: ASIA}
          - {symbol: EURUSD, session: LONDON}
          - {symbol: GBPUSD, session: LONDON}
          - {symbol: XAUUSD, session: NEW_YORK}
          - {symbol: USDCAD, session: NEW_YORK}
          - {symbol: NAS100, session: NEW_YORK}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable native-M1 clone
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Download consumed holdout penetration
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-ob-penetration-${{ matrix.symbol }}-${{ env.HOLD_PEN_SHA }}
          path: holdout-penetration
          github-token: ${{ github.token }}
          run-id: ${{ env.HOLD_PEN_RUN_ID }}
      - name: Download consumed holdout forensics
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-m1-loss-causal-forensics-${{ matrix.symbol }}-${{ env.HOLD_FORENSICS_SHA }}
          path: holdout-forensics
          github-token: ${{ github.token }}
          run-id: ${{ env.HOLD_FORENSICS_RUN_ID }}
      - name: Download development-only context model
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-stop-breathing-context-${{ matrix.symbol }}-${{ env.MODEL_SHA }}
          path: context-model
          github-token: ${{ github.token }}
          run-id: ${{ env.CONTEXT_RUN_ID }}
      - name: Download development-only P50 envelope
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-market-breathing-envelope-${{ matrix.symbol }}-${{ env.MODEL_SHA }}
          path: envelope-model
          github-token: ${{ github.token }}
          run-id: ${{ env.ENVELOPE_RUN_ID }}
      - name: Replay conservative P50 Stop Intelligence
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_stop_intelligence_p50_5y_replay_v1 \
            market \
            holdout-penetration holdout-forensics \
            context-model envelope-model \
            m1-source replay-output
      - name: Enforce candidate governance
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
          EXPECTED_SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"]
          path = Path("replay-output") / (
              f"capitalizer-{symbol.lower()}-stop-intelligence-p50-5y-replay-v1.json"
          )
          report = json.loads(path.read_text())
          assert report["identity"] == "QORE_CAPITALIZER_STOP_INTELLIGENCE_P50_5Y_REPLAY_V1"
          assert report["candidate_identity"] == "QORE_CAPITALIZER_STOP_INTELLIGENCE_CONSERVATIVE_P50_V1"
          assert report["symbol"] == symbol
          assert report["session"] == os.environ["EXPECTED_SESSION"]
          assert report["source_trade_count"] > 0
          assert report["coherent_candidate_trades"] > 0
          assert report["quantile"] == "P50"
          assert report["context_thresholds_development_only"] is True
          assert report["envelope_development_only"] is True
          assert report["consumed_holdout_used_for_threshold_selection"] is False
          assert report["consumed_holdout_used_for_quantile_selection"] is False
          assert report["entry_changed"] is False
          assert report["target_changed"] is False
          assert report["methodology_changed"] is False
          assert report["same_minute_precedence"] == "STOP_FIRST_FAIL_CLOSED"
          assert report["post_entry_stop_widening_allowed"] is False
          assert report["fresh_holdout_claimed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["economic_candidate"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-stop-intelligence-p50-5y-${{ matrix.symbol }}-${{ github.sha }}
          path: replay-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-stop-intelligence-p50-5y-*-${{ github.sha }}
          path: replay-input
          merge-multiple: false
      - name: Build nine-market P50 replay matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_stop_intelligence_p50_5y_replay_v1 \
            matrix replay-input matrix-output
      - name: Enforce nine-market research boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "matrix-output/capitalizer-nine-market-stop-intelligence-p50-5y-matrix-v1.json"
              ).read_text()
          )
          assert report["identity"] == "QORE_CAPITALIZER_STOP_INTELLIGENCE_P50_5Y_MATRIX_V1"
          assert report["market_count"] == 9
          assert report["source_trade_count"] == 10991
          assert report["quantile"] == "P50"
          assert report["context_thresholds_development_only"] is True
          assert report["envelope_development_only"] is True
          assert report["consumed_holdout_used_for_threshold_selection"] is False
          assert report["consumed_holdout_used_for_quantile_selection"] is False
          assert report["entry_changed"] is False
          assert report["target_changed"] is False
          assert report["methodology_changed"] is False
          assert report["post_entry_stop_widening_allowed"] is False
          assert report["fresh_holdout_claimed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["economic_candidate"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-nine-market-stop-intelligence-p50-5y-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
