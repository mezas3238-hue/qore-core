name: QORE Native H4-GROSS-02 XAUUSD countertrend 12h vs 4h (research only)

on:
  push:
    branches:
      - research/qore-native-h4-gross02-xauusd-reversion-20261012
    paths:
      - '.github/workflows/qore-native-h4-gross02-xauusd.yml'
      - 'src/qore/infrastructure/trader_lab/qore_native_h4_gross02_xauusd_v1.py'
      - 'tests/infrastructure/trader_lab/test_qore_native_h4_gross02_xauusd_v1.py'
      - 'docs/research/QORE_NATIVE_H4_GROSS02_XAUUSD_PREOUTCOME_PREREG_2026-10-12.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-native-h4-gross02-${{ github.ref }}
  cancel-in-progress: false

jobs:
  freeze_and_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Require prereg commit ancestry and 97.5% CI causal tests before OHLC
        run: |
          set -euo pipefail
          git cat-file -e "94bc58e89b5b2112e1c65df77a077bff2758b63c^{commit}"
          git merge-base --is-ancestor 94bc58e89b5b2112e1c65df77a077bff2758b63c "$GITHUB_SHA"
          test -s docs/research/QORE_NATIVE_H4_GROSS02_XAUUSD_PREOUTCOME_PREREG_2026-10-12.md
          ruff check --select F,E4,E7,E9 src/qore/infrastructure/trader_lab/qore_native_h4_gross02_xauusd_v1.py tests/infrastructure/trader_lab/test_qore_native_h4_gross02_xauusd_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_qore_native_h4_gross02_xauusd_v1.py

  one_gold_gross_experiment:
    needs: freeze_and_tests
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Freeze original Atlas 12-market manifest, no new brokerage calls
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-aggregate-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          run-id: '35166210458'
          github-token: ${{ github.token }}
          path: original-aggregate
      - name: Retrieve ONLY XAUUSD original provider-native M5 10Y
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-XAUUSD-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          run-id: '35166210458'
          github-token: ${{ github.token }}
          path: original-gold
      - name: One frozen causal contrarian gross trial; 2024-26 price quarantine
        run: |
          python -m qore.infrastructure.trader_lab.qore_native_h4_gross02_xauusd_v1 original-gold original-aggregate gross02
          python - <<'PY'
          from pathlib import Path
          import json
          a=json.loads(Path("gross02/qore-native-h4-gross02-xauusd.json").read_text())
          assert a["prereg_commit_before_outcomes"]=="94bc58e89b5b2112e1c65df77a077bff2758b63c"
          assert a["source_symbol"]=="XAUUSD" and a["raw_11_annual_sha_verified"]
          assert a["reserved_2024_09_17_onward_OHLC_not_accessed"] is True
          assert a["net_certified"] is False
          assert a["news_calendar_known_asof_verified"] is False
          assert "delta_bootstrap_week_CI97_5" in a["development"]
          assert "delta_bootstrap_week_CI97_5" in a["temporal_diagnostic"]
          assert a["capital_or_live_authorized"] is False
          assert a["traders_certified"]==0
          print("GOLD_REVERSION_FROZEN_GROSS02",a["development"]["verdict"],a["temporal_diagnostic"]["verdict"])
          PY
          printf '%s\n' "$GITHUB_SHA" > gross02/exact-code-head-sha.txt
          (cd gross02 && sha256sum qore-native-h4-gross02-xauusd.json exact-code-head-sha.txt > OUTPUT_SHA256SUMS.txt)
      - name: Keep all results, including NO_SUPPORT, encrypted? no secrets in artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qore-native-h4-gross02-xauusd-${{ github.sha }}
          path: gross02/
          retention-days: 90
          if-no-files-found: warn
