name: QORE CIBO Architect2 T11 V1 Orphan Cleanup

on:
  push:
    branches:
      - agent/cibo-external-scientific-closure-001
    paths:
      - '.github/workflows/cibo-arch2-t11-v1-orphan-cleanup.yml'
      - 'scripts/cibo_arch2_t11_v1_orphan_cleanup.py'
      - 'tests/infrastructure/test_cibo_arch2_t11_v1_orphan_cleanup.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
  QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}
  QORE_CIBO_ARCH2_T11_V1_CLEANUP_AUTHORIZATION: CIBO_ARCH2_T11_V1_ORPHAN_CLEANUP_AUTHORIZED

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev,ctrader]'
      - name: Quality before DEMO mutation
        run: |
          ruff check \
            scripts/cibo_arch2_t11_v1_orphan_cleanup.py \
            tests/infrastructure/test_cibo_arch2_t11_v1_orphan_cleanup.py
          mypy --disable-error-code=import-untyped \
            scripts/cibo_arch2_t11_v1_orphan_cleanup.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_arch2_t11_v1_orphan_cleanup.py
      - name: Verify DEMO credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            QORE_CTRADER_CLIENT_ID \
            QORE_CTRADER_CLIENT_SECRET \
            QORE_CTRADER_ACCESS_TOKEN \
            QORE_CTRADER_REFRESH_TOKEN
          do
            test -n "${!name:-}" || exit 2
          done
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            echo "::add-mask::$account_id"
            printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          fi
      - name: Close only cancelled-run orphan surface
        run: |
          mkdir -p t11-v1-cleanup
          python scripts/cibo_arch2_t11_v1_orphan_cleanup.py \
            --output t11-v1-cleanup/cleanup.json \
            > t11-v1-cleanup/stdout.json
      - name: Enforce exact containment
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("t11-v1-cleanup/cleanup.json").read_text())
          assert p["containment_clean"] is True
          assert p["after_position_count"] == 0
          assert p["after_order_count"] == 0
          assert p["mutation_scope"] == "INITIAL_T11_CANCELLED_RUN_LABELS_ONLY"
          assert p["canonical_replacement_touched"] is False
          assert p["fundednext_touched"] is False
          assert p["vps_touched"] is False
          assert p["live_authorized"] is False
          assert p["real_capital_authorized"] is False
          assert p["phase22_v2_consumed"] is False
          PY
      - name: Seal cleanup
        run: |
          printf '%s\n' "$GITHUB_SHA" > t11-v1-cleanup/git-sha.txt
          cd t11-v1-cleanup
          sha256sum cleanup.json stdout.json git-sha.txt > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-arch2-t11-v1-cleanup-${{ github.sha }}
          path: t11-v1-cleanup
          if-no-files-found: error
          retention-days: 90
