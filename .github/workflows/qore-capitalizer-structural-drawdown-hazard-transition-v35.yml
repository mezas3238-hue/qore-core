name: QORE Capitalizer Structural Drawdown Hazard Transition V35

on:
  push:
    branches:
      - agent/capitalizer-structural-dd-hazard-v35-001
    paths:
      - '.github/workflows/qore-capitalizer-structural-drawdown-hazard-transition-v35.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_structural_drawdown_hazard_transition_v35.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_structural_drawdown_hazard_transition_v35.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  V21_RUN_ID: '36264229554'
  V21_ARTIFACT_SHA: '05452328bbf5cbbc4b26210791d13114105e3f9d'
  V29_RUN_ID: '36283499014'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_structural_drawdown_hazard_transition_v35.py \
            tests/infrastructure/trader_lab/test_capitalizer_structural_drawdown_hazard_transition_v35.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_structural_drawdown_hazard_transition_v35.py \
            tests/infrastructure/trader_lab/test_capitalizer_structural_drawdown_hazard_transition_v35.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_structural_drawdown_hazard_transition_v35.py

  experiment:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download authoritative reconstructed consumed evidence
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v21-reconstructed-*-${{ env.V21_ARTIFACT_SHA }}
          path: reconstructed
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ env.V21_RUN_ID }}
      - name: Download authoritative V29 native-M1 trigger states
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v29-trigger-state-*
          path: trigger-states
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ env.V29_RUN_ID }}
      - name: Run V35 structural drawdown hazard transition guardian
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_structural_drawdown_hazard_transition_v35 \
            reconstructed/development-input \
            reconstructed/validation-input \
            reconstructed/reserved-input \
            reconstructed/development-validation-context \
            reconstructed/reserved-context \
            trigger-states \
            experiment-output
      - name: Enforce V35 frozen contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(
              Path(
                  "experiment-output/"
                  "capitalizer-structural-drawdown-hazard-transition-v35.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_STRUCTURAL_DRAWDOWN_HAZARD_TRANSITION_V35"
          )
          assert report["policy"] == (
              "SURFACE_DEFAULT_DUAL_WORLD_EPISODE_TRANSITION_GUARDIAN"
          )
          assert report["surface_default"] is True
          assert report["v31_causal_state_preserved"] is True
          assert report["causal_state_dimension"] == 95
          assert report["decision_only_inside_active_realized_drawdown"] is True
          assert report["first_passage_hazard_target"] == (
              "DEEPEN_TROUGH_BEFORE_RECOVER_PEAK"
          )
          assert report["additional_trough_severity_target"] is True
          assert report["value_preservation_total_delta_head"] is True
          assert report["chronological_calibration_folds"] == 5
          assert report["minimum_chronological_calibration_examples"] == 10
          assert report["hazard_severity_residual_upper_quantile"] == "0.8"
          assert report["total_delta_residual_lower_quantile"] == "0.2"
          assert report["dual_world_structural_dominance_gate"] is True
          assert report["numeric_improvement_threshold_added"] is False
          assert report["all_entries_preserved"] is True
          assert report["density_retention"] == "1"
          assert report["same_entrant_identities"] is True
          assert report["new_protection_geometry_created"] is False
          assert report["sizing_changed"] is False
          assert report["max3_preserved"] is True
          assert report["current_outcome_visible_to_decision"] is False
          assert report["heldout_counterfactual_visible_to_decision"] is False
          assert report["future_after_trigger_visible_to_decision"] is False
          assert report["activation_bar_ohlc_visible_to_decision"] is False
          assert report["era_identity_feature_used"] is False
          assert report[
              "symbol_session_side_time_identity_features_used"
          ] is False
          assert report["fresh_holdout_opened"] is False
          assert report["trader_certified"] is False
          expected={
              "DEVELOPMENT_2024_2026":948,
              "CONSUMED_VALIDATION_2022_2024":1034,
              "CONSUMED_RESERVED_2020_2022":1088,
          }
          for row in report["results"]:
              assert row["trades"] == expected[row["period"]]
              assert row["density_retention"] == "1"
              assert row["active_drawdown_trigger_count"] <= (
                  row["surface_trigger_decision_count"]
              )
          for period in report["model_diagnostics"].values():
              for family in period.values():
                  if family["available"]:
                      assert family["feature_dimension"] == 95
                      assert family[
                          "active_drawdown_training_states"
                      ] >= 10
                      for action in family["actions"].values():
                          assert action["oof_residual_count"] > 0
                  else:
                      assert family["reason"] == (
                          "INSUFFICIENT_ACTIVE_DRAWDOWN_"
                          "CHRONOLOGICAL_SUPPORT"
                      )
          print(json.dumps(report, sort_keys=True))
          PY
      - name: Upload V35 evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-structural-drawdown-hazard-transition-v35-${{ github.sha }}
          path: experiment-output
          if-no-files-found: error
          retention-days: 90
