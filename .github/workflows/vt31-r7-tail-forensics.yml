name: QORE VT-31 R7 Tail Forensics

on:
  push:
    branches:
      - agent/vt31-r7-tail-forensics-001
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  forensics:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Recover immutable consumed R5/R6 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p consumed/r5 consumed/r6
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10380044761/zip" > r5.zip
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10389112524/zip" > r6.zip
          echo "828335b99cd51c663e3f0f095df5137e881da3d7e8da741da8ca116a0400edf8  r5.zip" | sha256sum -c -
          echo "9b0f3a05dc76b5dd83e5e3610266484bee1b79595dbbaacdff1d799115ad58b9  r6.zip" | sha256sum -c -
          unzip -q r5.zip -d consumed/r5
          unzip -q r6.zip -d consumed/r6
      - name: Run duration-neighborhood tail forensics
        run: |
          set -euo pipefail
          python scripts/vt31_r7_tail_forensics.py \
            consumed/r5/fresh/NAS100/market-evidence.json \
            consumed/r5/fresh/SP500/market-evidence.json \
            consumed/r5/fresh/US30/market-evidence.json \
            consumed/r6/fresh/NAS100/market-evidence.json \
            consumed/r6/fresh/SP500/market-evidence.json \
            consumed/r6/fresh/US30/market-evidence.json \
            | tee vt31-r7-tail-summary.json
          echo "$GITHUB_SHA" > git-sha.txt
          sha256sum vt31-r7-tail-forensics.json vt31-r7-tail-summary.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-r7-tail-forensics-${{ github.sha }}
          path: |
            vt31-r7-tail-forensics.json
            vt31-r7-tail-summary.json
            git-sha.txt
            SHA256SUMS
          retention-days: 90
