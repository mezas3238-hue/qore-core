name: QORE Turtle Soup XAUUSD R3 Journey Topology Forensics

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-xauusd-r3-forensics-001
    paths:
      - '.github/workflows/turtle-soup-xauusd-r3-journey-topology-forensics.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r3_journey_topology_forensics.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r3_journey_topology_forensics.py'

permissions:
  contents: read
  actions: read

env:
  CAUSAL_RUN_ID: '35261072253'
  CAUSAL_ARTIFACT: 'qore-turtle-soup-xauusd-r3-causal-regime-forensics-dc44b59552aff17bba57dab3ca5e6f0cdd9cbd17'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-XAUUSD-2f510461b3360e91d5ee70a72716a76cd6561f16'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check --ignore E501 \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r3_journey_topology_forensics.py \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r3_journey_topology_forensics.py
      - name: Mypy focused gate
        run: mypy --disable-error-code var-annotated src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r3_journey_topology_forensics.py
      - name: Focused tests
        run: pytest -q --no-cov tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r3_journey_topology_forensics.py

  forensics:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download official causal R3 forensic artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CAUSAL_ARTIFACT }}
          path: causal-r3
          github-token: ${{ github.token }}
          run-id: ${{ env.CAUSAL_RUN_ID }}
      - name: Download immutable Target Destination V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Execute journey topology forensics
        run: |
          mkdir -p topology-output
          python -m qore.infrastructure.trader_lab.turtle_soup_xauusd_r3_journey_topology_forensics \
            causal-r3 target-xauusd topology-output > topology-output/stdout.json
          printf '%s\n' "$GITHUB_SHA" > topology-output/git-sha.txt
      - name: Enforce diagnostic governance and expected families
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('topology-output/journey-topology-forensics.json').read_text())
          assert p['identity']=='TURTLE_SOUP_XAUUSD_R3_JOURNEY_TOPOLOGY_FORENSICS_V1'
          assert p['reproduction']['input_enriched_trades']==5885
          assert p['reproduction']['joined_target_episodes']==5885
          assert p['diagnosis']['stable_family_remains_positive_recent'] is True
          assert p['diagnosis']['failing_family_flips_negative_recent'] is True
          assert p['diagnosis']['rules_promoted'] is False
          assert p['diagnosis']['fresh_holdout_consumed'] is False
          assert p['governance']['retrospective_filter_promotion_allowed'] is False
          assert p['governance']['live_authorized'] is False
          assert p['governance']['real_capital_authorized'] is False
          PY
      - name: Hash immutable topology result
        run: |
          cd topology-output
          sha256sum journey-topology-forensics.json topology-enriched-trades.json stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-xauusd-r3-journey-topology-forensics-${{ github.sha }}
          path: topology-output
          if-no-files-found: error
          retention-days: 90
