name: VT08 Index R132 Full Intelligence Bridge

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r132-full-intelligence-bridge.yml
      - src/qore/infrastructure/core_stack_v2/**
      - src/qore/infrastructure/trader_lab/vt08_index_r132_full_intelligence_bridge.py
      - tests/infrastructure/trader_lab/test_vt08_index_r132_full_intelligence_bridge.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r132_full_intelligence_bridge.py

  attribution:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R132 full-intelligence bridge
        run: |
          mkdir -p artifacts/report
          python -m qore.infrastructure.trader_lab.vt08_index_r132_full_intelligence_bridge \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r132-full-intelligence-bridge.json

      - name: Verify R132 architecture contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/"
                  "vt08-index-r132-full-intelligence-bridge.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R132_FULL_INTELLIGENCE_CAUSAL_BRIDGE_001"
          )
          assert report["shared_source"]["pr"] == 635
          assert report["shared_source"]["head"] == (
              "0429fbe210246f04e1b572191737e86a490781fc"
          )
          expected = {
              "five_year": 2448,
              "recent_two_year": 1017,
              "r66_failed_holdout": 773,
          }
          for key, sample in expected.items():
              section = report[key]
              assert section["canonical_sample"] == sample
              assert section["shared_context_sample"] == sample
              density = section["density_reopening"]
              assert density["canonical_signal_reference"] == sample
              assert density["surfaces_are_not_summed_without_exact_dedup"] is True

          contract = report["adapter_contract"]
          assert contract["shared_core_is_context_only"] is True
          assert contract["vt08_methodology_sovereign"] is True
          assert contract["qore_risk_sovereign"] is True
          assert contract["trade_outcome_used_for_classification"] is False
          assert contract["pnl_used_for_classification"] is False
          assert contract["density_research_reopened"] is True
          assert contract["shared_order_authority"] is False
          assert contract["shared_risk_authority"] is False
          assert contract["shared_sizing_authority"] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r132-full-intelligence-bridge-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
