name: QORE Shared A MC12 Foundation Model Audit

concurrency:
  group: qore-shared-a-mc12-foundation-model-audit
  cancel-in-progress: false

on:
  push:
    branches:
      - agent/shared-a-cognitive-science-001
    paths:
      - src/qore/infrastructure/core_stack_v2/market_foundation_model_evidence.py
      - tests/infrastructure/test_core_stack_v2_market_foundation_model_evidence.py
      - scripts/shared_mc12_market_foundation_model_audit.py
      - .github/workflows/qore-shared-a-mc12-foundation-model-audit.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate MC12 contract
        run: |
          set -euo pipefail
          mkdir -p input/{freeze,holdout,replication} result
          ruff check src/qore/infrastructure/core_stack_v2/market_foundation_model_evidence.py tests/infrastructure/test_core_stack_v2_market_foundation_model_evidence.py scripts/shared_mc12_market_foundation_model_audit.py
          mypy src/qore/infrastructure/core_stack_v2/market_foundation_model_evidence.py
          pytest -q tests/infrastructure/test_core_stack_v2_market_foundation_model_evidence.py
      - name: Recover immutable WP04 scientific evidence
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10906064254/zip" > freeze.zip
          unzip -q freeze.zip -d input/freeze
          (cd input/freeze && sha256sum -c SHA256SUMS)
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10908500161/zip" > holdout.zip
          unzip -q holdout.zip -d input/holdout
          (cd input/holdout && sha256sum -c result/SHA256SUMS)
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10908077821/zip" > replication.zip
          unzip -q replication.zip -d input/replication
          (cd input/replication && sha256sum -c result/SHA256SUMS)
      - name: Audit bounded MC12 foundation
        run: |
          set -euo pipefail
          python scripts/shared_mc12_market_foundation_model_audit.py             --freeze input/freeze             --holdout-e input/holdout             --replication-d input/replication             --output result/mc12-market-foundation-model-audit.json             | tee result/summary.json
      - name: Validate bounded disposition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/mc12-market-foundation-model-audit.json").read_text())
          assert p["status"] == "MC12_PARTIAL_FOUNDATION_REPRESENTATION_SCIENTIFICALLY_PROVEN"
          assert p["sequence_representation_scientifically_proven"] is True
          assert p["representation_fingerprint"] == "e2fc2ca059d5852b4e9107c467392e5e64aeabbd6aca2d8013951b93402bc987"
          assert p["holdout_incremental_bps"] == 288
          assert p["replication_incremental_bps"] == 312
          assert p["holdout_positive_targets"] == 8
          assert p["replication_positive_targets"] == 8
          assert p["global_multi_family_world_bound"] is False
          assert p["mc12_completed_and_proven"] is False
          assert p["protected_certification_holdout_opened"] is False
          PY
      - name: Seal result
        run: |
          printf '%s\n' "${GITHUB_SHA}" > result/code-git-sha.txt
          (
            cd result
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-a-mc12-foundation-model-audit-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
      - name: Report MC12
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path("result/mc12-market-foundation-model-audit.json").read_text())
          body="\n".join([
              "## Shared A MC-12 — Market Foundation Model Audit",
              "",
              f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- disposition: **{p['status']}**",
              f"- representation: **{p['representation_fingerprint']}**",
              f"- HOLDOUT_E / REPLICATION_D: **+{p['holdout_incremental_bps']} / +{p['replication_incremental_bps']} bps**",
              f"- positive targets: **{p['holdout_positive_targets']}/8 / {p['replication_positive_targets']}/8**",
              "- sequence representation scientifically proven: **True**",
              "- global multi-family world bound: **False**",
              "- MC-12 completed-and-proven: **False**",
              f"- dependency: **{p['dependency']}**",
          ])+"\n"
          Path("result/issue-comment.md").write_text(body)
          PY
          gh issue comment 638 --body-file result/issue-comment.md
