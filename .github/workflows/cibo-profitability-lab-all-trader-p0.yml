name: QORE CIBO Profitability Lab P0 All Trader

on:
  workflow_dispatch:
    inputs:
      owner_authorized:
        description: 'Explicit Owner authorization for research-only P0 lab run'
        required: true
        type: boolean
        default: false
  push:
    branches:
      - agent/cibo-profitability-lab-001
    paths:
      - 'docs/research/CIBO-PROFITABILITY-LAB-P0-TRIGGER.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-cibo-profitability-lab-p0
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify Owner authorization and research governance
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "${{ inputs.owner_authorized }}" = "true"
            echo "T02_POOLED_ARG=" >> "$GITHUB_ENV"
            echo "T02_FAST_TAIL_ARG=" >> "$GITHUB_ENV"
          else
            python - <<'PY'
          import json
          import os
          from pathlib import Path
          p = json.loads(
              Path("docs/research/CIBO-PROFITABILITY-LAB-P0-TRIGGER.json")
              .read_text(encoding="utf-8")
          )
          assert p["owner_authorized"] is True
          assert p["research_only"] is True
          assert p["broker_mutation"] is False
          assert p["live"] is False
          assert p["real_capital"] is False
          assert p["production"] is False
          assert p["merge_authority"] is False
          pooled = bool(p.get("t02_pooled_evidence", False))
          fast_tail = bool(p.get("t02_fast_tail_evidence", False))
          assert not (pooled and fast_tail)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(
                  "T02_POOLED_ARG=--t02-pooled-evidence\n"
                  if pooled
                  else "T02_POOLED_ARG=\n"
              )
              handle.write(
                  "T02_FAST_TAIL_ARG=--t02-fast-tail-evidence\n"
                  if fast_tail
                  else "T02_FAST_TAIL_ARG=\n"
              )
          PY
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install -e '.[dev]'

      - name: Static and focused causal validation
        run: |
          set -euo pipefail
          python -m compileall -q \
            scripts/cibo_profitability_lab_all_trader.py \
            scripts/cibo_phase22_reused_context_map.py \
            scripts/cibo_legacy_stack_quarantine.py \
            src/qore/infrastructure/cibo_ce2i_advanced_capital_tools.py \
            src/qore/infrastructure/cibo_ce2i_full_surface.py \
            src/qore/infrastructure/cibo_ce2i_economic_effects.py \
            src/qore/infrastructure/cibo_profitability_lab_t03_predecision_adapter.py \
            src/qore/infrastructure/cibo_profitability_lab_economic_consultation.py \
            src/qore/infrastructure/cibo_profitability_lab_decision_trace.py \
            src/qore/infrastructure/cibo_phase22_fresh_opportunity_batch.py \
            src/qore/infrastructure/cibo_phase22_fresh_capital_projection.py \
            src/qore/infrastructure/cibo_phase22_v4_execution_inputs.py \
            src/qore/infrastructure/cibo_phase22_v4_historical_policy_replay.py \
            src/qore/infrastructure/cibo_phase22_v4_chronological_execution.py \
            src/qore/infrastructure/cibo_protected_reinvestment_policy.py \
            src/qore/infrastructure/cibo_reused_holdout_compound_portfolio_lane.py
          python -m ruff check \
            scripts/cibo_profitability_lab_all_trader.py \
            scripts/cibo_phase22_reused_context_map.py \
            scripts/cibo_legacy_stack_quarantine.py \
            src/qore/infrastructure/cibo_ce2i_advanced_capital_tools.py \
            src/qore/infrastructure/cibo_ce2i_full_surface.py \
            src/qore/infrastructure/cibo_ce2i_economic_effects.py \
            src/qore/infrastructure/cibo_profitability_lab_t03_predecision_adapter.py \
            src/qore/infrastructure/cibo_profitability_lab_economic_consultation.py \
            src/qore/infrastructure/cibo_profitability_lab_decision_trace.py \
            src/qore/infrastructure/cibo_phase22_fresh_opportunity_batch.py \
            src/qore/infrastructure/cibo_phase22_fresh_capital_projection.py \
            src/qore/infrastructure/cibo_phase22_v4_execution_inputs.py \
            src/qore/infrastructure/cibo_phase22_v4_historical_policy_replay.py \
            src/qore/infrastructure/cibo_protected_reinvestment_policy.py \
            src/qore/infrastructure/cibo_reused_holdout_compound_portfolio_lane.py \
            tests/infrastructure/test_cibo_protected_reinvestment_policy.py \
            tests/infrastructure/test_cibo_ce2i_advanced_evidence_causal_time.py \
            tests/infrastructure/test_cibo_profitability_lab_t03_predecision_adapter.py \
            tests/infrastructure/test_cibo_profitability_lab_economic_consultation.py \
            tests/infrastructure/test_cibo_phase22_historical_policy_replay.py \
            tests/infrastructure/test_cibo_phase22_fresh_opportunity_batch.py \
            tests/infrastructure/test_cibo_phase22_fresh_capital_projection.py \
            tests/infrastructure/test_cibo_phase22_execution_inputs.py
          mypy \
            src/qore/infrastructure/cibo_ce2i_full_surface.py \
            src/qore/infrastructure/cibo_ce2i_economic_effects.py \
            src/qore/infrastructure/cibo_profitability_lab_t03_predecision_adapter.py \
            src/qore/infrastructure/cibo_profitability_lab_economic_consultation.py \
            src/qore/infrastructure/cibo_phase22_v4_historical_policy_replay.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_ce2i_advanced_evidence_causal_time.py \
            tests/infrastructure/test_cibo_profitability_lab_t03_predecision_adapter.py \
            tests/infrastructure/test_cibo_profitability_lab_economic_consultation.py \
            tests/infrastructure/test_cibo_phase22_historical_policy_replay.py \
            tests/infrastructure/test_cibo_phase22_fresh_opportunity_batch.py \
            tests/infrastructure/test_cibo_phase22_fresh_capital_projection.py \
            tests/infrastructure/test_cibo_phase22_execution_inputs.py \
            tests/infrastructure/test_cibo_protected_reinvestment_policy.py \
            tests/infrastructure/test_cibo_ce2i_advanced_capital_tools.py \
            tests/infrastructure/test_cibo_legacy_stack_quarantine.py

      - name: Recover frozen 7-of-7 batch from successful run 28
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/batch"
          gh api \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/11256450732/zip" \
            > "$RUNNER_TEMP/batch.zip"
          unzip -q "$RUNNER_TEMP/batch.zip" -d "$RUNNER_TEMP/batch"
          test -s "$RUNNER_TEMP/batch/reused-batch.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "batch" / "reused-batch.json")
              .read_text(encoding="utf-8")
          )
          assert p["validation_mode"] == "NON_CERTIFYING_REUSED_HOLDOUT"
          assert len(p["traders"]) == 7
          assert sum(int(x["opportunity_count"]) for x in p["traders"]) > 0
          PY

      - name: Reconstruct causal Trader context for reused-holdout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native" "$RUNNER_TEMP/context"
          fetch_lane() {
            local artifact_id="$1"
            local digest="$2"
            local name="$3"
            local zip="$RUNNER_TEMP/native-$name.zip"
            local root="$RUNNER_TEMP/native/$name"
            gh api \
              "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              > "$zip"
            echo "$(cut -d: -f2 <<<"$digest")  $zip" | sha256sum -c -
            mkdir -p "$root"
            unzip -q "$zip" -d "$root"
          }
          fetch_lane 11255538834 sha256:33d1b29ef4912cb2a34dddaec7b4c3fe6967f3ea8fa70758fca48363f1f18a55 r34
          fetch_lane 11256765185 sha256:0a8e15d97765ff86b7c621eb75ab53eab760206f60014eb098d11f04e584d304 eurusd
          fetch_lane 11256465614 sha256:63b1d1fb2f1a1d9e9a43e4748bac0917e5f06aab09f6b28d52df12c3869ae739 gbpusd
          fetch_lane 11255244229 sha256:7fdc519990e3cd6e2f721f4de121e5c3d3f85dc59125795fc796410f7b796c2c gbpjpy
          fetch_lane 11256249712 sha256:7c3fc149ac53e6de336a2ec2c6ba37b82ecca8cf327ecee66ee7398e89853582 audjpy

          python scripts/cibo_phase22_reused_context_map.py \
            --batch "$RUNNER_TEMP/batch/reused-batch.json" \
            --native-root "$RUNNER_TEMP/native" \
            --output "$RUNNER_TEMP/context/context-map.json"

          python - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "context"
                  / "context-map.json"
              ).read_text(encoding="utf-8")
          )
          assert p["matched_turtle_opportunity_count"] == 486
          assert sum(p["matched_by_trader"].values()) == 486
          assert p["governance"]["source_batch_mutated"] is False
          assert p["governance"]["outcome_fields_used_for_context"] is False
          assert p["governance"]["fresh_oos_claimed"] is False
          assert p["governance"]["broker_mutation"] is False
          PY
          echo "CONTEXT_MAP=$RUNNER_TEMP/context/context-map.json" >> "$GITHUB_ENV"

      - name: Recover provider numeric model and regime corpora
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/provider" "$RUNNER_TEMP/regime"
          python - <<'PY' > "$RUNNER_TEMP/provider.env"
          from qore.infrastructure.cibo_phase22_provider_numeric_execution_receipt import (
              PHASE22_PROVIDER_NUMERIC_EXECUTION_FREEZE_RECEIPT,
          )
          x = PHASE22_PROVIDER_NUMERIC_EXECUTION_FREEZE_RECEIPT
          print(f"PROVIDER_ARTIFACT_ID={x.artifact_id}")
          print(f"PROVIDER_ARTIFACT_DIGEST={x.artifact_digest}")
          print(f"PROVIDER_FILE_SHA={x.provider_numeric_freeze_file_sha256}")
          PY
          source "$RUNNER_TEMP/provider.env"
          zip="$RUNNER_TEMP/provider.zip"
          gh api \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PROVIDER_ARTIFACT_ID/zip" \
            > "$zip"
          echo "$(cut -d: -f2 <<<"$PROVIDER_ARTIFACT_DIGEST")  $zip" | sha256sum -c -
          unzip -q "$zip" -d "$RUNNER_TEMP/provider"
          provider_json="$(find "$RUNNER_TEMP/provider" -name provider-numeric-execution-freeze.json -print -quit)"
          test -n "$provider_json"
          echo "$(cut -d: -f2 <<<"$PROVIDER_FILE_SHA")  $provider_json" | sha256sum -c -
          echo "PROVIDER_JSON=$provider_json" >> "$GITHUB_ENV"
          echo "PROVIDER_FILE_SHA=$PROVIDER_FILE_SHA" >> "$GITHUB_ENV"

          python - <<'PY' > "$RUNNER_TEMP/regime.tsv"
          from pathlib import Path
          from qore.infrastructure.cibo_phase22_v4_historical_regime import (
              PHASE22_REGIME_SYMBOLS,
          )
          from qore.infrastructure.cibo_phase22_v4_source_receipt import (
              load_phase22_v4_source_receipt,
          )
          receipt = load_phase22_v4_source_receipt(
              Path("docs/research/CIBO-PHASE22-V4-SOURCE-RECEIPT.json")
          )
          by_key = {(x.symbol, x.timeframe): x for x in receipt.bindings}
          for symbol in PHASE22_REGIME_SYMBOLS:
              x = by_key[(symbol, "M5")]
              print(symbol, x.artifact_id, x.artifact_digest, sep="\t")
          PY
          while IFS=$'\t' read -r symbol artifact_id digest; do
            zip="$RUNNER_TEMP/regime-$symbol.zip"
            root="$RUNNER_TEMP/regime/$symbol"
            gh api \
              "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              > "$zip"
            echo "$(cut -d: -f2 <<<"$digest")  $zip" | sha256sum -c -
            mkdir -p "$root"
            unzip -q "$zip" -d "$root"
          done < "$RUNNER_TEMP/regime.tsv"

      - name: Execute P0 all-Trader laboratory
        shell: bash
        run: |
          set -euo pipefail
          replay_started_at="$(date -u '+%Y-%m-%dT%H:%M:%S+00:00')"
          python scripts/cibo_profitability_lab_all_trader.py \
            --batch "$RUNNER_TEMP/batch/reused-batch.json" \
            --context-map "$CONTEXT_MAP" \
            $T02_POOLED_ARG \
            $T02_FAST_TAIL_ARG \
            --provider-numeric "$PROVIDER_JSON" \
            --provider-numeric-freeze-sha256 "$PROVIDER_FILE_SHA" \
            --source-root "AUDJPY=$RUNNER_TEMP/regime/AUDJPY" \
            --source-root "EURUSD=$RUNNER_TEMP/regime/EURUSD" \
            --source-root "GBPJPY=$RUNNER_TEMP/regime/GBPJPY" \
            --source-root "GBPUSD=$RUNNER_TEMP/regime/GBPUSD" \
            --source-root "XAUUSD=$RUNNER_TEMP/regime/XAUUSD" \
            --replay-started-at "$replay_started_at" \
            --output-dir "$RUNNER_TEMP/cibo-lab-p0"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-cibo-profitability-lab-p0-${{ github.run_id }}
          path: ${{ runner.temp }}/cibo-lab-p0
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce seven-of-seven participation gate
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from decimal import Decimal
          from pathlib import Path
          p = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "cibo-lab-p0" / "lab-result.json")
              .read_text(encoding="utf-8")
          )
          assert p["seven_of_seven_participation_pass"] is True
          assert p["governance"]["reused_context_map_applied"] is True
          if os.environ.get("T02_POOLED_ARG"):
              assert p["governance"]["t02_pooled_evidence_applied"] is True
              assert p["t02_pooled_evidence"]["selected_rule_id"] == (
                  "ROR_0050_D1_NOT_EXTREME"
              )
          if os.environ.get("T02_FAST_TAIL_ARG"):
              assert p["governance"]["t02_fast_tail_evidence_applied"] is True
              assert p["t02_fast_tail_evidence"]["selected_rule_id"] == (
                  "FVG_EXCLUDE_NY_LOW_EFF_LARGE_WICK"
              )
          context = p["causal_context_reconstruction"]
          assert context["matched_turtle_opportunity_count"] == 486
          assert context["source_batch_mutated"] is False
          assert context["outcome_fields_used_for_context"] is False

          trace = p["decision_trace"]
          assert trace["status"] == "OBSERVATIONAL"
          assert trace["opportunity_count"] == len(trace["opportunities"])
          assert trace["opportunity_count"] > 0
          assert trace["trace_sha256"].startswith("sha256:")
          assert trace["governance"] == {
              "policy_mutated": False,
              "trader_logic_mutated": False,
              "cma_authority_mutated": False,
              "qore_risk_authority_mutated": False,
              "outcome_aware_tuning_used": False,
              "broker_mutation": False,
              "live": False,
              "real_capital": False,
              "production": False,
              "merge_authority": False,
          }
          assert all(
              row["cognitive_orchestration"]["runtime_economic_consultation"]
              == "PRESENT"
              for row in trace["opportunities"]
          )
          assert all(
              len(
                  row["cognitive_orchestration"]["runtime_consulted_faculties"]
              ) == 19
              for row in trace["opportunities"]
          )
          assert all(
              row["cognitive_orchestration"]["mission_director_invoked"] is True
              and row["cognitive_orchestration"]["functional_coordinator_invoked"]
              is True
              and row["cognitive_orchestration"]["mission_disposition"] == "continue"
              and len(row["cognitive_orchestration"]["mission_faculties"]) == 19
              and row["cognitive_orchestration"]["executive_brain_invoked"] is False
              and row["cognitive_orchestration"]["executive_brain_status"]
              == "QUARANTINED_RESEARCH_ONLY"
              and row["cognitive_orchestration"]["legacy_stack_quarantine_preserved"]
              is True
              for row in trace["opportunities"]
          )
          assert p["coverage"][
              "cf01_cf19_runtime_economic_consultation_complete"
          ] is True
          assert p["coverage"]["cognitive_runtime_orchestration_complete"] is True

          compound = p["all_trader_cibo_compound_portfolio"]
          assert compound["rational_redeploy_gate_enabled"] is True
          assert compound["noncertifying_research_redeploy_enabled"] is True
          assert compound["protected_reinvestment_policy_id"] == (
              "CIBO_PROTECTED_REINVESTMENT_TRADER_LAB_V2"
          )
          assert compound["compound_settled_count"] > 0
          assert (
              compound["compound_allowed_count"]
              + compound["compound_reduced_count"]
          ) == compound["compound_settled_count"]
          assert Decimal(compound["compound_incremental_pnl_usd"]) > 0
          assert compound["outcome_aware_tuning_used"] is False
          assert compound["broker_mutation_performed"] is False
          assert compound["live_authorized"] is False
          assert compound["real_capital_authorized"] is False
          assert compound["production_authorized"] is False
          assert compound["merge_authorized"] is False
          assert p["compound_rational_redeploy_gate_preregistered"] is True
          PY
