name: QORE GBPUSD R43 Live Memory Freeze

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-gbpusd-r43-live-core-integration-001
    paths:
      - '.github/workflows/gbpusd-r43-live-memory-freeze.yml'
      - 'scripts/build_gbpusd_r43_live_memory.py'
      - 'tests/infrastructure/trader_lab/test_gbpusd_r43_live_memory_builder.py'
      - 'src/qore/infrastructure/trader_lab/cibo_gbpusd_native_market_decision_memory_v2.py'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_gbpusd_r32_causal_memory_defragmentation.py'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_gbpusd_specialist_cognitive_memory_v2.py'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_gbpusd_specialist_cognitive_memory_v3.py'

permissions:
  contents: write
  actions: read

env:
  R27_RUN_ID: '35339237432'
  R27_ARTIFACT: 'qore-turtle-soup-gbpusd-structural-specialist-v2-r27-b7005f4dab80376f3bdd5ce199e37f425ab99633'

jobs:
  freeze_memory:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/turtle-soup-gbpusd-r43-live-core-integration-001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Quality
        run: |
          ruff check --ignore E501,I001             scripts/build_gbpusd_r43_live_memory.py             tests/infrastructure/trader_lab/test_gbpusd_r43_live_memory_builder.py
          mypy --ignore-missing-imports --disable-error-code attr-defined scripts/build_gbpusd_r43_live_memory.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_gbpusd_r43_live_memory_builder.py
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.R27_ARTIFACT }}
          path: r27-source
          github-token: ${{ github.token }}
          run-id: ${{ env.R27_RUN_ID }}
      - name: Build immutable live memory
        run: |
          mkdir -p runtime_data/gbpusd
          python scripts/build_gbpusd_r43_live_memory.py             r27-source runtime_data/gbpusd/r43-r32-regime-memory.json             > runtime_data/gbpusd/r43-r32-regime-memory-build.json
          sha256sum runtime_data/gbpusd/r43-r32-regime-memory.json             > runtime_data/gbpusd/r43-r32-regime-memory.sha256
      - name: Enforce memory binding
        run: |
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          p=Path('runtime_data/gbpusd/r43-r32-regime-memory.json')
          data=json.loads(p.read_text())
          assert data['identity']=='TURTLE_SOUP_GBPUSD_R43_LIVE_MEMORY_V1'
          assert data['source']['run_id']==35339237432
          assert data['source']['artifact_id']==10544098544
          assert data['source']['observations_sha256']=='cc9176146a6d20b27ae8c55d0ec807156c7de3a82f651a9c2bca308d733b719c'
          assert data['scheme']=='R32_REGIME_ROUTE_TYPES'
          assert data['route_mode']=='TYPES_ONLY'
          assert len(data['profiles']) > 0
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          assert Path('runtime_data/gbpusd/r43-r32-regime-memory.sha256').read_text().split()[0]==digest
          PY
      - name: Commit frozen live memory
        run: |
          git config user.name 'qore-research-bot'
          git config user.email 'qore-research-bot@users.noreply.github.com'
          git add runtime_data/gbpusd/r43-r32-regime-memory.json                   runtime_data/gbpusd/r43-r32-regime-memory.sha256                   runtime_data/gbpusd/r43-r32-regime-memory-build.json
          git commit -m "data(gbpusd-live): freeze R43 R32 regime memory" || exit 0
          git push origin HEAD:agent/turtle-soup-gbpusd-r43-live-core-integration-001
