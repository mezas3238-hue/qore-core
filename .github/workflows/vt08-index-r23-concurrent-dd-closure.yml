name: VT08 Index R23 Concurrent DD Closure

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r23-concurrent-dd-closure.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r23_concurrent_dd_closure.py
      - tests/infrastructure/trader_lab/test_vt08_index_r23_concurrent_dd_closure.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r23_concurrent_dd_closure.py

  research:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R23 concurrent DD closure
        run: |
          python -m qore.infrastructure.trader_lab.vt08_index_r23_concurrent_dd_closure             --nas100-root artifacts/NAS100             --sp500-root artifacts/SP500             --us30-root artifacts/US30             --out artifacts/report/vt08-index-r23-concurrent-dd-closure.json

      - name: Verify permanent Owner architecture
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(Path("artifacts/report/vt08-index-r23-concurrent-dd-closure.json").read_text())
          assert report["identity"] == "VT08_INDEX_R23_CONCURRENT_DD_CLOSURE_001"
          assert 1500 <= report["sample"] <= 1600
          c=report["contract"]
          assert c["global_single_position_rule"] is False
          assert c["cross_market_concurrency_required"] is True
          assert c["signal_suppression_allowed"] is False
          assert c["zero_risk_allowed"] is False
          assert c["portfolio_dd_max_r"] == "6"
          assert c["both_stress_surfaces_dd_must_pass"] is True
          g=report["governance"]
          assert g["all_trades_preserved"] is True
          assert g["cross_market_concurrency_preserved"] is True
          assert g["signal_suppression_allowed"] is False
          assert g["zero_risk_allowed"] is False
          assert g["live_authorized"] is False
          assert g["real_capital_authorized"] is False
          assert g["production_authorized"] is False
          PY

      - name: Build summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path("artifacts/report")
          r=json.loads((root/"vt08-index-r23-concurrent-dd-closure.json").read_text())
          b=r["best"]
          lines=[
              "# VT08 INDEX R23 Concurrent DD Closure",
              "",
              f"- sample: {r['sample']}",
              f"- quality profiles: {r['quality_profile_count']}",
              f"- selected quality profiles: {r['selected_quality_profile_count']}",
              f"- risk profiles: {r['risk_profile_count']}",
              f"- realized combinations: {r['realized_combination_count']}",
              f"- MTM finalists: {r['mtm_finalist_count']}",
              f"- goal candidates: {r['goal_candidate_count']}",
              "",
          ]
          if b is not None:
              p=b["primary"]; s=b["secondary"]
              pm=b["primary_conservative_mark_to_market"]
              sm=b["secondary_conservative_mark_to_market"]
              d=b["diagnostics"]
              lines += [
                  "## Best",
                  f"- PF05: {p['profit_factor']}",
                  f"- realized DD05: {p['max_drawdown_r']}R",
                  f"- conservative DD05: {pm['max_drawdown_r']}R",
                  f"- PF10: {s['profit_factor']}",
                  f"- realized DD10: {s['max_drawdown_r']}R",
                  f"- conservative DD10: {sm['max_drawdown_r']}R",
                  f"- total05: {p['total_r']}R",
                  f"- total10: {s['total_r']}R",
                  f"- max concurrent positions: {d['max_concurrent_open_positions']}",
                  f"- suppressed trades: {d['suppressed_trade_count']}",
                  f"- max committed risk: {d['max_committed_structural_risk_r']}R",
                  f"- goal pass: {b['goal_pass']}",
              ]
          (root/"VT08_INDEX_R23_CONCURRENT_DD_CLOSURE_SUMMARY.md").write_text("\n".join(lines)+"\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-index-r23-concurrent-dd-closure-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
