name: QORE Capitalizer V3 Clean A-B Control

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-v3-clean-ab-control.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_owner_h1_m3_m1_causal_reversal_1y_v3.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_owner_h1_m3_m1_causal_reversal_1y_v3.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-v3-clean-ab-control-${{ github.sha }}
  cancel-in-progress: false

env:
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_owner_h1_m3_m1_causal_reversal_1y_v3.py \
            tests/infrastructure/trader_lab/test_capitalizer_owner_h1_m3_m1_causal_reversal_1y_v3.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_owner_h1_m3_m1_causal_reversal_1y_v3.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_owner_h1_m3_m1_causal_reversal_1y_v3.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {symbol: USDJPY, session: ASIA}
          - {symbol: AUDJPY, session: ASIA}
          - {symbol: AUDUSD, session: ASIA}
          - {symbol: GBPJPY, session: ASIA}
          - {symbol: EURUSD, session: LONDON}
          - {symbol: GBPUSD, session: LONDON}
          - {symbol: XAUUSD, session: NEW_YORK}
          - {symbol: USDCAD, session: NEW_YORK}
          - {symbol: NAS100, session: NEW_YORK}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable native-M1 clone
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Run V3 causal reversal replay
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_owner_h1_m3_m1_causal_reversal_1y_v3 \
            market m1-source replay-output --session ${{ matrix.session }}
      - name: Enforce research boundary
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
          EXPECTED_SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"]
          path = Path("replay-output") / (
              f"capitalizer-{symbol.lower()}-owner-h1-m3-m1-causal-reversal-1y-v3.json"
          )
          report = json.loads(path.read_text())
          assert report["identity"] == (
              "QORE_CAPITALIZER_OWNER_H1_M3_M1_CAUSAL_REVERSAL_1Y_V3"
          )
          assert report["symbol"] == symbol
          assert report["session"] == os.environ["EXPECTED_SESSION"]
          assert report["narrative_timeframe"] == "H1"
          assert report["closeback_timeframe"] == "M5"
          assert report["confirmation_timeframe"] == "M3"
          assert report["entry_timeframe"] == "M1"
          assert report["h1_final_close_used_for_signal"] is False
          assert report["m5_mss_required"] is False
          assert report["m3_mss_required"] is True
          assert report["m3_body_ratio_min"] == "0.60"
          assert report["m3_atr_multiplier"] == "1.2"
          assert report["stop_buffer_pips"] == "5"
          assert report["m1_entry_causally_linked_to_m3"] is True
          assert report["architecture_predeclared"] is True
          assert report["max3_is_ceiling_not_quota"] is True
          assert report["methodology_research_only"] is True
          assert report["m1_can_originate_trade"] is False
          assert report["fresh_holdout_claimed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["economic_candidate"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-owner-h1-m3-m1-causal-reversal-1y-v3-${{ matrix.symbol }}-${{ github.sha }}
          path: replay-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-owner-h1-m3-m1-causal-reversal-1y-v3-*-${{ github.sha }}
          path: replay-input
          merge-multiple: false
      - name: Build nine-market matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_owner_h1_m3_m1_causal_reversal_1y_v3 \
            matrix replay-input matrix-output
      - name: Enforce aggregate boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "matrix-output/"
              "capitalizer-nine-market-owner-h1-m3-m1-causal-reversal-1y-v3.json"
          )
          report = json.loads(path.read_text())
          assert report["identity"] == (
              "QORE_CAPITALIZER_NINE_MARKET_"
              "OWNER_H1_M3_M1_CAUSAL_REVERSAL_1Y_V3"
          )
          assert report["architecture"] == (
              "H1_SWEEP_TO_M5_CLOSEBACK_TO_M3_MSS_TO_"
              "M1_CAUSAL_OB_FVG"
          )
          assert report["market_count"] == 9
          assert report["h1_final_close_used_for_signal"] is False
          assert report["m5_mss_required"] is False
          assert report["m3_mss_required"] is True
          assert report["m3_body_ratio_min"] == "0.60"
          assert report["m3_atr_multiplier"] == "1.2"
          assert report["m1_entry_causally_linked_to_m3"] is True
          assert report["max3_is_ceiling_not_quota"] is True
          assert report["methodology_research_only"] is True
          assert report["fresh_holdout_claimed"] is False
          assert report["economic_candidate"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-nine-market-owner-h1-m3-m1-causal-reversal-1y-v3-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
