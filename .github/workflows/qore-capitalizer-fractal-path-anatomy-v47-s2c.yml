name: QORE Capitalizer Fractal Path Anatomy V47 S2C

on:
  push:
    branches:
      - agent/capitalizer-canonical-source-remediation-v47-s2-001
    paths:
      - '.github/workflows/qore-capitalizer-fractal-path-anatomy-v47-s2c.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_fractal_path_anatomy_v47_s2c.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_fractal_path_anatomy_v47_s2c.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-fractal-path-anatomy-v47-s2c-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_S2B_RUN_ID: '36651366703'
  SOURCE_S2B_SHA: '59d826f3b24031e52e6c0f32e8cca1ecfb4d0524'
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
  QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,ctrader]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_fractal_path_anatomy_v47_s2c.py \
            tests/infrastructure/trader_lab/test_capitalizer_fractal_path_anatomy_v47_s2c.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_fractal_path_anatomy_v47_s2c.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_fractal_path_anatomy_v47_s2c.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        symbol:
          - USDJPY
          - AUDJPY
          - AUDUSD
          - GBPJPY
          - EURUSD
          - GBPUSD
          - XAUUSD
          - USDCAD
          - NAS100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[ctrader]'
      - name: Verify read-only cTrader inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in QORE_CTRADER_CLIENT_ID QORE_CTRADER_CLIENT_SECRET QORE_CTRADER_ACCESS_TOKEN QORE_CTRADER_REFRESH_TOKEN; do
            test -n "${!name:-}" || { echo "missing required read-only DEMO input: $name" >&2; exit 2; }
          done
      - name: Discover DEMO account when not configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            if ! [[ "$account_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "cTrader DEMO account discovery returned invalid id" >&2
              exit 3
            fi
            echo "::add-mask::$account_id"
            printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          fi
      - name: Download frozen S2-B chronology
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-v47-s2b-aggregate-${{ env.SOURCE_S2B_SHA }}
          path: s2b-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_S2B_RUN_ID }}
      - name: Download immutable provider-native M1
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Audit provider-native path
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_fractal_path_anatomy_v47_s2c \
            market s2b-source m1-source \
            --symbol "${{ matrix.symbol }}" \
            --output path-output
      - name: Enforce path governance
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report=json.loads(
              (
                  Path("path-output")
                  / f"capitalizer-s2c-path-{os.environ['SYMBOL'].lower()}-report.json"
              ).read_text()
          )
          assert report["identity"] == "QORE_CAPITALIZER_V47_S2C_FRACTAL_PATH_AND_LOSS_ANATOMY"
          assert report["predeclaration_comment_id"] == 5901892907
          assert report["source_s2b_run_id"] == 36651366703
          assert report["mae_mfe_productive_feature_allowed"] is False
          assert report["fresh_holdout_opened"] is False
          assert report["trader_certified"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v47-s2c-path-${{ matrix.symbol }}-${{ github.sha }}
          path: path-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v47-s2c-path-*-${{ github.sha }}
          path: path-markets
          merge-multiple: true
      - name: Aggregate path anatomy
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_fractal_path_anatomy_v47_s2c \
            aggregate path-markets \
            --output path-aggregate
      - name: Enforce aggregate governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          row=json.loads(
              Path("path-aggregate/capitalizer-v47-s2c-fractal-path-anatomy.json").read_text()
          )
          assert row["identity"] == "QORE_CAPITALIZER_V47_S2C_FRACTAL_PATH_AND_LOSS_ANATOMY"
          assert row["predeclaration_comment_id"] == 5901892907
          assert row["frozen_population_rows"] == 91
          assert row["mae_mfe_audit_complete"] is True
          assert row["terminal_outcome_research_label_only"] is True
          assert row["mae_mfe_productive_feature_allowed"] is False
          assert row["fresh_holdout_opened"] is False
          assert row["trader_certified"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v47-s2c-path-aggregate-${{ github.sha }}
          path: path-aggregate
          if-no-files-found: error
          retention-days: 90
