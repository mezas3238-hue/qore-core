name: QORE CIBO Zero Open Work Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/*cibo*.yml'
      - 'src/qore/infrastructure/cibo_*.py'
      - 'scripts/cibo_*.py'
      - 'tests/infrastructure/test_cibo*.py'
      - 'docs/research/CIBO*.md'
      - 'docs/research/CIBO*.json'
  push:
    branches:
      - agent/cibo-capital-efficiency-sizing-lab-001
      - agent/cibo-integrator-ab-001
    paths:
      - '.github/workflows/*cibo*.yml'
      - 'src/qore/infrastructure/cibo_*.py'
      - 'scripts/cibo_*.py'
      - 'tests/infrastructure/test_cibo*.py'
      - 'docs/research/CIBO*.md'
      - 'docs/research/CIBO*.json'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  zero-open-work-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Zero-open-work gate quality
        run: |
          ruff check scripts/cibo_zero_open_work_gate.py tests/infrastructure/test_cibo_zero_open_work_gate.py
          mypy scripts/cibo_zero_open_work_gate.py
          python -m py_compile scripts/cibo_zero_open_work_gate.py
          pytest -q --no-cov tests/infrastructure/test_cibo_zero_open_work_gate.py
      - name: Generate strict and pre-exam closure verdicts
        run: |
          python scripts/cibo_zero_open_work_gate.py
          python scripts/cibo_zero_open_work_gate.py --pre-exam
          python - <<'PY'
          import json
          from pathlib import Path

          strict = json.loads(
              Path("artifacts/cibo_zero_open_work_gate_v1.json").read_text(
                  encoding="utf-8"
              )
          )
          pre = json.loads(
              Path(
                  "artifacts/cibo_zero_open_work_gate_pre_exam_v1.json"
              ).read_text(encoding="utf-8")
          )
          for payload, scope in ((strict, "STRICT"), (pre, "PRE_EXAM")):
              assert payload["schema"] == "QORE_CIBO_ZERO_OPEN_WORK_GATE_V1"
              assert payload["scope"] == scope
              assert isinstance(payload["pass"], bool)
              assert isinstance(payload["open_workstream_ids"], list)
              assert isinstance(payload["inventory_paths"], list)
              assert payload["orphan_candidate_paths"] == []
              assert payload["missing_required_artifacts"] == []
              assert payload["high_signal_marker_hits"] == []

          assert pre["mandatory_workstream_count"] == (
              strict["mandatory_workstream_count"] - 2
          )
          excluded = {
              "FINAL_INTEGRATED_CIBO_EXAM",
              "WORLD_CUP_MAXIMUM_CAPABILITY_EXAM",
          }
          assert not excluded.intersection(pre["open_workstream_ids"])
          assert set(pre["open_workstream_ids"]) == (
              set(strict["open_workstream_ids"]) - excluded
          )
          PY
      - name: Upload zero-open-work gate verdicts
        uses: actions/upload-artifact@v4
        with:
          name: cibo-zero-open-work-gate-v1
          path: |
            artifacts/cibo_zero_open_work_gate_v1.json
            artifacts/cibo_zero_open_work_gate_pre_exam_v1.json
          if-no-files-found: error
