name: QORE Alpha2 FINAL 252d TSMOM 20d vol scaled 33 markets COST PROXY
on:
  push:
    branches: ['research/qore-alpha2-original-intermarket-propagation-20261012']
    paths:
      - '.github/workflows/qore-alpha2-tsmom-final-vol-scaled-one.yml'
      - 'src/qore/research/alpha2_tsmom_final_scaled.py'
      - 'src/qore/research/alpha2_tsmom_final_scaled_panel.py'
      - 'tests/research/test_alpha2_tsmom_final_scaled.py'
      - 'tests/research/test_alpha2_tsmom_final_scaled.py'
      - 'docs/research/QORE_ALPHA2_FINAL_TSMOM_RISKSCALED_AND_XSREV5_FROZEN_PREREG_2026-10-12.md'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: alpha2-TSMOM-FINAL-RISK-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prereg_and_synthetic_causality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . 'pytest>=8,<9' 'ruff>=0.5,<1'
      - name: Freeze exact original prereg before any prices consumed
        run: |
          set -euo pipefail
          git merge-base --is-ancestor f9248d42a6cbced3d6e962b24e47c709cb91161c "$GITHUB_SHA"
          test -s docs/research/QORE_ALPHA2_FINAL_TSMOM_RISKSCALED_AND_XSREV5_FROZEN_PREREG_2026-10-12.md
          ruff check src/qore/research/alpha2_tsmom_final_scaled.py src/qore/research/alpha2_tsmom_final_scaled_panel.py tests/research/test_alpha2_tsmom_final_scaled.py
          pytest -q -o addopts='' tests/research/test_alpha2_tsmom_final_scaled.py
  original12_daily_source:
    needs: prereg_and_synthetic_causality
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        symbol: [AUDJPY, AUDUSD, EURUSD, GBPJPY, GBPUSD, NAS100, SP500, US30, USDCAD, USDJPY, XAGUSD, XAUUSD]
    env:
      SYMBOL: ${{ matrix.symbol }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: qore-native-final33-source-manifest-dba0e0c3b61e430d3ed51abab562ebd92060a0ff
          run-id: '38207337960'
          github-token: ${{ github.token }}
          path: signed33
      - uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-aggregate-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          run-id: '35166210458'
          github-token: ${{ github.token }}
          path: atlas-aggregate
      - uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-${{ matrix.symbol }}-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          run-id: '35166210458'
          github-token: ${{ github.token }}
          path: original-native
      - name: Original 11y yearly SHA then read pre-embargo DAILY source only
        run: |
          set -euo pipefail
          python -m qore.research.alpha2_tsmom_final_scaled "$SYMBOL" original-native signed33 tsmom-worker --aggregate12 atlas-aggregate
          printf '%s\n' "$GITHUB_SHA" > tsmom-worker/exact-code-head-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: alpha2-tsmom-risk-final-${{ matrix.symbol }}-${{ github.sha }}
          path: tsmom-worker/
          retention-days: 90
          if-no-files-found: error
  new21_daily_source:
    needs: prereg_and_synthetic_causality
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        symbol: [USDCHF, NZDUSD, EURGBP, EURJPY, EURCHF, EURCAD, EURAUD, EURNZD, GBPCHF, GBPCAD, GBPAUD, GBPNZD, AUDCAD, AUDCHF, AUDNZD, CADJPY, CADCHF, CHFJPY, NZDJPY, NZDCAD, NZDCHF]
    env:
      SYMBOL: ${{ matrix.symbol }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: qore-native-final33-source-manifest-dba0e0c3b61e430d3ed51abab562ebd92060a0ff
          run-id: '38207337960'
          github-token: ${{ github.token }}
          path: signed33
      - uses: actions/download-artifact@v4
        with:
          name: qore-native-icmarkets-10Y-provider-M5-${{ matrix.symbol }}-e0ca5a13c866a19d8505c68cffc473598984b340
          run-id: '38193802541'
          github-token: ${{ github.token }}
          path: original-native
      - name: Original 11y SHA then read pre-embargo DAILY source only
        run: |
          set -euo pipefail
          python -m qore.research.alpha2_tsmom_final_scaled "$SYMBOL" original-native signed33 tsmom-worker
          printf '%s\n' "$GITHUB_SHA" > tsmom-worker/exact-code-head-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: alpha2-tsmom-risk-final-${{ matrix.symbol }}-${{ github.sha }}
          path: tsmom-worker/
          retention-days: 90
          if-no-files-found: error
  all33_one_weekly_gross_screen:
    needs: [original12_daily_source, new21_daily_source]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: alpha2-tsmom-risk-final-*-${{ github.sha }}
          path: tsmom-exact33
      - name: 33 independent source SHA and single signed 4week CI gross test
        run: |
          set -euo pipefail
          python -m qore.research.alpha2_tsmom_final_scaled_panel tsmom-exact33 tsmom-panel --head "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("tsmom-panel/alpha2-final-tsmom-risk33-sector-gross-minus-cost.json").read_text())
          assert x["full33_exact"]==33 and x["FX_total28"]==28
          assert x["FX_crosses21"]==21 and x["FX_majors7"]==7 and x["nonFX5"]==5
          assert x["last_TSMOM_spec_closed_regardless_outcome"]
          assert not x["UTC001_certified"] and x["orders"]==0 and x["NET_PF_DD_Sharpe_not_computed"]
          assert x["gross_minus_assumed_cost_only_not_broker_NET"]
          assert x["status"] in (
              "FINAL_TSMOM_INCONCLUSIVE_STOP_ANYWAY",
              "FINAL_TSMOM_FAIL_CLOSE_FAMILY_ON_EXPOSED_DATA",
              "EXPLORATORY_TSMOM_COST_PROXY_POSITIVE_NEEDS_NEW_OOS",
          )
          PY
          printf '%s\n' "$GITHUB_SHA" > tsmom-panel/exact-code-head-sha.txt
          (cd tsmom-panel && sha256sum *.json exact-code-head-sha.txt > OUTPUT_SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: alpha2-TSMOM-FINAL-RISK33-panel-${{ github.sha }}
          path: tsmom-panel/
          retention-days: 90
          if-no-files-found: error
