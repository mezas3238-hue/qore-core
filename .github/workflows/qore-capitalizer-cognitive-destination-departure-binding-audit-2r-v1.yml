name: QORE Capitalizer Cognitive Destination Departure Binding Audit 2R V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-cognitive-destination-departure-binding-audit-2r-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_cognitive_destination_departure_binding_audit_2r_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_cognitive_destination_departure_binding_audit_2r_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-cognitive-destination-departure-binding-audit-2r-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  REBASE_RUN_ID: '36078677895'
  REBASE_SHA: 'cfc04849c8bbfd6565310d89456f5e367ea880f7'
  TARGET_RUN_ID: '35204892665'
  TARGET_SHA: '2f510461b3360e91d5ee70a72716a76cd6561f16'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check             src/qore/infrastructure/trader_lab/capitalizer_cognitive_destination_departure_binding_audit_2r_v1.py             tests/infrastructure/trader_lab/test_capitalizer_cognitive_destination_departure_binding_audit_2r_v1.py
      - name: Mypy
        run: |
          mypy             src/qore/infrastructure/trader_lab/capitalizer_cognitive_destination_departure_binding_audit_2r_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov             tests/infrastructure/trader_lab/test_capitalizer_cognitive_destination_departure_binding_audit_2r_v1.py

  audit:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download true-2R cognitive rebase
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cognitive-economic-rebase-2r-v1-${{ env.REBASE_SHA }}
          path: rebase-input
          github-token: ${{ github.token }}
          run-id: ${{ env.REBASE_RUN_ID }}

      - name: Download Target V2 USDJPY
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-target-destination-v2-USDJPY-${{ env.TARGET_SHA }}
          path: target-input/USDJPY
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Download Target V2 AUDJPY
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-target-destination-v2-AUDJPY-${{ env.TARGET_SHA }}
          path: target-input/AUDJPY
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Download Target V2 AUDUSD
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-target-destination-v2-AUDUSD-${{ env.TARGET_SHA }}
          path: target-input/AUDUSD
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Download Target V2 GBPJPY
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-target-destination-v2-GBPJPY-${{ env.TARGET_SHA }}
          path: target-input/GBPJPY
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Download Target V2 EURUSD
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-target-destination-v2-EURUSD-${{ env.TARGET_SHA }}
          path: target-input/EURUSD
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Download Target V2 GBPUSD
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-target-destination-v2-GBPUSD-${{ env.TARGET_SHA }}
          path: target-input/GBPUSD
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Download Target V2 XAUUSD
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-target-destination-v2-XAUUSD-${{ env.TARGET_SHA }}
          path: target-input/XAUUSD
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Download Target V2 USDCAD
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-target-destination-v2-USDCAD-${{ env.TARGET_SHA }}
          path: target-input/USDCAD
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Download Target V2 NAS100
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-target-destination-v2-NAS100-${{ env.TARGET_SHA }}
          path: target-input/NAS100
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}

      - name: Build strict departure-time destination binding audit
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cognitive_destination_departure_binding_audit_2r_v1             rebase-input target-input destination-output
      - name: Enforce destination binding controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "destination-output/"
                  "capitalizer-cognitive-destination-departure-binding-audit-2r-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_COGNITIVE_DESTINATION_DEPARTURE_BINDING_AUDIT_2R_V1"
          )
          assert report["source_rebase_run_id"] == 36078677895
          assert report["source_target_run_id"] == 35204892665
          assert report["target_r"] == "2.00"
          assert report["control_trades"] == 948

          provenance = report["by_provenance"]
          assert provenance["CAUSAL_ARBITRATION_BASE"]["trades"] == 840
          assert provenance["CAUSAL_ARBITRATION_BASE"]["m5_closeback_token"] == 840
          assert provenance["PROTECTED_SWING_GEOMETRY_RESCUE"]["trades"] == 105
          assert provenance["PROTECTED_SWING_GEOMETRY_RESCUE"]["m5_closeback_token"] == 0
          assert provenance["WAIT_REJECTED_PARALLEL_REARM"]["trades"] == 3
          assert provenance["WAIT_REJECTED_PARALLEL_REARM"]["m5_closeback_token"] == 0

          assert report["target_ledger_files"] == 9
          assert report["target_symbols_seen"] == 9
          assert len(report["by_market"]) == 9
          assert report["requested_exact_departure_keys"] > 0
          assert report["destination_departure_evidence_bound_trades"] > 0
          assert report["destination_departure_evidence_bound_trades"] <= 840
          assert report["future_evidence_violations"] == 0
          assert report["target_result_fields_read"] is False
          assert report["target_touch_fields_used"] is False
          assert report["departure_context_known_by_entry_supported"] is True
          assert report["destination_current_at_entry_supported"] is False
          assert report["destination_available_at_entry_supported"] is False
          assert report["destination_intelligence_supported"] is False
          assert report["current_trade_outcome_visible_to_binding"] is False
          assert report["missing_evidence_fabricated"] is False
          assert report["rebase_control_reproduced"] is True
          assert report["strategy_rules_changed"] is False
          assert report["cognitive_rules_changed"] is False
          assert report["entry_changed"] is False
          assert report["stop_changed"] is False
          assert report["target_changed"] is False
          assert report["max3_changed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-cognitive-destination-departure-binding-audit-2r-v1-${{ github.sha }}
          path: destination-output
          if-no-files-found: error
          retention-days: 90
