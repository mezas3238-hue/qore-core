name: QORE VT-08 R3.9 Source Contract Freeze

on:
  push:
    branches:
      - agent/vt08-r3-9-source-contract-freeze-001
    paths:
      - .github/workflows/vt08-r3-9-source-contract-freeze.yml
      - src/qore/infrastructure/traders/vt08_b01_source_contract_r3_9.py
      - src/qore/infrastructure/trader_lab/vt08_b01_causal_h01_h04_r3_9.py
      - tests/infrastructure/traders/test_vt08_b01_source_contract_r3_9.py
      - tests/infrastructure/trader_lab/test_vt08_b01_causal_h01_h04_r3_9.py
      - docs/research/trader-lab/VT08-R3-9-FINAL-SOURCE-CONTRACT.md
  pull_request:
    branches:
      - agent/vt08-r3-8-causal-h01-h04-001
    paths:
      - .github/workflows/vt08-r3-9-source-contract-freeze.yml
      - src/qore/infrastructure/traders/vt08_b01_source_contract_r3_9.py
      - src/qore/infrastructure/trader_lab/vt08_b01_causal_h01_h04_r3_9.py
      - tests/infrastructure/traders/test_vt08_b01_source_contract_r3_9.py
      - tests/infrastructure/trader_lab/test_vt08_b01_causal_h01_h04_r3_9.py
      - docs/research/trader-lab/VT08-R3-9-FINAL-SOURCE-CONTRACT.md
  workflow_dispatch:

concurrency:
  group: qore-vt08-r3-9-source-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact source-contract head
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff full gate
        run: ruff check .
      - name: Mypy full gate
        run: mypy src tests
      - name: VT-08 R3.9 source-contract focused gate
        run: |
          pytest -q \
            tests/infrastructure/traders/test_vt08_b01_source_contract_r3_9.py \
            tests/infrastructure/trader_lab/test_vt08_b01_causal_h01_h04_r3_9.py
      - name: Existing VT-08 R3.8 regression gate
        run: |
          pytest -q \
            tests/infrastructure/traders/test_vt08_b01_r3_8.py \
            tests/infrastructure/trader_lab/test_vt08_b01_causal_h01_h04_r3_8.py \
            tests/infrastructure/trader_lab/test_vt08_b01_h01_diagnostics_r3_8.py
      - name: Trader Lab regression gate
        run: pytest -q tests/infrastructure/trader_lab
      - name: Pytest full quality gate
        run: pytest --cov=src/qore --cov-report=term-missing

  source-contract-artifact:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source-contract head
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QORE
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Emit frozen source-to-code contract
        run: |
          mkdir -p artifacts/vt08-r3-9
          python -m qore.infrastructure.traders.vt08_b01_source_contract_r3_9 \
            > artifacts/vt08-r3-9/source-contract.json
          printf '%s\n' "$GITHUB_SHA" > artifacts/vt08-r3-9/git-sha.txt
      - name: Enforce source-first governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("artifacts/vt08-r3-9/source-contract.json").read_text())
          assert payload["schema"] == "qore.traders.vt08_b01_source_contract.r3.9.v1"
          assert payload["trader_code"] == "vt-08"
          assert payload["source_entry_anchors_ny"] == [1, 5, 9]
          assert 13 not in payload["source_entry_anchors_ny"]
          assert payload["r38_alignment"]["aligned"] is True
          assert payload["fresh_holdout_governance"]["required"] is True
          assert payload["fresh_holdout_governance"]["independent_validation_authorized"] is False
          assert payload["execution_authority"]["demo_eligible"] is False
          assert payload["execution_authority"]["live"] is False
          assert payload["execution_authority"]["real_capital"] is False
          rules = {item["rule_id"]: item for item in payload["rules"]}
          assert rules["source-day"]["authority"] == "fundamentally-unresolved"
          assert rules["target-family"]["authority"] == "context-dependent-source-family"
          assert rules["target-family"]["qore_behavior"] == "fixed-2r-research-replay-containment"
          assert rules["h4-filled-lifecycle"]["authority"] == "fundamentally-unresolved"
          assert rules["order-type"]["authority"] == "fundamentally-unresolved"
          assert rules["forex-entry-anchors"]["source_behavior"] == "01/05/09 America/New_York"
          assert rules["c3-path"]["qore_behavior"] == "outside-current-r3.8-narrow-c2-subset"
          PY
      - name: Upload frozen contract artifact
        uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-r3-9-source-contract-${{ github.sha }}
          path: artifacts/vt08-r3-9
          if-no-files-found: error
          retention-days: 30
