          assert lifecycle['fresh_holdout_claimed'] is False
          assert lifecycle['rule_selected'] is False
          assert lifecycle['promotion_allowed'] is False
          assert lifecycle['state_family_counts']['RECLAIM_ALL_FRESH'] > 0
