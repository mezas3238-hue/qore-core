name: QORE Capitalizer USDJPY R0 Loss Forensics V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-usdjpy-r0-loss-forensics-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_r0_loss_forensics.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_r0_acceptance_failure_forensics.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_r0_root_cause_forensics.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_cognitive_v2_development.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_position_lifecycle_forensics.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_departure_timing_forensics.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_h1_episode_multiplicity_forensics.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_h1_source_age_forensics.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_r0_loss_forensics.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_r0_acceptance_failure_forensics.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_r0_root_cause_forensics.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_cognitive_v2_development.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_position_lifecycle_forensics.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_departure_timing_forensics.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_h1_episode_multiplicity_forensics.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_h1_source_age_forensics.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-usdjpy-r0-loss-forensics-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_M5_RUN_ID: '35166210458'
  SOURCE_M5_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-USDJPY-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  SOURCE_JOURNEY_RUN_ID: '35175979474'
  SOURCE_JOURNEY_ARTIFACT: 'qore-cibo-market-journey-USDJPY-9cc0f17a2f30846d61b242132547f39391909656'
  SOURCE_TARGET_RUN_ID: '35204892665'
  SOURCE_TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-USDJPY-2f510461b3360e91d5ee70a72716a76cd6561f16'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Quality
        run: |
          ruff check --ignore E501 \
            src/qore/infrastructure/trader_lab/capitalizer_r0_loss_forensics.py \
            src/qore/infrastructure/trader_lab/capitalizer_r0_acceptance_failure_forensics.py \
            src/qore/infrastructure/trader_lab/capitalizer_r0_root_cause_forensics.py \
            src/qore/infrastructure/trader_lab/capitalizer_cognitive_v2_development.py \
            src/qore/infrastructure/trader_lab/capitalizer_position_lifecycle_forensics.py \
            src/qore/infrastructure/trader_lab/capitalizer_departure_timing_forensics.py \
            src/qore/infrastructure/trader_lab/capitalizer_h1_episode_multiplicity_forensics.py \
            src/qore/infrastructure/trader_lab/capitalizer_h1_source_age_forensics.py \
            tests/infrastructure/trader_lab/test_capitalizer_r0_loss_forensics.py \
            tests/infrastructure/trader_lab/test_capitalizer_r0_acceptance_failure_forensics.py \
            tests/infrastructure/trader_lab/test_capitalizer_r0_root_cause_forensics.py \
            tests/infrastructure/trader_lab/test_capitalizer_cognitive_v2_development.py \
            tests/infrastructure/trader_lab/test_capitalizer_position_lifecycle_forensics.py \
            tests/infrastructure/trader_lab/test_capitalizer_departure_timing_forensics.py \
            tests/infrastructure/trader_lab/test_capitalizer_h1_episode_multiplicity_forensics.py \
            tests/infrastructure/trader_lab/test_capitalizer_h1_source_age_forensics.py
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_r0_loss_forensics.py \
            src/qore/infrastructure/trader_lab/capitalizer_r0_acceptance_failure_forensics.py \
            src/qore/infrastructure/trader_lab/capitalizer_r0_root_cause_forensics.py \
            src/qore/infrastructure/trader_lab/capitalizer_cognitive_v2_development.py \
            src/qore/infrastructure/trader_lab/capitalizer_position_lifecycle_forensics.py \
            src/qore/infrastructure/trader_lab/capitalizer_departure_timing_forensics.py \
            src/qore/infrastructure/trader_lab/capitalizer_h1_episode_multiplicity_forensics.py \
            src/qore/infrastructure/trader_lab/capitalizer_h1_source_age_forensics.py
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_r0_loss_forensics.py \
            tests/infrastructure/trader_lab/test_capitalizer_r0_acceptance_failure_forensics.py \
            tests/infrastructure/trader_lab/test_capitalizer_r0_root_cause_forensics.py \
            tests/infrastructure/trader_lab/test_capitalizer_cognitive_v2_development.py \
            tests/infrastructure/trader_lab/test_capitalizer_position_lifecycle_forensics.py \
            tests/infrastructure/trader_lab/test_capitalizer_departure_timing_forensics.py \
            tests/infrastructure/trader_lab/test_capitalizer_h1_episode_multiplicity_forensics.py \
            tests/infrastructure/trader_lab/test_capitalizer_h1_source_age_forensics.py

  forensics:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download M5
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_M5_ARTIFACT }}
          path: m5-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M5_RUN_ID }}
      - name: Download Journey
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_JOURNEY_ARTIFACT }}
          path: journey-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_JOURNEY_RUN_ID }}
      - name: Download Target V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_TARGET_ARTIFACT }}
          path: target-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_TARGET_RUN_ID }}
      - name: Run R0 loss forensics
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_r0_loss_forensics \
            m5-source journey-source target-source forensic-output
      - name: Run acceptance failure forensics
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_r0_acceptance_failure_forensics \
            m5-source journey-source target-source forensic-output
      - name: Run causal root-cause forensics
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_r0_root_cause_forensics \
            m5-source journey-source target-source forensic-output
      - name: Run Cognitive V2 structural development replay
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cognitive_v2_development \
            m5-source journey-source target-source forensic-output
      - name: Run Position Intelligence lifecycle forensics
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_position_lifecycle_forensics \
            m5-source journey-source target-source forensic-output
      - name: Run natural-H1 departure timing forensics
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_departure_timing_forensics \
            m5-source journey-source target-source forensic-output
      - name: Run H1 episode multiplicity residual-DD forensics
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_h1_episode_multiplicity_forensics \
            m5-source journey-source target-source forensic-output
      - name: Run H1 source-boundary age residual-DD forensics
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_h1_source_age_forensics \
            m5-source journey-source target-source forensic-output
      - name: Enforce diagnostic-only governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              'forensic-output/capitalizer-usdjpy-r0-loss-forensics-v1.json'
          )
          result = json.loads(path.read_text())
          assert result['identity'] == 'QORE_CAPITALIZER_R0_LOSS_FORENSICS_V1'
          assert result['symbol'] == 'USDJPY'
          assert result['overall']['trades'] > 0
          assert result['evidence_status'] == 'CONSUMED_RESEARCH_EVIDENCE'
          assert result['diagnostic_only'] is True
          assert result['filter_selected'] is False
          assert result['candidate_revision_defined'] is False
          assert result['execution_costs_applied'] is False
          assert result['fresh_holdout_claimed'] is False
          assert result['rule_promotion_allowed'] is False
          assert len(result['by_year']) >= 5
          assert len(result['by_side']) == 2
          assert len(result['by_ny_hour']) > 0
          assert len(result['longest_loss_streaks']) > 0

          acceptance = json.loads(
              Path(
                  'forensic-output/'
                  'capitalizer-usdjpy-r0-acceptance-failure-v1.json'
              ).read_text()
          )
          assert acceptance['identity'] == (
              'QORE_CAPITALIZER_R0_ACCEPTANCE_FAILURE_FORENSICS_V1'
          )
          assert acceptance['acceptance_trades'] > 0
          assert acceptance['causal_features_only'] is True
          assert acceptance['outcome_used_as_label_only'] is True
          assert acceptance['filter_selected'] is False
          assert acceptance['candidate_revision_defined'] is False
          assert acceptance['execution_costs_applied'] is False
          assert acceptance['fresh_holdout_claimed'] is False
          assert acceptance['rule_promotion_allowed'] is False

          root = json.loads(
              Path(
                  'forensic-output/'
                  'capitalizer-usdjpy-r0-root-cause-v1.json'
              ).read_text()
          )
          assert root['identity'] == 'QORE_CAPITALIZER_R0_ROOT_CAUSE_FORENSICS_V1'
          assert root['acceptance_trades'] > 0
          assert root['diagnostic_only'] is True
          assert root['causal_features_only'] is True
          assert root['outcome_used_as_label_only'] is True
          assert root['threshold_optimization_used'] is False
          assert root['filter_selected'] is False
          assert root['candidate_revision_defined'] is False
          assert root['execution_costs_applied'] is False
          assert root['fresh_holdout_claimed'] is False
          assert root['rule_promotion_allowed'] is False
          assert root['worst_streak_length'] > 0
          assert len(root['by_state']) >= 3
          assert len(root['annual']) >= 5

          cognitive = json.loads(
              Path(
                  'forensic-output/'
                  'capitalizer-usdjpy-cognitive-v2-development-v1.json'
              ).read_text()
          )
          assert cognitive['identity'] == (
              'QORE_CAPITALIZER_COGNITIVE_V2_DEVELOPMENT_REPLAY_V1'
          )
          assert cognitive['development_only'] is True
          assert cognitive['causal_features_only'] is True
          assert cognitive['numeric_threshold_optimization_used'] is False
          assert cognitive['position_intelligence_changed'] is False
          assert cognitive['execution_costs_applied'] is False
          assert cognitive['portfolio_cross_market_allocator_applied'] is False
          assert cognitive['candidate_frozen'] is False
          assert cognitive['fresh_holdout_claimed'] is False
          assert cognitive['rule_promotion_allowed'] is False
          names = {row['name'] for row in cognitive['ablations']}
          assert names == {
              'FRESHNESS_ONLY',
              'JOURNEY_CONFLICT_ONLY',
              'STRUCTURAL_V2',
              'STRUCTURAL_V2_MAX2_SESSION',
          }

          lifecycle = json.loads(
              Path(
                  'forensic-output/'
                  'capitalizer-usdjpy-position-lifecycle-v1.json'
              ).read_text()
          )
          assert lifecycle['identity'] == (
              'QORE_CAPITALIZER_POSITION_LIFECYCLE_FORENSICS_V1'
          )
          assert lifecycle['development_only'] is True
          assert lifecycle['entry_cognition_changed'] is False
          assert lifecycle['causal_stop_updates_only'] is True
          assert lifecycle['stop_can_widen'] is False
          assert lifecycle['target_changed'] is False
          assert lifecycle['numeric_profit_threshold_optimized'] is False
          assert lifecycle['costs_applied'] is False
          assert lifecycle['candidate_frozen'] is False
          assert lifecycle['fresh_holdout_claimed'] is False
          assert lifecycle['rule_selected'] is False
          assert lifecycle['promotion_allowed'] is False
          assert lifecycle['state_family_counts']['RECLAIM_ALL_FRESH'] > 0
          assert lifecycle['state_family_counts']['NO_RECLAIM_FRESH'] > 0
          assert lifecycle['state_family_counts']['REJECTION_ROUTE'] > 0
          assert {row['mode'] for row in lifecycle['ablations']} == {
              'SWING_IMPROVE',
              'PROFITABLE_SWING_LOCK',
              'RECLAIM_FRESH_PROFITABLE_SWING_LOCK',
          }

          timing = json.loads(
              Path(
                  'forensic-output/'
                  'capitalizer-usdjpy-departure-timing-v1.json'
              ).read_text()
          )
          assert timing['identity'] == (
              'QORE_CAPITALIZER_DEPARTURE_TIMING_FORENSICS_V1'
          )
          assert timing['h1_duration_minutes'] == 60
          assert timing['timing_features_causal'] is True
          assert timing['optimized_numeric_threshold_used'] is False
          assert timing['boundary_semantics'] == 'SOURCE_TIMEFRAME_DURATION'
          assert timing['target_changed'] is False
          assert timing['candidate_frozen'] is False
          assert timing['costs_applied'] is False
          assert timing['fresh_holdout_claimed'] is False
          assert timing['rule_selected'] is False
          assert timing['promotion_allowed'] is False
          assert {row['name'] for row in timing['ablations']} == {
              'DROP_SOURCE_CROSS_H1',
              'DROP_CISD_CROSS_H1',
              'DROP_NORECLAIM_SOURCE_CROSS_H1',
              'DROP_NORECLAIM_CISD_CROSS_H1',
          }

          multiplicity = json.loads(
              Path(
                  'forensic-output/'
                  'capitalizer-usdjpy-h1-multiplicity-v1.json'
              ).read_text()
          )
          assert multiplicity['identity'] == (
              'QORE_CAPITALIZER_H1_EPISODE_MULTIPLICITY_FORENSICS_V1'
          )
          assert multiplicity['development_only'] is True
          assert multiplicity['categorical_causal_feature_only'] is True
          assert multiplicity['numeric_threshold_optimization_used'] is False
          assert multiplicity['costs_applied'] is False
          assert multiplicity['candidate_frozen'] is False
          assert multiplicity['fresh_holdout_claimed'] is False
          assert multiplicity['rule_selected'] is False
          assert multiplicity['promotion_allowed'] is False
          assert {row['name'] for row in multiplicity['ablations']} == {
              'DROP_MULTI_EPISODE_ALL',
              'DROP_MULTI_EPISODE_RECLAIM_ONLY',
              'DROP_MULTI_EPISODE_NORECLAIM_ONLY',
          }

          source_age = json.loads(
              Path(
                  'forensic-output/'
                  'capitalizer-usdjpy-h1-source-age-v1.json'
              ).read_text()
          )
          assert source_age['identity'] == (
              'QORE_CAPITALIZER_H1_SOURCE_AGE_FORENSICS_V1'
          )
          assert source_age['development_only'] is True
          assert source_age['structural_timeframe_relation_only'] is True
          assert source_age['numeric_threshold_optimization_used'] is False
          assert source_age['costs_applied'] is False
          assert source_age['candidate_frozen'] is False
          assert source_age['fresh_holdout_claimed'] is False
          assert source_age['rule_selected'] is False
          assert source_age['promotion_allowed'] is False
          assert {row['name'] for row in source_age['ablations']} == {
              'DROP_OLDER_H1_SOURCE_ALL',
              'DROP_OLDER_H1_SOURCE_RECLAIM_ONLY',
              'DROP_OLDER_H1_SOURCE_NORECLAIM_ONLY',
          }
          PY
      - name: Upload immutable R0 forensics
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-usdjpy-r0-loss-forensics-v1-${{ github.sha }}
          path: forensic-output
          if-no-files-found: error
          retention-days: 90
