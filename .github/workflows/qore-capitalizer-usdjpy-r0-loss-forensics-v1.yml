permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-usdjpy-r0-loss-forensics-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_M5_RUN_ID: '35166210458'
  SOURCE_M5_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-USDJPY-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  SOURCE_JOURNEY_RUN_ID: '35175979474'
  SOURCE_JOURNEY_ARTIFACT: 'qore-cibo-market-journey-USDJPY-9cc0f17a2f30846d61b242132547f39391909656'
  SOURCE_TARGET_RUN_ID: '35204892665'
  SOURCE_TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-USDJPY-2f510461b3360e91d5ee70a72716a76cd6561f16'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Quality
        run: |
          ruff check --ignore E501 \
            src/qore/infrastructure/trader_lab/capitalizer_r0_loss_forensics.py \
            src/qore/infrastructure/trader_lab/capitalizer_r0_acceptance_failure_forensics.py \
            src/qore/infrastructure/trader_lab/capitalizer_r0_root_cause_forensics.py \
            src/qore/infrastructure/trader_lab/capitalizer_cognitive_v2_development.py \
            src/qore/infrastructure/trader_lab/capitalizer_position_lifecycle_forensics.py \
            src/qore/infrastructure/trader_lab/capitalizer_departure_timing_forensics.py \
            src/qore/infrastructure/trader_lab/capitalizer_h1_episode_multiplicity_forensics.py \
            src/qore/infrastructure/trader_lab/capitalizer_h1_source_age_forensics.py \
            src/qore/infrastructure/trader_lab/capitalizer_h1_boundary_type_forensics.py \
            src/qore/infrastructure/trader_lab/capitalizer_reclaim_phase_forensics.py \
            src/qore/infrastructure/trader_lab/capitalizer_residual_dd_trace.py \
            src/qore/infrastructure/trader_lab/capitalizer_joint_state_forensics.py \
            src/qore/infrastructure/trader_lab/capitalizer_joint_state_ablation.py \
            tests/infrastructure/trader_lab/test_capitalizer_r0_loss_forensics.py \
            tests/infrastructure/trader_lab/test_capitalizer_r0_acceptance_failure_forensics.py \
            tests/infrastructure/trader_lab/test_capitalizer_r0_root_cause_forensics.py \
            tests/infrastructure/trader_lab/test_capitalizer_cognitive_v2_development.py \
            tests/infrastructure/trader_lab/test_capitalizer_position_lifecycle_forensics.py \
            tests/infrastructure/trader_lab/test_capitalizer_departure_timing_forensics.py \
            tests/infrastructure/trader_lab/test_capitalizer_h1_episode_multiplicity_forensics.py \
            tests/infrastructure/trader_lab/test_capitalizer_h1_source_age_forensics.py \
            tests/infrastructure/trader_lab/test_capitalizer_h1_boundary_type_forensics.py \
            tests/infrastructure/trader_lab/test_capitalizer_reclaim_phase_forensics.py \
            tests/infrastructure/trader_lab/test_capitalizer_joint_state_forensics.py \
            tests/infrastructure/trader_lab/test_capitalizer_joint_state_ablation.py
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_r0_loss_forensics.py \
            src/qore/infrastructure/trader_lab/capitalizer_r0_acceptance_failure_forensics.py \
            src/qore/infrastructure/trader_lab/capitalizer_r0_root_cause_forensics.py \
            src/qore/infrastructure/trader_lab/capitalizer_cognitive_v2_development.py \
            src/qore/infrastructure/trader_lab/capitalizer_position_lifecycle_forensics.py \
            src/qore/infrastructure/trader_lab/capitalizer_departure_timing_forensics.py \
            src/qore/infrastructure/trader_lab/capitalizer_h1_episode_multiplicity_forensics.py \
            src/qore/infrastructure/trader_lab/capitalizer_h1_source_age_forensics.py \
            src/qore/infrastructure/trader_lab/capitalizer_h1_boundary_type_forensics.py \
            src/qore/infrastructure/trader_lab/capitalizer_reclaim_phase_forensics.py \
            src/qore/infrastructure/trader_lab/capitalizer_residual_dd_trace.py \
            src/qore/infrastructure/trader_lab/capitalizer_joint_state_forensics.py \
            src/qore/infrastructure/trader_lab/capitalizer_joint_state_ablation.py
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_r0_loss_forensics.py \
            tests/infrastructure/trader_lab/test_capitalizer_r0_acceptance_failure_forensics.py \
            tests/infrastructure/trader_lab/test_capitalizer_r0_root_cause_forensics.py \
            tests/infrastructure/trader_lab/test_capitalizer_cognitive_v2_development.py \
            tests/infrastructure/trader_lab/test_capitalizer_position_lifecycle_forensics.py \
            tests/infrastructure/trader_lab/test_capitalizer_departure_timing_forensics.py \
            tests/infrastructure/trader_lab/test_capitalizer_h1_episode_multiplicity_forensics.py \
            tests/infrastructure/trader_lab/test_capitalizer_h1_source_age_forensics.py \
            tests/infrastructure/trader_lab/test_capitalizer_h1_boundary_type_forensics.py \
            tests/infrastructure/trader_lab/test_capitalizer_reclaim_phase_forensics.py \
            tests/infrastructure/trader_lab/test_capitalizer_joint_state_forensics.py \
            tests/infrastructure/trader_lab/test_capitalizer_joint_state_ablation.py

  forensics:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download M5
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_M5_ARTIFACT }}
          path: m5-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M5_RUN_ID }}
      - name: Download Journey
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_JOURNEY_ARTIFACT }}
          path: journey-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_JOURNEY_RUN_ID }}
      - name: Download Target V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_TARGET_ARTIFACT }}
          path: target-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_TARGET_RUN_ID }}
      - name: Run R0 loss forensics
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_r0_loss_forensics \
            m5-source journey-source target-source forensic-output
      - name: Run acceptance failure forensics
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_r0_acceptance_failure_forensics \
            m5-source journey-source target-source forensic-output
      - name: Run causal root-cause forensics
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_r0_root_cause_forensics \
            m5-source journey-source target-source forensic-output
      - name: Run Cognitive V2 structural development replay
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cognitive_v2_development \
            m5-source journey-source target-source forensic-output
      - name: Run Position Intelligence lifecycle forensics
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_position_lifecycle_forensics \
            m5-source journey-source target-source forensic-output
      - name: Run natural-H1 departure timing forensics
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_departure_timing_forensics \
            m5-source journey-source target-source forensic-output
      - name: Run H1 episode multiplicity residual-DD forensics
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_h1_episode_multiplicity_forensics \
            m5-source journey-source target-source forensic-output
      - name: Run H1 source-boundary age residual-DD forensics
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_h1_source_age_forensics \
            m5-source journey-source target-source forensic-output
      - name: Run H1 source-boundary type residual-DD forensics
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_h1_boundary_type_forensics \
            m5-source journey-source target-source forensic-output
      - name: Run causal reclaim-phase residual-DD forensics
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_reclaim_phase_forensics \
            m5-source journey-source target-source forensic-output
      - name: Write exact residual-DD causal trace
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_residual_dd_trace \
            m5-source journey-source target-source forensic-output
      - name: Characterize full-baseline joint causal states
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_joint_state_forensics \
            m5-source journey-source target-source forensic-output
      - name: Run targeted joint-state categorical ablations
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_joint_state_ablation \
            m5-source journey-source target-source forensic-output
      - name: Enforce diagnostic-only governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              'forensic-output/capitalizer-usdjpy-r0-loss-forensics-v1.json'
