          assert root['identity'] == 'QORE_CAPITALIZER_R0_ROOT_CAUSE_FORENSICS_V1'
          assert root['acceptance_trades'] > 0
          assert root['diagnostic_only'] is True
          assert root['causal_features_only'] is True
          assert root['outcome_used_as_label_only'] is True
          assert root['threshold_optimization_used'] is False
          assert root['filter_selected'] is False
          assert root['candidate_revision_defined'] is False
          assert root['execution_costs_applied'] is False
