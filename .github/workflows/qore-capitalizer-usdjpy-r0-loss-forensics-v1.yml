          multiplicity = json.loads(
              Path(
                  'forensic-output/'
                  'capitalizer-usdjpy-h1-multiplicity-v1.json'
              ).read_text()
          )
          assert multiplicity['identity'] == (
              'QORE_CAPITALIZER_H1_EPISODE_MULTIPLICITY_FORENSICS_V1'
          )
          assert multiplicity['development_only'] is True
          assert multiplicity['categorical_causal_feature_only'] is True
          assert multiplicity['numeric_threshold_optimization_used'] is False
