name: QORE Capitalizer MAX_RECOVERY Target1 Stability 2Y V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-max-recovery-target1-stability-2y-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_max_recovery_target1_stability_2y_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_max_recovery_target1_stability_2y_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  TARGET_RUN_ID: '35941710028'
  TARGET_SHA: '00dcd48d702d6a0c1c45abb69a3714a8ac66497b'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_max_recovery_target1_stability_2y_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_max_recovery_target1_stability_2y_v1.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_max_recovery_target1_stability_2y_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_max_recovery_target1_stability_2y_v1.py

  stability:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-max-recovery-target-sensitivity-2y-v1-*-${{ env.TARGET_SHA }}
          path: target-input
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Freeze 1R candidate and build stability atlas
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_max_recovery_target1_stability_2y_v1 \
            target-input stability-output
      - name: Enforce candidate controls
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          report = json.loads(
              Path(
                  "stability-output/"
                  "capitalizer-max-recovery-target1-stability-2y-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_MAX_RECOVERY_TARGET1_STABILITY_2Y_V1"
          )
          assert report["candidate_target_r"] == "1.00"
          assert report["raw_trades"] == 963
          assert report["max3_trades"] == 948
          assert Decimal(report["metrics"]["profit_factor"]) == Decimal(
              "2.608801712095744666571338155"
          )
          assert Decimal(report["metrics"]["total_r"]) == Decimal(
              "444.4738316646191578343575863"
          )
          assert Decimal(report["metrics"]["max_drawdown_r"]) == Decimal(
              "8.671360188479779752380440576"
          )
          assert report["metrics"]["max_losing_streak"] == 5
          assert report["market_count"] == 9
          assert report["session_count"] == 3
          assert report["selection_changed"] is False
          assert report["entry_changed"] is False
          assert report["stop_changed"] is False
          assert report["h1_deadline_changed"] is False
          assert report["max3_changed"] is False
          assert report["only_target_r_frozen"] is True
          assert report["target_reoptimization_allowed"] is False
          assert report["selected_from_consumed_grid"] is True
          assert report["fresh_holdout_claimed"] is False
          assert report["outcome_used_for_admission"] is False
          assert report["automatic_promotion_allowed"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-max-recovery-target1-stability-2y-v1-${{ github.sha }}
          path: stability-output
          if-no-files-found: error
          retention-days: 90
