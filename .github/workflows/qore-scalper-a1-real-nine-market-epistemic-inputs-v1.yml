name: QORE Scalper A1 Real Nine-Market Epistemic Cognition Input V1

on:
  push:
    branches:
      - agent/scalper-architect-a-cognition-20261010
    paths:
      - '.github/workflows/qore-scalper-a1-real-nine-market-epistemic-inputs-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_a1_native_nine_market_epistemic_inputs_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_a1_native_nine_market_epistemic_inputs_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  NATIVE_WORLD_RUN: '38080367716'
  NATIVE_WORLD_SHA: '435e2369f1ed94d7130d328115d2402dcd4e5b84'

jobs:
  type_real_epistemic_inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install typed research contracts
        run: python -m pip install -e '.[dev]'
      - name: Assert cross-market M1 cannot forge quote freshness, NY clock, regime or causal relation
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_a1_native_nine_market_epistemic_inputs_v1.py tests/infrastructure/trader_lab/test_capitalizer_a1_native_nine_market_epistemic_inputs_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_a1_native_nine_market_epistemic_inputs_v1.py tests/infrastructure/trader_lab/test_capitalizer_a1_native_nine_market_epistemic_inputs_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_a1_native_nine_market_epistemic_inputs_v1.py
      - name: Download ALL nine pinned provider-native synchronized M1 evidence books
        uses: actions/download-artifact@v4
        with:
          pattern: scalper-a1-native-nine-world-*-${{ env.NATIVE_WORLD_SHA }}
          path: pinned-native-nine-world
          github-token: ${{ github.token }}
          run-id: ${{ env.NATIVE_WORLD_RUN }}
          merge-multiple: false
      - name: Build ACTUAL nine-Market Brain perception/regime/cross-market typed inputs per M1 decision barrier
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_a1_native_nine_market_epistemic_inputs_v1 pinned-native-nine-world cognitive-inputs
      - name: Reconcile real 2876 sources across 2822 barriers without fake full-brain replay
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("cognitive-inputs/scalper-a1-nine-market-epistemic-inputs-summary.json").read_text())
          x=d["counts"]
          assert d["markets"]==9 and d["original_decision_instants"]==2822
          assert d["original_source_opportunities"]==2876
          assert d["genuine_perception_snapshots_constructed"]==25398
          assert d["genuine_unresolved_regime_hypotheses_constructed"]==25398
          assert d["unknown_causal_pair_edges_represented"]==101592
          assert x["ALL_NINE_EXACT_CLOSED_NATIVE_M1:True"]==2791
          assert x["ALL_NINE_EXACT_CLOSED_NATIVE_M1:False"]==31
          assert x["PERCEPTION:BAD"]==25398
          assert x["REGIME:UNRESOLVED"]==25398
          assert not any(d[k] for k in (
              "broker_quotes_attested", "session_clock_attested",
              "capitalizer_global_world_model_completed",
              "portfolio_ledger_completed",
              "full_historical_master_frame_replay",
              "trader_certified", "live_authorized"))
          assert d["source_entries_filtered"]==0
          assert d["cognitive_profit_factor"] is None
          assert d["cognitive_drawdown_r"] is None
          print("REAL NINE-MARKET COGNITION INPUT ATTESTATION:",json.dumps(d,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-a1-real-native-nine-market-epistemic-inputs-${{ github.sha }}
          path: cognitive-inputs/
          retention-days: 90
          if-no-files-found: error
