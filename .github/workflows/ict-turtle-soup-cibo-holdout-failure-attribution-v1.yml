name: QORE ICT Turtle Soup CIBO Holdout Failure Attribution V1

on:
  workflow_dispatch:
  push:
    branches:
      - agent/ict-turtle-soup-behavior-lab-v1-001
    paths:
      - '.github/workflows/ict-turtle-soup-cibo-holdout-failure-attribution-v1.yml'
      - 'src/qore/infrastructure/trader_lab/ict_turtle_soup_cibo_holdout_failure_attribution_v1.py'
      - 'tests/infrastructure/trader_lab/test_ict_turtle_soup_cibo_holdout_failure_attribution_v1.py'
      - 'docs/research/ICT-TURTLE-SOUP-CIBO-HOLDOUT-FAILURE-ATTRIBUTION-V1-FREEZE.md'

permissions:
  contents: read
  actions: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install QORE development dependencies
        run: pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          # E501/E741 are confined to report strings/test helper names and do not
          # alter the frozen attribution mechanics. All other Ruff rules remain hard gates.
          ruff check --ignore E501,E741 \
            src/qore/infrastructure/trader_lab/ict_turtle_soup_cibo_holdout_failure_attribution_v1.py \
            tests/infrastructure/trader_lab/test_ict_turtle_soup_cibo_holdout_failure_attribution_v1.py
      - name: Mypy focused gate
        run: mypy src/qore/infrastructure/trader_lab/ict_turtle_soup_cibo_holdout_failure_attribution_v1.py
      - name: Focused attribution tests
        run: pytest -q --no-cov tests/infrastructure/trader_lab/test_ict_turtle_soup_cibo_holdout_failure_attribution_v1.py
      - name: Freeze governance assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/research/ICT-TURTLE-SOUP-CIBO-HOLDOUT-FAILURE-ATTRIBUTION-V1-FREEZE.md').read_text()
          assert 'Run `35118222306`' in p
          assert 'Run `35125861002`' in p
          assert 'No alternate buffer is tested.' in p
          assert 'No new target hierarchy may be created from these results.' in p
          assert 'DEMO_ELIGIBLE=false' in p
          assert 'LIVE_AUTHORIZED=false' in p
          assert 'REAL_CAPITAL_AUTHORIZED=false' in p
          assert 'PRODUCTION_AUTHORIZED=false' in p
          PY

  failure-attribution:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install QORE
        run: pip install -e .
      - name: Download authoritative Behavior Lab artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: mezas3238-hue/qore-core
          run-id: 35125861002
          name: qore-ict-ts-behavior-lab-v1-fx-pilot-4d09a43aa5795624b4a7cb29bb2503ae586c5a4f
          path: evidence/behavior-lab
      - name: Download authoritative R5 aggregate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: mezas3238-hue/qore-core
          run-id: 35118222306
          name: qore-ict-ts-r5-aggregate-9beb2f8147db2b9fb780bc4cc28e2cdb05b7851e
          path: evidence/r5-aggregate
      - name: Download authoritative seven-market R5 artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: mezas3238-hue/qore-core
          run-id: 35118222306
          pattern: qore-ict-ts-r5-*-9beb2f8147db2b9fb780bc4cc28e2cdb05b7851e
          path: evidence/r5-markets
          merge-multiple: false
      - name: Verify frozen evidence inventory
        shell: bash
        run: |
          set -euo pipefail
          test -f evidence/behavior-lab/events.csv
          test -f evidence/r5-aggregate/trades.json
          count="$(find evidence/r5-markets -type f -name market-evidence.json | wc -l | tr -d ' ')"
          test "$count" = "7"
          python - <<'PY'
          import json
          from pathlib import Path
          trades = json.loads(Path('evidence/r5-aggregate/trades.json').read_text())
          assert len(trades) == 12, len(trades)
          print('verified R5 trades:', len(trades))
          print('verified market evidence files:', len(list(Path('evidence/r5-markets').rglob('market-evidence.json'))))
          PY
      - name: Run CIBO deep entry stop target attribution
        run: |
          mkdir -p artifacts/cibo-failure-attribution
          python -m qore.infrastructure.trader_lab.ict_turtle_soup_cibo_holdout_failure_attribution_v1 \
            evidence/r5-aggregate/trades.json \
            evidence/behavior-lab/events.csv \
            evidence/r5-markets \
            artifacts/cibo-failure-attribution \
            | tee artifacts/cibo-failure-attribution/stdout-summary.json
      - name: Enforce reconstruction and authority boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('artifacts/cibo-failure-attribution/summary.json').read_text())
          assert p['identity'] == 'ICT_TS_CIBO_HOLDOUT_FAILURE_ATTRIBUTION_V1'
          assert p['holdout_id'] == 'ICT_TS_R5_FRESH_2016_2018'
          assert p['trade_count'] == 12
          assert p['entry_contract_correct'] == 12
          assert p['stop_contract_correct'] == 12
          assert p['target_contract_correct'] == 12
          assert p['evidence_status'] == 'CONSUMED_DIAGNOSTIC_ONLY'
          assert p['cibo_authority_ceiling'] == 'opinion'
          g = p['governance']
          assert g['pnl_used_for_filter_selection'] is False
          assert g['candidate_rule_created'] is False
          assert g['demo_eligible'] is False
          assert g['live_authorized'] is False
          assert g['real_capital_authorized'] is False
          assert g['production_authorized'] is False
          PY
      - name: Print trade-by-trade CIBO attribution
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path('artifacts/cibo-failure-attribution/failure-attribution-ledger.json').read_text())
          print('id symbol side exit grossR | entry-state | stop-behavior | target-contract | target-behavior | failure-zone')
          for r in rows:
              print(
                  r['trade_id'], r['symbol'], r['side'], r['exit_reason'], r['gross_r'], '|',
                  r['entry_market_state_assessment'], '|', r['stop_behavior_assessment'], '|',
                  r['target_contract_assessment'], '|', r['target_behavior_assessment'], '|',
                  r['failure_zone']
              )
          PY
      - name: Hash immutable diagnostic artifact
        run: |
          printf '%s\n' "$GITHUB_SHA" > artifacts/cibo-failure-attribution/git-sha.txt
          cd artifacts/cibo-failure-attribution
          sha256sum \
            failure-attribution-ledger.json \
            failure-attribution-ledger.csv \
            summary.json REPORT.md git-sha.txt \
            > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-ict-ts-cibo-holdout-failure-attribution-v1-${{ github.sha }}
          path: artifacts/cibo-failure-attribution
          if-no-files-found: error
          retention-days: 90