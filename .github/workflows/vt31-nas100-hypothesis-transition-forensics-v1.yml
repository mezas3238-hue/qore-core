name: QORE VT31 NAS100 Hypothesis Transition Forensics V1

on:
  push:
    branches:
      - agent/vt31-nas100-hypothesis-lifecycle-v1
    paths:
      - scripts/vt31_nas100_hypothesis_transition_forensics_v1.py
      - .github/workflows/vt31-nas100-hypothesis-transition-forensics-v1.yml

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed_holdout
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Freeze Silver Bullet and static gate
        run: |
          set -euo pipefail
          test "$(git hash-object src/qore/infrastructure/traders/vt31_silver_bullet_r2_2.py)" = "3e66f4532c67e62ab2eef7ac376bb86ef7011f73"
          python -m py_compile scripts/vt31_nas100_hypothesis_transition_forensics_v1.py
          ruff check scripts/vt31_nas100_hypothesis_transition_forensics_v1.py

      - name: Recover immutable M1 evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"

      - name: Run hypothesis transition forensics
        run: |
          set -euo pipefail
          python scripts/vt31_nas100_hypothesis_transition_forensics_v1.py \
            "input/${EVIDENCE_PATH}" \
            --partition "${PARTITION}" \
            --output "result/hypothesis-transition-${PARTITION}.json" \
            | tee "result/summary-${PARTITION}.json"

      - name: Governance gate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          partition = os.environ["PARTITION"]
          payload = json.loads(
              Path(f"result/hypothesis-transition-{partition}.json").read_text()
          )
          g = payload["governance"]
          assert g["silver_bullet_modified"] is False
          assert g["diagnostic_only"] is True
          assert g["future_labels_runtime_forbidden"] is True
          assert g["terminal_pnl_used_at_runtime"] is False
          assert g["fold_identity_used_at_runtime"] is False
          assert g["h4_primary_causal_feature"] is False
          assert g["h1_primary_causal_feature"] is False
          assert g["opens_new_holdout"] is False
          assert g["policy_promoted"] is False
          assert g["candidate_certified"] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-hypothesis-transition-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-nas100-hypothesis-transition-*-${{ github.sha }}
          path: input
          merge-multiple: true

      - name: Aggregate stable transition states
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          names = ("r5", "r6", "r8", "consumed_holdout")
          folds = {}
          for path in Path("input").glob("hypothesis-transition-*.json"):
              payload = json.loads(path.read_text())
              folds[payload["partition"]] = payload
          assert set(folds) == set(names)

          diagnostics = {
              fold: folds[fold]["feature_diagnostics"]
              for fold in names
          }
          common = set.intersection(
              *(set(diagnostics[fold]) for fold in names)
          )
          baselines = {
              fold: folds[fold]["overall"]
              for fold in names
          }

          positive = []
          negative = []
          improving = []
          mixed = []

          for state in sorted(common):
              per_fold = {
                  fold: diagnostics[fold][state]
                  for fold in names
              }
              if min(
                  int(per_fold[fold]["sample"])
                  for fold in names
              ) < 10:
                  continue

              def pf(fold):
                  value = per_fold[fold]["metrics"]["profit_factor"]
                  return None if value is None else Decimal(str(value))

              def mean(fold):
                  return Decimal(
                      str(per_fold[fold]["metrics"]["mean_r"])
                  )

              item = {
                  "state": state,
                  "min_sample_per_fold": min(
                      int(per_fold[fold]["sample"])
                      for fold in names
                  ),
                  "per_fold": per_fold,
              }

              if all(
                  pf(fold) is not None
                  and pf(fold) > 1
                  and mean(fold) > 0
                  for fold in names
              ):
                  positive.append(item)
              elif all(
                  (pf(fold) is None or pf(fold) < 1)
                  and mean(fold) < 0
                  for fold in names
              ):
                  negative.append(item)
              elif all(
                  mean(fold)
                  > Decimal(str(baselines[fold]["mean_r"]))
                  for fold in names
              ):
                  improving.append(item)
              else:
                  mixed.append(item)

          key = lambda item: -int(item["min_sample_per_fold"])
          positive.sort(key=key)
          negative.sort(key=key)
          improving.sort(key=key)

          report = {
              "schema": (
                  "qore.vt31.nas100.hypothesis_transition_forensics."
                  "aggregate.v1"
              ),
              "baseline_by_fold": baselines,
              "stable_positive_transition_states": positive,
              "stable_negative_transition_states": negative,
              "stable_improving_transition_states": improving,
              "mixed_or_unstable_transition_states": mixed,
              "governance": {
                  "silver_bullet_modified": False,
                  "diagnostic_only": True,
                  "future_labels_runtime_forbidden": True,
                  "minimum_sample_per_fold": 10,
                  "cross_fold_direction_required": True,
                  "opens_new_holdout": False,
                  "policy_promoted": False,
                  "candidate_certified": False,
              },
          }
          Path("result/aggregate.json").write_text(
              json.dumps(report, sort_keys=True, indent=2) + "\n"
          )
          print(json.dumps(report, sort_keys=True))
          PY

      - name: Bind immutable result
        run: |
          set -euo pipefail
          echo "$GITHUB_SHA" > result/git-sha.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd result && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-hypothesis-transition-aggregate-${{ github.sha }}
          path: result/
          retention-days: 90
