name: VT08 B R9 Independent Causal H1 High Review
on:
  workflow_dispatch:
  push:
    branches: [agent/vt08-5m-cognition-replay-20261010]
    paths:
      - src/qore/infrastructure/trader_lab/vt08_b_r9_h1_target_independent_v1.py
      - tests/infrastructure/trader_lab/test_vt08_b_r9_h1_target_independent_v1.py
      - .github/workflows/vt08-b-r9-independent-h1-target-source.yml
permissions:
  contents: read
  actions: read
jobs:
  independent-native-m15:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        market: [EURJPY, USDCHF, NZDUSD, CADJPY, USDCAD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Fail closed on forged high, equal touch and causal origin
        run: |
          ruff check src/qore/infrastructure/trader_lab/vt08_b_r9_h1_target_independent_v1.py tests/infrastructure/trader_lab/test_vt08_b_r9_h1_target_independent_v1.py
          pytest -q tests/infrastructure/trader_lab/test_vt08_b_r9_h1_target_independent_v1.py
      - uses: actions/download-artifact@v4
        with:
          name: vt08-a-h1-untouched-source-${{ matrix.market }}-4ee9930a576f8185299fb4f7e376191511fb0ed7
          path: a-r6/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 38763309669
      - uses: actions/download-artifact@v4
        with:
          name: vt08-a-blind-three-source-${{ matrix.market }}-385e89cb769eef36f85ddca56f3f3dcaf1e0f863
          path: a-r7/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 38765076497
      - uses: actions/download-artifact@v4
        with:
          name: qore-vt08-cognitive-5m-fresh-${{ matrix.market }}-b2d33e1b4829d8b4afc76983decca8a99131403c
          path: native-m15/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 35934924907
      - name: Independent B source audit for every R6/R7 H1 target
        env:
          MARKET: ${{ matrix.market }}
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json, os
          from pathlib import Path
          from qore.infrastructure.trader_lab.vt08_b_r9_h1_target_independent_v1 import audit_a_r6_r7_native
          market = os.environ["MARKET"]
          def artifact(base, pattern):
              hits = list(Path(base, market).rglob(pattern))
              if len(hits) != 1:
                  raise SystemExit(f"one pinned source expected {base} {pattern}: {hits}")
              return json.loads(hits[0].read_text(encoding="utf-8"))
          r6 = artifact("a-r6", market+"-h1-observed-untouched-witnesses.json")
          r7 = artifact("a-r7", market+"-three-source-blind-review.json")
          native = Path("native-m15", market, "market-evidence-1095d.json")
          if not native.is_file():
              raise SystemExit("no M15 source; must fail closed")
          result = audit_a_r6_r7_native(r6, r7, market=market, m15_file=native)
          expected = {"EURJPY":538,"USDCHF":518,"NZDUSD":550,"CADJPY":516,"USDCAD":535}
          if result["all_cases_reconstructed"] != expected[market]:
              raise SystemExit("frozen sample lost cases")
          result["pinned_run_a_r6"] = 38763309669
          result["pinned_run_a_r7"] = 38765076497
          result["pinned_run_native_m15"] = 35934924907
          Path("evidence", market+"-B-R9-independent-H1.json").write_text(
              json.dumps(result, sort_keys=True, separators=(",",":"), allow_nan=False),
              encoding="utf-8",
          )
          print(json.dumps(result, sort_keys=True))
          if result["broker_fills"] or result["economic_gates_evaluated"]:
              raise SystemExit("no economic promotion by source audit")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vt08-b-r9-independent-H1-${{ matrix.market }}-${{ github.sha }}
          path: evidence/*.json
          retention-days: 30
          if-no-files-found: error
