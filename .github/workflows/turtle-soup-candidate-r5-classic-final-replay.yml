name: QORE Turtle Soup R5 Classic Final Replay

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-candidate-r5-classic-tick-resolution-001
    paths:
      - .github/workflows/turtle-soup-candidate-r5-classic-final-replay.yml
      - scripts/turtle_soup_r5_replay_core.py
      - scripts/turtle_soup_r5_economics.py
      - scripts/turtle_soup_r5_final_replay.py

concurrency:
  group: qore-turtle-soup-r5-classic-final-replay-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      R1_D1_RUN: "34947549114"
      R1_M15_RUN: "34947548876"
      R1_M1_RUN: "34959770555"
      R5_WAVE1_RUN: "34969259616"
      R5_WAVE1B_RUN: "34985374006"
      R5_WAVE2_RUN: "34986122071"
      R1_BASE_SHA: "5a228511d39dabd9686c2d9c14c1a6a4f52ad2b2"
      R1_M1_SHA: "a2f1b411ea8b8dada4f41181f9698f503ac69de1"
      R5_WAVE1_SHA: "36bc4a537a907b2a84509c1ab3a1babe033fad9c"
      R5_WAVE1B_SHA: "48f562aef9c2cd4849c8d4317e61df909f50ed38"
      R5_WAVE2_SHA: "8a1efc01b9c02478aae1d9d8fbc99ebc0c556e8a"
    steps:
      - name: Checkout exact replay head
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture immutable upstream artifact metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p replay-output
          for run in \
            "$R1_D1_RUN" "$R1_M15_RUN" "$R1_M1_RUN" \
            "$R5_WAVE1_RUN" "$R5_WAVE1B_RUN" "$R5_WAVE2_RUN"; do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/artifacts" \
              > "replay-output/upstream-artifacts-${run}.json"
          done

      - name: Download frozen D1 M15 and targeted M1 evidence
        shell: bash
        run: |
          set -euo pipefail
          for symbol in EURUSD GBPUSD USDJPY AUDUSD USDCAD GBPJPY AUDJPY; do
            gh run download "$R1_D1_RUN" \
              -n "qore-turtle-soup-r1-d1-${symbol}-${R1_BASE_SHA}" \
              -D "evidence/d1/${symbol}"
            gh run download "$R1_M15_RUN" \
              -n "qore-turtle-soup-r1-m15-${symbol}-${R1_BASE_SHA}" \
              -D "evidence/m15/${symbol}"
            gh run download "$R1_M1_RUN" \
              -n "qore-turtle-soup-r1-targeted-m1-${symbol}-${R1_M1_SHA}" \
              -D "evidence/m1/${symbol}"
          done

      - name: Download immutable R5 Wave 1 evidence
        shell: bash
        run: |
          set -euo pipefail
          for symbol in EURUSD GBPUSD USDJPY AUDUSD USDCAD GBPJPY AUDJPY; do
            gh run download "$R5_WAVE1_RUN" \
              -n "qore-turtle-soup-r5-classic-ticks-${symbol}-${R5_WAVE1_SHA}" \
              -D "evidence/ticks/wave1/${symbol}"
          done

      - name: Download immutable R5 Wave 1B evidence
        shell: bash
        run: |
          set -euo pipefail
          for symbol in GBPUSD USDCAD; do
            gh run download "$R5_WAVE1B_RUN" \
              -n "qore-turtle-soup-r5-classic-ticks-wave1b-${symbol}-${R5_WAVE1B_SHA}" \
              -D "evidence/ticks/wave1b/${symbol}"
          done

      - name: Download immutable R5 Wave 2 evidence
        shell: bash
        run: |
          set -euo pipefail
          for symbol in EURUSD GBPUSD USDJPY AUDUSD USDCAD GBPJPY AUDJPY; do
            gh run download "$R5_WAVE2_RUN" \
              -n "qore-turtle-soup-r5-classic-ticks-wave2-${symbol}-${R5_WAVE2_SHA}" \
              -D "evidence/ticks/wave2/${symbol}"
          done

      - name: Hash exact replay inputs
        shell: bash
        run: |
          set -euo pipefail
          find evidence -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > replay-output/input-files-sha256.txt

      - name: Execute final R5 causal economic replay
        shell: bash
        run: |
          set -euo pipefail
          python scripts/turtle_soup_r5_final_replay.py \
            --input-root evidence \
            --software-sha "$GITHUB_SHA" \
            --report replay-output/turtle-soup-r5-final-report.json \
            --trades replay-output/turtle-soup-r5-trades.json

      - name: Enforce R5 governance and adjudication invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("replay-output/turtle-soup-r5-final-report.json").read_text()
          )
          assert report["fresh_oos_consumed"] is False
          assert report["fresh_oos_authorized"] is False
          assert report["candidate_freeze"] is None
          assert report["wave3_required"] is False
          assert report["r5_source_fills"] == 290
          assert report["r1_baseline_validation"]["status"] == (
              "PASS_EXACT_R1_REPRODUCTION"
          )
          assert report["r5_tick_target_census"] == {
              "wave1": 291,
              "wave1b": 2,
              "wave2": 20,
          }
          assert report["r5_final_causal_census"]["m1-data-unavailable"] == 4
          assert report["final_verdict"] == "CLASSIC_R5_REJECTED"
          assert all(
              policy["passes_advancement_gate"] is False
              for policy in report["policies"].values()
          )
          PY

      - name: Upload final immutable R5 adjudication evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-r5-classic-final-replay-${{ github.sha }}
          path: replay-output
          if-no-files-found: error
          retention-days: 30
