name: QORE Shared A MC28 Blindspot Bridge

concurrency:
  group: qore-shared-a-mc28-blindspot-bridge
  cancel-in-progress: false

on:
  push:
    branches:
      - agent/shared-a-cognitive-science-001
    paths:
      - src/qore/infrastructure/core_stack_v2/core_broker_blindspot_cognition.py
      - tests/infrastructure/test_core_stack_v2_core_broker_blindspot_cognition.py
      - scripts/shared_mc28_core_broker_blindspot_bridge.py
      - .github/workflows/qore-shared-a-mc28-blindspot-bridge.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and validate A cognition
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          mkdir -p result
          ruff check src/qore/infrastructure/core_stack_v2/core_broker_blindspot_cognition.py tests/infrastructure/test_core_stack_v2_core_broker_blindspot_cognition.py scripts/shared_mc28_core_broker_blindspot_bridge.py src/qore/infrastructure/core_stack_v2/second_order_blindspot_cognition.py tests/infrastructure/test_core_stack_v2_second_order_blindspot_cognition.py
          mypy src/qore/infrastructure/core_stack_v2/core_broker_blindspot_cognition.py src/qore/infrastructure/core_stack_v2/second_order_blindspot_cognition.py
          pytest -q tests/infrastructure/test_core_stack_v2_core_broker_blindspot_cognition.py tests/infrastructure/test_core_stack_v2_second_order_blindspot_cognition.py
      - name: Verify Architect B immutable evidence chain
        run: |
          set -euo pipefail
          for spec in \
            "36763268609:11119388121" \
            "36764365409:11120521150" \
            "36764376550:11120391213"
          do
            run_id="${spec%%:*}"
            artifact_id="${spec#*:}"
            test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')" = "completed"
            test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion')" = "success"
            test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" --jq '.expired')" = "false"
          done
      - name: Build A-side MC28 bridge
        run: |
          python scripts/shared_mc28_core_broker_blindspot_bridge.py | tee result/summary.json
      - name: Validate completed disposition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/mc28-core-broker-blindspot-bridge.json").read_text())
          assert p["status"] == "MC28_COMPLETED_AND_PROVEN"
          assert p["bridge_state"] == "SECOND_ORDER_RESEARCH_PRIORITY"
          assert p["runtime_core_broker_replication_complete"] is True
          assert p["second_order_inventory_complete"] is True
          assert p["open_world_boundary_preserved"] is True
          assert p["all_unknown_unknowns_eliminated"] is False
          assert p["broker_mutation_authority"] is False
          assert p["execution_authority"] is False
          assert p["mc28_completed_and_proven"] is True
          assert p["master_ledger_mutated"] is False
          assert p["protected_certification_holdout_opened"] is False
          PY
      - name: Seal
        run: |
          printf '%s\n' "${GITHUB_SHA}" > result/code-git-sha.txt
          (cd result && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-a-mc28-blindspot-bridge-${{ github.sha }}
          path: result/
          retention-days: 90
      - name: Report MC28
        run: |
          {
            echo "## Shared A MC-28 — Core/Broker Blindspot Bridge"
            echo
            echo "- B foundation run/artifact: **36763268609 / 11119388121**"
            echo "- B real Core/Broker run/artifact: **36764365409 / 11120521150**"
            echo "- B declared-scope inventory run/artifact: **36764376550 / 11120391213**"
            echo "- runtime Core/Broker replication complete: **True**"
            echo "- declared-scope second-order inventory complete: **True**"
            echo "- open-world boundary / unknown-unknown possibility preserved: **True**"
            echo "- mutation authority: **None**"
            echo "- MC-28 completed-and-proven: **True**"
          } > result/issue-comment.md
          gh issue comment 638 --body-file result/issue-comment.md
