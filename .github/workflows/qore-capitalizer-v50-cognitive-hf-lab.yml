name: QORE Capitalizer V50 Cognitive HF Laboratory

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-v50-cognitive-hf-lab.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v50_cognitive_hf_bridge.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v50_target_stop_intelligence.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v50_cognitive_opportunity.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v50_cognitive_geometry_specialist.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v50_master_cognitive_adapter.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v50_cognitive_feature_atlas.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v50_prequential_cognitive_memory.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v50_cognitive_hf_bridge.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v50_target_stop_intelligence.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v50_cognitive_opportunity.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v50_cognitive_geometry_specialist.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v50_master_cognitive_adapter.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v50_cognitive_feature_atlas.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v50_prequential_cognitive_memory.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-v50-cognitive-hf-lab-${{ github.sha }}
  cancel-in-progress: false

env:
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_v50_cognitive_hf_bridge.py \
            src/qore/infrastructure/trader_lab/capitalizer_v50_target_stop_intelligence.py \
            src/qore/infrastructure/trader_lab/capitalizer_v50_cognitive_opportunity.py \
            src/qore/infrastructure/trader_lab/capitalizer_v50_cognitive_geometry_specialist.py \
            src/qore/infrastructure/trader_lab/capitalizer_v50_master_cognitive_adapter.py \
            src/qore/infrastructure/trader_lab/capitalizer_v50_cognitive_feature_atlas.py \
            src/qore/infrastructure/trader_lab/capitalizer_v50_prequential_cognitive_memory.py \
            tests/infrastructure/trader_lab/test_capitalizer_v50_cognitive_hf_bridge.py \
            tests/infrastructure/trader_lab/test_capitalizer_v50_target_stop_intelligence.py \
            tests/infrastructure/trader_lab/test_capitalizer_v50_cognitive_opportunity.py \
            tests/infrastructure/trader_lab/test_capitalizer_v50_cognitive_geometry_specialist.py \
            tests/infrastructure/trader_lab/test_capitalizer_v50_master_cognitive_adapter.py \
            tests/infrastructure/trader_lab/test_capitalizer_v50_cognitive_feature_atlas.py \
            tests/infrastructure/trader_lab/test_capitalizer_v50_prequential_cognitive_memory.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_v50_cognitive_hf_bridge.py \
            src/qore/infrastructure/trader_lab/capitalizer_v50_target_stop_intelligence.py \
            src/qore/infrastructure/trader_lab/capitalizer_v50_cognitive_opportunity.py \
            src/qore/infrastructure/trader_lab/capitalizer_v50_cognitive_feature_atlas.py \
            src/qore/infrastructure/trader_lab/capitalizer_v50_prequential_cognitive_memory.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_v50_cognitive_hf_bridge.py \
            tests/infrastructure/trader_lab/test_capitalizer_v50_target_stop_intelligence.py \
            tests/infrastructure/trader_lab/test_capitalizer_v50_cognitive_opportunity.py \
            tests/infrastructure/trader_lab/test_capitalizer_v50_cognitive_feature_atlas.py \
            tests/infrastructure/trader_lab/test_capitalizer_v50_prequential_cognitive_memory.py

  atlas:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - symbol: USDJPY
            session: ASIA
          - symbol: AUDJPY
            session: ASIA
          - symbol: AUDUSD
            session: ASIA
          - symbol: GBPJPY
            session: ASIA
          - symbol: EURUSD
            session: LONDON
          - symbol: GBPUSD
            session: LONDON
          - symbol: XAUUSD
            session: NEW_YORK
          - symbol: USDCAD
            session: NEW_YORK
          - symbol: NAS100
            session: NEW_YORK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download retained provider-native M1
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Build V49 development opportunities
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_high_frequency_capacity_census_v49 \
            market m1-source capacity-output --session "${{ matrix.session }}"
      - name: Replay frozen V49 development economics
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v49_development_economics \
            market capacity-output m1-source economic-output
      - name: Build V50 causal feature atlas
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v50_cognitive_feature_atlas \
            capacity-output economic-output m1-source atlas-output
      - name: Enforce no-lookahead atlas boundary
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"].lower()
          report = json.loads(
              (Path("atlas-output") / f"capitalizer-{symbol}-v50-cognitive-feature-atlas.json").read_text()
          )
          assert report["features_known_by_entry"] is True
          assert report["outcome_visible_to_decision"] is False
          assert report["future_bars_visible_to_decision"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["reserved_holdout_reopened"] is False
          assert report["fresh_holdout_used"] is False
          PY
      - name: Upload V50 feature atlas
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v50-atlas-${{ matrix.symbol }}-${{ github.sha }}
          path: atlas-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: atlas
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download nine cognitive atlases
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v50-atlas-*-${{ github.sha }}
          path: cognitive-atlases
          merge-multiple: false
      - name: Run V50 prequential cognitive memory
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v50_prequential_cognitive_memory \
            cognitive-atlases cognitive-output
      - name: Enforce cognitive epistemic boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("cognitive-output/capitalizer-v50-prequential-cognitive-memory.json").read_text()
          )
          assert report["features_known_by_entry"] is True
          assert report["labels_revealed_only_after_accepted_trade_close"] is True
          assert report["current_trade_outcome_visible_to_decision"] is False
          assert report["blocked_outcomes_visible_to_runtime_memory"] is False
          assert report["reserved_holdout_reopened"] is False
          assert report["fresh_holdout_used"] is False
          assert report["automatic_policy_selection"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - name: Upload V50 cognitive laboratory
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v50-cognitive-hf-lab-${{ github.sha }}
          path: cognitive-output
          if-no-files-found: error
          retention-days: 180
