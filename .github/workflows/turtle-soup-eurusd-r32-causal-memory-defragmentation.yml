name: QORE Turtle Soup EURUSD R32 Causal Memory Defragmentation

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-eurusd-specialist-memory-v1-001
    paths:
      - '.github/workflows/turtle-soup-eurusd-r32-causal-memory-defragmentation.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_eurusd_r32_causal_memory_defragmentation.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_eurusd_r32_causal_memory_defragmentation.py'

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-EURUSD-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-EURUSD-2f510461b3360e91d5ee70a72716a76cd6561f16'
  V2_RUN_ID: '35319185380'
  V2_ARTIFACT: 'qore-turtle-soup-eurusd-structural-specialist-v2-r27-f168e5a72b1e26f91141910c29c8a24f73b79315'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check --ignore E501,I001 \
            src/qore/infrastructure/trader_lab/turtle_soup_eurusd_r32_causal_memory_defragmentation.py \
            tests/infrastructure/trader_lab/test_turtle_soup_eurusd_r32_causal_memory_defragmentation.py
      - name: Mypy focused gate
        run: |
          mypy --disable-error-code attr-defined \
            src/qore/infrastructure/trader_lab/turtle_soup_eurusd_r32_causal_memory_defragmentation.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_turtle_soup_eurusd_r32_causal_memory_defragmentation.py

  replay:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable EURUSD raw master
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-eurusd
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download immutable Target Destination V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target-eurusd
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Download immutable Cognitive V2 observations
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V2_ARTIFACT }}
          path: cognitive-v2
          github-token: ${{ github.token }}
          run-id: ${{ env.V2_RUN_ID }}
      - name: Run fixed R32 memory de-fragmentation experiments
        run: |
          mkdir -p r32-output
          python -m qore.infrastructure.trader_lab.turtle_soup_eurusd_r32_causal_memory_defragmentation \
            source-eurusd target-eurusd cognitive-v2 r32-output \
            > r32-output/stdout.json
          printf '%s\n' "$GITHUB_SHA" > r32-output/git-sha.txt
      - name: Enforce R32 governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('r32-output/r32-causal-memory-defragmentation-report.json').read_text())
          assert p['identity']=='TURTLE_SOUP_EURUSD_R32_CAUSAL_MEMORY_DEFRAGMENTATION_LAB_V1'
          c=p['experiment_contract']
          assert c['fresh_holdout_consumed'] is False
          assert c['actual_dol_price_always_used'] is True
          assert c['route_family_only_pools_memory'] is True
          assert c['entry_changed'] is False
          assert c['c2_changed'] is False
          assert c['cisd_changed'] is False
          assert c['protected_swing_changed'] is False
          assert c['structural_rearm_changed'] is False
          assert c['regime_features_pre_entry_only'] is True
          assert c['nearest_validated_dol_policy'] is True
          a=p['predeclared_acceptance']
          assert a['minimum_trades']==350
          assert a['minimum_net_010_profit_factor']=='1.90'
          assert a['maximum_net_010_drawdown_r']=='6.0'
          assert a['maximum_net_010_losing_streak']==3
          g=p['governance']
          assert g['candidate_replaced'] is False
          assert g['fresh_holdout_consumed'] is False
          assert g['live_authorized'] is False
          assert g['real_capital_authorized'] is False
          PY
      - name: Hash R32 evidence
        run: |
          cd r32-output
          sha256sum r32-causal-memory-defragmentation-report.json stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-eurusd-r32-causal-memory-defragmentation-${{ github.sha }}
          path: r32-output
          if-no-files-found: error
          retention-days: 90
