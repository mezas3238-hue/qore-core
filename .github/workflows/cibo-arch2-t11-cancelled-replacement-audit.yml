name: QORE CIBO Architect2 T11 Cancelled Replacement Audit

on:
  push:
    branches:
      - agent/cibo-external-scientific-closure-001
    paths:
      - 'scripts/cibo_arch2_t11_cancelled_replacement_audit.py'
      - 'tests/infrastructure/test_cibo_arch2_t11_cancelled_replacement_audit.py'
      - '.github/workflows/cibo-arch2-t11-cancelled-replacement-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
  QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev,ctrader]'

      - name: Quality
        run: |
          ruff check             scripts/cibo_arch2_t11_cancelled_replacement_audit.py             tests/infrastructure/test_cibo_arch2_t11_cancelled_replacement_audit.py
          mypy --disable-error-code=import-untyped             scripts/cibo_arch2_t11_cancelled_replacement_audit.py
          pytest -q --no-cov             tests/infrastructure/test_cibo_arch2_t11_cancelled_replacement_audit.py

      - name: Verify DEMO credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in             QORE_CTRADER_CLIENT_ID             QORE_CTRADER_CLIENT_SECRET             QORE_CTRADER_ACCESS_TOKEN             QORE_CTRADER_REFRESH_TOKEN
          do
            test -n "${!name:-}" || exit 2
          done
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            echo "::add-mask::$account_id"
            printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          fi

      - name: Audit exact cancelled replacement labels
        run: |
          mkdir -p t11-cancelled-replacement-audit
          python scripts/cibo_arch2_t11_cancelled_replacement_audit.py             --output t11-cancelled-replacement-audit/audit.json             > t11-cancelled-replacement-audit/stdout.json

      - name: Enforce governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(
              Path(
                  "t11-cancelled-replacement-audit/audit.json"
              ).read_text()
          )
          assert p["provider_key"] == "ctrader-demo"
          assert p["environment"] == "demo"
          assert p["broker_mutation_performed"] is False
          assert p["phase22_v2_consumed"] is False
          assert p["fundednext_touched"] is False
          assert p["vps_touched"] is False
          assert p["live_authorized"] is False
          assert p["real_capital_authorized"] is False
          assert p["canonical_ledger_modified"] is False
          assert p["productive_authority"] is False
          PY

      - name: Seal audit
        run: |
          printf '%s\n' "$GITHUB_SHA" > t11-cancelled-replacement-audit/git-sha.txt
          cd t11-cancelled-replacement-audit
          sha256sum audit.json stdout.json git-sha.txt > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-arch2-t11-cancelled-replacement-audit-${{ github.sha }}
          path: t11-cancelled-replacement-audit
          if-no-files-found: error
          retention-days: 90
