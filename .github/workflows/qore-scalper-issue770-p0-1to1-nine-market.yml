name: Scalper Issue770 P0 Native 1to1 Nine Market Entry Quality

on:
  push:
    branches:
      - research/scalper-p0-entry-quality-1to1-20261011
    paths:
      - '.github/workflows/qore-scalper-issue770-p0-1to1-nine-market.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_issue770_1to1_market_v1.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_issue770_1to1_aggregate_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_scalper_issue770_1to1_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CONTROL_RUN: '38053946695'
  CONTROL_SHA: 'e356e7a52541e99533b25ecfef0ab9c4e9ce03c0'
  M1_RUN: '35548099334'
  M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  prereg_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Quality and negative causal/censor regression tests
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_scalper_issue770_1to1_market_v1.py src/qore/infrastructure/trader_lab/capitalizer_scalper_issue770_1to1_aggregate_v1.py tests/infrastructure/trader_lab/test_capitalizer_scalper_issue770_1to1_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_scalper_issue770_1to1_market_v1.py src/qore/infrastructure/trader_lab/capitalizer_scalper_issue770_1to1_aggregate_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_scalper_issue770_1to1_v1.py

  market:
    needs: prereg_contract
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol: [USDJPY, AUDJPY, AUDUSD, GBPJPY, EURUSD, GBPUSD, XAUUSD, USDCAD, NAS100]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: scalper-a2-v49-control-${{ matrix.symbol }}-${{ env.CONTROL_SHA }}
          path: frozen
          github-token: ${{ github.token }}
          run-id: ${{ env.CONTROL_RUN }}
      - uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.M1_SHA }}
          path: native
          github-token: ${{ github.token }}
          run-id: ${{ env.M1_RUN }}
      - name: Verify 10Y provider native M1 read only, no broker bid ask
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          m=json.loads(Path("native/m1-clone-manifest.json").read_text())
          assert m["canonical_symbol"]==os.environ["SYMBOL"]
          assert m["provider_native_m1"] and not m["synthetic_m1"]
          assert not m["interpolated_m1"] and m["contradictory_m1"]==0
          assert m["read_only"]
          PY
      - name: Independently reproduce all frozen V49 gross trades and 1R shadow outcomes
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_issue770_1to1_market_v1 frozen native market-out
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-issue770-p0-${{ matrix.symbol }}-${{ github.sha }}
          path: market-out/
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: scalper-issue770-p0-*-${{ github.sha }}
          path: nine-markets
      - name: Reconstruct MAX3 A 2020, original exits, 1to1, sign-flip null and day-block audit
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_issue770_1to1_aggregate_v1 nine-markets report
      - name: Assert 2876 source/2020 A, statuses/censor and no net broker/OOS
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("report/scalper-issue770-scientific-nine-market.json").read_text())
          assert a["source_ids_conserved"]==2876 and a["original_A_2020"]==2020
          assert a["baseline_reconstructed_exact"]
          assert a["PURE_1TO1"]["cost_stress"]["0.025"]["source_intents"]==2020
          assert a["SESSION_CAPPED_1TO1"]["cost_stress"]["0.025"]["source_intents"]==2020
          assert a["PURE_1TO1"]["direction_mirror_and_2000_random_flips"]["replications"]==2000
          assert a["SESSION_CAPPED_1TO1"]["direction_mirror_and_2000_random_flips"]["replications"]==2000
          assert not a["historical_OOS_independent"] and not a["physical_bid_ask_costs"]
          assert not a["production_VPS_touched"] and not a["certified"]
          print("ISSUE770_P0_VERIFIED",json.dumps({
              "source_ids":a["source_ids_conserved"],
              "selected":a["original_A_2020"],
              "original_exit_counts":a["original_exit_counts"],
              "flats":a["original_flat_count"],
              "pure":a["PURE_1TO1"]["cost_stress"]["0.025"],
              "session":a["SESSION_CAPPED_1TO1"]["cost_stress"]["0.025"],
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-issue770-P0-1to1-nine-market-scientific-${{ github.sha }}
          path: report/
          retention-days: 90
          if-no-files-found: error
