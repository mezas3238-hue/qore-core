name: CRT RADAR — 33 same-provider M5 history window 1500 versus full

on:
  push:
    branches:
      - agent/crt-radar-trader-lab-34-preflight-20261101
    paths:
      - .github/workflows/crt-radar-33-m5-horizon-1500.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: crt-radar-horizon-33-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-horizon-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run synthetic horizon, NY clock and double-sweep rejection tests
        run: |
          python -m pip install pytest pytest-cov
          python -m pytest -q tests/research/test_crt_radar_m5_horizon_sensitivity.py

