      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Access already archived original M5 in same GitHub Core repository
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.source_artifact }}
          repository: ${{ github.repository }}
          run-id: ${{ matrix.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/crt-raw-internal
      - name: Verify original partition SHA and compare same-source 1500 M5 to full window
        shell: bash
        env:
          SOURCE_ROOT: ${{ runner.temp }}/crt-raw-internal
          SOURCE_SYMBOL: ${{ matrix.symbol }}
          SOURCE_FAMILY: ${{ matrix.family }}
          SOURCE_COHORT: ${{ matrix.cohort }}
        run: |
          set -euo pipefail
          python scripts/crt_radar_m5_horizon_sensitivity.py \
            --root "$SOURCE_ROOT" \
            --symbol "$SOURCE_SYMBOL" \
            --family "$SOURCE_FAMILY" \
            --cohort "$SOURCE_COHORT"
          echo "STATUS=IN_SAMPLE_HORIZON_SENSITIVITY_ONLY" >> "$GITHUB_STEP_SUMMARY"
          echo "OOS=NOT_STARTED; BTC_NOT_IN_THIS_33_ARCHIVE_MATRIX" >> "$GITHUB_STEP_SUMMARY"
          echo "REAL_OHLC_NOT_UPLOADED; NO_ORDERS; NO_PUSH" >> "$GITHUB_STEP_SUMMARY"
      - name: Wipe raw source directory after job
        if: always()
        run: rm -rf "${{ runner.temp }}/crt-raw-internal"
