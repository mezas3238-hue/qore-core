name: QORE VT08 CRT PURE R2 Model1 Reference Lab

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vt08-crt-pure-source-identity-001
    paths:
      - '.github/workflows/vt08-crt-pure-r2-model1-reference-lab.yml'
      - 'src/qore/infrastructure/trader_lab/vt08_crt_pure_r2_model1_reference_lab.py'
      - 'tests/infrastructure/trader_lab/test_vt08_crt_pure_r2_model1_reference_lab.py'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src/qore/infrastructure/trader_lab/vt08_crt_pure_r2_model1_reference_lab.py tests/infrastructure/trader_lab/test_vt08_crt_pure_r2_model1_reference_lab.py
      - name: Mypy
        run: mypy src/qore/infrastructure/trader_lab/vt08_crt_pure_r2_model1_reference_lab.py
      - name: Pytest
        run: pytest -q --no-cov tests/infrastructure/trader_lab/test_vt08_crt_pure_r2_model1_reference_lab.py

  replay:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        market: [AUDUSD, USDJPY, BTCUSD]
    env:
      QORE_MARKET: ${{ matrix.market }}
      QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID }}
      QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET }}
      QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN }}
      QORE_CTRADER_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_ACCOUNT_ID }}
      QORE_CTRADER_HOST: ${{ secrets.QORE_CTRADER_HOST }}
      QORE_CTRADER_PORT: ${{ secrets.QORE_CTRADER_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: Run R2 Model1 reference ambiguity lab
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "artifacts/$QORE_MARKET"
          python -m qore.infrastructure.trader_lab.vt08_crt_pure_r2_model1_reference_lab \
            "$QORE_MARKET" "artifacts/$QORE_MARKET" \
            | tee "artifacts/$QORE_MARKET/stdout.log"
      - name: Bind SHA and hashes
        shell: bash
        run: |
          printf '%s\n' "$GITHUB_SHA" > "artifacts/$QORE_MARKET/git-sha.txt"
          cd "artifacts/$QORE_MARKET"
          sha256sum report.json trades.jsonl stdout.log git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-crt-pure-r2-model1-reference-${{ matrix.market }}-${{ github.sha }}
          path: artifacts/${{ matrix.market }}
          if-no-files-found: error
          retention-days: 90
