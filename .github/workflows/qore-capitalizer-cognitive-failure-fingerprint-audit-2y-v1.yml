name: QORE Capitalizer Cognitive Failure Fingerprint Audit 2Y V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-cognitive-failure-fingerprint-audit-2y-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_cognitive_failure_fingerprint_audit_2y_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_cognitive_failure_fingerprint_audit_2y_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-cognitive-failure-fingerprint-audit-2y-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  BINDING_RUN_ID: '36065651404'
  BINDING_SHA: '1d910f5c3550ac481c28390671a86ceb011597e3'
  TARGET_RUN_ID: '36055792484'
  TARGET_SHA: 'a66ab11c22efbefb61756db3f0062c3c51a2a825'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check             src/qore/infrastructure/trader_lab/capitalizer_cognitive_failure_fingerprint_audit_2y_v1.py             tests/infrastructure/trader_lab/test_capitalizer_cognitive_failure_fingerprint_audit_2y_v1.py
      - name: Mypy
        run: |
          mypy             src/qore/infrastructure/trader_lab/capitalizer_cognitive_failure_fingerprint_audit_2y_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov             tests/infrastructure/trader_lab/test_capitalizer_cognitive_failure_fingerprint_audit_2y_v1.py

  audit:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download fully source-bound cognitive ledger
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cognitive-evidence-binding-audit-2y-v2-${{ env.BINDING_SHA }}
          path: binding-input
          github-token: ${{ github.token }}
          run-id: ${{ env.BINDING_RUN_ID }}
      - name: Download frozen 1R target ledger
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-max-recovery-target1-stability-2y-v1-${{ env.TARGET_SHA }}
          path: target-input
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Build failure-fingerprint recurrence audit
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cognitive_failure_fingerprint_audit_2y_v1             binding-input target-input fingerprint-output
      - name: Enforce fingerprint audit controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "fingerprint-output/"
                  "capitalizer-cognitive-failure-fingerprint-audit-2y-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_COGNITIVE_FAILURE_FINGERPRINT_AUDIT_2Y_V1"
          )
          assert report["source_binding_run_id"] == 36065651404
          assert report["source_target_run_id"] == 36055792484
          assert report["control_trades"] == 948
          assert report["fingerprint_candidate_coverage"] == 948
          assert 0 < report["unique_structural_fingerprints"] <= 948
          assert 0 < report["unique_contextual_fingerprints"] <= 948
          recurrence = report["recurrence_after_prior_closed_loss"]
          assert set(recurrence) == {
              "structural_all_history",
              "structural_same_day",
              "structural_same_session_day",
              "contextual_all_history",
              "contextual_same_day",
              "contextual_same_session_day",
          }
          assert all(0 <= int(value) <= 948 for value in recurrence.values())
          assert report["timestamps_excluded_from_fingerprint"] is True
          assert report["numeric_market_thresholds_added"] is False
          assert report["current_outcome_used_to_build_fingerprint"] is False
          assert report["current_outcome_used_to_detect_repeat"] is False
          assert report["prior_closed_outcomes_used_as_causal_memory"] is True
          assert report["runtime_failure_fingerprint_selected"] is False
          assert report["loss_memory_resolution_bound"] is False
          assert report["unresolved_failure_enforcement_allowed"] is False
          assert report["strategy_rules_changed"] is False
          assert report["cognitive_rules_changed"] is False
          assert report["entry_changed"] is False
          assert report["stop_changed"] is False
          assert report["target_changed"] is False
          assert report["max3_changed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          assert report["binding_v2_control_reproduced"] is True
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-cognitive-failure-fingerprint-audit-2y-v1-${{ github.sha }}
          path: fingerprint-output
          if-no-files-found: error
          retention-days: 90
