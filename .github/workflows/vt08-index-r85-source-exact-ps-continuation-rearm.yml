name: VT08 Index R85 Source Exact PS Continuation Rearm

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r85-source-exact-ps-continuation-rearm.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r85_source_exact_ps_continuation_rearm.py
      - tests/infrastructure/trader_lab/test_vt08_index_r85_source_exact_ps_continuation_rearm.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r85_source_exact_ps_continuation_rearm.py

  forensics:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R85 source-exact PS continuation/rearm census
        run: |
          python -m qore.infrastructure.trader_lab.vt08_index_r85_source_exact_ps_continuation_rearm \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r85-source-exact-ps-continuation-rearm.json

      - name: Verify R85 governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r85-source-exact-ps-continuation-rearm.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R85_SOURCE_EXACT_PS_CONTINUATION_REARM_CENSUS_001"
          )
          assert report["source_r84"]["run_id"] == 35520178299
          assert report["source_r84"]["artifact_id"] == 10607704304
          execution = report["execution_contract"]
          assert execution["protected_swing_layer"] == "R84_SOURCE_EXACT"
          assert execution["continuation"] == "EXACT_V6_FIRST_CONTINUATION"
          assert execution["same_c2_body_transition"] == "EXACT_V7"
          assert execution["executable_anchors_new_york"] == [22, 2, 6, 10]
          assert execution["owner_disabled_14_preserved"] is True
          assert execution["pnl_evaluated"] is False
          assert execution["target_attached"] is False
          assert execution["risk_allocator_applied"] is False

          assert report["five_year"]["canonical_signal_reference"] == 2448
          assert report["recent_two_year"]["canonical_signal_reference"] == 1017
          assert report["r66_failed_holdout"]["canonical_signal_reference"] == 773
          assert report["decision"] == (
              "R85_SOURCE_EXACT_PS_CONTINUATION_REARM_CENSUS_COMPLETE_NO_TRADES"
          )

          governance = report["governance"]
          assert governance["forensics_only"] is True
          assert governance["consumed_evidence_only"] is True
          assert governance["fresh_holdout_claim"] is False
          assert governance["future_information_used"] is False
          assert governance["pnl_evaluated"] is False
          assert governance["signals_created_for_trading"] is False
          assert governance["signals_suppressed"] is False
          assert governance["target_changed"] is False
          assert governance["risk_changed"] is False
          assert governance["anchors_changed"] is False
          assert governance["owner_disabled_14_preserved"] is True
          assert governance["candidate_created"] is False
          assert governance["trader_certified"] is False
          assert governance["live_authorized"] is False
          assert governance["real_capital_authorized"] is False
          assert governance["production_authorized"] is False
          PY

      - name: Upload R85 evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r85-source-exact-ps-continuation-rearm-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: warn
          retention-days: 90
