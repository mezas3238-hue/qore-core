name: QORE VT31 NAS100 Sequence Regeneration Root Cause V1

on:
  push:
    branches:
      - agent/vt31-nas100-hypothesis-lifecycle-v1
    paths:
      - scripts/vt31_nas100_sequence_regeneration_root_cause_forensics_v1.py
      - .github/workflows/vt31-nas100-sequence-regeneration-root-cause-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed_holdout
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Static gate
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_sequence_regeneration_root_cause_forensics_v1.py
          ruff check scripts/vt31_nas100_sequence_regeneration_root_cause_forensics_v1.py
      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"
      - name: Run sequence regeneration root-cause forensics
        run: |
          set -euo pipefail
          python scripts/vt31_nas100_sequence_regeneration_root_cause_forensics_v1.py \
            "input/${EVIDENCE_PATH}" \
            --partition "$PARTITION" \
            --output "result/sequence-regeneration-${PARTITION}.json" \
            | tee "result/summary-${PARTITION}.json"
      - name: Governance gate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path(f"result/sequence-regeneration-{os.environ['PARTITION']}.json").read_text())
          g=p["governance"]
          assert g["diagnostic_only"] is True
          assert g["trade_policy_changed"] is False
          assert g["risk_policy_changed"] is False
          assert g["silver_bullet_changed"] is False
          assert g["calendar_date_runtime_forbidden"] is True
          assert g["fold_identity_runtime_forbidden"] is True
          assert g["opens_new_holdout"] is False
          assert g["policy_promoted"] is False
          assert g["candidate_certified"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-sequence-regeneration-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-nas100-sequence-regeneration-*-${{ github.sha }}
          path: input
          merge-multiple: true
      - name: Aggregate root-cause states
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          folds={}
          for path in Path("input").glob("sequence-regeneration-*.json"):
              p=json.loads(path.read_text())
              folds[p["partition"]]=p
          assert set(folds)=={"r5","r6","r8","consumed_holdout"}

          def mean(item):
              return Decimal(str(item["metrics"]["mean_r"]))

          stable_negative=[]
          stable_positive=[]
          fields=set.intersection(*(
              set(p["post_loss_ge2_order_block"]["dimensions"]) for p in folds.values()
          ))
          for field in sorted(fields):
              states=set.intersection(*(
                  set(p["post_loss_ge2_order_block"]["dimensions"][field]) for p in folds.values()
              ))
              for state in sorted(states):
                  per={f:folds[f]["post_loss_ge2_order_block"]["dimensions"][field][state] for f in sorted(folds)}
                  if min(x["sample"] for x in per.values()) < 5:
                      continue
                  record={"field":field,"state":state,"per_fold":per}
                  if all(mean(x) < 0 for x in per.values()):
                      stable_negative.append(record)
                  if all(mean(x) > 0 for x in per.values()):
                      stable_positive.append(record)

          report={
              "schema":"qore.vt31.nas100.sequence_regeneration_root_cause_forensics.aggregate.v1",
              "post_loss_ge2_order_block":{
                  f:{
                      "sample":p["post_loss_ge2_order_block"]["sample"],
                      "metrics":p["post_loss_ge2_order_block"]["metrics"],
                  } for f,p in sorted(folds.items())
              },
              "post_loss_ge3_order_block":{
                  f:p["post_loss_ge3_order_block"] for f,p in sorted(folds.items())
              },
              "stable_negative_regeneration_states":stable_negative,
              "stable_positive_regeneration_states":stable_positive,
              "governance":{
                  "diagnostic_only":True,
                  "trade_policy_changed":False,
                  "risk_policy_changed":False,
                  "candidate_certified":False,
                  "opens_new_holdout":False,
              },
          }
          Path("result/aggregate.json").write_text(json.dumps(report,sort_keys=True,indent=2)+"\n")
          print(json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-sequence-regeneration-aggregate-${{ github.sha }}
          path: result/
          retention-days: 90
