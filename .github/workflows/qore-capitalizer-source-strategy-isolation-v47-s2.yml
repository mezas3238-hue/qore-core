name: QORE Capitalizer Source Strategy Isolation V47 S2

on:
  push:
    branches:
      - agent/capitalizer-canonical-source-remediation-v47-s2-001
    paths:
      - '.github/workflows/qore-capitalizer-source-strategy-isolation-v47-s2.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_canonical_source_composition_v47_s2.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_source_strategy_isolation_v47_s2.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_event_opposite_boundary_v47_s1r_e.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_source_strategy_isolation_v47_s1.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_canonical_source_candidate_assembly_v47_s0.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_canonical_source_context_binders_v47_s0.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_canonical_historical_replay_adapter_v46.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_canonical_source_composition_v47_s2.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-source-strategy-isolation-v47-s2-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
  QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,ctrader]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_canonical_source_composition_v47_s2.py \
            src/qore/infrastructure/trader_lab/capitalizer_source_strategy_isolation_v47_s2.py \
            tests/infrastructure/trader_lab/test_capitalizer_canonical_source_composition_v47_s2.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_canonical_source_composition_v47_s2.py \
            src/qore/infrastructure/trader_lab/capitalizer_source_strategy_isolation_v47_s2.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_canonical_source_composition_v47_s2.py

  s2a_market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {symbol: USDJPY, session: ASIA}
          - {symbol: AUDJPY, session: ASIA}
          - {symbol: AUDUSD, session: ASIA}
          - {symbol: GBPJPY, session: ASIA}
          - {symbol: EURUSD, session: LONDON}
          - {symbol: GBPUSD, session: LONDON}
          - {symbol: XAUUSD, session: NEW_YORK}
          - {symbol: USDCAD, session: NEW_YORK}
          - {symbol: NAS100, session: NEW_YORK}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[ctrader]'
      - name: Verify read-only cTrader inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in QORE_CTRADER_CLIENT_ID QORE_CTRADER_CLIENT_SECRET QORE_CTRADER_ACCESS_TOKEN QORE_CTRADER_REFRESH_TOKEN; do
            test -n "${!name:-}" || { echo "missing required read-only DEMO input: $name" >&2; exit 2; }
          done
      - name: Discover DEMO account when not configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            if ! [[ "$account_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "cTrader DEMO account discovery returned invalid id" >&2
              exit 3
            fi
            echo "::add-mask::$account_id"
            printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          fi
      - name: Download immutable provider-native 10Y M1
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Build S2-A remediated population and exact fills
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_source_strategy_isolation_v47_s2 \
            s2a-market m1-source \
            --symbol "${{ matrix.symbol }}" \
            --session "${{ matrix.session }}" \
            --output s2a-output
      - name: Enforce S2-A market governance
        env:
          SYMBOL: ${{ matrix.symbol }}
          SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          reports=sorted(Path("s2a-output").glob("capitalizer-s2a-*-report.json"))
          assert len(reports) == 3
          assert {json.loads(p.read_text())["period"] for p in reports} == {
              "reserved","validation","development"
          }
          for path in reports:
              report=json.loads(path.read_text())
              assert report["identity"] == "QORE_CAPITALIZER_SOURCE_STRATEGY_ISOLATION_V47_S2"
              assert report["symbol"] == os.environ["SYMBOL"]
              assert report["session"] == os.environ["SESSION"]
              assert report["terminal_outcome_read"] is False
              assert report["strategy_economics_calculated"] is False
              assert report["fresh_holdout_opened"] is False
              assert report["trader_certified"] is False
              assert report["upstream_events"] >= report["htf_aligned"]
              assert report["htf_aligned"] >= report["m15_bound"]
              assert report["m15_bound"] >= report["independent_m1_bound"]
              assert report["independent_m1_bound"] >= report["event_target_bound"]
              assert report["event_target_bound"] >= report["routed_fractal_candidates"]

          for path in sorted(Path("s2a-output").glob("capitalizer-s2a-*-fills.jsonl")):
              for line in path.read_text().splitlines():
                  if not line.strip():
                      continue
                  row=json.loads(line)
                  assert row["identity"] == "QORE_CAPITALIZER_SOURCE_STRATEGY_ISOLATION_V47_S2"
                  assert row["route"] == "FRACTAL_SCALP_CONTINUATION"
                  assert row["provider_native_m1"] is True
                  assert row["exact_provider_tick_fill"] is True
                  assert row["official_v46_adapter_passed"] is True
                  assert row["outcome_used_for_selection"] is False
                  assert row["terminal_outcome_read"] is False
                  assert row["realized_r_read"] is False
                  assert row["fresh_holdout_opened"] is False
                  assert row["candidate_promotion_allowed"] is False
                  assert row["trader_certified"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v47-s2a-${{ matrix.symbol }}-${{ github.sha }}
          path: s2a-output
          if-no-files-found: error
          retention-days: 90

  s2a_aggregate:
    needs: s2a_market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v47-s2a-*-${{ github.sha }}
          path: s2a-markets
          merge-multiple: true
      - name: Aggregate S2-A
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_source_strategy_isolation_v47_s2 \
            s2a-aggregate s2a-markets \
            --output s2a-aggregate
      - name: Enforce S2-A aggregate governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(
              Path("s2a-aggregate/capitalizer-s2a-aggregate.json").read_text()
          )
          assert report["identity"] == "QORE_CAPITALIZER_SOURCE_STRATEGY_ISOLATION_V47_S2"
          assert report["predeclaration_comment_id"] == 5900501860
          assert report["market_period_reports"] == 27
          assert report["market_count"] == 9
          assert report["terminal_outcome_read"] is False
          assert report["realized_r_read"] is False
          assert report["strategy_economics_calculated"] is False
          assert report["fresh_holdout_opened"] is False
          assert report["candidate_promotion_allowed"] is False
          assert report["trader_certified"] is False
          total=sum(v["admitted_exact_fills"] for v in report["periods"].values())
          assert report["funnel"]["admitted_exact_fills"] == total
          for row in report["periods"].values():
              assert row["max3_is_ceiling_not_quota"] is True
              assert row["outcome_used_for_selection"] is False
              assert row["max3_selected_fills"] <= row["admitted_exact_fills"]
          if total:
              assert report["next_phase"] == (
                  "S2A_POPULATION_READY_FOR_FROZEN_GROSS_ECONOMICS"
              )
          else:
              assert report["next_phase"] == (
                  "S2A_ZERO_ADMITTED_POPULATION_REQUIRES_ROOT_CAUSE"
              )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v47-s2a-aggregate-${{ github.sha }}
          path: s2a-aggregate
          if-no-files-found: error
          retention-days: 90
