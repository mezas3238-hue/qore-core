name: VT08 Index R114 Standard CISD PS Anatomy Attribution

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r114-standard-cisd-ps-anatomy-attribution.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r114_standard_cisd_ps_anatomy_attribution.py
      - tests/infrastructure/trader_lab/test_vt08_index_r114_standard_cisd_ps_anatomy_attribution.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r114_standard_cisd_ps_anatomy_attribution.py

  attribution:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R114 CISD Protected-Swing anatomy attribution
        run: |
          mkdir -p artifacts/report
          python -m qore.infrastructure.trader_lab.vt08_index_r114_standard_cisd_ps_anatomy_attribution \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r114-standard-cisd-ps-anatomy-attribution.json

      - name: Verify R114 frozen attribution contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r114-standard-cisd-ps-anatomy-attribution.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R114_STANDARD_CISD_PS_ANATOMY_ATTRIBUTION_001"
          )
          assert report["source_r112"]["run_id"] == 35661839898
          assert report["source_r112"]["artifact_id"] == 10667714516
          assert report["source_r112"]["artifact_digest"] == (
              "sha256:e0b2dfd0363c2920ba7566672ffef05264d69fbfb4778e81de8568dba05f0e53"
          )

          expected = {
              "five_year": 1756,
              "recent_two_year": 746,
              "r66_failed_holdout": 546,
          }
          for key, sample in expected.items():
              section = report[key]
              assert section["sample"] == sample
              assert section["expected_sample"] == sample
              dimensions = section["dimensions"]
              for name in (
                  "series_length",
                  "series_start_delay",
                  "extreme_delay",
                  "series_starts_on_poi_touch",
                  "series_start_overlaps_poi",
                  "extreme_on_poi_touch",
                  "extreme_position",
                  "period",
              ):
                  assert name in dimensions
                  assert sum(
                      int(row["sample"])
                      for row in dimensions[name].values()
                  ) == sample

          contract = report["source_contract"]
          assert contract["protected_swing"] == (
              "EXTREME_OF_CISD_OPPOSING_SERIES"
          )
          assert contract["numeric_price_thresholds"] is False
          assert contract["atr_or_percentage_cutoff"] is False
          assert contract["classification_cutoff"] == "CISD_CONFIRMATION"
          assert contract["outcome_used_for_classification"] is False
          assert contract["calendar_or_year_used_for_classification"] is False

          gov = report["governance"]
          assert gov["research_only"] is True
          assert gov["candidate_created"] is False
          assert gov["signals_suppressed"] is False
          assert gov["trade_count_changed"] is False
          assert gov["target_changed"] is False
          assert gov["stop_changed"] is False
          assert gov["risk_allocator_changed"] is False
          assert gov["runtime_filter_created"] is False
          assert gov["anchor_14_enabled"] is False
          assert gov["live_authorized"] is False
          assert gov["real_capital_authorized"] is False
          assert gov["production_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r114-standard-cisd-ps-anatomy-attribution-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
