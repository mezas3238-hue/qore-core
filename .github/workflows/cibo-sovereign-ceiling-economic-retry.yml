name: QORE CIBO Sovereign Ceiling Economic Retry

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cibo-ceiling-retry-001
    paths:
      - '.github/workflows/cibo-sovereign-ceiling-economic-retry.yml'
      - 'scripts/cibo_single_account_historical_ceiling_replay.py'
      - 'src/qore/infrastructure/cibo_sovereign_capital_runtime.py'
      - 'src/qore/infrastructure/account_wide_risk.py'
      - 'src/qore/infrastructure/cibo_capital_management_authority.py'
      - 'src/qore/infrastructure/cibo_cma_risk_request.py'
      - 'src/qore/infrastructure/cibo_capital_digital_twin.py'
      - 'src/qore/infrastructure/cibo_full_economic_digital_twin.py'
      - 'src/qore/infrastructure/cibo_single_account_historical_capital_ledger.py'
      - 'src/qore/infrastructure/cibo_single_account_historical_ceiling_state.py'
      - 'src/qore/infrastructure/cibo_single_account_historical_ceiling_epoch.py'
      - 'src/qore/infrastructure/cibo_single_account_historical_ceiling_replay.py'
      - 'src/qore/infrastructure/cibo_single_account_manifest_economics.py'
      - 'src/qore/infrastructure/cibo_single_account_manifest_settlement.py'
      - 'tests/infrastructure/test_account_wide_risk.py'
      - 'tests/infrastructure/test_cibo_single_account_historical_capital_ledger.py'
      - 'tests/infrastructure/test_cibo_single_account_historical_ceiling_state.py'
      - 'tests/infrastructure/test_cibo_single_account_historical_ceiling_epoch.py'
      - 'tests/infrastructure/test_cibo_single_account_historical_ceiling_replay.py'
      - 'tests/infrastructure/test_cibo_single_account_manifest_economics.py'
      - 'tests/infrastructure/test_cibo_single_account_manifest_settlement.py'
      - 'tests/infrastructure/test_cibo_sovereign_capital_runtime_contract.py'
      - 'tests/infrastructure/test_cibo_account_sizing_authority.py'
      - 'tests/infrastructure/test_cibo_cma_risk_request.py'
      - 'tests/infrastructure/test_cibo_capital_digital_twin.py'
      - 'tests/infrastructure/test_cibo_full_economic_digital_twin.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-cibo-sovereign-ceiling-economic-retry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retry-economic-ceiling:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}
      FROZEN_ARTIFACT_ID: '11389331836'
      FROZEN_ARTIFACT_DIGEST: 'sha256:30177639f660c9647ab70257c2d12c541bdade49ab5582347a3890f920070fee'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Validate replay code
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/cibo_single_account_historical_ceiling_replay.py \
            src/qore/infrastructure/account_wide_risk.py \
            src/qore/infrastructure/cibo_sovereign_capital_runtime.py \
            src/qore/infrastructure/cibo_capital_management_authority.py \
            src/qore/infrastructure/cibo_cma_risk_request.py \
            src/qore/infrastructure/cibo_capital_digital_twin.py \
            src/qore/infrastructure/cibo_full_economic_digital_twin.py \
            src/qore/infrastructure/cibo_single_account_historical_capital_ledger.py \
            src/qore/infrastructure/cibo_single_account_historical_ceiling_state.py \
            src/qore/infrastructure/cibo_single_account_historical_ceiling_epoch.py \
            src/qore/infrastructure/cibo_single_account_historical_ceiling_replay.py \
            src/qore/infrastructure/cibo_single_account_manifest_economics.py \
            src/qore/infrastructure/cibo_single_account_manifest_settlement.py
          ruff check \
            scripts/cibo_single_account_historical_ceiling_replay.py \
            src/qore/infrastructure/account_wide_risk.py \
            src/qore/infrastructure/cibo_sovereign_capital_runtime.py \
            src/qore/infrastructure/cibo_capital_management_authority.py \
            src/qore/infrastructure/cibo_cma_risk_request.py \
            src/qore/infrastructure/cibo_capital_digital_twin.py \
            src/qore/infrastructure/cibo_single_account_historical_capital_ledger.py \
            src/qore/infrastructure/cibo_single_account_historical_ceiling_state.py \
            src/qore/infrastructure/cibo_single_account_historical_ceiling_epoch.py \
            src/qore/infrastructure/cibo_single_account_historical_ceiling_replay.py \
            src/qore/infrastructure/cibo_single_account_manifest_economics.py \
            src/qore/infrastructure/cibo_single_account_manifest_settlement.py \
            tests/infrastructure/test_cibo_single_account_historical_capital_ledger.py \
            tests/infrastructure/test_cibo_single_account_historical_ceiling_state.py \
            tests/infrastructure/test_cibo_single_account_historical_ceiling_epoch.py \
            tests/infrastructure/test_cibo_single_account_historical_ceiling_replay.py \
            tests/infrastructure/test_cibo_single_account_manifest_economics.py \
            tests/infrastructure/test_cibo_single_account_manifest_settlement.py \
            tests/infrastructure/test_cibo_sovereign_capital_runtime_contract.py \
            tests/infrastructure/test_cibo_account_sizing_authority.py \
            tests/infrastructure/test_cibo_cma_risk_request.py \
            tests/infrastructure/test_cibo_capital_digital_twin.py \
            tests/infrastructure/test_cibo_full_economic_digital_twin.py
          pytest -q --no-cov \
            tests/infrastructure/test_account_wide_risk.py \
            tests/infrastructure/test_cibo_single_account_historical_capital_ledger.py \
            tests/infrastructure/test_cibo_single_account_historical_ceiling_state.py \
            tests/infrastructure/test_cibo_single_account_historical_ceiling_epoch.py \
            tests/infrastructure/test_cibo_single_account_historical_ceiling_replay.py \
            tests/infrastructure/test_cibo_single_account_manifest_economics.py \
            tests/infrastructure/test_cibo_single_account_manifest_settlement.py \
            tests/infrastructure/test_cibo_sovereign_capital_runtime_contract.py \
            tests/infrastructure/test_cibo_account_sizing_authority.py \
            tests/infrastructure/test_cibo_cma_risk_request.py \
            tests/infrastructure/test_cibo_capital_digital_twin.py \
            tests/infrastructure/test_cibo_full_economic_digital_twin.py

      - name: Recover frozen Native MAX input from run 124
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/frozen"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$FROZEN_ARTIFACT_ID" > "$RUNNER_TEMP/artifact.meta.json"
          jq -e --arg digest "$FROZEN_ARTIFACT_DIGEST" '.expired == false and .digest == $digest' "$RUNNER_TEMP/artifact.meta.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$FROZEN_ARTIFACT_ID/zip" > "$RUNNER_TEMP/frozen.zip"
          echo "${FROZEN_ARTIFACT_DIGEST#sha256:}  $RUNNER_TEMP/frozen.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/frozen.zip" -d "$RUNNER_TEMP/frozen"
          find "$RUNNER_TEMP/frozen" -maxdepth 5 -type f -print
          MANIFEST="$(find "$RUNNER_TEMP/frozen" -type f -name single-account-manifest-native.json -print -quit)"
          PREFLIGHT="$(find "$RUNNER_TEMP/frozen" -type f -name native-max-preflight.json -print -quit)"
          test -n "$MANIFEST"
          test -n "$PREFLIGHT"
          echo "MANIFEST=$MANIFEST" >> "$GITHUB_ENV"
          echo "PREFLIGHT=$PREFLIGHT" >> "$GITHUB_ENV"

      - name: Prove frozen input lineage
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from qore.infrastructure.cibo_single_account_manifest_integrity import validate_single_account_manifest_sha256

          manifest = json.loads(Path(os.environ["MANIFEST"]).read_text())
          preflight = json.loads(Path(os.environ["PREFLIGHT"]).read_text())
          digest = validate_single_account_manifest_sha256(manifest)
          assert preflight["schema"] == "qore.cibo.native-max-intelligence-preflight.v1"
          assert preflight["source_manifest_sha256"] == digest
          assert preflight["decision_count"] == 3368
          assert preflight["native_max_pass_count"] == 3368
          assert preflight["native_max_blocked_count"] == 0
          assert preflight["maximum_intelligence_ready"] is True
          assert preflight["external_ai_call_count"] == 0
          assert manifest["account_count"] == 1
          assert manifest["account_reset_count"] == 0
          assert manifest["economic_era_reset_count"] == 0
          assert manifest["initial_capital_usd"] == "60"
          assert manifest["opportunity_decision_count"] == 3368
          assert manifest["decision_epoch_count"] == 3305
          print(json.dumps({"manifest_sha256": digest, "native_max_pass_count": 3368}, sort_keys=True))
          PY

      - name: Execute current sovereign economic replay only
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/retry"
          python scripts/cibo_single_account_historical_ceiling_replay.py \
            --manifest "$MANIFEST" \
            --output "$RUNNER_TEMP/retry/historical-ceiling-replay.json" \
            --progress-every 100
          python - <<'PY'
          import json
          from pathlib import Path
          import os

          p = json.loads((Path(os.environ["RUNNER_TEMP"]) / "retry" / "historical-ceiling-replay.json").read_text())
          g = p["governance"]
          assert p["decision_epoch_count"] == 3305
          assert p["decision_count"] == 3368
          assert p["external_ai_call_count"] == 0
          assert g["single_account_usd60"] is True
          assert g["account_reset_count"] == 0
          assert g["economic_era_reset_count"] == 0
          assert g["outcome_used_for_predecision"] is False
          assert g["external_ai"] is False
          assert g["broker_mutation"] is False
          assert g["certification_claimed"] is False
          assert g["provider_plane"] == "COUNTERFACTUAL_RESEARCH_ASSUMPTION"
          print(json.dumps({
              "ending_capital_usd": p["ending_capital_usd"],
              "peak_capital_usd": p["peak_capital_usd"],
              "net_pnl_usd": p["net_pnl_usd"],
              "settlement_count": p["settlement_count"],
          }, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-cibo-sovereign-ceiling-economic-retry-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/retry
            ${{ runner.temp }}/artifact.meta.json
          if-no-files-found: warn
