name: QORE VT31 NAS100 WAIT1025 Hybrid Tick Manifest V1

on:
  push:
    branches:
      - agent/vt31-nas100-intelligence-pilot-001
    paths:
      - scripts/vt31_nas100_causal_hybrid_wait1025_tick_manifest_v1.py
      - .github/workflows/vt31-nas100-wait1025-hybrid-tick-manifest-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
          - partition: r8_fresh
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and static gate
        run: |
          set -euo pipefail
          pip install -e ".[dev]"
          python -m py_compile \
            scripts/vt31_nas100_causal_hybrid_wait1025_tick_manifest_v1.py
          ruff check \
            scripts/vt31_nas100_causal_hybrid_wait1025_tick_manifest_v1.py

      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p evidence result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d evidence
          path="evidence/fresh/NAS100/market-evidence.json"
          test -f "$path"
          actual="$(sha256sum "$path" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"

      - name: Build exact hybrid ambiguity manifest
        run: |
          set -euo pipefail
          python scripts/vt31_nas100_causal_hybrid_wait1025_tick_manifest_v1.py \
            evidence/fresh/NAS100/market-evidence.json \
            --partition "$PARTITION" \
            --output "result/hybrid-wait1025-tick-manifest-${PARTITION}.json" \
            | tee result/summary.json

      - name: Governance gate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p=os.environ["PARTITION"]
          payload=json.loads(
              Path(
                  f"result/hybrid-wait1025-tick-manifest-{p}.json"
              ).read_text()
          )
          g=payload["governance"]
          assert payload["variant"] == "WAIT_1025_B060"
          assert payload["market"] == "NAS100"
          assert payload["research_only"] is True
          assert payload["opens_new_holdout"] is False
          assert g["core_reasoning_replayed_causally"] is True
          assert g["authorization_timestamp_respected"] is True
          assert g["monthly_alt_budget_respected"] is True
          assert g["terminal_pnl_used_to_form_window"] is False
          assert g["future_bars_used_to_authorize_entry"] is False
          assert g["policy_promoted"] is False
          assert payload["window_count"] > 0
          PY

      - name: Bind result
        run: |
          set -euo pipefail
          echo "$GITHUB_SHA" > result/git-sha.txt
          echo "$ARTIFACT_ID" > result/source-evidence-artifact-id.txt
          (
            cd result
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )
          (cd result && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-wait1025-tick-manifest-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-nas100-wait1025-tick-manifest-*-${{ github.sha }}
          path: input
          merge-multiple: true

      - name: Aggregate exact ambiguity inventory
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from pathlib import Path
          rows={}
          for path in Path("input").glob(
              "hybrid-wait1025-tick-manifest-*.json"
          ):
              payload=json.loads(path.read_text())
              rows[payload["partition"]]={
                  "window_count":payload["window_count"],
                  "classification_counts":payload[
                      "classification_counts"
                  ],
                  "sha256":payload["sha256"],
              }
          assert set(rows)=={"r5","r6","r8_fresh"}, rows
          report={
              "schema":(
                  "qore.vt31.nas100."
                  "causal_hybrid_wait1025_tick_manifest.aggregate.v1"
              ),
              "variant":"WAIT_1025_B060",
              "folds":rows,
              "research_only":True,
              "opens_new_holdout":False,
              "policy_promoted":False,
          }
          Path("result/aggregate.json").write_text(
              json.dumps(report,sort_keys=True,indent=2)+"\n"
          )
          print(json.dumps(report,sort_keys=True))
          PY

      - name: Bind aggregate
        run: |
          set -euo pipefail
          echo "$GITHUB_SHA" > result/git-sha.txt
          (
            cd result
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )
          (cd result && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-wait1025-tick-manifest-aggregate-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
