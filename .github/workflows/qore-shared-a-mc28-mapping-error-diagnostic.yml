name: QORE Shared A MC28 Mapping Error Diagnostic

concurrency:
  group: qore-shared-a-mc28-mapping-error-diagnostic
  cancel-in-progress: false

on:
  push:
    branches:
      - agent/shared-a-cognitive-science-001
    paths:
      - src/qore/infrastructure/core_stack_v2/mapping_error_diagnostic.py
      - tests/infrastructure/test_core_stack_v2_mapping_error_diagnostic.py
      - scripts/shared_mc28_mapping_error_diagnostic.py
      - .github/workflows/qore-shared-a-mc28-mapping-error-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and validate
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          mkdir -p input/{frontier,mc28} result
          ruff check \
            src/qore/infrastructure/core_stack_v2/mapping_error_diagnostic.py \
            tests/infrastructure/test_core_stack_v2_mapping_error_diagnostic.py \
            scripts/shared_mc28_mapping_error_diagnostic.py
          mypy src/qore/infrastructure/core_stack_v2/mapping_error_diagnostic.py
          pytest -q tests/infrastructure/test_core_stack_v2_mapping_error_diagnostic.py

      - name: Verify immutable B and A evidence
        run: |
          set -euo pipefail
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/36775635034" --jq '.conclusion')" = "success"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11125412870" --jq '.expired')" = "false"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/36777388801" --jq '.conclusion')" = "success"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11126275619" --jq '.expired')" = "false"

      - name: Recover exact evidence
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11125412870/zip" > frontier.zip
          unzip -q frontier.zip -d input/frontier
          sums="$(find input/frontier -name SHA256SUMS -print -quit)"
          test -n "$sums"
          (cd "$(dirname "$sums")" && sha256sum -c SHA256SUMS)
          frontier_file="$(find input/frontier -name shared-b-global-identity-frontier-v3.json -print -quit)"
          test -n "$frontier_file"
          printf 'FRONTIER_FILE=%s\n' "$frontier_file" >> "$GITHUB_ENV"

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11126275619/zip" > mc28.zip
          unzip -q mc28.zip -d input/mc28
          (cd input/mc28 && sha256sum -c SHA256SUMS)

      - name: Execute explicit mapping diagnostic
        run: |
          python scripts/shared_mc28_mapping_error_diagnostic.py \
            --frontier-v3 "$FRONTIER_FILE" \
            --prior-mc28 input/mc28/mc28-standard-006-diagnostic-taxonomy.json \
            --output result/mc28-mapping-error-diagnostic.json \
            | tee result/summary.json

      - name: Validate reduced blocker set
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/mc28-mapping-error-diagnostic.json").read_text())
          assert p["status"] == "MC28_MAPPING_ERROR_DIAGNOSTIC_REAL_BOUND_PASS_OPEN_4"
          assert p["b06_identity_frontier_complete"] is False
          assert p["known_mapping_count"] == 90
          assert p["identity_unknown_count"] == 87
          assert p["baseline_mapping_mismatch_count"] == 0
          assert p["injected_mapping_error_detected_count"] == 90
          assert p["mapping_error_diagnostic_bound"] is True
          assert p["unknown_identity_preserved_as_unknown"] is True
          assert p["automatic_identity_inference_used"] is False
          assert p["open_diagnostic_count"] == 4
          assert "MAPPING_ERRORS" not in p["open_diagnostics"]
          assert p["mc28_completed_and_proven"] is False
          assert p["broker_mutation_authority"] is False
          assert p["execution_authority"] is False
          assert p["risk_authority"] is False
          assert p["sizing_authority"] is False
          assert p["master_ledger_mutated"] is False
          assert p["protected_certification_holdout_opened"] is False
          PY

      - name: Seal
        run: |
          printf '%s\n' "${GITHUB_SHA}" > result/code-git-sha.txt
          (cd result && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-a-mc28-mapping-error-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Report
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path("result/mc28-mapping-error-diagnostic.json").read_text())
          body="\n".join([
              "## Shared A MC-28 — Mapping Error Diagnostic",
              "",
              f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- known mappings checked: **{p['known_mapping_count']}**",
              f"- unresolved identities kept UNKNOWN: **{p['identity_unknown_count']}**",
              f"- injected mapping errors detected: **{p['injected_mapping_error_detected_count']}/{p['injected_mapping_error_count']}**",
              "- B06 full identity complete: **False**",
              "- MAPPING_ERRORS diagnostic: **Bound**",
              f"- remaining MC28 diagnostics: **{p['open_diagnostic_count']}**",
              *[f"- `{x}`" for x in p["open_diagnostics"]],
              "- MC-28 completed-and-proven: **False**",
          ])+"\n"
          Path("result/issue-comment.md").write_text(body)
          PY
          gh issue comment 638 --body-file result/issue-comment.md
