name: QORE Native - Verify Existing EURJPY USDCHF 7Y DEMO Archives (No OAuth)
on:
  push:
    branches:
      - research/qore-native-ctrader-demo-eurjpy-usdchf-m5-20261011
    paths:
      - '.github/workflows/qore-native-existing-7y-fx-source-inventory.yml'
      - 'src/qore/infrastructure/trader_lab/qore_native_existing_demo_fx_archive_inventory_v1.py'
      - 'tests/infrastructure/trader_lab/test_qore_native_existing_demo_fx_archive_inventory_v1.py'
      - 'src/qore/infrastructure/trader_lab/qore_native_existing_demo_fx_g0c_v1.py'
      - 'tests/infrastructure/trader_lab/test_qore_native_existing_demo_fx_g0c_v1.py'
      - 'docs/research/QORE_NATIVE_EXISTING_7Y_G0C_DEV_ONLY_PREREG_2026-10-11.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Check existing-archive verifier
        run: |
          ruff check --select F,E4,E7,E9 src/qore/infrastructure/trader_lab/qore_native_existing_demo_fx_archive_inventory_v1.py tests/infrastructure/trader_lab/test_qore_native_existing_demo_fx_archive_inventory_v1.py src/qore/infrastructure/trader_lab/qore_native_existing_demo_fx_g0c_v1.py tests/infrastructure/trader_lab/test_qore_native_existing_demo_fx_g0c_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_qore_native_existing_demo_fx_archive_inventory_v1.py tests/infrastructure/trader_lab/test_qore_native_existing_demo_fx_g0c_v1.py

  archive_metadata:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        symbol: [EURJPY, USDCHF]
    env:
      SYMBOL: ${{ matrix.symbol }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package (no cTrader connector / no credential dependency)
        run: python -m pip install -e .
      - name: Download original sealed 7Y data from GitHub Actions artifact without cTrader OAuth
        uses: actions/download-artifact@v4
        with:
          name: qore-vt08-expansion-7y-${{ matrix.symbol }}-6958ea0c4f183020b5248b413af998065c6662da
          path: original-archive
          run-id: '36079229139'
          github-token: ${{ github.token }}
      - name: Verify manifest metadata, archive bytes SHA256, DEMO-only and no economic outcomes
        run: |
          python -m qore.infrastructure.trader_lab.qore_native_existing_demo_fx_archive_inventory_v1 "$SYMBOL" original-archive "reports/${SYMBOL}-existing-7y-demo-inventory.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("reports")/(os.environ["SYMBOL"]+"-existing-7y-demo-inventory.json")
          d=json.loads(p.read_text())
          assert d["symbol"] == os.environ["SYMBOL"]
          assert d["source_run_id"] == 36079229139
          assert d["account_is_live"] is False
          assert d["environment"] == "demo"
          assert d["original_reserved_scope"] == "VT08_COGNITIVE_EXPANSION_M3_UNSEEN_VALIDATION"
          assert not d["virgin_oos_claimed"] and not d["capture_repeated"]
          assert d["admission_to_new_trader_not_authorized"]
          assert d["coverage"]["M5"]["bar_count"] > 0
          PY
      - name: Compute dev-only time census before VT08 sealed cutoff (no trading or OAuth)
        run: |
          python -m qore.infrastructure.trader_lab.qore_native_existing_demo_fx_g0c_v1 "$SYMBOL" original-archive reports
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads((Path("reports")/(os.environ["SYMBOL"]+"-g0c.json")).read_text())
          assert d["identity"]=="QORE_NATIVE_G0C_EXISTING_7Y_FX_DEV_CLOCK_CENSUS_V1"
          assert d["reserved_cutoff_utc"]=="2023-09-24T23:45:00+00:00"
          assert d["prices_read"] is False and d["virgin_oos_claimed"] is False
          assert d["sealed_vt08_post_cutoff_not_examined"] is True
          assert d["ctrader_oauth_needed"] is False
          assert d["m5_observed_dev"]>0
          print("G0C_DEV_M5",d["symbol"],d["m5_observed_dev"])
          PY
          sha256sum reports/* > reports/REPORT_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-native-existing-7y-fx-inventory-${{ matrix.symbol }}-${{ github.sha }}
          path: reports/
          retention-days: 90
          if-no-files-found: error
