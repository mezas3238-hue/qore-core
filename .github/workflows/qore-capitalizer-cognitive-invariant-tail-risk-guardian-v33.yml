name: QORE Capitalizer Cognitive Invariant Tail-Risk Guardian V33

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-cognitive-invariant-tail-risk-guardian-v33-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  V21_RUN_ID: '36264229554'
  V21_ARTIFACT_SHA: '05452328bbf5cbbc4b26210791d13114105e3f9d'
  V29_RUN_ID: '36283499014'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_cognitive_invariant_tail_risk_guardian_v33.py \
            tests/infrastructure/trader_lab/test_capitalizer_cognitive_invariant_tail_risk_guardian_v33.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_cognitive_invariant_tail_risk_guardian_v33.py \
            tests/infrastructure/trader_lab/test_capitalizer_cognitive_invariant_tail_risk_guardian_v33.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_cognitive_invariant_tail_risk_guardian_v33.py

  aggregate:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download authoritative reconstructed consumed evidence
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v21-reconstructed-*-${{ env.V21_ARTIFACT_SHA }}
          path: reconstructed
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ env.V21_RUN_ID }}
      - name: Download authoritative V29 native-M1 trigger states
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v29-trigger-state-*
          path: trigger-states
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ env.V29_RUN_ID }}
      - name: Run V33 cognitive invariant tail-risk guardian
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cognitive_invariant_tail_risk_guardian_v33 \
            reconstructed/development-input \
            reconstructed/validation-input \
            reconstructed/reserved-input \
            reconstructed/development-validation-context \
            reconstructed/reserved-context \
            trigger-states \
            experiment-output
      - name: Enforce V33 contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "experiment-output/"
                  "capitalizer-cognitive-invariant-tail-risk-guardian-v33.json"
              ).read_text()
          )

          assert report["identity"] == (
              "QORE_CAPITALIZER_COGNITIVE_INVARIANT_TAIL_RISK_GUARDIAN_V33"
          )
          assert report["policy"] == (
              "SURFACE_DEFAULT_COGNITIVE_INVARIANT_TAIL_RISK_OVERRIDE"
          )
          assert report["surface_default"] is True
          assert report["episode_dd_relief_target_used"] is True
          assert report["local_trade_delta_is_primary_target"] is False
          assert report["cross_era_invariant_subspace"] is True
          assert report["conflicting_sign_features_zeroed"] is True
          assert report["chronological_calibration_folds"] == 5
          assert report["minimum_chronological_calibration_examples"] == 10
          assert report["sparse_family_policy"] == "FAIL_CLOSED_KEEP_SURFACE"
          assert report["residual_lower_quantile"] == "0.2"
          assert report["metacognitive_uncertainty_can_only_preserve_surface"] is True
          assert report["l2_prior_strength_effective_trades"] == "12.0"
          assert report["expected_full_feature_dimension"] == 95
          assert report["all_entries_preserved"] is True
          assert report["density_retention"] == "1"
          assert report["same_entrant_identities"] is True
          assert report["fixed_target_r"] == "2.00"
          assert report["original_stop_geometry_preserved_at_entry"] is True
          assert report["new_protection_geometry_created"] is False
          assert report["max3_preserved"] is True
          assert report["max3_slot_recycling"] is False
          assert report["current_outcome_visible_to_decision"] is False
          assert report["heldout_counterfactual_visible_to_decision"] is False
          assert report["future_after_trigger_visible_to_decision"] is False
          assert report["activation_bar_ohlc_visible_to_decision"] is False
          assert report["era_identity_feature_used"] is False
          assert report[
              "symbol_session_side_time_identity_features_used"
          ] is False
          assert report["historical_fresh_oos_available"] is False
          assert report["2018_2020_status"] == "CONSUMED_NOT_FRESH"
          assert report["trader_certified"] is False

          expected = {
              "DEVELOPMENT_2024_2026": 948,
              "CONSUMED_VALIDATION_2022_2024": 1034,
              "CONSUMED_RESERVED_2020_2022": 1088,
          }
          for row in report["results"]:
              assert row["trades"] == expected[row["period"]]
              assert row["density_retention"] == "1"

          for period_rows in report["model_diagnostics"].values():
              for family_rows in period_rows.values():
                  for action in family_rows.values():
                      if not action["available"]:
                          continue
                      assert action["training_trades"] > 0
                      assert action["feature_dimension"] == 95
                      assert action["episode_oof_residuals"] > 0

          print(json.dumps(report, sort_keys=True))
          PY
      - name: Upload V33 evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-cognitive-invariant-tail-risk-guardian-v33-${{ github.sha }}
          path: experiment-output
          if-no-files-found: error
          retention-days: 90
