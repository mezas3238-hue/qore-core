name: VT08 R3.17 CIBO Operating Sovereignty

on:
  push:
    branches:
      - agent/vt08-r3-17-cibo-bank-attack-001
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src tests

      - name: CIBO operating sovereignty gates
        run: |
          pytest -q \
            tests/infrastructure/test_cibo_trader_manager.py \
            tests/infrastructure/test_cibo_trader_operating_manager.py \
            tests/infrastructure/trader_lab/test_vt08_cibo_bank_attack_r3_17.py

      - name: Full QORE gate
        run: pytest --cov=src/qore --cov-report=term-missing
