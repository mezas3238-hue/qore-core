name: QORE Core Stack V2 Shared Foundation

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - "src/qore/infrastructure/core_stack_v2/**"
      - "tests/infrastructure/test_core_stack_v2_foundation.py"
      - "docs/research/QORE-CORE-STACK-V2-SHARED-FOUNDATION-001.md"
      - ".github/workflows/qore-core-stack-v2-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check --fix src/qore/infrastructure/core_stack_v2 tests/infrastructure/test_core_stack_v2_foundation.py
          git diff --exit-code -- src/qore/infrastructure/core_stack_v2 tests/infrastructure/test_core_stack_v2_foundation.py
      - name: Mypy
        run: mypy src/qore/infrastructure/core_stack_v2
      - name: Focused tests
        run: pytest -q tests/infrastructure/test_core_stack_v2_foundation.py --no-cov
