name: QORE CIBO T17 Provider Capability Receipt

on:
  pull_request:
    paths:
      - '.github/workflows/cibo-t17-provider-capability-receipt.yml'
      - 'src/qore/infrastructure/cibo_t17_provider_capability_receipt.py'
      - 'tests/infrastructure/test_cibo_t17_provider_capability_receipt.py'
  push:
    branches:
      - agent/cibo-integrator-ab-001
    paths:
      - '.github/workflows/cibo-t17-provider-capability-receipt.yml'
      - 'src/qore/infrastructure/cibo_t17_provider_capability_receipt.py'
      - 'tests/infrastructure/test_cibo_t17_provider_capability_receipt.py'

permissions:
  contents: read

jobs:
  t17-provider-capability-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src/qore/infrastructure/cibo_t17_provider_capability_receipt.py tests/infrastructure/test_cibo_t17_provider_capability_receipt.py
      - name: mypy
        run: mypy src/qore/infrastructure/cibo_t17_provider_capability_receipt.py
      - name: pytest
        run: pytest -q --no-cov tests/infrastructure/test_cibo_t17_provider_capability_receipt.py tests/infrastructure/test_cibo_crossboundary_evidence_receipt.py
