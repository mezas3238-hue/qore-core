# Manual Trader Lab replay trigger: access-path verification 2026-10-07
name: QORE CIBO Trader Lab Three Mode Ceiling

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cibo-causal-expectation-leakage-fix-001
    paths:
      - '.github/workflows/cibo-trader-lab-three-mode-ceiling.yml'
      - 'src/qore/infrastructure/trader_lab/cibo_three_mode_capital_lab.py'
      - 'scripts/cibo_trader_lab_three_mode_ceiling.py'
      - 'tests/infrastructure/trader_lab/test_cibo_three_mode_capital_lab.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-cibo-trader-lab-three-mode-${{ github.sha }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}/src
  SOURCE_ARTIFACT_ID: '11451743578'
  SOURCE_ARTIFACT_DIGEST: 'sha256:d439957f21e2f79148b5a2fb75a53db6fa448698f17aeb6978f379ed3547f7ea'
  HISTORICAL_SOURCE_ARTIFACT_ID: '11389331836'
  HISTORICAL_SOURCE_ARTIFACT_DIGEST: 'sha256:30177639f660c9647ab70257c2d12c541bdade49ab5582347a3890f920070fee'
  HISTORICAL_CONTROL_ARTIFACT_ID: '11409086692'
  HISTORICAL_CONTROL_ARTIFACT_DIGEST: 'sha256:eeffdc99a736b82bd965ff646b8ca9bf084f50ae414e56e9b3d82961169d7187'

jobs:
  three-mode-ceiling:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile isolated Trader Lab surface
        run: |
          set -euo pipefail
          python -m py_compile \
            src/qore/infrastructure/trader_lab/cibo_three_mode_capital_lab.py \
            scripts/cibo_trader_lab_three_mode_ceiling.py \
            tests/infrastructure/trader_lab/test_cibo_three_mode_capital_lab.py

      - name: Run fast three-mode unit contract
        run: |
          set -euo pipefail
          python -m unittest -q \
            tests.infrastructure.trader_lab.test_cibo_three_mode_capital_lab

      - name: Recover canonical full walk-forward artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/result"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID" > "$RUNNER_TEMP/source.meta.json"
          jq -e --arg digest "$SOURCE_ARTIFACT_DIGEST" '.expired == false and .digest == $digest' "$RUNNER_TEMP/source.meta.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" > "$RUNNER_TEMP/source.zip"
          echo "${SOURCE_ARTIFACT_DIGEST#sha256:}  $RUNNER_TEMP/source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/source"
          MANIFEST="$(find "$RUNNER_TEMP/source" -type f -name walk-forward-manifest.json -print -quit)"
          BASELINE="$(find "$RUNNER_TEMP/source" -type f -name walk-forward-replay.json -print -quit)"
          test -n "$MANIFEST"
          test -n "$BASELINE"
          echo "MANIFEST=$MANIFEST" >> "$GITHUB_ENV"
          echo "BASELINE=$BASELINE" >> "$GITHUB_ENV"

          mkdir -p "$RUNNER_TEMP/historical-source"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$HISTORICAL_SOURCE_ARTIFACT_ID" > "$RUNNER_TEMP/historical-source.meta.json"
          jq -e --arg digest "$HISTORICAL_SOURCE_ARTIFACT_DIGEST" '.expired == false and .digest == $digest' "$RUNNER_TEMP/historical-source.meta.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$HISTORICAL_SOURCE_ARTIFACT_ID/zip" > "$RUNNER_TEMP/historical-source.zip"
          echo "${HISTORICAL_SOURCE_ARTIFACT_DIGEST#sha256:}  $RUNNER_TEMP/historical-source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/historical-source.zip" -d "$RUNNER_TEMP/historical-source"
          HISTORICAL_MANIFEST="$(find "$RUNNER_TEMP/historical-source" -type f -name single-account-manifest-native.json -print -quit)"
          test -n "$HISTORICAL_MANIFEST"
          echo "HISTORICAL_MANIFEST=$HISTORICAL_MANIFEST" >> "$GITHUB_ENV"

          mkdir -p "$RUNNER_TEMP/historical-control"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$HISTORICAL_CONTROL_ARTIFACT_ID" > "$RUNNER_TEMP/historical-control.meta.json"
          jq -e --arg digest "$HISTORICAL_CONTROL_ARTIFACT_DIGEST" '.expired == false and .digest == $digest' "$RUNNER_TEMP/historical-control.meta.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$HISTORICAL_CONTROL_ARTIFACT_ID/zip" > "$RUNNER_TEMP/historical-control.zip"
          echo "${HISTORICAL_CONTROL_ARTIFACT_DIGEST#sha256:}  $RUNNER_TEMP/historical-control.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/historical-control.zip" -d "$RUNNER_TEMP/historical-control"
          HISTORICAL_REPLAY="$(find "$RUNNER_TEMP/historical-control" -type f -name historical-ceiling-replay.json -print -quit)"
          test -n "$HISTORICAL_REPLAY"
          echo "HISTORICAL_REPLAY=$HISTORICAL_REPLAY" >> "$GITHUB_ENV"

      - name: Run BANK MEDIUM ATTACK causal baseline
        run: |
          set -euo pipefail
          python scripts/cibo_trader_lab_three_mode_ceiling.py \
            --manifest "$MANIFEST" \
            --baseline-replay "$BASELINE" \
            --output "$RUNNER_TEMP/result/cibo-three-mode-ceiling.json"

      - name: Run post-burn context-gate hypothesis
        run: |
          set -euo pipefail
          python scripts/cibo_trader_lab_three_mode_ceiling.py \
            --manifest "$MANIFEST" \
            --baseline-replay "$BASELINE" \
            --enforce-context-abstain \
            --output "$RUNNER_TEMP/result/cibo-three-mode-context-hypothesis.json"

      - name: Run historical-prior Native transfer
        run: |
          set -euo pipefail
          python scripts/cibo_trader_lab_three_mode_ceiling.py \
            --manifest "$MANIFEST" \
            --baseline-replay "$BASELINE" \
            --historical-manifest "$HISTORICAL_MANIFEST" \
            --historical-replay "$HISTORICAL_REPLAY" \
            --output "$RUNNER_TEMP/result/cibo-three-mode-historical-prior-native.json"

      - name: Run historical-prior soft drawdown allocator frontier
        run: |
          set -euo pipefail
          python scripts/cibo_trader_lab_three_mode_ceiling.py \
            --manifest "$MANIFEST" \
            --baseline-replay "$BASELINE" \
            --historical-manifest "$HISTORICAL_MANIFEST" \
            --historical-replay "$HISTORICAL_REPLAY" \
            --soft-medium-drawdown-allocator \
            --output "$RUNNER_TEMP/result/cibo-three-mode-historical-soft-dd.json"

      - name: Run historical-prior DD reserve frontier 25.25pct
        run: |
          set -euo pipefail
          python scripts/cibo_trader_lab_three_mode_ceiling.py \
            --manifest "$MANIFEST" \
            --baseline-replay "$BASELINE" \
            --historical-manifest "$HISTORICAL_MANIFEST" \
            --historical-replay "$HISTORICAL_REPLAY" \
            --medium-pretrade-drawdown-ceiling 0.2525 \
            --output "$RUNNER_TEMP/result/cibo-three-mode-historical-dd-2525.json"

      - name: Run historical-prior DD reserve frontier 25.5pct
        run: |
          set -euo pipefail
          python scripts/cibo_trader_lab_three_mode_ceiling.py \
            --manifest "$MANIFEST" \
            --baseline-replay "$BASELINE" \
            --historical-manifest "$HISTORICAL_MANIFEST" \
            --historical-replay "$HISTORICAL_REPLAY" \
            --medium-pretrade-drawdown-ceiling 0.255 \
            --output "$RUNNER_TEMP/result/cibo-three-mode-historical-dd-255.json"

      - name: Run historical-prior DD reserve frontier 26pct
        run: |
          set -euo pipefail
          python scripts/cibo_trader_lab_three_mode_ceiling.py \
            --manifest "$MANIFEST" \
            --baseline-replay "$BASELINE" \
            --historical-manifest "$HISTORICAL_MANIFEST" \
            --historical-replay "$HISTORICAL_REPLAY" \
            --medium-pretrade-drawdown-ceiling 0.26 \
            --output "$RUNNER_TEMP/result/cibo-three-mode-historical-dd-26.json"

      - name: Run historical-prior DD reserve frontier 27pct
        run: |
          set -euo pipefail
          python scripts/cibo_trader_lab_three_mode_ceiling.py \
            --manifest "$MANIFEST" \
            --baseline-replay "$BASELINE" \
            --historical-manifest "$HISTORICAL_MANIFEST" \
            --historical-replay "$HISTORICAL_REPLAY" \
            --medium-pretrade-drawdown-ceiling 0.27 \
            --output "$RUNNER_TEMP/result/cibo-three-mode-historical-dd-27.json"

      - name: Enforce Trader Lab scientific invariants
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from decimal import Decimal
          from pathlib import Path

          p = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "result"
                  / "cibo-three-mode-ceiling.json"
              ).read_text()
          )
          assert p["decision_count"] == 3368
          assert p["decision_epoch_count"] == 3305
          assert p["governance"]["trader_lab_only"] is True
          assert p["governance"]["sovereign_runtime_mutated"] is False
          assert p["governance"]["outcome_used_for_predecision"] is False
          assert p["governance"]["attack_risk_source"] == "PORTFOLIO_CUSHION_ONLY"
          assert p["governance"]["medium_positive_profit_split"] == "50%_SOVEREIGN_50%_CUSHION"
          assert Decimal(p["ending_sovereign_bank_usd"]) >= 0
          assert Decimal(p["ending_portfolio_cushion_usd"]) >= 0
          assert Decimal(p["attack_sovereign_breach_usd"]) == 0
          assert p["mode_epoch_counts"].get("MEDIUM", 0) > 0
          sensors = p["engineering_sensor_report"]
          assert sensors["trace_event_count"] == len(p["engineering_trace"])
          assert set(sensors["functions"]) == {
              "SIZING",
              "ADAPTIVE_LEVERAGE",
              "CIBO_COMPOUND",
              "COMPOUND_PORTFOLIO",
          }
          assert sensors["trace_event_count"] > p["decision_epoch_count"]
          assert sensors["upstream_economic_intake"]["admitted_count"] + sensors[
              "upstream_economic_intake"
          ]["filtered_before_economic_surface_count"] == p["decision_count"]
          assert len(sensors["bottleneck_ranking"]) == 4

          h = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "result"
                  / "cibo-three-mode-context-hypothesis.json"
              ).read_text()
          )
          assert h["research_lane"] == "POST_BURN_CONTEXT_ABSTAIN_HYPOTHESIS"
          assert h["governance"]["trader_lab_only"] is True
          assert h["governance"]["context_quality_abstain_enforced"] is True
          assert h["governance"]["context_gate_status"] == (
              "POST_BURN_HYPOTHESIS_REQUIRES_FRESH_VALIDATION"
          )
          assert Decimal(h["attack_sovereign_breach_usd"]) == 0

          legacy = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "result"
                  / "cibo-three-mode-historical-prior-native.json"
              ).read_text()
          )
          assert legacy["research_lane"] == "HISTORICAL_PRIOR_NATIVE_TRANSFER"
          assert legacy["decision_count"] == 3368
          assert legacy["governance"]["historical_prior_consumed"] is True
          assert legacy["governance"]["outcome_used_for_predecision"] is False
          assert Decimal(legacy["attack_sovereign_breach_usd"]) == 0

          soft = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "result"
                  / "cibo-three-mode-historical-soft-dd.json"
              ).read_text()
          )
          assert soft["research_lane"] == (
              "HISTORICAL_PRIOR_NATIVE_SOFT_DRAWDOWN_ALLOCATOR"
          )
          assert soft["decision_count"] == 3368
          assert soft["governance"]["historical_prior_consumed"] is True
          assert soft["governance"]["soft_medium_drawdown_allocator"] is True
          assert soft["governance"]["outcome_used_for_predecision"] is False
          assert Decimal(soft["attack_sovereign_breach_usd"]) == 0

          for filename, ceiling in (
              ("cibo-three-mode-historical-dd-2525.json", "0.2525"),
              ("cibo-three-mode-historical-dd-255.json", "0.255"),
              ("cibo-three-mode-historical-dd-26.json", "0.26"),
              ("cibo-three-mode-historical-dd-27.json", "0.27"),
          ):
              frontier = json.loads(
                  (
                      Path(os.environ["RUNNER_TEMP"])
                      / "result"
                      / filename
                  ).read_text()
              )
              assert frontier["research_lane"] == (
                  "HISTORICAL_PRIOR_NATIVE_DD_RESERVE_FRONTIER"
              )
              assert frontier["decision_count"] == 3368
              assert frontier["governance"]["historical_prior_consumed"] is True
              assert frontier["governance"][
                  "medium_pretrade_drawdown_ceiling"
              ] == ceiling
              assert frontier["governance"]["outcome_used_for_predecision"] is False
              assert Decimal(frontier["attack_sovereign_breach_usd"]) == 0
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-trader-lab-three-mode-ceiling-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/result/cibo-three-mode-ceiling.json
            ${{ runner.temp }}/result/cibo-three-mode-context-hypothesis.json
            ${{ runner.temp }}/result/cibo-three-mode-historical-prior-native.json
            ${{ runner.temp }}/result/cibo-three-mode-historical-soft-dd.json
            ${{ runner.temp }}/result/cibo-three-mode-historical-dd-2525.json
            ${{ runner.temp }}/result/cibo-three-mode-historical-dd-255.json
            ${{ runner.temp }}/result/cibo-three-mode-historical-dd-26.json
            ${{ runner.temp }}/result/cibo-three-mode-historical-dd-27.json
          if-no-files-found: error
          retention-days: 90
