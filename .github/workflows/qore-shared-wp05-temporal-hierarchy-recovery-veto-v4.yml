name: QORE Shared WP05 Temporal Hierarchy Recovery Veto V4

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - src/qore/infrastructure/core_stack_v2/hierarchical_world_model.py
      - src/qore/infrastructure/core_stack_v2/temporal_hierarchy_engine.py
      - src/qore/infrastructure/core_stack_v2/temporal_hierarchy_transition_v2.py
      - src/qore/infrastructure/core_stack_v2/temporal_hierarchy_absorption_v3.py
      - src/qore/infrastructure/core_stack_v2/temporal_hierarchy_recovery_veto_v4.py
      - tests/infrastructure/test_core_stack_v2_temporal_hierarchy_recovery_veto_v4.py
      - scripts/shared_wp05_temporal_hierarchy_v1.py
      - scripts/shared_wp05_temporal_hierarchy_absorption_v3.py
      - scripts/shared_wp05_temporal_hierarchy_recovery_veto_v4.py
      - .github/workflows/qore-shared-wp05-temporal-hierarchy-recovery-veto-v4.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  temporal-hierarchy-recovery-veto-v4:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Announce WP05 V4 consumed recovery-veto run
        run: |
          gh issue comment 643 --body "WP-05 V4 terminal-safe recovery-veto run started — Git SHA \`${GITHUB_SHA}\`, run \`${GITHUB_RUN_ID}\`. R8 fit/internal chronological calibration only; R6/R5 consumed falsification only; fresh holdout remains closed. Gate unchanged: >=20% false structural-failure reduction while preserving >=95% terminal detections on BOTH R6 and R5."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Shared
        run: pip install -e ".[dev]"

      - name: Static and adversarial validation
        run: |
          ruff check \
            src/qore/infrastructure/core_stack_v2/hierarchical_world_model.py \
            src/qore/infrastructure/core_stack_v2/temporal_hierarchy_recovery_veto_v4.py \
            tests/infrastructure/test_core_stack_v2_temporal_hierarchy_recovery_veto_v4.py \
            scripts/shared_wp05_temporal_hierarchy_recovery_veto_v4.py
          python -m py_compile \
            src/qore/infrastructure/core_stack_v2/temporal_hierarchy_recovery_veto_v4.py \
            scripts/shared_wp05_temporal_hierarchy_recovery_veto_v4.py
          pytest -q \
            tests/infrastructure/test_core_stack_v2_hierarchical_world_model.py \
            tests/infrastructure/test_core_stack_v2_temporal_hierarchy_recovery_veto_v4.py

      - name: Recover immutable consumed R8 R6 R5 market evidence
        run: |
          set -euo pipefail
          mkdir -p input/r8 input/r6 input/r5 result

          download_artifact() {
            local artifact_id="$1"
            local output="$2"
            local tmp="${output}.tmp"
            rm -f "$tmp"
            for attempt in 1 2 3 4; do
              if gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$tmp"; then
                mv "$tmp" "$output"
                return 0
              fi
              rm -f "$tmp"
              sleep $((attempt * 30))
            done
            return 1
          }

          download_artifact 10402199719 r8.zip
          unzip -q r8.zip -d input/r8
          (cd input/r8 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

          download_artifact 10389112524 r6.zip
          unzip -q r6.zip -d input/r6
          (cd input/r6 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

          download_artifact 10380044761 r5.zip
          unzip -q r5.zip -d input/r5
          (cd input/r5 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

      - name: Run WP05 V4 consumed terminal-safe recovery-veto falsification
        run: |
          python scripts/shared_wp05_temporal_hierarchy_recovery_veto_v4.py \
            --r8-nas input/r8/fresh/NAS100/market-evidence.json \
            --r8-sp input/r8/fresh/SP500/market-evidence.json \
            --r8-us input/r8/fresh/US30/market-evidence.json \
            --r6-nas input/r6/fresh/NAS100/market-evidence.json \
            --r6-sp input/r6/fresh/SP500/market-evidence.json \
            --r6-us input/r6/fresh/US30/market-evidence.json \
            --r5-nas input/r5/fresh/NAS100/market-evidence.json \
            --r5-sp input/r5/fresh/SP500/market-evidence.json \
            --r5-us input/r5/fresh/US30/market-evidence.json \
            --output result/wp05-temporal-hierarchy-recovery-veto-v4.json \
            | tee result/summary.json

      - name: Validate WP05 V4 scientific protocol
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(
              Path("result/wp05-temporal-hierarchy-recovery-veto-v4.json").read_text()
          )
          assert p["protocol_pass"] is True
          assert p["fresh_holdout_opened"] is False
          assert p["wp05_exit_gate_pass"] is False
          assert p["status"] in {
              "WP05_V4_RECOVERY_VETO_FROZEN_FOR_FRESH_HOLDOUT",
              "WP05_V4_RECOVERY_VETO_FALSIFIED",
          }
          assert p["trajectory_offsets_minutes"] == [90, 60, 30, 15, 0]
          assert p["model"]["fit_partition"] == "r8"
          assert p["model"]["decision_architecture"] == "TERMINAL_SAFE_RECOVERY_VETO"
          assert p["model"]["calibration_terminal_preservation_bps"] >= 9700

          gate=p["frozen_development_gate"]
          assert gate["minimum_false_declaration_reduction_bps"] == 2000
          assert gate["minimum_terminal_detection_preservation_bps"] == 9500
          assert gate["must_pass_partitions"] == ["r6","r5"]

          for partition in ("r8","r6","r5"):
              assert p["partition_ranges"][partition]["episode_count"] >= 6000

          g=p["governance"]
          assert g["v1_gate_unchanged"] is True
          assert g["r8_fit_only"] is True
          assert g["r8_internal_chronological_calibration"] is True
          assert g["r8_calibration_terminal_buffer_bps"] == 9700
          assert g["r6_refit"] is False
          assert g["r5_refit"] is False
          assert g["r6_threshold_retuning"] is False
          assert g["r5_threshold_retuning"] is False
          assert g["trajectory_source_only"] is True
          assert g["default_action_preserves_structural_failure"] is True
          assert g["only_high_purity_recovery_motif_can_veto"] is True
          assert g["runtime_future_market_used"] is False
          assert g["trade_pnl_used"] is False
          assert g["trader_identity_feature_used"] is False
          assert g["symbol_identity_feature_used"] is False
          assert g["fresh_holdout_opened"] is False
          assert g["knowledge_auto_promotion"] is False
          assert g["shared_methodology_authority"] is False
          assert g["shared_sizing_authority"] is False
          assert g["shared_risk_authority"] is False
          assert g["shared_order_authority"] is False
          assert g["shared_execution_authority"] is False
          assert g["live_authorized"] is False
          assert g["production_authorized"] is False
          assert g["real_capital_authorized"] is False
          assert g["merge_authorized"] is False
          PY

      - name: Bind result
        run: |
          echo "${GITHUB_SHA}" > result/git-sha.txt
          (
            cd result
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-wp05-temporal-hierarchy-recovery-veto-v4-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Report WP05 V4 result
        if: always()
        run: |
          if [ ! -f result/wp05-temporal-hierarchy-recovery-veto-v4.json ]; then
            gh issue comment 643 --body "WP-05 V4 run \`${GITHUB_RUN_ID}\` did not produce a scientific payload. Inspect technical failure; fresh holdout remains closed."
            exit 0
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path

          p=json.loads(
              Path("result/wp05-temporal-hierarchy-recovery-veto-v4.json").read_text()
          )
          m=p["model"]
          lines=[
              "## WP-05 V4 terminal-safe recovery-veto result",
              "",
              f"- Git SHA: \`{os.environ['GITHUB_SHA']}\`",
              f"- GitHub Actions run: \`{os.environ['GITHUB_RUN_ID']}\`",
              f"- status: **{p['status']}**",
              f"- protocol_pass: **{p['protocol_pass']}**",
              f"- development_gate_pass: **{p['development_gate_pass']}**",
              "- mechanism: **baseline failure remains default; only a high-purity source-only recovery motif may veto it**",
              f"- R8 selected motif level: **{m['selected_level']}**",
              f"- minimum support: **{m['minimum_cell_support']}**",
              f"- maximum terminal contamination: **{m['maximum_terminal_contamination_bps']} bps**",
              f"- R8 calibration terminal preservation: **{m['calibration_terminal_preservation_bps']} bps**",
              "- frozen gate unchanged: **>=20% false-declaration reduction + >=95% terminal-detection preservation on both R6/R5**",
              "- fresh holdout opened: **False**",
              "",
              "Partition results:",
          ]
          for partition in ("r8","r6","r5"):
              e=p["evaluations"][partition]
              lines.append(
                  f"- {partition.upper()}: baseline false={e['baseline_false_declaration_count']}, terminals={e['baseline_terminal_count']}; hierarchy false={e['hierarchy_false_declaration_count']}, missed terminals={e['hierarchy_missed_terminal_count']}; false reduction={e['false_declaration_reduction_bps']} bps; terminal preservation={e['terminal_detection_preservation_bps']} bps"
              )
          if p["development_gate_pass"]:
              lines.append(
                  "V4 survives consumed development. Next legal step: freeze its exact model fingerprint and preregister a new independent WP-05 holdout before reading fresh evidence."
              )
          else:
              lines.append(
                  "V4 is falsified on consumed evidence. Do not open fresh evidence or weaken the gate; continue structural temporal research."
              )
          Path("result/wp05-v4-issue-update.md").write_text("\n".join(lines)+"\n")
          PY
          gh issue comment 643 --body-file result/wp05-v4-issue-update.md
