name: QORE Turtle Soup GBPJPY R29 Coverage Expansion Lab

on:
  workflow_dispatch:
  pull_request:
    branches:
      - agent/turtle-soup-gbpjpy-cognitive-v3-r28-001
    paths:
      - '.github/workflows/turtle-soup-gbpjpy-r29-coverage-expansion-lab.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_r29_coverage_expansion_lab.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_gbpjpy_r29_coverage_expansion_lab.py'
  push:
    branches:
      - agent/turtle-soup-gbpjpy-specialist-memory-v1-001
    paths:
      - '.github/workflows/turtle-soup-gbpjpy-r29-coverage-expansion-lab.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_r29_coverage_expansion_lab.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_gbpjpy_r29_coverage_expansion_lab.py'

permissions:
  contents: read
  actions: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-GBPJPY-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-GBPJPY-2f510461b3360e91d5ee70a72716a76cd6561f16'
  R28_RUN_ID: '35340723742'
  R28_ARTIFACT: 'qore-turtle-soup-gbpjpy-cognitive-v3-r28-e4a2813c4b1c4bb63630d387ab332cd4a6103a0e'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check --ignore E501,I001 \
            src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_r29_coverage_expansion_lab.py \
            tests/infrastructure/trader_lab/test_turtle_soup_gbpjpy_r29_coverage_expansion_lab.py
      - name: Mypy focused gate
        run: |
          mypy --disable-error-code attr-defined \
            src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_r29_coverage_expansion_lab.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_turtle_soup_gbpjpy_r29_coverage_expansion_lab.py

  coverage-lab:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable GBPJPY raw master
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-gbpjpy
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download immutable Target Destination V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target-gbpjpy
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Download Cognitive V3
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.R28_ARTIFACT }}
          path: cognitive-v3
          github-token: ${{ github.token }}
          run-id: ${{ env.R28_RUN_ID }}
      - name: Run fixed R29 coverage experiments
        run: |
          mkdir -p r29-output
          python -m qore.infrastructure.trader_lab.turtle_soup_gbpjpy_r29_coverage_expansion_lab \
            source-gbpjpy target-gbpjpy cognitive-v3 r29-output \
            > r29-output/stdout.json
          printf '%s\n' "$GITHUB_SHA" > r29-output/git-sha.txt
      - name: Enforce experiment governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('r29-output/r29-coverage-expansion-lab-report.json').read_text())
          assert p['identity']=='TURTLE_SOUP_GBPJPY_R29_COVERAGE_EXPANSION_LAB_V1'
          c=p['experiment_contract']
          assert c['fresh_holdout_consumed'] is False
          assert c['r28_rules_relaxed'] is False
          assert c['protected_swing_changed'] is False
          assert c['c2_changed'] is False
          assert c['cisd_changed'] is False
          assert c['regime_model_changed'] is False
          assert c['fallback_requires_anatomy_structural_support'] is True
          assert c['fallback_requires_same_target_regime_journey_validation'] is True
          assert c['fallback_target_rank']==1
          a=p['predeclared_acceptance']
          assert a['minimum_trades']==250
          assert a['minimum_net_010_profit_factor']=='1.80'
          assert a['maximum_net_010_drawdown_r']=='8.0'
          assert a['maximum_net_010_losing_streak']==3
          g=p['governance']
          assert g['candidate_replaced'] is False
          assert g['fresh_holdout_consumed'] is False
          assert g['live_authorized'] is False
          assert g['real_capital_authorized'] is False
          PY
      - name: Hash R29 evidence
        run: |
          cd r29-output
          sha256sum r29-coverage-expansion-lab-report.json stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-gbpjpy-r29-coverage-expansion-lab-${{ env.EVIDENCE_SHA }}
          path: r29-output
          if-no-files-found: error
          retention-days: 90
