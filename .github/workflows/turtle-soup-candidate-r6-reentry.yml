name: QORE Turtle Soup R6 Experimental Re-entry

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-candidate-r6-reentry-experimental-001
    paths:
      - .github/workflows/turtle-soup-candidate-r6-reentry.yml
      - scripts/turtle_soup_r6_reentry.py
      - docs/research/TURTLE-SOUP-CANDIDATE-R6-REENTRY-SOURCE-ADJUDICATION.md
      - docs/research/TURTLE-SOUP-CANDIDATE-R6-EXPERIMENTAL-REENTRY-FREEZE.md

concurrency:
  group: qore-turtle-soup-r6-reentry-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      R1_D1_RUN: "34947549114"
      R1_M15_RUN: "34947548876"
      R1_M1_RUN: "34959770555"
      R5_WAVE1_RUN: "34969259616"
      R5_WAVE1B_RUN: "34985374006"
      R5_WAVE2_RUN: "34986122071"
      R1_BASE_SHA: "5a228511d39dabd9686c2d9c14c1a6a4f52ad2b2"
      R1_M1_SHA: "a2f1b411ea8b8dada4f41181f9698f503ac69de1"
      R5_WAVE1_SHA: "36bc4a537a907b2a84509c1ab3a1babe033fad9c"
      R5_WAVE1B_SHA: "48f562aef9c2cd4849c8d4317e61df909f50ed38"
      R5_WAVE2_SHA: "8a1efc01b9c02478aae1d9d8fbc99ebc0c556e8a"
    steps:
      - name: Checkout exact R6 head
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static syntax gate
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/turtle_soup_r5_replay_core.py \
            scripts/turtle_soup_r5_economics.py \
            scripts/turtle_soup_r6_reentry.py

      - name: Capture immutable upstream artifact metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p replay-output
          for run in \
            "$R1_D1_RUN" "$R1_M15_RUN" "$R1_M1_RUN" \
            "$R5_WAVE1_RUN" "$R5_WAVE1B_RUN" "$R5_WAVE2_RUN"; do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/artifacts" \
              > "replay-output/upstream-artifacts-${run}.json"
          done

      - name: Download frozen D1 M15 and targeted M1 evidence
        shell: bash
        run: |
          set -euo pipefail
          for symbol in EURUSD GBPUSD USDJPY AUDUSD USDCAD GBPJPY AUDJPY; do
            gh run download "$R1_D1_RUN" \
              -n "qore-turtle-soup-r1-d1-${symbol}-${R1_BASE_SHA}" \
              -D "evidence/d1/${symbol}"
            gh run download "$R1_M15_RUN" \
              -n "qore-turtle-soup-r1-m15-${symbol}-${R1_BASE_SHA}" \
              -D "evidence/m15/${symbol}"
            gh run download "$R1_M1_RUN" \
              -n "qore-turtle-soup-r1-targeted-m1-${symbol}-${R1_M1_SHA}" \
              -D "evidence/m1/${symbol}"
          done

      - name: Download immutable R5 tick evidence
        shell: bash
        run: |
          set -euo pipefail
          for symbol in EURUSD GBPUSD USDJPY AUDUSD USDCAD GBPJPY AUDJPY; do
            gh run download "$R5_WAVE1_RUN" \
              -n "qore-turtle-soup-r5-classic-ticks-${symbol}-${R5_WAVE1_SHA}" \
              -D "evidence/ticks/wave1/${symbol}"
            gh run download "$R5_WAVE2_RUN" \
              -n "qore-turtle-soup-r5-classic-ticks-wave2-${symbol}-${R5_WAVE2_SHA}" \
              -D "evidence/ticks/wave2/${symbol}"
          done
          for symbol in GBPUSD USDCAD; do
            gh run download "$R5_WAVE1B_RUN" \
              -n "qore-turtle-soup-r5-classic-ticks-wave1b-${symbol}-${R5_WAVE1B_SHA}" \
              -D "evidence/ticks/wave1b/${symbol}"
          done

      - name: Hash exact R6 inputs
        shell: bash
        run: |
          set -euo pipefail
          find evidence -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > replay-output/input-files-sha256.txt

      - name: Execute frozen R6 re-entry replay
        shell: bash
        run: |
          set -euo pipefail
          python scripts/turtle_soup_r6_reentry.py \
            --input-root evidence \
            --software-sha "$GITHUB_SHA" \
            --report replay-output/turtle-soup-r6-report.json \
            --trades replay-output/turtle-soup-r6-trades.json

      - name: Enforce R6 governance invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("replay-output/turtle-soup-r6-report.json").read_text())
          assert report["research_round_identity"] == "turtle-soup-candidate-r6-reentry-exp1"
          assert report["source_adjudication"] == "R6_REENTRY_SOURCE_UNDERDETERMINED"
          assert report["reentry_provenance"] == "QORE_EXPERIMENTAL_REENTRY"
          assert report["fresh_oos_consumed"] is False
          assert report["candidate_freeze"] is None
          assert report["r5_source_fills"] == 290
          assert report["final_verdict"] in {
              "R6_DEVELOPMENT_GATE_PASS",
              "R6_REENTRY_EXPERIMENT_REJECTED",
          }
          if report["final_verdict"] == "R6_REENTRY_EXPERIMENT_REJECTED":
              assert report["passing_policies"] == []
              assert report["fresh_oos_authorized"] is False
          else:
              assert report["passing_policies"]
              assert report["fresh_oos_authorized"] is True
          PY

      - name: Upload immutable R6 adjudication evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-r6-reentry-${{ github.sha }}
          path: replay-output
          if-no-files-found: error
          retention-days: 30
