name: QORE GBPUSD R43 Live Core

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-gbpusd-r43-live-core-integration-001
    paths:
      - '.github/workflows/gbpusd-r43-live-core.yml'
      - 'src/qore/infrastructure/r43_gbpusd_live.py'
      - 'src/qore/infrastructure/account_wide_risk.py'
      - 'scripts/qore_fundednext_runtime.py'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_gbpusd_*.py'
      - 'src/qore/infrastructure/trader_lab/cibo_gbpusd_*.py'
      - 'runtime_data/gbpusd/**'
      - 'tests/infrastructure/test_r43_gbpusd_live.py'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check --ignore E501,I001 src/qore/infrastructure/r43_gbpusd_live.py src/qore/infrastructure/account_wide_risk.py scripts/qore_fundednext_runtime.py tests/infrastructure/test_r43_gbpusd_live.py
      - name: Mypy
        run: |
          mypy --disable-error-code attr-defined src/qore/infrastructure/r43_gbpusd_live.py scripts/qore_fundednext_runtime.py
      - name: Focused tests
        run: |
          pytest -q --no-cov             tests/infrastructure/test_r43_gbpusd_live.py             tests/infrastructure/test_account_wide_risk.py
