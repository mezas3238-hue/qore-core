name: QORE Turtle Soup GBPJPY Validated Specialist V3 R28

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/turtle-soup-gbpjpy-validated-specialist-v3-r28.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_specialist_cognitive_memory_v3.py'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_r28_validated_specialist_brain.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_gbpjpy_specialist_cognitive_memory_v3.py'
  push:
    branches:
      - agent/turtle-soup-gbpjpy-specialist-memory-v1-001
    paths:
      - '.github/workflows/turtle-soup-gbpjpy-validated-specialist-v3-r28.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_specialist_cognitive_memory_v3.py'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_r28_validated_specialist_brain.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_gbpjpy_specialist_cognitive_memory_v3.py'

permissions:
  contents: read
  actions: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-GBPJPY-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-GBPJPY-2f510461b3360e91d5ee70a72716a76cd6561f16'
  STRUCTURAL_RUN_ID: '35349300927'
  STRUCTURAL_ARTIFACT: 'qore-turtle-soup-gbpjpy-structural-specialist-v2-r27-00fb870826e0cbd30179fe44cbdd6707448be0da'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check --ignore E501,I001 \
            src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_specialist_cognitive_memory_v3.py \
            src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_r28_validated_specialist_brain.py \
            tests/infrastructure/trader_lab/test_turtle_soup_gbpjpy_specialist_cognitive_memory_v3.py
      - name: Mypy focused gate
        run: |
          mypy --disable-error-code attr-defined \
            src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_specialist_cognitive_memory_v3.py \
            src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_r28_validated_specialist_brain.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_turtle_soup_gbpjpy_specialist_cognitive_memory_v3.py

  validated-memory-and-replay:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable GBPJPY raw master
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-gbpjpy
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download immutable Target Destination V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target-gbpjpy
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Download official Cognitive V2 + R27 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.STRUCTURAL_ARTIFACT }}
          path: structural-v2-r27
          github-token: ${{ github.token }}
          run-id: ${{ env.STRUCTURAL_RUN_ID }}
      - name: Build economically validated Cognitive V3
        run: |
          mkdir -p cognitive-v3
          python -m qore.infrastructure.trader_lab.turtle_soup_gbpjpy_specialist_cognitive_memory_v3 \
            structural-v2-r27 cognitive-v3 > cognitive-v3/stdout.json
      - name: Enforce Cognitive V3 contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('cognitive-v3/turtle-soup-gbpjpy-specialist-cognitive-memory-v3-report.json').read_text())
          assert p['identity']=='TURTLE_SOUP_GBPJPY_SPECIALIST_COGNITIVE_MEMORY_V3'
          s=p['source_v2']
          assert s['run_id']==35349300927
          assert s['artifact_id']==10549575964
          assert s['artifact_digest']=='sha256:9e9b57f3a108d4f26b3e0b3600705859dc2491dd735972d563f7a350fe0798d2'
          d=p['decision_contract']
          assert d['causal_structure_frozen_before_economic_validation'] is True
          assert d['regime_definition_frozen_before_economic_validation'] is True
          assert d['target_support_frozen_before_economic_validation'] is True
          assert d['management_posture_frozen_before_economic_validation'] is True
          assert d['calendar_year_rule'] is False
          assert d['economic_mean_magnitude_used_for_target_ranking'] is False
          assert d['r27_result_used_as_input'] is False
          g=p['governance']
          assert g['fresh_holdout_consumed'] is False
          assert g['candidate_promoted'] is False
          PY
      - name: Run R28 validated specialist replay
        run: |
          mkdir -p r28-output
          python -m qore.infrastructure.trader_lab.turtle_soup_gbpjpy_r28_validated_specialist_brain \
            source-gbpjpy target-gbpjpy cognitive-v3 r28-output > r28-output/stdout.json
          printf '%s\n' "$EVIDENCE_SHA" > r28-output/git-sha.txt
      - name: Enforce R28 decision contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('r28-output/r28-validated-specialist-brain-report.json').read_text())
          assert p['identity']=='TURTLE_SOUP_GBPJPY_R28_VALIDATED_SPECIALIST_BRAIN_V1'
          d=p['decision_contract']
          assert d['causal_structure_precedes_economic_validation'] is True
          assert d['situation_definition_uses_economic_results'] is False
          assert d['regime_definition_uses_economic_results'] is False
          assert d['management_posture_selected_by_economic_results'] is False
          assert d['economic_mean_magnitude_ranks_targets'] is False
          assert d['calendar_year_regime_rule'] is False
          assert d['actual_strategy_entry'] is True
          assert d['exact_protected_swing'] is True
          assert d['target_from_active_cibo_dol_ladder'] is True
          assert d['structural_rearm'] is True
          g=p['governance']
          assert g['fresh_holdout_consumed'] is False
          assert g['candidate_promoted'] is False
          assert g['live_authorized'] is False
          assert g['real_capital_authorized'] is False
          PY
      - name: Hash immutable V3 and R28 evidence
        run: |
          mkdir -p package
          cp cognitive-v3/turtle-soup-gbpjpy-specialist-cognitive-memory-v3-report.json package/
          cp cognitive-v3/turtle-soup-gbpjpy-specialist-cognitive-memory-v3.json package/
          cp r28-output/r28-validated-specialist-brain-report.json package/
          cp r28-output/r28-validated-specialist-brain-trades.json package/
          cp r28-output/git-sha.txt package/
          cd package
          sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-gbpjpy-validated-specialist-v3-r28-${{ env.EVIDENCE_SHA }}
          path: package
          if-no-files-found: error
          retention-days: 90
