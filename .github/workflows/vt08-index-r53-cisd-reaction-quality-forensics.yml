name: VT08 Index R53 CISD Reaction Quality Forensics

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r53-cisd-reaction-quality-forensics.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r53_cisd_reaction_quality_forensics.py
      - tests/infrastructure/trader_lab/test_vt08_index_r53_cisd_reaction_quality_forensics.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r53_cisd_reaction_quality_forensics.py

  forensics:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R53 source-complete CISD reaction falsification
        run: |
          python -m qore.infrastructure.trader_lab.vt08_index_r53_cisd_reaction_quality_forensics \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r53-cisd-reaction-quality-forensics.json

      - name: Verify R53 governance and exact source-complete density
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r53-cisd-reaction-quality-forensics.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R53_SOURCE_COMPLETE_CISD_REACTION_QUALITY_FORENSICS_001"
          )
          assert report["candidate"]["candidate_created"] is False
          assert report["candidate"]["rules_changed"] is False
          assert report["candidate"]["risk_changed"] is False
          assert report["five_year"]["cisd_sample"] == 2068
          assert report["recent_two_year"]["cisd_sample"] == 899
          assert report["five_year"]["all_cisd_at_floor"] is True
          assert report["recent_two_year"]["all_cisd_at_floor"] is True
          g = report["governance"]
          assert g["forensics_only"] is True
          assert g["consumed_evidence_only"] is True
          assert g["all_predictors_known_at_or_before_entry"] is True
          assert g["reaction_window_ends_at_signal"] is True
          assert g["post_arrival_phase_used"] is False
          assert g["post_entry_outcome_used_as_predictor"] is False
          assert g["automatic_rule_promotion"] is False
          assert g["signal_suppression_performed"] is False
          assert g["risk_retuning_performed"] is False
          assert g["live_authorized"] is False
          assert g["real_capital_authorized"] is False
          assert g["production_authorized"] is False
          PY

      - name: Upload R53 evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-index-r53-cisd-reaction-quality-forensics-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
