name: Recover R62N assert and exception repair

on:
  push:
    branches: [agent/qore-umi14-umi12-final-owner-recert-001]
    paths: [.github/workflows/r62n-assert-exception-recovery.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qore-umi14-umi12-final-owner-recert-001
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Install canonical development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Apply bounded repair from staged payload
        run: |
          python - <<'PY'
          import base64
          import re
          import zlib
          from pathlib import Path

          staging = Path('.github/workflows/r62n-assert-exception-fix.yml').read_text()
          match = re.search(r"PATCH_ZLIB_B64: '([^']+)'", staging)
          if match is None:
              raise SystemExit('staged repair payload not found')
          script = zlib.decompress(base64.b64decode(match.group(1))).decode('utf-8')
          exec(compile(script, '<r62n-assert-patch>', 'exec'))
          PY
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py')
          text = path.read_text()
          old_sequence = '''    if isinstance(node, (ast.Tuple, ast.List, ast.Set)):
        working = _r62n_copy_state(state)
        raised: list[_r62l._R62LState] = []
        for child in node.elts:
            working, child_raised = _r62n_ordered_expression_raise_states(
                child,
                working,
            )
            raised.extend(child_raised)
        raised.append(_r62n_copy_state(working))
        return working, _r62n_unique_states(raised)
'''
          new_sequence = '''    if isinstance(node, (ast.Tuple, ast.List, ast.Set)):
        working = _r62n_copy_state(state)
        sequence_raised: list[_r62l._R62LState] = []
        for child in node.elts:
            working, child_raised = _r62n_ordered_expression_raise_states(
                child,
                working,
            )
            sequence_raised.extend(child_raised)
        sequence_raised.append(_r62n_copy_state(working))
        return working, _r62n_unique_states(sequence_raised)
'''
          old_dict = '''    if isinstance(node, ast.Dict):
        working = _r62n_copy_state(state)
        raised: list[_r62l._R62LState] = []
        for key, value in zip(node.keys, node.values, strict=True):
            if key is not None:
                working, child_raised = _r62n_ordered_expression_raise_states(
                    key,
                    working,
                )
                raised.extend(child_raised)
            working, child_raised = _r62n_ordered_expression_raise_states(
                value,
                working,
            )
            raised.extend(child_raised)
        raised.append(_r62n_copy_state(working))
        return working, _r62n_unique_states(raised)
'''
          new_dict = '''    if isinstance(node, ast.Dict):
        working = _r62n_copy_state(state)
        dictionary_raised: list[_r62l._R62LState] = []
        for key, value in zip(node.keys, node.values, strict=True):
            if key is not None:
                working, child_raised = _r62n_ordered_expression_raise_states(
                    key,
                    working,
                )
                dictionary_raised.extend(child_raised)
            working, child_raised = _r62n_ordered_expression_raise_states(
                value,
                working,
            )
            dictionary_raised.extend(child_raised)
        dictionary_raised.append(_r62n_copy_state(working))
        return working, _r62n_unique_states(dictionary_raised)
'''
          if text.count(old_sequence) != 1 or text.count(old_dict) != 1:
              raise SystemExit('strict-typing repair anchors not exact')
          text = text.replace(old_sequence, new_sequence, 1)
          text = text.replace(old_dict, new_dict, 1)
          path.write_text(text)
          PY
          python -m py_compile tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
          ruff check tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
          mypy tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
          git diff --check
      - name: Deterministic regression matrix
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('tests/infrastructure').resolve()))
          n = importlib.import_module('test_universal_cross_asset_conformance_final_owner_r62n_guards')
          cases = {
              'complex_floor': ('def run():\n    return getattr(globals()["b"], "eval", lambda _: 3)("1+1")\ntry:\n    1j // 0j\nexcept TypeError:\n    import builtins as b\n    result = run()\nexcept ZeroDivisionError:\n    b = len\n    result = run()\n', 2, True),
              'complex_mod': ('def run():\n    return getattr(globals()["b"], "eval", lambda _: 3)("1+1")\ntry:\n    1j % 0j\nexcept TypeError:\n    import builtins as b\n    result = run()\nexcept ZeroDivisionError:\n    b = len\n    result = run()\n', 2, True),
              'assert_true_safe': ('import builtins\nb = len\ndef run():\n    return getattr(globals()["b"], "eval", lambda _: 3)("1+1")\nassert True, (b := builtins)\nresult = run()\n', 3, False),
              'assert_true_danger': ('import builtins as b\ndef run():\n    return getattr(globals()["b"], "eval", lambda _: 3)("1+1")\nassert True, (b := len)\nresult = run()\nb = len\n', 2, True),
              'assert_false_safe': ('import builtins as b\ndef run():\n    return getattr(globals()["b"], "eval", lambda _: 3)("1+1")\ntry:\n    assert False, (b := len)\nexcept AssertionError:\n    result = run()\n', 3, False),
              'assert_false_danger': ('import builtins\nb = len\ndef run():\n    return getattr(globals()["b"], "eval", lambda _: 3)("1+1")\ntry:\n    assert False, (b := builtins)\nexcept AssertionError:\n    result = run()\nb = len\n', 2, True),
          }
          for name, (source, expected_runtime, expected_marker) in cases.items():
              namespace = {}
              exec(compile(source, '<assert-fix>', 'exec', dont_inherit=True), namespace)
              markers = n._r62n_dynamic_execution_markers_from_source(source)
              print(name, namespace.get('result'), markers)
              assert namespace.get('result') == expected_runtime
              assert bool(markers) is expected_marker
          PY
      - name: Commit repair and remove staging workflows
        run: |
          set -euo pipefail
          git config user.name 'qore-integration-authority'
          git config user.email 'qore-integration-authority@users.noreply.github.com'
          git rm .github/workflows/r62n-assert-exception-fix.yml
          git rm .github/workflows/r62n-assert-exception-recovery.yml
          git add tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
          git commit -m 'Harden R62N assert and exception precision'
          git push origin HEAD:agent/qore-umi14-umi12-final-owner-recert-001
