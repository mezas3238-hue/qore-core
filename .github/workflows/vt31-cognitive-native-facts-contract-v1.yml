name: QORE VT31 Cognitive Native Facts Contract V1

on:
  push:
    branches:
      - agent/vt31-architect-cognition-sensors-20261009
    paths:
      - src/qore/infrastructure/traders/vt31_nas100_causal_fact_producers.py
      - src/qore/infrastructure/traders/vt31_nas100_cognitive_telemetry.py
      - src/qore/infrastructure/traders/vt31_nas100_post_entry_cognitive_runtime.py
      - scripts/vt31_nas100_cognitive_sensor_audit_v1.py
      - tests/infrastructure/test_vt31_nas100_causal_fact_producers.py
      - tests/infrastructure/test_vt31_nas100_cognitive_producer_sensor_contract.py
      - tests/infrastructure/test_vt31_nas100_post_entry_cognitive_runtime.py
      - .github/workflows/vt31-cognitive-native-facts-contract-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  causal-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Static producer and sensor parity
        run: |
          python -m py_compile \
            src/qore/infrastructure/traders/vt31_nas100_post_entry_cognitive_runtime.py \
            src/qore/infrastructure/traders/vt31_nas100_causal_fact_producers.py \
            src/qore/infrastructure/traders/vt31_nas100_cognitive_telemetry.py \
            scripts/vt31_nas100_cognitive_sensor_audit_v1.py \
            tests/infrastructure/test_vt31_nas100_causal_fact_producers.py \
            tests/infrastructure/test_vt31_nas100_cognitive_producer_sensor_contract.py \
            tests/infrastructure/test_vt31_nas100_post_entry_cognitive_runtime.py
          ruff check \
            src/qore/infrastructure/traders/vt31_nas100_post_entry_cognitive_runtime.py \
            src/qore/infrastructure/traders/vt31_nas100_causal_fact_producers.py \
            src/qore/infrastructure/traders/vt31_nas100_cognitive_telemetry.py \
            scripts/vt31_nas100_cognitive_sensor_audit_v1.py \
            tests/infrastructure/test_vt31_nas100_causal_fact_producers.py \
            tests/infrastructure/test_vt31_nas100_cognitive_producer_sensor_contract.py \
            tests/infrastructure/test_vt31_nas100_post_entry_cognitive_runtime.py
      - name: Causal fixtures and strict sensor integrity
        run: |
          PYTHONPATH=. pytest -q -o addopts='' \
            tests/infrastructure/test_vt31_nas100_causal_fact_producers.py \
            tests/infrastructure/test_vt31_nas100_cognitive_producer_sensor_contract.py \
            tests/infrastructure/test_vt31_nas100_post_entry_cognitive_runtime.py
