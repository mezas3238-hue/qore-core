name: QORE VT31 Cognitive Native Facts Contract V1

on:
  push:
    branches:
      - agent/vt31-architect-cognition-sensors-20261009
    paths:
      - src/qore/infrastructure/traders/vt31_nas100_causal_fact_producers.py
      - tests/infrastructure/test_vt31_nas100_causal_fact_producers.py
      - .github/workflows/vt31-cognitive-native-facts-contract-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  causal-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Static causal producer contract
        run: |
          python -m py_compile \
            src/qore/infrastructure/traders/vt31_nas100_causal_fact_producers.py \
            tests/infrastructure/test_vt31_nas100_causal_fact_producers.py
          ruff check \
            src/qore/infrastructure/traders/vt31_nas100_causal_fact_producers.py \
            tests/infrastructure/test_vt31_nas100_causal_fact_producers.py
      - name: Controlled no-lookahead causal fixtures
        run: |
          pytest -q -o addopts='' \
            tests/infrastructure/test_vt31_nas100_causal_fact_producers.py
