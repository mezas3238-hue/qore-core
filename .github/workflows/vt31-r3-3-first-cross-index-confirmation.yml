name: QORE VT-31 R3.3 First Cross-Index Confirmation

on:
  push:
    branches: [agent/vt31-r2-5-multi-index-validation-001]
    paths:
      - .github/workflows/vt31-r3-3-first-cross-index-confirmation.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -e .
      - name: Download immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p evidence/{NAS100,SP500,US30}
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10350575547/zip" > NAS100.zip
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10351435307/zip" > SP500.zip
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10350622506/zip" > US30.zip
          echo "1a16adc1485ce7f77666fde2261a36dd62beea8cfea1f3a5abcea176a3902cea  NAS100.zip" > sums
          echo "bcdc7a346cb3a618b277934d21e9ed30583f814c0645862dd48cd8ca3a5a1fc1  SP500.zip" >> sums
          echo "bdfc75724433162bd4d079f581543c09aad75f35406a7a3d2985cd205c89b96c  US30.zip" >> sums
          sha256sum -c sums
          for m in NAS100 SP500 US30; do unzip -q "$m.zip" -d "evidence/$m"; done
      - name: Run causal one-exposure research
        run: |
          python - <<'PY'
          import hashlib,json
          from collections import defaultdict
          from decimal import Decimal
          from pathlib import Path
          from qore.infrastructure.trader_lab.vt31_silver_bullet_r2_5_multi_index_research import load_market_evidence,_day,_wall,_simulate,_metrics,_quartiles
          from qore.infrastructure.trader_lab.vt31_silver_bullet_r2_6_composite_entry_research import VARIANTS,_evaluate

          markets=("NAS100","SP500","US30")
          variant=next(x for x in VARIANTS if x.location=="near-stop")
          loaded={m:load_market_evidence(Path(f"evidence/{m}/market-evidence.json")) for m in markets}
          candidates=defaultdict(list); setup_counts={}
          for market,(series,*_) in loaded.items():
              by_day=defaultdict(list)
              for index,bar in enumerate(series): by_day[_day(bar.opened_at)].append((index,bar))
              count=0
              for day,indexed in by_day.items():
                  reference=[bar for _,bar in indexed if (9,0,0)<=_wall(bar.opened_at)<(10,0,0)]
                  session=[(i,bar) for i,bar in indexed if (10,0,0)<=_wall(bar.opened_at)<(11,0,0)]
                  if len(reference)!=60 or len(session)!=60: continue
                  prefix=list(reference)
                  for global_index,bar in session:
                      prefix.append(bar)
                      setup,reason=_evaluate(instrument=series[0].instrument,as_of=bar.closed_at,bars=tuple(prefix),variant=variant)
                      if setup is not None:
                          candidates[day.isoformat()].append((setup.signal_at.isoformat(),market,global_index,setup))
                          count+=1; break
                      if reason=="both-sides-swept": break
              setup_counts[market]=count

          selected=[]; abstain_ties=0; unfilled=0
          for day,items in candidates.items():
              first=min(x[0] for x in items)
              earliest=[x for x in items if x[0]==first]
              if len(earliest)!=1:
                  abstain_ties+=1; continue
              _,market,index,setup=earliest[0]
              trade,status=_simulate(loaded[market][0],index,setup)
              if trade is None:
                  unfilled+=1; continue
              selected.append(dict(trade,market=market))
          selected.sort(key=lambda x:(x["filled_at"],x["market"]))
          aggregate=_metrics(selected); stress=_metrics(selected,friction=Decimal(".05"))
          bym={m:_metrics([t for t in selected if t["market"]==m],friction=Decimal(".05")) for m in markets}
          bys={s:_metrics([t for t in selected if t["side"]==s],friction=Decimal(".05")) for s in ("long","short")}
          q=_quartiles(selected); temporal={}
          for m in markets:
              own=[t for t in selected if t["market"]==m]
              for y in sorted({t["local_date"][:4] for t in own}):
                  temporal[f"{m}:{y}"]=_metrics([t for t in own if t["local_date"].startswith(y)],friction=Decimal(".05"))
          eligible=[x for x in temporal.values() if x["sample"]>=10]
          gates={
            "aggregate_sample_at_least_150":aggregate["sample"]>=150,
            "each_market_sample_at_least_30":all(x["sample"]>=30 for x in bym.values()),
            "aggregate_stressed_mean_positive":Decimal(stress["mean_r"])>0,
            "aggregate_stressed_pf_at_least_1_10":stress["profit_factor"] is not None and Decimal(stress["profit_factor"])>=Decimal("1.10"),
            "aggregate_stressed_dd_at_most_20r":Decimal(stress["max_drawdown_r"])<=20,
            "every_market_stressed_mean_positive":all(Decimal(x["mean_r"])>0 for x in bym.values()),
            "both_sides_stressed_mean_positive":all(x["sample"] and Decimal(x["mean_r"])>0 for x in bys.values()),
            "three_of_four_quartiles_positive":sum(Decimal(x["mean_r"])>0 for x in q)>=3,
            "two_thirds_eligible_temporal_blocks_positive":bool(eligible) and sum(Decimal(x["mean_r"])>0 for x in eligible)*3>=len(eligible)*2,
          }
          contract={"parent":"R2.6-nearest-still-valid-retracement-near-stop","markets":list(markets),"portfolio_policy":"first-unique-structural-confirmation-per-NY-day","simultaneous_first_confirmation":"abstain","selection_uses_fill":False,"selection_uses_outcome":False,"maximum_exposures_per_day":1,"hypothesis_count":1}
          result={"aggregate":aggregate,"stress_0_05r":stress,"market_stress":bym,"side_stress":bys,"quartiles":q,"temporal_blocks":temporal,"gates":gates,"survivor":all(gates.values()),"setup_counts":setup_counts,"simultaneous_abstains":abstain_ties,"unfilled_selected_setups":unfilled,"trades":selected}
          report={"schema":"qore.trader_lab.vt31_r3_3_first_confirmation_research.v1","software_sha":"${{ github.sha }}","research_only":True,"consumed_evidence_only":True,"fresh_evidence_opened":False,"contract":contract,"contract_fingerprint":hashlib.sha256(json.dumps(contract,sort_keys=True,separators=(",",":")).encode()).hexdigest(),"result":result,"adjudication":"CANDIDATE_JUSTIFIED_FOR_SEPARATE_FREEZE" if result["survivor"] else "VT31_R3_3_CANDIDATE_NOT_JUSTIFIED","candidate_frozen":False,"demo_eligible":False,"live_authorized":False,"real_capital_authorized":False,"production_authorized":False}
          Path("vt31-r3-3-first-confirmation-research.json").write_text(json.dumps(report,sort_keys=True,separators=(",",":"))+"\n")
          print(json.dumps({"adjudication":report["adjudication"],"aggregate":aggregate,"stress":stress,"markets":{m:x["mean_r"] for m,x in bym.items()},"sides":{s:x["mean_r"] for s,x in bys.items()},"positive_quartiles":sum(Decimal(x["mean_r"])>0 for x in q),"failed":[g for g,p in gates.items() if not p],"setup_counts":setup_counts,"simultaneous_abstains":abstain_ties,"unfilled":unfilled},sort_keys=True))
          PY
          echo "$GITHUB_SHA" > git-sha.txt
          sha256sum vt31-r3-3-first-confirmation-research.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-r3-3-first-confirmation-${{ github.sha }}
          path: |
            vt31-r3-3-first-confirmation-research.json
            git-sha.txt
            SHA256SUMS
          if-no-files-found: error
          retention-days: 90
