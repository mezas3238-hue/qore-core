name: QORE VT-31 Historical Tick Resolution

on:
  push:
    branches:
      - agent/vt31-historical-tick-resolution-001
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Compile and test signed tick-page deltas
        run: |
          python -m py_compile scripts/vt31_historical_tick_probe.py
          python -m py_compile scripts/vt31_tick_execution_resolution.py
          python - <<'PY'
          from scripts.vt31_historical_tick_probe import _decode_page

          class Tick:
              def __init__(self, timestamp: int, tick: int) -> None:
                  self.timestamp = timestamp
                  self.tick = tick

          decoded = _decode_page((
              Tick(1_700_000_000_500, 123456),
              Tick(-200, -6),
              Tick(-150, 10),
              Tick(0, 0),
          ))
          assert [x.timestamp_ms for x in decoded] == [
              1_700_000_000_500,
              1_700_000_000_300,
              1_700_000_000_150,
              1_700_000_000_150,
          ]
          assert [x.relative_price for x in decoded] == [
              123456,
              123450,
              123460,
              123460,
          ]

          try:
              _decode_page((Tick(1_700_000_000_500, 123456), Tick(1, 0)))
          except Exception as error:
              assert 'newest-first' in str(error)
          else:
              raise AssertionError('forward timestamp delta must fail closed')
          PY
      - name: Validate execution resolver semantics
        run: |
          set -euo pipefail
          python scripts/vt31_tick_execution_resolution.py --self-test
      - name: Governance guard
        run: |
          grep -q 'research_only' scripts/vt31_historical_tick_probe.py
          grep -q 'opens_new_holdout' scripts/vt31_historical_tick_probe.py
          grep -q 'BID' scripts/vt31_historical_tick_probe.py
          grep -q 'ASK' scripts/vt31_historical_tick_probe.py
          grep -q 'NO_R9_NOT_CERTIFIED' scripts/vt31_tick_execution_resolution.py
          grep -q 'same_millisecond_cross_stream_order' scripts/vt31_tick_execution_resolution.py
