name: QORE Scalper A2 Nine Market Causal Waterfall

on:
  push:
    branches:
      - agent/scalper-architect-b-methodology-20261010
    paths:
      - '.github/workflows/qore-scalper-a2-nine-market-causal-waterfall.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: scalper-a2-nine-market-source-waterfall-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'
  A1_COGNITIVE_REF: '4ab7c1ad72876f15e2f24923927d9140406d85a3'

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Fail-closed A2 source and economics contract
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_scalper_v49_v50_g_waterfall_v1.py tests/infrastructure/trader_lab/test_capitalizer_scalper_v49_v50_g_waterfall_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_scalper_v49_v50_g_waterfall_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_scalper_v49_v50_g_waterfall_v1.py tests/infrastructure/trader_lab/test_capitalizer_v49_h1_target_causality.py

  market:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {symbol: USDJPY, session: ASIA}
          - {symbol: AUDJPY, session: ASIA}
          - {symbol: AUDUSD, session: ASIA}
          - {symbol: GBPJPY, session: ASIA}
          - {symbol: EURUSD, session: LONDON}
          - {symbol: GBPUSD, session: LONDON}
          - {symbol: XAUUSD, session: NEW_YORK}
          - {symbol: USDCAD, session: NEW_YORK}
          - {symbol: NAS100, session: NEW_YORK}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only replay code
        run: python -m pip install -e .
      - name: Overlay immutable A1 observational tracing onto A2 causal V49 source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$A1_COGNITIVE_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$A1_COGNITIVE_REF"
          for module in \
            capitalizer_v50_g_causal_decision_trace.py \
            capitalizer_v50_cognitive_geometry_economics.py \
            capitalizer_v50_cognitive_opportunity.py; do
            git show "$A1_COGNITIVE_REF:src/qore/infrastructure/trader_lab/$module" \
              > "src/qore/infrastructure/trader_lab/$module"
          done
          python - <<'PY'
          from qore.infrastructure.trader_lab import capitalizer_v50_cognitive_geometry_economics as replay
          from qore.infrastructure.trader_lab import capitalizer_v50_g_causal_decision_trace as trace
          assert 'trace_output' in replay.build_market.__code__.co_varnames
          assert trace.TRACE_IDENTITY == "QORE_SCALPER_V50_G_CAUSAL_TRACE_V1"
          print("Pinned A1 trace bridge only; A2's causal V49 source retained")
          PY
      - name: Download unexpired provider-native M1 historical evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Verify market data provenance and nine-market identity
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          m = json.loads(Path("m1-source/m1-clone-manifest.json").read_text())
          assert m["canonical_symbol"] == os.environ["EXPECTED_SYMBOL"]
          assert m["provider_native_m1"] is True
          assert m["synthetic_m1"] is False
          assert m["interpolated_m1"] is False
          assert m["contradictory_m1"] == 0
          assert m["read_only"] is True
          PY
      - name: Rebuild causal V49 source opportunity census
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_high_frequency_capacity_census_v49 \
            market m1-source v49-output --session "${{ matrix.session }}"
      - name: Replay historical V50-G with A1 honest per-source trace
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v50_cognitive_geometry_economics \
            market v49-output m1-source v50-output
      - name: Fail on missing source opportunities or cognition trace parity
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
          EXPECTED_SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          symbol = os.environ["EXPECTED_SYMBOL"].lower()
          capacity = json.loads(
              (Path("v49-output") / f"capitalizer-{symbol}-v49-hf-capacity.json").read_text()
          )
          report = json.loads(
              (Path("v50-output") / f"capitalizer-{symbol}-v50-g-report.json").read_text()
          )
          trace_file = Path("v50-output/capitalizer-v50-g-cognitive-trace.jsonl")
          trace_count = sum(bool(line.strip()) for line in trace_file.open(encoding="utf-8"))
          assert report["symbol"] == os.environ["EXPECTED_SYMBOL"]
          assert report["session"] == os.environ["EXPECTED_SESSION"]
          assert capacity["source_complete_opportunities"] == report["source_opportunities"]
          assert report["cognitive_trace_rows"] == trace_count
          assert report["cognitive_trace_rows"] == report["source_opportunities"]
          assert report["cognitive_coverage"] == "PARTIAL_V50_BRIDGE_ONLY"
          assert report["master_frame_evaluated"] is False
          assert report["outcome_used_for_admission"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          PY
      - name: Upload paired V49 plus V50-G raw causal research output
        uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-paired-${{ matrix.symbol }}-${{ github.sha }}
          path: |
            v49-output/
            v50-output/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download every paired market output at identical source HEAD
        uses: actions/download-artifact@v4
        with:
          pattern: scalper-a2-paired-*-${{ github.sha }}
          path: market-artifacts
          merge-multiple: false
      - name: Fail-closed nine-market V49-V50-G matched-source waterfall
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_v49_v50_g_waterfall_v1 \
            market-artifacts market-artifacts waterfall-output --expected-markets 9
      - name: Compute historical V50-G research-only economic matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v50_cognitive_geometry_economics \
            matrix market-artifacts matrix-output
      - name: Verify full source density denominators and zero certification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("waterfall-output/scalper-v49-v50-g-waterfall.json").read_text())
          e = json.loads(Path("matrix-output/capitalizer-v50-g-matrix.json").read_text())
          assert d["source_market_count"] == d["market_coverage_required"] == 9
          assert d["all_markets_trace_covered"] is True
          assert d["a1_trace_rows"] == d["source_opportunities_total"]
          assert d["no_new_replay_executed"] is True  # auditor is reader, replay job ran
          assert d["trader_certified"] is False and not d["live_authorized"]
          assert e["trader_certified"] is False and not e["live_authorized"]
          print("V49 SOURCE OPPORTUNITIES", d["source_opportunities_total"])
          print("V50-G PRE MAX3", d["policy_rows_before_max3"])
          print("V50-G POST MAX3", d["policy_rows_after_max3"])
          for name, row in e["policies"].items():
              print("POLICY", name, "GROSS", row["gross"])
          PY
      - name: Upload complete causal waterfall and unpromoted economics
        uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-v49-v50g-nine-market-research-${{ github.sha }}
          path: |
            waterfall-output/
            matrix-output/
          if-no-files-found: error
          retention-days: 90
