name: QORE Alpha2 ONE FX28 BIS official policy carry 2016-2024 exploratory
on:
  push:
    branches: ['research/qore-alpha2-original-intermarket-propagation-20261012']
    paths:
      - '.github/workflows/qore-alpha2-fx28-bis-policy-carry-one-economic-test.yml'
      - 'src/qore/research/alpha2_fx28_bis_policy_carry.py'
      - 'tests/research/test_alpha2_fx28_bis_policy_carry.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  frozen_prereg_and_causal_synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install -e . 'pytest>=8,<9' 'ruff>=0.5,<1'
      - name: Pre-outcome prereg ancestor, source gate and synthetic economic accounting
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e669a1d2100f94a0c17e3773b177a3ead3661e16 "$GITHUB_SHA"
          test -s docs/research/QORE_ALPHA2_FX28_POLICY_CARRY_SINGLE_PREREG_2026-10-12.md
          ruff check src/qore/research/alpha2_fx28_bis_policy_carry.py tests/research/test_alpha2_fx28_bis_policy_carry.py
          pytest -q -o addopts='' tests/research/test_alpha2_fx28_bis_policy_carry.py
  bis_policy_and_verified_fx28_ephemeral:
    needs: frozen_prereg_and_causal_synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: mezas3238-hue/qore-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install -e .
      - name: Read BIS official public rate release locally, never upload rate history
        run: |
          set -euo pipefail
          mkdir -p bis-private
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 240 \
            --user-agent 'QORE-Alpha2-ReadOnly-Research/1.0' \
            https://data.bis.org/static/bulk/WS_CBPOL_csv_flat.zip \
            --output bis-private/WS_CBPOL_csv_flat.zip
          sha256sum bis-private/WS_CBPOL_csv_flat.zip
      - name: Original frozen 33 SHA roster and 12 cohort manifest, no M5 price read yet
        run: |
          set -euo pipefail
          gh run download 38207337960 --repo "$GH_REPO" \
            --name qore-native-final33-source-manifest-dba0e0c3b61e430d3ed51abab562ebd92060a0ff --dir signed33
          gh run download 35166210458 --repo "$GH_REPO" \
            --name qore-cibo-market-atlas-10y-windowed-aggregate-ab782b8e9f890f86a2b6500070f0556b4b685e3d --dir atlas-aggregate
      - name: Seven original Atlas FX symbols SHA-gated, daily OHLC ephemeral only
        run: |
          set -euo pipefail
          mkdir -p original28 ephemeral28
          for s in AUDJPY AUDUSD EURUSD GBPJPY GBPUSD USDCAD USDJPY
          do
            gh run download 35166210458 --repo "$GH_REPO" \
              --name "qore-cibo-market-atlas-10y-windowed-$s-ab782b8e9f890f86a2b6500070f0556b4b685e3d" --dir "original28/$s"
            python -m qore.research.alpha2_xsrev5_common_calendar extract "$s" "original28/$s" signed33 ephemeral28 --aggregate12 atlas-aggregate
            rm -rf "original28/$s"
          done
      - name: Twenty one original ICMarkets FX symbols SHA-gated, no aliases
        run: |
          set -euo pipefail
          for s in USDCHF NZDUSD EURGBP EURJPY EURCHF EURCAD EURAUD EURNZD GBPCHF GBPCAD GBPAUD GBPNZD AUDCAD AUDCHF AUDNZD CADJPY CADCHF CHFJPY NZDJPY NZDCAD NZDCHF
          do
            gh run download 38193802541 --repo "$GH_REPO" \
              --name "qore-native-icmarkets-10Y-provider-M5-$s-e0ca5a13c866a19d8505c68cffc473598984b340" --dir "original28/$s"
            python -m qore.research.alpha2_xsrev5_common_calendar extract "$s" "original28/$s" signed33 ephemeral28
            rm -rf "original28/$s"
          done
      - name: ONE freeze 28 FX monthly spot plus policy proxy economic test
        run: |
          set -euo pipefail
          python -m qore.research.alpha2_fx28_bis_policy_carry \
            bis-private/WS_CBPOL_csv_flat.zip ephemeral28 policy-panel
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path("policy-panel/alpha2-FX28-policy-rate-carry-monthly-one-model-cost-proxy.json")
          x=json.loads(f.read_text())
          assert len(x["28_fx_exact_roster"])==28
          assert len(x["bis_rate_source_proof"]["coverage"])==8
          assert len(x["original28_SHA_verified_daily_census"])==28
          assert x["source_factor_BIS_monthly_EOP_with_15day_publag_not_true_vintage"] is True
          assert x["policy_accrual_is_hypothetical_NOT_realized_swap"] is True
          assert x["account_NET_computed"] is False and x["UTC001_certified"] is False
          assert x["orders"]==0
          assert x["status"] in {
              "POLICY28_NOT_IDENTIFIABLE_MISSING_RATES_OR_PRICE",
              "POLICY28_UNDERPOWERED",
              "POLICY28_PREDECLARED_MODEL_SCREEN_FAILED_STOP",
              "POLICY28_EXPLORATORY_MODEL_PASS_REQUIRES_FRESH_OOS_AND_EXECUTION",
          }
          for r in x["weekly_monthly"]:
              assert len(r["long6"])==len(r["short6"])==6
              assert not set(r["long6"])&set(r["short6"])
              assert r["assumed_2bps_each_side_portfolio_bps"]==4.0
          PY
          printf '%s\n' "$GITHUB_SHA" > policy-panel/exact-code-head-sha.txt
          (cd policy-panel && sha256sum *.json exact-code-head-sha.txt > OUTPUT_SHA256SUMS.txt)
          rm -rf bis-private original28 ephemeral28 signed33 atlas-aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: alpha2-FX28-BIS-POLICY-ONE-EXPLORATORY-AGG-${{ github.sha }}
          path: policy-panel/
          retention-days: 90
          if-no-files-found: error
