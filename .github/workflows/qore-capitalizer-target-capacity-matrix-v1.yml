              ).read_text()
          )
          assert flow['identity'] == (
              'QORE_CAPITALIZER_PORTFOLIO_SESSION_FLOW_VIABILITY_V1'
          )
          assert flow['market_count'] == 9
          assert flow['complete_frozen_universe'] is True
          assert flow['max_executions_per_session'] == 3
