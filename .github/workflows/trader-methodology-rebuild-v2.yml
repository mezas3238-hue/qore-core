name: QORE Trader Methodology Rebuild V2

on:
  push:
    branches:
      - agent/trader-methodology-rebuild-v2-001

concurrency:
  group: qore-trader-methodology-rebuild-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
  QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}
  QORE_DEMO_LAB_SYMBOL: NAS100
  QORE_DEMO_LAB_LOOKBACK_DAYS: "760"
  QORE_SOFTWARE_SHA: ${{ github.sha }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact V2 head
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install quality runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src tests
      - name: Pytest full quality gate
        run: pytest --cov=src/qore --cov-report=term-missing

  vt31-v2-research:
    if: contains(github.event.head_commit.message, 'run-vt31-research')
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout exact V2 head
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QORE and cTrader runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ctrader]"
      - name: Verify required DEMO inputs without printing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            QORE_CTRADER_CLIENT_ID \
            QORE_CTRADER_CLIENT_SECRET \
            QORE_CTRADER_ACCESS_TOKEN \
            QORE_CTRADER_REFRESH_TOKEN
          do
            if [ -z "${!name:-}" ]; then
              echo "missing required DEMO runtime input: ${name}" >&2
              exit 2
            fi
          done
      - name: Discover the single authorized DEMO account when not configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            if ! [[ "$account_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "cTrader DEMO account discovery returned an invalid id" >&2
              exit 3
            fi
            echo "::add-mask::$account_id"
            printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          fi
      - name: Collect two-year NAS100 M1 source evidence
        run: |
          mkdir -p artifacts/vt31-silver-bullet-v2/NAS100
          python -m qore.infrastructure.ctrader_demo_lab_vt31_v2_probe \
            > artifacts/vt31-silver-bullet-v2/NAS100/market-evidence.json
      - name: Run source-bound VT-31 V2 backtest
        run: |
          python -m qore.infrastructure.trader_lab.vt31_silver_bullet_v2_backtest \
            artifacts/vt31-silver-bullet-v2/NAS100/market-evidence.json \
            > artifacts/vt31-silver-bullet-v2/NAS100/backtest.json
          printf '%s\n' "$GITHUB_SHA" \
            > artifacts/vt31-silver-bullet-v2/NAS100/git-sha.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              Path(
                  "artifacts/vt31-silver-bullet-v2/NAS100/backtest.json"
              ).read_text()
          )
          assert result["schema"] == "qore.trader_lab.vt31_silver_bullet_v2_backtest.v1"
          assert result["environment"] == "demo"
          assert result["read_only"] is True
          assert result["research_only"] is True
          assert result["symbol"] == "NAS100"
          assert result["decision_timeframe"] == "M1"
          assert result["software_sha"] == os.environ["GITHUB_SHA"]
          assert len(result["market_matrix"]) == 11
          assert sum(
              item["status"] == "source-authorized"
              for item in result["market_matrix"]
          ) == 1
          PY
      - name: Upload sanitized VT-31 V2 research evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-silver-bullet-v2-${{ github.sha }}
          path: artifacts/vt31-silver-bullet-v2
          if-no-files-found: error
          retention-days: 30
