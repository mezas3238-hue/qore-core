name: QORE Shared STI6 V2 Trajectory Acceleration

concurrency:
  group: qore-shared-sti6-v2-trajectory-acceleration
  cancel-in-progress: true

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - docs/shared/evidence/QORE_SHARED_STI6_V2_TRAJECTORY_ACCELERATION_PREREGISTRATION_001.json
      - src/qore/infrastructure/core_stack_v2/shared_continuation_positive_tail_v2.py
      - tests/infrastructure/test_core_stack_v2_shared_continuation_positive_tail_v2.py
      - scripts/shared_sti6_v2_trajectory_acceleration.py
      - .github/workflows/qore-shared-sti6-v2-trajectory-acceleration.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  causal-r6:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Shared
        run: pip install -e ".[dev]"

      - name: Validate STI-6 V2 and preregistration
        run: |
          set -euo pipefail
          mkdir -p result input/pure input/r8 input/r6
          ruff check             src/qore/infrastructure/core_stack_v2/shared_continuation_positive_tail_v2.py             tests/infrastructure/test_core_stack_v2_shared_continuation_positive_tail_v2.py             scripts/shared_sti6_v2_trajectory_acceleration.py
          mypy             src/qore/infrastructure/core_stack_v2/shared_continuation_positive_tail_v2.py
          python -m py_compile             src/qore/infrastructure/core_stack_v2/shared_continuation_positive_tail_v2.py             scripts/shared_sti6_v2_trajectory_acceleration.py
          pytest -q             tests/infrastructure/test_core_stack_v2_shared_continuation_positive_tail_v2.py             --junitxml=result/junit.xml

          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(
              Path(
                  "docs/shared/evidence/"
                  "QORE_SHARED_STI6_V2_TRAJECTORY_ACCELERATION_PREREGISTRATION_001.json"
              ).read_text()
          )
          assert p["status"] == "PREREGISTERED_RESEARCH_ONLY"
          assert p["parent_v1"]["disposition"] == "STI6_V1_FALSIFIED_ON_CONSUMED_R6"
          assert p["parent_v1"]["threshold_rescue_allowed"] is False
          assert p["parent_v1"]["r5_opened_by_failure_diagnostic"] is False
          assert p["calibration"]["partition"] == "R8_SOURCE_ONLY"
          assert p["calibration"]["terminal_outcomes_allowed"] is False
          assert p["first_validation"]["partition"] == "R6_CONSUMED"
          assert p["first_validation"]["r5_opening_authorized_before_r6_pass"] is False
          assert p["governance"]["r5_opened"] is False
          assert p["governance"]["protected_certification_holdout_opened"] is False
          PY

      - name: Recover immutable R8 and R6 evidence
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10799064861/zip" > pure.zip
          unzip -q pure.zip -d input/pure
          (cd input/pure && sha256sum -c SHA256SUMS)
          test -f input/pure/r8.json
          test -f input/pure/r6.json

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10402199719/zip" > r8.zip
          unzip -q r8.zip -d input/r8
          (cd input/r8 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10389112524/zip" > r6.zip
          unzip -q r6.zip -d input/r6
          (cd input/r6 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

      - name: Execute source-only R8 freeze and consumed-R6 V2
        run: |
          set -euo pipefail
          python scripts/shared_sti6_v2_trajectory_acceleration.py             --r8-trades input/pure/r8.json             --r8-nas input/r8/fresh/NAS100/market-evidence.json             --r8-sp input/r8/fresh/SP500/market-evidence.json             --r8-us input/r8/fresh/US30/market-evidence.json             --r6-trades input/pure/r6.json             --r6-nas input/r6/fresh/NAS100/market-evidence.json             --r6-sp input/r6/fresh/SP500/market-evidence.json             --r6-us input/r6/fresh/US30/market-evidence.json             --output result/sti6-v2-trajectory-acceleration.json             | tee result/summary.json

      - name: Validate scientific disposition without forcing PASS
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/sti6-v2-trajectory-acceleration.json").read_text())
          assert p["scientific_status"] in {
              "STI6_V2_SIGNAL_VALUE_DEMONSTRATED_R6",
              "STI6_V2_FALSIFIED_ON_CONSUMED_R6",
          }
          assert p["hypothesis"] == (
              "TRAJECTORY_ACCELERATION_LOCAL_EXPANSION_WITH_FAILURE_VETO"
          )
          assert p["calibration"]["future_market_used_for_freeze"] is False
          assert p["calibration"]["terminal_outcome_used_for_freeze"] is False
          assert p["calibration"]["pnl_used_for_freeze"] is False
          assert p["r6"]["trade_count"] > 0
          assert p["r6"]["source_observation_count"] > 0
          g=p["governance"]
          assert g["v1_threshold_rescue_used"] is False
          assert g["r8_source_only_calibration"] is True
          assert g["r6_threshold_fit"] is False
          assert g["r5_opened"] is False
          assert g["future_market_used_for_inference"] is False
          assert g["terminal_outcome_used_only_after_source_materialization"] is True
          assert g["protected_certification_holdout_opened"] is False
          assert g["productive_authority"] is False
          PY

      - name: Bind evidence
        run: |
          set -euo pipefail
          printf '%s\n' "${GITHUB_SHA}" > result/code-git-sha.txt
          cp             docs/shared/evidence/QORE_SHARED_STI6_V2_TRAJECTORY_ACCELERATION_PREREGISTRATION_001.json             result/preregistration.json
          (
            cd result
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0               | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-sti6-v2-trajectory-acceleration-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Report STI-6 V2
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p=json.loads(Path("result/sti6-v2-trajectory-acceleration.json").read_text())
          r=p["r6"]
          body="\n".join([
              "## Shared STI-6 — Trajectory Acceleration V2",
              "",
              f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- disposition: **{p['scientific_status']}**",
              "- V1 threshold rescue used: **False**",
              "- R8 source-only calibration: **True**",
              "- R5 opened: **False**",
              f"- R6 trades / observations: **{r['trade_count']} / {r['source_observation_count']}**",
              f"- winner precision/recall: **{r['winner_precision_bps']}/{r['winner_recall_bps']} bps**",
              f"- tail precision/recall: **{r['positive_tail_precision_bps']}/{r['positive_tail_recall_bps']} bps**",
              f"- false continuation on nonwinners: **{r['false_continuation_on_nonwinners_bps']} bps**",
              f"- gate: **{r['gate_pass']}**",
              "- protected certification holdout opened: **False**",
              "- productive authority: **False**",
          ])+"\n"
          Path("result/issue-comment.md").write_text(body)
          PY
          gh issue comment 638 --body-file result/issue-comment.md
