name: QORE Shared WP05 Structural Frontier Survival V6

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - src/qore/infrastructure/core_stack_v2/temporal_hierarchy_structural_frontier_v6.py
      - tests/infrastructure/test_core_stack_v2_temporal_hierarchy_structural_frontier_v6.py
      - tests/infrastructure/test_core_stack_v2_temporal_hierarchy_target_contract.py
      - tests/infrastructure/test_shared_wp05_structural_failure_target_v2.py
      - scripts/shared_wp05_structural_frontier_survival_v6.py
      - scripts/shared_wp05_structural_failure_target_v2.py
      - .github/workflows/qore-shared-wp05-structural-frontier-survival-v6.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  structural-frontier-survival-v6:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Announce WP05 V6 consumed structural-frontier run
        run: |
          gh issue comment 643 --body "WP-05 V6 structural-frontier survival run started — Git SHA \`${GITHUB_SHA}\`, run \`${GITHUB_RUN_ID}\`. Target=HIGHER_TIMEFRAME_STRUCTURAL_FAILURE_V2. R8 chronological discovery/calibration only; R6/R5 consumed falsification only; fresh holdout remains closed. Gate unchanged: >=20% false-declaration reduction + >=95% terminal preservation on BOTH R6/R5."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Shared
        run: pip install -e ".[dev]"

      - name: Static and adversarial validation
        run: |
          ruff check \
            src/qore/infrastructure/core_stack_v2/temporal_hierarchy_structural_frontier_v6.py \
            tests/infrastructure/test_core_stack_v2_temporal_hierarchy_structural_frontier_v6.py \
            scripts/shared_wp05_structural_frontier_survival_v6.py
          python -m py_compile \
            src/qore/infrastructure/core_stack_v2/temporal_hierarchy_structural_frontier_v6.py \
            scripts/shared_wp05_structural_frontier_survival_v6.py
          pytest -q \
            tests/infrastructure/test_core_stack_v2_temporal_hierarchy_structural_frontier_v6.py \
            tests/infrastructure/test_core_stack_v2_temporal_hierarchy_target_contract.py \
            tests/infrastructure/test_shared_wp05_structural_failure_target_v2.py

      - name: Recover immutable consumed R8 R6 R5 market evidence
        run: |
          set -euo pipefail
          mkdir -p input/r8 input/r6 input/r5 result

          download_artifact() {
            local artifact_id="$1"
            local output="$2"
            local tmp="${output}.tmp"
            rm -f "$tmp"
            for attempt in 1 2 3 4; do
              if gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$tmp"; then
                mv "$tmp" "$output"
                return 0
              fi
              rm -f "$tmp"
              sleep $((attempt * 30))
            done
            return 1
          }

          download_artifact 10402199719 r8.zip
          unzip -q r8.zip -d input/r8
          (cd input/r8 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

          download_artifact 10389112524 r6.zip
          unzip -q r6.zip -d input/r6
          (cd input/r6 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

          download_artifact 10380044761 r5.zip
          unzip -q r5.zip -d input/r5
          (cd input/r5 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

      - name: Run WP05 V6 consumed structural-frontier falsification
        run: |
          python scripts/shared_wp05_structural_frontier_survival_v6.py \
            --r8-nas input/r8/fresh/NAS100/market-evidence.json \
            --r8-sp input/r8/fresh/SP500/market-evidence.json \
            --r8-us input/r8/fresh/US30/market-evidence.json \
            --r6-nas input/r6/fresh/NAS100/market-evidence.json \
            --r6-sp input/r6/fresh/SP500/market-evidence.json \
            --r6-us input/r6/fresh/US30/market-evidence.json \
            --r5-nas input/r5/fresh/NAS100/market-evidence.json \
            --r5-sp input/r5/fresh/SP500/market-evidence.json \
            --r5-us input/r5/fresh/US30/market-evidence.json \
            --output result/wp05-structural-frontier-survival-v6.json \
            | tee result/summary.json

      - name: Validate WP05 V6 scientific protocol
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(
              Path("result/wp05-structural-frontier-survival-v6.json").read_text()
          )
          assert p["protocol_pass"] is True
          assert p["fresh_holdout_opened"] is False
          assert p["wp05_exit_gate_pass"] is False
          assert p["target_contract"] == "HIGHER_TIMEFRAME_STRUCTURAL_FAILURE_V2"
          assert p["status"] in {
              "WP05_V6_STRUCTURAL_FRONTIER_FROZEN_FOR_FRESH_HOLDOUT",
              "WP05_V6_STRUCTURAL_FRONTIER_FALSIFIED",
          }
          m=p["model"]
          assert m["fit_partition"] == "r8"
          assert m["representation"] == "STRUCTURAL_FRONTIER_SURVIVAL_V1"
          assert m["calibration_terminal_preservation_bps"] >= 9800
          assert m["feature_count"] >= 20
          assert len(m["fingerprint_sha256"]) == 64
          assert len(m["feature_centers_micros"]) == m["feature_count"]
          assert len(m["feature_scales_micros"]) == m["feature_count"]
          assert len(m["coefficients_micros"]) == m["feature_count"]
          gate=p["frozen_development_gate"]
          assert gate["minimum_false_declaration_reduction_bps"] == 2000
          assert gate["minimum_terminal_detection_preservation_bps"] == 9500
          assert gate["must_pass_partitions"] == ["r6","r5"]
          for partition in ("r8","r6","r5"):
              r=p["partition_ranges"][partition]
              assert r["episode_count"] >= 6000
              assert r["target_unidentifiable_anchor_count"] >= 0
              assert r["frontier_unidentifiable_anchor_count"] >= 0
              assert (
                  r["frontier_unidentifiable_anchor_count"]
                  <= r["target_unidentifiable_anchor_count"]
              )
          g=p["governance"]
          assert g["target_v2_required"] is True
          assert g["frontier_matches_target_coordinate_system"] is True
          assert g["source_time_frontier_only"] is True
          assert g["unidentifiable_higher_anchor_abstains"] is True
          assert g["r8_chronological_discovery_calibration_only"] is True
          assert g["r6_refit"] is False
          assert g["r5_refit"] is False
          assert g["r6_threshold_retuning"] is False
          assert g["r5_threshold_retuning"] is False
          assert g["runtime_future_market_used"] is False
          assert g["trade_pnl_used"] is False
          assert g["trader_identity_feature_used"] is False
          assert g["symbol_identity_feature_used"] is False
          assert g["fresh_holdout_opened"] is False
          assert g["knowledge_auto_promotion"] is False
          assert g["shared_methodology_authority"] is False
          assert g["shared_sizing_authority"] is False
          assert g["shared_risk_authority"] is False
          assert g["shared_order_authority"] is False
          assert g["shared_execution_authority"] is False
          assert g["live_authorized"] is False
          assert g["production_authorized"] is False
          assert g["real_capital_authorized"] is False
          assert g["merge_authorized"] is False
          PY

      - name: Bind result
        run: |
          echo "${GITHUB_SHA}" > result/git-sha.txt
          (
            cd result
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-wp05-structural-frontier-survival-v6-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Report WP05 V6 result
        if: always()
        run: |
          if [ ! -f result/wp05-structural-frontier-survival-v6.json ]; then
            gh issue comment 643 --body "WP-05 V6 run \`${GITHUB_RUN_ID}\` produced no scientific payload. Fresh holdout remains closed; inspect technical failure."
            exit 0
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path

          p=json.loads(
              Path("result/wp05-structural-frontier-survival-v6.json").read_text()
          )
          m=p["model"]
          lines=[
              "## WP-05 V6 structural-frontier survival result",
              "",
              f"- Git SHA: \`{os.environ['GITHUB_SHA']}\`",
              f"- GitHub Actions run: \`{os.environ['GITHUB_RUN_ID']}\`",
              f"- status: **{p['status']}**",
              f"- protocol_pass: **{p['protocol_pass']}**",
              f"- development_gate_pass: **{p['development_gate_pass']}**",
              "- target: **HIGHER_TIMEFRAME_STRUCTURAL_FAILURE_V2**",
              "- representation: **source-time structural frontier + approach/rejection + cross-market + hierarchy survival**",
              f"- feature count: **{m['feature_count']}**",
              f"- frozen model fingerprint: \`{m['fingerprint_sha256']}\`",
              f"- R8 calibration false reduction: **{m['calibration_false_reduction_bps']} bps**",
              f"- R8 calibration terminal preservation: **{m['calibration_terminal_preservation_bps']} bps**",
              "- frozen gate unchanged: **>=20% false-declaration reduction + >=95% terminal preservation on BOTH R6/R5**",
              "- fresh holdout opened: **False**",
              "",
              "Partition results:",
          ]
          for partition in ("r8","r6","r5"):
              e=p["evaluations"][partition]
              r=p["partition_ranges"][partition]
              lines.append(
                  f"- {partition.upper()}: baseline false={e['baseline_false_declaration_count']}, terminals={e['baseline_terminal_count']}; hierarchy false={e['hierarchy_false_declaration_count']}, missed terminals={e['hierarchy_missed_terminal_count']}; false reduction={e['false_declaration_reduction_bps']} bps; terminal preservation={e['terminal_detection_preservation_bps']} bps; target-unidentifiable={r['target_unidentifiable_anchor_count']}; frontier-abstained={r['frontier_unidentifiable_anchor_count']}"
              )
          if p["development_gate_pass"]:
              lines.append(
                  "V6 survives consumed development. Next legal step: freeze the exact model fingerprint and preregister a new independent WP-05 holdout before acquisition."
              )
          else:
              lines.append(
                  "V6 is falsified on consumed development. Do not open fresh evidence or weaken the gate; use the result for the next structural hypothesis."
              )
          Path("result/wp05-v6-issue-update.md").write_text("\n".join(lines)+"\n")
          PY
          gh issue comment 643 --body-file result/wp05-v6-issue-update.md
