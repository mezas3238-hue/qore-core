name: QORE CIBO Post-Repair 3x1Y Integrated Replay

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cibo-capital-efficiency-sizing-lab-001
    paths:
      - '.github/workflows/cibo-trader-lab-3x1y-integrated-cibo.yml'
      - 'scripts/cibo_maximum_capability_frontier.py'
      - 'scripts/cibo_enrich_single_account_vt31_native_perception.py'
      - 'scripts/cibo_single_account_native_perception_audit.py'
      - 'src/qore/infrastructure/cibo_maximum_capability_frontier.py'
      - 'scripts/cibo_single_account_historical_ceiling_replay.py'
      - 'src/qore/infrastructure/cibo_single_account_historical_ceiling_state.py'
      - 'src/qore/infrastructure/cibo_single_account_historical_ceiling_epoch.py'
      - 'src/qore/infrastructure/cibo_single_account_sovereign_ceiling_executor.py'
      - 'src/qore/infrastructure/cibo_single_account_historical_ceiling_replay.py'
      - 'src/qore/infrastructure/cibo_sovereign_capital_runtime.py'
      - 'tests/infrastructure/test_cibo_single_account_historical_ceiling_state.py'
      - 'tests/infrastructure/test_cibo_single_account_historical_ceiling_epoch.py'
      - 'tests/infrastructure/test_cibo_single_account_sovereign_ceiling_executor.py'
      - 'src/qore/infrastructure/cibo_position_lifecycle.py'
      - 'src/qore/infrastructure/cibo_profitability_lab_function_runtime.py'
      - 'src/qore/infrastructure/cibo_capital_science_runtime_bridge.py'
      - 'src/qore/infrastructure/cibo_crisis_capital_intelligence.py'
      - 'src/qore/infrastructure/traders/vt31_nas100_native_perception.py'
      - 'tests/infrastructure/test_cibo_capital_science_runtime_bridge.py'
      - 'tests/infrastructure/test_cibo_reused_holdout_compound_portfolio_lane_alignment.py'
      - 'tests/infrastructure/test_cibo_crisis_capital_intelligence.py'
      - 'tests/infrastructure/test_cibo_maximum_capability_frontier.py'
      - 'tests/infrastructure/test_cibo_vt31_native_perception_contract.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-cibo-post-repair-3x1y-${{ github.sha }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONPATH: ${{ github.workspace }}
  ASSEMBLY_ARTIFACT_ID: '11281285816'
  ASSEMBLY_ARTIFACT_DIGEST: 'sha256:1ce78890e4f255cf68ce327d53029db5a34ea464b16df7e75228a8ac0a7dde9e'
  ATLAS_RUN_ID: '35166210458'
  ATLAS_SHA: 'ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  REPLAY_STARTED_AT: '2026-10-03T18:15:00+00:00'
  VT08_3X1Y_ARTIFACT_ID: '11281150915'
  VT08_3X1Y_ARTIFACT_DIGEST: 'sha256:57975822953a2781fb39a6af882a5b72ef71e8ca0eea515ce5dcc32b59d1dfc5'
  VT31_R6_ARTIFACT_ID: '10389112524'
  VT31_R5_ARTIFACT_ID: '10380044761'

jobs:
  integrated-cibo:
    name: integrated-cibo-${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        group:
          - GROUP_1
          - GROUP_2
          - GROUP_3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install -e '.[dev]'

      - name: Validate integrated replay code
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/cibo_t02_three_lane_capital_lab_arch2.py \
            scripts/cibo_three_holdout_group_report.py \
            scripts/cibo_maximum_capability_frontier.py \
            scripts/cibo_function_io_actuation_report.py \
            scripts/cibo_function_utilization_sensor.py \
            scripts/cibo_enrich_single_account_vt31_native_perception.py \
            scripts/cibo_single_account_native_perception_audit.py \
            src/qore/infrastructure/cibo_ce2i_full_surface.py \
            src/qore/infrastructure/cibo_ce2i_advanced_capital_tools.py \
            src/qore/infrastructure/cibo_ce2i_regime_selector.py \
            src/qore/infrastructure/cibo_ce2i_optionality.py \
            src/qore/infrastructure/cibo_crisis_capital_intelligence.py \
            src/qore/infrastructure/traders/vt31_nas100_native_perception.py \
            src/qore/infrastructure/cibo_ce2i_phase20_robust_allocator.py \
            src/qore/infrastructure/cibo_ce2i_runtime_receipt.py \
            src/qore/infrastructure/cibo_ce2i_full_surface.py \
            src/qore/infrastructure/cibo_ce2i_advanced_capital_tools.py \
            src/qore/infrastructure/cibo_ce2i_phase20_robust_allocator.py \
            src/qore/infrastructure/cibo_ce2i_runtime_receipt.py \
            src/qore/infrastructure/cibo_phase22_v4_chronological_execution.py \
            src/qore/infrastructure/cibo_phase22_v4_historical_policy_replay.py \
            src/qore/infrastructure/cibo_phase22_v4_historical_replay_sealing.py \
            src/qore/infrastructure/cibo_profitability_lab_economic_consultation.py \
            src/qore/infrastructure/cibo_profitability_lab_function_runtime.py \
            src/qore/infrastructure/cibo/quantitative_intelligence.py \
            src/qore/infrastructure/cibo/quantitative_intelligence.py \
            src/qore/infrastructure/cibo_profitability_lab_context_quality.py \
            src/qore/infrastructure/cibo_profitability_lab_decision_trace.py \
            src/qore/infrastructure/cibo_capital_science_runtime_bridge.py \
            src/qore/infrastructure/cibo_reused_holdout_compound_portfolio_lane.py \
            src/qore/infrastructure/cibo_capital_management_authority.py \
            src/qore/infrastructure/cibo_capital_management_authority.py \
            src/qore/infrastructure/cibo_universal_capital_science_registry.py \
            src/qore/infrastructure/cibo_maximum_capability_frontier.py \
            scripts/cibo_single_account_historical_ceiling_replay.py \
            src/qore/infrastructure/cibo_single_account_historical_ceiling_state.py \
            src/qore/infrastructure/cibo_single_account_historical_ceiling_epoch.py \
            src/qore/infrastructure/cibo_single_account_sovereign_ceiling_executor.py \
            src/qore/infrastructure/cibo_single_account_historical_ceiling_replay.py \
            src/qore/infrastructure/cibo_sovereign_capital_runtime.py
          ruff check \
            scripts/cibo_t02_three_lane_capital_lab_arch2.py \
            scripts/cibo_three_holdout_group_report.py \
            scripts/cibo_maximum_capability_frontier.py \
            scripts/cibo_function_io_actuation_report.py \
            scripts/cibo_function_utilization_sensor.py \
            src/qore/infrastructure/cibo_phase22_v4_chronological_execution.py \
            src/qore/infrastructure/cibo_phase22_v4_historical_policy_replay.py \
            src/qore/infrastructure/cibo_phase22_v4_historical_replay_sealing.py \
            src/qore/infrastructure/cibo_profitability_lab_economic_consultation.py \
            src/qore/infrastructure/cibo_profitability_lab_function_runtime.py \
            src/qore/infrastructure/cibo/quantitative_intelligence.py \
            src/qore/infrastructure/cibo/quantitative_intelligence.py \
            src/qore/infrastructure/cibo_profitability_lab_context_quality.py \
            src/qore/infrastructure/cibo_profitability_lab_decision_trace.py \
            src/qore/infrastructure/cibo_ce2i_regime_selector.py \
            src/qore/infrastructure/cibo_ce2i_optionality.py \
            src/qore/infrastructure/cibo_crisis_capital_intelligence.py \
            src/qore/infrastructure/cibo_capital_science_runtime_bridge.py \
            src/qore/infrastructure/cibo_reused_holdout_compound_portfolio_lane.py \
            src/qore/infrastructure/cibo_universal_capital_science_registry.py \
            src/qore/infrastructure/cibo_maximum_capability_frontier.py \
            tests/infrastructure/test_cibo_phase22_v4_t02_volume_alignment.py \
            tests/infrastructure/test_cibo_maximum_capability_frontier.py \
            tests/infrastructure/test_cibo_universal_capital_science_registry.py \
            tests/infrastructure/test_cibo_capital_science_runtime_bridge.py \
            tests/infrastructure/test_cibo_reused_holdout_compound_portfolio_lane_alignment.py \
            tests/infrastructure/test_cibo_capital_management_authority.py \
            tests/infrastructure/test_cibo_profitability_lab_economic_consultation.py \
            tests/infrastructure/test_cibo_profitability_lab_function_runtime.py \
            tests/infrastructure/test_cibo/test_quantitative_intelligence.py \
            tests/infrastructure/test_cibo/test_quantitative_intelligence.py \
            tests/infrastructure/test_cibo_ce2i_full_surface.py \
            tests/infrastructure/test_cibo_ce2i_advanced_capital_tools.py \
            tests/infrastructure/test_cibo_ce2i_phase20_robust_allocator.py \
            tests/infrastructure/test_cibo_ce2i_regime_selector.py \
            tests/infrastructure/test_cibo_ce2i_optionality.py \
            tests/infrastructure/test_cibo_profitability_lab_context_quality.py \
            tests/infrastructure/test_cibo_vt31_native_perception_contract.py \
            scripts/cibo_single_account_historical_ceiling_replay.py \
            src/qore/infrastructure/cibo_single_account_historical_ceiling_state.py \
            src/qore/infrastructure/cibo_single_account_historical_ceiling_epoch.py \
            src/qore/infrastructure/cibo_single_account_sovereign_ceiling_executor.py \
            src/qore/infrastructure/cibo_single_account_historical_ceiling_replay.py \
            src/qore/infrastructure/cibo_sovereign_capital_runtime.py \
            tests/infrastructure/test_cibo_single_account_historical_ceiling_state.py \
            tests/infrastructure/test_cibo_single_account_historical_ceiling_epoch.py \
            tests/infrastructure/test_cibo_single_account_sovereign_ceiling_executor.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_phase22_v4_t02_volume_alignment.py \
            tests/infrastructure/test_cibo_maximum_capability_frontier.py \
            tests/infrastructure/test_cibo_universal_capital_science_registry.py \
            tests/infrastructure/test_cibo_capital_science_runtime_bridge.py \
            tests/infrastructure/test_cibo_reused_holdout_compound_portfolio_lane_alignment.py \
            tests/infrastructure/test_cibo_profitability_lab_economic_consultation.py \
            tests/infrastructure/test_cibo_profitability_lab_function_runtime.py \
            tests/infrastructure/test_cibo/test_quantitative_intelligence.py \
            tests/infrastructure/test_cibo/test_quantitative_intelligence.py \
            tests/infrastructure/test_cibo_ce2i_full_surface.py \
            tests/infrastructure/test_cibo_ce2i_advanced_capital_tools.py \
            tests/infrastructure/test_cibo_ce2i_phase20_robust_allocator.py \
            tests/infrastructure/test_cibo_ce2i_regime_selector.py \
            tests/infrastructure/test_cibo_ce2i_optionality.py \
            tests/infrastructure/test_cibo_profitability_lab_context_quality.py \
            tests/infrastructure/test_cibo_vt31_native_perception_contract.py \
            tests/infrastructure/test_cibo_single_account_historical_ceiling_state.py \
            tests/infrastructure/test_cibo_single_account_historical_ceiling_epoch.py \
            tests/infrastructure/test_cibo_single_account_sovereign_ceiling_executor.py

      - name: Recover immutable seven-Trader assembly
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assembly-root"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ASSEMBLY_ARTIFACT_ID" > "$RUNNER_TEMP/assembly.meta.json"
          jq -e --arg digest "$ASSEMBLY_ARTIFACT_DIGEST" '.expired == false and .digest == $digest' "$RUNNER_TEMP/assembly.meta.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ASSEMBLY_ARTIFACT_ID/zip" > "$RUNNER_TEMP/assembly.zip"
          echo "${ASSEMBLY_ARTIFACT_DIGEST#sha256:}  $RUNNER_TEMP/assembly.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/assembly.zip" -d "$RUNNER_TEMP/assembly-root"
          test -s "$RUNNER_TEMP/assembly-root/assembly/${{ matrix.group }}/seven-trader-cibo-batch.json"

      - name: Recover provider numeric model
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/provider"
          python - <<'PY' > "$RUNNER_TEMP/provider.env"
          from qore.infrastructure.cibo_phase22_provider_numeric_execution_receipt import PHASE22_PROVIDER_NUMERIC_EXECUTION_FREEZE_RECEIPT
          x=PHASE22_PROVIDER_NUMERIC_EXECUTION_FREEZE_RECEIPT
          print(f'PROVIDER_ARTIFACT_ID={x.artifact_id}')
          print(f'PROVIDER_FILE_SHA={x.provider_numeric_freeze_file_sha256}')
          PY
          source "$RUNNER_TEMP/provider.env"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PROVIDER_ARTIFACT_ID/zip" > "$RUNNER_TEMP/provider.zip"
          unzip -q "$RUNNER_TEMP/provider.zip" -d "$RUNNER_TEMP/provider"
          provider_json="$(find "$RUNNER_TEMP/provider" -name provider-numeric-execution-freeze.json -print -quit)"
          test -n "$provider_json"
          echo "PROVIDER_JSON=$provider_json" >> "$GITHUB_ENV"
          echo "PROVIDER_FILE_SHA=$PROVIDER_FILE_SHA" >> "$GITHUB_ENV"

      - name: Recover six Market Atlas 10Y capability corpora
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/regime"
          for symbol in AUDJPY EURUSD GBPJPY GBPUSD XAUUSD NAS100; do
            artifact="qore-cibo-market-atlas-10y-windowed-$symbol-$ATLAS_SHA"
            gh run download "$ATLAS_RUN_ID" \
              --name "$artifact" \
              --dir "$RUNNER_TEMP/regime/$symbol"
            test -s "$RUNNER_TEMP/regime/$symbol/symbol-consumption-manifest.json"
          done

      - name: Execute integrated seven-Trader CIBO holdout
        run: |
          set -euo pipefail
          group="${{ matrix.group }}"
          mkdir -p "$RUNNER_TEMP/results/$group/lab"
          python scripts/cibo_t02_three_lane_capital_lab_arch2.py \
            --batch "$RUNNER_TEMP/assembly-root/assembly/$group/seven-trader-cibo-batch.json" \
            --provider-numeric "$PROVIDER_JSON" \
            --provider-numeric-freeze-sha256 "$PROVIDER_FILE_SHA" \
            --source-root "AUDJPY=$RUNNER_TEMP/regime/AUDJPY" \
            --source-root "EURUSD=$RUNNER_TEMP/regime/EURUSD" \
            --source-root "GBPJPY=$RUNNER_TEMP/regime/GBPJPY" \
            --source-root "GBPUSD=$RUNNER_TEMP/regime/GBPUSD" \
            --source-root "XAUUSD=$RUNNER_TEMP/regime/XAUUSD" \
            --replay-started-at "$REPLAY_STARTED_AT" \
            --output-dir "$RUNNER_TEMP/results/$group/lab"
          python scripts/cibo_maximum_capability_frontier.py \
            --decision-trace "$RUNNER_TEMP/results/$group/lab/decision-trace.json" \
            --three-lane "$RUNNER_TEMP/results/$group/lab/three-lane-result.json" \
            --source-root "AUDJPY=$RUNNER_TEMP/regime/AUDJPY" \
            --source-root "EURUSD=$RUNNER_TEMP/regime/EURUSD" \
            --source-root "GBPJPY=$RUNNER_TEMP/regime/GBPJPY" \
            --source-root "GBPUSD=$RUNNER_TEMP/regime/GBPUSD" \
            --source-root "XAUUSD=$RUNNER_TEMP/regime/XAUUSD" \
            --source-root "NAS100=$RUNNER_TEMP/regime/NAS100" \
            --output "$RUNNER_TEMP/results/$group/lab/maximum-capability-frontier.json"
          python scripts/cibo_three_holdout_group_report.py \
            --three-lane "$RUNNER_TEMP/results/$group/lab/three-lane-result.json" \
            --maximum-capability "$RUNNER_TEMP/results/$group/lab/maximum-capability-frontier.json" \
            --output "$RUNNER_TEMP/results/$group/group-result.json"
          python scripts/cibo_function_io_actuation_report.py \
            --decision-trace "$RUNNER_TEMP/results/$group/lab/decision-trace.json" \
            --coverage "$RUNNER_TEMP/results/$group/lab/full-stack-coverage.json" \
            --capital-science-io "$RUNNER_TEMP/results/$group/lab/capital-science-per-call-io.json" \
            --three-lane "$RUNNER_TEMP/results/$group/lab/three-lane-result.json" \
            --group-result "$RUNNER_TEMP/results/$group/group-result.json" \
            --output "$RUNNER_TEMP/results/$group/lab/function-io-actuation.json"
          python scripts/cibo_function_utilization_sensor.py \
            --function-io "$RUNNER_TEMP/results/$group/lab/function-io-actuation.json" \
            --group-result "$RUNNER_TEMP/results/$group/group-result.json" \
            --output "$RUNNER_TEMP/results/$group/lab/function-utilization-sensor.json"
          python scripts/cibo_full_function_trader_lab_audit.py \
            --decision-trace "$RUNNER_TEMP/results/$group/lab/decision-trace.json" \
            --source-head "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/results/$group/lab/full-function-trader-lab-audit.json"

      - name: Enforce integrated group topology
        run: |
          set -euo pipefail
          group="${{ matrix.group }}"
          python - <<'PY'
          import json, os
          from pathlib import Path
          group=os.environ['MATRIX_GROUP']
          p=json.loads((Path(os.environ['RUNNER_TEMP'])/'results'/group/'group-result.json').read_text())
          assert p['group_id']==group
          assert p['execution_topology']=='SINGLE_INTEGRATED_7_TRADER_PORTFOLIO'
          assert p['shared_initial_capital_usd']=='60'
          assert p['shared_cibo_state'] is True
          assert p['shared_qore_risk_state'] is True
          assert len(p['traders'])==7
          assert len(p['candidates'])==5
          io_path=Path(os.environ['RUNNER_TEMP'])/'results'/group/'lab'/'function-io-actuation.json'
          io=json.loads(io_path.read_text())
          assert io['schema']=='qore.cibo.function-io-actuation.v1'
          assert io['group_id']==group
          assert io['function_count']==53
          sensor_path=Path(os.environ['RUNNER_TEMP'])/'results'/group/'lab'/'function-utilization-sensor.json'
          utilization=json.loads(sensor_path.read_text())
          assert utilization['schema']=='qore.cibo.function-utilization-sensor.v1'
          assert utilization['group_id']==group
          assert utilization['summary']['function_count']==53
          assert len(utilization['functions'])==53
          assert utilization['summary']['repair_required_count']==len(utilization['repair_queue'])
          assert utilization['economic_capability_probe']['dynamic_leverage_candidate_present'] is True
          frontier=p['maximum_capability_frontier']
          assert frontier['schema']=='qore.cibo.maximum-capability-frontier.v1'
          assert frontier['governance']['decision_inputs_predecision_only'] is True
          assert frontier['governance']['evaluation_outcomes_not_available_to_decision'] is True
          assert frontier['governance']['outcome_aware_tuning'] is False
          assert frontier['function_attribution_summary']['function_count']==53
          assert frontier['position_lifecycle_coverage']['candidate_count']>0
          assert frontier['causal_frontier']['outcome_used_for_decision'] is False
          audit_path=Path(os.environ['RUNNER_TEMP'])/'results'/group/'lab'/'full-function-trader-lab-audit.json'
          audit=json.loads(audit_path.read_text())
          assert audit['candidate_count']==7
          assert audit['function_gate_count']==20
          assert audit['all_functions_pass'] is True
          assert len(audit['lanes'])==7
          assert all(lane['status']=='PASS' and lane['gate_count']==20 for lane in audit['lanes'].values())
          for candidate in p['candidates']:
              assert candidate['configuration_scope']=='CIBO_ONLY'
              assert candidate['trader_parameters_changed'] is False
              assert candidate['trader_profitability_used_for_gate'] is True
              assert len(candidate['measurements']['per_trader_under_cibo'])==7
              behavior=candidate['measurements']['cibo_function_behavior']
              assert behavior['not_integrated'] == []
              rows=behavior['rows']
              genc=[row for row in rows if row['stage']=='CAPITAL_SCIENCE']
              assert [row['capability'] for row in genc] == [f'GEN-C{i}' for i in range(1,15)]
          PY
        env:
          MATRIX_GROUP: ${{ matrix.group }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-cibo-trader-lab-3x1y-${{ matrix.group }}-${{ github.run_id }}
          path: ${{ runner.temp }}/results/${{ matrix.group }}
          if-no-files-found: warn
          retention-days: 90

  sensor:
    name: all-seven-positive-sensor
    needs: integrated-cibo
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install -e '.[dev]'

      - name: Recover all three parallel group results
        uses: actions/download-artifact@v4
        with:
          pattern: qore-cibo-trader-lab-3x1y-GROUP_*-${{ github.run_id }}
          path: ${{ runner.temp }}/parallel-results

      - name: Normalize group result paths
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/results"
          for group in GROUP_1 GROUP_2 GROUP_3; do
            source_dir="$(find "$RUNNER_TEMP/parallel-results" -maxdepth 1 -type d -name "qore-cibo-trader-lab-3x1y-$group-*" -print -quit)"
            test -n "$source_dir"
            mkdir -p "$RUNNER_TEMP/results/$group"
            cp -R "$source_dir/." "$RUNNER_TEMP/results/$group/"
            test -s "$RUNNER_TEMP/results/$group/group-result.json"
          done

      - name: Run all-seven positive stop sensor
        run: |
          set -euo pipefail
          python scripts/cibo_three_holdout_1y_sensor.py \
            --group1 "$RUNNER_TEMP/results/GROUP_1/group-result.json" \
            --group2 "$RUNNER_TEMP/results/GROUP_2/group-result.json" \
            --group3 "$RUNNER_TEMP/results/GROUP_3/group-result.json" \
            --output "$RUNNER_TEMP/results/sensor.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'results'
          sensor=json.loads((root/'sensor.json').read_text())
          assert sensor['research_only'] is True
          assert sensor['fresh_oos_claimed'] is False
          assert sensor['certification_claimed'] is False
          print(json.dumps({
              'status':sensor['status'],
              'cross_holdout_full_pass_count':sensor['cross_holdout_full_pass_count'],
              'cross_holdout_full_pass_fingerprints':sensor['cross_holdout_full_pass_fingerprints'],
              'per_group_full_pass_counts':sensor['per_group_full_pass_counts'],
          },sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-cibo-trader-lab-3x1y-sensor-${{ github.run_id }}
          path: ${{ runner.temp }}/results
          if-no-files-found: error
          retention-days: 90

  single-account-ceiling:
    name: single-account-usd60-ceiling
    needs: integrated-cibo
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install -e '.[dev]'

      - name: Recover current-run decision traces
        uses: actions/download-artifact@v4
        with:
          pattern: qore-cibo-trader-lab-3x1y-GROUP_*-${{ github.run_id }}
          path: ${{ runner.temp }}/parallel-results

      - name: Build continuous USD60 manifest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ceiling"
          for group in GROUP_1 GROUP_2 GROUP_3; do
            source_dir="$(find "$RUNNER_TEMP/parallel-results" -maxdepth 1 -type d -name "qore-cibo-trader-lab-3x1y-$group-*" -print -quit)"
            test -n "$source_dir"
            trace="$source_dir/lab/decision-trace.json"
            test -s "$trace"
            cp "$trace" "$RUNNER_TEMP/ceiling/$group-decision-trace.json"
          done
          python scripts/cibo_single_account_7trader_maximum_capability_manifest.py \
            --trace "$RUNNER_TEMP/ceiling/GROUP_1-decision-trace.json" \
            --trace "$RUNNER_TEMP/ceiling/GROUP_2-decision-trace.json" \
            --trace "$RUNNER_TEMP/ceiling/GROUP_3-decision-trace.json" \
            --output "$RUNNER_TEMP/ceiling/single-account-manifest.json"

      - name: Recover immutable native perception evidence
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native/vt08"

          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$VT08_3X1Y_ARTIFACT_ID" \
            > "$RUNNER_TEMP/native/vt08.meta.json"
          jq -e \
            --argjson artifact_id "$VT08_3X1Y_ARTIFACT_ID" \
            --arg digest "$VT08_3X1Y_ARTIFACT_DIGEST" \
            '.id == $artifact_id and .expired == false and .digest == $digest' \
            "$RUNNER_TEMP/native/vt08.meta.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$VT08_3X1Y_ARTIFACT_ID/zip" \
            > "$RUNNER_TEMP/native/vt08.zip"
          echo "${VT08_3X1Y_ARTIFACT_DIGEST#sha256:}  $RUNNER_TEMP/native/vt08.zip" \
            | sha256sum -c -
          unzip -q "$RUNNER_TEMP/native/vt08.zip" -d "$RUNNER_TEMP/native/vt08"

          for spec in "r6:$VT31_R6_ARTIFACT_ID" "r5:$VT31_R5_ARTIFACT_ID"; do
            label="${spec%%:*}"
            artifact_id="${spec##*:}"
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" \
              > "$RUNNER_TEMP/native/vt31-$label.meta.json"
            jq -e --argjson artifact_id "$artifact_id" \
              '.id == $artifact_id and .expired == false' \
              "$RUNNER_TEMP/native/vt31-$label.meta.json"
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              > "$RUNNER_TEMP/native/vt31-$label.zip"
            unzip -l "$RUNNER_TEMP/native/vt31-$label.zip" \
              | grep -F 'fresh/NAS100/market-evidence.json'
          done

      - name: Rebuild VT08 and VT31 native causal perception
        run: |
          set -euo pipefail
          python scripts/cibo_enrich_single_account_vt08_3x1y_native_perception.py \
            --manifest "$RUNNER_TEMP/ceiling/single-account-manifest.json" \
            --evidence-root "$RUNNER_TEMP/native/vt08" \
            --output "$RUNNER_TEMP/ceiling/single-account-manifest-vt08.json"

          python scripts/cibo_enrich_single_account_vt31_native_perception.py \
            --manifest "$RUNNER_TEMP/ceiling/single-account-manifest-vt08.json" \
            --vt31-evidence "$RUNNER_TEMP/native/vt31-r6.zip" \
            --vt31-evidence "$RUNNER_TEMP/native/vt31-r5.zip" \
            --output "$RUNNER_TEMP/ceiling/single-account-manifest-native.json"

      - name: Fast native perception audit
        run: |
          set -euo pipefail
          python scripts/cibo_single_account_native_perception_audit.py \
            --manifest "$RUNNER_TEMP/ceiling/single-account-manifest-native.json" \
            --output "$RUNNER_TEMP/ceiling/native-perception-audit.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"ceiling"
          p=json.loads((root/"native-perception-audit.json").read_text())
          assert p["decision_count"] == 3368
          assert p["perception_pass_count"] == 3368
          assert p["perception_blocked_count"] == 0
          assert p["perception_surface_ready"] is True
          assert p["governance"]["external_ai"] is False
          assert p["governance"]["settlement_outcome_read"] is False
          PY

      - name: Execute native MAX preflight over exact 3368 population
        run: |
          set -euo pipefail
          python scripts/cibo_single_account_native_max_intelligence_preflight.py \
            --manifest "$RUNNER_TEMP/ceiling/single-account-manifest-native.json" \
            --output "$RUNNER_TEMP/ceiling/native-max-preflight.json" \
            --progress-every 250
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"ceiling"
          p=json.loads((root/"native-max-preflight.json").read_text())
          assert p["decision_count"] == 3368
          assert p["native_max_pass_count"] == 3368
          assert p["native_max_blocked_count"] == 0
          assert p["external_ai_call_count"] == 0
          assert p["external_reasoning_provider_used"] is False
          assert p["maximum_intelligence_ready"] is True
          PY

      - name: Execute chronological single-account USD60 replay
        run: |
          set -euo pipefail
          python scripts/cibo_single_account_historical_ceiling_replay.py \
            --manifest "$RUNNER_TEMP/ceiling/single-account-manifest-native.json" \
            --output "$RUNNER_TEMP/ceiling/historical-ceiling-replay.json" \
            --progress-every 100
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"ceiling"
          p=json.loads((root/"historical-ceiling-replay.json").read_text())
          assert p["decision_epoch_count"] == 3305
          assert p["decision_count"] == 3368
          assert p["external_ai_call_count"] == 0
          g=p["governance"]
          assert g["single_account_usd60"] is True
          assert g["account_reset_count"] == 0
          assert g["economic_era_reset_count"] == 0
          assert g["outcome_used_for_predecision"] is False
          assert g["external_ai"] is False
          assert g["broker_mutation"] is False
          assert g["certification_claimed"] is False
          assert g["provider_plane"] == "COUNTERFACTUAL_RESEARCH_ASSUMPTION"
          print(json.dumps({
              "ending_capital_usd": p["ending_capital_usd"],
              "peak_capital_usd": p["peak_capital_usd"],
              "net_pnl_usd": p["net_pnl_usd"],
              "settlement_count": p["settlement_count"],
          }, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-cibo-single-account-ceiling-${{ github.run_id }}
          path: ${{ runner.temp }}/ceiling
          if-no-files-found: error
          retention-days: 90

