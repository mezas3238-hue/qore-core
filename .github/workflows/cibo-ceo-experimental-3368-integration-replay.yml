name: CIBO CEO Experimental 3368 Native + QDLE Replay

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cibo-sovereign-integration-p0-20261008
    paths:
      - ".github/workflows/cibo-ceo-experimental-3368-integration-replay.yml"
      - "scripts/cibo_ceo_experimental_replay_audit.py"
      - "src/qore/infrastructure/cibo_sovereign_integration.py"

concurrency:
  group: ceo-experimental-3368-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: src
  SOURCE_ARTIFACT_ID: "11451743578"
  SOURCE_ARTIFACT_DIGEST: "sha256:d439957f21e2f79148b5a2fb75a53db6fa448698f17aeb6978f379ed3547f7ea"
  QORE_REPLAY_AUTHORITY: "CEO_EXPERIMENTAL_OFFLINE_NO_SEND"
  QORE_LIVE_TRADING: "false"

jobs:
  ceo-authorized-experimental-3368:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CEO replay-only gate selection — science findings nonblocking, physical invariants strict
        run: |
          echo 'REPLAY_SCOPE=EXPERIMENT_ONLY'
          echo 'CEO_AUTHORIZATION=LAB_REPLAY_NOT_LIVE'
          echo 'NONBLOCKING_CERTIFICATION=LEGACY_STACK, ZERO_OPEN_WORK, FRESH_OOS, FINAL_INTEGRATED_EXAM'
          echo 'STRICT_ALWAYS=3368_IDS, CHRONOLOGY, QORE_5PCT_RISK, FEES, MARGIN, PROVIDER_PROVENANCE, NO_ORDER_SEND'
          test "$QORE_LIVE_TRADING" = false
      - name: Restore verified exact 3368 original signals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ceo-experiment"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" > "$RUNNER_TEMP/ceo-experiment/source.zip"
          echo "${SOURCE_ARTIFACT_DIGEST#sha256:}  $RUNNER_TEMP/ceo-experiment/source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ceo-experiment/source.zip" walk-forward-manifest.json -d "$RUNNER_TEMP/ceo-experiment"
      - name: Run actual Native MAX CIBO independent cognitive research baseline
        run: |
          python scripts/cibo_single_account_historical_ceiling_replay.py \
            --manifest "$RUNNER_TEMP/ceo-experiment/walk-forward-manifest.json" \
            --progress-every 500 \
            --output "$RUNNER_TEMP/ceo-experiment/native-cibo-ceiling.json"
      - name: Run same 3368 inputs through the four native motors + QDLE physical research proxy
        run: |
          python scripts/qdle_3368_dual_ledger_replay.py \
            --manifest "$RUNNER_TEMP/ceo-experiment/walk-forward-manifest.json" \
            --motor-policy independent_four_motors \
            --min-policy broker_grid \
            --ndx-roundtrip-fee-proxy-usd-per-lot 20 \
            --provider-trailing-usd disabled \
            --swap-proxy off \
            --output "$RUNNER_TEMP/ceo-experiment/four-motor-qdle-research.json"
      - name: Integrated experimental replay — CIBO Native causal authorizations through 4 motors and QDLE
        run: |
          python scripts/qdle_3368_dual_ledger_replay.py \
            --manifest "$RUNNER_TEMP/ceo-experiment/walk-forward-manifest.json" \
            --motor-policy independent_four_motors \
            --experimental-native-ceiling-report "$RUNNER_TEMP/ceo-experiment/native-cibo-ceiling.json" \
            --experimental-native-lane-policy all_bank \
            --min-policy broker_grid \
            --ndx-roundtrip-fee-proxy-usd-per-lot 20 \
            --provider-trailing-usd disabled \
            --swap-proxy off \
            --output "$RUNNER_TEMP/ceo-experiment/native-cibo-four-motor-qdle-all-bank-RESEARCH.json"
      - name: Join exact 3368 IDs, expose CIBO/QDLE discrepancies and source gaps
        run: |
          python scripts/cibo_ceo_experimental_replay_audit.py \
            --manifest "$RUNNER_TEMP/ceo-experiment/walk-forward-manifest.json" \
            --native "$RUNNER_TEMP/ceo-experiment/native-cibo-ceiling.json" \
            --qdle "$RUNNER_TEMP/ceo-experiment/four-motor-qdle-research.json" \
            --joined "$RUNNER_TEMP/ceo-experiment/native-cibo-four-motor-qdle-all-bank-RESEARCH.json" \
            --output "$RUNNER_TEMP/ceo-experiment/ceo-3368-integrator-audit.json"
      - name: Verify no false physical execution or financial certification claim
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"ceo-experiment"/"ceo-3368-integrator-audit.json"
          r=json.loads(p.read_text())
          assert r["paired_unique_signal_count"] == 3368
          assert r["real_mt5_fills"] == 0
          assert r["same_cibo_strategy_and_qdle_actual_joint_execution"] is False
          assert r["native_and_qdle_pnl_are_not_economically_comparable"] is True
          assert r["native_cibo_4motor_qdle_joint_research_projection"]["broker_fills"] == 0
          assert r["native_cibo_4motor_qdle_joint_research_projection"]["all_native_decisions_read"] == 3368
          print("EXPERIMENTAL_AUDIT_PASS: NO LIVE, NO FABRICATED FILLS, ALL SIGNALS TRACED")
          PY
      - name: Publish research reports even if experiment fails so root cause survives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cibo-ceo-exp-3368-NO-LIVE-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ceo-experiment/native-cibo-ceiling.json
            ${{ runner.temp }}/ceo-experiment/four-motor-qdle-research.json
            ${{ runner.temp }}/ceo-experiment/native-cibo-four-motor-qdle-all-bank-RESEARCH.json
            ${{ runner.temp }}/ceo-experiment/ceo-3368-integrator-audit.json
          if-no-files-found: warn
