name: QORE GitHub Trader Lab

on:
  push:
    branches:
      - agent/github-trader-lab-001
    paths:
      - 'tools/github_trader_lab/**'
      - '.github/workflows/github-trader-lab.yml'
  workflow_dispatch:
    inputs:
      profile_path:
        description: 'Trader Lab profile path in the lab branch'
        required: false
        type: string
      subject_ref:
        description: 'Git ref of the Trader/CIBO subject to test'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-github-trader-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trader-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout independent Trader Lab
        uses: actions/checkout@v4
        with:
          path: lab

      - name: Resolve run request
        id: request
        shell: bash
        env:
          INPUT_PROFILE: ${{ github.event.inputs.profile_path || '' }}
          INPUT_SUBJECT_REF: ${{ github.event.inputs.subject_ref || '' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          lab = Path("lab").resolve()
          request = json.loads(
              (lab / "tools/github_trader_lab/run-request.json").read_text()
          )
          raw_profile = os.environ.get("INPUT_PROFILE") or request["profile_path"]
          subject_ref = os.environ.get("INPUT_SUBJECT_REF") or request["subject_ref"]

          profile_path = Path(raw_profile)
          if profile_path.is_absolute() or ".." in profile_path.parts:
              raise SystemExit("profile_path must stay inside the lab checkout")
          full = lab / profile_path
          profile = json.loads(full.read_text())
          if profile.get("schema") != "qore.github-trader-lab.profile.v1":
              raise SystemExit("unsupported profile schema")

          digest = hashlib.sha256(full.read_bytes()).hexdigest()
          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a") as handle:
              handle.write(f"profile_path={profile_path.as_posix()}\n")
              handle.write(f"profile_id={profile['profile_id']}\n")
              handle.write(f"profile_sha={digest}\n")
              handle.write(f"subject_ref={subject_ref}\n")
          print(
              "QORE_TRADER_LAB_REQUEST "
              + json.dumps(
                  {
                      "profile_id": profile["profile_id"],
                      "profile_sha": digest,
                      "subject": profile["subject"],
                      "subject_ref": subject_ref,
                  },
                  sort_keys=True,
              ),
              flush=True,
          )
          PY

      - name: Checkout subject under test
        uses: actions/checkout@v4
        with:
          repository: mezas3238-hue/qore-core
          ref: ${{ steps.request.outputs.subject_ref }}
          path: subject

      - name: Resolve subject SHA
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git -C subject rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "QORE_TRADER_LAB_SUBJECT_SHA $sha"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore immutable evidence cache
        uses: actions/cache@v4
        with:
          path: .qore-cache/github-trader-lab/evidence/${{ steps.request.outputs.profile_id }}
          key: qore-github-trader-lab-evidence-v1-${{ steps.request.outputs.profile_sha }}

      - name: Recover and verify evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python lab/tools/github_trader_lab/evidence.py \
            --profile "lab/${{ steps.request.outputs.profile_path }}" \
            --output-dir ".qore-cache/github-trader-lab/evidence/${{ steps.request.outputs.profile_id }}"

      - name: Restore subject-bound replay cache
        uses: actions/cache@v4
        with:
          path: .qore-cache/github-trader-lab/results/${{ steps.request.outputs.profile_id }}/${{ steps.subject.outputs.sha }}
          key: qore-github-trader-lab-result-v1-${{ steps.request.outputs.profile_sha }}-${{ steps.subject.outputs.sha }}

      - name: Fast static preflight
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            lab/tools/github_trader_lab/realtime.py \
            lab/tools/github_trader_lab/science.py \
            lab/tools/github_trader_lab/evidence.py \
            lab/tools/github_trader_lab/runner.py
          adapter="$(python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("lab/${{ steps.request.outputs.profile_path }}").read_text())
          command=p["replay"]["adapter_command"]
          print(next(x for x in command if x.endswith(".py")))
          PY
          )"
          adapter="${adapter//\{lab_root\}/lab}"
          python -m py_compile "$adapter"

      - name: Execute replay lanes with real-time telemetry
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/subject/src:${{ github.workspace }}/subject/scripts:${{ github.workspace }}/lab/tools/github_trader_lab
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/github-trader-lab"
          cache=".qore-cache/github-trader-lab/results/${{ steps.request.outputs.profile_id }}/${{ steps.subject.outputs.sha }}"
          mkdir -p "$out" "$cache"
          python lab/tools/github_trader_lab/runner.py \
            --profile "lab/${{ steps.request.outputs.profile_path }}" \
            --lab-root "${{ github.workspace }}/lab" \
            --subject-root "${{ github.workspace }}/subject" \
            --evidence-dir ".qore-cache/github-trader-lab/evidence/${{ steps.request.outputs.profile_id }}" \
            --cache-dir "$cache" \
            --output-dir "$out" \
            --heartbeat-seconds 5 \
            | tee "$out/console.log"

      - name: Publish Trader Lab headline
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/github-trader-lab"
          if test -f "$out/headline.json"; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"github-trader-lab"
          h=json.loads((root/"headline.json").read_text())
          print("# QORE GitHub Trader Lab")
          print()
          print(f"- Profile: {h['profile_id']}")
          print(f"- Subject: {h['subject']}")
          print(f"- Development survivors: {h['development_survivors']}")
          print(f"- Hard-DD survivors: {h['hard_dd_survivors']}")
          print(f"- Scientific passes: {h['scientific_passes']}")
          print("- Fresh holdout opened: false")
          print("- Certification claimed: false")
          print("- Sovereign workflow modified: false")
          PY
          elif test -f "$out/status.json"; then
            echo "# QORE GitHub Trader Lab — failed/incomplete" >> "$GITHUB_STEP_SUMMARY"
            cat "$out/status.json" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload complete laboratory record
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-github-trader-lab-${{ steps.request.outputs.profile_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/github-trader-lab
          if-no-files-found: error
          retention-days: 90
