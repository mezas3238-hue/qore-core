name: QORE Shared GW2 NonFX Provider Metadata Atlas

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - scripts/shared_gw2_nonfx_provider_metadata_atlas.py
      - .github/workflows/qore-shared-gw2-nonfx-provider-metadata-atlas.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  GEN2_RUN_ID: "36623131862"
  GEN2_ARTIFACT_ID: "11059307341"
  GEN2_GIT_SHA: "f5fcd0c9552466132f6f47bb124805e49e774493"

jobs:
  atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Shared
        run: pip install -e ".[dev]"

      - name: Validate atlas
        run: |
          set -euo pipefail
          mkdir -p input result
          ruff check scripts/shared_gw2_nonfx_provider_metadata_atlas.py
          python -m py_compile scripts/shared_gw2_nonfx_provider_metadata_atlas.py

      - name: Recover sealed GEN-2 provider schedule
        run: |
          set -euo pipefail
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GEN2_RUN_ID}" --jq '.status')" = "completed"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GEN2_RUN_ID}" --jq '.conclusion')" = "success"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GEN2_RUN_ID}" --jq '.head_sha')" = "$GEN2_GIT_SHA"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${GEN2_ARTIFACT_ID}/zip" > gen2.zip
          unzip -q gen2.zip -d input
          (cd input/result && sha256sum -c SHA256SUMS)

      - name: Materialize exact non-FX provider metadata
        run: |
          set -euo pipefail
          python scripts/shared_gw2_nonfx_provider_metadata_atlas.py             --provider-schedule input/result/provider-schedule-catalog.json             --output result/gw2-nonfx-provider-metadata-atlas.json             | tee result/summary.json

      - name: Validate no identity inference
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/gw2-nonfx-provider-metadata-atlas.json").read_text())
          assert p["total_sensor_count"] == 44
          assert p["provider_metadata_is_canonical_proof"] is False
          assert p["automatic_identity_inference"] is False
          assert p["historical_market_data_read"] is False
          assert p["target_or_outcome_read"] is False
          assert p["protected_holdout_opened"] is False
          assert p["productive_authority"] is False
          counts={row["family"]:row["sensor_count"] for row in p["families"]}
          assert counts == {"EQUITY_INDICES":25,"METALS":16,"ENERGY":3}
          PY

      - name: Bind evidence
        run: |
          set -euo pipefail
          printf '%s\n' "${GITHUB_SHA}" > result/code-git-sha.txt
          (
            cd result
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0               | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-gw2-nonfx-provider-metadata-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Report provider-native metadata frontier
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p=json.loads(Path("result/gw2-nonfx-provider-metadata-atlas.json").read_text())
          lines=[
              "## Shared GW-2 — Non-FX Provider Metadata Atlas",
              "",
              f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- provider-native sensors materialized: **{p['total_sensor_count']}**",
              "- provider metadata treated as canonical proof: **False**",
              "- protected certification holdout opened: **False**",
              "",
          ]
          for family in p["families"]:
              lines.append(f"### {family['family']}")
              for row in family["records"]:
                  lines.append(
                      "- "
                      + str(row["provider_symbol"])
                      + " | native="
                      + str(row["provider_native_symbol_name"])
                      + " | description="
                      + str(row["provider_description"])
                      + " | base="
                      + str(row["provider_base_asset_name"])
                      + " | quote="
                      + str(row["provider_quote_asset_name"])
                      + " | category="
                      + str(row["provider_symbol_category_name"])
                  )
              lines.append("")
          Path("result/issue-comment.md").write_text("\n".join(lines)+"\n")
          PY
          gh issue comment 638 --body-file result/issue-comment.md
