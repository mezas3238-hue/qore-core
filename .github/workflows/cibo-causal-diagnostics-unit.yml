name: QORE CIBO Causal Diagnostics Unit

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cibo-causal-expectation-leakage-fix-001
    paths:
      - '.github/workflows/cibo-causal-diagnostics-unit.yml'
      - 'src/qore/infrastructure/cibo_walk_forward_forecast_confidence.py'
      - 'scripts/cibo_walk_forward_capital_path_diagnostics.py'
      - 'tests/infrastructure/test_cibo_walk_forward_forecast_confidence.py'
      - 'tests/infrastructure/test_cibo_walk_forward_capital_path_diagnostics.py'
      - 'src/qore/infrastructure/cibo_ce2i_holdout_registry.py'
      - 'src/qore/infrastructure/cibo_ce2i_pre_holdout_gate.py'
      - 'tests/infrastructure/test_cibo_ce2i_holdout_registry.py'
      - 'tests/infrastructure/test_cibo_ce2i_pre_holdout_gate.py'
      - 'tests/infrastructure/test_cibo_single_account_historical_ceiling_epoch.py'
      - 'src/qore/infrastructure/cibo_native_max_cognitive_episode.py'
      - 'src/qore/infrastructure/cibo_cognitive_reach_sensors.py'
      - 'src/qore/infrastructure/cibo_function_economic_sensors.py'
      - 'src/qore/infrastructure/cibo_sovereign_capital_runtime.py'
      - 'src/qore/infrastructure/cibo_native_sovereign_capital_runtime.py'
      - 'src/qore/infrastructure/cibo_single_account_sovereign_ceiling_executor.py'
      - 'src/qore/infrastructure/cibo_single_account_historical_ceiling_epoch.py'
      - 'tests/infrastructure/test_cibo_native_maximum_intelligence.py'
      - 'tests/infrastructure/test_cibo_cognitive_reach_sensors.py'
      - 'tests/infrastructure/test_cibo_function_economic_sensors.py'
      - 'tests/infrastructure/test_cibo_sovereign_capital_runtime_contract.py'
      - 'tests/infrastructure/test_cibo_capital_science_runtime_bridge.py'

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate causal diagnostics
        run: |
          set -euo pipefail
          python -m py_compile \
            src/qore/infrastructure/cibo_walk_forward_forecast_confidence.py \
            scripts/cibo_walk_forward_capital_path_diagnostics.py \
            src/qore/infrastructure/cibo_ce2i_holdout_registry.py \
            src/qore/infrastructure/cibo_ce2i_pre_holdout_gate.py \
            src/qore/infrastructure/cibo_native_max_cognitive_episode.py \
            src/qore/infrastructure/cibo_cognitive_reach_sensors.py \
            src/qore/infrastructure/cibo_function_economic_sensors.py \
            src/qore/infrastructure/cibo_sovereign_capital_runtime.py \
            src/qore/infrastructure/cibo_native_sovereign_capital_runtime.py \
            src/qore/infrastructure/cibo_single_account_sovereign_ceiling_executor.py \
            src/qore/infrastructure/cibo_single_account_historical_ceiling_epoch.py
          ruff check \
            src/qore/infrastructure/cibo_walk_forward_forecast_confidence.py \
            scripts/cibo_walk_forward_capital_path_diagnostics.py \
            tests/infrastructure/test_cibo_walk_forward_forecast_confidence.py \
            tests/infrastructure/test_cibo_walk_forward_capital_path_diagnostics.py \
            src/qore/infrastructure/cibo_ce2i_holdout_registry.py \
            src/qore/infrastructure/cibo_ce2i_pre_holdout_gate.py \
            tests/infrastructure/test_cibo_ce2i_holdout_registry.py \
            tests/infrastructure/test_cibo_ce2i_pre_holdout_gate.py \
            tests/infrastructure/test_cibo_single_account_historical_ceiling_epoch.py \
            src/qore/infrastructure/cibo_native_max_cognitive_episode.py \
            src/qore/infrastructure/cibo_cognitive_reach_sensors.py \
            src/qore/infrastructure/cibo_function_economic_sensors.py \
            src/qore/infrastructure/cibo_sovereign_capital_runtime.py \
            src/qore/infrastructure/cibo_native_sovereign_capital_runtime.py \
            src/qore/infrastructure/cibo_single_account_sovereign_ceiling_executor.py \
            tests/infrastructure/test_cibo_native_maximum_intelligence.py \
            tests/infrastructure/test_cibo_cognitive_reach_sensors.py \
            tests/infrastructure/test_cibo_function_economic_sensors.py \
            tests/infrastructure/test_cibo_sovereign_capital_runtime_contract.py \
            tests/infrastructure/test_cibo_capital_science_runtime_bridge.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_walk_forward_forecast_confidence.py \
            tests/infrastructure/test_cibo_walk_forward_capital_path_diagnostics.py \
            tests/infrastructure/test_cibo_ce2i_holdout_registry.py \
            tests/infrastructure/test_cibo_ce2i_pre_holdout_gate.py \
            tests/infrastructure/test_cibo_single_account_historical_ceiling_epoch.py \
            tests/infrastructure/test_cibo_native_maximum_intelligence.py \
            tests/infrastructure/test_cibo_cognitive_reach_sensors.py \
            tests/infrastructure/test_cibo_function_economic_sensors.py \
            tests/infrastructure/test_cibo_sovereign_capital_runtime_contract.py \
            tests/infrastructure/test_cibo_capital_science_runtime_bridge.py
