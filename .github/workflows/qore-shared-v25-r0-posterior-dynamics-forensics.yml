name: QORE Shared V25 R0 Posterior Dynamics Forensics

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - scripts/shared_v25_r0_posterior_dynamics_forensics.py
      - .github/workflows/qore-shared-v25-r0-posterior-dynamics-forensics.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  posterior-dynamics-forensics:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout Shared
        uses: actions/checkout@v4
        with:
          path: shared

      - name: Checkout frozen external falsification surface
        uses: actions/checkout@v4
        with:
          ref: agent/vt08-index-deep-behavior-lab-final
          path: surface

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compose autonomous Shared research surface
        run: |
          set -euo pipefail
          mkdir -p surface/src/qore/infrastructure/core_stack_v2 surface/scripts
          : > surface/src/qore/infrastructure/core_stack_v2/__init__.py
          for module in             adversity_challenge_intelligence.py             multi_state_competing_hazard.py             causal_path_representation.py             causal_hypothesis_belief.py             causal_state_filter.py
          do
            cp "shared/src/qore/infrastructure/core_stack_v2/$module"                "surface/src/qore/infrastructure/core_stack_v2/$module"
          done
          for script in             vt08_index_shared_competing_risk_calibration_v9.py             vt08_index_shared_context_conditioned_competing_risk_v15.py             shared_autonomous_nonlinear_loss_risk_ensemble_v19.py             shared_multi_state_competing_hazard_v20.py             shared_relational_adversity_challenge_survival_v21.py             shared_sequence_event_causal_belief_v23.py             shared_dynamic_bayesian_causal_state_v24.py             shared_v25_r0_posterior_dynamics_forensics.py
          do
            cp "shared/scripts/$script" "surface/scripts/$script"
          done

      - name: Install composite research tree
        run: |
          cd surface
          pip install -e ".[dev]"
          pip install "numpy>=2,<3" "scikit-learn>=1.5,<2"

      - name: Static validation
        run: |
          set -euo pipefail
          cd surface
          ruff check scripts/shared_v25_r0_posterior_dynamics_forensics.py
          python -m py_compile scripts/shared_v25_r0_posterior_dynamics_forensics.py

      - name: Download frozen consumed path ledger
        uses: actions/download-artifact@v4
        with:
          name: qore-shared-vt08-stop-target-discrimination-v6-1a534d0ae735efef4dcbc0c0be4b110ceaa80501
          path: surface/artifacts/v6
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36131607443

      - name: Run V25 R0 posterior-dynamics forensics
        run: |
          set -euo pipefail
          cd surface
          mkdir -p artifacts/shared-v25-r0
          python scripts/shared_v25_r0_posterior_dynamics_forensics.py             --v6-json artifacts/v6/vt08-index-shared-stop-target-discrimination-v6.json             --out artifacts/shared-v25-r0/shared-v25-r0-posterior-dynamics-forensics.json             | tee artifacts/shared-v25-r0/summary.json

      - name: Validate governance
        run: |
          set -euo pipefail
          cd surface
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(Path(
              "artifacts/shared-v25-r0/"
              "shared-v25-r0-posterior-dynamics-forensics.json"
          ).read_text())
          assert p["identity"] == "QORE_SHARED_V25_R0_POSTERIOR_DYNAMICS_FORENSICS"
          assert p["research_only"] is True
          assert p["decision_policy_changed"] is False
          assert p["posterior_forensics_only"] is True
          assert p["consumed_evidence_only"] is True
          assert p["fresh_holdout_opened"] is False
          assert p["runtime_current_position_pnl_used"] is False
          assert p["runtime_terminal_outcome_used"] is False
          assert p["runtime_future_market_used"] is False
          assert p["runtime_symbol_identity_used"] is False
          assert p["runtime_market_identity_used"] is False
          assert p["runtime_trader_identity_used"] is False
          assert p["runtime_methodology_identity_used"] is False
          assert p["runtime_calendar_identity_used"] is False
          assert p["runtime_fold_identity_used"] is False
          assert p["sizing_used"] is False
          assert p["risk_weighting_used"] is False
          assert p["runtime_actuation"] is False
          assert p["closed_outcome_used_for_forensic_grouping_only"] is True
          assert set(p["windows"]) == {
              "five_year","recent_two_year","r66_consumed_failed_holdout"
          }
          print(json.dumps({
              "identity":p["identity"],
              "windows":p["windows"],
          },sort_keys=True))
          PY

      - name: Bind result
        run: |
          cd surface/artifacts/shared-v25-r0
          echo "$GITHUB_SHA" > shared-git-sha.txt
          echo "36131607443" > source-v6-run.txt
          echo "36156421332" > source-v21-run.txt
          echo "36185092496" > source-v24-run.txt
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-v25-r0-posterior-dynamics-forensics-${{ github.sha }}
          path: surface/artifacts/shared-v25-r0/
          if-no-files-found: error
          retention-days: 90
