name: VT08 Index R97 Persistent Protected Swing Lifecycle

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r97-persistent-ps-lifecycle.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r97_persistent_ps_lifecycle.py
      - tests/infrastructure/trader_lab/test_vt08_index_r97_persistent_ps_lifecycle.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r97_persistent_ps_lifecycle.py

  forensics:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R97 persistent PS lifecycle census
        run: |
          mkdir -p artifacts/report
          python -m qore.infrastructure.trader_lab.vt08_index_r97_persistent_ps_lifecycle \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r97-persistent-ps-lifecycle.json

      - name: Verify R97 governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r97-persistent-ps-lifecycle.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R97_PERSISTENT_PROTECTED_SWING_LIFECYCLE_001"
          )
          assert report["source_r96"]["run_id"] == 35532300657
          assert report["source_r96"]["artifact_id"] == 10612280518
          assert report["source_r96"]["artifact_digest"] == (
              "sha256:7d3a61fe6d32b94585e370b70036ac5d3eb99330bc3524250965e53bc83ea861"
          )

          contract = report["lifecycle_contract"]
          assert contract["primary_model"] == "D1_H4_M15"
          assert contract["start_requires_closed_ideal_formation"] is True
          assert contract["numeric_h4_ttl"] is None
          assert contract["state_ends_on_invalidation"] is True
          assert contract["state_ends_on_daily_bias_change_or_ambiguity"] is True
          assert contract["new_source_exact_ps_replaces_state"] is True
          assert contract["one_execution_per_protected_swing"] is True
          assert contract["new_protected_swing_rearms"] is True
          assert contract["same_timestamp_conflicting_replacement"] == "FAIL_CLOSED"
          assert contract["execution_anchors_ny"] == [22, 2, 6, 10]
          assert contract["owner_disabled_14_preserved"] is True
          assert contract["context_only_18_preserved"] is True
          assert contract["h1_m5_independent_signals_added"] is False
          assert contract["m15_m1_independent_signals_added"] is False
          assert contract["pnl_evaluated"] is False

          assert report["five_year"]["canonical_signal_reference"] == 2448
          assert report["recent_two_year"]["canonical_signal_reference"] == 1017
          assert report["r66_failed_holdout"]["canonical_signal_reference"] == 773
          assert report["decision"] == (
              "R97_PERSISTENT_PS_LIFECYCLE_CENSUS_COMPLETE_NO_TRADES"
          )

          gov = report["governance"]
          assert gov["forensics_only"] is True
          assert gov["consumed_evidence_only"] is True
          assert gov["fresh_holdout_claim"] is False
          assert gov["source_primary_model_only"] is True
          assert gov["future_information_used"] is False
          assert gov["numeric_ttl_search"] is False
          assert gov["pnl_evaluated"] is False
          assert gov["risk_changed"] is False
          assert gov["target_changed"] is False
          assert gov["anchors_changed"] is False
          assert gov["market_or_anchor_selection_by_outcome"] is False
          assert gov["candidate_created"] is False
          assert gov["trader_certified"] is False
          assert gov["live_authorized"] is False
          assert gov["real_capital_authorized"] is False
          assert gov["production_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r97-persistent-ps-lifecycle-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
