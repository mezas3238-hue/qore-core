name: QORE VT31 Full Cognition Target Depth Calibration V1

on:
  push:
    branches:
      - agent/vt31-edge-position-cert-b-001
    paths:
      - scripts/vt31_nas100_full_cognition_target_depth_calibration_v1.py
      - .github/workflows/vt31-full-cognition-target-depth-calibration-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Static gate
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_full_cognition_target_depth_calibration_v1.py
          ruff check scripts/vt31_nas100_full_cognition_target_depth_calibration_v1.py

      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"

      - name: Run target-depth calibration
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python scripts/vt31_nas100_full_cognition_target_depth_calibration_v1.py             "input/${EVIDENCE_PATH}"             --partition "${PARTITION}"             --output "result/target-depth-${PARTITION}.json"             | tee "result/summary-${PARTITION}.json"

      - name: Governance gate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          p=os.environ["PARTITION"]
          x=json.loads(Path(f"result/target-depth-{p}.json").read_text())
          g=x["governance"]
          assert g["specialist_replay_is_admission_authority"] is True
          assert g["trade_admission_changed"] is False
          assert g["entry_changed"] is False
          assert g["initial_stop_changed"] is False
          assert g["primary_structural_target_changed"] is False
          assert g["h3_must_precede_dol1_acceptance_for_attribution"] is True
          assert g["dol1_touch_is_not_acceptance"] is True
          assert g["dol1_acceptance_requires_subsequent_closed_m1"] is True
          assert g["future_depth_labels_research_only"] is True
          assert g["future_depth_labels_runtime_input"] is False
          assert g["position_sizing_used"] is False
          assert g["leverage_used"] is False
          assert g["compounding_used"] is False
          assert g["capital_weighting_used"] is False
          assert g["absolute_volume_used"] is False
          assert g["fresh_holdout_opened"] is False
          assert x["diagnostic_count"] <= x["sovereign_trade_count"]
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-target-depth-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-target-depth-*-${{ github.sha }}
          path: input
          merge-multiple: true

      - name: Aggregate target-depth calibration
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          folds=("r5","r6","r8","consumed")
          payloads={
              f:json.loads(Path(f"input/target-depth-{f}.json").read_text())
              for f in folds
          }

          def d(v):
              return None if v is None else Decimal(str(v))

          fold_stats={}
          dol2_pass=True
          dol3_pass=True
          nonzero=True
          for fold in folds:
              o=payloads[fold]["overall"]
              accept=int(o["dol1_accept_count"])
              r2=d(o["dol2_reach_rate_after_acceptance"])
              r3=d(o["dol3_reach_rate_after_acceptance"])
              nonzero &= accept > 0
              dol2_pass &= (
                  accept > 0 and r2 is not None and r2 >= Decimal("0.70")
              )
              dol3_pass &= (
                  accept > 0 and r3 is not None and r3 >= Decimal("0.50")
              )
              fold_stats[fold]={
                  "sovereign_trade_count":payloads[fold]["sovereign_trade_count"],
                  "diagnostic_count":payloads[fold]["diagnostic_count"],
                  "overall":o,
                  "by_h3_persistence":payloads[fold]["by_h3_persistence"],
                  "by_h3_cognition":payloads[fold]["by_h3_cognition"],
                  "by_side":payloads[fold]["by_side"],
                  "by_h1":payloads[fold]["by_h1"],
                  "by_m15":payloads[fold]["by_m15"],
                  "by_volatility":payloads[fold]["by_volatility"],
              }

          aggregate={
              "schema":"qore.vt31.nas100.full_cognition_target_depth_calibration.aggregate.v1",
              "head":"${{ github.sha }}",
              "folds":fold_stats,
              "gates":{
                  "nonzero_dol1_acceptance_all_folds":nonzero,
                  "dol2_reach_at_least_70pct_all_folds":dol2_pass,
                  "dol3_reach_at_least_50pct_all_folds":dol3_pass,
              },
              "dol2_calibration_witness":nonzero and dol2_pass,
              "dol3_calibration_witness":nonzero and dol3_pass,
              "governance":{
                  "consumed_evidence_only":True,
                  "future_depth_labels_research_only":True,
                  "economic_extension_policy_tested":False,
                  "runtime_policy_promoted":False,
                  "fresh_holdout_opened":False,
                  "candidate_frozen":False,
                  "candidate_certified":False,
                  "live_authorized":False,
              },
          }
          Path("result/aggregate.json").write_text(
              json.dumps(aggregate,sort_keys=True,indent=2)+"\n"
          )
          print(json.dumps(aggregate,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-target-depth-aggregate-${{ github.sha }}
          path: result/
          retention-days: 90
