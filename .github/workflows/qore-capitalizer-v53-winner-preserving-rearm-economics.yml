name: QORE Capitalizer V53 Winner Preserving Rearm Economics

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - 'src/qore/infrastructure/trader_lab/capitalizer_v50_target_stop_intelligence.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v50_target_stop_intelligence.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v53_winner_preserving_rearm_economics.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v53_winner_preserving_rearm_economics.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v50_m1_rearm_capacity.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v50_m1_rearm_capacity.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v51_multi_era_repair.py'
      - '.github/workflows/qore-capitalizer-v53-winner-preserving-rearm-economics.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-v53-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: V50 stop-integrity regression
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_v50_target_stop_intelligence.py \
            tests/infrastructure/trader_lab/test_capitalizer_v50_target_stop_intelligence.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_v50_target_stop_intelligence.py
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_v50_target_stop_intelligence.py
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_v53_winner_preserving_rearm_economics.py \
            tests/infrastructure/trader_lab/test_capitalizer_v53_winner_preserving_rearm_economics.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_v53_winner_preserving_rearm_economics.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_v53_winner_preserving_rearm_economics.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - symbol: USDJPY
            session: ASIA
          - symbol: AUDJPY
            session: ASIA
          - symbol: AUDUSD
            session: ASIA
          - symbol: GBPJPY
            session: ASIA
          - symbol: EURUSD
            session: LONDON
          - symbol: GBPUSD
            session: LONDON
          - symbol: XAUUSD
            session: NEW_YORK
          - symbol: USDCAD
            session: NEW_YORK
          - symbol: NAS100
            session: NEW_YORK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download retained provider-native M1
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Build V49 source opportunities
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_high_frequency_capacity_census_v49 \
            market m1-source capacity-output --session "${{ matrix.session }}"
      - name: Build frozen V49 baseline economics
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v49_development_economics \
            market capacity-output m1-source baseline-output
      - name: Build V50-R causal rearm population
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v50_m1_rearm_capacity \
            market m1-source rearm-output --session "${{ matrix.session }}"
      - name: Run V53 winner-preserving transformed economics
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v53_winner_preserving_rearm_economics \
            market capacity-output baseline-output rearm-output m1-source v53-output
      - name: Enforce V53 boundary
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
          EXPECTED_SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"].lower()
          result = json.loads(
              (Path("v53-output") / f"capitalizer-{symbol}-v53-market-report.json").read_text()
          )
          assert result["symbol"] == os.environ["EXPECTED_SYMBOL"]
          assert result["session"] == os.environ["EXPECTED_SESSION"]
          assert result["decision_timeframes"] == ["H1", "M15", "M1"]
          assert result["outcome_used_for_selection"] is False
          assert result["stop_widened"] is False
          assert result["recovery_sizing_used"] is False
          assert result["historical_research"] is True
          assert result["certification_authority"] is False
          assert result["live_authorized"] is False
          assert result["real_capital_authorized"] is False
          assert result["reconstruction_mismatch"] == 0
          PY
      - name: Upload V53 market evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v53-${{ matrix.symbol }}-${{ github.sha }}
          path: v53-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download nine V53 market artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v53-*-${{ github.sha }}
          path: v53-markets
          merge-multiple: false
      - name: Build V53 matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v53_winner_preserving_rearm_economics \
            matrix v53-markets matrix-output
      - name: Enforce aggregate boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("matrix-output/capitalizer-v53-winner-preserving-rearm-matrix.json").read_text()
          )
          assert result["decision_timeframes"] == ["H1", "M15", "M1"]
          assert result["parent_thesis_identity_used_for_preservation"] is True
          assert result["outcome_used_for_selection"] is False
          assert result["stop_widened"] is False
          assert result["recovery_sizing_used"] is False
          assert result["automatic_policy_promotion"] is False
          assert result["certification_authority"] is False
          assert result["final_independent_or_prospective_oos_required"] is True
          assert result["live_authorized"] is False
          assert result["real_capital_authorized"] is False
          PY
      - name: Upload V53 matrix
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v53-matrix-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 180
