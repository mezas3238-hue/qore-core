name: QORE VT31 NAS100 Pure Market Exit Baseline V1
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  push:
    branches:
      - agent/vt31-edge-position-cert-b-001
    paths:
      - scripts/vt31_nas100_pure_market_exit_baseline_v1.py
      - src/qore/infrastructure/traders/vt31_nas100_edge_certification.py
      - tests/infrastructure/test_vt31_nas100_edge_certification.py
      - .github/workflows/vt31-nas100-pure-market-exit-baseline-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Static and pure-edge tests
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_pure_market_exit_baseline_v1.py
          ruff check scripts/vt31_nas100_pure_market_exit_baseline_v1.py             src/qore/infrastructure/traders/vt31_nas100_edge_certification.py             tests/infrastructure/test_vt31_nas100_edge_certification.py
          pytest -q tests/infrastructure/test_vt31_nas100_edge_certification.py

      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"

      - name: Run pure-market exit replay
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python scripts/vt31_nas100_pure_market_exit_baseline_v1.py             "input/${EVIDENCE_PATH}"             --partition "${PARTITION}"             --output "result/pure-market-${PARTITION}.json"             | tee "result/summary-${PARTITION}.json"

      - name: Enforce sovereign runtime governance
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=os.environ["PARTITION"]
          x=json.loads(Path(f"result/pure-market-{p}.json").read_text())
          r=x["runtime_governance"]
          assert r["r_used_for_admission"] is False
          assert r["r_used_for_entry"] is False
          assert r["r_used_for_invalidation"] is False
          assert r["r_used_for_stop_movement"] is False
          assert r["r_used_for_breakeven"] is False
          assert r["r_used_for_target"] is False
          assert r["r_used_for_exit"] is False
          assert r["r_used_for_trailing"] is False
          assert r["r_used_for_partials"] is False
          assert r["r_used_for_volume"] is False
          assert r["sizing_used"] is False
          assert r["leverage_used"] is False
          assert r["compounding_used"] is False
          assert r["capital_weighting_used"] is False
          assert r["volume_agnostic"] is True
          assert r["r_role"] == "post_trade_evaluation_only"
          g=x["governance"]
          assert g["pure_market_exit_uses_runtime_r_thresholds"] is False
          assert g["pure_market_exit_stop_moves"] == 0
          assert g["r_computed_for_evaluation_only"] is True
          assert g["opens_new_holdout"] is False
          assert g["live_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-pure-market-exit-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-pure-market-exit-*-${{ github.sha }}
          path: input
          merge-multiple: true

      - name: Aggregate legacy vs pure-market execution
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          folds=("r5","r6","r8","consumed")
          variants=("LEGACY_3R_BE","PURE_MARKET_EXIT")
          payloads={
              f:json.loads(Path(f"input/pure-market-{f}.json").read_text())
              for f in folds
          }
          def d(v): return Decimal(str(v))

          summary={}
          for v in variants:
              summary[v]={}
              for f in folds:
                  r=payloads[f]["variant_reports"][v]
                  summary[v][f]={
                      "terminal_count":r["terminal_count"],
                      "metrics":r["normalized_metrics"],
                      "winner_preservation":r["winner_preservation_vs_legacy"],
                      "side_metrics":r["side_metrics"],
                      "halfyear_metrics":r["halfyear_metrics"],
                      "entry_family_metrics":r["entry_family_metrics"],
                      "exit_reasons":r["exit_reasons"],
                  }

          deltas={}
          for f in folds:
              b=summary["LEGACY_3R_BE"][f]["metrics"]
              p=summary["PURE_MARKET_EXIT"][f]["metrics"]
              deltas[f]={
                  "pf_delta":(
                      None
                      if b["profit_factor"] is None or p["profit_factor"] is None
                      else format(d(p["profit_factor"])-d(b["profit_factor"]),"f")
                  ),
                  "mean_r_delta":format(d(p["mean_r"])-d(b["mean_r"]),"f"),
                  "total_r_delta":format(d(p["total_r"])-d(b["total_r"]),"f"),
                  "dd_delta":format(d(p["max_drawdown_r"])-d(b["max_drawdown_r"]),"f"),
              }

          report={
              "schema":"qore.vt31.nas100.pure_market_exit_baseline.aggregate.v1",
              "head":"${{ github.sha }}",
              "summary":summary,
              "pure_minus_legacy":deltas,
              "sovereign_conclusion":{
                  "legacy_3r_breakeven_certification_authority":False,
                  "pure_market_exit_runtime_r_authority":False,
                  "r_role":"post_trade_evaluation_only",
                  "volume_agnostic":True,
              },
              "governance":{
                  "consumed_evidence_only":True,
                  "fresh_holdout_opened":False,
                  "policy_promoted":False,
                  "candidate_certified":False,
                  "live_authorized":False,
              },
          }
          Path("result/aggregate.json").write_text(
              json.dumps(report,sort_keys=True,indent=2)+"\n"
          )
          print(json.dumps(report,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-pure-market-exit-aggregate-${{ github.sha }}
          path: result/
          retention-days: 90
