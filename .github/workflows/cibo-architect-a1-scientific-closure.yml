name: QORE CIBO Architect A1 Scientific Closure

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-architect-a1-scientific-closure.yml'
      - 'src/qore/infrastructure/cibo_arch_a1_scientific_closure.py'
      - 'tests/infrastructure/test_cibo_arch_a1_scientific_closure.py'
      - 'src/qore/infrastructure/cibo_arch_a_internal_readiness.py'
      - 'src/qore/infrastructure/cibo_a1_scientific_disposition.py'
      - 'docs/research/CIBO-ARCH-A1-SCIENTIFIC-CLOSURE-V1.md'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  architect-a1-scientific-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Architect A1 scientific closure contract
        run: |
          ruff check \
            src/qore/infrastructure/cibo_arch_a1_scientific_closure.py \
            tests/infrastructure/test_cibo_arch_a1_scientific_closure.py
          mypy \
            src/qore/infrastructure/cibo_arch_a1_scientific_closure.py
          python -m py_compile \
            src/qore/infrastructure/cibo_arch_a1_scientific_closure.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_arch_a1_scientific_closure.py
