name: QORE Turtle Soup XAUUSD R26 Specialist Memory Brain

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-xauusd-specialist-memory-v1-001
    paths:
      - '.github/workflows/turtle-soup-xauusd-r26-specialist-memory-brain.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r26_specialist_memory_brain.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r26_specialist_memory_brain.py'

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-XAUUSD-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-XAUUSD-2f510461b3360e91d5ee70a72716a76cd6561f16'
  SPECIALIST_RUN_ID: '35304421155'
  SPECIALIST_MEMORY_SHA: '8a5c174e854400c54d7849cc29ba3a4d357afdbb'
  R26_CODE_SHA: '559383b993b5721641cd410098b9c2f438c92425'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.R26_CODE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check --ignore E501,I001 \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r26_specialist_memory_brain.py \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r26_specialist_memory_brain.py
      - name: Mypy focused gate
        run: |
          mypy --disable-error-code attr-defined \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r26_specialist_memory_brain.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r26_specialist_memory_brain.py

  replay-2y:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.R26_CODE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable XAUUSD raw master
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download immutable Target Destination V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Download exact specialist memory artifact
        uses: actions/download-artifact@v4
        with:
          name: qore-turtle-soup-xauusd-specialist-memory-v1-${{ env.SPECIALIST_MEMORY_SHA }}
          path: specialist-memory
          github-token: ${{ github.token }}
          run-id: ${{ env.SPECIALIST_RUN_ID }}
      - name: Run R26 specialist-memory 2Y replay
        run: |
          mkdir -p r26-output
          python -m qore.infrastructure.trader_lab.turtle_soup_xauusd_r26_specialist_memory_brain \
            source-xauusd target-xauusd specialist-memory r26-output \
            > r26-output/stdout.json
          printf '%s\n' "$GITHUB_SHA" > r26-output/git-sha.txt
      - name: Enforce specialist decision contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('r26-output/r26-specialist-memory-brain-report.json').read_text())
          assert p['identity']=='TURTLE_SOUP_XAUUSD_R26_SPECIALIST_MEMORY_BRAIN_V1'
          assert p['window']['open']=='2024-09-17T00:00:00+00:00'
          assert p['window']['close']=='2026-09-17T00:00:00+00:00'
          d=p['decision_sources']
          assert d['master_memory_remains_immutable'] is True
          assert d['r22_memory_used'] is False
          assert d['r23_memory_used'] is False
          assert d['r25_result_used'] is False
          c=p['decision_contract']
          assert c['context_only_can_authorize'] is False
          assert c['actual_strategy_entry'] is True
          assert c['exact_protected_swing'] is True
          assert c['target_from_active_cibo_dol_ladder'] is True
          g=p['governance']
          assert g['fresh_holdout_consumed'] is False
          assert g['candidate_promoted'] is False
          assert g['live_authorized'] is False
          assert g['real_capital_authorized'] is False
          PY
      - name: Hash immutable R26 result
        run: |
          cd r26-output
          sha256sum \
            r26-specialist-memory-brain-report.json \
            r26-specialist-memory-brain-trades.json \
            stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-xauusd-r26-specialist-memory-${{ env.R26_CODE_SHA }}
          path: r26-output
          if-no-files-found: error
          retention-days: 90
