name: QORE CIBO Final Integrated Exam Source Truth Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/qore/infrastructure/cibo_final_integrated_exam_source_truth_audit.py'
      - 'tests/infrastructure/test_cibo_final_integrated_exam_source_truth_audit.py'
      - '.github/workflows/cibo-final-integrated-exam-source-truth-audit.yml'

permissions:
  contents: read

jobs:
  source-truth-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Deterministic P1 repository audit
        run: |
          ruff check \
            src/qore/infrastructure/cibo_final_integrated_exam_source_truth_audit.py \
            tests/infrastructure/test_cibo_final_integrated_exam_source_truth_audit.py
          mypy \
            src/qore/infrastructure/cibo_final_integrated_exam_source_truth_audit.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_final_integrated_exam_source_truth_audit.py
