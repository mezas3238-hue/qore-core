name: QORE Scalper A1 Real Native Source Clock Bound Perception Nine Markets V2

on:
  push:
    branches: [agent/scalper-architect-a-cognition-20261010]
    paths:
      - '.github/workflows/qore-scalper-a1-native-clock-bound-nine-perception-v2.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_a1_native_clock_bound_perception_v2.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_a1_native_clock_bound_perception_v2.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  WORLD_RUN: '38080367716'
  WORLD_SHA: '435e2369f1ed94d7130d328115d2402dcd4e5b84'
  CLOCK_RUN: '38091938032'
  CLOCK_SHA: '532f8a683a4181c85a07d071c7a2c22818d9b0aa'

jobs:
  physically_bound_perceptions:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Verify clock cannot invent fresh BID ASK or full market knowledge
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_a1_native_clock_bound_perception_v2.py tests/infrastructure/trader_lab/test_capitalizer_a1_native_clock_bound_perception_v2.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_a1_native_clock_bound_perception_v2.py tests/infrastructure/trader_lab/test_capitalizer_a1_native_clock_bound_perception_v2.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_a1_native_clock_bound_perception_v2.py
      - uses: actions/download-artifact@v4
        with:
          pattern: scalper-a1-native-nine-world-*-${{ env.WORLD_SHA }}
          path: nine-native-m1
          github-token: ${{ github.token }}
          run-id: ${{ env.WORLD_RUN }}
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          name: scalper-a1-original-source-session-clock-9market-${{ env.CLOCK_SHA }}
          path: source-clocks
          github-token: ${{ github.token }}
          run-id: ${{ env.CLOCK_RUN }}
      - name: Join all 2876 original clock-source witnesses to 2822 native nine-market barriers
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_a1_native_clock_bound_perception_v2 nine-native-m1 source-clocks results
      - name: Verify all source identities retained and never fake GOOD readiness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("results/scalper-a1-source-clock-bound-perception-summary.json").read_text())
          c=d["counts"]
          assert d["markets"]==9 and d["original_source_ids"]==2876
          assert d["decision_barriers"]==2822 and d["total_perceptions"]==25398
          assert c["NATIVE_EXACT_NINE:True"]==2791
          assert c["NATIVE_EXACT_NINE:False"]==31
          assert c["PERCEPTION:DEGRADED"]>0
          assert c.get("PERCEPTION:GOOD",0)==0
          assert c["PERCEPTION:BAD"]+c["PERCEPTION:DEGRADED"]==25398
          assert d["source_entries_filtered"]==0
          assert not any(d[k] for k in (
            "quote_and_microstructure_attested", "author_killzone_attested",
            "regime_supported", "cross_market_causality_attested",
            "portfolio_ledger_rebuilt", "full_master_frame_replayed",
            "live_authorized"))
          assert d["cognitive_pf"] is None and d["cognitive_drawdown_r"] is None
          print("NATIVE CLOCK-BOUND PERCEPTION:",json.dumps(d,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-a1-9market-clock-bound-perceptions-${{ github.sha }}
          path: results/
          if-no-files-found: error
          retention-days: 90
