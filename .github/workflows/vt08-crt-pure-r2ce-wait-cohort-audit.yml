name: QORE VT08 CRT PURE R2-CE WAIT Cohort Audit

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vt08-crt-pure-source-identity-001
    paths:
      - '.github/workflows/vt08-crt-pure-r2ce-wait-cohort-audit.yml'
      - 'src/qore/infrastructure/trader_lab/vt08_crt_pure_r2ce_wait_cohort_alignment.py'
      - 'tests/infrastructure/trader_lab/test_vt08_crt_pure_r2ce_wait_cohort_alignment.py'

permissions:
  contents: read

env:
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
  QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,ctrader]'
      - name: Quality and pure accounting tests
        run: |
          ruff check src/qore/infrastructure/trader_lab/vt08_crt_pure_r2ce_wait_cohort_alignment.py tests/infrastructure/trader_lab/test_vt08_crt_pure_r2ce_wait_cohort_alignment.py
          mypy src/qore/infrastructure/trader_lab/vt08_crt_pure_r2ce_wait_cohort_alignment.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_vt08_crt_pure_r2ce_wait_cohort_alignment.py

  historical_replay:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        market: [AUDUSD, USDJPY]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[ctrader]'
      - name: Historical data account discovery (read-only)
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            echo "::add-mask::$account_id"
            printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          fi
      - name: Run R2-CE read-only historical replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "artifacts/${{ matrix.market }}"
          python -m qore.infrastructure.trader_lab.vt08_crt_pure_r2ce_wait_cohort_alignment "artifacts/${{ matrix.market }}" --market "${{ matrix.market }}" | tee "artifacts/${{ matrix.market }}/stdout.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-r2ce-${{ matrix.market }}-${{ github.sha }}
          path: artifacts/${{ matrix.market }}
          if-no-files-found: warn
          retention-days: 90
