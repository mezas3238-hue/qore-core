name: VT08 Index R12 Contextual Management

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r12-contextual-management.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r12_contextual_management.py
      - tests/infrastructure/trader_lab/test_vt08_index_r12_contextual_management.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r12_contextual_management.py

  replay:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R12 contextual management replay
        run: |
          python -m qore.infrastructure.trader_lab.vt08_index_r12_contextual_management             --nas100-root artifacts/NAS100             --sp500-root artifacts/SP500             --us30-root artifacts/US30             --out artifacts/report/vt08-index-r12-contextual-management.json

      - name: Verify governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(Path("artifacts/report/vt08-index-r12-contextual-management.json").read_text())
          assert report["identity"] == "VT08_INDEX_R12_CONTEXTUAL_MANAGEMENT_001"
          assert report["pair_count"] == 18
          assert report["execution_architecture"] == "VT08_INDEX_R8_PRIORITY_POI_REARM_RESET_001"
          g=report["governance"]
          assert g["pre_entry_context_only"] is True
          assert g["bounded_management_pairs"] is True
          assert g["stop_widening_allowed"] is False
          assert g["fresh_holdout_claim"] is False
          assert g["candidate_promoted"] is False
          assert g["live_authorized"] is False
          assert g["real_capital_authorized"] is False
          assert g["production_authorized"] is False
          PY

      - name: Build summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path("artifacts/report")
          r=json.loads((root/"vt08-index-r12-contextual-management.json").read_text())
          lines=[
              "# VT08 INDEX R12 Contextual Management",
              "",
              f"- pairs: {r['pair_count']}",
              f"- goal candidates: {r['goal_candidate_count']}",
              "",
          ]
          for row in r["top_10"]:
              p=row["primary"]
              s=row["secondary"]
              pair=row["pair"]
              lines += [
                  f"## {pair['pair_id']}",
                  f"- trades: {row['sample']}",
                  f"- strong/weak: {row['strong_trade_count']} / {row['weak_trade_count']}",
                  f"- rearm: {row['rearm_trade_count']}",
                  f"- PF05: {p['profit_factor']}",
                  f"- DD05: {p['max_drawdown_r']}R",
                  f"- total05: {p['total_r']}R",
                  f"- PF10: {s['profit_factor']}",
                  f"- DD10: {s['max_drawdown_r']}R",
                  f"- positive years: {row['positive_years']}",
                  f"- goal pass: {row['goal_pass']}",
                  "",
              ]
          (root/"VT08_INDEX_R12_CONTEXTUAL_MANAGEMENT_SUMMARY.md").write_text("\n".join(lines)+"\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-index-r12-contextual-management-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
