name: VT08 Index R106 Standard Causal Demotion Ablation

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r106-standard-causal-demotion-ablation.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r106_standard_causal_demotion_ablation.py
      - tests/infrastructure/trader_lab/test_vt08_index_r106_standard_causal_demotion_ablation.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r106_standard_causal_demotion_ablation.py

  forensics:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R106 causal demotion ablation
        run: |
          mkdir -p artifacts/report
          python -m qore.infrastructure.trader_lab.vt08_index_r106_standard_causal_demotion_ablation \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r106-standard-causal-demotion-ablation.json

      - name: Verify R106 governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r106-standard-causal-demotion-ablation.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R106_STANDARD_CAUSAL_DEMOTION_ABLATION_001"
          )
          assert report["source_r105"]["run_id"] == 35556744176
          assert report["source_r105"]["artifact_id"] == 10620118359
          assert report["source_r105"]["artifact_digest"] == (
              "sha256:6a81182ff3e710509b755cad94cb84f1901adfdb02aa706a444c7591fe1df381"
          )
          assert report["base_policy_id"] == "EXPLICIT_FULL_R58_STANDARD_BASE"
          assert report["positive_risk_floor_r"] == "0.005"
          assert report["five_year"]["sample"] == 2448
          assert report["recent_two_year"]["sample"] == 1017
          assert report["r66_failed_holdout"]["sample"] == 773
          assert report["five_year"]["standard_sample"] == 1756
          assert report["recent_two_year"]["standard_sample"] == 746
          assert report["r66_failed_holdout"]["standard_sample"] == 546
          assert report["decision"] == (
              "R106_STANDARD_CAUSAL_DEMOTION_ABLATION_COMPLETE_NO_CANDIDATE_SELECTED"
          )

          gov = report["governance"]
          assert gov["forensics_only"] is True
          assert gov["bounded_single_feature_ablation"] is True
          assert gov["combination_search_used"] is False
          assert gov["variant_auto_selected"] is False
          assert gov["r66_consumed_failure_evidence"] is True
          assert gov["fresh_holdout_claim"] is False
          assert gov["signals_suppressed"] is False
          assert gov["entries_changed"] is False
          assert gov["stops_changed"] is False
          assert gov["targets_changed"] is False
          assert gov["released_risk_reallocated"] is False
          assert gov["new_risk_constant"] is False
          assert gov["candidate_created"] is False
          assert gov["trader_certified"] is False
          assert gov["live_authorized"] is False
          assert gov["real_capital_authorized"] is False
          assert gov["production_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r106-standard-causal-demotion-ablation-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
