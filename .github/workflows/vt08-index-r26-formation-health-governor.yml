name: VT08 Index R26 Formation Health Governor

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r26-formation-health-governor.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r26_formation_health_governor.py
      - tests/infrastructure/trader_lab/test_vt08_index_r26_formation_health_governor.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r26_formation_health_governor.py

  research:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R26 formation-health governor
        run: |
          python -m qore.infrastructure.trader_lab.vt08_index_r26_formation_health_governor \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r26-formation-health-governor.json

      - name: Verify governance and owner architecture
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          r=json.loads(Path("artifacts/report/vt08-index-r26-formation-health-governor.json").read_text())
          assert r["identity"] == "VT08_INDEX_R26_FORMATION_HEALTH_GOVERNOR_001"
          assert r["sample"] == 1574
          c=r["fixed_contract"]
          assert c["global_single_position_rule"] is False
          assert c["signal_suppression_allowed"] is False
          assert c["zero_risk_allowed"] is False
          assert c["opportunity_architecture_changed"] is False
          assert c["target_changed"] is False
          assert c["stop_changed"] is False
          assert c["rearm_changed"] is False
          g=r["governance"]
          assert g["calendar_or_year_feature_used"] is False
          assert g["tier_health_uses_only_prior_completed_raw_outcomes"] is True
          assert g["same_timestamp_signals_share_pre_batch_memory"] is True
          assert g["future_outcome_used_for_current_authorization"] is False
          assert g["all_trades_preserved"] is True
          assert g["cross_market_concurrency_preserved"] is True
          assert g["live_authorized"] is False
          assert g["real_capital_authorized"] is False
          assert g["production_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-index-r26-formation-health-governor-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
