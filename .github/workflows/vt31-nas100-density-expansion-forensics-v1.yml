name: QORE VT31 NAS100 Density Expansion Forensics V1

on:
  push:
    branches:
      - agent/vt31-nas100-intelligence-pilot-001
    paths:
      - scripts/vt31_nas100_density_expansion_forensics_v1.py
      - scripts/vt31_nas100_specialist_r1_candidate.py
      - src/qore/infrastructure/traders/vt31_nas100_*.py
      - .github/workflows/vt31-nas100-density-expansion-forensics-v1.yml
  workflow_dispatch:

concurrency:
  group: vt31-nas100-density-expansion-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
          - partition: r6
            artifact_id: "10389112524"
          - partition: r8_fresh
            artifact_id: "10402199719"
    env:
      GH_TOKEN: ${{ github.token }}
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research runtime
        run: pip install -e ".[dev]"

      - name: Static density lab gate
        run: |
          set -euo pipefail
          ruff check scripts/vt31_nas100_density_expansion_forensics_v1.py
          python scripts/vt31_nas100_specialist_r1_candidate.py --self-test

      - name: Recover immutable consumed fold
        run: |
          set -euo pipefail
          mkdir -p evidence
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d evidence
          test -f evidence/fresh/NAS100/market-evidence.json
          test -f evidence/SHA256SUMS
          (cd evidence && sha256sum -c SHA256SUMS)

      - name: Enumerate causal opportunity density
        run: |
          set -euo pipefail
          mkdir -p result
          python scripts/vt31_nas100_density_expansion_forensics_v1.py             evidence/fresh/NAS100/market-evidence.json             --output "result/density-${PARTITION}.json"             | tee result/summary.json

      - name: Governance gate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = os.environ["PARTITION"]
          payload = json.loads(Path(f"result/density-{p}.json").read_text())
          g = payload["governance"]
          assert payload["market"] == "NAS100"
          assert g["consumed_evidence_only"] is True
          assert g["operating_policy_selection_allowed"] is False
          assert g["strategy_identity_changed"] is False
          assert g["opens_new_holdout"] is False
          assert g["live_authorized"] is False
          assert g["production_authorized"] is False
          assert payload["density_ceiling_one_terminal_per_day"] <= (
              payload["day_counts"]["complete_day"]
          )
          PY

      - name: Bind fold result
        run: |
          set -euo pipefail
          echo "$GITHUB_SHA" > result/git-sha.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd result && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-density-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-nas100-density-*-${{ github.sha }}
          path: density-input
          merge-multiple: true

      - name: Build density feasibility report
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from pathlib import Path

          rows = []
          for path in sorted(Path("density-input").glob("density-*.json")):
              payload = json.loads(path.read_text())
              rows.append({
                  "file": path.name,
                  "first_opened_at": payload["evidence"]["first_opened_at"],
                  "last_closed_at": payload["evidence"]["last_closed_at"],
                  "market_days": payload["market_days"],
                  "complete_days": payload["day_counts"]["complete_day"],
                  "days_with_source": payload["day_counts"].get(
                      "day_with_source", 0
                  ),
                  "days_with_executable_episode": payload["day_counts"].get(
                      "day_with_executable_episode", 0
                  ),
                  "unique_executable_episodes": payload[
                      "unique_executable_episode_count"
                  ],
                  "terminal_counterfactual_episodes": payload[
                      "terminal_counterfactual_episode_count"
                  ],
                  "one_terminal_per_day_ceiling": payload[
                      "density_ceiling_one_terminal_per_day"
                  ],
                  "current_execute_one_per_day": payload[
                      "current_execute_one_terminal_per_day"
                  ],
                  "one_per_day_ceiling_metrics": payload[
                      "one_terminal_per_day_ceiling_metrics"
                  ],
                  "current_execute_metrics": payload[
                      "current_execute_one_per_day_metrics"
                  ],
              })
          assert len(rows) == 3, rows
          target_low = 250
          target_high = 300
          report = {
              "schema": "qore.vt31.nas100.density_feasibility.v1",
              "target_trades_per_2y": [target_low, target_high],
              "folds": rows,
              "all_folds_one_per_day_ceiling_at_least_250": all(
                  row["one_terminal_per_day_ceiling"] >= target_low
                  for row in rows
              ),
              "all_folds_current_execute_at_least_250": all(
                  row["current_execute_one_per_day"] >= target_low
                  for row in rows
              ),
              "interpretation": (
                  "If one-per-day ceiling is below 250, Strategy/Opportunity "
                  "Generation must expand before filters can satisfy density. "
                  "If ceiling is >=250 but current execute is low, the primary "
                  "problem is reasoning/management selection."
              ),
              "operating_policy_selection_allowed": False,
              "opens_new_holdout": False,
              "live_authorized": False,
              "production_authorized": False,
          }
          Path("result/density-feasibility.json").write_text(
              json.dumps(report, sort_keys=True, indent=2) + "\n"
          )
          print(json.dumps(report, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-density-feasibility-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
