name: QORE Shared A X01 X02 X03 Opportunity Surface

concurrency:
  group: qore-shared-a-x01-x02-x03-opportunity-surface
  cancel-in-progress: false

on:
  push:
    branches:
      - agent/shared-a-cognitive-science-001
    paths:
      - src/qore/infrastructure/core_stack_v2/shared_opportunity_surface.py
      - tests/infrastructure/test_core_stack_v2_shared_opportunity_surface.py
      - .github/workflows/qore-shared-a-x01-x02-x03-opportunity-surface.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate opportunity surface cognition
        run: |
          ruff check src/qore/infrastructure/core_stack_v2/shared_opportunity_surface.py tests/infrastructure/test_core_stack_v2_shared_opportunity_surface.py
          mypy src/qore/infrastructure/core_stack_v2/shared_opportunity_surface.py
          pytest -q tests/infrastructure/test_core_stack_v2_shared_opportunity_surface.py
