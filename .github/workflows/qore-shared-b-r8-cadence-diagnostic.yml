name: QORE Shared B R8 Empirical Cadence Diagnostic

on:
  push:
    branches:
      - agent/shared-b-global-world-perception-001
    paths:
      - src/qore/infrastructure/core_stack_v2/shared_b_r8_cadence_diagnostic.py
      - scripts/shared_b_r8_cadence_diagnostic.py
      - tests/infrastructure/test_shared_b_r8_cadence_diagnostic.py
      - .github/workflows/qore-shared-b-r8-cadence-diagnostic.yml
  workflow_dispatch:

concurrency:
  group: qore-shared-b-r8-cadence-diagnostic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  RAW_RUN_ID: "36746337433"
  RAW_ARTIFACT_ID: "11113260581"
  RAW_GIT_SHA: "80c83baf2538195e2c8ece17e286e80603aae571"

jobs:
  cadence-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Shared
        run: pip install -e ".[dev]"

      - name: Validate cadence diagnostic reducer
        run: |
          set -euo pipefail
          ruff check \
            src/qore/infrastructure/core_stack_v2/shared_b_r8_cadence_diagnostic.py \
            scripts/shared_b_r8_cadence_diagnostic.py \
            tests/infrastructure/test_shared_b_r8_cadence_diagnostic.py
          mypy \
            src/qore/infrastructure/core_stack_v2/shared_b_r8_cadence_diagnostic.py \
            scripts/shared_b_r8_cadence_diagnostic.py
          pytest -q tests/infrastructure/test_shared_b_r8_cadence_diagnostic.py

      - name: Verify exact sealed B-03 raw lineage
        run: |
          set -euo pipefail
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RAW_RUN_ID}" --jq '.status')" = "completed"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RAW_RUN_ID}" --jq '.conclusion')" = "success"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RAW_RUN_ID}" --jq '.head_sha')" = "$RAW_GIT_SHA"

      - name: Recover sealed R8 raw checkpoints
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RAW_ARTIFACT_ID}/zip" > raw.zip
          unzip -q raw.zip -d input
          (cd input && sha256sum -c SHA256SUMS)
          test -f input/shared-b-cross-asset-raw-manifest.json
          test -d input/US2000/data
          test -d input/XAUUSD/data
          test -d input/XTIUSD/data

      - name: Build empirical cadence diagnostic
        run: |
          python scripts/shared_b_r8_cadence_diagnostic.py \
            --raw-root input \
            --raw-manifest input/shared-b-cross-asset-raw-manifest.json \
            --output result/shared-b-r8-cadence-diagnostic.json \
            | tee result/summary.json

      - name: Enforce descriptive-only temporal evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(
              Path("result/shared-b-r8-cadence-diagnostic.json").read_text()
          )
          assert p["identity"] == "SHARED_B_R8_EMPIRICAL_CADENCE_DIAGNOSTIC_001"
          assert p["status"] == "EMPIRICAL_CADENCE_DIAGNOSTIC_ONLY"
          assert p["sensor_count"] == 3
          assert p["sensor_side_count"] == 6
          assert tuple(p["checkpoint_indices"]) == (0, 736, 1473, 2210, 2947)
          assert p["cadence_policy_registry_frozen"] is False
          assert p["stale_thresholds_frozen"] is False
          assert p["liquidity_thresholds_frozen"] is False
          assert p["temporal_skew_thresholds_frozen"] is False
          assert p["comparability_thresholds_frozen"] is False
          assert p["global_threshold_extrapolation_authorized"] is False
          assert p["relational_comparability_authorized"] is False
          assert p["target_or_outcome_read"] is False
          assert p["r6_r5_read"] is False
          assert p["fresh_holdout_opened"] is False
          assert p["broker_mutation"] is False
          assert p["productive_authority"] is False
          assert p["b08_complete"] is False
          assert len(p["diagnostic_fingerprint_sha256"]) == 64
          PY

      - name: Seal B-08 cadence diagnostic evidence
        run: |
          printf '%s\n' "$GITHUB_SHA" > result/code-git-sha.txt
          printf '%s\n' "$GITHUB_RUN_ID" > result/run-id.txt
          printf '%s\n' "$RAW_RUN_ID" > result/source-run-id.txt
          printf '%s\n' "$RAW_ARTIFACT_ID" > result/source-artifact-id.txt
          (
            cd result
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
              | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload B-08 cadence diagnostic
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: qore-shared-b-r8-cadence-diagnostic-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Report B-08 cadence diagnostic frontier
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          gh issue comment 638 --repo "$GITHUB_REPOSITORY" --body "Architect B B-08 R8 empirical cadence diagnostic: run ${GITHUB_RUN_ID}, SHA ${GITHUB_SHA}, artifact ${ARTIFACT_ID}. Replayed the sealed B-03 raw checkpoints for US2000/XAUUSD/XTIUSD across FIRST/Q1/MID/Q3/LAST and measured provider-event inter-arrival distributions per BID/ASK side. This is descriptive evidence only: cadence/stale/liquidity/skew/comparability thresholds remain UNFROZEN, global extrapolation remains forbidden, relational authority remains CLOSED, and no outcome/R6/R5/fresh-holdout/broker state was opened."
