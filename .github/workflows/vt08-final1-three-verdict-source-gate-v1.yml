name: VT08 FINAL1 Three Verdict Source Adjudication Gate

on:
  push:
    branches:
      - agent/vt08-5m-methodology-source-20261010
    paths:
      - .github/workflows/vt08-final1-three-verdict-source-gate-v1.yml
      - src/qore/infrastructure/trader_lab/vt08_a_final1_three_verdict_author_fidelity_gate_v1.py
      - tests/infrastructure/trader_lab/test_vt08_a_final1_three_verdict_author_fidelity_gate_v1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Ruff and adversarial three-verdict decisions
        run: |
          ruff check src/qore/infrastructure/trader_lab/vt08_a_final1_three_verdict_author_fidelity_gate_v1.py tests/infrastructure/trader_lab/test_vt08_a_final1_three_verdict_author_fidelity_gate_v1.py
          pytest -q tests/infrastructure/trader_lab/test_vt08_a_final1_three_verdict_author_fidelity_gate_v1.py
      - name: Honest PRE-TRIAL status with all unapproved authority selectors D
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json
          from pathlib import Path
          from qore.infrastructure.trader_lab.vt08_a_final1_three_verdict_author_fidelity_gate_v1 import (
              Final1Preflight,
              final1_decision,
          )
          preflight=Final1Preflight(
              receipts=(),
              validation_evidence=frozenset(),
          )
          decision=final1_decision(
              source=preflight,source_adjudication_closed=False,
              economic=None,
          )
          payload={
              "schema":"qore.vt08.final1.pretrial_readiness_v1",
              "status":decision.status.value,
              "reasons":decision.reasons,
              "source_adjudication_closed":False,
              "source_rules_author_verified_by_this_CI":False,
              "market_data_read":False,
              "independent_economic_trial_run":False,
              "signed_manifest_present":False,
              "sealed_7y_touched":False,
              "vps_touched":False,
              "author_profit_factor_claimed":False,
          }
          Path("evidence/vt08-final1-pretrial-not-run.json").write_text(
              json.dumps(payload,indent=2,sort_keys=True),
              encoding="utf-8"
          )
          print(json.dumps(payload,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vt08-final1-source-readiness-no-holdout-${{ github.sha }}
          path: evidence/*
          retention-days: 30
          if-no-files-found: error
