name: QORE CIBO Architect2 T11 Market Impact V3

on:
  push:
    branches:
      - agent/cibo-external-scientific-closure-001
    paths:
      - 'docs/research/CIBO-ARCH2-T11-V3-EXECUTION-TRIGGER.txt'

permissions:
  contents: read

concurrency:
  group: qore-cibo-arch2-t11-market-impact-v3
  cancel-in-progress: true

jobs:
  queue-seal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed against any additional V3 broker population
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path(
              "docs/research/CIBO-ARCH2-T11-V3-EXECUTION-TRIGGER.txt"
          ).read_text(encoding="utf-8").splitlines()
          assert lines == [
              "EXECUTE=CIBO_ARCH2_T11_MARKET_IMPACT_EXECUTION_CYCLE_V3",
              "QUEUE_SEAL=NO_ADDITIONAL_BROKER_POPULATION",
          ]
          print("T11 V3 queue sealed: no broker mutation authorized.")
          PY
