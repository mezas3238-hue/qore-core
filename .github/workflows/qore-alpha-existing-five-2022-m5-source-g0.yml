name: QORE Alpha Existing5 2022 Original M5 Reuse G0 No 7Y

on:
  push:
    branches:
      - research/qore-alpha-96-frozen-20261011
    paths:
      - .github/workflows/qore-alpha-existing-five-2022-m5-source-g0.yml
      - src/qore/infrastructure/trader_lab/qore_alpha_v1_five_existing_m5_source_reuse_gate.py
      - tests/infrastructure/trader_lab/test_qore_alpha_v1_five_existing_m5_source_reuse_gate.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-sha-g0:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - symbol: EURJPY
            source_run: 38193802541
            artifact: qore-native-icmarkets-10Y-provider-M5-EURJPY-e0ca5a13c866a19d8505c68cffc473598984b340
          - symbol: USDCHF
            source_run: 38193802541
            artifact: qore-native-icmarkets-10Y-provider-M5-USDCHF-e0ca5a13c866a19d8505c68cffc473598984b340
          - symbol: NZDUSD
            source_run: 38193802541
            artifact: qore-native-icmarkets-10Y-provider-M5-NZDUSD-e0ca5a13c866a19d8505c68cffc473598984b340
          - symbol: CADJPY
            source_run: 38193802541
            artifact: qore-native-icmarkets-10Y-provider-M5-CADJPY-e0ca5a13c866a19d8505c68cffc473598984b340
          - symbol: USDCAD
            source_run: 35166210458
            artifact: qore-cibo-market-atlas-10y-windowed-USDCAD-ab782b8e9f890f86a2b6500070f0556b4b685e3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Lint and test original native M5 archive anti-forgery contract
        run: |
          ruff check src/qore/infrastructure/trader_lab/qore_alpha_v1_five_existing_m5_source_reuse_gate.py tests/infrastructure/trader_lab/test_qore_alpha_v1_five_existing_m5_source_reuse_gate.py
          pytest -q tests/infrastructure/trader_lab/test_qore_alpha_v1_five_existing_m5_source_reuse_gate.py
      - name: Read EXACT ORIGINAL provider M5 GitHub artifact (no DEMO auth/no 7Y)
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          run-id: ${{ matrix.source_run }}
          github-token: ${{ github.token }}
          path: source-original
      - name: Verify source year 2022 and 2023 without M5 to M3 fake
        env:
          SYMBOL: ${{ matrix.symbol }}
          SOURCE_RUN: ${{ matrix.source_run }}
          SOURCE_ARTIFACT: ${{ matrix.artifact }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from qore.infrastructure.trader_lab.qore_alpha_v1_five_existing_m5_source_reuse_gate import (
              audit_existing_m5_source,
          )
          locations=list(Path("source-original").rglob("symbol-consumption-manifest.json"))
          if len(locations)!=1:
              raise ValueError("exactly one original provider M5 manifest is required")
          result=audit_existing_m5_source(locations[0].parent,symbol=os.environ["SYMBOL"])
          result["source_original_github_run"]=int(os.environ["SOURCE_RUN"])
          result["source_original_github_artifact_name"]=os.environ["SOURCE_ARTIFACT"]
          Path(f"artifacts/{os.environ['SYMBOL']}-2022-original-m5-sha.json").write_text(
              json.dumps(result,sort_keys=True,indent=2),encoding="utf-8"
          )
          print(json.dumps(result,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-alpha-existing5-native2022-M5-only-${{ matrix.symbol }}-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 90
