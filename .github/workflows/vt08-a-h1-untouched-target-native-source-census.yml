name: VT08 A H1 Untouched Target Native Source Census

on:
  push:
    branches:
      - agent/vt08-5m-methodology-source-20261010
    paths:
      - .github/workflows/vt08-a-h1-untouched-target-native-source-census.yml
      - src/qore/infrastructure/trader_lab/vt08_a_h1_untouched_high_source_witness_v1.py
      - tests/infrastructure/trader_lab/test_vt08_a_h1_untouched_high_source_witness_v1.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-only-observed-highs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        market: [EURJPY, USDCHF, NZDUSD, CADJPY, USDCAD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: No future, no gap imputation, no fabricated author target
        run: |
          ruff check src/qore/infrastructure/trader_lab/vt08_a_h1_untouched_high_source_witness_v1.py tests/infrastructure/trader_lab/test_vt08_a_h1_untouched_high_source_witness_v1.py
          pytest -q tests/infrastructure/trader_lab/test_vt08_a_h1_untouched_high_source_witness_v1.py
      - uses: actions/download-artifact@v4
        with:
          name: vt08-a-b-market-catalog-${{ matrix.market }}-f61b5e7a931e2c057a0660f4702f11d55ebc58af
          path: frozen/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 38740699499
      - uses: actions/download-artifact@v4
        with:
          name: qore-vt08-cognitive-5m-fresh-${{ matrix.market }}-b2d33e1b4829d8b4afc76983decca8a99131403c
          path: original/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 35934924907
      - name: Enumerate source H1 highs observable and untouched at each C3
        env:
          MARKET: ${{ matrix.market }}
        run: |
          mkdir -p evidence
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from qore.infrastructure.trader_lab.vt08_a_h1_untouched_high_source_witness_v1 import run_from_files
          market=os.environ["MARKET"]
          cats=list(Path("frozen",market).rglob(market+"-A-to-B-canonical-source-catalog.json"))
          if len(cats)!=1:
              raise SystemExit("missing frozen A/B physical source catalog")
          source=Path("original",market,"market-evidence-1095d.json")
          report=run_from_files(market,cats[0],source)
          expected={"EURJPY":538,"USDCHF":518,"NZDUSD":550,"CADJPY":516,"USDCAD":535}[market]
          if report["frozen_source_events"]!=expected:
              raise SystemExit("physical C2 source census drift")
          if report["source_complete_entries"] or report["broker_fills"]:
              raise SystemExit("false author/fill claim")
          dest=Path("evidence",market+"-h1-observed-untouched-witnesses.json")
          encoded=json.dumps(report,sort_keys=True,separators=(",",":"),allow_nan=False)
          dest.write_text(encoded,encoding="utf-8")
          print(json.dumps({
              "market":market,
              "source_events":report["frozen_source_events"],
              "H1_formed":report["observed_h1_highs_formed"],
              "H1_touched":report["observed_h1_highs_touched"],
              "source_gaps_resets":report["source_gap_resets"],
              "events_multiple_observed_levels":report["cases_multiple_observed_h1_highs"],
              "events_no_native_close":report["cases_missing_m15_at_c3_cutoff"],
              "source_complete_entries":report["source_complete_entries"],
              "Pnl":report["profit_factor"],
              "sha256":hashlib.sha256(encoded.encode("utf-8")).hexdigest(),
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vt08-a-h1-untouched-source-${{ matrix.market }}-${{ github.sha }}
          path: evidence/*.json
          if-no-files-found: error
          retention-days: 30
