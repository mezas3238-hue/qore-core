name: QORE VT31 NAS100 Causal Hybrid V1

on:
  push:
    branches:
      - agent/vt31-nas100-intelligence-pilot-001
    paths:
      - scripts/vt31_nas100_causal_hybrid_replay_v1.py
      - scripts/vt31_nas100_entry_intelligence_oco_lab_v1.py
      - scripts/vt31_nas100_specialist_r1_candidate.py
      - src/qore/infrastructure/traders/vt31_nas100_*.py
      - .github/workflows/vt31-nas100-causal-hybrid-v1.yml
  workflow_dispatch:

concurrency:
  group: vt31-nas100-causal-hybrid-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
          - partition: r6
            artifact_id: "10389112524"
          - partition: r8_fresh
            artifact_id: "10402199719"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Static causal gate
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_causal_hybrid_replay_v1.py
          ruff check scripts/vt31_nas100_causal_hybrid_replay_v1.py

      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir evidence
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d evidence
          test -f evidence/fresh/NAS100/market-evidence.json
          test -f evidence/SHA256SUMS
          (cd evidence && sha256sum -c SHA256SUMS)

      - name: Replay causal hybrid
        run: |
          set -euo pipefail
          mkdir result
          python scripts/vt31_nas100_causal_hybrid_replay_v1.py             evidence/fresh/NAS100/market-evidence.json             --output "result/causal-hybrid-${PARTITION}.json"             | tee result/summary.json

      - name: Causality and objective gate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = os.environ["PARTITION"]
          payload = json.loads(
              Path(f"result/causal-hybrid-{p}.json").read_text()
          )
          g = payload["governance"]
          assert g["date_level_core_nontrade_oracle_used"] is False
          assert g["secondary_authorized_only_from_causal_core_state"] is True
          assert g["secondary_fill_before_authorization_allowed"] is False
          assert g["post_outcome_field_used_for_entry"] is False
          assert g["opens_new_holdout"] is False
          assert payload["capital_policy"]["one_selected_position_per_market_day"] is True
          print(json.dumps({
              "partition": p,
              "trades": payload["trade_count"],
              "core": payload["core_trade_count"],
              "secondary": payload["secondary_trade_count"],
              "metrics": payload["capital_weighted_metrics"],
              "mc": payload["monte_carlo"],
              "gates": payload["development_gates"],
              "passes": payload["passes_development_gates"],
          }, sort_keys=True))
          PY

      - name: Bind result
        run: |
          set -euo pipefail
          echo "${GITHUB_SHA}" > result/git-sha.txt
          echo "${ARTIFACT_ID}" > result/evidence-artifact.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd result && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-causal-hybrid-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-nas100-causal-hybrid-*-${{ github.sha }}
          path: input
          merge-multiple: true

      - name: Aggregate causal objective
        run: |
          set -euo pipefail
          mkdir result
          python - <<'PY'
          import json
          from pathlib import Path

          rows=[]
          for path in sorted(Path("input").glob("causal-hybrid-*.json")):
              p=json.loads(path.read_text())
              rows.append({
                  "file": path.name,
                  "trade_count": p["trade_count"],
                  "metrics": p["capital_weighted_metrics"],
                  "mc": p["monte_carlo"],
                  "gates": p["development_gates"],
                  "passes": p["passes_development_gates"],
              })
          assert len(rows)==3, rows
          report={
              "schema":"qore.vt31.nas100.causal_hybrid_cross_fold.v1",
              "folds":rows,
              "all_folds_250_300": all(250 <= r["trade_count"] <= 300 for r in rows),
              "all_folds_pf_ge_2": all(float(r["metrics"]["profit_factor"]) >= 2 for r in rows),
              "all_folds_dd_le_10": all(float(r["metrics"]["max_drawdown_r"]) <= 10 for r in rows),
              "all_folds_causal": True,
              "all_folds_pass": all(r["passes"] for r in rows),
              "live_authorized": False,
              "production_authorized": False,
          }
          Path("result/cross-fold.json").write_text(
              json.dumps(report,sort_keys=True,indent=2)+"\n"
          )
          print(json.dumps(report,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-causal-hybrid-cross-fold-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
