name: QORE CIBO Next Policy Code Bundle Lineage

on:
  push:
    branches:
      - agent/cibo-phase22-next-exam-governance-001
      - agent/cibo-next-policy-sovereign-integration-001
    paths:
      - 'src/qore/infrastructure/cibo_next_policy_code_bundle_lineage.py'
      - 'tests/infrastructure/test_cibo_next_policy_code_bundle_lineage.py'
      - '.github/workflows/cibo-next-policy-code-bundle-lineage.yml'

permissions:
  contents: read

jobs:
  lineage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Static quality
        run: |
          python -m ruff check \
            src/qore/infrastructure/cibo_next_policy_code_bundle_lineage.py \
            tests/infrastructure/test_cibo_next_policy_code_bundle_lineage.py
      - name: Verify exact Git blob bundle
        run: |
          python -m pytest -q \
            tests/infrastructure/test_cibo_next_policy_code_bundle_lineage.py
      - name: Require assembly commit ancestry
        run: |
          python - <<'PY'
          from qore.infrastructure.cibo_next_policy_code_bundle_lineage import (
              ASSEMBLED_FROM_COMMIT,
          )
          print(ASSEMBLED_FROM_COMMIT)
          PY
          assembled="$(python - <<'PY'
          from qore.infrastructure.cibo_next_policy_code_bundle_lineage import (
              ASSEMBLED_FROM_COMMIT,
          )
          print(ASSEMBLED_FROM_COMMIT)
          PY
          )"
          git merge-base --is-ancestor "$assembled" HEAD
