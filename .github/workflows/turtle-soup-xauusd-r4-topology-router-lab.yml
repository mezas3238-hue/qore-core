name: QORE Turtle Soup XAUUSD R4 Topology Router Lab

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-xauusd-r3-forensics-001
    paths:
      - '.github/workflows/turtle-soup-xauusd-r4-topology-router-lab.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r4_topology_router_lab.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r4_topology_router_lab.py'

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-XAUUSD-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-XAUUSD-2f510461b3360e91d5ee70a72716a76cd6561f16'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check --ignore E501 \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r4_topology_router_lab.py \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r4_topology_router_lab.py
      - name: Mypy focused gate
        run: mypy --disable-error-code assignment --disable-error-code var-annotated src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r4_topology_router_lab.py
      - name: Focused tests
        run: pytest -q --no-cov tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r4_topology_router_lab.py

  lab:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download immutable consumed XAUUSD M5 corpus
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download immutable consumed XAUUSD Target Destination V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Execute topology-aware routing lab
        run: |
          mkdir -p r4-topology-output
          python -m qore.infrastructure.trader_lab.turtle_soup_xauusd_r4_topology_router_lab \
            source-xauusd target-xauusd r4-topology-output > r4-topology-output/stdout.json
          printf '%s\n' "$GITHUB_SHA" > r4-topology-output/git-sha.txt
      - name: Enforce research-only governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('r4-topology-output/topology-router-lab.json').read_text())
          assert p['identity']=='TURTLE_SOUP_XAUUSD_R4_TOPOLOGY_ROUTER_LAB_V1'
          assert set(p['variants'])=={'R4A_RAID','R4B_RAID_RECLAIM','R4C_RAID_RECLAIM_RISK'}
          assert p['governance']['fresh_holdout'] is False
          assert p['governance']['positive_score_trade_filter'] is False
          assert p['governance']['learned_abstention'] is False
          assert p['governance']['automatic_promotion_allowed'] is False
          assert p['governance']['live_authorized'] is False
          assert p['governance']['real_capital_authorized'] is False
          PY
      - name: Hash immutable lab result
        run: |
          cd r4-topology-output
          sha256sum topology-router-lab.json stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-xauusd-r4-topology-router-lab-${{ github.sha }}
          path: r4-topology-output
          if-no-files-found: error
          retention-days: 90
