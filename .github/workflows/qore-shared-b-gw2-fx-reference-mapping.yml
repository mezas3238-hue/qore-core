name: QORE Shared B GW2 FX Provider Reference Mapping

on:
  push:
    branches:
      - agent/shared-b-global-world-perception-001
    paths:
      - src/qore/infrastructure/core_stack_v2/shared_b_fx_reference_mapping.py
      - scripts/shared_b_gw2_fx_reference_mapping.py
      - tests/infrastructure/test_shared_b_fx_reference_mapping.py
      - .github/workflows/qore-shared-b-gw2-fx-reference-mapping.yml
  workflow_dispatch:

concurrency:
  group: qore-shared-b-gw2-fx-reference-mapping-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  GEN2_RUN_ID: "36623131862"
  GEN2_ARTIFACT_ID: "11059307341"
  GEN2_GIT_SHA: "f5fcd0c9552466132f6f47bb124805e49e774493"
  CNH_RUN_ID: "36746146407"
  CNH_ARTIFACT_ID: "11112587007"
  CNH_GIT_SHA: "0786b03ee42f1601242db111574ed7a0ac368b48"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Shared
        run: pip install -e ".[dev]"
      - name: Validate current FX reference mapping boundary
        run: |
          set -euo pipefail
          ruff check             src/qore/infrastructure/core_stack_v2/shared_b_fx_reference_mapping.py             scripts/shared_b_gw2_fx_reference_mapping.py             tests/infrastructure/test_shared_b_fx_reference_mapping.py
          mypy             src/qore/infrastructure/core_stack_v2/shared_b_fx_reference_mapping.py             scripts/shared_b_gw2_fx_reference_mapping.py
          pytest -q tests/infrastructure/test_shared_b_fx_reference_mapping.py

  map:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Shared
        run: pip install -e .

      - name: Verify sealed upstream lineages
        run: |
          set -euo pipefail
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GEN2_RUN_ID}" --jq '.status')" = "completed"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GEN2_RUN_ID}" --jq '.conclusion')" = "success"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GEN2_RUN_ID}" --jq '.head_sha')" = "$GEN2_GIT_SHA"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${CNH_RUN_ID}" --jq '.status')" = "completed"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${CNH_RUN_ID}" --jq '.conclusion')" = "success"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${CNH_RUN_ID}" --jq '.head_sha')" = "$CNH_GIT_SHA"

      - name: Recover provider schedule and CNH component closure
        run: |
          set -euo pipefail
          mkdir -p input/gen2 input/cnh result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${GEN2_ARTIFACT_ID}/zip" > gen2.zip
          unzip -q gen2.zip -d input/gen2
          (cd input/gen2/result && sha256sum -c SHA256SUMS)
          test "$(cat input/gen2/result/gen2-code-git-sha.txt)" = "$GEN2_GIT_SHA"
          test -f input/gen2/result/provider-schedule-catalog.json

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CNH_ARTIFACT_ID}/zip" > cnh.zip
          unzip -q cnh.zip -d input/cnh
          (cd input/cnh && sha256sum -c SHA256SUMS)
          test "$(cat input/cnh/code-git-sha.txt)" = "$CNH_GIT_SHA"
          test -f input/cnh/shared-b-gw2-cnh-component-identity.json

      - name: Resolve explicit mapping knowledge cutoff
        run: |
          set -euo pipefail
          known_at="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.created_at')"
          echo "MAPPING_KNOWN_AT=$known_at" >> "$GITHUB_ENV"

      - name: Build current observation FX reference mappings
        run: |
          set -euo pipefail
          python scripts/shared_b_gw2_fx_reference_mapping.py             --provider-schedule input/gen2/result/provider-schedule-catalog.json             --component-resolution input/cnh/shared-b-gw2-cnh-component-identity.json             --mapping-known-at "$MAPPING_KNOWN_AT"             --output result/shared-b-gw2-fx-provider-reference-mapping.json             | tee result/summary.json

      - name: Validate narrow mapping authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/shared-b-gw2-fx-provider-reference-mapping.json").read_text())
          assert p["identity"] == "SHARED_B_GW2_FX_PROVIDER_REFERENCE_MAPPING_001"
          assert p["status"] == "CURRENT_FX_PROVIDER_TO_REFERENCE_MAPPING_COMPLETE"
          assert p["provider_fx_symbol_count"] == 60
          assert p["mapped_provider_fx_symbol_count"] == 60
          assert len(p["mappings"]) == 60
          assert p["provider_symbol_to_reference_mapping_authorized"] is True
          assert p["mapping_authority_scope"] == "CURRENT_OBSERVATION_REFERENCE_ONLY"
          assert p["historical_pre_freeze_mapping_authorized"] is False
          assert p["canonical_tradable_identity_verified_count"] == 0
          assert p["listing_identity_verified_count"] == 0
          assert p["calendar_mapping_authorized"] is False
          assert p["relational_claims_authorized"] is False
          assert p["historical_market_data_read"] is False
          assert p["target_or_outcome_read"] is False
          assert p["r6_r5_read"] is False
          assert p["fresh_holdout_opened"] is False
          assert p["productive_authority"] is False
          assert all(
              row["mapping_scope"] == "CURRENT_OBSERVATION_REFERENCE_ONLY"
              and row["historical_pre_freeze_mapping_authorized"] is False
              and row["tradable_instrument_identity_verified"] is False
              and row["listing_identity_verified"] is False
              and row["calendar_mapping_authorized"] is False
              and row["relational_claims_authorized"] is False
              and row["execution_authority"] is False
              for row in p["mappings"]
          )
          PY

      - name: Seal FX mapping evidence
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > result/code-git-sha.txt
          printf '%s\n' "$GITHUB_RUN_ID" > result/run-id.txt
          (
            cd result
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0               | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload current FX mapping
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: qore-shared-b-gw2-fx-provider-reference-mapping-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Report B-06 FX reference mapping closure
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          gh issue comment 638 --repo "$GITHUB_REPOSITORY" --body "Architect B B-06 FX observation mapping: run ${GITHUB_RUN_ID}, SHA ${GITHUB_SHA}, artifact ${ARTIFACT_ID}. 60/60 cTrader FX provider symbols are mapped to provider-neutral FX reference objects using explicit provider base/quote descriptors plus verified currency-component evidence. Scope=CURRENT_OBSERVATION_REFERENCE_ONLY; historical pre-freeze mapping=False; tradable/listing/calendar/relational/productive authority=False."
