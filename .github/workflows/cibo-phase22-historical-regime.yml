name: QORE CIBO Phase22 Historical Regime Evidence

on:
  push:
    branches:
      - agent/cibo-integrator-ab-001
    paths:
      - '.github/workflows/cibo-phase22-historical-regime.yml'
      - 'src/qore/infrastructure/cibo_phase22_historical_regime.py'
      - 'src/qore/infrastructure/cibo_phase22_chronological_execution.py'
      - 'src/qore/infrastructure/cibo_ce2i_phase20_demo_regime.py'
      - 'tests/infrastructure/test_cibo_phase22_historical_regime.py'
      - 'tests/infrastructure/test_cibo_phase22_chronological_execution.py'
  pull_request:
    paths:
      - '.github/workflows/cibo-phase22-historical-regime.yml'
      - 'src/qore/infrastructure/cibo_phase22_historical_regime.py'
      - 'src/qore/infrastructure/cibo_phase22_chronological_execution.py'
      - 'tests/infrastructure/test_cibo_phase22_historical_regime.py'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Prove source-bound causal historical regime adapter
        run: |
          ruff check \
            src/qore/infrastructure/cibo_phase22_historical_regime.py \
            src/qore/infrastructure/cibo_phase22_chronological_execution.py \
            tests/infrastructure/test_cibo_phase22_historical_regime.py \
            tests/infrastructure/test_cibo_phase22_chronological_execution.py
          mypy \
            src/qore/infrastructure/cibo_phase22_historical_regime.py \
            src/qore/infrastructure/cibo_phase22_chronological_execution.py
          python -m py_compile \
            src/qore/infrastructure/cibo_phase22_historical_regime.py \
            src/qore/infrastructure/cibo_phase22_chronological_execution.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_phase22_historical_regime.py \
            tests/infrastructure/test_cibo_phase22_chronological_execution.py
