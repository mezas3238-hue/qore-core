name: QORE Cognitive Market OS Ceiling Foundation

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - src/qore/infrastructure/core_stack_v2/hierarchical_world_model.py
      - src/qore/infrastructure/core_stack_v2/multi_world_engine.py
      - src/qore/infrastructure/core_stack_v2/predictive_coding_engine.py
      - src/qore/infrastructure/core_stack_v2/uncertainty_decomposition.py
      - src/qore/infrastructure/core_stack_v2/knowledge_governance.py
      - src/qore/infrastructure/core_stack_v2/shared_cognitive_os_contract.py
      - src/qore/infrastructure/core_stack_v2/shared_brain_architecture_contract.py
      - src/qore/infrastructure/core_stack_v2/architecture_freeze.py
      - src/qore/infrastructure/core_stack_v2/shared_brain_ceiling_program.py
      - tests/infrastructure/test_core_stack_v2_hierarchical_world_model.py
      - tests/infrastructure/test_core_stack_v2_multi_world_engine.py
      - tests/infrastructure/test_core_stack_v2_predictive_coding_engine.py
      - tests/infrastructure/test_core_stack_v2_uncertainty_decomposition.py
      - tests/infrastructure/test_core_stack_v2_knowledge_governance.py
      - tests/infrastructure/test_core_stack_v2_shared_brain_architecture_contract.py
      - tests/infrastructure/test_core_stack_v2_shared_brain_ceiling_program.py
      - .github/workflows/qore-cognitive-market-os-ceiling-foundation.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  cognitive-market-os-ceiling:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Announce Cognitive OS 004 validation
        run: |
          gh issue comment 638 --body "Cognitive OS 004 architecture validation started — Git SHA \`${GITHUB_SHA}\`, run \`${GITHUB_RUN_ID}\`. Validating Owner Cognitive Firewall, sovereignty, transversal requirements and ceiling program; no runtime authority or deployment involved."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Shared
        run: |
          pip install -e ".[dev]"

      - name: Static validation
        run: |
          ruff check \
            src/qore/infrastructure/core_stack_v2/hierarchical_world_model.py \
            src/qore/infrastructure/core_stack_v2/multi_world_engine.py \
            src/qore/infrastructure/core_stack_v2/predictive_coding_engine.py \
            src/qore/infrastructure/core_stack_v2/uncertainty_decomposition.py \
            src/qore/infrastructure/core_stack_v2/knowledge_governance.py \
            src/qore/infrastructure/core_stack_v2/shared_cognitive_os_contract.py \
            src/qore/infrastructure/core_stack_v2/shared_brain_architecture_contract.py \
            src/qore/infrastructure/core_stack_v2/architecture_freeze.py \
            src/qore/infrastructure/core_stack_v2/shared_brain_ceiling_program.py \
            tests/infrastructure/test_core_stack_v2_hierarchical_world_model.py \
            tests/infrastructure/test_core_stack_v2_multi_world_engine.py \
            tests/infrastructure/test_core_stack_v2_predictive_coding_engine.py \
            tests/infrastructure/test_core_stack_v2_uncertainty_decomposition.py \
            tests/infrastructure/test_core_stack_v2_knowledge_governance.py \
            tests/infrastructure/test_core_stack_v2_shared_brain_architecture_contract.py \
            tests/infrastructure/test_core_stack_v2_shared_brain_ceiling_program.py
          python -m py_compile \
            src/qore/infrastructure/core_stack_v2/hierarchical_world_model.py \
            src/qore/infrastructure/core_stack_v2/multi_world_engine.py \
            src/qore/infrastructure/core_stack_v2/predictive_coding_engine.py \
            src/qore/infrastructure/core_stack_v2/uncertainty_decomposition.py \
            src/qore/infrastructure/core_stack_v2/knowledge_governance.py \
            src/qore/infrastructure/core_stack_v2/shared_cognitive_os_contract.py \
            src/qore/infrastructure/core_stack_v2/shared_brain_architecture_contract.py \
            src/qore/infrastructure/core_stack_v2/architecture_freeze.py \
            src/qore/infrastructure/core_stack_v2/shared_brain_ceiling_program.py

      - name: Run cognitive ceiling tests
        run: |
          pytest -q \
            tests/infrastructure/test_core_stack_v2_hierarchical_world_model.py \
            tests/infrastructure/test_core_stack_v2_multi_world_engine.py \
            tests/infrastructure/test_core_stack_v2_predictive_coding_engine.py \
            tests/infrastructure/test_core_stack_v2_uncertainty_decomposition.py \
            tests/infrastructure/test_core_stack_v2_knowledge_governance.py \
            tests/infrastructure/test_core_stack_v2_shared_brain_architecture_contract.py \
            tests/infrastructure/test_core_stack_v2_shared_brain_ceiling_program.py

      - name: Report Cognitive OS 004 validation GREEN
        if: success()
        run: |
          gh issue comment 638 --body "Cognitive OS 004 architecture validation GREEN — Git SHA \`${GITHUB_SHA}\`, run \`${GITHUB_RUN_ID}\`. Owner Cognitive Firewall, three-reality/Core-Twin contract, metacognitive/knowledge requirements, legacy freeze anti-actuation tests and ordered WP-01..WP-12 ceiling program all passed. PR remains DRAFT; no LIVE/production/real-capital/merge authority."

      - name: Report Cognitive OS 004 validation failure
        if: failure()
        run: |
          gh issue comment 638 --body "Cognitive OS 004 architecture validation FAILED — Git SHA \`${GITHUB_SHA}\`, run \`${GITHUB_RUN_ID}\`. Treat this as a technical/contract defect; do not weaken Cognitive Firewall or sovereignty laws. PR remains DRAFT with no deployment authority."
