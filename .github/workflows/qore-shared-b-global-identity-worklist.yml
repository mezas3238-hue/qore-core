name: QORE Shared B Global Identity Resolution Worklist

on:
  push:
    branches:
      - agent/shared-b-global-world-perception-001
    paths:
      - scripts/shared_b_global_identity_resolution_worklist.py
      - .github/workflows/qore-shared-b-global-identity-worklist.yml
  workflow_dispatch:

concurrency:
  group: qore-shared-b-global-identity-worklist-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  GEN2_RUN_ID: "36623131862"
  GEN2_ARTIFACT_ID: "11059307341"
  GEN2_GIT_SHA: "f5fcd0c9552466132f6f47bb124805e49e774493"
  FX_RUN_ID: "36754912247"
  FX_ARTIFACT_ID: "11115828701"
  FX_GIT_SHA: "fe2fb0dd8b53d0805215bb62c7d7ec16ab130153"
  COMMODITY_RUN_ID: "36755839843"
  COMMODITY_ARTIFACT_ID: "11115769948"
  COMMODITY_GIT_SHA: "52092649a3f78e6449e52288786e1839a58ff916"

jobs:
  worklist:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Shared
        run: pip install -e ".[dev]"

      - name: Validate worklist reducer
        run: |
          set -euo pipefail
          ruff check scripts/shared_b_global_identity_resolution_worklist.py
          mypy scripts/shared_b_global_identity_resolution_worklist.py
          python -m py_compile scripts/shared_b_global_identity_resolution_worklist.py

      - name: Verify exact upstream lineages
        run: |
          set -euo pipefail
          for spec in             "${GEN2_RUN_ID}:${GEN2_GIT_SHA}"             "${FX_RUN_ID}:${FX_GIT_SHA}"             "${COMMODITY_RUN_ID}:${COMMODITY_GIT_SHA}"
          do
            run_id="${spec%%:*}"
            sha="${spec#*:}"
            test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')" = "completed"
            test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion')" = "success"
            test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.head_sha')" = "$sha"
          done

      - name: Recover sealed identity evidence
        run: |
          set -euo pipefail
          mkdir -p input/gen2 input/fx input/commodity result

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${GEN2_ARTIFACT_ID}/zip" > gen2.zip
          unzip -q gen2.zip -d input/gen2
          gen2_sums="$(find input/gen2 -name SHA256SUMS -print -quit)"
          test -n "$gen2_sums"
          (cd "$(dirname "$gen2_sums")" && sha256sum -c SHA256SUMS)
          gen2_file="$(find input/gen2 -name provider-schedule-catalog.json -print -quit)"
          test -n "$gen2_file"

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FX_ARTIFACT_ID}/zip" > fx.zip
          unzip -q fx.zip -d input/fx
          fx_sums="$(find input/fx -name SHA256SUMS -print -quit)"
          test -n "$fx_sums"
          (cd "$(dirname "$fx_sums")" && sha256sum -c SHA256SUMS)
          fx_file="$(find input/fx -name shared-b-gw2-fx-provider-reference-mapping.json -print -quit)"
          test -n "$fx_file"

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${COMMODITY_ARTIFACT_ID}/zip" > commodity.zip
          unzip -q commodity.zip -d input/commodity
          commodity_sums="$(find input/commodity -name SHA256SUMS -print -quit)"
          test -n "$commodity_sums"
          (cd "$(dirname "$commodity_sums")" && sha256sum -c SHA256SUMS)
          commodity_file="$(find input/commodity -name shared-b-commodity-observation-identity-pack.json -print -quit)"
          test -n "$commodity_file"

          printf 'GEN2_FILE=%s\n' "$gen2_file" >> "$GITHUB_ENV"
          printf 'FX_FILE=%s\n' "$fx_file" >> "$GITHUB_ENV"
          printf 'COMMODITY_FILE=%s\n' "$commodity_file" >> "$GITHUB_ENV"

      - name: Build exact 177-sensor identity frontier
        run: |
          set -euo pipefail
          python scripts/shared_b_global_identity_resolution_worklist.py             --provider-schedule "$GEN2_FILE"             --fx-mapping "$FX_FILE"             --commodity-pack "$COMMODITY_FILE"             --output result/shared-b-global-identity-resolution-worklist.json             | tee result/summary.json

      - name: Enforce exact frontier
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(
              Path(
                  "result/shared-b-global-identity-resolution-worklist.json"
              ).read_text()
          )
          assert p["identity"] == "SHARED_B_GLOBAL_IDENTITY_RESOLUTION_WORKLIST_001"
          assert p["status"] == "EXACT_177_SENSOR_IDENTITY_FRONTIER_MATERIALIZED"
          assert p["sensor_count"] == 177
          assert p["current_reference_mapped_count"] == 74
          assert p["dated_contract_descriptor_verified_count"] == 5
          assert p["provider_native_only_count"] == 98
          assert p["stage_counts"] == {
              "CURRENT_REFERENCE_OBJECT_MAPPED": 74,
              "DATED_CONTRACT_DESCRIPTOR_VERIFIED": 5,
              "PROVIDER_NATIVE_ONLY": 98,
          }
          assert p["canonical_identity_complete_count"] == 0
          assert p["full_177_identity_complete"] is False
          assert len(p["records"]) == 177
          assert p["provider_symbol_name_is_canonical_proof"] is False
          assert p["automatic_identity_inference"] is False
          assert p["historical_market_data_read"] is False
          assert p["target_or_outcome_read"] is False
          assert p["r6_r5_read"] is False
          assert p["fresh_holdout_opened"] is False
          assert p["broker_mutation"] is False
          assert p["productive_authority"] is False
          assert len(p["worklist_fingerprint_sha256"]) == 64
          PY

      - name: Seal B-06 identity frontier
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > result/code-git-sha.txt
          printf '%s\n' "$GITHUB_RUN_ID" > result/run-id.txt
          (
            cd result
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0               | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload B-06 identity frontier
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: qore-shared-b-global-identity-worklist-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Report exact B-06 frontier
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          gh issue comment 638 --repo "$GITHUB_REPOSITORY" --body "Architect B B-06 identity frontier: run ${GITHUB_RUN_ID}, SHA ${GITHUB_SHA}, artifact ${ARTIFACT_ID}. Exact 177-sensor worklist materialized: 74 current reference-object mappings + 5 dated GC contract descriptors + 98 provider-native-only sensors. Full canonical identity remains incomplete; no symbol-name inference, historical backfill, admission or productive authority."
