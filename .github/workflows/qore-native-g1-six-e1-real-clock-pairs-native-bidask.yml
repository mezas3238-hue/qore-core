name: QORE Native G1 six original E1 source event clock pairs BID ASK native protobuf

on:
  push:
    branches:
      - research/qore-native-g1-six-real-e1-event-pairs-native-bidask-20261012
    paths:
      - '.github/workflows/qore-native-g1-six-e1-real-clock-pairs-native-bidask.yml'
      - 'src/qore/infrastructure/trader_lab/qore_native_g1_six_e1_original_event_pair_quote_source_v1.py'
      - 'tests/infrastructure/trader_lab/test_qore_native_g1_six_e1_original_event_pair_quote_source_v1.py'
      - 'docs/research/QORE_NATIVE_G1_SIX_E1_REAL_DECISION_AND_M5_HORIZON_BIDASK_SOURCE_PREREG_2026-10-12.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qore-native-six-E1-real-clock-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  precommitted_research_broker_source_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,ctrader]'
      - name: Immutable six source date clocks and signed protobuf quote source tests
        run: |
          set -euo pipefail
          test -s docs/research/QORE_NATIVE_G1_SIX_E1_REAL_DECISION_AND_M5_HORIZON_BIDASK_SOURCE_PREREG_2026-10-12.md
          ruff check --select F,E4,E7,E9 src/qore/infrastructure/trader_lab/qore_native_g1_six_e1_original_event_pair_quote_source_v1.py tests/infrastructure/trader_lab/test_qore_native_g1_six_e1_original_event_pair_quote_source_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_qore_native_g1_six_e1_original_event_pair_quote_source_v1.py
          echo "RESEARCH E1 EXISTENCE ONLY; NO STRATEGY OUTCOMES OR NET"

  source_only_six_E1_native_quote_pairs:
    needs: precommitted_research_broker_source_contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      QORE_CTRADER_DEMO_CLIENT_ID: ${{ secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
      QORE_CTRADER_DEMO_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
      QORE_CTRADER_DEMO_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
      QORE_CTRADER_DEMO_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
      QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID }}
      QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET }}
      QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN }}
      QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[ctrader]'
      - name: Collect original native BID and ASK field Protobuf around frozen six 13UTC and 15UTC E1 research clocks
        run: |
          set -euo pipefail
          python -m qore.infrastructure.trader_lab.qore_native_g1_six_e1_original_event_pair_quote_source_v1 native-E1-clock-pairs
      - name: Preserve native quote side field-only witnesses and sha / blockers, no Git raw prices
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qore-native-G1-six-real-E1-source-clock-pairs-NOT-NET-${{ github.sha }}
          path: native-E1-clock-pairs/
          retention-days: 90
          if-no-files-found: warn
