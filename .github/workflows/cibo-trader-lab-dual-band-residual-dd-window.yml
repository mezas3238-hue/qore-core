name: QORE CIBO Dual Band Residual DD Window

# Research-only reused-holdout hypothesis generation; not certification evidence.
# Uses the strongest dual-band carrier, then targets residual DD causally by live DD + multiplier window.

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cibo-causal-expectation-leakage-fix-001
    paths:
      - '.github/workflows/cibo-trader-lab-dual-band-residual-dd-window.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}/src
  SOURCE_ARTIFACT_ID: '11451743578'
  SOURCE_ARTIFACT_DIGEST: 'sha256:d439957f21e2f79148b5a2fb75a53db6fa448698f17aeb6978f379ed3547f7ea'
  HISTORICAL_SOURCE_ARTIFACT_ID: '11389331836'
  HISTORICAL_SOURCE_ARTIFACT_DIGEST: 'sha256:30177639f660c9647ab70257c2d12c541bdade49ab5582347a3890f920070fee'
  HISTORICAL_CONTROL_ARTIFACT_ID: '11409086692'
  HISTORICAL_CONTROL_ARTIFACT_DIGEST: 'sha256:eeffdc99a736b82bd965ff646b8ca9bf084f50ae414e56e9b3d82961169d7187'
  ATLAS_AUDJPY_ARTIFACT_ID: '10476530915'
  ATLAS_AUDJPY_DIGEST: 'sha256:a416085cfcef04003ae89debaad360304a0c4c8bac65b3bf2b439a8a4b7098bf'
  ATLAS_EURUSD_ARTIFACT_ID: '10475354631'
  ATLAS_EURUSD_DIGEST: 'sha256:e0fa9e316b79ba61c338161a57508359d4c6afe2fbf97d3f50f1e27c2d359a86'
  ATLAS_GBPJPY_ARTIFACT_ID: '10475453293'
  ATLAS_GBPJPY_DIGEST: 'sha256:b68e74b2afa54295f891c11cde19e12e92db4192930496036c7ebb372474e415'
  ATLAS_GBPUSD_ARTIFACT_ID: '10475449182'
  ATLAS_GBPUSD_DIGEST: 'sha256:77d5b65ce3c6763e3ac5f620e4167d4ef071bfe1c13746cd5ca7ad9788268dcf'
  ATLAS_NAS100_ARTIFACT_ID: '10476153072'
  ATLAS_NAS100_DIGEST: 'sha256:87ae8095feadce23c5026cda4dada49765d44d0baa2237b5bd7704ccc8deb863'
  ATLAS_XAUUSD_ARTIFACT_ID: '10476557530'
  ATLAS_XAUUSD_DIGEST: 'sha256:dcb905b11380e3d4e1a4dc621e269bb75d2886806dd662e260d21d1d15362e08'

jobs:
  dual-band-residual-dd-window:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile
        run: |
          set -euo pipefail
          python -m py_compile src/qore/infrastructure/cibo_position_lifecycle.py src/qore/infrastructure/trader_lab/cibo_three_mode_capital_lab.py scripts/cibo_trader_lab_three_mode_ceiling.py

      - name: Recover inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/historical-source" "$RUNNER_TEMP/historical-control" "$RUNNER_TEMP/result"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" > "$RUNNER_TEMP/source.zip"
          echo "${SOURCE_ARTIFACT_DIGEST#sha256:}  $RUNNER_TEMP/source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/source"
          MANIFEST="$(find "$RUNNER_TEMP/source" -type f -name walk-forward-manifest.json -print -quit)"
          BASELINE="$(find "$RUNNER_TEMP/source" -type f -name walk-forward-replay.json -print -quit)"
          echo "MANIFEST=$MANIFEST" >> "$GITHUB_ENV"; echo "BASELINE=$BASELINE" >> "$GITHUB_ENV"

          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$HISTORICAL_SOURCE_ARTIFACT_ID/zip" > "$RUNNER_TEMP/historical-source.zip"
          echo "${HISTORICAL_SOURCE_ARTIFACT_DIGEST#sha256:}  $RUNNER_TEMP/historical-source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/historical-source.zip" -d "$RUNNER_TEMP/historical-source"
          HISTORICAL_MANIFEST="$(find "$RUNNER_TEMP/historical-source" -type f -name single-account-manifest-native.json -print -quit)"
          echo "HISTORICAL_MANIFEST=$HISTORICAL_MANIFEST" >> "$GITHUB_ENV"

          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$HISTORICAL_CONTROL_ARTIFACT_ID/zip" > "$RUNNER_TEMP/historical-control.zip"
          echo "${HISTORICAL_CONTROL_ARTIFACT_DIGEST#sha256:}  $RUNNER_TEMP/historical-control.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/historical-control.zip" -d "$RUNNER_TEMP/historical-control"
          HISTORICAL_REPLAY="$(find "$RUNNER_TEMP/historical-control" -type f -name historical-ceiling-replay.json -print -quit)"
          echo "HISTORICAL_REPLAY=$HISTORICAL_REPLAY" >> "$GITHUB_ENV"

          mkdir -p "$RUNNER_TEMP/atlas"
          for SYMBOL in AUDJPY EURUSD GBPJPY GBPUSD NAS100 XAUUSD; do
            ID_VAR="ATLAS_${SYMBOL}_ARTIFACT_ID"
            DIGEST_VAR="ATLAS_${SYMBOL}_DIGEST"
            ARTIFACT_ID="${!ID_VAR}"
            ARTIFACT_DIGEST="${!DIGEST_VAR}"
            ZIP="$RUNNER_TEMP/atlas-${SYMBOL}.zip"
            ROOT="$RUNNER_TEMP/atlas/${SYMBOL}"
            mkdir -p "$ROOT"
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$ZIP"
            echo "${ARTIFACT_DIGEST#sha256:}  $ZIP" | sha256sum -c -
            unzip -q "$ZIP" \
              'RAW_M5_LEDGER/2019.jsonl' \
              'RAW_M5_LEDGER/2020.jsonl' \
              'RAW_M5_LEDGER/2021.jsonl' \
              'RAW_M5_LEDGER/2022.jsonl' \
              -d "$ROOT"
          done

      - name: Run dual-band residual DD window
        run: |
          set -u
          common=(
            --manifest "$MANIFEST"
            --baseline-replay "$BASELINE"
            --historical-manifest "$HISTORICAL_MANIFEST"
            --historical-replay "$HISTORICAL_REPLAY"
            --distributed-attack-frontier
            --coordinated-economic-group
            --ceiling-discovery-mode
            --summary-telemetry
          )

          run_case() {
            name="$1"; band_taper="$2"; dd_lo="$3"; dd_hi="$4"; mult_lo="$5"; mult_hi="$6"; win_taper="$7"
            extra=()
            if [[ "$band_taper" != "none" ]]; then
              extra+=(
                --ceiling-attack-multiplier-band-lower 2000
                --ceiling-attack-multiplier-band-upper 3999
                --ceiling-attack-multiplier-band-taper-fraction "$band_taper"
              )
            fi
            extra+=(
              --ceiling-attack-risk-fraction-band-lower 0.025
              --ceiling-attack-risk-fraction-band-upper 0.05
              --ceiling-attack-risk-fraction-band-taper-fraction 0.50
            )
            if [[ "$dd_lo" != "none" ]]; then
              extra+=(
                --ceiling-attack-drawdown-window-lower "$dd_lo"
                --ceiling-attack-drawdown-window-upper "$dd_hi"
                --ceiling-attack-drawdown-window-multiplier-lower "$mult_lo"
                --ceiling-attack-drawdown-window-multiplier-upper "$mult_hi"
                --ceiling-attack-drawdown-window-taper-fraction "$win_taper"
              )
            fi
            if python scripts/cibo_trader_lab_three_mode_ceiling.py "${common[@]}" \
              --attack-multiplier-cap 10000 \
              --medium-multiplier-cap 14 \
              --medium-drawdown-intensity-trigger 0.05 \
              --economic-group-bootstrap-cushion-share 1.00 \
              --ceiling-growth-leverage-slope 10 \
              --ceiling-attack-single-trade-risk-fraction 0.20 \
              --ceiling-attack-loss-streak-trigger 3 \
              --ceiling-attack-loss-streak-taper-fraction 0.75 \
              --ceiling-portfolio-shock-trigger-fraction 0.05 \
              --ceiling-portfolio-shock-taper-fraction 0.50 \
              "${extra[@]}" \
              --lifecycle-source-root "AUDJPY=$RUNNER_TEMP/atlas/AUDJPY" \
              --lifecycle-source-root "EURUSD=$RUNNER_TEMP/atlas/EURUSD" \
              --lifecycle-source-root "GBPJPY=$RUNNER_TEMP/atlas/GBPJPY" \
              --lifecycle-source-root "GBPUSD=$RUNNER_TEMP/atlas/GBPUSD" \
              --lifecycle-source-root "NAS100=$RUNNER_TEMP/atlas/NAS100" \
              --lifecycle-source-root "XAUUSD=$RUNNER_TEMP/atlas/XAUUSD" \
              --lifecycle-feature DEFENSIVE_INITIAL_STOP_CAP \
              --lifecycle-defensive-medium-1x-only \
              --lifecycle-defensive-initial-stop-r -0.20 \
              --lifecycle-trader-loss-streak-trigger 2 \
              --lifecycle-minimum-stop-risk-fraction-trigger 0.03 \
              --output "$RUNNER_TEMP/result/${name}.json"; then
              echo "CASE_OK=${name}"
            else
              echo "CASE_FAILED=${name}"
            fi
          }

          # Strongest dual-band carrier: multiplier 2000-3999 @ 20% retention
          # plus normalized ATTACK risk band 2.5%-5% @ 50% retention.
          run_case "dual-base" 0.20 none none none none 1

          # Refine the residual DD window found by 37664970209.
          run_case "dual-w05-25-m800-1900-f75" 0.20 0.05 0.25 800 1900 0.75
          run_case "dual-w05-25-m800-1900-f60" 0.20 0.05 0.25 800 1900 0.60
          run_case "dual-w05-25-m800-1900-f50" 0.20 0.05 0.25 800 1900 0.50
          run_case "dual-w05-25-m800-1900-f45" 0.20 0.05 0.25 800 1900 0.45
          run_case "dual-w05-25-m800-1900-f40" 0.20 0.05 0.25 800 1900 0.40
          run_case "dual-w05-25-m800-1900-f35" 0.20 0.05 0.25 800 1900 0.35
          run_case "dual-w05-25-m800-1900-f30" 0.20 0.05 0.25 800 1900 0.30

          # Boundary sensitivity around the destructive residual range.
          run_case "dual-w05-25-m700-1900-f45" 0.20 0.05 0.25 700 1900 0.45
          run_case "dual-w05-25-m900-1900-f45" 0.20 0.05 0.25 900 1900 0.45
          run_case "dual-w05-25-m800-1700-f45" 0.20 0.05 0.25 800 1700 0.45
          run_case "dual-w05-25-m800-2100-f45" 0.20 0.05 0.25 800 2100 0.45

      - name: Rank dual-band residual strict Pareto
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from decimal import Decimal
          from pathlib import Path

          root=Path(os.environ["RUNNER_TEMP"])/"result"
          control=json.loads((root/"control.json").read_text())
          base_capital=Decimal("582440.0252953678696769360345")
          base_dd=Decimal("0.6510419759240315671719825681633489757925369664663770620335151596826649313533375179797855048624928231")
          assert Decimal(control["ending_total_capital_usd"])==base_capital
          assert Decimal(control["max_drawdown_fraction"])==base_dd
          base_loss=control["economic_group_report"]["portfolio_loss_report"]
          base_attack_loss=Decimal(base_loss["attack_gross_loss_usd"])
          base_total_loss=Decimal(base_loss["total_gross_loss_usd"])

          rows=[]
          for pth in sorted(root.glob("*.json")):
              p=json.loads(pth.read_text())
              assert p["decision_count"]==p["trade_count"]==3368
              assert p["economic_group_report"]["all_entries_preserved"] is True
              assert Decimal(p["attack_sovereign_breach_usd"])==0
              funnel=p["engineering_sensor_report"]["execution_funnel"]
              assert funnel["final_trade_count"]==3368
              assert funnel["sizing_medium_rejected_count"]==0
              assert funnel["sizing_medium_deferred_count"]==0
              cap=Decimal(p["ending_total_capital_usd"])
              dd=Decimal(p["max_drawdown_fraction"])
              loss=p["economic_group_report"]["portfolio_loss_report"]
              attack_loss=Decimal(loss["attack_gross_loss_usd"])
              total_loss=Decimal(loss["total_gross_loss_usd"])
              eg=p["economic_group_report"]
              strict=cap>=base_capital and dd<base_dd and total_loss<base_total_loss and attack_loss<base_attack_loss
              rows.append({
                  "case":pth.stem,
                  "capital":str(cap),
                  "capital_delta":str(cap-base_capital),
                  "capital_ratio":str(cap/base_capital),
                  "dd":str(dd),
                  "dd_delta":str(dd-base_dd),
                  "attack_gross_loss":str(attack_loss),
                  "attack_gross_loss_delta":str(attack_loss-base_attack_loss),
                  "total_gross_loss":str(total_loss),
                  "total_gross_loss_delta":str(total_loss-base_total_loss),
                  "total_gross_loss_reduction_pct":str((base_total_loss-total_loss)/base_total_loss*Decimal("100")),
                  "attack_profit_factor":loss["attack_profit_factor"],
                  "total_profit_factor":loss["total_profit_factor"],
                  "band_bind":eg["attack_multiplier_band_taper_bind_count"],
                  "dd_window_bind":eg.get("attack_drawdown_window_taper_bind_count",0),
                  "strict_pareto":strict,
                  "dd_below_60_pareto":strict and dd<Decimal("0.60"),
                  "material_10pct_loss_pareto":strict and total_loss<=base_total_loss*Decimal("0.90"),
              })
          rows.sort(key=lambda r:(not r["dd_below_60_pareto"],not r["material_10pct_loss_pareto"],not r["strict_pareto"],Decimal(r["dd"]),-Decimal(r["capital"]),Decimal(r["total_gross_loss"])))
          print("DUAL_BAND_RESIDUAL_DD_WINDOW="+json.dumps(rows,sort_keys=True))
          print("STRICT_PARETO_CASES="+json.dumps([r["case"] for r in rows if r["strict_pareto"]]))
          print("DD_BELOW_60_PARETO_CASES="+json.dumps([r["case"] for r in rows if r["dd_below_60_pareto"]]))
          print("MATERIAL_10PCT_LOSS_PARETO_CASES="+json.dumps([r["case"] for r in rows if r["material_10pct_loss_pareto"]]))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-dual-band-residual-dd-window-${{ github.run_id }}
          path: ${{ runner.temp }}/result/*.json
          if-no-files-found: error
          retention-days: 90
