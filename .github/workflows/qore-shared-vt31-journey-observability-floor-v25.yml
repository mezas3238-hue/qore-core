name: QORE Shared VT31 Journey Observability Floor V25

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - scripts/vt31_core_stack_v4_journey_observability_floor_v25.py
      - .github/workflows/qore-shared-vt31-journey-observability-floor-v25.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  observability-floor:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Static validation
        run: |
          ruff check scripts/vt31_core_stack_v4_journey_observability_floor_v25.py
          python -m py_compile scripts/vt31_core_stack_v4_journey_observability_floor_v25.py
      - name: Recover immutable R8/R6 three-index evidence
        run: |
          set -euo pipefail
          mkdir -p input/pure input/cibo input/r8 input/r6 result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10799064861/zip" > pure.zip
          unzip -q pure.zip -d input/pure
          (cd input/pure && sha256sum -c SHA256SUMS)
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10478487667/zip" > cibo.zip
          unzip -q cibo.zip -d input/cibo
          (cd input/cibo && sha256sum -c SHA256SUMS)
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10402199719/zip" > r8.zip
          unzip -q r8.zip -d input/r8
          (cd input/r8 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10389112524/zip" > r6.zip
          unzip -q r6.zip -d input/r6
          (cd input/r6 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)
      - name: Run observability floor diagnostic
        run: |
          python scripts/vt31_core_stack_v4_journey_observability_floor_v25.py \
            --r8-trades input/pure/r8.json \
            --r6-trades input/pure/r6.json \
            --r8-nas input/r8/fresh/NAS100/market-evidence.json \
            --r8-sp input/r8/fresh/SP500/market-evidence.json \
            --r8-us input/r8/fresh/US30/market-evidence.json \
            --r6-nas input/r6/fresh/NAS100/market-evidence.json \
            --r6-sp input/r6/fresh/SP500/market-evidence.json \
            --r6-us input/r6/fresh/US30/market-evidence.json \
            --daily-path input/cibo/DAILY_PATH_LEDGER.jsonl \
            --output result/journey-observability-floor-v25.json \
            | tee result/summary.json
      - name: Governance validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(Path("result/journey-observability-floor-v25.json").read_text())
          assert p["diagnostic_only"] is True
          assert p["challenge_set"] == {"r8":228,"r6":278}
          assert p["governance"]["offline_terminal_outcomes_used_for_oracle_bound_only"] is True
          assert p["governance"]["runtime_terminal_outcomes_used"] is False
          assert p["governance"]["oracle_policy_promotable"] is False
          assert p["governance"]["trade_count_changed"] is False
          assert p["governance"]["entry_abstention_used"] is False
          assert p["governance"]["risk_weighting_used"] is False
          assert p["governance"]["sizing_changed"] is False
          assert p["governance"]["r5_opened"] is False
          assert p["governance"]["new_holdout_opened"] is False
          assert p["governance"]["live_authorized"] is False
          assert p["governance"]["production_authorized"] is False
          assert p["governance"]["merge_authorized"] is False
          print(json.dumps({
              "r8":p["r8"]["coverage"],
              "r8_oracle":p["r8"]["oracle_observable_loss_elimination"],
              "r6":p["r6"]["coverage"],
              "r6_oracle":p["r6"]["oracle_observable_loss_elimination"],
          },sort_keys=True))
          PY
      - name: Bind result
        run: |
          echo "$GITHUB_SHA" > result/git-sha.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd result && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-vt31-journey-observability-floor-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
