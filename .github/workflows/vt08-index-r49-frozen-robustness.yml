name: VT08 Index R49 Frozen Robustness

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r49-frozen-robustness.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r49_frozen_robustness.py
      - tests/infrastructure/trader_lab/test_vt08_index_r49_frozen_robustness.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r48_candidate_freeze.py tests/infrastructure/trader_lab/test_vt08_index_r49_frozen_robustness.py

  robustness:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R49 frozen robustness
        run: |
          python -m qore.infrastructure.trader_lab.vt08_index_r49_frozen_robustness \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r49-frozen-robustness.json

      - name: Verify R49 governance and immutable reproduction
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(Path("artifacts/report/vt08-index-r49-frozen-robustness.json").read_text())
          assert report["identity"] == "VT08_INDEX_R49_R47_FROZEN_ROBUSTNESS_001"
          candidate=report["candidate"]
          assert candidate["candidate_id"] == "VT08_INDEX_R47_TRANSPORT_SAFE_STRUCTURAL_DEMOTION_001"
          assert candidate["candidate_rule_fingerprint"] == "013bffb847dff546cdb2a31ac9931bdb1336596c540f6a72c5c729d1762c36c8"
          assert candidate["rules_changed"] is False
          assert candidate["retuning_performed"] is False
          assert report["five_year"]["sample"] == 2448
          assert report["recent_two_year"]["sample"] == 1017
          assert report["exact_frozen_reproduction"] is True
          assert report["causal_leakage_guard"]["pass"] is True
          for window in ("five_year", "recent_two_year"):
              diagnostics=report[window]["diagnostics"]
              assert diagnostics["suppressed_trade_count"] == 0
              assert diagnostics["risk_increase_count"] == 0
          g=report["governance"]
          assert g["candidate_frozen_before_robustness"] is True
          assert g["retuning_performed"] is False
          assert g["fresh_holdout_claim"] is False
          assert g["certified"] is False
          assert g["live_authorized"] is False
          assert g["real_capital_authorized"] is False
          assert g["production_authorized"] is False
          PY

      - name: Upload R49 robustness evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-index-r49-frozen-robustness-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
