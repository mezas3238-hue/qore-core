name: VT08 B Independent C3 C4 EQ As-Of Source Audit

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vt08-5m-cognition-replay-20261010
    paths:
      - src/qore/infrastructure/trader_lab/vt08_5m_b_c3c4_source_boundary_v1.py
      - tests/infrastructure/trader_lab/test_vt08_5m_b_c3c4_source_boundary_v1.py
      - .github/workflows/vt08-b-independent-c3c4-eq-asof-source-audit.yml

permissions:
  contents: read
  actions: read

jobs:
  independent-c3c4-five-market:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Ruff + Mypy + adversarial source clocks and EQ
        run: |
          ruff check src/qore/infrastructure/trader_lab/vt08_5m_b_c3c4_source_boundary_v1.py tests/infrastructure/trader_lab/test_vt08_5m_b_c3c4_source_boundary_v1.py
          mypy src/qore/infrastructure/trader_lab/vt08_5m_b_c3c4_source_boundary_v1.py
          pytest -q tests/infrastructure/trader_lab/test_vt08_5m_b_c3c4_source_boundary_v1.py
      - uses: actions/download-artifact@v4
        with:
          repository: mezas3238-hue/qore-core
          run-id: 38095655233
          github-token: ${{ github.token }}
          pattern: vt08-a-c3c4-two-clocks-*-5e553747993887875cd1a35184601591ece539d6
          merge-multiple: false
          path: a-packages
      - uses: actions/download-artifact@v4
        with:
          repository: mezas3238-hue/qore-core
          run-id: 35934924907
          github-token: ${{ github.token }}
          pattern: qore-vt08-cognitive-5m-fresh-*-b2d33e1b4829d8b4afc76983decca8a99131403c
          merge-multiple: false
          path: m15-packages
      - name: Bind exact frozen A 294 and original M15 file pairs
        run: |
          python - <<'PY'
          from pathlib import Path
          from shutil import copyfile
          symbols = ("EURJPY", "USDCHF", "NZDUSD", "CADJPY", "USDCAD")
          root = Path("evidence")
          for s in symbols:
              a = Path("a-packages") / f"vt08-a-c3c4-two-clocks-{s}-5e553747993887875cd1a35184601591ece539d6" / f"{s}-two-clocks-source-full.json"
              m = Path("m15-packages") / f"qore-vt08-cognitive-5m-fresh-{s}-b2d33e1b4829d8b4afc76983decca8a99131403c" / "market-evidence-1095d.json"
              for source, target in (
                  (a, root / "a" / s / a.name), (m, root / "raw" / s / m.name)
              ):
                  if not source.is_file():
                      raise ValueError(f"Missing frozen cross-branch evidence: {source}")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  copyfile(source, target)
          if len(list(root.rglob("*.json"))) != 10:
              raise ValueError("invalid A/raw C3C4 evidence file count")
          PY
      - name: Independently prove all 294 C3/C4 stages, EQ, raw M15, IDs
        run: |
          python -m qore.infrastructure.trader_lab.vt08_5m_b_c3c4_source_boundary_v1 \
            --artifacts-root evidence \
            --output artifacts/vt08-b-independent-real-c3c4-294-source-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: vt08-b-c3c4-m15-real-source-independent-${{ github.sha }}
          path: artifacts/vt08-b-independent-real-c3c4-294-source-verification.json
          retention-days: 30
          if-no-files-found: error
