name: QORE Capitalizer ICT TTrades Entry Acceptance V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-ict-ttrades-entry-acceptance-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_dual_source_entry_acceptance_v1.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_source_strategy_review_v2.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_source_trader_engine_v2.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_dual_source_entry_acceptance_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_source_strategy_review_v2.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_source_trader_engine_v2.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check             src/qore/infrastructure/trader_lab/capitalizer_dual_source_entry_acceptance_v1.py             src/qore/infrastructure/trader_lab/capitalizer_source_strategy_review_v2.py             src/qore/infrastructure/trader_lab/capitalizer_source_trader_engine_v2.py             tests/infrastructure/trader_lab/test_capitalizer_dual_source_entry_acceptance_v1.py             tests/infrastructure/trader_lab/test_capitalizer_source_strategy_review_v2.py             tests/infrastructure/trader_lab/test_capitalizer_source_trader_engine_v2.py
      - name: Mypy
        run: |
          mypy             src/qore/infrastructure/trader_lab/capitalizer_dual_source_entry_acceptance_v1.py             src/qore/infrastructure/trader_lab/capitalizer_source_strategy_review_v2.py             src/qore/infrastructure/trader_lab/capitalizer_source_trader_engine_v2.py
      - name: Focused tests
        run: |
          pytest -q --no-cov             tests/infrastructure/trader_lab/test_capitalizer_dual_source_entry_acceptance_v1.py             tests/infrastructure/trader_lab/test_capitalizer_source_strategy_review_v2.py             tests/infrastructure/trader_lab/test_capitalizer_source_trader_engine_v2.py
      - name: Enforce fail-closed entry policy
        run: |
          python - <<'PY'
          from qore.infrastructure.trader_lab.capitalizer_decision_sovereignty import (
              CapitalizerCognitiveGateDecision,
          )
          from qore.infrastructure.trader_lab.capitalizer_dual_source_entry_acceptance_v1 import (
              CapitalizerDualSourceEntryFacts,
              CapitalizerEntryAcceptanceState,
              assess_dual_source_entry,
          )

          base = dict(
              cognitive_gate_decision=CapitalizerCognitiveGateDecision.PASS_TO_STRATEGY,
              source_session_resolved=True,
              source_session_eligible=True,
              higher_timeframe_bias_confirmed_aligned=True,
              structural_target_intact=True,
              structural_stop_geometry_valid=True,
              ict_liquidity_reference_defined=True,
              ict_liquidity_raid_observed=True,
              ict_market_structure_shift_confirmed=True,
              ict_displacement_significant=True,
              ict_fvg_present_in_displacement=True,
              ict_entry_retrace_into_valid_pd_array=True,
              ict_entry_not_chasing=True,
              ttrades_htf_closure_at_poi_confirmed=True,
              ttrades_ltf_cisd_confirmed=True,
              ttrades_protected_swing_confirmed=True,
              ttrades_continuation_confirmed=True,
              ttrades_wick_formation_confirmed=True,
          )
          accepted = assess_dual_source_entry(CapitalizerDualSourceEntryFacts(**base))
          assert accepted.state is CapitalizerEntryAcceptanceState.ACCEPTABLE_FOR_QORE_RISK
          assert accepted.passes_to_qore_risk is True

          for key in (
              'ict_liquidity_raid_observed',
              'ict_market_structure_shift_confirmed',
              'ict_displacement_significant',
              'ict_fvg_present_in_displacement',
              'ict_entry_retrace_into_valid_pd_array',
              'ttrades_htf_closure_at_poi_confirmed',
              'ttrades_ltf_cisd_confirmed',
              'ttrades_protected_swing_confirmed',
              'ttrades_continuation_confirmed',
              'ttrades_wick_formation_confirmed',
          ):
              failed = dict(base)
              failed[key] = False
              result = assess_dual_source_entry(CapitalizerDualSourceEntryFacts(**failed))
              assert result.passes_to_qore_risk is False, key
          PY
