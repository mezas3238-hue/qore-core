name: QORE NQ AM TLR V6 USTEC Provider-Normalized 1Y

on:
  workflow_dispatch:
  push:
    branches:
      - agent/nq-am-temporal-liquidity-reversal-v1-001
    paths:
      - '.github/workflows/qore-nq-am-tlr-v6-provider-normalized.yml'
      - 'src/qore/infrastructure/trader_lab/nq_am_tlr_v6_ustec_provider_normalized.py'
      - 'tests/infrastructure/trader_lab/test_nq_am_tlr_v6_ustec_provider_normalized.py'
      - 'docs/research/QORE-NQ-AM-TLR-V6-USTEC-PROVIDER-NORMALIZED-FREEZE.md'

concurrency:
  group: qore-nq-am-tlr-v6-provider-normalized-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  QORE_USTEC_SOURCE_RUN_ID: '34981033027'
  QORE_USTEC_SOURCE_ARTIFACT_ID: '10402199719'
  QORE_USTEC_NAS100_SHA256: '4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check --ignore B009 \
            src/qore/infrastructure/trader_lab/nq_am_tlr_v6_ustec_provider_normalized.py \
            tests/infrastructure/trader_lab/test_nq_am_tlr_v6_ustec_provider_normalized.py
      - name: Mypy
        run: mypy src/qore/infrastructure/trader_lab/nq_am_tlr_v6_ustec_provider_normalized.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_nq_am_tlr_v6_ustec_provider_normalized.py
      - name: Freeze assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          freeze = Path(
              'docs/research/QORE-NQ-AM-TLR-V6-USTEC-PROVIDER-NORMALIZED-FREEZE.md'
          ).read_text()
          module = Path(
              'src/qore/infrastructure/trader_lab/'
              'nq_am_tlr_v6_ustec_provider_normalized.py'
          ).read_text()
          assert 'No interpolation' in freeze
          assert 'No synthetic 16:14 bar' in freeze
          assert 'latest available bar' in freeze
          assert 'FINAL_WINDOW_OPEN = time(15, 30)' in module
          assert 'FINAL_WINDOW_CLOSE = time(16, 30)' in module
          for flag in (
              'DEMO_ELIGIBLE=false',
              'LIVE_AUTHORIZED=false',
              'REAL_CAPITAL_AUTHORIZED=false',
              'PRODUCTION_AUTHORIZED=false',
          ):
              assert flag in freeze
          PY

  study:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - name: Download immutable Core USTEC holdout
        uses: actions/download-artifact@v4
        with:
          name: qore-vt31-r8-fresh-validation-3e9efe7b47f645558926fb1c6f1dc32fe45f50d9
          path: source
          github-token: ${{ github.token }}
          run-id: 34981033027
      - name: Bind exact evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/v6
          test -f source/fresh/NAS100/market-evidence.json
          echo "$QORE_USTEC_NAS100_SHA256  source/fresh/NAS100/market-evidence.json" \
            | sha256sum -c -
          cp source/fresh/NAS100/market-evidence.json artifacts/v6/ustec-holdout.json
      - name: Run provider-normalized source replay
        run: |
          python -m qore.infrastructure.trader_lab.nq_am_tlr_v6_ustec_provider_normalized \
            artifacts/v6/ustec-holdout.json artifacts/v6/study \
            | tee artifacts/v6/study-stdout.json
      - name: Enforce authority separation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('artifacts/v6/study/summary.json').read_text())
          assert p['identity'] == 'QORE_NQ_AM_TLR_V6_USTEC_PROVIDER_NORMALIZED_001'
          assert p['provider_anchor_source_authority'] is False
          assert p['inferred_2sd_has_source_authority'] is False
          assert p['source_stop_defined'] is False
          assert p['source_expiry_defined'] is False
          assert p['demo_eligible'] is False
          assert p['live_authorized'] is False
          assert p['real_capital_authorized'] is False
          assert p['production_authorized'] is False
          print(json.dumps(p, indent=2, sort_keys=True))
          PY
      - name: Bind immutable result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/v6
          printf '%s\n' "$GITHUB_SHA" > artifacts/v6/git-sha.txt
          printf '%s\n' "$QORE_USTEC_SOURCE_RUN_ID" > artifacts/v6/source-run-id.txt
          printf '%s\n' "$QORE_USTEC_SOURCE_ARTIFACT_ID" > artifacts/v6/source-artifact-id.txt
          printf '%s\n' "$QORE_USTEC_NAS100_SHA256" > artifacts/v6/source-evidence-sha256.txt
          sha256sum \
            src/qore/infrastructure/trader_lab/nq_am_tlr_v6_ustec_provider_normalized.py \
            docs/research/QORE-NQ-AM-TLR-V6-USTEC-PROVIDER-NORMALIZED-FREEZE.md \
            > artifacts/v6/input-sha256.txt
          find artifacts/v6 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > artifacts/v6/SHA256SUMS.txt
      - name: Upload V6 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qore-nq-am-tlr-v6-provider-normalized-${{ github.sha }}
          path: artifacts/v6
          if-no-files-found: error
          retention-days: 90
