name: QORE CIBO Final Integrated Exam Certification Closure

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-final-integrated-exam-certification-closure.yml'
      - 'src/qore/infrastructure/cibo_final_integrated_exam_certification_closure.py'
      - 'tests/infrastructure/test_cibo_final_integrated_exam_certification_closure.py'
      - 'docs/research/CIBO-MASTER-OPEN-WORK-LEDGER-V1.json'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  certification-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Certification closure contract
        run: |
          ruff check \
            src/qore/infrastructure/cibo_final_integrated_exam_certification_closure.py \
            tests/infrastructure/test_cibo_final_integrated_exam_certification_closure.py
          mypy \
            src/qore/infrastructure/cibo_final_integrated_exam_certification_closure.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_final_integrated_exam_certification_closure.py
