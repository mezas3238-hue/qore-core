name: QORE VT31 Rejected Structural Positive Edge Audit V1

on:
  push:
    branches:
      - agent/vt31-edge-position-cert-b-001
    paths:
      - scripts/vt31_nas100_rejected_structural_positive_edge_audit_v1.py
      - .github/workflows/vt31-rejected-structural-positive-edge-audit-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  partition:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"

    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Static audit gates
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_rejected_structural_positive_edge_audit_v1.py
          ruff check scripts/vt31_nas100_rejected_structural_positive_edge_audit_v1.py

      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"

      - name: Audit rejected structural population
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python \
            scripts/vt31_nas100_rejected_structural_positive_edge_audit_v1.py \
            partition "input/${EVIDENCE_PATH}" \
            --partition "${PARTITION}" \
            --output "result/rejected-positive-edge-${PARTITION}.json" \
            | tee "result/summary-${PARTITION}.json"

      - name: Governance
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=os.environ["PARTITION"]
          x=json.loads(Path(f"result/rejected-positive-edge-{p}.json").read_text())
          assert x["admission_identity_exact"] is True
          g=x["governance"]
          assert g["observation_only"] is True
          assert g["structural_identity_frozen_before_outcome_analysis"] is True
          assert g["terminal_outcome_runtime_authority"] is False
          assert g["future_path_runtime_authority"] is False
          assert g["fold_identity_runtime_authority"] is False
          assert g["date_identity_runtime_authority"] is False
          assert g["new_numeric_threshold_added"] is False
          assert g["new_conjunction_mined"] is False
          assert g["position_sizing_used"] is False
          assert g["dynamic_sizing_used"] is False
          assert g["leverage_used"] is False
          assert g["compounding_used"] is False
          assert g["portfolio_weighting_used"] is False
          assert g["capital_weighting_used"] is False
          assert g["fresh_holdout_opened"] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-rejected-positive-edge-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: partition
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-rejected-positive-edge-*-${{ github.sha }}
          path: input
          merge-multiple: true

      - name: Aggregate positive-edge audit
        run: |
          set -euo pipefail
          mkdir -p result
          PYTHONPATH=scripts python \
            scripts/vt31_nas100_rejected_structural_positive_edge_audit_v1.py \
            aggregate \
            input/rejected-positive-edge-r5.json \
            input/rejected-positive-edge-r6.json \
            input/rejected-positive-edge-r8.json \
            input/rejected-positive-edge-consumed.json \
            --output result/rejected-positive-edge-aggregate.json \
            | tee result/summary-aggregate.json

      - name: Governance and result summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("result/rejected-positive-edge-aggregate.json").read_text())
          g=x["governance"]
          assert g["observation_only"] is True
          assert g["admission_identity_exact_all_partitions"] is True
          assert g["terminal_outcome_runtime_authority"] is False
          assert g["future_path_runtime_authority"] is False
          assert g["fold_identity_runtime_authority"] is False
          assert g["date_identity_runtime_authority"] is False
          assert g["new_numeric_threshold_added"] is False
          assert g["new_conjunction_mined"] is False
          assert g["position_sizing_used"] is False
          assert g["dynamic_sizing_used"] is False
          assert g["leverage_used"] is False
          assert g["compounding_used"] is False
          assert g["portfolio_weighting_used"] is False
          assert g["capital_weighting_used"] is False
          assert g["fresh_holdout_opened"] is False
          print("REJECTED_TRADE_COUNT", x["rejected_trade_count"])
          print("REJECTED_METRICS", json.dumps(x["rejected_structural_metrics"], sort_keys=True))
          print("POSITIVE_CANDIDATE_COUNT", x["positive_candidate_count"])
          print(
              "TOP_POSITIVE_CANDIDATES",
              json.dumps(x["positive_cross_partition_candidates"][:15], sort_keys=True),
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-rejected-positive-edge-aggregate-${{ github.sha }}
          path: result/
          retention-days: 90
