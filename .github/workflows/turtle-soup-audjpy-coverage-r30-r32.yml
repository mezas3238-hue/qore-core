name: QORE Turtle Soup AUDJPY Coverage R30 R32

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/turtle-soup-audjpy-coverage-r30-r32.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_audjpy_r30_nearest_dol_coverage_lab.py'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_audjpy_r32_causal_memory_defragmentation.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_audjpy_r30_nearest_dol_coverage_lab.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_audjpy_r32_causal_memory_defragmentation.py'
  push:
    branches:
      - agent/turtle-soup-audjpy-specialist-memory-v1-001
    paths:
      - '.github/workflows/turtle-soup-audjpy-coverage-r30-r32.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_audjpy_r30_nearest_dol_coverage_lab.py'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_audjpy_r32_causal_memory_defragmentation.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_audjpy_r30_nearest_dol_coverage_lab.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_audjpy_r32_causal_memory_defragmentation.py'

permissions:
  contents: write
  actions: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-AUDJPY-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-AUDJPY-2f510461b3360e91d5ee70a72716a76cd6561f16'
  V2_RUN_ID: '35383377176'
  V2_ARTIFACT: 'qore-turtle-soup-audjpy-structural-specialist-v2-r27-e0bec233ed40197a1e969786b24a9dc8a1e5869f'
  V3_RUN_ID: '35384122071'
  V3_ARTIFACT: 'qore-turtle-soup-audjpy-cognitive-v3-r28-9af85896a295ce61c6893a2968ff01edf9e8ddd1'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check --ignore E501,I001 \
            src/qore/infrastructure/trader_lab/turtle_soup_audjpy_r30_nearest_dol_coverage_lab.py \
            src/qore/infrastructure/trader_lab/turtle_soup_audjpy_r32_causal_memory_defragmentation.py \
            tests/infrastructure/trader_lab/test_turtle_soup_audjpy_r30_nearest_dol_coverage_lab.py \
            tests/infrastructure/trader_lab/test_turtle_soup_audjpy_r32_causal_memory_defragmentation.py
      - name: Mypy focused gate
        run: |
          mypy --disable-error-code attr-defined \
            src/qore/infrastructure/trader_lab/turtle_soup_audjpy_r30_nearest_dol_coverage_lab.py \
            src/qore/infrastructure/trader_lab/turtle_soup_audjpy_r32_causal_memory_defragmentation.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_turtle_soup_audjpy_r30_nearest_dol_coverage_lab.py \
            tests/infrastructure/trader_lab/test_turtle_soup_audjpy_r32_causal_memory_defragmentation.py

  coverage:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable AUDJPY raw master
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-audjpy
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download immutable Target Destination V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target-audjpy
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Download exact Cognitive V2 R27 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V2_ARTIFACT }}
          path: v2-r27
          github-token: ${{ github.token }}
          run-id: ${{ env.V2_RUN_ID }}
      - name: Download exact Cognitive V3 R28 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V3_ARTIFACT }}
          path: v3-r28
          github-token: ${{ github.token }}
          run-id: ${{ env.V3_RUN_ID }}
      - name: Run R30 nearest-DOL coverage
        run: |
          mkdir -p r30-output
          python -m qore.infrastructure.trader_lab.turtle_soup_audjpy_r30_nearest_dol_coverage_lab \
            source-audjpy target-audjpy v3-r28 r30-output > r30-output/stdout.json
      - name: Run R32 causal memory defragmentation
        run: |
          mkdir -p r32-output
          python -m qore.infrastructure.trader_lab.turtle_soup_audjpy_r32_causal_memory_defragmentation \
            source-audjpy target-audjpy v2-r27 r32-output > r32-output/stdout.json
      - name: Enforce AUDJPY 2Y owner gate contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for pth in [
              'r30-output/r30-nearest-dol-coverage-lab-report.json',
              'r32-output/r32-causal-memory-defragmentation-report.json',
          ]:
              p=json.loads(Path(pth).read_text())
              a=p['predeclared_acceptance']
              assert int(a['minimum_trades']) == 350
              assert a['minimum_net_010_profit_factor'] == '1.90'
              assert a['maximum_net_010_drawdown_r'] == '6.0'
              assert p['governance']['fresh_holdout_consumed'] is False
          r32=json.loads(Path('r32-output/r32-causal-memory-defragmentation-report.json').read_text())
          c=r32['experiment_contract']
          assert c['actual_dol_price_always_used'] is True
          assert c['route_family_only_pools_memory'] is True
          assert c['entry_changed'] is False
          assert c['c2_changed'] is False
          assert c['cisd_changed'] is False
          assert c['protected_swing_changed'] is False
          PY
      - name: Hash coverage evidence
        run: |
          mkdir -p package
          cp r30-output/r30-nearest-dol-coverage-lab-report.json package/
          cp r32-output/r32-causal-memory-defragmentation-report.json package/
          printf '%s\n' "$EVIDENCE_SHA" > package/git-sha.txt
          cd package
          sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-audjpy-coverage-r30-r32-${{ env.EVIDENCE_SHA }}
          path: package
          if-no-files-found: error
          retention-days: 90


  publish-status:
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs: [quality, coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/turtle-soup-audjpy-specialist-memory-v1-001
      - name: Download successful coverage artifact
        if: needs.coverage.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: qore-turtle-soup-audjpy-coverage-r30-r32-${{ env.EVIDENCE_SHA }}
          path: published-coverage
      - name: Write auditable coverage status
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          RUN_SHA: ${{ env.EVIDENCE_SHA }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p docs/research/results
          python - <<'PY'
          import json, os
          from pathlib import Path
          out={'identity':'TURTLE_SOUP_AUDJPY_COVERAGE_R30_R32_STATUS','workflow_run_id':int(os.environ['RUN_ID']),'workflow_sha':os.environ['RUN_SHA'],'quality_result':os.environ['QUALITY_RESULT'],'coverage_result':os.environ['COVERAGE_RESULT']}
          r30=Path('published-coverage/r30-nearest-dol-coverage-lab-report.json')
          r32=Path('published-coverage/r32-causal-memory-defragmentation-report.json')
          sums=Path('published-coverage/SHA256SUMS.txt')
          if r30.exists(): out['r30_report']=json.loads(r30.read_text())
          if r32.exists(): out['r32_report']=json.loads(r32.read_text())
          if sums.exists(): out['sha256sums']=sums.read_text().splitlines()
          Path('docs/research/results/TURTLE-SOUP-AUDJPY-COVERAGE-R30-R32-LATEST.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - name: Commit coverage status
        run: |
          git config user.name 'qore-research-bot'
          git config user.email 'qore-research-bot@users.noreply.github.com'
          git add docs/research/results/TURTLE-SOUP-AUDJPY-COVERAGE-R30-R32-LATEST.json
          git commit -m "research(audjpy): record R30/R32 coverage result" || exit 0
          git push origin HEAD:agent/turtle-soup-audjpy-specialist-memory-v1-001
