name: QORE VT-08 R3.14 Two-Phase Funding Qualification

on:
  push:
    branches:
      - agent/vt08-r3-14-two-phase-funding-001
    paths:
      - .github/workflows/vt08-r3-14-two-phase-funding.yml
      - src/qore/infrastructure/trader_lab/vt08_two_phase_funding_qualification_r3_14.py
      - tests/infrastructure/trader_lab/test_vt08_two_phase_funding_qualification_r3_14.py
      - docs/trader_lab/vt08-r3-14-two-phase-funding-freeze.md
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact R3.14 head
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff full gate
        run: ruff check .
      - name: Mypy full gate
        run: mypy src tests
      - name: Focused VT-08 R3.14 gates
        run: |
          pytest -q \
            tests/infrastructure/trader_lab/test_vt08_two_phase_funding_qualification_r3_14.py \
            tests/infrastructure/trader_lab/test_vt08_challenge_speed_monte_carlo_r3_13.py \
            tests/infrastructure/trader_lab/test_vt08_official_adaptive_monte_carlo_r3_12.py \
            tests/infrastructure/trader_lab/test_vt08_official_monte_carlo_r3_11.py \
            tests/infrastructure/trader_lab/test_vt08_b01_risk_economic_replay_r3_11.py \
            tests/infrastructure/traders/test_vt08_b01_r3_11_profitability_forensics.py \
            tests/infrastructure/traders/test_vt08_b01_r3_8.py
      - name: Full QORE quality gate
        run: pytest --cov=src/qore --cov-report=term-missing

  official-two-phase-funding-monte-carlo:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact R3.14 head
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QORE
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Download consumed 2024-2026 baseline evidence
        run: |
          mkdir -p consumed/baseline
          gh run download 34693803930 \
            --repo "$GITHUB_REPOSITORY" \
            --dir consumed/baseline
      - name: Download consumed 2022-2024 evidence
        run: |
          mkdir -p consumed/fresh
          gh run download 34707771460 \
            --repo "$GITHUB_REPOSITORY" \
            --dir consumed/fresh
      - name: Execute official R3.14 paired two-phase Monte Carlo
        run: |
          generated_at="$(git show -s --format=%cI "$GITHUB_SHA")"
          python -m qore.infrastructure.trader_lab.vt08_two_phase_funding_qualification_r3_14 \
            --baseline-root consumed/baseline \
            --fresh-root consumed/fresh \
            --git-sha "$GITHUB_SHA" \
            --generated-at "$generated_at" \
            --output-dir out
      - name: Enforce R3.14 governance and experiment invariants
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          report = json.loads(Path("out/two-phase-funding-qualification.json").read_text())
          assert report["holdout_not_accessed"] is True
          assert report["protected_holdout"]["accessed"] is False
          assert report["demo_eligible"] is False
          assert report["live_authorized"] is False
          assert report["experiment"]["paths_per_risk_pair"] == 10000
          assert report["experiment"]["total_horizon_trading_days"] == 60
          assert report["experiment"]["block_length_trading_days"] == 5
          assert report["experiment"]["risk_pair_candidates"] == 16
          assert report["experiment"]["phase_boundary_account_state_reset"] is True
          assert report["experiment"]["phase_boundary_risk_memory_reset"] is True
          assert report["objective"]["phase1_target_return"] == "0.10"
          assert report["objective"]["phase2_target_return"] == "0.05"
          assert report["experiment"]["primary_transaction_cost_bps_per_completed_trade"] == "0.50"
          assert report["experiment"]["cost_grid_bps"] == ["0.00", "0.25", "0.50", "1.00"]
          assert report["portfolio_samples"] == {
              "A_CORE": 117,
              "GBPJPY_RETURN_ENHANCER": 112,
              "B_COMBINED_PORTFOLIO": 229,
          }
          assert len(report["search_surface"]) == 16
          selected = report["selected_score"]
          pair = report["selected_pair"]
          if selected is not None:
              assert pair is not None
              assert selected["safe_candidate"] is True
              assert selected["combined_breach_probability"] <= 0.01
              assert selected["challenge_drawdown_p99"] <= 0.06
              assert selected["ruin_probability"] == 0.0
              assert Decimal(pair["phase2"]["a_base_bps"]) <= Decimal(pair["phase1"]["a_base_bps"])
              assert Decimal(pair["phase1"]["upshift_step_bps"]) < Decimal(pair["phase1"]["downshift_step_bps"])
              assert Decimal(pair["phase2"]["upshift_step_bps"]) < Decimal(pair["phase2"]["downshift_step_bps"])
          funded = report["funded_mode_transition"]
          assert funded["challenge_risk_state_discarded"] is True
          assert funded["funded_risk_state_fresh"] is True
          assert funded["policy"]["name"] == "balanced-adaptive-v1"
          assert Decimal(funded["policy"]["a_base_bps"]) == Decimal("25")
          assert Decimal(funded["policy"]["gbpjpy_base_bps"]) == Decimal("20")
          for required in (
              "two-phase-funding-qualification.json",
              "risk-pair-search-surface.json",
              "selected-two-phase-policy.json",
              "provider-results.json",
              "cost-sensitivity.json",
              "funded-mode-transition.json",
              "risk-policy-fingerprint.txt",
              "git-sha.txt",
          ):
              assert Path("out", required).is_file(), required
          PY
      - name: Build human-readable artifact summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("out/two-phase-funding-qualification.json").read_text())
          score = report["selected_score"]
          lines = [
              "# VT-08 R3.14 Two-Phase Funding Qualification",
              "",
              f"HEAD: `{report['git_sha']}`",
              "HOLDOUT_NOT_ACCESSED=true",
              f"Selection status: **{report['selection_status']}**",
          ]
          if score is None:
              lines += ["", "No Risk pair satisfied the frozen safety contract."]
          else:
              pair = report["selected_pair"]
              lines += [
                  f"Phase 1 policy: **{pair['phase1']['name']}**",
                  f"Phase 2 policy: **{pair['phase2']['name']}**",
                  f"P(Phase 1 +10%): **{score['probability_phase1_pass_within_60d']:.2%}**",
                  f"P(Phase 2 +5% | Phase 1): **{score['probability_phase2_pass_given_phase1']:.2%}**",
                  f"P(two-phase <=30d): **{score['probability_two_phase_complete_within_30d']:.2%}**",
                  f"P(two-phase <=45d): **{score['probability_two_phase_complete_within_45d']:.2%}**",
                  f"P(two-phase <=60d): **{score['probability_two_phase_complete_within_60d']:.2%}**",
                  f"P(any breach): **{score['combined_breach_probability']:.2%}**",
                  f"Challenge DD p99: **{score['challenge_drawdown_p99']:.2%}**",
                  f"Median total days when completed: **{score['median_total_completion_days']}**",
                  f"P95 total days when completed: **{score['p95_total_completion_days']}**",
                  f"Expected attempts per modeled completion: **{score['expected_attempts_per_two_phase_completion']}**",
                  "",
                  "After Phase 2: Challenge Risk is discarded and R3.12 `balanced-adaptive-v1` becomes the funded-mode policy.",
              ]
          lines += [
              "",
              "## Search surface",
              "",
              "| Phase 1 | Phase 2 | P1 pass | P2|P1 | Two-phase 60d | Breach | DD p99 | Median days | Safe |",
              "|---|---|---:|---:|---:|---:|---:|---:|:---:|",
          ]
          for row in report["search_surface"]:
              item = row["score"]
              lines.append(
                  "| {p1} | {p2} | {p1p:.2%} | {p2p:.2%} | {both:.2%} | {breach:.2%} | {dd:.2%} | {days} | {safe} |".format(
                      p1=item["phase1_policy_name"],
                      p2=item["phase2_policy_name"],
                      p1p=item["probability_phase1_pass_within_60d"],
                      p2p=item["probability_phase2_pass_given_phase1"],
                      both=item["probability_two_phase_complete_within_60d"],
                      breach=item["combined_breach_probability"],
                      dd=item["challenge_drawdown_p99"],
                      days=item["median_total_completion_days"],
                      safe="YES" if item["safe_candidate"] else "NO",
                  )
              )
          Path("out/summary.md").write_text("\n".join(lines) + "\n")
          PY
      - name: Upload immutable R3.14 two-phase evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-r3-14-two-phase-funding-${{ github.sha }}
          path: out/
          if-no-files-found: error
