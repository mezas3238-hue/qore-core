name: QORE CIBO Legacy Stack Quarantine

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-legacy-stack-quarantine.yml'
      - 'scripts/cibo_legacy_stack_quarantine.py'
      - 'tests/infrastructure/test_cibo_legacy_stack_quarantine.py'
      - 'src/qore/infrastructure/cibo_*.py'
      - 'src/qore/infrastructure/openai_cibo_*.py'
      - 'src/qore/core/**'
      - 'src/qore/modules/**'
      - 'docs/research/CIBO-MASTER-OPEN-WORK-LEDGER-V1.json'
  push:
    branches:
      - agent/cibo-capital-efficiency-sizing-lab-001
    paths:
      - '.github/workflows/cibo-legacy-stack-quarantine.yml'
      - 'scripts/cibo_legacy_stack_quarantine.py'
      - 'tests/infrastructure/test_cibo_legacy_stack_quarantine.py'
      - 'src/qore/infrastructure/cibo_*.py'
      - 'src/qore/infrastructure/openai_cibo_*.py'
      - 'src/qore/core/**'
      - 'src/qore/modules/**'
      - 'docs/research/CIBO-MASTER-OPEN-WORK-LEDGER-V1.json'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PYTHONPATH: .

jobs:
  legacy-stack-quarantine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Quality and quarantine
        run: |
          ruff check \
            scripts/cibo_legacy_stack_quarantine.py \
            tests/infrastructure/test_cibo_legacy_stack_quarantine.py
          mypy scripts/cibo_legacy_stack_quarantine.py
          python -m py_compile scripts/cibo_legacy_stack_quarantine.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_legacy_stack_quarantine.py
          python scripts/cibo_legacy_stack_quarantine.py
      - uses: actions/upload-artifact@v4
        with:
          name: cibo-legacy-stack-quarantine-v1
          path: artifacts/cibo_legacy_stack_quarantine_v1.json
          if-no-files-found: error
