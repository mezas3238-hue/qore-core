name: QORE Turtle Soup GBPJPY R37 Frozen R36 5Y Validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/turtle-soup-gbpjpy-r37-frozen-r36-5y-validation.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_r37_frozen_r36_5y_validation.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_gbpjpy_r37_frozen_r36_5y_validation.py'
  push:
    branches:
      - agent/turtle-soup-gbpjpy-specialist-memory-v1-001
    paths:
      - '.github/workflows/turtle-soup-gbpjpy-r37-frozen-r36-5y-validation.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_r37_frozen_r36_5y_validation.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_gbpjpy_r37_frozen_r36_5y_validation.py'

permissions:
  contents: read
  actions: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-GBPJPY-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-GBPJPY-2f510461b3360e91d5ee70a72716a76cd6561f16'
  V2_RUN_ID: '35349300927'
  V2_ARTIFACT: 'qore-turtle-soup-gbpjpy-structural-specialist-v2-r27-00fb870826e0cbd30179fe44cbdd6707448be0da'
  FREEZE_RUN_ID: '35371045165'
  FREEZE_ARTIFACT: 'qore-turtle-soup-gbpjpy-r36-candidate-freeze-035b8772a023fc0a57697aecbcb1a302173491cd'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Focused quality
        run: |
          ruff check --ignore E501,I001 \
            src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_r37_frozen_r36_5y_validation.py \
            tests/infrastructure/trader_lab/test_turtle_soup_gbpjpy_r37_frozen_r36_5y_validation.py
          mypy --disable-error-code attr-defined \
            src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_r37_frozen_r36_5y_validation.py
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_turtle_soup_gbpjpy_r37_frozen_r36_5y_validation.py

  replay-5y:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable GBPJPY raw master
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-gbpjpy
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download immutable Target Destination V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target-gbpjpy
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Download exact Cognitive V2/R27 evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V2_ARTIFACT }}
          path: v2-r27
          github-token: ${{ github.token }}
          run-id: ${{ env.V2_RUN_ID }}
      - name: Download exact R36 freeze
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FREEZE_ARTIFACT }}
          path: r36-freeze
          github-token: ${{ github.token }}
          run-id: ${{ env.FREEZE_RUN_ID }}
      - name: Run exact frozen 5Y validation
        run: |
          mkdir -p r37-output
          python -m qore.infrastructure.trader_lab.turtle_soup_gbpjpy_r37_frozen_r36_5y_validation \
            source-gbpjpy target-gbpjpy v2-r27 r36-freeze r37-output > r37-output/stdout.json
          printf '%s\n' "$EVIDENCE_SHA" > r37-output/git-sha.txt
      - name: Enforce frozen 5Y governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('r37-output/r37-5y-validation-report.json').read_text())
          assert p['identity']=='TURTLE_SOUP_GBPJPY_R37_FROZEN_R36_5Y_VALIDATION_V1'
          assert p['window']['open']=='2021-09-17T00:00:00+00:00'
          assert p['window']['close']=='2026-09-17T00:00:00+00:00'
          assert p['window']['fresh_holdout'] is False
          assert p['window']['historical_status']=='CONSUMED_ROBUSTNESS_VALIDATION'
          c=p['frozen_contract_verification']
          assert all(v is False for v in c.values())
          a=p['predeclared_acceptance']
          assert a['minimum_trades']==800
          assert a['minimum_scaled_net_010_profit_factor']=='1.50'
          assert a['maximum_scaled_net_010_drawdown_r']=='6.0'
          assert a['required_positive_annual_blocks']==5
          g=p['governance']
          assert g['candidate_rules_frozen'] is True
          assert g['5y_validation_consumed'] is True
          assert g['fresh_holdout_consumed'] is False
          assert g['trader_certified'] is False
          assert g['live_authorized'] is False
          assert g['real_capital_authorized'] is False
          PY
      - name: Hash 5Y evidence
        run: |
          cd r37-output
          sha256sum r37-5y-validation-report.json r37-5y-scaled-trades.jsonl stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-gbpjpy-r37-frozen-r36-5y-validation-${{ env.EVIDENCE_SHA }}
          path: r37-output
          if-no-files-found: error
          retention-days: 90
