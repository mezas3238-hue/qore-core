name: VT08 Index R116 Anatomy Retest Execution Attribution

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r116-anatomy-retest-execution-attribution.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r116_anatomy_retest_execution_attribution.py
      - tests/infrastructure/trader_lab/test_vt08_index_r116_anatomy_retest_execution_attribution.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r116_anatomy_retest_execution_attribution.py

  attribution:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R116 anatomy x retest attribution
        run: |
          mkdir -p artifacts/report
          python -m qore.infrastructure.trader_lab.vt08_index_r116_anatomy_retest_execution_attribution \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r116-anatomy-retest-execution-attribution.json

      - name: Verify R116 frozen attribution contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r116-anatomy-retest-execution-attribution.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R116_ANATOMY_RETEST_EXECUTION_ATTRIBUTION_001"
          )
          assert report["source_r115"]["run_id"] == 35666028472
          assert report["source_r115"]["artifact_id"] == 10669327043
          assert report["source_r115"]["artifact_digest"] == (
              "sha256:86c7b0851e39f78fa6d5bc3c8d8c961d53cde79acb5011570c9753e6a3ddbbc4"
          )
          expected = {
              "five_year": (1756, 1049),
              "recent_two_year": (746, 452),
              "r66_failed_holdout": (546, 318),
          }
          for key, (sample, retest) in expected.items():
              section = report[key]
              assert section["sample"] == sample
              assert section["expected_sample"] == sample
              assert section["retest_available_count"] == retest
              assert section["expected_retest_available_count"] == retest
              assert sum(
                  int(row["sample"])
                  for row in section["by_last_state"].values()
              ) == sample

          contract = report["preregistered_contract"]
          assert contract["rule_change"] is False
          assert contract["same_setup_only"] is True
          assert contract["retest_creates_second_trade"] is False
          assert contract["standard_only"] is True
          assert contract["same_r102_fixed_weights"] is True
          assert contract["same_protected_swing_stop"] is True
          assert contract["same_target_r"] == "2.5"
          assert contract["retest_bar_target_credit_allowed"] is False
          assert contract["retest_required_policy_created"] is False
          assert contract["fallback_policy_changed"] is False
          assert contract["signals_suppressed"] is False
          assert contract["trade_count_changed"] is False
          assert contract["runtime_filter_created"] is False

          gov = report["governance"]
          assert gov["research_only"] is True
          assert gov["candidate_created"] is False
          assert gov["signals_suppressed"] is False
          assert gov["trade_count_changed"] is False
          assert gov["target_changed"] is False
          assert gov["stop_changed"] is False
          assert gov["risk_allocator_changed"] is False
          assert gov["runtime_filter_created"] is False
          assert gov["anchor_14_enabled"] is False
          assert gov["live_authorized"] is False
          assert gov["real_capital_authorized"] is False
          assert gov["production_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r116-anatomy-retest-execution-attribution-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
