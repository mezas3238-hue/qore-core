name: VT08 Index R35 Five Year Temporal Contract

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r35-five-year-temporal-contract.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r35_five_year_temporal_contract.py
      - tests/infrastructure/trader_lab/test_vt08_index_r35_five_year_temporal_contract.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r35_five_year_temporal_contract.py

  research:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R35 exact five-year temporal contract
        run: |
          python -m qore.infrastructure.trader_lab.vt08_index_r35_five_year_temporal_contract \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r35-five-year-temporal-contract.json

      - name: Verify temporal governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(Path("artifacts/report/vt08-index-r35-five-year-temporal-contract.json").read_text())
          assert report["identity"] == "VT08_INDEX_R35_FIVE_YEAR_TEMPORAL_CONTRACT_001"
          assert 2300 <= report["sample"] <= 2500
          t=report["temporal_contract"]
          assert t["full_year_block_count"] == 5
          assert t["boundaries"] == [
              "2018-09-15",
              "2019-09-15",
              "2020-09-15",
              "2021-09-15",
              "2022-09-15",
              "2023-09-15",
          ]
          assert t["calendar_partial_years_are_certification_gate"] is False
          g=report["governance"]
          assert g["trading_rule_changed_from_r34"] is False
          assert g["new_optimization_dimension_added"] is False
          assert g["temporal_evaluation_contract_corrected"] is True
          assert g["calendar_year_used_for_runtime_decision"] is False
          assert g["all_structural_signals_preserved"] is True
          assert g["signal_suppression_allowed"] is False
          assert g["live_authorized"] is False
          assert g["real_capital_authorized"] is False
          assert g["production_authorized"] is False
          PY

      - name: Upload R35 evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-index-r35-five-year-temporal-contract-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
