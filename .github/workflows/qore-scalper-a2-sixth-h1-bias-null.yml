name: QORE Scalper A2 Sixth H1 Same-Bias Randomized Null

on:
  push:
    branches:
      - agent/scalper-architect-b-methodology-20261010
    paths:
      - '.github/workflows/qore-scalper-a2-sixth-h1-bias-null.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_h1_direction_random_baseline_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_scalper_h1_direction_random_baseline_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: scalper-a2-sixth-null-${{ github.ref }}
  cancel-in-progress: true

env:
  V49_ORIGINAL_RUN: '38053946695'
  V49_ORIGINAL_SHA: 'e356e7a52541e99533b25ecfef0ab9c4e9ce03c0'
  NATIVE_M1_RUN: '35548099334'
  NATIVE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Validate preregistered random null and as-of H1 source episode
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_scalper_h1_direction_random_baseline_v1.py tests/infrastructure/trader_lab/test_capitalizer_scalper_h1_direction_random_baseline_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_scalper_h1_direction_random_baseline_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_scalper_h1_direction_random_baseline_v1.py

  market:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol: [USDJPY, AUDJPY, AUDUSD, GBPJPY, EURUSD, GBPUSD, XAUUSD, USDCAD, NAS100]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download original immutable V49 source ledger and trade book
        uses: actions/download-artifact@v4
        with:
          name: scalper-a2-v49-control-${{ matrix.symbol }}-${{ env.V49_ORIGINAL_SHA }}
          path: original-v49
          github-token: ${{ github.token }}
          run-id: ${{ env.V49_ORIGINAL_RUN }}
      - name: Download original provider native M1 for exactly this symbol
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.NATIVE_M1_SHA }}
          path: native-m1
          github-token: ${{ github.token }}
          run-id: ${{ env.NATIVE_M1_RUN }}
      - name: Validate original market manifest and reject synthetic M1
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads(Path("native-m1/m1-clone-manifest.json").read_text())
          assert x["canonical_symbol"]==os.environ["SYMBOL"]
          assert x["provider_native_m1"] is True
          assert x["synthetic_m1"] is False and x["interpolated_m1"] is False
          assert x["contradictory_m1"] == 0 and x["read_only"] is True
          PY
      - name: Draw 32 same-H1 bias times, 32 H1-clock-matched and coinflip
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_h1_direction_random_baseline_v1 market original-v49 native-m1 market-output
      - name: Validate all original source IDs persisted without execution mutation
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads(Path("market-output/scalper-h1-bias-null-market.json").read_text())
          assert x["symbol"]==os.environ["SYMBOL"]
          assert x["sources"]==x["joined"]
          assert x["draws_per_mode"]==32
          assert x["candidate_membership_uses_h1_state_until"] is False
          assert x["randomization_uses_future_price_path"] is False
          assert x["no_trader_rules_changed"] is True
          assert x["trader_certified"] is False and x["live_authorized"] is False
          print("BIAS NULL MARKET",x)
          PY
      - name: Archive per-source null replication and original source identity
        uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-sixth-null-${{ matrix.symbol }}-${{ github.sha }}
          path: market-output/
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Fetch all original-source-matched 9 market H1 random null ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: scalper-a2-sixth-null-*-${{ github.sha }}
          path: nine-market-null
          merge-multiple: false
      - name: Pair original 2020 MAX3 and null, bootstrap by NY operating date
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_h1_direction_random_baseline_v1 matrix nine-market-null matrix-output
      - name: Verify bias and timing diagnostic NOT trader certification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("matrix-output/scalper-h1-bias-null-nine-market.json").read_text())
          assert x["markets"]==9 and x["sources"]==2876
          assert x["selected_max3"]==2020 and x["source_winners_unchanged"]==1167
          assert x["draws_each_mode"]==32
          assert x["h1_state_until_used"] is False
          assert x["outcomes_used_to_choose_null"] is False
          assert x["experimental_filter_promoted"] is False
          assert not x["trader_certified"] and not x["live_authorized"]
          print("SIXTH H1 RANDOM NULL PRIMARY", x["primary"])
          print("SIXTH H1 DATE CLUSTER BOOTSTRAP", x["cluster_bootstrap"])
          for group, parts in x["by"].items():
              for name, metrics in parts.items():
                  print("SIXTH H1 RANDOM NULL SEGMENT",group,name,metrics)
          PY
      - name: Archive primary null, balanced comparisons and clustered CIs
        uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-sixth-h1-null-nine-market-${{ github.sha }}
          path: matrix-output/
          retention-days: 90
          if-no-files-found: error
