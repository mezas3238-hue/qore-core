name: QORE VT-31 R8 Upstream Density Forensics

on:
  push:
    branches:
      - agent/vt31-r8-fresh-failure-forensics-001
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  forensics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Recover immutable consumed R5 R6 and R8 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p consumed/r5 consumed/r6 consumed/r8
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10380044761/zip" > r5.zip
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10389112524/zip" > r6.zip
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10402199719/zip" > r8.zip
          echo "828335b99cd51c663e3f0f095df5137e881da3d7e8da741da8ca116a0400edf8  r5.zip" | sha256sum -c -
          echo "9b0f3a05dc76b5dd83e5e3610266484bee1b79595dbbaacdff1d799115ad58b9  r6.zip" | sha256sum -c -
          unzip -q r5.zip -d consumed/r5
          unzip -q r6.zip -d consumed/r6
          unzip -q r8.zip -d consumed/r8
      - name: Classify upstream setup-density collapse
        run: |
          set -euo pipefail
          python scripts/vt31_r8_upstream_density_forensics.py \
            consumed/r5/fresh/NAS100/market-evidence.json \
            consumed/r5/fresh/SP500/market-evidence.json \
            consumed/r5/fresh/US30/market-evidence.json \
            consumed/r6/fresh/NAS100/market-evidence.json \
            consumed/r6/fresh/SP500/market-evidence.json \
            consumed/r6/fresh/US30/market-evidence.json \
            consumed/r8/fresh/NAS100/market-evidence.json \
            consumed/r8/fresh/SP500/market-evidence.json \
            consumed/r8/fresh/US30/market-evidence.json \
            > vt31-r8-upstream-density-forensics.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('vt31-r8-upstream-density-forensics.json').read_text())
          for p, markets in x['partitions'].items():
              print('\n', p)
              for m, r in markets.items():
                  print(m, r['first_base_candidate_days'], r['first_base_candidate_rate'], r['terminal_stage_counts'])
          PY
          echo "$GITHUB_SHA" > git-sha.txt
          sha256sum vt31-r8-upstream-density-forensics.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-r8-upstream-density-forensics-${{ github.sha }}
          path: |
            vt31-r8-upstream-density-forensics.json
            git-sha.txt
            SHA256SUMS
          retention-days: 90
