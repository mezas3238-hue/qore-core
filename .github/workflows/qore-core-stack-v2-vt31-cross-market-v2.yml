name: QORE Core Stack V2 VT31 Cross Market V2

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - scripts/vt31_core_stack_v2_shared_cross_market_v2.py
      - .github/workflows/qore-core-stack-v2-vt31-cross-market-v2.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  cross-market:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Static validation
        run: |
          ruff check scripts/vt31_core_stack_v2_shared_cross_market_v2.py
          python -m py_compile scripts/vt31_core_stack_v2_shared_cross_market_v2.py
      - name: Recover GREEN VT31 pure baseline and CIBO Eight-Ledger
        run: |
          set -euo pipefail
          mkdir -p input/pure input/cibo result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10799064861/zip" > pure.zip
          unzip -q pure.zip -d input/pure
          (cd input/pure && sha256sum -c SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10478487667/zip" > cibo.zip
          unzip -q cibo.zip -d input/cibo
          (cd input/cibo && sha256sum -c SHA256SUMS)
      - name: Run causal cross-market falsification
        run: |
          python scripts/vt31_core_stack_v2_shared_cross_market_v2.py             --r8 input/pure/r8.json             --r6 input/pure/r6.json             --r5 input/pure/r5.json             --daily-path input/cibo/DAILY_PATH_LEDGER.jsonl             --output result/cross-market-v2.json             | tee result/summary.json
      - name: Governance and binding gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/cross-market-v2.json").read_text())
          assert p["challenge_set"] == {"trades":822,"losses":711,"wins":111}
          g=p["governance"]
          assert g["methodology_modified"] is False
          assert g["post_outcome_cross_market_features_used"] is False
          assert g["current_trade_outcome_used"] is False
          assert g["r5_retuned"] is False
          assert g["shared_order_authority"] is False
          assert g["shared_risk_authority"] is False
          assert g["live_authorized"] is False
          assert g["merge_authorized"] is False
          print(json.dumps({
              "selection_status":p["selection_status"],
              "passes_cross_market_mission1":p["passes_cross_market_mission1"],
              "frozen_policy":p["frozen_policy"],
              "r5_baseline":p.get("r5_baseline"),
              "r5_evaluation":p["r5_evaluation"],
              "gates":p.get("gates"),
          },sort_keys=True))
          PY
      - name: Bind result
        run: |
          echo "$GITHUB_SHA" > result/git-sha.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd result && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-core-stack-v2-vt31-cross-market-v2-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
