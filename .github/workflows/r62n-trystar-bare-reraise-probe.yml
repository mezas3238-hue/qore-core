name: R62N TryStar bare reraise probe

on:
  push:
    branches:
      - agent/r62n-trystar-bare-reraise-probe-001
    paths:
      - .github/workflows/r62n-trystar-bare-reraise-probe.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r62n-trystar-bare-reraise-probe-001
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Install tooling
        run: python -m pip install -e '.[dev]'
      - name: Apply candidate repair
        run: python .github/scripts/r62n_trystar_bare_reraise_patch.py
      - name: Validate targeted contract
        run: |
          ruff check tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
          mypy tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
          pytest -q tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
      - name: Publish validated experimental target
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
          git rm .github/scripts/r62n_trystar_bare_reraise_patch.py
          git rm .github/workflows/r62n-trystar-bare-reraise-probe.yml
          git commit -m 'Validate TryStar bare reraise state sequencing'
          git push origin HEAD:agent/r62n-trystar-bare-reraise-probe-001
