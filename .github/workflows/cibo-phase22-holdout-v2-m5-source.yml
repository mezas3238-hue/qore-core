name: QORE CIBO Phase22 Holdout V2 Full M5 Source

on:
  push:
    branches:
      - agent/cibo-certification-architect-b-integration-001
    paths:
      - '.github/workflows/cibo-phase22-holdout-v2-m5-source.yml'
      - 'src/qore/infrastructure/cibo_phase22_holdout_v2_m5_source.py'
      - 'tests/infrastructure/test_cibo_phase22_holdout_v2_m5_source.py'
  workflow_dispatch:

concurrency:
  group: cibo-phase22-holdout-v2-m5-source-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
  QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,ctrader]'
      - name: Focused quality
        run: |
          ruff check \
            src/qore/infrastructure/cibo_phase22_holdout_v2_m5_source.py \
            tests/infrastructure/test_cibo_phase22_holdout_v2_m5_source.py
          mypy src/qore/infrastructure/cibo_phase22_holdout_v2_m5_source.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_phase22_holdout_v2_m5_source.py

  collect:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol: [AUDJPY, AUDUSD, EURUSD, GBPJPY, GBPUSD, NAS100, USDCAD, USDJPY, XAUUSD]
    env:
      QORE_SYMBOL: ${{ matrix.symbol }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[ctrader]'
      - name: Verify DEMO read-only credential inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in QORE_CTRADER_CLIENT_ID QORE_CTRADER_CLIENT_SECRET QORE_CTRADER_ACCESS_TOKEN QORE_CTRADER_REFRESH_TOKEN; do
            test -n "${!name:-}" || { echo "missing required DEMO input: $name" >&2; exit 2; }
          done
      - name: Discover DEMO account when not configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            [[ "$account_id" =~ ^[1-9][0-9]*$ ]] || exit 3
            echo "::add-mask::$account_id"
            printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          fi
      - name: Collect full V2 M5 source only
        run: |
          mkdir -p "artifacts/${QORE_SYMBOL}"
          python -m qore.infrastructure.cibo_phase22_holdout_v2_m5_source \
            "${QORE_SYMBOL}" "artifacts/${QORE_SYMBOL}" \
            > "artifacts/${QORE_SYMBOL}/stdout.json"
      - name: Enforce source-only governance
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path("artifacts")/os.environ["QORE_SYMBOL"]
          p=json.loads((root/"phase22-v2-source-manifest.json").read_text())
          assert p["candidate_id"]=="CIBO_USD60_6M_HOLDOUT_2015-10-19_2016-04-19_V2"
          assert p["raw_integrity_status"]=="CLEAN_PROVIDER_PAYLOAD"
          assert p["trader_logic_executed"] is False
          assert p["outcomes_inspected"] is False
          assert p["productive_authority"] is False
          PY
          printf '%s\n' "$GITHUB_SHA" > "artifacts/${QORE_SYMBOL}/git-sha.txt"
          cd "artifacts/${QORE_SYMBOL}"
          sha256sum -c PHASE22_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-phase22-v2-m5-${{ matrix.symbol }}-${{ github.sha }}
          path: artifacts/${{ matrix.symbol }}
          if-no-files-found: error
          retention-days: 90
