name: QORE VT31 Comparator 007 Residual DD Forensics V1

on:
  push:
    branches:
      - agent/vt31-edge-position-cert-b-001
    paths:
      - scripts/vt31_nas100_comp007_residual_dd_forensics_v1.py
      - scripts/vt31_nas100_rapid_breaker_conflict_admission_frontier_v1.py
      - .github/workflows/vt31-comp007-residual-dd-forensics-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  consumed:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ARTIFACT_ID: "10557487418"
      EXPECTED_EVIDENCE_SHA256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
      EVIDENCE_PATH: "NAS100/market-evidence.json"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Static and focused gates
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_comp007_residual_dd_forensics_v1.py
          ruff check scripts/vt31_nas100_comp007_residual_dd_forensics_v1.py

      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"

      - name: Reconstruct exact Comparator 007 residual DD
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python \
            scripts/vt31_nas100_comp007_residual_dd_forensics_v1.py \
            "input/${EVIDENCE_PATH}" \
            --output result/comp007-residual-dd-consumed.json \
            | tee result/summary-consumed.json

      - name: Governance and known-baseline lock
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          x=json.loads(Path("result/comp007-residual-dd-consumed.json").read_text())
          assert x["comparator_id"] == "VT31_AB_COMP007_RAPID_BREAKER_UNION_SURVIVOR"
          assert x["comparator_trade_count"] == 33
          assert Decimal(x["exact_drawdown"]["max_drawdown_r"]) == Decimal(
              "6.593383112613881844651075420"
          )
          g=x["governance"]
          assert g["observation_only"] is True
          assert g["policy_change_authorized"] is False
          assert g["new_threshold_added"] is False
          assert g["outcome_labels_runtime_authority"] is False
          assert g["position_sizing_used"] is False
          assert g["dynamic_sizing_used"] is False
          assert g["leverage_used"] is False
          assert g["compounding_used"] is False
          assert g["capital_weighting_used"] is False
          assert g["fresh_holdout_opened"] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-comp007-residual-dd-forensics-${{ github.sha }}
          path: result/
          retention-days: 90
