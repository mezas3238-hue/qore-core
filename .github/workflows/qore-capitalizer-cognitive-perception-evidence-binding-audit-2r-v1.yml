name: QORE Capitalizer Cognitive Perception Evidence Binding Audit 2R V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-cognitive-perception-evidence-binding-audit-2r-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_cognitive_perception_evidence_binding_audit_2r_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_cognitive_perception_evidence_binding_audit_2r_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-cognitive-perception-evidence-binding-audit-2r-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  REBASE_RUN_ID: '36078677895'
  REBASE_SHA: 'cfc04849c8bbfd6565310d89456f5e367ea880f7'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check             src/qore/infrastructure/trader_lab/capitalizer_cognitive_perception_evidence_binding_audit_2r_v1.py             tests/infrastructure/trader_lab/test_capitalizer_cognitive_perception_evidence_binding_audit_2r_v1.py
      - name: Mypy
        run: |
          mypy             src/qore/infrastructure/trader_lab/capitalizer_cognitive_perception_evidence_binding_audit_2r_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov             tests/infrastructure/trader_lab/test_capitalizer_cognitive_perception_evidence_binding_audit_2r_v1.py

  audit:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download true-2R cognitive rebase
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cognitive-economic-rebase-2r-v1-${{ env.REBASE_SHA }}
          path: rebase-input
          github-token: ${{ github.token }}
          run-id: ${{ env.REBASE_RUN_ID }}
      - name: Build tri-state Perception evidence binding
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cognitive_perception_evidence_binding_audit_2r_v1             rebase-input perception-output
      - name: Enforce Perception evidence controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "perception-output/"
                  "capitalizer-cognitive-perception-evidence-binding-audit-2r-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_COGNITIVE_PERCEPTION_EVIDENCE_BINDING_AUDIT_2R_V1"
          )
          assert report["source_rebase_run_id"] == 36078677895
          assert report["target_r"] == "2.00"
          assert report["control_trades"] == 948

          facts = report["fact_state_counts"]
          assert facts["quote_fresh"] == {
              "SUPPORTED_TRUE": 0,
              "SUPPORTED_FALSE": 0,
              "UNBOUND": 948,
          }
          assert facts["bars_complete"] == {
              "SUPPORTED_TRUE": 0,
              "SUPPORTED_FALSE": 0,
              "UNBOUND": 948,
          }
          assert facts["timestamps_ordered"] == {
              "SUPPORTED_TRUE": 948,
              "SUPPORTED_FALSE": 0,
              "UNBOUND": 0,
          }
          assert facts["provenance_valid"] == {
              "SUPPORTED_TRUE": 948,
              "SUPPORTED_FALSE": 0,
              "UNBOUND": 0,
          }
          assert facts["microstructure_complete"] == {
              "SUPPORTED_TRUE": 948,
              "SUPPORTED_FALSE": 0,
              "UNBOUND": 0,
          }
          session = facts["session_clock_valid"]
          assert session["UNBOUND"] == 0
          assert session["SUPPORTED_TRUE"] + session["SUPPORTED_FALSE"] == 948

          assert report["quote_fresh_evidence_bound"] is False
          assert report["bars_complete_evidence_bound"] is False
          assert report["timestamps_ordered_evidence_bound"] is True
          assert report["session_clock_evidence_bound"] is True
          assert report["provenance_evidence_bound"] is True
          assert report["microstructure_complete_evidence_bound"] is True
          assert report["runtime_perception_assessor_called"] is False
          assert report["full_perception_status_supported_trades"] == 0
          assert report["unknown_evidence_coerced_to_false"] is False
          assert report["current_trade_outcome_visible_to_binding"] is False
          assert report["missing_evidence_fabricated"] is False
          assert report["rebase_control_reproduced"] is True
          assert report["strategy_rules_changed"] is False
          assert report["cognitive_rules_changed"] is False
          assert report["entry_changed"] is False
          assert report["stop_changed"] is False
          assert report["target_changed"] is False
          assert report["max3_changed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-cognitive-perception-evidence-binding-audit-2r-v1-${{ github.sha }}
          path: perception-output
          if-no-files-found: error
          retention-days: 90
