name: QORE CIBO Atlas VT31 Error Concentration Map

on:
  push:
    branches: [agent/cibo-atlas-vt31-market-specialists-001]
    paths:
      - scripts/cibo_atlas_vt31_error_concentration_map.py
      - .github/workflows/cibo-atlas-vt31-error-concentration-map.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  error-concentration-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research runtime
        run: pip install -e .[dev]
      - name: Static validation
        run: |
          set -euo pipefail
          python -m py_compile scripts/cibo_atlas_vt31_error_concentration_map.py
          ruff check --ignore E501 scripts/cibo_atlas_vt31_error_concentration_map.py
          mypy src/qore/infrastructure/cibo_atlas_market_lab.py
          python scripts/cibo_atlas_vt31_error_concentration_map.py --self-test
      - name: Recover immutable root-cause attribution
        run: |
          set -euo pipefail
          artifact_id=10469098482
          expected=722c92398e0af62f7ab20b27adc2d0e9fd013ebe7fd7f800122e126e6d6d6ffd
          digest="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" --jq .digest)"
          test "$digest" = "sha256:${expected}"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > source.zip
          echo "${expected}  source.zip" | sha256sum -c -
          mkdir source
          unzip -q source.zip -d source
          (cd source && sha256sum -c SHA256SUMS)
          test "$(cat source/git-sha.txt)" = "0734e88aa477adc75f687e8a629a46f088c36706"
          test -f source/cibo-atlas-vt31-root-cause-attribution.json
          printf '%s\n' "$artifact_id" > source-artifact-id.txt
          printf '%s\n' "$digest" > source-artifact-digest.txt
      - name: Build error concentration map
        run: |
          set -euo pipefail
          mkdir result
          python scripts/cibo_atlas_vt31_error_concentration_map.py \
            --source source/cibo-atlas-vt31-root-cause-attribution.json \
            --output-dir result
      - name: Validate governance and conservation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('result/cibo-atlas-vt31-error-concentration-map.json').read_text())
          assert p['schema']=='qore.cibo_atlas.vt31.error_concentration_map.v1'
          assert p['research_only'] is True and p['selection_prohibited'] is True
          assert p['opens_new_holdout'] is False
          assert p['candidate_status']=='NO_R9_NOT_CERTIFIED'
          assert p['terminal_root_count']==618
          assert p['demonstrated_total']==163
          assert p['live_authorized'] is False and p['production_authorized'] is False
          print(json.dumps({'demonstrated_total':p['demonstrated_total'],'dimensions':p['dimensions']},sort_keys=True))
          PY
      - name: Bind immutable concentration artifact
        run: |
          set -euo pipefail
          echo "$GITHUB_SHA" > result/git-sha.txt
          cp source-artifact-id.txt source-artifact-digest.txt result/
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-atlas-vt31-error-concentration-map-${{ github.sha }}
          path: result/
          retention-days: 90
