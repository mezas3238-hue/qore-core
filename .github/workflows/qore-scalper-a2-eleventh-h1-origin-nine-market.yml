name: QORE Scalper A2 Eleventh H1 C2 C3 Source Origin Census

on:
  push:
    branches:
      - agent/scalper-architect-b-methodology-20261010
    paths:
      - '.github/workflows/qore-scalper-a2-eleventh-h1-origin-nine-market.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_a2_eleventh_h1_origin_audit_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_scalper_a2_eleventh_h1_origin_audit_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: scalper-a2-h1-origin-${{ github.ref }}
  cancel-in-progress: true

env:
  CONTROL_RUN: '38053946695'
  CONTROL_SHA: 'e356e7a52541e99533b25ecfef0ab9c4e9ce03c0'

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: H1 origin source attribution quality
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_scalper_a2_eleventh_h1_origin_audit_v1.py tests/infrastructure/trader_lab/test_capitalizer_scalper_a2_eleventh_h1_origin_audit_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_scalper_a2_eleventh_h1_origin_audit_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_scalper_a2_eleventh_h1_origin_audit_v1.py

  market:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol: [USDJPY, AUDJPY, AUDUSD, GBPJPY, EURUSD, GBPUSD, XAUUSD, USDCAD, NAS100]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: scalper-a2-v49-control-${{ matrix.symbol }}-${{ env.CONTROL_SHA }}
          path: original
          github-token: ${{ github.token }}
          run-id: ${{ env.CONTROL_RUN }}
      - name: Preserve all source IDs, separate H1 C2 and C3
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_a2_eleventh_h1_origin_audit_v1 market original market-output
      - name: Source-accounting contract
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads(Path("market-output/scalper-eleventh-h1-market.json").read_text())
          assert x["symbol"]==os.environ["SYMBOL"]
          counts=x["basis_counts"]
          assert sum(counts.get(k,0) for k in ("CANDLE2_REVERSAL","CANDLE3_CONFIRMATION","UNRESOLVED_SOURCE_BASIS"))==x["sources"]
          assert counts.get("SESSION_INHERITED",0)+counts.get("STATE_BEGAN_AT_H1_EVENT",0)==x["sources"]
          assert not x["author_fidelity_certified"] and not x["paper_replay"]
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-eleventh-h1-origin-${{ matrix.symbol }}-${{ github.sha }}
          path: market-output/
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: scalper-a2-eleventh-h1-origin-*-${{ github.sha }}
          path: market-inputs
      - run: python -m qore.infrastructure.trader_lab.capitalizer_scalper_a2_eleventh_h1_origin_audit_v1 matrix market-inputs nine-market-output
      - name: Require fixed original denominator and honest source status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("nine-market-output/scalper-eleventh-h1-nine-market.json").read_text())
          assert x["markets"]==9 and x["sources"]==2876
          assert sum(x["closure_basis_counts"].values())==2876
          assert x["admissions_changed"]==0 and x["profit_factor"] is None
          print("H1 SOURCE C2/C3/INHERITED",x)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-eleventh-h1-origin-nine-market-${{ github.sha }}
          path: nine-market-output/
          retention-days: 90
          if-no-files-found: error
