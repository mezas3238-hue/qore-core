name: Trader History Integrity Closure

on:
  push:
    branches:
      - agent/trader-history-registry-identity-closure-001

permissions:
  contents: write

jobs:
  close-integrity:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/trader-history-registry-identity-closure-001
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply bounded semantic closure
        run: python .github/scripts/trader_history_integrity_closure.py

      - name: Focused integrity tests
        run: pytest -q tests/infrastructure/trader_history/test_trader_history_registry.py tests/infrastructure/trader_history/test_trader_history_cibo_adapter.py

      - name: Full QG Ruff
        run: ruff check .

      - name: Full QG Mypy
        run: mypy src tests

      - name: Full QG Pytest coverage
        run: pytest --cov=src/qore --cov-report=term-missing

      - name: Commit bounded closure and remove temporary tooling
        run: |
          git config user.name "qore-integration-authority"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/trader-history-integrity-closure.yml
          git rm .github/scripts/trader_history_integrity_closure.py
          git add src/qore/infrastructure/trader_history/registry.py
          git add src/qore/infrastructure/trader_history/cibo_adapter.py
          git add tests/infrastructure/trader_history/test_trader_history_registry.py
          git add tests/infrastructure/trader_history/test_trader_history_cibo_adapter.py
          git diff --cached --check
          git commit -m "Harden Trader History evidence integrity for CIBO"
          git push origin HEAD:agent/trader-history-registry-identity-closure-001
