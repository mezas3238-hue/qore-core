name: Trader History Integrity Closure

on:
  push:
    branches:
      - agent/trader-history-registry-identity-closure-001

permissions:
  contents: write

jobs:
  close-integrity:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/trader-history-registry-identity-closure-001
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply bounded semantic closure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, found {count}")
              path.write_text(text.replace(old, new))

          registry = Path("src/qore/infrastructure/trader_history/registry.py")
          old_partition = '''    seen_partitions: dict[object, tuple[SampleRole, str]] = {}
    dataset_roles: dict[str, SampleRole] = {}
    ev_owners: dict[str, TraderHistoryStudyId] = {}
    for record in records:
        for partition in record.partitions:
            previous = seen_partitions.get(partition.partition_id)
            if previous is not None and previous != (
                partition.role,
                partition.dataset_fingerprint,
            ):
                raise TraderHistoryValidationError(
                    "partition identity cannot be relabeled with a different role "
                    "or dataset"
                )
            seen_partitions[partition.partition_id] = (
                partition.role,
                partition.dataset_fingerprint,
            )
            committed_role = dataset_roles.get(partition.dataset_fingerprint)
            if committed_role is not None and committed_role is not partition.role:
                raise TraderHistoryValidationError(
                    "dataset fingerprint cannot be relabeled across sample roles"
                )
            dataset_roles[partition.dataset_fingerprint] = partition.role
            if partition.role is SampleRole.EXTERNAL_VALIDATION:
                owner = ev_owners.get(partition.dataset_fingerprint)
                if owner is not None and owner != record.study_id:
                    raise TraderHistoryValidationError(
                        "external-validation holdout content cannot be consumed by "
                        "more than one study"
                    )
                ev_owners[partition.dataset_fingerprint] = record.study_id
'''
          new_partition = '''    seen_partitions: dict[object, tuple[SampleRole, str]] = {}
    dataset_roles: dict[tuple[str, str], SampleRole] = {}
    ev_owners: dict[tuple[str, str], TraderHistoryStudyId] = {}
    for record in records:
        trader_lineage = record.trader_version.trader_code.value
        for partition in record.partitions:
            previous = seen_partitions.get(partition.partition_id)
            if previous is not None and previous != (
                partition.role,
                partition.dataset_fingerprint,
            ):
                raise TraderHistoryValidationError(
                    "partition identity cannot be relabeled with a different role "
                    "or dataset"
                )
            seen_partitions[partition.partition_id] = (
                partition.role,
                partition.dataset_fingerprint,
            )
            dataset_key = (trader_lineage, partition.dataset_fingerprint)
            committed_role = dataset_roles.get(dataset_key)
            if committed_role is not None and committed_role is not partition.role:
                raise TraderHistoryValidationError(
                    "dataset fingerprint cannot be relabeled across sample roles "
                    "within the same Trader lineage"
                )
            dataset_roles[dataset_key] = partition.role
            if partition.role is SampleRole.EXTERNAL_VALIDATION:
                owner = ev_owners.get(dataset_key)
                if owner is not None and owner != record.study_id:
                    raise TraderHistoryValidationError(
                        "external-validation holdout content cannot be consumed by "
                        "more than one study within the same Trader lineage"
                    )
                ev_owners[dataset_key] = record.study_id
'''
          replace_once(registry, old_partition, new_partition)

          old_hypothesis = '''        if parent.hypothesis_id != record.hypothesis_id:
            raise TraderHistoryValidationError(
                "hypothesis id must match the parent hypothesis study"
            )
        if (
            parent.trader_version.fingerprint
            == record.trader_version.fingerprint
        ):
'''
          new_hypothesis = '''        if parent.hypothesis_id != record.hypothesis_id:
            raise TraderHistoryValidationError(
                "hypothesis id must match the parent hypothesis study"
            )
        if parent.trader_version.trader_code != record.trader_version.trader_code:
            raise TraderHistoryValidationError(
                "hypothesis confirmation/falsification must remain within the "
                "same Trader lineage"
            )
        if (
            parent.trader_version.fingerprint
            == record.trader_version.fingerprint
        ):
'''
          replace_once(registry, old_hypothesis, new_hypothesis)

          adapter = Path("src/qore/infrastructure/trader_history/cibo_adapter.py")
          old_adapter = '''    if type(freshness) is not CiboEvidenceFreshness:
        return Failure(
            CiboTraderHistoryAdapterError("adapter requires CiboEvidenceFreshness")
        )
    try:
        projection = project_current_capability(
            registry,
            trader_version,
            derived_at=freshness.as_of,
        )
'''
          new_adapter = '''    if type(freshness) is not CiboEvidenceFreshness:
        return Failure(
            CiboTraderHistoryAdapterError("adapter requires CiboEvidenceFreshness")
        )
    if type(qualified_markets) is not tuple or any(
        type(item) is not CiboTradeableMarketRef for item in qualified_markets
    ):
        return Failure(
            CiboTraderHistoryAdapterError(
                "qualified_markets must be an exact CiboTradeableMarketRef tuple"
            )
        )
    if type(qualified_timeframes) is not tuple or any(
        type(item) is not CiboTimeframeCode for item in qualified_timeframes
    ):
        return Failure(
            CiboTraderHistoryAdapterError(
                "qualified_timeframes must be an exact CiboTimeframeCode tuple"
            )
        )
    try:
        projection = project_current_capability(
            registry,
            trader_version,
            derived_at=freshness.as_of,
        )
'''
          replace_once(adapter, old_adapter, new_adapter)

          old_view = '''        view = projection.value

        by_code: dict[str, list[TraderHistoryMetricView]] = {}
'''
          new_view = '''        view = projection.value

        current_records = tuple(
            record
            for record in registry.records
            if record.trader_version.fingerprint == trader_version.fingerprint
            and record.produced_at <= freshness.as_of
        )
        superseded_ids = {
            target for record in current_records for target in record.supersedes
        }
        certified_scope_records = tuple(
            record
            for record in current_records
            if record.epistemic_status is TraderHistoryEpistemicStatus.CERTIFIED
            and record.study_id not in superseded_ids
        )
        supported_markets = {
            market.value
            for record in certified_scope_records
            for market in record.market_scope
        }
        supported_timeframes = {
            timeframe.value
            for record in certified_scope_records
            for timeframe in record.timeframe_scope
        }
        unsupported_markets = tuple(
            sorted(
                item.value
                for item in qualified_markets
                if item.value not in supported_markets
            )
        )
        unsupported_timeframes = tuple(
            sorted(
                item.value
                for item in qualified_timeframes
                if item.value not in supported_timeframes
            )
        )
        if unsupported_markets:
            raise CiboTraderHistoryAdapterError(
                "qualified markets are not backed by current certified historical "
                f"evidence: {unsupported_markets!r}"
            )
        if unsupported_timeframes:
            raise CiboTraderHistoryAdapterError(
                "qualified timeframes are not backed by current certified historical "
                f"evidence: {unsupported_timeframes!r}"
            )

        by_code: dict[str, list[TraderHistoryMetricView]] = {}
'''
          replace_once(adapter, old_view, new_view)

          registry_tests = Path("tests/infrastructure/trader_history/test_trader_history_registry.py")
          registry_marker = "\n\n# Integrity closure: Trader-lineage-scoped evidence governance.\n"
          if registry_marker in registry_tests.read_text():
              raise SystemExit("registry integrity tests already present")
          registry_tests.write_text(
              registry_tests.read_text()
              + registry_marker
              + '''def test_external_validation_holdout_can_be_shared_across_distinct_trader_lineages() -> None:
    vt08 = _version(code="vt-08", config=201)
    vt01 = _version(code="vt-01", config=202)
    first_holdout = TraderHistoryPartitionIdentity(
        uuid4(), _fp(203), SampleRole.EXTERNAL_VALIDATION
    )
    second_holdout = TraderHistoryPartitionIdentity(
        uuid4(), _fp(203), SampleRole.EXTERNAL_VALIDATION
    )
    registry = _registry(
        _study(
            version=vt08,
            kind=TraderHistoryStudyKind.OOS,
            partitions=(first_holdout,),
        )
    )
    result = registry.append_study(
        _study(
            version=vt01,
            kind=TraderHistoryStudyKind.OOS,
            partitions=(second_holdout,),
        )
    )
    assert isinstance(result, Success)


def test_external_validation_holdout_cannot_be_reused_within_trader_lineage() -> None:
    v1 = _version(code="vt-08", version="v1", config=204)
    v2 = _version(code="vt-08", version="v2", config=205)
    first_holdout = TraderHistoryPartitionIdentity(
        uuid4(), _fp(206), SampleRole.EXTERNAL_VALIDATION
    )
    second_holdout = TraderHistoryPartitionIdentity(
        uuid4(), _fp(206), SampleRole.EXTERNAL_VALIDATION
    )
    registry = _registry(
        _study(
            version=v1,
            kind=TraderHistoryStudyKind.OOS,
            partitions=(first_holdout,),
        )
    )
    result = registry.append_study(
        _study(
            version=v2,
            kind=TraderHistoryStudyKind.OOS,
            partitions=(second_holdout,),
        )
    )
    assert isinstance(result, Failure)
    assert isinstance(result.error, TraderHistoryBlockedError)


def test_hypothesis_confirmation_cannot_cross_trader_lineage() -> None:
    parent_version = _version(code="vt-08", config=207)
    foreign_version = _version(code="vt-17", config=208)
    hypothesis_id = TraderHistoryHypothesisId("HYP-VT08-CROSS-001")
    hypothesis = _study(
        version=parent_version,
        kind=TraderHistoryStudyKind.HYPOTHESIS,
        status=TraderHistoryEpistemicStatus.HYPOTHESIS,
        sufficiency=TraderHistorySufficiency.UNKNOWN,
        hypothesis_id=hypothesis_id,
        metrics=(),
    )
    registry = _registry(hypothesis)
    confirmation = _study(
        version=foreign_version,
        kind=TraderHistoryStudyKind.HYPOTHESIS_CONFIRMATION,
        status=TraderHistoryEpistemicStatus.CERTIFIED,
        sufficiency=TraderHistorySufficiency.SUFFICIENT,
        hypothesis_id=hypothesis_id,
        parent_study=hypothesis.study_id,
        partitions=(
            TraderHistoryPartitionIdentity(
                uuid4(), _fp(209), SampleRole.EXTERNAL_VALIDATION
            ),
        ),
        metrics=(_metric(value="0.15", ref="evidence:cross-confirm"),),
    )
    result = registry.append_study(confirmation)
    assert isinstance(result, Failure)
    assert isinstance(result.error, TraderHistoryBlockedError)


def test_hypothesis_falsification_cannot_cross_trader_lineage() -> None:
    parent_version = _version(code="vt-08", config=210)
    foreign_version = _version(code="vt-17", config=211)
    hypothesis_id = TraderHistoryHypothesisId("HYP-VT08-CROSS-002")
    hypothesis = _study(
        version=parent_version,
        kind=TraderHistoryStudyKind.HYPOTHESIS,
        status=TraderHistoryEpistemicStatus.HYPOTHESIS,
        sufficiency=TraderHistorySufficiency.UNKNOWN,
        hypothesis_id=hypothesis_id,
        metrics=(),
    )
    registry = _registry(hypothesis)
    falsification = _study(
        version=foreign_version,
        kind=TraderHistoryStudyKind.HYPOTHESIS_FALSIFICATION,
        status=TraderHistoryEpistemicStatus.FALSIFIED,
        sufficiency=TraderHistorySufficiency.SUFFICIENT,
        hypothesis_id=hypothesis_id,
        parent_study=hypothesis.study_id,
        metrics=(),
    )
    result = registry.append_study(falsification)
    assert isinstance(result, Failure)
    assert isinstance(result.error, TraderHistoryBlockedError)
'''
          )

          adapter_tests = Path("tests/infrastructure/trader_history/test_trader_history_cibo_adapter.py")
          old_exploratory_test = '''def test_adapter_excludes_insufficient_and_exploratory() -> None:
    version = _version()
    exploratory = build_study_record(
        study_id=TraderHistoryStudyId(uuid4()),
        study_version=TraderHistoryStudyVersion("v1"),
        trader_version=version,
        kind=TraderHistoryStudyKind.CHARACTERIZATION,
        epistemic_status=TraderHistoryEpistemicStatus.OBSERVED,
        sufficiency=TraderHistorySufficiency.INSUFFICIENT,
        produced_at=_NOW,
        producer=TraderHistoryProducerId("trader-lab"),
        market_scope=(TraderHistoryMarketRef("EUR/USD"),),
        timeframe_scope=(TraderHistoryTimeframeRef("h1"),),
        quantitative_claims=(_metric("0.99"),),
    )
    registry = TraderHistoricalIntelligenceRegistry(records=(exploratory,))
    result = project_cibo_capability_profile(
        registry,
        version,
        **_profile_kwargs(),
    )
    assert isinstance(result, Success)
    assert result.value.economic_metrics == ()
'''
          new_exploratory_test = '''def test_adapter_refuses_qualification_from_insufficient_and_exploratory() -> None:
    version = _version()
    exploratory = build_study_record(
        study_id=TraderHistoryStudyId(uuid4()),
        study_version=TraderHistoryStudyVersion("v1"),
        trader_version=version,
        kind=TraderHistoryStudyKind.CHARACTERIZATION,
        epistemic_status=TraderHistoryEpistemicStatus.OBSERVED,
        sufficiency=TraderHistorySufficiency.INSUFFICIENT,
        produced_at=_NOW,
        producer=TraderHistoryProducerId("trader-lab"),
        market_scope=(TraderHistoryMarketRef("EUR/USD"),),
        timeframe_scope=(TraderHistoryTimeframeRef("h1"),),
        quantitative_claims=(_metric("0.99"),),
    )
    registry = TraderHistoricalIntelligenceRegistry(records=(exploratory,))
    result = project_cibo_capability_profile(
        registry,
        version,
        **_profile_kwargs(),
    )
    assert isinstance(result, Failure)
    assert isinstance(result.error, CiboTraderHistoryAdapterError)
    assert "not backed by current certified historical evidence" in str(result.error)
'''
          replace_once(adapter_tests, old_exploratory_test, new_exploratory_test)

          adapter_marker = "\n\n# Integrity closure: CIBO qualification must be evidence-scoped.\n"
          if adapter_marker in adapter_tests.read_text():
              raise SystemExit("adapter integrity tests already present")
          adapter_tests.write_text(
              adapter_tests.read_text()
              + adapter_marker
              + '''def test_adapter_rejects_market_not_backed_by_certified_history() -> None:
    version = _version()
    registry = TraderHistoricalIntelligenceRegistry(
        records=(_study(version=version, metrics=(_metric("0.12"),)),)
    )
    result = project_cibo_capability_profile(
        registry,
        version,
        **_profile_kwargs(
            qualified_markets=(CiboTradeableMarketRef("GBP/USD"),),
        ),
    )
    assert isinstance(result, Failure)
    assert isinstance(result.error, CiboTraderHistoryAdapterError)
    assert "qualified markets are not backed" in str(result.error)


def test_adapter_rejects_timeframe_not_backed_by_certified_history() -> None:
    version = _version()
    registry = TraderHistoricalIntelligenceRegistry(
        records=(_study(version=version, metrics=(_metric("0.12"),)),)
    )
    result = project_cibo_capability_profile(
        registry,
        version,
        **_profile_kwargs(
            qualified_timeframes=(CiboTimeframeCode("m15"),),
        ),
    )
    assert isinstance(result, Failure)
    assert isinstance(result.error, CiboTraderHistoryAdapterError)
    assert "qualified timeframes are not backed" in str(result.error)


def test_adapter_does_not_use_future_certified_scope_for_current_qualification() -> None:
    version = _version()
    future = build_study_record(
        study_id=TraderHistoryStudyId(uuid4()),
        study_version=TraderHistoryStudyVersion("v1"),
        trader_version=version,
        kind=TraderHistoryStudyKind.REPLAY,
        epistemic_status=TraderHistoryEpistemicStatus.CERTIFIED,
        sufficiency=TraderHistorySufficiency.SUFFICIENT,
        produced_at=datetime(2026, 1, 2, 0, 0, tzinfo=UTC),
        producer=TraderHistoryProducerId("trader-lab"),
        market_scope=(TraderHistoryMarketRef("GBP/USD"),),
        timeframe_scope=(TraderHistoryTimeframeRef("h1"),),
        partitions=(_dev_partition(301),),
        quantitative_claims=(
            TraderHistoryMetric(
                "expectancy", Decimal("0.11"), (TraderHistoryEvidenceRef("evidence:future"),)
            ),
        ),
    )
    registry = TraderHistoricalIntelligenceRegistry(records=(future,))
    result = project_cibo_capability_profile(
        registry,
        version,
        **_profile_kwargs(
            qualified_markets=(CiboTradeableMarketRef("GBP/USD"),),
        ),
    )
    assert isinstance(result, Failure)
    assert isinstance(result.error, CiboTraderHistoryAdapterError)
    assert "qualified markets are not backed" in str(result.error)
'''
          )
          PY

      - name: Focused integrity tests
        run: |
          pytest -q tests/infrastructure/trader_history/test_trader_history_registry.py tests/infrastructure/trader_history/test_trader_history_cibo_adapter.py

      - name: Full QG Ruff
        run: ruff check .

      - name: Full QG Mypy
        run: mypy src tests

      - name: Full QG Pytest coverage
        run: pytest --cov=src/qore --cov-report=term-missing

      - name: Commit bounded closure and remove temporary workflow
        shell: bash
        run: |
          git config user.name "qore-integration-authority"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/trader-history-integrity-closure.yml
          git add src/qore/infrastructure/trader_history/registry.py \
                  src/qore/infrastructure/trader_history/cibo_adapter.py \
                  tests/infrastructure/trader_history/test_trader_history_registry.py \
                  tests/infrastructure/trader_history/test_trader_history_cibo_adapter.py
          git diff --cached --check
          git commit -m "Harden Trader History evidence integrity for CIBO"
          git push origin HEAD:agent/trader-history-registry-identity-closure-001
