name: QORE Capitalizer Cognitive Perception Bar Completeness Audit 2R V2

on:
  push:
    branches: [agent/qore-capitalizer-cognitive-v1-001]
    paths:
      - '.github/workflows/qore-capitalizer-cognitive-perception-bar-completeness-audit-2r-v2.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_cognitive_perception_bar_completeness_audit_2r_v2.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_cognitive_perception_bar_completeness_audit_2r_v2.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-cognitive-perception-bar-completeness-audit-2r-v2-${{ github.sha }}
  cancel-in-progress: false

env:
  REBASE_RUN_ID: '36078677895'
  REBASE_SHA: 'cfc04849c8bbfd6565310d89456f5e367ea880f7'
  PERCEPTION_V1_RUN_ID: '36087252085'
  PERCEPTION_V1_SHA: 'f28bf5238d84a1b5ea3bd61d2598ce465a537456'
  M1_RUN_ID: '35548099334'
  M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/qore/infrastructure/trader_lab/capitalizer_cognitive_perception_bar_completeness_audit_2r_v2.py tests/infrastructure/trader_lab/test_capitalizer_cognitive_perception_bar_completeness_audit_2r_v2.py
      - run: mypy src/qore/infrastructure/trader_lab/capitalizer_cognitive_perception_bar_completeness_audit_2r_v2.py
      - run: pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_cognitive_perception_bar_completeness_audit_2r_v2.py

  scan:
    needs: quality
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {symbol: AUDJPY, expected_trades: 82}
          - {symbol: AUDUSD, expected_trades: 105}
          - {symbol: EURUSD, expected_trades: 127}
          - {symbol: GBPJPY, expected_trades: 80}
          - {symbol: GBPUSD, expected_trades: 155}
          - {symbol: NAS100, expected_trades: 105}
          - {symbol: USDCAD, expected_trades: 100}
          - {symbol: USDJPY, expected_trades: 96}
          - {symbol: XAUUSD, expected_trades: 98}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cognitive-economic-rebase-2r-v1-${{ env.REBASE_SHA }}
          path: rebase-input
          github-token: ${{ github.token }}
          run-id: ${{ env.REBASE_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cognitive-perception-evidence-binding-audit-2r-v1-${{ env.PERCEPTION_V1_SHA }}
          path: perception-v1-input
          github-token: ${{ github.token }}
          run-id: ${{ env.PERCEPTION_V1_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.M1_SHA }}
          path: m1-input
          github-token: ${{ github.token }}
          run-id: ${{ env.M1_RUN_ID }}
      - name: Bind native-M1 bar completeness
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cognitive_perception_bar_completeness_audit_2r_v2 \
            market rebase-input perception-v1-input m1-input market-output \
            --symbol ${{ matrix.symbol }}
      - name: Enforce market controls
        env:
          MATRIX_SYMBOL: ${{ matrix.symbol }}
          EXPECTED_TRADES: ${{ matrix.expected_trades }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          symbol = os.environ["MATRIX_SYMBOL"]
          expected = int(os.environ["EXPECTED_TRADES"])
          report = json.loads((Path("market-output") / f"capitalizer-{symbol.lower()}-perception-bar-completeness-audit-2r-v2.json").read_text())
          assert report["identity"] == "QORE_CAPITALIZER_COGNITIVE_PERCEPTION_BAR_COMPLETENESS_AUDIT_2R_V2"
          assert report["symbol"] == symbol
          assert report["market_trades"] == expected
          assert report["bars_complete_supported_true"] + report["bars_complete_supported_false"] == expected
          assert report["bars_complete_evidence_bound"] is True
          assert report["quote_fresh_evidence_bound"] is False
          assert report["quote_fresh_inferred_from_ohlc"] is False
          assert report["current_trade_outcome_visible_to_binding"] is False
          assert report["native_m1_full_artifact_schema_and_chronology_validated"] is True
          assert report["missing_evidence_fabricated"] is False
          assert report["strategy_rules_changed"] is False
          assert report["cognitive_rules_changed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["trader_certified"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-perception-bar-completeness-cell-${{ matrix.symbol }}-${{ github.sha }}
          path: market-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-perception-bar-completeness-cell-*-${{ github.sha }}
          path: matrix-input
          merge-multiple: false
      - run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cognitive_perception_bar_completeness_audit_2r_v2 \
            matrix matrix-input matrix-output
      - name: Enforce matrix controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("matrix-output/capitalizer-nine-market-perception-bar-completeness-matrix-2r-v2.json").read_text())
          assert report["identity"] == "QORE_CAPITALIZER_COGNITIVE_PERCEPTION_BAR_COMPLETENESS_MATRIX_2R_V2"
          assert report["market_count"] == 9
          assert report["control_trades"] == 948
          states = report["bars_complete_state_counts"]
          assert states["SUPPORTED_TRUE"] + states["SUPPORTED_FALSE"] == 948
          assert states["UNBOUND"] == 0
          assert report["bars_complete_evidence_bound"] is True
          assert report["quote_fresh_evidence_bound"] is False
          assert report["quote_fresh_inferred_from_ohlc"] is False
          assert report["perception_status_pending_quote_freshness_trades"] + report["full_perception_status_bad_due_bar_integrity_trades"] == 948
          assert report["current_trade_outcome_visible_to_binding"] is False
          assert report["unknown_quote_freshness_coerced_to_false"] is False
          assert report["missing_evidence_fabricated"] is False
          assert report["runtime_perception_assessor_called"] is False
          assert report["strategy_rules_changed"] is False
          assert report["cognitive_rules_changed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["trader_certified"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-perception-bar-completeness-matrix-2r-v2-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
