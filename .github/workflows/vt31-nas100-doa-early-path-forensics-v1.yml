name: QORE VT31 NAS100 DOA Early Path Forensics V1

on:
  push:
    branches:
      - agent/vt31-nas100-hypothesis-lifecycle-v1
    paths:
      - scripts/vt31_nas100_doa_early_path_forensics_v1.py
      - .github/workflows/vt31-nas100-doa-early-path-forensics-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed_holdout
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Static gate
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_doa_early_path_forensics_v1.py
          ruff check scripts/vt31_nas100_doa_early_path_forensics_v1.py
      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"
      - name: Run DOA early path forensics
        run: |
          set -euo pipefail
          python scripts/vt31_nas100_doa_early_path_forensics_v1.py \
            "input/${EVIDENCE_PATH}" \
            --partition "$PARTITION" \
            --output "result/doa-path-${PARTITION}.json" \
            | tee "result/summary-${PARTITION}.json"
      - name: Governance gate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path(f"result/doa-path-{os.environ['PARTITION']}.json").read_text())
          g=p["governance"]
          assert g["diagnostic_only"] is True
          assert g["post_outcome_labels_research_only"] is True
          assert g["checkpoint_uses_closed_post_fill_m1_only"] is True
          assert g["trade_count_changed"] is False
          assert g["trade_admission_changed"] is False
          assert g["management_changed"] is False
          assert g["silver_bullet_changed"] is False
          assert g["uses_terminal_pnl_at_runtime"] is False
          assert g["uses_future_bars_for_checkpoint_features"] is False
          assert g["opens_new_holdout"] is False
          assert g["policy_promoted"] is False
          assert g["candidate_certified"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-doa-path-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-nas100-doa-path-*-${{ github.sha }}
          path: input
          merge-multiple: true
      - name: Aggregate stable DOA states
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          folds={}
          for path in Path("input").glob("doa-path-*.json"):
              p=json.loads(path.read_text())
              folds[p["partition"]]=p
          assert set(folds)=={"r5","r6","r8","consumed_holdout"}

          stable_doa=[]
          stable_survivor=[]
          for checkpoint in ("1","2","3","5"):
              keysets=[set(p["by_checkpoint"][checkpoint]["feature_diagnostics"]) for p in folds.values()]
              common=set.intersection(*keysets)
              for state in sorted(common):
                  per_fold={}
                  doa_ok=True
                  survivor_ok=True
                  for fold,p in sorted(folds.items()):
                      item=p["by_checkpoint"][checkpoint]["feature_diagnostics"][state]
                      sample=int(item["sample"])
                      delta=Decimal(item["doa_rate_delta_vs_checkpoint"])
                      per_fold[fold]={
                          "sample":sample,
                          "doa_rate":item["doa_rate"],
                          "delta":item["doa_rate_delta_vs_checkpoint"],
                          "non_loss_rate":item["non_loss_rate"],
                      }
                      doa_ok=doa_ok and sample>=12 and delta>=Decimal("0.08")
                      survivor_ok=survivor_ok and sample>=12 and delta<=Decimal("-0.08")
                  if doa_ok:
                      stable_doa.append({"checkpoint":checkpoint,"state":state,"per_fold":per_fold})
                  if survivor_ok:
                      stable_survivor.append({"checkpoint":checkpoint,"state":state,"per_fold":per_fold})

          report={
              "schema":"qore.vt31.nas100.doa_early_path_forensics.aggregate.v1",
              "stable_doa_enriched_states":stable_doa,
              "stable_doa_depleted_states":stable_survivor,
              "checkpoint_baselines":{
                  fold:{cp:p["by_checkpoint"][cp]["baseline"] for cp in ("1","2","3","5")}
                  for fold,p in sorted(folds.items())
              },
              "governance":{
                  "consumed_evidence_only":True,
                  "diagnostic_only":True,
                  "policy_promoted":False,
                  "opens_new_holdout":False,
                  "candidate_certified":False,
              },
          }
          Path("result/aggregate.json").write_text(json.dumps(report,sort_keys=True,indent=2)+"\n")
          print(json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-doa-path-aggregate-${{ github.sha }}
          path: result/
          retention-days: 90
