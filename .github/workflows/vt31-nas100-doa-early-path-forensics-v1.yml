name: QORE VT31 NAS100 DOA Early Path Forensics V1\n\non:\n  push:\n    branches:\n      - agent/vt31-nas100-hypothesis-lifecycle-v1\n    paths:\n      - scripts/vt31_nas100_doa_early_path_forensics_v1.py\n      - .github/workflows/vt31-nas100-doa-early-path-forensics-v1.yml\n  workflow_dispatch:\n\npermissions:\n  contents: read\n  actions: read\n\nenv:\n  GH_TOKEN: ${{ github.token }}\n\njobs:\n  fold:\n    runs-on: ubuntu-24.04\n    timeout-minutes: 120\n    strategy:\n      fail-fast: false\n      max-parallel: 4\n      matrix:\n        include:\n          - partition: r5\n            artifact_id: "10380044761"\n            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"\n            evidence_path: "fresh/NAS100/market-evidence.json"\n          - partition: r6\n            artifact_id: "10389112524"\n            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"\n            evidence_path: "fresh/NAS100/market-evidence.json"\n          - partition: r8\n            artifact_id: "10402199719"\n            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"\n            evidence_path: "fresh/NAS100/market-evidence.json"\n          - partition: consumed_holdout\n            artifact_id: "10557487418"\n            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"\n            evidence_path: "NAS100/market-evidence.json"\n    env:\n      PARTITION: ${{ matrix.partition }}\n      ARTIFACT_ID: ${{ matrix.artifact_id }}\n      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}\n      EVIDENCE_PATH: ${{ matrix.evidence_path }}\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: "3.12"\n      - name: Install\n        run: pip install -e ".[dev]"\n      - name: Static gate\n        run: |\n          set -euo pipefail\n          python -m py_compile scripts/vt31_nas100_doa_early_path_forensics_v1.py\n          ruff check scripts/vt31_nas100_doa_early_path_forensics_v1.py\n      - name: Recover immutable consumed evidence\n        run: |\n          set -euo pipefail\n          mkdir -p input result\n          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip\n          unzip -q evidence.zip -d input\n          test -f "input/${EVIDENCE_PATH}"\n          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"\n          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"\n      - name: Run DOA early path forensics\n        run: |\n          set -euo pipefail\n          python scripts/vt31_nas100_doa_early_path_forensics_v1.py \\n            "input/${EVIDENCE_PATH}" \\n            --partition "$PARTITION" \\n            --output "result/doa-path-${PARTITION}.json" \\n            | tee "result/summary-${PARTITION}.json"\n      - name: Governance gate\n        run: |\n          python - <<'PY'\n          import json, os\n          from pathlib import Path\n          p=json.loads(Path(f"result/doa-path-{os.environ['PARTITION']}.json").read_text())\n          g=p["governance"]\n          assert g["diagnostic_only"] is True\n          assert g["post_outcome_labels_research_only"] is True\n          assert g["checkpoint_uses_closed_post_fill_m1_only"] is True\n          assert g["trade_count_changed"] is False\n          assert g["trade_admission_changed"] is False\n          assert g["management_changed"] is False\n          assert g["silver_bullet_changed"] is False\n          assert g["uses_terminal_pnl_at_runtime"] is False\n          assert g["uses_future_bars_for_checkpoint_features"] is False\n          assert g["opens_new_holdout"] is False\n          assert g["policy_promoted"] is False\n          assert g["candidate_certified"] is False\n          PY\n      - uses: actions/upload-artifact@v4\n        with:\n          name: qore-vt31-nas100-doa-path-${{ matrix.partition }}-${{ github.sha }}\n          path: result/\n          retention-days: 90\n\n  aggregate:\n    needs: fold\n    runs-on: ubuntu-24.04\n    timeout-minutes: 15\n    steps:\n      - uses: actions/download-artifact@v4\n        with:\n          pattern: qore-vt31-nas100-doa-path-*-${{ github.sha }}\n          path: input\n          merge-multiple: true\n      - name: Aggregate stable DOA states\n        run: |\n          set -euo pipefail\n          mkdir -p result\n          python - <<'PY'\n          import json\n          from decimal import Decimal\n          from pathlib import Path\n\n          folds={}\n          for path in Path("input").glob("doa-path-*.json"):\n              p=json.loads(path.read_text())\n              folds[p["partition"]]=p\n          assert set(folds)=={"r5","r6","r8","consumed_holdout"}\n\n          stable_doa=[]\n          stable_survivor=[]\n          for checkpoint in ("1","2","3","5"):\n              keysets=[set(p["by_checkpoint"][checkpoint]["feature_diagnostics"]) for p in folds.values()]\n              common=set.intersection(*keysets)\n              for state in sorted(common):\n                  per_fold={}\n                  doa_ok=True\n                  survivor_ok=True\n                  for fold,p in sorted(folds.items()):\n                      item=p["by_checkpoint"][checkpoint]["feature_diagnostics"][state]\n                      sample=int(item["sample"])\n                      delta=Decimal(item["doa_rate_delta_vs_checkpoint"])\n                      per_fold[fold]={\n                          "sample":sample,\n                          "doa_rate":item["doa_rate"],\n                          "delta":item["doa_rate_delta_vs_checkpoint"],\n                          "non_loss_rate":item["non_loss_rate"],\n                      }\n                      doa_ok=doa_ok and sample>=12 and delta>=Decimal("0.08")\n                      survivor_ok=survivor_ok and sample>=12 and delta<=Decimal("-0.08")\n                  if doa_ok:\n                      stable_doa.append({"checkpoint":checkpoint,"state":state,"per_fold":per_fold})\n                  if survivor_ok:\n                      stable_survivor.append({"checkpoint":checkpoint,"state":state,"per_fold":per_fold})\n\n          report={\n              "schema":"qore.vt31.nas100.doa_early_path_forensics.aggregate.v1",\n              "stable_doa_enriched_states":stable_doa,\n              "stable_doa_depleted_states":stable_survivor,\n              "checkpoint_baselines":{\n                  fold:{cp:p["by_checkpoint"][cp]["baseline"] for cp in ("1","2","3","5")}\n                  for fold,p in sorted(folds.items())\n              },\n              "governance":{\n                  "consumed_evidence_only":True,\n                  "diagnostic_only":True,\n                  "policy_promoted":False,\n                  "opens_new_holdout":False,\n                  "candidate_certified":False,\n              },\n          }\n          Path("result/aggregate.json").write_text(json.dumps(report,sort_keys=True,indent=2)+"\n")\n          print(json.dumps(report,sort_keys=True))\n          PY\n      - uses: actions/upload-artifact@v4\n        with:\n          name: qore-vt31-nas100-doa-path-aggregate-${{ github.sha }}\n          path: result/\n          retention-days: 90\n