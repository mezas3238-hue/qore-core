name: QORE Turtle Soup XAUUSD R21 CAUTIOUS MIXED Subtype Memory

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-xauusd-r3-forensics-001
    paths:
      - '.github/workflows/turtle-soup-xauusd-r21-cautious-mixed-subtype-memory.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r21_cautious_mixed_subtype_memory.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r21_cautious_mixed_subtype_memory.py'

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-XAUUSD-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-XAUUSD-2f510461b3360e91d5ee70a72716a76cd6561f16'
  DOSSIER_RUN_ID: '35291722997'
  DOSSIER_ARTIFACT: 'qore-cibo-xauusd-market-intelligence-v1-8068f78df709b9a1702f14264f76c653140c9c1f'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check --ignore E501,I001 \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r21_cautious_mixed_subtype_memory.py \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r21_cautious_mixed_subtype_memory.py
      - name: Mypy focused gate
        run: |
          mypy --disable-error-code attr-defined \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r21_cautious_mixed_subtype_memory.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r21_cautious_mixed_subtype_memory.py

  subtype-memory:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable consumed XAUUSD M5 corpus
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download immutable consumed XAUUSD Target Destination V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Download official CIBO XAUUSD 10Y intelligence dossier
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.DOSSIER_ARTIFACT }}
          path: cibo-dossier
          github-token: ${{ github.token }}
          run-id: ${{ env.DOSSIER_RUN_ID }}
      - name: Build CAUTIOUS MIXED causal subtype memory
        run: |
          mkdir -p r21-output
          python -m qore.infrastructure.trader_lab.turtle_soup_xauusd_r21_cautious_mixed_subtype_memory \
            source-xauusd target-xauusd cibo-dossier r21-output \
            > r21-output/stdout.json
          printf '%s\n' "$GITHUB_SHA" > r21-output/git-sha.txt
      - name: Enforce causal subtype memory contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('r21-output/r21-cautious-mixed-subtype-report.json').read_text())
          assert p['identity']=='TURTLE_SOUP_XAUUSD_R21_CAUTIOUS_MIXED_SUBTYPE_MEMORY_V1'
          assert p['reproduction']['retained_bars']==707716
          assert p['reproduction']['setups']==12772
          c=p['classification_contract']
          assert c['pnl_used'] is False
          assert c['profit_factor_used'] is False
          assert c['drawdown_used'] is False
          assert c['automatic_threshold_search'] is False
          assert c['strict_majority_required_each_period'] is True
          assert c['same_label_required_all_periods'] is True
          assert p['subtype_memory']['total_signatures'] > 0
          g=p['governance']
          assert g['fresh_holdout_consumed'] is False
          assert g['rule_promoted'] is False
          assert g['live_authorized'] is False
          assert g['real_capital_authorized'] is False
          PY
      - name: Hash immutable R21 result
        run: |
          cd r21-output
          sha256sum \
            r21-cautious-mixed-subtype-report.json \
            r21-cautious-mixed-subtype-ledger.json \
            r21-subtype-memory.json \
            stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-xauusd-r21-subtype-memory-${{ github.sha }}
          path: r21-output
          if-no-files-found: error
          retention-days: 90
