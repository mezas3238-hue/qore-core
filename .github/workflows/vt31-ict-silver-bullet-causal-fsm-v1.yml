name: QORE VT31 Original ICT Causal Silver Bullet FSM V1

on:
  push:
    branches:
      - agent/vt31-architect-operations-cert-20261009
    paths:
      - src/qore/infrastructure/traders/vt31_ict_silver_bullet_causal_state_v1.py
      - .github/workflows/vt31-ict-silver-bullet-causal-fsm-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-causal-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No future state / immutable FVG / wick ambiguity proof
        run: |
          set -euo pipefail
          python -m py_compile src/qore/infrastructure/traders/vt31_ict_silver_bullet_causal_state_v1.py
          python src/qore/infrastructure/traders/vt31_ict_silver_bullet_causal_state_v1.py
      - name: Enforce no broker fill, no order routing and no invented ICT universals
        run: |
          python - <<'PY'
          from pathlib import Path
          x=Path('src/qore/infrastructure/traders/vt31_ict_silver_bullet_causal_state_v1.py').read_text()
          assert 'has_broker_fill": False' in x
          assert 'has_execution_authority": False' in x
          assert 'has_canonical_cognition_route": False' in x
          assert 'primary_ict_quote_verified_for_every_operational_detail": False' in x
          assert 'QORE_RESEARCH_FORMALIZATION' in x
          assert 'RESEARCH_MIDPOINT_TOUCH_NOT_FILL' in x
          assert 'AMBIGUOUS_TOUCH_AND_INVALIDATION' in x
          assert 'ZoneInfo("America/New_York")' in x
          assert '"VT31_LONDON": 3' in x
          assert '"VT31_NY_AM": 10' in x
          assert '"VT31_NY_PM": 14' in x
          PY
