name: QORE CIBO All Trader Root Cause Lab

on:
  push:
    branches:
      - agent/cibo-profitability-lab-001
    paths:
      - '.github/workflows/cibo-all-trader-root-cause-lab.yml'
      - 'src/qore/infrastructure/trader_lab/cibo_all_trader_root_cause_lab.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  root-cause:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_P0_ARTIFACT_ID: '11281624630'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install -e '.[dev]'

      - name: Static validation
        run: |
          set -euo pipefail
          python -m py_compile             src/qore/infrastructure/trader_lab/cibo_all_trader_root_cause_lab.py
          ruff check             src/qore/infrastructure/trader_lab/cibo_all_trader_root_cause_lab.py

      - name: Recover exact P0 evidence
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p0"
          gh api             "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_P0_ARTIFACT_ID/zip"             > "$RUNNER_TEMP/p0.zip"
          unzip -q "$RUNNER_TEMP/p0.zip" -d "$RUNNER_TEMP/p0"
          test -s "$RUNNER_TEMP/p0/decision-trace.json"
          test -s "$RUNNER_TEMP/p0/lab-result.json"

      - name: Run seven-Trader root-cause audit
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/root-cause"
          python -m qore.infrastructure.trader_lab.cibo_all_trader_root_cause_lab             --decision-trace "$RUNNER_TEMP/p0/decision-trace.json"             --lab-result "$RUNNER_TEMP/p0/lab-result.json"             --output "$RUNNER_TEMP/root-cause/report.json"

      - name: Enforce diagnostic governance
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "root-cause"
                  / "report.json"
              ).read_text(encoding="utf-8")
          )
          assert len(p["traders"]) == 7
          assert p["governance"]["diagnostic_only"] is True
          assert p["governance"]["associations_are_not_admission_rules"] is True
          assert p["governance"]["outcome_aware_policy_tuning"] is False
          assert p["governance"]["fresh_oos_claimed"] is False
          assert p["governance"]["broker_mutation"] is False
          assert p["governance"]["live"] is False
          assert p["governance"]["production"] is False
          assert p["governance"]["real_capital"] is False
          assert p["governance"]["merge_authority"] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-cibo-all-trader-root-cause-${{ github.run_id }}
          path: ${{ runner.temp }}/root-cause
          if-no-files-found: error
          retention-days: 90
