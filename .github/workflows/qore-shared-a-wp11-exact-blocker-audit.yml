name: QORE Shared A WP11 Exact Blocker Audit

concurrency:
  group: qore-shared-a-wp11-exact-blocker-audit
  cancel-in-progress: false

on:
  push:
    branches:
      - agent/shared-a-cognitive-science-001
    paths:
      - scripts/shared_wp11_exact_blocker_audit.py
      - .github/workflows/qore-shared-a-wp11-exact-blocker-audit.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and validate
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          mkdir -p input/{mc23,mc24,mc25} result
          ruff check scripts/shared_wp11_exact_blocker_audit.py
          python -m py_compile scripts/shared_wp11_exact_blocker_audit.py
      - name: Verify immutable evidence
        run: |
          set -euo pipefail
          for spec in \
            "36782458472:11128786574" \
            "36781874072:11128705779" \
            "36783028642:11128707360"
          do
            run_id="${spec%%:*}"
            artifact_id="${spec#*:}"
            test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion')" = "success"
            test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" --jq '.expired')" = "false"
          done
      - name: Recover evidence
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11128786574/zip" > mc23.zip
          unzip -q mc23.zip -d input/mc23
          (cd input/mc23 && sha256sum -c SHA256SUMS)
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11128705779/zip" > mc24.zip
          unzip -q mc24.zip -d input/mc24
          (cd input/mc24 && sha256sum -c SHA256SUMS)
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11128707360/zip" > mc25.zip
          unzip -q mc25.zip -d input/mc25
          (cd input/mc25 && sha256sum -c SHA256SUMS)
      - name: Audit exact blockers
        run: |
          python scripts/shared_wp11_exact_blocker_audit.py \
            --mc23 input/mc23/mc23-real-novelty-detection.json \
            --mc24 input/mc24/mc24-real-regression-suite.json \
            --mc25 input/mc25/mc25-wp04-v3b-lineage-integrity-stress.json \
            --output result/wp11-exact-blockers.json \
            | tee result/summary.json
      - name: Validate open disposition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/wp11-exact-blockers.json").read_text())
          assert p["status"] == "WP11_GOVERNED_SELF_IMPROVEMENT_OPEN_EXACT_BLOCKERS"
          assert p["blocker_count"] == 8
          assert p["zero_open_work"] is False
          assert p["wp11_completed_and_proven"] is False
          assert p["productive_authority"] is False
          assert p["master_ledger_mutated"] is False
          assert p["protected_certification_holdout_opened"] is False
          PY
      - name: Seal
        run: |
          printf '%s\n' "${GITHUB_SHA}" > result/code-git-sha.txt
          (cd result && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-a-wp11-blockers-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
      - name: Report
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path("result/wp11-exact-blockers.json").read_text())
          body="\n".join([
              "## Shared A WP-11 — Exact Open Blockers",
              "",
              f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- blockers: **{p['blocker_count']}**",
              *[f"- `{x}`" for x in p["blockers"]],
              "- WP-11 completed-and-proven: **False**",
              "- master ledger mutated: **False**",
          ])+"\n"
          Path("result/issue-comment.md").write_text(body)
          PY
          gh issue comment 638 --body-file result/issue-comment.md
