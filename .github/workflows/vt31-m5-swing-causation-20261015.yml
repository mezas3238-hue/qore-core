name: VT31 M5 TTrades Causal Swing Source Witness No Sizing or Trades
on:
  push:
    branches:
      - agent/vt31-m5-swing-causation-20261015
    paths:
      - 'docs/research/VT31_M5_SWING_CAUSATION_PREREG_2026-10-15.md'
      - 'scripts/vt31_m5_swing_causation_witness_20261015.py'
      - 'tests/infrastructure/test_vt31_m5_swing_causation_witness_20261015.py'
      - '.github/workflows/vt31-m5-swing-causation-20261015.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  NATIVE_SHA: '1556766c1831190b5459bf93404081412200ba7d'
  CENSUS_SHA: '35bd317ddfed60e09523287de51347683d98e613'
  NAS100_SHA: '0563370fd021ad091392eb26f60cda0d3356d38c801fc1c2083cceafc5043cfa'
jobs:
  m5-causative-swing-source-cognition:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 40
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lock original G3 and primary independent witness
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ba9b50abca2ede965975f6aacfcdab8a057a3735 HEAD
          test "$(git hash-object src/qore/infrastructure/traders/vt31_ict_cleanroom/cognition.py)" = d0ab4c15d6e9d24e53224d27bdb2cd96af914fb9
          test "$(git hash-object src/qore/infrastructure/traders/vt31_ict_cleanroom/operations.py)" = 0ce9707314aecb71155de8b57044b6ec028847b2
          test "$(git hash-object docs/research/VT31_G3_DECISION_METODOLOGICA_STOP_FRAMEWORK_FVG_EXIT_V1_2026-10-12.md)" = e99c70b4e018d626fb620d9a21b9314a51abc36d
          test "$(git hash-object scripts/vt31_ttrades_am_cognitive_fidelity_witness_20261014.py)" = 579597e5c3a2da488130661199562d236fdb58b9
          test "$(git hash-object scripts/vt31_mc_p2_ttrades_native_h1_evidence_20261014.py)" = 3cf076810b1e6dcec0ba2f1571609577ceac6d50
          test "$(git hash-object scripts/vt31_cog_evidence_v2_20261014.py)" = 9f985370ab09f571aa9ca716d166abbba53ea97d
          git fetch --no-tags --depth=1 origin "$NATIVE_SHA"
          git show "$NATIVE_SHA:scripts/vt31_ttrades_am_native_cog_v1_20261014.py" > scripts/vt31_ttrades_am_native_cog_v1_20261014.py
          test "$(git hash-object scripts/vt31_ttrades_am_native_cog_v1_20261014.py)" = 407c5959c8cf2268ff210fbbe8bb07b91d2f4510
          git show "$NATIVE_SHA:tests/infrastructure/test_vt31_ttrades_am_native_cog_v1_20261014.py" > tests/infrastructure/test_vt31_ttrades_am_native_cog_v1_20261014.py
          git fetch --no-tags --depth=1 origin "$CENSUS_SHA"
          git show "$CENSUS_SHA:scripts/vt31_ttrades_am_method_m1_census_20261014.py" > scripts/vt31_ttrades_am_method_m1_census_20261014.py
          test "$(git hash-object scripts/vt31_ttrades_am_method_m1_census_20261014.py)" = 43a219e21237acfddc773a7c78ab6103d3839168
          git show "$CENSUS_SHA:tests/infrastructure/test_vt31_ttrades_am_method_m1_census_20261014.py" > tests/infrastructure/test_vt31_ttrades_am_method_m1_census_20261014.py
      - name: Semantic adversaries and immutable original COG tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]' 'ijson>=3.3,<4'
          mkdir -p evidence
          ruff check scripts/vt31_m5_swing_causation_witness_20261015.py tests/infrastructure/test_vt31_m5_swing_causation_witness_20261015.py
          PYTHONPATH=src:. pytest -q -o addopts='' \
            tests/infrastructure/test_vt31_m5_swing_causation_witness_20261015.py \
            tests/infrastructure/test_vt31_ttrades_am_native_cog_v1_20261014.py \
            tests/infrastructure/test_vt31_ttrades_am_method_m1_census_20261014.py \
            tests/infrastructure/test_vt31_method_cog_semantic_gate_20261014.py \
            tests/infrastructure/test_vt31_methodology_cognitive_source_fidelity_20261014.py \
            tests/infrastructure/test_vt31_mc_p2_ttrades_native_h1_20261014.py \
            --junitxml=evidence/pytest-junit.xml | tee evidence/pytest-log.txt
      - name: Original NAS100 1,059,784 M1 source, no fresh holdout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11459859004/zip" > source.zip
          unzip -q source.zip -d source
          echo "${NAS100_SHA}  source/NAS100/market-evidence.json" | sha256sum -c -
      - name: Actual real source day cognitive cases, no PnL or sizing
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src:. python scripts/vt31_m5_swing_causation_witness_20261015.py \
            --market source/NAS100/market-evidence.json \
            --out evidence/VT31_TTRADES_M5_CAUSATIVE_SWING_REAL_M1.json | tee evidence/summary.json
          python - <<'PY'
          import json
          p=json.load(open("evidence/VT31_TTRADES_M5_CAUSATIVE_SWING_REAL_M1.json"))
          assert p["cases_frozen"]==483
          cats=p["m5_states"]
          assert sum(cats.values())==483
          assert cats["NO_QORE_FVG_EVIDENCE"]==26
          assert p["method_M5_certified"] is False
          assert p["cognition_M5_certified"] is False
          assert p["trader_certified"] is False
          assert p["broker_orders_ack_fills"]==0
          assert p["sizing_assigned"] is False
          assert p["live_authorized"] is False
          print("M5_SWING_SOURCE_UNDETERMINED_NO_TRADES")
          PY
      - name: Immutable provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/head.txt
          printf '%s\n' 'ba9b50abca2ede965975f6aacfcdab8a057a3735' > evidence/prereg.txt
          printf '%s\n' "$NATIVE_SHA" > evidence/native-cog-source.txt
          printf '%s\n' "$CENSUS_SHA" > evidence/day-census-source.txt
          printf '%s\n' 'METHOD_AND_COGNITION_NOT_PNL_OR_SIZING_NO_MERGE_NO_LIVE' > evidence/scope.txt
          (cd evidence && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vt31-m5-causative-swing-${{ github.sha }}
          path: evidence/
          retention-days: 90
          if-no-files-found: warn
