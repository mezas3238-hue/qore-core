name: VT31 G5 WAVE2 real USTEC BID ASK 24-hour Silver Bullet DEV source

on:
  push:
    branches:
      - research/vt31-g5-ustec-sb-bidask-dev-wave2-20261013
    paths:
      - '.github/workflows/vt31-g5-ustec-sb-quote-wave2.yml'
      - 'src/qore/infrastructure/trader_lab/vt31_g5_ustec_sb_quote_wave2_v1.py'
      - 'tests/infrastructure/trader_lab/test_vt31_g5_ustec_sb_quote_wave2_v1.py'
      - 'docs/research/VT31_G5_USTEC_BIDASK_WAVE2_PREREG_2026-10-13.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source_clock_contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install decoder and validation
        run: python -m pip install -e '.[dev,ctrader]'
      - name: Verify clock and read-only source contract
        run: |
          set -euo pipefail
          test -s docs/research/VT31_G5_USTEC_BIDASK_WAVE2_PREREG_2026-10-13.md
          python -m py_compile src/qore/infrastructure/trader_lab/vt31_g5_ustec_sb_quote_wave2_v1.py
          ruff check --select F,E4,E7,E9 src/qore/infrastructure/trader_lab/vt31_g5_ustec_sb_quote_wave2_v1.py tests/infrastructure/trader_lab/test_vt31_g5_ustec_sb_quote_wave2_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_vt31_g5_ustec_sb_quote_wave2_v1.py

  read_only_ustec_source:
    needs: source_clock_contract
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      QORE_CTRADER_DEMO_CLIENT_ID: ${{ secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
      QORE_CTRADER_DEMO_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
      QORE_CTRADER_DEMO_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
      QORE_CTRADER_DEMO_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
      QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID }}
      QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET }}
      QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN }}
      QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cTrader source dependencies
        run: python -m pip install -e '.[ctrader]'
      - name: Fetch original USTEC BID ASK 24 hours 8 dates for NY SB wave2
        run: |
          set -euo pipefail
          python -m qore.infrastructure.trader_lab.vt31_g5_ustec_sb_quote_capture_v1 source-ustec-vt31-wave2
      - name: Verify SHA256 and record source commit
        if: always()
        run: |
          mkdir -p source-ustec-vt31-wave2
          printf '%s\n' "${GITHUB_SHA}" > source-ustec-vt31-wave2/WORKFLOW-COMMIT.txt
          if [ -s source-ustec-vt31-wave2/SHA256SUMS.txt ]; then
            ( cd source-ustec-vt31-wave2 && sha256sum -c SHA256SUMS.txt )
          else
            echo 'No source SHA register; fail closed.'
            exit 1
          fi
      - name: Keep source in expiring Actions artifact only, not Git
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vt31-ustec-real-bidask-sb-wave2-24h-NOT-NET-${{ github.sha }}
          path: source-ustec-vt31-wave2/
          retention-days: 90
          if-no-files-found: error
