name: QORE VT31 3Y Fill Revalidation Fast Shadow V1

on:
  push:
    branches:
      - agent/vt31-architect-cognition-sensors-20261009
    paths:
      - src/qore/infrastructure/traders/vt31_nas100_fill_time_causal_sensor.py
      - src/qore/infrastructure/traders/vt31_nas100_post_entry_cognitive_runtime.py
      - scripts/vt31_nas100_cognitive_3y_fill_shadow_fast_v1.py
      - tests/infrastructure/test_vt31_nas100_fill_time_causal_sensor.py
      - tests/infrastructure/test_vt31_nas100_post_entry_cognitive_runtime.py
      - .github/workflows/vt31-cognitive-fill-shadow-fast-v1.yml
  workflow_dispatch:

concurrency:
  group: vt31-cog-3y-fill-shadow-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  SOURCE_ARTIFACT_ID: "11459859004"
  FROZEN_SOURCE_SHA256: "0563370fd021ad091392eb26f60cda0d3356d38c801fc1c2083cceafc5043cfa"

jobs:
  causal-fill-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Static and isolation gates
        run: |
          set -euo pipefail
          python -m py_compile src/qore/infrastructure/traders/vt31_nas100_fill_time_causal_sensor.py src/qore/infrastructure/traders/vt31_nas100_post_entry_cognitive_runtime.py scripts/vt31_nas100_cognitive_3y_fill_shadow_fast_v1.py tests/infrastructure/test_vt31_nas100_fill_time_causal_sensor.py
          ruff check src/qore/infrastructure/traders/vt31_nas100_fill_time_causal_sensor.py src/qore/infrastructure/traders/vt31_nas100_post_entry_cognitive_runtime.py scripts/vt31_nas100_cognitive_3y_fill_shadow_fast_v1.py tests/infrastructure/test_vt31_nas100_fill_time_causal_sensor.py
          PYTHONPATH=. pytest -q -o addopts='' tests/infrastructure/test_vt31_nas100_fill_time_causal_sensor.py tests/infrastructure/test_vt31_nas100_post_entry_cognitive_runtime.py
      - name: Download the unchanged consumed 3Y evidence
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}" \
            --jq '{id,name,expired}' | tee source-metadata.json
          python - <<'PY'
          import json
          p=json.load(open("source-metadata.json",encoding="utf-8"))
          assert p["name"] == "qore-vt31-nas100-owner-3y-base-v1"
          assert p["id"] == 11459859004
          assert p["expired"] is False
          PY
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test "$(sha256sum input/NAS100/market-evidence.json | cut -d ' ' -f 1)" = "${FROZEN_SOURCE_SHA256}"
          cp source-metadata.json result/
      - name: Shadow the actual retrospective prospective-fill M1 opens
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python scripts/vt31_nas100_cognitive_3y_fill_shadow_fast_v1.py input/NAS100/market-evidence.json --output result/3y-fill-revalidation-shadow.json | tee result/summary.json
      - name: Guard control identity and nonpromotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/3y-fill-revalidation-shadow.json").read_text())
          assert p["base_id"] == "VT31_NAS100_OWNER_3Y_BASE_001"
          assert p["source_sha256"] == "0563370fd021ad091392eb26f60cda0d3356d38c801fc1c2083cceafc5043cfa"
          assert p["selected_executable_setups"] == 124
          assert p["realized_fill_opportunities"] == 95
          assert p["structural_terminal_trade_count"] == 79
          assert p["full_causal_entry_revalidations"] == 95
          assert len(p["per_fill_ledger"]) == 95
          assert p["governance"]["runtime_action_altered"] is False
          assert p["governance"]["fill_bar_OHLC_excluded_from_revalidation"] is True
          assert p["governance"]["fresh_holdout_opened"] is False
          assert p["governance"]["candidate_certified"] is False
          assert p["governance"]["live_authorized"] is False
          PY
      - name: Bind artifact digests
        run: |
          printf "%s\n" "$GITHUB_SHA" > result/git-sha.txt
          printf "%s\n" "$FROZEN_SOURCE_SHA256" > result/input-sha256.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd result && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-cog-fill-shadow-3y-${{ github.sha }}
          path: result/
          retention-days: 90
          if-no-files-found: error
