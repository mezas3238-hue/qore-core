name: VT08 Index R51 Concentration Robustness

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r51-concentration-robustness.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r51_concentration_robustness.py
      - tests/infrastructure/trader_lab/test_vt08_index_r51_concentration_robustness.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r48_candidate_freeze.py tests/infrastructure/trader_lab/test_vt08_index_r51_concentration_robustness.py

  concentration:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R51 concentration robustness
        run: |
          python -m qore.infrastructure.trader_lab.vt08_index_r51_concentration_robustness \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r51-concentration-robustness.json

      - name: Verify frozen governance and retain failure evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(Path("artifacts/report/vt08-index-r51-concentration-robustness.json").read_text())
          assert report["identity"] == "VT08_INDEX_R51_R47_CONCENTRATION_ROBUSTNESS_001"
          assert report["candidate"]["rules_changed"] is False
          assert report["candidate"]["retuning_performed"] is False
          assert report["five_year"]["sample"] == 2448
          assert report["recent_two_year"]["sample"] == 1017
          assert report["exact_frozen_reproduction"] is True
          for window in ("five_year", "recent_two_year"):
              assert report[window]["diagnostics"]["suppressed_trade_count"] == 0
              assert report[window]["diagnostics"]["risk_increase_count"] == 0
          g=report["governance"]
          assert g["runtime_rules_changed"] is False
          assert g["parameter_neighborhood_is_stress_only"] is True
          assert g["certified"] is False
          assert g["live_authorized"] is False
          assert g["real_capital_authorized"] is False
          assert g["production_authorized"] is False
          PY

      - name: Upload R51 concentration evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-index-r51-concentration-robustness-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
