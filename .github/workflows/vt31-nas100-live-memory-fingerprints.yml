name: QORE VT31 NAS100 Live Memory Fingerprints

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-gbpusd-r43-live-core-integration-001
    paths:
      - src/qore/infrastructure/traders/vt31_nas100_*
      - .github/workflows/vt31-nas100-live-memory-fingerprints.yml

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Validate and fingerprint memories
        run: |
          python - <<'PY'
          import json
          from qore.infrastructure.traders.vt31_nas100_cognitive_memory import memory_fingerprint, validate_memory
          from qore.infrastructure.traders.vt31_nas100_strategy_identity_memory import strategy_identity_fingerprint
          from qore.infrastructure.traders.vt31_nas100_cibo_market_memory import cibo_market_memory_fingerprint
          from qore.infrastructure.traders.vt31_nas100_trader_experience_memory import trader_experience_fingerprint
          from qore.infrastructure.traders.vt31_silver_bullet_r2_2 import source_fingerprint
          validate_memory()
          print(json.dumps({
              "strategy_identity": strategy_identity_fingerprint(),
              "cibo_market": cibo_market_memory_fingerprint(),
              "trader_experience": trader_experience_fingerprint(),
              "cognitive_bundle": memory_fingerprint(),
              "silver_bullet_source": source_fingerprint(),
          }, sort_keys=True))
          PY
