name: QORE VT31 NAS100 Survivor DGR Interaction V1

on:
  push:
    branches:
      - agent/vt31-edge-position-cert-b-001
    paths:
      - scripts/vt31_nas100_survivor_dgr_interaction_v1.py
      - .github/workflows/vt31-nas100-survivor-dgr-interaction-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Static and governance gate
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_survivor_dgr_interaction_v1.py
          ruff check scripts/vt31_nas100_survivor_dgr_interaction_v1.py

      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"

      - name: Run interaction frontier
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python scripts/vt31_nas100_survivor_dgr_interaction_v1.py             "input/${EVIDENCE_PATH}"             --partition "${PARTITION}"             --output "result/interaction-${PARTITION}.json"             | tee "result/summary-${PARTITION}.json"

      - name: Enforce no-capital governance
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p=os.environ["PARTITION"]
          x=json.loads(Path(f"result/interaction-{p}.json").read_text())
          g=x["governance"]
          assert g["trade_admission_changed"] is False
          assert g["entry_changed"] is False
          assert g["initial_stop_changed"] is False
          assert g["structural_target_changed"] is False
          assert g["baseline_3r_breakeven_preserved"] is True
          assert g["lifecycle_changed"] is False
          assert g["interaction_authority_mutually_exclusive"] is True
          assert g["maximum_architect_b_protection_moves_per_trade"] == 1
          assert g["normalized_equal_r_economics"] is True
          assert g["capital_weighted_net_r_used"] is False
          assert g["position_sizing_used"] is False
          assert g["leverage_used"] is False
          assert g["compounding_used"] is False
          assert g["absolute_volume_used"] is False
          assert g["provider_volume_rule_used"] is False
          assert g["partial_exit_required"] is False
          assert g["terminal_pnl_runtime_input"] is False
          assert g["future_journey_runtime_input"] is False
          assert g["fold_identity_runtime_input"] is False
          assert g["opens_new_holdout"] is False
          assert g["policy_promoted"] is False
          assert g["candidate_certified"] is False
          assert g["live_authorized"] is False
          assert g["real_capital_authorized"] is False
          assert g["production_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-survivor-dgr-interaction-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-survivor-dgr-interaction-*-${{ github.sha }}
          path: input
          merge-multiple: true

      - name: Adjudicate predeclared interaction
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          folds=("r5","r6","r8","consumed")
          variants=(
              "BASELINE",
              "SURVIVOR_PS1_ONLY",
              "DGR025_SINGLE_ONLY",
              "SURVIVOR_PS1_PLUS_DGR025_FALLBACK",
          )
          payloads={
              fold:json.loads(Path(f"input/interaction-{fold}.json").read_text())
              for fold in folds
          }

          def d(v):
              return Decimal(str(v))

          def metrics(fold, variant):
              return payloads[fold]["variant_reports"][variant]["normalized_metrics"]

          def nondegrade(candidate, baseline):
              c=metrics(candidate[0],candidate[1])
              b=metrics(baseline[0],baseline[1])
              return {
                  "pf": (
                      c["profit_factor"] is not None
                      and b["profit_factor"] is not None
                      and d(c["profit_factor"]) >= d(b["profit_factor"])
                  ),
                  "mean_r": d(c["mean_r"]) >= d(b["mean_r"]),
                  "dd": d(c["max_drawdown_r"]) <= d(b["max_drawdown_r"]),
              }

          v3="SURVIVOR_PS1_PLUS_DGR025_FALLBACK"
          v1="SURVIVOR_PS1_ONLY"
          v0="BASELINE"

          vs_baseline={
              fold:nondegrade((fold,v3),(fold,v0))
              for fold in folds
          }
          vs_survivor={}
          survivor_improved_folds=0
          for fold in folds:
              c=metrics(fold,v3)
              b=metrics(fold,v1)
              pf_non=(
                  c["profit_factor"] is not None
                  and b["profit_factor"] is not None
                  and d(c["profit_factor"]) >= d(b["profit_factor"])
              )
              mean_non=d(c["mean_r"]) >= d(b["mean_r"])
              dd_non=d(c["max_drawdown_r"]) <= d(b["max_drawdown_r"])
              improved=(
                  (
                      c["profit_factor"] is not None
                      and b["profit_factor"] is not None
                      and d(c["profit_factor"]) > d(b["profit_factor"])
                  )
                  or d(c["mean_r"]) > d(b["mean_r"])
              )
              survivor_improved_folds += int(improved)
              vs_survivor[fold]={
                  "pf_nondegrade":pf_non,
                  "mean_nondegrade":mean_non,
                  "dd_nondegrade":dd_non,
                  "pf_or_mean_improved":improved,
              }

          winner={}
          for fold in folds:
              w=payloads[fold]["variant_reports"][v3][
                  "winner_preservation_vs_baseline"
              ]
              winner[fold]={
                  "count_ge_80":d(w["winner_count_preservation"])>=d("0.80"),
                  "r_ge_90":d(w["winner_r_preservation"])>=d("0.90"),
                  "count":w["winner_count_preservation"],
                  "r":w["winner_r_preservation"],
              }

          temporal={}
          temporal_pass=True
          for fold in ("r5","r6","r8"):
              b=payloads[fold]["variant_reports"][v0]["halfyear_metrics"]
              c=payloads[fold]["variant_reports"][v3]["halfyear_metrics"]
              blocks={}
              for key in sorted(set(b)&set(c)):
                  delta=d(c[key]["mean_r"])-d(b[key]["mean_r"])
                  blocks[key]={"mean_r_delta":format(delta,"f"),"nondegrade":delta>=0}
                  temporal_pass &= delta>=0
              temporal[fold]=blocks

          gates={
              "v3_vs_baseline_pf_mean_dd_nondegrade_4of4":all(
                  all(x.values()) for x in vs_baseline.values()
              ),
              "v3_vs_survivor_improves_pf_or_mean_at_least_3of4":(
                  survivor_improved_folds>=3
              ),
              "v3_vs_survivor_pf_mean_dd_nondegrade_4of4":all(
                  x["pf_nondegrade"]
                  and x["mean_nondegrade"]
                  and x["dd_nondegrade"]
                  for x in vs_survivor.values()
              ),
              "winner_preservation_floor_4of4":all(
                  x["count_ge_80"] and x["r_ge_90"]
                  for x in winner.values()
              ),
              "r5_r6_r8_halfyears_mean_delta_nondegrade":temporal_pass,
          }
          survivor=all(gates.values())
          report={
              "schema":"qore.vt31.nas100.survivor_dgr_interaction.aggregate.v1",
              "head":"${{ github.sha }}",
              "folds":folds,
              "variant_metrics":{
                  variant:{
                      fold:payloads[fold]["variant_reports"][variant]
                      for fold in folds
                  }
                  for variant in variants
              },
              "v3_vs_baseline":vs_baseline,
              "v3_vs_survivor":vs_survivor,
              "winner_preservation":winner,
              "temporal":temporal,
              "gates":gates,
              "interaction_survives":survivor,
              "adjudication":(
                  "INTERACTION_SURVIVOR"
                  if survivor
                  else "NOT_SUPPORTED"
              ),
              "governance":{
                  "consumed_evidence_only":True,
                  "fresh_holdout_opened":False,
                  "policy_promoted":False,
                  "candidate_certified":False,
                  "live_authorized":False,
                  "real_capital_authorized":False,
                  "production_authorized":False,
              },
          }
          Path("result/aggregate.json").write_text(
              json.dumps(report,sort_keys=True,indent=2)+"\n"
          )
          print(json.dumps(report,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-survivor-dgr-interaction-aggregate-${{ github.sha }}
          path: result/
          retention-days: 90
