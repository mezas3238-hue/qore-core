name: VT08 Index R82 Protected Swing Source Qualification

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r82-protected-swing-source-qualification.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r82_protected_swing_source_qualification.py
      - tests/infrastructure/trader_lab/test_vt08_index_r82_protected_swing_source_qualification.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r82_protected_swing_source_qualification.py

  forensics:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R82 Protected-Swing source qualification audit
        run: |
          python -m qore.infrastructure.trader_lab.vt08_index_r82_protected_swing_source_qualification \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r82-protected-swing-source-qualification.json

      - name: Verify R82 governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r82-protected-swing-source-qualification.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R82_PROTECTED_SWING_SOURCE_QUALIFICATION_AUDIT_001"
          )
          assert report["source_r81"]["run_id"] == 35519062875
          assert report["source_r81"]["post_touch_new_fvg_interpretation_survived"] is False

          source = report["source_contract"]
          assert source["cisd_requires_poi"] is True
          assert source["cisd_requires_liquidity_new_high_or_low"] is True
          assert source["cisd_requires_close_through_series"] is True
          assert source["fvg_reaction_uses_original_important_level"] is True
          assert source["no_numeric_thresholds"] is True

          assert report["five_year"]["canonical_sample"] == 2448
          assert report["recent_two_year"]["canonical_sample"] == 1017
          assert report["r66_failed_holdout"]["canonical_sample"] == 773
          assert report["decision"] == (
              "R82_PROTECTED_SWING_SOURCE_QUALIFICATION_AUDIT_COMPLETE_NO_RULE"
          )
          governance = report["governance"]
          assert governance["forensics_only"] is True
          assert governance["consumed_evidence_only"] is True
          assert governance["fresh_holdout_claim"] is False
          assert governance["future_information_used"] is False
          assert governance["canonical_signal_surface_changed"] is False
          assert governance["signals_created"] is False
          assert governance["signals_suppressed"] is False
          assert governance["family_selected_by_pnl"] is False
          assert governance["risk_changed"] is False
          assert governance["target_changed"] is False
          assert governance["candidate_created"] is False
          assert governance["trader_certified"] is False
          assert governance["live_authorized"] is False
          assert governance["real_capital_authorized"] is False
          assert governance["production_authorized"] is False
          PY

      - name: Upload R82 evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r82-protected-swing-source-qualification-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: warn
          retention-days: 90
