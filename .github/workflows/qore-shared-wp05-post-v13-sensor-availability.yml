name: QORE Shared WP05 Post-V13 Sensor Availability Audit

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - src/qore/infrastructure/core_stack_v2/active_perception_post_v13_sensor_availability.py
      - scripts/shared_wp05_post_v13_cross_market_sensor_availability.py
      - tests/infrastructure/test_shared_wp05_post_v13_sensor_availability.py
      - docs/shared/QORE_SHARED_WP05_POST_V13_SENSOR_AVAILABILITY_AUDIT_PREREGISTRATION.md
      - .github/workflows/qore-shared-wp05-post-v13-sensor-availability.yml
  workflow_dispatch:

concurrency:
  group: qore-shared-wp05-post-v13-sensor-availability-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  SOURCE_MANIFEST_SHA256: 2f18b9f11d5893effa46ac85c712edd6646d1d90a9de521b235143e42155d191
  SOURCE_MANIFEST_ARTIFACT_ID: "10982052296"
  SOURCE_MANIFEST_PRODUCER_SHA: 99e60783fb270c40ae23805fbb3d16ae76d9c4f2

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Shared
        run: pip install -e ".[dev]"
      - name: Validate source-only audit contract
        run: |
          set -euo pipefail
          ruff check             src/qore/infrastructure/core_stack_v2/active_perception_post_v13_sensor_availability.py             scripts/shared_wp05_post_v13_cross_market_sensor_availability.py             tests/infrastructure/test_shared_wp05_post_v13_sensor_availability.py
          mypy             src/qore/infrastructure/core_stack_v2/active_perception_post_v13_sensor_availability.py             scripts/shared_wp05_post_v13_cross_market_sensor_availability.py
          python -m py_compile             src/qore/infrastructure/core_stack_v2/active_perception_post_v13_sensor_availability.py             scripts/shared_wp05_post_v13_cross_market_sensor_availability.py
          pytest -q tests/infrastructure/test_shared_wp05_post_v13_sensor_availability.py

  audit:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
      QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
      QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
      QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
      QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Shared + cTrader runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ctrader]"

      - name: Verify DEMO secrets without printing values
        shell: bash
        run: |
          set -euo pipefail
          for name in             QORE_CTRADER_CLIENT_ID             QORE_CTRADER_CLIENT_SECRET             QORE_CTRADER_ACCESS_TOKEN             QORE_CTRADER_REFRESH_TOKEN
          do
            if [ -z "${!name:-}" ]; then
              echo "missing required DEMO runtime input: ${name}" >&2
              exit 2
            fi
          done

      - name: Resolve single authorized DEMO account
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            if ! [[ "$account_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "cTrader DEMO account discovery returned invalid id" >&2
              exit 3
            fi
            echo "::add-mask::$account_id"
            printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          else
            echo "::add-mask::$QORE_CTRADER_DEMO_ACCOUNT_ID"
          fi

      - name: Recover frozen source-only R8 manifest
        run: |
          set -euo pipefail
          mkdir -p input/manifest result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_MANIFEST_ARTIFACT_ID}/zip" > manifest.zip
          test -s manifest.zip
          unzip -q manifest.zip -d input/manifest
          (cd input/manifest && sha256sum -c SHA256SUMS)
          test "$(cat input/manifest/git-sha.txt)" = "$SOURCE_MANIFEST_PRODUCER_SHA"
          cp input/manifest/wp05-v12-r8-tick-acquisition-manifest.json             result/source-manifest.json

      - name: Run post-V13 source availability audit
        run: |
          set -euo pipefail
          python scripts/shared_wp05_post_v13_cross_market_sensor_availability.py             --manifest result/source-manifest.json             --expected-manifest-sha256 "$SOURCE_MANIFEST_SHA256"             --output result/post-v13-sensor-availability.json             | tee result/post-v13-sensor-availability-summary.json

      - name: Validate governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(Path("result/post-v13-sensor-availability.json").read_text())
          assert p["identity"] == (
              "QORE_SHARED_WP05_POST_V13_SENSOR_AVAILABILITY_AUDIT_001"
          )
          assert p["partition"] == "r8_source_only"
          assert p["selection_rule"] == (
              "FIRST_Q1_MID_Q3_LAST_BY_FROZEN_MANIFEST_ORDINAL"
          )
          assert p["selected_manifest_indices"] == [0, 736, 1473, 2210, 2947]
          assert p["read_only_message_firewall"] is True
          assert p["target_or_outcome_used_for_selection"] is False
          assert p["target_or_outcome_read"] is False
          assert p["r6_r5_read"] is False
          assert p["fresh_holdout_opened"] is False
          assert p["scientific_v14_opened"] is False
          assert p["shared_methodology_authority"] is False
          assert p["shared_sizing_authority"] is False
          assert p["shared_risk_authority"] is False
          assert p["shared_order_authority"] is False
          assert p["shared_execution_authority"] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-shared-wp05-post-v13-sensor-availability-${{ github.sha }}
          path: |
            result/post-v13-sensor-availability.json
            result/post-v13-sensor-availability-summary.json
          if-no-files-found: warn
          retention-days: 90

      - name: Report source availability to WP-05
        if: always()
        run: |
          if [ ! -f result/post-v13-sensor-availability.json ]; then
            gh issue comment 643 --body "WP-05 post-V13 sensor availability audit run ${GITHUB_RUN_ID} failed technically before a lawful source-only report was produced. No V14, R6/R5 or fresh holdout was opened."
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p=json.loads(Path("result/post-v13-sensor-availability.json").read_text())
          lines=[
              "## WP-05 post-V13 source-only sensor availability audit",
              "",
              f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- GitHub Actions run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- enabled cTrader symbols: **{p['enabled_symbol_count']}**",
              f"- USTEC control present: **{p['ustec_control_present']}**",
              f"- frozen manifest indices: **{p['selected_manifest_indices']}**",
          ]
          for family, report in p["peer_families"].items():
              lines.append(f"- {family} matched symbols: **{report['matched_symbols']}**")
              for candidate in report["candidate_reports"]:
                  lines.append(
                      "  - "
                      + candidate["provider_symbol"]
                      + ": **"
                      + candidate["coverage_status"]
                      + "**; BID="
                      + str(candidate.get("bid_tick_count", 0))
                      + "; ASK="
                      + str(candidate.get("ask_tick_count", 0))
                  )
          lines.extend([
              "- target/outcome read: **False**",
              "- R6/R5 read: **False**",
              "- fresh holdout opened: **False**",
              "- scientific V14 opened: **False**",
              "- availability evidence only; no scientific sensor admission",
          ])
          Path("result/issue-comment.md").write_text("\n".join(lines)+"\n")
          PY
          gh issue comment 643 --body-file result/issue-comment.md
