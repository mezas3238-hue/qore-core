name: QORE CIBO Architect2 T03 Multi-Leg Margin Screen

on:
  push:
    branches:
      - agent/cibo-external-scientific-closure-001
    paths:
      - '.github/workflows/cibo-arch2-t03-multileg-margin-screen.yml'
      - 'scripts/cibo_arch2_t03_multileg_margin_screen.py'
      - 'src/qore/infrastructure/cibo_arch2_t03_multileg_math.py'
      - 'tests/infrastructure/test_cibo_arch2_t03_multileg_math.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
  QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,ctrader]'
      - name: Quality
        run: |
          ruff check scripts/cibo_arch2_t03_multileg_margin_screen.py src/qore/infrastructure/cibo_arch2_t03_multileg_math.py tests/infrastructure/test_cibo_arch2_t03_multileg_math.py
          mypy --disable-error-code=import-untyped scripts/cibo_arch2_t03_multileg_margin_screen.py src/qore/infrastructure/cibo_arch2_t03_multileg_math.py
          pytest -q --no-cov tests/infrastructure/test_cibo_arch2_t03_multileg_math.py
      - name: Discover DEMO account if needed
        shell: bash
        run: |
          set -euo pipefail
          for name in QORE_CTRADER_CLIENT_ID QORE_CTRADER_CLIENT_SECRET QORE_CTRADER_ACCESS_TOKEN QORE_CTRADER_REFRESH_TOKEN
          do
            test -n "${!name:-}" || exit 2
          done
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            echo "::add-mask::$account_id"
            printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          fi
      - name: Run read-only screen
        run: |
          mkdir -p arch2-t03
          python scripts/cibo_arch2_t03_multileg_margin_screen.py             --output arch2-t03/report.json > arch2-t03/stdout.json
      - name: Enforce read-only governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("arch2-t03/report.json").read_text())
          assert p["provider_key"] == "ctrader-demo"
          assert p["environment"] == "demo"
          assert p["catalog_symbol_count"] > 0
          assert p["enabled_fx_pair_count"] > 0
          assert p["continuous_screen_only"] is True
          assert p["discrete_volume_equivalence_proven"] is False
          assert p["execution_economics_proven"] is False
          assert p["fresh_oos_utility_proven"] is False
          assert p["holdout_outcomes_used"] is False
          assert p["broker_mutation_performed"] is False
          assert p["productive_authority"] is False
          PY
      - name: Seal evidence
        run: |
          printf '%s\n' "$GITHUB_SHA" > arch2-t03/git-sha.txt
          cd arch2-t03
          sha256sum report.json stdout.json git-sha.txt > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-arch2-t03-multileg-${{ github.sha }}
          path: arch2-t03
          if-no-files-found: error
          retention-days: 90
