name: Apply R62N adjacent precision repair

on:
  push:
    branches: [agent/qore-umi14-umi12-final-owner-recert-001]
    paths: [.github/workflows/r62n-adjacent-fix.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qore-umi14-umi12-final-owner-recert-001
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Apply bounded repair
        env:
          PATCH_ZLIB_B64: ''
        run: |
          python - <<'PY'
          import base64, os, zlib
          script = zlib.decompress(base64.b64decode(os.environ['PATCH_ZLIB_B64'])).decode('utf-8')
          exec(compile(script, '<r62n-adjacent-patch>', 'exec'))
          PY
          python -m py_compile tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
      - name: Deterministic regression matrix
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('tests/infrastructure').resolve()))
          n = importlib.import_module('test_universal_cross_asset_conformance_final_owner_r62n_guards')
          cases = {
              'trystar_danger': ('def run():\n    return getattr(globals()["b"], "eval", lambda _: 3)("1+1")\ntry:\n    raise ExceptionGroup("x", [ValueError()])\nexcept* ValueError:\n    import builtins as b\n    result = run()\nb = len\n', 2, True),
              'trystar_safe': ('import builtins as b\ndef run():\n    return getattr(globals()["b"], "eval", lambda _: 3)("1+1")\ntry:\n    raise ExceptionGroup("x", [ValueError()])\nexcept* ValueError:\n    b = len\n    result = run()\n', 3, False),
              'implicit_mismatch_safe': ('import builtins as b\ndef run():\n    return getattr(globals()["b"], "eval", lambda _: 3)("1+1")\ntry:\n    b = len\n    1 / 0\nexcept KeyError:\n    import builtins as b\n    result = run()\nexcept ZeroDivisionError:\n    b = len\n    result = run()\n', 3, False),
              'if_false_int_safe': ('import builtins as b\ndef run():\n    return getattr(globals()["b"], "eval", lambda _: 3)("1+1")\nif 0:\n    import builtins as b\n    result = run()\nb = len\nresult = run()\n', 3, False),
              'if_true_int_danger': ('def run():\n    return getattr(globals()["b"], "eval", lambda _: 3)("1+1")\nif 1:\n    import builtins as b\n    result = run()\nb = len\n', 2, True),
              'annassign_safe': ('import builtins as b\ndef run():\n    return getattr(globals()["b"], "eval", lambda _: 3)("1+1")\ntry:\n    x: object = ((b := len), 1 / 0)\nexcept ZeroDivisionError:\n    result = run()\n', 3, False),
              'assert_safe': ('import builtins as b\ndef run():\n    return getattr(globals()["b"], "eval", lambda _: 3)("1+1")\ntry:\n    assert ((b := len), 1 / 0)\nexcept ZeroDivisionError:\n    result = run()\n', 3, False),
              'danger_namedexpr': ('import builtins\ndef run():\n    return getattr(globals()["b"], "eval", lambda _: 3)("1+1")\nb = len\ntry:\n    ((b := builtins), 1 / 0)\nexcept ZeroDivisionError:\n    result = run()\n', 2, True),
              'second_iteration_for': ('def run():\n    return getattr(globals()["b"], "eval", lambda _: 3)("1+1")\nb = len\nfor _ in (0, 1):\n    result = run()\n    import builtins as b\nb = len\n', 2, True),
          }
          for name, (source, expected_runtime, expected_marker) in cases.items():
              namespace = {}
              exec(compile(source, '<adjacent>', 'exec', dont_inherit=True), namespace)
              markers = n._r62n_dynamic_execution_markers_from_source(source)
              print(name, namespace.get('result'), markers)
              assert namespace.get('result') == expected_runtime
              assert bool(markers) is expected_marker
          PY
      - name: Commit repair and remove staging workflow
        run: |
          set -euo pipefail
          git config user.name 'qore-integration-authority'
          git config user.email 'qore-integration-authority@users.noreply.github.com'
          git rm .github/workflows/r62n-adjacent-fix.yml
          git add tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
          git commit -m 'Harden R62N adjacent control-flow precision'
          git push origin HEAD:agent/qore-umi14-umi12-final-owner-recert-001
