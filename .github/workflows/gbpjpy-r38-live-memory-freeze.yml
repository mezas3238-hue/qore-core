name: QORE GBPJPY R38 Live Memory Freeze

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-gbpusd-r43-live-core-integration-001
    paths:
      - '.github/workflows/gbpjpy-r38-live-memory-freeze.yml'
      - 'scripts/build_gbpjpy_r38_live_memory.py'
      - 'tests/infrastructure/trader_lab/test_gbpjpy_r38_live_memory_builder.py'
      - 'src/qore/infrastructure/trader_lab/cibo_gbpjpy_*.py'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_*.py'

permissions:
  contents: write
  actions: read

env:
  R27_RUN_ID: '35349300927'
  R27_ARTIFACT: 'qore-turtle-soup-gbpjpy-structural-specialist-v2-r27-00fb870826e0cbd30179fe44cbdd6707448be0da'

jobs:
  freeze_memory:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/turtle-soup-gbpusd-r43-live-core-integration-001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Quality
        run: |
          ruff check --ignore E501,I001 \
            scripts/build_gbpjpy_r38_live_memory.py \
            tests/infrastructure/trader_lab/test_gbpjpy_r38_live_memory_builder.py
          mypy --ignore-missing-imports --disable-error-code attr-defined \
            scripts/build_gbpjpy_r38_live_memory.py
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_gbpjpy_r38_live_memory_builder.py
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.R27_ARTIFACT }}
          path: r27-source
          github-token: ${{ github.token }}
          run-id: ${{ env.R27_RUN_ID }}
      - name: Build immutable GBPJPY live memory
        run: |
          mkdir -p runtime_data/gbpjpy
          python scripts/build_gbpjpy_r38_live_memory.py \
            r27-source runtime_data/gbpjpy/r38-confidence-tier-memory.json \
            > runtime_data/gbpjpy/r38-confidence-tier-memory-build.json
          sha256sum runtime_data/gbpjpy/r38-confidence-tier-memory.json \
            > runtime_data/gbpjpy/r38-confidence-tier-memory.sha256
      - name: Enforce memory binding
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path('runtime_data/gbpjpy/r38-confidence-tier-memory.json')
          data=json.loads(p.read_text())
          assert data['identity']=='TURTLE_SOUP_GBPJPY_R38_LIVE_MEMORY_V1'
          assert data['source']['run_id']==35349300927
          assert data['source']['artifact_id']==10549575964
          assert data['source']['artifact_digest']=='sha256:9e9b57f3a108d4f26b3e0b3600705859dc2491dd735972d563f7a350fe0798d2'
          assert data['source']['observations_sha256']=='6b3c7ecf75616ba6d428d23286ec2d9c525aca50ee090c687b9c91e9b2b63066'
          assert data['selected_ensemble']=='R35_RANGE_DIRECTION_MINIMAL_ROBUST'
          assert data['selected_policy']=='CONFIDENCE_100_050_010'
          assert [x['scheme'] for x in data['layers']]==[
              'R34_RANGE_ROUTE_TYPES',
              'R34_DIRECTION_REGIME_ROUTE_TYPES',
              'R34_MINIMAL_ROUTE_TYPES',
          ]
          assert all(len(v['profiles']) > 0 for v in data['schemes'].values())
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          assert Path('runtime_data/gbpjpy/r38-confidence-tier-memory.sha256').read_text().split()[0]==digest
          PY
      - name: Commit frozen live memory
        run: |
          git config user.name 'qore-research-bot'
          git config user.email 'qore-research-bot@users.noreply.github.com'
          git add \
            runtime_data/gbpjpy/r38-confidence-tier-memory.json \
            runtime_data/gbpjpy/r38-confidence-tier-memory.sha256 \
            runtime_data/gbpjpy/r38-confidence-tier-memory-build.json
          git commit -m "data(gbpjpy-live): freeze R38 confidence-tier memory" || exit 0
          git push origin HEAD:agent/turtle-soup-gbpusd-r43-live-core-integration-001
