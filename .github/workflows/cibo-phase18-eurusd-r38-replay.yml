name: QORE CIBO Phase 18 EURUSD R38 Chronological Replay

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-phase18-eurusd-r38-replay.yml'
      - 'scripts/cibo_phase18_eurusd_geometry_patch.py'
      - 'scripts/cibo_phase18_eurusd_bind.py'
      - 'scripts/cibo_phase18_eurusd_score.py'
      - 'src/qore/infrastructure/cibo_ce2i_chronological_replay.py'
      - 'tests/infrastructure/test_cibo_ce2i_chronological_replay.py'
      - 'tests/infrastructure/trader_lab/test_cibo_phase18_eurusd_geometry_patch.py'
  push:
    branches:
      - agent/cibo-capital-efficiency-sizing-lab-001
    paths:
      - '.github/workflows/cibo-phase18-eurusd-r38-replay.yml'
      - 'scripts/cibo_phase18_eurusd_geometry_patch.py'
      - 'scripts/cibo_phase18_eurusd_bind.py'
      - 'scripts/cibo_phase18_eurusd_score.py'
      - 'src/qore/infrastructure/cibo_ce2i_chronological_replay.py'
      - 'tests/infrastructure/test_cibo_ce2i_chronological_replay.py'
      - 'tests/infrastructure/trader_lab/test_cibo_phase18_eurusd_geometry_patch.py'

permissions:
  contents: read
  actions: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  EURUSD_SOURCE_SHA: '324fb91d44a6fa328e66de2e22ace7386630c7aa'
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-EURUSD-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-EURUSD-2f510461b3360e91d5ee70a72716a76cd6561f16'
  R28_RUN_ID: '35319457546'
  R28_ARTIFACT: 'qore-turtle-soup-eurusd-cognitive-v3-r28-e6879bbdd3844751af075269ddd93db6d3f9b9e1'
  FREEZE_RUN_ID: '35326864091'
  FREEZE_ARTIFACT: 'qore-turtle-soup-eurusd-r36-candidate-freeze-4fef686b9fc669ad64a5a85fb2c899fae9b42a74'
  R38_RUN_ID: '35327677519'
  R38_ARTIFACT: 'qore-turtle-soup-eurusd-r38-5y-structural-risk-correction-324fb91d44a6fa328e66de2e22ace7386630c7aa'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Focused quality
        run: |
          ruff check \
            scripts/cibo_phase18_eurusd_geometry_patch.py \
            scripts/cibo_phase18_eurusd_bind.py \
            scripts/cibo_phase18_eurusd_score.py \
            src/qore/infrastructure/cibo_ce2i_chronological_replay.py \
            tests/infrastructure/test_cibo_ce2i_chronological_replay.py \
            tests/infrastructure/trader_lab/test_cibo_phase18_eurusd_geometry_patch.py
          mypy \
            scripts/cibo_phase18_eurusd_geometry_patch.py \
            scripts/cibo_phase18_eurusd_bind.py \
            scripts/cibo_phase18_eurusd_score.py \
            src/qore/infrastructure/cibo_ce2i_chronological_replay.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_ce2i_chronological_replay.py \
            tests/infrastructure/trader_lab/test_cibo_phase18_eurusd_geometry_patch.py

  replay-eurusd:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout CIBO evidence head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}

      - name: Checkout immutable EURUSD source code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EURUSD_SOURCE_SHA }}
          path: eurusd-code

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install -e .

      - name: Verify immutable EURUSD source commit
        run: |
          test "$(git -C eurusd-code rev-parse HEAD)" = "$EURUSD_SOURCE_SHA"
          test "$EURUSD_SOURCE_SHA" = "324fb91d44a6fa328e66de2e22ace7386630c7aa"

      - name: Instrument exact R38 source for geometry serialization only
        run: |
          python scripts/cibo_phase18_eurusd_geometry_patch.py \
            "eurusd-code/src/qore/infrastructure/trader_lab/turtle_soup_eurusd_r38_5y_structural_risk_correction.py" \
            "eurusd-code/src/qore/infrastructure/trader_lab/cibo_phase18_eurusd_r38_geometry_replay.py"
          python -m py_compile \
            eurusd-code/src/qore/infrastructure/trader_lab/cibo_phase18_eurusd_r38_geometry_replay.py

      - name: Download immutable EURUSD raw master
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-eurusd
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download immutable Target Destination V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target-eurusd
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}

      - name: Download exact Cognitive V3 R28 evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.R28_ARTIFACT }}
          path: cognitive-v3
          github-token: ${{ github.token }}
          run-id: ${{ env.R28_RUN_ID }}

      - name: Download exact R36 freeze
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FREEZE_ARTIFACT }}
          path: r36-freeze
          github-token: ${{ github.token }}
          run-id: ${{ env.FREEZE_RUN_ID }}

      - name: Download exact authoritative R38 ledger
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.R38_ARTIFACT }}
          path: r38-source
          github-token: ${{ github.token }}
          run-id: ${{ env.R38_RUN_ID }}

      - name: Reproduce exact R38 geometry and capital policy
        env:
          PYTHONPATH: ${{ github.workspace }}/eurusd-code/src
        run: |
          mkdir -p phase18-output
          python eurusd-code/src/qore/infrastructure/trader_lab/cibo_phase18_eurusd_r38_geometry_replay.py \
            source-eurusd target-eurusd cognitive-v3 r36-freeze phase18-output \
            > phase18-output/replay-stdout.json

      - name: Bind exact geometry to authoritative R38
        run: |
          python scripts/cibo_phase18_eurusd_bind.py \
            --geometry phase18-output/phase18-eurusd-r38-geometry-trades.jsonl \
            --r38 r38-source/r38-5y-corrected-trades.jsonl \
            --r38-report r38-source/r38-5y-correction-report.json \
            --output phase18-output

      - name: Score R38 with generic CIBO Phase 18 replay
        run: |
          python scripts/cibo_phase18_eurusd_score.py \
            --bound phase18-output/phase18-eurusd-r38-bound-trades.jsonl \
            --output phase18-output/phase18-eurusd-r38-generic-score.json

      - name: Hash Phase 18 evidence
        run: |
          printf '%s\n' "$EVIDENCE_SHA" > phase18-output/git-sha.txt
          printf '%s\n' "$EURUSD_SOURCE_SHA" > phase18-output/eurusd-source-sha.txt
          cd phase18-output
          sha256sum \
            phase18-eurusd-r38-geometry-report.json \
            phase18-eurusd-r38-geometry-trades.jsonl \
            phase18-eurusd-r38-bound-report.json \
            phase18-eurusd-r38-bound-trades.jsonl \
            phase18-eurusd-r38-generic-score.json \
            replay-stdout.json \
            git-sha.txt \
            eurusd-source-sha.txt > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-phase18-eurusd-r38-geometry-${{ env.EVIDENCE_SHA }}
          path: phase18-output
          if-no-files-found: error
          retention-days: 90
