name: QORE Capitalizer Contextual Residual DD Forensics V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-contextual-residual-dd-forensics-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_contextual_residual_dd_forensics_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_contextual_residual_dd_forensics_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  DIRECT_RUN_ID: '36196002610'
  DIRECT_SHA: 'ddd00209e50d5ec16c8cb94f34e9e5e95f401839'
  CONTEXT_RUN_ID: '36211415438'
  CONTEXT_SHA: 'c652b1e5a5181ba95ac6f10ea5c95bf808a0c8a7'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_contextual_residual_dd_forensics_v1.py tests/infrastructure/trader_lab/test_capitalizer_contextual_residual_dd_forensics_v1.py
      - run: mypy src/qore/infrastructure/trader_lab/capitalizer_contextual_residual_dd_forensics_v1.py
      - run: pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_contextual_residual_dd_forensics_v1.py

  forensics:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-max-recovery-direct-m1-dev-*-${{ env.DIRECT_SHA }}
          path: development-input
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.DIRECT_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-max-recovery-direct-m1-holdout-*-${{ env.DIRECT_SHA }}
          path: validation-input
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.DIRECT_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-native-market-context-v1-*-${{ env.CONTEXT_SHA }}
          path: context-input
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.CONTEXT_RUN_ID }}
      - run: |
          python -m qore.infrastructure.trader_lab.capitalizer_contextual_residual_dd_forensics_v1 development-input validation-input context-input forensic-output
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-contextual-residual-dd-forensics-v1-${{ github.sha }}
          path: forensic-output
          retention-days: 90
