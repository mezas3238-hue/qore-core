name: QORE Turtle Soup XAUUSD R20 Adaptive CIBO Trailing Rearm

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-xauusd-r3-forensics-001
    paths:
      - '.github/workflows/turtle-soup-xauusd-r20-adaptive-cibo-trailing-rearm.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r20_adaptive_cibo_trailing_rearm.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r20_adaptive_cibo_trailing_rearm.py'

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-XAUUSD-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-XAUUSD-2f510461b3360e91d5ee70a72716a76cd6561f16'
  DOSSIER_RUN_ID: '35291722997'
  DOSSIER_ARTIFACT: 'qore-cibo-xauusd-market-intelligence-v1-8068f78df709b9a1702f14264f76c653140c9c1f'
  R19_RUN_ID: '35292255680'
  R19_ARTIFACT: 'qore-turtle-soup-xauusd-r19-full-cibo-trailing-7abfecef04ca274248a0cfa50e4acabb6dcaaf32'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check --ignore E501,I001 \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r20_adaptive_cibo_trailing_rearm.py \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r20_adaptive_cibo_trailing_rearm.py
      - name: Mypy focused gate
        run: |
          mypy --disable-error-code attr-defined \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r20_adaptive_cibo_trailing_rearm.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r20_adaptive_cibo_trailing_rearm.py

  replay-2y:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable consumed XAUUSD M5 corpus
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download immutable consumed XAUUSD Target Destination V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Download official CIBO XAUUSD 10Y intelligence dossier
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.DOSSIER_ARTIFACT }}
          path: cibo-dossier
          github-token: ${{ github.token }}
          run-id: ${{ env.DOSSIER_RUN_ID }}
      - name: Download immutable R19 reference
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.R19_ARTIFACT }}
          path: r19-reference
          github-token: ${{ github.token }}
          run-id: ${{ env.R19_RUN_ID }}
      - name: Run adaptive trailing and rearm replay
        run: |
          mkdir -p r20-output
          python -m qore.infrastructure.trader_lab.turtle_soup_xauusd_r20_adaptive_cibo_trailing_rearm \
            source-xauusd target-xauusd cibo-dossier r19-reference r20-output \
            > r20-output/stdout.json
          printf '%s\n' "$GITHUB_SHA" > r20-output/git-sha.txt
      - name: Enforce adaptive trailing, rearm, and governance contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('r20-output/r20-adaptive-trailing-rearm-report.json').read_text())
          assert p['identity']=='TURTLE_SOUP_XAUUSD_R20_ADAPTIVE_CIBO_TRAILING_REARM_V1'
          assert p['window']['open']=='2024-09-17T00:00:00+00:00'
          assert p['window']['close']=='2026-09-17T00:00:00+00:00'
          assert p['reproduction']['retained_bars']==707716
          assert p['full_cibo_memory']['bridge']['governed_cibo_memory_store'] is True
          a=p['adaptive_trailing_contract']
          assert a['SUPPORTIVE']=='NO_GENERIC_M5_SWING_TRAIL_INTERMEDIATE_DOL_LOCK_ONLY'
          assert a['MIXED']=='SECOND_DISTINCT_CONFIRMED_M5_PROTECTIVE_SWING_OR_INTERMEDIATE_DOL_LOCK'
          assert a['CAUTIOUS']=='FIRST_CONFIRMED_M5_PROTECTIVE_SWING_OR_INTERMEDIATE_DOL_LOCK'
          assert a['stop_widening_allowed'] is False
          assert a['new_stop_effective_same_bar'] is False
          r=p['structural_rearm_contract']
          assert r['arbitrary_time_cooldown_used'] is False
          assert r['requires_raid_strictly_after_exit'] is True
          assert r['requires_c2_source_open_strictly_after_exit'] is True
          assert p['variants']['ADAPTIVE_NO_REARM']['executed_trades'] > 0
          assert p['variants']['ADAPTIVE_REARM']['executed_trades'] > 0
          g=p['governance']
          assert g['fresh_holdout_consumed'] is False
          assert g['rule_promoted'] is False
          assert g['live_authorized'] is False
          assert g['real_capital_authorized'] is False
          PY
      - name: Hash immutable R20 result
        run: |
          cd r20-output
          sha256sum \
            r20-adaptive-trailing-rearm-report.json \
            r20-adaptive-no-rearm-trades.json \
            r20-adaptive-rearm-trades.json \
            stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-xauusd-r20-adaptive-cibo-trailing-${{ github.sha }}
          path: r20-output
          if-no-files-found: error
          retention-days: 90
