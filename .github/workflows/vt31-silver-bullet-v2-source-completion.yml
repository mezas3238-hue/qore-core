name: QORE VT-31 Silver Bullet V2 Source Completion

on:
  push:
    branches:
      - agent/vt31-silver-bullet-v2-source-completion-001
  workflow_dispatch:

concurrency:
  group: qore-vt31-v2-source-completion-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
  QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}
  QORE_DEMO_LAB_SYMBOL: NAS100
  QORE_DEMO_LAB_LOOKBACK_DAYS: "760"
  QORE_SOFTWARE_SHA: ${{ github.sha }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact VT-31 V2 head
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install quality runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff full gate
        run: ruff check .
      - name: Mypy full gate
        run: mypy src tests
      - name: VT-31 V2 focused source-fidelity gate
        run: |
          pytest -q --no-cov \
            tests/infrastructure/traders/test_vt31_silver_bullet_v2.py \
            tests/infrastructure/test_ctrader_demo_lab_vt31_v2_probe.py \
            tests/infrastructure/trader_lab/test_vt31_silver_bullet_v2_backtest.py \
            tests/infrastructure/trader_lab/test_vt31_silver_bullet_v2_backtest_report.py \
            tests/infrastructure/trader_lab/test_vt31_silver_bullet_v2_full_research.py
      - name: Pytest full quality gate
        run: pytest --cov=src/qore --cov-report=term-missing

  vt31-v2-source-research:
    if: ${{ contains(github.event.head_commit.message || '', 'run-vt31-v2-source-backtest') || github.event_name == 'workflow_dispatch' }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout exact VT-31 V2 head
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QORE and cTrader runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ctrader]"
      - name: Verify DEMO research inputs without printing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in QORE_CTRADER_CLIENT_ID QORE_CTRADER_CLIENT_SECRET QORE_CTRADER_ACCESS_TOKEN QORE_CTRADER_REFRESH_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "missing required DEMO research input: ${name}" >&2
              exit 2
            fi
          done
      - name: Discover DEMO account when not configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            if ! [[ "$account_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "cTrader DEMO account discovery returned invalid id" >&2
              exit 3
            fi
            echo "::add-mask::$account_id"
            printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          fi
      - name: Collect NAS100 M1 source evidence
        run: |
          mkdir -p artifacts/vt31-silver-bullet-v2/NAS100
          python -m qore.infrastructure.ctrader_demo_lab_vt31_v2_probe \
            > artifacts/vt31-silver-bullet-v2/NAS100/market-evidence.json
      - name: Run source-bound backtest
        run: |
          python -m qore.infrastructure.trader_lab.vt31_silver_bullet_v2_backtest_report \
            artifacts/vt31-silver-bullet-v2/NAS100/market-evidence.json \
            > artifacts/vt31-silver-bullet-v2/NAS100/backtest.json
          printf '%s\n' "$GITHUB_SHA" > artifacts/vt31-silver-bullet-v2/NAS100/git-sha.txt
      - name: Verify source-bound lifecycle contract
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path("artifacts/vt31-silver-bullet-v2/NAS100/backtest.json")
          result = json.loads(path.read_text())
          assert result["schema"] == "qore.trader_lab.vt31_silver_bullet_v2_backtest.v1"
          assert result["software_sha"] == os.environ["GITHUB_SHA"]
          assert result["symbol"] == "NAS100"
          assert result["methodology_version"] == "v2.1-source-complete"
          assert result["position_management"] == "source-3r-to-breakeven-v1"
          assert result["same_bar_policy"] == "stop-first-before-be-be-first-after-be-v1"
          assert result["one_fill_per_session"] is True
          assert result["target_count"] + result["stop_count"] + result["breakeven_count"] == result["terminal_sample_size"]
          assert result["long_setup_count"] + result["short_setup_count"] == result["setup_count"]
          assert result["long_trade_count"] + result["short_trade_count"] == result["filled_count"]
          PY
      - name: Run complete Trader Lab research packaging
        run: |
          python -m qore.infrastructure.trader_lab.vt31_silver_bullet_v2_full_research \
            artifacts/vt31-silver-bullet-v2/NAS100/market-evidence.json \
            artifacts/vt31-silver-bullet-v2/NAS100/backtest.json \
            artifacts/vt31-silver-bullet-v2/NAS100 \
            > artifacts/vt31-silver-bullet-v2/NAS100/research-run-summary.stdout.json
      - name: Verify no false DEMO authority
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path("artifacts/vt31-silver-bullet-v2/NAS100")
          required = {
              "market-evidence.json", "backtest.json", "git-sha.txt",
              "walk-forward.json", "characterization.json", "stress.json",
              "monte-carlo.json", "failure-analysis.json", "story-forensics.json",
              "hypothesis-register.json", "research-summary.json",
              "research-run-summary.stdout.json",
          }
          assert required <= {p.name for p in root.iterdir() if p.is_file()}
          summary = json.loads((root / "research-summary.json").read_text())
          assert summary["software_sha"] == os.environ["GITHUB_SHA"]
          assert summary["symbol"] == "NAS100"
          assert summary["demo_eligible"] is False
          assert summary["story_forensics_complete"] is True
          PY
      - name: Upload sanitized VT-31 V2 source-bound research evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-silver-bullet-v2-source-${{ github.sha }}
          path: artifacts/vt31-silver-bullet-v2/NAS100
          if-no-files-found: error
          retention-days: 30
