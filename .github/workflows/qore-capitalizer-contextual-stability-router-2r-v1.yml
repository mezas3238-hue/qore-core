name: QORE Capitalizer Contextual Stability Router 2R V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-contextual-stability-router-2r-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_contextual_stability_router_2r_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_contextual_stability_router_2r_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-contextual-stability-router-2r-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  DIRECT_RUN_ID: '36196002610'
  DIRECT_SHA: 'ddd00209e50d5ec16c8cb94f34e9e5e95f401839'
  CONTEXT_RUN_ID: '36211415438'
  CONTEXT_SHA: 'c652b1e5a5181ba95ac6f10ea5c95bf808a0c8a7'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_contextual_stability_router_2r_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_contextual_stability_router_2r_v1.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_contextual_stability_router_2r_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_contextual_stability_router_2r_v1.py

  experiment:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download development direct-M1 ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-max-recovery-direct-m1-dev-*-${{ env.DIRECT_SHA }}
          path: development-input
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.DIRECT_RUN_ID }}
      - name: Download validation direct-M1 ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-max-recovery-direct-m1-holdout-*-${{ env.DIRECT_SHA }}
          path: validation-input
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.DIRECT_RUN_ID }}
      - name: Download native market contexts
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-native-market-context-v1-*-${{ env.CONTEXT_SHA }}
          path: context-input
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.CONTEXT_RUN_ID }}
      - name: Run contextual stability router
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_contextual_stability_router_2r_v1 \
            development-input validation-input context-input experiment-output
      - name: Enforce causal and economic integrity
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          report = json.loads(
              Path(
                  "experiment-output/"
                  "capitalizer-contextual-stability-router-2r-v1.json"
              ).read_text()
          )
          assert report["development_trades"] == 948
          assert report["validation_trades"] == 1034
          assert report["validation_is_fresh_holdout"] is False
          assert report["model_trained_on_development_only"] is True
          assert report["validation_outcomes_visible_to_training"] is False
          assert report["current_trade_outcome_visible_to_decision"] is False
          assert report["unchosen_counterfactual_visible_to_decision"] is False
          assert report["all_entries_preserved"] is True
          assert report["regime_context_provider_native"] is True
          assert report["destination_uses_confirmed_h1_pivots_only"] is True
          for row in report["results"]:
              assert row["development"]["trades"] == 948
              assert row["validation"]["trades"] == 1034
              assert Decimal(row["development"]["density_retention"]) == Decimal("1")
              assert Decimal(row["validation"]["density_retention"]) == Decimal("1")
          assert report["automatic_policy_promotion"] is False
          assert report["runtime_rule_selected"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-contextual-stability-router-2r-v1-${{ github.sha }}
          path: experiment-output
          if-no-files-found: error
          retention-days: 90
