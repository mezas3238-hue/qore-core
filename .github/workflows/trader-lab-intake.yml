name: QORE Trader Lab Intake

on:
  push:
    branches:
      - agent/qore-demo-first-execution-vertical-cert-001
    paths:
      - .github/workflows/trader-lab-intake.yml
      - src/qore/infrastructure/trader_lab/catalog.py
      - src/qore/infrastructure/trader_lab/operational_intake.py
      - tests/infrastructure/trader_lab/test_operational_intake.py

permissions:
  contents: read

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Core
        run: python -m pip install -e .
      - name: Record all 31 Traders entering Trader Lab
        run: |
          mkdir -p artifacts/trader-lab-intake
          python -m qore.infrastructure.trader_lab.operational_intake \
            > artifacts/trader-lab-intake/intake.json
          printf '%s\n' "$GITHUB_SHA" \
            > artifacts/trader-lab-intake/git-sha.txt
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("artifacts/trader-lab-intake/intake.json").read_text()
          )
          assert payload["all_31_entered_lab"] is True
          assert payload["trader_count"] == 31
          assert payload["first_cohort_entered_lab"] is True
          assert payload["first_demo_cohort"] == [
              "vt-01", "vt-08", "vt-09", "vt-17", "vt-31"
          ]
          assert payload["qualification_claimed"] is False
          assert payload["execution_authority_claimed"] is False
          PY
      - name: Upload sanitized Trader Lab intake evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-trader-lab-intake-${{ github.sha }}
          path: artifacts/trader-lab-intake
          if-no-files-found: error
          retention-days: 30
