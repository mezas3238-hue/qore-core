name: QORE Capitalizer Cognitive Loss Memory Resolution Atlas 2Y V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-cognitive-loss-memory-resolution-atlas-2y-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_cognitive_loss_memory_resolution_atlas_2y_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_cognitive_loss_memory_resolution_atlas_2y_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-cognitive-loss-memory-resolution-atlas-2y-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  FINGERPRINT_RUN_ID: '36066153534'
  FINGERPRINT_SHA: 'e6bf614578b52bde0928268c43a2b57bdd547139'
  TARGET_RUN_ID: '36055792484'
  TARGET_SHA: 'a66ab11c22efbefb61756db3f0062c3c51a2a825'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check             src/qore/infrastructure/trader_lab/capitalizer_cognitive_loss_memory_resolution_atlas_2y_v1.py             tests/infrastructure/trader_lab/test_capitalizer_cognitive_loss_memory_resolution_atlas_2y_v1.py
      - name: Mypy
        run: |
          mypy             src/qore/infrastructure/trader_lab/capitalizer_cognitive_loss_memory_resolution_atlas_2y_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov             tests/infrastructure/trader_lab/test_capitalizer_cognitive_loss_memory_resolution_atlas_2y_v1.py

  atlas:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download frozen fingerprint audit
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cognitive-failure-fingerprint-audit-2y-v1-${{ env.FINGERPRINT_SHA }}
          path: fingerprint-input
          github-token: ${{ github.token }}
          run-id: ${{ env.FINGERPRINT_RUN_ID }}
      - name: Download frozen 1R target ledger
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-max-recovery-target1-stability-2y-v1-${{ env.TARGET_SHA }}
          path: target-input
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Build loss-memory resolution atlas
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cognitive_loss_memory_resolution_atlas_2y_v1             fingerprint-input target-input memory-output
      - name: Enforce resolution-atlas controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "memory-output/"
                  "capitalizer-cognitive-loss-memory-resolution-atlas-2y-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_COGNITIVE_LOSS_MEMORY_RESOLUTION_ATLAS_2Y_V1"
          )
          assert report["source_fingerprint_run_id"] == 36066153534
          assert report["source_target_run_id"] == 36055792484
          assert report["control_trades"] == 948
          assert report["fingerprint_control_reproduced"] is True
          assert report["prior_closed_outcomes_only"] is True
          assert report["current_trade_outcome_visible_to_memory_decision"] is False
          assert report["current_trade_outcome_used_for_post_audit_metrics"] is True
          assert report["numeric_market_thresholds_added"] is False
          assert report["semantic_variant_selected"] is False
          assert report["runtime_enforcement_allowed"] is False
          assert report["strategy_rules_changed"] is False
          assert report["cognitive_rules_changed"] is False
          assert report["entry_changed"] is False
          assert report["stop_changed"] is False
          assert report["target_changed"] is False
          assert report["max3_changed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          assert set(report["variants"]) == {"STRUCTURAL", "CONTEXTUAL"}
          assert all(len(rows) == 4 for rows in report["variants"].values())
          for rows in report["variants"].values():
              for row in rows:
                  assert 0 <= row["blocked_trades"] <= 948
                  assert row["kept_trades"] + row["blocked_trades"] == 948
                  assert 0 <= row["blocked_stops"] <= 223
                  assert 0 <= row["blocked_wins"] <= 545
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-cognitive-loss-memory-resolution-atlas-2y-v1-${{ github.sha }}
          path: memory-output
          if-no-files-found: error
          retention-days: 90
