name: QORE VT08 CRT PURE 2Y Causal Forensics

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vt08-crt-pure-source-identity-001
    paths:
      - '.github/workflows/vt08-crt-pure-2y-causal-forensics.yml'

permissions:
  contents: read
  actions: read

jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install replay runtime
        run: python -m pip install -e '.[ctrader]'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: mezas3238-hue/qore-core
          run-id: 35587579844
          pattern: qore-vt08-crt-pure-2y-*-eb0ec4ac61cac92d4147069ee15b1d1cff87af37
          path: artifacts/input
      - name: Diagnose preserved successful market replays
        shell: bash
        run: |
          mkdir -p artifacts/forensics
          python -m qore.infrastructure.trader_lab.vt08_crt_pure_2y_forensics \
            artifacts/input artifacts/forensics/crt-pure-2y-forensics.json
          printf '%s\n' "$GITHUB_SHA" > artifacts/forensics/git-sha.txt
          cd artifacts/forensics
          sha256sum crt-pure-2y-forensics.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-crt-pure-2y-causal-forensics-${{ github.sha }}
          path: artifacts/forensics
          if-no-files-found: error
          retention-days: 90
