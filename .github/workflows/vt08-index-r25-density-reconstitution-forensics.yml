name: VT08 Index R25 Density Reconstitution Forensics

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r25-density-reconstitution-forensics.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r25_density_reconstitution_forensics.py
      - tests/infrastructure/trader_lab/test_vt08_index_r25_density_reconstitution_forensics.py
      - src/qore/infrastructure/trader_lab/vt08_index_concurrent_market_contract.py
      - tests/infrastructure/trader_lab/test_vt08_index_concurrent_market_contract.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q           tests/infrastructure/trader_lab/test_vt08_index_concurrent_market_contract.py           tests/infrastructure/trader_lab/test_vt08_index_r25_density_reconstitution_forensics.py

  research:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R25 density reconstitution forensics
        run: |
          python -m qore.infrastructure.trader_lab.vt08_index_r25_density_reconstitution_forensics \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r25-density-reconstitution-forensics.json

      - name: Verify Owner Contract V2
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(Path("artifacts/report/vt08-index-r25-density-reconstitution-forensics.json").read_text())
          c=report["owner_contract"]
          assert c["contract_id"] == "VT08_INDEX_CONCURRENT_MARKET_CONTRACT_V2"
          assert c["five_year_trade_range"] == [2300,2500]
          assert c["two_year_min_trades"] == 1000
          assert c["portfolio_max_drawdown_r"] == "6"
          assert c["cross_market_concurrency_required"] is True
          i=report["interpretation_contract"]
          assert i["target_grid_is_occupancy_diagnostic_only"] is True
          assert i["target_grid_may_not_be_ranked_by_pnl"] is True
          assert i["no_economic_candidate_selected"] is True
          PY

      - name: Build summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path("artifacts/report")
          r=json.loads((root/"vt08-index-r25-density-reconstitution-forensics.json").read_text())
          lines=[
              "# VT08 INDEX R25 Density Reconstitution Forensics",
              "",
              f"- source-complete raw surface: {r['source_complete_raw_surface_count']}",
              f"- source-priority raw surface: {r['source_priority_raw_surface_count']}",
              f"- raw source-complete in 5Y target: {r['source_complete_raw_surface_in_5y_target']}",
              f"- source-complete admitted by target: {r['source_complete_one_active_per_symbol_by_target']}",
              f"- source-priority admitted by target: {r['source_priority_one_active_per_symbol_by_target']}",
              f"- density pass by target: {r['source_complete_lifecycle_density_pass_by_target']}",
              "",
              "## By market",
          ]
          for symbol, row in r["by_market"].items():
              lines += [
                  f"### {symbol}",
                  f"- source-complete: {row['source_complete']}",
                  f"- source-priority: {row['source_priority']}",
                  f"- complete admitted: {row['source_complete_one_active_per_symbol_by_target']}",
              ]
          (root/"VT08_INDEX_R25_DENSITY_RECONSTITUTION_FORENSICS_SUMMARY.md").write_text(
              "\n".join(lines)+"\n"
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-index-r25-density-reconstitution-forensics-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
