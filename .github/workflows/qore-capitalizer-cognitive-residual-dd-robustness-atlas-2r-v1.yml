name: QORE Capitalizer Cognitive Residual DD Robustness Atlas 2R V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-cognitive-residual-dd-robustness-atlas-2r-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_cognitive_residual_dd_robustness_atlas_2r_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_cognitive_residual_dd_robustness_atlas_2r_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-cognitive-residual-dd-robustness-atlas-2r-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  REBASE_RUN_ID: '36078677895'
  REBASE_SHA: 'cfc04849c8bbfd6565310d89456f5e367ea880f7'
  CROSS_RUN_ID: '36083458303'
  CROSS_SHA: 'dbbef8abd9a75ab08da577dcf2e390e755b2f1fe'
  COLLISION_RUN_ID: '36083729816'
  COLLISION_SHA: '4bf7c7a50f52653096bf75f984e39774d3c5dc36'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check             src/qore/infrastructure/trader_lab/capitalizer_cognitive_residual_dd_robustness_atlas_2r_v1.py             tests/infrastructure/trader_lab/test_capitalizer_cognitive_residual_dd_robustness_atlas_2r_v1.py
      - name: Mypy
        run: |
          mypy             src/qore/infrastructure/trader_lab/capitalizer_cognitive_residual_dd_robustness_atlas_2r_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov             tests/infrastructure/trader_lab/test_capitalizer_cognitive_residual_dd_robustness_atlas_2r_v1.py

  atlas:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download true-2R cognitive rebase
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cognitive-economic-rebase-2r-v1-${{ env.REBASE_SHA }}
          path: rebase-input
          github-token: ${{ github.token }}
          run-id: ${{ env.REBASE_RUN_ID }}
      - name: Download true-2R Cross-Feature report
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cognitive-third-slot-cross-feature-atlas-2r-v1-${{ env.CROSS_SHA }}
          path: cross-input
          github-token: ${{ github.token }}
          run-id: ${{ env.CROSS_RUN_ID }}
      - name: Download true-2R collision report
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cognitive-simultaneous-factor-collision-atlas-2r-v1-${{ env.COLLISION_SHA }}
          path: collision-input
          github-token: ${{ github.token }}
          run-id: ${{ env.COLLISION_RUN_ID }}
      - name: Build robust residual DD atlas
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cognitive_residual_dd_robustness_atlas_2r_v1             rebase-input cross-input collision-input residual-output
      - name: Enforce residual robustness controls
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          report = json.loads(
              Path(
                  "residual-output/"
                  "capitalizer-cognitive-residual-dd-robustness-atlas-2r-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_COGNITIVE_RESIDUAL_DD_ROBUSTNESS_ATLAS_2R_V1"
          )
          assert report["source_rebase_run_id"] == 36078677895
          assert report["source_cross_run_id"] == 36083458303
          assert report["source_collision_run_id"] == 36083729816
          assert report["target_r"] == "2.00"
          assert report["control_trades"] == 948
          assert report["control_metrics"]["stops"] == 275
          assert Decimal(report["control_metrics"]["max_drawdown_r"]) == Decimal(
              "12.93584837435268644582248142"
          )
          assert report["third_slot_reference_trades"] == 10
          assert report["collision_cluster_count"] == 11
          assert report["policy_count"] == 6
          assert len(report["policy_base_metrics"]) == 6
          assert report["common_residual_episode_trades"] > 0
          assert report["causal_cell_count"] > 0
          assert report["all_features_known_by_entry"] is True
          assert report["current_outcome_used_to_create_cell"] is False
          assert report["current_outcome_used_for_post_cell_metrics"] is True
          assert report["all_six_collision_policies_required"] is True
          assert report["automatic_cell_selection"] is False
          assert report["runtime_rule_selected"] is False
          assert report["rebase_control_reproduced"] is True
          assert report["collision_control_reproduced"] is True

          for row in report["cells"]:
              assert len(row["policy_results"]) == 6
              assert Decimal(row["worst_case_density_retention"]) >= 0
              assert Decimal(row["worst_case_density_retention"]) <= 1
              assert row["common_residual_trades_covered"] > 0

          assert report["strategy_rules_changed"] is False
          assert report["cognitive_rules_changed"] is False
          assert report["entry_changed"] is False
          assert report["stop_changed"] is False
          assert report["target_changed"] is False
          assert report["max3_changed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-cognitive-residual-dd-robustness-atlas-2r-v1-${{ github.sha }}
          path: residual-output
          if-no-files-found: error
          retention-days: 90
