name: VT08 Index R60 Core Robustness Suite

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r60-core-robustness-suite.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r60_core_robustness_suite.py
      - tests/infrastructure/trader_lab/test_vt08_index_r60_core_robustness_suite.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r60_core_robustness_suite.py

  robustness:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R60 Core robustness suite
        run: |
          python -m qore.infrastructure.trader_lab.vt08_index_r60_core_robustness_suite \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r60-core-robustness-suite.json

      - name: Verify R60 governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r60-core-robustness-suite.json"
              ).read_text()
          )
          assert report["candidate"]["candidate_id"] == (
              "VT08_INDEX_R58_EXACT_R47_DISTRIBUTED_CAUSAL_RISK_001"
          )
          assert report["candidate"]["rules_changed"] is False
          assert report["candidate"]["risk_retuned"] is False
          assert report["five_year"]["sample"] == 2448
          assert report["recent_two_year"]["sample"] == 1017
          g = report["governance"]
          assert g["existing_core_monte_carlo_reused"] is True
          assert g["existing_core_walk_forward_contract_reused"] is True
          assert g["existing_core_stress_accounting_reused"] is True
          assert g["fresh_holdout_claim"] is False
          assert g["certified"] is False
          assert g["live_authorized"] is False
          assert g["real_capital_authorized"] is False
          assert g["production_authorized"] is False
          PY

      - name: Upload R60 evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-index-r60-core-robustness-suite-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
