name: QORE VT31 NAS100 Causal Hybrid Density V2

on:
  push:
    branches:
      - agent/vt31-nas100-intelligence-pilot-001
    paths:
      - scripts/vt31_nas100_causal_hybrid_density_v2.py
      - scripts/vt31_nas100_causal_hybrid_replay_v1.py
      - scripts/vt31_nas100_entry_intelligence_oco_lab_v1.py
      - scripts/vt31_nas100_specialist_r1_candidate.py
      - src/qore/infrastructure/traders/vt31_nas100_*.py
      - .github/workflows/vt31-nas100-causal-hybrid-density-v2.yml
  workflow_dispatch:

concurrency:
  group: vt31-nas100-causal-hybrid-density-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
          - partition: r8_fresh
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
    env:
      GH_TOKEN: ${{ github.token }}
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Static causal gate
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_causal_hybrid_density_v2.py
          ruff check             scripts/vt31_nas100_causal_hybrid_density_v2.py             scripts/vt31_nas100_causal_hybrid_replay_v1.py

      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p evidence result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d evidence
          path="evidence/fresh/NAS100/market-evidence.json"
          test -f "$path"
          actual="$(sha256sum "$path" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"

      - name: Replay causal hybrid density variants
        run: |
          set -euo pipefail
          python scripts/vt31_nas100_causal_hybrid_density_v2.py             evidence/fresh/NAS100/market-evidence.json             --output "result/causal-density-${PARTITION}.json"             | tee result/summary.json

      - name: Governance gate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = os.environ["PARTITION"]
          payload = json.loads(
              Path(f"result/causal-density-{p}.json").read_text()
          )
          g = payload["governance"]
          assert g["date_level_core_nontrade_oracle_used"] is False
          assert g["wait_release_is_clock_and_core_state_causal"] is True
          assert g["secondary_fill_before_authorization_allowed"] is False
          assert g["scout_fill_before_authorization_allowed"] is False
          assert g["post_outcome_field_used_for_entry"] is False
          assert g["consumed_evidence_only"] is True
          assert g["opens_new_holdout"] is False
          assert payload["capital_policy"][
              "one_selected_position_per_market_day"
          ] is True
          PY

      - name: Bind result
        run: |
          set -euo pipefail
          echo "$GITHUB_SHA" > result/git-sha.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd result && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-causal-density-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-nas100-causal-density-*-${{ github.sha }}
          path: input
          merge-multiple: true

      - name: Aggregate causal density objective
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from pathlib import Path

          folds=[]
          for path in sorted(Path("input").glob("causal-density-*.json")):
              payload=json.loads(path.read_text())
              folds.append({
                  "file": path.name,
                  "variants": payload["variants"],
              })
          assert len(folds)==3,folds

          names=(
              "WAIT_NONE_B060",
              "WAIT_1025_B060",
              "WAIT_1020_B060",
              "WAIT_1020_B075",
              "WAIT_1015_B075",
              "WAIT_1010_B075",
              "WAIT_1015_B090",
          )
          variants={}
          for name in names:
              rows=[]
              for fold in folds:
                  item=fold["variants"][name]
                  rows.append({
                      "file":fold["file"],
                      "trade_count":item["trade_count"],
                      "tier_counts":item["tier_counts"],
                      "metrics":item["capital_weighted_metrics"],
                      "mc":item["monte_carlo"],
                      "gates":item["development_gates"],
                      "passes":item["passes_development_gates"],
                  })
              variants[name]={
                  "folds":rows,
                  "r5_density_at_least_300": any(
                      "r5" in row["file"] and row["trade_count"] >= 300
                      for row in rows
                  ),
                  "all_folds_pf_ge_2": all(
                      float(row["metrics"]["profit_factor"]) >= 2.0
                      for row in rows
                  ),
                  "all_folds_dd_le_10": all(
                      float(row["metrics"]["max_drawdown_r"]) <= 10.0
                      for row in rows
                  ),
                  "all_folds_mc_p95_dd_le_15": all(
                      float(row["mc"]["p95_max_drawdown_r"]) <= 15.0
                      for row in rows
                  ),
              }

          report={
              "schema":"qore.vt31.nas100.causal_hybrid_density.aggregate.v2",
              "variants":variants,
              "target":{
                  "r5_raw_trades":"approximately-300-to-350",
                  "capital_weighted_profit_factor_floor":"2.0",
                  "observed_drawdown_ceiling_r":"10",
                  "mc_p95_drawdown_ceiling_r":"15",
              },
              "policy_promoted":False,
              "opens_new_holdout":False,
              "live_authorized":False,
              "production_authorized":False,
          }
          Path("result/causal-density-aggregate.json").write_text(
              json.dumps(report,sort_keys=True,indent=2)+"\n"
          )
          print(json.dumps(report,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-causal-density-aggregate-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
