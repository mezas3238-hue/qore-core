name: QORE VT31 Comparator009 Final Preholdout Metrics V1

on:
  push:
    branches:
      - agent/vt31-edge-position-cert-b-001
    paths:
      - scripts/vt31_nas100_comp009_final_preholdout_metric_pack_v1.py
      - .github/workflows/vt31-comp009-final-preholdout-metrics-v1.yml
      - docs/research/VT31_ARCH2_FINAL_PREHOLDOUT_METRIC_CONVENTIONS_001.md
      - docs/research/VT31_ARCH2_INTEGRATED_RESEARCH_COMPARATOR_009.md
      - src/qore/infrastructure/traders/vt31_nas100_reasoning_engine.py
      - src/qore/infrastructure/traders/vt31_nas100_comp008_policy.py
      - scripts/vt31_nas100_breaker_mixed_weak_efficiency_adverse_exit_v1.py
      - scripts/vt31_nas100_bullish_h1_mid_confirmation_conflict_admission_v1.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  partition:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"

    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Static gate
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/vt31_nas100_comp009_final_preholdout_metric_pack_v1.py
          ruff check \
            scripts/vt31_nas100_comp009_final_preholdout_metric_pack_v1.py

      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"

      - name: Build partition metric pack
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python \
            scripts/vt31_nas100_comp009_final_preholdout_metric_pack_v1.py \
            partition "input/${EVIDENCE_PATH}" \
            --partition "${PARTITION}" \
            --output "result/${PARTITION}.json" \
            | tee "result/${PARTITION}-summary.json"

      - name: Governance gate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          partition=os.environ["PARTITION"]
          p=json.loads(Path(f"result/{partition}.json").read_text())
          assert p["comparator_id"] == (
              "VT31_AB_COMP009_MAX_INTELLIGENCE_COMPOSED_SURVIVOR"
          )
          assert p["gates"]["development_binding_exact"] is True
          g=p["governance"]
          assert g["fresh_holdout_opened"] is False
          assert g["position_sizing_used"] is False
          assert g["leverage_used"] is False
          assert g["compounding_used"] is False
          assert g["portfolio_weighting_used"] is False
          assert g["capital_weighting_used"] is False
          assert g["candidate_certified"] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-comp009-preholdout-${{ matrix.partition }}-${{ github.sha }}
          path: result/${{ matrix.partition }}.json
          retention-days: 90

  aggregate:
    needs: partition
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-comp009-preholdout-*-${{ github.sha }}
          path: input
          merge-multiple: true

      - name: Aggregate frozen metric pack
        run: |
          set -euo pipefail
          mkdir -p result
          PYTHONPATH=scripts python \
            scripts/vt31_nas100_comp009_final_preholdout_metric_pack_v1.py \
            aggregate \
            --r5 input/r5.json \
            --r6 input/r6.json \
            --r8 input/r8.json \
            --consumed input/consumed.json \
            --output result/aggregate.json \
            | tee result/summary.json

      - name: Governance and frozen-convention gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(Path("result/aggregate.json").read_text())
          assert p["comparator_id"] == (
              "VT31_AB_COMP009_MAX_INTELLIGENCE_COMPOSED_SURVIVOR"
          )
          assert p["metric_convention"]["baseline_friction_r_per_trade"] == "0.05"
          assert p["metric_convention"]["annualization"] == "sqrt(252)"
          assert p["gates"]["no_signal_overlap_across_folds"] is True
          assert p["gates"]["no_eligible_session_overlap_across_folds"] is True
          g=p["governance"]
          assert g["fresh_holdout_opened"] is False
          assert g["further_discretionary_optimization_authorized"] is False
          assert g["metric_retuning_after_holdout_authorized"] is False
          assert g["candidate_certified"] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-comp009-final-preholdout-metrics-${{ github.sha }}
          path: result/
          retention-days: 90
