name: VT08 CRT Tri-Source V3 Third Candle (Development Only)

on:
  push:
    branches:
      - agent/vt08-crt-pure-source-identity-001
    paths:
      - '.github/workflows/vt08-crt-three-source-v3-third-candle.yml'
      - 'src/qore/infrastructure/trader_lab/vt08_crt_three_source_v3_confirmed_h4_census.py'
      - 'tests/infrastructure/trader_lab/test_vt08_crt_three_source_v3_confirmed_h4_census.py'
      - 'src/qore/infrastructure/trader_lab/vt08_crt_three_source_v3_price_lifecycle.py'
      - 'tests/infrastructure/trader_lab/test_vt08_crt_three_source_v3_price_lifecycle.py'
      - 'src/qore/infrastructure/trader_lab/vt08_crt_three_source_v3_gm3_cognitive_replay.py'
      - 'tests/infrastructure/trader_lab/test_vt08_crt_three_source_v3_gm3_cognitive_replay.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vt08-crt-three-source-v3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff / Mypy / Pytest V3 causal contract (no economics)
        shell: bash
        run: |
          set -euo pipefail
          ruff check src/qore/infrastructure/trader_lab/vt08_crt_three_source_v3_gm3_cognitive_replay.py tests/infrastructure/trader_lab/test_vt08_crt_three_source_v3_gm3_cognitive_replay.py src/qore/infrastructure/trader_lab/vt08_crt_three_source_v3_price_lifecycle.py tests/infrastructure/trader_lab/test_vt08_crt_three_source_v3_price_lifecycle.py src/qore/infrastructure/trader_lab/vt08_crt_three_source_v3_confirmed_h4_census.py tests/infrastructure/trader_lab/test_vt08_crt_three_source_v3_confirmed_h4_census.py
          mypy src/qore/infrastructure/trader_lab/vt08_crt_three_source_v3_gm3_cognitive_replay.py src/qore/infrastructure/trader_lab/vt08_crt_three_source_v3_price_lifecycle.py src/qore/infrastructure/trader_lab/vt08_crt_three_source_v3_confirmed_h4_census.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_vt08_crt_three_source_v3_gm3_cognitive_replay.py tests/infrastructure/trader_lab/test_vt08_crt_three_source_v3_price_lifecycle.py tests/infrastructure/trader_lab/test_vt08_crt_three_source_v3_confirmed_h4_census.py

  real-original-atlas:
    needs: contract-quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        market: [AUDUSD, USDJPY]
    env:
      QORE_MARKET: ${{ matrix.market }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Recover original immutable Atlas M5 without broker credentials
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-${{ matrix.market }}-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          run-id: '35166210458'
          github-token: ${{ github.token }}
          path: original-native-m5
      - name: Run preregistered V3 source/cognitive input census on all H4 parents
        shell: bash
        run: |
          set -euo pipefail
          test -s original-native-m5/git-sha.txt
          test -s original-native-m5/MANIFEST_SHA256SUMS.txt
          test -d original-native-m5/RAW_M5_LEDGER
          mkdir -p "v3-causal/$QORE_MARKET"
          python -m qore.infrastructure.trader_lab.vt08_crt_three_source_v3_confirmed_h4_census \
            "$QORE_MARKET" original-native-m5 "v3-causal/$QORE_MARKET" \
            | tee "v3-causal/$QORE_MARKET/stdout-summary.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("v3-causal")/os.environ["QORE_MARKET"]
          m=json.loads((p/"three-source-v3-third-candle-summary.json").read_text())
          rows=[json.loads(x) for x in (p/"three-source-v3-third-candle-ledger.jsonl").read_text().splitlines() if x]
          assert m["complete_h4_c1_c2_contexts"]==len(rows) and len(rows)>0
          assert sum(m["state_counts"].values())==len(rows)
          assert m["sizing_used"] is False and m["conceptual_only_no_pnl"] is True
          assert m["GLOBAL_CERTIFIED"] is False and m["not_fresh_holdout"] is True
          assert all(r["not_a_trade"] and r["no_sizing_or_capital_authority"] for r in rows)
          assert len({r["source_event_id"] for r in rows})==len(rows)
          assert all(
             (r["decision_clock_utc"] is not None) ==
             (r["conceptual_state"]=="CONCEPTUAL_CANDIDATE_V3")
             for r in rows
          )
          PY
          printf '%s\n' "$GITHUB_SHA" > "v3-causal/$QORE_MARKET/git-sha.txt"
          (cd "v3-causal/$QORE_MARKET"; sha256sum three-source-v3-third-candle-summary.json three-source-v3-third-candle-ledger.jsonl git-sha.txt > SHA256SUMS.txt)
      - name: Price-only V3 preregistered lifecycle, frozen source IDs, no fills
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "v3-lifecycle/$QORE_MARKET"
          python -m qore.infrastructure.trader_lab.vt08_crt_three_source_v3_price_lifecycle \
            "$QORE_MARKET" original-native-m5 "v3-lifecycle/$QORE_MARKET" \
            | tee "v3-lifecycle/$QORE_MARKET/stdout-summary.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          s=Path("v3-causal")/os.environ["QORE_MARKET"]
          p=Path("v3-lifecycle")/os.environ["QORE_MARKET"]
          census=json.loads((s/"three-source-v3-third-candle-summary.json").read_text())
          m=json.loads((p/"v3-price-lifecycle-summary.json").read_text())
          assert m["v3_source_candidates"]==census["state_counts"].get("CONCEPTUAL_CANDIDATE_V3",0)
          assert m["v3_source_candidates"]==m["v3_price_path_reconciled"]
          assert m["no_PnL_or_sizing"] and m["not_fresh_OOS"]
          assert m["GLOBAL_CERTIFIED"] is False
          src=[json.loads(x) for x in (s/"three-source-v3-third-candle-ledger.jsonl").read_text().splitlines() if x]
          frozen={x["source_event_id"] for x in src if x["conceptual_state"]=="CONCEPTUAL_CANDIDATE_V3"}
          path=[json.loads(x) for x in (p/"v3-price-lifecycle-ledger.jsonl").read_text().splitlines() if x]
          assert frozen=={x["source_event_id"] for x in path}
          assert all(x["not_a_trade"] and x["no_PnL_or_sizing"] for x in path)
          PY
          printf '%s\n' "$GITHUB_SHA" > "v3-lifecycle/$QORE_MARKET/git-sha.txt"
          (cd "v3-lifecycle/$QORE_MARKET"; sha256sum v3-price-lifecycle-summary.json v3-price-lifecycle-ledger.jsonl git-sha.txt > SHA256SUMS.txt)
      - name: Publish V3 source-separated causal price-only path checks
        uses: actions/upload-artifact@v4
        with:
          name: vt08-three-source-v3-price-path-dev-only-${{ matrix.market }}-${{ github.sha }}
          path: v3-lifecycle/${{ matrix.market }}
          retention-days: 90
          if-no-files-found: error
      - name: Cognition G-M3 positive third-candle events, source-open ABSTAIN authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "v3-cognition/$QORE_MARKET"
          python -m qore.infrastructure.trader_lab.vt08_crt_three_source_v3_gm3_cognitive_replay \
            "$QORE_MARKET" original-native-m5 "v3-cognition/$QORE_MARKET" \
            | tee "v3-cognition/$QORE_MARKET/stdout-summary.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("v3-cognition")/os.environ["QORE_MARKET"]
          src=Path("v3-causal")/os.environ["QORE_MARKET"]
          m=json.loads((p/"v3-gm3-cognitive-summary.json").read_text())
          s=json.loads((src/"three-source-v3-third-candle-summary.json").read_text())
          assert m["V3_conceptual_sources"]==s["state_counts"].get("CONCEPTUAL_CANDIDATE_V3",0)
          assert m["G_M3_positives_recognized"]==m["V3_conceptual_sources"]
          assert m["cognitive_actions"]=={"ABSTAIN":m["V3_conceptual_sources"]}
          assert m["all_causal_confirmations_recognized"]
          assert m["no_sizing"] and m["no_PnL_or_fills"]
          assert not m["G_M3_PASS"] and not m["GLOBAL_CERTIFIED"]
          rows=[json.loads(x) for x in (p/"v3-gm3-cognitive-ledger.jsonl").read_text().splitlines() if x]
          assert all(r["causal_confirmation_recognized"] and r["cognitive_action"]=="ABSTAIN" for r in rows)
          PY
          printf '%s\n' "$GITHUB_SHA" > "v3-cognition/$QORE_MARKET/git-sha.txt"
          (cd "v3-cognition/$QORE_MARKET"; sha256sum v3-gm3-cognitive-summary.json v3-gm3-cognitive-ledger.jsonl git-sha.txt > SHA256SUMS.txt)
      - name: Publish G-M3 cognitive positive recognition, fail-closed no broker authority
        uses: actions/upload-artifact@v4
        with:
          name: vt08-three-source-v3-gm3-cognitive-dev-only-${{ matrix.market }}-${{ github.sha }}
          path: v3-cognition/${{ matrix.market }}
          retention-days: 90
          if-no-files-found: error
      - name: Publish research-only V3 pre-outcome artifact (no future prices, no fills)
        uses: actions/upload-artifact@v4
        with:
          name: vt08-three-source-v3-third-candle-dev-only-${{ matrix.market }}-${{ github.sha }}
          path: v3-causal/${{ matrix.market }}
          retention-days: 90
          if-no-files-found: error
