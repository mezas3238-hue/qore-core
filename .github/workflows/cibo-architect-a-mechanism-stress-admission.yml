name: QORE CIBO Architect A Mechanism Stress Admission

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-architect-a-mechanism-stress-admission.yml'
      - 'src/qore/infrastructure/cibo_arch_a_mechanism_stress_gate.py'
      - 'tests/infrastructure/test_cibo_arch_a_mechanism_stress_gate.py'
      - 'docs/research/CIBO-ARCH-A-MECHANISM-ADVERSARIAL-STRESS-ADMISSION-V1.md'
      - 'docs/research/CIBO-MASTER-OPEN-WORK-LEDGER-V1.json'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  mechanism-stress-admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Mechanism-specific non-compensatory stress admission
        run: |
          ruff check \
            src/qore/infrastructure/cibo_arch_a_mechanism_stress_gate.py \
            tests/infrastructure/test_cibo_arch_a_mechanism_stress_gate.py
          mypy src/qore/infrastructure/cibo_arch_a_mechanism_stress_gate.py
          python -m py_compile \
            src/qore/infrastructure/cibo_arch_a_mechanism_stress_gate.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_arch_a_mechanism_stress_gate.py
