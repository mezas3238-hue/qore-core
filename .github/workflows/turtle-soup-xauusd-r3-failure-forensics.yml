name: QORE Turtle Soup XAUUSD R3 Failure Forensics

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-xauusd-r3-forensics-001
    paths:
      - '.github/workflows/turtle-soup-xauusd-r3-failure-forensics.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r3_forensics.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r3_forensics.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-turtle-soup-xauusd-r3-forensics-${{ github.ref }}
  cancel-in-progress: false

env:
  R3_RUN_ID: '35256772043'
  R3_ARTIFACT: 'qore-turtle-soup-xauusd-r3-cibo-journey-binding-repair-39a5fb952ad3189656faedb57f854528e2fa29c8'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check --ignore E501 \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r3_forensics.py \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r3_forensics.py
      - name: Mypy focused gate
        run: mypy --disable-error-code name-defined --disable-error-code var-annotated src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r3_forensics.py
      - name: Focused tests
        run: pytest -q --no-cov tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r3_forensics.py

  forensics:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download immutable official R3 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.R3_ARTIFACT }}
          path: r3-official
          github-token: ${{ github.token }}
          run-id: ${{ env.R3_RUN_ID }}
      - name: Verify official R3 provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('r3-official/report.json').read_text())
          assert p['identity'] == 'TURTLE_SOUP_XAUUSD_R3_CIBO_JOURNEY_ROUTER'
          assert p['executed_trades'] == 5885
          assert p['governance']['fresh_holdout'] is False
          assert p['governance']['live_authorized'] is False
          PY
      - name: Execute immutable post-result forensics
        run: |
          mkdir -p forensic-output
          python -m qore.infrastructure.trader_lab.turtle_soup_xauusd_r3_forensics \
            r3-official forensic-output > forensic-output/stdout.json
          printf '%s\n' "$GITHUB_SHA" > forensic-output/git-sha.txt
      - name: Enforce diagnostic-only governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('forensic-output/forensics.json').read_text())
          assert p['identity'] == 'TURTLE_SOUP_XAUUSD_R3_FAILURE_FORENSICS_V1'
          assert p['governance']['diagnostic_only'] is True
          assert p['governance']['promote_filters_from_this_report'] is False
          assert p['governance']['fresh_holdout_consumed'] is False
          assert p['governance']['automatic_promotion_allowed'] is False
          assert p['governance']['live_authorized'] is False
          PY
      - name: Hash immutable forensic result
        run: |
          cd forensic-output
          sha256sum forensics.json stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-xauusd-r3-failure-forensics-${{ github.sha }}
          path: forensic-output
          if-no-files-found: error
          retention-days: 90
