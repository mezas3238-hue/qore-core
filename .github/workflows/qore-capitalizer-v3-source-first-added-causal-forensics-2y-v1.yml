name: QORE Capitalizer V3 SOURCE_FIRST Added Causal Forensics 2Y V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-v3-source-first-added-causal-forensics-2y-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v3_source_first_added_causal_forensics_2y_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v3_source_first_added_causal_forensics_2y_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-v3-source-first-added-causal-forensics-2y-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  V3_RUN_ID: '35806006221'
  V3_SHA: '7f9b9efc82376bb5edbea42379a0a3cf3e72a94a'
  SOURCE_FIRST_RUN_ID: '35814916032'
  SOURCE_FIRST_SHA: '66887a9b4ca0cc3c3920f94b1042218652c30c9b'
  SEMANTICS_RUN_ID: '35813315103'
  SEMANTICS_SHA: '722b6abe4fc570fc47cbfb67ff64a6a93c1fb160'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_v3_source_first_added_causal_forensics_2y_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_v3_source_first_added_causal_forensics_2y_v1.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_v3_source_first_added_causal_forensics_2y_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_v3_source_first_added_causal_forensics_2y_v1.py

  forensics:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download frozen V3 market ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v3-frozen-replay-2y-v1-*-${{ env.V3_SHA }}
          path: v3-source
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.V3_RUN_ID }}
      - name: Download frozen SOURCE_FIRST market ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v3-source-first-cisd-2y-v1-*-${{ env.SOURCE_FIRST_SHA }}
          path: source-first-source
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_FIRST_RUN_ID }}
      - name: Download frozen boundary-semantics ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v3-cisd-boundary-semantics-census-2y-v1-*-${{ env.SEMANTICS_SHA }}
          path: semantics-source
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.SEMANTICS_RUN_ID }}
      - name: Build added-trade causal atlas
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v3_source_first_added_causal_forensics_2y_v1 \
            v3-source source-first-source semantics-source report-output
      - name: Enforce causal controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "report-output/"
                  "capitalizer-v3-source-first-added-causal-forensics-2y-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_V3_SOURCE_FIRST_ADDED_CAUSAL_FORENSICS_2Y_V1"
          )
          assert report["source_first_max3_trades"] == 1118
          assert report["added_selected_trades"] == 719
          assert report["metadata_rows_joined"] == 719
          assert report["max_drawdown_episode"]["trades_in_episode"] == 148
          assert report["max_drawdown_episode"]["added_trades_in_episode"] == 87
          assert report["timing_bands_predeclared"] is True
          assert report["decision_time_features_only"] is True
          assert report["post_outcome_metrics_descriptive_only"] is True
          assert report["outcome_used_for_admission"] is False
          assert report["rule_derived"] is False
          assert report["strategy_mutated"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["economic_candidate"] is False
          assert report["fresh_holdout_claimed"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v3-source-first-added-causal-forensics-2y-v1-${{ github.sha }}
          path: report-output
          if-no-files-found: error
          retention-days: 90
