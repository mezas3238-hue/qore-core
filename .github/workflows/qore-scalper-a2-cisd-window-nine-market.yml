name: QORE Scalper A2 CISD Full-vs-Prefix Native 9Market (Research)

on:
  push:
    branches:
      - agent/scalper-architect-b-methodology-20261010
    paths:
      - '.github/workflows/qore-scalper-a2-cisd-window-nine-market.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_a2_cisd_prefix_causality_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_scalper_a2_cisd_prefix_causality_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-scalper-a2-cisd-prefix-${{ github.ref }}
  cancel-in-progress: true

env:
  CONTROL_RUN: '38053946695'
  CONTROL_SHA: 'e356e7a52541e99533b25ecfef0ab9c4e9ce03c0'
  SENSOR_RUN: '38071138991'
  SENSOR_SHA: '74f4d9c89cdaaefd220a9a45ba98c2a0376be3d7'
  NATIVE_RUN: '35548099334'
  NATIVE_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Strict source-ID causality research contracts
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_scalper_a2_cisd_prefix_causality_v1.py tests/infrastructure/trader_lab/test_capitalizer_scalper_a2_cisd_prefix_causality_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_scalper_a2_cisd_prefix_causality_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_scalper_a2_cisd_prefix_causality_v1.py

  market:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol: [USDJPY, AUDJPY, AUDUSD, GBPJPY, EURUSD, GBPUSD, XAUUSD, USDCAD, NAS100]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Original frozen V49 source opportunities
        uses: actions/download-artifact@v4
        with:
          name: scalper-a2-v49-control-${{ matrix.symbol }}-${{ env.CONTROL_SHA }}
          path: original
          github-token: ${{ github.token }}
          run-id: ${{ env.CONTROL_RUN }}
      - name: Original A2 shadow sensors
        uses: actions/download-artifact@v4
        with:
          name: scalper-a2-entry-sensor-${{ matrix.symbol }}-${{ env.SENSOR_SHA }}
          path: sensor
          github-token: ${{ github.token }}
          run-id: ${{ env.SENSOR_RUN }}
      - name: Real provider-native M1
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.NATIVE_SHA }}
          path: native
          github-token: ${{ github.token }}
          run-id: ${{ env.NATIVE_RUN }}
      - name: Native manifest cannot be synthetic, interpolated, or contradictory
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path("native/m1-clone-manifest.json").read_text())
          assert d["canonical_symbol"]==os.environ["SYMBOL"]
          assert d["provider_native_m1"] is True
          assert d["synthetic_m1"] is False and d["interpolated_m1"] is False
          assert d["contradictory_m1"] == 0 and d["read_only"] is True
          PY
      - name: Reconstruct complete source M15 window versus original-close prefix for every ID
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_a2_cisd_prefix_causality_v1 market original sensor native market-output
      - name: No admission change, no author claim
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path("market-output/scalper-cisd-prefix-market.json").read_text())
          assert r["symbol"]==os.environ["SYMBOL"]
          assert sum(r["classified"].values())==r["sources"] and r["sources"]>0
          assert r["changes_admission"]==0 and r["trade_reexecuted"]==0
          assert r["uses_future_outcomes_to_admit"] is False
          assert r["author_certified"] is False
          print("CISD FULL-PREFIX FORENSIC (NO ORDER)",r)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-cisd-prefix-${{ matrix.symbol }}-${{ github.sha }}
          path: market-output/
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: scalper-a2-cisd-prefix-*-${{ github.sha }}
          path: market-inputs
          merge-multiple: false
      - name: Aggregate 2876 exact source IDs, 9 markets, per-ID classifications
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_a2_cisd_prefix_causality_v1 matrix market-inputs nine-market-output
      - name: Exact 2876 original IDs, zero outcome-fitted live decisions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("nine-market-output/scalper-cisd-prefix-nine-market.json").read_text())
          assert r["markets"]==9 and r["sources"]==2876
          assert sum(r["diagnosis_counts"].values())==2876
          assert r["outcome_free"] is True and r["changes_admission"]==0
          assert r["trading_enabled"] is False and r["paper_pf"] is None
          print("CISD WINDOW CAUSAL DIAGNOSIS",r["diagnosis_counts"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-cisd-prefix-nine-market-${{ github.sha }}
          path: nine-market-output/
          retention-days: 90
          if-no-files-found: error
