name: QORE Capitalizer V3 SOURCE_FIRST FVG Confirmation Lag Atlas 2Y V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-v3-source-first-fvg-confirmation-lag-atlas-2y-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v3_source_first_fvg_confirmation_lag_atlas_2y_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v3_source_first_fvg_confirmation_lag_atlas_2y_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-v3-source-first-fvg-confirmation-lag-atlas-2y-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  FUNNEL_RUN_ID: '35847723760'
  FUNNEL_SHA: 'e099f14092c8ab547137b6a3e59a3a1df9344b9e'
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_v3_source_first_fvg_confirmation_lag_atlas_2y_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_v3_source_first_fvg_confirmation_lag_atlas_2y_v1.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_v3_source_first_fvg_confirmation_lag_atlas_2y_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_v3_source_first_fvg_confirmation_lag_atlas_2y_v1.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {symbol: USDJPY}
          - {symbol: AUDJPY}
          - {symbol: AUDUSD}
          - {symbol: GBPJPY}
          - {symbol: EURUSD}
          - {symbol: GBPUSD}
          - {symbol: XAUUSD}
          - {symbol: USDCAD}
          - {symbol: NAS100}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download frozen funnel ledger
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-v3-source-first-wait5-funnel-atlas-2y-v1-${{ matrix.symbol }}-${{ env.FUNNEL_SHA }}
          path: funnel-source
          github-token: ${{ github.token }}
          run-id: ${{ env.FUNNEL_RUN_ID }}
      - name: Download immutable native-M1 clone
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Run FVG confirmation-lag atlas
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v3_source_first_fvg_confirmation_lag_atlas_2y_v1 \
            market funnel-source m1-source atlas-output
      - name: Enforce market controls
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"]
          report = json.loads(
              (
                  Path("atlas-output")
                  / f"capitalizer-{symbol.lower()}-v3-source-first-fvg-confirmation-lag-atlas-2y-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_V3_SOURCE_FIRST_FVG_CONFIRMATION_LAG_ATLAS_2Y_V1"
          )
          assert report["symbol"] == symbol
          assert report["fvg_missing_rows"] > 0
          assert report["causal_ob_present"] == report["fvg_missing_rows"]
          assert report["max_confirmation_lag_minutes"] == 2
          assert report["same_original_m3_displacement_required"] is True
          assert report["same_original_causal_ob_required"] is True
          assert report["outcome_fields_read"] is False
          assert report["outcome_used_for_classification"] is False
          assert report["strategy_mutated"] is False
          assert report["diagnostic_only"] is True
          assert report["economic_candidate"] is False
          assert report["rule_promotion_allowed"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v3-source-first-fvg-confirmation-lag-atlas-2y-v1-${{ matrix.symbol }}-${{ github.sha }}
          path: atlas-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v3-source-first-fvg-confirmation-lag-atlas-2y-v1-*-${{ github.sha }}
          path: atlas-input
          merge-multiple: false
      - name: Build nine-market confirmation-lag matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v3_source_first_fvg_confirmation_lag_atlas_2y_v1 \
            matrix atlas-input matrix-output
      - name: Enforce aggregate controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "matrix-output/"
                  "capitalizer-nine-market-v3-source-first-fvg-confirmation-lag-atlas-2y-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_NINE_MARKET_V3_SOURCE_FIRST_"
              "FVG_CONFIRMATION_LAG_ATLAS_2Y_V1"
          )
          assert report["market_count"] == 9
          assert report["fvg_missing_rows"] == 322
          assert report["fvg_missing_control_reproduced"] is True
          assert report["causal_ob_present"] == 322
          assert report["max_confirmation_lag_minutes"] == 2
          assert report["same_original_m3_displacement_required"] is True
          assert report["same_original_causal_ob_required"] is True
          assert report["outcome_fields_read"] is False
          assert report["outcome_used_for_classification"] is False
          assert report["strategy_mutated"] is False
          assert report["diagnostic_only"] is True
          assert report["economic_candidate"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["fresh_holdout_claimed"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-nine-market-v3-source-first-fvg-confirmation-lag-atlas-2y-v1-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
