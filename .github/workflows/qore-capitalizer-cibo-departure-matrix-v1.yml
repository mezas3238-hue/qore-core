name: QORE Capitalizer 9-Market CIBO Departure Matrix V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-cibo-departure-matrix-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_cibo_alignment_forensics.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_cibo_departure_hypothesis.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_cibo_alignment_matrix.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_cibo_alignment_forensics.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_cibo_alignment_matrix.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-cibo-departure-matrix-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_M5_RUN_ID: '35166210458'
  SOURCE_JOURNEY_RUN_ID: '35175979474'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check --ignore E501 \
            src/qore/infrastructure/trader_lab/capitalizer_cibo_alignment_forensics.py \
            src/qore/infrastructure/trader_lab/capitalizer_cibo_departure_hypothesis.py \
            src/qore/infrastructure/trader_lab/capitalizer_cibo_alignment_matrix.py \
            tests/infrastructure/trader_lab/test_capitalizer_cibo_alignment_forensics.py \
            tests/infrastructure/trader_lab/test_capitalizer_cibo_alignment_matrix.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_cibo_alignment_forensics.py \
            src/qore/infrastructure/trader_lab/capitalizer_cibo_departure_hypothesis.py \
            src/qore/infrastructure/trader_lab/capitalizer_cibo_alignment_matrix.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_cibo_alignment_forensics.py \
            tests/infrastructure/trader_lab/test_capitalizer_cibo_alignment_matrix.py

  scan:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - symbol: USDJPY
            m5: qore-cibo-market-atlas-10y-windowed-USDJPY-ab782b8e9f890f86a2b6500070f0556b4b685e3d
            journey: qore-cibo-market-journey-USDJPY-9cc0f17a2f30846d61b242132547f39391909656
          - symbol: AUDJPY
            m5: qore-cibo-market-atlas-10y-windowed-AUDJPY-ab782b8e9f890f86a2b6500070f0556b4b685e3d
            journey: qore-cibo-market-journey-AUDJPY-9cc0f17a2f30846d61b242132547f39391909656
          - symbol: AUDUSD
            m5: qore-cibo-market-atlas-10y-windowed-AUDUSD-ab782b8e9f890f86a2b6500070f0556b4b685e3d
            journey: qore-cibo-market-journey-AUDUSD-9cc0f17a2f30846d61b242132547f39391909656
          - symbol: GBPJPY
            m5: qore-cibo-market-atlas-10y-windowed-GBPJPY-ab782b8e9f890f86a2b6500070f0556b4b685e3d
            journey: qore-cibo-market-journey-GBPJPY-9cc0f17a2f30846d61b242132547f39391909656
          - symbol: EURUSD
            m5: qore-cibo-market-atlas-10y-windowed-EURUSD-ab782b8e9f890f86a2b6500070f0556b4b685e3d
            journey: qore-cibo-market-journey-EURUSD-9cc0f17a2f30846d61b242132547f39391909656
          - symbol: GBPUSD
            m5: qore-cibo-market-atlas-10y-windowed-GBPUSD-ab782b8e9f890f86a2b6500070f0556b4b685e3d
            journey: qore-cibo-market-journey-GBPUSD-9cc0f17a2f30846d61b242132547f39391909656
          - symbol: XAUUSD
            m5: qore-cibo-market-atlas-10y-windowed-XAUUSD-ab782b8e9f890f86a2b6500070f0556b4b685e3d
            journey: qore-cibo-market-journey-XAUUSD-9cc0f17a2f30846d61b242132547f39391909656
          - symbol: USDCAD
            m5: qore-cibo-market-atlas-10y-windowed-USDCAD-ab782b8e9f890f86a2b6500070f0556b4b685e3d
            journey: qore-cibo-market-journey-USDCAD-9cc0f17a2f30846d61b242132547f39391909656
          - symbol: NAS100
            m5: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
            journey: qore-cibo-market-journey-NAS100-9cc0f17a2f30846d61b242132547f39391909656
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download immutable consumed M5
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.m5 }}
          path: m5-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M5_RUN_ID }}
      - name: Download immutable consumed Journey
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.journey }}
          path: journey-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_JOURNEY_RUN_ID }}
      - name: Build exact alignment report
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cibo_alignment_forensics \
            m5-source journey-source cell-output
      - name: Upload immutable market cell
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-cibo-departure-cell-${{ matrix.symbol }}-${{ github.sha }}
          path: cell-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download all nine cells
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-cibo-departure-cell-*-${{ github.sha }}
          path: matrix-input
          merge-multiple: false
      - name: Build frozen departure matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cibo_alignment_matrix \
            matrix-input matrix-output
      - name: Enforce research governance and complete coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path(
                  'matrix-output/capitalizer-cibo-departure-alignment-matrix-v1.json'
              ).read_text()
          )
          assert result['identity'] == 'QORE_CAPITALIZER_CIBO_DEPARTURE_ALIGNMENT_MATRIX_V1'
          assert result['hypothesis_id'] == 'QORE_CAPITALIZER_HYPOTHESIS_CIBO_DEPARTURE_ALIGNMENT_V1'
          assert result['market_count'] == 9
          assert result['event_cell_count'] == 36
          assert result['complete_frozen_universe'] is True
          assert result['aligned_total_observations'] > 0
          assert result['evidence_status'] == 'CONSUMED_RESEARCH_EVIDENCE'
          assert result['economic_candidate'] is False
          assert result['rule_promotion_allowed'] is False
          assert result['fresh_holdout_claimed'] is False
          PY
      - name: Upload immutable 9-market matrix
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-cibo-departure-matrix-v1-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
