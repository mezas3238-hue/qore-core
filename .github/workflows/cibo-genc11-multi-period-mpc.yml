name: QORE CIBO GEN-C11 Robust Multi-Period Capital MPC

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-genc11-multi-period-mpc.yml'
      - 'src/qore/infrastructure/cibo_multi_period_capital_mpc.py'
      - 'tests/infrastructure/test_cibo_multi_period_capital_mpc.py'
      - 'docs/research/CIBO-GEN-C11-ROBUST-MULTI-PERIOD-MPC-V1.md'
      - 'docs/research/CIBO-MASTER-OPEN-WORK-LEDGER-V1.json'
  push:
    branches:
      - agent/cibo-capital-efficiency-sizing-lab-001
    paths:
      - '.github/workflows/cibo-genc11-multi-period-mpc.yml'
      - 'src/qore/infrastructure/cibo_multi_period_capital_mpc.py'
      - 'tests/infrastructure/test_cibo_multi_period_capital_mpc.py'
      - 'docs/research/CIBO-GEN-C11-ROBUST-MULTI-PERIOD-MPC-V1.md'
      - 'docs/research/CIBO-MASTER-OPEN-WORK-LEDGER-V1.json'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  genc11-robust-multi-period-mpc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: GEN-C11 quality and no-oracle invariants
        run: |
          ruff check \
            src/qore/infrastructure/cibo_multi_period_capital_mpc.py \
            tests/infrastructure/test_cibo_multi_period_capital_mpc.py
          mypy src/qore/infrastructure/cibo_multi_period_capital_mpc.py
          python -m py_compile \
            src/qore/infrastructure/cibo_multi_period_capital_mpc.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_multi_period_capital_mpc.py
