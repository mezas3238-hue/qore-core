name: QORE Capitalizer Source Candidate Assembly V47 S0

on:
  push:
    branches:
      - agent/capitalizer-source-candidate-assembly-v47-s0-001
    paths:
      - '.github/workflows/qore-capitalizer-source-candidate-assembly-v47-s0.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_canonical_source_candidate_assembly_v47_s0.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_canonical_source_context_binders_v47_s0.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_canonical_source_candidate_assembly_v47_s0.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_canonical_source_context_binders_v47_s0.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qore-capitalizer-source-candidate-assembly-v47-s0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_canonical_source_candidate_assembly_v47_s0.py \
            src/qore/infrastructure/trader_lab/capitalizer_canonical_source_context_binders_v47_s0.py \
            src/qore/infrastructure/trader_lab/capitalizer_canonical_source_context_binders_v47_s0.py \
            tests/infrastructure/trader_lab/test_capitalizer_canonical_source_candidate_assembly_v47_s0.py \
            tests/infrastructure/trader_lab/test_capitalizer_canonical_source_context_binders_v47_s0.py \
            tests/infrastructure/trader_lab/test_capitalizer_canonical_source_context_binders_v47_s0.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_canonical_source_candidate_assembly_v47_s0.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_canonical_source_candidate_assembly_v47_s0.py
      - name: Run frozen S0 readiness audit
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_canonical_source_candidate_assembly_v47_s0
      - name: Enforce S0 pre-economic governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(
              Path(
                  "audit-output/"
                  "capitalizer-canonical-source-candidate-assembly-v47-s0.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_CANONICAL_SOURCE_CANDIDATE_ASSEMBLY_V47_S0"
          )
          assert report["predeclaration_comment_id"] == 5889541472
          assert report["exact_provider_tick_fill_ready"] is True
          assert report["legacy_m1_open_backdating_allowed"] is False
          assert report["v41_30s_threshold_reused"] is False
          assert report["v41_features_used"] is False
          assert report["exogenous_cognitive_pass_isolation_only"] is True
          assert report["strategy_economics_calculated"] is False
          assert report["exit_simulation_run"] is False
          assert report["realized_r_read"] is False
          assert report["fresh_holdout_opened"] is False
          assert report["candidate_count"] == 0
          assert report["trader_certified"] is False
          assert report["next_phase"] in {
              "CANONICAL_SOURCE_CANDIDATE_ASSEMBLY_READY_FOR_ISOLATION_REPLAY",
              "CANONICAL_SOURCE_CANDIDATE_ASSEMBLY_GAPS_REMAIN",
          }
          print(json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-source-candidate-assembly-v47-s0-${{ github.sha }}
          path: audit-output
          if-no-files-found: error
          retention-days: 90
