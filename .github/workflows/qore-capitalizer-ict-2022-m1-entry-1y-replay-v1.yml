name: QORE Capitalizer ICT 2022 M1 Entry 1Y Replay V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-ict-2022-m1-entry-1y-replay-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_ict_2022_m1_entry_1y_replay_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_ict_2022_m1_entry_1y_replay_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-ict-2022-m1-entry-1y-replay-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  SOURCE_REPLAY_RUN_ID: '35528346941'
  SOURCE_REPLAY_SHA: 'e0338846170003fd7b346c98883f63257b6cdf45'
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_ict_2022_m1_entry_1y_replay_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_ict_2022_m1_entry_1y_replay_v1.py
      - name: Mypy
        run: |
          mypy src/qore/infrastructure/trader_lab/capitalizer_ict_2022_m1_entry_1y_replay_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_ict_2022_m1_entry_1y_replay_v1.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {symbol: USDJPY, session: ASIA}
          - {symbol: AUDJPY, session: ASIA}
          - {symbol: AUDUSD, session: ASIA}
          - {symbol: GBPJPY, session: ASIA}
          - {symbol: EURUSD, session: LONDON}
          - {symbol: GBPUSD, session: LONDON}
          - {symbol: XAUUSD, session: NEW_YORK}
          - {symbol: USDCAD, session: NEW_YORK}
          - {symbol: NAS100, session: NEW_YORK}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download frozen higher-level source candidates
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-three-session-replay-cell-${{ matrix.symbol }}-${{ env.SOURCE_REPLAY_SHA }}
          path: source-candidates
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_REPLAY_RUN_ID }}
      - name: Download immutable native-M1 clone
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Run ICT 2022 entry replay
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_ict_2022_m1_entry_1y_replay_v1 \
            market source-candidates m1-source replay-output
      - name: Enforce ICT research boundary
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
          EXPECTED_SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"]
          path = Path("replay-output") / (
              f"capitalizer-{symbol.lower()}-ict-2022-m1-entry-1y-replay-v1.json"
          )
          report = json.loads(path.read_text())
          assert report["identity"] == "QORE_CAPITALIZER_ICT_2022_M1_ENTRY_1Y_REPLAY_V1"
          assert report["entry_identity"] == "ICT_2022_RAID_MSS_DISPLACEMENT_FVG_FIRST_RETRACE"
          assert report["symbol"] == symbol
          assert report["session"] == os.environ["EXPECTED_SESSION"]
          assert report["window_start"] == "2025-09-17T00:00:00+00:00"
          assert report["window_end_exclusive"] == "2026-09-17T00:00:00+00:00"
          assert report["source_candidates_in_window"] > 0
          assert report["directional_raid_candidates"] > 0
          assert report["ict_m1_entries"] > 0
          assert report["entry_changed"] is True
          assert report["higher_level_setup_changed"] is False
          assert report["stop_changed"] is False
          assert report["target_changed"] is False
          assert report["lifecycle_changed"] is False
          assert report["m1_order_block_required"] is False
          assert report["synthetic_m1_used"] is False
          assert report["interpolated_m1_used"] is False
          assert report["fresh_holdout_claimed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["economic_candidate"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-ict-2022-m1-entry-1y-${{ matrix.symbol }}-${{ github.sha }}
          path: replay-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-ict-2022-m1-entry-1y-*-${{ github.sha }}
          path: replay-input
          merge-multiple: false
      - name: Build nine-market ICT matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_ict_2022_m1_entry_1y_replay_v1 \
            matrix replay-input matrix-output
      - name: Enforce nine-market boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "matrix-output/capitalizer-nine-market-ict-2022-m1-entry-1y-matrix-v1.json"
              ).read_text()
          )
          assert report["identity"] == "QORE_CAPITALIZER_NINE_MARKET_ICT_2022_M1_ENTRY_1Y_MATRIX_V1"
          assert report["market_count"] == 9
          assert report["window_start"] == "2025-09-17T00:00:00+00:00"
          assert report["window_end_exclusive"] == "2026-09-17T00:00:00+00:00"
          assert report["directional_raid_candidates"] > 0
          assert report["ict_m1_entries"] > 0
          assert report["entry_changed"] is True
          assert report["stop_changed"] is False
          assert report["target_changed"] is False
          assert report["m1_order_block_required"] is False
          assert report["fresh_holdout_claimed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["economic_candidate"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-nine-market-ict-2022-m1-entry-1y-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
