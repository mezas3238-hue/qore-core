name: QORE CIBO Phase22 VT31 NAS100 Exact Parity

on:
  push:
    branches:
      - agent/cibo-certification-architect-b-integration-001
    paths:
      - '.github/workflows/cibo-phase22-vt31-nas100-parity.yml'
      - 'src/qore/infrastructure/cibo_phase22_parity_lane_evidence.py'
      - 'scripts/cibo_phase18_vt31_v4_geometry_patch.py'
      - 'scripts/cibo_phase18_vt31_rearm_geometry_patch.py'
      - 'scripts/cibo_phase18_vt31_bind.py'
      - 'tests/infrastructure/test_cibo_phase22_parity_lane_evidence.py'
  pull_request:
    paths:
      - '.github/workflows/cibo-phase22-vt31-nas100-parity.yml'
      - 'src/qore/infrastructure/cibo_phase22_parity_lane_evidence.py'
      - 'scripts/cibo_phase18_vt31_v4_geometry_patch.py'
      - 'scripts/cibo_phase18_vt31_rearm_geometry_patch.py'
      - 'scripts/cibo_phase18_vt31_bind.py'
      - 'tests/infrastructure/test_cibo_phase22_parity_lane_evidence.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  GH_TOKEN: ${{ github.token }}
  VT31_SOURCE_SHA: 'cac38ed14f20e066536910145027426fd23f5939'

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}

      - name: Checkout immutable VT31 V4 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VT31_SOURCE_SHA }}
          path: vt31-code

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install -e '.[dev]'

      - name: Quality
        run: |
          ruff check \
            src/qore/infrastructure/cibo_phase22_parity_lane_evidence.py \
            scripts/cibo_phase18_vt31_v4_geometry_patch.py \
            scripts/cibo_phase18_vt31_rearm_geometry_patch.py \
            scripts/cibo_phase18_vt31_bind.py \
            tests/infrastructure/test_cibo_phase22_parity_lane_evidence.py
          mypy \
            src/qore/infrastructure/cibo_phase22_parity_lane_evidence.py \
            scripts/cibo_phase18_vt31_v4_geometry_patch.py \
            scripts/cibo_phase18_vt31_rearm_geometry_patch.py \
            scripts/cibo_phase18_vt31_bind.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_phase22_parity_lane_evidence.py

      - name: Verify immutable VT31 source
        run: |
          test "$(git -C vt31-code rev-parse HEAD)" = "$VT31_SOURCE_SHA"

      - name: Instrument immutable V4 for row serialization only
        run: |
          python scripts/cibo_phase18_vt31_v4_geometry_patch.py \
            vt31-code/scripts/vt31_nas100_structural_target_execution_binding_5y_v4.py \
            vt31-code/scripts/cibo_phase22_vt31_v4_replay.py
          python scripts/cibo_phase18_vt31_rearm_geometry_patch.py \
            vt31-code/scripts/vt31_nas100_r5_corrective_management_frontier_v1.py \
            vt31-code/scripts/vt31_nas100_r5_corrective_management_frontier_v1.py
          python -m py_compile \
            vt31-code/scripts/cibo_phase22_vt31_v4_replay.py \
            vt31-code/scripts/vt31_nas100_r5_corrective_management_frontier_v1.py

      - name: Recover immutable VT31 evidence
        run: |
          set -euo pipefail
          mkdir -p input/r8 input/r6 input/r5 authoritative phase22-output
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10402199719/zip" > r8.zip
          unzip -q r8.zip -d input/r8
          echo "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb  input/r8/fresh/NAS100/market-evidence.json" | sha256sum -c -
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10389112524/zip" > r6.zip
          unzip -q r6.zip -d input/r6
          echo "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581  input/r6/fresh/NAS100/market-evidence.json" | sha256sum -c -
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10380044761/zip" > r5.zip
          unzip -q r5.zip -d input/r5
          echo "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7  input/r5/fresh/NAS100/market-evidence.json" | sha256sum -c -
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10610673464/zip" > authoritative.zip
          unzip -q authoritative.zip -d authoritative
          (cd authoritative && sha256sum -c SHA256SUMS)

      - name: Reproduce exact 806-trade VT31 V4 population
        env:
          PYTHONPATH: ${{ github.workspace }}/vt31-code/src:${{ github.workspace }}/vt31-code/scripts
        run: |
          python vt31-code/scripts/cibo_phase22_vt31_v4_replay.py \
            --r8 input/r8/fresh/NAS100/market-evidence.json \
            --r6 input/r6/fresh/NAS100/market-evidence.json \
            --r5 input/r5/fresh/NAS100/market-evidence.json \
            --output phase22-output/regenerated-vt31-v4.json \
            > phase22-output/replay-stdout.json
          python scripts/cibo_phase18_vt31_bind.py \
            --regenerated phase22-output/regenerated-vt31-v4.json \
            --authoritative authoritative/validation-5y-v4.json \
            --output phase22-output

      - name: Build Phase22 VT31 parity receipt
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from qore.infrastructure.cibo_phase22_parity_lane_evidence import (
              CiboPhase22ParityLaneEvidence,
          )

          files = (
              Path("vt31-code/scripts/vt31_nas100_structural_target_execution_binding_5y_v4.py"),
              Path("scripts/cibo_phase18_vt31_v4_geometry_patch.py"),
              Path("scripts/cibo_phase18_vt31_rearm_geometry_patch.py"),
              Path("scripts/cibo_phase18_vt31_bind.py"),
          )
          h = hashlib.sha256()
          for path in files:
              h.update(str(path).encode())
              h.update(b"\0")
              h.update(path.read_bytes())
              h.update(b"\0")

          authoritative = json.loads(
              Path("authoritative/validation-5y-v4.json").read_text()
          )
          report = json.loads(
              Path("phase22-output/phase18-vt31-v4-bound-report.json").read_text()
          )
          strategy = str(authoritative["certified_strategy_fingerprint"])
          evidence = CiboPhase22ParityLaneEvidence(
              trader_id="VT31_NAS100",
              frozen_source_git_sha="cac38ed14f20e066536910145027426fd23f5939",
              methodology_sha256="sha256:" + strategy,
              replay_engine_sha256="sha256:" + h.hexdigest(),
              parameter_sha256="sha256:" + strategy,
              authorized_markets=("NAS100",),
              processed_markets=("NAS100",),
              historical_artifact_refs=(
                  "github-actions-artifact://10402199719",
                  "github-actions-artifact://10389112524",
                  "github-actions-artifact://10380044761",
                  "github-actions-artifact://10610673464",
              ),
              expected_population=806,
              observed_population=int(report["rows"]),
              exact_historical_match=bool(
                  report["parity"][
                      "authoritative_v4_json_exact_without_serialized_rows"
                  ]
              ),
          )
          payload = evidence.payload()
          payload["strategy_identity"] = authoritative["strategy_identity"]
          payload["execution_binding_fingerprint"] = (
              authoritative["execution_binding_fingerprint"]
          )
          Path("phase22-output/phase22-vt31-parity.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Seal VT31 parity evidence
        run: |
          printf '%s\n' "$EVIDENCE_SHA" > phase22-output/git-sha.txt
          printf '%s\n' "$VT31_SOURCE_SHA" > phase22-output/frozen-source-sha.txt
          cd phase22-output
          sha256sum \
            phase22-vt31-parity.json \
            regenerated-vt31-v4.json \
            phase18-vt31-v4-bound-report.json \
            phase18-vt31-v4-bound-trades.jsonl \
            replay-stdout.json \
            git-sha.txt \
            frozen-source-sha.txt > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-phase22-vt31-parity-${{ env.EVIDENCE_SHA }}
          path: phase22-output
          if-no-files-found: error
          retention-days: 90
