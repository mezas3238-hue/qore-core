name: QORE CIBO T20 Capital Release Evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-t20-capital-release.yml'
      - 'src/qore/infrastructure/cibo_t20_capital_release_evidence.py'
      - 'tests/infrastructure/test_cibo_t20_capital_release_evidence.py'
      - 'docs/research/CIBO-B-T20-CAPITAL-RELEASE-MECHANICAL-CLOSURE-V1.md'
  push:
    branches:
      - agent/cibo-certification-architect-b-integration-001
    paths:
      - '.github/workflows/cibo-t20-capital-release.yml'
      - 'src/qore/infrastructure/cibo_t20_capital_release_evidence.py'
      - 'tests/infrastructure/test_cibo_t20_capital_release_evidence.py'
      - 'docs/research/CIBO-B-T20-CAPITAL-RELEASE-MECHANICAL-CLOSURE-V1.md'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  t20-capital-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: T20 release evidence quality
        run: |
          ruff check \
            src/qore/infrastructure/cibo_t20_capital_release_evidence.py \
            tests/infrastructure/test_cibo_t20_capital_release_evidence.py
          mypy src/qore/infrastructure/cibo_t20_capital_release_evidence.py
          python -m py_compile src/qore/infrastructure/cibo_t20_capital_release_evidence.py
          pytest -q --no-cov tests/infrastructure/test_cibo_t20_capital_release_evidence.py
