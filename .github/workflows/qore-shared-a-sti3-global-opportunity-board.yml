name: QORE Shared A STI3 Global Opportunity Board

concurrency:
  group: qore-shared-a-sti3-global-opportunity-board
  cancel-in-progress: false

on:
  push:
    branches:
      - agent/shared-a-cognitive-science-001
    paths:
      - src/qore/infrastructure/core_stack_v2/shared_global_opportunity_board.py
      - tests/infrastructure/test_core_stack_v2_shared_global_opportunity_board.py
      - .github/workflows/qore-shared-a-sti3-global-opportunity-board.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate STI-3 attention-board contract
        run: |
          ruff check src/qore/infrastructure/core_stack_v2/shared_global_opportunity_board.py tests/infrastructure/test_core_stack_v2_shared_global_opportunity_board.py
          mypy src/qore/infrastructure/core_stack_v2/shared_global_opportunity_board.py
          pytest -q tests/infrastructure/test_core_stack_v2_shared_global_opportunity_board.py
