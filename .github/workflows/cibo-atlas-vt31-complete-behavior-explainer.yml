name: QORE CIBO Atlas VT31 Complete Behavior Explainer

on:
  push:
    branches: [agent/cibo-atlas-vt31-market-specialists-001]
    paths:
      - scripts/cibo_atlas_vt31_complete_behavior_explainer.py
      - .github/workflows/cibo-atlas-vt31-complete-behavior-explainer.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  complete-behavior-explainer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research runtime
        run: pip install -e .[dev]
      - name: Static validation
        run: |
          set -euo pipefail
          python -m py_compile scripts/cibo_atlas_vt31_complete_behavior_explainer.py
          ruff check --ignore E501,I001,UP035,SLF001 scripts/cibo_atlas_vt31_complete_behavior_explainer.py
          python scripts/cibo_atlas_vt31_complete_behavior_explainer.py --self-test
      - name: Recover immutable definitive forensics
        run: |
          set -euo pipefail
          artifact_id=10440468729
          expected=2d6a2c609a0fb0caf11f936623ed4907450e0f9a8581b4f6b54997b89b743b65
          digest="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" --jq .digest)"
          test "$digest" = "sha256:${expected}"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > forensics.zip
          echo "${expected}  forensics.zip" | sha256sum -c -
          mkdir forensics
          unzip -q forensics.zip -d forensics
          (cd forensics && sha256sum -c SHA256SUMS)
          test -f forensics/vt31-tick-corrected-deep-forensics.json
      - name: Recover immutable root-cause attribution
        run: |
          set -euo pipefail
          artifact_id=10469098482
          expected=722c92398e0af62f7ab20b27adc2d0e9fd013ebe7fd7f800122e126e6d6d6ffd
          digest="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" --jq .digest)"
          test "$digest" = "sha256:${expected}"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > attribution.zip
          echo "${expected}  attribution.zip" | sha256sum -c -
          mkdir attribution
          unzip -q attribution.zip -d attribution
          (cd attribution && sha256sum -c SHA256SUMS)
          test -f attribution/cibo-atlas-vt31-root-cause-attribution.json
      - name: Recover immutable pre-departure structure and timing lab
        run: |
          set -euo pipefail
          artifact_id=10469813468
          expected=65df715278cdc987d42dfa1b1cb6cd845f789a22b5cca60d561da8c9fbfad136
          digest="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" --jq .digest)"
          test "$digest" = "sha256:${expected}"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > predeparture.zip
          echo "${expected}  predeparture.zip" | sha256sum -c -
          mkdir predeparture
          unzip -q predeparture.zip -d predeparture
          (cd predeparture && sha256sum -c SHA256SUMS)
          test -f predeparture/cibo-atlas-vt31-pre-departure-structure-lab.json
          test -f predeparture/cibo-atlas-vt31-pre-departure-timing-lab.json
      - name: Recover immutable consumed M1 evidence
        run: |
          set -euo pipefail
          fetch_artifact() {
            id="$1"; expected="$2"; destination="$3"
            digest="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" --jq .digest)"
            test "$digest" = "sha256:${expected}"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "${destination}.zip"
            echo "${expected}  ${destination}.zip" | sha256sum -c -
            mkdir "$destination"
            unzip -q "${destination}.zip" -d "$destination"
            if [ -f "$destination/SHA256SUMS" ]; then
              (cd "$destination" && sha256sum -c SHA256SUMS)
            fi
          }
          fetch_artifact 10380044761 828335b99cd51c663e3f0f095df5137e881da3d7e8da741da8ca116a0400edf8 evidence-r5
          fetch_artifact 10389112524 9b0f3a05dc76b5dd83e5e3610266484bee1b79595dbbaacdff1d799115ad58b9 evidence-r6
          fetch_artifact 10402199719 9f5df4eba1882cb498b4e3657176f34a7c27083f3ac1af7856ebddf01447f34d evidence-r8
          for root in evidence-r5 evidence-r6 evidence-r8; do
            for market in NAS100 SP500 US30; do
              test -f "$root/fresh/$market/market-evidence.json"
            done
          done
      - name: Build complete CIBO behavior explanation
        run: |
          set -euo pipefail
          mkdir result
          python scripts/cibo_atlas_vt31_complete_behavior_explainer.py \
            --forensics forensics/vt31-tick-corrected-deep-forensics.json \
            --attribution attribution/cibo-atlas-vt31-root-cause-attribution.json \
            --predeparture predeparture/cibo-atlas-vt31-pre-departure-structure-lab.json \
            --r5-nas100 evidence-r5/fresh/NAS100/market-evidence.json \
            --r5-sp500 evidence-r5/fresh/SP500/market-evidence.json \
            --r5-us30 evidence-r5/fresh/US30/market-evidence.json \
            --r6-nas100 evidence-r6/fresh/NAS100/market-evidence.json \
            --r6-sp500 evidence-r6/fresh/SP500/market-evidence.json \
            --r6-us30 evidence-r6/fresh/US30/market-evidence.json \
            --r8-fresh-nas100 evidence-r8/fresh/NAS100/market-evidence.json \
            --r8-fresh-sp500 evidence-r8/fresh/SP500/market-evidence.json \
            --r8-fresh-us30 evidence-r8/fresh/US30/market-evidence.json \
            --output-dir result
      - name: Validate explanation conservation and governance
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('result/cibo-atlas-vt31-complete-behavior-explainer.json').read_text())
          assert p['schema']=='qore.cibo_atlas.vt31.complete_behavior_explainer.v1'
          assert p['research_only'] is True and p['selection_prohibited'] is True
          assert p['opens_new_holdout'] is False
          assert p['candidate_status']=='NO_R9_NOT_CERTIFIED'
          assert p['live_authorized'] is False and p['production_authorized'] is False
          assert p['terminal_root_count']==618
          assert p['demonstrated_stop_before_source_objective_count']==163
          assert set(p['market_behavior'])=={'NAS100','SP500','US30'}
          assert set(p['trader_behavior'])=={'NAS100','SP500','US30'}
          assert sum(p['trader_behavior'][m]['n'] for m in p['trader_behavior'])==618
          assert p['all_trader_roots']['fixed_target_geometry']['source_boundary_farther_than_2r_count']==618
          print(json.dumps({
            'market_days':p['market_day_count'],
            'stopped_then_objective':p['demonstrated_stop_before_source_objective_count'],
            'market_behavior':p['market_behavior'],
            'trader_behavior':p['trader_behavior'],
            'weekday_behavior':p['weekday_behavior_by_market'],
          },sort_keys=True))
          PY
      - name: Bind immutable explainer artifact
        run: |
          set -euo pipefail
          echo "$GITHUB_SHA" > result/git-sha.txt
          printf '%s\n' 10440468729 > result/forensics-artifact-id.txt
          printf '%s\n' sha256:2d6a2c609a0fb0caf11f936623ed4907450e0f9a8581b4f6b54997b89b743b65 > result/forensics-artifact-digest.txt
          printf '%s\n' 10469098482 > result/attribution-artifact-id.txt
          printf '%s\n' sha256:722c92398e0af62f7ab20b27adc2d0e9fd013ebe7fd7f800122e126e6d6d6ffd > result/attribution-artifact-digest.txt
          printf '%s\n' 10469813468 > result/predeparture-artifact-id.txt
          printf '%s\n' sha256:65df715278cdc987d42dfa1b1cb6cd845f789a22b5cca60d561da8c9fbfad136 > result/predeparture-artifact-digest.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-atlas-vt31-complete-behavior-${{ github.sha }}
          path: result/
          retention-days: 90
