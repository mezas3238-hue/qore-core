name: QORE Capitalizer Stop Breathing Context V2

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-stop-breathing-context-v2.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_stop_breathing_context_v2.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_stop_breathing_context_v2.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_ob_penetration_intelligence_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-stop-breathing-context-v2-${{ github.sha }}
  cancel-in-progress: false

env:
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'
  SOURCE_5Y_RUN_ID: '35548659988'
  SOURCE_5Y_SHA: 'e7cc3ed4497cb5e51303de374d7e3c6eedaebcdd'
  DEV_FORENSICS_RUN_ID: '35585286205'
  DEV_FORENSICS_SHA: 'f728f819266fab7e371873cff85ae7aa4fb489dd'
  HOLD_FORENSICS_RUN_ID: '35583377247'
  HOLD_FORENSICS_SHA: 'e69998808dbbb0f57a51622c096b0a4f30006af1'
  HOLD_PEN_RUN_ID: '35592309957'
  HOLD_PEN_SHA: 'd7b4f397ae88b1e3dc1ad558e2ccb2284268aea5'
  DEV_PEN_RUN_ID: '35593504906'
  DEV_PEN_SHA: '14014ae72aeebe985b08cae56a04b55122c60f92'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_stop_breathing_context_v2.py \
            tests/infrastructure/trader_lab/test_capitalizer_stop_breathing_context_v2.py
      - name: Mypy
        run: |
          mypy src/qore/infrastructure/trader_lab/capitalizer_stop_breathing_context_v2.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_stop_breathing_context_v2.py

  context:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {symbol: USDJPY, session: ASIA}
          - {symbol: AUDJPY, session: ASIA}
          - {symbol: AUDUSD, session: ASIA}
          - {symbol: GBPJPY, session: ASIA}
          - {symbol: EURUSD, session: LONDON}
          - {symbol: GBPUSD, session: LONDON}
          - {symbol: XAUUSD, session: NEW_YORK}
          - {symbol: USDCAD, session: NEW_YORK}
          - {symbol: NAS100, session: NEW_YORK}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable native-M1 clone
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Download frozen development penetration
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-ob-penetration-dev-${{ matrix.symbol }}-${{ env.DEV_PEN_SHA }}
          path: dev-penetration
          github-token: ${{ github.token }}
          run-id: ${{ env.DEV_PEN_RUN_ID }}
      - name: Download development forensics
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-m1-loss-causal-forensics-dev-${{ matrix.symbol }}-${{ env.DEV_FORENSICS_SHA }}
          path: dev-forensics
          github-token: ${{ github.token }}
          run-id: ${{ env.DEV_FORENSICS_RUN_ID }}
      - name: Download consumed holdout penetration
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-ob-penetration-${{ matrix.symbol }}-${{ env.HOLD_PEN_SHA }}
          path: holdout-penetration
          github-token: ${{ github.token }}
          run-id: ${{ env.HOLD_PEN_RUN_ID }}
      - name: Download consumed holdout forensics
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-m1-loss-causal-forensics-${{ matrix.symbol }}-${{ env.HOLD_FORENSICS_SHA }}
          path: holdout-forensics
          github-token: ${{ github.token }}
          run-id: ${{ env.HOLD_FORENSICS_RUN_ID }}
      - name: Build temporal breathing context
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_stop_breathing_context_v2 \
            market \
            dev-penetration dev-forensics \
            holdout-penetration holdout-forensics \
            m1-source context-output
      - name: Enforce causal governance
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
          EXPECTED_SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"]
          path = Path("context-output") / (
              f"capitalizer-{symbol.lower()}-stop-breathing-context-v2.json"
          )
          report = json.loads(path.read_text())
          assert report["identity"] == "QORE_CAPITALIZER_STOP_BREATHING_CONTEXT_V2"
          assert report["symbol"] == symbol
          assert report["session"] == os.environ["EXPECTED_SESSION"]
          assert report["development_trades"] > 0
          assert report["consumed_holdout_trades"] > 0
          assert report["pre_entry_path_features_present"] is True
          assert report["first_retest_entry_contract_constant"] is True
          assert report["fresh_repeat_discriminator_available"] is False
          assert report["pre_entry_reclaim_discriminator_available"] is False
          assert report["post_entry_reclaim_used_for_initial_stop"] is False
          assert report["historical_spread_at_entry_available"] is False
          assert report["historical_broker_tick_size_available"] is False
          assert report["development_outcome_used_for_hypothesis_generation"] is True
          assert report["consumed_holdout_used_for_threshold_selection"] is False
          assert report["buffer_candidate_frozen"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["economic_candidate"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-stop-breathing-context-${{ matrix.symbol }}-${{ github.sha }}
          path: context-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: context
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-stop-breathing-context-*-${{ github.sha }}
          path: context-input
          merge-multiple: false
      - name: Build nine-market context matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_stop_breathing_context_v2 \
            matrix context-input matrix-output
      - name: Enforce nine-market research boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "matrix-output/capitalizer-nine-market-stop-breathing-context-v2.json"
              ).read_text()
          )
          assert report["identity"] == "QORE_CAPITALIZER_NINE_MARKET_STOP_BREATHING_CONTEXT_MATRIX_V2"
          assert report["market_count"] == 9
          assert report["development_trades"] == 10705
          assert report["consumed_holdout_trades"] == 10991
          assert report["development_outcome_used_for_hypothesis_generation"] is True
          assert report["consumed_holdout_used_for_threshold_selection"] is False
          assert report["buffer_candidate_frozen"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["economic_candidate"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-nine-market-stop-breathing-context-v2-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
