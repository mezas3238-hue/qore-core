name: QORE VT08 CRT PURE BTCUSD Window Census

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vt08-crt-pure-source-identity-001
    paths:
      - '.github/workflows/vt08-crt-pure-btcusd-window-census.yml'
      - 'src/qore/infrastructure/trader_lab/vt08_crt_pure_window_census.py'
      - 'tests/infrastructure/trader_lab/test_vt08_crt_pure_2y_replay.py'
      - 'src/qore/infrastructure/traders/crt_pure_timing_policy.py'

concurrency:
  group: qore-vt08-crt-pure-2y-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
  QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: python -m pip install -e '.[dev,ctrader]'
      - name: Ruff replay
        run: |
          ruff check --ignore B009 \
            src/qore/infrastructure/trader_lab/vt08_crt_pure_window_census.py \
            tests/infrastructure/trader_lab/test_vt08_crt_pure_2y_replay.py
      - name: Mypy replay
        run: mypy src/qore/infrastructure/trader_lab/vt08_crt_pure_window_census.py
      - name: Replay unit tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_vt08_crt_pure_2y_replay.py \
            tests/infrastructure/traders/test_crt_pure_timing_policy.py

  replay:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        market: [BTCUSD]
    env:
      QORE_MARKET: ${{ matrix.market }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cTrader runtime
        run: python -m pip install -e '.[ctrader]'
      - name: Verify DEMO read-only credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in QORE_CTRADER_CLIENT_ID QORE_CTRADER_CLIENT_SECRET QORE_CTRADER_ACCESS_TOKEN QORE_CTRADER_REFRESH_TOKEN; do
            test -n "${!name:-}" || { echo "missing required DEMO input: $name" >&2; exit 2; }
          done
      - name: Discover DEMO account when needed
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            if ! [[ "$account_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "invalid cTrader DEMO account id" >&2
              exit 3
            fi
            echo "::add-mask::$account_id"
            printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          fi
      - name: Run BTCUSD window census
        run: |
          mkdir -p "artifacts/${QORE_MARKET}"
          python -m qore.infrastructure.trader_lab.vt08_crt_pure_2y_replay \
            "$QORE_MARKET" "artifacts/${QORE_MARKET}" \
            | tee "artifacts/${QORE_MARKET}/stdout.json"
      - name: Bind git SHA and hashes
        shell: bash
        run: |
          printf '%s\n' "$GITHUB_SHA" > "artifacts/${QORE_MARKET}/git-sha.txt"
          cd "artifacts/${QORE_MARKET}"
          sha256sum window-census.json stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-crt-pure-window-census-${{ matrix.market }}-${{ github.sha }}
          path: artifacts/${{ matrix.market }}
          if-no-files-found: error
          retention-days: 90

