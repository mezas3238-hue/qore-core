name: QORE CIBO Risk Integration Closure

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-risk-integration-closure.yml'
      - 'src/qore/infrastructure/account_wide_risk.py'
      - 'src/qore/infrastructure/account_wide_risk_ledger.py'
      - 'src/qore/infrastructure/cibo_cma_risk_request.py'
      - 'src/qore/infrastructure/cibo_ce2i_phase20_demo_risk_bridge.py'
      - 'src/qore/infrastructure/cibo_ce2i_phase20_demo_shadow_risk.py'
      - 'src/qore/infrastructure/ctrader_demo_free_sink.py'
      - 'scripts/qore_ctrader_demo_free_runtime.py'
      - 'tests/infrastructure/test_ctrader_demo_phase20_risk_sink.py'
      - 'tests/infrastructure/test_ctrader_demo_free_sink_multi_entry.py'
      - 'tests/infrastructure/test_ctrader_demo_sovereign_risk_runtime.py'
      - 'src/qore/infrastructure/cibo_fundednext_seed.py'
      - 'tests/infrastructure/test_cibo_risk_integration_closure.py'
      - 'docs/research/CIBO-RISK-INTEGRATION-CLOSURE-V1.md'
  push:
    branches:
      - agent/cibo-certification-architect-b-integration-001
      - agent/cibo-integrator-ab-001
    paths:
      - '.github/workflows/cibo-risk-integration-closure.yml'
      - 'src/qore/infrastructure/account_wide_risk.py'
      - 'src/qore/infrastructure/account_wide_risk_ledger.py'
      - 'src/qore/infrastructure/cibo_cma_risk_request.py'
      - 'src/qore/infrastructure/cibo_ce2i_phase20_demo_risk_bridge.py'
      - 'src/qore/infrastructure/cibo_ce2i_phase20_demo_shadow_risk.py'
      - 'src/qore/infrastructure/ctrader_demo_free_sink.py'
      - 'scripts/qore_ctrader_demo_free_runtime.py'
      - 'tests/infrastructure/test_ctrader_demo_phase20_risk_sink.py'
      - 'tests/infrastructure/test_ctrader_demo_free_sink_multi_entry.py'
      - 'tests/infrastructure/test_ctrader_demo_sovereign_risk_runtime.py'
      - 'src/qore/infrastructure/cibo_fundednext_seed.py'
      - 'tests/infrastructure/test_cibo_risk_integration_closure.py'
      - 'docs/research/CIBO-RISK-INTEGRATION-CLOSURE-V1.md'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  risk-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: CIBO Risk integration closure
        run: |
          ruff check \
            src/qore/infrastructure/account_wide_risk.py \
            src/qore/infrastructure/account_wide_risk_ledger.py \
            src/qore/infrastructure/cibo_cma_risk_request.py \
            src/qore/infrastructure/cibo_ce2i_phase20_demo_risk_bridge.py \
            src/qore/infrastructure/cibo_ce2i_phase20_demo_shadow_risk.py \
            src/qore/infrastructure/ctrader_demo_free_sink.py \
            src/qore/infrastructure/cibo_fundednext_seed.py \
            tests/infrastructure/test_cibo_risk_integration_closure.py \
            tests/infrastructure/test_ctrader_demo_phase20_risk_sink.py \
            tests/infrastructure/test_ctrader_demo_free_sink_multi_entry.py \
            tests/infrastructure/test_ctrader_demo_sovereign_risk_runtime.py
          mypy \
            src/qore/infrastructure/account_wide_risk.py \
            src/qore/infrastructure/account_wide_risk_ledger.py \
            src/qore/infrastructure/cibo_cma_risk_request.py \
            src/qore/infrastructure/cibo_ce2i_phase20_demo_risk_bridge.py \
            src/qore/infrastructure/cibo_ce2i_phase20_demo_shadow_risk.py \
            src/qore/infrastructure/ctrader_demo_free_sink.py \
            src/qore/infrastructure/cibo_fundednext_seed.py
          python -m py_compile \
            src/qore/infrastructure/cibo_cma_risk_request.py \
            src/qore/infrastructure/cibo_ce2i_phase20_demo_risk_bridge.py \
            src/qore/infrastructure/cibo_ce2i_phase20_demo_shadow_risk.py \
            src/qore/infrastructure/ctrader_demo_free_sink.py \
            scripts/qore_ctrader_demo_free_runtime.py \
            src/qore/infrastructure/cibo_fundednext_seed.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_risk_integration_closure.py \
            tests/infrastructure/test_ctrader_demo_phase20_risk_sink.py \
            tests/infrastructure/test_ctrader_demo_free_sink_multi_entry.py \
            tests/infrastructure/test_ctrader_demo_sovereign_risk_runtime.py
