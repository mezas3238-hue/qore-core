name: QORE Capitalizer V3 SOURCE_FIRST Series Rearm WAIT5 2Y V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-v3-source-first-series-rearm-wait5-2y-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v3_source_first-series-rearm-wait5-2y-v1.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v3_source_first_series_rearm_wait5_2y_v1.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v3_source_first_series_rearm_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v3_source_first_series_rearm_wait5_2y_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-v3-source-first-series-rearm-wait5-2y-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'
  WAIT5_RUN_ID: '35844549291'
  WAIT5_SHA: '32bd64963a34b762723416c01cf8a016fd86daab'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_v3_source_first_series_rearm_v1.py \
            src/qore/infrastructure/trader_lab/capitalizer_v3_source_first_series_rearm_wait5_2y_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_v3_source_first_series_rearm_wait5_2y_v1.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_v3_source_first_series_rearm_v1.py \
            src/qore/infrastructure/trader_lab/capitalizer_v3_source_first_series_rearm_wait5_2y_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_v3_source_first_series_rearm_wait5_2y_v1.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {symbol: USDJPY, session: ASIA}
          - {symbol: AUDJPY, session: ASIA}
          - {symbol: AUDUSD, session: ASIA}
          - {symbol: GBPJPY, session: ASIA}
          - {symbol: EURUSD, session: LONDON}
          - {symbol: GBPUSD, session: LONDON}
          - {symbol: XAUUSD, session: NEW_YORK}
          - {symbol: USDCAD, session: NEW_YORK}
          - {symbol: NAS100, session: NEW_YORK}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable native-M1 clone
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Run series-rearm WAIT5 replay
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v3_source_first_series_rearm_wait5_2y_v1 \
            market m1-source replay-output --session ${{ matrix.session }}
      - name: Enforce market controls
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
          EXPECTED_SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"]
          report = json.loads(
              (
                  Path("replay-output")
                  / f"capitalizer-{symbol.lower()}-v3-source-first-series-rearm-wait5-2y-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_V3_SOURCE_FIRST_SERIES_REARM_WAIT5_2Y_V1"
          )
          assert report["symbol"] == symbol
          assert report["session"] == os.environ["EXPECTED_SESSION"]
          assert report["boundary_semantics"] == (
              "FIRST_OPPOSING_OPEN_PER_DISTINCT_POST_SWEEP_SERIES"
          )
          assert report["source_first_rearm_enabled"] is True
          assert report["pre_sweep_boundary_forbidden"] is True
          assert report["same_m3_non_cisd_filters"] is True
          assert report["same_fvg_preserved"] is True
          assert report["same_fill_preserved"] is True
          assert report["same_wait5_preserved"] is True
          assert report["same_stop_preserved"] is True
          assert report["same_target_preserved"] is True
          assert report["same_h1_deadline_preserved"] is True
          assert report["same_stop_first_precedence"] is True
          assert report["same_max3_preserved"] is True
          assert report["outcome_used_for_admission"] is False
          assert report["component_rule_frozen_outcome_free"] is True
          assert report["development_window_role"] == "CONSUMED_DEVELOPMENT_ONLY"
          assert report["fresh_holdout_claimed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v3-source-first-series-rearm-wait5-2y-v1-${{ matrix.symbol }}-${{ github.sha }}
          path: replay-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download candidate artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v3-source-first-series-rearm-wait5-2y-v1-*-${{ github.sha }}
          path: candidate-input
          merge-multiple: false
      - name: Download frozen WAIT5 baseline artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v3-source-first-wait5-2y-v1-*-${{ env.WAIT5_SHA }}
          path: baseline-input
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.WAIT5_RUN_ID }}
      - name: Build nine-market series-rearm WAIT5 matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v3_source_first_series_rearm_wait5_2y_v1 \
            matrix candidate-input baseline-input matrix-output
      - name: Enforce aggregate controls
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          report = json.loads(
              Path(
                  "matrix-output/"
                  "capitalizer-nine-market-v3-source-first-series-rearm-wait5-2y-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_NINE_MARKET_V3_SOURCE_FIRST_SERIES_REARM_WAIT5_2Y_V1"
          )
          assert report["market_count"] == 9
          assert report["baseline_raw_trades"] == 1003
          assert report["baseline_max3_trades"] == 983
          assert Decimal(report["baseline_max3_metrics"]["profit_factor"]) == Decimal(
              "1.384597543145107741177480996"
          )
          assert Decimal(report["baseline_max3_metrics"]["total_r"]) == Decimal(
              "135.7651037644532073259312101"
          )
          assert Decimal(report["baseline_max3_metrics"]["max_drawdown_r"]) == Decimal(
              "11.9420088471277198029814040"
          )
          assert report["boundary_semantics"] == (
              "FIRST_OPPOSING_OPEN_PER_DISTINCT_POST_SWEEP_SERIES"
          )
          assert report["source_first_rearm_enabled"] is True
          assert report["pre_sweep_boundary_forbidden"] is True
          assert report["same_m3_non_cisd_filters"] is True
          assert report["same_fvg_preserved"] is True
          assert report["same_fill_preserved"] is True
          assert report["same_wait5_preserved"] is True
          assert report["same_stop_preserved"] is True
          assert report["same_target_preserved"] is True
          assert report["same_h1_deadline_preserved"] is True
          assert report["same_stop_first_precedence"] is True
          assert report["same_max3_preserved"] is True
          assert report["outcome_used_for_admission"] is False
          assert report["component_rule_frozen_outcome_free"] is True
          assert report["development_window_role"] == "CONSUMED_DEVELOPMENT_ONLY"
          assert report["fresh_holdout_required"] is True
          assert report["fresh_holdout_claimed"] is False
          assert report["automatic_promotion_allowed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-nine-market-v3-source-first-series-rearm-wait5-2y-v1-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
