name: VT08 Index R83 PS Qualification R58 Transport

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r83-ps-qualification-r58-transport.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r83_ps_qualification_r58_transport.py
      - tests/infrastructure/trader_lab/test_vt08_index_r83_ps_qualification_r58_transport.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r83_ps_qualification_r58_transport.py

  forensics:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R83 PS qualification x R58 transport
        run: |
          python -m qore.infrastructure.trader_lab.vt08_index_r83_ps_qualification_r58_transport \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r83-ps-qualification-r58-transport.json

      - name: Verify R83 exact reproduction and governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r83-ps-qualification-r58-transport.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R83_PROTECTED_SWING_QUALIFICATION_R58_TRANSPORT_001"
          )
          assert report["source_r82"]["run_id"] == 35519594414
          assert report["source_r82"]["artifact_id"] == 10607673530
          assert report["allocator_contract"]["base"] == "EXACT_R47"
          assert report["allocator_contract"]["signals_suppressed"] is False
          assert report["allocator_contract"]["family_used_as_runtime_feature"] is False

          assert report["five_year"]["canonical_sample"] == 2448
          assert report["recent_two_year"]["canonical_sample"] == 1017
          assert report["r66_failed_holdout"]["canonical_sample"] == 773

          # Exact R58 secondary reproduction.
          five = report["five_year"]["r58_whole_window"]["secondary"]
          two = report["recent_two_year"]["r58_whole_window"]["secondary"]
          r66 = report["r66_failed_holdout"]["r58_whole_window"]["secondary"]
          assert five["sample"] == 2448
          assert two["sample"] == 1017
          assert r66["sample"] == 773
          assert str(five["profit_factor"]).startswith("1.629558")
          assert str(two["profit_factor"]).startswith("1.523139")
          assert str(r66["profit_factor"]).startswith("0.899469")

          assert report["decision"] == (
              "R83_PS_QUALIFICATION_R58_TRANSPORT_COMPLETE_NO_RULE_CHANGE"
          )
          governance = report["governance"]
          assert governance["forensics_only"] is True
          assert governance["consumed_evidence_only"] is True
          assert governance["fresh_holdout_claim"] is False
          assert governance["exact_r47_r58_reproduction"] is True
          assert governance["future_information_used"] is False
          assert governance["source_qualification_used_to_change_risk"] is False
          assert governance["source_qualification_used_to_suppress_signals"] is False
          assert governance["family_selected_by_pnl"] is False
          assert governance["candidate_created"] is False
          assert governance["trader_certified"] is False
          assert governance["live_authorized"] is False
          assert governance["real_capital_authorized"] is False
          assert governance["production_authorized"] is False
          PY

      - name: Upload R83 evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r83-ps-qualification-r58-transport-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: warn
          retention-days: 90
