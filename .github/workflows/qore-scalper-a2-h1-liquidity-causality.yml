name: QORE Scalper A2 H1 Liquidity Targets Causality

on:
  push:
    branches:
      - agent/scalper-architect-b-methodology-20261010
    paths:
      - '.github/workflows/qore-scalper-a2-h1-liquidity-causality.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_h1_liquidity_target_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_scalper_h1_liquidity_target_v1.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scalper-a2-h1-liquidity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source_causality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff, strict types, no future H1/M1 and fail-closed V49 reconciliation
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_scalper_h1_liquidity_target_v1.py tests/infrastructure/trader_lab/test_capitalizer_scalper_h1_liquidity_target_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_scalper_h1_liquidity_target_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_scalper_h1_liquidity_target_v1.py
