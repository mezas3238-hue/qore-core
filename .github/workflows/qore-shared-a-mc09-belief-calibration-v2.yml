name: QORE Shared A MC09 Belief Calibration V2

concurrency:
  group: qore-shared-a-mc09-belief-calibration-v2
  cancel-in-progress: false

on:
  push:
    branches:
      - agent/shared-a-cognitive-science-001
    paths:
      - docs/shared/evidence/QORE_SHARED_MC09_BELIEF_STATE_CALIBRATION_V2_PREREGISTRATION_001.json
      - docs/shared/evidence/QORE_SHARED_MC09_BELIEF_STATE_CALIBRATION_V2_ENGINEERING_RECOVERY_AMENDMENT_001.json
      - scripts/shared_mc09_belief_state_calibration_v2.py
      - .github/workflows/qore-shared-a-mc09-belief-calibration-v2.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  temporal-oos:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pip install scikit-learn

      - name: Validate V2 preregistration
        run: |
          set -euo pipefail
          mkdir -p input/{pure,r6,r5,oos-raw,oos-result} result
          ruff check scripts/shared_mc09_belief_state_calibration_v2.py
          python -m py_compile scripts/shared_mc09_belief_state_calibration_v2.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("docs/shared/evidence/QORE_SHARED_MC09_BELIEF_STATE_CALIBRATION_V2_PREREGISTRATION_001.json").read_text())
          assert p["status"] == "PREREGISTERED_BEFORE_TEMPORAL_OOS_SCORING"
          assert p["parent_v1"]["status"] == "MC09_BELIEF_STATE_CALIBRATION_FALSIFIED"
          assert p["scientific_hypothesis"]["belief_engine_changed"] is False
          assert p["temporal_oos"]["used_for_fit"] is False
          assert p["governance"]["protected_certification_holdout_opened"] is False
          a=json.loads(Path("docs/shared/evidence/QORE_SHARED_MC09_BELIEF_STATE_CALIBRATION_V2_ENGINEERING_RECOVERY_AMENDMENT_001.json").read_text())
          assert a["status"] == "ENGINEERING_RECOVERY_ONLY"
          assert a["failed_run_id"] == 36754425649
          assert a["scientific_evaluation_started"] is False
          assert a["engineering_change_only"]["outcome_aware_retuning"] is False
          PY

      - name: Recover burned fit evidence and independent temporal OOS
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10799064861/zip" > pure.zip
          unzip -q pure.zip -d input/pure
          (cd input/pure && sha256sum -c SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10389112524/zip" > r6.zip
          unzip -q r6.zip -d input/r6
          (cd input/r6 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10380044761/zip" > r5.zip
          unzip -q r5.zip -d input/r5
          (cd input/r5 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11070988924/zip" > oos-raw.zip
          unzip -q oos-raw.zip -d input/oos-raw
          (cd input/oos-raw && sha256sum -c SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11071394080/zip" > oos-result.zip
          unzip -q oos-result.zip -d input/oos-result
          (cd input/oos-result && sha256sum -c SHA256SUMS)

      - name: Fit burned calibration layer and score later OOS once
        run: |
          set -euo pipefail
          python scripts/shared_mc09_belief_state_calibration_v2.py             --r6-trades input/pure/r6.json             --r6-nas input/r6/fresh/NAS100/market-evidence.json             --r6-sp input/r6/fresh/SP500/market-evidence.json             --r6-us input/r6/fresh/US30/market-evidence.json             --r5-trades input/pure/r5.json             --r5-nas input/r5/fresh/NAS100/market-evidence.json             --r5-sp input/r5/fresh/SP500/market-evidence.json             --r5-us input/r5/fresh/US30/market-evidence.json             --oos-trades input/oos-result/sti8-oos-trades.json             --oos-nas input/oos-raw/fresh/NAS100/market-evidence.json             --oos-sp input/oos-raw/fresh/SP500/market-evidence.json             --oos-us input/oos-raw/fresh/US30/market-evidence.json             --output result/mc09-belief-calibration-v2.json             | tee result/summary.json

      - name: Validate disposition without forcing pass
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/mc09-belief-calibration-v2.json").read_text())
          assert p["status"] in {
              "MC09_BELIEF_STATE_CALIBRATION_V2_TEMPORAL_OOS_PASS",
              "MC09_BELIEF_STATE_CALIBRATION_V2_TEMPORAL_OOS_FALSIFIED",
          }
          assert p["belief_engine_changed"] is False
          assert p["belief_ranking_changed"] is False
          assert p["temporal_oos_used_for_fit"] is False
          assert p["source_decisions_materialized_before_outcome_scoring"] is True
          assert p["future_market_used_for_belief"] is False
          assert p["future_outcome_used_for_belief"] is False
          assert p["protected_certification_holdout_opened"] is False
          PY

      - name: Seal result
        run: |
          cp docs/shared/evidence/QORE_SHARED_MC09_BELIEF_STATE_CALIBRATION_V2_PREREGISTRATION_001.json result/preregistration.json
          printf '%s\n' "${GITHUB_SHA}" > result/code-git-sha.txt
          (
            cd result
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-a-mc09-belief-calibration-v2-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Report MC-09 V2
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p=json.loads(Path("result/mc09-belief-calibration-v2.json").read_text())
          body="\n".join([
              "## Shared A MC-09 — Belief Calibration V2 Temporal OOS",
              "",
              f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- disposition: **{p['status']}**",
              f"- fit count: **{p['fit_count']}**",
              f"- raw OOS: **{p['oos_raw']}**",
              f"- calibrated OOS: **{p['oos_calibrated']}**",
              f"- gates: **{p['gates']}**",
              f"- MC-09 completed-and-proven: **{p['mc09_completed_and_proven']}**",
              "- temporal OOS used for fit: **False**",
              "- protected certification holdout opened: **False**",
          ])+"\n"
          Path("result/issue-comment.md").write_text(body)
          PY
          gh issue comment 638 --body-file result/issue-comment.md
