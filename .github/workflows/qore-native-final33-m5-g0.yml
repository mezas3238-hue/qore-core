name: QORE Native 30-to-33 M5 final source SHA with publication preflight

on:
  push:
    branches:
      - research/qore-native-final33-tail-ready-g0-20261012
    paths:
      - '.github/workflows/qore-native-final33-m5-g0.yml'
      - 'src/qore/infrastructure/trader_lab/qore_native_final33_three_m5_g0_v1.py'
      - 'tests/infrastructure/trader_lab/test_qore_native_final33_three_m5_g0_v1.py'
      - 'docs/research/QORE_NATIVE_FINAL33_RECHECK_TRIGGER_2026-10-12.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-native-final33-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frozen_source_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Original 30 SHA and exact three source names fail-closed unit tests
        run: |
          ruff check --select F,E4,E7,E9 src/qore/infrastructure/trader_lab/qore_native_final33_three_m5_g0_v1.py tests/infrastructure/trader_lab/test_qore_native_final33_three_m5_g0_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_qore_native_final33_three_m5_g0_v1.py

  published_originals_preflight:
    needs: frozen_source_contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      all_published: ${{ steps.proof.outputs.all_published }}
    steps:
      - id: proof
        name: Do NOT promote 33 unless all exact 3 original artifacts published by producer run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p readiness
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          symbols=("NZDJPY","NZDCAD","NZDCHF")
          parent="e0ca5a13c866a19d8505c68cffc473598984b340"
          url=f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/38193802541/artifacts?per_page=100"
          payload=json.loads(subprocess.check_output(["gh","api",url],text=True))
          artifacts={x["name"]:x for x in payload.get("artifacts",[])}
          missing=[]
          for symbol in symbols:
              key=f"qore-native-icmarkets-10Y-provider-M5-{symbol}-{parent}"
              x=artifacts.get(key)
              if x is None or x.get("expired") is not False or x.get("size_in_bytes",0)<=0:
                  missing.append(symbol)
          ready=not missing
          report={
              "identity":"QORE_NATIVE_FINAL33_SOURCE_PUBLICATION_PRECHECK_V1",
              "producer_run":38193802541,
              "source_code_sha":parent,
              "tail_symbols":list(symbols),
              "missing_artifacts":missing,
              "all_three_source_artifacts_published_not_verified":ready,
              "g0_33_certified":False,
              "bidask_or_pnl_not_read":True,
              "no_production_changes":True,
          }
          Path("readiness/published-only.json").write_text(json.dumps(report,indent=2)+"\n")
          with open(os.environ["GITHUB_OUTPUT"],"a") as output:
              output.write(f"all_published={'true' if ready else 'false'}\n")
          print("ORIGINAL_3_SOURCE_ARTIFACTS_READY" if ready else "SOURCE_PENDING_NOT_33",
                "missing",",".join(missing))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-native-final33-source-publication-preflight-${{ github.sha }}
          path: readiness/
          retention-days: 90
          if-no-files-found: error

  audit_last_three_originals:
    needs: published_originals_preflight
    if: ${{ needs.published_originals_preflight.outputs.all_published == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol: [NZDJPY, NZDCAD, NZDCHF]
    env:
      SYMBOL: ${{ matrix.symbol }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: qore-native-icmarkets-10Y-provider-M5-${{ matrix.symbol }}-e0ca5a13c866a19d8505c68cffc473598984b340
          run-id: '38193802541'
          github-token: ${{ github.token }}
          path: final-original-m5
      - name: Check producer SHA and 11 complete M5 years, RAW and QUALITY
        run: |
          python -m qore.infrastructure.trader_lab.qore_native_final33_three_m5_g0_v1 audit "$SYMBOL" final-original-m5 validated-source
          python - <<'PY'
          import json,os
          from pathlib import Path
          symbol=os.environ["SYMBOL"]
          j=json.loads(Path(f"validated-source/qore-native-tail33-new-{symbol}.json").read_text())
          assert j["symbol"]==symbol
          assert j["status"]=="G0_NEW_PROVIDER_M5_SHA_PASS"
          assert len(j["years"])==11
          assert j["source_integrity_checked"] and j["m5_bars"]>0
          assert j["g1_net_authorized"] is False
          assert j["ohlc_prices_returns_or_pnl_analyzed"] is False
          PY
          printf '%s\n' "$GITHUB_SHA" > validated-source/exact-audit-code-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-native-final33-verified-${{ matrix.symbol }}-${{ github.sha }}
          path: validated-source/
          retention-days: 90
          if-no-files-found: warn

  publish_exact_source33:
    needs: audit_last_three_originals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Fetch frozen source G0 30 exact executed code and SHA
        uses: actions/download-artifact@v4
        with:
          name: qore-native-unified30-source-7c41bc4d0b135efb0885c17bafe9869342a5c377
          run-id: '38205741712'
          github-token: ${{ github.token }}
          path: frozen-parent30
      - name: Fetch all three independently original raw SHA witnesses from same run
        uses: actions/download-artifact@v4
        with:
          pattern: qore-native-final33-verified-*-${{ github.sha }}
          path: verified-last-three
      - name: Emit 33-market signed manifest only when all three SHA source witnesses pass
        run: |
          python -m qore.infrastructure.trader_lab.qore_native_final33_three_m5_g0_v1 combine frozen-parent30 verified-last-three source33
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("source33/qore-native-complete33-source-m5.json").read_text())
          assert d["status"]=="G0_33_OF_33_PROVIDER_M5_SHA_VERIFIED_NO_ECONOMICS"
          assert d["market_count"]==33
          assert d["parent30_bars"]==22141699
          assert len(d["market_roster"])==33
          assert d["market_outcomes_unexamined"] is True
          assert d["net_execution_economics_authorized"] is False
          assert d["original12_vs_new21_same_ICMarkets_account_verified"] is False
          assert d["traders_certified"]==0
          assert d["production_untouched"] is True
          PY
          printf '%s\n' "$GITHUB_SHA" > source33/exact-code-head-sha.txt
          (cd source33 && sha256sum qore-native-complete33-source-m5.json exact-code-head-sha.txt > OUTPUT_SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-native-final33-source-manifest-${{ github.sha }}
          path: source33/
          retention-days: 90
          if-no-files-found: error
