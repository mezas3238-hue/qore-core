name: QORE Native G1 NAS100 USTEC DEMO catalog only no ticks no orders

on:
  push:
    branches:
      - research/qore-native-g1-nas100-ustec-alias-source-preflight-20261012
    paths:
      - '.github/workflows/qore-native-g1-nas100-ustec-catalog-source-only.yml'
      - 'src/qore/infrastructure/trader_lab/qore_native_g1_nas100_ustec_catalog_preflight_v1.py'
      - 'tests/infrastructure/trader_lab/test_qore_native_g1_nas100_ustec_catalog_preflight_v1.py'
      - 'docs/research/QORE_NATIVE_G1_NAS100_USTEC_ALIAS_CATALOG_PREREG_2026-10-12.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alias_catalog_source_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,ctrader]'
      - name: No order/no tick alias candidate synthetic tests
        run: |
          set -euo pipefail
          test -s docs/research/QORE_NATIVE_G1_NAS100_USTEC_ALIAS_CATALOG_PREREG_2026-10-12.md
          ruff check --select F,E4,E7,E9 src/qore/infrastructure/trader_lab/qore_native_g1_nas100_ustec_catalog_preflight_v1.py tests/infrastructure/trader_lab/test_qore_native_g1_nas100_ustec_catalog_preflight_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_qore_native_g1_nas100_ustec_catalog_preflight_v1.py

  broker_alias_readonly_lookup:
    needs: alias_catalog_source_contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QORE_CTRADER_DEMO_CLIENT_ID: ${{ secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
      QORE_CTRADER_DEMO_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
      QORE_CTRADER_DEMO_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
      QORE_CTRADER_DEMO_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
      QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID }}
      QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET }}
      QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN }}
      QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[ctrader]'
      - name: Confirm exact USTEC or NAS100 broker symbols without querying prices
        run: |
          set -euo pipefail
          python -m qore.infrastructure.trader_lab.qore_native_g1_nas100_ustec_catalog_preflight_v1 catalog-only/nas100-ustec-source-NOT-CONTRACT-PROOF.json
      - name: Publish sanitized alias source witness, no quotes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qore-native-G1-NAS100-USTEC-source-alias-catalog-only-${{ github.sha }}
          path: catalog-only/
          retention-days: 90
          if-no-files-found: warn
