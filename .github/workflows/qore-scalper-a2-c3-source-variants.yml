name: QORE Scalper A2 Candle 3 Source Variants (Research Only)

on:
  push:
    branches:
      - agent/scalper-architect-b-methodology-20261010
    paths:
      - '.github/workflows/qore-scalper-a2-c3-source-variants.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_c3_source_variants_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_scalper_c3_source_variants_v1.py'
      - 'docs/research/QORE_SCALPER_A2_C3_SOURCE_VARIANTS_METHOD_FIRST_2026-10-10.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qore-scalper-a2-c3-source-variants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository test environment
        run: python -m pip install -e '.[dev]'
      - name: Type, lint and anti-future source-variant characterization
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_scalper_c3_source_variants_v1.py tests/infrastructure/trader_lab/test_capitalizer_scalper_c3_source_variants_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_scalper_c3_source_variants_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_scalper_c3_source_variants_v1.py tests/infrastructure/trader_lab/test_capitalizer_scalper_h1_c2_c3_primary_source_characterization_v1.py
      - name: Research status only
        run: |
          echo 'C3 source geometries characterized ONLY.'
          echo 'Historical native nine-market A/B, source POI + LTF witnesses and OOS economics are NOT yet measured.'
          echo 'V49 decisions, stops, targets, MAX3, and MASTER Frame remain unchanged.'
