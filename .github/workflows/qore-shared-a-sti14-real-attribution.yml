name: QORE Shared A STI14 Real Attribution Audit

concurrency:
  group: qore-shared-a-sti14-real-attribution
  cancel-in-progress: false

on:
  push:
    branches:
      - agent/shared-a-cognitive-science-001
    paths:
      - scripts/shared_sti14_real_control_treatment_audit.py
      - .github/workflows/qore-shared-a-sti14-real-attribution.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Recover sealed real Control/Treatment evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          ruff check scripts/shared_sti14_real_control_treatment_audit.py
          python -m py_compile scripts/shared_sti14_real_control_treatment_audit.py
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11075373525/zip" > evidence.zip
          unzip -q evidence.zip -d input
          (cd input && sha256sum -c SHA256SUMS)
          test -f input/sti8-economic-r6.json
          test -f input/sti8-economic-r5.json
          test -f input/sti8-economic-oos.json

      - name: Audit real attribution invariants
        run: |
          set -euo pipefail
          python scripts/shared_sti14_real_control_treatment_audit.py             --r6 input/sti8-economic-r6.json             --r5 input/sti8-economic-r5.json             --oos input/sti8-economic-oos.json             --output result/sti14-real-attribution.json             | tee result/summary.json

      - name: Validate STI-14 closure evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/sti14-real-attribution.json").read_text())
          assert p["status"] == "STI14_CONTROL_TREATMENT_ATTRIBUTION_COMPLETED_AND_PROVEN"
          assert p["capability_state"] == "COMPLETED_AND_PROVEN"
          assert p["proof"]["same_universe_real_replay"] is True
          assert p["proof"]["behavioral_difference_is_separate_from_economic_value"] is True
          assert p["proof"]["outcomes_attached_only_after_source_decisions"] is True
          assert p["proof"]["future_market_used_for_decision"] is False
          assert p["proof"]["future_outcome_used_for_decision"] is False
          assert p["proof"]["protected_certification_holdout_opened"] is False
          assert p["economic_value_claim"] == "NOT_A_STI14_CLAIM"
          PY

      - name: Seal result
        run: |
          printf '%s\n' "${GITHUB_SHA}" > result/code-git-sha.txt
          (
            cd result
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-a-sti14-real-attribution-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Report STI-14
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p=json.loads(Path("result/sti14-real-attribution.json").read_text())
          body="\n".join([
              "## Shared A STI-14 — Real Control/Treatment Attribution",
              "",
              f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- disposition: **{p['status']}**",
              f"- R6: **{p['partitions']['r6']}**",
              f"- R5: **{p['partitions']['r5']}**",
              f"- OOS: **{p['partitions']['oos']}**",
              "- behavioral difference == economic value: **False**",
              "- future market/outcome in decision: **False / False**",
              "- protected certification holdout opened: **False**",
              "- capability state: **COMPLETED_AND_PROVEN**",
          ])+"\n"
          Path("result/issue-comment.md").write_text(body)
          PY
          gh issue comment 638 --body-file result/issue-comment.md
