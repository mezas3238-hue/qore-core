name: QORE Turtle Soup AUDJPY R40 Frozen R39 5Y Validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/turtle-soup-audjpy-r40-frozen-r39-5y-validation.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_audjpy_r40_frozen_r39_5y_validation.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_audjpy_r40_frozen_r39_5y_validation.py'
  push:
    branches:
      - agent/turtle-soup-audjpy-specialist-memory-v1-001
    paths:
      - '.github/workflows/turtle-soup-audjpy-r40-frozen-r39-5y-validation.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_audjpy_r40_frozen_r39_5y_validation.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_audjpy_r40_frozen_r39_5y_validation.py'

permissions:
  contents: read
  actions: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-AUDJPY-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-AUDJPY-2f510461b3360e91d5ee70a72716a76cd6561f16'
  V2_RUN_ID: '35383377176'
  V2_ARTIFACT: 'qore-turtle-soup-audjpy-structural-specialist-v2-r27-e0bec233ed40197a1e969786b24a9dc8a1e5869f'
  FREEZE_RUN_ID: '35397198837'
  FREEZE_ARTIFACT: 'qore-turtle-soup-audjpy-r39-candidate-freeze-2210ae38b209103c0dfd6c21addb96bd5bc8a3ac'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Focused quality
        run: |
          ruff check --ignore E501,I001 \
            src/qore/infrastructure/trader_lab/turtle_soup_audjpy_r40_frozen_r39_5y_validation.py \
            tests/infrastructure/trader_lab/test_turtle_soup_audjpy_r40_frozen_r39_5y_validation.py
          mypy --disable-error-code attr-defined \
            src/qore/infrastructure/trader_lab/turtle_soup_audjpy_r40_frozen_r39_5y_validation.py
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_turtle_soup_audjpy_r40_frozen_r39_5y_validation.py

  replay-5y:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable AUDJPY raw master
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-audjpy
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download immutable Target Destination V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target-audjpy
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Download exact Cognitive V2/R27 evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V2_ARTIFACT }}
          path: v2-r27
          github-token: ${{ github.token }}
          run-id: ${{ env.V2_RUN_ID }}
      - name: Download exact R39 freeze
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FREEZE_ARTIFACT }}
          path: r39-freeze
          github-token: ${{ github.token }}
          run-id: ${{ env.FREEZE_RUN_ID }}
      - name: Run exact frozen 5Y validation
        run: |
          mkdir -p r40-output
          python -m qore.infrastructure.trader_lab.turtle_soup_audjpy_r40_frozen_r39_5y_validation \
            source-audjpy target-audjpy v2-r27 r39-freeze r40-output > r40-output/stdout.json
          printf '%s\n' "$EVIDENCE_SHA" > r40-output/git-sha.txt
      - name: Enforce frozen 5Y governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('r40-output/r40-5y-validation-report.json').read_text())
          assert p['identity']=='TURTLE_SOUP_AUDJPY_R40_FROZEN_R39_5Y_VALIDATION_V1'
          assert p['window']['open']=='2021-09-17T00:00:00+00:00'
          assert p['window']['close']=='2026-09-17T00:00:00+00:00'
          assert p['window']['fresh_holdout'] is False
          assert p['window']['historical_status']=='CONSUMED_ROBUSTNESS_VALIDATION'
          c=p['frozen_contract_verification']
          assert all(v is False for v in c.values())
          a=p['predeclared_acceptance']
          assert a['minimum_trades']==800
          assert a['minimum_scaled_net_010_profit_factor']=='1.50'
          assert a['maximum_scaled_net_010_drawdown_r']=='6.0'
          assert a['required_positive_annual_blocks']==5
          g=p['governance']
          assert g['candidate_rules_frozen'] is True
          assert g['5y_validation_consumed'] is True
          assert g['fresh_holdout_consumed'] is False
          assert g['trader_certified'] is False
          assert g['live_authorized'] is False
          assert g['real_capital_authorized'] is False
          PY
      - name: Hash 5Y evidence
        run: |
          cd r40-output
          sha256sum r40-5y-validation-report.json r40-5y-scaled-trades.jsonl stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-audjpy-r40-frozen-r39-5y-validation-${{ env.EVIDENCE_SHA }}
          path: r40-output
          if-no-files-found: error
          retention-days: 90
