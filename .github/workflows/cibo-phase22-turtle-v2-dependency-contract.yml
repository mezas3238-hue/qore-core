name: QORE CIBO Phase22 Turtle V2 Dependency Contract

on:
  push:
    branches:
      - agent/cibo-certification-architect-b-integration-001
    paths:
      - '.github/workflows/cibo-phase22-turtle-v2-dependency-contract.yml'
      - 'src/qore/infrastructure/cibo_phase22_turtle_v2_dependencies.py'
      - 'tests/infrastructure/test_cibo_phase22_turtle_v2_dependencies.py'
  pull_request:
    paths:
      - '.github/workflows/cibo-phase22-turtle-v2-dependency-contract.yml'
      - 'src/qore/infrastructure/cibo_phase22_turtle_v2_dependencies.py'
      - 'tests/infrastructure/test_cibo_phase22_turtle_v2_dependencies.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Prove lineage rebinding without reading V2 outcomes
        run: |
          ruff check \
            src/qore/infrastructure/cibo_phase22_turtle_v2_dependencies.py \
            tests/infrastructure/test_cibo_phase22_turtle_v2_dependencies.py
          mypy src/qore/infrastructure/cibo_phase22_turtle_v2_dependencies.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_phase22_turtle_v2_dependencies.py
