name: QORE VT31 NAS100 R5 Causal Targeted Management Frontier V1

on:
  push:
    branches:
      - agent/vt31-nas100-intelligence-pilot-001
    paths:
      - scripts/vt31_nas100_r5_corrective_management_frontier_v1.py
      - scripts/vt31_nas100_r5_causal_targeted_management_frontier_v1.py
      - .github/workflows/vt31-nas100-r5-causal-targeted-management-frontier-v1.yml
  pull_request:
    paths:
      - scripts/vt31_nas100_r5_corrective_management_frontier_v1.py
      - scripts/vt31_nas100_r5_causal_targeted_management_frontier_v1.py
      - .github/workflows/vt31-nas100-r5-causal-targeted-management-frontier-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed_holdout
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Static gate
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_r5_corrective_management_frontier_v1.py
          python -m py_compile scripts/vt31_nas100_r5_causal_targeted_management_frontier_v1.py
          ruff check scripts/vt31_nas100_r5_corrective_management_frontier_v1.py
          ruff check scripts/vt31_nas100_r5_causal_targeted_management_frontier_v1.py

      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"

      - name: Run causal targeted management frontier
        run: |
          set -euo pipefail
          python scripts/vt31_nas100_r5_causal_targeted_management_frontier_v1.py             "input/${EVIDENCE_PATH}"             --partition "$PARTITION"             --output "result/targeted-management-${PARTITION}.json"             | tee "result/summary-${PARTITION}.json"

      - name: Governance gate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          partition = os.environ["PARTITION"]
          p = json.loads(
              Path(f"result/targeted-management-{partition}.json").read_text()
          )
          assert p["base_profile"] == "ALLOC_G_CORE_FAMILY_050"
          g = p["governance"]
          assert g["consumed_evidence_only"] is True
          assert g["predeclared_negative_context_management_only"] is True
          assert g["core_management_changed"] is False
          assert g["positive_context_management_changed"] is False
          assert g["entry_changed"] is False
          assert g["structural_stop_changed"] is False
          assert g["structural_target_identity_changed"] is False
          assert g["uses_terminal_pnl_at_runtime"] is False
          assert g["uses_fold_identity_at_runtime"] is False
          assert g["uses_calendar_time_at_runtime"] is False
          assert g["opens_new_holdout"] is False
          assert g["policy_promoted"] is False
          assert g["candidate_certified"] is False
          assert g["live_authorized"] is False
          assert g["production_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-r5-targeted-management-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-nas100-r5-targeted-management-*-${{ github.sha }}
          path: input
          merge-multiple: true

      - name: Aggregate targeted management frontier
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from pathlib import Path

          folds = {}
          for path in Path("input").glob("targeted-management-*.json"):
              payload = json.loads(path.read_text())
              folds[payload["partition"]] = payload
          assert set(folds) == {"r5", "r6", "r8", "consumed_holdout"}

          variants = set(next(iter(folds.values()))["variants"])
          passing = []
          summary = {}
          for variant in sorted(variants):
              per_fold = {}
              all_pass = True
              for fold, payload in sorted(folds.items()):
                  item = payload["variants"][variant]
                  passed = bool(item["passes_all_objectives"])
                  all_pass = all_pass and passed
                  per_fold[fold] = {
                      "trade_count": item["trade_count"],
                      "partial_applied_count": item["partial_applied_count"],
                      "shielded_trade_count": item["shielded_trade_count"],
                      "metrics": item["metrics"],
                      "monte_carlo": item["monte_carlo"],
                      "annual_blocks": item["annual_blocks"],
                      "partial_r": item["partial_r"],
                      "shield_multiplier": item["shield_multiplier"],
                      "regime_overlay": item["regime_overlay"],
                      "objectives": item["objectives"],
                      "passes_all_objectives": passed,
                  }
              if all_pass:
                  passing.append(variant)
              summary[variant] = per_fold

          report = {
              "schema": (
                  "qore.vt31.nas100.r5.causal_targeted_management_frontier."
                  "aggregate.v1"
              ),
              "base_profile": "ALLOC_G_CORE_FAMILY_050",
              "development_passing": passing,
              "variant_summary": summary,
              "governance": {
                  "consumed_evidence_only": True,
                  "policy_promoted": False,
                  "opens_new_holdout": False,
                  "candidate_certified": False,
              },
          }
          Path("result/aggregate.json").write_text(
              json.dumps(report, sort_keys=True, indent=2) + "\n"
          )
          print(json.dumps(report, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-r5-targeted-management-aggregate-${{ github.sha }}
          path: result/
          retention-days: 90
