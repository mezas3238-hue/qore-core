name: QORE CIBO Independent Gate on Sovereign Transfer 20261008
on:
  workflow_dispatch:
  push:
    branches: [agent/cibo-dual-dd-context-defense-20261008-001]
    paths: [.github/workflows/cibo-sovereign-transfer-independent-gate-20261008.yml]
permissions:
  contents: read
  actions: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable transfer pilot receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/transfer
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/11546521595/zip" > /tmp/transfer/results.zip
          echo "58a88e89b418023445c3a934db034496a70db70ce176b8ea45b3ca36c06a19ad  /tmp/transfer/results.zip" | sha256sum -c -
          unzip -q /tmp/transfer/results.zip -d /tmp/transfer
      - name: Validate three independent sovereignty layers and research DD
        run: |
          set -euo pipefail
          python scripts/cibo_replay_integrity_gate.py \
            /tmp/transfer/baseline.json \
            /tmp/transfer/transfer-zero-m2-reclaim.json \
            /tmp/transfer/transfer-floor-m2-reclaim.json \
            --research-report-only --output /tmp/transfer/transfer-independent-gate.json
          python - <<'PY'
          import json
          data={x["source"].rsplit("/",1)[-1]:x for x in json.load(open("/tmp/transfer/transfer-independent-gate.json"))}
          baseline=data["baseline.json"]; zero=data["transfer-zero-m2-reclaim.json"]; floor=data["transfer-floor-m2-reclaim.json"]
          assert not baseline["sovereign_integrity_pass"]
          assert not zero["sovereign_integrity_pass"], "zero bank is not floor protection"
          assert floor["sovereign_integrity_pass"], "floor variant must fully preserve treasury"
          assert floor["checks"]["total_capital_reconciled"]
          assert floor["checks"]["terminal_capital_floor"]
          assert floor["checks"]["all_entries_preserved"]
          assert not floor["checks"]["max_dd_target"]
          assert not floor["replay_prerequisites_pass"]
          assert not floor["certified"]
          print("TRANSFER_INDEPENDENT_GATE_SUCCESS: floor-protected, research-only, DD still exceeds 25 pct")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cibo-sovereign-transfer-independent-gate-${{ github.run_id }}
          path: /tmp/transfer/transfer-independent-gate.json
          retention-days: 90
