name: CIBO P0 Native MAX Sealed Manifest Cognition Smoke
on:
  push:
    branches: [agent/cibo-p0-replay-qdle-persistence-20261009]
    paths:
      - "scripts/cibo_p0_native_replay_runtime.py"
      - "scripts/cibo_p0_native_manifest_smoke.py"
      - ".github/workflows/cibo-p0-native-max-manifest-smoke.yml"
permissions:
  contents: read
  actions: read
jobs:
  actual-manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      PYTHONPATH: src:scripts
      QORE_LIVE_TRADING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Get original sealed 3368 Trader opportunities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/11451743578/zip" > "$RUNNER_TEMP/native/manifest.zip"
          echo "d439957f21e2f79148b5a2fb75a53db6fa448698f17aeb6978f379ed3547f7ea  $RUNNER_TEMP/native/manifest.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/native/manifest.zip" walk-forward-manifest.json -d "$RUNNER_TEMP/native"
      - name: Execute genuine Native MAX CF01-CF19 for first of each trader
        run: |
          test "$QORE_LIVE_TRADING" = false
          python scripts/cibo_p0_native_manifest_smoke.py \
            --manifest "$RUNNER_TEMP/native/walk-forward-manifest.json" \
            --output "$RUNNER_TEMP/native/cognitive-smoke.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-native-max-causal-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/native/cognitive-smoke.json
          if-no-files-found: warn
