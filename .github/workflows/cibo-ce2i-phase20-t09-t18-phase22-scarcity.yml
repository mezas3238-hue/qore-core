name: QORE CIBO T09 T18 Phase22 True Scarcity Lineage

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-ce2i-phase20-t09-t18-phase22-scarcity.yml'
      - 'src/qore/infrastructure/cibo_ce2i_phase20_t09_t18_phase22_true_scarcity_lineage.py'
      - 'tests/infrastructure/test_cibo_ce2i_phase20_t09_t18_phase22_true_scarcity_lineage.py'
      - 'docs/research/CIBO-T09-T18-TRUE-SCARCITY-LINEAGE-V1.md'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  phase22-true-scarcity-lineage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: T09/T18 Phase22 true scarcity lineage
        run: |
          ruff check \
            src/qore/infrastructure/cibo_ce2i_phase20_t09_t18_phase22_true_scarcity_lineage.py \
            tests/infrastructure/test_cibo_ce2i_phase20_t09_t18_phase22_true_scarcity_lineage.py
          mypy \
            src/qore/infrastructure/cibo_ce2i_phase20_t09_t18_phase22_true_scarcity_lineage.py
          python -m py_compile \
            src/qore/infrastructure/cibo_ce2i_phase20_t09_t18_phase22_true_scarcity_lineage.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_ce2i_phase20_t09_t18_phase22_true_scarcity_lineage.py
