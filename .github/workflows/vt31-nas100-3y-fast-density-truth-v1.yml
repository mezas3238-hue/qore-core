name: QORE VT31 NAS100 3Y Fast Density Truth V1

on:
  push:
    branches:
      - agent/vt31-edge-position-cert-b-001
    paths:
      - scripts/vt31_nas100_3y_relax_all_four_fast_density_v1.py
      - .github/workflows/vt31-nas100-3y-fast-density-truth-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  trader-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research runtime
        run: pip install -e ".[dev]"
      - name: Static gates
        run: |
          python -m py_compile scripts/vt31_nas100_3y_relax_all_four_fast_density_v1.py
          ruff check scripts/vt31_nas100_3y_relax_all_four_fast_density_v1.py
      - name: Recover canonical 3Y evidence
        run: |
          set -euo pipefail
          artifact_name="qore-vt31-nas100-owner-3y-base-v1"
          artifact_id="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100"             --jq '[.artifacts[] | select(.expired == false)][0].id')"
          test -n "$artifact_id"
          mkdir -p input/NAS100 result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > evidence.zip
          unzip -q evidence.zip -d input
      - name: Compute exact density attrition
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python scripts/vt31_nas100_3y_relax_all_four_fast_density_v1.py             input/NAS100/market-evidence.json             --output result/fast-density-truth.json             | tee result/fast-density-summary.json
      - name: Governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("result/fast-density-truth.json").read_text())
          assert x["base_id"] == "VT31_NAS100_OWNER_3Y_BASE_001"
          assert x["selection_map_parity"] is True
          g=x["governance"]
          assert g["post_entry_cognitive_exit_economics_included"] is False
          assert g["outcome_used_for_admission_action"] is False
          assert g["future_information_used_for_admission_action"] is False
          assert g["sizing_or_leverage_used"] is False
          assert g["policy_promoted"] is False
          PY
      - name: Bind result
        run: |
          echo "$GITHUB_SHA" > result/git-sha.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-3y-fast-density-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
