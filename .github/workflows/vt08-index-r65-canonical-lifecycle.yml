name: VT08 Index R65 Canonical Lifecycle

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r65-canonical-lifecycle.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r65_canonical_lifecycle.py
      - src/qore/infrastructure/research_frozen_oos_evidence.py
      - src/qore/infrastructure/research_block_bootstrap.py
      - tests/infrastructure/test_research_performance_statistics.py
      - src/qore/infrastructure/robustness_trader_lab_authority.py
      - src/qore/infrastructure/research_performance_statistics.py
      - tests/infrastructure/test_research_block_bootstrap.py
      - tests/infrastructure/test_research_frozen_oos_evidence.py
      - tests/infrastructure/trader_lab/test_vt08_index_r65_canonical_lifecycle.py
      - src/qore/infrastructure/trader_lab/vt08_index_r64_canonical_economic_binding.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: >-
          pytest -q
          tests/infrastructure/trader_lab/test_vt08_index_r65_canonical_lifecycle.py
          tests/infrastructure/test_research_performance_statistics.py
          tests/infrastructure/test_research_frozen_oos_evidence.py

  lifecycle:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Build R65 canonical lifecycle
        run: |
          python -m qore.infrastructure.trader_lab.vt08_index_r65_canonical_lifecycle \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r65-canonical-lifecycle.json

      - name: Verify governed qualification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r65-canonical-lifecycle.json"
              ).read_text()
          )
          assert report["decision"] == (
              "PASS_R65_DEMO_ELIGIBLE_FORWARD_VALIDATION_REQUIRED"
          )
          assert report["r64_reconciliation"]["combined_sample"] == 3465
          assert report["r64_reconciliation"]["exact_match"] is True
          assert report["lifecycle"]["state"] == "demo_eligible"
          assert report["lifecycle"]["completed_stages"] == [
              "research",
              "replay",
              "fast_forward",
              "oos",
              "stress",
              "monte_carlo",
              "risk_review",
              "cibo_review",
              "independent_validation",
              "economic_evidence",
          ]
          assert report["stress"]["decision"] == "approved"
          assert report["monte_carlo"]["status"] == "qualified"
          assert report["governance"]["demo_eligible"] is True
          assert report["governance"]["trader_certified"] is False
          assert report["governance"]["forward_shadow_validation_required"] is True
          assert report["governance"]["live_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-index-r65-canonical-lifecycle-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
