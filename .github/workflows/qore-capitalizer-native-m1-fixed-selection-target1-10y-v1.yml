name: QORE Capitalizer Native M1 Fixed Selection Target1 10Y V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-native-m1-fixed-selection-target1-10y-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_native_m1_fixed_selection_target1_10y_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_native_m1_fixed_selection_target1_10y_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: '35548099334'
  SOURCE_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_native_m1_fixed_selection_target1_10y_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_native_m1_fixed_selection_target1_10y_v1.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_native_m1_fixed_selection_target1_10y_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_native_m1_fixed_selection_target1_10y_v1.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {symbol: USDJPY, session: ASIA}
          - {symbol: AUDJPY, session: ASIA}
          - {symbol: AUDUSD, session: ASIA}
          - {symbol: GBPJPY, session: ASIA}
          - {symbol: EURUSD, session: LONDON}
          - {symbol: GBPUSD, session: LONDON}
          - {symbol: XAUUSD, session: NEW_YORK}
          - {symbol: USDCAD, session: NEW_YORK}
          - {symbol: NAS100, session: NEW_YORK}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download frozen native-M1 replay ledger
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-native-m1-entry-replay-${{ matrix.symbol }}-${{ env.SOURCE_SHA }}
          path: replay-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download immutable native M1
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Reprice exact native-M1 selections at 1R
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_native_m1_fixed_selection_target1_10y_v1 \
            market replay-source m1-source target1-output \
            --session ${{ matrix.session }}
      - name: Enforce fixed-selection boundary
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
          EXPECTED_SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"]
          report = json.loads(
              (
                  Path("target1-output")
                  / f"capitalizer-{symbol.lower()}-native-m1-fixed-selection-target1-10y-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_NATIVE_M1_FIXED_SELECTION_TARGET1_10Y_V1"
          )
          assert report["symbol"] == symbol
          assert report["session"] == os.environ["EXPECTED_SESSION"]
          assert report["target_r"] == "1.00"
          assert report["fixed_source_entries"] == report["repriced_entries"]
          assert report["selection_changed"] is False
          assert report["entry_changed"] is False
          assert report["stop_changed"] is False
          assert report["m1_structure_changed"] is False
          assert report["only_target_r_changed"] is True
          assert report["new_entries_allowed"] is False
          assert report["entry_timeframe"] == "M1_NATIVE"
          assert report["m1_mss_required"] is True
          assert report["m1_fvg_required"] is True
          assert report["m1_order_block_required"] is True
          assert report["fresh_holdout_claimed"] is False
          assert report["outcome_used_for_admission"] is False
          assert report["automatic_promotion_allowed"] is False
          assert report["source_faithful_ftm_route_claimed"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-native-m1-fixed-selection-target1-10y-v1-${{ matrix.symbol }}-${{ github.sha }}
          path: target1-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-native-m1-fixed-selection-target1-10y-v1-*-${{ github.sha }}
          path: target1-input
          merge-multiple: false
      - name: Build dense native-M1 target1 matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_native_m1_fixed_selection_target1_10y_v1 \
            matrix target1-input matrix-output
      - name: Enforce aggregate controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "matrix-output/"
                  "capitalizer-nine-market-native-m1-fixed-selection-target1-10y-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_NINE_MARKET_NATIVE_M1_FIXED_SELECTION_TARGET1_10Y_V1"
          )
          assert report["market_count"] == 9
          assert report["target_r"] == "1.00"
          assert report["raw_trades"] == 21696
          assert report["max3_trades"] == 16600
          assert report["selection_changed"] is False
          assert report["entry_changed"] is False
          assert report["stop_changed"] is False
          assert report["m1_structure_changed"] is False
          assert report["only_target_r_changed"] is True
          assert report["new_entries_allowed"] is False
          assert report["fresh_holdout_claimed"] is False
          assert report["outcome_used_for_admission"] is False
          assert report["automatic_promotion_allowed"] is False
          assert report["source_faithful_ftm_route_claimed"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-nine-market-native-m1-fixed-selection-target1-10y-v1-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
