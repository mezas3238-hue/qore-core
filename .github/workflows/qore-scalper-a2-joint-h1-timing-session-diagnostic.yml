name: QORE Scalper A2 H1 Bias Timing Session Joint Diagnosis

on:
  push:
    branches:
      - agent/scalper-architect-b-methodology-20261010
    paths:
      - '.github/workflows/qore-scalper-a2-joint-h1-timing-session-diagnostic.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_h1_timing_session_diagnostic_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_scalper_h1_timing_session_diagnostic_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: scalper-a2-h1-bias-session-diagnosis-${{ github.ref }}
  cancel-in-progress: true

env:
  CONTROL_RUN: '38053946695'
  CONTROL_SHA: 'e356e7a52541e99533b25ecfef0ab9c4e9ce03c0'
  NATIVE_M1_RUN: '35548099334'
  NATIVE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'
  ORIGINAL_MFE_RUN: '38057290884'
  ORIGINAL_MFE_SHA: '6ca33be13e23cdcb5288f40a5326955ab1274215'

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Validate as-of H1 phase and DST session horizon, keep outcomes isolated
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_scalper_h1_timing_session_diagnostic_v1.py tests/infrastructure/trader_lab/test_capitalizer_scalper_h1_timing_session_diagnostic_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_scalper_h1_timing_session_diagnostic_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_scalper_h1_timing_session_diagnostic_v1.py

  market:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol: [USDJPY, AUDJPY, AUDUSD, GBPJPY, EURUSD, GBPUSD, XAUUSD, USDCAD, NAS100]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Load exact frozen source V49 9-market historical economic opportunities
        uses: actions/download-artifact@v4
        with:
          name: scalper-a2-v49-control-${{ matrix.symbol }}-${{ env.CONTROL_SHA }}
          path: original-v49
          github-token: ${{ github.token }}
          run-id: ${{ env.CONTROL_RUN }}
      - name: Load matching native provider M1 only
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.NATIVE_M1_SHA }}
          path: native-m1
          github-token: ${{ github.token }}
          run-id: ${{ env.NATIVE_M1_RUN }}
      - name: Load actual V49 same-bar-uncertainty excursion forensic ledger
        uses: actions/download-artifact@v4
        with:
          name: scalper-a2-mfe-mae-${{ matrix.symbol }}-${{ env.ORIGINAL_MFE_SHA }}
          path: original-mfe
          github-token: ${{ github.token }}
          run-id: ${{ env.ORIGINAL_MFE_RUN }}
      - name: Prove matching M1 provider and source artifact contract
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          m=json.loads(Path("native-m1/m1-clone-manifest.json").read_text())
          assert m["canonical_symbol"]==os.environ["EXPECTED_SYMBOL"]
          assert m["provider_native_m1"] is True
          assert m["synthetic_m1"] is False and m["interpolated_m1"] is False
          assert m["contradictory_m1"] == 0 and m["read_only"] is True
          f=json.loads(Path("original-mfe/scalper-a2-mfe-mae-market.json").read_text())
          assert f["symbol"]==os.environ["EXPECTED_SYMBOL"]
          assert f["hindsight_only"] is True and f["live_authorized"] is False
          PY
      - name: Reconstruct native M1 full source-exit MFE and as-of H1 session timing
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_h1_timing_session_diagnostic_v1 market original-v49 native-m1 original-mfe market-output
      - name: Check market source identity and no policy mutation
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path("market-output/scalper-h1-timing-market.json").read_text())
          assert r["symbol"]==os.environ["EXPECTED_SYMBOL"]
          assert r["source_opportunities"]==r["joined_trade_and_mfe_rows"]
          assert r["no_input_changed"] is True
          assert r["h1_range_position"]=="ASOF_PARTIAL_H1_RANGE_NOT_FINAL_H1"
          assert not r["trader_certified"] and not r["live_authorized"]
          print("H1 TIMING MARKET",r)
          PY
      - name: Publish per-source H1 bias, clock, session, MFE and future research labels
        uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-h1-timing-${{ matrix.symbol }}-${{ github.sha }}
          path: market-output/
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Fetch nine native-M1 H1 decision and post hoc direction pairs
        uses: actions/download-artifact@v4
        with:
          pattern: scalper-a2-h1-timing-*-${{ github.sha }}
          path: matched-market-evidence
          merge-multiple: false
      - name: Reconcile 2876 original source IDs and exactly 2020 chronological MAX3
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_h1_timing_session_diagnostic_v1 matrix matched-market-evidence matrix-output
      - name: Review H1 decision phase versus outcomes without trading gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("matrix-output/scalper-h1-timing-nine-market.json").read_text())
          assert r["market_count"]==9 and r["original_source_opportunities"]==2876
          assert r["max3_selected_source_opportunities"]==2020
          assert r["clock_phase_asof"] is True
          assert r["partial_h1_range_not_future_h1"] is True
          assert r["future_15_30_60_prices_posthoc_only"] is True
          assert r["no_trade_outcome_used_for_admission"] is True
          assert r["no_policy_mutated"] is True
          assert not r["trader_certified"] and not r["live_authorized"]
          print("H1 JOINT ORIGINAL",r["selected"])
          for dim in ("h1_clock_third","h1_partial_range_third","runway_bucket","h1_age_bucket","session","market","trigger_family","exit_reason"):
              for name,data in r["selected_by"][dim].items():
                  print("H1 JOINT SEGMENT",dim,name,data)
          PY
      - name: Archive no-lookahead diagnostic with nine-market census
        uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-h1-bias-timing-session-matrix-${{ github.sha }}
          path: matrix-output/
          retention-days: 90
          if-no-files-found: error
