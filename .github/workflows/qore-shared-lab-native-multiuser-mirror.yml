name: QORE Shared Lab Native Multiuser Mirror

on:
  push:
    branches:
      - agent/qore-shared-lab-001
    paths:
      - pyproject.toml
      - src/qore/infrastructure/core_stack_v2/shared_lab_cancel.py
      - src/qore/infrastructure/core_stack_v2/shared_lab_native_*.py
      - src/qore/infrastructure/core_stack_v2/shared_lab_orchestrator.py
      - src/qore/infrastructure/core_stack_v2/shared_lab_repo_runtime.py
      - src/qore/infrastructure/core_stack_v2/shared_lab_scheduler.py
      - src/qore/infrastructure/core_stack_v2/shared_lab_scheduler_server.py
      - src/qore/infrastructure/core_stack_v2/shared_lab_store.py
      - src/qore/infrastructure/core_stack_v2/shared_lab_suite_registry.py
      - src/qore/infrastructure/core_stack_v2/shared_lab_publisher.py
      - src/qore/infrastructure/core_stack_v2/shared_lab_cli.py
      - tests/infrastructure/test_core_stack_v2_shared_lab_native_*.py
      - tests/infrastructure/test_core_stack_v2_shared_lab_orchestrator.py
      - tests/infrastructure/test_core_stack_v2_shared_lab_repo_runtime.py
      - tests/infrastructure/test_core_stack_v2_shared_lab_scheduler.py
      - tests/infrastructure/test_core_stack_v2_shared_lab_store.py
      - tests/infrastructure/test_core_stack_v2_shared_lab_suite_registry.py
      - scripts/shared_lab_multiuser_native_acceptance.py
      - .github/workflows/qore-shared-lab-native-multiuser-mirror.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-multiuser-mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Native-plane Ruff
        run: |
          ruff check \
            src/qore/infrastructure/core_stack_v2/shared_lab_cancel.py \
            src/qore/infrastructure/core_stack_v2/shared_lab_native_*.py \
            src/qore/infrastructure/core_stack_v2/shared_lab_orchestrator.py \
            src/qore/infrastructure/core_stack_v2/shared_lab_repo_runtime.py \
            src/qore/infrastructure/core_stack_v2/shared_lab_scheduler.py \
            src/qore/infrastructure/core_stack_v2/shared_lab_scheduler_server.py \
            src/qore/infrastructure/core_stack_v2/shared_lab_store.py \
            src/qore/infrastructure/core_stack_v2/shared_lab_suite_registry.py \
            src/qore/infrastructure/core_stack_v2/shared_lab_publisher.py \
            src/qore/infrastructure/core_stack_v2/shared_lab_cli.py \
            tests/infrastructure/test_core_stack_v2_shared_lab_native_*.py \
            tests/infrastructure/test_core_stack_v2_shared_lab_orchestrator.py \
            tests/infrastructure/test_core_stack_v2_shared_lab_repo_runtime.py \
            tests/infrastructure/test_core_stack_v2_shared_lab_scheduler.py \
            tests/infrastructure/test_core_stack_v2_shared_lab_store.py \
            tests/infrastructure/test_core_stack_v2_shared_lab_suite_registry.py \
            scripts/shared_lab_multiuser_native_acceptance.py
      - name: Native-plane Mypy
        run: |
          mypy \
            src/qore/infrastructure/core_stack_v2/shared_lab_cancel.py \
            src/qore/infrastructure/core_stack_v2/shared_lab_native_*.py \
            src/qore/infrastructure/core_stack_v2/shared_lab_orchestrator.py \
            src/qore/infrastructure/core_stack_v2/shared_lab_repo_runtime.py \
            src/qore/infrastructure/core_stack_v2/shared_lab_scheduler.py \
            src/qore/infrastructure/core_stack_v2/shared_lab_scheduler_server.py \
            src/qore/infrastructure/core_stack_v2/shared_lab_store.py \
            src/qore/infrastructure/core_stack_v2/shared_lab_suite_registry.py \
            src/qore/infrastructure/core_stack_v2/shared_lab_publisher.py \
            src/qore/infrastructure/core_stack_v2/shared_lab_cli.py
      - name: Native-plane unit and integration tests
        run: |
          pytest -q \
            tests/infrastructure/test_core_stack_v2_shared_lab_native_model.py \
            tests/infrastructure/test_core_stack_v2_shared_lab_native_replay.py \
            tests/infrastructure/test_core_stack_v2_shared_lab_native_completion.py \
            tests/infrastructure/test_core_stack_v2_shared_lab_orchestrator.py \
            tests/infrastructure/test_core_stack_v2_shared_lab_repo_runtime.py \
            tests/infrastructure/test_core_stack_v2_shared_lab_scheduler.py \
            tests/infrastructure/test_core_stack_v2_shared_lab_store.py \
            tests/infrastructure/test_core_stack_v2_shared_lab_suite_registry.py
      - name: Nine-client native E2E acceptance
        run: |
          python scripts/shared_lab_multiuser_native_acceptance.py \
            --state-dir result/shared-lab-multiuser-native \
            --output result/shared-lab-multiuser-native/acceptance.json
      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-lab-multiuser-native-${{ github.sha }}
          path: result/shared-lab-multiuser-native/
          if-no-files-found: error
          retention-days: 90
