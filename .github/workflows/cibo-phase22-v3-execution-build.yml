name: QORE CIBO Phase22 V3 Execution Build

on:
  push:
    branches:
      - agent/cibo-v3-execution-build-001
      - agent/cibo-integrator-ab-001
    paths:
      - 'src/qore/infrastructure/cibo_phase22_v3_*.py'
      - 'scripts/cibo_phase22_v3_*.py'
      - '.github/workflows/cibo-phase22-v3-execution-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Static quality
        run: |
          python -m ruff check \
            src/qore/infrastructure/cibo_phase22_v3_execution_manifest.py \
            src/qore/infrastructure/cibo_phase22_v3_execution_authorization.py \
            src/qore/infrastructure/cibo_phase22_v3_one_shot_claim.py \
            src/qore/infrastructure/cibo_phase22_v3_git_durable_claim.py \
            src/qore/infrastructure/cibo_phase22_v3_vt31_source.py \
            src/qore/infrastructure/cibo_phase22_v3_vt08_fresh_runner.py \
            src/qore/infrastructure/cibo_phase22_v3_fresh_batch.py \
            src/qore/infrastructure/cibo_phase22_v3_fresh_evidence.py \
            src/qore/infrastructure/cibo_phase22_v3_fresh_batch_assembly.py \
            scripts/cibo_phase22_v3_vt31_fresh_runner.py \
            scripts/cibo_phase22_v3_turtle_window_replay.py \
            scripts/cibo_phase22_v3_fresh_batch_assembler.py
      - name: Import every V3 execution surface
        run: |
          python - <<'PY'
          modules = (
              "qore.infrastructure.cibo_phase22_v3_execution_manifest",
              "qore.infrastructure.cibo_phase22_v3_execution_authorization",
              "qore.infrastructure.cibo_phase22_v3_one_shot_claim",
              "qore.infrastructure.cibo_phase22_v3_git_durable_claim",
              "qore.infrastructure.cibo_phase22_v3_vt31_source",
              "qore.infrastructure.cibo_phase22_v3_vt08_fresh_runner",
              "qore.infrastructure.cibo_phase22_v3_fresh_batch",
              "qore.infrastructure.cibo_phase22_v3_fresh_evidence",
              "qore.infrastructure.cibo_phase22_v3_fresh_batch_assembly",
          )
          for name in modules:
              __import__(name)
          PY
      - name: Prove pre-outcome V3 manifest and authorization
        run: |
          python - <<'PY'
          from qore.infrastructure.cibo_phase22_next_exam_governance import (
              NEXT_CANDIDATE_ID,
          )
          from qore.infrastructure.cibo_phase22_v3_execution_authorization import (
              build_phase22_v3_execution_authorization,
          )
          from qore.infrastructure.cibo_phase22_v3_execution_manifest import (
              build_phase22_v3_execution_manifest,
          )

          manifest = build_phase22_v3_execution_manifest()
          assert manifest.candidate_id == NEXT_CANDIDATE_ID
          assert manifest.fresh_outcomes_executed is False
          assert manifest.broker_mutation_authorized is False
          auth = build_phase22_v3_execution_authorization(
              owner_authorization_id="OWNER_BUILD_TEST",
              authorized_parent_head_sha="a" * 40,
          )
          assert auth.fresh_holdout_execution_authorized is True
          assert auth.one_shot_only is True
          assert auth.second_execution_authorized is False
          assert auth.broker_mutation_authorized is False
          assert auth.live_authorized is False
          assert auth.real_capital_authorized is False
          PY
      - name: Prove VT31 censored geometry selection is outcome-blind
        run: |
          python - <<'PY'
          from scripts.cibo_phase22_v3_vt31_fresh_runner import (
              _partition_executable_geometry,
          )

          rows = [
              {
                  "entry": None,
                  "initial_stop": None,
                  "structural_target": None,
                  "r_multiple": "999",
              },
              {
                  "entry": "100",
                  "initial_stop": "99",
                  "structural_target": "102",
                  "r_multiple": "-999",
              },
          ]
          selected, censored = _partition_executable_geometry(rows)
          assert censored == 1
          assert len(selected) == 1
          rows[0]["r_multiple"] = "-999999"
          rows[1]["r_multiple"] = "999999"
          selected2, censored2 = _partition_executable_geometry(rows)
          assert censored2 == 1
          assert len(selected2) == 1
          PY
      - name: Existing V3 governance regression
        run: |
          python -m pytest -q \
            tests/infrastructure/test_cibo_phase22_v3_source_receipt.py \
            tests/infrastructure/test_cibo_phase22_v3_execution_authorization.py \
            tests/infrastructure/test_cibo_phase22_next_exam_governance.py
