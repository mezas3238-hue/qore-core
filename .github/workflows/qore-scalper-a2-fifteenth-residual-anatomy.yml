name: QORE Scalper A2 Audit15 Residual Anatomy 9 Market

on:
  push:
    branches:
      - agent/scalper-architect-b-methodology-20261010
    paths:
      - '.github/workflows/qore-scalper-a2-fifteenth-residual-anatomy.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_a2_fifteenth_residual_anatomy_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_scalper_a2_fifteenth_residual_anatomy_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  ECON_RUN: '38102352779'
  ECON_SHA: 'b4d35fe99b99a96dac3728610258fe5a4ab20c15'

jobs:
  all-nine:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Frozen economic diagnostics guards
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_scalper_a2_fifteenth_residual_anatomy_v1.py tests/infrastructure/trader_lab/test_capitalizer_scalper_a2_fifteenth_residual_anatomy_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_scalper_a2_fifteenth_residual_anatomy_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_scalper_a2_fifteenth_residual_anatomy_v1.py
      - uses: actions/download-artifact@v4
        with:
          pattern: scalper-a2-audit14-gross-*-${{ env.ECON_SHA }}
          path: books
          github-token: ${{ github.token }}
          run-id: ${{ env.ECON_RUN }}
      - name: Classify immutable 60 failures, 73 out, 50 in, 32 winner flips by family market session
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_a2_fifteenth_residual_anatomy_v1 books output
      - name: Conservation of all MAX3 source IDs without optimizing after outcome
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("output/scalper-a2-audit15-residual-anatomy-nine-market.json").read_text())
          assert r["source_ids"]==2876 and r["baseline_max3"]==2020
          assert r["online_max3"]==1997 and r["winner_to_loser_n"]==32
          assert r["invalid_source_breakdown"]["INVALID_M15_STOP"]["n"]==36
          assert r["invalid_source_breakdown"]["NO_H1_TARGET"]["n"]==24
          assert r["max3_removed"]["n"]==73 and r["max3_added"]["n"]==50
          assert not r["outcome_based_filtering"] and not r["certified"]
          print("AUDIT15 REPRODUCIBLE RESIDUAL ANATOMY",r["target_and_stop_geometry"]["all_online"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-audit15-residual-nine-market-${{ github.sha }}
          path: output/
          retention-days: 90
          if-no-files-found: error
