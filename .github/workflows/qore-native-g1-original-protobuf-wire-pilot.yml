name: QORE Native G1 original protobuf tick wire fidelity and FX zero source pilot

on:
  push:
    branches:
      - research/qore-native-g1-zero-spread-native-wire-fidelity-20261012
    paths:
      - '.github/workflows/qore-native-g1-original-protobuf-wire-pilot.yml'
      - 'src/qore/infrastructure/trader_lab/qore_native_g1_proto_wire_5market_pilot_v1.py'
      - 'tests/infrastructure/trader_lab/test_qore_native_g1_proto_wire_5market_pilot_v1.py'
      - 'docs/research/QORE_NATIVE_G1_WIRE_ZERO_SPREAD_PREREG_2026-10-12.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qore-native-g1-original-protobuf-tick-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frozen_wire_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,ctrader]'
      - name: Fail-closed native protobuf framing and source-only unit gates
        run: |
          set -euo pipefail
          test -s docs/research/QORE_NATIVE_G1_WIRE_ZERO_SPREAD_PREREG_2026-10-12.md
          ruff check --select F,E4,E7,E9 src/qore/infrastructure/trader_lab/qore_native_g1_proto_wire_5market_pilot_v1.py tests/infrastructure/trader_lab/test_qore_native_g1_proto_wire_5market_pilot_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_qore_native_g1_proto_wire_5market_pilot_v1.py
          echo "SOURCE FORMAT CONTRACT ONLY — NO MARKET PNL"

  real_native_wire_source:
    needs: frozen_wire_contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QORE_CTRADER_DEMO_CLIENT_ID: ${{ secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
      QORE_CTRADER_DEMO_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
      QORE_CTRADER_DEMO_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
      QORE_CTRADER_DEMO_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
      QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID }}
      QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET }}
      QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN }}
      QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[ctrader]'
      - name: Fetch only 5 frozen market source 2x30-minute windows with account-free native ProtoOATickData wire witness
        run: |
          set -euo pipefail
          python -m qore.infrastructure.trader_lab.qore_native_g1_proto_wire_5market_pilot_v1 original-proto-source
      - name: Retain source tick fields plus SHA, NEVER print or commit prices into Git
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qore-native-G1-original-tick-field-proto-wire-NOT-NET-${{ github.sha }}
          path: original-proto-source/
          retention-days: 90
          if-no-files-found: warn
          compression-level: 6
