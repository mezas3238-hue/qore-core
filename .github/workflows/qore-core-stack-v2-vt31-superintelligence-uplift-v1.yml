name: QORE Core Stack V2 VT31 Superintelligence Uplift Lab V1

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - scripts/vt31_core_stack_v2_superintelligence_uplift_lab_v1.py
      - .github/workflows/qore-core-stack-v2-vt31-superintelligence-uplift-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  uplift:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Static gate
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_core_stack_v2_superintelligence_uplift_lab_v1.py
          ruff check scripts/vt31_core_stack_v2_superintelligence_uplift_lab_v1.py
      - name: Recover immutable certified 5Y evidence
        run: |
          set -euo pipefail
          mkdir -p input/r8 input/r6 input/r5 result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10402199719/zip" > r8.zip
          unzip -q r8.zip -d input/r8
          test -f input/r8/fresh/NAS100/market-evidence.json
          echo "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb  input/r8/fresh/NAS100/market-evidence.json" | sha256sum -c -

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10389112524/zip" > r6.zip
          unzip -q r6.zip -d input/r6
          test -f input/r6/fresh/NAS100/market-evidence.json
          echo "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581  input/r6/fresh/NAS100/market-evidence.json" | sha256sum -c -

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10380044761/zip" > r5.zip
          unzip -q r5.zip -d input/r5
          test -f input/r5/fresh/NAS100/market-evidence.json
          echo "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7  input/r5/fresh/NAS100/market-evidence.json" | sha256sum -c -
      - name: Run temporal uplift benchmark
        run: |
          set -euo pipefail
          python scripts/vt31_core_stack_v2_superintelligence_uplift_lab_v1.py             --r8 input/r8/fresh/NAS100/market-evidence.json             --r6 input/r6/fresh/NAS100/market-evidence.json             --r5 input/r5/fresh/NAS100/market-evidence.json             --output result/uplift.json             | tee result/summary.json
      - name: Governance and evidence gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/uplift.json").read_text())
          assert p["baseline_id"] == "VT31_NAS100_STRUCTURAL_TARGET_V1"
          assert p["contract_fingerprint"] == "089c41f98a72295278063cfc29caf8419538f68315d9f5e57be144fbdae15e08"
          assert p["certified_5y_baseline"]["trade_count"] == 806
          g=p["governance"]
          assert g["shared_core_order_authority"] is False
          assert g["shared_core_risk_authority"] is False
          assert g["vt31_methodology_mutated"] is False
          assert g["current_episode_future_outcome_used"] is False
          assert g["only_closed_prior_episodes_enter_memory"] is True
          assert g["cross_market_intelligence_included"] is False
          assert g["vt08_forex_touched"] is False
          assert g["live_authorized"] is False
          assert g["merge_authorized"] is False
          PY
      - name: Bind result
        run: |
          echo "$GITHUB_SHA" > result/git-sha.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd result && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-core-stack-v2-vt31-superintelligence-uplift-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
