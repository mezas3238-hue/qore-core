name: QORE VT31 NAS100 High Density Management V1

on:
  push:
    branches:
      - agent/vt31-nas100-intelligence-pilot-001
    paths:
      - scripts/vt31_nas100_high_density_management_intelligence_v1.py
      - scripts/vt31_nas100_entry_intelligence_oco_lab_v1.py
      - .github/workflows/vt31-nas100-high-density-management-v1.yml
  workflow_dispatch:

concurrency:
  group: vt31-nas100-high-density-management-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
          - partition: r8_fresh
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
    env:
      GH_TOKEN: ${{ github.token }}
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Static gate
        run: |
          set -euo pipefail
          ruff check             scripts/vt31_nas100_high_density_management_intelligence_v1.py             scripts/vt31_nas100_entry_intelligence_oco_lab_v1.py
      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p evidence result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d evidence
          path="evidence/fresh/NAS100/market-evidence.json"
          test -f "$path"
          actual="$(sha256sum "$path" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"
      - name: Run high-density management intelligence
        run: |
          set -euo pipefail
          python scripts/vt31_nas100_high_density_management_intelligence_v1.py             evidence/fresh/NAS100/market-evidence.json             --output "result/management-${PARTITION}.json"             | tee result/summary.json
      - name: Governance
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = os.environ["PARTITION"]
          payload = json.loads(
              Path(f"result/management-{p}.json").read_text()
          )
          g = payload["governance"]
          assert payload["market"] == "NAS100"
          assert g["entry_filtering_by_management_context"] is False
          assert g["context_classifier_uses_terminal_pnl"] is False
          assert g["all_contexts_remain_executable"] is True
          assert g["consumed_evidence_only"] is True
          assert g["policy_promoted"] is False
          assert g["opens_new_holdout"] is False
          assert g["live_authorized"] is False
          assert g["production_authorized"] is False
          PY
      - name: Bind result
        run: |
          echo "$GITHUB_SHA" > result/git-sha.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd result && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-high-density-management-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-nas100-high-density-management-*-${{ github.sha }}
          path: input
          merge-multiple: true
      - name: Aggregate policy comparison
        run: |
          mkdir -p result
          python - <<'PY'
          import json
          from pathlib import Path

          rows = []
          for path in sorted(Path("input").glob("management-*.json")):
              payload = json.loads(path.read_text())
              rows.append({
                  "file": path.name,
                  "first_opened_at": payload["evidence"]["first_opened_at"],
                  "last_closed_at": payload["evidence"]["last_closed_at"],
                  "oco_selected_setup_count": payload[
                      "oco_selected_setup_count"
                  ],
                  "management_context_counts": payload[
                      "management_context_counts"
                  ],
                  "policy_metrics": payload["policy_metrics"],
              })
          assert len(rows) == 3, rows
          policies = ("BASELINE", "REFERENCE_DYNAMIC", "CONTEXT_DYNAMIC")
          policy_gates = {}
          for policy in policies:
              fold_gates = []
              for row in rows:
                  metrics = row["policy_metrics"][policy]
                  stress = metrics["stress_0_05r"]
                  mc = metrics["monte_carlo"]
                  sample = int(stress["sample"])
                  fold_gates.append({
                      "sample_250_330": 250 <= sample <= 330,
                      "pf_at_least_1_50": (
                          stress["profit_factor"] is not None
                          and float(stress["profit_factor"]) >= 1.50
                      ),
                      "dd_at_most_15r": (
                          float(stress["max_drawdown_r"]) <= 15.0
                      ),
                      "mc_p95_dd_at_most_20r": (
                          float(mc["p95_max_drawdown_r"]) <= 20.0
                      ),
                      "mc_positive_at_least_0_80": (
                          float(mc["positive_terminal_probability"]) >= 0.80
                      ),
                  })
              policy_gates[policy] = {
                  "folds": fold_gates,
                  "all_folds_pass": all(
                      all(gate.values()) for gate in fold_gates
                  ),
              }
          report = {
              "schema": "qore.vt31.nas100.high_density_management.aggregate.v1",
              "target_density": "250-300-trades-per-approximately-2Y",
              "folds": rows,
              "policy_gates": policy_gates,
              "policy_promoted": False,
              "opens_new_holdout": False,
              "live_authorized": False,
              "production_authorized": False,
          }
          Path("result/high-density-management-aggregate.json").write_text(
              json.dumps(report, sort_keys=True, indent=2) + "\n"
          )
          print(json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-high-density-management-aggregate-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
