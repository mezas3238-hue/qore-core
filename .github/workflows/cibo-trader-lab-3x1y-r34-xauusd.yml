name: QORE CIBO Trader Lab 3x1Y R34 XAUUSD

on:
  push:
    branches:
      - agent/cibo-t02-science-architect-2-001
    paths:
      - '.github/workflows/cibo-trader-lab-3x1y-r34-xauusd.yml'
      - 'scripts/cibo_turtle_1y_window_invoke.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  SOURCE_SHA: '56ef138ee5ea1cde6d0bcf4c9e25e8b661c04e84'
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-XAUUSD-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-XAUUSD-2f510461b3360e91d5ee70a72716a76cd6561f16'
  MEMORY_RUN_ID: '35305338898'
  MEMORY_ARTIFACT: 'qore-turtle-soup-xauusd-cognitive-v3-r28-c35f8414ce59e26a36cdda27c2a964a426c3e5ba'
  FREEZE_RUN_ID: '35308395893'
  FREEZE_ARTIFACT: 'qore-turtle-soup-xauusd-r33-candidate-freeze-112c4f12c53299764d31c38f8e7a129f1e84305e'

jobs:
  r34-xauusd:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: trader-code

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install -e '.[dev]'

      - name: Validate research invoker
        run: |
          set -euo pipefail
          python -m py_compile scripts/cibo_turtle_1y_window_invoke.py
          ruff check scripts/cibo_turtle_1y_window_invoke.py
          test "$(git -C trader-code rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Instrument immutable R34 geometry serialization
        run: |
          set -euo pipefail
          python scripts/cibo_phase18_xauusd_geometry_patch.py             trader-code/src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r34_frozen_r33_5y_validation.py             trader-code/src/qore/infrastructure/trader_lab/cibo_phase18_xauusd_r34_geometry_replay.py
          python -m py_compile             trader-code/src/qore/infrastructure/trader_lab/cibo_phase18_xauusd_r34_geometry_replay.py

      - name: Recover immutable research inputs
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.MEMORY_ARTIFACT }}
          path: memory
          github-token: ${{ github.token }}
          run-id: ${{ env.MEMORY_RUN_ID }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.FREEZE_ARTIFACT }}
          path: freeze
          github-token: ${{ github.token }}
          run-id: ${{ env.FREEZE_RUN_ID }}

      - name: Execute three independent one-year windows
        run: |
          set -euo pipefail
          mkdir -p out
          for group in GROUP_1 GROUP_2 GROUP_3; do
            python scripts/cibo_turtle_1y_window_invoke.py               --module qore.infrastructure.trader_lab.cibo_phase18_xauusd_r34_geometry_replay               --source-code-root "$GITHUB_WORKSPACE/trader-code/src"               --trader-id R34_XAUUSD               --symbol XAUUSD               --group-id "$group"               --raw-root source               --target-root target               --memory-root memory               --freeze-root freeze               --output "out/$group"
          done

      - name: Enforce R34 3x1Y invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for group in ('GROUP_1','GROUP_2','GROUP_3'):
              p=json.loads(Path(f'out/{group}/trader-lab-1y-group-lane.json').read_text())
              assert p['trader_id']=='R34_XAUUSD'
              assert p['symbol']=='XAUUSD'
              assert p['sample_size'] > 0
              assert len(p['trades'])==p['sample_size']
              assert p['governance']['window_only_parameterized'] is True
              assert p['governance']['trader_methodology_changed'] is False
              assert p['governance']['trader_legacy_sizing_used_for_cibo'] is False
              assert p['governance']['outcome_aware_selection'] is False
              for key in ('fresh_oos_claimed','certification_claimed','broker_mutation','live','production','real_capital'):
                  assert p['governance'][key] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-trader-lab-3x1y-r34-xauusd-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 90
