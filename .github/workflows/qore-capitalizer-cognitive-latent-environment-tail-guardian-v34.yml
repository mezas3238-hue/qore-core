name: QORE Capitalizer Cognitive Latent Environment Tail Guardian V34

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/qore-capitalizer-cognitive-latent-environment-tail-guardian-v34.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_cognitive_latent_environment_tail_guardian_v34.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_cognitive_latent_environment_tail_guardian_v34.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-cognitive-latent-environment-tail-guardian-v34-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  V21_RUN_ID: '36264229554'
  V21_ARTIFACT_SHA: '05452328bbf5cbbc4b26210791d13114105e3f9d'
  V29_RUN_ID: '36283499014'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_cognitive_latent_environment_tail_guardian_v34.py \
            tests/infrastructure/trader_lab/test_capitalizer_cognitive_latent_environment_tail_guardian_v34.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_cognitive_latent_environment_tail_guardian_v34.py \
            tests/infrastructure/trader_lab/test_capitalizer_cognitive_latent_environment_tail_guardian_v34.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_cognitive_latent_environment_tail_guardian_v34.py

  aggregate:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download authoritative reconstructed consumed evidence
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v21-reconstructed-*-${{ env.V21_ARTIFACT_SHA }}
          path: reconstructed
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ env.V21_RUN_ID }}
      - name: Download authoritative V29 native-M1 trigger states
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v29-trigger-state-*
          path: trigger-states
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ env.V29_RUN_ID }}
      - name: Run V34 cognitive latent environment guardian
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cognitive_latent_environment_tail_guardian_v34 \
            reconstructed/development-input \
            reconstructed/validation-input \
            reconstructed/reserved-input \
            reconstructed/development-validation-context \
            reconstructed/reserved-context \
            trigger-states \
            experiment-output
      - name: Enforce V34 contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "experiment-output/"
                  "capitalizer-cognitive-latent-environment-tail-guardian-v34.json"
              ).read_text()
          )

          assert report["identity"] == (
              "QORE_CAPITALIZER_COGNITIVE_LATENT_ENVIRONMENT_TAIL_GUARDIAN_V34"
          )
          assert report["policy"] == (
              "SURFACE_DEFAULT_DUAL_WORLD_SOFT_ENVIRONMENT_TAIL_OVERRIDE"
          )
          assert report["surface_default"] is True
          assert report["causal_state_dimension"] == 95
          assert report["environment_count"] == 4
          assert report["environment_discovery_outcome_blind"] is True
          assert report["environment_discovery_per_training_world"] is True
          assert report["environment_initialization"] == (
              "MEAN_NEAREST_THEN_FARTHEST_POINT"
          )
          assert report["environment_membership"] == (
              "NORMALIZED_INVERSE_ONE_PLUS_SQUARED_DISTANCE"
          )
          assert report["max_kmeans_iterations"] == 20
          assert report["chronological_calibration_folds"] == 5
          assert report["minimum_chronological_calibration_examples"] == 10
          assert report["sparse_family_policy"] == "FAIL_CLOSED_KEEP_SURFACE"
          assert report["residual_lower_quantile"] == "0.2"
          assert report["l2_prior_strength_effective_trades"] == "12.0"
          assert report["episode_dd_relief_target_used"] is True
          assert report["dual_world_lcb_gate"] is True
          assert report["all_entries_preserved"] is True
          assert report["density_retention"] == "1"
          assert report["same_entrant_identities"] is True
          assert report["fixed_target_r"] == "2.00"
          assert report["original_stop_geometry_preserved_at_entry"] is True
          assert report["new_protection_geometry_created"] is False
          assert report["max3_preserved"] is True
          assert report["max3_slot_recycling"] is False
          assert report["current_outcome_visible_to_decision"] is False
          assert report["heldout_counterfactual_visible_to_decision"] is False
          assert report["future_after_trigger_visible_to_decision"] is False
          assert report["activation_bar_ohlc_visible_to_decision"] is False
          assert report["era_identity_feature_used"] is False
          assert report[
              "symbol_session_side_time_identity_features_used"
          ] is False
          assert report["historical_fresh_oos_available"] is False
          assert report["2018_2020_status"] == "CONSUMED_NOT_FRESH"
          assert report["trader_certified"] is False

          expected = {
              "DEVELOPMENT_2024_2026": 948,
              "CONSUMED_VALIDATION_2022_2024": 1034,
              "CONSUMED_RESERVED_2020_2022": 1088,
          }
          for row in report["results"]:
              assert row["trades"] == expected[row["period"]]
              assert row["density_retention"] == "1"

          for period_rows in report["model_diagnostics"].values():
              assert len(period_rows) == 3
              for family in period_rows.values():
                  if not family["available"]:
                      assert family["reason"] == (
                          "INSUFFICIENT_CHRONOLOGICAL_CALIBRATION_SUPPORT"
                      )
                      continue
                  assert family["training_states"] >= 10
                  assert family["feature_dimension"] == 95
                  assert family["environment_count"] == 4
                  assert sum(family["hard_environment_counts"]) == (
                      family["training_states"]
                  )
                  assert 1 <= family["kmeans_iterations"] <= 20
                  for action in family["actions"].values():
                      assert action["episode_oof_residuals"] > 0

          print(json.dumps(report, sort_keys=True))
          PY
      - name: Upload V34 evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-cognitive-latent-environment-tail-guardian-v34-${{ github.sha }}
          path: experiment-output
          if-no-files-found: error
          retention-days: 90
