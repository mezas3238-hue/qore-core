name: QORE Capitalizer Alternate Families Target1 1Y V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-alternate-families-target1-1y-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_alternate_families_target1_1y_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_alternate_families_target1_1y_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FAST_RUN_ID: '35861327955'
  FAST_SHA: 'f70def28997d772939c9bc23c2333a077842f467'
  STANDARD_RUN_ID: '35861313294'
  STANDARD_SHA: 'dda2868d198d1021988c0be4b8d2cca404707525'
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_alternate_families_target1_1y_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_alternate_families_target1_1y_v1.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_alternate_families_target1_1y_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_alternate_families_target1_1y_v1.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {symbol: USDJPY, session: ASIA}
          - {symbol: AUDJPY, session: ASIA}
          - {symbol: AUDUSD, session: ASIA}
          - {symbol: GBPJPY, session: ASIA}
          - {symbol: EURUSD, session: LONDON}
          - {symbol: GBPUSD, session: LONDON}
          - {symbol: XAUUSD, session: NEW_YORK}
          - {symbol: USDCAD, session: NEW_YORK}
          - {symbol: NAS100, session: NEW_YORK}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download frozen Fast-Fractal evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-fast-fractal-h1-m5-m1-1y-${{ matrix.symbol }}-${{ env.FAST_SHA }}
          path: fast-source
          github-token: ${{ github.token }}
          run-id: ${{ env.FAST_RUN_ID }}
      - name: Download frozen Scalping-Standard evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-scalping-standard-h1-m15-m1-1y-${{ matrix.symbol }}-${{ env.STANDARD_SHA }}
          path: standard-source
          github-token: ${{ github.token }}
          run-id: ${{ env.STANDARD_RUN_ID }}
      - name: Download immutable native M1
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Reprice fixed selections at 1R
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_alternate_families_target1_1y_v1 \
            market fast-source standard-source m1-source target1-output \
            --session ${{ matrix.session }}
      - name: Enforce fixed-selection boundary
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
          EXPECTED_SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"]
          report = json.loads(
              (
                  Path("target1-output")
                  / f"capitalizer-{symbol.lower()}-alternate-families-target1-1y-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_ALTERNATE_FAMILIES_TARGET1_1Y_V1"
          )
          assert report["symbol"] == symbol
          assert report["session"] == os.environ["EXPECTED_SESSION"]
          assert report["target_r"] == "1.00"
          assert report["selection_changed"] is False
          assert report["entry_changed"] is False
          assert report["stop_changed"] is False
          assert report["only_target_r_changed"] is True
          assert report["new_entries_allowed"] is False
          assert report["fresh_holdout_claimed"] is False
          assert report["outcome_used_for_admission"] is False
          assert report["automatic_promotion_allowed"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-alternate-families-target1-1y-v1-${{ matrix.symbol }}-${{ github.sha }}
          path: target1-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-alternate-families-target1-1y-v1-*-${{ github.sha }}
          path: target1-input
          merge-multiple: false
      - name: Build alternate-family matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_alternate_families_target1_1y_v1 \
            matrix target1-input matrix-output
      - name: Enforce aggregate controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "matrix-output/"
                  "capitalizer-nine-market-alternate-families-target1-1y-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_NINE_MARKET_ALTERNATE_FAMILIES_TARGET1_1Y_V1"
          )
          assert report["market_count"] == 9
          assert report["target_r"] == "1.00"
          assert report["fast_raw_trades"] == 327
          assert report["standard_raw_trades"] == 191
          assert report["selection_changed"] is False
          assert report["entry_changed"] is False
          assert report["stop_changed"] is False
          assert report["only_target_r_changed"] is True
          assert report["new_entries_allowed"] is False
          assert report["cross_family_union_promoted"] is False
          assert report["fresh_holdout_claimed"] is False
          assert report["outcome_used_for_admission"] is False
          assert report["automatic_promotion_allowed"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-nine-market-alternate-families-target1-1y-v1-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
