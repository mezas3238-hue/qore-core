name: QORE CIBO Atlas VT31 Historical Market Scanner Gap05

on:
  push:
    branches: [agent/cibo-atlas-vt31-market-specialists-001]
    paths:
      - scripts/cibo_atlas_vt31_historical_market_scanner_gap05.py
      - .github/workflows/cibo-atlas-vt31-historical-market-scanner-gap05.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  historical-market-scanner-gap05:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research runtime
        run: pip install -e .[dev]
      - name: Static validation
        run: |
          set -euo pipefail
          python -m py_compile scripts/cibo_atlas_vt31_historical_market_scanner.py scripts/cibo_atlas_vt31_historical_market_scanner_gap05.py
          ruff check --ignore N802,E501,UP035,SLF001 scripts/cibo_atlas_vt31_historical_market_scanner_gap05.py
          mypy src/qore/infrastructure/cibo_atlas_market_lab.py
          python scripts/cibo_atlas_vt31_historical_market_scanner_gap05.py --self-test
      - name: Recover immutable definitive ledger
        run: |
          set -euo pipefail
          artifact_id=10440468729
          expected=2d6a2c609a0fb0caf11f936623ed4907450e0f9a8581b4f6b54997b89b743b65
          digest="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" --jq .digest)"
          test "$digest" = "sha256:${expected}"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > ledger.zip
          echo "${expected}  ledger.zip" | sha256sum -c -
          mkdir ledger
          unzip -q ledger.zip -d ledger
          (cd ledger && sha256sum -c SHA256SUMS)
          test "$(cat ledger/git-sha.txt)" = "ac05b3c84433bf052b494bbc5b803e98de66e571"
          test -f ledger/vt31-tick-corrected-consumed-ledger-v2.json
          printf '%s\n' "$artifact_id" > ledger-artifact-id.txt
          printf '%s\n' "$digest" > ledger-artifact-digest.txt
      - name: Recover immutable consumed M1 market evidence
        run: |
          set -euo pipefail
          fetch_artifact() {
            id="$1"; expected="$2"; destination="$3"
            digest="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" --jq .digest)"
            test "$digest" = "sha256:${expected}"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "${destination}.zip"
            echo "${expected}  ${destination}.zip" | sha256sum -c -
            mkdir "$destination"
            unzip -q "${destination}.zip" -d "$destination"
            if [ -f "$destination/SHA256SUMS" ]; then
              (cd "$destination" && sha256sum -c SHA256SUMS)
            fi
            printf '%s\n' "$id" > "${destination}-artifact-id.txt"
            printf '%s\n' "$digest" > "${destination}-artifact-digest.txt"
          }
          fetch_artifact 10380044761 828335b99cd51c663e3f0f095df5137e881da3d7e8da741da8ca116a0400edf8 evidence-r5
          fetch_artifact 10389112524 9b0f3a05dc76b5dd83e5e3610266484bee1b79595dbbaacdff1d799115ad58b9 evidence-r6
          fetch_artifact 10402199719 9f5df4eba1882cb498b4e3657176f34a7c27083f3ac1af7856ebddf01447f34d evidence-r8
          for root in evidence-r5 evidence-r6 evidence-r8; do
            for market in NAS100 SP500 US30; do
              test -f "$root/fresh/$market/market-evidence.json"
            done
          done
      - name: Build gap05-compatible historical market atlas
        run: |
          set -euo pipefail
          mkdir result
          python scripts/cibo_atlas_vt31_historical_market_scanner_gap05.py \
            --ledger ledger/vt31-tick-corrected-consumed-ledger-v2.json \
            --r8-fresh-nas100 evidence-r8/fresh/NAS100/market-evidence.json \
            --r8-fresh-sp500 evidence-r8/fresh/SP500/market-evidence.json \
            --r8-fresh-us30 evidence-r8/fresh/US30/market-evidence.json \
            --r6-nas100 evidence-r6/fresh/NAS100/market-evidence.json \
            --r6-sp500 evidence-r6/fresh/SP500/market-evidence.json \
            --r6-us30 evidence-r6/fresh/US30/market-evidence.json \
            --r5-nas100 evidence-r5/fresh/NAS100/market-evidence.json \
            --r5-sp500 evidence-r5/fresh/SP500/market-evidence.json \
            --r5-us30 evidence-r5/fresh/US30/market-evidence.json \
            --output-dir result
      - name: Validate full ledger overlay and governance
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json
          from pathlib import Path
          p=json.loads(Path('result/cibo-atlas-vt31-historical-market-scanner-gap05.json').read_text())
          assert p['schema']=='qore.cibo_atlas.vt31.historical_market_scanner.gap05.v1'
          assert p['research_only'] is True and p['selection_prohibited'] is True
          assert p['opens_new_holdout'] is False
          assert p['candidate_status']=='NO_R9_NOT_CERTIFIED'
          assert p['live_authorized'] is False and p['production_authorized'] is False
          assert p['ledger_root_overlay_count']==780
          assert set(p['market_universe'])=={'NAS100','SP500','US30'}
          with Path('result/cibo-atlas-vt31-market-day-matrix-gap05.csv').open() as handle:
              rows=list(csv.DictReader(handle))
          assert len(rows)==p['independent_market_day_count']
          assert sum(int(r['trader_root_count']) for r in rows)==780
          print(json.dumps({'days':p['independent_market_day_count'],'roots':p['ledger_root_overlay_count'],'markets':p['market_summary'],'reference_histogram':p['reference_bar_histogram'],'cross_index_complete_days':p['cross_index']['complete_three_market_day_count']},sort_keys=True))
          PY
      - name: Bind immutable gap05 Atlas artifact
        run: |
          set -euo pipefail
          echo "$GITHUB_SHA" > result/git-sha.txt
          cp ledger-artifact-id.txt ledger-artifact-digest.txt result/
          cp evidence-r5-artifact-id.txt evidence-r5-artifact-digest.txt result/
          cp evidence-r6-artifact-id.txt evidence-r6-artifact-digest.txt result/
          cp evidence-r8-artifact-id.txt evidence-r8-artifact-digest.txt result/
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-atlas-vt31-historical-market-scanner-gap05-${{ github.sha }}
          path: result/
          retention-days: 90
