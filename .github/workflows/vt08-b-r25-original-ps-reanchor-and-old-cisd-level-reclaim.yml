name: VT08 B R25 Original PS Reanchor vs Old CISD Level Reclaim

on:
  workflow_dispatch:
  push:
    branches: [agent/vt08-5m-cognition-replay-20261010]
    paths:
      - src/qore/infrastructure/trader_lab/vt08_b_r25_ps_reanchor_and_cisd_reclaim_native_v1.py
      - tests/infrastructure/trader_lab/test_vt08_b_r25_ps_reanchor_and_cisd_reclaim_native_v1.py
      - .github/workflows/vt08-b-r25-original-ps-reanchor-and-old-cisd-level-reclaim.yml

permissions:
  contents: read
  actions: read

jobs:
  r25-adversarial-source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: R25 zero authorization adverse causal clock and source tests
        run: |
          ruff check src/qore/infrastructure/trader_lab/vt08_b_r25_ps_reanchor_and_cisd_reclaim_native_v1.py tests/infrastructure/trader_lab/test_vt08_b_r25_ps_reanchor_and_cisd_reclaim_native_v1.py
          pytest -q tests/infrastructure/trader_lab/test_vt08_b_r25_ps_reanchor_and_cisd_reclaim_native_v1.py

  r25-real-original-native-m3:
    runs-on: ubuntu-24.04
    needs: r25-adversarial-source-contract
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        market: [EURJPY, USDCHF, NZDUSD, CADJPY, USDCAD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: vt08-a-frozen-m30m3-firstfail-${{ matrix.market }}-394116f13449fc310d7fbc5f0b5f60aa1bb247d4
          path: r3/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 38715560333
      - uses: actions/download-artifact@v4
        with:
          name: qore-vt08-m3-fractal-${{ matrix.market }}-bc1379d7661aac202495ec67afdd3098473ba723
          path: native-m3/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 35941643396
      - uses: actions/download-artifact@v4
        with:
          name: vt08-b-r19-blind-poi-${{ matrix.market }}-e999e127be84a1ebb9d3e8b1d13e110cfa2cb51a
          path: r19/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 38903529731
      - name: Original independent R14 and physical reanchor/reclaim R25 all cases
        env:
          MARKET: ${{ matrix.market }}
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json, os
          from pathlib import Path
          from qore.infrastructure.trader_lab.vt08_b_r25_ps_reanchor_and_cisd_reclaim_native_v1 import audit_r25
          m=os.environ["MARKET"]
          original=list(Path("r3",m).rglob(m+"-frozen-source-firstfail.json"))
          native=list(Path("native-m3",m).rglob("m3-evidence.json"))
          blind=list(Path("r19",m).rglob(m+"-VT08-R19-blind-POI-review-packet.json"))
          if len(original)!=1 or len(native)!=1 or len(blind)!=1:
              raise SystemExit("R25 original native source/A R3/R19 exactly-once required")
          r3=json.loads(original[0].read_text())
          r19=json.loads(blind[0].read_text())
          result=audit_r25(r3,r19,market=m,native_m3=native[0])
          expected={"EURJPY":(538,21),"USDCHF":(518,21),"NZDUSD":(550,21),"CADJPY":(516,21),"USDCAD":(535,23)}
          n,review=expected[m]
          if (result["original_candidate_census"]!=n
              or result["original_r19_source_review_cases"]!=review
              or sum(result["post_break_old_level_reclaim_histogram"].values())!=n
              or result["source_complete_entries"] or result["cognitive_admissions"]
              or result["broker_fills"] or result["economic_gates_evaluated"]
              or result["holdout_7y_accessed"] or result["sizing_used"]):
              raise SystemExit("R25 original denominator/real authority changed")
          path=Path("evidence",m+"-R25-original-PS-anchor-native-M3-physical-reclaim.json")
          path.write_text(json.dumps(result,sort_keys=True,separators=(",",":"),allow_nan=False))
          print("R25_SUMMARY",json.dumps({k:v for k,v in result.items() if k not in
              ("full_source_case_index","same_107_r19_blind_source_review")},sort_keys=True))
          focus={
              "USDCHF":{
                  "83c687ffa373093c3ea211eafdbb4f015f9068cfc8aa0fceb5f8184799bcb990",
                  "c463ba07bb354d4cd617f8d3c0d1a8073a9cd9b67c7c3f19af43b6321189dbae"
              },
              "NZDUSD":{
                  "ab42c7b10290b2ab1af37cb9efc479fbc3366fb3f3a601f96810a95d510088d1"
              },
          }
          if m in focus:
              rows=[x for x in result["same_107_r19_blind_source_review"] if
                  x["case_id_sha256"] in focus[m]]
              if len(rows)!=len(focus[m]):
                  raise SystemExit("R25 failed original requested source-only real case examples")
              for row in rows:
                  print("R25_CASE",json.dumps(row,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vt08-b-r25-original-reanchor-reclaim-${{ matrix.market }}-${{ github.sha }}
          path: evidence/*.json
          retention-days: 30
          if-no-files-found: error
