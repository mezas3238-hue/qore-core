name: QORE VT-08 CRT 1-5-9 V3 Trader Lab

on:
  push:
    branches:
      - agent/trader-methodology-rebuild-v3-001
    paths:
      - .github/workflows/trader-methodology-rebuild-vt08-v3.yml
      - docs/research/VT08-CRT-159-V3-SOURCE-FREEZE.md
      - src/qore/infrastructure/traders/vt08_crt_159_v3.py
      - src/qore/infrastructure/ctrader_demo_lab_vt08_v3_probe.py
      - src/qore/infrastructure/trader_lab/vt08_crt_159_v3_backtest.py
      - src/qore/infrastructure/trader_lab/vt08_crt_159_v3_full_research.py
      - tests/infrastructure/traders/test_vt08_crt_159_v3.py
      - tests/infrastructure/trader_lab/test_vt08_crt_159_v3_full_research.py
  workflow_dispatch:

concurrency:
  group: qore-vt08-v3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
  QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}
  QORE_DEMO_LAB_LOOKBACK_DAYS: "760"
  QORE_SOFTWARE_SHA: ${{ github.sha }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff full gate
        run: ruff check .
      - name: Mypy full gate
        run: mypy src tests
      - name: VT-08 V3 focused source and Trader Lab gate
        run: |
          pytest -q \
            tests/infrastructure/traders/test_vt08_crt_159_v3.py \
            tests/infrastructure/trader_lab/test_vt08_crt_159_v3_full_research.py
      - name: Pytest full quality gate
        run: pytest --cov=src/qore --cov-report=term-missing

  trader-lab-11-market:
    if: ${{ contains(github.event.head_commit.message || '', 'run-vt08-v3-research') || github.event_name == 'workflow_dispatch' }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        symbol:
          - EURUSD
          - GBPUSD
          - USDJPY
          - AUDUSD
          - USDCAD
          - XAUUSD
          - NAS100
          - SP500
          - GBPJPY
          - AUDJPY
          - US30
    env:
      QORE_DEMO_LAB_SYMBOL: ${{ matrix.symbol }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QORE and cTrader runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ctrader]"
      - name: Verify required DEMO inputs without printing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            QORE_CTRADER_CLIENT_ID \
            QORE_CTRADER_CLIENT_SECRET \
            QORE_CTRADER_ACCESS_TOKEN \
            QORE_CTRADER_REFRESH_TOKEN \
            QORE_DEMO_LAB_SYMBOL
          do
            if [ -z "${!name:-}" ]; then
              echo "missing required DEMO V3 input: ${name}" >&2
              exit 2
            fi
          done
      - name: Discover the single authorized DEMO account when not configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            if ! [[ "$account_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "cTrader DEMO account discovery returned invalid id" >&2
              exit 3
            fi
            echo "::add-mask::$account_id"
            printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          fi
      - name: Collect two-year M15 plus provider D1 evidence
        run: |
          root="artifacts/vt08-v3/${QORE_DEMO_LAB_SYMBOL}"
          mkdir -p "$root"
          python -m qore.infrastructure.ctrader_demo_lab_vt08_v3_probe \
            > "$root/market-evidence.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["QORE_DEMO_LAB_SYMBOL"]
          root = Path(f"artifacts/vt08-v3/{symbol}")
          payload = json.loads((root / "market-evidence.json").read_text())
          assert payload["schema"] == "qore.ctrader_demo.vt08_crt_159_v3_evidence.v1"
          assert payload["environment"] == "demo"
          assert payload["read_only"] is True
          assert payload["account_is_live"] is False
          assert payload["canonical_symbol"] == symbol
          assert payload["software_sha"] == os.environ["GITHUB_SHA"]
          assert set(payload["periods"]) == {"M15", "D1"}
          assert payload["required_coverage_days"] == 730
          assert len(payload["primary_source_sha256"]) == 3
          PY
      - name: Run source-bound V3 backtest
        run: |
          root="artifacts/vt08-v3/${QORE_DEMO_LAB_SYMBOL}"
          python -m qore.infrastructure.trader_lab.vt08_crt_159_v3_backtest \
            "$root/market-evidence.json" > "$root/backtest.json"
          printf '%s\n' "$GITHUB_SHA" > "$root/git-sha.txt"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["QORE_DEMO_LAB_SYMBOL"]
          root = Path(f"artifacts/vt08-v3/{symbol}")
          payload = json.loads((root / "backtest.json").read_text())
          assert payload["schema"] == "qore.trader_lab.vt08_crt_159_v3_backtest.v1"
          assert payload["research_only"] is True
          assert payload["symbol"] == symbol
          assert payload["software_sha"] == os.environ["GITHUB_SHA"]
          assert payload["long_trade_count"] + payload["short_trade_count"] == payload["setup_count"]
          assert payload["terminal_sample_size"] + payload["h4_close_censored_count"] + payload["gap_censored_count"] == payload["setup_count"]
          PY
      - name: Run full Trader Lab V3 evidence stages
        run: |
          root="artifacts/vt08-v3/${QORE_DEMO_LAB_SYMBOL}"
          python -m qore.infrastructure.trader_lab.vt08_crt_159_v3_full_research \
            "$root/backtest.json" "$root" > "$root/research-run-summary.stdout.json"
      - name: Verify V3 research authority boundary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["QORE_DEMO_LAB_SYMBOL"]
          root = Path(f"artifacts/vt08-v3/{symbol}")
          required = {
              "market-evidence.json", "backtest.json", "git-sha.txt",
              "walk-forward.json", "characterization.json", "stress.json",
              "monte-carlo.json", "failure-analysis.json", "story-forensics.json",
              "hypothesis-register.json", "research-summary.json",
              "research-run-summary.stdout.json",
          }
          assert not [name for name in required if not (root / name).is_file()]
          walk = json.loads((root / "walk-forward.json").read_text())
          assert walk["source_frozen_configuration"] is True
          assert walk["parameter_search_performed"] is False
          assert walk["holdout_governance"]["state"] == "consumed_for_research"
          summary = json.loads((root / "research-summary.json").read_text())
          assert summary["demo_eligible"] is False
          assert summary["governed_lifecycle_authority"] is False
          assert summary["software_sha"] == os.environ["GITHUB_SHA"]
          assert summary["symbol"] == symbol
          PY
      - name: Upload sanitized V3 per-market evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-v3-${{ matrix.symbol }}-${{ github.sha }}
          path: artifacts/vt08-v3/${{ matrix.symbol }}
          if-no-files-found: error
          retention-days: 30

  multi-market-evidence:
    needs: trader-lab-11-market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt08-v3-*-${{ github.sha }}
          path: artifacts/vt08-v3-multi-market
      - name: Aggregate eleven-market V3 research evidence
        run: |
          mkdir -p artifacts/vt08-v3-aggregate
          python - <<'PY'
          import json
          import os
          from decimal import Decimal
          from pathlib import Path

          expected = {
              "EURUSD", "GBPUSD", "USDJPY", "AUDUSD", "USDCAD", "XAUUSD",
              "NAS100", "SP500", "GBPJPY", "AUDJPY", "US30",
          }
          summaries = [
              json.loads(path.read_text())
              for path in sorted(
                  Path("artifacts/vt08-v3-multi-market").rglob("research-summary.json")
              )
          ]
          assert len(summaries) == 11
          assert {item["symbol"] for item in summaries} == expected
          total = sum(int(item["all_history"]["terminal_sample_size"]) for item in summaries)
          weighted = sum(
              Decimal(item["all_history"]["expectancy_r"])
              * int(item["all_history"]["terminal_sample_size"])
              for item in summaries
          )
          payload = {
              "schema": "qore.trader_lab.vt08_crt_159_v3_11_market_aggregate.v1",
              "research_only": True,
              "software_sha": os.environ["GITHUB_SHA"],
              "market_count": 11,
              "symbols": sorted(expected),
              "terminal_sample_size": total,
              "weighted_expectancy_r": format(weighted / total if total else Decimal(0), "f"),
              "oos_pass_market_count": sum(bool(item["oos_pass"]) for item in summaries),
              "stress_pass_market_count": sum(bool(item["stress_pass"]) for item in summaries),
              "monte_carlo_pass_market_count": sum(bool(item["monte_carlo_pass"]) for item in summaries),
              "per_market": sorted(summaries, key=lambda item: item["symbol"]),
              "governed_lifecycle_authority": False,
              "demo_eligible": False,
          }
          out = Path("artifacts/vt08-v3-aggregate/eleven-market-summary.json")
          out.write_text(json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n")
          Path("artifacts/vt08-v3-aggregate/git-sha.txt").write_text(os.environ["GITHUB_SHA"] + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-v3-11-market-aggregate-${{ github.sha }}
          path: artifacts/vt08-v3-aggregate
          if-no-files-found: error
          retention-days: 30
