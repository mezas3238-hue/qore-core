name: QORE CIBO T15 Reservation Counterfactual Lineage

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-ce2i-phase20-t15-reservation-counterfactual.yml'
      - 'src/qore/infrastructure/cibo_ce2i_phase20_t15_reservation_counterfactual.py'
      - 'tests/infrastructure/test_cibo_ce2i_phase20_t15_reservation_counterfactual.py'
      - 'docs/research/CIBO-T15-RESERVATION-COUNTERFACTUAL-LINEAGE-V1.md'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  t15-reservation-counterfactual-lineage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: T15 Phase22-native reservation lineage
        run: |
          ruff check \
            src/qore/infrastructure/cibo_ce2i_phase20_t15_reservation_counterfactual.py \
            tests/infrastructure/test_cibo_ce2i_phase20_t15_reservation_counterfactual.py
          mypy \
            src/qore/infrastructure/cibo_ce2i_phase20_t15_reservation_counterfactual.py
          python -m py_compile \
            src/qore/infrastructure/cibo_ce2i_phase20_t15_reservation_counterfactual.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_ce2i_phase20_t15_reservation_counterfactual.py
