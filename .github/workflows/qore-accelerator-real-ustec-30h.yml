name: QORE Research Accelerator — real cTrader 30h source qualification

on:
  push:
    branches:
      - research/qore-accelerator-5layers-ultrafast-20261013
    paths:
      - 'src/qore/infrastructure/research_accelerator/**'
      - 'tests/infrastructure/research_accelerator/**'
      - '.github/workflows/qore-accelerator-real-ustec-30h.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  historical_ustec_source_qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reproducible accelerator
        run: python -m pip install -e '.[dev]'
      - name: Verify independent offline tests
        run: pytest -q -o addopts='' tests/infrastructure/research_accelerator
      - name: Retrieve audited 6h and 24h real cTrader Actions archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-quarantine
          python - <<'PY'
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import HTTPRedirectHandler, Request, build_opener, urlopen

          class NoCrossDomainAuthRedirect(HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  return None

          token = os.environ["GITHUB_TOKEN"]
          repository = os.environ["GITHUB_REPOSITORY"]
          opener = build_opener(NoCrossDomainAuthRedirect())
          for artifact_id, filename in (
              (11801205225, "pilot6.zip"),
              (11801263502, "wave24.zip"),
          ):
              address = (
                  f"https://api.github.com/repos/{repository}/actions/"
                  f"artifacts/{artifact_id}/zip"
              )
              req = Request(
                  address,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  response = opener.open(req, timeout=45)
                  raise SystemExit("Unexpected nonredirect response: " + str(response.status))
              except HTTPError as error:
                  if error.code not in (301, 302, 303, 307, 308):
                      raise
                  signed_url = error.headers.get("Location")
                  if not signed_url or not signed_url.startswith("https://"):
                      raise SystemExit("No signed artifact download URL")
              with urlopen(signed_url, timeout=90) as source:
                  payload = source.read(25_000_000)
              if len(payload) >= 25_000_000:
                  raise SystemExit("Artifact over maximum size")
              Path("source-quarantine", filename).write_bytes(payload)
              print(f"Downloaded artifact {artifact_id}, {len(payload)} bytes")
          PY
      - name: Verify exact raw SHA, all embedded hashes and 30 hours, build lake, prove ultra-fast parity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-results
          python -m qore.infrastructure.research_accelerator.real_source \
            --pilot6 source-quarantine/pilot6.zip \
            --wave24 source-quarantine/wave24.zip \
            --report source-results/USTEC-REAL-30H-VALIDATION-NOT-PNL.json
          sha256sum -c source-results/USTEC-REAL-30H-VALIDATION-NOT-PNL.json.sha256
      - name: Remove raw source before publishing metadata
        if: always()
        run: rm -rf source-quarantine
      - name: Publish only signed aggregate QA; no licensed quotes
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qore-accelerator-ustec-real-30h-QA-NOT-EDGE-${{ github.sha }}
          path: source-results/
          retention-days: 90
          if-no-files-found: error
