name: QORE CIBO Final Integrated Exam CI Control

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/qore/infrastructure/cibo_final_integrated_exam_ci_control.py'
      - 'tests/infrastructure/test_cibo_final_integrated_exam_ci_control.py'
      - '.github/workflows/cibo-final-integrated-exam-ci-control.yml'

permissions:
  contents: read

jobs:
  final-ci-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: P3 exact-head CI contract
        run: |
          ruff check \
            src/qore/infrastructure/cibo_final_integrated_exam_ci_control.py \
            tests/infrastructure/test_cibo_final_integrated_exam_ci_control.py
          mypy src/qore/infrastructure/cibo_final_integrated_exam_ci_control.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_final_integrated_exam_ci_control.py
