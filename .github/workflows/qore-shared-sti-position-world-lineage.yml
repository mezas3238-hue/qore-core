name: QORE Shared STI Position World Lineage

concurrency:
  group: qore-shared-sti-position-world-lineage-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - src/qore/infrastructure/core_stack_v2/shared_position_world_lineage.py
      - src/qore/infrastructure/core_stack_v2/shared_trader_intelligence.py
      - tests/infrastructure/test_core_stack_v2_shared_position_world_lineage.py
      - docs/shared/QORE_SHARED_STI_POSITION_WORLD_LINEAGE_CONTRACT_001.md
      - .github/workflows/qore-shared-sti-position-world-lineage.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Shared
        run: pip install -e ".[dev]"

      - name: Validate causal position lineage
        run: |
          set -euo pipefail
          mkdir -p result
          ruff check \
            src/qore/infrastructure/core_stack_v2/shared_position_world_lineage.py \
            tests/infrastructure/test_core_stack_v2_shared_position_world_lineage.py
          mypy \
            src/qore/infrastructure/core_stack_v2/shared_position_world_lineage.py
          python -m py_compile \
            src/qore/infrastructure/core_stack_v2/shared_position_world_lineage.py
          pytest -q \
            tests/infrastructure/test_core_stack_v2_shared_position_world_lineage.py \
            --junitxml=result/junit.xml

      - name: Seal position lineage evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root=ET.parse("result/junit.xml").getroot()
          suites=(root,) if root.tag == "testsuite" else tuple(root.findall("testsuite"))
          tests=sum(int(item.attrib.get("tests", "0")) for item in suites)
          failures=sum(int(item.attrib.get("failures", "0")) for item in suites)
          errors=sum(int(item.attrib.get("errors", "0")) for item in suites)
          if tests <= 0:
              raise SystemExit("STI position lineage refuses zero-test evidence")
          if failures + errors:
              raise SystemExit("STI position lineage refuses failing evidence")

          evidence={
              "identity":"QORE_SHARED_STI_POSITION_WORLD_LINEAGE_EVIDENCE_001",
              "head":os.environ["GITHUB_SHA"],
              "run_id":int(os.environ["GITHUB_RUN_ID"]),
              "test_count":tests,
              "failure_count":failures+errors,
              "world_at_entry_committed_at_open_required":True,
              "post_hoc_entry_reconstruction_authorized":False,
              "future_current_snapshot_authorized":False,
              "position_management_authority":False,
              "execution_authority":False,
              "threat_model_certified":False,
              "protected_holdout_opened":False,
          }
          Path("result/sti-position-lineage-evidence.json").write_text(
              json.dumps(evidence,sort_keys=True,indent=2)+"\n"
          )
          PY
          printf '%s\n' "$GITHUB_SHA" > result/code-git-sha.txt
          printf '%s\n' "$GITHUB_RUN_ID" > result/run-id.txt
          (
            cd result
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
              | sort -z | xargs -0 sha256sum > SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-sti-position-lineage-${{ github.sha }}
          path: result
          retention-days: 90

      - name: Report position lineage status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence=json.loads(
              Path("result/sti-position-lineage-evidence.json").read_text()
          )
          body="\n".join([
              "## Shared STI-7/STI-9 — Position World Lineage",
              "",
              f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- tests: **{evidence['test_count']}** / failures: **{evidence['failure_count']}**",
              "- world-at-entry committed at opening event: **Required**",
              "- post-hoc entry reconstruction: **Forbidden**",
              "- Shared position-management authority: **False**",
              "- Shared execution authority: **False**",
              "- position-threat model certified: **False**",
              "- protected Shared holdout opened: **False**",
          ])+"\n"
          Path("result/issue-comment.md").write_text(body)
          PY
          gh issue comment 638 --body-file result/issue-comment.md
