name: QORE CIBO Function Economic Sensors

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cibo-function-economic-sensors-001
    paths:
      - '.github/workflows/cibo-function-economic-sensors.yml'
      - 'scripts/cibo_single_account_historical_ceiling_replay.py'
      - 'src/qore/infrastructure/cibo_function_economic_sensors.py'
      - 'src/qore/infrastructure/cibo_single_account_sovereign_ceiling_run.py'
      - 'tests/infrastructure/test_cibo_function_economic_sensors.py'
      - 'tests/infrastructure/test_cibo_single_account_historical_ceiling_epoch.py'

permissions:
  contents: read

concurrency:
  group: qore-cibo-function-economic-sensors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-sensors:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile and lint sensor surface
        run: |
          set -euo pipefail
          python -m py_compile scripts/cibo_single_account_historical_ceiling_replay.py src/qore/infrastructure/cibo_function_economic_sensors.py src/qore/infrastructure/cibo_single_account_sovereign_ceiling_run.py
          ruff check scripts/cibo_single_account_historical_ceiling_replay.py src/qore/infrastructure/cibo_function_economic_sensors.py src/qore/infrastructure/cibo_single_account_sovereign_ceiling_run.py tests/infrastructure/test_cibo_function_economic_sensors.py
      - name: Prove sensor contracts and real epoch integration
        run: |
          set -euo pipefail
          pytest -q --no-cov tests/infrastructure/test_cibo_function_economic_sensors.py tests/infrastructure/test_cibo_single_account_historical_ceiling_epoch.py
