name: QORE Native RESET Fix 16h G1 CIBO EURUSD M5 (No OAuth NO LIVE)
on:
  workflow_dispatch:
  push:
    branches:
      - research/qore-native-reset-fix-g1-execution-20261011
    paths:
      - '.github/workflows/qore-native-reset-fix-g1-eurusd-m5.yml'
      - 'src/qore/infrastructure/trader_lab/qore_native_reset_fix_g1_v1.py'
      - 'tests/infrastructure/trader_lab/test_qore_native_reset_fix_g1_v1.py'
      - 'docs/research/QORE_NATIVE_RESET_FIX_G1_FROZEN_IMPLEMENTATION_ADDENDUM_2026-10-11.md'

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-native-reset-g1-${{ github.sha }}
  cancel-in-progress: false

jobs:
  causal_quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research tests (not cTrader connector)
        run: python -m pip install -e '.[dev]'
      - name: Freeze confirmation protocol and reject trading connectors
        run: |
          test -s docs/research/QORE_NATIVE_RESET_FIX_G1_CIBO_M5_PREREG_2026-10-11.md
          test -s docs/research/QORE_NATIVE_RESET_FIX_G1_FROZEN_IMPLEMENTATION_ADDENDUM_2026-10-11.md
          python - <<'PY'
          from pathlib import Path
          p=Path('src/qore/infrastructure/trader_lab/qore_native_reset_fix_g1_v1.py').read_text()
          assert 'SEED = 941102' in p and 'N_BOOTSTRAP = 2000' in p
          assert 'SOURCE_ARTIFACT_ID = 10475354631' in p
          assert 'QORE_CTRADER' not in p and 'MT5' not in p
          PY
      - name: Ruff read-only trial contract
        run: ruff check --select F,E4,E7,E9 src/qore/infrastructure/trader_lab/qore_native_reset_fix_g1_v1.py tests/infrastructure/trader_lab/test_qore_native_reset_fix_g1_v1.py
      - name: G1 causal microtests
        run: pytest -q --no-cov tests/infrastructure/trader_lab/test_qore_native_reset_fix_g1_v1.py

  dev_trial:
    needs: causal_quality
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only QORE package (no cTrader credentials)
        run: python -m pip install -e .
      - name: Reuse original 10Y EURUSD data already archived in Core
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-EURUSD-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          run-id: '35166210458'
          github-token: ${{ github.token }}
          path: cibo-original-eurusd
      - name: Run frozen RESET FIX vs PLACEBO paired cohort
        run: |
          python -m qore.infrastructure.trader_lab.qore_native_reset_fix_g1_v1 cibo-original-eurusd output | tee reset-stdout.json
      - name: Assert complete provenance and no trader certification
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          j=json.loads(Path("output/reset-g1-report.json").read_text())
          assert j["identity"]=="QORE_NATIVE_RESET_FIX_G1_CIBO_M5_V1"
          assert j["source"]["source_artifact_id"]==10475354631
          assert j["source"]["raw_annual_m5_sha256_verified"]
          assert j["source"]["raw_m5_total"]==745458
          assert j["results_are_dev_consumed_not_oos"] is True
          assert j["broker_bidask_costs_not_observed"] is True
          assert j["fixing_benchmark_print_not_observed"] is True
          assert j["pnl_pf_sharpe_sortino_not_estimated"] is True
          assert j["no_live_no_vps_no_trade"] is True
          assert j["verdict"] in ("DEV_UNDERPOWERED","DEV_GROSS_NO_SUPPORT","DEV_GROSS_POTENTIAL")
          n=sum(1 for _ in Path("output/reset-g1-common-days.jsonl").open())
          assert n==j["common_days"]
          print("CONFIRMED_RESEARCH_ONLY_G1",j["verdict"],"COMMON_DAYS",n)
          PY
          printf '%s\n' "$GITHUB_SHA" > output/code-head-sha.txt
          printf '%s\n' 'FROZEN_MAIN_PREREG=2e1742bcfc3186084886b04c63e091aa3256bf12' > output/main-prereg-sha.txt
          printf '%s\n' 'FROZEN_IMPLEMENTATION_ADDENDUM=db6017f6046c27e7b1c134a23b4d963e0f5b4634' > output/addendum-sha.txt
          (cd output && sha256sum *.json *.jsonl *.txt > OUTPUT_SHA256SUMS.txt)
      - name: Keep full negative or positive result immutable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qore-native-reset-fix-g1-eurusd-${{ github.sha }}
          path: |
            output/
            reset-stdout.json
          retention-days: 90
          if-no-files-found: warn
