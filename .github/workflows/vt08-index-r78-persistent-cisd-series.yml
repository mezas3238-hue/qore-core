name: VT08 Index R78 Persistent CISD Series

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r78-persistent-cisd-series.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r78_persistent_cisd_series.py
      - tests/infrastructure/trader_lab/test_vt08_index_r78_persistent_cisd_series.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r78_persistent_cisd_series.py

  research:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R78 persistent CISD recovery
        run: |
          python -m qore.infrastructure.trader_lab.vt08_index_r78_persistent_cisd_series \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r78-persistent-cisd-series.json

      - name: Verify R78 source correction and governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r78-persistent-cisd-series.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R78_PERSISTENT_CISD_SERIES_RECOVERY_FALSIFICATION_001"
          )
          assert report["source_r77"]["run_id"] == 35515490620
          assert report["source_r77"]["artifact_id"] == 10607130490
          assert report["source_r77"]["one_cycle_poi_carry_survived"] is False

          correction = report["correction_contract"]
          assert correction["persistent_state_scope"] == "CURRENT_H4_ONLY"
          assert correction["series_open_preserved"] is True
          assert correction["failed_non_opposing_bar_resets_series"] is False
          assert correction["recovery_only_when_canonical_first_cisd_none"] is True
          assert correction["canonical_signals_preserved"] is True
          assert correction["poi_changed"] is False
          assert correction["daily_bias_changed"] is False
          assert correction["anchors_changed"] is False
          assert correction["continuation_changed"] is False
          assert correction["same_c2_body_rule_changed"] is False
          assert correction["stop_rule_changed"] is False

          assert report["five_year"]["canonical_sample"] == 2448
          assert report["recent_two_year"]["canonical_sample"] == 1017
          assert report["r66_failed_holdout"]["canonical_sample"] == 773
          assert report["decision"] == (
              "R78_PERSISTENT_CISD_FALSIFICATION_COMPLETE_NO_CANDIDATE"
          )

          governance = report["governance"]
          assert governance["research_only"] is True
          assert governance["fresh_holdout_claim"] is False
          assert governance["single_source_audit_correction"] is True
          assert governance["future_information_used"] is False
          assert governance["calendar_or_year_runtime_feature"] is False
          assert governance["canonical_signals_suppressed"] is False
          assert governance["persistent_state_crosses_h4_boundary"] is False
          assert governance["risk_allocator_applied_to_added_signals"] is False
          assert governance["candidate_created"] is False
          assert governance["trader_certified"] is False
          assert governance["live_authorized"] is False
          assert governance["real_capital_authorized"] is False
          assert governance["production_authorized"] is False
          PY

      - name: Upload R78 evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r78-persistent-cisd-series-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: warn
          retention-days: 90
