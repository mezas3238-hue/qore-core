name: QORE Capitalizer V3 SOURCE_FIRST WAIT5 LATE60 Forensics 2Y V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-v3-source-first-wait5-late60-forensics-2y-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v3_source_first_wait5_late60_forensics_2y_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v3_source_first_wait5_late60_forensics_2y_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  LATE60_RUN_ID: '35850354903'
  LATE60_SHA: 'b8639455c31e35274dd100a650cc090da559f147'
  WAIT5_RUN_ID: '35844549291'
  WAIT5_SHA: '32bd64963a34b762723416c01cf8a016fd86daab'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_v3_source_first_wait5_late60_forensics_2y_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_v3_source_first_wait5_late60_forensics_2y_v1.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_v3_source_first_wait5_late60_forensics_2y_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_v3_source_first_wait5_late60_forensics_2y_v1.py

  forensic:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download frozen LATE60 market ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v3-source-first-wait5-late60-2y-v1-*-${{ env.LATE60_SHA }}
          path: late60-source
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.LATE60_RUN_ID }}
      - name: Download frozen WAIT5 market ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v3-source-first-wait5-2y-v1-*-${{ env.WAIT5_SHA }}
          path: wait5-source
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.WAIT5_RUN_ID }}
      - name: Run LATE60 forensic decomposition
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v3_source_first_wait5_late60_forensics_2y_v1 \
            late60-source wait5-source forensic-output
      - name: Enforce forensic controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "forensic-output/"
                  "capitalizer-v3-source-first-wait5-late60-forensics-2y-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_V3_SOURCE_FIRST_WAIT5_LATE60_FORENSICS_2Y_V1"
          )
          assert report["late60_portfolio_trades"] == 1327
          assert report["wait5_portfolio_trades"] == 983
          assert report["selected_late60_trades"] == 354
          assert report["outcome_aware_descriptive_only"] is True
          assert report["outcome_used_for_admission"] is False
          assert report["strategy_mutated"] is False
          assert report["economic_candidate"] is False
          assert report["rule_promotion_allowed"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v3-source-first-wait5-late60-forensics-2y-v1-${{ github.sha }}
          path: forensic-output
          if-no-files-found: error
          retention-days: 90
