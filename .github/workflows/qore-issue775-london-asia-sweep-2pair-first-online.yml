name: QORE Issue775 London Asia Sweep L1 L2 Two Pair First Online

on:
  push:
    branches:
      - research/scalper-london-asia-sweep-first-online-m1-20261011
    paths:
      - '.github/workflows/qore-issue775-london-asia-sweep-2pair-first-online.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_london_asia_range_first_online_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_london_asia_range_first_online_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  M1_RUN: '35548099334'
  M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  prereg_and_causal_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Verify original frozen prereg and causal regression tests
        run: |
          test -s docs/research/QORE_ISSUE775_LONDON_EURUSD_GBPUSD_SWEEP_FIRST_ONLINE_PREREG_2026-10-11.md
          python -m compileall -q src/qore/infrastructure/trader_lab/capitalizer_london_asia_range_first_online_v1.py
          ruff check --select F,E4,E7,E9 src/qore/infrastructure/trader_lab/capitalizer_london_asia_range_first_online_v1.py tests/infrastructure/trader_lab/test_capitalizer_london_asia_range_first_online_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_london_asia_range_first_online_v1.py

  london_pairs:
    needs: prereg_and_causal_tests
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        symbol: [EURUSD, GBPUSD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.M1_SHA }}
          path: native
          github-token: ${{ github.token }}
          run-id: ${{ env.M1_RUN }}
      - name: Verify clone is native M1, not interpolated, symbol exact
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os
          manifest=json.loads(Path("native/m1-clone-manifest.json").read_text())
          assert manifest["canonical_symbol"]==os.environ["SYMBOL"]
          assert manifest["provider_native_m1"] and not manifest["synthetic_m1"]
          assert not manifest["interpolated_m1"] and manifest["contradictory_m1"]==0
          assert manifest["read_only"]
          print("NATIVE_ASOF_VALIDATED",os.environ["SYMBOL"])
          PY
      - name: Native-M1 first-online London range study, no V49 outcomes
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_london_asia_range_first_online_v1 market native LONDON-market
      - uses: actions/upload-artifact@v4
        with:
          name: issue775-LONDON-${{ matrix.symbol }}-${{ github.sha }}
          path: LONDON-market/
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: london_pairs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: issue775-LONDON-*-${{ github.sha }}
          path: LONDON-pairs
      - name: Four fixed London hypotheses and date-cluster inference
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_london_asia_range_first_online_v1 aggregate LONDON-pairs LONDON-final
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("LONDON-final/issue775-london-two-pairs-first-online-results.json")
          x=json.loads(p.read_text())
          assert x["symbols"]==["EURUSD","GBPUSD"]
          assert len(x["pairs_pattern_cells"])==4
          assert x["historical_dataset_already_consumed"] and not x["trader_certified"]
          assert not x["production_changed"] and not x["true_broker_bid_ask"]
          assert not x["outcome_based_event_selection"]
          print("ISSUE775_LONDON_REPORT",json.dumps(x,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: issue775-LONDON-2pair-aggregate-${{ github.sha }}
          path: LONDON-final/
          retention-days: 90
          if-no-files-found: error
