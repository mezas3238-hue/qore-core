name: QORE Capitalizer M3 MSS Bottleneck Forensics 2Y V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-m3-mss-bottleneck-forensics-2y-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_m3_mss_bottleneck_forensics_2y_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_m3_mss_bottleneck_forensics_2y_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-m3-mss-bottleneck-forensics-2y-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_m3_mss_bottleneck_forensics_2y_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_m3_mss_bottleneck_forensics_2y_v1.py
      - name: Mypy
        run: |
          mypy src/qore/infrastructure/trader_lab/capitalizer_m3_mss_bottleneck_forensics_2y_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_m3_mss_bottleneck_forensics_2y_v1.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {symbol: USDJPY, session: ASIA}
          - {symbol: AUDJPY, session: ASIA}
          - {symbol: AUDUSD, session: ASIA}
          - {symbol: GBPJPY, session: ASIA}
          - {symbol: EURUSD, session: LONDON}
          - {symbol: GBPUSD, session: LONDON}
          - {symbol: XAUUSD, session: NEW_YORK}
          - {symbol: USDCAD, session: NEW_YORK}
          - {symbol: NAS100, session: NEW_YORK}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable native-M1 clone
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Run 2Y M3 bottleneck atlas
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_m3_mss_bottleneck_forensics_2y_v1 \
            market m1-source forensic-output --session ${{ matrix.session }}
      - name: Enforce forensic boundary
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
          EXPECTED_SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"]
          path = Path("forensic-output") / (
              f"capitalizer-{symbol.lower()}-m3-mss-bottleneck-forensics-2y-v1.json"
          )
          report = json.loads(path.read_text())
          assert report["identity"] == "QORE_CAPITALIZER_M3_MSS_BOTTLENECK_FORENSICS_2Y_V1"
          assert report["symbol"] == symbol
          assert report["session"] == os.environ["EXPECTED_SESSION"]
          assert report["window_start"] == "2024-09-17T00:00:00+00:00"
          assert report["window_end_exclusive"] == "2026-09-17T00:00:00+00:00"
          assert report["m5_closebacks"] == report["valid_m3_mss"] + report["rejected_m3_mss"]
          assert report["thresholds_changed"] is False
          assert report["session_windows_changed"] is False
          assert report["outcome_aware_selection_used"] is False
          assert report["late_mss_used_for_admission"] is False
          assert report["methodology_research_only"] is True
          assert report["diagnostic_window_role"] == "CONSUMED_DIAGNOSTIC_RESEARCH"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-m3-mss-bottleneck-forensics-2y-v1-${{ matrix.symbol }}-${{ github.sha }}
          path: forensic-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-m3-mss-bottleneck-forensics-2y-v1-*-${{ github.sha }}
          path: forensic-input
          merge-multiple: false
      - name: Build nine-market 2Y matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_m3_mss_bottleneck_forensics_2y_v1 \
            matrix forensic-input matrix-output
      - name: Enforce aggregate invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "matrix-output/"
              "capitalizer-nine-market-m3-mss-bottleneck-forensics-2y-v1.json"
          )
          report = json.loads(path.read_text())
          assert report["identity"] == (
              "QORE_CAPITALIZER_NINE_MARKET_M3_MSS_BOTTLENECK_FORENSICS_2Y_V1"
          )
          assert report["market_count"] == 9
          assert report["m5_closebacks"] == report["valid_m3_mss"] + report["rejected_m3_mss"]
          assert report["thresholds_changed"] is False
          assert report["session_windows_changed"] is False
          assert report["outcome_aware_selection_used"] is False
          assert report["late_mss_used_for_admission"] is False
          assert report["methodology_research_only"] is True
          assert report["diagnostic_window_role"] == "CONSUMED_DIAGNOSTIC_RESEARCH"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-nine-market-m3-mss-bottleneck-forensics-2y-v1-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
