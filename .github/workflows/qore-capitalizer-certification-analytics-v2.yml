name: QORE Capitalizer Certification Analytics V2

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_certification_metrics_v2.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_scalper_certification_metrics_v2.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_consumed_certification_audit_v2.py'
      - '.github/workflows/qore-capitalizer-certification-analytics-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_scalper_certification_metrics_v2.py \
            src/qore/infrastructure/trader_lab/capitalizer_scalper_consumed_certification_audit_v2.py \
            tests/infrastructure/trader_lab/test_capitalizer_scalper_certification_metrics_v2.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_scalper_certification_metrics_v2.py \
            tests/infrastructure/trader_lab/test_capitalizer_scalper_certification_metrics_v2.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_scalper_certification_metrics_v2.py
