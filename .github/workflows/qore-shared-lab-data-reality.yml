name: QORE Shared Lab Data Reality

on:
  pull_request:
    paths:
      - "src/qore/infrastructure/core_stack_v2/shared_lab_golden_traces.py"
      - "src/qore/infrastructure/core_stack_v2/shared_lab_data_reality.py"
      - "src/qore/infrastructure/core_stack_v2/shared_lab_temporal_harness.py"
      - "src/qore/infrastructure/core_stack_v2/shared_lab_sensor_harness.py"
      - "tests/infrastructure/test_core_stack_v2_shared_lab_*"
      - ".github/workflows/qore-shared-lab-data-reality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-reality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -U pytest pytest-cov
      - name: Shared Lab Data Reality tests
        run: >
          python -m pytest -q
          tests/infrastructure/test_core_stack_v2_shared_lab_golden_traces.py
          tests/infrastructure/test_core_stack_v2_shared_lab_temporal_harness.py
          tests/infrastructure/test_core_stack_v2_shared_lab_data_reality.py
          tests/infrastructure/test_core_stack_v2_shared_lab_sensor_harness.py
          tests/infrastructure/test_core_stack_v2_shared_lab_provider_harness.py
          tests/infrastructure/test_core_stack_v2_shared_lab_identity_harness.py
          tests/infrastructure/test_core_stack_v2_shared_lab_market_hours.py
          tests/infrastructure/test_core_stack_v2_shared_lab_data_l10.py
