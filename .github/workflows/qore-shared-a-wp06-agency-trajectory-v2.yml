name: QORE Shared A WP06 Agency Trajectory V2

concurrency:
  group: qore-shared-a-wp06-agency-trajectory-v2
  cancel-in-progress: false

on:
  push:
    branches:
      - agent/shared-a-cognitive-science-001
    paths:
      - docs/shared/evidence/QORE_SHARED_WP06_MARKET_AGENCY_TRAJECTORY_V2_PREREGISTRATION_001.json
      - scripts/shared_wp06_agency_trajectory_v2.py
      - .github/workflows/qore-shared-a-wp06-agency-trajectory-v2.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  temporal-oos:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pip install scikit-learn
      - name: Validate preregistration
        run: |
          set -euo pipefail
          mkdir -p input/{r6,r5,oos} result
          ruff check scripts/shared_wp06_agency_trajectory_v2.py
          python -m py_compile scripts/shared_wp06_agency_trajectory_v2.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("docs/shared/evidence/QORE_SHARED_WP06_MARKET_AGENCY_TRAJECTORY_V2_PREREGISTRATION_001.json").read_text())
          assert p["status"] == "PREREGISTERED_BEFORE_TEMPORAL_OOS_SCORING"
          assert p["failure_knowledge"]["burned_r6_r5_may_demonstrate_v2_value"] is False
          assert p["scientific_hypothesis"]["numeric_rescue_threshold_added"] is False
          assert p["temporal_oos"]["used_for_fit"] is False
          assert p["governance"]["protected_certification_holdout_opened"] is False
          PY
      - name: Recover burned development and temporal OOS
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10389112524/zip" > r6.zip
          unzip -q r6.zip -d input/r6
          (cd input/r6 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10380044761/zip" > r5.zip
          unzip -q r5.zip -d input/r5
          (cd input/r5 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11070988924/zip" > oos.zip
          unzip -q oos.zip -d input/oos
          (cd input/oos && sha256sum -c SHA256SUMS)
      - name: Score V2 once on later temporal OOS
        run: |
          set -euo pipefail
          python scripts/shared_wp06_agency_trajectory_v2.py             --r6-nas input/r6/fresh/NAS100/market-evidence.json             --r6-sp input/r6/fresh/SP500/market-evidence.json             --r6-us input/r6/fresh/US30/market-evidence.json             --r5-nas input/r5/fresh/NAS100/market-evidence.json             --r5-sp input/r5/fresh/SP500/market-evidence.json             --r5-us input/r5/fresh/US30/market-evidence.json             --oos-nas input/oos/fresh/NAS100/market-evidence.json             --oos-sp input/oos/fresh/SP500/market-evidence.json             --oos-us input/oos/fresh/US30/market-evidence.json             --output result/wp06-agency-trajectory-v2.json             | tee result/summary.json
      - name: Validate disposition without forcing pass
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/wp06-agency-trajectory-v2.json").read_text())
          assert p["status"] in {
              "WP06_AGENCY_TRAJECTORY_V2_TEMPORAL_OOS_PASS",
              "WP06_AGENCY_TRAJECTORY_V2_TEMPORAL_OOS_FALSIFIED",
          }
          assert p["oos_used_for_fit"] is False
          assert p["hyperparameter_search_used"] is False
          assert p["outcome_used_for_agency_inference"] is False
          assert p["future_market_used_for_agency_inference"] is False
          assert p["wp05_dependency_closed"] is False
          assert p["wp06_completed_and_proven"] is False
          assert p["protected_certification_holdout_opened"] is False
          PY
      - name: Seal result
        run: |
          cp docs/shared/evidence/QORE_SHARED_WP06_MARKET_AGENCY_TRAJECTORY_V2_PREREGISTRATION_001.json result/preregistration.json
          printf '%s\n' "${GITHUB_SHA}" > result/code-git-sha.txt
          (
            cd result
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-a-wp06-agency-trajectory-v2-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
      - name: Report WP06 V2
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p=json.loads(Path("result/wp06-agency-trajectory-v2.json").read_text())
          body="\n".join([
              "## Shared A WP-06 / MC-17 — Agency Trajectory V2",
              "",
              f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- disposition: **{p['status']}**",
              f"- baseline: **{p['baseline']}**",
              f"- treatment: **{p['treatment']}**",
              f"- improvements: **{p['improvements']}**",
              f"- gates: **{p['gates']}**",
              "- OOS used for fit: **False**",
              "- WP-05 dependency closed: **False**",
              "- WP-06 completed-and-proven: **False**",
          ])+"\n"
          Path("result/issue-comment.md").write_text(body)
          PY
          gh issue comment 644 --body-file result/issue-comment.md
