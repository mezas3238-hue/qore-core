name: QORE CI

on:
  pull_request:
    branches: [validation/abb8-runtime-ci-base-001]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff integration delta
        run: |
          ruff check --ignore E501,I001             scripts/build_audjpy_r42_live_memory.py             scripts/fundednext_mt5_order_check_probe.py             scripts/qore_fundednext_runtime.py             src/qore/infrastructure/account_wide_risk.py             src/qore/infrastructure/r42_audjpy_live.py             tests/infrastructure/test_r42_audjpy_live.py             tests/infrastructure/test_audjpy_r42_runtime_integration.py

      - name: Mypy integration delta
        run: |
          mypy --disable-error-code attr-defined             scripts/build_audjpy_r42_live_memory.py             scripts/qore_fundednext_runtime.py             src/qore/infrastructure/account_wide_risk.py             src/qore/infrastructure/r42_audjpy_live.py

      - name: Runtime syntax
        run: |
          python -m py_compile             scripts/fundednext_mt5_order_check_probe.py             scripts/qore_fundednext_runtime.py             src/qore/infrastructure/r42_audjpy_live.py

      - name: AUDJPY focused and memory binding
        run: |
          pytest -q --no-cov             tests/infrastructure/test_r42_audjpy_live.py             tests/infrastructure/test_audjpy_r42_runtime_integration.py

      - name: Existing trader regressions
        run: |
          pytest -q --no-cov             tests/infrastructure/test_r34_xauusd_live.py             tests/infrastructure/test_r38_eurusd_live.py             tests/infrastructure/test_r43_gbpusd_live.py             tests/infrastructure/test_r38_gbpjpy_live.py

      - name: Account-wide risk and state rebind
        run: |
          pytest -q --no-cov             tests/infrastructure/test_account_wide_risk.py             tests/infrastructure/test_fundednext_shadow_state_rebind.py

      - name: Immutable legacy bindings
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              "runtime_data/gbpusd/r43-r32-regime-memory.json":
                  "e4a79978c0144e0b97c19ce3ee18040e62a02efe891b204fc724e4a0016734ae",
              "runtime_data/gbpjpy/r38-confidence-tier-memory.json":
                  "16a369e8457394642642ca2c7331e32b05644a5656d339cbba06db089f44211f",
          }
          for raw, digest in expected.items():
              data = Path(raw).read_bytes().replace(b"\r\n", b"\n")
              assert hashlib.sha256(data).hexdigest() == digest, raw
          PY
