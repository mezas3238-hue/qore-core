name: QORE CIBO Phase19M Regime Identifiability

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-phase19m-regime-identifiability.yml'
      - 'scripts/cibo_phase19m_regime_identifiability_audit.py'
      - 'src/qore/infrastructure/cibo_ce2i_phase19_regime_identifiability.py'
      - 'tests/infrastructure/test_cibo_ce2i_phase19_regime_identifiability.py'
      - 'src/qore/infrastructure/cibo_ce2i_calibration_registry.py'
  push:
    branches:
      - agent/cibo-capital-efficiency-sizing-lab-001
    paths:
      - '.github/workflows/cibo-phase19m-regime-identifiability.yml'
      - 'scripts/cibo_phase19m_regime_identifiability_audit.py'
      - 'src/qore/infrastructure/cibo_ce2i_phase19_regime_identifiability.py'
      - 'tests/infrastructure/test_cibo_ce2i_phase19_regime_identifiability.py'
      - 'src/qore/infrastructure/cibo_ce2i_calibration_registry.py'

permissions:
  contents: read
  actions: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  GH_TOKEN: ${{ github.token }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Focused quality
        run: |
          ruff check \
            scripts/cibo_phase19m_regime_identifiability_audit.py \
            src/qore/infrastructure/cibo_ce2i_phase19_regime_identifiability.py \
            tests/infrastructure/test_cibo_ce2i_phase19_regime_identifiability.py
          mypy \
            scripts/cibo_phase19m_regime_identifiability_audit.py \
            src/qore/infrastructure/cibo_ce2i_phase19_regime_identifiability.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_ce2i_phase19_regime_identifiability.py

  audit:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .

      - name: Recover immutable Phase18 evidence
        run: |
          set -euo pipefail
          mkdir -p source/{gbpjpy,gbpusd,audjpy,eurusd,xauusd,vt08,vt31} phase19m-output

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10909937201/zip" > gbpjpy.zip
          echo "b59d8c045a0e86f0e22fb0044dc04eb6dff0f17de4c9f7c7389b903adc443956  gbpjpy.zip" | sha256sum -c -
          unzip -q gbpjpy.zip -d source/gbpjpy

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10910093452/zip" > gbpusd.zip
          echo "93c9c4872543938571eb6ab12e242bde4ec9e7682f056593efde59f88b4579c9  gbpusd.zip" | sha256sum -c -
          unzip -q gbpusd.zip -d source/gbpusd

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10910875686/zip" > audjpy.zip
          echo "7b40e1be53ce0508106b036c68ce4ebb3155bc5c14875144634e365cfb988de5  audjpy.zip" | sha256sum -c -
          unzip -q audjpy.zip -d source/audjpy

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10910397898/zip" > eurusd.zip
          echo "71bb5ce12b7cfc8f2d17b89dcf907b8b74f4a2257f2055adbe9e9d619c324774  eurusd.zip" | sha256sum -c -
          unzip -q eurusd.zip -d source/eurusd

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10910328640/zip" > xauusd.zip
          echo "aade958d597032bad08c56043a6c48c145b8ab263f032f2b65c147fd3db7aadd  xauusd.zip" | sha256sum -c -
          unzip -q xauusd.zip -d source/xauusd

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10913050112/zip" > vt08.zip
          echo "8543a33962d24d3f5346981328df78d145286fc8af9387d73eca85519922f568  vt08.zip" | sha256sum -c -
          unzip -q vt08.zip -d source/vt08

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10912945588/zip" > vt31.zip
          echo "2200392deeb081525720430a816e8f82b18d7333c61a05eb197632ed24849e15  vt31.zip" | sha256sum -c -
          unzip -q vt31.zip -d source/vt31

          for directory in gbpjpy gbpusd audjpy eurusd xauusd vt08 vt31; do
            (cd "source/${directory}" && sha256sum -c SHA256SUMS.txt)
          done

      - name: Run Phase19M regime identifiability audit
        run: |
          python scripts/cibo_phase19m_regime_identifiability_audit.py \
            --gbpjpy source/gbpjpy/phase18-gbpjpy-r38-bound-trades.jsonl \
            --gbpusd source/gbpusd/phase18-gbpusd-r43-bound-trades.jsonl \
            --audjpy source/audjpy/phase18-audjpy-r42-bound-trades.jsonl \
            --eurusd source/eurusd/phase18-eurusd-r38-bound-trades.jsonl \
            --xauusd source/xauusd/phase18-xauusd-r34-bound-trades.jsonl \
            --vt08 source/vt08/phase18-vt08-r315-fundednext-trades.jsonl \
            --vt31 source/vt31/phase18-vt31-v4-bound-trades.jsonl \
            --output phase19m-output/phase19m-regime-identifiability.json \
            > phase19m-output/phase19m-regime-identifiability.stdout.json

      - name: Enforce T12 non-promotion governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("phase19m-output/phase19m-regime-identifiability.json").read_text()
          )
          assert report["status"] == "PORTFOLIO_REGIME_IDENTIFIABILITY_BLOCKED_PARTIAL_3_OF_7"
          assert report["canonical_shared_schema"]["lineage_count"] == 3
          assert report["bespoke_unmapped_schema"]["lineage_count"] == 1
          assert report["missing_shared_schema"]["lineage_count"] == 3
          assert report["interpretation"]["portfolio_regime_state_identified"] is False
          assert report["interpretation"]["t12_calibration_promotion_from_this_report"] is False
          assert report["governance"]["trade_outcomes_read"] is False
          assert report["governance"]["holdout_2017h1_used"] is False
          assert report["governance"]["oos_ready"] is False
          PY

      - name: Seal artifact provenance
        run: |
          printf '%s\n' "${EVIDENCE_SHA}" > phase19m-output/git-sha.txt
          (cd phase19m-output && sha256sum \
            phase19m-regime-identifiability.json \
            phase19m-regime-identifiability.stdout.json \
            git-sha.txt \
            > SHA256SUMS.txt)
          (cd phase19m-output && sha256sum -c SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-phase19m-regime-identifiability-${{ env.EVIDENCE_SHA }}
          path: phase19m-output
          if-no-files-found: error
