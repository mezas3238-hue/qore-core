name: QORE Capitalizer Cognitive M3 Stop Protection True 2R V2

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-cognitive-m3-stop-protection-true-2r-v2.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_cognitive_m3_stop_protection_true_2r_v2.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_cognitive_m3_stop_protection_true_2r_v2.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-cognitive-m3-stop-protection-true-2r-v2-${{ github.sha }}
  cancel-in-progress: false

env:
  TARGET_V2_RUN_ID: '36077843102'
  TARGET_V2_SHA: 'a47de3b491b4468527c945d6eff3afbbaec82d4e'
  M1_RUN_ID: '35548099334'
  M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_cognitive_m3_stop_protection_true_2r_v2.py \
            tests/infrastructure/trader_lab/test_capitalizer_cognitive_m3_stop_protection_true_2r_v2.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_cognitive_m3_stop_protection_true_2r_v2.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_cognitive_m3_stop_protection_true_2r_v2.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol:
          - USDJPY
          - AUDJPY
          - AUDUSD
          - GBPJPY
          - EURUSD
          - GBPUSD
          - XAUUSD
          - USDCAD
          - NAS100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download corrected Target V2 ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-max-recovery-target-sensitivity-2y-v2-*-${{ env.TARGET_V2_SHA }}
          path: target-input
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_V2_RUN_ID }}
      - name: Download immutable provider-native M1
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.M1_SHA }}
          path: m1-input
          github-token: ${{ github.token }}
          run-id: ${{ env.M1_RUN_ID }}
      - name: Run true-2R M3 stop-protection ablation
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cognitive_m3_stop_protection_true_2r_v2 \
            market target-input m1-input stop-output --symbol "${{ matrix.symbol }}"
      - name: Enforce market invariants
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"]
          report = json.loads(
              (
                  Path("stop-output")
                  / f"capitalizer-{symbol.lower()}-cognitive-m3-stop-protection-true-2r-v2.json"
              ).read_text()
          )
          assert report["symbol"] == symbol
          assert report["target_r"] == "2.00"
          assert report["market_trades"] > 0
          assert report["original_reproduction_mismatches"] == 0
          assert report["m3_confirmation_causal"] is True
          assert report["stop_updates_monotonic_only"] is True
          assert report["stop_can_widen"] is False
          assert report["target_unchanged"] is True
          assert report["entry_unchanged"] is True
          assert report["admission_changed"] is False
          assert report["density_changed"] is False
          assert report["mode_selected"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["trader_certified"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-cognitive-m3-stop-protection-true-2r-v2-${{ matrix.symbol }}-${{ github.sha }}
          path: stop-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-cognitive-m3-stop-protection-true-2r-v2-*-${{ github.sha }}
          path: stop-input
          merge-multiple: false
      - name: Build nine-market true-2R stop-protection matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cognitive_m3_stop_protection_true_2r_v2 \
            matrix stop-input matrix-output
      - name: Enforce aggregate invariants
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          report = json.loads(
              Path(
                  "matrix-output/"
                  "capitalizer-nine-market-cognitive-m3-stop-protection-true-2r-v2.json"
              ).read_text()
          )
          assert report["market_count"] == 9
          assert report["trades"] == 948
          assert report["target_r"] == "2.00"
          assert report["density_retention"] == "1"
          original = report["original_metrics"]
          assert original["trades"] == 948
          assert Decimal(original["profit_factor"]) == Decimal(
              "1.466020472120789368123727041"
          )
          assert Decimal(original["total_r"]) == Decimal(
              "153.9927998412621697329314877"
          )
          assert Decimal(original["max_drawdown_r"]) == Decimal(
              "12.93584837435268644582248142"
          )
          assert report["m3_confirmation_causal"] is True
          assert report["stop_can_widen"] is False
          assert report["target_unchanged"] is True
          assert report["entry_unchanged"] is True
          assert report["admission_changed"] is False
          assert report["density_changed"] is False
          assert report["mode_selected"] is False
          assert report["automatic_promotion_allowed"] is False
          assert report["fresh_holdout_required_after_selection"] is True
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-nine-market-cognitive-m3-stop-protection-true-2r-v2-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
