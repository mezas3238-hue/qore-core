name: QORE Capitalizer V3 SOURCE_FIRST WAIT5 DD Joint Forensics 2Y V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-v3-source-first-wait5-dd-joint-forensics-2y-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v3_source_first_wait5_dd_joint_forensics_2y_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v3_source_first_wait5_dd_joint_forensics_2y_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  WAIT5_RUN_ID: '35844549291'
  WAIT5_SHA: '32bd64963a34b762723416c01cf8a016fd86daab'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_v3_source_first_wait5_dd_joint_forensics_2y_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_v3_source_first_wait5_dd_joint_forensics_2y_v1.py
      - run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_v3_source_first_wait5_dd_joint_forensics_2y_v1.py
      - run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_v3_source_first_wait5_dd_joint_forensics_2y_v1.py

  forensic:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v3-source-first-wait5-2y-v1-*-${{ env.WAIT5_SHA }}
          path: wait5-source
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.WAIT5_RUN_ID }}
      - run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v3_source_first_wait5_dd_joint_forensics_2y_v1 \
            wait5-source forensic-output
      - name: Enforce diagnostic controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "forensic-output/"
                  "capitalizer-nine-market-v3-source-first-wait5-dd-joint-forensics-2y-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_V3_SOURCE_FIRST_WAIT5_DD_JOINT_FORENSICS_2Y_V1"
          )
          assert report["max3_trades"] == 983
          assert report["max_drawdown_r"] == "11.9420088471277198029814040"
          assert report["negative_fvg_to_entry_timing"] == 0
          assert report["outcome_aware_diagnostic_only"] is True
          assert report["outcome_used_for_admission"] is False
          assert report["runtime_filter_selected"] is False
          assert report["threshold_optimization_used"] is False
          assert report["candidate_frozen"] is False
          assert report["economic_candidate"] is False
          assert report["fresh_holdout_claimed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-nine-market-v3-source-first-wait5-dd-joint-forensics-2y-v1-${{ github.sha }}
          path: forensic-output
          if-no-files-found: error
          retention-days: 90
