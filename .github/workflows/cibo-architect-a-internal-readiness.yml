name: QORE CIBO Architect A Internal Readiness

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-architect-a-internal-readiness.yml'
      - 'src/qore/infrastructure/cibo_arch_a_internal_readiness.py'
      - 'src/qore/infrastructure/cibo_arch_a_phase22_pre_outcome.py'
      - 'scripts/cibo_arch_a_internal_readiness_gate.py'
      - 'tests/infrastructure/test_cibo_arch_a_internal_readiness_gate.py'
      - 'tests/infrastructure/test_cibo_arch_a_phase22_pre_outcome.py'
      - 'docs/research/CIBO-MASTER-OPEN-WORK-LEDGER-V1.json'
      - 'docs/research/CIBO-ARCH-A-INTERNAL-READINESS-GATE-V1.md'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  architect-a-internal-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Architect A internal-readiness contract
        run: |
          ruff check \
            src/qore/infrastructure/cibo_arch_a_internal_readiness.py \
            src/qore/infrastructure/cibo_arch_a_phase22_pre_outcome.py \
            src/qore/infrastructure/cibo_arch_a_phase22_pre_outcome.py \
            scripts/cibo_arch_a_internal_readiness_gate.py \
            tests/infrastructure/test_cibo_arch_a_internal_readiness_gate.py \
            tests/infrastructure/test_cibo_arch_a_phase22_pre_outcome.py
          mypy \
            src/qore/infrastructure/cibo_arch_a_internal_readiness.py \
            scripts/cibo_arch_a_internal_readiness_gate.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_arch_a_internal_readiness_gate.py \
            tests/infrastructure/test_cibo_arch_a_phase22_pre_outcome.py
          python scripts/cibo_arch_a_internal_readiness_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: cibo-architect-a-internal-readiness
          path: artifacts/cibo_arch_a_internal_readiness_v1.json
