name: VT08 A to B Canonical Market-Specific Raw Custody

on:
  push:
    branches:
      - agent/vt08-5m-methodology-source-20261010
    paths:
      - .github/workflows/vt08-a-b-market-custody-catalog-v1.yml
      - src/qore/infrastructure/trader_lab/vt08_a_b_market_custody_catalog_v1.py
      - src/qore/infrastructure/trader_lab/vt08_a_m30m3_frozen_family_source_funnel_v1.py
      - tests/infrastructure/trader_lab/test_vt08_a_b_market_custody_catalog_v1.py
      - docs/research/VT08_A_FROZEN_M30M3_BULLISH_FIRST_FAIL_COUNTS_2026-10-15.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  canonical-source-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        market: [EURJPY, USDCHF, NZDUSD, CADJPY, USDCAD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Source clock, cross-market and hash adversarial proof
        run: |
          ruff check src/qore/infrastructure/trader_lab/vt08_a_b_market_custody_catalog_v1.py tests/infrastructure/trader_lab/test_vt08_a_b_market_custody_catalog_v1.py
          pytest -q tests/infrastructure/trader_lab/test_vt08_a_b_market_custody_catalog_v1.py
      - uses: actions/download-artifact@v4
        with:
          name: qore-vt08-cognitive-5m-fresh-${{ matrix.market }}-b2d33e1b4829d8b4afc76983decca8a99131403c
          path: native-m15/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 35934924907
      - uses: actions/download-artifact@v4
        with:
          name: qore-vt08-m3-fractal-${{ matrix.market }}-bc1379d7661aac202495ec67afdd3098473ba723
          path: native-m3/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 35941643396
      - name: Reconstruct native frozen source then emit independent B-compatible catalog
        env:
          MARKET: ${{ matrix.market }}
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from qore.infrastructure.trader_lab.vt08_a_m30m3_frozen_family_source_funnel_v1 import run
          from qore.infrastructure.trader_lab.vt08_a_b_market_custody_catalog_v1 import build_catalog
          market=os.environ["MARKET"]
          source=list(Path("native-m3",market).rglob("m3-evidence.json"))
          if len(source)!=1:
              raise SystemExit("one genuine source M3 required")
          native15=Path("native-m15",market,"market-evidence-1095d.json")
          manifest=json.loads(Path(
              "docs/research/VT08_A_FROZEN_M30M3_BULLISH_FIRST_FAIL_COUNTS_2026-10-15.json"
          ).read_text(encoding="utf-8"))
          source_report=run(market,source[0],native15)
          catalog=build_catalog(
              market=market,source_report=source_report,frozen_manifest=manifest,
          )
          out=Path("evidence",market+"-A-to-B-canonical-source-catalog.json")
          out.write_text(
              json.dumps(catalog,sort_keys=True,separators=(",",":"),allow_nan=False),
              encoding="utf-8",
          )
          print(json.dumps({
              "market":market,
              "verified_files":catalog["source_raw_market_map"],
              "source_only_event_count":catalog["source_only_event_count"],
              "catalog_unique_bars":catalog["catalog_unique_bars"],
              "semantic_authority":catalog["author_fidelity_certified"],
              "orders":catalog["orders"],
              "fills":catalog["fills"],
              "pnl_evaluated":catalog["pnl_evaluated"],
              "schema":catalog["schema"],
          },sort_keys=True))
          if catalog["source_only_event_count"] != manifest[
              "market_rows"
          ][market]["stage_counts"][
              "UNIQUE_M3_CISD_PS_SHAPE_REQUIRES_AUTHOR_ADJUDICATION"
          ]:
              raise SystemExit("source family count drift")
          if catalog["orders"] or catalog["fills"] or catalog["pnl_evaluated"]:
              raise SystemExit("certification privilege escalation")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vt08-a-b-market-catalog-${{ matrix.market }}-${{ github.sha }}
          path: evidence/*.json
          if-no-files-found: error
          retention-days: 30
