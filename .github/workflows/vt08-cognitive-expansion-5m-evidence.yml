name: QORE VT08 Cognitive Expansion 5M Evidence

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vt08-cognitive-expansion-5m-v1-001
    paths:
      - .github/workflows/vt08-cognitive-expansion-5m-evidence.yml

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        symbol: [EURJPY, USDCHF, NZDUSD, CADJPY, USDCAD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cTrader runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ctrader]"
      - name: Collect 760-day sanitized read-only evidence
        env:
          QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID }}
          QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET }}
          QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN }}
          QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN }}
          QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID }}
          QORE_DEMO_LAB_LOOKBACK_DAYS: "760"
          QORE_DEMO_LAB_SYMBOL: ${{ matrix.symbol }}
          QORE_SOFTWARE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          required = (
              "QORE_CTRADER_CLIENT_ID",
              "QORE_CTRADER_CLIENT_SECRET",
              "QORE_CTRADER_ACCESS_TOKEN",
              "QORE_CTRADER_REFRESH_TOKEN",
              "QORE_CTRADER_DEMO_ACCOUNT_ID",
          )
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("missing required DEMO runtime inputs: " + ",".join(missing))
          PY
          mkdir -p "artifacts/vt08-expansion-${QORE_DEMO_LAB_SYMBOL}"
          python -m qore.infrastructure.ctrader_demo_lab_long_horizon_probe >             "artifacts/vt08-expansion-${QORE_DEMO_LAB_SYMBOL}/market-evidence.json"
          printf '%s\n' "${GITHUB_SHA}" >             "artifacts/vt08-expansion-${QORE_DEMO_LAB_SYMBOL}/git-sha.txt"
      - name: Validate and replay
        env:
          QORE_DEMO_LAB_SYMBOL: ${{ matrix.symbol }}
          QORE_SOFTWARE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from qore.infrastructure.trader_lab.vt08_cognitive_expansion_5m_backtest_v1 import (
              run_market_backtest,
          )

          symbol = os.environ["QORE_DEMO_LAB_SYMBOL"]
          root = Path(f"artifacts/vt08-expansion-{symbol}")
          evidence = json.loads((root / "market-evidence.json").read_text())
          assert evidence["environment"] == "demo"
          assert evidence["read_only"] is True
          assert evidence["account_is_live"] is False
          assert evidence["symbol"]["symbol_name"] == symbol
          assert evidence["software_sha"] == os.environ["QORE_SOFTWARE_SHA"]
          assert evidence["required_coverage_days"] == 730
          assert evidence["periods"]["M15"]

          report = run_market_backtest(root / "market-evidence.json")
          (root / "vt08-5m-replay.json").write_text(
              json.dumps(report, sort_keys=True, separators=(",", ":")),
              encoding="utf-8",
          )
          print(json.dumps({
              "symbol": symbol,
              **report["economics"],
          }, sort_keys=True))
          PY
      - name: Upload sanitized evidence and replay
        uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-cognitive-expansion-5m-${{ matrix.symbol }}-${{ github.sha }}
          path: artifacts/vt08-expansion-${{ matrix.symbol }}
          if-no-files-found: error
          retention-days: 30
