name: QORE Scalper A1 Method-First CISD No-Lookahead Boundary 9 Markets

on:
  push:
    branches: [agent/scalper-architect-a-cognition-20261010]
    paths:
      - '.github/workflows/qore-scalper-a1-cisd-method-outcome-blind-nine-market-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_a1_cisd_outcome_blind_method_boundary_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_a1_cisd_outcome_blind_method_boundary_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  V49_RUN: '38053946695'
  V49_SHA: 'e356e7a52541e99533b25ecfef0ab9c4e9ce03c0'
  A2_CISD_381_RUN: '38076268436'
  A2_CISD_381_SHA: '1cc7b569682ec82b97fd355f5808bbc6202ef19d'

jobs:
  cisd_no_hindsight_quarantine:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Validate strict A2 input schema / no future PnL / no cognitive promotion
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_a1_cisd_outcome_blind_method_boundary_v1.py tests/infrastructure/trader_lab/test_capitalizer_a1_cisd_outcome_blind_method_boundary_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_a1_cisd_outcome_blind_method_boundary_v1.py tests/infrastructure/trader_lab/test_capitalizer_a1_cisd_outcome_blind_method_boundary_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_a1_cisd_outcome_blind_method_boundary_v1.py
      - uses: actions/download-artifact@v4
        with:
          pattern: scalper-a2-v49-control-*-${{ env.V49_SHA }}
          path: frozen-v49
          run-id: ${{ env.V49_RUN }}
          github-token: ${{ github.token }}
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          pattern: scalper-a2-ninth-cisd-*-${{ env.A2_CISD_381_SHA }}
          path: pinned-a2-cisd
          run-id: ${{ env.A2_CISD_381_RUN }}
          github-token: ${{ github.token }}
          merge-multiple: false
      - name: Produce only as-of source CISD witness subset from 2876 B forensic records
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_a1_cisd_outcome_blind_method_boundary_v1 frozen-v49 pinned-a2-cisd safe-research-only
      - name: Assert nine markets, exact A2 taxonomy, and zero postdecision leakage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path("safe-research-only")
          d=json.loads((out/"scalper-a1-cisd-method-boundary-summary.json").read_text())
          r=(out/"scalper-a1-outcome-blind-cisd-witnesses.jsonl").read_text()
          assert d["nine_markets"]==9
          assert d["source_ids_reconciled"]==d["original_opportunities"]==2876
          assert d["counts"]["MATCHED"]==2495
          assert d["counts"]["SENSOR_EARLIER_THAN_V49"]==247
          assert d["counts"]["SAME_TIME_DIFFERENT_FAMILY"]==134
          assert d["post_entry_mfe_mae_excluded_from_output"] is True
          assert d["h1_opposite_direction_not_instrumented"] is True
          assert d["source_window_and_route_author_fidelity_unresolved"] is True
          assert not d["safe_cognitive_admission_unlocked"]
          assert not d["full_nine_market_master_frame_executed"]
          assert d["trades_changed"]==d["new_entry_vetoes"]==0
          assert d["profit_factor"] is None and d["drawdown_r"] is None
          assert all(x not in r for x in (
            "original_excur","sensor_excur","mfe_","mae_",
            "signed_final_price","risk_geometry_valid_at_observation",
            "uses_ex_post_bars","favorable_at_30","outcome_used",
          ))
          print("CISD CAUSAL OUTCOME-BLIND GATE",json.dumps(d,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-a1-method-first-no-hindsight-nine-market-${{ github.sha }}
          path: safe-research-only/
          retention-days: 90
          if-no-files-found: error
