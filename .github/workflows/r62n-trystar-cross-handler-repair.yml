name: R62N TryStar cross-handler repair

on:
  push:
    branches:
      - agent/qore-umi14-umi12-final-owner-recert-001
    paths:
      - .github/workflows/r62n-trystar-cross-handler-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Validate staging ancestry and immutable inputs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "cb5d264dac42f2bf3b6f12acb8da070efd7c8191"
          test "$(git hash-object tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py)" = "0df0138326bfcd3cc0fa8b9f0cc6d62f50658d11"
          test "$(git hash-object tests/infrastructure/test_universal_cross_asset_conformance_full_closure.py)" = "249caa1504e2b62277a9389dc7e73bcabf12e7db"
          test "$(git rev-parse --abbrev-ref HEAD)" = "agent/qore-umi14-umi12-final-owner-recert-001"

      - name: Apply bounded patch and self-clean staging
        env:
          PATCHER_B64: )
        run: |
          set -euo pipefail
          printf '%s' "$PATCHER_B64" | base64 -d > /tmp/r62n_cross_handler_patch.py
          python /tmp/r62n_cross_handler_patch.py
          rm -f /tmp/r62n_cross_handler_patch.py
          git rm -f .github/workflows/r62n-trystar-cross-handler-repair.yml
          git diff --check
          test -z "$(git diff --name-only -- src/qore)"
          test "$(git hash-object tests/infrastructure/test_universal_cross_asset_conformance_full_closure.py)" = "249caa1504e2b62277a9389dc7e73bcabf12e7db"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Targeted R62N regression
        run: |
          pytest -q tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src tests

      - name: Full pytest and coverage
        run: pytest --cov=src/qore --cov-report=term-missing

      - name: Publish exact repaired head
        env:
          BRANCH: agent/qore-umi14-umi12-final-owner-recert-001
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only -- src/qore)"
          test "$(git hash-object tests/infrastructure/test_universal_cross_asset_conformance_full_closure.py)" = "249caa1504e2b62277a9389dc7e73bcabf12e7db"
          test ! -e .github/workflows/r62n-trystar-cross-handler-repair.yml
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort)" = "$(printf '%s\n' ci.yml oanda-practice-market-feed.yml | sort)"
          git config user.name qore-integration-authority
          git config user.email qore-integration-authority@users.noreply.github.com
          git add tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
          git commit -m "Propagate R62N TryStar cross-handler state"
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:$BRANCH"
