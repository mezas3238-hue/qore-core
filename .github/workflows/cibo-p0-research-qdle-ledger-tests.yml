name: CIBO P0 Research QDLE Ledger (NO LIVE)
on:
  push:
    branches:
      - agent/cibo-p0-replay-qdle-persistence-20261009
    paths:
      - "scripts/cibo_trader_lab_native_qdle_market_atlas_3368.py"
      - "scripts/cibo_p0_native_replay_runtime.py"
      - "scripts/cibo_p0_native_postfill_director.py"
      - "src/qore/infrastructure/cibo_managed_exit_replay.py"
      - "tests/infrastructure/test_cibo_p0_native_postfill_director.py"
      - "tests/infrastructure/test_cibo_p0_native_replay_runtime.py"
      - "tests/infrastructure/test_cibo_four_motor_policy_p0.py"
      - "src/qore/infrastructure/qore_dynamic_lot_engine.py"
      - "src/qore/infrastructure/cibo_four_motor_policy.py"
      - "src/qore/infrastructure/cibo_compound_capital.py"
      - "src/qore/infrastructure/cibo_marginal_leverage_utility.py"
      - "src/qore/infrastructure/cibo_core_compound_portfolio.py"
      - "tests/infrastructure/test_cibo_p0_research_qdle_persistence.py"
      - ".github/workflows/cibo-p0-research-qdle-ledger-tests.yml"
  pull_request:
    branches: [agent/cibo-sovereign-integration-p0-20261008]
    paths:
      - "scripts/cibo_trader_lab_native_qdle_market_atlas_3368.py"
      - "src/qore/infrastructure/qore_dynamic_lot_engine.py"
      - "src/qore/infrastructure/cibo_four_motor_policy.py"
      - "tests/infrastructure/test_cibo_p0_research_qdle_persistence.py"
permissions:
  contents: read
jobs:
  research-paper-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: src
      QORE_LIVE_TRADING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile research and economic producers
        run: |
          test "$QORE_LIVE_TRADING" = "false"
          python -m py_compile \
            scripts/cibo_trader_lab_native_qdle_market_atlas_3368.py \
            scripts/cibo_p0_native_replay_runtime.py \
            scripts/cibo_p0_native_postfill_director.py \
            src/qore/infrastructure/cibo_managed_exit_replay.py \
            src/qore/infrastructure/qore_dynamic_lot_engine.py \
            src/qore/infrastructure/cibo_four_motor_policy.py \
            src/qore/infrastructure/cibo_compound_capital.py \
            src/qore/infrastructure/cibo_marginal_leverage_utility.py \
            src/qore/infrastructure/cibo_core_compound_portfolio.py
      - name: Isolated financial evidence and research ledger regression
        run: |
          python -m unittest discover -s tests/infrastructure -p test_cibo_p0_research_qdle_persistence.py -q
          python -m unittest discover -s tests/infrastructure -p test_cibo_p0_native_replay_runtime.py -q
          python -m unittest discover -s tests/infrastructure -p test_cibo_p0_native_postfill_director.py -q
          python -m unittest discover -s tests/infrastructure -p test_cibo_managed_exit_replay.py -q
          python -m unittest discover -s tests/infrastructure -p test_cibo_four_motor_policy_p0.py -q
          python -m unittest discover -s tests/infrastructure -p test_qdle_trader_lab_replay.py -q
