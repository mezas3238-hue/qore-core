name: QORE CIBO Summary Telemetry Parity

# Parity revision 2 — exposure accounting repaired

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cibo-causal-expectation-leakage-fix-001
    paths:
      - '.github/workflows/cibo-trader-lab-summary-parity.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}/src
  SOURCE_ARTIFACT_ID: '11451743578'
  SOURCE_ARTIFACT_DIGEST: 'sha256:d439957f21e2f79148b5a2fb75a53db6fa448698f17aeb6978f379ed3547f7ea'
  HISTORICAL_SOURCE_ARTIFACT_ID: '11389331836'
  HISTORICAL_SOURCE_ARTIFACT_DIGEST: 'sha256:30177639f660c9647ab70257c2d12c541bdade49ab5582347a3890f920070fee'
  HISTORICAL_CONTROL_ARTIFACT_ID: '11409086692'
  HISTORICAL_CONTROL_ARTIFACT_DIGEST: 'sha256:eeffdc99a736b82bd965ff646b8ca9bf084f50ae414e56e9b3d82961169d7187'

jobs:
  summary-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile
        run: |
          set -euo pipefail
          python -m py_compile src/qore/infrastructure/trader_lab/cibo_three_mode_capital_lab.py scripts/cibo_trader_lab_three_mode_ceiling.py

      - name: Recover inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/historical-source" "$RUNNER_TEMP/historical-control" "$RUNNER_TEMP/result"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" > "$RUNNER_TEMP/source.zip"
          echo "${SOURCE_ARTIFACT_DIGEST#sha256:}  $RUNNER_TEMP/source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/source"
          MANIFEST="$(find "$RUNNER_TEMP/source" -type f -name walk-forward-manifest.json -print -quit)"
          BASELINE="$(find "$RUNNER_TEMP/source" -type f -name walk-forward-replay.json -print -quit)"
          echo "MANIFEST=$MANIFEST" >> "$GITHUB_ENV"; echo "BASELINE=$BASELINE" >> "$GITHUB_ENV"

          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$HISTORICAL_SOURCE_ARTIFACT_ID/zip" > "$RUNNER_TEMP/historical-source.zip"
          echo "${HISTORICAL_SOURCE_ARTIFACT_DIGEST#sha256:}  $RUNNER_TEMP/historical-source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/historical-source.zip" -d "$RUNNER_TEMP/historical-source"
          HISTORICAL_MANIFEST="$(find "$RUNNER_TEMP/historical-source" -type f -name single-account-manifest-native.json -print -quit)"
          echo "HISTORICAL_MANIFEST=$HISTORICAL_MANIFEST" >> "$GITHUB_ENV"

          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$HISTORICAL_CONTROL_ARTIFACT_ID/zip" > "$RUNNER_TEMP/historical-control.zip"
          echo "${HISTORICAL_CONTROL_ARTIFACT_DIGEST#sha256:}  $RUNNER_TEMP/historical-control.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/historical-control.zip" -d "$RUNNER_TEMP/historical-control"
          HISTORICAL_REPLAY="$(find "$RUNNER_TEMP/historical-control" -type f -name historical-ceiling-replay.json -print -quit)"
          echo "HISTORICAL_REPLAY=$HISTORICAL_REPLAY" >> "$GITHUB_ENV"

      - name: Run FULL and SUMMARY parity pair
        run: |
          set -euo pipefail
          common=(
            --manifest "$MANIFEST"
            --baseline-replay "$BASELINE"
            --historical-manifest "$HISTORICAL_MANIFEST"
            --historical-replay "$HISTORICAL_REPLAY"
            --distributed-attack-frontier
            --coordinated-economic-group
            --ceiling-discovery-mode
            --attack-multiplier-cap 150
            --medium-multiplier-cap 20
            --economic-group-bootstrap-cushion-share 1.00
            --ceiling-growth-leverage-slope 10
            --ceiling-attack-drawdown-budget-fraction 0.10
          )
          python scripts/cibo_trader_lab_three_mode_ceiling.py "${common[@]}"             --output "$RUNNER_TEMP/result/full.json"
          python scripts/cibo_trader_lab_three_mode_ceiling.py "${common[@]}"             --summary-telemetry             --output "$RUNNER_TEMP/result/summary.json"

      - name: Assert economic parity
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"result"
          full=json.loads((root/"full.json").read_text())
          summary=json.loads((root/"summary.json").read_text())
          keys=(
              "decision_count","trade_count","ending_total_capital_usd",
              "ending_sovereign_bank_usd","ending_portfolio_cushion_usd",
              "max_drawdown_fraction","max_drawdown_usd",
              "maximum_selected_multiplier","attack_trade_count",
              "attack_net_pnl_usd","trade_mode_counts","trader_results",
              "medium_compound_positive_net_usd","medium_compound_negative_net_usd",
          )
          drift={}
          for key in keys:
              if full[key] != summary[key]:
                  drift[key]={"full":full[key],"summary":summary[key]}
          full_f=full["engineering_sensor_report"]["execution_funnel"]
          summary_f=summary["engineering_sensor_report"]["execution_funnel"]
          if full_f != summary_f:
              drift["execution_funnel"]={"full":full_f,"summary":summary_f}
          if drift:
              print("SUMMARY_PARITY_DRIFT="+json.dumps(drift,sort_keys=True))
              raise SystemExit(1)
          assert full["decision_count"]==full["trade_count"]==3368
          assert summary["decision_count"]==summary["trade_count"]==3368
          print("SUMMARY_PARITY_PASS="+json.dumps({
              "ending_total_capital_usd":full["ending_total_capital_usd"],
              "max_drawdown_fraction":full["max_drawdown_fraction"],
              "maximum_selected_multiplier":full["maximum_selected_multiplier"],
              "attack_trade_count":full["attack_trade_count"],
          },sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-summary-parity-${{ github.run_id }}
          path: ${{ runner.temp }}/result/*.json
          if-no-files-found: error
          retention-days: 90
