name: QORE Shared WP05 Active Perception V12 Acquisition Manifest

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - src/qore/infrastructure/core_stack_v2/active_perception_v12_acquisition_manifest.py
      - scripts/shared_wp05_active_perception_v12_acquisition_manifest.py
      - tests/infrastructure/test_core_stack_v2_active_perception_v12_acquisition_manifest.py
      - tests/infrastructure/test_shared_wp05_active_perception_v12_manifest_protocol.py
      - .github/workflows/qore-shared-wp05-active-perception-v12-acquisition-manifest.yml
  pull_request:
    paths:
      - src/qore/infrastructure/core_stack_v2/active_perception_v12_acquisition_manifest.py
      - scripts/shared_wp05_active_perception_v12_acquisition_manifest.py
      - tests/infrastructure/test_core_stack_v2_active_perception_v12_acquisition_manifest.py
      - tests/infrastructure/test_shared_wp05_active_perception_v12_manifest_protocol.py
      - .github/workflows/qore-shared-wp05-active-perception-v12-acquisition-manifest.yml
  workflow_dispatch:

concurrency:
  group: qore-shared-wp05-v12-acquisition-manifest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  v12-r8-acquisition-manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Shared
        run: pip install -e ".[dev]"

      - name: Validate source-only manifest code
        run: |
          set -euo pipefail
          ruff check \
            src/qore/infrastructure/core_stack_v2/active_perception_v12_acquisition_manifest.py \
            scripts/shared_wp05_active_perception_v12_acquisition_manifest.py \
            tests/infrastructure/test_core_stack_v2_active_perception_v12_acquisition_manifest.py \
            tests/infrastructure/test_shared_wp05_active_perception_v12_manifest_protocol.py
          mypy \
            src/qore/infrastructure/core_stack_v2/active_perception_v12_acquisition_manifest.py
          python -m py_compile \
            src/qore/infrastructure/core_stack_v2/active_perception_v12_acquisition_manifest.py \
            scripts/shared_wp05_active_perception_v12_acquisition_manifest.py
          pytest -q \
            tests/infrastructure/test_core_stack_v2_active_perception_v12_acquisition_manifest.py \
            tests/infrastructure/test_shared_wp05_active_perception_v12_manifest_protocol.py

      - name: Recover immutable consumed R8 market evidence
        run: |
          set -euo pipefail
          mkdir -p input/r8 result
          for attempt in 1 2 3 4; do
            if gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10402199719/zip" > r8.zip; then
              break
            fi
            rm -f r8.zip
            sleep $((attempt * 30))
          done
          test -s r8.zip
          unzip -q r8.zip -d input/r8
          (cd input/r8 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

      - name: Build R8 causal tick acquisition manifest
        run: |
          set -euo pipefail
          python scripts/shared_wp05_active_perception_v12_acquisition_manifest.py \
            --r8-nas input/r8/fresh/NAS100/market-evidence.json \
            --r8-sp input/r8/fresh/SP500/market-evidence.json \
            --r8-us input/r8/fresh/US30/market-evidence.json \
            --provider-symbol USTEC \
            --output result/wp05-v12-r8-tick-acquisition-manifest.json \
            | tee result/summary.json

      - name: Validate manifest governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(
              Path("result/wp05-v12-r8-tick-acquisition-manifest.json").read_text()
          )
          assert p["identity"] == (
              "QORE_SHARED_WP05_ACTIVE_PERCEPTION_V12_ACQUISITION_MANIFEST_001"
          )
          assert p["partition"] == "r8"
          assert p["provider_symbol"] == "USTEC"
          assert p["source_count"] > 0
          assert p["source_min"] < p["source_max"]
          assert p["pre_source_minutes"] == 60
          assert p["post_source_minutes"] == 15
          assert len(p["windows"]) > 0
          assert len(p["manifest_sha256"]) == 64
          assert p["target_or_outcome_used_for_selection"] is False
          assert p["r6_r5_read_for_selection"] is False
          assert p["r6_r5_read"] is False
          assert p["fresh_holdout_opened"] is False
          assert p["shared_methodology_authority"] is False
          assert p["shared_sizing_authority"] is False
          assert p["shared_risk_authority"] is False
          assert p["shared_order_authority"] is False
          assert p["shared_execution_authority"] is False
          PY

      - name: Bind manifest evidence
        run: |
          printf '%s\n' "${GITHUB_SHA}" > result/git-sha.txt
          (cd result && sha256sum \
            wp05-v12-r8-tick-acquisition-manifest.json \
            git-sha.txt > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-wp05-v12-r8-acquisition-manifest-${{ github.sha }}
          path: |
            result/wp05-v12-r8-tick-acquisition-manifest.json
            result/summary.json
            result/git-sha.txt
            result/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

      - name: Report V12 acquisition manifest
        if: always()
        run: |
          if [ ! -f result/wp05-v12-r8-tick-acquisition-manifest.json ]; then
            gh issue comment 643 --body "WP-05 V12 R8 acquisition-manifest run `${GITHUB_RUN_ID}` failed before a lawful source-only manifest was produced. No R6/R5 or fresh holdout was opened."
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p=json.loads(
              Path("result/wp05-v12-r8-tick-acquisition-manifest.json").read_text()
          )
          lines=[
              "## WP-05 V12 causal R8 acquisition manifest",
              "",
              f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- GitHub Actions run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- source population: **{p['source_count']}**",
              f"- merged acquisition windows: **{len(p['windows'])}**",
              f"- source range: **{p['source_min']} → {p['source_max']}**",
              f"- sensor context: **t-60m → t+15m**",
              f"- provider identity: **{p['provider_symbol']}**",
              f"- manifest SHA256: `{p['manifest_sha256']}`",
              "- selection is causal/source-only; matured target/outcome was not used",
              "- R6/R5 remain CLOSED for sensor selection",
              "- fresh holdout remains CLOSED",
              "- this is acquisition planning only, not V12 scientific sensor admission",
          ]
          Path("result/issue-update.md").write_text("\n".join(lines)+"\n")
          PY
          gh issue comment 643 --body-file result/issue-update.md
