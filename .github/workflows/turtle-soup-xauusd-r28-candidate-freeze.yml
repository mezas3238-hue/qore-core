name: QORE Turtle Soup XAUUSD R28 Candidate Freeze

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-xauusd-specialist-memory-v1-001
    paths:
      - '.github/workflows/turtle-soup-xauusd-r28-candidate-freeze.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r28_candidate_freeze.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r28_candidate_freeze.py'

permissions:
  contents: read
  actions: read

env:
  R28_RUN_ID: '35305338898'
  R28_SHA: 'c35f8414ce59e26a36cdda27c2a964a426c3e5ba'
  R28_ARTIFACT: 'qore-turtle-soup-xauusd-cognitive-v3-r28-c35f8414ce59e26a36cdda27c2a964a426c3e5ba'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check --ignore E501,I001 \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r28_candidate_freeze.py \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r28_candidate_freeze.py
      - name: Mypy focused gate
        run: |
          mypy --disable-error-code attr-defined \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r28_candidate_freeze.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r28_candidate_freeze.py

  freeze:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download exact official R28 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.R28_ARTIFACT }}
          path: r28-evidence
          github-token: ${{ github.token }}
          run-id: ${{ env.R28_RUN_ID }}
      - name: Freeze exact R28 candidate
        run: |
          mkdir -p freeze-output
          python -m qore.infrastructure.trader_lab.turtle_soup_xauusd_r28_candidate_freeze \
            r28-evidence freeze-output > freeze-output/stdout.json
          printf '%s\n' "$GITHUB_SHA" > freeze-output/freeze-code-sha.txt
      - name: Enforce sealed candidate governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('freeze-output/turtle-soup-xauusd-r28-candidate-freeze.json').read_text())
          assert p['candidate_id']=='TURTLE_SOUP_XAUUSD_R28_VALIDATED_SPECIALIST_CANDIDATE_001'
          assert p['status']=='FROZEN_FOR_FRESH_HOLDOUT'
          assert p['source_brain']['run_id']==35305338898
          assert p['source_brain']['artifact_id']==10531258915
          assert p['source_brain']['git_sha']=='c35f8414ce59e26a36cdda27c2a964a426c3e5ba'
          assert p['frozen_contract']['economic_mean_magnitude_ranks_targets'] is False
          assert p['frozen_contract']['regime']=='PRE_ENTRY_H1_H4_D1_M5_NO_CALENDAR_YEAR_RULE'
          g=p['governance']
          assert g['candidate_frozen'] is True
          assert g['candidate_promoted'] is False
          assert g['fresh_holdout_status']=='SEALED_UNTOUCHED'
          assert g['fresh_holdout_consumed'] is False
          assert g['demo_eligible'] is False
          assert g['live_authorized'] is False
          assert g['real_capital_authorized'] is False
          assert g['production_authorized'] is False
          assert g['merge_authorized'] is False
          PY
      - name: Hash immutable freeze package
        run: |
          cd freeze-output
          sha256sum \
            turtle-soup-xauusd-r28-candidate-freeze.json \
            stdout.json freeze-code-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-xauusd-r28-candidate-freeze-${{ github.sha }}
          path: freeze-output
          if-no-files-found: error
          retention-days: 90
