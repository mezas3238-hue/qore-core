name: QORE CIBO T14 T15 Causal Pareto Utility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-t14-t15-causal-utility.yml'
      - 'src/qore/infrastructure/cibo_t14_t15_utility_gate.py'
      - 'tests/infrastructure/test_cibo_t14_t15_utility_gate.py'
      - 'docs/research/CIBO-T14-T15-CAUSAL-PARETO-UTILITY-GATE-V1.md'
  push:
    branches:
      - agent/cibo-certification-architect-a-science-001
    paths:
      - '.github/workflows/cibo-t14-t15-causal-utility.yml'
      - 'src/qore/infrastructure/cibo_t14_t15_utility_gate.py'
      - 'tests/infrastructure/test_cibo_t14_t15_utility_gate.py'
      - 'docs/research/CIBO-T14-T15-CAUSAL-PARETO-UTILITY-GATE-V1.md'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  t14-t15-causal-utility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: T14 T15 causal utility quality
        run: |
          ruff check \
            src/qore/infrastructure/cibo_t14_t15_utility_gate.py \
            tests/infrastructure/test_cibo_t14_t15_utility_gate.py
          python -m py_compile \
            src/qore/infrastructure/cibo_t14_t15_utility_gate.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_t14_t15_utility_gate.py
