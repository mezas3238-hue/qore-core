name: QORE Scalper A2 Sensor Trader PAPER PF DD A-B

on:
  push:
    branches:
      - agent/scalper-architect-b-methodology-20261010
    paths:
      - '.github/workflows/qore-scalper-a2-sensor-cognitive-paper-ab.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_sensor_paper_decision_ab_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_scalper_sensor_paper_decision_ab_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: scalper-a2-sensor-paper-ab-${{ github.ref }}
  cancel-in-progress: true

env:
  V49_RUN: '38053946695'
  V49_SHA: 'e356e7a52541e99533b25ecfef0ab9c4e9ce03c0'
  SENSOR_RUN: '38071138991'
  SENSOR_SHA: '74f4d9c89cdaaefd220a9a45ba98c2a0376be3d7'

jobs:
  paper_ab:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Unit/typing checks for cognition-backed authorization contract
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_scalper_sensor_paper_decision_ab_v1.py tests/infrastructure/trader_lab/test_capitalizer_scalper_sensor_paper_decision_ab_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_scalper_sensor_paper_decision_ab_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_scalper_sensor_paper_decision_ab_v1.py
      - name: Original nine market economic books and exact source opportunities
        uses: actions/download-artifact@v4
        with:
          pattern: scalper-a2-v49-control-*-${{ env.V49_SHA }}
          path: original-v49
          github-token: ${{ github.token }}
          run-id: ${{ env.V49_RUN }}
          merge-multiple: false
      - name: Nine original-source sensor frames from successful pinned CI
        uses: actions/download-artifact@v4
        with:
          pattern: scalper-a2-entry-sensor-*-${{ env.SENSOR_SHA }}
          path: shadow-sensors
          github-token: ${{ github.token }}
          run-id: ${{ env.SENSOR_RUN }}
          merge-multiple: false
      - name: Paper decisions from source sensors — control vs mismatch-research
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_sensor_paper_decision_ab_v1 original-v49 original-v49 shadow-sensors paper-results
      - name: Inspect PF DD source winner retention and no fake full cognition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("paper-results/scalper-sensors-to-trader-paper-ab.json").read_text())
          assert x["original_source_opportunities"]==2876
          assert x["original_max3_selected"]==2020
          assert x["a1_full_master_frame_attested"] is False
          assert x["broker_bid_ask_commission_slippage_simulated"] is False
          assert x["original_v49_entry_exit_stops_targets_unchanged"] is True
          assert x["outcomes_used_for_decisions"] is False
          assert x["research_only"] is True
          assert x["trader_certified"] is False and x["live_authorized"] is False
          a=x["scorecard"]
          assert a["FROZEN_V49_CONTROL"] == a["NOOP_SENSORS_OBSERVED"]
          assert a["FROZEN_V49_CONTROL"]["trades"]==2020
          assert a["FROZEN_V49_CONTROL"]["wins"]==1167
          print("SCALPER SENSOR PAPER A/B", json.dumps({
              "sensor_mismatch":x["sensor_source_mismatch"],
              "arms":{name:{
                  "trades":v["trades"],"PF":v["profit_factor"],
                  "max_DD_R":v["max_drawdown_r"],
                  "wins_original_preserved":v["original_winners_preserved"],
                  "winner_mass_original_R":v["retention"]["preserved_original_winner_r"],
                  "passed_winner_count":v["passed_retention_934_count"],
                  "passed_winner_R":v["passed_retention_415_75_r"],
              } for name,v in a.items()},
          },sort_keys=True))
          PY
      - name: Archive real original-trade paper A/B and winner identity proofs
        uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-sensor-paper-pf-dd-ab-${{ github.sha }}
          path: paper-results/
          retention-days: 90
          if-no-files-found: error
