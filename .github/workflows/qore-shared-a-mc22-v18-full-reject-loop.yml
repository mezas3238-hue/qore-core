name: QORE Shared A MC22 V18 Full Reject Loop

concurrency:
  group: qore-shared-a-mc22-v18-full-reject-loop
  cancel-in-progress: false

on:
  push:
    branches:
      - agent/shared-a-cognitive-science-001
    paths:
      - src/qore/infrastructure/core_stack_v2/autonomous_scientific_lab.py
      - scripts/shared_mc22_v18_full_reject_loop.py
      - .github/workflows/qore-shared-a-mc22-v18-full-reject-loop.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  full-loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and validate
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          mkdir -p input/v18 result
          ruff check \
            src/qore/infrastructure/core_stack_v2/autonomous_scientific_lab.py \
            scripts/shared_mc22_v18_full_reject_loop.py
          mypy src/qore/infrastructure/core_stack_v2/autonomous_scientific_lab.py
          pytest -q tests/infrastructure/test_core_stack_v2_autonomous_scientific_lab.py

      - name: Verify immutable V16 V17 V18 lineage
        run: |
          set -euo pipefail
          for spec in \
            "36142389500:10866982695" \
            "36145156033:10868898942" \
            "36146027722:10870455251"
          do
            run_id="${spec%%:*}"
            artifact_id="${spec#*:}"
            test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')" = "completed"
            test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion')" = "success"
            test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" --jq '.expired')" = "false"
          done

      - name: Recover V18 shadow evidence
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10870455251/zip" > v18.zip
          unzip -q v18.zip -d input/v18
          (cd input/v18 && sha256sum -c SHA256SUMS)

      - name: Bind full rejected laboratory loop
        run: |
          python scripts/shared_mc22_v18_full_reject_loop.py \
            --v18 input/v18/shared-autonomous-incremental-defense-v18.json \
            --output result/mc22-v18-full-reject-loop.json \
            | tee result/summary.json

      - name: Validate completed lab capability
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/mc22-v18-full-reject-loop.json").read_text())
          assert p["status"] == "MC22_AUTONOMOUS_SCIENTIFIC_LAB_COMPLETED_AND_PROVEN"
          assert p["stage_count"] == 13
          assert p["required_stage_count"] == 13
          assert p["all_required_stages_materialized"] is True
          assert p["last_stage"] == "KNOWLEDGE_DECISION"
          assert p["outcome"] == "REJECT"
          assert p["rejection_preserved"] is True
          assert p["failed_experiment_auto_promoted"] is False
          assert p["consumed_evidence_misrepresented_as_fresh"] is False
          assert p["fresh_holdout_opened_by_mc22"] is False
          assert p["certified_runtime_mutation"] is False
          assert p["promotion_authority"] is False
          assert p["mc22_completed_and_proven"] is True
          assert p["master_ledger_mutated"] is False
          assert p["protected_certification_holdout_opened"] is False
          PY

      - name: Seal
        run: |
          printf '%s\n' "${GITHUB_SHA}" > result/code-git-sha.txt
          (cd result && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-a-mc22-v18-full-reject-loop-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Report
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p=json.loads(Path("result/mc22-v18-full-reject-loop.json").read_text())
          body="\n".join([
              "## Shared A MC-22 — Full Autonomous Scientific Lab Loop",
              "",
              f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- run: `{os.environ['GITHUB_RUN_ID']}`",
              "- real lineage: **Autonomous Incremental Defense V18**",
              f"- stages materialized: **{p['stage_count']}/13**",
              f"- scientific outcome: **{p['outcome']}**",
              "- V18 failed shadow auto-promoted: **False**",
              "- consumed evidence represented as fresh: **False**",
              "- certified runtime mutation: **False**",
              "- MC-22 completed-and-proven: **True**",
              "- protected certification holdout opened: **False**",
          ])+"\n"
          Path("result/issue-comment.md").write_text(body)
          PY
          gh issue comment 638 --body-file result/issue-comment.md
