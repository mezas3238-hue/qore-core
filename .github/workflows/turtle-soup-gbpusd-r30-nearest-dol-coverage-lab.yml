name: QORE Turtle Soup GBPUSD R30 Nearest DOL Coverage Lab

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-gbpusd-specialist-memory-v1-001
    paths:
      - '.github/workflows/turtle-soup-gbpusd-r30-nearest-dol-coverage-lab.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_gbpusd_r30_nearest_dol_coverage_lab.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_gbpusd_r30_nearest_dol_coverage_lab.py'

permissions:
  contents: write
  actions: read

env:
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-GBPUSD-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-GBPUSD-2f510461b3360e91d5ee70a72716a76cd6561f16'
  R28_RUN_ID: '35339487821'
  R28_ARTIFACT: 'qore-turtle-soup-gbpusd-cognitive-v3-r28-5ce4043cfd0e755a3c3f8502ebaa2dc362e6540d'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check --ignore E501,I001 \
            src/qore/infrastructure/trader_lab/turtle_soup_gbpusd_r30_nearest_dol_coverage_lab.py \
            tests/infrastructure/trader_lab/test_turtle_soup_gbpusd_r30_nearest_dol_coverage_lab.py
      - name: Mypy focused gate
        run: |
          mypy --disable-error-code attr-defined \
            src/qore/infrastructure/trader_lab/turtle_soup_gbpusd_r30_nearest_dol_coverage_lab.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_turtle_soup_gbpusd_r30_nearest_dol_coverage_lab.py

  coverage_lab:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable GBPUSD raw master
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-gbpusd
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download immutable Target Destination V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target-gbpusd
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Download Cognitive V3
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.R28_ARTIFACT }}
          path: cognitive-v3
          github-token: ${{ github.token }}
          run-id: ${{ env.R28_RUN_ID }}
      - name: Run fixed R30 experiments
        run: |
          mkdir -p r30-output
          python -m qore.infrastructure.trader_lab.turtle_soup_gbpusd_r30_nearest_dol_coverage_lab \
            source-gbpusd target-gbpusd cognitive-v3 r30-output \
            > r30-output/stdout.json
          printf '%s\n' "$GITHUB_SHA" > r30-output/git-sha.txt
      - name: Enforce experiment governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('r30-output/r30-nearest-dol-coverage-lab-report.json').read_text())
          assert p['identity']=='TURTLE_SOUP_GBPUSD_R30_NEAREST_DOL_COVERAGE_LAB_V1'
          c=p['experiment_contract']
          assert c['fresh_holdout_consumed'] is False
          assert c['nearest_validated_dol_policy'] is True
          assert c['entry_changed'] is False
          assert c['c2_changed'] is False
          assert c['cisd_changed'] is False
          assert c['protected_swing_changed'] is False
          assert c['regime_model_changed'] is False
          assert c['economic_magnitude_ranks_targets'] is False
          assert c['recovery_requires_rank1'] is True
          assert c['recovery_requires_anatomy_structure'] is True
          assert c['recovery_requires_same_target_regime_journey_validation'] is True
          a=p['predeclared_acceptance']
          assert a['minimum_trades']==250
          assert a['minimum_net_010_profit_factor']=='1.80'
          assert a['maximum_net_010_drawdown_r']=='8.0'
          assert a['maximum_net_010_losing_streak']==3
          g=p['governance']
          assert g['candidate_replaced'] is False
          assert g['fresh_holdout_consumed'] is False
          assert g['live_authorized'] is False
          assert g['real_capital_authorized'] is False
          PY
      - name: Hash R30 evidence
        run: |
          cd r30-output
          sha256sum r30-nearest-dol-coverage-lab-report.json stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-gbpusd-r30-nearest-dol-coverage-lab-${{ github.sha }}
          path: r30-output
          if-no-files-found: error
          retention-days: 90

  publish_status:
    if: always()
    needs: [quality, coverage_lab]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/turtle-soup-gbpusd-specialist-memory-v1-001
      - name: Download successful research artifact
        if: needs.coverage_lab.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: qore-turtle-soup-gbpusd-r30-nearest-dol-coverage-lab-${{ github.sha }}
          path: published-result
      - name: Write auditable status
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          RESEARCH_RESULT: ${{ needs.coverage_lab.result }}
          RUN_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p docs/research/results
          python - <<'PY'
          import json, os
          from pathlib import Path
          out={
            'identity':'TURTLE_SOUP_GBPUSD_R30_NEAREST_DOL_STATUS',
            'workflow_run_id':int(os.environ['RUN_ID']),
            'workflow_sha':os.environ['RUN_SHA'],
            'quality_result':os.environ['QUALITY_RESULT'],
            'research_result':os.environ['RESEARCH_RESULT'],
          }
          matches=list(Path('published-result').rglob('r30-nearest-dol-coverage-lab-report.json'))
          if len(matches)==1:
            out['r30_report']=json.loads(matches[0].read_text())
          sums=list(Path('published-result').rglob('SHA256SUMS.txt'))
          if len(sums)==1:
            out['sha256sums']=sums[0].read_text().splitlines()
          Path('docs/research/results/TURTLE-SOUP-GBPUSD-R30-NEAREST-DOL-LATEST.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - name: Commit status
        run: |
          git config user.name 'qore-research-bot'
          git config user.email 'qore-research-bot@users.noreply.github.com'
          git add docs/research/results/TURTLE-SOUP-GBPUSD-R30-NEAREST-DOL-LATEST.json
          git commit -m "research(gbpusd): record TURTLE_SOUP_GBPUSD_R30_NEAREST_DOL_STATUS" || exit 0
          git push origin HEAD:agent/turtle-soup-gbpusd-specialist-memory-v1-001
