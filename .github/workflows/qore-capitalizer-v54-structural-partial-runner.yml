name: QORE Capitalizer V54 Structural Partial Runner

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - 'src/qore/infrastructure/trader_lab/capitalizer_v50_target_stop_intelligence.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v50_target_stop_intelligence.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v54_structural_partial_runner.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v54_structural_partial_runner.py'
      - '.github/workflows/qore-capitalizer-v54-structural-partial-runner.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-v54-runner-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: V50 stop-integrity regression
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_v50_target_stop_intelligence.py \
            tests/infrastructure/trader_lab/test_capitalizer_v50_target_stop_intelligence.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_v50_target_stop_intelligence.py
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_v50_target_stop_intelligence.py
      - name: Quality
        run: |
          ruff check             src/qore/infrastructure/trader_lab/capitalizer_v54_structural_partial_runner.py             tests/infrastructure/trader_lab/test_capitalizer_v54_structural_partial_runner.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_v54_structural_partial_runner.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_v54_structural_partial_runner.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - symbol: USDJPY
            session: ASIA
          - symbol: AUDJPY
            session: ASIA
          - symbol: AUDUSD
            session: ASIA
          - symbol: GBPJPY
            session: ASIA
          - symbol: EURUSD
            session: LONDON
          - symbol: GBPUSD
            session: LONDON
          - symbol: XAUUSD
            session: NEW_YORK
          - symbol: USDCAD
            session: NEW_YORK
          - symbol: NAS100
            session: NEW_YORK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download retained provider-native M1
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Build frozen V49 source opportunities
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_high_frequency_capacity_census_v49             market m1-source capacity-output --session "${{ matrix.session }}"
      - name: Run V54 structural lifecycle A/B
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v54_structural_partial_runner             market capacity-output m1-source lifecycle-output
      - name: Enforce A/B boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = next(Path("lifecycle-output").glob("*-v54-lifecycle-report.json"))
          result = json.loads(path.read_text())
          assert result["decision_timeframes"] == ["H1", "M15", "M1"]
          assert result["same_admission_population"] is True
          assert result["same_entry"] is True
          assert result["same_initial_stop"] is True
          assert result["same_t1"] is True
          assert result["outcome_used_for_selection"] is False
          assert result["future_target_used"] is False
          assert result["post_entry_stop_widening"] is False
          assert result["recovery_sizing_used"] is False
          assert result["automatic_policy_promotion"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v54-runner-${{ matrix.symbol }}-${{ github.sha }}
          path: lifecycle-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v54-runner-*-${{ github.sha }}
          path: lifecycle-markets
          merge-multiple: false
      - name: Build V54 lifecycle matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v54_structural_partial_runner             matrix lifecycle-markets matrix-output
      - name: Enforce aggregate boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(
              Path("matrix-output/capitalizer-v54-structural-partial-runner-matrix.json").read_text()
          )
          assert result["same_admission_population"] is True
          assert result["same_entry"] is True
          assert result["same_initial_stop"] is True
          assert result["same_t1"] is True
          assert result["outcome_used_for_selection"] is False
          assert result["future_target_used"] is False
          assert result["post_entry_stop_widening"] is False
          assert result["recovery_sizing_used"] is False
          assert result["automatic_policy_promotion"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v54-runner-matrix-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 180
