name: QORE VT31 NAS100 Execution Binding Final Robustness V2

on:
  push:
    branches:
      - agent/vt31-nas100-hypothesis-lifecycle-v1
    paths:
      - scripts/vt31_nas100_structural_target_execution_binding_final_v2.py
      - .github/workflows/vt31-nas100-execution-binding-final-v2.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Static gate
        run: |
          python -m py_compile scripts/vt31_nas100_structural_target_execution_binding_final_v2.py
          ruff check scripts/vt31_nas100_structural_target_execution_binding_final_v2.py
      - name: Recover immutable R8 R6 R5 evidence
        run: |
          set -euo pipefail
          mkdir -p input/r8 input/r6 input/r5 result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10402199719/zip" > r8.zip
          unzip -q r8.zip -d input/r8
          echo "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb  input/r8/fresh/NAS100/market-evidence.json" | sha256sum -c -
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10389112524/zip" > r6.zip
          unzip -q r6.zip -d input/r6
          echo "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581  input/r6/fresh/NAS100/market-evidence.json" | sha256sum -c -
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10380044761/zip" > r5.zip
          unzip -q r5.zip -d input/r5
          echo "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7  input/r5/fresh/NAS100/market-evidence.json" | sha256sum -c -
      - name: Run final binding robustness
        run: |
          python scripts/vt31_nas100_structural_target_execution_binding_final_v2.py \
            --r8 input/r8/fresh/NAS100/market-evidence.json \
            --r6 input/r6/fresh/NAS100/market-evidence.json \
            --r5 input/r5/fresh/NAS100/market-evidence.json \
            --output result/final-binding-certification.json \
            | tee result/summary.json
      - name: Final gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/final-binding-certification.json").read_text())
          assert p["strategy_identity"] == "VT31_NAS100_STRUCTURAL_TARGET_V1"
          assert p["certified_strategy_fingerprint"] == "089c41f98a72295278063cfc29caf8419538f68315d9f5e57be144fbdae15e08"
          assert p["execution_binding_fingerprint"] == "604f8b06fbbb6d808da6389d9abf02a498612d7dc8a735de886eb174f54cab8c"
          assert p["execution_binding_certified"] is True
          assert p["decision"] == "EXECUTION_BINDING_CERTIFIED"
          assert all(p["certification_gates"].values())
          g=p["governance"]
          assert g["parameter_scan_inside_suite"] is False
          assert g["variant_comparison_inside_suite"] is False
          assert g["retuning_after_5y"] is False
          assert g["strategy_economics_changed"] is False
          assert g["fresh_holdout_claimed"] is False
          assert g["live_authorized"] is False
          PY
      - name: Bind result
        run: |
          echo "$GITHUB_SHA" > result/git-sha.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd result && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-execution-binding-final-${{ github.sha }}
          path: result/
          retention-days: 90
