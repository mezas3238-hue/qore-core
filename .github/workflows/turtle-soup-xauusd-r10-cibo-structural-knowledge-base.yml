name: QORE Turtle Soup XAUUSD R10 CIBO Structural Knowledge Base

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-xauusd-r3-forensics-001
    paths:
      - '.github/workflows/turtle-soup-xauusd-r10-cibo-structural-knowledge-base.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r10_cibo_structural_knowledge_base.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r10_cibo_structural_knowledge_base.py'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check --ignore E501,I001 \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r10_cibo_structural_knowledge_base.py \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r10_cibo_structural_knowledge_base.py
      - name: Mypy focused gate
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r10_cibo_structural_knowledge_base.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r10_cibo_structural_knowledge_base.py
      - name: Build immutable structural knowledge base
        run: |
          mkdir -p r10-kb-output
          python - <<'PY'
          from pathlib import Path
          from qore.infrastructure.trader_lab.turtle_soup_xauusd_r10_cibo_structural_knowledge_base import write_manifest
          write_manifest(Path("r10-kb-output/cibo-structural-knowledge-base.json"))
          PY
          printf '%s\n' "$GITHUB_SHA" > r10-kb-output/git-sha.txt
      - name: Enforce evidence and governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('r10-kb-output/cibo-structural-knowledge-base.json').read_text())
          assert p['identity']=='TURTLE_SOUP_XAUUSD_R10_CIBO_STRUCTURAL_KNOWLEDGE_BASE_V1'
          claims={c['code']: c for c in p['claims']}
          assert claims['K01_ROBUST_INVALID_DEEP_RAID_LATE_CISD']['operating_use']=='STRUCTURAL_ABSTENTION_ALLOWED'
          assert claims['K05_BREAK_A_OPPOSING_SERIES_LENGTH_CLUE']['strength']=='STABLE_CLUE_NOT_RULE'
          assert claims['K08_POSITIVE_VALIDITY_NOT_YET_PROVEN']['strength']=='UNRESOLVED'
          assert p['reasoning_contract']['historical_return_score'] is False
          assert p['reasoning_contract']['automatic_probability_of_trade_success'] is False
          assert p['reasoning_contract']['automatic_threshold_search'] is False
          assert p['reasoning_contract']['year_or_date_operating_rule'] is False
          assert p['reasoning_contract']['post_entry_label_allowed_as_live_input'] is False
          assert p['reasoning_contract']['positive_permission_requires_separate_frozen_validity_contract'] is True
          assert p['reasoning_contract']['unknown_means_permission'] is False
          assert p['governance']['candidate_promoted'] is False
          assert p['governance']['fresh_holdout_consumed'] is False
          assert p['governance']['demo_eligible'] is False
          assert p['governance']['live_authorized'] is False
          assert p['governance']['real_capital_authorized'] is False
          assert p['governance']['production_authorized'] is False
          PY
      - name: Hash immutable knowledge base
        run: |
          cd r10-kb-output
          sha256sum cibo-structural-knowledge-base.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-xauusd-r10-cibo-knowledge-${{ github.sha }}
          path: r10-kb-output
          if-no-files-found: error
          retention-days: 90
