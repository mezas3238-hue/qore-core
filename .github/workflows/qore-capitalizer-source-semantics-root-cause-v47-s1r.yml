name: QORE Capitalizer Source Semantics Root Cause V47 S1R

on:
  push:
    branches:
      - agent/capitalizer-source-semantics-root-cause-v47-s1r-001
    paths:
      - '.github/workflows/qore-capitalizer-source-semantics-root-cause-v47-s1r.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_source_semantics_root_cause_v47_s1r.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_source_strategy_isolation_v47_s1.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_canonical_source_context_binders_v47_s0.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_source_cisd_ftm_v2.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_source_poi_v2.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_source_semantics_root_cause_v47_s1r.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-source-semantics-root-cause-v47-s1r-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_source_semantics_root_cause_v47_s1r.py \
            tests/infrastructure/trader_lab/test_capitalizer_source_semantics_root_cause_v47_s1r.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_source_semantics_root_cause_v47_s1r.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_source_semantics_root_cause_v47_s1r.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {symbol: USDJPY, session: ASIA}
          - {symbol: AUDJPY, session: ASIA}
          - {symbol: AUDUSD, session: ASIA}
          - {symbol: GBPJPY, session: ASIA}
          - {symbol: EURUSD, session: LONDON}
          - {symbol: GBPUSD, session: LONDON}
          - {symbol: XAUUSD, session: NEW_YORK}
          - {symbol: USDCAD, session: NEW_YORK}
          - {symbol: NAS100, session: NEW_YORK}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable provider-native 10Y M1
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Run pre-economic source-semantics audit
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_source_semantics_root_cause_v47_s1r \
            market m1-source \
            --symbol "${{ matrix.symbol }}" \
            --session "${{ matrix.session }}" \
            --output s1r-output
      - name: Enforce market governance
        env:
          SYMBOL: ${{ matrix.symbol }}
          SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          paths=sorted(Path("s1r-output").glob("capitalizer-v47-s1r-*.json"))
          assert len(paths) == 3
          for path in paths:
              row=json.loads(path.read_text())
              assert row["identity"] == "QORE_CAPITALIZER_SOURCE_SEMANTICS_ROOT_CAUSE_AUDIT_V47_S1R"
              assert row["symbol"] == os.environ["SYMBOL"]
              assert row["session"] == os.environ["SESSION"]
              assert sum(row["m15_failure_classes"].values()) == row["source_events"]
              assert row["current_s0_ftm_route_mechanically_reachable"] is False
              assert row["ftm_separate_population_census_complete"] is False
              assert row["terminal_outcome_read"] is False
              assert row["economics_calculated"] is False
              assert row["fresh_holdout_opened"] is False
              assert row["admission_changed"] is False
              assert row["trader_certified"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v47-s1r-${{ matrix.symbol }}-${{ github.sha }}
          path: s1r-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v47-s1r-*-${{ github.sha }}
          path: s1r-markets
          merge-multiple: true
      - name: Aggregate S1R
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_source_semantics_root_cause_v47_s1r \
            aggregate s1r-markets \
            --output s1r-aggregate
      - name: Enforce aggregate governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          row=json.loads(
              Path("s1r-aggregate/capitalizer-v47-s1r-aggregate.json").read_text()
          )
          assert row["identity"] == "QORE_CAPITALIZER_SOURCE_SEMANTICS_ROOT_CAUSE_AUDIT_V47_S1R"
          assert row["predeclaration_comment_id"] == 5896367436
          assert row["market_period_reports"] == 27
          assert row["market_count"] == 9
          assert sum(row["m15_failure_classes"].values()) == row["source_events"]
          assert row["current_s0_ftm_route_mechanically_reachable"] is False
          assert row["ftm_separate_population_census_complete"] is False
          assert row["terminal_outcome_read"] is False
          assert row["economics_calculated"] is False
          assert row["fresh_holdout_opened"] is False
          assert row["admission_changed"] is False
          assert row["trader_certified"] is False
          assert row["decision"] == "S1R_A_B_DIAGNOSTICS_COMPLETE_FTM_CENSUS_REMAINS"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v47-s1r-aggregate-${{ github.sha }}
          path: s1r-aggregate
          if-no-files-found: error
          retention-days: 90
