name: QORE Native G1 USTEC alias CANDIDATE native BID ASK source no net

on:
  push:
    branches:
      - research/qore-native-g1-ustec-unverified-alias-native-ticks-20261012
    paths:
      - '.github/workflows/qore-native-g1-ustec-source-candidate.yml'
      - 'src/qore/infrastructure/trader_lab/qore_native_g1_ustec_candidate_bidask_v1.py'
      - 'tests/infrastructure/trader_lab/test_qore_native_g1_ustec_candidate_bidask_v1.py'
      - 'docs/research/QORE_NATIVE_G1_USTEC_SOURCE_CANDIDATE_TICKS_PREREG_2026-10-12.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed_source_contract_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,ctrader]'
      - name: Frozen alias ID10014 and no-order synthetic gates
        run: |
          set -euo pipefail
          test -s docs/research/QORE_NATIVE_G1_USTEC_SOURCE_CANDIDATE_TICKS_PREREG_2026-10-12.md
          ruff check --select F,E4,E7,E9 src/qore/infrastructure/trader_lab/qore_native_g1_ustec_candidate_bidask_v1.py tests/infrastructure/trader_lab/test_qore_native_g1_ustec_candidate_bidask_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_qore_native_g1_ustec_candidate_bidask_v1.py

  demo_provider_ustec_bidask:
    needs: signed_source_contract_tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QORE_CTRADER_DEMO_CLIENT_ID: ${{ secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
      QORE_CTRADER_DEMO_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
      QORE_CTRADER_DEMO_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
      QORE_CTRADER_DEMO_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
      QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID }}
      QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET }}
      QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN }}
      QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[ctrader]'
      - name: Check exact USTEC ID then read only native BID ASK ticks 3 windows
        run: |
          set -euo pipefail
          python -m qore.infrastructure.trader_lab.qore_native_g1_ustec_candidate_bidask_v1 source-ustec
      - name: Persist candidate source side SHA or safe blocker no economic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qore-native-G1-USTEC-candidate-source-NOT-NAS100-certified-${{ github.sha }}
          path: source-ustec/
          retention-days: 90
          if-no-files-found: warn
