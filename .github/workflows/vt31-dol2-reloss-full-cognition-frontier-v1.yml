name: QORE VT31 DOL2 Reloss Full Cognition Frontier V1

on:
  push:
    branches:
      - agent/vt31-edge-position-cert-b-001
    paths:
      - scripts/vt31_nas100_dol2_reloss_full_cognition_frontier_v1.py
      - .github/workflows/vt31-dol2-reloss-full-cognition-frontier-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vt31-dol2-reloss-full-cognition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Static gate
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_dol2_reloss_full_cognition_frontier_v1.py
          ruff check scripts/vt31_nas100_dol2_reloss_full_cognition_frontier_v1.py
      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"
      - name: Run DOL2 reloss full cognition
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python scripts/vt31_nas100_dol2_reloss_full_cognition_frontier_v1.py             "input/${EVIDENCE_PATH}"             --output "result/reloss-${PARTITION}.json"             | tee "result/summary-${PARTITION}.json"
      - name: Governance gate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=os.environ["PARTITION"]
          x=json.loads(Path(f"result/reloss-{p}.json").read_text())
          g=x["governance"]
          assert g["same_sovereign_terminal_population"] is True
          assert g["w3_dol2_calibrated_mechanism"] is True
          assert g["dol1_touch_is_not_acceptance"] is True
          assert g["acceptance_requires_subsequent_closed_m1"] is True
          assert g["extension_active_next_m1_only"] is True
          assert g["reloss_requires_closed_m1_inside_dol1"] is True
          assert g["full_cognition_reassessed_at_reloss"] is True
          assert g["future_target_reach_used_for_action"] is False
          assert g["position_sizing_used"] is False
          assert g["leverage_used"] is False
          assert g["compounding_used"] is False
          assert g["capital_weighting_used"] is False
          assert g["absolute_volume_used"] is False
          assert g["fresh_holdout_opened"] is False
          counts={v["trade_count"] for v in x["variants"].values()}
          assert len(counts)==1
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-dol2-reloss-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-dol2-reloss-*-${{ github.sha }}
          path: input
          merge-multiple: true
      - name: Adjudicate reloss frontier
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          folds=("r5","r6","r8","consumed")
          variants=("W3_DOL2_ALL","W3_DOL2_RELOSS_EXIT","W3_DOL2_RELOSS_FULL_COGNITION")
          payloads={f:json.loads(Path(f"input/reloss-{f}.json").read_text()) for f in folds}
          def d(v): return Decimal(str(v))
          report={}
          for variant in variants:
              pf=mean=dd=0
              winners=True
              half=True
              per={}
              for fold in folds:
                  b=payloads[fold]["variants"]["DOL1_HARD_EXIT"]
                  c=payloads[fold]["variants"][variant]
                  bm=b["stress_0_05r"]; cm=c["stress_0_05r"]
                  wp=c["winner_preservation_vs_dol1"]
                  pf_ok=d(cm["profit_factor"])>=d(bm["profit_factor"])
                  mean_ok=d(cm["mean_r"])>=d(bm["mean_r"])
                  dd_ok=d(cm["max_drawdown_r"])<=d(bm["max_drawdown_r"])
                  pf+=int(pf_ok); mean+=int(mean_ok); dd+=int(dd_ok)
                  wc=d(wp["winner_count_preservation"]); wr=d(wp["winner_r_preservation"])
                  winners &= wc>=d("0.80") and wr>=d("0.90")
                  blocks={}
                  if fold!="consumed":
                      for key in sorted(set(b["halfyear_stress"]) & set(c["halfyear_stress"])):
                          delta=d(c["halfyear_stress"][key]["mean_r"])-d(b["halfyear_stress"][key]["mean_r"])
                          ok=delta>=0
                          half &= ok
                          blocks[key]={"mean_r_delta":format(delta,"f"),"nondegrade":ok}
                  per[fold]={
                      "baseline":bm,"candidate":cm,
                      "winner_preservation":wp,
                      "monte_carlo_baseline":b["monte_carlo"],
                      "monte_carlo_candidate":c["monte_carlo"],
                      "pf_nondegrade":pf_ok,"mean_nondegrade":mean_ok,"dd_nondegrade":dd_ok,
                      "extension_active_count":c["extension_active_count"],
                      "reloss_trade_count":c["reloss_trade_count"],
                      "cognition_hold_count":c["cognition_hold_count"],
                      "cognition_exit_count":c["cognition_exit_count"],
                      "halfyears":blocks,
                  }
              consumed=per["consumed"]
              consumed_ok=consumed["pf_nondegrade"] and consumed["mean_nondegrade"] and consumed["dd_nondegrade"]
              control=payloads["consumed"]["variants"]["W3_DOL2_ALL"]
              cand=payloads["consumed"]["variants"][variant]
              mc_improves_vs_w3=(
                  d(cand["monte_carlo"]["p95_max_drawdown_r"])
                  <= d(control["monte_carlo"]["p95_max_drawdown_r"])
              )
              report[variant]={
                  "folds":per,
                  "pf_nondegrade_folds":pf,
                  "mean_nondegrade_folds":mean,
                  "dd_nondegrade_folds":dd,
                  "winner_preservation_all_folds":winners,
                  "halfyears_all_nondegrade":half,
                  "consumed_nondegrade":consumed_ok,
                  "consumed_mc_p95_dd_nondegrade_vs_w3":mc_improves_vs_w3,
                  "research_survivor":(
                      pf>=3 and mean>=3 and dd>=3 and winners and consumed_ok
                  ),
                  "promotion_grade":(
                      pf==4 and mean==4 and dd>=3 and winners and half and consumed_ok
                  ),
              }
          result={
              "schema":"qore.vt31.nas100.dol2_reloss_full_cognition.aggregate.v1",
              "head":"${{ github.sha }}",
              "variants":report,
              "research_survivors":[v for v,x in report.items() if x["research_survivor"]],
              "promotion_grade_witnesses":[v for v,x in report.items() if x["promotion_grade"]],
              "governance":{
                  "consumed_evidence_only":True,
                  "fresh_holdout_opened":False,
                  "policy_promoted":False,
                  "candidate_frozen":False,
                  "candidate_certified":False,
              },
          }
          Path("result/aggregate.json").write_text(json.dumps(result,sort_keys=True,indent=2)+"\n")
          print(json.dumps(result,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-dol2-reloss-aggregate-${{ github.sha }}
          path: result/
          retention-days: 90
