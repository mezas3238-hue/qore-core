name: VT08 A Intracycle C2 Preregistered 1095D Replay V1

on:
  push:
    branches:
      - agent/vt08-5m-methodology-source-20261010
    paths:
      - .github/workflows/vt08-5m-a-intracycle-c2-replay-v1.yml
      - src/qore/infrastructure/trader_lab/vt08_5m_m15_intracycle_c2_reversal_research_v1.py
      - tests/infrastructure/trader_lab/test_vt08_5m_m15_intracycle_c2_reversal_research_v1.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        symbol: [EURJPY, USDCHF, NZDUSD, CADJPY, USDCAD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Hermetic tests, lint, compile
        run: |
          python -m compileall -q src/qore/infrastructure/trader_lab/vt08_5m_m15_intracycle_c2_reversal_research_v1.py
          ruff check src/qore/infrastructure/trader_lab/vt08_5m_m15_intracycle_c2_reversal_research_v1.py tests/infrastructure/trader_lab/test_vt08_5m_m15_intracycle_c2_reversal_research_v1.py
          pytest -q tests/infrastructure/trader_lab/test_vt08_5m_m15_intracycle_c2_reversal_research_v1.py
      - name: Download immutable consumed 1095d M15 evidence — NOT SEALED 7Y
        uses: actions/download-artifact@v4
        with:
          name: qore-vt08-cognitive-5m-fresh-${{ matrix.symbol }}-b2d33e1b4829d8b4afc76983decca8a99131403c
          path: evidence/${{ matrix.symbol }}
          github-token: ${{ github.token }}
          run-id: 35934924907
      - name: Causal methodology-only research replay
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from qore.infrastructure.trader_lab.vt08_5m_m15_intracycle_c2_reversal_research_v1 import evaluate
          symbol = os.environ["SYMBOL"]
          result = evaluate(Path(f"evidence/{symbol}/market-evidence-1095d.json"))
          Path(f"artifacts/{symbol}-intracycle-c2-full.json").write_text(
              json.dumps(result, sort_keys=True, separators=(",", ":")),
              encoding="utf-8",
          )
          public = {key: result[key] for key in (
              "market", "observed_owner_h4", "by_rejection_reason",
              "source_supported_qore_fill_events", "daily_conflict_exclusions",
              "unique_ny_days_selected", "complete_simulated_trades",
              "incomplete_exit_windows", "by_year_ny_counts", "raw_equal_risk",
              "cognitive_evaluation_consumed", "bid_ask_spread_measured",
              "commission_measured", "source_authority_status",
          )}
          Path(f"artifacts/{symbol}-intracycle-c2-summary.json").write_text(
              json.dumps(public, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          print(json.dumps(public, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vt08-a-preregistered-m15-intracycle-c2-${{ matrix.symbol }}-${{ github.sha }}
          path: artifacts/*
          retention-days: 30
          if-no-files-found: error
