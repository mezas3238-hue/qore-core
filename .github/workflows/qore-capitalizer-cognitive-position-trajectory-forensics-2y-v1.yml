name: QORE Capitalizer Cognitive Position Trajectory Forensics 2Y V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-cognitive-position-trajectory-forensics-2y-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_cognitive_position_trajectory_forensics_2y_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_cognitive_position_trajectory_forensics_2y_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-cognitive-position-trajectory-forensics-2y-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  BINDING_RUN_ID: '36065651404'
  BINDING_SHA: '1d910f5c3550ac481c28390671a86ceb011597e3'
  TARGET_RUN_ID: '36055792484'
  TARGET_SHA: 'a66ab11c22efbefb61756db3f0062c3c51a2a825'
  M1_RUN_ID: '35548099334'
  M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check             src/qore/infrastructure/trader_lab/capitalizer_cognitive_position_trajectory_forensics_2y_v1.py             tests/infrastructure/trader_lab/test_capitalizer_cognitive_position_trajectory_forensics_2y_v1.py
      - name: Mypy
        run: |
          mypy             src/qore/infrastructure/trader_lab/capitalizer_cognitive_position_trajectory_forensics_2y_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov             tests/infrastructure/trader_lab/test_capitalizer_cognitive_position_trajectory_forensics_2y_v1.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol:
          - USDJPY
          - AUDJPY
          - AUDUSD
          - GBPJPY
          - EURUSD
          - GBPUSD
          - XAUUSD
          - USDCAD
          - NAS100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download fully source-bound cognitive ledger
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cognitive-evidence-binding-audit-2y-v2-${{ env.BINDING_SHA }}
          path: binding-input
          github-token: ${{ github.token }}
          run-id: ${{ env.BINDING_RUN_ID }}
      - name: Download frozen 1R target ledger
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-max-recovery-target1-stability-2y-v1-${{ env.TARGET_SHA }}
          path: target-input
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Download immutable native M1
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.M1_SHA }}
          path: m1-input
          github-token: ${{ github.token }}
          run-id: ${{ env.M1_RUN_ID }}
      - name: Build market position trajectory forensics
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cognitive_position_trajectory_forensics_2y_v1             market binding-input target-input m1-input trajectory-output
      - name: Enforce market controls
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"]
          report = json.loads(
              (
                  Path("trajectory-output")
                  / f"capitalizer-{symbol.lower()}-cognitive-position-trajectory-forensics-2y-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_COGNITIVE_POSITION_TRAJECTORY_FORENSICS_2Y_V1"
          )
          assert report["symbol"] == symbol
          assert report["source_binding_run_id"] == 36065651404
          assert report["source_target_run_id"] == 36055792484
          assert report["source_m1_run_id"] == 35548099334
          assert report["filtered_market_trades"] > 0
          assert report["stop_losses"] >= 0
          assert report["exit_bar_excluded_from_trajectory_features"] is True
          assert report["m3_pivot_confirmation_required"] is True
          assert report["stop_policy_simulated"] is False
          assert report["break_even_policy_selected"] is False
          assert report["trailing_policy_selected"] is False
          assert report["target_changed"] is False
          assert report["entry_changed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-cognitive-position-trajectory-forensics-2y-v1-${{ matrix.symbol }}-${{ github.sha }}
          path: trajectory-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-cognitive-position-trajectory-forensics-2y-v1-*-${{ github.sha }}
          path: trajectory-input
          merge-multiple: false
      - name: Build nine-market trajectory matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cognitive_position_trajectory_forensics_2y_v1             matrix trajectory-input matrix-output
      - name: Enforce aggregate controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "matrix-output/"
                  "capitalizer-nine-market-cognitive-position-trajectory-forensics-2y-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_NINE_MARKET_COGNITIVE_POSITION_TRAJECTORY_FORENSICS_2Y_V1"
          )
          assert report["market_count"] == 9
          assert report["filtered_trades"] == 917
          assert report["stop_losses"] == 211
          assert report["residual_drawdown_stop_losses"] == 6
          assert 0 <= report["stop_losses_with_confirmed_improving_m3_swing"] <= 211
          assert 0 <= report["stop_losses_with_confirmed_profitable_m3_swing"] <= 211
          assert (
              0
              <= report["residual_stop_losses_with_confirmed_improving_m3_swing"]
              <= 6
          )
          assert (
              0
              <= report["residual_stop_losses_with_confirmed_profitable_m3_swing"]
              <= 6
          )
          assert report["exit_bar_excluded_from_trajectory_features"] is True
          assert report["m3_pivot_confirmation_required"] is True
          assert report["stop_policy_simulated"] is False
          assert report["break_even_policy_selected"] is False
          assert report["trailing_policy_selected"] is False
          assert report["target_changed"] is False
          assert report["entry_changed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-nine-market-cognitive-position-trajectory-forensics-2y-v1-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
