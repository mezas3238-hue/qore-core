name: QORE VT31 NAS100 Structural Target Execution Binding V4 Freeze

on:
  push:
    branches:
      - agent/vt31-nas100-hypothesis-lifecycle-v1
    paths:
      - scripts/vt31_nas100_structural_target_execution_binding_v4.py
      - .github/workflows/vt31-nas100-structural-target-execution-binding-v4.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed_holdout
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Static gate
        run: |
          python -m py_compile scripts/vt31_nas100_structural_target_execution_binding_v4.py
          ruff check scripts/vt31_nas100_structural_target_execution_binding_v4.py
      - name: Self-test
        run: python scripts/vt31_nas100_structural_target_execution_binding_v4.py --self-test
      - name: Recover evidence
        run: |
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"
      - name: Replay frozen V4 binding
        run: |
          python scripts/vt31_nas100_structural_target_execution_binding_v4.py \
            "input/${EVIDENCE_PATH}" --partition "$PARTITION" \
            --output "result/binding-${PARTITION}.json"
      - name: Binding gates
        run: |
          python - <<'PY'
          import json, os
          from decimal import Decimal
          from pathlib import Path
          p=json.loads(Path(f"result/binding-{os.environ['PARTITION']}.json").read_text())
          assert p["strategy_identity"]=="VT31_NAS100_STRUCTURAL_TARGET_V1"
          assert p["certified_strategy_fingerprint"]=="089c41f98a72295278063cfc29caf8419538f68315d9f5e57be144fbdae15e08"
          assert p["candidate_frozen"] is True
          assert p["trade_count"] >= 300
          assert Decimal(str(p["metrics"]["profit_factor"])) >= Decimal("1.50")
          assert Decimal(str(p["metrics"]["max_drawdown_r"])) <= Decimal("6")
          assert Decimal(str(p["monte_carlo"]["positive_terminal_probability"])) >= Decimal("0.90")
          assert Decimal(str(p["monte_carlo"]["p95_max_drawdown_r"])) <= Decimal("15")
          assert p["passes_economic_objectives"] is True
          assert p["live_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-execution-binding-v4-freeze-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-execution-binding-v4-freeze-*-${{ github.sha }}
          path: input
          merge-multiple: true
      - name: Aggregate binding
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          folds={}; fingerprint=None
          for path in Path("input").glob("binding-*.json"):
              p=json.loads(path.read_text()); folds[p["partition"]]=p
              if fingerprint is None: fingerprint=p["execution_binding_fingerprint"]
              assert p["execution_binding_fingerprint"] == fingerprint
          assert set(folds)=={"r5","r6","r8","consumed_holdout"}
          assert all(p["passes_economic_objectives"] for p in folds.values())
          report={"schema":"qore.vt31.nas100.structural_target_execution_binding.aggregate.v4","strategy_identity":"VT31_NAS100_STRUCTURAL_TARGET_V1","execution_binding_fingerprint":fingerprint,"folds":folds,"development_passing":True,"five_year_opened":False,"live_authorized":False}
          Path("aggregate.json").write_text(json.dumps(report,sort_keys=True,indent=2)+"\n")
          print(json.dumps({"fingerprint":fingerprint,"development_passing":True},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-execution-binding-v4-freeze-aggregate-${{ github.sha }}
          path: aggregate.json
          retention-days: 90
