name: QORE Alpha2 W3 CMTRL last frozen Bayesian 33 gross Trader Lab
on:
  push:
    branches: ['research/qore-alpha2-original-intermarket-propagation-20261012']
    paths:
      - '.github/workflows/qore-alpha2-w3-cmtrl33-gross.yml'
      - 'src/qore/research/alpha2_w3_cmtrl_native_m5.py'
      - 'src/qore/research/alpha2_w3_cmtrl_panel.py'
      - 'tests/research/test_alpha2_w3_cmtrl_native_m5.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: alpha2-w3-cmtrl-gross-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic_and_prereg_freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . 'numpy>=2,<3' 'pytest>=8,<9' 'ruff>=0.5,<1'
      - name: Locked CMTRL v0.1 prereg and signed source33 BEFORE outcomes
        run: |
          git merge-base --is-ancestor a18cb43a6fb69eab948d840c6e6101c6a7251906 "$GITHUB_SHA"
          git merge-base --is-ancestor acf421591a2ded838b0bd73fc6a98a0d918d81e6 "$GITHUB_SHA"
          test -s docs/research/QORE_ALPHA2_W3_CMTRL_LAST_EXPLORATORY_PREREG_2026-10-12.md
      - name: Ruff full CMTRL + no lookahead and non-tautological controls
        run: |
          ruff check src/qore/research/alpha2_w3_cmtrl_native_m5.py src/qore/research/alpha2_w3_cmtrl_panel.py tests/research/test_alpha2_w3_cmtrl_native_m5.py
          pytest -q -o addopts='' tests/research/test_alpha2_w3_cmtrl_native_m5.py tests/research/test_alpha2_g1a_native_m5_gross.py
  original12_cmtrl:
    needs: synthetic_and_prereg_freeze
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        symbol: [AUDJPY, AUDUSD, EURUSD, GBPJPY, GBPUSD, NAS100, SP500, US30, USDCAD, USDJPY, XAGUSD, XAUUSD]
    env:
      SYMBOL: ${{ matrix.symbol }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: qore-native-final33-source-manifest-dba0e0c3b61e430d3ed51abab562ebd92060a0ff
          run-id: '38207337960'
          github-token: ${{ github.token }}
          path: signed33
      - uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-aggregate-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          run-id: '35166210458'
          github-token: ${{ github.token }}
          path: atlas-aggregate
      - uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-${{ matrix.symbol }}-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          run-id: '35166210458'
          github-token: ${{ github.token }}
          path: original-native
      - name: SHA all 11 years first; CMTRL first H1 decision per day, no embargo outcomes
        run: |
          python -m qore.research.alpha2_w3_cmtrl_native_m5 "$SYMBOL" original-native signed33 cmtrl-out --aggregate12 atlas-aggregate
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path("cmtrl-out/alpha2-w3-cmtrl-gross-"+os.environ["SYMBOL"]+".json").read_text())
          assert d["full_native_source_SHA_verified_before_OHLC"]
          assert d["after_2024_09_17_price_unread"]
          assert not d["broker_costs_verified"] and not d["UTC001_certified"]
          assert len(d["opportunities"])==len(set(x["utc_day"] for x in d["opportunities"]))
          PY
          printf '%s\n' "$GITHUB_SHA" > cmtrl-out/exact-code-head-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: alpha2-cmtrl33-${{ matrix.symbol }}-${{ github.sha }}
          path: cmtrl-out/
          retention-days: 90
          if-no-files-found: error
  new21_cmtrl:
    needs: synthetic_and_prereg_freeze
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        symbol: [USDCHF, NZDUSD, EURGBP, EURJPY, EURCHF, EURCAD, EURAUD, EURNZD, GBPCHF, GBPCAD, GBPAUD, GBPNZD, AUDCAD, AUDCHF, AUDNZD, CADJPY, CADCHF, CHFJPY, NZDJPY, NZDCAD, NZDCHF]
    env:
      SYMBOL: ${{ matrix.symbol }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: qore-native-final33-source-manifest-dba0e0c3b61e430d3ed51abab562ebd92060a0ff
          run-id: '38207337960'
          github-token: ${{ github.token }}
          path: signed33
      - uses: actions/download-artifact@v4
        with:
          name: qore-native-icmarkets-10Y-provider-M5-${{ matrix.symbol }}-e0ca5a13c866a19d8505c68cffc473598984b340
          run-id: '38193802541'
          github-token: ${{ github.token }}
          path: original-native
      - name: SHA original source and compare CMTRL gross to PRE-event control
        run: |
          python -m qore.research.alpha2_w3_cmtrl_native_m5 "$SYMBOL" original-native signed33 cmtrl-out
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path("cmtrl-out/alpha2-w3-cmtrl-gross-"+os.environ["SYMBOL"]+".json").read_text())
          assert d["full_native_source_SHA_verified_before_OHLC"]
          assert d["source_proof"]["source_cohort"]=="NEW21_ICMARKETS_DEMO"
          assert d["after_2024_09_17_price_unread"]
          assert not d["broker_costs_verified"] and not d["UTC001_certified"]
          PY
          printf '%s\n' "$GITHUB_SHA" > cmtrl-out/exact-code-head-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: alpha2-cmtrl33-${{ matrix.symbol }}-${{ github.sha }}
          path: cmtrl-out/
          retention-days: 90
          if-no-files-found: error
  all33_week_clustered_gross:
    needs: [original12_cmtrl, new21_cmtrl]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . 'numpy>=2,<3'
      - uses: actions/download-artifact@v4
        with:
          pattern: alpha2-cmtrl33-*-${{ github.sha }}
          path: signed-worker33
      - name: Exactly 33 SHA witnesses, 2 era 1/2/4wk synced bootstrap, net always blocked
        run: |
          python -m qore.research.alpha2_w3_cmtrl_panel signed-worker33 cmtrl-panel --head "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("cmtrl-panel/alpha2-w3-cmtrl-33-first-gross-panel.json").read_text())
          assert x["markets"]==33 and len(x["per_market_all33"])==33
          assert x["traders_certified"]==0 and x["NET_PF_Sharpe_Sortino_DD_not_computed"]
          assert x["after_2024_09_17_ohlc_unread"] and x["gross_from_native_M5_open_not_executable"]
          assert x["status"] in ("COMPARATOR_NONDISCRIMINATIVE","UNDERPOWERED","GROSS_RESEARCH_CANDIDATE_NOT_NET","NO_SUPPORT_PREDECLARED_GROSS")
          PY
          printf '%s\n' "$GITHUB_SHA" > cmtrl-panel/exact-code-head-sha.txt
          (cd cmtrl-panel && sha256sum *.json exact-code-head-sha.txt > OUTPUT_SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: alpha2-w3-cmtrl-first33-gross-panel-${{ github.sha }}
          path: cmtrl-panel/
          retention-days: 90
          if-no-files-found: error
