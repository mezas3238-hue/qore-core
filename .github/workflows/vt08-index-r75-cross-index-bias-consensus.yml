name: VT08 Index R75 Strict Cross Index Bias Consensus

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r75-cross-index-bias-consensus.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r75_cross_index_ambiguous_bias_consensus.py
      - tests/infrastructure/trader_lab/test_vt08_index_r75_cross_index_ambiguous_bias_consensus.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r75_cross_index_ambiguous_bias_consensus.py

  research:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R75 strict peer consensus falsification
        run: |
          python -m qore.infrastructure.trader_lab.vt08_index_r75_cross_index_ambiguous_bias_consensus \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r75-cross-index-bias-consensus.json

      - name: Verify R75 governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r75-cross-index-bias-consensus.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R75_STRICT_CROSS_INDEX_AMBIGUOUS_BIAS_CONSENSUS_001"
          )
          assert report["source_r74"]["run_id"] == 35512797040
          assert report["source_r74"]["artifact_id"] == 10605239547
          assert report["resolver_contract"]["peer_count"] == 2
          assert report["resolver_contract"]["both_peers_must_resolve"] is True
          assert report["resolver_contract"]["both_peers_must_agree"] is True
          assert report["resolver_contract"]["peer_fallback_allowed"] is False
          assert report["five_year"]["canonical_sample"] == 2448
          assert report["recent_two_year"]["canonical_sample"] == 1017
          assert report["r66_failed_holdout"]["canonical_sample"] == 773
          assert report["decision"] == (
              "R75_STRICT_PEER_CONSENSUS_FALSIFICATION_COMPLETE_NO_CANDIDATE"
          )
          governance = report["governance"]
          assert governance["research_only"] is True
          assert governance["fresh_holdout_claim"] is False
          assert governance["single_preregistered_resolver"] is True
          assert governance["cross_index_dependency_introduced_for_research"] is True
          assert governance["cross_index_dependency_promoted"] is False
          assert governance["future_information_used"] is False
          assert governance["outcome_used_to_choose_direction"] is False
          assert governance["anchors_changed"] is False
          assert governance["poi_families_changed"] is False
          assert governance["cisd_changed"] is False
          assert governance["protected_swing_changed"] is False
          assert governance["target_changed"] is False
          assert governance["risk_allocator_applied_to_added_signals"] is False
          assert governance["canonical_signals_suppressed"] is False
          assert governance["candidate_created"] is False
          assert governance["trader_certified"] is False
          assert governance["live_authorized"] is False
          assert governance["real_capital_authorized"] is False
          assert governance["production_authorized"] is False
          PY

      - name: Upload R75 evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r75-cross-index-bias-consensus-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: warn
          retention-days: 90
