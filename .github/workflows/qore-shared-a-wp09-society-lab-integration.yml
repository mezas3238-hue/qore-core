name: QORE Shared A WP09 Society Lab Integration

concurrency:
  group: qore-shared-a-wp09-society-lab-integration
  cancel-in-progress: false

on:
  push:
    branches:
      - agent/shared-a-cognitive-science-001
    paths:
      - src/qore/infrastructure/core_stack_v2/scientific_society.py
      - src/qore/infrastructure/core_stack_v2/autonomous_scientific_lab.py
      - scripts/shared_wp09_scientific_society_lab_integration.py
      - .github/workflows/qore-shared-a-wp09-society-lab-integration.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and validate
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          mkdir -p input/{mc21,mc22} result
          ruff check \
            src/qore/infrastructure/core_stack_v2/scientific_society.py \
            src/qore/infrastructure/core_stack_v2/autonomous_scientific_lab.py \
            scripts/shared_wp09_scientific_society_lab_integration.py
          mypy src/qore/infrastructure/core_stack_v2/scientific_society.py
          mypy src/qore/infrastructure/core_stack_v2/autonomous_scientific_lab.py
          pytest -q \
            tests/infrastructure/test_core_stack_v2_scientific_society.py \
            tests/infrastructure/test_core_stack_v2_autonomous_scientific_lab.py

      - name: Verify immutable MC21 MC22 evidence
        run: |
          set -euo pipefail
          for spec in \
            "36778113321:11126741246" \
            "36782306980:11128791254"
          do
            run_id="${spec%%:*}"
            artifact_id="${spec#*:}"
            test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')" = "completed"
            test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion')" = "success"
            test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" --jq '.expired')" = "false"
          done

      - name: Recover exact evidence
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11126741246/zip" > mc21.zip
          unzip -q mc21.zip -d input/mc21
          (cd input/mc21 && sha256sum -c SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11128791254/zip" > mc22.zip
          unzip -q mc22.zip -d input/mc22
          (cd input/mc22 && sha256sum -c SHA256SUMS)

      - name: Integrate Society into Autonomous Lab
        run: |
          python scripts/shared_wp09_scientific_society_lab_integration.py \
            --mc21 input/mc21/mc21-real-engine-society-cycle.json \
            --mc22 input/mc22/mc22-v18-full-reject-loop.json \
            --output result/wp09-scientific-society-lab-integration.json \
            | tee result/summary.json

      - name: Validate WP09 closure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/wp09-scientific-society-lab-integration.json").read_text())
          assert p["status"] == "WP09_SCIENTIFIC_SOCIETY_COMPLETED_AND_PROVEN"
          assert p["scientific_society_roles_real_engine_bound"] == 12
          assert p["heterogeneous_model_family_count"] == 12
          assert p["minority_falsification_preserved"] is True
          assert p["simple_majority_voting_used"] is False
          assert p["autonomous_lab_full_loop_capability_proven"] is True
          assert p["society_output_consumed_by_lab"] is True
          assert p["society_to_lab_last_stage"] == "FALSIFICATION"
          assert p["society_to_lab_outcome"] == "REJECT"
          assert p["society_to_lab_auto_promotion"] is False
          assert p["wp09_completed_and_proven"] is True
          assert p["master_ledger_mutated"] is False
          assert p["protected_certification_holdout_opened"] is False
          PY

      - name: Seal
        run: |
          printf '%s\n' "${GITHUB_SHA}" > result/code-git-sha.txt
          (cd result && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-a-wp09-society-lab-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Report
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p=json.loads(Path("result/wp09-scientific-society-lab-integration.json").read_text())
          body="\n".join([
              "## Shared A WP-09 — Scientific Society + Autonomous Lab",
              "",
              f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- run: `{os.environ['GITHUB_RUN_ID']}`",
              "- real-engine-bound Society roles: **12/12**",
              "- heterogeneous model families: **12**",
              "- minority falsification: **Preserved**",
              "- Society verdict consumed by Autonomous Lab: **True**",
              "- lab integration disposition: **REJECT**",
              "- failed science auto-promoted: **False**",
              "- WP-09 completed-and-proven: **True**",
              "- protected certification holdout opened: **False**",
          ])+"\n"
          Path("result/issue-comment.md").write_text(body)
          PY
          gh issue comment 638 --body-file result/issue-comment.md
