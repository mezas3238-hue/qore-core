name: VT08 B Independent R3 Frozen C2 Source and H1 Review

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vt08-5m-cognition-replay-20261010
    paths:
      - src/qore/infrastructure/trader_lab/vt08_b_r3_frozen_source_independent_v1.py
      - tests/infrastructure/trader_lab/test_vt08_b_r3_frozen_source_independent_v1.py
      - .github/workflows/vt08-b-r3-independent-frozen-source-review.yml

permissions:
  contents: read
  actions: read

jobs:
  independent-r3-native-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        market: [EURJPY, USDCHF, NZDUSD, CADJPY, USDCAD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: R3 independent verifier adversarial tests and static analysis
        run: |
          ruff check src/qore/infrastructure/trader_lab/vt08_b_r3_frozen_source_independent_v1.py tests/infrastructure/trader_lab/test_vt08_b_r3_frozen_source_independent_v1.py
          mypy src/qore/infrastructure/trader_lab/vt08_b_r3_frozen_source_independent_v1.py
          pytest -q tests/infrastructure/trader_lab/test_vt08_b_r3_frozen_source_independent_v1.py
      - uses: actions/download-artifact@v4
        with:
          name: vt08-a-frozen-m30m3-firstfail-${{ matrix.market }}-394116f13449fc310d7fbc5f0b5f60aa1bb247d4
          path: a-r3/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 38715560333
      - uses: actions/download-artifact@v4
        with:
          name: qore-vt08-cognitive-5m-fresh-${{ matrix.market }}-b2d33e1b4829d8b4afc76983decca8a99131403c
          path: m15/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 35934924907
      - uses: actions/download-artifact@v4
        with:
          name: qore-vt08-m3-fractal-${{ matrix.market }}-bc1379d7661aac202495ec67afdd3098473ba723
          path: m3/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 35941643396
      - name: B independently count all C2, verify every positive receipt and PRE-C2 H1
        env:
          MARKET: ${{ matrix.market }}
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json, os
          from pathlib import Path
          from qore.infrastructure.trader_lab.vt08_b_r3_frozen_source_independent_v1 import (
              verify_a_r3_raw_bundle,
          )
          market = os.environ["MARKET"]
          a = Path("a-r3", market, market + "-frozen-source-firstfail.json")
          m15 = Path("m15", market, "market-evidence-1095d.json")
          choices = list(Path("m3", market).rglob("m3-evidence.json"))
          if not a.is_file() or not m15.is_file() or len(choices) != 1:
              raise SystemExit("VT08 B requires pinned A R3 and native source files")
          data = json.loads(a.read_text(encoding="utf-8"))
          result = verify_a_r3_raw_bundle(data, choices[0], m15)
          result["pinned_A_run_id"] = 38715560333
          result["pinned_A_sha"] = "394116f13449fc310d7fbc5f0b5f60aa1bb247d4"
          Path("evidence",market+"-b-r3-independent.json").write_text(
              json.dumps(result,sort_keys=True,separators=(",",":")),
              encoding="utf-8",
          )
          print(json.dumps(result,sort_keys=True))
          if result["source_author_entries_certified"] or result["economic_gates_evaluated"]:
              raise SystemExit("VT08 B prohibited false certification")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vt08-b-r3-independent-${{ matrix.market }}-${{ github.sha }}
          path: evidence/*.json
          retention-days: 30
          if-no-files-found: error
