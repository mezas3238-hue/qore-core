name: QORE CIBO Phase 18 AUDJPY R42 Chronological Replay

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-phase18-audjpy-r42-replay.yml'
      - 'scripts/cibo_phase18_audjpy_geometry_patch.py'
      - 'src/qore/infrastructure/cibo_ce2i_chronological_replay.py'
      - 'tests/infrastructure/test_cibo_ce2i_chronological_replay.py'
      - 'tests/infrastructure/trader_lab/test_cibo_phase18_audjpy_geometry_patch.py'
  push:
    branches:
      - agent/cibo-capital-efficiency-sizing-lab-001
    paths:
      - '.github/workflows/cibo-phase18-audjpy-r42-replay.yml'
      - 'scripts/cibo_phase18_audjpy_geometry_patch.py'
      - 'src/qore/infrastructure/cibo_ce2i_chronological_replay.py'
      - 'tests/infrastructure/test_cibo_ce2i_chronological_replay.py'
      - 'tests/infrastructure/trader_lab/test_cibo_phase18_audjpy_geometry_patch.py'

permissions:
  contents: read
  actions: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  AUDJPY_SOURCE_SHA: 'a332b077598e070a42b2497b3766d55e731f7dca'
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-AUDJPY-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-AUDJPY-2f510461b3360e91d5ee70a72716a76cd6561f16'
  V2_RUN_ID: '35383377176'
  V2_ARTIFACT: 'qore-turtle-soup-audjpy-structural-specialist-v2-r27-e0bec233ed40197a1e969786b24a9dc8a1e5869f'
  FREEZE_RUN_ID: '35397198837'
  FREEZE_ARTIFACT: 'qore-turtle-soup-audjpy-r39-candidate-freeze-2210ae38b209103c0dfd6c21addb96bd5bc8a3ac'
  R40_RUN_ID: '35397390781'
  R40_ARTIFACT: 'qore-turtle-soup-audjpy-r40-frozen-r39-5y-validation-a332b077598e070a42b2497b3766d55e731f7dca'
  R41_RUN_ID: '35399430491'
  R41_ARTIFACT: 'qore-turtle-soup-audjpy-r41-5y-fragility-correction-2976255f2459a17603b0b9385b4c249a720463b8'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Focused quality
        run: |
          ruff check \
            scripts/cibo_phase18_audjpy_geometry_patch.py \
            src/qore/infrastructure/cibo_ce2i_chronological_replay.py \
            tests/infrastructure/test_cibo_ce2i_chronological_replay.py \
            tests/infrastructure/trader_lab/test_cibo_phase18_audjpy_geometry_patch.py
          mypy \
            scripts/cibo_phase18_audjpy_geometry_patch.py \
            src/qore/infrastructure/cibo_ce2i_chronological_replay.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_ce2i_chronological_replay.py \
            tests/infrastructure/trader_lab/test_cibo_phase18_audjpy_geometry_patch.py

  replay-audjpy:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout CIBO evidence head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}

      - name: Checkout immutable AUDJPY source code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.AUDJPY_SOURCE_SHA }}
          path: audjpy-code

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install -e .

      - name: Verify immutable AUDJPY source commit
        run: |
          test "$(git -C audjpy-code rev-parse HEAD)" = "$AUDJPY_SOURCE_SHA"
          python - <<'PY'
          from scripts.cibo_phase18_audjpy_geometry_patch import SOURCE_CODE_GIT_SHA
          import os
          assert SOURCE_CODE_GIT_SHA == os.environ["AUDJPY_SOURCE_SHA"]
          PY

      - name: Instrument exact R40 source for geometry serialization only
        run: |
          python scripts/cibo_phase18_audjpy_geometry_patch.py \
            "audjpy-code/src/qore/infrastructure/trader_lab/turtle_soup_audjpy_r40_frozen_r39_5y_validation.py" \
            "audjpy-code/src/qore/infrastructure/trader_lab/cibo_phase18_audjpy_r40_geometry_replay.py"
          python -m py_compile \
            audjpy-code/src/qore/infrastructure/trader_lab/cibo_phase18_audjpy_r40_geometry_replay.py

      - name: Download immutable AUDJPY raw master
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-audjpy
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download immutable Target Destination V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target-audjpy
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}

      - name: Download exact Cognitive V2 R27 evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V2_ARTIFACT }}
          path: v2-r27
          github-token: ${{ github.token }}
          run-id: ${{ env.V2_RUN_ID }}

      - name: Download exact R39 freeze
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FREEZE_ARTIFACT }}
          path: r39-freeze
          github-token: ${{ github.token }}
          run-id: ${{ env.FREEZE_RUN_ID }}

      - name: Download exact R40 baseline ledger
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.R40_ARTIFACT }}
          path: r40-source
          github-token: ${{ github.token }}
          run-id: ${{ env.R40_RUN_ID }}

      - name: Download exact R41 final corrected ledger
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.R41_ARTIFACT }}
          path: r41-final
          github-token: ${{ github.token }}
          run-id: ${{ env.R41_RUN_ID }}

      - name: Reproduce exact R40 geometry
        env:
          PYTHONPATH: ${{ github.workspace }}/audjpy-code/src
        run: |
          mkdir -p phase18-output
          python audjpy-code/src/qore/infrastructure/trader_lab/cibo_phase18_audjpy_r40_geometry_replay.py \
            source-audjpy target-audjpy v2-r27 r39-freeze phase18-output \
            > phase18-output/replay-stdout.json

      - name: Bind geometry to R40 and final R41/R42 evidence
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from decimal import Decimal
          from pathlib import Path

          def load_jsonl(path: Path):
              return [
                  json.loads(line)
                  for line in path.read_text().splitlines()
                  if line.strip()
              ]

          generated = load_jsonl(
              Path('phase18-output/phase18-audjpy-r40-geometry-trades.jsonl')
          )
          r40 = load_jsonl(Path('r40-source/r40-5y-scaled-trades.jsonl'))
          r41 = load_jsonl(Path('r41-final/r41-5y-corrected-trades.jsonl'))

          assert len(generated) == len(r40) == len(r41) == 1039

          bound = []
          for index, (geometry, base, final) in enumerate(
              zip(generated, r40, r41, strict=True)
          ):
              for key, value in base.items():
                  assert geometry[key] == value, (index, key, geometry[key], value)

              for key in (
                  'entry_at',
                  'exit_at',
                  'side',
                  'source_scheme',
                  'authority_tier',
                  'validation_class',
                  'target_rank',
                  'target_route',
                  'exit_reason',
                  'raw_net_010_r',
              ):
                  assert final[key] == base[key], (index, key)

              assert final['base_risk_scale'] == base['risk_scale']
              assert final['base_scaled_net_010_r'] == base['scaled_net_010_r']

              overlay = Decimal(final['second_layer_overlay_scale'])
              expected_scale = Decimal(base['risk_scale']) * overlay
              expected_result = Decimal(base['scaled_net_010_r']) * overlay
              assert Decimal(final['final_risk_scale']) == expected_scale
              assert Decimal(final['corrected_scaled_net_010_r']) == expected_result

              signal_at = datetime.fromisoformat(geometry['signal_at'])
              entry_at = datetime.fromisoformat(geometry['entry_at'])
              assert signal_at <= entry_at
              entry = Decimal(geometry['entry_price'])
              stop = Decimal(geometry['structural_stop'])
              target = Decimal(geometry['technical_target'])
              if geometry['side'] == 'long':
                  assert stop < entry < target
              else:
                  assert target < entry < stop

              row = dict(geometry)
              row.update(
                  {
                      'legacy_r42_final_risk_scale': final['final_risk_scale'],
                      'legacy_r42_corrected_scaled_net_010_r': final[
                          'corrected_scaled_net_010_r'
                      ],
                      'legacy_r42_second_layer_overlay_scale': final[
                          'second_layer_overlay_scale'
                      ],
                      'legacy_r42_second_layer_fragility_flags': final[
                          'second_layer_fragility_flags'
                      ],
                      'economics_status': 'R_DENOMINATED_ONLY',
                  }
              )
              bound.append(row)

          Path(
              'phase18-output/phase18-audjpy-r42-bound-trades.jsonl'
          ).write_text(
              ''.join(json.dumps(row, sort_keys=True) + '\n' for row in bound)
          )

          final_report = json.loads(
              Path(
                  'r41-final/r41-5y-structural-fragility-correction-report.json'
              ).read_text()
          )
          result = final_report['result_5y']
          assert result['acceptance_pass'] is True
          assert result['trades'] == 1039
          assert result['profit_factor_scaled_net_010'] == (
              '1.957251590510384151212372667'
          )
          assert result['total_scaled_net_010_r'] == (
              '68.02344279137424925740640205'
          )
          assert result['max_drawdown_r'] == (
              '5.293573269867727808258117465'
          )
          assert result['positive_annual_blocks'] == 5

          report = {
              'schema': 'qore.cibo.phase18.audjpy_r42_bound_replay.v1',
              'identity': 'CIBO_PHASE18_AUDJPY_R42_BOUND_REPLAY_V1',
              'status': (
                  'R_DENOMINATED_GEOMETRY_REPLAY_GREEN_'
                  'PROVIDER_CALIBRATION_REQUIRED'
              ),
              'rows': len(bound),
              'parity': {
                  'r40_row_for_row': True,
                  'r41_population_row_for_row': True,
                  'same_signals': True,
                  'same_entry': True,
                  'same_structural_stop': True,
                  'same_technical_target': True,
                  'same_market_path': True,
                  'same_r40_base_risk_scale': True,
                  'r41_second_layer_overlay_reproduced': True,
              },
              'provider_economics': {
                  'status': 'CALIBRATION_REQUIRED',
                  'usd_cibo_sizing_comparison_authorized': False,
              },
              'source_evidence': {
                  'audjpy_source_code_sha': (
                      'a332b077598e070a42b2497b3766d55e731f7dca'
                  ),
                  'raw_run_id': 35166210458,
                  'raw_artifact_id': 10476530915,
                  'target_run_id': 35204892665,
                  'target_artifact_id': 10489761448,
                  'v2_run_id': 35383377176,
                  'r39_freeze_run_id': 35397198837,
                  'r40_run_id': 35397390781,
                  'r40_artifact_id': 10570170141,
                  'r41_run_id': 35399430491,
                  'r41_artifact_id': 10569333275,
              },
              'legacy_r42_result_5y': result,
              'governance': {
                  'research_only': True,
                  'demo_execution_authorized': False,
                  'live_authorized': False,
                  'real_capital_authorized': False,
                  'merge_authorized': False,
              },
          }
          Path(
              'phase18-output/phase18-audjpy-r42-bound-report.json'
          ).write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          PY

      - name: Validate generic Phase 18 scorer against R42
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from decimal import Decimal
          from pathlib import Path

          from qore.infrastructure.account_wide_risk import TraderLineage
          from qore.infrastructure.cibo_ce2i_chronological_replay import (
              CiboChronologicalReplayTrade,
              CiboReplayCausalTrade,
              CiboReplayOutcome,
              ReplayEconomicsStatus,
              ReplaySignalFingerprintOrigin,
              reconstructed_signal_fingerprint,
              score_legacy_replay,
          )

          rows = [
              json.loads(line)
              for line in Path(
                  'phase18-output/phase18-audjpy-r42-bound-trades.jsonl'
              ).read_text().splitlines()
              if line.strip()
          ]
          final_report = json.loads(
              Path(
                  'r41-final/r41-5y-structural-fragility-correction-report.json'
              ).read_text()
          )
          expected = final_report['result_5y']
          evidence_ids = (
              'github-actions:raw:10476530915',
              'github-actions:r40:10570170141',
              'github-actions:r41:10569333275',
          )
          trades = []
          for row in rows:
              signal_at = datetime.fromisoformat(row['signal_at'])
              entry_at = datetime.fromisoformat(row['entry_at'])
              exit_at = datetime.fromisoformat(row['exit_at'])
              entry = Decimal(row['entry_price'])
              stop = Decimal(row['structural_stop'])
              target = Decimal(row['technical_target'])
              fingerprint = reconstructed_signal_fingerprint(
                  trader_id=TraderLineage.R42_AUDJPY,
                  qore_symbol='AUDJPY',
                  side=row['side'],
                  signal_at=signal_at,
                  entry_at=entry_at,
                  entry_price=entry,
                  structural_stop=stop,
                  technical_target=target,
                  source_evidence_ids=evidence_ids,
              )
              causal = CiboReplayCausalTrade(
                  trader_id=TraderLineage.R42_AUDJPY,
                  signal_fingerprint=fingerprint,
                  signal_fingerprint_origin=(
                      ReplaySignalFingerprintOrigin.PHASE18_RECONSTRUCTED
                  ),
                  qore_symbol='AUDJPY',
                  side=row['side'],
                  signal_at=signal_at,
                  entry_at=entry_at,
                  entry_price=entry,
                  structural_stop=stop,
                  technical_target=target,
                  legacy_risk_scale=Decimal(
                      row['legacy_r42_final_risk_scale']
                  ),
                  minimum_execution_steps=1,
                  pre_trade_state=(),
                  source_evidence_ids=evidence_ids,
                  economics_status=ReplayEconomicsStatus.R_DENOMINATED_ONLY,
              )
              outcome = CiboReplayOutcome(
                  exit_at=exit_at,
                  raw_outcome_r=Decimal(row['raw_net_010_r']),
                  net_outcome_r=Decimal(row['raw_net_010_r']),
                  exit_reason=row['exit_reason'],
              )
              trades.append(
                  CiboChronologicalReplayTrade(
                      causal=causal,
                      outcome=outcome,
                      legacy_net_outcome_r=Decimal(
                          row['legacy_r42_corrected_scaled_net_010_r']
                      ),
                  )
              )

          metrics = score_legacy_replay(tuple(trades))
          assert metrics.trades == 1039
          assert metrics.profit_factor == Decimal(
              '1.957251590510384151212372667'
          )
          assert metrics.total_r == Decimal(
              '68.02344279137424925740640205'
          )
          assert metrics.max_drawdown_r == Decimal(
              '5.293573269867727808258117465'
          )
          assert metrics.max_loss_streak == int(expected['max_losing_streak'])

          report = {
              'schema': 'qore.cibo.phase18.generic_legacy_score.v1',
              'trader_id': TraderLineage.R42_AUDJPY.value,
              'trades': metrics.trades,
              'profit_factor': str(metrics.profit_factor),
              'total_r': str(metrics.total_r),
              'max_drawdown_r': str(metrics.max_drawdown_r),
              'max_loss_streak': metrics.max_loss_streak,
              'stop_count': metrics.stop_count,
              'provider_economics_status': 'R_DENOMINATED_ONLY',
              'usd_cibo_sizing_comparison_authorized': False,
          }
          Path(
              'phase18-output/phase18-audjpy-r42-generic-score.json'
          ).write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          PY

      - name: Hash Phase 18 evidence
        run: |
          printf '%s\n' "$EVIDENCE_SHA" > phase18-output/git-sha.txt
          printf '%s\n' "$AUDJPY_SOURCE_SHA" > phase18-output/audjpy-source-sha.txt
          cd phase18-output
          sha256sum \
            phase18-audjpy-r40-geometry-report.json \
            phase18-audjpy-r40-geometry-trades.jsonl \
            phase18-audjpy-r42-bound-report.json \
            phase18-audjpy-r42-bound-trades.jsonl \
            phase18-audjpy-r42-generic-score.json \
            replay-stdout.json \
            git-sha.txt \
            audjpy-source-sha.txt > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-phase18-audjpy-r42-geometry-${{ env.EVIDENCE_SHA }}
          path: phase18-output
          if-no-files-found: error
          retention-days: 90
