name: QORE CIBO Phase 18 AUDJPY R42 Chronological Replay

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-phase18-audjpy-r42-replay.yml'
      - 'scripts/cibo_phase18_audjpy_geometry_patch.py'
      - 'src/qore/infrastructure/cibo_ce2i_chronological_replay.py'
      - 'tests/infrastructure/test_cibo_ce2i_chronological_replay.py'
      - 'tests/infrastructure/trader_lab/test_cibo_phase18_audjpy_geometry_patch.py'
  push:
    branches:
      - agent/cibo-capital-efficiency-sizing-lab-001
    paths:
      - '.github/workflows/cibo-phase18-audjpy-r42-replay.yml'
      - 'scripts/cibo_phase18_audjpy_geometry_patch.py'
      - 'src/qore/infrastructure/cibo_ce2i_chronological_replay.py'
      - 'tests/infrastructure/test_cibo_ce2i_chronological_replay.py'
      - 'tests/infrastructure/trader_lab/test_cibo_phase18_audjpy_geometry_patch.py'

permissions:
  contents: read
  actions: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  AUDJPY_SOURCE_SHA: 'a332b077598e070a42b2497b3766d55e731f7dca'
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-AUDJPY-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-AUDJPY-2f510461b3360e91d5ee70a72716a76cd6561f16'
  V2_RUN_ID: '35383377176'
  V2_ARTIFACT: 'qore-turtle-soup-audjpy-structural-specialist-v2-r27-e0bec233ed40197a1e969786b24a9dc8a1e5869f'
  FREEZE_RUN_ID: '35397198837'
  FREEZE_ARTIFACT: 'qore-turtle-soup-audjpy-r39-candidate-freeze-2210ae38b209103c0dfd6c21addb96bd5bc8a3ac'
  R40_RUN_ID: '35397390781'
  R40_ARTIFACT: 'qore-turtle-soup-audjpy-r40-frozen-r39-5y-validation-a332b077598e070a42b2497b3766d55e731f7dca'
  R41_RUN_ID: '35399430491'
  R41_ARTIFACT: 'qore-turtle-soup-audjpy-r41-5y-fragility-correction-2976255f2459a17603b0b9385b4c249a720463b8'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Focused quality
        run: |
          ruff check \
            scripts/cibo_phase18_audjpy_geometry_patch.py \
            src/qore/infrastructure/cibo_ce2i_chronological_replay.py \
            tests/infrastructure/test_cibo_ce2i_chronological_replay.py \
            tests/infrastructure/trader_lab/test_cibo_phase18_audjpy_geometry_patch.py
          mypy \
            scripts/cibo_phase18_audjpy_geometry_patch.py \
            src/qore/infrastructure/cibo_ce2i_chronological_replay.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_ce2i_chronological_replay.py \
            tests/infrastructure/trader_lab/test_cibo_phase18_audjpy_geometry_patch.py

  replay-audjpy:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout CIBO evidence head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}

      - name: Checkout immutable AUDJPY source code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.AUDJPY_SOURCE_SHA }}
          path: audjpy-code

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install -e .

      - name: Verify immutable AUDJPY source commit
        run: |
          test "$(git -C audjpy-code rev-parse HEAD)" = "$AUDJPY_SOURCE_SHA"
          test "$AUDJPY_SOURCE_SHA" = "a332b077598e070a42b2497b3766d55e731f7dca"

      - name: Instrument exact R40 source for geometry serialization only
        run: |
          python scripts/cibo_phase18_audjpy_geometry_patch.py \
            "audjpy-code/src/qore/infrastructure/trader_lab/turtle_soup_audjpy_r40_frozen_r39_5y_validation.py" \
            "audjpy-code/src/qore/infrastructure/trader_lab/cibo_phase18_audjpy_r40_geometry_replay.py"
          python -m py_compile \
            audjpy-code/src/qore/infrastructure/trader_lab/cibo_phase18_audjpy_r40_geometry_replay.py

      - name: Download immutable AUDJPY raw master
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-audjpy
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download immutable Target Destination V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target-audjpy
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}

      - name: Download exact Cognitive V2 R27 evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V2_ARTIFACT }}
          path: v2-r27
          github-token: ${{ github.token }}
          run-id: ${{ env.V2_RUN_ID }}

      - name: Download exact R39 freeze
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FREEZE_ARTIFACT }}
          path: r39-freeze
          github-token: ${{ github.token }}
          run-id: ${{ env.FREEZE_RUN_ID }}

      - name: Download exact R40 baseline ledger
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.R40_ARTIFACT }}
          path: r40-source
          github-token: ${{ github.token }}
          run-id: ${{ env.R40_RUN_ID }}

      - name: Download exact R41 final corrected ledger
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.R41_ARTIFACT }}
          path: r41-final
          github-token: ${{ github.token }}
          run-id: ${{ env.R41_RUN_ID }}

      - name: Reproduce exact R40 geometry
        env:
          PYTHONPATH: ${{ github.workspace }}/audjpy-code/src
        run: |
          mkdir -p phase18-output
          python audjpy-code/src/qore/infrastructure/trader_lab/cibo_phase18_audjpy_r40_geometry_replay.py \
            source-audjpy target-audjpy v2-r27 r39-freeze phase18-output \
            > phase18-output/replay-stdout.json

      - name: Bind geometry to R40 and final R41/R42 evidence
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from decimal import Decimal
          from pathlib import Path

          def load_jsonl(path: Path):
              return [
                  json.loads(line)
                  for line in path.read_text().splitlines()
                  if line.strip()
              ]

          generated = load_jsonl(
              Path('phase18-output/phase18-audjpy-r40-geometry-trades.jsonl')
          )
          r40 = load_jsonl(Path('r40-source/r40-5y-scaled-trades.jsonl'))
          r41 = load_jsonl(Path('r41-final/r41-5y-corrected-trades.jsonl'))

          assert len(generated) == len(r40) == len(r41) == 1039

          bound = []
          for index, (geometry, base, final) in enumerate(
              zip(generated, r40, r41, strict=True)
          ):
              for key, value in base.items():
                  assert geometry[key] == value, (index, key, geometry[key], value)

              for key in (
                  'entry_at',
                  'exit_at',
                  'side',
                  'source_scheme',
                  'authority_tier',
                  'validation_class',
                  'target_rank',
                  'target_route',
                  'exit_reason',
                  'raw_net_010_r',
              ):
                  assert final[key] == base[key], (index, key)

              assert final['base_risk_scale'] == base['risk_scale']
              assert final['base_scaled_net_010_r'] == base['scaled_net_010_r']

              overlay = Decimal(final['second_layer_overlay_scale'])
              expected_scale = Decimal(base['risk_scale']) * overlay
              expected_result = Decimal(base['scaled_net_010_r']) * overlay
              assert Decimal(final['final_risk_scale']) == expected_scale
              assert Decimal(final['corrected_scaled_net_010_r']) == expected_result

              signal_at = datetime.fromisoformat(geometry['signal_at'])
              entry_at = datetime.fromisoformat(geometry['entry_at'])
              assert signal_at <= entry_at
              entry = Decimal(geometry['entry_price'])