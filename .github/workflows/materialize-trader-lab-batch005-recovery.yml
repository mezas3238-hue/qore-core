name: Materialize Trader Lab Batch 005 recovery

on:
  push:
    branches:
      - agent/qore-trader-lab-001-recovery-materialize
    paths:
      - .github/workflows/materialize-trader-lab-batch005-recovery.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact recovered artifact and self-remove
        shell: bash
        run: |
          set -euo pipefail
          BASE=9672c4d999bd5d3e6db544f349243bc6abea0363
          WF=.github/workflows/materialize-trader-lab-batch005-recovery.yml
          test "$(git diff --name-only "$BASE" HEAD | tr -d '\r')" = "$WF"
          URL='https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-ef1c-820e-849e-02b8c30ae4b9/raw?se=2026-09-02T22%3A58%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=28ae2eb9-7c42-55ec-a0a4-1a549be7b980&skoid=db6dad9e-03ee-465b-aef6-ce0f63a161dc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-02T09%3A24%3A44Z&ske=2026-09-03T09%3A24%3A44Z&sks=b&skv=2026-02-06&sig=3CcQfUw67EWZ8ZEEttDkie3ZgKJdfeGimZVwNJoFnzc%3D'
          curl -fsSL "$URL" -o /tmp/artifact.zip
          mkdir -p /tmp/artifact
          unzip -q /tmp/artifact.zip -d /tmp/artifact
          PATCH="$(find /tmp/artifact -type f -name harness-engineer-candidate.patch -print -quit)"
          test -n "$PATCH"
          echo 'ec6ddd576f0c8e84f368355892b249caa5f02509a6c32a2cc3fa53c7a6d56511  '"$PATCH" | sha256sum -c -
          git apply --check "$PATCH"
          git apply "$PATCH"
          git rm "$WF"
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only "$BASE" | wc -l)" = "13"
          test "$(git diff --cached --numstat "$BASE" | awk '{a+=$1; d+=$2} END {print a+d}')" = "4069"
          git config user.name 'QORE Recovery Materializer'
          git config user.email 'recovery@qore.invalid'
          git commit -m 'Materialize recovered Trader Lab Batch 005 candidate'
          git push origin HEAD:agent/qore-trader-lab-001-recovery-materialize
