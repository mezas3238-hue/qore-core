name: QORE Turtle Soup XAUUSD R3 CIBO Journey 10Y

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-xauusd-r3-cibo-journey-router-001
    paths:
      - '.github/workflows/turtle-soup-xauusd-r3-cibo-journey-10y.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r3_cibo_journey.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r3_cibo_journey.py'
      - 'docs/research/TURTLE-SOUP-XAUUSD-R3-CIBO-JOURNEY-FREEZE.md'

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-turtle-soup-xauusd-r3-cibo-journey-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-XAUUSD-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-XAUUSD-2f510461b3360e91d5ee70a72716a76cd6561f16'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff focused semantic gate
        run: |
          ruff check --ignore E501 \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r3_cibo_journey.py \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r3_cibo_journey.py
      - name: Mypy focused semantic gate
        run: mypy --disable-error-code name-defined --disable-error-code var-annotated src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r3_cibo_journey.py
      - name: Focused tests
        run: pytest -q --no-cov tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r3_cibo_journey.py
      - name: Governance assertions before replay
        run: |
          python - <<'PY'
          from pathlib import Path
          from qore.infrastructure.trader_lab import turtle_soup_xauusd_r3_cibo_journey as r3
          freeze = Path('docs/research/TURTLE-SOUP-XAUUSD-R3-CIBO-JOURNEY-FREEZE.md').read_text()
          assert r3.IDENTITY == 'TURTLE_SOUP_XAUUSD_R3_CIBO_JOURNEY_ROUTER'
          assert r3.TRAIN_CLOSE.isoformat() == '2022-09-17T00:00:00+00:00'
          assert ('CISD_THRESHOLD_RETEST', 'PRIOR_H4') in r3.ACTIONS
          assert 'selection_rule = predicted_primary_r_gt_0' not in freeze
          assert 'no `predicted_primary_r > 0` trade filter' in freeze
          assert 'MFE' in freeze and 'MAE' in freeze
          PY

  preregistration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Emit immutable R3 journey protocol before replay
        run: |
          mkdir -p preregistration
          cp docs/research/TURTLE-SOUP-XAUUSD-R3-CIBO-JOURNEY-FREEZE.md preregistration/
          printf '%s\n' "$GITHUB_SHA" > preregistration/git-sha.txt
          sha256sum preregistration/* > preregistration/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-xauusd-r3-journey-preregistration-${{ github.sha }}
          path: preregistration
          if-no-files-found: error
          retention-days: 90

  replay:
    needs: [quality, preregistration]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download immutable consumed XAUUSD M5 corpus
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download immutable consumed XAUUSD Target Destination V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Verify source provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          raw = list(Path('source-xauusd').rglob('symbol-consumption-manifest.json'))
          target = list(Path('target-xauusd').rglob('target-destination-v2-manifest.json'))
          assert len(raw) == 1 and len(target) == 1
          m = json.loads(raw[0].read_text())
          t = json.loads(target[0].read_text())
          assert m['identity'] == 'CIBO_MARKET_ATLAS_10Y_CONSUMPTION_V1'
          assert m['canonical_symbol'] == 'XAUUSD'
          assert m['retained_bars'] == 707716
          assert m['research_evidence_consumed'] is True
          assert t['identity'] == 'CIBO_TARGET_DESTINATION_V2_SUPPORTED_REFERENCE_UNIVERSE'
          assert t['symbol'] == 'XAUUSD'
          assert t['complete_all_dol_claim'] is False
          assert t['research_evidence_consumed'] is True
          PY
      - name: Fit R3 journey router on consumed development block and run temporal validation
        run: |
          mkdir -p r3-output
          python -m qore.infrastructure.trader_lab.turtle_soup_xauusd_r3_cibo_journey \
            source-xauusd target-xauusd r3-output > r3-output/stdout.json
          printf '%s\n' "$GITHUB_SHA" > r3-output/git-sha.txt
      - name: Enforce R3 journey governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('r3-output/report.json').read_text())
          assert p['identity'] == 'TURTLE_SOUP_XAUUSD_R3_CIBO_JOURNEY_ROUTER'
          assert p['evidence_status'] == 'CONSUMED_CIBO_10Y_DEVELOPMENT_WITH_INTERNAL_TEMPORAL_VALIDATION_NOT_FRESH_HOLDOUT'
          assert p['retained_m5_bars'] == 707716
          assert p['governance']['fresh_holdout'] is False
          assert p['governance']['validation_block_used_for_fit'] is False
          assert p['governance']['positive_score_trade_filter'] is False
          assert p['governance']['post_entry_leakage_allowed'] is False
          assert p['governance']['automatic_promotion_allowed'] is False
          assert p['governance']['live_authorized'] is False
          assert p['router']['learned_abstention'] is False
          assert p['router']['structural_abstention_only'] is True
          PY
      - name: Hash immutable R3 result
        run: |
          cd r3-output
          sha256sum report.json router.json trades-full.json trades-validation.json stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-xauusd-r3-cibo-journey-${{ github.sha }}
          path: r3-output
          if-no-files-found: error
          retention-days: 90
