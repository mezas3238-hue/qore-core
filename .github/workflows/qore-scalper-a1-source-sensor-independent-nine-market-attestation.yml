name: QORE Scalper A1 Independent M15 M1 H1 Source Sensor Validation 9 Markets

on:
  push:
    branches:
      - agent/scalper-architect-a-cognition-20261010
    paths:
      - '.github/workflows/qore-scalper-a1-source-sensor-independent-nine-market-attestation.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_a1_source_sensor_independent_attestation_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_a1_source_sensor_independent_attestation_v1.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_a1_validated_sensor_overlay_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_a1_validated_sensor_overlay_v1.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_a1_sensorized_paper_runtime_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_a1_sensorized_paper_runtime_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-scalper-a1-independent-native-structure-${{ github.ref }}
  cancel-in-progress: false

env:
  V49_RUN: '38053946695'
  V49_SHA: 'e356e7a52541e99533b25ecfef0ab9c4e9ce03c0'
  NATIVE_M1_RUN: '35548099334'
  NATIVE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  causal_observation_quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: No future prices and no source-policy gates
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_a1_source_sensor_independent_attestation_v1.py \
            src/qore/infrastructure/trader_lab/capitalizer_a1_validated_sensor_overlay_v1.py \
            src/qore/infrastructure/trader_lab/capitalizer_a1_sensorized_paper_runtime_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_a1_source_sensor_independent_attestation_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_a1_validated_sensor_overlay_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_a1_sensorized_paper_runtime_v1.py
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_a1_source_sensor_independent_attestation_v1.py \
            src/qore/infrastructure/trader_lab/capitalizer_a1_validated_sensor_overlay_v1.py \
            src/qore/infrastructure/trader_lab/capitalizer_a1_sensorized_paper_runtime_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_a1_source_sensor_independent_attestation_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_a1_validated_sensor_overlay_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_a1_sensorized_paper_runtime_v1.py
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_a1_source_sensor_independent_attestation_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_a1_validated_sensor_overlay_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_a1_sensorized_paper_runtime_v1.py

  market:
    needs: causal_observation_quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        symbol: [USDJPY, AUDJPY, AUDUSD, GBPJPY, EURUSD, GBPUSD, XAUUSD, USDCAD, NAS100]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Fetch immutable original V49 market source opportunities
        uses: actions/download-artifact@v4
        with:
          name: scalper-a2-v49-control-${{ matrix.symbol }}-${{ env.V49_SHA }}
          path: original-v49
          github-token: ${{ github.token }}
          run-id: ${{ env.V49_RUN }}
      - name: Fetch read-only original provider-native M1
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.NATIVE_M1_SHA }}
          path: real-native-m1
          github-token: ${{ github.token }}
          run-id: ${{ env.NATIVE_M1_RUN }}
      - name: Recompute each M15 swing M1 protected pivot and H1 untouched target with strict as-of candles
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_a1_source_sensor_independent_attestation_v1 market real-native-m1 original-v49 market-sensor-evidence
      - name: Assert unchanged source census and no execution authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("market-sensor-evidence/scalper-a1-independent-source-sensors-market.json").read_text())
          assert r["original_opportunities"]>0
          assert r["original_opportunities"]==r["independently_attested_rows"]
          assert r["source_entries_modified"]==0 and r["new_entry_vetoes"]==0
          assert r["full_master_frame_claimed"] is False
          assert r["trader_certified"] is False and r["live_authorized"] is False
          print("SCALPER INDEPENDENT M15/M1/H1 SENSOR VALIDATION:",r)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-a1-independent-source-sensor-${{ matrix.symbol }}-${{ github.sha }}
          path: market-sensor-evidence/
          if-no-files-found: error
          retention-days: 90

  nine_market_census:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: scalper-a1-independent-source-sensor-*-${{ github.sha }}
          path: all-nine-market-structural-witnesses
          merge-multiple: false
      - name: Reconcile original source census and four status totals
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_a1_source_sensor_independent_attestation_v1 matrix all-nine-market-structural-witnesses 9market-summary
      - name: Reject any fake full cognitive attestation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("9market-summary/scalper-a1-independent-source-sensors-nine-market.json").read_text())
          assert x["markets"]==9 and x["source_opportunities"]==2876
          assert x["sensor_status_counts"]["FULL_COGNITIVE_MASTER_FRAME:NOT_AVAILABLE"]==2876
          assert x["new_entry_vetoes"]==0 and not x["full_historical_master_frame_completed"]
          assert x["cognitive_profit_factor"] is None and x["cognitive_drawdown_r"] is None
          assert not x["trader_certified"] and not x["live_authorized"]
          print("SCALPER INDEPENDENT 9/9 SENSOR ATTESTATION:",json.dumps(x,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-a1-independent-sensor-validation-9market-${{ github.sha }}
          path: 9market-summary/
          if-no-files-found: error
          retention-days: 90
