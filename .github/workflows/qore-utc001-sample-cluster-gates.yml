name: QORE UTC-001 Sample Cluster Gates

on:
  push:
    branches:
      - agent/utc001-sample-cluster-gates-001
    paths:
      - '.github/workflows/qore-utc001-sample-cluster-gates.yml'
      - 'src/qore/infrastructure/trader_lab/universal_trader_utc001_sample_cluster_gates_001.py'
      - 'tests/infrastructure/trader_lab/test_universal_trader_utc001_sample_cluster_gates_001.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check             src/qore/infrastructure/trader_lab/universal_trader_utc001_sample_cluster_gates_001.py             tests/infrastructure/trader_lab/test_universal_trader_utc001_sample_cluster_gates_001.py
      - name: Mypy
        run: |
          mypy             src/qore/infrastructure/trader_lab/universal_trader_utc001_sample_cluster_gates_001.py
      - name: Focused tests
        run: |
          pytest -q --no-cov             tests/infrastructure/trader_lab/test_universal_trader_utc001_sample_cluster_gates_001.py
