name: VT08 Index R10 Contextual Risk

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r10-contextual-risk.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r10_contextual_risk.py
      - tests/infrastructure/trader_lab/test_vt08_index_r10_contextual_risk.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r10_contextual_risk.py

  replay:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R10 contextual risk replay
        run: |
          python -m qore.infrastructure.trader_lab.vt08_index_r10_contextual_risk             --nas100-root artifacts/NAS100             --sp500-root artifacts/SP500             --us30-root artifacts/US30             --out artifacts/report/vt08-index-r10-contextual-risk.json

      - name: Verify R10 governance and hard contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(Path("artifacts/report/vt08-index-r10-contextual-risk.json").read_text())
          assert report["identity"] == "VT08_INDEX_R10_CONTEXTUAL_RISK_001"
          assert report["execution_architecture"] == "VT08_INDEX_R8_PRIORITY_POI_REARM_RESET_001"
          assert report["sample"] >= 1500
          assert report["sample"] <= 1600
          assert report["scheme_count"] == 6
          assert report["governance"]["all_trades_preserved"] is True
          assert report["governance"]["zero_risk_allowed"] is False
          assert report["governance"]["pnl_state_used_for_risk"] is False
          assert report["governance"]["pre_entry_context_only"] is True
          assert report["governance"]["fresh_holdout_claim"] is False
          assert report["governance"]["candidate_promoted"] is False
          assert report["governance"]["live_authorized"] is False
          assert report["governance"]["real_capital_authorized"] is False
          assert report["governance"]["production_authorized"] is False
          PY

      - name: Build summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path("artifacts/report")
          r=json.loads((root/"vt08-index-r10-contextual-risk.json").read_text())
          lines=[
              "# VT08 INDEX R10 Contextual Risk",
              "",
              f"- sample: {r['sample']}",
              f"- schemes: {r['scheme_count']}",
              f"- goal candidates: {r['goal_candidate_count']}",
              "",
              "## Context breakdown",
          ]
          for label,row in r["context_breakdown"].items():
              lines.append(
                  f"- {label}: n={row['sample']} PF={row['profit_factor']} "
                  f"DD={row['max_drawdown_r']}R total={row['total_r']}R"
              )
          lines += ["", "## Candidates"]
          for row in r["candidates"]:
              p=row["primary"]
              s=row["secondary"]
              lines += [
                  f"### {row['scheme']['scheme_id']}",
                  f"- min/mean/max weight: {row['minimum_weight']} / {row['mean_weight']} / {row['maximum_weight']}",
                  f"- PF05: {p['profit_factor']}",
                  f"- DD05: {p['max_drawdown_r']}R",
                  f"- total05: {p['total_r']}R",
                  f"- PF10: {s['profit_factor']}",
                  f"- DD10: {s['max_drawdown_r']}R",
                  f"- total10: {s['total_r']}R",
                  f"- goal pass: {row['goal_pass']}",
                  "",
              ]
          (root/"VT08_INDEX_R10_CONTEXTUAL_RISK_SUMMARY.md").write_text("\n".join(lines)+"\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-index-r10-contextual-risk-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
