name: QORE Shared MC07 Predictive Coding Real Replay

concurrency:
  group: qore-shared-mc07-predictive-coding-real-replay
  cancel-in-progress: true

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - src/qore/infrastructure/core_stack_v2/predictive_coding_engine.py
      - tests/infrastructure/test_core_stack_v2_predictive_coding_engine.py
      - scripts/shared_mc07_predictive_coding_real_replay.py
      - .github/workflows/qore-shared-mc07-predictive-coding-real-replay.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Shared
        run: pip install -e ".[dev]"

      - name: Validate predictive coding
        run: |
          set -euo pipefail
          mkdir -p result input/r8 input/r6 input/r5
          ruff check             src/qore/infrastructure/core_stack_v2/predictive_coding_engine.py             tests/infrastructure/test_core_stack_v2_predictive_coding_engine.py             scripts/shared_mc07_predictive_coding_real_replay.py
          mypy src/qore/infrastructure/core_stack_v2/predictive_coding_engine.py
          python -m py_compile scripts/shared_mc07_predictive_coding_real_replay.py
          pytest -q             tests/infrastructure/test_core_stack_v2_predictive_coding_engine.py             --junitxml=result/junit.xml

      - name: Recover immutable R8 R6 R5 evidence
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10402199719/zip" > r8.zip
          unzip -q r8.zip -d input/r8
          (cd input/r8 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10389112524/zip" > r6.zip
          unzip -q r6.zip -d input/r6
          (cd input/r6 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10380044761/zip" > r5.zip
          unzip -q r5.zip -d input/r5
          (cd input/r5 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

      - name: Execute predictive coding replay
        run: |
          set -euo pipefail
          python scripts/shared_mc07_predictive_coding_real_replay.py             --r8-nas input/r8/fresh/NAS100/market-evidence.json             --r8-sp input/r8/fresh/SP500/market-evidence.json             --r8-us input/r8/fresh/US30/market-evidence.json             --r6-nas input/r6/fresh/NAS100/market-evidence.json             --r6-sp input/r6/fresh/SP500/market-evidence.json             --r6-us input/r6/fresh/US30/market-evidence.json             --r5-nas input/r5/fresh/NAS100/market-evidence.json             --r5-sp input/r5/fresh/SP500/market-evidence.json             --r5-us input/r5/fresh/US30/market-evidence.json             --output result/mc07-predictive-coding-real-replay.json             | tee result/summary.json

      - name: Validate scientific disposition without forcing PASS
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(Path("result/mc07-predictive-coding-real-replay.json").read_text())
          assert p["status"] in {
              "MC07_PREDICTIVE_CODING_REPLICATED_PASS",
              "MC07_PREDICTIVE_CODING_FALSIFIED",
          }
          assert p["engine_implemented"] is True
          assert p["real_data_bound"] is True
          assert p["causal_replay_executed"] is True
          assert p["expectation_uses_future_market"] is False
          assert p["later_observation_used_only_when_error_matures"] is True
          assert p["outcome_or_pnl_used"] is False
          assert p["protected_certification_holdout_opened"] is False
          assert p["productive_authority"] is False
          for partition in ("r8","r6","r5"):
              row=p["evaluations"][partition]
              assert row["sample_count"] > 0
              assert row["high_surprise_count"] > 0
              assert row["high_surprise_raw_error_mean_bps"] > row["low_surprise_raw_error_mean_bps"]
          PY

      - name: Bind evidence
        run: |
          set -euo pipefail
          printf '%s\n' "${GITHUB_SHA}" > result/code-git-sha.txt
          (
            cd result
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0               | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-mc07-predictive-coding-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Report MC-07
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p=json.loads(Path("result/mc07-predictive-coding-real-replay.json").read_text())
          lines=[
              "## Shared MC-07 — Predictive Coding Real Replay",
              "",
              f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- disposition: **{p['status']}**",
              "- expectation uses future market: **False**",
              "- later observation matures prediction error: **True**",
              "- outcome/PnL used: **False**",
          ]
          for partition in ("r8","r6","r5"):
              row=p["evaluations"][partition]
              lines.append(
                  f"- {partition.upper()}: samples **{row['sample_count']}**, "
                  f"high/low raw error **{row['high_surprise_raw_error_mean_bps']}/"
                  f"{row['low_surprise_raw_error_mean_bps']} bps**, "
                  f"gate **{row['gate_pass']}**"
              )
          lines.extend([
              "- protected certification holdout opened: **False**",
              "- productive authority: **False**",
          ])
          Path("result/issue-comment.md").write_text("\n".join(lines)+"\n")
          PY
          gh issue comment 638 --body-file result/issue-comment.md
