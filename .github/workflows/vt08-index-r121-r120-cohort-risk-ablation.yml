name: VT08 Index R121 R120 Cohort Risk Ablation

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r121-r120-cohort-risk-ablation.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r121_r120_cohort_risk_ablation.py
      - tests/infrastructure/trader_lab/test_vt08_index_r121_r120_cohort_risk_ablation.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r121_r120_cohort_risk_ablation.py

  ablation:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R121 R120-cohort risk ablation
        run: |
          mkdir -p artifacts/report
          python -m qore.infrastructure.trader_lab.vt08_index_r121_r120_cohort_risk_ablation \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r121-r120-cohort-risk-ablation.json

      - name: Verify R121 frozen ablation contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/"
                  "vt08-index-r121-r120-cohort-risk-ablation.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R121_R120_COHORT_RISK_ABLATION_001"
          )
          assert report["source_r120"]["run_id"] == 35792388753
          assert report["source_r120"]["artifact_id"] == 10722073618
          assert report["source_r120"]["artifact_digest"] == (
              "sha256:f9d86e1347a5634686d26d1dd9e1975"
              "b240146acd348e0294e45fd3369eaf3bd"
          )

          expected = {
              "five_year": (2448, 504),
              "recent_two_year": (1017, 178),
              "r66_failed_holdout": (773, 149),
          }
          for key, (sample, cohort) in expected.items():
              section = report[key]
              assert section["sample"] == sample
              assert section["r120_cohort_sample"] == cohort
              assert section["control"]["metrics"]["sample"] == sample
              assert section["variant"]["metrics"]["sample"] == sample
              assert section["variant"]["diagnostics"]["counts"][
                  "SUPPRESSED_TRADE_COUNT"
              ] == 0

          hypothesis = report["hypothesis"]
          assert hypothesis["mechanism"] == "CLOSE_BREAKOUT"
          assert hypothesis["prior_extreme_relation"] == (
              "PRIOR_DEEPER_THAN_FINAL_PS"
          )
          assert hypothesis["standard_only"] is True
          assert hypothesis["new_risk_constants"] is False

          gov = report["governance"]
          assert gov["research_only"] is True
          assert gov["consumed_evidence_only"] is True
          assert gov["single_preregistered_variant"] is True
          assert gov["canonical_signal_surface_preserved"] is True
          assert gov["signals_suppressed"] is False
          assert gov["entries_changed"] is False
          assert gov["stops_changed"] is False
          assert gov["targets_changed"] is False
          assert gov["candidate_created"] is False
          assert gov["live_authorized"] is False
          assert gov["real_capital_authorized"] is False
          assert gov["production_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r121-r120-cohort-risk-ablation-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
