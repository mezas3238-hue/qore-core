name: QORE Shared GW2 Energy Reference Binding

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - docs/shared/evidence/QORE_SHARED_GW2_ENERGY_REFERENCE_AUTHORITY_EVIDENCE_001.json
      - scripts/shared_gw2_energy_reference_binding.py
      - .github/workflows/qore-shared-gw2-energy-reference-binding.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  GEN2_RUN_ID: "36623131862"
  GEN2_ARTIFACT_ID: "11059307341"
  GEN2_GIT_SHA: "f5fcd0c9552466132f6f47bb124805e49e774493"

jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Shared
        run: pip install -e ".[dev]"

      - name: Validate binding code and authority evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          ruff check scripts/shared_gw2_energy_reference_binding.py
          python -m py_compile scripts/shared_gw2_energy_reference_binding.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("docs/shared/evidence/QORE_SHARED_GW2_ENERGY_REFERENCE_AUTHORITY_EVIDENCE_001.json").read_text())
          assert p["identity"] == "QORE_SHARED_GW2_ENERGY_REFERENCE_AUTHORITY_EVIDENCE_001"
          assert len(p["bindings"]) == 3
          assert p["laws"]["provider_description_is_canonical_product_proof"] is False
          assert p["laws"]["reference_identity_equals_tradable_product_identity"] is False
          assert p["laws"]["generic_natural_gas_equals_henry_hub"] is False
          assert p["governance"]["protected_certification_holdout_opened"] is False
          PY

      - name: Recover sealed GEN-2 provider schedule
        run: |
          set -euo pipefail
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GEN2_RUN_ID}" --jq '.status')" = "completed"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GEN2_RUN_ID}" --jq '.conclusion')" = "success"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GEN2_RUN_ID}" --jq '.head_sha')" = "$GEN2_GIT_SHA"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${GEN2_ARTIFACT_ID}/zip" > gen2.zip
          unzip -q gen2.zip -d input
          (cd input/result && sha256sum -c SHA256SUMS)

      - name: Bind energy reference identities without product inference
        run: |
          set -euo pipefail
          python scripts/shared_gw2_energy_reference_binding.py             --provider-schedule input/result/provider-schedule-catalog.json             --authority-evidence docs/shared/evidence/QORE_SHARED_GW2_ENERGY_REFERENCE_AUTHORITY_EVIDENCE_001.json             --output result/gw2-energy-reference-binding.json             | tee result/summary.json

      - name: Validate exact frontier
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/gw2-energy-reference-binding.json").read_text())
          assert p["energy_sensor_count"] == 3
          assert p["externally_supported_reference_count"] == 2
          assert p["generic_reference_only_count"] == 1
          assert p["tradable_product_identity_verified_count"] == 0
          assert p["venue_verified_count"] == 0
          assert p["roll_semantics_verified_count"] == 0
          assert p["xng_henry_hub_mapping_authorized"] is False
          assert p["sensor_admission_authorized"] is False
          assert p["relational_claims_authorized"] is False
          assert p["protected_holdout_opened"] is False
          assert p["productive_authority"] is False
          PY

      - name: Bind evidence
        run: |
          set -euo pipefail
          printf '%s\n' "${GITHUB_SHA}" > result/code-git-sha.txt
          (
            cd result
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0               | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-gw2-energy-reference-binding-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Report GW-2 energy reference frontier
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p=json.loads(Path("result/gw2-energy-reference-binding.json").read_text())
          lines=[
              "## Shared GW-2 — Energy Reference Identity Binding",
              "",
              f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- provider energy sensors: **{p['energy_sensor_count']}**",
              f"- externally supported reference identities: **{p['externally_supported_reference_count']}**",
              f"- generic reference only: **{p['generic_reference_only_count']}**",
              "- tradable product identities verified: **0**",
              "- XNG -> Henry Hub auto-mapping: **False**",
              "- venue / roll semantics verified: **0 / 0**",
              "- protected certification holdout opened: **False**",
              "",
          ]
          for row in p["records"]:
              lines.append(
                  f"- {row['provider_symbol']}: **{row['reference_identity']}** "
                  f"({row['reference_identity_status']}); product={row['tradable_product_identity_status']}"
              )
          Path("result/issue-comment.md").write_text("\n".join(lines)+"\n")
          PY
          gh issue comment 638 --body-file result/issue-comment.md
