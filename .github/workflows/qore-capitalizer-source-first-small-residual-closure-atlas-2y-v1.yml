name: QORE Capitalizer SOURCE_FIRST Small Residual Closure Atlas 2Y V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-source-first-small-residual-closure-atlas-2y-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_source_first_small_residual_closure_atlas_2y_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_source_first_small_residual_closure_atlas_2y_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  RESIDUAL_RUN_ID: '35903649049'
  RESIDUAL_SHA: '06b033e2fe3f560d2a98fdded4a43548d63c84cb'
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_source_first_small_residual_closure_atlas_2y_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_source_first_small_residual_closure_atlas_2y_v1.py
      - run: mypy src/qore/infrastructure/trader_lab/capitalizer_source_first_small_residual_closure_atlas_2y_v1.py
      - run: pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_source_first_small_residual_closure_atlas_2y_v1.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {symbol: USDJPY, session: ASIA}
          - {symbol: AUDJPY, session: ASIA}
          - {symbol: AUDUSD, session: ASIA}
          - {symbol: GBPJPY, session: ASIA}
          - {symbol: EURUSD, session: LONDON}
          - {symbol: GBPUSD, session: LONDON}
          - {symbol: XAUUSD, session: NEW_YORK}
          - {symbol: USDCAD, session: NEW_YORK}
          - {symbol: NAS100, session: NEW_YORK}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-v3-source-first-residual-m3-bottleneck-atlas-2y-v1-${{ matrix.symbol }}-${{ env.RESIDUAL_SHA }}
          path: residual-source
          github-token: ${{ github.token }}
          run-id: ${{ env.RESIDUAL_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Run small residual closure atlas
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_source_first_small_residual_closure_atlas_2y_v1 \
            market residual-source m1-source atlas-output --session ${{ matrix.session }}
      - name: Enforce controls
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          symbol = os.environ["EXPECTED_SYMBOL"]
          report = json.loads(
              (
                  Path("atlas-output")
                  / f"capitalizer-{symbol.lower()}-source-first-small-residual-closure-atlas-2y-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_SOURCE_FIRST_SMALL_RESIDUAL_CLOSURE_ATLAS_2Y_V1"
          )
          assert report["symbol"] == symbol
          assert report["frozen_semantics_recoverable"] == 0
          assert report["outcome_fields_read"] is False
          assert report["strategy_mutated"] is False
          assert report["recovery_phase"] is True
          assert report["target_phase"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-source-first-small-residual-closure-atlas-2y-v1-${{ matrix.symbol }}-${{ github.sha }}
          path: atlas-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-source-first-small-residual-closure-atlas-2y-v1-*-${{ github.sha }}
          path: atlas-input
          merge-multiple: false
      - name: Build small residual closure matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_source_first_small_residual_closure_atlas_2y_v1 \
            matrix atlas-input matrix-output
      - name: Enforce aggregate controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(
              Path(
                  "matrix-output/"
                  "capitalizer-nine-market-source-first-small-residual-closure-atlas-2y-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_NINE_MARKET_SOURCE_FIRST_SMALL_RESIDUAL_CLOSURE_ATLAS_2Y_V1"
          )
          assert report["market_count"] == 9
          assert report["no_directional_control"] is True
          assert report["no_source_boundary_control"] is True
          assert report["frozen_semantics_recoverable"] == 0
          assert report["outcome_fields_read"] is False
          assert report["strategy_mutated"] is False
          assert report["recovery_phase"] is True
          assert report["target_phase"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-nine-market-source-first-small-residual-closure-atlas-2y-v1-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
