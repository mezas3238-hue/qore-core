name: VT08 Index R88 Nested H1 M5 Source Density

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r88-nested-h1-m5-density.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r88_nested_h1_m5_density.py
      - tests/infrastructure/trader_lab/test_vt08_index_r88_nested_h1_m5_density.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r88_nested_h1_m5_density.py

  forensics:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R88 nested H1 M5 density census
        run: |
          python -m qore.infrastructure.trader_lab.vt08_index_r88_nested_h1_m5_density \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r88-nested-h1-m5-density.json

      - name: Verify R88 governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r88-nested-h1-m5-density.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R88_NESTED_H1_M5_SOURCE_DENSITY_CENSUS_001"
          )
          source = report["source_contract"]
          assert source["higher_bias"] == "V7_DAILY_BIAS"
          assert source["authorized_h4_windows_ny"] == [22, 2, 6, 10]
          assert source["owner_disabled_14_preserved"] is True
          assert source["nested_structure_timeframe"] == "H1"
          assert source["nested_entry_timeframe"] == "M5"
          assert source["h1_requires_12_of_12_provider_m5"] is True
          assert source["h1_poi_hierarchy"] == ["fvg", "relevant-swing", "cisd"]
          assert source["h1_relevant_swing_window"] == 3
          assert source["m5_continuation"] == "EXACT_V6_FIRST_CONTINUATION"
          assert source["h1_wick_body_transition_required"] is True
          assert source["pnl_evaluated"] is False

          assert report["five_year"]["canonical_h4_m15_signal_reference"] == 2448
          assert report["recent_two_year"]["canonical_h4_m15_signal_reference"] == 1017
          assert report["r66_failed_holdout"]["canonical_h4_m15_signal_reference"] == 773
          assert report["decision"] == (
              "R88_NESTED_H1_M5_SOURCE_DENSITY_CENSUS_COMPLETE_NO_TRADES"
          )

          governance = report["governance"]
          assert governance["forensics_only"] is True
          assert governance["provider_m5_only"] is True
          assert governance["synthetic_prices_created"] is False
          assert governance["interpolated_prices_created"] is False
          assert governance["future_information_used"] is False
          assert governance["pnl_evaluated"] is False
          assert governance["source_nested_path_is_separate_from_h4_m15_candidate"] is True
          assert governance["h4_m15_candidate_mutated"] is False
          assert governance["risk_changed"] is False
          assert governance["target_changed"] is False
          assert governance["anchors_changed"] is False
          assert governance["owner_disabled_14_preserved"] is True
          assert governance["candidate_created"] is False
          assert governance["trader_certified"] is False
          assert governance["live_authorized"] is False
          assert governance["real_capital_authorized"] is False
          assert governance["production_authorized"] is False
          PY

      - name: Upload R88 evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r88-nested-h1-m5-density-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: warn
          retention-days: 90
