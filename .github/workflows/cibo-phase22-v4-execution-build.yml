name: QORE CIBO Phase22 V4 Execution Build

on:
  push:
    branches:
      - agent/cibo-integrator-ab-001
    paths:
      - 'src/qore/infrastructure/cibo_phase22_v4_*.py'
      - 'scripts/cibo_phase22_v4_*.py'
      - 'tests/infrastructure/test_cibo_phase22_v4_*.py'
      - '.github/workflows/cibo-phase22-v4-execution-build.yml'
      - '.github/workflows/cibo-phase22-v4-sovereign-one-shot.yml'
      - 'docs/research/CIBO-PHASE22-V4-EXECUTION-MANIFEST.json'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Static quality
        run: python -m ruff check src/qore/infrastructure/cibo_phase22_v4_execution_manifest.py src/qore/infrastructure/cibo_phase22_v4_execution_manifest_freeze.py src/qore/infrastructure/cibo_phase22_v4_execution_authorization.py src/qore/infrastructure/cibo_phase22_v4_store_contract.py src/qore/infrastructure/cibo_phase22_v4_vt31_abi.py src/qore/infrastructure/cibo_phase22_v4_vt31_source.py src/qore/infrastructure/cibo_phase22_v4_one_shot_claim.py src/qore/infrastructure/cibo_phase22_v4_git_durable_claim.py src/qore/infrastructure/cibo_phase22_v4_fresh_batch.py src/qore/infrastructure/cibo_phase22_v4_fresh_evidence.py src/qore/infrastructure/cibo_phase22_v4_fresh_batch_assembly.py src/qore/infrastructure/cibo_phase22_v4_vt08_fresh_runner.py src/qore/infrastructure/cibo_phase22_v4_execution_inputs.py src/qore/infrastructure/cibo_phase22_v4_chronological_replay_plan.py src/qore/infrastructure/cibo_phase22_v4_historical_policy_replay.py src/qore/infrastructure/cibo_phase22_v4_historical_replay_sealing.py src/qore/infrastructure/cibo_phase22_v4_chronological_execution.py src/qore/infrastructure/cibo_phase22_v4_historical_regime.py src/qore/infrastructure/cibo_phase22_v4_execution_closure.py scripts/cibo_phase22_v4_git_durable_claim.py scripts/cibo_phase22_v4_turtle_window_replay.py scripts/cibo_phase22_v4_vt31_fresh_runner.py scripts/cibo_phase22_v4_fresh_batch_assembler.py scripts/cibo_phase22_v4_execution_closure.py scripts/cibo_phase22_v4_materialize_execution_manifest.py tests/infrastructure/test_cibo_phase22_v4_execution_build.py tests/infrastructure/test_cibo_phase22_v4_execution_manifest_freeze.py tests/infrastructure/test_cibo_phase22_v4_execution_manifest_freeze_loader.py tests/infrastructure/test_cibo_phase22_v4_vt31_abi_recovery.py tests/infrastructure/test_cibo_phase22_v4_one_shot_workflow_contract.py tests/infrastructure/test_cibo_phase22_v4_closure_contract.py tests/infrastructure/test_cibo_phase22_v4_fresh_execution_contract.py tests/infrastructure/test_cibo_phase22_v4_m1_source.py
      - name: Import V4 pre-outcome execution surfaces
        run: |
          python - <<'PY'
          modules = (
              "qore.infrastructure.cibo_phase22_v4_execution_manifest",
              "qore.infrastructure.cibo_phase22_v4_execution_manifest_freeze",
              "qore.infrastructure.cibo_phase22_v4_execution_authorization",
              "qore.infrastructure.cibo_phase22_v4_store_contract",
              "qore.infrastructure.cibo_phase22_v4_vt31_abi",
              "qore.infrastructure.cibo_phase22_v4_vt31_source",
              "qore.infrastructure.cibo_phase22_v4_one_shot_claim",
              "qore.infrastructure.cibo_phase22_v4_git_durable_claim",
              "qore.infrastructure.cibo_phase22_v4_fresh_batch",
              "qore.infrastructure.cibo_phase22_v4_fresh_evidence",
              "qore.infrastructure.cibo_phase22_v4_fresh_batch_assembly",
              "qore.infrastructure.cibo_phase22_v4_vt08_fresh_runner",
              "qore.infrastructure.cibo_phase22_v4_execution_inputs",
              "qore.infrastructure.cibo_phase22_v4_chronological_replay_plan",
              "qore.infrastructure.cibo_phase22_v4_historical_policy_replay",
              "qore.infrastructure.cibo_phase22_v4_historical_replay_sealing",
              "qore.infrastructure.cibo_phase22_v4_chronological_execution",
              "qore.infrastructure.cibo_phase22_v4_historical_regime",
              "qore.infrastructure.cibo_phase22_v4_execution_closure",
          )
          for name in modules:
              __import__(name)
          PY
      - name: Prove manifest is frozen exact 7 of 7 and nonexecuting
        run: |
          python - <<'PY'
          from pathlib import Path
          from qore.infrastructure.cibo_phase22_trader_parity_manifest import CANONICAL_PHASE22_TRADER_IDS
          from qore.infrastructure.cibo_phase22_v4_execution_authorization import (
              AUTHORIZATION_RELATIVE_PATH,
              load_phase22_v4_execution_authorization,
          )
          from qore.infrastructure.cibo_phase22_v4_execution_manifest import build_phase22_v4_execution_manifest
          from qore.infrastructure.cibo_phase22_v4_git_durable_claim import (
              ONE_SHOT_CLAIM_RELATIVE_PATH,
              CONSUMPTION_RECEIPT_RELATIVE_PATH,
          )
          manifest = build_phase22_v4_execution_manifest()
          assert tuple(x.trader_id for x in manifest.trader_bindings) == CANONICAL_PHASE22_TRADER_IDS
          assert manifest.fresh_outcomes_executed is False
          assert manifest.broker_mutation_authorized is False
          assert manifest.live_authorized is False
          assert manifest.real_capital_authorized is False
          assert manifest.production_authorized is False
          assert manifest.merge_authorized is False
          assert manifest.productive_authority is False
          auth_path = Path(AUTHORIZATION_RELATIVE_PATH)
          claim_path = Path(ONE_SHOT_CLAIM_RELATIVE_PATH)
          consumption_path = Path(CONSUMPTION_RECEIPT_RELATIVE_PATH)
          if not auth_path.exists():
              assert not claim_path.exists()
              assert not consumption_path.exists()
          else:
              auth = load_phase22_v4_execution_authorization(auth_path)
              assert auth.execution_manifest_sha256 == manifest.fingerprint()
              assert claim_path.exists()
              assert consumption_path.exists()
              assert auth.broker_mutation_authorized is False
              assert auth.live_authorized is False
              assert auth.real_capital_authorized is False
              assert auth.production_authorized is False
              assert auth.merge_authorized is False
              assert auth.productive_authority is False
          PY
      - name: Prove VT31 frozen source ABI is exactly six fields
        run: |
          python - <<'PY'
          from datetime import UTC, datetime
          from qore.infrastructure.cibo_phase22_v4_vt31_abi import adapt_v4_vt31_market_evidence
          class Source:
              series = (object(),)
              fingerprint = "sha256:" + "a" * 64
              last_closed_at = datetime(2015, 4, 19, tzinfo=UTC)
              corpus_git_sha = "b" * 40
              provider_symbol = "USTEC"
          assert len(adapt_v4_vt31_market_evidence(Source())) == 6
          PY
      - name: Prove V4 code contains no broker mutation primitive
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = tuple(Path("src/qore/infrastructure").glob("cibo_phase22_v4_*.py"))
          paths += tuple(Path("scripts").glob("cibo_phase22_v4_*.py"))
          forbidden = (
              "ProtoOANewOrderReq",
              "ProtoOAClosePositionReq",
              "ProtoOACancelOrderReq",
              "ProtoOAAmendOrderReq",
              "ProtoOAAmendPositionSLTPReq",
          )
          for path in paths:
              source = path.read_text(encoding="utf-8")
              for token in forbidden:
                  assert token not in source, (path, token)
          PY
      - name: V4 pre-outcome regression
        run: python -m pytest -q tests/infrastructure/test_cibo_phase22_v4_execution_build.py tests/infrastructure/test_cibo_phase22_v4_execution_manifest_freeze.py tests/infrastructure/test_cibo_phase22_v4_closure_contract.py tests/infrastructure/test_cibo_phase22_v4_fresh_execution_contract.py tests/infrastructure/test_cibo_phase22_v4_source_receipt.py tests/infrastructure/test_cibo_phase22_v4_source_availability.py tests/infrastructure/test_cibo_phase22_v4_m1_source.py tests/infrastructure/test_cibo_phase22_v4_m5_source.py
      - name: Materialize exact-head V4 execution manifest freeze
        run: |
          mkdir -p artifacts/v4-execution-manifest
          python scripts/cibo_phase22_v4_materialize_execution_manifest.py \
            --source-head "$GITHUB_SHA" \
            --output artifacts/v4-execution-manifest/CIBO-PHASE22-V4-EXECUTION-MANIFEST.json
          sha256sum artifacts/v4-execution-manifest/CIBO-PHASE22-V4-EXECUTION-MANIFEST.json \
            > artifacts/v4-execution-manifest/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-phase22-v4-execution-manifest-${{ github.sha }}
          path: artifacts/v4-execution-manifest
          if-no-files-found: error
          retention-days: 90
      - name: CLI smoke without fresh access
        run: |
          python scripts/cibo_phase22_v4_git_durable_claim.py --help
          python scripts/cibo_phase22_v4_fresh_batch_assembler.py --help
          python scripts/cibo_phase22_v4_execution_closure.py --help
          python scripts/cibo_phase22_v4_turtle_window_replay.py --help
          python scripts/cibo_phase22_v4_vt31_fresh_runner.py --help
          python -m qore.infrastructure.cibo_phase22_v4_vt08_fresh_runner --help
      - name: Prove VT31 censored geometry selection is outcome blind
        run: |
          python - <<'PY'
          from scripts.cibo_phase22_v4_vt31_fresh_runner import _partition_executable_geometry
          rows = [
              {"entry": None, "initial_stop": None, "structural_target": None, "r_multiple": "999"},
              {"entry": "100", "initial_stop": "99", "structural_target": "102", "r_multiple": "-999"},
          ]
          selected, censored = _partition_executable_geometry(rows)
          assert censored == 1 and len(selected) == 1
          rows[0]["r_multiple"] = "-999999"
          rows[1]["r_multiple"] = "999999"
          selected2, censored2 = _partition_executable_geometry(rows)
          assert censored2 == 1 and len(selected2) == 1
          PY
