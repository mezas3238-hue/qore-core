name: QORE Capitalizer Cognitive R Milestone Bandit 2R V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-cognitive-r-milestone-bandit-2r-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_cognitive_r_milestone_bandit_2r_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_cognitive_r_milestone_bandit_2r_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-cognitive-r-milestone-bandit-2r-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  REBASE_RUN_ID: '36078677895'
  REBASE_SHA: 'cfc04849c8bbfd6565310d89456f5e367ea880f7'
  MILESTONE_RUN_ID: '36194480697'
  MILESTONE_SHA: '24421d9c043eaf15197e30851851f8b926f167a0'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_cognitive_r_milestone_bandit_2r_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_cognitive_r_milestone_bandit_2r_v1.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_cognitive_r_milestone_bandit_2r_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_cognitive_r_milestone_bandit_2r_v1.py

  experiment:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download true-2R cognitive rebase
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cognitive-economic-rebase-2r-v1-${{ env.REBASE_SHA }}
          path: rebase-input
          github-token: ${{ github.token }}
          run-id: ${{ env.REBASE_RUN_ID }}
      - name: Download validated nine-market milestone ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-cognitive-r-milestone-protection-2r-v1-*-${{ env.MILESTONE_SHA }}
          path: milestone-input
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.MILESTONE_RUN_ID }}
      - name: Run online milestone downside bandit
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cognitive_r_milestone_bandit_2r_v1 \
            rebase-input milestone-input experiment-output
      - name: Enforce causal and economic integrity
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          report = json.loads(
              Path(
                  "experiment-output/"
                  "capitalizer-cognitive-r-milestone-bandit-2r-v1.json"
              ).read_text()
          )
          assert report["control_trades"] == 948
          assert report["arm_count"] == 6
          assert report["policy_count"] == 5
          assert report["all_entries_preserved"] is True
          assert report["prior_chosen_closed_outcomes_only"] is True
          assert report["unchosen_counterfactuals_hidden_from_learner"] is True
          assert report["current_trade_outcome_visible_to_decision"] is False
          assert report["automatic_policy_selection"] is False
          assert report["runtime_rule_selected"] is False
          for row in report["results"]:
              assert row["trades"] == 948
              assert Decimal(row["density_retention"]) == Decimal("1")
              assert row["current_outcome_visible_to_decision"] is False
              assert row["unchosen_counterfactual_outcomes_visible_to_decision"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-cognitive-r-milestone-bandit-2r-v1-${{ github.sha }}
          path: experiment-output
          if-no-files-found: error
          retention-days: 90
