name: QORE VT31 Post-1R Contextual Management Frontier V1

on:
  push:
    branches:
      - agent/vt31-edge-position-cert-b-001
    paths:
      - scripts/vt31_nas100_post_1r_contextual_management_frontier_v1.py
      - .github/workflows/vt31-post-1r-contextual-management-frontier-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Static gate
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_post_1r_contextual_management_frontier_v1.py
          ruff check scripts/vt31_nas100_post_1r_contextual_management_frontier_v1.py

      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"

      - name: Run contextual management frontier
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python scripts/vt31_nas100_post_1r_contextual_management_frontier_v1.py             "input/${EVIDENCE_PATH}"             --output "result/contextual-${PARTITION}.json"             | tee "result/summary-${PARTITION}.json"

      - name: Governance gate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=os.environ["PARTITION"]
          x=json.loads(Path(f"result/contextual-{p}.json").read_text())
          g=x["governance"]
          assert g["same_sovereign_admission_population"] is True
          assert g["entry_changed"] is False
          assert g["future_outcome_used_for_runtime_action"] is False
          assert g["r_runtime_strategy_allowed"] is True
          assert g["r_used_for_volume"] is False
          assert g["position_sizing_used"] is False
          assert g["leverage_used"] is False
          assert g["compounding_used"] is False
          assert g["capital_weighting_used"] is False
          assert g["absolute_volume_used"] is False
          assert g["fresh_holdout_opened"] is False
          counts={v["trade_count"] for v in x["variants"].values()}
          assert len(counts) == 1
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-post1r-contextual-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-post1r-contextual-*-${{ github.sha }}
          path: input
          merge-multiple: true

      - name: Aggregate contextual frontier
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          folds=("r5","r6","r8","consumed")
          variants=("H2_CONTEXTUAL","H3_CONTEXTUAL","H5_CONTEXTUAL")
          payloads={
              f:json.loads(Path(f"input/contextual-{f}.json").read_text())
              for f in folds
          }
          def d(v): return Decimal(str(v))

          report={}
          for variant in variants:
              per_fold={}
              pf_non=mean_non=dd_non=0
              winner_ok=True
              temporal_ok=True
              for fold in folds:
                  b=payloads[fold]["variants"]["STRUCTURAL_ONLY"]
                  c=payloads[fold]["variants"][variant]
                  bm=b["stress_0_05r"]
                  cm=c["stress_0_05r"]
                  wp=c["winner_preservation_vs_structural"]
                  pf_ok=(
                      bm["profit_factor"] is not None
                      and cm["profit_factor"] is not None
                      and d(cm["profit_factor"]) >= d(bm["profit_factor"])
                  )
                  mean_ok=d(cm["mean_r"]) >= d(bm["mean_r"])
                  dd_ok=d(cm["max_drawdown_r"]) <= d(bm["max_drawdown_r"])
                  pf_non += int(pf_ok)
                  mean_non += int(mean_ok)
                  dd_non += int(dd_ok)
                  wc=d(wp["winner_count_preservation"])
                  wr=d(wp["winner_r_preservation"])
                  winner_ok &= wc >= d("0.80") and wr >= d("0.90")

                  blocks={}
                  for key in sorted(
                      set(b["halfyear_stress"]) & set(c["halfyear_stress"])
                  ):
                      bb=b["halfyear_stress"][key]
                      cc=c["halfyear_stress"][key]
                      mean_delta=d(cc["mean_r"])-d(bb["mean_r"])
                      total_delta=d(cc["total_r"])-d(bb["total_r"])
                      block_ok=mean_delta >= 0 and total_delta >= 0
                      temporal_ok &= block_ok
                      blocks[key]={
                          "mean_delta":format(mean_delta,"f"),
                          "total_delta":format(total_delta,"f"),
                          "nondegrade":block_ok,
                      }
                  per_fold[fold]={
                      "baseline":bm,
                      "candidate":cm,
                      "monte_carlo":c["monte_carlo"],
                      "winner_preservation":wp,
                      "contextual_state_counts":c["contextual_state_counts"],
                      "contextual_action_counts":c["contextual_action_counts"],
                      "pf_nondegrade":pf_ok,
                      "mean_nondegrade":mean_ok,
                      "dd_nondegrade":dd_ok,
                      "halfyears":blocks,
                  }
              survivor=(
                  pf_non >= 3
                  and mean_non >= 3
                  and dd_non >= 3
                  and winner_ok
                  and temporal_ok
              )
              report[variant]={
                  "folds":per_fold,
                  "pf_nondegrade_folds":pf_non,
                  "mean_nondegrade_folds":mean_non,
                  "dd_nondegrade_folds":dd_non,
                  "winner_preservation_all_folds":winner_ok,
                  "all_halfyears_nondegrade":temporal_ok,
                  "cross_fold_research_survivor":survivor,
              }

          payload={
              "schema":"qore.vt31.nas100.post_1r_contextual_management_frontier.aggregate.v1",
              "head":"${{ github.sha }}",
              "variants":report,
              "governance":{
                  "consumed_evidence_only":True,
                  "future_labels_used_for_runtime_action":False,
                  "sizing_for_certification_forbidden":True,
                  "fresh_holdout_opened":False,
                  "policy_promoted":False,
                  "candidate_frozen":False,
                  "candidate_certified":False,
              },
          }
          Path("result/aggregate.json").write_text(
              json.dumps(payload,sort_keys=True,indent=2)+"\n"
          )
          print(json.dumps(payload,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-post1r-contextual-aggregate-${{ github.sha }}
          path: result/
          retention-days: 90
