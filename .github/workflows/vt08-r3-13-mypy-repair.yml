name: VT08 R3.13 one-shot Mypy repair

on:
  push:
    branches:
      - agent/vt08-r3-13-challenge-speed-risk-001
    paths:
      - .github/workflows/vt08-r3-13-mypy-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vt08-r3-13-challenge-speed-risk-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Repair optional target-day narrowing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/qore/infrastructure/trader_lab/vt08_challenge_speed_monte_carlo_r3_13.py")
          text = path.read_text()
          old = '''    successful_days = [
        float(item.target_days[TARGET_INDEX_10PCT])
        for item in results
        if item.target_days[TARGET_INDEX_10PCT] is not None
        and item.target_days[TARGET_INDEX_10PCT] <= CHALLENGE_HORIZON_DAYS
        and (
            item.first_breach_day is None
            or item.target_days[TARGET_INDEX_10PCT] <= item.first_breach_day
        )
    ]
'''
          new = '''    successful_days: list[float] = []
    for item in results:
        achieved_day = item.target_days[TARGET_INDEX_10PCT]
        if achieved_day is None or achieved_day > CHALLENGE_HORIZON_DAYS:
            continue
        if item.first_breach_day is None or achieved_day <= item.first_breach_day:
            successful_days.append(float(achieved_day))
'''
          if old not in text:
              raise SystemExit("expected optional target-day block not found")
          path.write_text(text.replace(old, new))
          PY
      - name: Validate repair
        run: |
          ruff format src/qore/infrastructure/trader_lab/vt08_challenge_speed_monte_carlo_r3_13.py tests/infrastructure/trader_lab/test_vt08_challenge_speed_monte_carlo_r3_13.py
          ruff check .
          mypy src tests
          pytest -q tests/infrastructure/trader_lab/test_vt08_challenge_speed_monte_carlo_r3_13.py
      - name: Commit repair and remove one-shot workflow
        run: |
          rm .github/workflows/vt08-r3-13-mypy-repair.yml
          git config user.name "qore-actions"
          git config user.email "actions@users.noreply.github.com"
          git add src/qore/infrastructure/trader_lab/vt08_challenge_speed_monte_carlo_r3_13.py tests/infrastructure/trader_lab/test_vt08_challenge_speed_monte_carlo_r3_13.py .github/workflows/vt08-r3-13-mypy-repair.yml
          git commit -m "fix(vt08): narrow R3.13 target day types"
          git push origin HEAD:agent/vt08-r3-13-challenge-speed-risk-001
