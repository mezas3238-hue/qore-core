name: QORE CIBO Phase22 Holdout Source Receipt

on:
  pull_request:
    paths:
      - '.github/workflows/cibo-phase22-holdout-source-receipt.yml'
      - 'src/qore/infrastructure/cibo_phase22_holdout_source_receipt.py'
      - 'tests/infrastructure/test_cibo_phase22_holdout_source_receipt.py'
  push:
    branches:
      - agent/cibo-certification-architect-b-integration-001
    paths:
      - '.github/workflows/cibo-phase22-holdout-source-receipt.yml'
      - 'src/qore/infrastructure/cibo_phase22_holdout_source_receipt.py'
      - 'tests/infrastructure/test_cibo_phase22_holdout_source_receipt.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Validate immutable fresh source receipt
        run: |
          ruff check \
            src/qore/infrastructure/cibo_phase22_holdout_source_receipt.py \
            tests/infrastructure/test_cibo_phase22_holdout_source_receipt.py
          mypy src/qore/infrastructure/cibo_phase22_holdout_source_receipt.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_phase22_holdout_source_receipt.py
