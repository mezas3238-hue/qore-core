name: QORE CIBO Final Integrated Exam Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-final-integrated-exam.yml'
      - 'src/qore/infrastructure/cibo_final_integrated_exam.py'
      - 'tests/infrastructure/test_cibo_final_integrated_exam.py'
      - 'docs/research/CIBO-FINAL-INTEGRATED-CERTIFICATION-EXAM-PROTOCOL-V1.md'
      - 'docs/research/CIBO-MASTER-OPEN-WORK-LEDGER-V1.json'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  final-integrated-exam-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Final integrated exam contract
        run: |
          ruff check \
            src/qore/infrastructure/cibo_final_integrated_exam.py \
            tests/infrastructure/test_cibo_final_integrated_exam.py
          mypy src/qore/infrastructure/cibo_final_integrated_exam.py
          python -m py_compile src/qore/infrastructure/cibo_final_integrated_exam.py
          pytest -q --no-cov tests/infrastructure/test_cibo_final_integrated_exam.py
