name: QORE CIBO Final Integrated Exam Gate

on:
  pull_request:
    paths:
      - '.github/workflows/cibo-final-integrated-exam.yml'
      - 'src/qore/infrastructure/cibo_final_integrated_exam.py'
      - 'src/qore/infrastructure/cibo_final_integrated_exam_scientific_ledger_transition.py'
      - 'src/qore/infrastructure/cibo_final_integrated_exam_arch_b_ledger_transition.py'
      - 'src/qore/infrastructure/cibo_final_integrated_exam_external_blocker_reconciliation.py'
      - 'src/qore/infrastructure/cibo_receipt_bound_final_integrated_exam.py'
      - 'src/qore/infrastructure/cibo_receipt_bound_final_integrated_exam_v2.py'
      - 'src/qore/infrastructure/cibo_final_exam_control_receipt.py'
      - 'src/qore/infrastructure/cibo_arch_a_final_pre_exam_control.py'
      - 'src/qore/infrastructure/cibo_final_integrated_exam_pre_exam_ledger.py'
      - 'src/qore/infrastructure/cibo_arch_a_final_exam_closure_controls.py'
      - 'src/qore/infrastructure/cibo_arch_a_final_exam_scientific_controls.py'
      - 'src/qore/infrastructure/cibo_final_integrated_exam_assembly.py'
      - 'src/qore/infrastructure/cibo_final_integrated_exam_certification_closure.py'
      - 'src/qore/infrastructure/cibo_world_cup_maximum_capability_exam.py'
      - 'src/qore/infrastructure/cibo_world_cup_maximum_capability_exam_assembly.py'
      - 'src/qore/infrastructure/cibo_world_cup_maximum_capability_exam_evidence_controls.py'
      - 'src/qore/infrastructure/cibo_crossboundary_evidence_receipt.py'
      - 'tests/infrastructure/test_cibo_final_integrated_exam.py'
      - 'tests/infrastructure/test_cibo_final_integrated_exam_external_blocker_reconciliation.py'
      - 'tests/infrastructure/test_cibo_receipt_bound_final_integrated_exam.py'
      - 'tests/infrastructure/test_cibo_receipt_bound_final_integrated_exam_v2.py'
      - 'tests/infrastructure/test_cibo_final_exam_control_receipt.py'
      - 'tests/infrastructure/test_cibo_arch_a_final_pre_exam_control.py'
      - 'tests/infrastructure/test_cibo_final_integrated_exam_pre_exam_ledger.py'
      - 'tests/infrastructure/test_cibo_arch_a_final_exam_closure_controls.py'
      - 'tests/infrastructure/test_cibo_arch_a_final_exam_scientific_controls.py'
      - 'tests/infrastructure/test_cibo_final_integrated_exam_assembly.py'
      - 'tests/infrastructure/test_cibo_final_integrated_exam_certification_closure.py'
      - 'tests/infrastructure/test_cibo_world_cup_maximum_capability_exam.py'
      - 'tests/infrastructure/test_cibo_world_cup_maximum_capability_exam_assembly.py'
      - 'tests/infrastructure/test_cibo_world_cup_maximum_capability_exam_evidence_controls.py'
      - 'tests/infrastructure/test_cibo_crossboundary_evidence_receipt.py'
      - 'docs/research/CIBO-FINAL-INTEGRATED-CERTIFICATION-EXAM-PROTOCOL-V1.md'
      - 'docs/research/CIBO-WORLD-CUP-MAXIMUM-CAPABILITY-EXAM-PROTOCOL-V1.md'
      - 'docs/research/CIBO-MASTER-OPEN-WORK-LEDGER-V1.json'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  final-integrated-exam-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Final and World Cup exam quality
        run: |
          ruff check \
            src/qore/infrastructure/cibo_final_integrated_exam.py \
            src/qore/infrastructure/cibo_final_integrated_exam_scientific_ledger_transition.py \
            src/qore/infrastructure/cibo_final_integrated_exam_arch_b_ledger_transition.py \
            src/qore/infrastructure/cibo_final_integrated_exam_external_blocker_reconciliation.py \
            src/qore/infrastructure/cibo_receipt_bound_final_integrated_exam.py \
            src/qore/infrastructure/cibo_receipt_bound_final_integrated_exam_v2.py \
            src/qore/infrastructure/cibo_final_exam_control_receipt.py \
            src/qore/infrastructure/cibo_arch_a_final_pre_exam_control.py \
            src/qore/infrastructure/cibo_final_integrated_exam_pre_exam_ledger.py \
            src/qore/infrastructure/cibo_arch_a_final_exam_closure_controls.py \
            src/qore/infrastructure/cibo_arch_a_final_exam_scientific_controls.py \
            src/qore/infrastructure/cibo_final_integrated_exam_assembly.py \
            src/qore/infrastructure/cibo_final_integrated_exam_certification_closure.py \
            src/qore/infrastructure/cibo_world_cup_maximum_capability_exam.py \
            src/qore/infrastructure/cibo_world_cup_maximum_capability_exam_assembly.py \
            src/qore/infrastructure/cibo_world_cup_maximum_capability_exam_evidence_controls.py \
            src/qore/infrastructure/cibo_crossboundary_evidence_receipt.py \
            tests/infrastructure/test_cibo_final_integrated_exam.py \
            tests/infrastructure/test_cibo_final_integrated_exam_external_blocker_reconciliation.py \
            tests/infrastructure/test_cibo_receipt_bound_final_integrated_exam.py \
            tests/infrastructure/test_cibo_receipt_bound_final_integrated_exam_v2.py \
            tests/infrastructure/test_cibo_final_exam_control_receipt.py \
            tests/infrastructure/test_cibo_arch_a_final_pre_exam_control.py \
            tests/infrastructure/test_cibo_final_integrated_exam_pre_exam_ledger.py \
            tests/infrastructure/test_cibo_arch_a_final_exam_closure_controls.py \
            tests/infrastructure/test_cibo_arch_a_final_exam_scientific_controls.py \
            tests/infrastructure/test_cibo_final_integrated_exam_assembly.py \
            tests/infrastructure/test_cibo_final_integrated_exam_certification_closure.py \
            tests/infrastructure/test_cibo_world_cup_maximum_capability_exam.py \
            tests/infrastructure/test_cibo_world_cup_maximum_capability_exam_assembly.py \
            tests/infrastructure/test_cibo_world_cup_maximum_capability_exam_evidence_controls.py \
            tests/infrastructure/test_cibo_crossboundary_evidence_receipt.py
          mypy \
            src/qore/infrastructure/cibo_final_integrated_exam.py \
            src/qore/infrastructure/cibo_final_integrated_exam_scientific_ledger_transition.py \
            src/qore/infrastructure/cibo_final_integrated_exam_arch_b_ledger_transition.py \
            src/qore/infrastructure/cibo_final_integrated_exam_external_blocker_reconciliation.py \
            src/qore/infrastructure/cibo_receipt_bound_final_integrated_exam.py \
            src/qore/infrastructure/cibo_receipt_bound_final_integrated_exam_v2.py \
            src/qore/infrastructure/cibo_final_exam_control_receipt.py \
            src/qore/infrastructure/cibo_arch_a_final_pre_exam_control.py \
            src/qore/infrastructure/cibo_final_integrated_exam_pre_exam_ledger.py \
            src/qore/infrastructure/cibo_arch_a_final_exam_closure_controls.py \
            src/qore/infrastructure/cibo_arch_a_final_exam_scientific_controls.py \
            src/qore/infrastructure/cibo_final_integrated_exam_assembly.py \
            src/qore/infrastructure/cibo_final_integrated_exam_certification_closure.py \
            src/qore/infrastructure/cibo_world_cup_maximum_capability_exam.py \
            src/qore/infrastructure/cibo_world_cup_maximum_capability_exam_assembly.py \
            src/qore/infrastructure/cibo_world_cup_maximum_capability_exam_evidence_controls.py \
            src/qore/infrastructure/cibo_crossboundary_evidence_receipt.py
          python -m py_compile \
            src/qore/infrastructure/cibo_final_integrated_exam.py \
            src/qore/infrastructure/cibo_final_integrated_exam_scientific_ledger_transition.py \
            src/qore/infrastructure/cibo_final_integrated_exam_arch_b_ledger_transition.py \
            src/qore/infrastructure/cibo_final_integrated_exam_external_blocker_reconciliation.py \
            src/qore/infrastructure/cibo_receipt_bound_final_integrated_exam.py \
            src/qore/infrastructure/cibo_receipt_bound_final_integrated_exam_v2.py \
            src/qore/infrastructure/cibo_final_exam_control_receipt.py \
            src/qore/infrastructure/cibo_arch_a_final_pre_exam_control.py \
            src/qore/infrastructure/cibo_final_integrated_exam_pre_exam_ledger.py \
            src/qore/infrastructure/cibo_arch_a_final_exam_closure_controls.py \
            src/qore/infrastructure/cibo_arch_a_final_exam_scientific_controls.py \
            src/qore/infrastructure/cibo_final_integrated_exam_assembly.py \
            src/qore/infrastructure/cibo_final_integrated_exam_certification_closure.py \
            src/qore/infrastructure/cibo_world_cup_maximum_capability_exam.py \
            src/qore/infrastructure/cibo_world_cup_maximum_capability_exam_assembly.py \
            src/qore/infrastructure/cibo_world_cup_maximum_capability_exam_evidence_controls.py \
            src/qore/infrastructure/cibo_crossboundary_evidence_receipt.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_final_integrated_exam.py \
            tests/infrastructure/test_cibo_receipt_bound_final_integrated_exam.py \
            tests/infrastructure/test_cibo_receipt_bound_final_integrated_exam_v2.py \
            tests/infrastructure/test_cibo_final_exam_control_receipt.py \
            tests/infrastructure/test_cibo_arch_a_final_pre_exam_control.py \
            tests/infrastructure/test_cibo_final_integrated_exam_pre_exam_ledger.py \
            tests/infrastructure/test_cibo_arch_a_final_exam_closure_controls.py \
            tests/infrastructure/test_cibo_arch_a_final_exam_scientific_controls.py \
            tests/infrastructure/test_cibo_final_integrated_exam_assembly.py \
            tests/infrastructure/test_cibo_final_integrated_exam_certification_closure.py \
            tests/infrastructure/test_cibo_world_cup_maximum_capability_exam.py \
            tests/infrastructure/test_cibo_world_cup_maximum_capability_exam_assembly.py \
            tests/infrastructure/test_cibo_world_cup_maximum_capability_exam_evidence_controls.py \
            tests/infrastructure/test_cibo_crossboundary_evidence_receipt.py
