name: QORE CIBO Final Integrated Exam Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-final-integrated-exam.yml'
      - 'src/qore/infrastructure/cibo_final_integrated_exam.py'
      - 'src/qore/infrastructure/cibo_receipt_bound_final_integrated_exam.py'
      - 'src/qore/infrastructure/cibo_crossboundary_evidence_receipt.py'
      - 'tests/infrastructure/test_cibo_final_integrated_exam.py'
      - 'tests/infrastructure/test_cibo_receipt_bound_final_integrated_exam.py'
      - 'tests/infrastructure/test_cibo_crossboundary_evidence_receipt.py'
      - 'docs/research/CIBO-FINAL-INTEGRATED-CERTIFICATION-EXAM-PROTOCOL-V1.md'
      - 'docs/research/CIBO-MASTER-OPEN-WORK-LEDGER-V1.json'
  push:
    branches:
      - agent/cibo-integrator-ab-001
    paths:
      - '.github/workflows/cibo-final-integrated-exam.yml'
      - 'src/qore/infrastructure/cibo_final_integrated_exam.py'
      - 'src/qore/infrastructure/cibo_receipt_bound_final_integrated_exam.py'
      - 'src/qore/infrastructure/cibo_crossboundary_evidence_receipt.py'
      - 'tests/infrastructure/test_cibo_final_integrated_exam.py'
      - 'tests/infrastructure/test_cibo_receipt_bound_final_integrated_exam.py'
      - 'tests/infrastructure/test_cibo_crossboundary_evidence_receipt.py'
      - 'docs/research/CIBO-FINAL-INTEGRATED-CERTIFICATION-EXAM-PROTOCOL-V1.md'
      - 'docs/research/CIBO-MASTER-OPEN-WORK-LEDGER-V1.json'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  final-integrated-exam-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src/qore/infrastructure/cibo_final_integrated_exam.py src/qore/infrastructure/cibo_receipt_bound_final_integrated_exam.py src/qore/infrastructure/cibo_crossboundary_evidence_receipt.py tests/infrastructure/test_cibo_final_integrated_exam.py tests/infrastructure/test_cibo_receipt_bound_final_integrated_exam.py tests/infrastructure/test_cibo_crossboundary_evidence_receipt.py
      - name: mypy
        run: mypy src/qore/infrastructure/cibo_final_integrated_exam.py src/qore/infrastructure/cibo_receipt_bound_final_integrated_exam.py src/qore/infrastructure/cibo_crossboundary_evidence_receipt.py
      - name: py_compile
        run: python -m py_compile src/qore/infrastructure/cibo_final_integrated_exam.py src/qore/infrastructure/cibo_receipt_bound_final_integrated_exam.py src/qore/infrastructure/cibo_crossboundary_evidence_receipt.py
      - name: pytest legacy engine plus canonical receipt-bound entry
        run: pytest -q --no-cov tests/infrastructure/test_cibo_final_integrated_exam.py tests/infrastructure/test_cibo_receipt_bound_final_integrated_exam.py tests/infrastructure/test_cibo_crossboundary_evidence_receipt.py
