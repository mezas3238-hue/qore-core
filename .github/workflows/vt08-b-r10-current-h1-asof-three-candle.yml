name: VT08 B R10 Three H1 Including Current As-of Audit
on:
  workflow_dispatch:
  push:
    branches:
      - agent/vt08-5m-cognition-replay-20261010
    paths:
      - src/qore/infrastructure/trader_lab/vt08_b_r10_three_h1_current_asof_v1.py
      - tests/infrastructure/trader_lab/test_vt08_b_r10_three_h1_current_asof_v1.py
      - .github/workflows/vt08-b-r10-current-h1-asof-three-candle.yml
permissions:
  contents: read
  actions: read
jobs:
  three-h1-including-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        market: [EURJPY, USDCHF, NZDUSD, CADJPY, USDCAD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Static checks and adversarial no-lookahead tests
        run: |
          ruff check src/qore/infrastructure/trader_lab/vt08_b_r10_three_h1_current_asof_v1.py tests/infrastructure/trader_lab/test_vt08_b_r10_three_h1_current_asof_v1.py
          pytest -q tests/infrastructure/trader_lab/test_vt08_b_r10_three_h1_current_asof_v1.py
      - uses: actions/download-artifact@v4
        with:
          name: vt08-a-blind-three-source-${{ matrix.market }}-385e89cb769eef36f85ddca56f3f3dcaf1e0f863
          path: a-r7/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 38765076497
      - uses: actions/download-artifact@v4
        with:
          name: qore-vt08-cognitive-5m-fresh-${{ matrix.market }}-b2d33e1b4829d8b4afc76983decca8a99131403c
          path: native-m15/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 35934924907
      - name: Rebuild all source-only as-of snapshots including current H1
        env:
          MARKET: ${{ matrix.market }}
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json, os
          from pathlib import Path
          from qore.infrastructure.trader_lab.vt08_b_r10_three_h1_current_asof_v1 import (
              reconstruct_current_h1_context,
          )
          market = os.environ["MARKET"]
          candidates = list(Path("a-r7",market).rglob(
              market+"-three-source-blind-review.json"
          ))
          if len(candidates) != 1:
              raise SystemExit("VT08 R10 pinned R7 source unavailable")
          joined = json.loads(candidates[0].read_text(encoding="utf-8"))
          native = Path("native-m15", market, "market-evidence-1095d.json")
          if not native.is_file():
              raise SystemExit("VT08 R10 native M15 unavailable")
          result = reconstruct_current_h1_context(
              joined, market=market, m15_file=native,
          )
          expected = {"EURJPY":538,"USDCHF":518,"NZDUSD":550,"CADJPY":516,"USDCAD":535}
          if result["frozen_source_events"] != expected[market]:
              raise SystemExit("VT08 R10 lost source observations")
          if result["author_relevant_swing_certified"] or result["broker_fills"]:
              raise SystemExit("VT08 R10 unjustified trade/source authority")
          result["pinned_a_r7_run_id"] = 38765076497
          result["pinned_native_m15_run_id"] = 35934924907
          report = Path("evidence",market+"-B-R10-three-H1-including-current.json")
          report.write_text(
              json.dumps(result,sort_keys=True,separators=(",",":"),allow_nan=False),
              encoding="utf-8",
          )
          print(json.dumps({
              "market":market,"cases":result["frozen_source_events"],
              "counts":result["counts"],"source_complete":result["source_complete_entries"],
              "broker_fills":result["broker_fills"],
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vt08-b-r10-current-H1-${{ matrix.market }}-${{ github.sha }}
          path: evidence/*.json
          retention-days: 30
          if-no-files-found: error
