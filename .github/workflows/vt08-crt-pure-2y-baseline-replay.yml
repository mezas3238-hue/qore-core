name: QORE VT08 CRT PURE 2Y Baseline Replay

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vt08-crt-pure-source-identity-001
    paths:
      - '.github/workflows/vt08-crt-pure-2y-baseline-replay.yml'
      - 'src/qore/infrastructure/trader_lab/vt08_crt_pure_2y_replay.py'
      - 'tests/infrastructure/trader_lab/test_vt08_crt_pure_2y_replay.py'
      - 'src/qore/infrastructure/traders/crt_pure_timing_policy.py'

concurrency:
  group: qore-vt08-crt-pure-2y-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
  QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: python -m pip install -e '.[dev,ctrader]'
      - name: Ruff replay
        run: |
          ruff check --ignore B009 \
            src/qore/infrastructure/trader_lab/vt08_crt_pure_2y_replay.py \
            tests/infrastructure/trader_lab/test_vt08_crt_pure_2y_replay.py
      - name: Mypy replay
        run: mypy src/qore/infrastructure/trader_lab/vt08_crt_pure_2y_replay.py
      - name: Replay unit tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_vt08_crt_pure_2y_replay.py \
            tests/infrastructure/traders/test_crt_pure_timing_policy.py

  replay:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        market: [AUDUSD, USDJPY, BTCUSD]
    env:
      QORE_MARKET: ${{ matrix.market }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cTrader runtime
        run: python -m pip install -e '.[ctrader]'
      - name: Verify DEMO read-only credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in QORE_CTRADER_CLIENT_ID QORE_CTRADER_CLIENT_SECRET QORE_CTRADER_ACCESS_TOKEN QORE_CTRADER_REFRESH_TOKEN; do
            test -n "${!name:-}" || { echo "missing required DEMO input: $name" >&2; exit 2; }
          done
      - name: Discover DEMO account when needed
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            if ! [[ "$account_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "invalid cTrader DEMO account id" >&2
              exit 3
            fi
            echo "::add-mask::$account_id"
            printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          fi
      - name: Run exact two-year replay
        run: |
          mkdir -p "artifacts/${QORE_MARKET}"
          python -m qore.infrastructure.trader_lab.vt08_crt_pure_2y_replay \
            "$QORE_MARKET" "artifacts/${QORE_MARKET}" \
            | tee "artifacts/${QORE_MARKET}/stdout.json"
      - name: Bind git SHA and hashes
        shell: bash
        run: |
          printf '%s\n' "$GITHUB_SHA" > "artifacts/${QORE_MARKET}/git-sha.txt"
          cd "artifacts/${QORE_MARKET}"
          sha256sum trades.jsonl summary.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-crt-pure-2y-${{ matrix.market }}-${{ github.sha }}
          path: artifacts/${{ matrix.market }}
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: replay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install replay runtime
        run: python -m pip install -e '.[ctrader]'
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt08-crt-pure-2y-*-${{ github.sha }}
          path: artifacts/input
      - name: Build combined chronological report
        shell: bash
        run: |
          mkdir -p artifacts/aggregate
          python - <<'PY'
          import json
          from pathlib import Path
          from qore.infrastructure.trader_lab.vt08_crt_pure_2y_replay import ReplayTrade, build_report
          from qore.infrastructure.traders.crt_pure_identity import CrtPureMarket

          per_market = {}
          for market in CrtPureMarket:
              matches = [
                  path
                  for path in Path('artifacts/input').rglob('trades.jsonl')
                  if market.value in str(path.parent)
              ]
              assert len(matches) == 1, (market.value, matches)
              rows = []
              for line in matches[0].read_text().splitlines():
                  if line.strip():
                      rows.append(ReplayTrade(**json.loads(line)))
              per_market[market] = tuple(rows)

          report = build_report(per_market)
          out = Path('artifacts/aggregate/crt-pure-2y-baseline-report.json')
          out.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          print('CRT_2Y_RESULT_JSON=' + json.dumps(report, sort_keys=True))
          assert report['research_only'] is True
          assert report['candidate_certified'] is False
          assert report['live_authorized'] is False
          assert report['real_capital_authorized'] is False
          PY
          printf '%s\n' "$GITHUB_SHA" > artifacts/aggregate/git-sha.txt
          cd artifacts/aggregate
          sha256sum crt-pure-2y-baseline-report.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-crt-pure-2y-aggregate-${{ github.sha }}
          path: artifacts/aggregate
          if-no-files-found: error
          retention-days: 90
