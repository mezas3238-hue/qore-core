name: VT08 Forex 010509 anchor-only fix

on:
  push:
    branches:
      - agent/fundednext-stellar-instant-canonical-execution-001

permissions:
  contents: write

jobs:
  apply-anchor-fix:
    if: contains(github.event.head_commit.message, '[anchor-bootstrap]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fundednext-stellar-instant-canonical-execution-001
          fetch-depth: 0

      - name: Apply exact VT08 Forex anchor correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          guard = Path('src/qore/infrastructure/fundednext_live_guard.py')
          text = guard.read_text(encoding='utf-8')
          old = 'FINAL_CAUSAL_ENTRY_ANCHOR_NY = 9\n'
          new = 'LIVE_ENTRY_ANCHORS_NY = (1, 5, 9)\n'
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = '''    """Permit only the causal 09:00 subset of the historical daily-cardinality rule.\n\n    The historical replay knows all 01/05/09 candidates after the day has passed.\n    Live execution cannot know future anchors.  At 09:00 NY all three candidate\n    opportunities are already observable, so requiring exactly one candidate and\n    requiring it to be the 09:00 candidate is a strict causal subset, never an\n    expansion, of the certified daily-selection policy.\n    """\n\n    normalized = tuple(sorted(candidate_anchor_hours))\n    return (\n        current_anchor_hour == FINAL_CAUSAL_ENTRY_ANCHOR_NY\n        and normalized == (FINAL_CAUSAL_ENTRY_ANCHOR_NY,)\n    )\n'''
          new = '''    """Permit the current causal VT-08 Forex anchor at 01/05/09 New York.\n\n    Only information observable at the current anchor is considered.  Prior same-day\n    candidates do not suppress a later authorized anchor; CIBO and sovereign Risk keep\n    their existing authority over each candidate that reaches the live pipeline.\n    """\n\n    normalized = tuple(sorted(candidate_anchor_hours))\n    return (\n        current_anchor_hour in LIVE_ENTRY_ANCHORS_NY\n        and current_anchor_hour in normalized\n    )\n'''
          assert text.count(old) == 1
          guard.write_text(text.replace(old, new), encoding='utf-8')

          runtime = Path('scripts/qore_fundednext_runtime.py')
          text = runtime.read_text(encoding='utf-8')
          replacements = [
              ('fail-closed resident execution loop. It executes only the causal 09:00 NY subset\nof the certified daily-cardinality rule, keeps sovereign Risk above execution,',
               'fail-closed resident execution loop. It evaluates the authorized 01:00 / 05:00 /\n09:00 NY entry anchors causally, keeps sovereign Risk above execution,'),
              ('    FINAL_CAUSAL_ENTRY_ANCHOR_NY,\n', '    LIVE_ENTRY_ANCHORS_NY,\n'),
              ('    if local.hour != FINAL_CAUSAL_ENTRY_ANCHOR_NY:\n', '    if local.hour not in LIVE_ENTRY_ANCHORS_NY:\n'),
              ('            if hour == FINAL_CAUSAL_ENTRY_ANCHOR_NY:\n', '            if hour == anchor_local.hour:\n'),
              ('        current_anchor_hour=FINAL_CAUSAL_ENTRY_ANCHOR_NY,\n', '        current_anchor_hour=anchor_local.hour,\n'),
              ('        return None, "no-09-candidate"\n', '        return None, f"no-{anchor_local.hour:02d}-candidate"\n'),
              ('    return current, "causal-single-09-candidate"\n', '    return current, f"causal-{anchor_local.hour:02d}-candidate"\n'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if old == '    if local.hour != FINAL_CAUSAL_ENTRY_ANCHOR_NY:\n':
                  assert count == 2, (old, count)
              else:
                  assert count == 1, (old, count)
              text = text.replace(old, new)

          old = '''    for hour in OWNER_FOREX_ENTRY_ANCHORS:\n        decision_local = anchor_local.replace(hour=hour, minute=0, second=0, microsecond=0)\n        decision = decision_local.astimezone(UTC)\n'''
          new = '''    for hour in OWNER_FOREX_ENTRY_ANCHORS:\n        if hour > anchor_local.hour:\n            continue\n        decision_local = anchor_local.replace(hour=hour, minute=0, second=0, microsecond=0)\n        decision = decision_local.astimezone(UTC)\n'''
          assert text.count(old) == 1
          runtime.write_text(text.replace(old, new), encoding='utf-8')

          test_guard = Path('tests/infrastructure/test_fundednext_live_guard.py')
          text = test_guard.read_text(encoding='utf-8')
          old = '''def test_daily_cardinality_is_live_only_at_single_09_candidate() -> None:\n    assert causal_daily_candidate_allowed(\n        candidate_anchor_hours=(9,), current_anchor_hour=9\n    )\n    assert not causal_daily_candidate_allowed(\n        candidate_anchor_hours=(1,), current_anchor_hour=1\n    )\n    assert not causal_daily_candidate_allowed(\n        candidate_anchor_hours=(1, 9), current_anchor_hour=9\n    )\n'''
          new = '''def test_live_causal_candidate_accepts_all_authorized_forex_anchors() -> None:\n    for hour in (1, 5, 9):\n        assert causal_daily_candidate_allowed(\n            candidate_anchor_hours=(hour,), current_anchor_hour=hour\n        )\n    assert causal_daily_candidate_allowed(\n        candidate_anchor_hours=(1, 5), current_anchor_hour=5\n    )\n    assert causal_daily_candidate_allowed(\n        candidate_anchor_hours=(1, 5, 9), current_anchor_hour=9\n    )\n    assert not causal_daily_candidate_allowed(\n        candidate_anchor_hours=(1,), current_anchor_hour=5\n    )\n    assert not causal_daily_candidate_allowed(\n        candidate_anchor_hours=(13,), current_anchor_hour=13\n    )\n'''
          assert text.count(old) == 1
          test_guard.write_text(text.replace(old, new), encoding='utf-8')

          contract = Path('tests/infrastructure/test_fundednext_runtime_script_contract.py')
          text = contract.read_text(encoding='utf-8')
          addition = '''\n\ndef test_live_runtime_accepts_only_010509_new_york_entry_anchors() -> None:\n    source = _RUNTIME.read_text(encoding="utf-8-sig")\n    assert "local.hour not in LIVE_ENTRY_ANCHORS_NY" in source\n    assert "current_anchor_hour=anchor_local.hour" in source\n    assert "if hour > anchor_local.hour:" in source\n    assert "FINAL_CAUSAL_ENTRY_ANCHOR_NY" not in source'''
          assert 'test_live_runtime_accepts_only_010509_new_york_entry_anchors' not in text
          contract.write_text(text.rstrip() + addition + '\n', encoding='utf-8')
          PY

      - name: Verify anchor-only diff
        shell: bash
        run: |
          git diff --check
          python -m compileall -q scripts/qore_fundednext_runtime.py src/qore/infrastructure/fundednext_live_guard.py tests/infrastructure/test_fundednext_live_guard.py tests/infrastructure/test_fundednext_runtime_script_contract.py
          git diff --name-only | sort
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "scripts/qore_fundednext_runtime.py src/qore/infrastructure/fundednext_live_guard.py tests/infrastructure/test_fundednext_live_guard.py tests/infrastructure/test_fundednext_runtime_script_contract.py "

      - name: Commit anchor-only correction
        shell: bash
        run: |
          git config user.name "QORE Sol Integration"
          git config user.email "qore-sol-integration@users.noreply.github.com"
          git add scripts/qore_fundednext_runtime.py src/qore/infrastructure/fundednext_live_guard.py tests/infrastructure/test_fundednext_live_guard.py tests/infrastructure/test_fundednext_runtime_script_contract.py
          git commit -m "fix(vt08): enable 01 05 09 NY live anchors"
          git push origin HEAD:agent/fundednext-stellar-instant-canonical-execution-001
