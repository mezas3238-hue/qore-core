name: QORE Turtle Soup XAUUSD R1 Consumed 10Y Replay
# Registered replay workflow; this commit triggers the frozen consumed-corpus run.

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-xauusd-r1-001
    paths:
      - '.github/workflows/turtle-soup-xauusd-r1-consumed-10y-replay.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r1_consumed_replay.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r1_consumed_replay.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-turtle-soup-xauusd-r1-consumed-10y-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: '35166210458'
  SOURCE_GIT_SHA: 'ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-XAUUSD-ab782b8e9f890f86a2b6500070f0556b4b685e3d'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r1_consumed_replay.py \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r1_consumed_replay.py
      - name: Mypy
        run: mypy src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r1_consumed_replay.py
      - name: Focused tests
        run: pytest -q --no-cov tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r1_consumed_replay.py
      - name: Governance assertions
        run: |
          python - <<'PY'
          from qore.infrastructure.trader_lab import turtle_soup_xauusd_r1 as r1
          from qore.infrastructure.trader_lab import turtle_soup_xauusd_r1_consumed_replay as d
          assert r1.IDENTITY == 'TURTLE_SOUP_XAUUSD_R1'
          assert d.SOURCE_RUN_ID == 35166210458
          assert d.SOURCE_ARTIFACT_ID == 10476557530
          assert d.EVAL_OPEN.isoformat() == '2016-09-17T00:00:00+00:00'
          assert d.EVAL_CLOSE.isoformat() == '2026-09-17T00:00:00+00:00'
          PY

  replay:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download immutable consumed XAUUSD M5 corpus
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Verify source provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifests = list(Path('source-xauusd').rglob('symbol-consumption-manifest.json'))
          assert len(manifests) == 1, manifests
          manifest = json.loads(manifests[0].read_text())
          assert manifest['identity'] == 'CIBO_MARKET_ATLAS_10Y_CONSUMPTION_V1'
          assert manifest['canonical_symbol'] == 'XAUUSD'
          assert manifest['retained_bars'] == 707716
          assert manifest['research_evidence_consumed'] is True
          PY
      - name: Execute frozen R1 on consumed ten-year corpus
        run: |
          mkdir -p replay-output
          python -m qore.infrastructure.trader_lab.turtle_soup_xauusd_r1_consumed_replay \
            source-xauusd replay-output > replay-output/stdout.json
          printf '%s\n' "$GITHUB_SHA" > replay-output/git-sha.txt
      - name: Enforce replay governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('replay-output/report.json').read_text())
          assert p['identity'] == 'TURTLE_SOUP_XAUUSD_R1_CONSUMED_10Y_REPLAY_V1'
          assert p['candidate_identity'] == 'TURTLE_SOUP_XAUUSD_R1'
          assert p['evidence_status'] == 'CONSUMED_DEVELOPMENT_REPLAY_NOT_FRESH_HOLDOUT'
          assert p['retained_m5_bars'] == 707716
          assert p['candidate_contract_unchanged'] is True
          assert p['interpretation_constraints']['fresh_holdout'] is False
          assert p['interpretation_constraints']['automatic_rule_promotion_allowed'] is False
          assert p['demo_eligible'] is False
          assert p['live_authorized'] is False
          assert p['real_capital_authorized'] is False
          assert p['production_authorized'] is False
          PY
      - name: Hash immutable result
        run: |
          cd replay-output
          sha256sum report.json trades.json stdout.json git-sha.txt > SHA256SUMS.txt
      - name: Upload immutable replay result
        uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-xauusd-r1-consumed-10y-${{ github.sha }}
          path: replay-output
          if-no-files-found: error
          retention-days: 90
