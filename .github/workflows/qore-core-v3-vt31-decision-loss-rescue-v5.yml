name: QORE Core V3 VT31 Decision Loss Rescue V5

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - scripts/vt31_core_stack_v3_decision_loss_rescue_v5.py
      - .github/workflows/qore-core-v3-vt31-decision-loss-rescue-v5.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  loss-rescue:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Static validation
        run: |
          ruff check scripts/vt31_core_stack_v3_decision_loss_rescue_v5.py
          python -m py_compile scripts/vt31_core_stack_v3_decision_loss_rescue_v5.py
      - name: Recover immutable evidence
        run: |
          set -euo pipefail
          mkdir -p input/pure input/cibo result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10799064861/zip" > pure.zip
          unzip -q pure.zip -d input/pure
          (cd input/pure && sha256sum -c SHA256SUMS)
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10478487667/zip" > cibo.zip
          unzip -q cibo.zip -d input/cibo
          (cd input/cibo && sha256sum -c SHA256SUMS)
      - name: Run loss-detector winner-rescue falsification
        run: |
          python scripts/vt31_core_stack_v3_decision_loss_rescue_v5.py             --r8-json input/pure/r8.json             --r6-json input/pure/r6.json             --r5-json input/pure/r5.json             --daily-path input/cibo/DAILY_PATH_LEDGER.jsonl             --output result/decision-loss-rescue-v5.json             | tee result/summary.json
      - name: Governance gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/decision-loss-rescue-v5.json").read_text())
          assert p["challenge_set"] == {"trades":822,"losses":711,"wins":111}
          g=p["governance"]
          assert g["loss_detector_and_winner_rescue_separate"] is True
          assert g["journey_management_used"] is False
          assert g["capital_risk_weighting_used"] is False
          assert g["current_outcome_used"] is False
          assert g["r5_retuned"] is False
          assert g["live_authorized"] is False
          assert g["merge_authorized"] is False
          print(json.dumps({
            "economic_status":p["economic_status"],
            "passes_shared_decision":p["passes_shared_decision"],
            "frozen_policy":p["frozen_policy"],
            "evaluation":p["evaluation"],
            "gates":p["gates"],
          },sort_keys=True))
          PY
      - name: Bind result
        run: |
          echo "$GITHUB_SHA" > result/git-sha.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd result && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-core-v3-vt31-decision-loss-rescue-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
