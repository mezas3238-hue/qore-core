name: Materialize CIBO Cognitive correction 001

on:
  push:
    branches:
      - agent/qore-cibo-cognitive-superarchitecture-001-correction001-materialize
    paths:
      - .github/workflows/materialize-cibo-cognitive-correction001.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact recovered Cognitive candidate and self-remove
        shell: bash
        run: |
          set -euo pipefail
          BASE=576803fbda76970a4bbfe2287b5f9ca101d0f6c3
          WF=.github/workflows/materialize-cibo-cognitive-correction001.yml
          test "$(git diff --name-only "$BASE" HEAD | tr -d '\r')" = "$WF"
          URL='https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-ae24-820e-b647-945c71fde958/raw?se=2026-09-03T14%3A42%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=a162112c-ea24-591c-8425-b5fe7ecde325&skoid=db6dad9e-03ee-465b-aef6-ce0f63a161dc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-02T22%3A33%3A33Z&ske=2026-09-03T22%3A33%3A33Z&sks=b&skv=2026-02-06&sig=G5YkS4eS2uYjQSVjpTxGxMFdXT1tw7P6CSaSbd5V%2B7w%3D'
          curl -fsSL "$URL" -o /tmp/artifact.zip
          rm -rf /tmp/artifact && mkdir -p /tmp/artifact
          unzip -q /tmp/artifact.zip -d /tmp/artifact
          PATCH="$(find /tmp/artifact -type f -name harness-engineer-candidate.patch -print -quit)"
          test -n "$PATCH"
          echo '4b3072fc60e4dae42d8de5ebdf041f78e19da08cd4e31dffb15c9c157b4dca63  '"$PATCH" | sha256sum -c -
          git apply --check "$PATCH"
          git apply "$PATCH"
          git rm "$WF"
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only "$BASE" | wc -l)" = "16"
          test "$(git diff --cached --numstat "$BASE" | awk '{a+=$1; d+=$2} END {print a+d}')" = "4725"
          git config user.name 'QORE Recovery Materializer'
          git config user.email 'recovery@qore.invalid'
          git commit -m 'Materialize CIBO Cognitive correction 001 candidate'
          git push origin HEAD:agent/qore-cibo-cognitive-superarchitecture-001-correction001-materialize
