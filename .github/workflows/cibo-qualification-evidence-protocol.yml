name: QORE CIBO Qualification Evidence Protocol

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/qore/infrastructure/cibo_ce2i_qualification_evidence_protocol.py'
      - 'src/qore/infrastructure/cibo_ce2i_phase20_qualification.py'
      - 'src/qore/infrastructure/cibo_ce2i_phase20_qualification_readiness.py'
      - 'src/qore/infrastructure/cibo_ce2i_phase22_holdout_gate.py'
      - 'src/qore/infrastructure/cibo_ce2i_phase22_qualification.py'
      - 'tests/infrastructure/test_cibo_ce2i_qualification_evidence_protocol.py'
      - '.github/workflows/cibo-qualification-evidence-protocol.yml'

permissions:
  contents: read

jobs:
  qualification-evidence-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Preserve qualification math across evidence provenance kinds
        run: |
          ruff check \
            src/qore/infrastructure/cibo_ce2i_qualification_evidence_protocol.py \
            src/qore/infrastructure/cibo_ce2i_phase20_qualification.py \
            src/qore/infrastructure/cibo_ce2i_phase20_qualification_readiness.py \
            src/qore/infrastructure/cibo_ce2i_phase22_holdout_gate.py \
            src/qore/infrastructure/cibo_ce2i_phase22_qualification.py \
            tests/infrastructure/test_cibo_ce2i_qualification_evidence_protocol.py
          mypy \
            src/qore/infrastructure/cibo_ce2i_qualification_evidence_protocol.py \
            src/qore/infrastructure/cibo_ce2i_phase20_qualification.py \
            src/qore/infrastructure/cibo_ce2i_phase20_qualification_readiness.py \
            src/qore/infrastructure/cibo_ce2i_phase22_holdout_gate.py \
            src/qore/infrastructure/cibo_ce2i_phase22_qualification.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_ce2i_qualification_evidence_protocol.py \
            tests/infrastructure/test_cibo_ce2i_phase20_qualification.py \
            tests/infrastructure/test_cibo_ce2i_phase20_qualification_readiness.py \
            tests/infrastructure/test_cibo_ce2i_phase22_holdout_gate.py \
            tests/infrastructure/test_cibo_ce2i_phase22_qualification.py
