name: QORE Turtle Soup GBPJPY R35 Confidence Tier Ensemble

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/turtle-soup-gbpjpy-r35-confidence-tier-ensemble.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_r35_confidence_tier_ensemble.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_gbpjpy_r35_confidence_tier_ensemble.py'
  push:
    branches:
      - agent/turtle-soup-gbpjpy-specialist-memory-v1-001
    paths:
      - '.github/workflows/turtle-soup-gbpjpy-r35-confidence-tier-ensemble.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_r35_confidence_tier_ensemble.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_gbpjpy_r35_confidence_tier_ensemble.py'

permissions:
  contents: read
  actions: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-GBPJPY-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-GBPJPY-2f510461b3360e91d5ee70a72716a76cd6561f16'
  V2_RUN_ID: '35349300927'
  V2_ARTIFACT: 'qore-turtle-soup-gbpjpy-structural-specialist-v2-r27-00fb870826e0cbd30179fe44cbdd6707448be0da'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Focused quality
        run: |
          ruff check --ignore E501,I001 \
            src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_r35_confidence_tier_ensemble.py \
            tests/infrastructure/trader_lab/test_turtle_soup_gbpjpy_r35_confidence_tier_ensemble.py
          mypy --disable-error-code attr-defined \
            src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_r35_confidence_tier_ensemble.py
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_turtle_soup_gbpjpy_r35_confidence_tier_ensemble.py

  replay:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable GBPJPY raw master
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-gbpjpy
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download immutable Target Destination V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target-gbpjpy
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Download exact Cognitive V2 R27 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V2_ARTIFACT }}
          path: v2-r27
          github-token: ${{ github.token }}
          run-id: ${{ env.V2_RUN_ID }}
      - name: Run R35 confidence-tier ensemble
        run: |
          mkdir -p r35-output
          python -m qore.infrastructure.trader_lab.turtle_soup_gbpjpy_r35_confidence_tier_ensemble \
            source-gbpjpy target-gbpjpy v2-r27 r35-output > r35-output/stdout.json
          printf '%s\n' "$EVIDENCE_SHA" > r35-output/git-sha.txt
      - name: Enforce frozen owner gate and governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('r35-output/r35-confidence-tier-ensemble-report.json').read_text())
          assert p['identity']=='TURTLE_SOUP_GBPJPY_R35_CONFIDENCE_TIER_ENSEMBLE_LAB_V1'
          a=p['predeclared_acceptance']
          assert int(a['minimum_trades']) == 350
          assert a['minimum_scaled_net_010_profit_factor'] == '1.90'
          assert a['maximum_scaled_net_010_drawdown_r'] == '6.0'
          assert int(a['maximum_losing_streak']) == 3
          c=p['experiment_contract']
          assert c['r34_range_core_preserved'] is True
          assert c['expansion_only_when_higher_authority_layer_abstains'] is True
          assert c['actual_active_cibo_dol_price_used'] is True
          assert c['entry_changed'] is False
          assert c['c2_changed'] is False
          assert c['cisd_changed'] is False
          assert c['protected_swing_changed'] is False
          assert c['risk_governor_suppresses_trades'] is False
          assert p['governance']['fresh_holdout_consumed'] is False
          PY
      - name: Hash R35 evidence
        run: |
          cd r35-output
          sha256sum r35-confidence-tier-ensemble-report.json stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-gbpjpy-r35-confidence-tier-${{ env.EVIDENCE_SHA }}
          path: r35-output
          if-no-files-found: error
          retention-days: 90
