name: QORE VT31 Selective Breaker Pretarget Protection Frontier V1

on:
  push:
    branches:
      - agent/vt31-edge-position-cert-b-001
    paths:
      - scripts/vt31_nas100_selective_breaker_pretarget_protection_frontier_v1.py
      - scripts/vt31_nas100_h3_dol2_composition_frontier_v1.py
      - scripts/vt31_nas100_a_b_admission_integration_frontier_v1.py
      - .github/workflows/vt31-selective-breaker-pretarget-protection-frontier-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Static and focused gates
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/vt31_nas100_selective_breaker_pretarget_protection_frontier_v1.py
          ruff check \
            scripts/vt31_nas100_selective_breaker_pretarget_protection_frontier_v1.py
          pytest -q -o addopts='' \
            tests/infrastructure/test_vt31_nas100_position_intelligence.py \
            tests/infrastructure/test_vt31_nas100_post_entry_cognitive_runtime.py \
            tests/infrastructure/test_vt31_nas100_edge_certification.py
      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"
      - name: Run selective Breaker protection frontier
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python \
            scripts/vt31_nas100_selective_breaker_pretarget_protection_frontier_v1.py \
            "input/${EVIDENCE_PATH}" \
            --output "result/selective-breaker-${PARTITION}.json" \
            | tee "result/summary-${PARTITION}.json"
      - name: Governance
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=os.environ["PARTITION"]
          x=json.loads(Path(f"result/selective-breaker-{p}.json").read_text())
          assert x["admission_variant"] == (
              "A_EXPANDED_OB_REQUIRE_SHORT_RECLAIM_15M"
          )
          g=x["governance"]
          assert g["same_admission_population_all_variants"] is True
          assert g["selector_uses_entry_time_cognition_only"] is True
          assert g["pretarget_protection_only_degree_of_freedom"] is True
          assert g["protection_can_only_improve_stop"] is True
          assert g["protection_effective_next_m1"] is True
          assert g["position_sizing_used"] is False
          assert g["dynamic_sizing_used"] is False
          assert g["leverage_used"] is False
          assert g["compounding_used"] is False
          assert g["capital_weighting_used"] is False
          assert g["fold_identity_used_for_action"] is False
          assert g["future_outcome_used_for_action"] is False
          assert g["fresh_holdout_opened"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-selective-breaker-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-selective-breaker-*-${{ github.sha }}
          path: input
          merge-multiple: true
      - name: Adjudicate
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          folds=("r5","r6","r8","consumed")
          candidates=(
              "BREAKER_M15_MIXED_PS1",
              "BREAKER_M15_MIXED_PS2",
              "BREAKER_M15_MIXED_CONFIRM_3_5_PS1",
              "BREAKER_M15_MIXED_CONFIRM_3_5_PS2",
          )
          payloads={
              fold:json.loads(
                  Path(f"input/selective-breaker-{fold}.json").read_text()
              )
              for fold in folds
          }

          def d(value):
              return Decimal(str(value))

          def pf(metrics):
              value=metrics["profit_factor"]
              if value is None:
                  return Decimal("Infinity") if metrics["wins"]>0 else Decimal(0)
              return d(value)

          report={}
          for variant in candidates:
              per={}
              pf_ok=mean_ok=dd_ok=0
              winners_all=True
              temporal_all=True
              for fold in folds:
                  base=payloads[fold]["variants"]["CONTROL"]
                  cand=payloads[fold]["variants"][variant]
                  bm=base["stress_0_05r"]
                  cm=cand["stress_0_05r"]
                  wp=cand["winner_preservation_vs_control"]
                  pf_non=pf(cm)>=pf(bm)
                  mean_non=d(cm["mean_r"])>=d(bm["mean_r"])
                  dd_non=d(cm["max_drawdown_r"])<=d(bm["max_drawdown_r"])
                  winner_non=(
                      d(wp["winner_count_preservation"])>=Decimal("0.80")
                      and d(wp["winner_r_preservation"])>=Decimal("0.90")
                  )
                  pf_ok+=int(pf_non)
                  mean_ok+=int(mean_non)
                  dd_ok+=int(dd_non)
                  winners_all &= winner_non

                  common=(
                      set(base["halfyear_stress"])
                      & set(cand["halfyear_stress"])
                  )
                  blocks={}
                  for key in sorted(common):
                      mean_delta=(
                          d(cand["halfyear_stress"][key]["mean_r"])
                          - d(base["halfyear_stress"][key]["mean_r"])
                      )
                      dd_non_block=(
                          d(cand["halfyear_stress"][key]["max_drawdown_r"])
                          <= d(base["halfyear_stress"][key]["max_drawdown_r"])
                      )
                      ok=mean_delta>=0 and dd_non_block
                      temporal_all &= ok
                      blocks[key]={
                          "mean_r_delta":format(mean_delta,"f"),
                          "dd_nondegrade":dd_non_block,
                          "nondegrade":ok,
                      }

                  per[fold]={
                      "baseline":bm,
                      "candidate":cm,
                      "monte_carlo":cand["monte_carlo"],
                      "winner_preservation":wp,
                      "pf_nondegrade":pf_non,
                      "mean_nondegrade":mean_non,
                      "dd_nondegrade":dd_non,
                      "winner_floor_pass":winner_non,
                      "halfyears":blocks,
                      "selector_eligible_trade_count":(
                          cand["selector_eligible_trade_count"]
                      ),
                      "protection_committed_count":(
                          cand["pretarget_breaker_ps_committed_count"]
                      ),
                      "protection_exit_count":(
                          cand["pretarget_breaker_ps_exit_count"]
                      ),
                      "changed_trade_count":(
                          cand["changed_trade_count_vs_control"]
                      ),
                      "sequence_diagnostics":cand["sequence_diagnostics"],
                  }

              recent=per["consumed"]
              owner={
                  "pf_at_least_1_50":pf(recent["candidate"])>=Decimal("1.50"),
                  "mean_at_least_0_15r":(
                      d(recent["candidate"]["mean_r"])>=Decimal("0.15")
                  ),
                  "observed_dd_at_most_6r":(
                      d(recent["candidate"]["max_drawdown_r"])<=Decimal("6")
                  ),
                  "mc_positive_at_least_0_90":(
                      d(recent["monte_carlo"]["positive_terminal_probability"])
                      >= Decimal("0.90")
                  ),
                  "mc_p95_dd_at_most_15r":(
                      d(recent["monte_carlo"]["p95_max_drawdown_r"])
                      <= Decimal("15")
                  ),
              }
              survivor=(
                  pf_ok==4
                  and mean_ok==4
                  and dd_ok==4
                  and winners_all
                  and temporal_all
              )
              report[variant]={
                  "folds":per,
                  "pf_nondegrade_folds":pf_ok,
                  "mean_nondegrade_folds":mean_ok,
                  "dd_nondegrade_folds":dd_ok,
                  "winner_preservation_all_folds":winners_all,
                  "halfyears_all_nondegrade":temporal_all,
                  "development_survivor":survivor,
                  "owner_direction_gates_recent":owner,
                  "promotion_authorized":False,
              }

          result={
              "schema":"qore.vt31.nas100.selective_breaker_pretarget_protection.aggregate.v1",
              "head":"${{ github.sha }}",
              "admission_variant":"A_EXPANDED_OB_REQUIRE_SHORT_RECLAIM_15M",
              "b_comparator_id":"VT31_BSIDE_H3_W5_DOL2_PS2_RESEARCH_COMPARATOR_001",
              "variants":report,
              "development_survivors":[
                  name for name,item in report.items()
                  if item["development_survivor"]
              ],
              "governance":{
                  "consumed_evidence_only":True,
                  "pure_edge_only":True,
                  "observed_dd_certification_max_r":"6",
                  "mc_p95_15r_is_separate_robustness_gate":True,
                  "sizing_for_certification_forbidden":True,
                  "fresh_holdout_opened":False,
                  "policy_promoted":False,
                  "candidate_frozen":False,
                  "candidate_certified":False,
              },
          }
          Path("result/aggregate.json").write_text(
              json.dumps(result,sort_keys=True,indent=2)+"\n"
          )
          print(json.dumps(result,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-selective-breaker-aggregate-${{ github.sha }}
          path: result/
          retention-days: 90
