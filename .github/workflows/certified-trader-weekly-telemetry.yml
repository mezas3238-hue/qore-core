name: QORE Certified Trader Weekly Telemetry

on:
  workflow_dispatch:
  push:
    branches:
      - agent/certified-trader-weekly-telemetry-001
    paths:
      - '.github/workflows/certified-trader-weekly-telemetry.yml'
      - 'src/qore/infrastructure/certified_trader_telemetry.py'
      - 'scripts/qore_certified_trader_telemetry.py'
      - 'tests/infrastructure/test_certified_trader_telemetry.py'
      - 'docs/research/CERTIFIED-TRADER-WEEKLY-TELEMETRY-v1.json'

permissions:
  contents: read

jobs:
  telemetry-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check             src/qore/infrastructure/certified_trader_telemetry.py             scripts/qore_certified_trader_telemetry.py             tests/infrastructure/test_certified_trader_telemetry.py
      - name: Mypy
        run: |
          mypy             src/qore/infrastructure/certified_trader_telemetry.py             scripts/qore_certified_trader_telemetry.py
      - name: Focused tests
        run: pytest -q --no-cov tests/infrastructure/test_certified_trader_telemetry.py
      - name: Canonical baseline integrity
        run: |
          python scripts/qore_certified_trader_telemetry.py show > /tmp/certified-telemetry.json
          python - <<'PY'
          import json
          from pathlib import Path

          raw = json.loads(
              Path("docs/research/CERTIFIED-TRADER-WEEKLY-TELEMETRY-v1.json").read_text()
          )
          assert raw["schema"] == "qore.certified-trader.weekly-telemetry-baselines.v1"
          assert raw["timezone"] == "America/New_York"
          assert raw["method"]["descriptive_only"] is True
          assert raw["method"]["not_a_live_risk_limit"] is True

          r34 = raw["traders"]["R34_XAUUSD"]
          assert r34["metrics"]["trades"] == 367
          assert r34["metrics"]["max_entries_per_week"] == 9
          assert r34["metrics"]["worst_closed_day_r"] == "-2.7500"
          assert r34["metrics"]["worst_closed_week"]["closed_r"] == "-4.500000000000000000000000000"
          assert r34["source"]["trade_ledger_sha256"] == "784185b4f3f9db079780715d311c38058124f8643562dd7ad7d09f4f8389db2e"

          r38 = raw["traders"]["R38_EURUSD"]
          assert r38["metrics"]["trades"] == 366
          assert r38["metrics"]["max_entries_per_week"] == 8
          assert r38["metrics"]["worst_closed_day_r"] == "-2.4200"
          assert r38["metrics"]["worst_closed_week"]["closed_r"] == "-2.4200"
          assert r38["source"]["trade_ledger_sha256"] == "61746b6866dce66c2b522be56016c5d5b786821704f71f947b4cf2337aeefc9a"

          rendered = json.loads(Path("/tmp/certified-telemetry.json").read_text())
          assert rendered["R34_XAUUSD"]["metrics"]["trades"] == 367
          assert rendered["R38_EURUSD"]["metrics"]["trades"] == 366
          PY
