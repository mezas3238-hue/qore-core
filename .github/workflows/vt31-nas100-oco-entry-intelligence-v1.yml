name: QORE VT31 NAS100 OCO Entry Intelligence V1

on:
  push:
    branches:
      - agent/vt31-nas100-intelligence-pilot-001
    paths:
      - scripts/vt31_nas100_entry_intelligence_oco_lab_v1.py
      - scripts/vt31_nas100_specialist_r1_candidate.py
      - .github/workflows/vt31-nas100-oco-entry-intelligence-v1.yml
  workflow_dispatch:

concurrency:
  group: vt31-nas100-oco-entry-intelligence-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
          - partition: r8_fresh
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
    env:
      GH_TOKEN: ${{ github.token }}
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Static gate
        run: |
          set -euo pipefail
          ruff check scripts/vt31_nas100_entry_intelligence_oco_lab_v1.py
          python scripts/vt31_nas100_specialist_r1_candidate.py --self-test
      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p evidence result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d evidence
          path="evidence/fresh/NAS100/market-evidence.json"
          test -f "$path"
          actual="$(sha256sum "$path" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"
      - name: Run causal OCO entry lab
        run: |
          set -euo pipefail
          python scripts/vt31_nas100_entry_intelligence_oco_lab_v1.py             evidence/fresh/NAS100/market-evidence.json             --output "result/oco-${PARTITION}.json"             | tee result/summary.json
      - name: Governance
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p = os.environ["PARTITION"]
          payload = json.loads(Path(f"result/oco-{p}.json").read_text())
          g = payload["governance"]
          assert payload["market"] == "NAS100"
          assert g["consumed_evidence_only"] is True
          assert g["one_trade_max_per_source_event"] is True
          assert g["orders_activate_only_after_evidence_forms"] is True
          assert g["same_bar_multi_price_fill_censored"] is True
          assert g["strategy_identity_changed"] is False
          assert g["operating_policy_selection_allowed"] is False
          assert g["opens_new_holdout"] is False
          assert g["live_authorized"] is False
          assert g["production_authorized"] is False
          PY
      - name: Bind result
        run: |
          echo "$GITHUB_SHA" > result/git-sha.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd result && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-oco-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-nas100-oco-*-${{ github.sha }}
          path: input
          merge-multiple: true
      - name: Aggregate
        run: |
          mkdir -p result
          python - <<'PY'
          import json
          from pathlib import Path

          rows = []
          for path in sorted(Path("input").glob("oco-*.json")):
              p = json.loads(path.read_text())
              rows.append({
                  "file": path.name,
                  "first_opened_at": p["evidence"]["first_opened_at"],
                  "last_closed_at": p["evidence"]["last_closed_at"],
                  "baseline_terminal_count": p["baseline_terminal_count"],
                  "oco_terminal_count": p["oco_terminal_count"],
                  "terminal_density_gain": p["terminal_density_gain"],
                  "baseline_metrics": p["baseline_metrics"],
                  "oco_metrics": p["oco_metrics"],
                  "candidate_family_counts": p["candidate_family_counts"],
                  "selected_family_counts": p[
                      "oco_selected_family_counts"
                  ],
                  "target_density": p["target_density_250_300"],
              })
          assert len(rows) == 3, rows
          report = {
              "schema": "qore.vt31.nas100.oco_entry_intelligence.aggregate.v1",
              "target_trades_per_2y": [250, 300],
              "folds": rows,
              "all_folds_at_least_250": all(
                  row["oco_terminal_count"] >= 250 for row in rows
              ),
              "all_folds_inside_250_300": all(
                  250 <= row["oco_terminal_count"] <= 300 for row in rows
              ),
              "policy_promoted": False,
              "opens_new_holdout": False,
              "live_authorized": False,
              "production_authorized": False,
          }
          Path("result/oco-aggregate.json").write_text(
              json.dumps(report, sort_keys=True, indent=2) + "\n"
          )
          print(json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-oco-aggregate-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
