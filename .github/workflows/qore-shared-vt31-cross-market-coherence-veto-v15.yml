name: QORE Shared VT31 Cross-Market Coherence Veto V15

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - scripts/vt31_core_stack_v4_cross_market_coherence_veto_v15.py
      - .github/workflows/qore-shared-vt31-cross-market-coherence-veto-v15.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  cross-market-coherence:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Static validation
        run: |
          ruff check scripts/vt31_core_stack_v4_cross_market_coherence_veto_v15.py
          python -m py_compile scripts/vt31_core_stack_v4_cross_market_coherence_veto_v15.py
      - name: Recover immutable R8/R6 three-index evidence
        run: |
          set -euo pipefail
          mkdir -p input/pure input/cibo input/r8 input/r6 result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10799064861/zip" > pure.zip
          unzip -q pure.zip -d input/pure
          (cd input/pure && sha256sum -c SHA256SUMS)
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10478487667/zip" > cibo.zip
          unzip -q cibo.zip -d input/cibo
          (cd input/cibo && sha256sum -c SHA256SUMS)
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10402199719/zip" > r8.zip
          unzip -q r8.zip -d input/r8
          (cd input/r8 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10389112524/zip" > r6.zip
          unzip -q r6.zip -d input/r6
          (cd input/r6 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)
      - name: Run frozen R8/R6 coherence calibration
        run: |
          python scripts/vt31_core_stack_v4_cross_market_coherence_veto_v15.py \
            --r8-trades input/pure/r8.json \
            --r6-trades input/pure/r6.json \
            --r8-nas input/r8/fresh/NAS100/market-evidence.json \
            --r8-sp input/r8/fresh/SP500/market-evidence.json \
            --r8-us input/r8/fresh/US30/market-evidence.json \
            --r6-nas input/r6/fresh/NAS100/market-evidence.json \
            --r6-sp input/r6/fresh/SP500/market-evidence.json \
            --r6-us input/r6/fresh/US30/market-evidence.json \
            --daily-path input/cibo/DAILY_PATH_LEDGER.jsonl \
            --output result/cross-market-coherence-veto-v15.json \
            | tee result/summary.json
      - name: Governance and freeze validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/cross-market-coherence-veto-v15.json").read_text())
          assert p["challenge_set"] == {"r8":228,"r6":278}
          assert p["r5_opened"] is False
          assert p["new_holdout_opened"] is False
          g=p["governance"]
          assert g["r5_opened"] is False
          assert g["new_holdout_opened"] is False
          assert g["runtime_current_outcome_used"] is False
          assert g["runtime_exact_state_lookup_used"] is False
          assert g["runtime_nearest_neighbor_used"] is False
          assert g["three_index_closed_m1_used"] is True
          assert g["future_m1_used"] is False
          assert g["capital_risk_weighting_used"] is False
          assert g["methodology_modified"] is False
          assert g["shared_order_authority"] is False
          assert g["shared_risk_authority"] is False
          assert g["shared_execution_authority"] is False
          assert g["live_authorized"] is False
          assert g["merge_authorized"] is False
          if p["passes_calibration"]:
              assert p["economic_status"] == "CALIBRATION_PASSED_HOLDOUT_REQUIRED"
              assert p["frozen_policy"] is not None
              assert all(p["r8"]["gates"].values())
              assert all(p["r6"]["gates"].values())
          else:
              assert p["economic_status"] == "FALSIFIED_BEFORE_NEW_HOLDOUT"
          print(json.dumps({
            "economic_status":p["economic_status"],
            "passes_calibration":p["passes_calibration"],
            "frozen_policy":p["frozen_policy"],
            "r8":p["r8"],
            "r6":p["r6"],
          },sort_keys=True))
          PY
      - name: Bind result
        run: |
          echo "$GITHUB_SHA" > result/git-sha.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd result && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-vt31-cross-market-coherence-veto-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
