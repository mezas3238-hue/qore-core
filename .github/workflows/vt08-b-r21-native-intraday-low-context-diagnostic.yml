name: VT08 B R21 Native Intraday Low Context (Not Author POI)

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vt08-5m-cognition-replay-20261010
    paths:
      - src/qore/infrastructure/trader_lab/vt08_b_r21_intraday_low_source_context_v1.py
      - tests/infrastructure/trader_lab/test_vt08_b_r21_intraday_low_source_context_v1.py
      - .github/workflows/vt08-b-r21-native-intraday-low-context-diagnostic.yml

permissions:
  contents: read
  actions: read

jobs:
  r21-causal-context-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: |
          ruff check src/qore/infrastructure/trader_lab/vt08_b_r21_intraday_low_source_context_v1.py tests/infrastructure/trader_lab/test_vt08_b_r21_intraday_low_source_context_v1.py
          pytest -q tests/infrastructure/trader_lab/test_vt08_b_r21_intraday_low_source_context_v1.py

  r21-intraday-native-m3:
    needs: r21-causal-context-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        market: [EURJPY, USDCHF, NZDUSD, CADJPY, USDCAD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: vt08-a-frozen-m30m3-firstfail-${{ matrix.market }}-394116f13449fc310d7fbc5f0b5f60aa1bb247d4
          path: r3/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 38715560333
      - uses: actions/download-artifact@v4
        with:
          name: vt08-a-blind-three-source-${{ matrix.market }}-385e89cb769eef36f85ddca56f3f3dcaf1e0f863
          path: r7/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 38765076497
      - uses: actions/download-artifact@v4
        with:
          name: qore-vt08-m3-fractal-${{ matrix.market }}-bc1379d7661aac202495ec67afdd3098473ba723
          path: native-m3/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 35941643396
      - name: Original cTrader M3 as-of C2 day-low context source diagnostic
        env:
          MARKET: ${{ matrix.market }}
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json,os
          from pathlib import Path
          from qore.infrastructure.trader_lab.vt08_b_r21_intraday_low_source_context_v1 import inspect_intraday_low_context
          m=os.environ["MARKET"]
          sources=list(Path("r3",m).rglob(m+"-frozen-source-firstfail.json"))
          joins=list(Path("r7",m).rglob(m+"-three-source-blind-review.json"))
          natives=list(Path("native-m3",m).rglob("m3-evidence.json"))
          if len(sources)!=1 or len(joins)!=1 or len(natives)!=1:
              raise SystemExit("R21 original 3-way source bundle missing")
          r3=json.loads(sources[0].read_text())
          r7=json.loads(joins[0].read_text())
          result=inspect_intraday_low_context(r3,r7,market=m,native_m3_file=natives[0])
          expected={"EURJPY":538,"USDCHF":518,"NZDUSD":550,"CADJPY":516,"USDCAD":535}
          if result["all_case_count"]!=expected[m] or (
              sum(result["day_low_category_counts"].values())!=expected[m]
          ):
              raise SystemExit("R21 frozen denominator or day-context class drift")
          if (result["source_complete_entries"] or result["cognitive_admissions"]
              or result["broker_fills"] or result["economic_gates_evaluated"]
              or result["all_source_author_poi_signatures_present"]):
              raise SystemExit("R21 illegally promoted physical intraday diagnostic")
          output=Path("evidence",m+"-r21-day-low-source-context.json")
          output.write_text(json.dumps(result,sort_keys=True,separators=(",",":"),allow_nan=False))
          print(json.dumps({k:v for k,v in result.items() if k not in (
              "full_day_context_index","blind_review_day_context"
          )},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vt08-b-r21-intraday-context-${{ matrix.market }}-${{ github.sha }}
          path: evidence/*.json
          retention-days: 30
          if-no-files-found: error
