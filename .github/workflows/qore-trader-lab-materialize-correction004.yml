name: QORE Trader Lab Correction 004 materialization

on:
  push:
    branches:
      - agent/qore-trader-lab-001-recovery-materialize
    paths:
      - .qore-recovery/trader-lab-correction-004.patch.gz.b64

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/qore-trader-lab-001-recovery-materialize
          fetch-depth: 0

      - name: Restore and verify exact Harness patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 5d25445faf57fa83410b57faf5eaf1f437949129^{tree})" = "f9df989d7e7120d8742d4001b045fdd11cb0cb03"
          base64 -d .qore-recovery/trader-lab-correction-004.patch.gz.b64 | gzip -d > /tmp/trader-lab-correction-004.patch
          echo "cd6f86489ccc85c2aadad5bb1bf0724878212505b740c2e403e5d01a64d7c3c5  /tmp/trader-lab-correction-004.patch" | sha256sum -c -
          git apply --check /tmp/trader-lab-correction-004.patch
          git apply /tmp/trader-lab-correction-004.patch
          git diff --check

      - name: Seal exact candidate tree and push
        shell: bash
        run: |
          set -euo pipefail
          rm -f .qore-recovery/trader-lab-correction-004.patch.gz.b64
          rm -f .github/workflows/qore-trader-lab-materialize-correction004.yml
          rmdir .qore-recovery 2>/dev/null || true
          git add -A
          mapfile -t files < <(git diff --cached --name-only 5d25445faf57fa83410b57faf5eaf1f437949129)
          test "${#files[@]}" -eq 14
          printf '%s\n' "${files[@]}" | sort > /tmp/actual-files
          cat > /tmp/expected-files <<'EOF'
          docs/architecture/QORE-TRADER-LAB-001.md
          src/qore/infrastructure/trader_lab/__init__.py
          src/qore/infrastructure/trader_lab/candidate.py
          src/qore/infrastructure/trader_lab/fast_forward.py
          src/qore/infrastructure/trader_lab/governed_gate.py
          src/qore/infrastructure/trader_lab/lifecycle.py
          src/qore/infrastructure/trader_lab/promotion.py
          src/qore/infrastructure/trader_lab/robustness.py
          src/qore/infrastructure/trader_lab/stage_evidence.py
          tests/infrastructure/trader_lab/conftest.py
          tests/infrastructure/trader_lab/test_candidate_and_stage_evidence.py
          tests/infrastructure/trader_lab/test_governed_evidence_authenticity.py
          tests/infrastructure/trader_lab/test_lifecycle_and_promotion.py
          tests/infrastructure/trader_lab/test_robustness.py
          EOF
          sed -i 's/^          //' /tmp/expected-files
          sort -o /tmp/expected-files /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          git config user.name "qore-integration-authority"
          git config user.email "qore-integration-authority@users.noreply.github.com"
          git commit -m "Apply Trader Lab Correction 004 authority-root authenticity"
          git push origin HEAD:agent/qore-trader-lab-001-recovery-materialize
