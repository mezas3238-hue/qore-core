name: VT08 Index R128 Close Breakout Context Transport

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r128-close-breakout-context-transport.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r128_close_breakout_no_attempt_context_transport.py
      - tests/infrastructure/trader_lab/test_vt08_index_r128_close_breakout_no_attempt_context_transport.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r128_close_breakout_no_attempt_context_transport.py

  attribution:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R128 close-breakout context transport atlas
        run: |
          mkdir -p artifacts/report
          python -m qore.infrastructure.trader_lab.vt08_index_r128_close_breakout_no_attempt_context_transport \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r128-close-breakout-context-transport.json

      - name: Verify R128 frozen forensic contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/"
                  "vt08-index-r128-close-breakout-context-transport.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R128_CLOSE_BREAKOUT_NO_FAILED_ATTEMPT_"
              "CONTEXT_TRANSPORT_ATLAS_001"
          )
          assert report["source_r127"]["run_id"] == 36075356615
          assert report["source_r127"]["artifact_id"] == 10839628548
          assert report["source_r127"]["artifact_digest"] == (
              "sha256:e604bf6828ab9b38d1d88f239ff36ffd"
              "67d46cb37755f0154c0038fb4474877b"
          )

          expected = {
              "five_year": (2448, 1756, 578),
              "recent_two_year": (1017, 746, 230),
              "r66_failed_holdout": (773, 546, 161),
          }
          for key, (canonical, standard, cohort) in expected.items():
              section = report[key]
              assert section["canonical_sample"] == canonical
              assert section["standard_sample"] == standard
              assert section["cohort_sample"] == cohort
              assert section["cohort_state"] == (
                  "CLOSE_BREAKOUT|NO_FAILED_ATTEMPT"
              )

          contract = report["cohort_contract"]
          assert contract["classification_cutoff"] == "ENTRY"
          assert contract["calendar_or_year_runtime_feature"] is False
          assert contract["minimum_reporting_sample"] == 20

          gov = report["governance"]
          assert gov["research_only"] is True
          assert gov["forensics_only"] is True
          assert gov["all_predictors_known_at_or_before_entry"] is True
          assert gov["calendar_or_year_used_as_runtime_feature"] is False
          assert gov["optimization_grid_used"] is False
          assert gov["signals_suppressed"] is False
          assert gov["trade_count_changed"] is False
          assert gov["risk_changed"] is False
          assert gov["candidate_created"] is False
          assert gov["live_authorized"] is False
          assert gov["real_capital_authorized"] is False
          assert gov["production_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r128-close-breakout-context-transport-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
