name: QORE Shared A STI8 Economic Response V3 Recovery

concurrency:
  group: qore-shared-a-sti8-economic-response-v3-recovery
  cancel-in-progress: false

on:
  push:
    branches:
      - agent/shared-a-cognitive-science-001
    paths:
      - docs/shared/evidence/QORE_SHARED_STI8_ECONOMIC_RESPONSE_V3_ENGINEERING_RECOVERY_AMENDMENT_002.json
      - scripts/shared_sti8_economic_response_v3_recovery_probe.py
      - scripts/shared_sti8_v3_fresh_trade_filter.py
      - .github/workflows/qore-shared-a-sti8-economic-response-v3-recovery.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  QORE_SOFTWARE_SHA: ${{ github.sha }}
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
  QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}

jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ctrader]"

      - name: Validate recovery without changing science
        run: |
          set -euo pipefail
          mkdir -p input/policy fresh/{NAS100,SP500,US30} result raw-evidence
          ruff check             scripts/shared_sti8_economic_response_v3_recovery_probe.py             scripts/shared_sti8_v3_fresh_trade_filter.py             scripts/shared_sti8_economic_response_v3_oos_eval.py             src/qore/infrastructure/traders/vt31_shared_threat_consumer_v3_research.py
          python -m py_compile             scripts/shared_sti8_economic_response_v3_recovery_probe.py             scripts/shared_sti8_v3_fresh_trade_filter.py             scripts/shared_sti8_economic_response_v3_oos_eval.py
          pytest -q tests/infrastructure/test_vt31_shared_threat_consumer_v3_research.py
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("docs/shared/evidence/QORE_SHARED_STI8_ECONOMIC_RESPONSE_V3_ENGINEERING_RECOVERY_AMENDMENT_002.json").read_text())
          assert a["status"] == "ENGINEERING_RECOVERY_ONLY"
          assert a["failed_run"]["run_id"] == 36740059589
          assert a["failed_run"]["economic_evaluation_started"] is False
          assert a["scientific_invariants_unchanged"]["v3_policy"] is True
          assert a["scientific_invariants_unchanged"]["economic_gates"] is True
          assert a["engineering_recovery"]["minimum_source_span_days"] == 730
          assert a["engineering_recovery"]["only_fresh_window_rows_may_reach_sti8_evaluator"] is True
          assert a["anti_leakage"]["outcome_aware_retuning_authorized"] is False
          PY
          count="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/36740059589/artifacts" --jq '.artifacts | length')"
          name="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/36740059589/artifacts" --jq '.artifacts[0].name')"
          test "$count" = "1"
          test "$name" = "qore-shared-a-sti8-economic-response-v3-oos-open-marker"

      - name: Recover exact frozen STI-8 signal policy
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11065709899/zip" > policy.zip
          unzip -q policy.zip -d input/policy
          (cd input/policy && sha256sum -c SHA256SUMS)
          test "$(cat input/policy/code-git-sha.txt)" = "711788d89521e051ab3969a9006830068381693e"

      - name: Verify DEMO credentials
        run: |
          set -euo pipefail
          for name in QORE_CTRADER_CLIENT_ID QORE_CTRADER_CLIENT_SECRET QORE_CTRADER_ACCESS_TOKEN QORE_CTRADER_REFRESH_TOKEN
          do
            test -n "${!name:-}"
          done
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            test -n "$account_id"
            echo "::add-mask::$account_id"
            echo "QORE_CTRADER_DEMO_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          fi

      - name: Reacquire reconstruction envelope after pre-evaluation failure
        run: |
          set -euo pipefail
          for market in NAS100 SP500 US30
          do
            QORE_DEMO_LAB_SYMBOL="$market"               python scripts/shared_sti8_economic_response_v3_recovery_probe.py               > "fresh/$market/market-evidence.json"
          done
          sha256sum fresh/*/market-evidence.json > fresh/EVIDENCE-SHA256SUMS

      - name: Reconstruct frozen Trader and mechanically isolate fresh rows
        run: |
          set -euo pipefail
          python scripts/vt31_nas100_silver_bullet_native_streak_falsification_v1.py             fresh/NAS100/market-evidence.json             --partition sti8_economic_response_v3_recovery_envelope             --output /tmp/sti8-v3-full-trades.json             > /tmp/sti8-v3-reconstruction-summary.json
          python scripts/shared_sti8_v3_fresh_trade_filter.py             --input /tmp/sti8-v3-full-trades.json             --output result/sti8-v3-oos-trades.json             | tee result/fresh-trade-filter-summary.json
          rm -f /tmp/sti8-v3-full-trades.json /tmp/sti8-v3-reconstruction-summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/sti8-v3-oos-trades.json").read_text())
          assert p["pre_oos_rows_present"] is False
          assert p["filter_is_mechanical"] is True
          assert p["policy_selection_used"] is False
          PY

      - name: Persist source evidence and filtered fresh population before evaluation
        run: |
          set -euo pipefail
          cp -R fresh raw-evidence/
          cp result/sti8-v3-oos-trades.json raw-evidence/
          cp docs/shared/evidence/QORE_SHARED_STI8_ECONOMIC_RESPONSE_V3_PREREGISTRATION_001.json raw-evidence/preregistration.json
          cp docs/shared/evidence/QORE_SHARED_STI8_ECONOMIC_RESPONSE_V3_ENGINEERING_RECOVERY_AMENDMENT_002.json raw-evidence/recovery-amendment.json
          printf '%s\n' "${GITHUB_SHA}" > raw-evidence/code-git-sha.txt
          (
            cd raw-evidence
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-a-sti8-economic-response-v3-recovery-raw-${{ github.sha }}
          path: raw-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Execute unchanged V3 economic evaluator on fresh rows only
        run: |
          set -euo pipefail
          python scripts/shared_sti8_economic_response_v3_oos_eval.py             --policy input/policy/sti6-sti8-source-only-policies.json             --trades result/sti8-v3-oos-trades.json             --nas fresh/NAS100/market-evidence.json             --sp fresh/SP500/market-evidence.json             --us fresh/US30/market-evidence.json             --output result/sti8-response-v3-oos.json             | tee result/economic-summary.json

      - name: Validate disposition without forcing PASS
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/sti8-response-v3-oos.json").read_text())
          assert p["status"] in {
              "STI8_RESPONSE_V3_RESEARCH_OOS_ECONOMIC_PASS",
              "STI8_RESPONSE_V3_RESEARCH_OOS_FALSIFIED",
          }
          g=p["governance"]
          assert g["parent_v2_burned_evidence_used_for_v3_value_claim"] is False
          assert g["all_source_decisions_materialized_before_outcome_scoring"] is True
          assert g["future_market_used_for_decision"] is False
          assert g["future_outcome_used_for_decision"] is False
          assert g["numeric_rescue_threshold_added"] is False
          assert g["response_policy_retuned_after_oos"] is False
          assert g["protected_certification_holdout_opened"] is False
          assert g["temporal_replication_claim"] is False
          PY

      - name: Seal recovery result
        run: |
          cp docs/shared/evidence/QORE_SHARED_STI8_ECONOMIC_RESPONSE_V3_PREREGISTRATION_001.json result/preregistration.json
          cp docs/shared/evidence/QORE_SHARED_STI8_ECONOMIC_RESPONSE_V3_ENGINEERING_RECOVERY_AMENDMENT_002.json result/recovery-amendment.json
          cp fresh/EVIDENCE-SHA256SUMS result/EVIDENCE-SHA256SUMS
          printf '%s\n' "${GITHUB_SHA}" > result/code-git-sha.txt
          (
            cd result
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-a-sti8-economic-response-v3-recovery-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Report V3 recovery
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p=json.loads(Path("result/sti8-response-v3-oos.json").read_text())
          e=p["economic_effects"]; w=p["winner_preservation"]
          body="\n".join([
              "## Shared A STI-8 — Economic Response V3 Engineering Recovery",
              "",
              f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- run: `{os.environ['GITHUB_RUN_ID']}`",
              "- parent failed run economic evaluation started: **False**",
              "- source reconstruction envelope: **740 calendar days / >=730 actual-bar days**",
              "- V3 evaluation window: **2026-07-22 → 2026-09-29**",
              f"- disposition: **{p['status']}**",
              f"- fresh trades / observations: **{p['trade_count']} / {p['source_observation_count']}**",
              f"- changed trades: **{p['changed_trade_count']}**",
              f"- control TotalR/PF/DD: **{p['control']['total_r']} / {p['control']['profit_factor']} / {p['control']['max_dd_r']}R**",
              f"- treatment TotalR/PF/DD: **{p['treatment']['total_r']} / {p['treatment']['profit_factor']} / {p['treatment']['max_dd_r']}R**",
              f"- loss avoided / false cost / net utility: **{e['loss_r_avoided']} / {e['false_threat_cost_r']} / {e['net_economic_utility_r']}R**",
              f"- winner count/R retention: **{w['winner_count_retention']} / {w['winner_r_retention']}**",
              f"- gates: **{p['gates']}**",
              "- policy/gates/hypothesis changed by recovery: **False**",
              "- protected certification holdout opened: **False**",
              "- productive authority: **False**",
          ])+"\n"
          Path("result/issue-comment.md").write_text(body)
          PY
          gh issue comment 638 --body-file result/issue-comment.md
