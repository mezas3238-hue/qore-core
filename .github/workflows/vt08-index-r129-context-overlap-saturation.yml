name: VT08 Index R129 Context Overlap Saturation

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r129-context-overlap-saturation.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r129_r128_context_overlap_saturation.py
      - tests/infrastructure/trader_lab/test_vt08_index_r129_r128_context_overlap_saturation.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r129_r128_context_overlap_saturation.py

  attribution:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R129 overlap / saturation attribution
        run: |
          mkdir -p artifacts/report
          python -m qore.infrastructure.trader_lab.vt08_index_r129_r128_context_overlap_saturation \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r129-context-overlap-saturation.json

      - name: Verify R129 frozen forensic contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/"
                  "vt08-index-r129-context-overlap-saturation.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R129_R128_CONTEXT_OVERLAP_RISK_SATURATION_001"
          )
          assert report["source_r128"]["run_id"] == 36075966463
          assert report["source_r128"]["artifact_id"] == 10839358300
          assert report["source_r128"]["artifact_digest"] == (
              "sha256:d69448f6dc7fe3b4d49c9be54b18c315"
              "8238d38e0e0f1e953ef5a43705f103a9"
          )
          assert report["risk_contract"]["floor_r"] == "0.005"

          expected = {
              "five_year": (2448, 1756, 578),
              "recent_two_year": (1017, 746, 230),
              "r66_failed_holdout": (773, 546, 161),
          }
          for key, (canonical, standard, cohort) in expected.items():
              section = report[key]
              assert section["canonical_sample"] == canonical
              assert section["standard_sample"] == standard
              assert section["cohort_sample"] == cohort
              assert (
                  section["any_strict_context_count"]
                  + section["no_strict_context_count"]
                  == cohort
              )

          gov = report["governance"]
          assert gov["research_only"] is True
          assert gov["forensics_only"] is True
          assert gov["calendar_or_year_runtime_feature"] is False
          assert gov["signals_suppressed"] is False
          assert gov["trade_count_changed"] is False
          assert gov["risk_changed"] is False
          assert gov["market_removed"] is False
          assert gov["candidate_created"] is False
          assert gov["live_authorized"] is False
          assert gov["production_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r129-context-overlap-saturation-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
