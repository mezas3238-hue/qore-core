name: VT08 A C2 Conditional EQ Author Source Review

on:
  push:
    branches:
      - agent/vt08-5m-methodology-source-20261010
    paths:
      - .github/workflows/vt08-a-c2-conditional-eq-author-source-review-v1.yml
      - src/qore/infrastructure/trader_lab/vt08_a_source_conditional_eq_review_v1.py
      - tests/infrastructure/trader_lab/test_vt08_a_source_conditional_eq_review_v1.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  eq-physical-witness-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        market: [EURJPY, USDCHF, NZDUSD, CADJPY, USDCAD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: No-lookahead conditional EQ adversarial contracts
        run: |
          ruff check src/qore/infrastructure/trader_lab/vt08_a_source_conditional_eq_review_v1.py tests/infrastructure/trader_lab/test_vt08_a_source_conditional_eq_review_v1.py
          pytest -q tests/infrastructure/trader_lab/test_vt08_a_source_conditional_eq_review_v1.py
      - uses: actions/download-artifact@v4
        with:
          name: vt08-a-b-market-catalog-${{ matrix.market }}-f61b5e7a931e2c057a0660f4702f11d55ebc58af
          path: input/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 38740699499
      - name: Recompute C2 EQ witnesses without author swing claims
        env:
          MARKET: ${{ matrix.market }}
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json, os
          from pathlib import Path
          from qore.infrastructure.trader_lab.vt08_a_source_conditional_eq_review_v1 import (
              conditional_eq_witnesses, canonical_report_sha256,
          )
          market=os.environ["MARKET"]
          files=list(Path("input",market).rglob(market+"-A-to-B-canonical-source-catalog.json"))
          if len(files)!=1:
              raise SystemExit("exactly one frozen A/B physical catalog expected")
          catalog=json.loads(files[0].read_text(encoding="utf-8"))
          result=conditional_eq_witnesses(catalog)
          expected={
              "EURJPY":538,"USDCHF":518,"NZDUSD":550,"CADJPY":516,"USDCAD":535,
          }[market]
          if result["source_case_count"] != expected:
              raise SystemExit("C2 source candidates count changed")
          if result["source_complete_entries"] or result["verified_fills"]:
              raise SystemExit("UNAUTHORIZED_GATE_PROMOTION")
          out=Path("evidence",market+"-conditional-eq-review.json")
          out.write_text(
              json.dumps(result,sort_keys=True,separators=(",",":"),allow_nan=False),
              encoding="utf-8",
          )
          print(json.dumps({
              "market":market,
              "conditional_eq_source_witnesses":result["source_case_count"],
              "prior_h1_incomplete":result["prior_h1_incomplete_cases"],
              "review_sha256":canonical_report_sha256(result),
              "source_complete_entries":result["source_complete_entries"],
              "profit_factor":result["profit_factor"],
              "holdout_7y_accessed":result["holdout_7y_accessed"],
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vt08-a-author-conditional-eq-${{ matrix.market }}-${{ github.sha }}
          path: evidence/*.json
          retention-days: 30
          if-no-files-found: error
