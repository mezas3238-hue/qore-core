name: "CIBO P0 canonical PAPER SQLite held risk 5pct gate"
on:
  workflow_dispatch:
  pull_request:
    branches: [agent/cibo-sovereign-integration-p0-20261008]
    paths:
      - ".github/workflows/cibo-p0-canonical-paper-5pct-ledger-gate.yml"
      - "src/qore/infrastructure/qore_dynamic_lot_engine.py"
      - "src/qore/infrastructure/qdle_paper_book.py"
      - "scripts/cibo_trader_lab_native_qdle_market_atlas_3368.py"
      - "tests/infrastructure/test_qdle_paper_book.py"
  push:
    branches: [agent/cibo-p0-fresh-paper-economic-votes-20261009]
    paths:
      - ".github/workflows/cibo-p0-canonical-paper-5pct-ledger-gate.yml"
      - "src/qore/infrastructure/qore_dynamic_lot_engine.py"
      - "src/qore/infrastructure/qdle_paper_book.py"
      - "scripts/cibo_trader_lab_native_qdle_market_atlas_3368.py"
      - "tests/infrastructure/test_qdle_paper_book.py"
permissions:
  contents: read
env:
  PYTHONPATH: src
  QORE_LIVE_TRADING: "false"
jobs:
  unique-paper-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate PAPER isolation, 5pct aggregate budget and deterministic SQLite ledger
        run: |
          set -euo pipefail
          test "$QORE_LIVE_TRADING" = false
          python -m py_compile src/qore/infrastructure/qore_dynamic_lot_engine.py src/qore/infrastructure/qdle_paper_book.py scripts/cibo_trader_lab_native_qdle_market_atlas_3368.py
          python -m unittest discover -s tests/infrastructure -p 'test_qdle_paper_book.py' -v
      - name: Prove broker/live QDLE regressions unchanged
        run: |
          python -m unittest discover -s tests/infrastructure -p 'test_qore_dynamic_lot_engine.py' -q
