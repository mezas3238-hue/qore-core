name: QORE Capitalizer USDJPY Asia Microstructure Pilot V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-usdjpy-asia-microstructure-pilot-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_atlas_m5_reader.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_session_clock.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_microstructure_discovery.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_research_lineage.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_microstructure_discovery.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-usdjpy-asia-microstructure-pilot-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: '35166210458'
  SOURCE_GIT_SHA: 'ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-USDJPY-ab782b8e9f890f86a2b6500070f0556b4b685e3d'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check --ignore E501 \
            src/qore/infrastructure/trader_lab/capitalizer_atlas_m5_reader.py \
            src/qore/infrastructure/trader_lab/capitalizer_session_clock.py \
            src/qore/infrastructure/trader_lab/capitalizer_microstructure_discovery.py \
            tests/infrastructure/trader_lab/test_capitalizer_microstructure_discovery.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_atlas_m5_reader.py \
            src/qore/infrastructure/trader_lab/capitalizer_session_clock.py \
            src/qore/infrastructure/trader_lab/capitalizer_microstructure_discovery.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_microstructure_discovery.py

  discovery:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download immutable consumed USDJPY M5 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: usdjpy-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Scan USDJPY Asia microstructure
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_microstructure_discovery \
            usdjpy-source \
            capitalizer-usdjpy-asia-microstructure
      - name: Enforce research-only pilot invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              'capitalizer-usdjpy-asia-microstructure/'
              'capitalizer-usdjpy-microstructure-v1.json'
          )
          result = json.loads(path.read_text())
          assert result['identity'] == 'QORE_CAPITALIZER_M5_MICROSTRUCTURE_DISCOVERY_V1'
          assert result['symbol'] == 'USDJPY'
          assert result['session'] == 'ASIA'
          assert result['observations'] > 100_000
          assert result['research_only'] is True
          assert result['rule_promotion_allowed'] is False
          assert result['event_counts']['HIGH_BREAK_ATTEMPT'] > 0
          assert result['event_counts']['LOW_BREAK_ATTEMPT'] > 0
          assert result['event_counts']['HIGH_RAID_REJECTION'] > 0
          assert result['event_counts']['LOW_RAID_REJECTION'] > 0
          PY
      - name: Upload immutable USDJPY Asia pilot evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-usdjpy-asia-microstructure-v1-${{ github.sha }}
          path: capitalizer-usdjpy-asia-microstructure
          if-no-files-found: error
          retention-days: 90
