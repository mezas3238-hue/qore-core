name: VT08 Index R105 Standard Context Transport Atlas

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r105-standard-context-transport-atlas.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r105_standard_context_transport_atlas.py
      - tests/infrastructure/trader_lab/test_vt08_index_r105_standard_context_transport_atlas.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r105_standard_context_transport_atlas.py

  forensics:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R105 context transport atlas
        run: |
          mkdir -p artifacts/report
          python -m qore.infrastructure.trader_lab.vt08_index_r105_standard_context_transport_atlas \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r105-standard-context-transport-atlas.json

      - name: Verify R105 governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r105-standard-context-transport-atlas.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R105_STANDARD_CAUSAL_CONTEXT_TRANSPORT_ATLAS_001"
          )
          assert report["source_r104"]["run_id"] == 35556281814
          assert report["source_r104"]["artifact_id"] == 10621165375
          assert report["source_r104"]["artifact_digest"] == (
              "sha256:1a05f768c25fdc872ccc46495c86b250258ed4c935f98f3fd2d893c9ea14e773"
          )
          assert report["policy_under_attribution"] == (
              "EXPLICIT_FULL_R58_STANDARD_BASE"
          )
          assert report["five_year"]["canonical_sample"] == 2448
          assert report["recent_two_year"]["canonical_sample"] == 1017
          assert report["r66_failed_holdout"]["canonical_sample"] == 773
          assert report["five_year"]["standard_sample"] == 1756
          assert report["recent_two_year"]["standard_sample"] == 746
          assert report["r66_failed_holdout"]["standard_sample"] == 546
          assert report["decision"] == (
              "R105_STANDARD_CONTEXT_TRANSPORT_ATLAS_COMPLETE_NO_RULE_CHANGE"
          )
          gov = report["governance"]
          assert gov["forensics_only"] is True
          assert gov["consumed_evidence_only"] is True
          assert gov["fresh_holdout_claim"] is False
          assert gov["all_predictors_known_at_or_before_entry"] is True
          assert gov["calendar_or_year_used_as_runtime_feature"] is False
          assert gov["cohort_to_rule_automatic"] is False
          assert gov["optimization_grid_used"] is False
          assert gov["signal_suppression_performed"] is False
          assert gov["risk_retuning_performed"] is False
          assert gov["candidate_created"] is False
          assert gov["trader_certified"] is False
          assert gov["live_authorized"] is False
          assert gov["real_capital_authorized"] is False
          assert gov["production_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r105-standard-context-transport-atlas-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
