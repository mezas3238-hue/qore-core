name: QORE VT-08 R3.10 Fresh Holdout 2022-2024

on:
  push:
    branches:
      - agent/vt08-r3-10-c2c3-fresh-holdout-001
    paths:
      - .github/workflows/vt08-r3-10-fresh-holdout-2022-2024.yml
      - docs/research/trader-lab/VT08-R3-10-FRESH-HOLDOUT-2022-2024.md
      - src/qore/infrastructure/ctrader_demo_lab_historical_holdout_probe.py
      - src/qore/infrastructure/trader_lab/vt08_b01_fresh_holdout_r3_10.py
      - tests/infrastructure/trader_lab/test_vt08_b01_fresh_holdout_r3_10.py
  pull_request:
    branches:
      - agent/vt08-r3-9-source-contract-freeze-001
    paths:
      - .github/workflows/vt08-r3-10-fresh-holdout-2022-2024.yml
      - docs/research/trader-lab/VT08-R3-10-FRESH-HOLDOUT-2022-2024.md
      - src/qore/infrastructure/ctrader_demo_lab_historical_holdout_probe.py
      - src/qore/infrastructure/trader_lab/vt08_b01_fresh_holdout_r3_10.py
      - tests/infrastructure/trader_lab/test_vt08_b01_fresh_holdout_r3_10.py
  workflow_dispatch:

concurrency:
  group: qore-vt08-r3-10-fresh-holdout-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
  QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}
  QORE_SOFTWARE_SHA: ${{ github.sha }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact holdout head
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff full gate
        run: ruff check .
      - name: Mypy full gate
        run: mypy src tests
      - name: Focused fresh-holdout gate
        run: |
          pytest -q \
            tests/infrastructure/trader_lab/test_vt08_b01_fresh_holdout_r3_10.py \
            tests/infrastructure/traders/test_vt08_b01_source_contract_r3_9.py \
            tests/infrastructure/trader_lab/test_vt08_b01_causal_h01_h04_r3_9.py
      - name: Existing R3.8 executable regression
        run: |
          pytest -q \
            tests/infrastructure/traders/test_vt08_b01_r3_8.py \
            tests/infrastructure/trader_lab/test_vt08_b01_trader_lab_r3_8.py
      - name: Trader Lab regression gate
        run: pytest -q tests/infrastructure/trader_lab
      - name: Full quality gate
        run: pytest --cov=src/qore --cov-report=term-missing

  preregistration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact holdout head
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QORE
        run: pip install -e .
      - name: Emit frozen holdout preregistration
        shell: bash
        run: |
          mkdir -p artifacts/vt08-r3-10-preregistration
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from qore.infrastructure.ctrader_demo_lab_historical_holdout_probe import (
              ACQUISITION_OPENED_AT,
              CONSUMED_BASELINE_BOUNDARY,
              EVALUATION_CLOSED_AT,
              EVALUATION_OPENED_AT,
              HOLDOUT_ID,
              _validate_preregistration,
          )
          from qore.infrastructure.traders.vt08_b01_source_contract_r3_9 import (
              source_contract_fingerprint,
          )

          _validate_preregistration()
          payload = {
              "schema": "qore.trader_lab.vt08_fresh_holdout_preregistration.r3.10.v1",
              "holdout_id": HOLDOUT_ID,
              "software_sha": os.environ["QORE_SOFTWARE_SHA"],
              "source_contract_fingerprint": source_contract_fingerprint(),
              "acquisition_opened_at": ACQUISITION_OPENED_AT.isoformat(),
              "evaluation_opened_at": EVALUATION_OPENED_AT.isoformat(),
              "evaluation_closed_at": EVALUATION_CLOSED_AT.isoformat(),
              "consumed_baseline_boundary": CONSUMED_BASELINE_BOUNDARY.isoformat(),
              "evaluation_span_days": 730,
              "symbols": [
                  "AUDJPY", "AUDUSD", "EURUSD", "GBPJPY",
                  "GBPUSD", "USDCAD", "USDJPY",
              ],
              "entry_anchors_ny": [1, 5, 9],
              "executable_scope": "narrow-completed-c2-b01",
              "c3_included": False,
              "outcomes_accessed_before_preregistration": False,
              "methodology_mutation_after_outcomes": "prohibited",
              "no_consumed_baseline_overlap": True,
          }
          Path(
              "artifacts/vt08-r3-10-preregistration/preregistration.json"
          ).write_text(
              json.dumps(payload, sort_keys=True, separators=(",", ":")),
              encoding="utf-8",
          )
          Path("artifacts/vt08-r3-10-preregistration/git-sha.txt").write_text(
              os.environ["QORE_SOFTWARE_SHA"] + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload preregistration before evidence access
        uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-r3-10-preregistration-${{ github.sha }}
          path: artifacts/vt08-r3-10-preregistration
          if-no-files-found: error
          retention-days: 90

  fresh-replay:
    needs:
      - quality
      - preregistration
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        symbol:
          - AUDJPY
          - AUDUSD
          - EURUSD
          - GBPJPY
          - GBPUSD
          - USDCAD
          - USDJPY
    env:
      QORE_DEMO_LAB_SYMBOL: ${{ matrix.symbol }}
    steps:
      - name: Checkout exact preregistered head
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QORE and cTrader runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ctrader]"
      - name: Verify DEMO inputs without printing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            QORE_CTRADER_CLIENT_ID \
            QORE_CTRADER_CLIENT_SECRET \
            QORE_CTRADER_ACCESS_TOKEN \
            QORE_CTRADER_REFRESH_TOKEN \
            QORE_DEMO_LAB_SYMBOL
          do
            if [ -z "${!name:-}" ]; then
              echo "missing required DEMO runtime input: ${name}" >&2
              exit 2
            fi
          done
      - name: Discover DEMO account when not configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            if ! [[ "$account_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "cTrader DEMO account discovery returned an invalid id" >&2
              exit 3
            fi
            echo "::add-mask::$account_id"
            printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          fi
      - name: Collect preregistered historical DEMO evidence
        run: |
          mkdir -p "artifacts/vt08-r3-10/${QORE_DEMO_LAB_SYMBOL}"
          python -m qore.infrastructure.ctrader_demo_lab_historical_holdout_probe \
            > "artifacts/vt08-r3-10/${QORE_DEMO_LAB_SYMBOL}/market-evidence.json"
      - name: Run frozen narrow-B01 executable replay
        run: |
          python -m qore.infrastructure.trader_lab.vt08_b01_backtest_r3_8 \
            "artifacts/vt08-r3-10/${QORE_DEMO_LAB_SYMBOL}/market-evidence.json" \
            > "artifacts/vt08-r3-10/${QORE_DEMO_LAB_SYMBOL}/b01-backtest.json"
      - name: Project raw replay onto frozen 730-day holdout core
        run: |
          python -m qore.infrastructure.trader_lab.vt08_b01_fresh_holdout_r3_10 \
            market \
            "artifacts/vt08-r3-10/${QORE_DEMO_LAB_SYMBOL}/b01-backtest.json" \
            > "artifacts/vt08-r3-10/${QORE_DEMO_LAB_SYMBOL}/holdout-market.json"
          printf '%s\n' "$GITHUB_SHA" \
            > "artifacts/vt08-r3-10/${QORE_DEMO_LAB_SYMBOL}/git-sha.txt"
      - name: Enforce frozen holdout boundaries
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["QORE_DEMO_LAB_SYMBOL"]
          root = Path(f"artifacts/vt08-r3-10/{symbol}")
          evidence = json.loads((root / "market-evidence.json").read_text())
          report = json.loads((root / "holdout-market.json").read_text())
          assert evidence["fresh_holdout"] is True
          assert evidence["evaluation_span_days"] == 730
          assert evidence["no_consumed_baseline_overlap"] is True
          assert report["symbol"] == symbol
          assert report["independent_holdout"] is True
          assert report["no_consumed_baseline_overlap"] is True
          assert report["c3_included"] is False
          assert report["methodology_mutation_from_holdout"] is False
          PY
      - name: Upload sanitized fresh-holdout evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-r3-10-${{ matrix.symbol }}-${{ github.sha }}
          path: artifacts/vt08-r3-10/${{ matrix.symbol }}
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: fresh-replay
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact preregistered head
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QORE research runtime
        run: pip install -e .
      - name: Download all seven fresh-holdout market artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: qore-vt08-r3-10-*-${{ github.sha }}
          path: artifacts/input
      - name: Build seven-market fresh-holdout aggregate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t reports < <(
            find artifacts/input -type f -name b01-backtest.json | sort
          )
          if [ "${#reports[@]}" -ne 7 ]; then
            echo "expected exactly seven fresh backtests" >&2
            exit 4
          fi
          mkdir -p artifacts/vt08-r3-10-aggregate
          python -m qore.infrastructure.trader_lab.vt08_b01_fresh_holdout_r3_10 \
            aggregate "${reports[@]}" \
            > artifacts/vt08-r3-10-aggregate/aggregate.json
          printf '%s\n' "$GITHUB_SHA" \
            > artifacts/vt08-r3-10-aggregate/git-sha.txt
      - name: Enforce aggregate governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("artifacts/vt08-r3-10-aggregate/aggregate.json").read_text()
          )
          assert payload["market_count"] == 7
          assert payload["independent_holdout"] is True
          assert payload["no_consumed_baseline_overlap"] is True
          assert payload["c3_included"] is False
          assert payload["methodology_mutation_from_holdout"] is False
          assert payload["symbols"] == [
              "AUDJPY", "AUDUSD", "EURUSD", "GBPJPY",
              "GBPUSD", "USDCAD", "USDJPY",
          ]
          PY
      - name: Upload seven-market fresh-holdout aggregate
        uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-r3-10-aggregate-${{ github.sha }}
          path: artifacts/vt08-r3-10-aggregate
          if-no-files-found: error
          retention-days: 90
