name: QORE Turtle Soup XAUUSD R33 Candidate Freeze

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-xauusd-specialist-memory-v1-001
    paths:
      - '.github/workflows/turtle-soup-xauusd-r33-candidate-freeze.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r33_candidate_freeze.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r33_candidate_freeze.py'

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: '35308249603'
  SOURCE_ARTIFACT: 'qore-turtle-soup-xauusd-r33-subfamily-risk-governor-8dbe6385c7f15945e3f5001c76b70d0e5fc52b63'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: |
          ruff check --ignore E501,I001             src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r33_candidate_freeze.py             tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r33_candidate_freeze.py
      - run: |
          mypy --disable-error-code attr-defined             src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r33_candidate_freeze.py
      - run: |
          pytest -q --no-cov             tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r33_candidate_freeze.py

  freeze:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download exact R33 source artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: r33-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Freeze exact candidate
        run: |
          mkdir -p freeze-output
          python -m qore.infrastructure.trader_lab.turtle_soup_xauusd_r33_candidate_freeze             r33-source freeze-output > freeze-output/stdout.json
          printf '%s\n' "$GITHUB_SHA" > freeze-output/freeze-code-sha.txt
      - name: Enforce freeze governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('freeze-output/r33-candidate-freeze-manifest.json').read_text())
          assert p['status']=='FROZEN_FOR_5Y_VALIDATION'
          assert p['development_2y_result']['trades']==367
          assert p['development_2y_result']['profit_factor_scaled_net_010']=='2.002523896485190572988396913'
          assert p['development_2y_result']['max_drawdown_scaled_r']=='5.69899493419710124390262490'
          assert p['frozen_contract']['risk_governor']=='DD_2_4_SCALE_075_025'
          assert p['next_stage']['required']=='5Y_VALIDATION'
          assert p['next_stage']['fresh_holdout_status']=='SEALED_UNTOUCHED'
          g=p['governance']
          assert g['candidate_frozen'] is True
          assert g['candidate_promoted'] is False
          assert g['fresh_holdout_consumed'] is False
          assert g['live_authorized'] is False
          assert g['real_capital_authorized'] is False
          assert g['production_authorized'] is False
          assert g['merge_authorized'] is False
          PY
      - name: Hash freeze evidence
        run: |
          cd freeze-output
          sha256sum r33-candidate-freeze-manifest.json stdout.json freeze-code-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-xauusd-r33-candidate-freeze-${{ github.sha }}
          path: freeze-output
          if-no-files-found: error
          retention-days: 90
