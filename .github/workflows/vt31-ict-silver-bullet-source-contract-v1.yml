name: QORE VT31 ICT Silver Bullet Causal Source Contract V1

on:
  push:
    branches:
      - agent/vt31-architect-operations-cert-20261009
    paths:
      - src/qore/infrastructure/traders/vt31_ict_silver_bullet_source_contract_v1.py
      - .github/workflows/vt31-ict-silver-bullet-source-contract-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail closed causal-source unit tests
        run: |
          set -euo pipefail
          python -m py_compile src/qore/infrastructure/traders/vt31_ict_silver_bullet_source_contract_v1.py
          python src/qore/infrastructure/traders/vt31_ict_silver_bullet_source_contract_v1.py
      - name: Confirm candidate source contract is not live authority
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('src/qore/infrastructure/traders/vt31_ict_silver_bullet_source_contract_v1.py').read_text()
          assert 'MIN_PROJECTED_FRAMEWORK_INDEX_POINTS = Decimal("10")' in source
          assert '"VT31_LONDON": 3' in source
          assert '"VT31_NY_AM": 10' in source
          assert '"VT31_NY_PM": 14' in source
          assert 'actionable_trade_authority: bool = False' in source
          assert 'uses_terminal_outcome: bool = False' in source
          assert 'STRUCTURAL_STOP_UNPROVEN' in source
          assert 'NEXT_DRAW_ON_LIQUIDITY_UNPROVEN' in source
          PY
