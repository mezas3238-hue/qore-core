name: QORE Turtle Soup XAUUSD R12 Frozen Candidate Trader Replay

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-xauusd-r3-forensics-001
    paths:
      - '.github/workflows/turtle-soup-xauusd-r12-frozen-candidate-trader-replay.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r12_frozen_candidate_trader_replay.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r12_frozen_candidate_trader_replay.py'

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-XAUUSD-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-XAUUSD-2f510461b3360e91d5ee70a72716a76cd6561f16'
  R11_RUN_ID: '35282212625'
  R11_ARTIFACT: 'qore-turtle-soup-xauusd-r11-situation-recognition-4f6292ecb4081c353a66b1769a9f5bf7d4d1fbbb'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check --ignore E501,I001 \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r12_frozen_candidate_trader_replay.py \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r12_frozen_candidate_trader_replay.py
      - name: Mypy focused gate
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r12_frozen_candidate_trader_replay.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r12_frozen_candidate_trader_replay.py

  economic-replay:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download immutable consumed XAUUSD M5 corpus
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download immutable consumed XAUUSD Target Destination V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Download immutable R11 recognition decisions
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.R11_ARTIFACT }}
          path: r11-recognition
          github-token: ${{ github.token }}
          run-id: ${{ env.R11_RUN_ID }}
      - name: Execute frozen candidate trader replay
        run: |
          mkdir -p r12-output
          python -m qore.infrastructure.trader_lab.turtle_soup_xauusd_r12_frozen_candidate_trader_replay \
            source-xauusd target-xauusd r11-recognition r12-output > r12-output/stdout.json
          printf '%s\n' "$GITHUB_SHA" > r12-output/git-sha.txt
      - name: Enforce frozen launch and governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(Path('r12-output/candidate-trader-replay-report.json').read_text())
          assert p['identity']=='TURTLE_SOUP_XAUUSD_R12_FROZEN_CANDIDATE_TRADER_REPLAY_V1'
          assert p['candidate_identity']=='TURTLE_SOUP_XAUUSD_R11_BREAK_A_MULTICHANNEL_VALIDITY_CANDIDATE_001'
          assert p['reproduction']['retained_bars']==707716
          assert p['reproduction']['r3_selected_trades']==5885
          assert p['reproduction']['frozen_candidate_trades']==31
          assert p['reproduction']['binary_capacity_labeled']==30
          assert p['capacity_labels']['dol_capable']==21
          assert p['capacity_labels']['invalidated_before_any_active_dol']==9
          assert p['capacity_labels']['other_diagnostic']==1
          assert p['launch_contract']['candidate_definition_retrained'] is False
          assert p['launch_contract']['thresholds_changed'] is False
          assert p['launch_contract']['calendar_year_used_as_rule'] is False
          assert p['launch_contract']['pnl_used_for_eligibility'] is False
          assert p['launch_contract']['fresh_holdout_used'] is False
          assert p['governance']['candidate_promoted_to_operating_rule'] is False
          assert p['governance']['fresh_holdout_consumed'] is False
          assert p['governance']['demo_eligible'] is False
          assert p['governance']['live_authorized'] is False
          assert p['governance']['real_capital_authorized'] is False
          assert p['governance']['production_authorized'] is False
          PY
      - name: Hash immutable R12 result
        run: |
          cd r12-output
          sha256sum candidate-trader-replay-report.json candidate-trades.json stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-xauusd-r12-frozen-candidate-replay-${{ github.sha }}
          path: r12-output
          if-no-files-found: error
          retention-days: 90
