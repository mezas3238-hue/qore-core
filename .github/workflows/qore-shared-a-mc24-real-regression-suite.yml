name: QORE Shared A MC24 Real Regression Suite

concurrency:
  group: qore-shared-a-mc24-real-regression-suite
  cancel-in-progress: false

on:
  push:
    branches:
      - agent/shared-a-cognitive-science-001
    paths:
      - src/qore/infrastructure/core_stack_v2/continual_learning_governance.py
      - scripts/shared_mc24_real_regression_suite.py
      - .github/workflows/qore-shared-a-mc24-real-regression-suite.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and validate
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          mkdir -p input/{mc09,mc10,wp04e,wp04d} result
          ruff check \
            src/qore/infrastructure/core_stack_v2/continual_learning_governance.py \
            scripts/shared_mc24_real_regression_suite.py
          mypy src/qore/infrastructure/core_stack_v2/continual_learning_governance.py
          pytest -q tests/infrastructure/test_core_stack_v2_continual_learning_governance.py

      - name: Verify exact sealed evidence
        run: |
          set -euo pipefail
          for spec in \
            "36754966932:11116522138" \
            "36755380068:11115664725" \
            "36247407353:10908500161" \
            "36248025384:10908077821"
          do
            run_id="${spec%%:*}"
            artifact_id="${spec#*:}"
            test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')" = "completed"
            test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion')" = "success"
            test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" --jq '.expired')" = "false"
          done

      - name: Recover sealed evidence
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11116522138/zip" > mc09.zip
          unzip -q mc09.zip -d input/mc09
          (cd input/mc09 && sha256sum -c SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11115664725/zip" > mc10.zip
          unzip -q mc10.zip -d input/mc10
          (cd input/mc10 && sha256sum -c SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10908500161/zip" > wp04e.zip
          unzip -q wp04e.zip -d input/wp04e
          (cd input/wp04e/result && sha256sum -c SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10908077821/zip" > wp04d.zip
          unzip -q wp04d.zip -d input/wp04d
          (cd input/wp04d/result && sha256sum -c SHA256SUMS)

      - name: Execute real regression suite
        run: |
          python scripts/shared_mc24_real_regression_suite.py \
            --mc09 input/mc09/mc09-belief-calibration-v2.json \
            --mc10 input/mc10/mc10-transition-stability.json \
            --wp04-holdout input/wp04e/result/wp04-v3b-holdout-e.json \
            --wp04-replication input/wp04d/result/wp04-v3b-replication-d.json \
            --output result/mc24-real-regression-suite.json \
            | tee result/summary.json

      - name: Validate bounded scientific disposition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/mc24-real-regression-suite.json").read_text())
          assert p["status"] == "MC24_REAL_REGRESSION_SUITE_BOUND_PASS"
          assert p["real_adaptation_regression_suite_bound"] is True
          assert p["catastrophic_forgetting_detected"] is False
          assert p["transportability_pass"] is True
          assert p["stable_certified_knowledge_overwritten"] is False
          assert p["empirical_half_life_validated"] is False
          assert p["mc23_real_regime_adaptation_bound"] is False
          assert p["mc24_completed_and_proven"] is False
          assert p["productive_authority"] is False
          assert p["master_ledger_mutated"] is False
          assert p["protected_certification_holdout_opened"] is False
          PY

      - name: Seal
        run: |
          printf '%s\n' "${GITHUB_SHA}" > result/code-git-sha.txt
          (cd result && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-a-mc24-real-regression-suite-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Report
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p=json.loads(Path("result/mc24-real-regression-suite.json").read_text())
          body="\n".join([
              "## Shared A MC-24 — Real Adaptation Regression Suite",
              "",
              f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- candidate: **{p['candidate_id']}**",
              f"- maximum regression: **{p['maximum_regression_bps']} bps**",
              "- catastrophic forgetting detected: **False**",
              "- independent temporal transportability: **PASS**",
              "- real regression suite bound: **True**",
              "- empirical knowledge half-life: **Still open**",
              "- real MC23 novel-regime adaptation: **Still open**",
              "- MC-24 completed-and-proven: **False**",
              "- protected certification holdout opened: **False**",
          ])+"\n"
          Path("result/issue-comment.md").write_text(body)
          PY
          gh issue comment 638 --body-file result/issue-comment.md
