name: QORE Capitalizer V49 Reserved Holdout 1Y Trade Count

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-v49-reserved-holdout-1y.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_high_frequency_identity_v49.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_h1_context_state_v49.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_high_frequency_capacity_census_v49.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_high_frequency_trader_v49.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v49_holdout_contract.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v49_holdout_replay.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_high_frequency_identity_v49.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_h1_context_state_v49.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_high_frequency_capacity_census_v49.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_high_frequency_trader_v49.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v49_holdout_contract.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v49_holdout_replay.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-v49-reserved-holdout-1y-${{ github.sha }}
  cancel-in-progress: false

env:
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'
  HOLDOUT_START: '2024-09-17T00:00:00+00:00'
  HOLDOUT_END: '2025-09-17T00:00:00+00:00'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_high_frequency_identity_v49.py \
            src/qore/infrastructure/trader_lab/capitalizer_h1_context_state_v49.py \
            src/qore/infrastructure/trader_lab/capitalizer_high_frequency_capacity_census_v49.py \
            src/qore/infrastructure/trader_lab/capitalizer_high_frequency_trader_v49.py \
            src/qore/infrastructure/trader_lab/capitalizer_v49_holdout_contract.py \
            src/qore/infrastructure/trader_lab/capitalizer_v49_holdout_replay.py \
            tests/infrastructure/trader_lab/test_capitalizer_high_frequency_identity_v49.py \
            tests/infrastructure/trader_lab/test_capitalizer_h1_context_state_v49.py \
            tests/infrastructure/trader_lab/test_capitalizer_high_frequency_capacity_census_v49.py \
            tests/infrastructure/trader_lab/test_capitalizer_high_frequency_trader_v49.py \
            tests/infrastructure/trader_lab/test_capitalizer_v49_holdout_contract.py \
            tests/infrastructure/trader_lab/test_capitalizer_v49_holdout_replay.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_high_frequency_identity_v49.py \
            src/qore/infrastructure/trader_lab/capitalizer_h1_context_state_v49.py \
            src/qore/infrastructure/trader_lab/capitalizer_high_frequency_capacity_census_v49.py \
            src/qore/infrastructure/trader_lab/capitalizer_high_frequency_trader_v49.py \
            src/qore/infrastructure/trader_lab/capitalizer_v49_holdout_contract.py \
            src/qore/infrastructure/trader_lab/capitalizer_v49_holdout_replay.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_high_frequency_identity_v49.py \
            tests/infrastructure/trader_lab/test_capitalizer_h1_context_state_v49.py \
            tests/infrastructure/trader_lab/test_capitalizer_high_frequency_capacity_census_v49.py \
            tests/infrastructure/trader_lab/test_capitalizer_high_frequency_trader_v49.py \
            tests/infrastructure/trader_lab/test_capitalizer_v49_holdout_contract.py \
            tests/infrastructure/trader_lab/test_capitalizer_v49_holdout_replay.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - symbol: USDJPY
            session: ASIA
          - symbol: AUDJPY
            session: ASIA
          - symbol: AUDUSD
            session: ASIA
          - symbol: GBPJPY
            session: ASIA
          - symbol: EURUSD
            session: LONDON
          - symbol: GBPUSD
            session: LONDON
          - symbol: XAUUSD
            session: NEW_YORK
          - symbol: USDCAD
            session: NEW_YORK
          - symbol: NAS100
            session: NEW_YORK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download retained provider-native M1
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Verify retained M1 provenance
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("m1-source/m1-clone-manifest.json").read_text())
          assert manifest["canonical_symbol"] == os.environ["EXPECTED_SYMBOL"]
          assert manifest["provider_native_m1"] is True
          assert manifest["synthetic_m1"] is False
          assert manifest["interpolated_m1"] is False
          assert manifest["contradictory_m1"] == 0
          assert manifest["read_only"] is True
          assert manifest["target_start"] == "2016-09-17T00:00:00+00:00"
          assert manifest["target_end_exclusive"] == "2026-09-17T00:00:00+00:00"
          PY
      - name: Run frozen V49 over reserved holdout market
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_high_frequency_capacity_census_v49 \
            market m1-source market-output \
            --session "${{ matrix.session }}" \
            --window-start "${{ env.HOLDOUT_START }}" \
            --window-end "${{ env.HOLDOUT_END }}"
      - name: Enforce holdout market boundary
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
          EXPECTED_SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"]
          path = Path("market-output") / f"capitalizer-{symbol.lower()}-v49-hf-capacity.json"
          result = json.loads(path.read_text())
          assert result["symbol"] == symbol
          assert result["session"] == os.environ["EXPECTED_SESSION"]
          assert result["window_start"] == os.environ["HOLDOUT_START"]
          assert result["window_end_exclusive"] == os.environ["HOLDOUT_END"]
          assert result["daily_used"] is False
          assert result["h4_used"] is False
          assert result["fresh_holdout_used"] is False
          assert result["outcome_used"] is False
          assert result["economics_used"] is False
          assert result["live_authorized"] is False
          PY
      - name: Upload holdout market artifact
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v49-holdout-${{ matrix.symbol }}-${{ github.sha }}
          path: market-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download nine holdout market artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v49-holdout-*-${{ github.sha }}
          path: market-reports
          merge-multiple: false
      - name: Materialize deterministic V49 trades
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v49_holdout_replay \
            market-reports holdout-output --git-sha "${{ github.sha }}"
      - name: Enforce holdout integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("holdout-output/capitalizer-v49-reserved-holdout-1y-report.json")
          result = json.loads(path.read_text())
          assert result["window_start"] == "2024-09-17T00:00:00+00:00"
          assert result["window_end_exclusive"] == "2025-09-17T00:00:00+00:00"
          assert result["decision_timeframes"] == ["H1", "M15", "M1"]
          assert result["market_count"] == 9
          assert result["session_count"] == 3
          assert result["fresh_holdout_used"] is False
          assert result["outcome_used"] is False
          assert result["economics_used"] is False
          assert result["daily_used"] is False
          assert result["h4_used"] is False
          assert result["methodology_mutation_allowed"] is False
          assert result["executed_trades"] <= result["candidate_opportunities"]
          assert result["max_trades_one_day"] <= 9
          assert result["live_authorized"] is False
          assert result["real_capital_authorized"] is False
          PY
      - name: Upload final 1Y holdout report
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v49-reserved-holdout-1y-${{ github.sha }}
          path: holdout-output
          if-no-files-found: error
          retention-days: 180
