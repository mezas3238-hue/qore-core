name: QORE CIBO Integrated Capital Forward Binding

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-integrated-capital-forward-binding.yml'
      - 'src/qore/infrastructure/cibo_integrated_capital_forward_binding.py'
      - 'src/qore/infrastructure/cibo_integrated_capital_truth.py'
      - 'tests/infrastructure/test_cibo_integrated_capital_forward_binding.py'
      - 'tests/infrastructure/test_cibo_integrated_capital_truth.py'
      - 'docs/research/CIBO-B-INTEGRATED-CAPITAL-FORWARD-BINDING-V1.md'
  push:
    branches:
      - agent/cibo-certification-architect-b-integration-001
    paths:
      - '.github/workflows/cibo-integrated-capital-forward-binding.yml'
      - 'src/qore/infrastructure/cibo_integrated_capital_forward_binding.py'
      - 'src/qore/infrastructure/cibo_integrated_capital_truth.py'
      - 'tests/infrastructure/test_cibo_integrated_capital_forward_binding.py'
      - 'tests/infrastructure/test_cibo_integrated_capital_truth.py'
      - 'docs/research/CIBO-B-INTEGRATED-CAPITAL-FORWARD-BINDING-V1.md'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  integrated-capital-forward-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Integrated capital forward binding quality
        run: |
          ruff check \
            src/qore/infrastructure/cibo_integrated_capital_forward_binding.py \
            src/qore/infrastructure/cibo_integrated_capital_truth.py \
            tests/infrastructure/test_cibo_integrated_capital_forward_binding.py \
            tests/infrastructure/test_cibo_integrated_capital_truth.py
          mypy \
            src/qore/infrastructure/cibo_integrated_capital_forward_binding.py \
            src/qore/infrastructure/cibo_integrated_capital_truth.py
          python -m py_compile \
            src/qore/infrastructure/cibo_integrated_capital_forward_binding.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_integrated_capital_forward_binding.py \
            tests/infrastructure/test_cibo_integrated_capital_truth.py
