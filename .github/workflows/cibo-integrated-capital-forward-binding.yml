name: QORE CIBO Integrated Capital Forward Binding

on:
  pull_request:
    paths:
      - 'src/qore/infrastructure/cibo_integrated_capital_forward_binding.py'
      - 'tests/infrastructure/test_cibo_integrated_capital_forward_binding.py'
      - '.github/workflows/cibo-integrated-capital-forward-binding.yml'
  push:
    paths:
      - 'src/qore/infrastructure/cibo_integrated_capital_forward_binding.py'
      - 'tests/infrastructure/test_cibo_integrated_capital_forward_binding.py'
      - '.github/workflows/cibo-integrated-capital-forward-binding.yml'

jobs:
  forward-capital-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Validate forward capital binding
        run: |
          ruff check \
            src/qore/infrastructure/cibo_integrated_capital_forward_binding.py \
            tests/infrastructure/test_cibo_integrated_capital_forward_binding.py
          mypy \
            src/qore/infrastructure/cibo_integrated_capital_forward_binding.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_integrated_capital_forward_binding.py
