name: QORE Shared WP05 V12 Anchor Observability

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - docs/shared/QORE_SHARED_WP05_V12_SOURCE_ONLY_ANCHOR_OBSERVABILITY_PREREGISTRATION.md
      - src/qore/infrastructure/core_stack_v2/active_perception_v12_anchor_observability.py
      - scripts/shared_wp05_active_perception_v12_anchor_observability.py
      - tests/infrastructure/test_core_stack_v2_active_perception_v12_anchor_observability.py
      - .github/workflows/qore-shared-wp05-active-perception-v12-anchor-observability.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: qore-shared-wp05-v12-anchor-observability-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  V12_ACQUISITION_RUN_ID: "36454372776"
  V12_SOURCE_INTEGRITY_RUN_ID: "36465280823"
  V12_SOURCE_ANCHOR_RUN_ID: "36466493930"
  V12_GLOBAL_DATASET_SHA256: "ebbe30a887867bb917f0992b15e1600f9f06eccb07562b9625fcb9517fb381c8"
  V12_SOURCE_ANCHOR_SHA256: "d5dda96fbaab9506e77bd803cf8b542250288e7d46091db1630f1fd8fb91839e"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Shared
        run: pip install -e ".[dev]"
      - name: Validate anchor-observability protocol
        run: |
          set -euo pipefail
          ruff check src/qore/infrastructure/core_stack_v2/active_perception_v12_anchor_observability.py scripts/shared_wp05_active_perception_v12_anchor_observability.py tests/infrastructure/test_core_stack_v2_active_perception_v12_anchor_observability.py
          mypy src/qore/infrastructure/core_stack_v2/active_perception_v12_anchor_observability.py
          python -m py_compile src/qore/infrastructure/core_stack_v2/active_perception_v12_anchor_observability.py scripts/shared_wp05_active_perception_v12_anchor_observability.py
          pytest -q tests/infrastructure/test_core_stack_v2_active_perception_v12_anchor_observability.py

  audit:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Shared
        run: pip install -e .

      - name: Download frozen raw BID/ASK acquisition
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.V12_ACQUISITION_RUN_ID }}
          pattern: qore-shared-wp05-v12-full-r8-data-*
          path: input/raw
          merge-multiple: false

      - name: Download authoritative source-integrity report
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.V12_SOURCE_INTEGRITY_RUN_ID }}
          name: qore-shared-wp05-v12-source-integrity-746ae62329595f003711fdbbc3957a4e3a0a9989
          path: input/integrity

      - name: Download frozen source anchors
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.V12_SOURCE_ANCHOR_RUN_ID }}
          name: qore-shared-wp05-v12-source-anchors-364d1725e181e8191fe2dec83b6e4457cb40434e
          path: input/anchors

      - name: Verify immutable upstream evidence
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' sums < <(find input/raw -name SHA256SUMS -print0)
          test "${#sums[@]}" -eq 16
          for sumfile in "${sums[@]}"; do
            (
              cd "$(dirname "$sumfile")"
              sha256sum -c SHA256SUMS
            )
          done
          (cd input/anchors && sha256sum -c SHA256SUMS)
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          integrity=json.loads(
              Path("input/integrity/wp05-v12-source-integrity-report.json").read_text()
          )
          assert integrity["status"] == "green_source_integrity"
          assert integrity["global_dataset_sha256"] == os.environ[
              "V12_GLOBAL_DATASET_SHA256"
          ]
          anchors=json.loads(
              Path("input/anchors/wp05-v12-source-anchors.json").read_text()
          )
          assert anchors["source_count"] == 6804
          assert anchors["source_anchor_sha256"] == os.environ[
              "V12_SOURCE_ANCHOR_SHA256"
          ]
          assert anchors["target_or_outcome_used"] is False
          assert anchors["r6_r5_read"] is False
          assert anchors["fresh_holdout_opened"] is False
          PY

      - name: Audit causal observability at all 6804 anchors
        run: |
          set -euo pipefail
          python scripts/shared_wp05_active_perception_v12_anchor_observability.py             --raw-root input/raw             --anchor-manifest input/anchors/wp05-v12-source-anchors.json             --expected-global-dataset-sha256 "$V12_GLOBAL_DATASET_SHA256"             --output result/wp05-v12-anchor-observability-report.json             | tee result/summary.json

      - name: Enforce source-only staleness freeze
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(
              Path("result/wp05-v12-anchor-observability-report.json").read_text()
          )
          assert p["identity"] == (
              "QORE_SHARED_WP05_ACTIVE_PERCEPTION_V12_ANCHOR_OBSERVABILITY_001"
          )
          assert p["status"] == "frozen"
          assert p["anchor_count"] == 6804
          assert p["selected_staleness_limit_ms"] in (
              250,500,1000,2000,5000,10000,30000,60000
          )
          assert p["minimum_usable_coverage_bps"] == 9500
          assert p["microstructure_windows_ms"] == [1000,5000,15000,60000]
          assert p["source_anchor_sha256"] == (
              "d5dda96fbaab9506e77bd803cf8b542250288e7d46091db1630f1fd8fb91839e"
          )
          assert p["target_or_outcome_read"] is False
          assert p["r6_r5_read"] is False
          assert p["fresh_holdout_opened"] is False
          PY

      - name: Seal observability report
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > result/git-sha.txt
          printf '%s\n' "$GITHUB_RUN_ID" > result/run-id.txt
          (
            cd result
            sha256sum               wp05-v12-anchor-observability-report.json               summary.json               git-sha.txt               run-id.txt > SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-wp05-v12-anchor-observability-${{ github.sha }}
          path: result
          if-no-files-found: error
          retention-days: 90

      - name: Report source-only staleness freeze
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p=json.loads(
              Path("result/wp05-v12-anchor-observability-report.json").read_text()
          )
          lines=[
              "## WP-05 V12 source-only anchor observability FROZEN",
              "",
              f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- GitHub Actions run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- anchors audited: **{p['anchor_count']} / 6804**",
              f"- selected staleness limit: **{p['selected_staleness_limit_ms']} ms**",
              f"- BID age ms: `{p['bid_age_ms']}`",
              f"- ASK age ms: `{p['ask_age_ms']}`",
              f"- max-side age ms: `{p['max_side_age_ms']}`",
              f"- absolute side-age skew ms: `{p['absolute_side_age_skew_ms']}`",
              f"- no-prior BID/ASK: **{p['no_prior_bid_count']} / {p['no_prior_ask_count']}**",
              f"- crossed causal quotes before staleness: **{p['crossed_causal_quote_count']}**",
              f"- threshold reports: `{p['threshold_reports']}`",
              f"- observability SHA256: `{p['anchor_observability_sha256']}`",
              "- target/outcome read: **False**",
              "- R6/R5 read: **False**",
              "- fresh holdout opened: **False**",
              "- staleness is now frozen source-only; V12 target-aware discovery remains unopened until representation artifact/fingerprint is frozen",
          ]
          Path("result/issue-comment.md").write_text("\n".join(lines)+"\n")
          PY
          gh issue comment 643 --body-file result/issue-comment.md
