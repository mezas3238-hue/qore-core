name: QORE Turtle Soup XAUUSD R25 CIBO Native Memory Brain

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-xauusd-cibo-native-memory-v2-001
    paths:
      - '.github/workflows/turtle-soup-xauusd-r25-cibo-native-memory-brain.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r25_cibo_native_memory_brain.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r25_cibo_native_memory_brain.py'

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-XAUUSD-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-XAUUSD-2f510461b3360e91d5ee70a72716a76cd6561f16'
  NATIVE_RUN_ID: '35299823621'
  NATIVE_ARTIFACT: 'qore-cibo-xauusd-native-memory-v2-ccccceb555e6fff818c7ba6a45b992eaaf037c04'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check --ignore E501,I001 \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r25_cibo_native_memory_brain.py \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r25_cibo_native_memory_brain.py
      - name: Mypy focused gate
        run: |
          mypy --disable-error-code attr-defined \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r25_cibo_native_memory_brain.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r25_cibo_native_memory_brain.py

  replay-2y:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable XAUUSD raw M5
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download immutable Target Destination V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Download frozen CIBO Native Memory V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.NATIVE_ARTIFACT }}
          path: cibo-native-memory
          github-token: ${{ github.token }}
          run-id: ${{ env.NATIVE_RUN_ID }}
      - name: Run CIBO-native 2Y trader replay
        run: |
          mkdir -p r25-output
          python -m qore.infrastructure.trader_lab.turtle_soup_xauusd_r25_cibo_native_memory_brain \
            source-xauusd target-xauusd cibo-native-memory r25-output \
            > r25-output/stdout.json
          printf '%s\n' "$GITHUB_SHA" > r25-output/git-sha.txt
      - name: Enforce native-memory-only decision contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('r25-output/r25-cibo-native-brain-report.json').read_text())
          assert p['identity']=='TURTLE_SOUP_XAUUSD_R25_CIBO_NATIVE_MEMORY_BRAIN_V1'
          assert p['window']['open']=='2024-09-17T00:00:00+00:00'
          assert p['window']['close']=='2026-09-17T00:00:00+00:00'
          assert p['reproduction']['retained_bars']==707716
          s=p['decision_sources']
          assert s['market_memory']=='CIBO_XAUUSD_NATIVE_MARKET_DECISION_MEMORY_V2'
          for key in ('r11_memory_used','r16_memory_used','r17_memory_used','r20_memory_used','r21_memory_used','r22_memory_used','r23_memory_used'):
              assert s[key] is False
          d=p['decision_contract']
          assert d['cibo_selects_target'] is True
          assert d['cibo_selects_management_posture'] is True
          assert d['cibo_memory_is_net_010_aware'] is True
          assert d['negative_or_unresolved_memory_abstains'] is True
          assert d['fresh_holdout_used'] is False
          g=p['governance']
          assert g['fresh_holdout_consumed'] is False
          assert g['candidate_promoted'] is False
          assert g['live_authorized'] is False
          assert g['real_capital_authorized'] is False
          PY
      - name: Hash immutable R25 result
        run: |
          cd r25-output
          sha256sum \
            r25-cibo-native-brain-report.json \
            r25-cibo-native-brain-decisions.json \
            stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-xauusd-r25-cibo-native-${{ github.sha }}
          path: r25-output
          if-no-files-found: error
          retention-days: 90
