name: QORE VT31 NAS100 Single 3Y Trader Lab V1

on:
  push:
    branches:
      - agent/vt31-edge-position-cert-b-001
    paths:
      - scripts/vt31_nas100_3y_evidence_probe_v1.py
      - scripts/vt31_nas100_3y_replay_v1.py
      - scripts/vt31_nas100_3y_adjudicator_v1.py
      - scripts/vt31_nas100_3y_density_frontier_v1.py
      - .github/workflows/vt31-nas100-3y-trader-lab-v1.yml
  workflow_dispatch:

concurrency:
  group: vt31-nas100-single-3y-trader-lab-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  QORE_SOFTWARE_SHA: ${{ github.sha }}
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN }}
  QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID }}

jobs:
  trader-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install research runtime
        run: pip install -e ".[dev,ctrader]"

      - name: Static gates
        run: |
          set -euo pipefail
          python scripts/vt31_nas100_3y_evidence_probe_v1.py --self-test
          python -m py_compile             scripts/vt31_nas100_3y_evidence_probe_v1.py             scripts/vt31_nas100_3y_replay_v1.py             scripts/vt31_nas100_3y_adjudicator_v1.py \
            scripts/vt31_nas100_3y_density_frontier_v1.py
          ruff check             scripts/vt31_nas100_3y_evidence_probe_v1.py             scripts/vt31_nas100_3y_replay_v1.py             scripts/vt31_nas100_3y_adjudicator_v1.py \
            scripts/vt31_nas100_3y_density_frontier_v1.py

      - name: Resolve canonical single 3Y evidence
        id: evidence
        run: |
          set -euo pipefail
          artifact_name="qore-vt31-nas100-owner-3y-base-v1"
          count="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100"             --jq '[.artifacts[] | select(.expired == false)] | length')"
          if [ "$count" -gt 1 ]; then
            echo "Ambiguous 3Y evidence: expected at most one live artifact"
            exit 1
          fi
          mkdir -p input/NAS100 result
          if [ "$count" = "1" ]; then
            artifact_id="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100"               --jq '[.artifacts[] | select(.expired == false)][0].id')"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > evidence.zip
            unzip -q evidence.zip -d input
            echo "acquire=false" >> "$GITHUB_OUTPUT"
            echo "artifact_id=${artifact_id}" >> "$GITHUB_OUTPUT"
          else
            echo "acquire=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify historical-data credentials
        if: steps.evidence.outputs.acquire == 'true'
        run: |
          set -euo pipefail
          for name in QORE_CTRADER_CLIENT_ID QORE_CTRADER_CLIENT_SECRET QORE_CTRADER_ACCESS_TOKEN QORE_CTRADER_REFRESH_TOKEN; do
            test -n "${!name:-}"
          done
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            test -n "$account_id"
            echo "::add-mask::$account_id"
            echo "QORE_CTRADER_DEMO_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          fi

      - name: Acquire canonical 3Y evidence once
        if: steps.evidence.outputs.acquire == 'true'
        run: |
          set -euo pipefail
          python scripts/vt31_nas100_3y_evidence_probe_v1.py             > input/NAS100/market-evidence.json
          (cd input && sha256sum NAS100/market-evidence.json > EVIDENCE-SHA256SUMS)

      - name: Validate single-base evidence contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          payload=json.loads(Path("input/NAS100/market-evidence.json").read_text())
          assert payload["base_id"] == "VT31_NAS100_OWNER_3Y_BASE_001"
          assert payload["market"] == "NAS100"
          assert payload["base_start_at"] == "2023-10-01T00:00:00+00:00"
          assert payload["base_end_exclusive"] == "2026-10-01T00:00:00+00:00"
          assert payload["requested_calendar_days"] == 1096
          assert payload["coverage_sufficient"] is True
          assert payload["owner_designated_single_3y_base"] is True
          assert payload["legacy_r5_r6_r8_operating_folds_used"] is False
          assert payload["may_be_called_fresh_again"] is False
          PY
          if [ -f input/EVIDENCE-SHA256SUMS ]; then
            (cd input && sha256sum -c EVIDENCE-SHA256SUMS)
          fi

      - name: Upload canonical 3Y evidence on first acquisition
        if: steps.evidence.outputs.acquire == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-owner-3y-base-v1
          path: input/
          if-no-files-found: error
          retention-days: 90

      - name: Replay current VT31 on single 3Y base
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python scripts/vt31_nas100_3y_replay_v1.py             input/NAS100/market-evidence.json             --output result/3y-replay.json             | tee result/3y-replay-summary.json

      - name: Adjudicate 3Y density and pure-edge gates
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python scripts/vt31_nas100_3y_adjudicator_v1.py             result/3y-replay.json             --output result/3y-adjudication.json             | tee result/3y-adjudication-summary.json

      - name: Run causal admission-density frontier
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python scripts/vt31_nas100_3y_density_frontier_v1.py \
            input/NAS100/market-evidence.json \
            --output result/3y-density-frontier.json \
            | tee result/3y-density-frontier-summary.json

      - name: Governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          x=json.loads(Path("result/3y-adjudication.json").read_text())
          g=x["governance"]
          assert x["base_id"] == "VT31_NAS100_OWNER_3Y_BASE_001"
          assert g["single_contiguous_3y_base"] is True
          assert g["legacy_r5_r6_r8_operating_folds_used"] is False
          assert g["pure_edge_only"] is True
          assert g["position_sizing_used"] is False
          assert g["dynamic_sizing_used"] is False
          assert g["leverage_used"] is False
          assert g["compounding_used"] is False
          assert g["portfolio_weighting_used"] is False
          assert g["capital_weighting_used"] is False
          assert g["fresh_independent_holdout_claimed"] is False
          assert g["candidate_certified"] is False
          PY

      - name: Bind result
        run: |
          set -euo pipefail
          echo "$GITHUB_SHA" > result/git-sha.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd result && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-single-3y-trader-lab-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
