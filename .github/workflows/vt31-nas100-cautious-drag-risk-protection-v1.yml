name: QORE VT31 NAS100 CAUTIOUS Drag Risk Protection V1

on:
  push:
    branches:
      - agent/vt31-nas100-intelligence-pilot-001
    paths:
      - scripts/vt31_nas100_cautious_drag_risk_protection_v1.py
      - scripts/vt31_nas100_entry_intelligence_oco_lab_v1.py
      - scripts/vt31_nas100_high_density_management_intelligence_v1.py
      - scripts/vt31_nas100_high_density_structural_protection_v1.py
      - scripts/vt31_nas100_specialist_r1_candidate.py
      - src/qore/infrastructure/traders/vt31_nas100_*.py
      - .github/workflows/vt31-nas100-cautious-drag-risk-protection-v1.yml
  workflow_dispatch:

concurrency:
  group: vt31-nas100-cautious-drag-risk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
          - partition: r8_fresh
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
    env:
      GH_TOKEN: ${{ github.token }}
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Static causal gate
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/vt31_nas100_cautious_drag_risk_protection_v1.py
          ruff check \
            scripts/vt31_nas100_cautious_drag_risk_protection_v1.py

      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p evidence result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d evidence
          path="evidence/fresh/NAS100/market-evidence.json"
          test -f "$path"
          actual="$(sha256sum "$path" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"

      - name: Replay drag-aware risk and protection
        run: |
          set -euo pipefail
          python scripts/vt31_nas100_cautious_drag_risk_protection_v1.py \
            evidence/fresh/NAS100/market-evidence.json \
            --partition "$PARTITION" \
            --output "result/drag-risk-${PARTITION}.json" \
            | tee result/summary.json

      - name: Governance gate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = os.environ["PARTITION"]
          payload = json.loads(
              Path(f"result/drag-risk-{p}.json").read_text()
          )
          g = payload["governance"]
          assert g["entry_filtering"] is False
          assert g["one_trade_max_per_source_event"] is True
          assert g["trade_count_reduced_by_risk_policy"] is False
          assert g["risk_flags_use_future_bars"] is False
          assert g["risk_flags_use_terminal_pnl_at_runtime"] is False
          assert g[
              "risk_map_derived_from_consumed_association_research"
          ] is True
          assert g["first_swing_is_universal"] is False
          assert g["qore_risk_remains_sovereign"] is True
          assert g["consumed_evidence_only"] is True
          assert g["policy_promoted"] is False
          assert g["opens_new_holdout"] is False
          assert payload["market"] == "NAS100"
          PY

      - name: Bind result
        run: |
          set -euo pipefail
          echo "$GITHUB_SHA" > result/git-sha.txt
          echo "$ARTIFACT_ID" > result/source-evidence-artifact-id.txt
          (
            cd result
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )
          (cd result && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-drag-risk-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-nas100-drag-risk-*-${{ github.sha }}
          path: input
          merge-multiple: true

      - name: Aggregate cross-fold objective
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from pathlib import Path

          folds = {}
          for path in sorted(Path("input").glob("drag-risk-*.json")):
              payload = json.loads(path.read_text())
              folds[payload["partition"]] = payload
          assert set(folds) == {"r5", "r6", "r8_fresh"}, folds.keys()

          names = sorted(next(iter(folds.values()))["variants"])
          variants = {}
          for name in names:
              rows = []
              for fold_name, payload in sorted(folds.items()):
                  item = payload["variants"][name]
                  rows.append({
                      "partition": fold_name,
                      "trade_count": item["trade_count"],
                      "metrics": item["capital_weighted_metrics"],
                      "mc": item["monte_carlo"],
                      "gates": item["development_gates"],
                      "passes": item["passes_development_gates"],
                      "risk_class_counts": item["risk_class_counts"],
                      "drag_count_distribution": (
                          item["drag_count_distribution"]
                      ),
                  })
              variants[name] = {
                  "folds": rows,
                  "all_folds_density_250_to_330": all(
                      250 <= row["trade_count"] <= 330
                      for row in rows
                  ),
                  "all_folds_pf_ge_1_50": all(
                      row["metrics"]["profit_factor"] is not None
                      and float(row["metrics"]["profit_factor"]) >= 1.50
                      for row in rows
                  ),
                  "all_folds_dd_le_10": all(
                      float(row["metrics"]["max_drawdown_r"]) <= 10.0
                      for row in rows
                  ),
                  "all_folds_mc_positive_ge_0_90": all(
                      float(row["mc"]["positive_terminal_probability"])
                      >= 0.90
                      for row in rows
                  ),
                  "all_folds_mc_p95_dd_le_15": all(
                      float(row["mc"]["p95_max_drawdown_r"]) <= 15.0
                      for row in rows
                  ),
              }
              variants[name]["all_objectives"] = all(
                  value
                  for key, value in variants[name].items()
                  if key.startswith("all_folds_")
              )

          report = {
              "schema": (
                  "qore.vt31.nas100."
                  "cautious_drag_risk_protection.aggregate.v1"
              ),
              "variants": variants,
              "passing_variants": [
                  name
                  for name, item in variants.items()
                  if item["all_objectives"]
              ],
              "policy_promoted": False,
              "opens_new_holdout": False,
              "live_authorized": False,
              "production_authorized": False,
          }
          Path("result/drag-risk-aggregate.json").write_text(
              json.dumps(report, sort_keys=True, indent=2) + "\n"
          )
          print(json.dumps(report, sort_keys=True))
          PY

      - name: Bind aggregate
        run: |
          set -euo pipefail
          echo "$GITHUB_SHA" > result/git-sha.txt
          (
            cd result
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )
          (cd result && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-drag-risk-aggregate-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
