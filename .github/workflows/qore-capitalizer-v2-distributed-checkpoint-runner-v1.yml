name: QORE Capitalizer V2 Distributed Checkpoint Runner V1

on:
  push:
    branches:
      - agent/capitalizer-v2-distributed-checkpoint-runner-001
    paths:
      - '.github/workflows/qore-capitalizer-v2-distributed-checkpoint-runner-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v2_distributed_checkpoint_runner_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v2_distributed_checkpoint_runner_v1.py'
  workflow_dispatch:
    inputs:
      execute_full:
        description: Run exact consumed-period distributed diagnostic
        required: true
        type: boolean
        default: false
      resume_run_id:
        description: Optional previous runner run id for checkpoint resume
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

env:
  V21_RUN_ID: '36264229554'
  V21_ARTIFACT_SHA: '05452328bbf5cbbc4b26210791d13114105e3f9d'
  SIM_RUN_ID: '36332714846'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_v2_distributed_checkpoint_runner_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_v2_distributed_checkpoint_runner_v1.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_v2_distributed_checkpoint_runner_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_v2_distributed_checkpoint_runner_v1.py
      - name: Bounded equivalence tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_v2_distributed_checkpoint_runner_v1.py

  distributed:
    if: >-
      (github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[run-v2-distributed]')) ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.execute_full == true)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - period: DEVELOPMENT_2024_2026
            slug: development
          - period: CONSUMED_VALIDATION_2022_2024
            slug: validation
          - period: CONSUMED_RESERVED_2020_2022
            slug: reserved
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download reconstructed consumed evidence
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v21-reconstructed-*-${{ env.V21_ARTIFACT_SHA }}
          path: reconstructed
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ env.V21_RUN_ID }}
      - name: Download authoritative simulator transitions
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-counterfactual-portfolio-episode-simulator-v1-sharded-*
          path: simulator-evidence
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ env.SIM_RUN_ID }}
      - name: Download prior checkpoint
        if: inputs.resume_run_id != ''
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v2-distributed-checkpoint-${{ matrix.slug }}-*
          path: checkpoint
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}
      - name: Run exact distributed V2 segment
        run: |
          mkdir -p checkpoint
          python -m qore.infrastructure.trader_lab.capitalizer_v2_distributed_checkpoint_runner_v1 \
            --period "${{ matrix.period }}" \
            --development-root reconstructed/development-input \
            --validation-root reconstructed/validation-input \
            --reserved-root reconstructed/reserved-input \
            --development-validation-context-root reconstructed/development-validation-context \
            --reserved-context-root reconstructed/reserved-context \
            --transition-path simulator-evidence/capitalizer-counterfactual-portfolio-episode-simulator-v1-transitions.jsonl \
            --checkpoint "checkpoint/${{ matrix.slug }}.json" \
            --output "experiment-output/${{ matrix.slug }}" \
            --workers 4 \
            --soft-budget-minutes 300
      - name: Enforce distributed runner contract
        env:
          SLUG: ${{ matrix.slug }}
          PERIOD: ${{ matrix.period }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              (
                  Path("experiment-output")
                  / os.environ["SLUG"]
                  / "capitalizer-v2-distributed-checkpoint-runner-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_V2_DISTRIBUTED_CHECKPOINT_RUNNER_V1"
          )
          assert report["economic_identity"] == (
              "QORE_CAPITALIZER_DYNAMIC_EPISODE_EDGE_RESERVE_RELIEF_V2"
          )
          assert report["period"] == os.environ["PERIOD"]
          assert report["same_reserve_seed_law"] is True
          assert report["same_relief_seed_law"] is True
          assert report["same_relief_first_law"] is True
          assert report["same_deterministic_rank"] is True
          assert report["same_exact_dynamic_replay"] is True
          assert report["sampling"] is False
          assert report["economic_pruning"] is False
          assert report["admission_changed"] is False
          assert report["sizing_changed"] is False
          assert report["candidate_count"] == 0
          assert report["trader_certified"] is False
          result = report["result"]
          assert result["density_retention"] == "1"
          assert result["same_entrant_identities"] is True
          assert result["checkpoint_after_each_committed_action"] is True
          assert result["resume_exact_from_committed_plan"] is True
          print(json.dumps(report, sort_keys=True))
          PY
      - name: Upload checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v2-distributed-checkpoint-${{ matrix.slug }}-${{ github.sha }}
          path: checkpoint/${{ matrix.slug }}.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload distributed result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v2-distributed-result-${{ matrix.slug }}-${{ github.sha }}
          path: experiment-output/${{ matrix.slug }}
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    if: >-
      always() &&
      ((github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[run-v2-distributed]')) ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.execute_full == true))
    needs: distributed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v2-distributed-result-*
          path: results
          merge-multiple: false
      - name: Aggregate exact distributed state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = sorted(
              Path("results").rglob(
                  "capitalizer-v2-distributed-checkpoint-runner-v1.json"
              )
          )
          rows = [json.loads(path.read_text()) for path in paths]
          assert len(rows) == 3, len(rows)
          results = [row["result"] for row in rows]
          complete = all(row["complete"] for row in results)
          all_pass = complete and all(
              row["full_gate_passed"] for row in results
          )
          payload = {
              "identity": (
                  "QORE_CAPITALIZER_V2_DISTRIBUTED_CHECKPOINT_RUNNER_V1"
              ),
              "economic_identity": (
                  "QORE_CAPITALIZER_DYNAMIC_EPISODE_EDGE_RESERVE_RELIEF_V2"
              ),
              "results": sorted(results, key=lambda row: row["period"]),
              "all_period_complete": complete,
              "all_period_full_gate": all_pass,
              "candidate_count": 0,
              "trader_certified": False,
              "next_phase": (
                  "BUILD_CAUSAL_EPISODE_WORLD_MODEL_FROM_RESERVE_RELIEF_PATHS"
                  if all_pass
                  else (
                      "RICHER_EPISODE_SEARCH_WORLD_MODEL_REQUIRED"
                      if complete
                      else "RESUME_DISTRIBUTED_CHECKPOINT_RUNNER"
                  )
              ),
          }
          Path("aggregate").mkdir()
          out = Path("aggregate") / (
              "capitalizer-v2-distributed-checkpoint-runner-v1-aggregate.json"
          )
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          print(json.dumps(payload, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v2-distributed-checkpoint-runner-v1-aggregate-${{ github.sha }}
          path: aggregate
          if-no-files-found: error
          retention-days: 90
