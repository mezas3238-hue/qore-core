name: QORE Capitalizer Dual Head Severe Descent Control V26

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-dual-head-severe-descent-control-v26-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  V21_RUN_ID: '36264229554'
  V21_ARTIFACT_SHA: '05452328bbf5cbbc4b26210791d13114105e3f9d'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_dual_head_severe_descent_control_v26.py \
            tests/infrastructure/trader_lab/test_capitalizer_dual_head_severe_descent_control_v26.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_dual_head_severe_descent_control_v26.py \
            tests/infrastructure/trader_lab/test_capitalizer_dual_head_severe_descent_control_v26.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_dual_head_severe_descent_control_v26.py

  aggregate:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download authoritative V21 reconstructed evidence
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v21-reconstructed-*-${{ env.V21_ARTIFACT_SHA }}
          path: reconstructed
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ env.V21_RUN_ID }}
      - name: Run V26 dual-head severe-descent control
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_dual_head_severe_descent_control_v26 \
            reconstructed/development-input \
            reconstructed/validation-input \
            reconstructed/reserved-input \
            reconstructed/development-validation-context \
            reconstructed/reserved-context \
            reconstructed/v21-evidence \
            experiment-output
      - name: Enforce V26 contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "experiment-output/"
                  "capitalizer-dual-head-severe-descent-control-v26.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_DUAL_HEAD_SEVERE_DESCENT_CONTROL_V26"
          )
          assert report["evaluation"] == (
              "DUAL_HEAD_CONTINUATION_AND_SEVERE_DESCENT"
          )
          assert report["policy"] == (
              "INVALIDATING_POSBOTH_SEVEREBOTH_P2"
          )
          assert report["severe_drawdown_training_threshold_r"] == "4"
          assert report["severe_class_boundary"] == "0.5"
          assert report["persistence_required"] == 2
          assert report["l2_prior_strength_effective_trades"] == "12.0"
          assert report["severe_label_excludes_post_trough_recovery"] is True
          assert len(report["dynamic_portfolio_features"]) == 7
          assert report["all_entries_preserved"] is True
          assert report["density_retention"] == "1"
          assert report["fixed_target_r"] == "2.00"
          assert report["original_stop_geometry_preserved"] is True
          assert report["max3_preserved"] is True
          assert report["current_outcome_visible_to_decision"] is False
          assert report["future_bars_visible_to_decision"] is False
          assert report["heldout_severe_label_visible_to_inference"] is False
          assert report[
              "heldout_continuation_label_visible_to_inference"
          ] is False
          assert report["open_peer_outcome_visible_to_inference"] is False
          assert report["dynamic_features_use_closed_outcomes_only"] is True
          assert report["historical_fresh_oos_available"] is False
          assert report["2018_2020_status"] == "CONSUMED_NOT_FRESH"
          assert report["trader_certified"] is False

          control = next(
              row for row in report["results"]
              if row["policy"] == "SURFACE_CONTROL"
          )
          expected = {
              "DEVELOPMENT_2024_2026": (
                  948, "6.214605199866807668753081488"
              ),
              "CONSUMED_VALIDATION_2022_2024": (
                  1034, "6.770051846347247537620893924"
              ),
              "CONSUMED_RESERVED_2020_2022": (
                  1088, "8.74798816650617431130479348"
              ),
          }
          for period, (trades, dd) in expected.items():
              row = control["heldouts"][period]
              assert row["trades"] == trades
              assert row["metrics"]["max_drawdown_r"] == dd

          for diagnostics in report["model_diagnostics"].values():
              assert diagnostics["severe_descent_trade_count"] > 0
              assert diagnostics["severe_episode_count"] > 0
              assert diagnostics["continuation_model"]["feature_dimension"] > 74
              assert diagnostics["severe_model"]["feature_dimension"] > 74

          print(json.dumps(report, sort_keys=True))
          PY
      - name: Upload V26 evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-dual-head-severe-descent-control-v26-${{ github.sha }}
          path: experiment-output
          if-no-files-found: error
          retention-days: 90
