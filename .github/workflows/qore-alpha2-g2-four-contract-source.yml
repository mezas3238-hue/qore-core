name: QORE Alpha2 G2 P0 four canonical current DEMO contract primitives SOURCE
on:
  push:
    branches: ['research/qore-alpha2-original-intermarket-propagation-20261012']
    paths:
      - '.github/workflows/qore-alpha2-g2-four-contract-source.yml'
      - 'src/qore/research/alpha2_g2_four_broker_contract_primitives.py'
      - 'tests/research/test_alpha2_g2_four_broker_contract_primitives.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alpha2-g2-four-demo-contract-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact_four_and_alias_contract_synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . 'pytest>=8,<9' 'ruff>=0.5,<1'
      - name: Freeze four contract current source query and strict deny order/refresh
        run: |
          git merge-base --is-ancestor 4f2372d4cb96fe40a51c642d27d9ff56131bb190 "$GITHUB_SHA"
          test -s docs/research/QORE_ALPHA2_G2_P0_FOUR_SYMBOL_DEMO_CONTRACT_PRIMITIVES_PREREG_2026-10-12.md
          ruff check src/qore/research/alpha2_g2_four_broker_contract_primitives.py tests/research/test_alpha2_g2_four_broker_contract_primitives.py
          pytest -q -o addopts='' tests/research/test_alpha2_g2_four_broker_contract_primitives.py
          ! grep -qE 'ProtoOANewOrderReq|ProtoOARefreshTokenReq|ProtoOAClosePositionReq|ProtoOAAmendOrderReq|ProtoOAGetTickDataReq' src/qore/research/alpha2_g2_four_broker_contract_primitives.py
  current_broker_four_contract_source_only:
    needs: exact_four_and_alias_contract_synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QORE_CTRADER_DEMO_CLIENT_ID: ${{ secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
      QORE_CTRADER_DEMO_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
      QORE_CTRADER_DEMO_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
      QORE_CTRADER_DEMO_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
      QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID }}
      QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET }}
      QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN }}
      QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore signed original read-only authenticated cTrader wrappers, runner-only
        run: |
          set -euo pipefail
          source_ref=ef69b1b6ea2dbbd689bc3e090f9581e15bbb7ad6
          git cat-file -t "$source_ref"
          for file in \
            src/qore/infrastructure/ctrader_demo_account_discovery.py \
            src/qore/infrastructure/trader_lab/cibo_market_atlas_10y_m5_consumer_v1.py \
            src/qore/infrastructure/trader_lab/cibo_market_atlas_10y_windowed_runtime_v1.py \
            src/qore/infrastructure/trader_lab/qore_native_universe_33_source_registry_v1.py \
            src/qore/infrastructure/trader_lab/qore_native_icmarkets_catalog_preflight_v1.py \
            src/qore/infrastructure/trader_lab/qore_native_icmarkets_missing_m5_capture_v1.py
          do
            git show "$source_ref:$file" > "$file"
            test "$(git hash-object "$file")" = "$(git rev-parse "$source_ref:$file")"
          done
          echo "CURRENT_DEMO_SPEC_READONLY_SOURCE_MODULES_PINNED"
      - name: Install SDK for source-only broker SymbolById requests
        run: python -m pip install -e '.[ctrader]'
      - name: Query exact 6 provider-name candidates, only original 4 canonical matrix, no execution
        run: |
          mkdir -p contract-source
          python -m qore.research.alpha2_g2_four_broker_contract_primitives contract-source
      - name: Emit execution and symbol details witness SHA even if provider blocked
        if: always()
        run: |
          mkdir -p contract-source
          printf '%s\n' "$GITHUB_SHA" > contract-source/exact-code-head-sha.txt
          (cd contract-source && sha256sum *.json exact-code-head-sha.txt 2>/dev/null > COMPLETE_SHA256SUMS.txt || true)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha2-g2-four-current-demo-broker-specs-NOT-HISTORICAL-${{ github.sha }}
          path: contract-source/
          retention-days: 90
          if-no-files-found: error
