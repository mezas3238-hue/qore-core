name: QORE VT31 NAS100 CORE Drawdown Forensics V1

on:
  push:
    branches:
      - agent/vt31-nas100-intelligence-pilot-001
    paths:
      - scripts/vt31_nas100_core_drawdown_forensics_v1.py
      - .github/workflows/vt31-nas100-core-drawdown-forensics-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
          - partition: r8_fresh
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and static gate
        run: |
          set -euo pipefail
          pip install -e ".[dev]"
          python -m py_compile \
            scripts/vt31_nas100_core_drawdown_forensics_v1.py
          ruff check \
            scripts/vt31_nas100_core_drawdown_forensics_v1.py

      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p evidence result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d evidence
          path="evidence/fresh/NAS100/market-evidence.json"
          test -f "$path"
          actual="$(sha256sum "$path" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"

      - name: Run CORE forensics
        run: |
          set -euo pipefail
          python scripts/vt31_nas100_core_drawdown_forensics_v1.py \
            evidence/fresh/NAS100/market-evidence.json \
            --partition "$PARTITION" \
            --output "result/core-forensics-${PARTITION}.json" \
            | tee result/summary.json

      - name: Governance gate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p=os.environ["PARTITION"]
          payload=json.loads(
              Path(f"result/core-forensics-{p}.json").read_text()
          )
          g=payload["governance"]
          assert payload["variant"]=="WAIT_1025_B060"
          assert payload["core_terminal_count"]>0
          assert g["groups_defined_without_terminal_pnl"] is True
          assert g["future_bars_used_for_grouping"] is False
          assert g["terminal_outcomes_evaluation_only"] is True
          assert g["loss_clusters_forensics_only"] is True
          assert g["policy_promoted"] is False
          assert g["opens_new_holdout"] is False
          PY

      - name: Bind result
        run: |
          set -euo pipefail
          echo "$GITHUB_SHA" > result/git-sha.txt
          echo "$ARTIFACT_ID" > result/source-evidence-artifact-id.txt
          (
            cd result
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )
          (cd result && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-core-forensics-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-nas100-core-forensics-*-${{ github.sha }}
          path: input
          merge-multiple: true

      - name: Aggregate cross-fold CORE associations
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from pathlib import Path

          folds={}
          for path in Path("input").glob("core-forensics-*.json"):
              p=json.loads(path.read_text())
              folds[p["partition"]]=p
          assert set(folds)=={"r5","r6","r8_fresh"}, folds.keys()

          rows=[]
          dimensions=sorted(
              next(iter(folds.values()))["by_dimension"]
          )
          for dimension in dimensions:
              keys=set.intersection(*[
                  set(p["by_dimension"][dimension])
                  for p in folds.values()
              ])
              for key in sorted(keys):
                  per={}
                  sufficient=True
                  positive=True
                  negative=True
                  for fold,p in sorted(folds.items()):
                      s=p["by_dimension"][dimension][key]
                      m=s["metrics"]
                      n=int(m["sample"])
                      mean=float(m["mean_r"])
                      pf=(
                          None
                          if m["profit_factor"] is None
                          else float(m["profit_factor"])
                      )
                      per[fold]={
                          "sample":n,
                          "mean_r":m["mean_r"],
                          "profit_factor":m["profit_factor"],
                          "max_drawdown_r":m["max_drawdown_r"],
                          "loss_rate":s["loss_rate"],
                      }
                      sufficient=sufficient and n>=4
                      positive=(
                          positive and mean>0
                          and pf is not None and pf>=1.20
                      )
                      negative=(
                          negative and mean<0
                          and pf is not None and pf<1.0
                      )
                  if not sufficient:
                      status="SPARSE"
                  elif positive:
                      status="CONSISTENT_POSITIVE_ASSOCIATION"
                  elif negative:
                      status="CONSISTENT_NEGATIVE_ASSOCIATION"
                  else:
                      status="MIXED_OR_UNSTABLE"
                  rows.append({
                      "dimension":dimension,
                      "structural_key":key,
                      "status":status,
                      "folds":per,
                      "runtime_rule_authorized":False,
                  })

          report={
              "schema":(
                  "qore.vt31.nas100."
                  "core_drawdown_forensics.aggregate.v1"
              ),
              "variant":"WAIT_1025_B060",
              "fold_summary":{
                  fold:{
                      "core_terminal_count":p["core_terminal_count"],
                      "core_summary":p["core_summary"],
                      "loss_cluster_count":len(
                          p["loss_clusters_min_2"]
                      ),
                  }
                  for fold,p in sorted(folds.items())
              },
              "associations":rows,
              "consistent_positive_count":sum(
                  r["status"]=="CONSISTENT_POSITIVE_ASSOCIATION"
                  for r in rows
              ),
              "consistent_negative_count":sum(
                  r["status"]=="CONSISTENT_NEGATIVE_ASSOCIATION"
                  for r in rows
              ),
              "policy_promoted":False,
              "opens_new_holdout":False,
          }
          Path("result/aggregate.json").write_text(
              json.dumps(report,sort_keys=True,indent=2)+"\n"
          )
          print(json.dumps(report,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-core-forensics-aggregate-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
