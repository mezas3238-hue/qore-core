name: VT08 B Independent A 488 Real M15 Lineage

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vt08-5m-cognition-replay-20261010
    paths:
      - src/qore/infrastructure/trader_lab/vt08_5m_b_independent_real_lineage_audit_v1.py
      - tests/infrastructure/trader_lab/test_vt08_5m_b_independent_real_lineage_audit_v1.py
      - .github/workflows/vt08-cognitive-5m-real-a-lineage-independent.yml

permissions:
  contents: read
  actions: read

jobs:
  independent-m15-source-audit:
    name: "B independent 488 A-event M15 provenance"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Isolated verifier static and synthetic tests
        run: |
          ruff check src/qore/infrastructure/trader_lab/vt08_5m_b_independent_real_lineage_audit_v1.py tests/infrastructure/trader_lab/test_vt08_5m_b_independent_real_lineage_audit_v1.py
          mypy src/qore/infrastructure/trader_lab/vt08_5m_b_independent_real_lineage_audit_v1.py
          pytest -q tests/infrastructure/trader_lab/test_vt08_5m_b_independent_real_lineage_audit_v1.py
      # Frozen method A run 38079270152 / exact software SHA b4c7b2df...
      # This is an independent B consumer; never follow branch A mutable HEAD.
      - name: Download five ORIGINAL A CandidateEvent lineage packages
        uses: actions/download-artifact@v4
        with:
          repository: mezas3238-hue/qore-core
          run-id: 38079270152
          github-token: ${{ github.token }}
          pattern: vt08-a-b01-real-candidate-lineage-*-b4c7b2df356e1df81bfcf66c810ee1cc794d61e4
          merge-multiple: false
          path: a-packages
      - name: Download five ORIGINAL consumed 1095D M15 evidence packages
        uses: actions/download-artifact@v4
        with:
          repository: mezas3238-hue/qore-core
          run-id: 35934924907
          github-token: ${{ github.token }}
          pattern: qore-vt08-cognitive-5m-fresh-*-b2d33e1b4829d8b4afc76983decca8a99131403c
          merge-multiple: false
          path: m15-packages
      - name: Reconcile exactly five market package pairs, no substitutable inputs
        run: |
          python - <<'PY'
          from pathlib import Path
          from shutil import copyfile
          root = Path("evidence-for-b")
          symbols = ("EURJPY", "USDCHF", "NZDUSD", "CADJPY", "USDCAD")
          for market in symbols:
              ap = Path("a-packages") / f"vt08-a-b01-real-candidate-lineage-{market}-b4c7b2df356e1df81bfcf66c810ee1cc794d61e4" / f"{market}-candidate-lineage-full.json"
              sp = Path("m15-packages") / f"qore-vt08-cognitive-5m-fresh-{market}-b2d33e1b4829d8b4afc76983decca8a99131403c" / "market-evidence-1095d.json"
              for source, dest in (
                  (ap, root / "candidates" / market / ap.name),
                  (sp, root / "source" / market / sp.name),
              ):
                  if not source.is_file():
                      raise ValueError(f"Missing immutable evidence package: {source}")
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  copyfile(source, dest)
          assert len(list(root.rglob("*.json"))) == 10, "exactly ten immutable source files"
          PY
      - name: Independent B as-of M15 and cognitive-readiness audit of all 488
        run: |
          python -m qore.infrastructure.trader_lab.vt08_5m_b_independent_real_lineage_audit_v1 \
            --artifacts-root evidence-for-b \
            --output artifacts/b-vt08-5m-488-real-lineage-readiness-audit.json
      - name: Publish full independent cognitive readiness and source report
        uses: actions/upload-artifact@v4
        with:
          name: vt08-b-488-real-source-lineage-independent-${{ github.sha }}
          path: artifacts/b-vt08-5m-488-real-lineage-readiness-audit.json
          if-no-files-found: error
          retention-days: 30
