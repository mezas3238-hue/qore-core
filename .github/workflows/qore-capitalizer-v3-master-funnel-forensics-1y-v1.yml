name: QORE Capitalizer V3 Master Funnel Forensics 1Y V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-v3-master-funnel-forensics-1y-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v3_master_funnel_forensics_1y_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v3_master_funnel_forensics_1y_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-v3-master-funnel-forensics-1y-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_v3_master_funnel_forensics_1y_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_v3_master_funnel_forensics_1y_v1.py
      - name: Mypy
        run: |
          mypy src/qore/infrastructure/trader_lab/capitalizer_v3_master_funnel_forensics_1y_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_v3_master_funnel_forensics_1y_v1.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {symbol: USDJPY, session: ASIA}
          - {symbol: AUDJPY, session: ASIA}
          - {symbol: AUDUSD, session: ASIA}
          - {symbol: GBPJPY, session: ASIA}
          - {symbol: EURUSD, session: LONDON}
          - {symbol: GBPUSD, session: LONDON}
          - {symbol: XAUUSD, session: NEW_YORK}
          - {symbol: USDCAD, session: NEW_YORK}
          - {symbol: NAS100, session: NEW_YORK}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable native-M1 clone
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Run frozen master funnel forensics
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v3_master_funnel_forensics_1y_v1 \
            market m1-source replay-output --session ${{ matrix.session }}
      - name: Enforce diagnostic boundary
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
          EXPECTED_SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"]
          path = Path("replay-output") / (
              f"capitalizer-{symbol.lower()}-v3-master-funnel-forensics-1y-v1.json"
          )
          report = json.loads(path.read_text())
          assert report["identity"] == "QORE_CAPITALIZER_V3_MASTER_FUNNEL_FORENSICS_1Y_V1"
          assert report["symbol"] == symbol
          assert report["session"] == os.environ["EXPECTED_SESSION"]
          assert report["diagnostic_only"] is True
          assert report["strategy_mutated"] is False
          assert report["v3_thresholds_mutated"] is False
          assert report["entry_trigger_mutated"] is False
          assert report["outcome_used_for_admission"] is False
          assert report["portfolio_max3_applied_only_in_aggregate"] is True
          assert report["max3_is_ceiling_not_quota"] is True
          assert report["fresh_holdout_claimed"] is False
          assert report["economic_candidate"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v3-master-funnel-forensics-1y-v1-${{ matrix.symbol }}-${{ github.sha }}
          path: replay-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v3-master-funnel-forensics-1y-v1-*-${{ github.sha }}
          path: replay-input
          merge-multiple: false
      - name: Build nine-market forensic matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v3_master_funnel_forensics_1y_v1 \
            matrix replay-input matrix-output
      - name: Enforce aggregate controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "matrix-output/"
              "capitalizer-nine-market-v3-master-funnel-forensics-1y-v1.json"
          )
          report = json.loads(path.read_text())
          assert report["identity"] == (
              "QORE_CAPITALIZER_NINE_MARKET_V3_MASTER_FUNNEL_FORENSICS_1Y_V1"
          )
          assert report["architecture"] == (
              "V3_FROZEN_DIAGNOSTIC_ONLY_POST_MSS_TO_FVG_FILL"
          )
          assert report["market_count"] == 9
          assert report["assigned_session_count"] == 3
          assert report["assigned_market_session_pairs"] == 9
          assert report["v3_control_reproduced"] is True
          assert report["d1_control_reproduced"] is True
          assert report["v3_max3_metrics"]["trades"] == 226
          assert report["d1_overlay_max3_trades"] == 398
          assert report["diagnostic_only"] is True
          assert report["strategy_mutated"] is False
          assert report["thresholds_mutated"] is False
          assert report["outcome_used_for_admission"] is False
          assert report["cross_session_expansion_used"] is False
          assert report["assigned_killzones_preserved"] is True
          assert report["fresh_holdout_claimed"] is False
          assert report["economic_candidate"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-nine-market-v3-master-funnel-forensics-1y-v1-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
