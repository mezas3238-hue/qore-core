name: QORE Shared WP04 Invariant Representation V2

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - src/qore/infrastructure/core_stack_v2/representation_invariance_v2.py
      - scripts/shared_wp04_invariant_representation_v2.py
      - tests/infrastructure/test_core_stack_v2_representation_invariance_v2.py
      - .github/workflows/qore-shared-wp04-invariant-representation-v2.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  invariant-representation-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Announce WP04 V2 development run
        run: |
          gh issue comment 642 --body "WP-04 V2 source-only invariance run started — Git SHA \`${GITHUB_SHA}\`, GitHub Actions run \`${GITHUB_RUN_ID}\`. R8/R6/R5 are consumed development evidence only; no fresh holdout or runtime mutation."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Shared
        run: pip install -e ".[dev]"

      - name: Static and adversarial contract validation
        run: |
          ruff check \
            src/qore/infrastructure/core_stack_v2/representation_invariance_v2.py \
            scripts/shared_wp04_invariant_representation_v2.py \
            tests/infrastructure/test_core_stack_v2_representation_invariance_v2.py
          python -m py_compile \
            src/qore/infrastructure/core_stack_v2/representation_invariance_v2.py \
            scripts/shared_wp04_invariant_representation_v2.py
          pytest -q \
            tests/infrastructure/test_core_stack_v2_representation_invariance_v2.py

      - name: Recover immutable consumed R8 R6 R5 market evidence
        run: |
          set -euo pipefail
          mkdir -p input/r8 input/r6 input/r5 result

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10402199719/zip" > r8.zip
          unzip -q r8.zip -d input/r8
          (cd input/r8 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10389112524/zip" > r6.zip
          unzip -q r6.zip -d input/r6
          (cd input/r6 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10380044761/zip" > r5.zip
          unzip -q r5.zip -d input/r5
          (cd input/r5 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

      - name: Run source-only invariant representation V2
        run: |
          python scripts/shared_wp04_invariant_representation_v2.py \
            --r8-nas input/r8/fresh/NAS100/market-evidence.json \
            --r8-sp input/r8/fresh/SP500/market-evidence.json \
            --r8-us input/r8/fresh/US30/market-evidence.json \
            --r6-nas input/r6/fresh/NAS100/market-evidence.json \
            --r6-sp input/r6/fresh/SP500/market-evidence.json \
            --r6-us input/r6/fresh/US30/market-evidence.json \
            --r5-nas input/r5/fresh/NAS100/market-evidence.json \
            --r5-sp input/r5/fresh/SP500/market-evidence.json \
            --r5-us input/r5/fresh/US30/market-evidence.json \
            --output result/wp04-invariant-representation-v2.json \
            | tee result/summary.json

      - name: Validate source-only scientific protocol
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(
              Path("result/wp04-invariant-representation-v2.json").read_text()
          )
          assert p["protocol_pass"] is True
          assert p["exit_gate_pass"] is False
          assert p["status"] in {
              "WP04_V2_SOURCE_INVARIANCE_FROZEN_FOR_PROBE",
              "WP04_V2_SOURCE_INVARIANCE_FALSIFIED",
          }

          for partition in ("r8", "r6", "r5"):
              assert p["source_episode_counts"][partition] >= 7000
              assert p["source_ranges"][partition]["source_min"] is not None
              assert p["source_ranges"][partition]["source_max"] is not None

          model = p["model"]
          assert model["discovery_partition"] == "r8"
          assert model["development_partitions"] == ["r6", "r5"]
          assert model["feature_count"] >= 50
          assert model["ontology_count"] >= 10
          assert model["candidate_count"] >= model["selected_concept_count"]
          assert (
              model["rejected_candidate_count"]
              == model["candidate_count"] - model["selected_concept_count"]
          )
          for concept in model["concepts"]:
              assert concept["source_invariance_bps"] >= 0
              for diagnostic in concept["diagnostics"]:
                  assert diagnostic["passes"] is True

          g = p["governance"]
          assert g["development_evidence_consumed"] is True
          assert g["future_target_labels_used"] is False
          assert g["trade_outcomes_used"] is False
          assert g["trade_pnl_used"] is False
          assert g["symbol_identity_feature_used"] is False
          assert g["partition_identity_feature_used"] is False
          assert g["target_aware_component_selection"] is False
          assert g["fresh_holdout_opened"] is False
          assert g["fresh_holdout_required_after_probe_freeze"] is True
          assert g["global_qore_validation_still_required"] is True
          assert g["lab_surface_only_not_global_completion"] is True
          assert g["knowledge_auto_promotion"] is False
          assert g["shared_methodology_authority"] is False
          assert g["shared_sizing_authority"] is False
          assert g["shared_risk_authority"] is False
          assert g["shared_order_authority"] is False
          assert g["shared_execution_authority"] is False
          assert g["live_authorized"] is False
          assert g["production_authorized"] is False
          assert g["real_capital_authorized"] is False
          assert g["merge_authorized"] is False
          PY

      - name: Bind result
        run: |
          echo "${GITHUB_SHA}" > result/git-sha.txt
          (
            cd result
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-wp04-invariant-representation-v2-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Report WP04 V2 source-invariance result
        if: always()
        run: |
          if [ ! -f result/wp04-invariant-representation-v2.json ]; then
            gh issue comment 642 --body "WP-04 V2 run \`${GITHUB_RUN_ID}\` did not produce a scientific payload. Inspect workflow failure before any further WP-04 change."
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = json.loads(
              Path("result/wp04-invariant-representation-v2.json").read_text()
          )
          model = p.get("model", {})
          concepts = model.get("concepts", [])
          lines = [
              "## WP-04 V2 source-only invariance result",
              "",
              f"- Git SHA: \`{os.environ['GITHUB_SHA']}\`",
              f"- GitHub Actions run: \`{os.environ['GITHUB_RUN_ID']}\`",
              f"- status: **{p['status']}**",
              f"- protocol_pass: **{p['protocol_pass']}**",
              f"- representation_frozen_for_probe: **{p.get('representation_frozen_for_probe', False)}**",
              f"- candidate residual concepts: {model.get('candidate_count', 0)}",
              f"- selected invariant concepts: {model.get('selected_concept_count', 0)}",
              f"- rejected partition-specific candidates: {model.get('rejected_candidate_count', 0)}",
              f"- sequence features: {model.get('feature_count', 0)}",
              f"- ontology dimensions: {model.get('ontology_count', 0)}",
              "- R8/R6/R5 role: **consumed source-only development**",
              "- future target labels used: **False**",
              "- trade outcome/PnL used: **False**",
              "- identity shortcut used: **False**",
              "- fresh holdout opened: **False**",
              "- global QORE completion claimed: **False**",
              "",
              "Selected concept invariance:",
          ]
          if concepts:
              for concept in concepts:
                  diagnostics = ", ".join(
                      (
                          f"{item['partition']}:align="
                          f"{item['loading_alignment_bps']}bps,"
                          f"scale={item['activation_scale_ratio_milli']/1000:.3f},"
                          f"median_shift="
                          f"{item['activation_median_shift_milli_scale']/1000:.3f}"
                      )
                      for item in concept["diagnostics"]
                  )
                  lines.append(
                      f"- \`{concept['concept_id']}\` "
                      f"invariance={concept['source_invariance_bps']}bps; "
                      f"{diagnostics}"
                  )
          else:
              lines.append("- none; source invariance falsified the candidate set")

          lines.extend(
              [
                  "",
                  "This run cannot close WP-04. If a representation survives, "
                  "the next legal step is to freeze the incremental-information "
                  "probe on consumed development evidence and only then open an "
                  "independent one-shot holdout.",
              ]
          )
          Path("result/wp04-v2-issue-update.md").write_text(
              "\n".join(lines) + "\n"
          )
          PY
          gh issue comment 642 --body-file result/wp04-v2-issue-update.md
