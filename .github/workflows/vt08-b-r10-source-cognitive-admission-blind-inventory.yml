name: VT08 B R10 Native-Source Cognitive Admission Blind Inventory

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vt08-5m-cognition-replay-20261010
    paths:
      - src/qore/infrastructure/trader_lab/vt08_b_r10_blind_cognitive_admission_inventory_v1.py
      - tests/infrastructure/trader_lab/test_vt08_b_r10_blind_cognitive_admission_inventory_v1.py
      - .github/workflows/vt08-b-r10-source-cognitive-admission-blind-inventory.yml

permissions:
  contents: read
  actions: read

jobs:
  blind-five-market-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        market: [EURJPY, USDCHF, NZDUSD, CADJPY, USDCAD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Reject forged cognitive admission and unaudited PnL
        run: |
          ruff check src/qore/infrastructure/trader_lab/vt08_b_r10_blind_cognitive_admission_inventory_v1.py tests/infrastructure/trader_lab/test_vt08_b_r10_blind_cognitive_admission_inventory_v1.py
          pytest -q tests/infrastructure/trader_lab/test_vt08_b_r10_blind_cognitive_admission_inventory_v1.py
      - uses: actions/download-artifact@v4
        with:
          name: vt08-a-blind-three-source-${{ matrix.market }}-385e89cb769eef36f85ddca56f3f3dcaf1e0f863
          path: a-r7/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 38765076497
      - name: All events and all 27 fields remain blocked until genuine semantic reviews
        env:
          MARKET: ${{ matrix.market }}
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json, os
          from pathlib import Path
          from qore.infrastructure.trader_lab.vt08_b_r10_blind_cognitive_admission_inventory_v1 import (
              audit_blind_cognitive_admission,
          )
          market = os.environ["MARKET"]
          expect = {"EURJPY":538, "USDCHF":518, "NZDUSD":550, "CADJPY":516, "USDCAD":535}
          source_hash = {
            "EURJPY":"65718734b9120ca6cefbf17800e0ecb5dcfc5a6c17421753f3879003314c6c69",
            "USDCHF":"ac9457ca757e9253ae8bff37a29ef1be7742e3797a19c00f613efe08ed24eb6d",
            "NZDUSD":"6bbd8e9e6947e8979d69aa3d078274dfda401f50e75f6fe64bd00c282eebaa4b",
            "CADJPY":"db91a50305127ea9bcf88cd3e7bb178eb6d932e53b7c1f462fa56d734dfd7279",
            "USDCAD":"7875e7f0a8ed27d1b969f5437938636522739946f7757f5b525328212116e58a",
          }
          source=list(Path("a-r7",market).rglob(market+"-three-source-blind-review.json"))
          if len(source)!=1:
              raise SystemExit("R10 requires one pinned A R7 physical source")
          report=json.loads(source[0].read_text(encoding="utf-8"))
          inventory=audit_blind_cognitive_admission(report,expected_market=market)
          if inventory["frozen_source_report_sha256"]!=source_hash[market]:
              raise SystemExit("R10 A R7 canonical source hash drift")
          if inventory["cases_review_queued"]!=expect[market]:
              raise SystemExit("R10 hidden subset of full census")
          if inventory["unverified_cognitive_field_instances"]!=27*expect[market]:
              raise SystemExit("R10 unjustified cognitive-source receipt")
          if inventory["cognitive_admissions"] or inventory["verified_fills"]:
              raise SystemExit("R10 cannot admit unproven methodological geometry")
          path=Path("evidence",market+"-B-R10-blind-review-queue.json")
          path.write_text(json.dumps(inventory,sort_keys=True,separators=(",",":"),allow_nan=False))
          print(json.dumps({k:v for k,v in inventory.items() if k!="review_queue"},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vt08-b-r10-blind-cognitive-review-${{ matrix.market }}-${{ github.sha }}
          path: evidence/*.json
          retention-days: 30
          if-no-files-found: error
