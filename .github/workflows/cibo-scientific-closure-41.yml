name: QORE CIBO Scientific Closure 41

on:
  push:
    branches:
      - 'agent/cibo-scientific-closure-41-001'
    paths:
      - '.github/workflows/cibo-scientific-closure-41.yml'
      - 'src/qore/infrastructure/cibo_scientific_closure_41.py'
      - 'src/qore/infrastructure/cibo_scientific_closure_41_adapters.py'
      - 'scripts/cibo_scientific_closure_41_semantic_gate.py'
      - 'tests/infrastructure/test_cibo_scientific_closure_41.py'
      - 'tests/infrastructure/test_cibo_scientific_closure_41_adapters.py'
      - 'docs/research/CIBO-MASTER-OPEN-WORK-LEDGER-V1.json'
  pull_request:
    branches:
      - 'agent/cibo-integrator-ab-001'
    paths:
      - '.github/workflows/cibo-scientific-closure-41.yml'
      - 'src/qore/infrastructure/cibo_scientific_closure_41.py'
      - 'src/qore/infrastructure/cibo_scientific_closure_41_adapters.py'
      - 'scripts/cibo_scientific_closure_41_semantic_gate.py'
      - 'tests/infrastructure/test_cibo_scientific_closure_41.py'
      - 'tests/infrastructure/test_cibo_scientific_closure_41_adapters.py'
      - 'docs/research/CIBO-MASTER-OPEN-WORK-LEDGER-V1.json'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  scientific-closure-41:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Scientific closure 41 contract
        run: |
          ruff check \
            src/qore/infrastructure/cibo_scientific_closure_41.py \
            src/qore/infrastructure/cibo_scientific_closure_41_adapters.py \
            scripts/cibo_scientific_closure_41_semantic_gate.py \
            tests/infrastructure/test_cibo_scientific_closure_41.py \
            tests/infrastructure/test_cibo_scientific_closure_41_adapters.py
          mypy \
            src/qore/infrastructure/cibo_scientific_closure_41.py \
            src/qore/infrastructure/cibo_scientific_closure_41_adapters.py \
            scripts/cibo_scientific_closure_41_semantic_gate.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_scientific_closure_41.py \
            tests/infrastructure/test_cibo_scientific_closure_41_adapters.py
          python scripts/cibo_scientific_closure_41_semantic_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: cibo-scientific-closure-41-semantic-gate
          path: artifacts/cibo_scientific_closure_41_semantic_gate_v1.json
