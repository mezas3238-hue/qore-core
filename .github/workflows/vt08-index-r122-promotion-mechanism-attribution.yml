name: VT08 Index R122 Promotion Mechanism Attribution

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r122-promotion-mechanism-attribution.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r122_promotion_mechanism_attribution.py
      - tests/infrastructure/trader_lab/test_vt08_index_r122_promotion_mechanism_attribution.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r122_promotion_mechanism_attribution.py

  attribution:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R122 promotion-mechanism attribution
        run: |
          mkdir -p artifacts/report
          python -m qore.infrastructure.trader_lab.vt08_index_r122_promotion_mechanism_attribution \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r122-promotion-mechanism-attribution.json

      - name: Verify R122 frozen attribution contract
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/"
                  "vt08-index-r122-promotion-mechanism-attribution.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R122_R121_PROMOTION_MECHANISM_ATTRIBUTION_001"
          )
          assert report["source_r121"]["run_id"] == 36053069732
          assert report["source_r121"]["artifact_id"] == 10831129600
          assert report["source_r121"]["artifact_digest"] == (
              "sha256:583bbb93fbdf536565edcc234fdfff41"
              "8282968686422f7291645d0bd94823e5"
          )

          expected = {
              "five_year": (2448, 504, 33, "2.89775000000000000000000000"),
              "recent_two_year": (
                  1017, 178, 7, "1.213000000000000000000000000"
              ),
              "r66_failed_holdout": (
                  773, 149, 10, "-0.5375234741784037558685446009"
              ),
          }
          for key, (sample, cohort, promoted, secondary_delta) in (
              expected.items()
          ):
              section = report[key]
              assert section["canonical_sample"] == sample
              assert section["r120_cohort_sample"] == cohort
              assert section["cohort_requested_promotion_count"] == promoted
              assert section["effective_changed_trade_count"] >= promoted
              observed = Decimal(
                  section["incremental"]["secondary"][
                      "total_incremental_r"
                  ]
              )
              assert abs(observed - Decimal(secondary_delta)) <= Decimal(
                  "1e-24"
              )
              assert section["reconciliation"]["pass"] is True

          gov = report["governance"]
          assert gov["research_only"] is True
          assert gov["forensics_only"] is True
          assert gov["policy_changed"] is False
          assert gov["signals_suppressed"] is False
          assert gov["risk_changed"] is False
          assert gov["candidate_created"] is False
          assert gov["live_authorized"] is False
          assert gov["real_capital_authorized"] is False
          assert gov["production_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r122-promotion-mechanism-attribution-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
