name: QORE VT31 Market Native Momentum Swing Protection V1

on:
  push:
    branches:
      - agent/vt31-edge-position-cert-b-001
    paths:
      - scripts/vt31_nas100_market_native_momentum_swing_protection_v1.py
      - .github/workflows/vt31-market-native-momentum-swing-protection-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Static gate
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_market_native_momentum_swing_protection_v1.py
          ruff check scripts/vt31_nas100_market_native_momentum_swing_protection_v1.py
      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"
      - name: Run momentum swing frontier
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python scripts/vt31_nas100_market_native_momentum_swing_protection_v1.py             "input/${EVIDENCE_PATH}"             --output "result/momentum-swing-${PARTITION}.json"             | tee "result/summary-${PARTITION}.json"
      - name: Governance gate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=os.environ["PARTITION"]
          payload=json.loads(Path(f"result/momentum-swing-{p}.json").read_text())
          g=payload["governance"]
          assert g["trade_admission_changed"] is False
          assert g["entry_changed"] is False
          assert g["primary_structural_target_changed"] is False
          assert g["runtime_r_decision_authority"] is False
          assert g["runtime_volume_decision_authority"] is False
          assert g["position_sizing_used"] is False
          assert g["leverage_used"] is False
          assert g["compounding_used"] is False
          assert g["capital_weighting_used"] is False
          assert g["fixed_profit_threshold_used"] is False
          assert g["fresh_holdout_opened"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-momentum-swing-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-momentum-swing-*-${{ github.sha }}
          path: input
          merge-multiple: true
      - name: Adjudicate
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path
          folds=("r5","r6","r8","consumed")
          variants=("MOMENTUM_SWING_ONCE","RELOSS_MOMENTUM_SWING_ONCE")
          def d(x): return Decimal(str(x))
          payloads={f:json.loads(Path(f"input/momentum-swing-{f}.json").read_text()) for f in folds}
          result={}
          for v in variants:
              fold_rows={}
              for f in folds:
                  b=payloads[f]["variants"]["BASELINE"]["stress_0_05r"]
                  c=payloads[f]["variants"][v]["stress_0_05r"]
                  w=payloads[f]["variants"][v]["winner_preservation_vs_baseline"]
                  gates={
                      "pf_nondegrade":d(c["profit_factor"])>=d(b["profit_factor"]),
                      "mean_nondegrade":d(c["mean_r"])>=d(b["mean_r"]),
                      "dd_nondegrade":d(c["max_drawdown_r"])<=d(b["max_drawdown_r"]),
                      "winner_count_ge_80":d(w["winner_count_preservation"])>=d("0.80"),
                      "winner_r_ge_90":d(w["winner_r_preservation"])>=d("0.90"),
                  }
                  fold_rows[f]={
                      "baseline":b,
                      "candidate":c,
                      "winner_preservation":w,
                      "protection_armed_count":payloads[f]["variants"][v]["protection_armed_count"],
                      "gates":gates,
                      "passes":all(gates.values()),
                  }
              result[v]={
                  "folds":fold_rows,
                  "cross_fold_survivor":all(x["passes"] for x in fold_rows.values()),
              }
          out={
              "schema":"qore.vt31.nas100.market_native_momentum_swing.aggregate.v1",
              "head":"${{ github.sha }}",
              "variants":result,
              "survivors":[v for v in variants if result[v]["cross_fold_survivor"]],
              "governance":{
                  "runtime_r_decision_authority":False,
                  "runtime_volume_decision_authority":False,
                  "fresh_holdout_opened":False,
                  "policy_promoted":False,
              },
          }
          Path("aggregate.json").write_text(json.dumps(out,sort_keys=True,indent=2)+"\n")
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-momentum-swing-aggregate-${{ github.sha }}
          path: aggregate.json
          retention-days: 90
