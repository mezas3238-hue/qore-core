name: QORE VT31 London 3Y Fast M1 Coverage DST Probe V1

on:
  push:
    branches:
      - agent/vt31-architect-operations-cert-20261009
    paths:
      - scripts/vt31_nas100_3y_london_coverage_fast_probe_v1.py
      - .github/workflows/vt31-nas100-3y-london-coverage-fast-v1.yml
  workflow_dispatch:

concurrency:
  group: vt31-london-3y-coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  FROZEN_3Y_EVIDENCE_ID: "11459859004"

jobs:
  fast-london-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-test UK BST/GMT and streaming probe syntax
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_3y_london_coverage_fast_probe_v1.py
          python scripts/vt31_nas100_3y_london_coverage_fast_probe_v1.py --self-test
          python -m pip install 'ijson>=3.3,<4'

      - name: Restore same frozen 3Y NAS100 M1 evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FROZEN_3Y_EVIDENCE_ID}/zip" > frozen-3y-evidence.zip
          unzip -q frozen-3y-evidence.zip -d input
          test -s input/NAS100/market-evidence.json
          if [ -f input/EVIDENCE-SHA256SUMS ]; then
            (cd input && sha256sum -c EVIDENCE-SHA256SUMS)
          fi

      - name: Audit genuine Europe-London M1 hours and DST coverage
        run: |
          set -euo pipefail
          python scripts/vt31_nas100_3y_london_coverage_fast_probe_v1.py \
            --evidence input/NAS100/market-evidence.json \
            --output result/london-3y-m1-coverage-dst.json \
            | tee result/london-3y-m1-coverage-summary.json

      - name: Fail closed on false certification and data identity
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          x = json.loads(Path("result/london-3y-m1-coverage-dst.json").read_text())
          assert x["base_id"] == "VT31_NAS100_OWNER_3Y_BASE_001"
          assert x["session_model_id"] == "VT31_LONDON"
          assert x["timezone"] == "Europe/London"
          assert x["m1_bar_count"] > 0
          g = x["governance"]
          assert g["candidate_clock_windows_are_diagnostic_only"] is True
          assert g["london_trader_implemented"] is False
          assert g["london_certified"] is False
          assert g["ny_metrics_used_for_london_certification"] is False
          assert g["fresh_holdout_opened"] is False
          assert g["live_authorized"] is False
          PY

      - name: Bind exact source and evidence identity
        run: |
          set -euo pipefail
          echo "$GITHUB_SHA" > result/git-sha.txt
          echo "$FROZEN_3Y_EVIDENCE_ID" > result/evidence-artifact-id.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd result && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-london-3y-fast-coverage-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
