name: VT08 A CandidateEvent V1 Causal Contract

on:
  push:
    branches:
      - agent/vt08-5m-methodology-source-20261010
    paths:
      - .github/workflows/vt08-5m-architect-a-candidate-event-v1.yml
      - src/qore/infrastructure/trader_lab/vt08_5m_candidate_event_v1.py
      - tests/infrastructure/trader_lab/test_vt08_5m_candidate_event_v1.py
  pull_request:
    branches:
      - agent/vt08-cognitive-expansion-5m-v1-001
    paths:
      - .github/workflows/vt08-5m-architect-a-candidate-event-v1.yml
      - src/qore/infrastructure/trader_lab/vt08_5m_candidate_event_v1.py
      - tests/infrastructure/trader_lab/test_vt08_5m_candidate_event_v1.py

permissions:
  contents: read

jobs:
  causal-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QORE dev requirements
        run: pip install -e ".[dev]"
      - name: Compile and lint research-only boundary
        run: |
          python -m compileall -q src/qore/infrastructure/trader_lab/vt08_5m_candidate_event_v1.py
          ruff check src/qore/infrastructure/trader_lab/vt08_5m_candidate_event_v1.py tests/infrastructure/trader_lab/test_vt08_5m_candidate_event_v1.py
          ruff format --check src/qore/infrastructure/trader_lab/vt08_5m_candidate_event_v1.py tests/infrastructure/trader_lab/test_vt08_5m_candidate_event_v1.py
      - name: Golden and adversarial causality tests
        run: pytest -q tests/infrastructure/trader_lab/test_vt08_5m_candidate_event_v1.py
