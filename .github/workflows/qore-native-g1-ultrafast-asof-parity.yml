name: QORE Native G1 Ultra Fast BID ASK source replay exact parity only

on:
  push:
    branches:
      - research/qore-native-g1-ultrafast-asof-parity-20261012
    paths:
      - '.github/workflows/qore-native-g1-ultrafast-asof-parity.yml'
      - 'src/qore/infrastructure/trader_lab/qore_native_g1_ultrafast_asof_parity_v1.py'
      - 'tests/infrastructure/trader_lab/test_qore_native_g1_ultrafast_asof_parity_v1.py'
      - 'docs/research/QORE_NATIVE_G1_ULTRAFAST_ASOF_PARITY_PLAN_2026-10-12.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ultrafast_source_reference_parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install -e '.[dev]' 'numpy>=2,<3'
      - name: SHA and no-lookahead parity against canonical scalar reference
        run: |
          set -euo pipefail
          ruff check --select F,E4,E7,E9 src/qore/infrastructure/trader_lab/qore_native_g1_ultrafast_asof_parity_v1.py tests/infrastructure/trader_lab/test_qore_native_g1_ultrafast_asof_parity_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_qore_native_g1_pre_quote_source_gate_v1.py tests/infrastructure/trader_lab/test_qore_native_g1_pre_native_side_join_v1.py tests/infrastructure/trader_lab/test_qore_native_g1_ultrafast_asof_parity_v1.py
      - name: Benchmark cold synthetic 5000-side-event reference and accelerated path
        run: |
          set -euo pipefail
          mkdir -p ultra-fast-output
          python - <<'PY'
          import hashlib, json, sys, time
          from pathlib import Path
          sys.path.insert(0, "tests/infrastructure/trader_lab")
          from test_qore_native_g1_ultrafast_asof_parity_v1 import large_fixture
          from qore.infrastructure.trader_lab import qore_native_g1_ultrafast_asof_parity_v1 as fast
          from qore.infrastructure.trader_lab import qore_native_g1_pre_native_side_join_v1 as reference
          source, bid, ask = large_fixture(5000)
          t0 = time.perf_counter()
          _, baseline = reference.join_historical(source, bid, ask)
          t1 = time.perf_counter()
          optimized = fast._fast_bytes(source, bid, ask)
          t2 = time.perf_counter()
          assert baseline == optimized, "FAIL_CLOSED_OPTIMIZATION_BYTES_DIFFER"
          doc = {
              "identity":"QORE_NATIVE_G1_ULTRAFAST_SYNTHETIC_PARITY_BENCH_V1",
              "dataset":"SYNTHETIC_5000_BID_5000_ASK",
              "paired_rows":len(baseline.splitlines()),
              "baseline_sha256":hashlib.sha256(baseline).hexdigest(),
              "fast_sha256":hashlib.sha256(optimized).hexdigest(),
              "byte_identical":True,
              "baseline_seconds":round(t1-t0,6),
              "fast_seconds":round(t2-t1,6),
              "ratio_reference_over_fast":round((t1-t0)/(t2-t1),3),
              "not_real_quotes":True,
              "no_PnL":True, "NET_authorized":False, "certified_traders":0,
          }
          path=Path("ultra-fast-output/synthetic-speed-parity-NOT-NET.json")
          path.write_text(json.dumps(doc,sort_keys=True,indent=2)+"\n")
          print(json.dumps(doc,sort_keys=True))
          PY
          printf '%s\n' "$GITHUB_SHA" > ultra-fast-output/code-head-sha.txt
          (cd ultra-fast-output && sha256sum *.json *.txt > RESULTS_SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-native-G1-ultra-fast-parity-only-${{ github.sha }}
          path: ultra-fast-output/
          retention-days: 90
          if-no-files-found: error
