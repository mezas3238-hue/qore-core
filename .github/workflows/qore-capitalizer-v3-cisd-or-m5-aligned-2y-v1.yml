name: QORE Capitalizer V3 CISD OR M5 Aligned 2Y V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-v3-cisd-or-m5-aligned-2y-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v3_cisd_or_m5_aligned_2y_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v3_cisd_or_m5_aligned_2y_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-v3-cisd-or-m5-aligned-2y-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'
  MICRO_RUN_ID: '35805397236'
  MICRO_SHA: 'e3be1ed5dda60ab3a53257287c9471ce247d2554'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_v3_cisd_or_m5_aligned_2y_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_v3_cisd_or_m5_aligned_2y_v1.py
      - name: Mypy
        run: mypy src/qore/infrastructure/trader_lab/capitalizer_v3_cisd_or_m5_aligned_2y_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_v3_cisd_or_m5_aligned_2y_v1.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {symbol: USDJPY, session: ASIA}
          - {symbol: AUDJPY, session: ASIA}
          - {symbol: AUDUSD, session: ASIA}
          - {symbol: GBPJPY, session: ASIA}
          - {symbol: EURUSD, session: LONDON}
          - {symbol: GBPUSD, session: LONDON}
          - {symbol: XAUUSD, session: NEW_YORK}
          - {symbol: USDCAD, session: NEW_YORK}
          - {symbol: NAS100, session: NEW_YORK}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable native-M1 clone
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Download frozen microstructure context
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-v3-m3-microstructure-context-2y-v1-${{ matrix.symbol }}-${{ env.MICRO_SHA }}
          path: micro-source
          github-token: ${{ github.token }}
          run-id: ${{ env.MICRO_RUN_ID }}
      - name: Run same-bar CISD OR M5 ALIGNED replay
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v3_cisd_or_m5_aligned_2y_v1 \
            market m1-source micro-source experiment-output --session ${{ matrix.session }}
      - name: Enforce experiment invariants
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
          EXPECTED_SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"]
          report = json.loads(
              (
                  Path("experiment-output")
                  / f"capitalizer-{symbol.lower()}-v3-cisd-or-m5-aligned-2y-v1.json"
              ).read_text()
          )
          assert report["identity"] == "QORE_CAPITALIZER_V3_CISD_OR_M5_ALIGNED_2Y_V1"
          assert report["symbol"] == symbol
          assert report["session"] == os.environ["EXPECTED_SESSION"]
          assert report["state_identity"] == "QORE_CAPITALIZER_V3_M5_DIRECTIONAL_STATE_V1"
          assert report["confirmation_counters"].get("M5_STATE_LOOKUP_MISSING", 0) == 0
          assert report["raw_trade_routes"].get("UNKNOWN", 0) == 0
          assert report["variant_only_change"] == "SAME_BAR_CISD_BREAK_OR_M5_ALIGNED"
          assert report["cisd_boundary_still_required"] is True
          assert report["swing_break_changed"] is False
          assert report["body_threshold_changed"] is False
          assert report["atr_threshold_changed"] is False
          assert report["fvg_changed"] is False
          assert report["stop_changed"] is False
          assert report["target_changed"] is False
          assert report["max3_changed"] is False
          assert report["outcome_used_for_admission"] is False
          assert report["experiment_role"] == "DENSITY_REDUNDANCY_TEST"
          assert report["economic_candidate"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v3-cisd-or-m5-aligned-2y-v1-${{ matrix.symbol }}-${{ github.sha }}
          path: experiment-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v3-cisd-or-m5-aligned-2y-v1-*-${{ github.sha }}
          path: experiment-input
          merge-multiple: false
      - name: Build nine-market density experiment
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v3_cisd_or_m5_aligned_2y_v1 \
            matrix experiment-input matrix-output
      - name: Enforce aggregate governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "matrix-output/"
                  "capitalizer-nine-market-v3-cisd-or-m5-aligned-2y-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_NINE_MARKET_V3_CISD_OR_M5_ALIGNED_2Y_V1"
          )
          assert report["market_count"] == 9
          assert report["baseline_max3_trades"] == 474
          assert report["clean_same_bar_cisd_only"] == 1298
          assert report["clean_same_bar_cisd_only_aligned"] == 925
          assert report["confirmation_counters"].get("M5_STATE_LOOKUP_MISSING", 0) == 0
          assert report["max3_confirmation_routes"].get("UNKNOWN", 0) == 0
          assert report["variant_only_change"] == "SAME_BAR_CISD_BREAK_OR_M5_ALIGNED"
          assert report["cisd_boundary_still_required"] is True
          assert report["swing_break_changed"] is False
          assert report["body_threshold_changed"] is False
          assert report["atr_threshold_changed"] is False
          assert report["fvg_changed"] is False
          assert report["stop_changed"] is False
          assert report["target_changed"] is False
          assert report["max3_changed"] is False
          assert report["outcome_used_for_admission"] is False
          assert report["experiment_role"] == "DENSITY_REDUNDANCY_TEST"
          assert report["economic_candidate"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-nine-market-v3-cisd-or-m5-aligned-2y-v1-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
