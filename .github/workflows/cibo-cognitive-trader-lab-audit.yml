name: QORE CIBO Cognitive Trader Lab Audit\n\non:\n  push:\n    branches:\n      - agent/cibo-profitability-lab-001\n    paths:\n      - '.github/workflows/cibo-cognitive-trader-lab-audit.yml'\n      - 'scripts/cibo_cognitive_trader_lab_audit.py'\n      - 'docs/research/CIBO-COGNITIVE-TRADER-LAB-AUDIT-TRIGGER.json'\n      - 'src/qore/infrastructure/cibo_cognitive_*.py'\n      - 'src/qore/infrastructure/cibo_executive_*.py'\n      - 'src/qore/infrastructure/cibo/**'\n      - 'src/qore/infrastructure/trader_lab/**'\n      - 'src/qore/infrastructure/research_*.py'\n\npermissions:\n  contents: read\n  actions: read\n\njobs:\n  trader-lab-cognitive-audit:\n    runs-on: ubuntu-24.04\n    timeout-minutes: 45\n    env:\n      GH_TOKEN: ${{ github.token }}\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          ref: ${{ github.sha }}\n\n      - uses: actions/setup-python@v5\n        with:\n          python-version: '3.12'\n\n      - run: python -m pip install -e '.[dev]'\n\n      - name: Load governed audit source\n        shell: bash\n        run: |\n          set -euo pipefail\n          python - <<'PY' > "$RUNNER_TEMP/cognitive-audit.env"\n          import json\n          from pathlib import Path\n          p = json.loads(\n              Path("docs/research/CIBO-COGNITIVE-TRADER-LAB-AUDIT-TRIGGER.json")\n              .read_text(encoding="utf-8")\n          )\n          assert p["research_only"] is True\n          assert p["reused_holdout"] is True\n          assert p["certification_claimed"] is False\n          assert p["broker_mutation"] is False\n          assert p["live"] is False\n          assert p["real_capital"] is False\n          assert p["production"] is False\n          assert p["merge_authority"] is False\n          assert p["expected_traders"] == 7\n          print(f'SOURCE_ARTIFACT_ID={p["source_artifact_id"]}')\n          print(f'SOURCE_HEAD_SHA={p["source_head_sha"]}')\n          PY\n          cat "$RUNNER_TEMP/cognitive-audit.env" >> "$GITHUB_ENV"\n\n      - name: Recover retained seven-Trader laboratory artifact\n        shell: bash\n        run: |\n          set -euo pipefail\n          mkdir -p "$RUNNER_TEMP/source"\n          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" > "$RUNNER_TEMP/source.zip"\n          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/source"\n          test -s "$RUNNER_TEMP/source/decision-trace.json"\n          test -s "$RUNNER_TEMP/source/lab-result.json"\n          python - <<'PY'\n          import json, os\n          from pathlib import Path\n          root = Path(os.environ["RUNNER_TEMP"]) / "source"\n          trace = json.loads((root / "decision-trace.json").read_text(encoding="utf-8"))\n          rows = trace["opportunities"]\n          traders = {row["trader_id"] for row in rows}\n          assert len(rows) == 580\n          assert len(traders) == 7\n          assert trace["governance"]["broker_mutation"] is False\n          assert trace["governance"]["outcome_aware_tuning_used"] is False\n          PY\n\n      - name: Execute cognitive phases in Trader Lab\n        shell: bash\n        run: |\n          set -euo pipefail\n          mkdir -p "$RUNNER_TEMP/cognitive-trader-lab"\n          python scripts/cibo_cognitive_trader_lab_audit.py \\n            --decision-trace "$RUNNER_TEMP/source/decision-trace.json" \\n            --source-head "$SOURCE_HEAD_SHA" \\n            --output "$RUNNER_TEMP/cognitive-trader-lab/audit.json"\n\n      - name: Enforce audit-pass-by-execution\n        shell: bash\n        run: |\n          set -euo pipefail\n          python - <<'PY'\n          import json, os\n          from pathlib import Path\n          p = json.loads(\n              (Path(os.environ["RUNNER_TEMP"]) / "cognitive-trader-lab" / "audit.json")\n              .read_text(encoding="utf-8")\n          )\n          assert p["candidate_count"] == 7\n          assert p["phase_count"] == 18\n          assert p["all_phases_green"] is True\n          assert len(p["phases"]) == 18\n          assert all(x["status"] == "GREEN" for x in p["phases"])\n          assert all(x["all_7_traders_green"] is True for x in p["phases"])\n          assert all(x["outputs_consumed_by_next_phase"] is True for x in p["phases"])\n          assert all(\n              x["traders"][trader]["trader_lab_candidate"] is True\n              for x in p["phases"]\n              for trader in p["traders"]\n          )\n          p01 = p["phases"][0]\n          assert all(\n              p01["traders"][trader]["trader_lab_state"] == "research_ready"\n              for trader in p["traders"]\n          )\n          p17 = p["phases"][16]\n          assert all(\n              p17["traders"][trader]["faculty_count"] == 19\n              for trader in p["traders"]\n          )\n          assert p["governance"]["broker_mutation"] is False\n          assert p["governance"]["live"] is False\n          assert p["governance"]["real_capital"] is False\n          assert p["governance"]["certification_claimed"] is False\n          PY\n\n      - name: Prove legacy cognition did not leak into productive runtime\n        shell: bash\n        run: |\n          set -euo pipefail\n          python scripts/cibo_legacy_stack_quarantine.py\n          pytest -q --no-cov tests/infrastructure/test_cibo_legacy_stack_quarantine.py\n\n      - uses: actions/upload-artifact@v4\n        if: always()\n        with:\n          name: qore-cibo-cognitive-trader-lab-audit-${{ github.run_id }}\n          path: ${{ runner.temp }}/cognitive-trader-lab\n          if-no-files-found: warn\n          retention-days: 90\n