name: QORE CIBO Phase22 One-Shot Batch Contract

on:
  push:
    branches:
      - agent/cibo-certification-architect-b-integration-001
    paths:
      - '.github/workflows/cibo-phase22-one-shot-batch-contract.yml'
      - 'src/qore/infrastructure/cibo_phase22_one_shot_batch.py'
      - 'src/qore/infrastructure/cibo_phase22_one_shot_guard.py'
      - 'src/qore/infrastructure/cibo_phase22_execution_manifest.py'
      - 'src/qore/infrastructure/cibo_phase22_provider_execution_calibration_receipt.py'
      - 'src/qore/infrastructure/cibo_phase22_store_bundle.py'
      - 'tests/infrastructure/test_cibo_phase22_one_shot_batch.py'
  pull_request:
    paths:
      - '.github/workflows/cibo-phase22-one-shot-batch-contract.yml'
      - 'src/qore/infrastructure/cibo_phase22_one_shot_batch.py'
      - 'src/qore/infrastructure/cibo_phase22_one_shot_guard.py'
      - 'src/qore/infrastructure/cibo_phase22_execution_manifest.py'
      - 'src/qore/infrastructure/cibo_phase22_provider_execution_calibration_receipt.py'
      - 'src/qore/infrastructure/cibo_phase22_store_bundle.py'
      - 'tests/infrastructure/test_cibo_phase22_one_shot_batch.py'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Validate irreversible one-shot batch contract
        run: |
          ruff check \
            src/qore/infrastructure/cibo_phase22_one_shot_batch.py \
            tests/infrastructure/test_cibo_phase22_one_shot_batch.py
          mypy src/qore/infrastructure/cibo_phase22_one_shot_batch.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_phase22_one_shot_batch.py
