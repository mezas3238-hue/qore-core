name: QORE VT08 CRT PURE Three-Source Inside-Bar Research

on:
  push:
    branches:
      - agent/vt08-crt-pure-source-identity-001
    paths:
      - '.github/workflows/vt08-crt-pure-three-source-insidebar-replay.yml'
      - 'src/qore/infrastructure/trader_lab/vt08_crt_pure_three_source_insidebar_replay.py'
      - 'tests/infrastructure/trader_lab/test_vt08_crt_pure_three_source_insidebar_replay.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev,ctrader]'
      - name: Show import style expected by Ruff
        run: |
          ruff check --select I --fix --diff tests/infrastructure/trader_lab/test_vt08_crt_pure_three_source_insidebar_replay.py || true
      - name: Ruff source comparison
        run: >-
          ruff check
          src/qore/infrastructure/trader_lab/vt08_crt_pure_three_source_insidebar_replay.py
          tests/infrastructure/trader_lab/test_vt08_crt_pure_three_source_insidebar_replay.py
      - name: Mypy source comparison
        run: >-
          mypy
          src/qore/infrastructure/trader_lab/vt08_crt_pure_three_source_insidebar_replay.py
      - name: Pytest synthetic causal invariants
        run: >-
          pytest -q --no-cov
          tests/infrastructure/trader_lab/test_vt08_crt_pure_three_source_insidebar_replay.py

  historical_replay:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        market: [AUDUSD, USDJPY]
    env:
      QORE_MARKET: ${{ matrix.market }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies (no broker auth)
        run: pip install -e '.[ctrader]'
      - name: Public sample source (licensed, no broker login)
        run: |
          echo "Using MIT-licensed GetData Finance GitHub M5 samples."
          echo "Scope: approximately 2026-03-26 through 2026-09-25; not full 2 years."
          echo "No cTrader authentication, no orders, and no broker execution assumptions."
      - name: Compare unchanged control vs Level-B inside-bar context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "artifacts/$QORE_MARKET"
          python -m qore.infrastructure.trader_lab.vt08_crt_pure_three_source_insidebar_replay \
            "$QORE_MARKET" "artifacts/$QORE_MARKET" --data-source public-sample \
            | tee "artifacts/$QORE_MARKET/stdout.log"
      - name: Bind immutable source and report hashes
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > "artifacts/$QORE_MARKET/git-sha.txt"
          cd "artifacts/$QORE_MARKET"
          sha256sum report.json diagnostics.jsonl stdout.log git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vt08-three-source-context-${{ matrix.market }}-${{ github.sha }}
          path: artifacts/${{ matrix.market }}
          if-no-files-found: error
          retention-days: 90
