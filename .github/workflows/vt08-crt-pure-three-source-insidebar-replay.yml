name: QORE VT08 CRT PURE Three-Source Original Native M5 Research

on:
  push:
    branches:
      - agent/vt08-crt-pure-source-identity-001
    paths:
      - '.github/workflows/vt08-crt-pure-three-source-insidebar-replay.yml'
      - 'src/qore/infrastructure/trader_lab/vt08_crt_pure_three_source_insidebar_replay.py'
      - 'src/qore/infrastructure/trader_lab/vt08_crt_pure_original_atlas_reader.py'
      - 'src/qore/infrastructure/trader_lab/vt08_crt_pure_density_root_cause_audit.py'
      - 'src/qore/infrastructure/trader_lab/vt08_crt_pure_later_source_forensics.py'
      - 'src/qore/infrastructure/trader_lab/vt08_crt_pure_nested_m15_census.py'
      - 'src/qore/infrastructure/trader_lab/vt08_crt_pure_n2_57_casebook.py'
      - 'src/qore/infrastructure/trader_lab/vt08_crt_pure_n3_c2_m5_causal_clock.py'
      - 'tests/infrastructure/trader_lab/test_vt08_crt_pure_three_source_insidebar_replay.py'
      - 'tests/infrastructure/trader_lab/test_vt08_crt_pure_density_root_cause_audit.py'
      - 'tests/infrastructure/trader_lab/test_vt08_crt_pure_later_source_forensics.py'
      - 'tests/infrastructure/trader_lab/test_vt08_crt_pure_nested_m15_census.py'
      - 'tests/infrastructure/trader_lab/test_vt08_crt_pure_n2_57_casebook.py'
      - 'tests/infrastructure/trader_lab/test_vt08_crt_pure_n3_c2_m5_causal_clock.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - name: Ruff source comparison
        run: >-
          ruff check
          src/qore/infrastructure/trader_lab/vt08_crt_pure_three_source_insidebar_replay.py
          src/qore/infrastructure/trader_lab/vt08_crt_pure_original_atlas_reader.py
          src/qore/infrastructure/trader_lab/vt08_crt_pure_density_root_cause_audit.py
          src/qore/infrastructure/trader_lab/vt08_crt_pure_later_source_forensics.py
          src/qore/infrastructure/trader_lab/vt08_crt_pure_nested_m15_census.py
          src/qore/infrastructure/trader_lab/vt08_crt_pure_n2_57_casebook.py
          src/qore/infrastructure/trader_lab/vt08_crt_pure_n3_c2_m5_causal_clock.py
          tests/infrastructure/trader_lab/test_vt08_crt_pure_three_source_insidebar_replay.py
          tests/infrastructure/trader_lab/test_vt08_crt_pure_density_root_cause_audit.py
          tests/infrastructure/trader_lab/test_vt08_crt_pure_later_source_forensics.py
          tests/infrastructure/trader_lab/test_vt08_crt_pure_nested_m15_census.py
          tests/infrastructure/trader_lab/test_vt08_crt_pure_n2_57_casebook.py
          tests/infrastructure/trader_lab/test_vt08_crt_pure_n3_c2_m5_causal_clock.py
      - name: Mypy source comparison
        run: >-
          mypy
          src/qore/infrastructure/trader_lab/vt08_crt_pure_three_source_insidebar_replay.py
          src/qore/infrastructure/trader_lab/vt08_crt_pure_original_atlas_reader.py
          src/qore/infrastructure/trader_lab/vt08_crt_pure_density_root_cause_audit.py
          src/qore/infrastructure/trader_lab/vt08_crt_pure_later_source_forensics.py
          src/qore/infrastructure/trader_lab/vt08_crt_pure_nested_m15_census.py
          src/qore/infrastructure/trader_lab/vt08_crt_pure_n2_57_casebook.py
          src/qore/infrastructure/trader_lab/vt08_crt_pure_n3_c2_m5_causal_clock.py
      - name: Pytest synthetic causal invariants
        run: >-
          pytest -q --no-cov
          tests/infrastructure/trader_lab/test_vt08_crt_pure_three_source_insidebar_replay.py
          tests/infrastructure/trader_lab/test_vt08_crt_pure_density_root_cause_audit.py
          tests/infrastructure/trader_lab/test_vt08_crt_pure_later_source_forensics.py
          tests/infrastructure/trader_lab/test_vt08_crt_pure_nested_m15_census.py
          tests/infrastructure/trader_lab/test_vt08_crt_pure_n2_57_casebook.py
          tests/infrastructure/trader_lab/test_vt08_crt_pure_n3_c2_m5_causal_clock.py

  historical_replay:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        market: [AUDUSD, USDJPY]
    env:
      QORE_MARKET: ${{ matrix.market }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only research library (no broker credentials)
        run: pip install -e .
      - name: Recover original CIBO/QORE Native 10Y M5 per-market archive
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-${{ matrix.market }}-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          run-id: '35166210458'
          github-token: ${{ github.token }}
          path: original-native-m5
      - name: Confirm original source signature and retention metadata policy
        shell: bash
        run: |
          set -euo pipefail
          test -s original-native-m5/symbol-consumption-manifest.json
          test -s original-native-m5/MANIFEST_SHA256SUMS.txt
          test -s original-native-m5/SYMBOL_SHA256SUMS.txt
          test -d original-native-m5/RAW_M5_LEDGER
          echo "Original Atlas provenance: run 35166210458 / 10Y M5, not public samples."
      - name: Compare unchanged control vs Level-B inside-bar context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "artifacts/$QORE_MARKET"
          python -m qore.infrastructure.trader_lab.vt08_crt_pure_three_source_insidebar_replay \
            "$QORE_MARKET" "artifacts/$QORE_MARKET" --data-source atlas-original --source-root original-native-m5 \
            | tee "artifacts/$QORE_MARKET/stdout.log"
      - name: Re-examine missed CRT sources WITHOUT creating new trades
        shell: bash
        run: |
          set -euo pipefail
          python -m qore.infrastructure.trader_lab.vt08_crt_pure_density_root_cause_audit \
            "$QORE_MARKET" original-native-m5 "artifacts/$QORE_MARKET" \
            | tee "artifacts/$QORE_MARKET/density-stdout.log"
      - name: Adjudicate all later-source opportunities as evidence ONLY
        shell: bash
        run: |
          set -euo pipefail
          python -m qore.infrastructure.trader_lab.vt08_crt_pure_later_source_forensics \
            "$QORE_MARKET" original-native-m5 "artifacts/$QORE_MARKET" \
            | tee "artifacts/$QORE_MARKET/later-source-forensics-stdout.log"
      - name: Census preregistered independent micro-CRT N1 (no trades)
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/research/VT08_CRT_PURE_NESTED_M15_SOURCE_PREREG_2026-10-14.md
          python -m qore.infrastructure.trader_lab.vt08_crt_pure_nested_m15_census \
            "$QORE_MARKET" original-native-m5 "artifacts/$QORE_MARKET" \
            | tee "artifacts/$QORE_MARKET/nested-m15-stdout.log"
      - name: Complete N2 57-case source and overlap review (no new trades)
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/research/VT08_CRT_PURE_N2_57_CASEBOOK_PRE_REGISTRATION_2026-10-14.md
          python -m qore.infrastructure.trader_lab.vt08_crt_pure_n2_57_casebook \
            "$QORE_MARKET" original-native-m5 "artifacts/$QORE_MARKET" \
            | tee "artifacts/$QORE_MARKET/n2-57-casebook-stdout.log"
      - name: N3 inspect causal C2-close M15 to lower M5 C3 clocks, NO TRADES
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/research/VT08_CRT_PURE_N3_C2_CLOSE_M5_CAUSAL_BRIDGE_PREREG_2026-10-14.md
          python -m qore.infrastructure.trader_lab.vt08_crt_pure_n3_c2_m5_causal_clock \
            "$QORE_MARKET" original-native-m5 "artifacts/$QORE_MARKET" \
            | tee "artifacts/$QORE_MARKET/n3-c2-m5-stdout.log"
      - name: Bind immutable source and report hashes
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > "artifacts/$QORE_MARKET/git-sha.txt"
          cd "artifacts/$QORE_MARKET"
          sha256sum report.json diagnostics.jsonl stdout.log density-root-cause.json density-stdout.log later-source-forensics.json later-source-forensics-cases.jsonl later-source-forensics-stdout.log nested-m15-census.json nested-m15-ledger.jsonl nested-m15-stdout.log n2-57-casebook-summary.json n2-57-casebook-full.jsonl n2-57-casebook-stdout.log n3-c2-m5-summary.json n3-c2-m5-ledger.jsonl n3-c2-m5-stdout.log git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vt08-three-source-context-${{ matrix.market }}-${{ github.sha }}
          path: artifacts/${{ matrix.market }}
          if-no-files-found: error
          retention-days: 90
