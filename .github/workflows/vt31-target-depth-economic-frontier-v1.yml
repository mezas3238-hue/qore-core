name: QORE VT31 Target Depth Economic Frontier V1

on:
  push:
    branches:
      - agent/vt31-edge-position-cert-b-001
    paths:
      - scripts/vt31_nas100_target_depth_economic_frontier_v1.py
      - .github/workflows/vt31-target-depth-economic-frontier-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vt31-target-depth-economic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Static gate
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_target_depth_economic_frontier_v1.py
          ruff check scripts/vt31_nas100_target_depth_economic_frontier_v1.py

      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"

      - name: Run economic frontier
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python scripts/vt31_nas100_target_depth_economic_frontier_v1.py             "input/${EVIDENCE_PATH}"             --output "result/economic-${PARTITION}.json"             | tee "result/summary-${PARTITION}.json"

      - name: Governance gate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          p=os.environ["PARTITION"]
          x=json.loads(Path(f"result/economic-{p}.json").read_text())
          g=x["governance"]
          assert g["target_depth_calibration_passed_before_run"] is True
          assert g["same_sovereign_terminal_population"] is True
          assert g["trade_admission_changed"] is False
          assert g["entry_changed"] is False
          assert g["initial_stop_changed"] is False
          assert g["lifecycle_changed"] is False
          assert g["dol1_touch_is_not_acceptance"] is True
          assert g["dol1_acceptance_requires_subsequent_closed_m1"] is True
          assert g["extension_target_active_only_after_acceptance_close"] is True
          assert g["position_sizing_used"] is False
          assert g["leverage_used"] is False
          assert g["compounding_used"] is False
          assert g["capital_weighting_used"] is False
          assert g["absolute_volume_used"] is False
          assert g["fresh_holdout_opened"] is False
          counts={v["trade_count"] for v in x["variants"].values()}
          assert len(counts) == 1
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-target-depth-economic-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-target-depth-economic-*-${{ github.sha }}
          path: input
          merge-multiple: true

      - name: Adjudicate economic frontier
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          folds=("r5","r6","r8","consumed")
          baseline="DOL1_EXIT_BASELINE"
          variants=tuple(
              f"W{window}_{depth}_{mode}"
              for window in (1,3,5)
              for depth,mode in (
                  ("DOL2","ALL"),
                  ("DOL2","FULL_COGNITION"),
                  ("DOL3","ALL"),
                  ("DOL3","DEEP_COGNITION"),
              )
          )
          payloads={
              f:json.loads(Path(f"input/economic-{f}.json").read_text())
              for f in folds
          }
          def d(v):
              return Decimal(str(v))

          report={}
          for variant in variants:
              pf_non=mean_non=dd_non=0
              winner_ok=True
              temporal_ok=True
              mc_ok=True
              per_fold={}
              for fold in folds:
                  b=payloads[fold]["variants"][baseline]
                  c=payloads[fold]["variants"][variant]
                  bm=b["stress_0_05r"]
                  cm=c["stress_0_05r"]
                  wp=c["winner_preservation_vs_dol1"]
                  pf_ok=(
                      bm["profit_factor"] is not None
                      and cm["profit_factor"] is not None
                      and d(cm["profit_factor"])>=d(bm["profit_factor"])
                  )
                  mean_ok=d(cm["mean_r"])>=d(bm["mean_r"])
                  dd_ok=d(cm["max_drawdown_r"])<=d(bm["max_drawdown_r"])
                  pf_non += int(pf_ok)
                  mean_non += int(mean_ok)
                  dd_non += int(dd_ok)

                  wc=d(wp["winner_count_preservation"])
                  wr=d(wp["winner_r_preservation"])
                  winner_fold=wc>=d("0.80") and wr>=d("0.90")
                  winner_ok &= winner_fold

                  bmc=b["monte_carlo"]
                  cmc=c["monte_carlo"]
                  mc_fold=(
                      d(cmc["positive_terminal_probability"])
                      >= d(bmc["positive_terminal_probability"])
                      and d(cmc["p95_max_drawdown_r"])
                      <= d(bmc["p95_max_drawdown_r"])
                  )
                  mc_ok &= mc_fold

                  halfyears={}
                  if fold!="consumed":
                      for block in sorted(
                          set(b["halfyear_stress"]) & set(c["halfyear_stress"])
                      ):
                          delta=(
                              d(c["halfyear_stress"][block]["mean_r"])
                              - d(b["halfyear_stress"][block]["mean_r"])
                          )
                          ok=delta>=0
                          temporal_ok &= ok
                          halfyears[block]={
                              "mean_r_delta":format(delta,"f"),
                              "nondegrade":ok,
                          }

                  per_fold[fold]={
                      "baseline":bm,
                      "candidate":cm,
                      "winner_preservation":wp,
                      "monte_carlo_baseline":bmc,
                      "monte_carlo_candidate":cmc,
                      "pf_nondegrade":pf_ok,
                      "mean_nondegrade":mean_ok,
                      "dd_nondegrade":dd_ok,
                      "winner_floor_pass":winner_fold,
                      "monte_carlo_nondegrade":mc_fold,
                      "dol1_accepted_count":c["dol1_accepted_count"],
                      "extension_target_exit_count":c[
                          "extension_target_exit_count"
                      ],
                      "extension_active_count":c["extension_active_count"],
                      "acceptance_window_expired_count":c[
                          "acceptance_window_expired_count"
                      ],
                      "cognition_bank_count":c["cognition_bank_count"],
                      "halfyears":halfyears,
                  }

              consumed=per_fold["consumed"]
              consumed_ok=(
                  consumed["pf_nondegrade"]
                  and consumed["mean_nondegrade"]
                  and consumed["dd_nondegrade"]
                  and consumed["winner_floor_pass"]
              )
              strict=(
                  pf_non==4
                  and mean_non==4
                  and dd_non>=3
                  and winner_ok
                  and temporal_ok
                  and mc_ok
                  and consumed_ok
              )
              research=(
                  pf_non>=3
                  and mean_non>=3
                  and dd_non>=3
                  and winner_ok
                  and consumed_ok
              )
              report[variant]={
                  "folds":per_fold,
                  "pf_nondegrade_folds":pf_non,
                  "mean_nondegrade_folds":mean_non,
                  "dd_nondegrade_folds":dd_non,
                  "winner_preservation_all_folds":winner_ok,
                  "halfyears_all_nondegrade":temporal_ok,
                  "monte_carlo_all_nondegrade":mc_ok,
                  "consumed_nondegrade":consumed_ok,
                  "strict_consumed_promotion_gate":strict,
                  "research_survivor":research,
              }

          result={
              "schema":"qore.vt31.nas100.target_depth_economic_frontier.aggregate.v1",
              "head":"${{ github.sha }}",
              "variants":report,
              "strict_survivors":[
                  v for v in variants
                  if report[v]["strict_consumed_promotion_gate"]
              ],
              "research_survivors":[
                  v for v in variants
                  if report[v]["research_survivor"]
              ],
              "governance":{
                  "consumed_evidence_only":True,
                  "target_depth_calibrated_before_economic_test":True,
                  "runtime_policy_promoted":False,
                  "fresh_holdout_opened":False,
                  "candidate_frozen":False,
                  "candidate_certified":False,
                  "live_authorized":False,
              },
          }
          Path("result/aggregate.json").write_text(
              json.dumps(result,sort_keys=True,indent=2)+"\n"
          )
          print(json.dumps(result,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-target-depth-economic-aggregate-${{ github.sha }}
          path: result/
          retention-days: 90
