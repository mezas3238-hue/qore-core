name: QORE Native IC Markets 24 Missing Native M1 10Y (Pilot Only)

on:
  push:
    branches:
      - research/qore-native-icmarkets-universe33-m1-capture-20261012
    paths:
      - '.github/workflows/qore-native-icmarkets-24-missing-m1-capture.yml'
      - 'src/qore/infrastructure/trader_lab/qore_native_icmarkets_missing_m1_capture_v1.py'
      - 'src/qore/infrastructure/trader_lab/qore_native_icmarkets_catalog_preflight_v1.py'
      - 'tests/infrastructure/trader_lab/test_qore_native_icmarkets_missing_m1_capture_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-native-icmarkets-m1-24-${{ github.ref }}
  cancel-in-progress: false

env:
  QORE_CTRADER_DEMO_CLIENT_ID: ${{ secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
  QORE_CTRADER_DEMO_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
  QORE_CTRADER_DEMO_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
  QORE_CTRADER_DEMO_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN }}

jobs:
  frozen_m1_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,ctrader]'
      - name: M1 immutable source universe and broker-security synthetic gates
        run: |
          set -euo pipefail
          ruff check --select F,E4,E7,E9 src/qore/infrastructure/trader_lab/qore_native_icmarkets_missing_m1_capture_v1.py src/qore/infrastructure/trader_lab/qore_native_icmarkets_catalog_preflight_v1.py tests/infrastructure/trader_lab/test_qore_native_icmarkets_missing_m1_capture_v1.py
          PYTHONPATH=src python -m unittest discover -s tests/infrastructure/trader_lab -p 'test_qore_native_icmarkets_missing_m1_capture_v1.py' -v
          python -m compileall -q src/qore/infrastructure/trader_lab/qore_native_icmarkets_missing_m1_capture_v1.py
          python - <<'PY'
          from qore.infrastructure.trader_lab.qore_native_icmarkets_missing_m1_capture_v1 import TARGET_SYMBOLS, PROVIDER_SYMBOL_MAP
          assert len(TARGET_SYMBOLS)==24 and len(set(TARGET_SYMBOLS))==24
          assert PROVIDER_SYMBOL_MAP["SP500"]=="US500"
          assert "NAS100" not in TARGET_SYMBOLS
          print("M1_24_FROZEN_SOURCE_AND_TESTS_PASS")
          PY

  icmarkets_demo_catalog:
    needs: frozen_m1_contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[ctrader]'
      - name: Verify IC Markets broker name, DEMO account, OAuth view and exact provider symbols
        run: |
          set -euo pipefail
          mkdir -p source-proof
          PYTHONPATH=src python -m qore.infrastructure.trader_lab.qore_native_icmarkets_catalog_preflight_v1 source-proof/verified-catalog.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("source-proof/verified-catalog.json").read_text())
          assert j["status"]=="ICMARKETS_DEMO_CATALOG_VERIFIED"
          assert j["account_is_live"] is False
          assert j["token_refreshed"] is False
          assert j["catalog"]["catalog_exact_matches"]["US500"]["enabled"] is True
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-native-24-missing-M1-catalog-${{ github.sha }}
          path: source-proof
          retention-days: 90
          if-no-files-found: warn

  pilot_capture_m1:
    needs: [frozen_m1_contract, icmarkets_demo_catalog]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        symbol: [SP500, XAGUSD, NZDUSD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[ctrader]'
      - name: Original provider M1 native capture, strict 2016-2026 UTC, DEMO only
        env:
          SYMBOL: ${{ matrix.symbol }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "native-m1/$SYMBOL"
          PYTHONPATH=src python -m qore.infrastructure.trader_lab.qore_native_icmarkets_missing_m1_capture_v1 "$SYMBOL" "native-m1/$SYMBOL"
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          symbol=os.environ["SYMBOL"]
          home=Path("native-m1")/symbol
          mf=home/"m1-clone-manifest.json"
          data=json.loads(mf.read_text())
          assert data["identity"]=="QORE_NATIVE_ICMARKETS_DEMO_24_MISSING_NATIVE_M1_10Y_V1"
          assert data["canonical_symbol"]==symbol
          assert data["provider_symbol"]==("US500" if symbol=="SP500" else symbol)
          assert data["target_start"]=="2016-09-17T00:00:00+00:00"
          assert data["target_end_exclusive"]=="2026-09-17T00:00:00+00:00"
          assert data["provider_native_m1"] and not data["synthetic_m1"] and not data["interpolated_m1"]
          assert data["source_account_confirmed_icmarkets_demo"] and data["scope_read_only"]
          assert data["read_only"] and not data["live_authorized"] and not data["production_authorized"]
          assert data["retained_m1"]>0 and data["contradictory_m1"]==0
          assert len(data["partitions"])==11
          counted=0
          for year in data["partitions"]:
              f=home/"RAW_M1_LEDGER"/(year["partition"]+".jsonl")
              assert f.exists()
              digest=hashlib.sha256()
              with f.open("rb") as fp:
                  for blk in iter(lambda:fp.read(1048576),b""):
                      digest.update(blk)
              assert digest.hexdigest()==year["raw_sha256"]
              counted+=year["retained_m1"]
          assert counted==data["retained_m1"]
          assert hashlib.sha256(mf.read_bytes()).hexdigest() == (home/"MANIFEST_SHA256SUMS.txt").read_text().split()[0]
          print("ICMARKETS_PROVIDER_NATIVE_M1_SHA_VERIFIED",symbol,counted)
          PY
          (cd "native-m1/$SYMBOL" && sha256sum m1-clone-manifest.json MANIFEST_SHA256SUMS.txt > COLLECTION_SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-native-icmarkets-10Y-provider-M1-${{ matrix.symbol }}-${{ github.sha }}
          path: native-m1/${{ matrix.symbol }}/
          retention-days: 90
          compression-level: 6
          if-no-files-found: warn
