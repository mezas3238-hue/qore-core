name: QORE Core V3 VT31 Shared Decision Intelligence Phase A V2

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - scripts/vt31_core_stack_v3_shared_decision_intelligence_v2.py
      - .github/workflows/qore-core-v3-vt31-shared-decision-intelligence-v2.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  decision-intelligence-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Static validation
        run: |
          ruff check scripts/vt31_core_stack_v3_shared_decision_intelligence_v2.py
          python -m py_compile scripts/vt31_core_stack_v3_shared_decision_intelligence_v2.py
      - name: Recover immutable evidence
        run: |
          set -euo pipefail
          mkdir -p input/pure input/cibo result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10799064861/zip" > pure.zip
          unzip -q pure.zip -d input/pure
          (cd input/pure && sha256sum -c SHA256SUMS)
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10478487667/zip" > cibo.zip
          unzip -q cibo.zip -d input/cibo
          (cd input/cibo && sha256sum -c SHA256SUMS)
      - name: Run Shared Phase A V2 falsification
        run: |
          python scripts/vt31_core_stack_v3_shared_decision_intelligence_v2.py             --r8 input/pure/r8.json             --r6 input/pure/r6.json             --r5 input/pure/r5.json             --daily-path input/cibo/DAILY_PATH_LEDGER.jsonl             --output result/shared-phase-a-v2.json             | tee result/summary.json
      - name: Governance and hard-gate validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/shared-phase-a-v2.json").read_text())
          assert p["challenge_set"] == {"trades":822,"losses":711,"wins":111}
          assert p["research_phase"] == "PHASE_A_SHARED_DECISION_INTELLIGENCE_ONLY"
          assert p["potentiator_status"] == "DEFERRED_BLOCKED"
          g=p["governance"]
          assert g["trade_potentiation_used"] is False
          assert g["risk_weighting_used"] is False
          assert g["position_potentiation_used"] is False
          assert g["methodology_modified"] is False
          assert g["current_outcome_used"] is False
          assert g["r5_retuned"] is False
          assert g["shared_order_authority"] is False
          assert g["shared_risk_authority"] is False
          assert g["live_authorized"] is False
          assert g["merge_authorized"] is False
          print(json.dumps({
              "economic_status":p["economic_status"],
              "passes_shared_phase_a":p["passes_shared_phase_a"],
              "frozen_policy":p["frozen_policy"],
              "evaluation":p["evaluation"],
              "gates":p["gates"],
          },sort_keys=True))
          PY
      - name: Bind result
        run: |
          echo "$GITHUB_SHA" > result/git-sha.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd result && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-core-v3-vt31-shared-phase-a-v2-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
