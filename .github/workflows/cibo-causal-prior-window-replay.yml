name: QORE CIBO Causal Prior Window Replay

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cibo-causal-expectation-leakage-fix-001
    paths:
      - '.github/workflows/cibo-causal-prior-window-replay.yml'
      - 'scripts/cibo_extract_causal_prior_window.py'
      - 'src/qore/infrastructure/cibo_ce2i_phase20_train_prior.py'
      - 'src/qore/infrastructure/cibo_single_account_manifest_economics.py'
      - 'src/qore/infrastructure/cibo_native_max_cognitive_episode.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-cibo-causal-prior-window-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}
      FROZEN_ARTIFACT_ID: '11389331836'
      FROZEN_ARTIFACT_DIGEST: 'sha256:30177639f660c9647ab70257c2d12c541bdade49ab5582347a3890f920070fee'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Validate chronology repair surface
        run: |
          set -euo pipefail
          python -m py_compile             scripts/cibo_extract_causal_prior_window.py             src/qore/infrastructure/cibo_ce2i_phase20_train_prior.py             src/qore/infrastructure/cibo_single_account_manifest_economics.py
          ruff check             scripts/cibo_extract_causal_prior_window.py             src/qore/infrastructure/cibo_ce2i_phase20_train_prior.py             src/qore/infrastructure/cibo_single_account_manifest_economics.py

      - name: Recover frozen source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/frozen" "$RUNNER_TEMP/causal"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$FROZEN_ARTIFACT_ID" > "$RUNNER_TEMP/frozen.meta.json"
          jq -e --arg digest "$FROZEN_ARTIFACT_DIGEST" '.expired == false and .digest == $digest' "$RUNNER_TEMP/frozen.meta.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$FROZEN_ARTIFACT_ID/zip" > "$RUNNER_TEMP/frozen.zip"
          echo "${FROZEN_ARTIFACT_DIGEST#sha256:}  $RUNNER_TEMP/frozen.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/frozen.zip" -d "$RUNNER_TEMP/frozen"
          MANIFEST="$(find "$RUNNER_TEMP/frozen" -type f -name single-account-manifest-native.json -print -quit)"
          test -n "$MANIFEST"
          echo "MANIFEST=$MANIFEST" >> "$GITHUB_ENV"

      - name: Prove frozen full replay is now rejected for future leakage
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from qore.infrastructure.cibo_capital_management_authority import (
              CiboCapitalManagementError,
          )
          from qore.infrastructure.cibo_single_account_manifest_economics import (
              manifest_to_ceiling_opportunity_evidence,
          )

          payload = json.loads(Path(os.environ["MANIFEST"]).read_text())
          try:
              manifest_to_ceiling_opportunity_evidence(payload)
          except CiboCapitalManagementError as error:
              assert "expectation evidence was not available at decision time" in str(error)
              print(str(error))
          else:
              raise AssertionError("legacy full manifest unexpectedly passed chronology")
          PY

      - name: Build causally valid evaluation window
        run: |
          set -euo pipefail
          python scripts/cibo_extract_causal_prior_window.py             --manifest "$MANIFEST"             --output "$RUNNER_TEMP/causal/causal-prior-window.json"             --receipt "$RUNNER_TEMP/causal/causal-prior-window-receipt.json"
          echo "CAUSAL_MANIFEST=$RUNNER_TEMP/causal/causal-prior-window.json" >> "$GITHUB_ENV"

      - name: Prove causal window economics surface
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from qore.infrastructure.cibo_single_account_manifest_economics import (
              manifest_to_ceiling_opportunity_evidence,
          )

          payload = json.loads(Path(os.environ["CAUSAL_MANIFEST"]).read_text())
          evidence = manifest_to_ceiling_opportunity_evidence(payload)
          assert len(evidence) == 333
          assert payload["decision_epoch_count"] == 328
          assert payload["causal_expectation_window"]["excluded_preavailability_count"] == 3035
          assert payload["first_market_decision_at"] == "2022-03-09T18:35:00+00:00"
          assert payload["last_market_decision_at"] == "2022-06-29T22:40:00+00:00"
          print(json.dumps({
              "causal_opportunities": len(evidence),
              "decision_epochs": payload["decision_epoch_count"],
              "first": payload["first_market_decision_at"],
              "last": payload["last_market_decision_at"],
          }, sort_keys=True))
          PY

      - name: Execute causally valid sovereign replay
        run: |
          set -euo pipefail
          python scripts/cibo_single_account_historical_ceiling_replay.py             --manifest "$CAUSAL_MANIFEST"             --output "$RUNNER_TEMP/causal/causal-prior-window-replay.json"             --progress-every 50

      - name: Summarize causal baseline
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from decimal import Decimal
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "causal"
          replay = json.loads((root / "causal-prior-window-replay.json").read_text())
          manifest = json.loads((root / "causal-prior-window.json").read_text())

          start = datetime.fromisoformat(manifest["first_market_decision_at"])
          end = datetime.fromisoformat(manifest["last_market_decision_at"])
          days = Decimal(str((end - start).total_seconds())) / Decimal("86400")
          initial = Decimal("60")
          ending = Decimal(replay["ending_capital_usd"])
          summary = {
              "schema": "qore.cibo.causal-prior-window-baseline.v1",
              "opportunity_count": replay["decision_count"],
              "decision_epoch_count": replay["decision_epoch_count"],
              "settlement_count": replay["settlement_count"],
              "initial_capital_usd": format(initial, "f"),
              "ending_capital_usd": format(ending, "f"),
              "net_pnl_usd": replay["net_pnl_usd"],
              "peak_capital_usd": replay["peak_capital_usd"],
              "elapsed_days": format(days, "f"),
              "cumulative_return_percent": format(
                  (ending / initial - Decimal(1)) * Decimal(100),
                  "f",
              ),
              "external_ai_call_count": replay["external_ai_call_count"],
              "source_manifest_sha256": replay["source_manifest_sha256"],
              "certification_claimed": False,
              "research_only": True,
          }
          (root / "causal-prior-window-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-cibo-causal-prior-window-${{ github.run_id }}
          path: ${{ runner.temp }}/causal
          if-no-files-found: warn
