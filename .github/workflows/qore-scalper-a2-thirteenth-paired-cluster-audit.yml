name: QORE Scalper A2 Audit13 Paired Day-Cluster CI Nine-Market

on:
  push:
    branches:
      - agent/scalper-architect-b-methodology-20261010
    paths:
      - '.github/workflows/qore-scalper-a2-thirteenth-paired-cluster-audit.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_a2_thirteenth_paired_cluster_uncertainty_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_scalper_a2_thirteenth_paired_cluster_uncertainty_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  STREAM_RUN: '38099916845'
  STREAM_SHA: '82e5adc9656bc28b70724fc44695d0fd642651ab'
  H1_RUN: '38102351044'
  H1_SHA: 'abd1074e0cd27e9c2fef1abfab82902e02439bc1'

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Validate strict cross-ledger and paired-cluster quality
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_scalper_a2_thirteenth_paired_cluster_uncertainty_v1.py tests/infrastructure/trader_lab/test_capitalizer_scalper_a2_thirteenth_paired_cluster_uncertainty_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_scalper_a2_thirteenth_paired_cluster_uncertainty_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_scalper_a2_thirteenth_paired_cluster_uncertainty_v1.py
      - uses: actions/download-artifact@v4
        with:
          pattern: scalper-a2-audit13-stream-*-${{ env.STREAM_SHA }}
          path: stream-original
          github-token: ${{ github.token }}
          run-id: ${{ env.STREAM_RUN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: scalper-a2-audit13-h1poi-*-${{ env.H1_SHA }}
          path: h1-original
          github-token: ${{ github.token }}
          run-id: ${{ env.H1_RUN }}
      - name: Join 2876 IDs, preserve exact 381, bootstrap operating-date clusters
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_a2_thirteenth_paired_cluster_uncertainty_v1 stream-original h1-original uncertainty-output
      - name: Assert 381/247/134 and H1 exact honesty
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("uncertainty-output/scalper-audit13-cluster-nine-market.json").read_text())
          assert r["sources"]==2876 and r["markets"]==9
          assert r["strata"]["FROZEN_381"]["source_opportunities"]==381
          assert r["strata"]["FROZEN_381_SENSOR_EARLIER_247"]["source_opportunities"]==247
          assert r["strata"]["FROZEN_381_SENSOR_SAME_CLOSE_134"]["source_opportunities"]==134
          assert r["paper_pf"] is None and r["paper_dd"] is None
          print("AUDIT13 PAIRED CLUSTER UNCERTAINTY",r)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-audit13-paired-cluster-nine-market-${{ github.sha }}
          path: uncertainty-output/
          retention-days: 90
          if-no-files-found: error
