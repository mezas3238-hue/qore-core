name: QORE VT31 Architect A Stable Negative Admission Frontier V1

on:
  push:
    branches:
      - agent/vt31-edge-entry-reasoning-a-001
    paths:
      - scripts/vt31_nas100_architect_a_stable_negative_admission_frontier_v1.py
      - scripts/vt31_nas100_architect_a_admitted_attribution_v1.py
      - scripts/vt31_nas100_architect_a_entry_edge_baseline_v1.py
      - scripts/vt31_nas100_specialist_r1_candidate.py
      - src/qore/infrastructure/traders/vt31_nas100_reasoning_engine.py
      - src/qore/infrastructure/traders/vt31_nas100_situation_model.py
      - src/qore/infrastructure/traders/vt31_nas100_market_context_runtime.py
      - .github/workflows/vt31-architect-a-stable-negative-admission-frontier-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Static and focused gates
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/vt31_nas100_architect_a_stable_negative_admission_frontier_v1.py \
            scripts/vt31_nas100_architect_a_admitted_attribution_v1.py
          ruff check \
            scripts/vt31_nas100_architect_a_stable_negative_admission_frontier_v1.py \
            scripts/vt31_nas100_architect_a_admitted_attribution_v1.py
          python scripts/vt31_nas100_specialist_r1_candidate.py --self-test
      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"
      - name: Run stable-negative admission frontier
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python \
            scripts/vt31_nas100_architect_a_stable_negative_admission_frontier_v1.py \
            "input/${EVIDENCE_PATH}" \
            --output "result/stable-negative-${PARTITION}.json" \
            | tee "result/summary-${PARTITION}.json"
      - name: Governance
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=os.environ["PARTITION"]
          x=json.loads(Path(f"result/stable-negative-{p}.json").read_text())
          g=x["governance"]
          assert g["consumed_evidence_only"] is True
          assert g["hypotheses_predeclared_before_frontier_run"] is True
          assert g["hypotheses_discovered_on_same_consumed_folds"] is True
          assert g["frontier_is_development_evidence_only"] is True
          assert g["runtime_reasoning_changed"] is False
          assert g["hard_abstain_shadow_semantics"] is True
          assert g["same_source_no_fallback"] is True
          assert g["rearm_introduced"] is False
          assert g["entry_price_changed"] is False
          assert g["initial_stop_changed"] is False
          assert g["target_changed"] is False
          assert g["position_management_changed"] is False
          assert g["position_sizing_used"] is False
          assert g["leverage_used"] is False
          assert g["compounding_used"] is False
          assert g["capital_weighting_used"] is False
          assert g["absolute_volume_used"] is False
          assert g["fold_identity_used_for_action"] is False
          assert g["future_outcome_used_for_action"] is False
          assert g["fresh_holdout_opened"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-architect-a-stable-negative-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-architect-a-stable-negative-*-${{ github.sha }}
          path: input
          merge-multiple: true
      - name: Adjudicate stable-negative vetoes
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          folds=("r5","r6","r8","consumed")
          candidates=(
              "ABSTAIN_ORDER_BLOCK",
              "ABSTAIN_EXPANDED_REFERENCE",
              "ABSTAIN_ORDER_BLOCK_OR_EXPANDED",
          )
          payloads={
              fold:json.loads(
                  Path(f"input/stable-negative-{fold}.json").read_text()
              )
              for fold in folds
          }

          def d(value):
              return Decimal(str(value))

          report={}
          for variant in candidates:
              per_fold={}
              pf_ok=mean_ok=dd_ok=density_ok=0
              winners_all=True
              temporal_all=True
              for fold in folds:
                  base=payloads[fold]["variants"]["BASELINE"]
                  cand=payloads[fold]["variants"][variant]
                  bm=base["stress_0_05r"]
                  cm=cand["stress_0_05r"]
                  wp=cand["winner_preservation"]

                  pf_non=(
                      cm["profit_factor"] is not None
                      and bm["profit_factor"] is not None
                      and d(cm["profit_factor"])>=d(bm["profit_factor"])
                  )
                  mean_non=d(cm["mean_r"])>=d(bm["mean_r"])
                  dd_non=d(cm["max_drawdown_r"])<=d(bm["max_drawdown_r"])
                  density_non=d(cand["relative_density"])>=Decimal("0.75")
                  winner_non=(
                      d(wp["winner_count_preservation"])>=Decimal("0.80")
                      and d(wp["winner_r_preservation"])>=Decimal("0.90")
                  )

                  pf_ok+=int(pf_non)
                  mean_ok+=int(mean_non)
                  dd_ok+=int(dd_non)
                  density_ok+=int(density_non)
                  winners_all &= winner_non

                  blocks={}
                  if fold!="consumed":
                      common=(
                          set(base["halfyear_stress"])
                          & set(cand["halfyear_stress"])
                      )
                      for key in sorted(common):
                          delta=(
                              d(cand["halfyear_stress"][key]["mean_r"])
                              - d(base["halfyear_stress"][key]["mean_r"])
                          )
                          ok=delta>=0
                          temporal_all &= ok
                          blocks[key]={
                              "mean_r_delta":format(delta,"f"),
                              "nondegrade":ok,
                          }

                  per_fold[fold]={
                      "baseline":bm,
                      "candidate":cm,
                      "monte_carlo":cand["monte_carlo"],
                      "relative_density":cand["relative_density"],
                      "removed_trade_count":cand["removed_trade_count"],
                      "removed_metrics":cand["removed_metrics"],
                      "winner_preservation":wp,
                      "pf_nondegrade":pf_non,
                      "mean_nondegrade":mean_non,
                      "dd_nondegrade":dd_non,
                      "density_floor_pass":density_non,
                      "winner_floor_pass":winner_non,
                      "halfyears":blocks,
                  }

              consumed=per_fold["consumed"]
              consumed_owner_direction={
                  "pf_at_least_1_50":(
                      consumed["candidate"]["profit_factor"] is not None
                      and d(consumed["candidate"]["profit_factor"])
                      >= Decimal("1.50")
                  ),
                  "mean_at_least_0_15r":(
                      d(consumed["candidate"]["mean_r"])>=Decimal("0.15")
                  ),
                  "dd_at_most_10r":(
                      d(consumed["candidate"]["max_drawdown_r"])
                      <= Decimal("10")
                  ),
                  "mc_positive_at_least_0_90":(
                      d(consumed["monte_carlo"]["positive_terminal_probability"])
                      >= Decimal("0.90")
                  ),
                  "mc_p95_dd_at_most_15r":(
                      d(consumed["monte_carlo"]["p95_max_drawdown_r"])
                      <= Decimal("15")
                  ),
              }
              development_survivor=(
                  pf_ok==4
                  and mean_ok==4
                  and dd_ok==4
                  and density_ok==4
                  and winners_all
              )
              report[variant]={
                  "folds":per_fold,
                  "pf_nondegrade_folds":pf_ok,
                  "mean_nondegrade_folds":mean_ok,
                  "dd_nondegrade_folds":dd_ok,
                  "density_floor_folds":density_ok,
                  "winner_preservation_all_folds":winners_all,
                  "halfyears_all_nondegrade":temporal_all,
                  "consumed_owner_direction":consumed_owner_direction,
                  "development_survivor":development_survivor,
                  "promotion_authorized":False,
              }

          result={
              "schema":"qore.vt31.nas100.architect_a_stable_negative_admission.aggregate.v1",
              "head":"${{ github.sha }}",
              "variants":report,
              "development_survivors":[
                  name for name,item in report.items()
                  if item["development_survivor"]
              ],
              "temporal_development_survivors":[
                  name for name,item in report.items()
                  if item["development_survivor"]
                  and item["halfyears_all_nondegrade"]
              ],
              "governance":{
                  "consumed_evidence_only":True,
                  "same_evidence_used_for_discovery_and_frontier":True,
                  "results_are_not_promotion_evidence":True,
                  "runtime_policy_changed":False,
                  "sizing_for_certification_forbidden":True,
                  "fresh_holdout_opened":False,
                  "policy_promoted":False,
                  "candidate_frozen":False,
                  "candidate_certified":False,
              },
          }
          Path("result/aggregate.json").write_text(
              json.dumps(result,sort_keys=True,indent=2)+"\n"
          )
          print(json.dumps(result,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-architect-a-stable-negative-aggregate-${{ github.sha }}
          path: result/
          retention-days: 90
