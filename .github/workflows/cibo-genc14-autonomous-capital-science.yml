name: QORE CIBO GEN-C14 Governed Autonomous Capital Science

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-genc14-autonomous-capital-science.yml'
      - 'src/qore/infrastructure/cibo_governed_capital_science.py'
      - 'tests/infrastructure/test_cibo_governed_capital_science.py'
      - 'docs/research/CIBO-GEN-C14-GOVERNED-AUTONOMOUS-CAPITAL-SCIENCE-V1.md'
      - 'docs/research/CIBO-MASTER-OPEN-WORK-LEDGER-V1.json'
  push:
    branches:
      - agent/cibo-capital-efficiency-sizing-lab-001
    paths:
      - '.github/workflows/cibo-genc14-autonomous-capital-science.yml'
      - 'src/qore/infrastructure/cibo_governed_capital_science.py'
      - 'tests/infrastructure/test_cibo_governed_capital_science.py'
      - 'docs/research/CIBO-GEN-C14-GOVERNED-AUTONOMOUS-CAPITAL-SCIENCE-V1.md'
      - 'docs/research/CIBO-MASTER-OPEN-WORK-LEDGER-V1.json'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  genc14-governed-science:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: GEN-C14 governance and anti-promotion invariants
        run: |
          ruff check \
            src/qore/infrastructure/cibo_governed_capital_science.py \
            tests/infrastructure/test_cibo_governed_capital_science.py
          mypy src/qore/infrastructure/cibo_governed_capital_science.py
          python -m py_compile \
            src/qore/infrastructure/cibo_governed_capital_science.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_governed_capital_science.py
