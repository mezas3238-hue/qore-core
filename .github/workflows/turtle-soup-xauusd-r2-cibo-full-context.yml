name: QORE Turtle Soup XAUUSD R2 CIBO Full Context 10Y

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-xauusd-r2-cibo-full-001
    paths:
      - '.github/workflows/turtle-soup-xauusd-r2-cibo-full-context.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r2_cibo_full.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r2_cibo_full.py'
      - 'docs/research/TURTLE-SOUP-XAUUSD-R2-CIBO-FULL-CONTEXT-FREEZE.md'

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-turtle-soup-xauusd-r2-cibo-full-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-XAUUSD-ab782b8e9f890f86a2b6500070f0556b4b685e3d'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff focused semantic gate
        run: |
          ruff check --ignore E501,E702,F401 \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r2_cibo_full.py \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r2_cibo_full.py
      - name: Mypy focused gate
        run: mypy --disable-error-code name-defined src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r2_cibo_full.py
      - name: Focused tests
        run: pytest -q --no-cov tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r2_cibo_full.py
      - name: Governance assertions before replay
        run: |
          python - <<'PY'
          from pathlib import Path
          from qore.infrastructure.trader_lab import turtle_soup_xauusd_r2_cibo_full as r2
          freeze = Path('docs/research/TURTLE-SOUP-XAUUSD-R2-CIBO-FULL-CONTEXT-FREEZE.md').read_text()
          assert r2.IDENTITY == 'TURTLE_SOUP_XAUUSD_R2_CIBO_FULL_CONTEXT'
          assert r2.TRAIN_CLOSE.isoformat() == '2022-09-17T00:00:00+00:00'
          assert 'MFE, MAE, target hit, target time, exit reason, future price path' in freeze
          assert 'predicted_primary_r > 0' in freeze
          assert 'mfe' not in r2.FEATURES and 'mae' not in r2.FEATURES
          PY

  preregistration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Emit immutable R2 protocol before replay
        run: |
          mkdir -p preregistration
          cp docs/research/TURTLE-SOUP-XAUUSD-R2-CIBO-FULL-CONTEXT-FREEZE.md preregistration/
          printf '%s\n' "$GITHUB_SHA" > preregistration/git-sha.txt
          sha256sum preregistration/* > preregistration/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-xauusd-r2-preregistration-${{ github.sha }}
          path: preregistration
          if-no-files-found: error
          retention-days: 90

  replay:
    needs: [quality, preregistration]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download immutable consumed XAUUSD M5 corpus
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Verify source provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifests = list(Path('source-xauusd').rglob('symbol-consumption-manifest.json'))
          assert len(manifests) == 1
          manifest = json.loads(manifests[0].read_text())
          assert manifest['identity'] == 'CIBO_MARKET_ATLAS_10Y_CONSUMPTION_V1'
          assert manifest['canonical_symbol'] == 'XAUUSD'
          assert manifest['retained_bars'] == 707716
          assert manifest['research_evidence_consumed'] is True
          PY
      - name: Fit frozen R2 on development block and execute 10Y replay plus temporal validation
        run: |
          mkdir -p r2-output
          python -m qore.infrastructure.trader_lab.turtle_soup_xauusd_r2_cibo_full \
            source-xauusd r2-output > r2-output/stdout.json
          printf '%s\n' "$GITHUB_SHA" > r2-output/git-sha.txt
      - name: Enforce R2 evidence governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('r2-output/report.json').read_text())
          assert p['identity'] == 'TURTLE_SOUP_XAUUSD_R2_CIBO_FULL_CONTEXT'
          assert p['evidence_status'] == 'CONSUMED_DEVELOPMENT_REPLAY_WITH_INTERNAL_TEMPORAL_VALIDATION_NOT_FRESH_HOLDOUT'
          assert p['retained_m5_bars'] == 707716
          assert p['governance']['validation_block_used_for_fit'] is False
          assert p['governance']['post_entry_leakage_allowed'] is False
          assert p['governance']['automatic_promotion_allowed'] is False
          assert p['governance']['live_authorized'] is False
          assert p['model']['training_close'] == '2022-09-17T00:00:00+00:00'
          PY
      - name: Hash immutable R2 result
        run: |
          cd r2-output
          sha256sum report.json model.json trades-full.json trades-validation.json stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-xauusd-r2-cibo-full-${{ github.sha }}
          path: r2-output
          if-no-files-found: error
          retention-days: 90
