name: QORE Scalper A2 Nine Market V49 Frozen Control

on:
  push:
    branches:
      - agent/scalper-architect-b-methodology-20261010
    paths:
      - '.github/workflows/qore-scalper-a2-nine-market-v49-control.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: scalper-a2-v49-control-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Causal source and V49 baseline replay tests
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_high_frequency_capacity_census_v49.py src/qore/infrastructure/trader_lab/capitalizer_v49_development_economics.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_high_frequency_capacity_census_v49.py src/qore/infrastructure/trader_lab/capitalizer_v49_development_economics.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_v49_h1_target_causality.py tests/infrastructure/trader_lab/test_capitalizer_v49_development_economics.py

  market:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {symbol: USDJPY, session: ASIA}
          - {symbol: AUDJPY, session: ASIA}
          - {symbol: AUDUSD, session: ASIA}
          - {symbol: GBPJPY, session: ASIA}
          - {symbol: EURUSD, session: LONDON}
          - {symbol: GBPUSD, session: LONDON}
          - {symbol: XAUUSD, session: NEW_YORK}
          - {symbol: USDCAD, session: NEW_YORK}
          - {symbol: NAS100, session: NEW_YORK}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download exactly the V50-G matched native-M1 source
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Verify provider-native read-only M1 provenance
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          m = json.loads(Path("m1-source/m1-clone-manifest.json").read_text())
          assert m["canonical_symbol"] == os.environ["EXPECTED_SYMBOL"]
          assert m["provider_native_m1"] is True
          assert m["synthetic_m1"] is False
          assert m["interpolated_m1"] is False
          assert m["contradictory_m1"] == 0
          assert m["read_only"] is True
          PY
      - name: Reconstruct same A2 causal V49 source universe
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_high_frequency_capacity_census_v49 \
            market m1-source v49-source --session "${{ matrix.session }}"
      - name: Execute V49 frozen structural stop and target economic control
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v49_development_economics \
            market v49-source m1-source v49-economic
      - name: Verify causal baseline and zero authorization
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
          EXPECTED_SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          sym = os.environ["EXPECTED_SYMBOL"].lower()
          source = json.loads(
              (Path("v49-source") / f"capitalizer-{sym}-v49-hf-capacity.json").read_text()
          )
          economics = json.loads(
              (Path("v49-economic") / f"capitalizer-{sym}-v49-development-economics.json").read_text()
          )
          assert economics["symbol"] == os.environ["EXPECTED_SYMBOL"]
          assert economics["session"] == os.environ["EXPECTED_SESSION"]
          assert economics["candidate_opportunities"] == source["source_complete_opportunities"]
          assert economics["development_only"] is True if "development_only" in economics else True
          assert economics["outcome_used_for_selection"] is False
          assert economics["trader_certified"] is False
          assert economics["live_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-v49-control-${{ matrix.symbol }}-${{ github.sha }}
          path: |
            v49-source/
            v49-economic/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download all nine V49 control outputs
        uses: actions/download-artifact@v4
        with:
          pattern: scalper-a2-v49-control-*-${{ github.sha }}
          path: baseline-market-artifacts
          merge-multiple: false
      - name: Aggregate V49 frozen structural stop portfolio
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v49_development_economics \
            matrix baseline-market-artifacts baseline-matrix-output
      - name: Report without certifying from gross performance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(
              Path("baseline-matrix-output/capitalizer-v49-development-economic-matrix.json").read_text()
          )
          assert m["market_count"] == 9
          assert m["decision_timeframes"] == ["H1", "M15", "M1"]
          assert not m["trader_certified"] and not m["live_authorized"]
          print("V49 CONTROL SOURCE TRADES PRE MAX3:", m["candidate_trades_before_max3"])
          print("V49 CONTROL TRADES POST MAX3:", m["portfolio_max3_selected_trades"])
          print("V49 CONTROL PORTFOLIO:", m["portfolio_metrics"])
          print("V49 CONTROL COST_STRESS_R:", m["cost_stress"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-nine-market-v49-control-${{ github.sha }}
          path: baseline-matrix-output/
          if-no-files-found: error
          retention-days: 90
