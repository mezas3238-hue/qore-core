name: QORE CIBO Phase22 Historical Policy Replay

on:
  push:
    branches:
      - agent/cibo-certification-architect-b-integration-001
    paths:
      - '.github/workflows/cibo-phase22-historical-policy-replay.yml'
      - 'src/qore/infrastructure/cibo_phase22_historical_policy_replay.py'
      - 'tests/infrastructure/test_cibo_phase22_historical_policy_replay.py'
  pull_request:
    paths:
      - '.github/workflows/cibo-phase22-historical-policy-replay.yml'
      - 'src/qore/infrastructure/cibo_phase22_historical_policy_replay.py'
      - 'tests/infrastructure/test_cibo_phase22_historical_policy_replay.py'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Validate counterfactual historical policy composition
        run: |
          ruff check \
            src/qore/infrastructure/cibo_phase22_historical_policy_replay.py \
            tests/infrastructure/test_cibo_phase22_historical_policy_replay.py
          mypy src/qore/infrastructure/cibo_phase22_historical_policy_replay.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_phase22_historical_policy_replay.py
