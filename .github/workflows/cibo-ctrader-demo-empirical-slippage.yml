name: QORE CIBO cTrader DEMO Empirical Slippage

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cibo-certification-architect-b-integration-001
    paths:
      - '.github/workflows/cibo-ctrader-demo-empirical-slippage.yml'
      - 'src/qore/infrastructure/cibo_ctrader_demo_empirical_slippage.py'
      - 'src/qore/infrastructure/ctrader_open_api_client.py'
      - 'scripts/cibo_ctrader_demo_empirical_slippage_probe.py'
      - 'tests/infrastructure/test_cibo_ctrader_demo_empirical_slippage.py'
  pull_request:
    paths:
      - '.github/workflows/cibo-ctrader-demo-empirical-slippage.yml'
      - 'src/qore/infrastructure/cibo_ctrader_demo_empirical_slippage.py'
      - 'src/qore/infrastructure/ctrader_open_api_client.py'
      - 'scripts/cibo_ctrader_demo_empirical_slippage_probe.py'
      - 'tests/infrastructure/test_cibo_ctrader_demo_empirical_slippage.py'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
  QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}

jobs:
  empirical-slippage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install -e '.[dev,ctrader]'

      - name: Quality
        run: |
          ruff check \
            src/qore/infrastructure/cibo_ctrader_demo_empirical_slippage.py \
            src/qore/infrastructure/ctrader_open_api_client.py \
            scripts/cibo_ctrader_demo_empirical_slippage_probe.py \
            tests/infrastructure/test_cibo_ctrader_demo_empirical_slippage.py
          mypy \
            src/qore/infrastructure/cibo_ctrader_demo_empirical_slippage.py \
            src/qore/infrastructure/ctrader_open_api_client.py \
            scripts/cibo_ctrader_demo_empirical_slippage_probe.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_ctrader_demo_empirical_slippage.py \
            tests/infrastructure/test_ctrader_demo_operational_runtime.py

      - name: Verify DEMO credentials without printing them
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            QORE_CTRADER_CLIENT_ID \
            QORE_CTRADER_CLIENT_SECRET \
            QORE_CTRADER_ACCESS_TOKEN \
            QORE_CTRADER_REFRESH_TOKEN
          do
            test -n "${!name:-}" || {
              echo "::error::missing required cTrader DEMO secret: $name"
              exit 1
            }
          done
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          fi

      - name: Collect empirical slippage read-only
        run: |
          mkdir -p empirical-slippage
          python scripts/cibo_ctrader_demo_empirical_slippage_probe.py \
            --output empirical-slippage/empirical-slippage.json \
            > empirical-slippage/empirical-slippage.stdout.json

      - name: Enforce read-only provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(
              Path(
                  "empirical-slippage/empirical-slippage.json"
              ).read_text(encoding="utf-8")
          )
          assert p["schema"] == "qore.cibo.ctrader_demo.empirical_slippage.v1"
          assert p["provider_key"] == "ctrader-demo"
          assert p["environment"] == "demo"
          assert p["read_only"] is True
          assert p["broker_mutation_performed"] is False
          assert p["holdout_outcomes_used"] is False
          assert p["historical_2017_exact_claimed"] is False
          assert p["target_aware"] is False
          assert p["productive_authority"] is False
          assert p["status"] in {
              "EMPIRICAL_SLIPPAGE_READY",
              "EMPIRICAL_SLIPPAGE_NOT_READY",
          }
          assert isinstance(p["qore_deals_found"], int)
          assert isinstance(p["observations"], list)
          assert isinstance(p["summaries"], list)
          PY

      - name: Seal empirical evidence
        run: |
          printf '%s\n' "$EVIDENCE_SHA" > empirical-slippage/git-sha.txt
          cd empirical-slippage
          sha256sum \
            empirical-slippage.json \
            empirical-slippage.stdout.json \
            git-sha.txt > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-ctrader-demo-empirical-slippage-${{ env.EVIDENCE_SHA }}
          path: empirical-slippage
          if-no-files-found: error
          retention-days: 90
