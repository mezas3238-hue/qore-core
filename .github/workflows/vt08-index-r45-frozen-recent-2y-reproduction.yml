name: VT08 Index R45 Frozen Recent 2Y Reproduction

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r45-frozen-recent-2y-reproduction.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r45_frozen_recent_2y_reproduction.py
      - tests/infrastructure/trader_lab/test_vt08_index_r45_frozen_recent_2y_reproduction.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r45_frozen_recent_2y_reproduction.py

  reproduction:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute frozen R45 recent 2Y reproduction
        run: |
          python -m qore.infrastructure.trader_lab.vt08_index_r45_frozen_recent_2y_reproduction \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r45-frozen-recent-2y-reproduction.json

      - name: Verify frozen identity and governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(Path("artifacts/report/vt08-index-r45-frozen-recent-2y-reproduction.json").read_text())
          assert report["identity"] == "VT08_INDEX_R45_FROZEN_RECENT_2Y_REPRODUCTION_001"
          assert report["candidate"]["candidate_id"] == "VT08_INDEX_R43_SOURCE_COMPLETE_2448_001"
          assert len(report["candidate"]["rule_fingerprint"]) == 64
          assert report["candidate"]["rules_changed_for_2y"] is False
          assert report["sample"] >= 1000
          g=report["governance"]
          assert g["candidate_frozen_before_replay"] is True
          assert g["no_retuning"] is True
          assert g["source_complete_architecture_preserved"] is True
          assert g["same_symbol_structural_concurrency_preserved"] is True
          assert g["signal_suppression_allowed"] is False
          assert g["live_authorized"] is False
          assert g["real_capital_authorized"] is False
          assert g["production_authorized"] is False
          PY

      - name: Upload R45 evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-index-r45-frozen-recent-2y-reproduction-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
