name: QORE VT-08 Cardinality Rebuild

on:
  pull_request:
    branches:
      - agent/trader-methodology-rebuild-v2-001
    paths:
      - .github/workflows/vt08-cardinality-rebuild.yml
      - docs/research/trader-lab/VT08-CARDINALITY-FORENSICS.md
      - docs/research/trader-lab/VT08-CANDIDATE-VS-TRADE-RECONCILIATION.json
      - docs/research/trader-lab/VT08-FOREX-SOURCE-RULEBOOK.md
      - docs/research/trader-lab/VT08-FUTURES-SOURCE-RULEBOOK.md
      - docs/research/trader-lab/TRADER-DAILY-CARDINALITY-CONTRACT.md
      - src/qore/infrastructure/trader_lab/trader_daily_cardinality.py
      - src/qore/infrastructure/traders/vt08_forex.py
      - src/qore/infrastructure/traders/vt08_futures.py
      - tests/infrastructure/trader_lab/test_trader_daily_cardinality.py
      - tests/infrastructure/traders/test_vt08_split_family_contracts.py
  push:
    branches:
      - agent/vt08-cardinality-rebuild-001
  workflow_dispatch:

concurrency:
  group: qore-vt08-cardinality-rebuild-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact rebuild head
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff full gate
        run: ruff check .
      - name: Mypy full gate
        run: mypy src tests
      - name: Daily cardinality focused gate
        run: |
          pytest -q \
            tests/infrastructure/trader_lab/test_trader_daily_cardinality.py \
            tests/infrastructure/traders/test_vt08_split_family_contracts.py
      - name: Pytest full quality gate
        run: pytest --cov=src/qore --cov-report=term-missing
