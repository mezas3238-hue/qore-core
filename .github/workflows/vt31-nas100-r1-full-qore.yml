name: QORE VT31 NAS100 R1 Full QORE

on:
  push:
    branches:
      - agent/vt31-nas100-r1-holdout-001
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Candidate self-test
        run: python scripts/vt31_nas100_r1_candidate.py --self-test
      - name: Focused test
        run: pytest -q tests/infrastructure/test_vt31_nas100_r1_candidate.py
      - name: Ruff
        run: ruff check .
      - name: Mypy strict project gate
        run: mypy src tests
      - name: Pytest full project gate
        run: pytest --cov=src/qore --cov-report=term-missing
