name: VT08 Index R101 Standard CISD Wick Routing Density

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r101-standard-cisd-wick-routing.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r101_standard_cisd_wick_routing.py
      - tests/infrastructure/trader_lab/test_vt08_index_r101_standard_cisd_wick_routing.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r101_standard_cisd_wick_routing.py

  census:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R101 wick-routing density census
        run: |
          mkdir -p artifacts/report
          python -m qore.infrastructure.trader_lab.vt08_index_r101_standard_cisd_wick_routing \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r101-standard-cisd-wick-routing.json

      - name: Verify R101 governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r101-standard-cisd-wick-routing.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R101_STANDARD_CISD_WICK_ROUTING_DENSITY_001"
          )
          assert report["source_r100"]["run_id"] == 35553739444
          assert report["source_r100"]["artifact_id"] == 10619881275
          assert report["source_r100"]["artifact_digest"] == (
              "sha256:c58d8e8844c5b99e46ae94653ded118b0f6564d285afe8ecbcdff227d657bb4b"
          )

          route = report["routing_contract"]
          assert route["primary_model"] == "D1_H4_M15"
          assert route["standard_cisd_surface_preserved"] is True
          assert route["small_wick"] == "SAME_H4_CANONICAL_CONTINUATION"
          assert route["large_wick"] == "IMMEDIATE_NEXT_H4_CONTINUATION"
          assert route["equal_wick"] == "FAIL_CLOSED"
          assert route["large_requires_swing_survival"] is True
          assert route["large_requires_bias_persistence"] is True
          assert route["large_requires_owner_authorized_next_h4"] is True
          assert route["positional_fallback"] is False
          assert route["later_h4_deferral"] is False
          assert route["pnl_evaluated"] is False

          assert report["five_year"]["canonical_sample"] == 2448
          assert report["recent_two_year"]["canonical_sample"] == 1017
          assert report["r66_failed_holdout"]["canonical_sample"] == 773
          assert report["decision"] == (
              "R101_STANDARD_CISD_WICK_ROUTING_DENSITY_CENSUS_COMPLETE_NO_PNL"
          )

          gov = report["governance"]
          assert gov["forensics_only"] is True
          assert gov["consumed_evidence_only"] is True
          assert gov["fresh_holdout_claim"] is False
          assert gov["future_information_used"] is False
          assert gov["pnl_evaluated"] is False
          assert gov["risk_changed"] is False
          assert gov["target_changed"] is False
          assert gov["anchors_changed"] is False
          assert gov["numeric_wick_threshold_search"] is False
          assert gov["market_or_anchor_selection_by_outcome"] is False
          assert gov["candidate_created"] is False
          assert gov["trader_certified"] is False
          assert gov["live_authorized"] is False
          assert gov["real_capital_authorized"] is False
          assert gov["production_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r101-standard-cisd-wick-routing-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
