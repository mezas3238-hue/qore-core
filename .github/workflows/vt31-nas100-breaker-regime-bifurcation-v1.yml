name: QORE VT31 NAS100 Breaker Regime Bifurcation V1

on:
  push:
    branches:
      - agent/vt31-nas100-hypothesis-lifecycle-v1
    paths:
      - scripts/vt31_nas100_breaker_regime_bifurcation_forensics_v1.py
      - .github/workflows/vt31-nas100-breaker-regime-bifurcation-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed_holdout
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Static gate
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_breaker_regime_bifurcation_forensics_v1.py
          ruff check scripts/vt31_nas100_breaker_regime_bifurcation_forensics_v1.py
      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"
      - name: Run breaker regime bifurcation forensics
        run: |
          set -euo pipefail
          python scripts/vt31_nas100_breaker_regime_bifurcation_forensics_v1.py \
            "input/${EVIDENCE_PATH}" \
            --partition "$PARTITION" \
            --output "result/breaker-bifurcation-${PARTITION}.json" \
            | tee "result/summary-${PARTITION}.json"
      - name: Governance gate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path(f"result/breaker-bifurcation-{os.environ['PARTITION']}.json").read_text())
          g=p["governance"]
          assert g["diagnostic_only"] is True
          assert g["broad_sign_reversing_breaker_states_not_gated"] is True
          assert g["searches_additional_decision_time_condition"] is True
          assert g["h4_h1_excluded_from_primary_causal_features"] is True
          assert g["calendar_blocks_used_at_runtime"] is False
          assert g["uses_terminal_pnl_at_runtime"] is False
          assert g["uses_fold_identity_at_runtime"] is False
          assert g["trade_policy_changed"] is False
          assert g["opens_new_holdout"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-breaker-bifurcation-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-nas100-breaker-bifurcation-*-${{ github.sha }}
          path: input
          merge-multiple: true
      - name: Aggregate stable breaker subconditions
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          folds={}
          for path in Path("input").glob("breaker-bifurcation-*.json"):
              p=json.loads(path.read_text())
              folds[p["partition"]]=p
          assert set(folds)=={"r5","r6","r8","consumed_holdout"}

          focus_names=set(folds["r5"]["focus_overall"])
          stable=[]
          y1_supported=[]
          y1_divergence=[]
          for focus in sorted(focus_names):
              cond_sets=[set(folds[f]["focus_overall"][focus]["conditions"]) for f in ("r5","r6","r8","consumed_holdout")]
              common=set.intersection(*cond_sets)
              y1conds=folds["consumed_holdout"]["consumed_blocks"]["Y1_WEAK"][focus]["conditions"]
              y2conds=folds["consumed_holdout"]["consumed_blocks"]["Y2_RECOVERY"][focus]["conditions"]
              for cond in sorted(common):
                  per={}
                  means=[]
                  samples=[]
                  for fold in ("r5","r6","r8","consumed_holdout"):
                      item=folds[fold]["focus_overall"][focus]["conditions"][cond]
                      mean=Decimal(str(item["metrics"]["mean_r"]))
                      means.append(mean); samples.append(int(item["sample"]))
                      per[fold]={"sample":item["sample"],"mean_r":str(mean),"total_r":item["metrics"]["total_r"],"loss_rate":item["loss_rate"],"loss_path_counts":item["loss_path_counts"]}
                  if all(s>=8 for s in samples) and all(m<0 for m in means):
                      stable.append({"focus":focus,"condition":cond,"per_fold":per})

                  if cond in y1conds and cond in y2conds:
                      a=y1conds[cond]; b=y2conds[cond]
                      am=Decimal(str(a["metrics"]["mean_r"])); bm=Decimal(str(b["metrics"]["mean_r"]))
                      sa=int(a["sample"]); sb=int(b["sample"])
                      cross=[Decimal(str(folds[f]["focus_overall"][focus]["conditions"][cond]["metrics"]["mean_r"])) for f in ("r5","r6","r8")]
                      base={"focus":focus,"condition":cond,"y1":{"sample":sa,"mean_r":str(am),"total_r":a["metrics"]["total_r"],"loss_rate":a["loss_rate"],"loss_path_counts":a["loss_path_counts"]},"y2":{"sample":sb,"mean_r":str(bm),"total_r":b["metrics"]["total_r"],"loss_rate":b["loss_rate"],"loss_path_counts":b["loss_path_counts"]},"crossfold_means":{"r5":str(cross[0]),"r6":str(cross[1]),"r8":str(cross[2])}}
                      if sa>=8 and am<0 and sum(m<=0 for m in cross)>=2:
                          y1_supported.append(base)
                      if sa>=8 and sb>=8 and am<0 and bm>0 and sum(m>0 for m in cross)>=2:
                          y1_divergence.append(base)

          def y1rank(items):
              return sorted(items,key=lambda x:(Decimal(x["y1"]["mean_r"]),x["focus"],x["condition"]))
          report={
              "schema":"qore.vt31.nas100.breaker_regime_bifurcation_forensics.aggregate.v1",
              "stable_4of4_negative_subconditions":stable,
              "y1_negative_with_crossfold_support":y1rank(y1_supported),
              "y1_divergence_do_not_gate":y1rank(y1_divergence),
              "governance":{"diagnostic_only":True,"calendar_not_runtime":True,"opens_new_holdout":False,"policy_promoted":False,"candidate_certified":False},
          }
          Path("result/aggregate.json").write_text(json.dumps(report,sort_keys=True,indent=2)+"\n")
          print(json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-breaker-bifurcation-aggregate-${{ github.sha }}
          path: result/
          retention-days: 90
