name: QORE Capitalizer V50-G Cognitive Geometry Economics

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - 'tests/infrastructure/trader_lab/test_capitalizer_v50_target_stop_intelligence.py'
      - '.github/workflows/qore-capitalizer-v50-g-cognitive-geometry.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v50_cognitive_geometry_economics.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v50_cognitive_geometry_specialist.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v50_cognitive_opportunity.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v50_target_stop_intelligence.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v50_cognitive_geometry_economics.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE development dependencies
        run: python -m pip install -e '.[dev]'
      - name: V50 stop-integrity regression
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_v50_target_stop_intelligence.py \
            tests/infrastructure/trader_lab/test_capitalizer_v50_target_stop_intelligence.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_v50_target_stop_intelligence.py
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_v50_target_stop_intelligence.py
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_v50_cognitive_geometry_economics.py \
            tests/infrastructure/trader_lab/test_capitalizer_v50_cognitive_geometry_economics.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_v50_cognitive_geometry_economics.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_v50_cognitive_geometry_economics.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - symbol: USDJPY
            session: ASIA
          - symbol: AUDJPY
            session: ASIA
          - symbol: AUDUSD
            session: ASIA
          - symbol: GBPJPY
            session: ASIA
          - symbol: EURUSD
            session: LONDON
          - symbol: GBPUSD
            session: LONDON
          - symbol: XAUUSD
            session: NEW_YORK
          - symbol: USDCAD
            session: NEW_YORK
          - symbol: NAS100
            session: NEW_YORK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download retained provider-native M1
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Verify retained M1 provenance
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("m1-source/m1-clone-manifest.json").read_text())
          assert manifest["canonical_symbol"] == os.environ["EXPECTED_SYMBOL"]
          assert manifest["provider_native_m1"] is True
          assert manifest["synthetic_m1"] is False
          assert manifest["interpolated_m1"] is False
          assert manifest["contradictory_m1"] == 0
          assert manifest["read_only"] is True
          PY
      - name: Build unchanged V49 source opportunities
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_high_frequency_capacity_census_v49 \
            market m1-source capacity-output --session "${{ matrix.session }}"
      - name: Run V50-G causal geometry economics
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v50_cognitive_geometry_economics \
            market capacity-output m1-source geometry-output
      - name: Enforce V50-G boundary
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
          EXPECTED_SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"].lower()
          result = json.loads(
              (Path("geometry-output") / f"capitalizer-{symbol}-v50-g-report.json").read_text()
          )
          assert result["symbol"] == os.environ["EXPECTED_SYMBOL"]
          assert result["session"] == os.environ["EXPECTED_SESSION"]
          assert result["entry_changed"] is False
          assert result["daily_used"] is False
          assert result["h4_used"] is False
          assert result["outcome_used_for_admission"] is False
          assert result["reserved_holdout_reopened"] is False
          assert result["fresh_holdout_used"] is False
          assert result["development_only"] is True
          assert result["rule_promotion_allowed"] is False
          assert result["trader_certified"] is False
          assert result["live_authorized"] is False
          PY
      - name: Upload V50-G market geometry
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v50-g-${{ matrix.symbol }}-${{ github.sha }}
          path: geometry-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download nine V50-G market artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v50-g-*-${{ github.sha }}
          path: geometry-markets
          merge-multiple: false
      - name: Build V50-G matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v50_cognitive_geometry_economics \
            matrix geometry-markets matrix-output
      - name: Enforce aggregate boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("matrix-output/capitalizer-v50-g-matrix.json").read_text()
          )
          assert result["decision_timeframes"] == ["H1", "M15", "M1"]
          assert result["entry_changed"] is False
          assert result["outcome_aware_selection"] is False
          assert result["reserved_holdout_reopened"] is False
          assert result["fresh_holdout_used"] is False
          assert result["development_only"] is True
          assert result["automatic_policy_promotion"] is False
          assert result["trader_certified"] is False
          assert result["live_authorized"] is False
          assert result["real_capital_authorized"] is False
          PY
      - name: Upload V50-G matrix
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v50-g-matrix-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 180
