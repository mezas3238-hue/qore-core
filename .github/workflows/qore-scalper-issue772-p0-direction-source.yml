name: Scalper Issue772 P0 H1 M15 M1 Causal Source Witness Nine Market

on:
  push:
    branches:
      - research/scalper-p0-h1-m15-m1-causal-direction-audit-20261011
    paths:
      - '.github/workflows/qore-scalper-issue772-p0-direction-source.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_issue772_direction_source_forensic_v1.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_issue772_source_census_aggregate_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_scalper_issue772_direction_forensic_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FROZEN_V49_RUN: '38053946695'
  FROZEN_V49_SHA: 'e356e7a52541e99533b25ecfef0ab9c4e9ce03c0'
  M1_RUN: '35548099334'
  M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: No future, only full native H1, deterministic sample
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_scalper_issue772_direction_source_forensic_v1.py src/qore/infrastructure/trader_lab/capitalizer_scalper_issue772_source_census_aggregate_v1.py tests/infrastructure/trader_lab/test_capitalizer_scalper_issue772_direction_forensic_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_scalper_issue772_direction_source_forensic_v1.py src/qore/infrastructure/trader_lab/capitalizer_scalper_issue772_source_census_aggregate_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_scalper_issue772_direction_forensic_v1.py

  nine_markets:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol: [USDJPY, AUDJPY, AUDUSD, GBPJPY, EURUSD, GBPUSD, XAUUSD, USDCAD, NAS100]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: scalper-a2-v49-control-${{ matrix.symbol }}-${{ env.FROZEN_V49_SHA }}
          path: frozen
          github-token: ${{ github.token }}
          run-id: ${{ env.FROZEN_V49_RUN }}
      - uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.M1_SHA }}
          path: native
          github-token: ${{ github.token }}
          run-id: ${{ env.M1_RUN }}
      - name: Provider native only, no broker execution
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads(Path("native/m1-clone-manifest.json").read_text())
          assert x["canonical_symbol"]==os.environ["SYMBOL"]
          assert x["provider_native_m1"] and not x["synthetic_m1"]
          assert not x["interpolated_m1"] and x["contradictory_m1"]==0
          assert x["read_only"]
          PY
      - name: Reconcile V49 source-only as-of price, inherited H1 and lag
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_issue772_direction_source_forensic_v1 frozen native market-audit
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-issue772-P0-source-${{ matrix.symbol }}-${{ github.sha }}
          path: |
            market-audit/
            frozen/
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: nine_markets
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: scalper-issue772-P0-source-*-${{ github.sha }}
          path: all-nine
      - name: Exactly 2876 source + 2020 A + 20 deterministic outcome-blind traces
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_issue772_source_census_aggregate_v1 all-nine report
      - name: Fail-closed published scientific boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("report/scalper-issue772-source-causal-nine-market-report.json").read_text())
          assert x["all_source"]==2876 and x["original_A"]==2020
          assert len(x["manifest20"])==20
          assert x["source_only_NO_economics"]
          assert not x["author_validated_signal_semantics"]
          assert not x["independent_full_first_online_reconstructed"]
          assert not x["V49_or_VPS_modified"] and not x["certified"]
          assert len(list(Path("report/20_outcome_blind_asof_traces").glob("*.md")))==20
          print("ISSUE772_SOURCE_ONLY",json.dumps({
              "all":x["all_source"],"A":x["original_A"],
              "20":len(x["manifest20"]),
              "counts_A":x["A_2020_census"],
              "lag":x["A_m15_confirmed_to_m1_entry_minutes"],
              "H1age":x["A_recovered_origin_H1_age_minutes_observed_only"],
              "independent_first_online":False,
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalper-issue772-P0-source-census-20traces-${{ github.sha }}
          path: report/
          retention-days: 90
          if-no-files-found: error
