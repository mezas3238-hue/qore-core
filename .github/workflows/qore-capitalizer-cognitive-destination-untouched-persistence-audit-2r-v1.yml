name: QORE Capitalizer Cognitive Destination Untouched Persistence Audit 2R V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-cognitive-destination-untouched-persistence-audit-2r-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_cognitive_destination_untouched_persistence_audit_2r_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_cognitive_destination_untouched_persistence_audit_2r_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-cognitive-destination-untouched-persistence-audit-2r-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  REBASE_RUN_ID: '36078677895'
  REBASE_SHA: 'cfc04849c8bbfd6565310d89456f5e367ea880f7'
  DEPARTURE_RUN_ID: '36085887285'
  DEPARTURE_SHA: 'c0529ca61dfd57cc7f3168bcee68751ef5651335'
  TARGET_RUN_ID: '35204892665'
  TARGET_SHA: '2f510461b3360e91d5ee70a72716a76cd6561f16'
  M1_RUN_ID: '35548099334'
  M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check             src/qore/infrastructure/trader_lab/capitalizer_cognitive_destination_untouched_persistence_audit_2r_v1.py             tests/infrastructure/trader_lab/test_capitalizer_cognitive_destination_untouched_persistence_audit_2r_v1.py
      - name: Mypy
        run: |
          mypy             src/qore/infrastructure/trader_lab/capitalizer_cognitive_destination_untouched_persistence_audit_2r_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov             tests/infrastructure/trader_lab/test_capitalizer_cognitive_destination_untouched_persistence_audit_2r_v1.py

  scan:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - symbol: USDJPY
            expected_bound: 11
          - symbol: AUDJPY
            expected_bound: 8
          - symbol: AUDUSD
            expected_bound: 8
          - symbol: GBPJPY
            expected_bound: 8
          - symbol: EURUSD
            expected_bound: 11
          - symbol: GBPUSD
            expected_bound: 16
          - symbol: XAUUSD
            expected_bound: 7
          - symbol: USDCAD
            expected_bound: 5
          - symbol: NAS100
            expected_bound: 8
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download true-2R cognitive rebase
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cognitive-economic-rebase-2r-v1-${{ env.REBASE_SHA }}
          path: rebase-input
          github-token: ${{ github.token }}
          run-id: ${{ env.REBASE_RUN_ID }}
      - name: Download strict Destination departure binding
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cognitive-destination-departure-binding-audit-2r-v1-${{ env.DEPARTURE_SHA }}
          path: departure-input
          github-token: ${{ github.token }}
          run-id: ${{ env.DEPARTURE_RUN_ID }}
      - name: Download Target V2 market ledger
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-target-destination-v2-${{ matrix.symbol }}-${{ env.TARGET_SHA }}
          path: target-input
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Download native M1 market ledger
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.M1_SHA }}
          path: m1-input
          github-token: ${{ github.token }}
          run-id: ${{ env.M1_RUN_ID }}
      - name: Audit Destination untouched persistence
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cognitive_destination_untouched_persistence_audit_2r_v1             market rebase-input departure-input target-input m1-input cell-output             --symbol ${{ matrix.symbol }}
      - name: Enforce market persistence controls
        env:
          MATRIX_SYMBOL: ${{ matrix.symbol }}
          EXPECTED_BOUND: ${{ matrix.expected_bound }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["MATRIX_SYMBOL"]
          expected = int(os.environ["EXPECTED_BOUND"])
          path = Path(
              "cell-output/"
              f"capitalizer-{symbol.lower()}-"
              "destination-untouched-persistence-audit-2r-v1.json"
          )
          report = json.loads(path.read_text())
          assert report["identity"] == (
              "QORE_CAPITALIZER_COGNITIVE_DESTINATION_UNTOUCHED_PERSISTENCE_AUDIT_2R_V1"
          )
          assert report["symbol"] == symbol
          assert report["source_rebase_run_id"] == 36078677895
          assert report["source_departure_run_id"] == 36085887285
          assert report["source_target_run_id"] == 35204892665
          assert report["source_m1_run_id"] == 35548099334
          assert report["target_r"] == "2.00"
          assert report["departure_bound_trades"] == expected
          assert (
              report["m1_window_complete_trades"]
              + report["m1_window_incomplete_trades"]
              == expected
          )
          assert (
              report["at_least_one_candidate_untouched_through_entry_trades"]
              + report["all_candidates_touched_before_entry_trades"]
              == report["m1_window_complete_trades"]
          )
          assert report["candidate_rows_at_departure"] > 0
          assert report["m1_touch_reconstruction_only"] is True
          assert report["target_result_fields_read"] is False
          assert report["target_touch_fields_read"] is False
          assert report["current_trade_outcome_visible_to_audit"] is False
          assert report["destination_structural_current_at_entry_supported"] is False
          assert report["destination_available_at_entry_supported"] is False
          assert report["destination_intelligence_supported"] is False
          assert report["missing_evidence_fabricated"] is False
          assert report["rebase_control_reproduced"] is True
          assert report["departure_binding_control_reproduced"] is True
          assert report["strategy_rules_changed"] is False
          assert report["cognitive_rules_changed"] is False
          assert report["entry_changed"] is False
          assert report["stop_changed"] is False
          assert report["target_changed"] is False
          assert report["max3_changed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-destination-untouched-persistence-cell-${{ matrix.symbol }}-${{ github.sha }}
          path: cell-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download nine persistence cells
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-destination-untouched-persistence-cell-*-${{ github.sha }}
          path: matrix-input
          merge-multiple: false
      - name: Build nine-market persistence matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cognitive_destination_untouched_persistence_audit_2r_v1             matrix matrix-input matrix-output
      - name: Enforce matrix controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "matrix-output/"
                  "capitalizer-nine-market-destination-untouched-persistence-matrix-2r-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_COGNITIVE_DESTINATION_UNTOUCHED_PERSISTENCE_MATRIX_2R_V1"
          )
          assert report["source_rebase_run_id"] == 36078677895
          assert report["source_departure_run_id"] == 36085887285
          assert report["source_target_run_id"] == 35204892665
          assert report["source_m1_run_id"] == 35548099334
          assert report["market_count"] == 9
          assert report["target_r"] == "2.00"
          assert report["departure_bound_trades"] == 82
          assert (
              report["m1_window_complete_trades"]
              + report["m1_window_incomplete_trades"]
              == 82
          )
          assert (
              report["at_least_one_candidate_untouched_through_entry_trades"]
              + report["all_candidates_touched_before_entry_trades"]
              == report["m1_window_complete_trades"]
          )
          assert report["by_market"] == {
              "AUDJPY": {
                  "departure_bound_trades": 8,
                  "m1_window_complete_trades": report["by_market"]["AUDJPY"]["m1_window_complete_trades"],
                  "at_least_one_candidate_untouched_through_entry_trades": report["by_market"]["AUDJPY"]["at_least_one_candidate_untouched_through_entry_trades"],
                  "all_candidates_touched_before_entry_trades": report["by_market"]["AUDJPY"]["all_candidates_touched_before_entry_trades"],
              },
              "AUDUSD": {
                  "departure_bound_trades": 8,
                  "m1_window_complete_trades": report["by_market"]["AUDUSD"]["m1_window_complete_trades"],
                  "at_least_one_candidate_untouched_through_entry_trades": report["by_market"]["AUDUSD"]["at_least_one_candidate_untouched_through_entry_trades"],
                  "all_candidates_touched_before_entry_trades": report["by_market"]["AUDUSD"]["all_candidates_touched_before_entry_trades"],
              },
              "EURUSD": {
                  "departure_bound_trades": 11,
                  "m1_window_complete_trades": report["by_market"]["EURUSD"]["m1_window_complete_trades"],
                  "at_least_one_candidate_untouched_through_entry_trades": report["by_market"]["EURUSD"]["at_least_one_candidate_untouched_through_entry_trades"],
                  "all_candidates_touched_before_entry_trades": report["by_market"]["EURUSD"]["all_candidates_touched_before_entry_trades"],
              },
              "GBPJPY": {
                  "departure_bound_trades": 8,
                  "m1_window_complete_trades": report["by_market"]["GBPJPY"]["m1_window_complete_trades"],
                  "at_least_one_candidate_untouched_through_entry_trades": report["by_market"]["GBPJPY"]["at_least_one_candidate_untouched_through_entry_trades"],
                  "all_candidates_touched_before_entry_trades": report["by_market"]["GBPJPY"]["all_candidates_touched_before_entry_trades"],
              },
              "GBPUSD": {
                  "departure_bound_trades": 16,
                  "m1_window_complete_trades": report["by_market"]["GBPUSD"]["m1_window_complete_trades"],
                  "at_least_one_candidate_untouched_through_entry_trades": report["by_market"]["GBPUSD"]["at_least_one_candidate_untouched_through_entry_trades"],
                  "all_candidates_touched_before_entry_trades": report["by_market"]["GBPUSD"]["all_candidates_touched_before_entry_trades"],
              },
              "NAS100": {
                  "departure_bound_trades": 8,
                  "m1_window_complete_trades": report["by_market"]["NAS100"]["m1_window_complete_trades"],
                  "at_least_one_candidate_untouched_through_entry_trades": report["by_market"]["NAS100"]["at_least_one_candidate_untouched_through_entry_trades"],
                  "all_candidates_touched_before_entry_trades": report["by_market"]["NAS100"]["all_candidates_touched_before_entry_trades"],
              },
              "USDCAD": {
                  "departure_bound_trades": 5,
                  "m1_window_complete_trades": report["by_market"]["USDCAD"]["m1_window_complete_trades"],
                  "at_least_one_candidate_untouched_through_entry_trades": report["by_market"]["USDCAD"]["at_least_one_candidate_untouched_through_entry_trades"],
                  "all_candidates_touched_before_entry_trades": report["by_market"]["USDCAD"]["all_candidates_touched_before_entry_trades"],
              },
              "USDJPY": {
                  "departure_bound_trades": 11,
                  "m1_window_complete_trades": report["by_market"]["USDJPY"]["m1_window_complete_trades"],
                  "at_least_one_candidate_untouched_through_entry_trades": report["by_market"]["USDJPY"]["at_least_one_candidate_untouched_through_entry_trades"],
                  "all_candidates_touched_before_entry_trades": report["by_market"]["USDJPY"]["all_candidates_touched_before_entry_trades"],
              },
              "XAUUSD": {
                  "departure_bound_trades": 7,
                  "m1_window_complete_trades": report["by_market"]["XAUUSD"]["m1_window_complete_trades"],
                  "at_least_one_candidate_untouched_through_entry_trades": report["by_market"]["XAUUSD"]["at_least_one_candidate_untouched_through_entry_trades"],
                  "all_candidates_touched_before_entry_trades": report["by_market"]["XAUUSD"]["all_candidates_touched_before_entry_trades"],
              },
          }
          assert report["candidate_rows_at_departure"] > 0
          assert report["m1_touch_reconstruction_only"] is True
          assert report["target_result_fields_read"] is False
          assert report["target_touch_fields_read"] is False
          assert report["current_trade_outcome_visible_to_audit"] is False
          assert report["destination_structural_current_at_entry_supported"] is False
          assert report["destination_available_at_entry_supported"] is False
          assert report["destination_intelligence_supported"] is False
          assert report["missing_evidence_fabricated"] is False
          assert report["strategy_rules_changed"] is False
          assert report["cognitive_rules_changed"] is False
          assert report["entry_changed"] is False
          assert report["stop_changed"] is False
          assert report["target_changed"] is False
          assert report["max3_changed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-destination-untouched-persistence-matrix-2r-v1-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
