name: QORE Shared B Provider-Attested Identity Boundary

on:
  push:
    branches:
      - agent/shared-b-global-world-perception-001
    paths:
      - src/qore/infrastructure/core_stack_v2/shared_b_provider_attested_identity.py
      - scripts/shared_b_provider_attested_identity.py
      - tests/infrastructure/test_shared_b_provider_attested_identity.py
      - .github/workflows/qore-shared-b-provider-attested-identity.yml
  workflow_dispatch:

concurrency:
  group: qore-shared-b-provider-attested-identity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  issues: write

env:
  GEN2_RUN_ID: "36623131862"
  GEN2_ARTIFACT_ID: "11059307341"
  GEN2_GIT_SHA: "f5fcd0c9552466132f6f47bb124805e49e774493"

jobs:
  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Shared
        run: pip install -e ".[dev]"

      - name: Validate provider-attested boundary implementation
        run: |
          set -euo pipefail
          ruff check \
            src/qore/infrastructure/core_stack_v2/shared_b_provider_attested_identity.py \
            scripts/shared_b_provider_attested_identity.py \
            tests/infrastructure/test_shared_b_provider_attested_identity.py
          mypy \
            src/qore/infrastructure/core_stack_v2/shared_b_provider_attested_identity.py \
            scripts/shared_b_provider_attested_identity.py
          pytest -q tests/infrastructure/test_shared_b_provider_attested_identity.py

      - name: Verify exact frozen provider lineage
        run: |
          set -euo pipefail
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GEN2_RUN_ID}" --jq '.status')" = "completed"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GEN2_RUN_ID}" --jq '.conclusion')" = "success"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GEN2_RUN_ID}" --jq '.head_sha')" = "$GEN2_GIT_SHA"

      - name: Recover sealed provider catalogue
        run: |
          set -euo pipefail
          mkdir -p input/provider result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${GEN2_ARTIFACT_ID}/zip" > provider.zip
          unzip -q provider.zip -d input/provider
          sums="$(find input/provider -name SHA256SUMS -print -quit)"
          test -n "$sums"
          (cd "$(dirname "$sums")" && sha256sum -c SHA256SUMS)
          provider_file="$(find input/provider -name provider-schedule-catalog.json -print -quit)"
          test -n "$provider_file"
          printf 'PROVIDER_FILE=%s\n' "$provider_file" >> "$GITHUB_ENV"

      - name: Materialize exact provider-attested economic boundary
        run: |
          set -euo pipefail
          python scripts/shared_b_provider_attested_identity.py \
            --provider-schedule "$PROVIDER_FILE" \
            --known-at "2026-09-30T20:30:00+00:00" \
            --output result/shared-b-provider-attested-identity-boundary.json \
            | tee result/summary.json

      - name: Enforce no identity authority widening
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(
              Path(
                  "result/shared-b-provider-attested-identity-boundary.json"
              ).read_text()
          )
          assert p["identity"] == "SHARED_B_PROVIDER_ATTESTED_ECONOMIC_IDENTITY_BOUNDARY_001"
          assert p["status"] == "EXACT_PROVIDER_ATTESTED_ECONOMIC_BOUNDARY_MATERIALIZED"
          assert p["sensor_count"] == 98
          assert p["index_sensor_count"] == 25
          assert p["cryptocurrency_sensor_count"] == 73
          assert p["provider_attested_economic_object_count"] == 98
          assert p["provider_neutral_reference_identity_verified_count"] == 0
          assert p["canonical_economic_identity_verified_count"] == 0
          assert p["provider_metadata_is_canonical_proof"] is False
          assert p["provider_description_is_tradable_identity_proof"] is False
          assert p["automatic_identity_inference"] is False
          assert p["symbol_name_similarity_used"] is False
          assert p["historical_market_data_read"] is False
          assert p["target_or_outcome_read"] is False
          assert p["r6_r5_read"] is False
          assert p["fresh_holdout_opened"] is False
          assert p["broker_mutation"] is False
          assert p["productive_authority"] is False
          assert len(p["records"]) == 98
          assert len(p["boundary_fingerprint_sha256"]) == 64
          PY

      - name: Seal B-06 provider-attested boundary
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > result/code-git-sha.txt
          printf '%s\n' "$GITHUB_RUN_ID" > result/run-id.txt
          (
            cd result
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
              | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload B-06 provider-attested boundary
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: qore-shared-b-provider-attested-identity-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Report B-06 progress
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          gh issue comment 638 --repo "$GITHUB_REPOSITORY" --body "Architect B B-06 progress: run ${GITHUB_RUN_ID}, SHA ${GITHUB_SHA}, artifact ${ARTIFACT_ID}. The 98 previously provider-native-only sensors are now materialized as provider-attested economic objects: 25 indices + 73 cryptocurrencies. This does NOT promote provider metadata into provider-neutral/canonical, tradable, listing, calendar, historical, relational, admission, execution or productive authority; B-06 remains open pending those evidence layers."
