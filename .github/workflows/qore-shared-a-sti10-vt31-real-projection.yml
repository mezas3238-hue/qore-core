name: QORE Shared A STI10 VT31 Real Projection

concurrency:
  group: qore-shared-a-sti10-vt31-real-projection
  cancel-in-progress: false

on:
  push:
    branches:
      - agent/shared-a-cognitive-science-001
    paths:
      - scripts/shared_sti10_vt31_real_projection.py
      - .github/workflows/qore-shared-a-sti10-vt31-real-projection.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate projection contracts
        run: |
          set -euo pipefail
          mkdir -p input/{r6,r5} result
          ruff check scripts/shared_sti10_vt31_real_projection.py
          python -m py_compile scripts/shared_sti10_vt31_real_projection.py
          pytest -q tests/infrastructure/test_core_stack_v2_shared_trader_intelligence.py tests/infrastructure/test_core_stack_v2_shared_trader_intelligence_lifecycle.py
      - name: Recover immutable source evidence
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10389112524/zip" > r6.zip
          unzip -q r6.zip -d input/r6
          (cd input/r6 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10380044761/zip" > r5.zip
          unzip -q r5.zip -d input/r5
          (cd input/r5 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)
      - name: Bind VT31 relevance projection
        run: |
          set -euo pipefail
          python scripts/shared_sti10_vt31_real_projection.py             --r6-nas input/r6/fresh/NAS100/market-evidence.json             --r6-sp input/r6/fresh/SP500/market-evidence.json             --r6-us input/r6/fresh/US30/market-evidence.json             --r5-nas input/r5/fresh/NAS100/market-evidence.json             --r5-sp input/r5/fresh/SP500/market-evidence.json             --r5-us input/r5/fresh/US30/market-evidence.json             --output result/sti10-vt31-real-projection.json             | tee result/summary.json
      - name: Validate bounded disposition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/sti10-vt31-real-projection.json").read_text())
          assert p["status"] == "STI10_VT31_REAL_PROJECTION_BINDING_PASS"
          assert p["vt31_real_data_bound"] is True
          assert p["projection_changes_global_truth"] is False
          assert p["trader_methodology_visible_to_shared"] is False
          assert p["execution_authority"] is False
          assert p["seven_trader_global_world_binding_complete"] is False
          assert p["sti10_completed_and_proven"] is False
          assert p["protected_certification_holdout_opened"] is False
          PY
      - name: Seal result
        run: |
          printf '%s\n' "${GITHUB_SHA}" > result/code-git-sha.txt
          (
            cd result
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-a-sti10-vt31-real-projection-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
      - name: Report STI10
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p=json.loads(Path("result/sti10-vt31-real-projection.json").read_text())
          body="\n".join([
              "## Shared A STI-10 — VT31 Real Relevant Projection",
              "",
              f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- disposition: **{p['status']}**",
              f"- R6: **{p['results']['r6']}**",
              f"- R5: **{p['results']['r5']}**",
              "- projection changes global truth: **False**",
              "- Trader methodology visible to Shared: **False**",
              "- seven-Trader global binding complete: **False**",
              "- STI-10 completed-and-proven: **False**",
              "- dependency: **B_GLOBAL_WORLD_MULTI_FAMILY_BINDING**",
          ])+"\n"
          Path("result/issue-comment.md").write_text(body)
          PY
          gh issue comment 638 --body-file result/issue-comment.md
