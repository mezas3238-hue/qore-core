name: QORE Shared A MC25 Governed Self Improvement

on:
  push:
    branches: [agent/shared-a-cognitive-science-001]
    paths:
      - src/qore/infrastructure/core_stack_v2/governed_self_improvement.py
      - tests/infrastructure/test_core_stack_v2_governed_self_improvement.py
      - scripts/shared_mc25_governed_self_improvement_audit.py
      - .github/workflows/qore-shared-a-mc25-governed-self-improvement.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Validate
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          mkdir -p result
          ruff check src/qore/infrastructure/core_stack_v2/governed_self_improvement.py tests/infrastructure/test_core_stack_v2_governed_self_improvement.py scripts/shared_mc25_governed_self_improvement_audit.py
          mypy src/qore/infrastructure/core_stack_v2/governed_self_improvement.py
          pytest -q tests/infrastructure/test_core_stack_v2_governed_self_improvement.py
          python scripts/shared_mc25_governed_self_improvement_audit.py | tee result/summary.json
      - name: Bound disposition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/mc25-governed-self-improvement-audit.json").read_text())
          assert p["status"] == "MC25_GOVERNED_SELF_IMPROVEMENT_FOUNDATION_PASS"
          assert p["highest_completed_stage"] == "HOLDOUT"
          assert p["promotion_allowed"] is False
          assert p["direct_experimental_to_certified"] is False
          assert p["mc25_completed_and_proven"] is False
          PY
      - name: Seal
        run: |
          printf '%s\n' "${GITHUB_SHA}" > result/code-git-sha.txt
          (cd result && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-a-mc25-self-improvement-${{ github.sha }}
          path: result/
          retention-days: 90
      - name: Report
        run: |
          {
            echo "## Shared A MC-25 — Governed Self-Improvement foundation"
            echo
            echo "- WP04 V3B chain bound through HOLDOUT"
            echo "- direct promotion: **False**"
            echo "- stress / shadow / certification still required: **True**"
            echo "- MC-25 completed-and-proven: **False**"
          } > result/issue-comment.md
          gh issue comment 638 --body-file result/issue-comment.md
