name: QORE CIBO Phase22 Fresh Batch Assembly Contract

on:
  push:
    branches:
      - agent/cibo-integrator-ab-001
    paths:
      - 'src/qore/infrastructure/cibo_phase22_fresh_batch_assembly.py'
      - 'src/qore/infrastructure/cibo_phase22_fresh_opportunity_batch.py'
      - 'tests/infrastructure/test_cibo_phase22_fresh_opportunity_batch.py'
      - 'scripts/cibo_phase22_fresh_batch_assembler.py'
      - 'src/qore/infrastructure/cibo_phase22_vt08_fresh_runner.py'
      - 'scripts/cibo_phase22_vt08_fresh_runner.py'
      - 'tests/infrastructure/test_cibo_phase22_vt08_fresh_runner.py'
      - 'tests/infrastructure/test_cibo_phase22_fresh_batch_assembly.py'
      - '.github/workflows/cibo-phase22-fresh-batch-assembly-contract.yml'
  pull_request:
    paths:
      - 'src/qore/infrastructure/cibo_phase22_fresh_batch_assembly.py'
      - 'src/qore/infrastructure/cibo_phase22_fresh_opportunity_batch.py'
      - 'tests/infrastructure/test_cibo_phase22_fresh_opportunity_batch.py'
      - 'scripts/cibo_phase22_fresh_batch_assembler.py'
      - 'tests/infrastructure/test_cibo_phase22_fresh_batch_assembly.py'
      - '.github/workflows/cibo-phase22-fresh-batch-assembly-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Validate claimed exact-7/7 fresh assembly contract
        run: |
          ruff check \
            src/qore/infrastructure/cibo_phase22_fresh_batch_assembly.py \
            src/qore/infrastructure/cibo_phase22_fresh_opportunity_batch.py \
            scripts/cibo_phase22_fresh_batch_assembler.py \
            src/qore/infrastructure/cibo_phase22_vt08_fresh_runner.py \
            scripts/cibo_phase22_vt08_fresh_runner.py \
            tests/infrastructure/test_cibo_phase22_fresh_batch_assembly.py \
            tests/infrastructure/test_cibo_phase22_fresh_opportunity_batch.py \
            tests/infrastructure/test_cibo_phase22_vt08_fresh_runner.py
          mypy \
            src/qore/infrastructure/cibo_phase22_fresh_batch_assembly.py \
            src/qore/infrastructure/cibo_phase22_fresh_opportunity_batch.py \
            scripts/cibo_phase22_fresh_batch_assembler.py \
            src/qore/infrastructure/cibo_phase22_vt08_fresh_runner.py \
            scripts/cibo_phase22_vt08_fresh_runner.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_phase22_fresh_batch_assembly.py \
            tests/infrastructure/test_cibo_phase22_vt08_fresh_runner.py
