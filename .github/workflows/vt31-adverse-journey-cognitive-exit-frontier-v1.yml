name: QORE VT31 Adverse Journey Cognitive Exit Frontier V1

on:
  push:
    branches:
      - agent/vt31-edge-position-cert-b-001
    paths:
      - scripts/vt31_nas100_adverse_journey_cognitive_exit_frontier_v1.py
      - scripts/vt31_nas100_h3_dol2_composition_frontier_v1.py
      - scripts/vt31_nas100_live_cognitive_breaker_protection_frontier_v1.py
      - src/qore/infrastructure/traders/vt31_nas100_post_entry_cognitive_runtime.py
      - src/qore/infrastructure/traders/vt31_nas100_position_intelligence.py
      - src/qore/infrastructure/traders/vt31_nas100_reasoning_engine.py
      - .github/workflows/vt31-adverse-journey-cognitive-exit-frontier-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Static and focused gates
        run: |
          set -euo pipefail
          python -m py_compile             scripts/vt31_nas100_adverse_journey_cognitive_exit_frontier_v1.py             scripts/vt31_nas100_h3_dol2_composition_frontier_v1.py
          ruff check             scripts/vt31_nas100_adverse_journey_cognitive_exit_frontier_v1.py             scripts/vt31_nas100_h3_dol2_composition_frontier_v1.py
          pytest -q -o addopts=''             tests/infrastructure/test_vt31_nas100_position_intelligence.py             tests/infrastructure/test_vt31_nas100_post_entry_cognitive_runtime.py             tests/infrastructure/test_vt31_nas100_edge_certification.py

      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"

      - name: Run adverse journey cognitive exit frontier
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python             scripts/vt31_nas100_adverse_journey_cognitive_exit_frontier_v1.py             "input/${EVIDENCE_PATH}"             --output "result/adverse-journey-exit-${PARTITION}.json"             | tee "result/summary-${PARTITION}.json"

      - name: Governance
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=os.environ["PARTITION"]
          x=json.loads(
              Path(f"result/adverse-journey-exit-{p}.json").read_text()
          )
          g=x["governance"]
          assert x["material_adverse_r"] == "-0.50"
          assert g["live_full_cognition_reassessed"] is True
          assert g["current_open_r_causal"] is True
          assert g["exit_decision_on_closed_m1"] is True
          assert g["exit_execution_next_m1_open"] is True
          assert g["same_bar_hindsight_used"] is False
          assert g["stale_sequence_8_14_preexisting_reasoning_state"] is True
          assert g["stale_sequence_threshold_newly_outcome_tuned"] is False
          assert g["residual_context_hypotheses_consumed_discovery_only"] is True
          assert g["residual_context_new_numeric_threshold_added"] is False
          assert g["residual_variants_must_nondegrade_comparator_002"] is True
          assert g["position_sizing_used"] is False
          assert g["dynamic_sizing_used"] is False
          assert g["leverage_used"] is False
          assert g["compounding_used"] is False
          assert g["capital_weighting_used"] is False
          assert g["fold_identity_used_for_action"] is False
          assert g["future_outcome_used_for_action"] is False
          assert g["fresh_holdout_opened"] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-adverse-journey-exit-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-adverse-journey-exit-*-${{ github.sha }}
          path: input
          merge-multiple: true

      - name: Adjudicate
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          folds=("r5","r6","r8","consumed")
          variants=(
              "COG_EXIT_CAUTION",
              "COG_EXIT_CAUTION_WEAK_PATH",
              "COG_EXIT_STALE_MIXED",
              "COG_EXIT_CAUTION_OR_STALE_MIXED",
              "BASE_PLUS_FVG_NONSHALLOW",
              "BASE_PLUS_NONOB_NORMAL",
              "BASE_PLUS_FVG_NONSHALLOW_OR_NONOB_NORMAL",
              "COG_EXIT_NONSUPPORTIVE",
          )
          payloads={
              fold:json.loads(
                  Path(f"input/adverse-journey-exit-{fold}.json").read_text()
              )
              for fold in folds
          }

          def d(value):
              return Decimal(str(value))

          def pf(metrics):
              value=metrics["profit_factor"]
              if value is None:
                  return (
                      Decimal("Infinity")
                      if int(metrics["wins"])>0 and int(metrics["losses"])==0
                      else Decimal("-Infinity")
                  )
              return d(value)

          report={}
          for variant in variants:
              per={}
              pf_ok=mean_ok=dd_ok=0
              winners_all=True
              temporal_all=True
              for fold in folds:
                  comparator_name=(
                      "COG_EXIT_CAUTION_OR_STALE_MIXED"
                      if variant.startswith("BASE_PLUS_")
                      else "CONTROL"
                  )
                  base=payloads[fold]["variants"][comparator_name]
                  cand=payloads[fold]["variants"][variant]
                  bm=base["stress_0_05r"]
                  cm=cand["stress_0_05r"]
                  wp=(
                      cand["winner_preservation_vs_residual_comparator"]
                      if variant.startswith("BASE_PLUS_")
                      else cand["winner_preservation_vs_control"]
                  )
                  pf_non=pf(cm)>=pf(bm)
                  mean_non=d(cm["mean_r"])>=d(bm["mean_r"])
                  dd_non=d(cm["max_drawdown_r"])<=d(bm["max_drawdown_r"])
                  winner_non=(
                      d(wp["winner_count_preservation"])>=Decimal("0.80")
                      and d(wp["winner_r_preservation"])>=Decimal("0.90")
                  )
                  pf_ok+=int(pf_non)
                  mean_ok+=int(mean_non)
                  dd_ok+=int(dd_non)
                  winners_all &= winner_non

                  common=(
                      set(base["halfyear_stress"])
                      & set(cand["halfyear_stress"])
                  )
                  blocks={}
                  for key in sorted(common):
                      mean_delta=(
                          d(cand["halfyear_stress"][key]["mean_r"])
                          - d(base["halfyear_stress"][key]["mean_r"])
                      )
                      dd_block=(
                          d(cand["halfyear_stress"][key]["max_drawdown_r"])
                          <= d(base["halfyear_stress"][key]["max_drawdown_r"])
                      )
                      ok=mean_delta>=0 and dd_block
                      temporal_all &= ok
                      blocks[key]={
                          "mean_r_delta":format(mean_delta,"f"),
                          "dd_nondegrade":dd_block,
                          "nondegrade":ok,
                      }

                  per[fold]={
                      "development_comparator":comparator_name,
                      "baseline":bm,
                      "candidate":cm,
                      "monte_carlo":cand["monte_carlo"],
                      "winner_preservation":wp,
                      "pf_nondegrade":pf_non,
                      "mean_nondegrade":mean_non,
                      "dd_nondegrade":dd_non,
                      "winner_floor_pass":winner_non,
                      "halfyears":blocks,
                      "changed_trade_count":(
                          cand["changed_trade_count_vs_residual_comparator"]
                          if variant.startswith("BASE_PLUS_")
                          else cand["changed_trade_count_vs_control"]
                      ),
                      "cognitive_exit_count":cand["cognitive_exit_count"],
                      "cognitive_evaluation_count":cand[
                          "cognitive_evaluation_count"
                      ],
                      "cognitive_exit_authorized_count":cand[
                          "cognitive_exit_authorized_count"
                      ],
                      "material_adverse_observation_count":cand[
                          "material_adverse_observation_count"
                      ],
                      "authorized_context_counts":cand[
                          "authorized_context_counts"
                      ],
                      "maximum_intelligence_blocker_counts":cand[
                          "maximum_intelligence_blocker_counts"
                      ],
                  }

              recent=per["consumed"]
              owner={
                  "pf_at_least_1_50":pf(recent["candidate"])>=Decimal("1.50"),
                  "mean_at_least_0_15r":(
                      d(recent["candidate"]["mean_r"])>=Decimal("0.15")
                  ),
                  "observed_dd_at_most_6r":(
                      d(recent["candidate"]["max_drawdown_r"])<=Decimal("6")
                  ),
                  "mc_positive_at_least_0_90":(
                      d(
                          recent["monte_carlo"][
                              "positive_terminal_probability"
                          ]
                      )>=Decimal("0.90")
                  ),
                  "mc_p95_dd_at_most_15r":(
                      d(recent["monte_carlo"]["p95_max_drawdown_r"])
                      <=Decimal("15")
                  ),
              }
              all_fold_dd_6=all(
                  d(per[fold]["candidate"]["max_drawdown_r"])<=Decimal("6")
                  for fold in folds
              )
              survivor=(
                  pf_ok==4
                  and mean_ok==4
                  and dd_ok==4
                  and winners_all
                  and temporal_all
              )
              report[variant]={
                  "folds":per,
                  "pf_nondegrade_folds":pf_ok,
                  "mean_nondegrade_folds":mean_ok,
                  "dd_nondegrade_folds":dd_ok,
                  "winner_preservation_all_folds":winners_all,
                  "halfyears_all_nondegrade":temporal_all,
                  "all_consumed_folds_observed_dd_at_most_6r":all_fold_dd_6,
                  "development_survivor":survivor,
                  "owner_direction_gates_recent":owner,
                  "promotion_authorized":False,
              }

          result={
              "schema":"qore.vt31.nas100.adverse_journey_cognitive_exit.aggregate.v1",
              "head":"${{ github.sha }}",
              "admission_variant":"A_EXPANDED_OB_REQUIRE_SHORT_RECLAIM_15M",
              "b_comparator_id":"VT31_BSIDE_H3_W5_DOL2_PS2_RESEARCH_COMPARATOR_001",
              "material_adverse_r":"-0.50",
              "variants":report,
              "development_survivors":[
                  name for name,item in report.items()
                  if item["development_survivor"]
              ],
              "six_r_all_fold_survivors":[
                  name for name,item in report.items()
                  if item["development_survivor"]
                  and item["all_consumed_folds_observed_dd_at_most_6r"]
              ],
              "governance":{
                  "consumed_evidence_only":True,
                  "pure_edge_only":True,
                  "maximum_intelligence_required":True,
                  "observed_dd_certification_max_r":"6",
                  "mc_p95_15r_is_separate_robustness_gate":True,
                  "next_m1_open_execution":True,
                  "same_bar_hindsight_used":False,
                  "sizing_for_certification_forbidden":True,
                  "fresh_holdout_opened":False,
                  "policy_promoted":False,
                  "candidate_frozen":False,
                  "candidate_certified":False,
              },
          }
          Path("result/aggregate.json").write_text(
              json.dumps(result,sort_keys=True,indent=2)+"\n"
          )
          print(json.dumps(result,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-adverse-journey-exit-aggregate-${{ github.sha }}
          path: result/
          retention-days: 90
