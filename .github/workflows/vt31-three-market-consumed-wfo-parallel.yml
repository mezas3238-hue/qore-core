name: QORE VT31 Three-Market Consumed WFO Parallel

on:
  push:
    branches:
      - agent/vt31-nas100-r1-holdout-001
    paths:
      - scripts/vt31_three_market_consumed_wfo.py
      - .github/workflows/vt31-three-market-consumed-wfo-parallel.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  wfo-fold:
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        include:
          - market: NAS100
            partition: r8_fresh
            artifact_id: 10402199719
            digest: 9f5df4eba1882cb498b4e3657176f34a7c27083f3ac1af7856ebddf01447f34d
          - market: NAS100
            partition: r6
            artifact_id: 10389112524
            digest: 9b0f3a05dc76b5dd83e5e3610266484bee1b79595dbbaacdff1d799115ad58b9
          - market: NAS100
            partition: r5
            artifact_id: 10380044761
            digest: 828335b99cd51c663e3f0f095df5137e881da3d7e8da741da8ca116a0400edf8
          - market: SP500
            partition: r8_fresh
            artifact_id: 10402199719
            digest: 9f5df4eba1882cb498b4e3657176f34a7c27083f3ac1af7856ebddf01447f34d
          - market: SP500
            partition: r6
            artifact_id: 10389112524
            digest: 9b0f3a05dc76b5dd83e5e3610266484bee1b79595dbbaacdff1d799115ad58b9
          - market: SP500
            partition: r5
            artifact_id: 10380044761
            digest: 828335b99cd51c663e3f0f095df5137e881da3d7e8da741da8ca116a0400edf8
          - market: US30
            partition: r8_fresh
            artifact_id: 10402199719
            digest: 9f5df4eba1882cb498b4e3657176f34a7c27083f3ac1af7856ebddf01447f34d
          - market: US30
            partition: r6
            artifact_id: 10389112524
            digest: 9b0f3a05dc76b5dd83e5e3610266484bee1b79595dbbaacdff1d799115ad58b9
          - market: US30
            partition: r5
            artifact_id: 10380044761
            digest: 828335b99cd51c663e3f0f095df5137e881da3d7e8da741da8ca116a0400edf8
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MARKET: ${{ matrix.market }}
      PARTITION: ${{ matrix.partition }}
      EVIDENCE_ARTIFACT_ID: ${{ matrix.artifact_id }}
      EVIDENCE_DIGEST: ${{ matrix.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research runtime
        run: pip install -e .[dev]
      - name: Static validation
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_three_market_consumed_wfo.py
          ruff check scripts/vt31_three_market_consumed_wfo.py
          python scripts/vt31_three_market_consumed_wfo.py --self-test
      - name: Recover immutable consumed fold evidence
        run: |
          set -euo pipefail
          digest="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${EVIDENCE_ARTIFACT_ID}" --jq .digest)"
          test "$digest" = "sha256:${EVIDENCE_DIGEST}"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${EVIDENCE_ARTIFACT_ID}/zip" > evidence.zip
          echo "${EVIDENCE_DIGEST}  evidence.zip" | sha256sum -c -
          mkdir evidence
          unzip -q evidence.zip -d evidence
          if [ -f evidence/SHA256SUMS ]; then
            (cd evidence && sha256sum -c SHA256SUMS)
          fi
          test -f "evidence/fresh/${MARKET}/market-evidence.json"
      - name: Run consumed WFO fold
        run: |
          set -euo pipefail
          mkdir result
          PYTHONPATH=scripts python - <<'PY' | tee result/summary.json
          import json
          import os
          from pathlib import Path
          import vt31_three_market_consumed_wfo as w

          market = os.environ['MARKET']
          partition = os.environ['PARTITION']
          w.MARKETS = (market,)
          w.PARTITIONS = (partition,)
          payload = w.run({partition: Path('evidence/fresh')})
          output = Path(f'result/{market}-{partition}-consumed-wfo-v1.json')
          output.write_text(
              json.dumps(payload, sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )
          row = payload['markets'][market][partition]['stress_0_05r']
          summary = {
              'market': market,
              'partition': partition,
              'sample': row['sample'],
              'total_r': row['total_r'],
              'mean_r': row['mean_r'],
              'win_rate': row['win_rate'],
              'profit_factor': row['profit_factor'],
              'max_drawdown_r': row['max_drawdown_r'],
              'max_losing_streak': row['max_losing_streak'],
          }
          print(json.dumps(summary, sort_keys=True))
          PY
      - name: Governance validation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          market = os.environ['MARKET']
          partition = os.environ['PARTITION']
          path = Path(f'result/{market}-{partition}-consumed-wfo-v1.json')
          payload = json.loads(path.read_text())
          assert payload['research_only'] is True
          assert payload['opens_new_holdout'] is False
          assert payload['fresh_holdout_consumed'] is False
          assert payload['live_authorized'] is False
          assert payload['production_authorized'] is False
          assert set(payload['markets']) == {market}
          assert set(payload['markets'][market]) == {partition}
          print(f'{market}/{partition} consumed WFO governance PASS')
          PY
      - name: Bind immutable run metadata
        run: |
          set -euo pipefail
          echo "$GITHUB_SHA" > result/git-sha.txt
          printf '%s\n' "$MARKET" > result/market.txt
          printf '%s\n' "$PARTITION" > result/partition.txt
          printf '%s sha256:%s\n' "$EVIDENCE_ARTIFACT_ID" "$EVIDENCE_DIGEST" > result/evidence.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-consumed-wfo-${{ matrix.market }}-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
