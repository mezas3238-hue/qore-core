name: QORE Capitalizer Cognitive Target Bandit 2R V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-cognitive-target-bandit-2r-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_cognitive_target_bandit_2r_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_cognitive_target_bandit_2r_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-cognitive-target-bandit-2r-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  TARGET_RUN_ID: '36077843102'
  TARGET_SHA: 'a47de3b491b4468527c945d6eff3afbbaec82d4e'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_cognitive_target_bandit_2r_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_cognitive_target_bandit_2r_v1.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_cognitive_target_bandit_2r_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_cognitive_target_bandit_2r_v1.py

  experiment:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download corrected target sensitivity ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-max-recovery-target-sensitivity-2y-v2-*-${{ env.TARGET_SHA }}
          path: target-input
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Run prequential Target Intelligence
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cognitive_target_bandit_2r_v1 \
            target-input target-output
      - name: Enforce causal integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "target-output/"
                  "capitalizer-cognitive-target-bandit-2r-v1.json"
              ).read_text()
          )
          assert report["control_trades"] == 948
          assert report["policy_count"] == 5
          assert report["all_entries_preserved"] is True
          assert report["chosen_target_changes_exit_path"] is True
          assert report["prior_chosen_closed_outcomes_only"] is True
          assert report["unchosen_target_outcomes_hidden_from_learner"] is True
          assert report["current_trade_outcome_visible_to_decision"] is False
          for row in report["results"]:
              assert row["trades"] == 948
              assert row["density_retention"] == "1"
              assert row["current_outcome_visible_to_decision"] is False
              assert row["unchosen_target_outcomes_visible_to_decision"] is False
          assert report["automatic_policy_selection"] is False
          assert report["runtime_rule_selected"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-cognitive-target-bandit-2r-v1-${{ github.sha }}
          path: target-output
          if-no-files-found: error
          retention-days: 90
