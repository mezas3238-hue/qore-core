name: QORE Shared VT08 Causal Path Motif Atlas V11

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - scripts/vt08_index_shared_causal_path_motif_atlas_v11.py
      - src/qore/infrastructure/core_stack_v2/causal_path_representation.py
      - tests/infrastructure/test_core_stack_v2_causal_path_representation.py
      - .github/workflows/qore-shared-vt08-causal-path-motif-atlas-v11.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  causal-path-motif-atlas-v11:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout Shared
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: pip install -e ".[dev]"

      - name: Static and unit validation
        run: |
          ruff check \
            src/qore/infrastructure/core_stack_v2/causal_path_representation.py \
            tests/infrastructure/test_core_stack_v2_causal_path_representation.py \
            scripts/vt08_index_shared_causal_path_motif_atlas_v11.py
          python -m py_compile \
            src/qore/infrastructure/core_stack_v2/causal_path_representation.py \
            scripts/vt08_index_shared_causal_path_motif_atlas_v11.py
          pytest -q tests/infrastructure/test_core_stack_v2_causal_path_representation.py

      - name: Download frozen V6 consumed ledger
        uses: actions/download-artifact@v4
        with:
          name: qore-shared-vt08-stop-target-discrimination-v6-1a534d0ae735efef4dcbc0c0be4b110ceaa80501
          path: artifacts/v6
          github-token: \${{ secrets.GITHUB_TOKEN }}
          repository: \${{ github.repository }}
          run-id: 36131607443

      - name: Run V11 causal path motif atlas
        run: |
          mkdir -p artifacts/v11
          python scripts/vt08_index_shared_causal_path_motif_atlas_v11.py \
            --v6-json artifacts/v6/vt08-index-shared-stop-target-discrimination-v6.json \
            --out artifacts/v11/vt08-index-shared-causal-path-motif-atlas-v11.json \
            | tee artifacts/v11/summary.json

      - name: Validate V11 governance
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          p=json.loads(
              Path(
                  "artifacts/v11/"
                  "vt08-index-shared-causal-path-motif-atlas-v11.json"
              ).read_text()
          )
          assert p["identity"] == "QORE_SHARED_VT08_CAUSAL_PATH_MOTIF_ATLAS_V11"
          assert p["source_v6_run"] == 36131607443
          assert p["source_v6_shared_head"] == "1a534d0ae735efef4dcbc0c0be4b110ceaa80501"
          assert p["research_only"] is True
          assert p["consumed_evidence_only"] is True
          assert p["path_representation_outcome_blind"] is True
          assert p["training_outcome_used_for_motif_selection_only"] is True
          assert p["runtime_outcome_input"] is False
          assert p["future_market_input"] is False
          assert p["sizing_used"] is False
          assert p["risk_weighting_used"] is False
          assert p["trailing_used"] is False
          assert p["target_extension_used"] is False
          assert p["runtime_actuation"] is False
          assert p["train_window"] == "five_year"
          assert p["validation_windows"] == [
              "recent_two_year",
              "r66_consumed_failed_holdout",
          ]
          assert p["motif_policy"]["must_beat_v7_loss_recall"] is True
          assert Decimal(p["motif_policy"]["winner_mark_rate_ceiling"]) == Decimal("0.005")

          expected = {
              "five_year": 2448,
              "recent_two_year": 1017,
              "r66_consumed_failed_holdout": 773,
          }
          for key, sample in expected.items():
              w=p["windows"][key]
              assert w["sample"] == sample
              assert w["status"] in {
                  "ADMIT_FOR_VALIDATION",
                  "ADMIT_FOR_ECONOMIC_SHADOW",
                  "REJECT",
              }
              assert "v7_control" in w
              assert "v11_combined" in w
              assert "beats_v7_loss_recall" in w

          print(json.dumps({
              "validation_pass": p["validation_pass"],
              "selected_motif_count": len(p["selected_motifs"]),
              "windows": p["windows"],
          }, sort_keys=True))
          PY

      - name: Bind result
        run: |
          cd artifacts/v11
          echo "$GITHUB_SHA" > shared-git-sha.txt
          echo "36131607443" > source-v6-run.txt
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-vt08-causal-path-motif-atlas-v11-\${{ github.sha }}
          path: artifacts/v11/
          if-no-files-found: error
          retention-days: 90
