name: QORE Shared WP05 Competing Survival V7

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - docs/shared/QORE_SHARED_WP05_V7_COMPETING_SURVIVAL_HYPOTHESES_PREREGISTRATION.md
      - src/qore/infrastructure/core_stack_v2/temporal_hierarchy_competing_survival_v7.py
      - src/qore/infrastructure/core_stack_v2/temporal_hierarchy_competing_survival_features_v7.py
      - tests/infrastructure/test_core_stack_v2_temporal_hierarchy_competing_survival_v7.py
      - tests/infrastructure/test_core_stack_v2_temporal_hierarchy_competing_survival_features_v7.py
      - scripts/shared_wp05_competing_survival_v7.py
      - scripts/shared_wp05_structural_failure_target_v2.py
      - .github/workflows/qore-shared-wp05-competing-survival-v7.yml
  workflow_dispatch:

concurrency:
  group: qore-shared-wp05-v7-consumed-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  competing-survival-v7:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Announce WP05 V7 pre-consumption validation
        run: |
          gh issue comment 643 --body "WP-05 V7 consumed-development workflow started — Git SHA \`${GITHUB_SHA}\`, run \`${GITHUB_RUN_ID}\`. Static/adversarial pre-consumption gate runs BEFORE evidence recovery. R8 fit/calibration only; R6/R5 consumed falsification only; fresh holdout remains CLOSED."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Shared
        run: pip install -e ".[dev]"

      - name: Pre-consumption static and adversarial gate
        run: |
          ruff check \
            src/qore/infrastructure/core_stack_v2/temporal_hierarchy_competing_survival_v7.py \
            src/qore/infrastructure/core_stack_v2/temporal_hierarchy_competing_survival_features_v7.py \
            tests/infrastructure/test_core_stack_v2_temporal_hierarchy_competing_survival_v7.py \
            tests/infrastructure/test_core_stack_v2_temporal_hierarchy_competing_survival_features_v7.py \
            tests/infrastructure/test_shared_wp05_competing_survival_v7_protocol.py \
            scripts/shared_wp05_competing_survival_v7.py
          python -m py_compile \
            src/qore/infrastructure/core_stack_v2/temporal_hierarchy_competing_survival_v7.py \
            src/qore/infrastructure/core_stack_v2/temporal_hierarchy_competing_survival_features_v7.py \
            scripts/shared_wp05_competing_survival_v7.py
          pytest -q \
            tests/infrastructure/test_core_stack_v2_temporal_hierarchy_competing_survival_v7.py \
            tests/infrastructure/test_core_stack_v2_temporal_hierarchy_competing_survival_features_v7.py \
            tests/infrastructure/test_shared_wp05_competing_survival_v7_protocol.py \
            tests/infrastructure/test_core_stack_v2_temporal_hierarchy_target_contract.py \
            tests/infrastructure/test_shared_wp05_structural_failure_target_v2.py

      - name: Recover immutable consumed R8 R6 R5 market evidence
        run: |
          set -euo pipefail
          mkdir -p input/r8 input/r6 input/r5 result

          download_artifact() {
            local artifact_id="$1"
            local output="$2"
            local tmp="${output}.tmp"
            rm -f "$tmp"
            for attempt in 1 2 3 4; do
              if gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$tmp"; then
                mv "$tmp" "$output"
                return 0
              fi
              rm -f "$tmp"
              sleep $((attempt * 30))
            done
            return 1
          }

          download_artifact 10402199719 r8.zip
          unzip -q r8.zip -d input/r8
          (cd input/r8 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

          download_artifact 10389112524 r6.zip
          unzip -q r6.zip -d input/r6
          (cd input/r6 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

          download_artifact 10380044761 r5.zip
          unzip -q r5.zip -d input/r5
          (cd input/r5 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)

      - name: Run preregistered WP05 V7 consumed falsification
        run: |
          python scripts/shared_wp05_competing_survival_v7.py \
            --r8-nas input/r8/fresh/NAS100/market-evidence.json \
            --r8-sp input/r8/fresh/SP500/market-evidence.json \
            --r8-us input/r8/fresh/US30/market-evidence.json \
            --r6-nas input/r6/fresh/NAS100/market-evidence.json \
            --r6-sp input/r6/fresh/SP500/market-evidence.json \
            --r6-us input/r6/fresh/US30/market-evidence.json \
            --r5-nas input/r5/fresh/NAS100/market-evidence.json \
            --r5-sp input/r5/fresh/SP500/market-evidence.json \
            --r5-us input/r5/fresh/US30/market-evidence.json \
            --output result/wp05-competing-survival-v7.json \
            | tee result/summary.json

      - name: Validate WP05 V7 scientific protocol
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(Path("result/wp05-competing-survival-v7.json").read_text())
          assert p["protocol_pass"] is True
          assert p["fresh_holdout_opened"] is False
          assert p["wp05_exit_gate_pass"] is False
          assert p["target_contract"] == "HIGHER_TIMEFRAME_STRUCTURAL_FAILURE_V2"
          assert p["representation"] == "COMPETING_TERMINAL_HAZARD_RECOVERY_SUPPORT_V7_001"
          assert p["status"] in {
              "WP05_V7_FROZEN_FOR_FRESH_HOLDOUT",
              "WP05_V7_COMPETING_SURVIVAL_FALSIFIED",
          }

          m=p["model"]
          assert m["fit_partition"] == "r8"
          assert m["purged_discovery_count"] >= 0
          assert m["discovery_observed_max"] < m["calibration_source_min"]
          assert m["terminal_feature_count"] >= 20
          assert m["recovery_feature_count"] >= 20
          assert len(m["fingerprint_sha256"]) == 64
          assert len(m["representation_fingerprint_sha256"]) == 64
          assert 500000 <= m["terminal_threshold_micros"] <= 900000
          assert 500000 <= m["recovery_threshold_micros"] <= 900000
          assert (m["terminal_threshold_micros"] - 500000) % 20000 == 0
          assert (m["recovery_threshold_micros"] - 500000) % 20000 == 0

          r8=p["partition_ranges"]["r8"]
          assert r8["episode_count"] >= 6000
          assert r8["complete_evidence_count"] >= 6000
          assert r8["target_contract"] == "HIGHER_TIMEFRAME_STRUCTURAL_FAILURE_V2"
          assert r8["fresh_holdout_opened"] == 0

          g=p["governance"]
          assert g["r6_r5_unread_until_r8_model_frozen"] is True
          assert g["target_v2_required"] is True
          assert g["exact_target_v2_source_distance"] is True
          assert g["historical_causal_frontier_excludes_evaluated_bar"] is True
          assert g["fixed_source_anchor_for_hierarchy_trajectory"] is True
          assert g["unidentifiable_higher_anchor_abstains"] is True
          assert g["r8_chronological_discovery_calibration_only"] is True
          assert g["r6_refit"] is False
          assert g["r5_refit"] is False
          assert g["r6_threshold_retuning"] is False
          assert g["r5_threshold_retuning"] is False
          assert g["runtime_future_market_used"] is False
          assert g["trade_pnl_used"] is False
          assert g["trader_identity_feature_used"] is False
          assert g["symbol_identity_feature_used"] is False
          assert g["setup_identity_feature_used"] is False
          assert g["fresh_holdout_opened"] is False
          assert g["knowledge_auto_promotion"] is False
          assert g["shared_methodology_authority"] is False
          assert g["shared_sizing_authority"] is False
          assert g["shared_risk_authority"] is False
          assert g["shared_order_authority"] is False
          assert g["shared_execution_authority"] is False

          if not m["calibration_gate_pass"]:
              assert p["status"] == "WP05_V7_COMPETING_SURVIVAL_FALSIFIED"
              assert p["development_gate_pass"] is False
              assert set(p["partition_ranges"]) == {"r8"}
              assert set(p["evaluations"]) == {"r8"}
              assert set(p["partition_model_fingerprints"]) == {"r8"}
              assert p["reason"] == "NO_LEGAL_R8_CALIBRATION_THRESHOLD_PAIR"
          else:
              assert m["calibration_terminal_preservation_bps"] >= 9800
              assert p["partition_temporal_order_gate"] is True
              fingerprints=p["partition_model_fingerprints"]
              assert fingerprints["r8"] == fingerprints["r6"] == fingerprints["r5"]
              assert fingerprints["r8"] == m["fingerprint_sha256"]
              gate=p["frozen_development_gate"]
              assert gate["minimum_false_declaration_reduction_bps"] == 2000
              assert gate["minimum_terminal_detection_preservation_bps"] == 9500
              assert gate["must_pass_partitions"] == ["r6","r5"]
              for partition in ("r8","r6","r5"):
                  r=p["partition_ranges"][partition]
                  assert r["episode_count"] >= 6000
                  assert r["complete_evidence_count"] >= 6000
                  assert r["target_contract"] == "HIGHER_TIMEFRAME_STRUCTURAL_FAILURE_V2"
                  assert r["fresh_holdout_opened"] == 0
                  e=p["evaluations"][partition]
                  assert 0 <= e["false_declaration_reduction_bps"] <= 10000
                  assert 0 <= e["terminal_detection_preservation_bps"] <= 10000
          PY

      - name: Bind result
        run: |
          echo "${GITHUB_SHA}" > result/git-sha.txt
          (
            cd result
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-wp05-competing-survival-v7-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Report WP05 V7 result
        if: always()
        run: |
          if [ ! -f result/wp05-competing-survival-v7.json ]; then
            gh issue comment 643 --body "WP-05 V7 run $GITHUB_RUN_ID produced no scientific payload. R6/R5 were not accepted as scientific evidence; fresh holdout remains CLOSED. Inspect technical failure."
            exit 0
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path

          p=json.loads(Path("result/wp05-competing-survival-v7.json").read_text())
          m=p["model"]
          lines=[
              "## WP-05 V7 competing-survival result",
              "",
              "- Git SHA: " + os.environ["GITHUB_SHA"],
              "- GitHub Actions run: " + os.environ["GITHUB_RUN_ID"],
              f"- status: **{p['status']}**",
              f"- protocol_pass: **{p['protocol_pass']}**",
              f"- development_gate_pass: **{p['development_gate_pass']}**",
              "- target: **HIGHER_TIMEFRAME_STRUCTURAL_FAILURE_V2**",
              "- architecture: **terminal_hazard + recovery_support + UNRESOLVED**",
              f"- model fingerprint: {m['fingerprint_sha256']}",
              f"- representation fingerprint: {m['representation_fingerprint_sha256']}",
              f"- R8 calibration gate pass: **{m['calibration_gate_pass']}**",
              f"- R8 calibration false reduction: **{m['calibration_false_reduction_bps']} bps**",
              f"- R8 calibration terminal preservation: **{m['calibration_terminal_preservation_bps']} bps**",
              f"- chronological purge: **{m['purged_discovery_count']} discovery episodes removed**",
              "- frozen consumed gate unchanged: **>=2000 bps false reduction + >=9500 bps terminal preservation on BOTH R6/R5**",
              "- fresh holdout opened: **False**",
              "",
              "Partition results:",
          ]
          for partition,e in p.get("evaluations",{}).items():
              r=p["partition_ranges"][partition]
              lines.append(
                  f"- {partition.upper()}: false={e['baseline_false_declaration_count']} -> {e['competing_false_declaration_count']}; missed terminals={e['competing_missed_terminal_count']}; recovery-supported={e['recovery_supported_count']}; unresolved={e['unresolved_count']}; terminal-supported={e['terminal_supported_count']}; false reduction={e['false_declaration_reduction_bps']} bps; terminal preservation={e['terminal_detection_preservation_bps']} bps; incomplete={r['incomplete_evidence_count']}"
              )
          if not m["calibration_gate_pass"]:
              lines.append("V7 falsified inside R8 calibration; R6/R5 were not read. Do not retune and keep fresh holdout closed.")
          elif p["development_gate_pass"]:
              lines.append("V7 survives consumed development. Freeze exact fingerprints and preregister one independent fresh WP-05 holdout before acquisition.")
          else:
              lines.append("V7 is falsified on consumed development. Do not retune against R6/R5 or weaken the gate; freeze evidence and design a materially different V8.")
          Path("result/wp05-v7-issue-update.md").write_text("\n".join(lines)+"\n")
          PY
          gh issue comment 643 --body-file result/wp05-v7-issue-update.md
