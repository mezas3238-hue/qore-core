name: VT31 M2 post-pool M1 gap topology genuine G3 COG NO TRADING
on:
  push:
    branches:
      - agent/vt31-m2-native-gap-topology-20261014
    paths:
      - 'docs/research/VT31_M2_GAP_TOPOLOGY_PREREG_2026-10-14.md'
      - 'scripts/vt31_m2_gap_topology_20261014.py'
      - 'tests/infrastructure/test_vt31_m2_gap_topology_20261014.py'
      - '.github/workflows/vt31-m2-gap-topology-20261014.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  P3_COMMIT: '1c820086339323f79d4ec1cb5954fb53841064b2'
  P3_BLOB: 'bb11d965e99666957378e9748e710360dc5bb9ac'
  V1_BLOB: 'eb3e39db84f487ac8f2f5cfac00ad3f8247683c2'
  DATA_SHA: '0563370fd021ad091392eb26f60cda0d3356d38c801fc1c2083cceafc5043cfa'
jobs:
  frozen-post-pool-source-forensics:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 40
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lock prereg / original frozen G3 / external witnesses
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5c59705b3c4f00581a65c5245045182a7497672b HEAD
          test "$(git hash-object src/qore/infrastructure/traders/vt31_ict_cleanroom/cognition.py)" = d0ab4c15d6e9d24e53224d27bdb2cd96af914fb9
          test "$(git hash-object src/qore/infrastructure/traders/vt31_ict_cleanroom/operations.py)" = 0ce9707314aecb71155de8b57044b6ec028847b2
          test "$(git hash-object docs/research/VT31_G3_DECISION_METODOLOGICA_STOP_FRAMEWORK_FVG_EXIT_V1_2026-10-12.md)" = e99c70b4e018d626fb620d9a21b9314a51abc36d
          test "$(git hash-object scripts/vt31_ict_dol_source_v1_20261014.py)" = "$V1_BLOB"
          git fetch --no-tags --depth=1 origin "$P3_COMMIT"
          git show "$P3_COMMIT:scripts/vt31_mc_p3_ict_independent_dol_20261014.py" > scripts/vt31_mc_p3_ict_independent_dol_20261014.py
          test "$(git hash-object scripts/vt31_mc_p3_ict_independent_dol_20261014.py)" = "$P3_BLOB"
          git show "$P3_COMMIT:tests/infrastructure/test_vt31_mc_p3_ict_independent_dol_20261014.py" > tests/infrastructure/test_vt31_mc_p3_ict_independent_dol_20261014.py
      - name: QA topology adversaries and source/COG frozen regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]' 'ijson>=3.3,<4'
          mkdir -p evidence
          ruff check scripts/vt31_m2_gap_topology_20261014.py tests/infrastructure/test_vt31_m2_gap_topology_20261014.py
          PYTHONPATH=src:. pytest -q -o addopts='' \
            tests/infrastructure/test_vt31_m2_gap_topology_20261014.py \
            tests/infrastructure/test_vt31_m2_native_cog_real_m1_20261014.py \
            tests/infrastructure/test_vt31_m2_dol_reconciliation_20261014.py \
            tests/infrastructure/test_vt31_ict_dol_source_v1_20261014.py \
            tests/infrastructure/test_vt31_mc_p3_ict_independent_dol_20261014.py \
            tests/infrastructure/test_vt31_ict_cleanroom_cognition.py \
            tests/infrastructure/test_vt31_g3_mss_anchor_optin.py \
            --junitxml=evidence/junit.xml | tee evidence/pytest-log.txt
      - name: Download original NAS100 3Y M1, hash before analysis
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11459859004/zip" > source.zip
          unzip -q source.zip -d source
          echo "${DATA_SHA}  source/NAS100/market-evidence.json" | sha256sum -c -
      - name: Run 563 monitoring-gap forensic analysis without fills or calendar imputation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src:. python scripts/vt31_m2_gap_topology_20261014.py \
            --market source/NAS100/market-evidence.json \
            --out evidence/VT31_M2_G3_POST_POOL_GAP_TOPOLOGY.json | tee evidence/summary.json
          python - <<'PY'
          import json
          p=json.load(open('evidence/VT31_M2_G3_POST_POOL_GAP_TOPOLOGY.json'))
          assert p["source_total_m1"]==1059784
          assert p["native_emissions_not_trades"]==1104
          assert p["native_unique_first_theses_not_trades"]==441
          assert p["p3_v1_pairs"]=={
            "SUPPORTED|SUPPORTED":541,
            "UNKNOWN|UNKNOWN":485,
            "UNKNOWN|REJECTED":78,
          }
          assert p["gaps_reclassified_as_market_closed"]==0
          assert p["gaps_filled_or_imputed"]==0
          assert p["broker_calendar_verified"] is False
          assert p["method_certified"] is False
          assert p["cognition_certified"] is False
          assert p["trader_certified"] is False
          assert p["broker_ack_or_fills"]==0
          assert p["profit_factor"] is None
          assert p["live_authorized"] is False
          print("GAP_TOPOLOGY_DIAGNOSTIC_PASS_M2_NOT_CERTIFIED")
          PY
      - name: Evidence source and output SHA manifests
        shell: bash
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/head.txt
          printf '%s\n' '5c59705b3c4f00581a65c5245045182a7497672b' > evidence/prereg.txt
          printf '%s\n' "$P3_COMMIT" > evidence/p3.txt
          printf '%s\n' 'NO_MERGE_NO_LIVE_NO_CFD_CALENDAR_ASSUMPTION_NO_SIZING_NO_ACK_NO_PNL' > evidence/scope.txt
          (cd evidence && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vt31-m2-native-gap-topology-${{ github.sha }}
          path: evidence/
          retention-days: 90
          if-no-files-found: warn
