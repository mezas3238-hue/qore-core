name: QORE CIBO Phase22 Turtle 4-of-4 Replay Parity

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cibo-certification-architect-b-integration-001
    paths:
      - '.github/workflows/cibo-phase22-turtle-4of4-replay-parity.yml'
      - 'scripts/cibo_phase22_turtle_window_replay.py'
      - 'tests/infrastructure/test_cibo_phase22_turtle_window_replay.py'
  pull_request:
    paths:
      - '.github/workflows/cibo-phase22-turtle-4of4-replay-parity.yml'
      - 'scripts/cibo_phase22_turtle_window_replay.py'
      - 'tests/infrastructure/test_cibo_phase22_turtle_window_replay.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: cibo-phase22-turtle-4of4-parity-${{ github.ref }}
  cancel-in-progress: false

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  GH_TOKEN: ${{ github.token }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: |
          ruff check scripts/cibo_phase22_turtle_window_replay.py \
            tests/infrastructure/test_cibo_phase22_turtle_window_replay.py
          mypy scripts/cibo_phase22_turtle_window_replay.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_phase22_turtle_window_replay.py

  gbpjpy:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:\n          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:\n          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-GBPJPY-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: raw
          github-token: ${{ github.token }}
          run-id: 35166210458
      - uses: actions/download-artifact@v4
        with:
          name: qore-cibo-target-destination-v2-GBPJPY-2f510461b3360e91d5ee70a72716a76cd6561f16
          path: target
          github-token: ${{ github.token }}
          run-id: 35204892665
      - uses: actions/download-artifact@v4
        with:
          name: qore-turtle-soup-gbpjpy-structural-specialist-v2-r27-00fb870826e0cbd30179fe44cbdd6707448be0da
          path: cognitive
          github-token: ${{ github.token }}
          run-id: 35349300927
      - uses: actions/download-artifact@v4
        with:
          name: qore-turtle-soup-gbpjpy-r36-candidate-freeze-035b8772a023fc0a57697aecbcb1a302173491cd
          path: freeze
          github-token: ${{ github.token }}
          run-id: 35371045165
      - name: Run frozen parity adapter
        run: |
          python scripts/cibo_phase22_turtle_window_replay.py \
            --trader GBPJPY_R38 --mode PARITY \
            --module-path src/qore/infrastructure/trader_lab/cibo_phase18_gbpjpy_r37_geometry_replay.py \
            --raw-root raw --target-root target --cognitive-root cognitive \
            --freeze-root freeze --output out
      - name: Verify byte parity against sealed Phase18
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10909937201/zip" > authoritative.zip
          mkdir authoritative
          unzip -q authoritative.zip -d authoritative
          (cd authoritative && sha256sum -c SHA256SUMS.txt)
          cmp -s out/phase18-gbpjpy-r37-geometry-trades.jsonl \
            authoritative/phase18-gbpjpy-r37-geometry-trades.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-phase22-gbpjpy-parity-${{ env.EVIDENCE_SHA }}
          path: out
          if-no-files-found: error
          retention-days: 90

