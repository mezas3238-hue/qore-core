name: VT08 Index R68 R58 Risk Transport Ablation

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r68-r58-risk-transport-ablation.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r68_r58_risk_transport_ablation.py
      - tests/infrastructure/trader_lab/test_vt08_index_r68_r58_risk_transport_ablation.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r68_r58_risk_transport_ablation.py

  ablation:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R68 risk transport ablation
        run: |
          python -m qore.infrastructure.trader_lab.vt08_index_r68_r58_risk_transport_ablation \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r68-r58-risk-transport-ablation.json

      - name: Verify R68 mechanistic governance and exact reconstruction
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r68-r58-risk-transport-ablation.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R68_R58_RISK_TRANSPORT_ABLATION_001"
          )
          assert report["source_failure"]["r66_decision"] == (
              "FAIL_R66_FRESH_HOLDOUT_REJECT_FROZEN_IDENTITY"
          )
          assert report["frozen_candidate"]["modified"] is False
          assert report["five_year"]["sample"] == 2448
          assert report["recent_two_year"]["sample"] == 1017
          assert report["r66_failed_holdout"]["sample"] == 773

          transport = {
              row["policy_id"]: row
              for row in report["variant_transport"]
          }
          assert set(transport) == {
              "EXACT_R58",
              "CAPPED_R47_BASE",
              "ABLATE_REARM",
              "ABLATE_FVG_CROSS",
              "ABLATE_FVG_H4_CISD",
              "ABLATE_LATE_REVALIDATION",
              "LATE_REVALIDATION_ONLY",
          }
          assert (
              Decimal(transport["EXACT_R58"]["r66_secondary_total_r"])
              < 0
          )
          assert (
              Decimal(
                  str(
                      report["r66_failed_holdout"]["raw_unweighted"][
                          "secondary"
                      ]["total_r"]
                  )
              )
              > 0
          )
          assert report["decision"] == (
              "R68_CAUSAL_ABLATION_COMPLETE_NO_CANDIDATE_SELECTED"
          )
          governance = report["governance"]
          assert governance["forensics_only"] is True
          assert governance["bounded_mechanistic_ablation"] is True
          assert governance["variant_grid_is_not_an_optimizer"] is True
          assert governance["r66_consumed_failure_evidence"] is True
          assert governance["fresh_holdout_claim"] is False
          assert governance["frozen_r58_r59_modified"] is False
          assert governance["replacement_candidate_created"] is False
          assert governance["signal_surface_changed"] is False
          assert governance["signals_suppressed"] is False
          assert governance["calendar_or_year_runtime_feature"] is False
          assert governance["future_outcome_used_for_risk"] is False
          assert governance["trader_certified"] is False
          assert governance["live_authorized"] is False
          assert governance["real_capital_authorized"] is False
          assert governance["production_authorized"] is False
          PY

      - name: Upload R68 evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r68-r58-risk-transport-ablation-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: warn
          retention-days: 90
