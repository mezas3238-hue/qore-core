name: QORE Capitalizer Cognitive Third Slot Cross Feature Atlas 2R V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-cognitive-third-slot-cross-feature-atlas-2r-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_cognitive_third_slot_cross_feature_atlas_2r_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_cognitive_third_slot_cross_feature_atlas_2r_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-cognitive-third-slot-cross-feature-atlas-2r-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  REBASE_RUN_ID: '36078677895'
  REBASE_SHA: 'cfc04849c8bbfd6565310d89456f5e367ea880f7'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check             src/qore/infrastructure/trader_lab/capitalizer_cognitive_third_slot_cross_feature_atlas_2r_v1.py             tests/infrastructure/trader_lab/test_capitalizer_cognitive_third_slot_cross_feature_atlas_2r_v1.py
      - name: Mypy
        run: |
          mypy             src/qore/infrastructure/trader_lab/capitalizer_cognitive_third_slot_cross_feature_atlas_2r_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov             tests/infrastructure/trader_lab/test_capitalizer_cognitive_third_slot_cross_feature_atlas_2r_v1.py

  atlas:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download true-2R cognitive rebase
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cognitive-economic-rebase-2r-v1-${{ env.REBASE_SHA }}
          path: rebase-input
          github-token: ${{ github.token }}
          run-id: ${{ env.REBASE_RUN_ID }}
      - name: Build true-2R cross-feature atlas
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cognitive_third_slot_cross_feature_atlas_2r_v1             rebase-input cross-output
      - name: Enforce 2R cross-feature controls
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          report = json.loads(
              Path(
                  "cross-output/"
                  "capitalizer-cognitive-third-slot-cross-feature-atlas-2r-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_COGNITIVE_THIRD_SLOT_CROSS_FEATURE_ATLAS_2R_V1"
          )
          assert report["source_rebase_run_id"] == 36078677895
          assert report["target_r"] == "2.00"
          assert report["control_trades"] == 948
          assert report["third_slot_trades"] == 40
          assert Decimal(report["control_metrics"]["profit_factor"]) == Decimal(
              "1.466020472120789368123727041"
          )
          assert report["pairwise_cell_count"] > 0
          assert report["counterfactual_cells_at_or_below_6r_dd"] == 0
          assert report["high_density_cells_at_or_below_6r_dd"] == 0
          assert report["pairwise_only_no_three_way_search"] is True
          assert report["all_features_known_by_entry"] is True
          assert report["dynamic_state_from_true_2r_rebase"] is True
          assert report["current_candidate_outcome_used_to_create_cell"] is False
          assert report["automatic_cell_selection"] is False
          assert report["runtime_rule_selected"] is False
          assert report["rebase_control_reproduced"] is True
          assert report["strategy_rules_changed"] is False
          assert report["cognitive_rules_changed"] is False
          assert report["entry_changed"] is False
          assert report["stop_changed"] is False
          assert report["target_changed"] is False
          assert report["max3_changed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-cognitive-third-slot-cross-feature-atlas-2r-v1-${{ github.sha }}
          path: cross-output
          if-no-files-found: error
          retention-days: 90
