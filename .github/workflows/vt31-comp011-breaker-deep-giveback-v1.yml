name: QORE VT31 Comparator011 Breaker Deep Giveback V1

on:
  push:
    branches:
      - agent/vt31-edge-position-cert-b-001
    paths:
      - scripts/vt31_nas100_comp011_breaker_deep_giveback_composition_v1.py
      - .github/workflows/vt31-comp011-breaker-deep-giveback-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  partition:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"

    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Static and focused gates
        run: |
          set -euo pipefail
          python -m py_compile             scripts/vt31_nas100_comp011_breaker_deep_giveback_composition_v1.py
          ruff check             scripts/vt31_nas100_comp011_breaker_deep_giveback_composition_v1.py
          pytest -q -o addopts=''             tests/infrastructure/test_vt31_nas100_position_intelligence.py             tests/infrastructure/test_vt31_nas100_post_entry_cognitive_runtime.py             tests/infrastructure/test_vt31_nas100_edge_certification.py

      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"

      - name: Run Comparator 011 partition
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python             scripts/vt31_nas100_comp011_breaker_deep_giveback_composition_v1.py             partition "input/${EVIDENCE_PATH}"             --partition "${PARTITION}"             --output "result/comp011-${PARTITION}.json"             | tee "result/summary-${PARTITION}.json"

      - name: Governance
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          partition = os.environ["PARTITION"]
          x = json.loads(Path(f"result/comp011-{partition}.json").read_text())
          assert x["base_comparator_id"] == (
              "VT31_AB_COMP009_MAX_INTELLIGENCE_COMPOSED_SURVIVOR"
          )
          assert x["variant_id"] == (
              "VT31_AB_COMP011_BREAKER_DEEP_GIVEBACK_025"
          )
          assert x["gates"]["baseline_binding_exact"] is True
          g = x["governance"]
          assert g["base_is_frozen_comp009"] is True
          assert g["same_comp009_admission"] is True
          assert g["same_comp009_target_stack"] is True
          assert g["breaker_only_dgr_scope"] is True
          assert g["maximum_cognition_required"] is True
          assert g["dgr_current_close_max_r_preexisting"] == "0.25"
          assert g["confirmed_m1_protective_swing_required"] is True
          assert g["maximum_one_dgr_rescue_per_trade"] is True
          assert g["next_m1_activation"] is True
          assert g["existing_cognitive_exit_priority_preserved"] is True
          assert g["new_numeric_threshold_added"] is False
          assert g["outcome_used_for_action"] is False
          assert g["fold_identity_used_for_action"] is False
          assert g["date_identity_used_for_action"] is False
          assert g["position_sizing_used"] is False
          assert g["dynamic_sizing_used"] is False
          assert g["leverage_used"] is False
          assert g["compounding_used"] is False
          assert g["portfolio_weighting_used"] is False
          assert g["capital_weighting_used"] is False
          assert g["fresh_holdout_opened"] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-comp011-dgr-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: partition
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-comp011-dgr-*-${{ github.sha }}
          path: input
          merge-multiple: true

      - name: Aggregate stitched certification gates
        run: |
          set -euo pipefail
          mkdir -p result
          PYTHONPATH=scripts python             scripts/vt31_nas100_comp011_breaker_deep_giveback_composition_v1.py             aggregate             input/comp011-r5.json             input/comp011-r6.json             input/comp011-r8.json             input/comp011-consumed.json             --output result/comp011-aggregate.json             | tee result/summary-aggregate.json

      - name: Governance and result summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          x = json.loads(Path("result/comp011-aggregate.json").read_text())
          assert x["fresh_holdout_opened"] is False
          g = x["governance"]
          assert g["single_predeclared_composition"] is True
          assert g["conservative_dgr_witness_only"] is True
          assert g["new_numeric_threshold_added"] is False
          assert g["maximum_cognition_required"] is True
          assert g["confirmed_m1_protective_swing_required"] is True
          assert g["maximum_one_dgr_rescue_per_trade"] is True
          assert g["next_m1_activation"] is True
          assert g["existing_cognitive_exit_priority_preserved"] is True
          assert g["outcome_used_for_action"] is False
          assert g["fold_identity_used_for_action"] is False
          assert g["date_identity_used_for_action"] is False
          assert g["position_sizing_used"] is False
          assert g["dynamic_sizing_used"] is False
          assert g["leverage_used"] is False
          assert g["compounding_used"] is False
          assert g["portfolio_weighting_used"] is False
          assert g["capital_weighting_used"] is False
          assert g["fresh_holdout_opened"] is False

          c = x["combined"]
          print("COMPARATOR011_SURVIVOR", x["comparator011_survivor"])
          print("COMBINED_PF", c["metrics"]["profit_factor"])
          print("COMBINED_MEAN_R", c["metrics"]["mean_r"])
          print("STITCHED_DD_R", c["drawdown_episode"]["max_drawdown_r"])
          print("ANNUALIZED_SHARPE", c["risk_adjusted"]["annualized_sharpe"])
          print("ANNUALIZED_SORTINO", c["risk_adjusted"]["annualized_sortino"])
          print("CHANGED_TRADE_COUNT", x["changed_trade_count"])
          print("GATES", json.dumps(x["gates"], sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-comp011-dgr-aggregate-${{ github.sha }}
          path: result/
          retention-days: 90
