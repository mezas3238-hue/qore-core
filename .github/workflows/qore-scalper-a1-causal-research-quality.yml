name: Scalper A1 Causal Research Quality

on:
  push:
    branches:
      - agent/scalper-architect-a-cognition-20261010
    paths:
      - '.github/workflows/qore-scalper-a1-causal-research-quality.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_a1_full_frame_research_adapter.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_master_cognitive_frame.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v51_multi_era_repair.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v54_structural_partial_runner.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  causal_quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff A1 scope
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_a1_full_frame_research_adapter.py \
            tests/infrastructure/trader_lab/test_capitalizer_master_cognitive_frame.py \
            tests/infrastructure/trader_lab/test_capitalizer_v51_multi_era_repair.py \
            tests/infrastructure/trader_lab/test_capitalizer_v54_structural_partial_runner.py
      - name: Mypy A1 production research adapter
        run: mypy src/qore/infrastructure/trader_lab/capitalizer_a1_full_frame_research_adapter.py
      - name: Focused causal and corrected-fixture regressions
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_master_cognitive_frame.py \
            tests/infrastructure/trader_lab/test_capitalizer_v51_multi_era_repair.py \
            tests/infrastructure/trader_lab/test_capitalizer_v54_structural_partial_runner.py
