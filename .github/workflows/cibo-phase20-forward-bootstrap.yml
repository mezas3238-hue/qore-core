name: QORE CIBO Phase20 Forward Bootstrap

on:
  push:
    branches:
      - agent/cibo-capital-efficiency-sizing-lab-001
    paths:
      - .github/workflows/cibo-phase20-forward-bootstrap.yml
      - scripts/cibo_phase20_github_forward_bootstrap.py
      - src/qore/infrastructure/ctrader_demo_account_discovery.py
      - src/qore/infrastructure/ctrader_demo_free_binding.py
      - src/qore/infrastructure/ctrader_demo_lab_probe.py
      - src/qore/infrastructure/ctrader_open_api_client.py
  workflow_dispatch:

permissions:
  contents: read

env:
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
  QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}
  QORE_CIBO_FORWARD_BOOTSTRAP_LOOKBACK_DAYS: "30"

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cTrader runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ctrader,dev]"

      - name: Quality bootstrap collector
        run: |
          ruff check scripts/cibo_phase20_github_forward_bootstrap.py
          mypy scripts/cibo_phase20_github_forward_bootstrap.py
          python -m py_compile scripts/cibo_phase20_github_forward_bootstrap.py

      - name: Verify required DEMO secrets without printing them
        shell: bash
        run: |
          set -euo pipefail
          for name in             QORE_CTRADER_CLIENT_ID             QORE_CTRADER_CLIENT_SECRET             QORE_CTRADER_ACCESS_TOKEN             QORE_CTRADER_REFRESH_TOKEN
          do
            if [ -z "${!name:-}" ]; then
              echo "missing required DEMO runtime input: ${name}" >&2
              exit 2
            fi
          done

      - name: Discover authorized DEMO account when not configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            if ! [[ "$account_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "cTrader DEMO account discovery returned invalid id" >&2
              exit 3
            fi
            echo "::add-mask::$account_id"
            printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          fi

      - name: Collect CIBO read-only forward bootstrap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase20-forward-bootstrap
          python scripts/cibo_phase20_github_forward_bootstrap.py             > phase20-forward-bootstrap/bootstrap.json
          printf '%s\n' "$GITHUB_SHA"             > phase20-forward-bootstrap/git-sha.txt

      - name: Validate sanitized bootstrap
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("phase20-forward-bootstrap/bootstrap.json").read_text()
          )
          assert payload["schema"] == (
              "qore.cibo.phase20d.github_forward_bootstrap.v1"
          )
          assert payload["status"] == "READ_ONLY_MARKET_BOOTSTRAP_READY"
          assert payload["environment"] == "demo"
          assert payload["read_only"] is True
          assert payload["broker_mutation_performed"] is False
          assert payload["governance"]["fundednext_touched"] is False
          assert payload["governance"]["vps_touched"] is False
          assert payload["phase20d"]["qualification_evidence_claimed"] is False
          assert payload["phase20d"]["fresh_forward_decisions_claimed"] == 0
          assert payload["phase20d"]["candidate_outcomes_claimed"] == 0
          assert payload["phase20d"]["selected_outcomes_claimed"] == 0
          assert set(payload["required_qore_symbols"]) == {
              "AUDJPY",
              "EURUSD",
              "GBPJPY",
              "GBPUSD",
              "NAS100",
              "XAUUSD",
          }
          assert len(payload["required_cma_lineages"]) == 7
          assert len(payload["market"]) == 6
          assert all(
              set(row["periods"]) == {"M1", "M5", "M15", "H4"}
              for row in payload["market"]
          )
          assert len(payload["account_fingerprint"]) == 64
          assert len(payload["binding_fingerprint"]) == 64
          PY

      - name: Seal bootstrap evidence
        shell: bash
        run: |
          set -euo pipefail
          cd phase20-forward-bootstrap
          sha256sum bootstrap.json git-sha.txt > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Upload sanitized bootstrap evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-phase20-forward-bootstrap-${{ github.sha }}
          path: phase20-forward-bootstrap
          if-no-files-found: error
          retention-days: 90
