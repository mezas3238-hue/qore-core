name: QORE Capitalizer Provider Bound Spread Evidence V1

on:
  push:
    branches:
      - agent/capitalizer-provider-bound-spread-evidence-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-provider-bound-spread-evidence-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_provider_bound_historical_spread_evidence_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_provider_bound_historical_spread_evidence_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-provider-bound-spread-evidence-v1-${{ github.ref }}
  cancel-in-progress: true

env:
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
  QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}
  V21_RUN_ID: '36264229554'
  V21_ARTIFACT_SHA: '05452328bbf5cbbc4b26210791d13114105e3f9d'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_provider_bound_historical_spread_evidence_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_provider_bound_historical_spread_evidence_v1.py
      - name: Mypy
        run: |
          mypy src/qore/infrastructure/trader_lab/capitalizer_provider_bound_historical_spread_evidence_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_provider_bound_historical_spread_evidence_v1.py

  spread:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol: [USDJPY, AUDJPY, AUDUSD, GBPJPY, EURUSD, GBPUSD, XAUUSD, USDCAD, NAS100]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[ctrader]'
      - name: Verify read-only cTrader inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in QORE_CTRADER_CLIENT_ID QORE_CTRADER_CLIENT_SECRET QORE_CTRADER_ACCESS_TOKEN QORE_CTRADER_REFRESH_TOKEN; do
            test -n "${!name:-}" || { echo "missing required read-only DEMO input: $name" >&2; exit 2; }
          done
      - name: Discover DEMO account when not configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            if ! [[ "$account_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "cTrader DEMO account discovery returned invalid id" >&2
              exit 3
            fi
            echo "::add-mask::$account_id"
            printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          fi
      - name: Download authoritative consumed selected populations
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v21-reconstructed-*-${{ env.V21_ARTIFACT_SHA }}
          path: reconstructed
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ env.V21_RUN_ID }}
      - name: Collect provider-bound historical spread evidence
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_provider_bound_historical_spread_evidence_v1 \
            market "${{ matrix.symbol }}" \
            reconstructed/validation-input \
            reconstructed/reserved-input \
            spread-output
      - name: Enforce frozen provider-bound evidence contract
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["SYMBOL"].lower()
          report = json.loads(
              Path(
                  f"spread-output/capitalizer-provider-bound-spread-{symbol}-v1-report.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_PROVIDER_BOUND_HISTORICAL_SPREAD_EVIDENCE_V1"
          )
          assert report["canonical_symbol"] == os.environ["SYMBOL"]
          assert report["consumed_periods"] == [
              "CONSUMED_VALIDATION_2022_2024",
              "CONSUMED_RESERVED_2020_2022",
          ]
          assert report["event_count"] == report["entrant_count"] * 2
          assert report["request_count"] == report["event_count"] * 2
          assert report["entry_coverage"] == "1"
          assert report["exit_coverage"] == "1"
          assert report["bid_coverage"] == "1"
          assert report["ask_coverage"] == "1"
          assert report["provider_native"] is True
          assert report["future_quote_used"] is False
          assert report["interpolation_used"] is False
          assert report["synthetic_quote_used"] is False
          assert report["realized_outcome_read"] is False
          assert report["exit_reason_read"] is False
          assert report["fresh_holdout_touched"] is False
          assert report["commission_evidence_included"] is False
          assert report["fill_price_evidence_included"] is False
          assert report["cost_certification_satisfied"] is False
          print(json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-provider-bound-spread-${{ matrix.symbol }}-${{ github.sha }}
          path: spread-output
          if-no-files-found: error
          retention-days: 90

  matrix:
    needs: spread
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-provider-bound-spread-*-${{ github.sha }}
          path: spread-input
          merge-multiple: false
      - name: Build provider-bound spread matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_provider_bound_historical_spread_evidence_v1 \
            matrix spread-input
      - name: Enforce spread-only certification boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "spread-input/matrix-output/"
                  "capitalizer-provider-bound-historical-spread-matrix-v1.json"
              ).read_text()
          )
          assert report["market_count"] == 9
          assert report["markets_full_entry_exit_bid_ask_coverage"] == 9
          assert report["all_markets_full_coverage"] is True
          assert report["provider_native"] is True
          assert report["future_quote_used"] is False
          assert report["interpolation_used"] is False
          assert report["synthetic_quote_used"] is False
          assert report["fresh_holdout_touched"] is False
          assert report["commission_evidence_included"] is False
          assert report["fill_price_evidence_included"] is False
          assert report["slippage_evidence_included"] is False
          assert report["latency_evidence_included"] is False
          assert report["cost_certification_satisfied"] is False
          print(json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-provider-bound-spread-matrix-${{ github.sha }}
          path: spread-input/matrix-output
          if-no-files-found: error
          retention-days: 90
