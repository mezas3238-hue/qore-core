name: QORE Capitalizer DD Path State Machine V8

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-dd-path-state-machine-v8.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_dd_path_state_machine_v8.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_dd_path_state_machine_v8.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-dd-path-state-machine-v8-${{ github.sha }}
  cancel-in-progress: false

env:
  DEV_DIRECT_RUN_ID: '36196002610'
  DEV_DIRECT_SHA: 'ddd00209e50d5ec16c8cb94f34e9e5e95f401839'
  DEV_CONTEXT_RUN_ID: '36211415438'
  DEV_CONTEXT_SHA: 'c652b1e5a5181ba95ac6f10ea5c95bf808a0c8a7'
  RESERVED_SOURCE_RUN_ID: '36215082659'
  RESERVED_SOURCE_SHA: '9132b8b74938b8f142d946ab8717bf66840a18d2'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check             src/qore/infrastructure/trader_lab/capitalizer_dd_path_state_machine_v8.py             tests/infrastructure/trader_lab/test_capitalizer_dd_path_state_machine_v8.py
      - name: Mypy
        run: mypy src/qore/infrastructure/trader_lab/capitalizer_dd_path_state_machine_v8.py
      - name: Focused tests
        run: pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_dd_path_state_machine_v8.py

  experiment:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - name: Download development ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-max-recovery-direct-m1-dev-*-${{ env.DEV_DIRECT_SHA }}
          path: development-input
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.DEV_DIRECT_RUN_ID }}
      - name: Download validation ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-max-recovery-direct-m1-holdout-*-${{ env.DEV_DIRECT_SHA }}
          path: validation-input
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.DEV_DIRECT_RUN_ID }}
      - name: Download development and validation contexts
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-native-market-context-v1-*-${{ env.DEV_CONTEXT_SHA }}
          path: development-validation-context
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.DEV_CONTEXT_RUN_ID }}
      - name: Download consumed reserved ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-max-recovery-direct-m1-reserved-*-${{ env.RESERVED_SOURCE_SHA }}
          path: reserved-input
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.RESERVED_SOURCE_RUN_ID }}
      - name: Download consumed reserved contexts
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-native-market-context-v1-reserved-*-${{ env.RESERVED_SOURCE_SHA }}
          path: reserved-context
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.RESERVED_SOURCE_RUN_ID }}
      - name: Run drawdown path state machine
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_dd_path_state_machine_v8             development-input validation-input reserved-input             development-validation-context reserved-context experiment-output
      - name: Enforce causal integrity
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          report = json.loads(
              Path("experiment-output/capitalizer-dd-path-state-machine-v8.json").read_text()
          )
          assert report["development_trades"] == 948
          assert report["validation_trades"] == 1034
          assert report["consumed_reserved_trades"] == 1088
          assert report["all_design_windows_consumed"] is True
          assert report["next_holdout_reserved"] == "2018-09-17_TO_2020-09-17"
          assert report["state_machine_uses_prior_closed_chosen_outcomes_only"] is True
          assert report["probe_outcome_used_only_after_probe_exit"] is True
          assert report["current_outcome_visible_to_decision"] is False
          assert report["unchosen_counterfactual_visible_to_decision"] is False
          assert report["all_entries_preserved"] is True
          assert report["target_r"] == "2.00"
          assert report["max3_preserved"] is True
          for row in report["results"]:
              for window in row["windows"].values():
                  assert Decimal(window["density_retention"]) == Decimal("1")
          assert report["automatic_policy_promotion"] is False
          assert report["runtime_rule_selected"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-dd-path-state-machine-v8-${{ github.sha }}
          path: experiment-output
          retention-days: 90
