name: QORE Scalper A1 Native-M1 Full Cognitive Replay Input Preflight

on:
  push:
    branches:
      - agent/scalper-architect-a-cognition-20261010
    paths:
      - '.github/workflows/qore-scalper-a1-nine-market-full-frame-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: scalper-a1-full-cognitive-history-inputs-${{ github.ref }}
  cancel-in-progress: false

env:
  V49_RUN: '38053946695'
  V49_SHA: 'e356e7a52541e99533b25ecfef0ab9c4e9ce03c0'
  M1_SENSOR_RUN: '38071138991'
  M1_SENSOR_SHA: '74f4d9c89cdaaefd220a9a45ba98c2a0376be3d7'

jobs:
  nine_market_causal_input_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install historical research tools
        run: python -m pip install -e '.[dev]'
      - name: Prove input preflight has fail-closed coverage
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_a1_historical_full_frame_preflight_v1.py tests/infrastructure/trader_lab/test_capitalizer_a1_historical_full_frame_preflight_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_a1_historical_full_frame_preflight_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_a1_historical_full_frame_preflight_v1.py
      - name: Download nine frozen V49 trade-source and economic books
        uses: actions/download-artifact@v4
        with:
          pattern: scalper-a2-v49-control-*-${{ env.V49_SHA }}
          path: frozen-nine-market-v49
          github-token: ${{ github.token }}
          run-id: ${{ env.V49_RUN }}
          merge-multiple: false
      - name: Download 2876 native M1 as-of source-sensor frames
        uses: actions/download-artifact@v4
        with:
          pattern: scalper-a2-entry-sensor-*-${{ env.M1_SENSOR_SHA }}
          path: pinned-nine-market-sensors
          github-token: ${{ github.token }}
          run-id: ${{ env.M1_SENSOR_RUN }}
          merge-multiple: false
      - name: Audit exact source/sensor census and STOP on missing cognitive world evidence
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_a1_historical_full_frame_preflight_v1 frozen-nine-market-v49 pinned-nine-market-sensors a1-input-readiness
      - name: Require all source IDs and no fake successful cognition result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("a1-input-readiness/scalper-a1-full-frame-historical-preflight.json").read_text())
          assert d["historical_markets"]==9
          assert d["source_opportunities"]==2876
          assert d["source_sensors_reconciled"]==2876
          assert d["sensor_source_disagreements"]==381
          assert d["nine_market_world_barriers_attested"]==0
          assert d["current_status"]=="BLOCKED_MISSING_NINE_MARKET_CAUSAL_WORLD"
          assert d["full_historical_master_frame_replayed"] is False
          assert d["measured_cognitive_pf"] is None
          assert d["measured_cognitive_drawdown_r"] is None
          assert d["trader_certified"] is False and d["live_authorized"] is False
          print("HISTORICAL M1 REPLAY BLOCKER, NOT A COGNITIVE PF/DD:",d["barrier_evidence_gaps"])
          PY
      - name: Archive exact nine-market cognition evidence readiness audit
        uses: actions/upload-artifact@v4
        with:
          name: scalper-a1-full-cognitive-native-m1-preflight-${{ github.sha }}
          path: a1-input-readiness/
          if-no-files-found: error
          retention-days: 90
