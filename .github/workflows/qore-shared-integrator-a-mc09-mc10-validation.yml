name: QORE Shared Integrator A MC09 MC10 Validation

on:
  push:
    branches:
      - agent/shared-integration-a-mc09-mc10-001
  pull_request:
    paths:
      - "src/qore/infrastructure/core_stack_v2/market_physics_constraints.py"
      - "src/qore/infrastructure/core_stack_v2/shared_zero_open_work.py"
      - "tests/infrastructure/test_core_stack_v2_market_physics_constraints.py"
      - "scripts/shared_mc09_belief_state_real_position_replay.py"
      - "scripts/shared_mc09_belief_state_calibration.py"
      - "scripts/shared_mc09_belief_state_calibration_v2.py"
      - "scripts/shared_mc10_market_physics_real_replay.py"
      - "scripts/shared_mc10_transition_stability.py"
      - ".github/workflows/qore-shared-integrator-a-mc09-mc10-validation.yml"

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Static and unit validation
        run: |
          set -euo pipefail
          ruff check             src/qore/infrastructure/core_stack_v2/market_physics_constraints.py             src/qore/infrastructure/core_stack_v2/shared_zero_open_work.py             tests/infrastructure/test_core_stack_v2_market_physics_constraints.py             tests/infrastructure/test_core_stack_v2_shared_zero_open_work.py             scripts/shared_mc09_belief_state_real_position_replay.py             scripts/shared_mc09_belief_state_calibration.py             scripts/shared_mc09_belief_state_calibration_v2.py             scripts/shared_mc10_market_physics_real_replay.py             scripts/shared_mc10_transition_stability.py
          mypy src/qore/infrastructure/core_stack_v2/market_physics_constraints.py
          pytest -q             tests/infrastructure/test_core_stack_v2_market_physics_constraints.py             tests/infrastructure/test_core_stack_v2_shared_zero_open_work.py
      - name: Verify canonical ledger closure
        run: |
          python - <<'PY'
          from qore.infrastructure.core_stack_v2.shared_zero_open_work import (
              SharedWorkState,
              build_shared_master_open_work_ledger,
          )
          by_id = {item.work_id: item for item in build_shared_master_open_work_ledger()}
          assert by_id["MC-09"].state is SharedWorkState.COMPLETED_AND_PROVEN
          assert by_id["MC-10"].state is SharedWorkState.COMPLETED_AND_PROVEN
          assert by_id["MC-11"].state is not SharedWorkState.COMPLETED_AND_PROVEN
          PY
      - name: Recover and verify sealed A evidence
        run: |
          set -euo pipefail
          mkdir -p input/mc09 input/mc10
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11116522138/zip" > mc09.zip
          unzip -q mc09.zip -d input/mc09
          (cd input/mc09 && sha256sum -c SHA256SUMS)
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11117164463/zip" > mc10.zip
          unzip -q mc10.zip -d input/mc10
          (cd input/mc10 && sha256sum -c SHA256SUMS)
      - name: Verify terminal evidence claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def find_json(root: str, needle: str):
              for p in Path(root).rglob("*.json"):
                  try:
                      obj=json.loads(p.read_text())
                  except Exception:
                      continue
                  if needle in str(obj.get("status", "")):
                      return obj
              raise AssertionError(f"missing sealed result: {needle}")

          mc09=find_json("input/mc09", "MC09_BELIEF_STATE_CALIBRATION_V2_TEMPORAL_OOS_PASS")
          assert mc09["mc09_completed_and_proven"] is True
          assert mc09["temporal_oos_used_for_fit"] is False
          assert mc09["protected_certification_holdout_opened"] is False

          mc10=find_json("input/mc10", "MC10_TRANSITION_STABILITY_REPLICATED_PASS")
          assert mc10["mc10_completed_and_proven"] is True
          assert mc10["future_market_used"] is False
          assert mc10["future_outcome_used"] is False
          assert mc10["protected_certification_holdout_opened"] is False
          PY
