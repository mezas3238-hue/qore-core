name: QORE Turtle Soup XAUUSD R3 Annual Regime Forensics

on:
  push:
    branches:
      - agent/turtle-soup-xauusd-r3-forensics-001
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  R3_RUN_ID: "35256772043"
  R3_ARTIFACT: qore-turtle-soup-xauusd-r3-cibo-journey-binding-repair-39a5fb952ad3189656faedb57f854528e2fa29c8

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QORE development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check --ignore E501 \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r3_regime_forensics.py \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r3_regime_forensics.py
      - name: Mypy focused gate
        run: mypy src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r3_regime_forensics.py
      - name: Focused tests
        run: pytest -q tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r3_regime_forensics.py

  forensics:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download immutable official R3 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.R3_ARTIFACT }}
          path: r3-official
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.R3_RUN_ID }}
      - name: Execute annual regime forensics
        run: |
          mkdir -p regime-output
          python -m qore.infrastructure.trader_lab.turtle_soup_xauusd_r3_regime_forensics r3-official regime-output > regime-output/stdout.json
          printf '%s\n' "$GITHUB_SHA" > regime-output/git-sha.txt
      - name: Enforce diagnostic-only governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('regime-output/regime-forensics.json').read_text())
          g=r['governance']
          assert r['evidence_status']=='POST_RESULT_DIAGNOSTIC_OVER_CONSUMED_R3_NOT_FRESH_HOLDOUT'
          assert g['fresh_holdout_consumed'] is False
          assert g['retrospective_filter_promotion_allowed'] is False
          assert g['economic_contract_changed'] is False
          assert g['demo_eligible'] is False
          assert g['live_authorized'] is False
          assert g['real_capital_authorized'] is False
          assert g['production_authorized'] is False
          PY
      - name: Hash immutable regime result
        run: (cd regime-output && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-xauusd-r3-annual-regime-forensics-${{ github.sha }}
          path: regime-output
