name: QORE Turtle Soup XAUUSD R13 Intelligence Alignment Forensics

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-xauusd-r3-forensics-001
    paths:
      - '.github/workflows/turtle-soup-xauusd-r13-intelligence-alignment-forensics.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r13_intelligence_alignment_forensics.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r13_intelligence_alignment_forensics.py'

permissions:
  contents: read
  actions: read

env:
  R12_RUN_ID: '35286658128'
  R12_ARTIFACT: 'qore-turtle-soup-xauusd-r12-autonomous-2y-3bd9b1263c75da51582b960db36841e539dfa4d2'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-XAUUSD-2f510461b3360e91d5ee70a72716a76cd6561f16'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check --ignore E501,I001 src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r13_intelligence_alignment_forensics.py tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r13_intelligence_alignment_forensics.py
      - run: mypy src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r13_intelligence_alignment_forensics.py
      - run: pytest -q --no-cov tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r13_intelligence_alignment_forensics.py

  forensics:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable R12 autonomous 2Y artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.R12_ARTIFACT }}
          path: r12
          github-token: ${{ github.token }}
          run-id: ${{ env.R12_RUN_ID }}
      - name: Download immutable CIBO Target Destination V2 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: targets
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Run R13 intelligence alignment and loss forensics
        run: |
          mkdir -p r13-output
          python -m qore.infrastructure.trader_lab.turtle_soup_xauusd_r13_intelligence_alignment_forensics r12 targets r13-output > r13-output/stdout.json
          printf '%s\n' "$GITHUB_SHA" > r13-output/git-sha.txt
      - name: Enforce forensic reproduction and governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('r13-output/r13-intelligence-alignment-report.json').read_text())
          assert p['identity']=='TURTLE_SOUP_XAUUSD_R13_INTELLIGENCE_ALIGNMENT_LOSS_FORENSICS_V1'
          assert p['intelligence_coverage']['assessed_fill_opportunities']==1731
          assert p['intelligence_coverage']['state_counts']['UNKNOWN']==1580
          assert p['directive_alignment']['executed_trades']==1132
          assert p['directive_alignment']['conflicted_executed_despite_abstain_directive']==47
          assert p['directive_alignment']['unknown_executed_despite_no_decision']==1080
          assert p['directive_alignment']['research_candidate_executed_despite_no_entry']==5
          assert p['loss_forensics']['losses']==782
          c=p['loss_forensics']['causal_partition']
          assert c['ENGINE_ABSTAIN_CONFLICTED_OVERRIDDEN']==41
          assert c['RESEARCH_NO_ENTRY_OVERRIDDEN']==3
          assert c['UNKNOWN_SELECTED_DOL_MISALIGNED_WITH_REACHED_CIBO_DOL']==115
          assert c['UNKNOWN_INTRABAR_OR_STOP_PRECEDENCE_AROUND_SELECTED_DOL']==1
          assert c['UNKNOWN_UPSTREAM_JOURNEY_FAILED_BEFORE_ANY_ACTIVE_CIBO_DOL']==622
          assert p['loss_forensics']['losses_with_alternative_active_cibo_dol_reached_before_exit']==121
          assert p['governance']['fresh_holdout_consumed'] is False
          assert p['governance']['no_rule_promoted'] is True
          assert p['governance']['live_authorized'] is False
          assert p['governance']['real_capital_authorized'] is False
          PY
      - name: Hash immutable R13 result
        run: |
          cd r13-output
          sha256sum r13-intelligence-alignment-report.json r13-loss-ledger.json stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-xauusd-r13-intelligence-alignment-${{ github.sha }}
          path: r13-output
          if-no-files-found: error
          retention-days: 90
