name: QORE FundedNext Closeout Autofix

on:
  push:
    branches:
      - agent/fundednext-first-execution-closeout-001
    paths:
      - .github/workflows/fundednext-closeout-autofix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fundednext-first-execution-closeout-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: pip install 'ruff<1,>=0.5'
      - name: Apply safe lint fixes
        run: ruff check --fix src/qore/infrastructure/fundednext_mt5.py src/qore/infrastructure/fundednext_operational.py src/qore/infrastructure/fundednext_runtime_supervisor.py tests/infrastructure/test_fundednext_runtime_readiness.py
      - name: Commit source fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "qore-closeout-bot"
          git config user.email "qore-closeout-bot@users.noreply.github.com"
          git add src tests
          git commit -m "fix first-execution closeout lint"
          git push origin HEAD:agent/fundednext-first-execution-closeout-001
