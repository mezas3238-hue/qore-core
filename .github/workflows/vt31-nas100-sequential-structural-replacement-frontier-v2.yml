name: QORE VT31 NAS100 Sequential Structural Replacement Frontier V2

on:
  push:
    branches:
      - agent/vt31-nas100-hypothesis-lifecycle-v1
    paths:
      - scripts/vt31_nas100_sequential_structural_replacement_frontier_v2.py
      - .github/workflows/vt31-nas100-sequential-structural-replacement-frontier-v2.yml

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed_holdout
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Freeze Silver Bullet and static gate
        run: |
          set -euo pipefail
          test "$(git hash-object src/qore/infrastructure/traders/vt31_silver_bullet_r2_2.py)" = "3e66f4532c67e62ab2eef7ac376bb86ef7011f73"
          python -m py_compile scripts/vt31_nas100_sequential_structural_replacement_frontier_v2.py
          ruff check scripts/vt31_nas100_sequential_structural_replacement_frontier_v2.py

      - name: Recover immutable M1 evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"

      - name: Run sequential replacement V2
        run: |
          set -euo pipefail
          python scripts/vt31_nas100_sequential_structural_replacement_frontier_v2.py \
            "input/${EVIDENCE_PATH}" \
            --partition "${PARTITION}" \
            --output "result/sequential-v2-${PARTITION}.json" \
            | tee "result/summary-${PARTITION}.json"

      - name: Governance gate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          partition = os.environ["PARTITION"]
          payload = json.loads(
              Path(f"result/sequential-v2-{partition}.json").read_text()
          )
          g = payload["governance"]
          assert g["silver_bullet_modified"] is False
          assert g["market_state_v2_reused"] is True
          assert g["sequential_replacement_v1_architecture_reused"] is True
          assert g["hypothesis_lifecycle_v1_reused"] is True
          assert g["transition_forensics_v1_reused"] is True
          assert g["future_labels_runtime_forbidden"] is True
          assert g["terminal_pnl_used_at_runtime"] is False
          assert g["fold_identity_used_at_runtime"] is False
          assert g["h4_primary_causal_feature"] is False
          assert g["h1_primary_causal_feature"] is False
          assert g["opens_new_holdout"] is False
          assert g["policy_promoted"] is False
          assert g["candidate_certified"] is False
          assert g["live_authorized"] is False
          assert g["real_capital_authorized"] is False
          assert g["production_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-sequential-v2-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-nas100-sequential-v2-*-${{ github.sha }}
          path: input
          merge-multiple: true

      - name: Aggregate cross-fold economic gate
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from pathlib import Path

          names=("r5","r6","r8","consumed_holdout")
          folds={}
          for path in Path("input").glob("sequential-v2-*.json"):
              payload=json.loads(path.read_text())
              folds[payload["partition"]]=payload
          assert set(folds)==set(names)

          common=set.intersection(
              *(set(folds[fold]["variants"]) for fold in names)
          )
          summary={}
          passing=[]
          for variant in sorted(common):
              per_fold={
                  fold:folds[fold]["variants"][variant]
                  for fold in names
              }
              summary[variant]={
                  fold:{
                      "trade_count":item["trade_count"],
                      "profit_factor":item["metrics"]["profit_factor"],
                      "max_drawdown_r":item["metrics"]["max_drawdown_r"],
                      "raw_max_losing_streak":item["raw_max_losing_streak"],
                      "material_max_losing_streak_010r":item[
                          "material_max_losing_streak_010r"
                      ],
                      "mc_positive_terminal_probability":item[
                          "monte_carlo"
                      ]["positive_terminal_probability"],
                      "mc_p95_max_drawdown_r":item[
                          "monte_carlo"
                      ]["p95_max_drawdown_r"],
                      "passes_all_objectives":item[
                          "passes_all_objectives"
                      ],
                  }
                  for fold,item in per_fold.items()
              }
              if all(
                  bool(per_fold[fold]["passes_all_objectives"])
                  for fold in names
              ):
                  passing.append(variant)

          report={
              "schema":(
                  "qore.vt31.nas100."
                  "sequential_structural_replacement_frontier.aggregate.v2"
              ),
              "development_passing":passing,
              "variant_summary":summary,
              "governance":{
                  "silver_bullet_modified":False,
                  "existing_labs_composed":True,
                  "cross_fold_required":True,
                  "opens_new_holdout":False,
                  "policy_promoted":False,
                  "candidate_certified":False,
              },
          }
          Path("result/aggregate.json").write_text(
              json.dumps(report,sort_keys=True,indent=2)+"\n"
          )
          print(json.dumps(report,sort_keys=True))
          PY

      - name: Bind immutable result
        run: |
          set -euo pipefail
          echo "$GITHUB_SHA" > result/git-sha.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd result && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-sequential-v2-aggregate-${{ github.sha }}
          path: result/
          retention-days: 90
