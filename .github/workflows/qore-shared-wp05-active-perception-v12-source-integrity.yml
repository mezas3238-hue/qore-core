name: QORE Shared WP05 V12 Source-Only Raw Integrity

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - docs/shared/QORE_SHARED_WP05_V12_SOURCE_ONLY_RAW_INTEGRITY_PREREGISTRATION.md
      - src/qore/infrastructure/core_stack_v2/active_perception_v12_source_integrity.py
      - scripts/shared_wp05_active_perception_v12_source_integrity.py
      - tests/infrastructure/test_core_stack_v2_active_perception_v12_source_integrity.py
      - .github/workflows/qore-shared-wp05-active-perception-v12-source-integrity.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: qore-shared-wp05-v12-source-integrity-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  V12_ACQUISITION_RUN_ID: "36454372776"
  V12_ACQUISITION_GIT_SHA: "a54e7a3fe2708607be1da10a92ae44bc9479ee86"
  V12_MANIFEST_SHA256: "2f18b9f11d5893effa46ac85c712edd6646d1d90a9de521b235143e42155d191"
  V12_GLOBAL_DATASET_SHA256: "ebbe30a887867bb917f0992b15e1600f9f06eccb07562b9625fcb9517fb381c8"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Shared
        run: pip install -e ".[dev]"
      - name: Validate source-integrity protocol
        run: |
          set -euo pipefail
          ruff check             src/qore/infrastructure/core_stack_v2/active_perception_v12_source_integrity.py             scripts/shared_wp05_active_perception_v12_source_integrity.py             tests/infrastructure/test_core_stack_v2_active_perception_v12_source_integrity.py
          mypy             src/qore/infrastructure/core_stack_v2/active_perception_v12_source_integrity.py             scripts/shared_wp05_active_perception_v12_source_integrity.py
          python -m py_compile             src/qore/infrastructure/core_stack_v2/active_perception_v12_source_integrity.py             scripts/shared_wp05_active_perception_v12_source_integrity.py
          pytest -q             tests/infrastructure/test_core_stack_v2_active_perception_v12_source_integrity.py

  audit:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Shared
        run: pip install -e .

      - name: Download frozen full-R8 raw acquisition artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.V12_ACQUISITION_RUN_ID }}
          pattern: qore-shared-wp05-v12-full-r8-data-*
          path: input/raw
          merge-multiple: false

      - name: Verify 16 immutable artifact checksum manifests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' sums < <(find input/raw -name SHA256SUMS -print0)
          test "${#sums[@]}" -eq 16
          for sumfile in "${sums[@]}"; do
            (
              cd "$(dirname "$sumfile")"
              sha256sum -c SHA256SUMS
            )
          done

      - name: Re-read and audit raw provider evidence
        run: |
          set -euo pipefail
          python scripts/shared_wp05_active_perception_v12_source_integrity.py             --raw-root input/raw             --expected-git-sha "$V12_ACQUISITION_GIT_SHA"             --expected-manifest-sha256 "$V12_MANIFEST_SHA256"             --expected-global-dataset-sha256 "$V12_GLOBAL_DATASET_SHA256"             --output result/wp05-v12-source-integrity-report.json

      - name: Seal source-integrity report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p result
          printf '%s\n' "$GITHUB_SHA" > result/audit-git-sha.txt
          printf '%s\n' "$GITHUB_RUN_ID" > result/audit-run-id.txt
          if [ -f result/wp05-v12-source-integrity-report.json ]; then
            sha256sum result/wp05-v12-source-integrity-report.json               > result/wp05-v12-source-integrity-report.sha256
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-shared-wp05-v12-source-integrity-${{ github.sha }}
          path: |
            result/wp05-v12-source-integrity-report.json
            result/wp05-v12-source-integrity-report.sha256
            result/audit-git-sha.txt
            result/audit-run-id.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Report source-only integrity result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f result/wp05-v12-source-integrity-report.json ]; then
            printf 'WP-05 V12 source-only raw integrity run `%s` failed technically before a complete raw audit. No target/outcome, R6/R5 or fresh holdout was opened.\n'               "$GITHUB_RUN_ID" > result/issue-comment.md
            gh issue comment 643 --body-file result/issue-comment.md
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p=json.loads(
              Path("result/wp05-v12-source-integrity-report.json").read_text()
          )
          lines=[
              "## WP-05 V12 source-only raw integrity audit",
              "",
              f"- audit Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- GitHub Actions run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- upstream acquisition run: `{os.environ['V12_ACQUISITION_RUN_ID']}`",
              f"- status: **{p['status']}**",
              f"- raw artifacts: **{p['artifact_count']} / 16**",
              f"- raw provider pages: **{p['raw_page_count']}**",
              f"- raw BID ticks: **{p['raw_bid_tick_count']}**",
              f"- raw ASK ticks: **{p['raw_ask_tick_count']}**",
              f"- page-key duplicates: **{p['page_key_duplicate_count']}**",
              f"- page-key conflicts: **{p['page_key_conflict_count']}**",
              f"- strict page-time overlaps: **{p['strict_page_time_overlap_count']}**",
              f"- exact boundary-row repeats: **{p['exact_boundary_row_repeat_count']}**",
              f"- repeated content-hash excess (diagnostic): **{p['repeated_content_hash_excess']}**",
              f"- exact same-timestamp row repeats (diagnostic): **{p['exact_same_timestamp_row_repeat_count']}**",
              f"- window max inter-event gap ms: `{p['window_max_interevent_gap_ms']}`",
              f"- ticks/min x1000: `{p['ticks_per_minute_x1000']}`",
              "- target/outcome read: **False**",
              "- R6/R5 read: **False**",
              "- WP-05 fresh holdout opened: **False**",
              "- this audit can authorize source-only representation freezing only; it cannot admit V12 scientifically",
          ]
          Path("result/issue-comment.md").write_text("\n".join(lines)+"\n")
          PY
          gh issue comment 643 --body-file result/issue-comment.md

      - name: Enforce frozen source-integrity gate
        run: |
          set -euo pipefail
          test -f result/wp05-v12-source-integrity-report.json
          test "$(python -c 'import json; print(json.load(open("result/wp05-v12-source-integrity-report.json"))["status"])')" = "green_source_integrity"
