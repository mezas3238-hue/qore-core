name: QORE Shared STI CIBO Read Only Facts

concurrency:
  group: qore-shared-sti-cibo-read-only-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - src/qore/infrastructure/core_stack_v2/shared_cibo_read_only_facts.py
      - tests/infrastructure/test_core_stack_v2_shared_cibo_read_only_facts.py
      - docs/shared/QORE_SHARED_STI_CIBO_READ_ONLY_FACTS_CONTRACT_001.md
      - .github/workflows/qore-shared-sti-cibo-read-only-facts.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Shared
        run: pip install -e ".[dev]"

      - name: Validate Shared to CIBO read-only boundary
        run: |
          set -euo pipefail
          mkdir -p result
          ruff check \
            src/qore/infrastructure/core_stack_v2/shared_cibo_read_only_facts.py \
            tests/infrastructure/test_core_stack_v2_shared_cibo_read_only_facts.py
          mypy \
            src/qore/infrastructure/core_stack_v2/shared_cibo_read_only_facts.py
          pytest -q \
            tests/infrastructure/test_core_stack_v2_shared_cibo_read_only_facts.py \
            --junitxml=result/junit.xml

      - name: Seal CIBO boundary evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root=ET.parse("result/junit.xml").getroot()
          suites=(root,) if root.tag == "testsuite" else tuple(root.findall("testsuite"))
          tests=sum(int(item.attrib.get("tests", "0")) for item in suites)
          failures=sum(int(item.attrib.get("failures", "0")) for item in suites)
          errors=sum(int(item.attrib.get("errors", "0")) for item in suites)
          if tests <= 0:
              raise SystemExit("STI CIBO boundary refuses zero-test evidence")
          if failures + errors:
              raise SystemExit("STI CIBO boundary refuses failing evidence")

          pack={
              "identity":"QORE_SHARED_STI_CIBO_READ_ONLY_FACTS_EVIDENCE_001",
              "head":os.environ["GITHUB_SHA"],
              "run_id":int(os.environ["GITHUB_RUN_ID"]),
              "test_count":tests,
              "failure_count":failures+errors,
              "valid_trade_required":True,
              "wait_can_reach_cibo":False,
              "abstain_can_reach_cibo":False,
              "cibo_may_allocate_zero":True,
              "shared_sizing_authority":False,
              "shared_capital_authority":False,
              "shared_reserve_authority":False,
              "shared_release_authority":False,
              "shared_compound_authority":False,
              "shared_risk_authority":False,
              "shared_execution_authority":False,
              "productive_cibo_behavior_change":False,
          }
          Path("result/sti-cibo-read-only-evidence.json").write_text(
              json.dumps(pack,sort_keys=True,indent=2)+"\n"
          )
          PY
          printf '%s\n' "$GITHUB_SHA" > result/code-git-sha.txt
          (
            cd result
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
              | sort -z | xargs -0 sha256sum > SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-sti-cibo-read-only-${{ github.sha }}
          path: result
          retention-days: 90

      - name: Report CIBO boundary status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence=json.loads(
              Path("result/sti-cibo-read-only-evidence.json").read_text()
          )
          body="\n".join([
              "## Shared STI-13 — CIBO Read-Only Facts",
              "",
              f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- tests: **{evidence['test_count']}** / failures: **{evidence['failure_count']}**",
              "- Trader VALID_TRADE required before CIBO facts: **True**",
              "- WAIT/ABSTAIN can reach CIBO: **False**",
              "- CIBO may allocate zero despite Shared support: **True**",
              "- Shared sizing/capital/Risk/execution authority: **False**",
              "- productive CIBO behavior change: **False**",
          ])+"\n"
          Path("result/issue-comment.md").write_text(body)
          PY
          gh issue comment 638 --body-file result/issue-comment.md
