name: QORE Capitalizer Cognitive Position Trajectory Forensics 2R V2

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-cognitive-position-trajectory-forensics-2r-v2.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_cognitive_position_trajectory_forensics_2r_v2.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_cognitive_position_trajectory_forensics_2r_v2.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-cognitive-position-trajectory-forensics-2r-v2-${{ github.sha }}
  cancel-in-progress: false

env:
  REBASE_RUN_ID: '36078677895'
  REBASE_SHA: 'cfc04849c8bbfd6565310d89456f5e367ea880f7'
  TARGET_V2_RUN_ID: '36077843102'
  TARGET_V2_SHA: 'a47de3b491b4468527c945d6eff3afbbaec82d4e'
  M1_RUN_ID: '35548099334'
  M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_cognitive_position_trajectory_forensics_2r_v2.py \
            tests/infrastructure/trader_lab/test_capitalizer_cognitive_position_trajectory_forensics_2r_v2.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_cognitive_position_trajectory_forensics_2r_v2.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_cognitive_position_trajectory_forensics_2r_v2.py

  market:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol:
          - USDJPY
          - AUDJPY
          - AUDUSD
          - GBPJPY
          - EURUSD
          - GBPUSD
          - XAUUSD
          - USDCAD
          - NAS100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download true-2R economic rebase
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cognitive-economic-rebase-2r-v1-${{ env.REBASE_SHA }}
          path: rebase-input
          github-token: ${{ github.token }}
          run-id: ${{ env.REBASE_RUN_ID }}
      - name: Download corrected Target V2 market ledger
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-max-recovery-target-sensitivity-2y-v2-${{ matrix.symbol }}-${{ env.TARGET_V2_SHA }}
          path: target-input
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_V2_RUN_ID }}
      - name: Download immutable provider-native M1
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.M1_SHA }}
          path: m1-input
          github-token: ${{ github.token }}
          run-id: ${{ env.M1_RUN_ID }}
      - name: Build true-2R position trajectory
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cognitive_position_trajectory_forensics_2r_v2 \
            market rebase-input target-input m1-input trajectory-output \
            --symbol "${{ matrix.symbol }}"
      - name: Enforce causal controls
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["EXPECTED_SYMBOL"]
          report = json.loads(
              (
                  Path("trajectory-output")
                  / f"capitalizer-{symbol.lower()}-cognitive-position-trajectory-forensics-2r-v2.json"
              ).read_text()
          )
          assert report["symbol"] == symbol
          assert report["target_r"] == "2.00"
          assert report["market_trades"] > 0
          assert report["losing_trades"] >= report["stop_losses"]
          assert report["true2r_max_drawdown_r"] == (
              "12.93584837435268644582248142"
          )
          assert report["exit_bar_excluded_from_trajectory_features"] is True
          assert report["m3_pivot_confirmation_required"] is True
          assert report["stop_policy_simulated"] is False
          assert report["current_outcome_used_to_discover_trajectory"] is False
          assert report["strategy_rules_changed"] is False
          assert report["cognitive_rules_changed"] is False
          assert report["entry_changed"] is False
          assert report["stop_changed"] is False
          assert report["target_changed"] is False
          assert report["max3_changed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["trader_certified"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-position-trajectory-2r-v2-${{ matrix.symbol }}-${{ github.sha }}
          path: trajectory-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-position-trajectory-2r-v2-*-${{ github.sha }}
          path: trajectory-input
          merge-multiple: false
      - name: Build nine-market true-2R trajectory matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cognitive_position_trajectory_forensics_2r_v2 \
            matrix trajectory-input matrix-output
      - name: Enforce aggregate controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "matrix-output/"
                  "capitalizer-nine-market-cognitive-position-trajectory-forensics-2r-v2.json"
              ).read_text()
          )
          assert report["market_count"] == 9
          assert report["target_r"] == "2.00"
          assert report["trades"] == 948
          assert report["stop_losses"] == 275
          assert report["true2r_max_drawdown_r"] == (
              "12.93584837435268644582248142"
          )
          assert report["max_drawdown_losing_trades"] == 33
          assert report["max_drawdown_stop_losses"] == 17
          assert report["stop_policy_simulated"] is False
          assert report["current_outcome_used_to_discover_trajectory"] is False
          assert report["strategy_rules_changed"] is False
          assert report["cognitive_rules_changed"] is False
          assert report["entry_changed"] is False
          assert report["stop_changed"] is False
          assert report["target_changed"] is False
          assert report["max3_changed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["trader_certified"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-position-trajectory-2r-v2-matrix-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
