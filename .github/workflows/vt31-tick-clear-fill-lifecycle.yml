name: QORE VT-31 Tick-Clear Fill Lifecycle

on:
  push:
    branches:
      - agent/vt31-historical-tick-resolution-001
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  continue-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e .
          python -m py_compile scripts/vt31_tick_clear_fill_lifecycle.py
      - name: Recover immutable tick source and resolution
        run: |
          set -euo pipefail
          mkdir source-manifest source-resolution
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10425626147/zip" > source-manifest.zip
          unzip -q source-manifest.zip -d source-manifest
          test "$(cat source-manifest/git-sha.txt)" = "493825d2b14946a6ddffe36f6c472fa5d0c3187e"
          (cd source-manifest && sha256sum -c SHA256SUMS)
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10428964679/zip" > source-resolution.zip
          echo "b0273dfbe63377497c359d1fedd25fa4e12e51254b9cb32da2fd79d35550f10e  source-resolution.zip" | sha256sum -c -
          unzip -q source-resolution.zip -d source-resolution
          test "$(cat source-resolution/git-sha.txt)" = "2270fdc7b39fdd53a2ac72b27527b0cc0236ae8d"
          (cd source-resolution && sha256sum -c SHA256SUMS)
      - name: Recover immutable consumed M1 partitions
        run: |
          set -euo pipefail
          mkdir -p consumed/r5 consumed/r6 consumed/r8
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10380044761/zip" > r5.zip
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10389112524/zip" > r6.zip
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10402199719/zip" > r8.zip
          echo "828335b99cd51c663e3f0f095df5137e881da3d7e8da741da8ca116a0400edf8  r5.zip" | sha256sum -c -
          echo "9b0f3a05dc76b5dd83e5e3610266484bee1b79595dbbaacdff1d799115ad58b9  r6.zip" | sha256sum -c -
          echo "9f5df4eba1882cb498b4e3657176f34a7c27083f3ac1af7856ebddf01447f34d  r8.zip" | sha256sum -c -
          unzip -q r5.zip -d consumed/r5
          unzip -q r6.zip -d consumed/r6
          unzip -q r8.zip -d consumed/r8
      - name: Continue 47 exact tick-clear fills through frozen protected-swing M1
        run: |
          set -euo pipefail
          python scripts/vt31_tick_clear_fill_lifecycle.py \
            --manifest source-manifest/vt31-historical-tick-windows.json \
            --resolution source-resolution/vt31-tick-execution-resolution.json \
            --output-dir lifecycle \
            --r5-nas100 consumed/r5/fresh/NAS100/market-evidence.json \
            --r5-sp500 consumed/r5/fresh/SP500/market-evidence.json \
            --r5-us30 consumed/r5/fresh/US30/market-evidence.json \
            --r6-nas100 consumed/r6/fresh/NAS100/market-evidence.json \
            --r6-sp500 consumed/r6/fresh/SP500/market-evidence.json \
            --r6-us30 consumed/r6/fresh/US30/market-evidence.json \
            --r8-fresh-nas100 consumed/r8/fresh/NAS100/market-evidence.json \
            --r8-fresh-sp500 consumed/r8/fresh/SP500/market-evidence.json \
            --r8-fresh-us30 consumed/r8/fresh/US30/market-evidence.json
      - name: Validate lifecycle inventory fail-closed
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('lifecycle/vt31-tick-clear-fill-lifecycle.json').read_text())
          a=json.loads(Path('lifecycle/vt31-later-same-bar-ambiguity-manifest.json').read_text())
          assert p['research_only'] is True
          assert p['opens_new_holdout'] is False
          assert p['candidate_status'] == 'NO_R9_NOT_CERTIFIED'
          assert p['source_tick_clear_count'] == 47
          assert len(p['results']) == 47
          assert sum(p['counts'].values()) == 47
          assert a['research_only'] is True and a['opens_new_holdout'] is False
          assert len({w['window_id'] for w in a['windows']}) == len(a['windows'])
          print(json.dumps({'lifecycle_counts':p['counts'],'later_ambiguities':len(a['windows'])}, sort_keys=True))
          PY
      - name: Bind immutable lifecycle artifact
        run: |
          set -euo pipefail
          echo "$GITHUB_SHA" > lifecycle/git-sha.txt
          echo "10428964679" > lifecycle/source-tick-resolution-artifact-id.txt
          echo "10425626147" > lifecycle/source-tick-manifest-artifact-id.txt
          (cd lifecycle && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-tick-clear-fill-lifecycle-${{ github.sha }}
          path: lifecycle/
          retention-days: 90
