name: QORE Capitalizer Cognitive Simultaneous Factor Collision Atlas 2R V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-cognitive-simultaneous-factor-collision-atlas-2r-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_cognitive_simultaneous_factor_collision_atlas_2r_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_cognitive_simultaneous_factor_collision_atlas_2r_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-cognitive-simultaneous-factor-collision-atlas-2r-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  REBASE_RUN_ID: '36078677895'
  REBASE_SHA: 'cfc04849c8bbfd6565310d89456f5e367ea880f7'
  CROSS_RUN_ID: '36083458303'
  CROSS_SHA: 'dbbef8abd9a75ab08da577dcf2e390e755b2f1fe'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check             src/qore/infrastructure/trader_lab/capitalizer_cognitive_simultaneous_factor_collision_atlas_2r_v1.py             tests/infrastructure/trader_lab/test_capitalizer_cognitive_simultaneous_factor_collision_atlas_2r_v1.py
      - name: Mypy
        run: |
          mypy             src/qore/infrastructure/trader_lab/capitalizer_cognitive_simultaneous_factor_collision_atlas_2r_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov             tests/infrastructure/trader_lab/test_capitalizer_cognitive_simultaneous_factor_collision_atlas_2r_v1.py

  atlas:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download true-2R cognitive rebase
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cognitive-economic-rebase-2r-v1-${{ env.REBASE_SHA }}
          path: rebase-input
          github-token: ${{ github.token }}
          run-id: ${{ env.REBASE_RUN_ID }}
      - name: Download true-2R Cross-Feature report
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cognitive-third-slot-cross-feature-atlas-2r-v1-${{ env.CROSS_SHA }}
          path: cross-input
          github-token: ${{ github.token }}
          run-id: ${{ env.CROSS_RUN_ID }}
      - name: Build true-2R simultaneous factor-collision atlas
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cognitive_simultaneous_factor_collision_atlas_2r_v1             rebase-input cross-input collision-output
      - name: Enforce true-2R collision controls
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          report = json.loads(
              Path(
                  "collision-output/"
                  "capitalizer-cognitive-simultaneous-factor-collision-atlas-2r-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_COGNITIVE_SIMULTANEOUS_FACTOR_COLLISION_ATLAS_2R_V1"
          )
          assert report["source_rebase_run_id"] == 36078677895
          assert report["source_cross_run_id"] == 36083458303
          assert report["target_r"] == "2.00"
          assert report["control_trades"] == 948
          control = report["control_metrics"]
          assert control["trades"] == 948
          assert control["stops"] == 275
          assert Decimal(control["profit_factor"]) == Decimal(
              "1.466020472120789368123727041"
          )
          assert Decimal(control["max_drawdown_r"]) == Decimal(
              "12.93584837435268644582248142"
          )

          assert report["third_slot_reference"]["trades"] == 10
          assert report["third_slot_reference"]["development_hypothesis_only"] is True
          assert report["third_slot_reference"]["runtime_rule_selected"] is False
          assert report["collision_cluster_count"] > 0
          assert report["collision_candidate_count"] >= 2
          assert report["all_collision_evidence_known_by_entry"] is True
          assert (
              report["same_timestamp_candidates_compete_before_active_exposure_exists"]
              is True
          )
          assert report["policy_count"] == 6
          assert len(report["policies"]) == 6

          for row in report["policies"]:
              assert row["collision_dropped_trades"] > 0
              assert row["combined_dropped_trades"] >= row["collision_dropped_trades"]
              assert (
                  row["combined_metrics"]["trades"]
                  + row["combined_dropped_trades"]
                  == 948
              )
              assert Decimal(row["combined_density_retention"]) > Decimal("0.95")
              assert "max_drawdown_r" in row["combined_drawdown_episode"]

          assert report["all_policies_outcome_blind"] is True
          assert report["outcomes_used_only_for_post_audit_metrics"] is True
          assert report["collision_policy_selected"] is False
          assert report["combined_rule_selected"] is False
          assert report["automatic_promotion_allowed"] is False
          assert report["rebase_control_reproduced"] is True
          assert report["strategy_rules_changed"] is False
          assert report["cognitive_rules_changed"] is False
          assert report["entry_changed"] is False
          assert report["stop_changed"] is False
          assert report["target_changed"] is False
          assert report["max3_changed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-cognitive-simultaneous-factor-collision-atlas-2r-v1-${{ github.sha }}
          path: collision-output
          if-no-files-found: error
          retention-days: 90
