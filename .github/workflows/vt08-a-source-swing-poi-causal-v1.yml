name: VT08 A Source Swing Poi Causal Contracts V1

on:
  push:
    branches:
      - agent/vt08-5m-methodology-source-20261010
    paths:
      - .github/workflows/vt08-a-source-swing-poi-causal-v1.yml
      - src/qore/infrastructure/trader_lab/vt08_5m_ttrades_source_swing_asof_contract_v1.py
      - tests/infrastructure/trader_lab/test_vt08_5m_ttrades_source_swing_asof_contract_v1.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        symbol: [EURJPY, USDCHF, NZDUSD, CADJPY, USDCAD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Source swing FVG receipts CISD as-of adversarial tests
        run: |
          ruff check src/qore/infrastructure/trader_lab/vt08_5m_ttrades_source_swing_asof_contract_v1.py tests/infrastructure/trader_lab/test_vt08_5m_ttrades_source_swing_asof_contract_v1.py
          python -m compileall -q src/qore/infrastructure/trader_lab/vt08_5m_ttrades_source_swing_asof_contract_v1.py
          pytest -q tests/infrastructure/trader_lab/test_vt08_5m_ttrades_source_swing_asof_contract_v1.py
      - name: Research-only typed source evidence fixture summary
        env:
          MARKET: ${{ matrix.symbol }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from qore.infrastructure.trader_lab.vt08_5m_ttrades_source_swing_asof_contract_v1 import Family, PoiType, ProofStatus
          payload = {
              "market": os.environ["MARKET"],
              "schema": "qore.vt08.5m.author.swing-poi-asof-contract.v1",
              "families": [x.value for x in Family],
              "poi_types": [x.value for x in PoiType],
              "statuses": [x.value for x in ProofStatus],
              "fixture_tested": True,
              "independent_market_replay": False,
              "source_poi_priority_fully_adjudicated": False,
              "cognitive_ready": False,
              "orders_authorized": 0, "fills": 0, "pnl_evaluated": False,
              "sealed_7y_accessed": False,
          }
          Path("artifacts/contract.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True), encoding="utf-8"
          )
          print(json.dumps(payload, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vt08-a-swing-causal-contract-${{ matrix.symbol }}-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
