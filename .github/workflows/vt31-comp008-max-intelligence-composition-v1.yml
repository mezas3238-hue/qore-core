name: QORE VT31 Comparator 008 Max Intelligence Composition V1

on:
  push:
    branches:
      - agent/vt31-edge-position-cert-b-001
    paths:
      - scripts/vt31_nas100_comp008_max_intelligence_composition_v1.py
      - .github/workflows/vt31-comp008-max-intelligence-composition-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Static and focused gates
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_comp008_max_intelligence_composition_v1.py
          ruff check scripts/vt31_nas100_comp008_max_intelligence_composition_v1.py

      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"

      - name: Run final composition
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python \
            scripts/vt31_nas100_comp008_max_intelligence_composition_v1.py \
            "input/${EVIDENCE_PATH}" \
            --output "result/comp008-composition-${PARTITION}.json" \
            | tee "result/summary-${PARTITION}.json"

      - name: Governance
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=os.environ["PARTITION"]
          x=json.loads(Path(f"result/comp008-composition-{p}.json").read_text())
          assert x["base_comparator_id"] == "VT31_AB_COMP008_BULLISH_H1_MID_CONFIRMATION_SURVIVOR"
          g=x["governance"]
          assert g["base_is_frozen_comp008"] is True
          assert g["only_prevalidated_components_composed"] is True
          assert g["new_numeric_threshold_added"] is False
          assert g["new_market_rule_added"] is False
          assert g["maximum_cognition_required"] is True
          assert g["outcome_used_for_action"] is False
          assert g["fold_identity_used_for_action"] is False
          assert g["date_identity_used_for_action"] is False
          assert g["position_sizing_used"] is False
          assert g["dynamic_sizing_used"] is False
          assert g["leverage_used"] is False
          assert g["compounding_used"] is False
          assert g["capital_weighting_used"] is False
          assert g["fresh_holdout_opened"] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-comp008-max-intelligence-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-comp008-max-intelligence-*-${{ github.sha }}
          path: input
          merge-multiple: true

      - name: Adjudicate
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          folds=("r5","r6","r8","consumed")
          payloads={
              fold:json.loads(
                  Path(f"input/comp008-composition-{fold}.json").read_text()
              )
              for fold in folds
          }

          def d(v):
              return Decimal(str(v))

          def pf(m):
              value=m["profit_factor"]
              if value is None:
                  return (
                      Decimal("Infinity")
                      if int(m["wins"])>0 and int(m["losses"])==0
                      else Decimal("-Infinity")
                  )
              return d(value)

          per={}
          pf_ok=mean_ok=dd_ok=identity_ok=winner_ok=0
          temporal_all=True
          actuated_folds=0

          for fold,payload in payloads.items():
              base=payload["baseline"]
              cand=payload["candidate"]
              bm=base["stress_0_05r"]
              cm=cand["stress_0_05r"]
              wp=cand["winner_preservation_vs_comp008"]

              pf_non=pf(cm)>=pf(bm)
              mean_non=d(cm["mean_r"])>=d(bm["mean_r"])
              dd_non=d(cm["max_drawdown_r"])<=d(bm["max_drawdown_r"])
              identity=(
                  cand["same_trade_identity_vs_comp008"] is True
                  and d(cand["relative_density_vs_comp008"])==Decimal("1")
              )
              winner=(
                  d(wp["winner_count_preservation"])>=Decimal("0.80")
                  and d(wp["winner_r_preservation"])>=Decimal("0.90")
              )

              pf_ok+=int(pf_non)
              mean_ok+=int(mean_non)
              dd_ok+=int(dd_non)
              identity_ok+=int(identity)
              winner_ok+=int(winner)
              actuated_folds+=int(cand["changed_trade_count"]>0)

              common=set(base["halfyear_stress"]) & set(cand["halfyear_stress"])
              blocks={}
              for key in sorted(common):
                  mean_delta=(
                      d(cand["halfyear_stress"][key]["mean_r"])
                      - d(base["halfyear_stress"][key]["mean_r"])
                  )
                  dd_block=(
                      d(cand["halfyear_stress"][key]["max_drawdown_r"])
                      <= d(base["halfyear_stress"][key]["max_drawdown_r"])
                  )
                  ok=mean_delta>=0 and dd_block
                  temporal_all &= ok
                  blocks[key]={
                      "mean_r_delta":format(mean_delta,"f"),
                      "dd_nondegrade":dd_block,
                      "nondegrade":ok,
                  }

              per[fold]={
                  "baseline":bm,
                  "candidate":cm,
                  "monte_carlo":cand["monte_carlo"],
                  "winner_preservation":wp,
                  "changed_trade_count":cand["changed_trade_count"],
                  "changed_trade_forensics":cand["changed_trade_forensics"],
                  "extra_authorization_count":cand["extra_authorization_count"],
                  "pf_nondegrade":pf_non,
                  "mean_nondegrade":mean_non,
                  "dd_nondegrade":dd_non,
                  "same_trade_identity":identity,
                  "winner_floor_pass":winner,
                  "halfyears":blocks,
              }

          recent=per["consumed"]
          owner={
              "pf_at_least_1_70":pf(recent["candidate"])>=Decimal("1.70"),
              "mean_at_least_0_15r":d(recent["candidate"]["mean_r"])>=Decimal("0.15"),
              "observed_dd_at_most_6r":d(recent["candidate"]["max_drawdown_r"])<=Decimal("6"),
              "mc_positive_at_least_0_90":d(recent["monte_carlo"]["positive_terminal_probability"])>=Decimal("0.90"),
              "mc_p95_dd_at_most_15r":d(recent["monte_carlo"]["p95_max_drawdown_r"])<=Decimal("15"),
          }
          era_pf_all=all(
              pf(per[fold]["candidate"])>=Decimal("1.50")
              for fold in folds
          )
          all_fold_dd_6=all(
              d(per[fold]["candidate"]["max_drawdown_r"])<=Decimal("6")
              for fold in folds
          )
          survivor=(
              pf_ok==4
              and mean_ok==4
              and dd_ok==4
              and identity_ok==4
              and winner_ok==4
              and temporal_all
              and actuated_folds>=2
              and era_pf_all
              and all_fold_dd_6
              and all(owner.values())
          )

          result={
              "schema":"qore.vt31.nas100.comp008_max_intelligence_composition.aggregate.v1",
              "head":"${{ github.sha }}",
              "base_comparator_id":"VT31_AB_COMP008_BULLISH_H1_MID_CONFIRMATION_SURVIVOR",
              "variant":"COMP008_PLUS_BREAKER_MIXED_WEAK_EFFICIENCY_EXIT",
              "folds":per,
              "pf_nondegrade_folds":pf_ok,
              "mean_nondegrade_folds":mean_ok,
              "dd_nondegrade_folds":dd_ok,
              "same_trade_identity_folds":identity_ok,
              "winner_preservation_folds":winner_ok,
              "halfyears_all_nondegrade":temporal_all,
              "actuated_folds":actuated_folds,
              "era_pf_at_least_1_50_all_folds":era_pf_all,
              "all_consumed_folds_observed_dd_at_most_6r":all_fold_dd_6,
              "owner_direction_gates_recent":owner,
              "development_survivor":survivor,
              "final_composition_survivor":survivor,
              "promotion_authorized":False,
              "governance":{
                  "consumed_evidence_only":True,
                  "pure_edge_only":True,
                  "fresh_holdout_opened":False,
                  "candidate_frozen":False,
                  "candidate_certified":False,
                  "further_discretionary_optimization_authorized":False,
              },
          }
          Path("result/aggregate.json").write_text(
              json.dumps(result,sort_keys=True,indent=2)+"\n"
          )
          print(json.dumps(result,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-comp008-max-intelligence-aggregate-${{ github.sha }}
          path: result/
          retention-days: 90
