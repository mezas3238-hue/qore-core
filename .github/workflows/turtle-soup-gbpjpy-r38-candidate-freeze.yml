name: QORE Turtle Soup GBPJPY R38 Candidate Freeze

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/turtle-soup-gbpjpy-r38-candidate-freeze.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_r38_candidate_freeze.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_gbpjpy_r38_candidate_freeze.py'
  push:
    branches:
      - agent/turtle-soup-gbpjpy-specialist-memory-v1-001
    paths:
      - '.github/workflows/turtle-soup-gbpjpy-r38-candidate-freeze.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_r38_candidate_freeze.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_gbpjpy_r38_candidate_freeze.py'

permissions:
  contents: read
  actions: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SOURCE_RUN_ID: '35373705221'
  SOURCE_ARTIFACT: 'qore-turtle-soup-gbpjpy-r38-5y-fragility-93b887a257bef65b151983501d7d0017795f1040'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Focused quality
        run: |
          ruff check --ignore E501,I001 \
            src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_r38_candidate_freeze.py \
            tests/infrastructure/trader_lab/test_turtle_soup_gbpjpy_r38_candidate_freeze.py
          mypy --disable-error-code attr-defined \
            src/qore/infrastructure/trader_lab/turtle_soup_gbpjpy_r38_candidate_freeze.py
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_turtle_soup_gbpjpy_r38_candidate_freeze.py

  freeze:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download exact official R38 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: r38-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Freeze exact R38 candidate
        run: |
          mkdir -p freeze-output
          python -m qore.infrastructure.trader_lab.turtle_soup_gbpjpy_r38_candidate_freeze \
            r38-source freeze-output > freeze-output/stdout.json
          printf '%s\n' "$EVIDENCE_SHA" > freeze-output/freeze-code-sha.txt
      - name: Enforce freeze governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('freeze-output/r38-candidate-freeze-manifest.json').read_text())
          assert p['identity']=='TURTLE_SOUP_GBPJPY_R38_STRUCTURAL_FRAGILITY_CANDIDATE_001'
          assert p['status']=='FROZEN_FOR_FINAL_ROBUSTNESS'
          assert p['consumed_5y_result']['trades']==897
          assert p['consumed_5y_result']['profit_factor_scaled_net_010']=='1.852918712035185462516517131'
          assert p['consumed_5y_result']['max_drawdown_scaled_r']=='5.06150896610739539086014902'
          assert p['consumed_5y_result']['positive_annual_blocks']==5
          assert p['consumed_2y_recheck']['trades']==371
          assert p['consumed_2y_recheck']['profit_factor_scaled_net_010']=='2.217710737671459829306457352'
          assert p['consumed_2y_recheck']['max_drawdown_scaled_r']=='3.25486421385985457309113347'
          assert p['frozen_contract']['signals_suppressed'] is False
          assert p['frozen_contract']['risk_overlay_only'] is True
          assert p['next_stage']['fresh_holdout_status']=='SEALED_UNTOUCHED'
          g=p['governance']
          assert g['candidate_frozen'] is True
          assert g['candidate_certified'] is False
          assert g['fresh_holdout_consumed'] is False
          assert g['live_authorized'] is False
          assert g['real_capital_authorized'] is False
          assert g['merge_authorized'] is False
          PY
      - name: Hash freeze evidence
        run: |
          cd freeze-output
          sha256sum r38-candidate-freeze-manifest.json stdout.json freeze-code-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-gbpjpy-r38-candidate-freeze-${{ env.EVIDENCE_SHA }}
          path: freeze-output
          if-no-files-found: error
          retention-days: 90
