name: QORE Native G1 NZDUSD real BID ASK source SHA asof QA NO NET

on:
  push:
    branches:
      - research/qore-native-g1-nzdusd-real-bidask-integrity-audit-20261012
    paths:
      - '.github/workflows/qore-native-g1-nzdusd-native-source-integrity.yml'
      - 'src/qore/infrastructure/trader_lab/qore_native_g1_nzdusd_real_side_source_audit_v1.py'
      - 'tests/infrastructure/trader_lab/test_qore_native_g1_nzdusd_real_side_source_audit_v1.py'
      - 'docs/research/QORE_NATIVE_NZDUSD_G1_THREE_REAL_BIDASK_WINDOWS_SOURCE_AUDIT_2026-10-12.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  real_source_sha_and_asof_qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only source QA test deps
        run: python -m pip install -e '.[dev]'
      - name: Run strict source-only synthetic negative regression tests
        run: |
          set -euo pipefail
          ruff check --select F,E4,E7,E9 src/qore/infrastructure/trader_lab/qore_native_g1_nzdusd_real_side_source_audit_v1.py tests/infrastructure/trader_lab/test_qore_native_g1_nzdusd_real_side_source_audit_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_qore_native_g1_nzdusd_real_side_source_audit_v1.py
      - name: Download exact immutable successful native BID ASK source artifact
        uses: actions/download-artifact@v4
        with:
          name: qore-native-NZDUSD-G1-source-NOT-NET-ef69b1b6ea2dbbd689bc3e090f9581e15bbb7ad6
          run-id: '38279593236'
          github-token: ${{ github.token }}
          path: original-source
      - name: Verify 13 original hashes and 2675 real ticks, audit causal spot source only
        run: |
          set -euo pipefail
          python -m qore.infrastructure.trader_lab.qore_native_g1_nzdusd_real_side_source_audit_v1 original-source source-qa-output
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("source-qa-output/source-qa-three-windows-nzdusd-NOT-NET.json")
          r=json.loads(p.read_text())
          assert r["source_run"]==38279593236 and r["source_artifact_id"]==11760547215
          assert r["source_extracted_13_files_SHA_verified"]==13
          assert r["source_bid_ticks"]==1371
          assert r["source_ask_ticks"]==1304
          assert r["source_total_native_ticks"]==2675
          assert [x["source_bid_events"] for x in r["window_quality"]]==[251,597,523]
          assert [x["source_ask_events"] for x in r["window_quality"]]==[243,670,391]
          assert r["historical_NET_authorized"] is False
          assert r["profit_factor_sharpe_sortino_drawdown_measured"] is False
          assert r["certified_traders"]==0
          assert all(x["NET_execution_cost_measured"] is False for x in r["window_quality"])
          print("G1_SOURCE_CUSTODY_INDEPENDENT_RECHECK_PASS; NO_NET; 0_CERTIFIED")
          PY
          printf '%s\n' "$GITHUB_SHA" > source-qa-output/exact-auditor-head-sha.txt
          (cd source-qa-output && sha256sum source-qa-three-windows-nzdusd-NOT-NET.json exact-auditor-head-sha.txt > AUDIT_OUTPUT_SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-native-NZDUSD-G1-source-independent-qa-NOT-NET-${{ github.sha }}
          path: source-qa-output/
          retention-days: 90
          if-no-files-found: error
