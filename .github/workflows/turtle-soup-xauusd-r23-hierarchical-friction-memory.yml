name: QORE Turtle Soup XAUUSD R23 Hierarchical Friction Memory

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-xauusd-r3-forensics-001
    paths:
      - '.github/workflows/turtle-soup-xauusd-r23-hierarchical-friction-memory.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r23_hierarchical_friction_memory.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r23_hierarchical_friction_memory.py'

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-XAUUSD-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-XAUUSD-2f510461b3360e91d5ee70a72716a76cd6561f16'
  DOSSIER_RUN_ID: '35291722997'
  DOSSIER_ARTIFACT: 'qore-cibo-xauusd-market-intelligence-v1-8068f78df709b9a1702f14264f76c653140c9c1f'
  R21_RUN_ID: '35294750075'
  R21_ARTIFACT: 'qore-turtle-soup-xauusd-r21-subtype-memory-621653ed66b95b46d46730f123ec7172062c4145'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check --ignore E501,I001 \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r23_hierarchical_friction_memory.py \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r23_hierarchical_friction_memory.py
      - name: Mypy focused gate
        run: |
          mypy --disable-error-code attr-defined \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r23_hierarchical_friction_memory.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r23_hierarchical_friction_memory.py

  memory:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable consumed XAUUSD M5 corpus
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download immutable consumed XAUUSD Target Destination V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Download official CIBO XAUUSD 10Y intelligence dossier
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.DOSSIER_ARTIFACT }}
          path: cibo-dossier
          github-token: ${{ github.token }}
          run-id: ${{ env.DOSSIER_RUN_ID }}
      - name: Download frozen R21 subtype memory
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.R21_ARTIFACT }}
          path: r21-memory
          github-token: ${{ github.token }}
          run-id: ${{ env.R21_RUN_ID }}
      - name: Build hierarchical subtype and 0.10R friction memory
        run: |
          mkdir -p r23-output
          python -m qore.infrastructure.trader_lab.turtle_soup_xauusd_r23_hierarchical_friction_memory \
            source-xauusd target-xauusd cibo-dossier r21-memory r23-output \
            > r23-output/stdout.json
          printf '%s\n' "$GITHUB_SHA" > r23-output/git-sha.txt
      - name: Enforce memory governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('r23-output/r23-hierarchical-friction-report.json').read_text())
          assert p['identity']=='TURTLE_SOUP_XAUUSD_R23_HIERARCHICAL_FRICTION_MEMORY_V1'
          assert p['reproduction']['retained_bars']==707716
          s=p['subtype_hierarchy_contract']
          assert s['most_specific_stable_ancestor_wins'] is True
          assert s['pnl_used'] is False
          f=p['friction_resilience_contract']
          assert f['stress_friction_r']=='0.10'
          assert f['selected_dol_reached_is_structural_label'] is True
          assert f['realized_pnl_used'] is False
          assert f['profit_factor_used'] is False
          assert f['drawdown_used'] is False
          assert f['automatic_threshold_search'] is False
          assert p['reproduction']['resilience_observations'] > 0
          g=p['governance']
          assert g['fresh_holdout_consumed'] is False
          assert g['rule_promoted'] is False
          assert g['live_authorized'] is False
          assert g['real_capital_authorized'] is False
          PY
      - name: Hash immutable R23 result
        run: |
          cd r23-output
          sha256sum \
            r23-hierarchical-friction-report.json \
            r23-subtype-hierarchy.json \
            r23-friction-resilience-memory.json \
            r23-friction-observations.json \
            stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-xauusd-r23-hierarchical-friction-${{ github.sha }}
          path: r23-output
          if-no-files-found: error
          retention-days: 90
