name: QORE ICT Turtle Soup R4 Fresh Holdout 2018-2020

on:
  workflow_dispatch:
  push:
    branches:
      - agent/ict-turtle-soup-r4-frozen-holdout-001
    paths:
      - .github/workflows/ict-turtle-soup-r4-fresh-holdout.yml
      - docs/research/ICT-TURTLE-SOUP-R4-PRE-HOLDOUT-FREEZE.md
      - src/qore/infrastructure/trader_lab/ict_turtle_soup_r4_source_exact.py
      - src/qore/infrastructure/ctrader_demo_account_discovery.py
      - tests/infrastructure/trader_lab/test_ict_turtle_soup_r4_source_exact.py

concurrency:
  group: qore-ict-ts-r4-fresh-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
  QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QORE development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/ict_turtle_soup_r4_source_exact.py \
            src/qore/infrastructure/ctrader_demo_account_discovery.py \
            tests/infrastructure/trader_lab/test_ict_turtle_soup_r4_source_exact.py
      - name: Mypy focused gate
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/ict_turtle_soup_r4_source_exact.py \
            src/qore/infrastructure/ctrader_demo_account_discovery.py
      - name: Focused R4 source-exact tests
        run: pytest -q --no-cov tests/infrastructure/trader_lab/test_ict_turtle_soup_r4_source_exact.py
      - name: Governance assertions before evidence access
        run: |
          python - <<'PY'
          from pathlib import Path
          freeze = Path('docs/research/ICT-TURTLE-SOUP-R4-PRE-HOLDOUT-FREEZE.md').read_text()
          module = Path('src/qore/infrastructure/trader_lab/ict_turtle_soup_r4_source_exact.py').read_text()
          assert 'ICT_TURTLE_SOUP_R4_D1_IDEAL_C2_H1_CISD__H4_IDEAL_C2_M15_CISD__POSITIONAL_DAILY_DOL' in freeze
          assert '2018-07-02T21:00:00Z' in freeze
          assert 'No replacement interval is authorized' in freeze
          assert 'MIN_PROJECTED_R' not in module
          assert 'H4_SOURCE_ANCHORS = (17, 21, 1, 5, 9, 13)' in module
          PY

  preregistration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Emit immutable preregistration before evidence access
        run: |
          mkdir -p artifacts/preregistration
          cp docs/research/ICT-TURTLE-SOUP-R4-PRE-HOLDOUT-FREEZE.md artifacts/preregistration/
          printf '%s\n' "$GITHUB_SHA" > artifacts/preregistration/git-sha.txt
          sha256sum artifacts/preregistration/* > artifacts/preregistration/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-ict-ts-r4-preregistration-${{ github.sha }}
          path: artifacts/preregistration
          if-no-files-found: error
          retention-days: 90

  fresh-replay:
    needs: [quality, preregistration]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        symbol: [AUDJPY, AUDUSD, EURUSD, GBPJPY, GBPUSD, USDCAD, USDJPY]
    env:
      QORE_SYMBOL: ${{ matrix.symbol }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QORE + cTrader runtime
        run: python -m pip install -e '.[ctrader]'
      - name: Verify frozen DEMO read-only credential inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in QORE_CTRADER_CLIENT_ID QORE_CTRADER_CLIENT_SECRET QORE_CTRADER_ACCESS_TOKEN QORE_CTRADER_REFRESH_TOKEN; do
            test -n "${!name:-}" || { echo "missing required DEMO input: $name" >&2; exit 2; }
          done
      - name: Discover DEMO account when not configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            if ! [[ "$account_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "cTrader DEMO account discovery returned an invalid id" >&2
              exit 3
            fi
            echo "::add-mask::$account_id"
            printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          fi
      - name: Collect frozen fresh M5 evidence
        run: |
          mkdir -p "artifacts/${QORE_SYMBOL}/result"
          python -m qore.infrastructure.trader_lab.ict_turtle_soup_r4_source_exact \
            collect "$QORE_SYMBOL" "artifacts/${QORE_SYMBOL}/market-evidence.json"
      - name: Execute frozen R4 and legacy-R3 same-window comparator
        run: |
          python -m qore.infrastructure.trader_lab.ict_turtle_soup_r4_source_exact \
            replay "artifacts/${QORE_SYMBOL}/market-evidence.json" "artifacts/${QORE_SYMBOL}/result" \
            > "artifacts/${QORE_SYMBOL}/result/stdout.json"
          printf '%s\n' "$GITHUB_SHA" > "artifacts/${QORE_SYMBOL}/result/git-sha.txt"
      - name: Enforce result governance
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads(Path(f"artifacts/{os.environ['QORE_SYMBOL']}/result/report.json").read_text())
          assert p['evidence_status'] == 'FRESH_RELATIVE_TO_DOCUMENTED_REPO_EVIDENCE'
          assert p['session_filter_applied'] is False
          assert p['minimum_projected_r_gate'] is None
          assert p['demo_eligible'] is False
          assert p['live_authorized'] is False
          assert p['real_capital_authorized'] is False
          assert p['production_authorized'] is False
          PY
      - name: Hash immutable result
        shell: bash
        run: |
          cd "artifacts/${QORE_SYMBOL}/result"
          sha256sum report.json trades.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-ict-ts-r4-${{ matrix.symbol }}-${{ github.sha }}
          path: artifacts/${{ matrix.symbol }}
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: fresh-replay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QORE
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-ict-ts-r4-*-${{ github.sha }}
          path: artifacts/input
      - name: Build immutable seven-market aggregate
        shell: bash
        run: |
          mapfile -t reports < <(find artifacts/input -type f -name report.json | sort)
          test "${#reports[@]}" -eq 7
          mkdir -p artifacts/aggregate
          python -m qore.infrastructure.trader_lab.ict_turtle_soup_r4_source_exact \
            aggregate artifacts/aggregate "${reports[@]}" > artifacts/aggregate/stdout.json
          printf '%s\n' "$GITHUB_SHA" > artifacts/aggregate/git-sha.txt
          cd artifacts/aggregate
          sha256sum aggregate.json trades.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-ict-ts-r4-aggregate-${{ github.sha }}
          path: artifacts/aggregate
          if-no-files-found: error
          retention-days: 90
