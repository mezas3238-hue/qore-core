name: QORE Shared B Observability Blindspot Unknown World

on:
  push:
    branches:
      - agent/shared-b-global-world-perception-001
    paths:
      - src/qore/infrastructure/core_stack_v2/shared_b_core_broker_observability.py
      - src/qore/infrastructure/core_stack_v2/shared_b_sensor_blindspot_engine.py
      - src/qore/infrastructure/core_stack_v2/shared_b_unknown_world.py
      - tests/infrastructure/test_shared_b_core_broker_observability.py
      - tests/infrastructure/test_shared_b_sensor_blindspot_engine.py
      - tests/infrastructure/test_shared_b_unknown_world.py
      - .github/workflows/qore-shared-b-observability-blindspot-unknown-world.yml
  workflow_dispatch:

concurrency:
  group: qore-shared-b-observability-blindspot-unknown-world-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  AGRI1_RUN_ID: "36623645085"
  AGRI1_ARTIFACT_ID: "11059457712"
  AGRI1_GIT_SHA: "0ce7a2938fa50328d8ab569f47c776852dd5eafe"
  GEN2_RUN_ID: "36623131862"
  GEN2_ARTIFACT_ID: "11059307341"
  GEN2_GIT_SHA: "f5fcd0c9552466132f6f47bb124805e49e774493"

jobs:
  validate-and-bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Shared
        run: pip install -e ".[dev]"

      - name: Validate B-18 B-19 B-20 contracts
        run: |
          set -euo pipefail
          ruff check             src/qore/infrastructure/core_stack_v2/shared_b_core_broker_observability.py             src/qore/infrastructure/core_stack_v2/shared_b_sensor_blindspot_engine.py             src/qore/infrastructure/core_stack_v2/shared_b_unknown_world.py             tests/infrastructure/test_shared_b_core_broker_observability.py             tests/infrastructure/test_shared_b_sensor_blindspot_engine.py             tests/infrastructure/test_shared_b_unknown_world.py
          mypy             src/qore/infrastructure/core_stack_v2/shared_b_core_broker_observability.py             src/qore/infrastructure/core_stack_v2/shared_b_sensor_blindspot_engine.py             src/qore/infrastructure/core_stack_v2/shared_b_unknown_world.py
          pytest -q             tests/infrastructure/test_shared_b_core_broker_observability.py             tests/infrastructure/test_shared_b_sensor_blindspot_engine.py             tests/infrastructure/test_shared_b_unknown_world.py

      - name: Verify real upstream gap evidence
        run: |
          set -euo pipefail
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${AGRI1_RUN_ID}" --jq '.status')" = "completed"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${AGRI1_RUN_ID}" --jq '.conclusion')" = "success"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${AGRI1_RUN_ID}" --jq '.head_sha')" = "$AGRI1_GIT_SHA"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GEN2_RUN_ID}" --jq '.status')" = "completed"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GEN2_RUN_ID}" --jq '.conclusion')" = "success"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GEN2_RUN_ID}" --jq '.head_sha')" = "$GEN2_GIT_SHA"

      - name: Recover agricultural and temporal coverage facts
        run: |
          set -euo pipefail
          mkdir -p input/agri input/gen2 result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${AGRI1_ARTIFACT_ID}/zip" > agri.zip
          unzip -q agri.zip -d input/agri
          agri_sums="$(find input/agri -name SHA256SUMS -print -quit)"
          test -n "$agri_sums"
          (cd "$(dirname "$agri_sums")" && sha256sum -c SHA256SUMS)
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${GEN2_ARTIFACT_ID}/zip" > gen2.zip
          unzip -q gen2.zip -d input/gen2
          (cd input/gen2/result && sha256sum -c SHA256SUMS)

      - name: Materialize real blindspot evidence
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          from qore.infrastructure.core_stack_v2.shared_b_sensor_blindspot_engine import (
              SharedBObservationRequirement,
              SharedBSensorCoverageFact,
              detect_sensor_blindspots,
          )

          agri_path=next(Path("input/agri").rglob("agricultural-provider-capability-audit.json"))
          agri=json.loads(agri_path.read_text())
          gen2=json.loads(Path("input/gen2/result/provider-schedule-catalog.json").read_text())
          assert agri["provider_candidate_count"] == 0
          assert agri["conceptual_market_count"] == 16
          assert gen2["sensor_count"] == 177

          now=datetime.now(UTC)
          requirements=(
              SharedBObservationRequirement(
                  requirement_id="B19_AGRICULTURE_M1",
                  sensor_family="AGRICULTURE",
                  horizon="M1",
                  identity_required=True,
                  market_hours_required=True,
                  data_health_required=True,
                  relation_comparability_required=True,
                  provenance_refs=(f"agri1:run:{os.environ['AGRI1_RUN_ID']}",),
              ),
              SharedBObservationRequirement(
                  requirement_id="B19_GLOBAL_TEMPORAL_COMPARABILITY",
                  sensor_family="GLOBAL_MARKET",
                  horizon="MULTI_HORIZON",
                  identity_required=True,
                  market_hours_required=True,
                  data_health_required=True,
                  relation_comparability_required=True,
                  provenance_refs=(f"gen2:run:{os.environ['GEN2_RUN_ID']}",),
              ),
          )
          coverage=(
              SharedBSensorCoverageFact(
                  sensor_family="GLOBAL_MARKET",
                  horizon="MULTI_HORIZON",
                  observed_at=now,
                  evidence_cutoff_at=now,
                  sensor_ids=tuple(
                      sorted(
                          str(row["provider_symbol"])
                          for row in gen2["symbols"]
                      )
                  ),
                  provider_available=True,
                  identity_resolved=False,
                  market_hours_resolved=False,
                  data_health_observed=True,
                  relation_comparability_known=False,
                  provenance_refs=(f"gen2:artifact:{os.environ['GEN2_ARTIFACT_ID']}",),
              ),
          )
          report=detect_sensor_blindspots(
              requirements=requirements,
              coverage=coverage,
              as_of=now,
              coverage_inventory_complete=True,
          )
          rows=[
              {
                  "requirement_id":item.requirement_id,
                  "sensor_family":item.sensor_family,
                  "horizon":item.horizon,
                  "kind":item.kind.value,
                  "reason_code":item.reason_code,
                  "known_missing":item.known_missing,
                  "second_order_possible":item.second_order_possible,
                  "provenance_refs":item.provenance_refs,
              }
              for item in report.blindspots
          ]
          kinds={row["kind"] for row in rows}
          assert "SENSOR_FAMILY_ABSENT" in kinds
          assert "IDENTITY_UNRESOLVED" in kinds
          assert "MARKET_HOURS_UNRESOLVED" in kinds
          assert "RELATION_COMPARABILITY_UNKNOWN" in kinds

          pack={
              "identity":"SHARED_B_OBSERVABILITY_BLINDSPOT_UNKNOWN_WORLD_001",
              "status":"CONTRACTS_PASS_REAL_BLINDSPOTS_BOUND",
              "git_sha":os.environ["GITHUB_SHA"],
              "workflow_run_id":int(os.environ["GITHUB_RUN_ID"]),
              "real_provider_sensor_count":gen2["sensor_count"],
              "real_agricultural_conceptual_market_count":agri["conceptual_market_count"],
              "real_agricultural_provider_candidate_count":agri["provider_candidate_count"],
              "blindspots":rows,
              "agricultural_world_complete":False,
              "global_temporal_comparability_complete":False,
              "core_broker_real_runtime_replication_complete":False,
              "unknown_world_semantics_contract_pass":True,
              "second_order_blindspot_engine_contract_pass":True,
              "real_second_order_inventory_completeness_proven":False,
              "fresh_holdout_opened":False,
              "broker_mutation":False,
              "productive_authority":False,
              "restart_authority":False,
              "execution_authority":False,
              "risk_authority":False,
              "sizing_authority":False,
              "capital_authority":False,
          }
          Path("result/shared-b-observability-blindspot-unknown-world.json").write_text(
              json.dumps(pack,sort_keys=True,indent=2)+"\n"
          )
          PY

      - name: Seal B-18/B-19/B-20 evidence
        run: |
          printf '%s\n' "$GITHUB_SHA" > result/code-git-sha.txt
          printf '%s\n' "$GITHUB_RUN_ID" > result/run-id.txt
          (
            cd result
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0               | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload observability/blindspot evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: qore-shared-b-observability-blindspot-unknown-world-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Report B-18/B-19/B-20 disposition
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          gh issue comment 638 --repo "$GITHUB_REPOSITORY" --body "Architect B B-18/B-19/B-20: run ${GITHUB_RUN_ID}, SHA ${GITHUB_SHA}, artifact ${ARTIFACT_ID}. Core/Broker observational cognition, sensor Blindspot Engine and Unknown World contracts validated. Real gaps bound: agricultural provider candidates=0; canonical identity/calendar/comparability remain unresolved. Runtime Core/Broker real replication and second-order inventory completeness remain OPEN. No broker mutation or productive authority."
