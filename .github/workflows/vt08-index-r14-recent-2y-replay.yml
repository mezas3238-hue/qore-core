name: VT08 Index R14 Frozen Recent 2Y Replay

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r14-recent-2y-replay.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r14_candidate_freeze.py
      - src/qore/infrastructure/trader_lab/vt08_index_r14_recent_2y_replay.py
      - tests/infrastructure/trader_lab/test_vt08_index_r14_candidate_freeze.py
      - tests/infrastructure/trader_lab/test_vt08_index_r14_recent_2y_replay.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: |
          pytest -q             tests/infrastructure/trader_lab/test_vt08_index_r14_candidate_freeze.py             tests/infrastructure/trader_lab/test_vt08_index_r14_recent_2y_replay.py

  replay:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute frozen R14 recent 2Y replay
        run: |
          python -m qore.infrastructure.trader_lab.vt08_index_r14_recent_2y_replay             --nas100-root artifacts/NAS100             --sp500-root artifacts/SP500             --us30-root artifacts/US30             --out artifacts/report/vt08-index-r14-recent-2y-replay.json

      - name: Verify no-retuning governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(Path("artifacts/report/vt08-index-r14-recent-2y-replay.json").read_text())
          assert report["identity"] == "VT08_INDEX_R14_ROLLING_1574_RECENT_2Y_REPLAY_001"
          assert report["candidate"]["candidate_id"] == "VT08_INDEX_R14_ROLLING_1574_001"
          assert report["candidate"]["frozen_scheme_id"] == "R14-A0.25-D1.75x0.15-H2.50x0.10-L2x0.20"
          assert report["window"]["start_date"] == "2024-09-15"
          assert report["window"]["end_date_exclusive"] == "2026-09-15"
          assert report["window"]["status"] == "CONSUMED_ROBUSTNESS_REPLAY"
          g=report["governance"]
          assert g["no_retuning"] is True
          assert g["frozen_candidate_replayed"] is True
          assert g["candidate_rules_changed"] is False
          assert g["zero_risk_allowed"] is False
          assert g["fresh_holdout_claim"] is False
          assert g["live_authorized"] is False
          assert g["real_capital_authorized"] is False
          assert g["production_authorized"] is False
          PY

      - name: Build summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path("artifacts/report")
          r=json.loads((root/"vt08-index-r14-recent-2y-replay.json").read_text())
          p=r["primary"]
          s=r["secondary"]
          lines=[
              "# VT08 INDEX R14 Frozen Recent 2Y Replay",
              "",
              f"- candidate: {r['candidate']['candidate_id']}",
              f"- fingerprint: {r['candidate']['rule_fingerprint']}",
              f"- window: {r['window']['start_date']} .. {r['window']['end_date_exclusive']}",
              f"- trades: {r['sample']}",
              f"- density reference pass: {r['reference_density_range']['pass']}",
              f"- PF05: {p['profit_factor']}",
              f"- DD05: {p['max_drawdown_r']}R",
              f"- total05: {p['total_r']}R",
              f"- PF10: {s['profit_factor']}",
              f"- DD10: {s['max_drawdown_r']}R",
              f"- total10: {s['total_r']}R",
              f"- rearm trades: {r['rearm_trade_count']}",
              "",
              "## Markets at -0.05R",
          ]
          for symbol,row in r["market_breakdown_primary"].items():
              lines.append(
                  f"- {symbol}: n={row['sample']} PF={row['profit_factor']} "
                  f"DD={row['max_drawdown_r']}R total={row['total_r']}R"
              )
          lines += ["", "## Years at -0.05R"]
          for year,row in r["period_breakdown_primary"]["by_year"].items():
              lines.append(
                  f"- {year}: n={row['sample']} PF={row['profit_factor']} "
                  f"DD={row['max_drawdown_r']}R total={row['total_r']}R"
              )
          lines += ["", "## Halves at -0.05R"]
          for half,row in r["period_breakdown_primary"]["halves"].items():
              lines.append(
                  f"- {half}: n={row['sample']} PF={row['profit_factor']} "
                  f"DD={row['max_drawdown_r']}R total={row['total_r']}R"
              )
          (root/"VT08_INDEX_R14_RECENT_2Y_REPLAY_SUMMARY.md").write_text(
              "\n".join(lines)+"\n",
              encoding="utf-8",
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-index-r14-recent-2y-replay-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
