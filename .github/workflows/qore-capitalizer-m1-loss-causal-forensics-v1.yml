name: QORE Capitalizer M1 Loss Causal Forensics V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-m1-loss-causal-forensics-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_m1_loss_causal_forensics_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_m1_loss_causal_forensics_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-m1-loss-causal-forensics-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  SOURCE_M1_RUN_ID: '35548099334'
  SOURCE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'
  SOURCE_HOLDOUT_RUN_ID: '35548659988'
  SOURCE_HOLDOUT_SHA: 'e7cc3ed4497cb5e51303de374d7e3c6eedaebcdd'
  SOURCE_HIGHER_RUN_ID: '35528346941'
  SOURCE_HIGHER_SHA: 'e0338846170003fd7b346c98883f63257b6cdf45'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check --ignore E501 \
            src/qore/infrastructure/trader_lab/capitalizer_m1_loss_causal_forensics_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_m1_loss_causal_forensics_v1.py
      - name: Mypy
        run: |
          mypy src/qore/infrastructure/trader_lab/capitalizer_m1_loss_causal_forensics_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_m1_loss_causal_forensics_v1.py

  market_forensics:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {symbol: USDJPY, session: ASIA}
          - {symbol: AUDJPY, session: ASIA}
          - {symbol: AUDUSD, session: ASIA}
          - {symbol: GBPJPY, session: ASIA}
          - {symbol: EURUSD, session: LONDON}
          - {symbol: GBPUSD, session: LONDON}
          - {symbol: XAUUSD, session: NEW_YORK}
          - {symbol: USDCAD, session: NEW_YORK}
          - {symbol: NAS100, session: NEW_YORK}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download immutable 10Y native-M1 clone
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.SOURCE_M1_SHA }}
          path: m1-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_M1_RUN_ID }}
      - name: Download consumed 5Y holdout replay ledger
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-5y-holdout-replay-${{ matrix.symbol }}-${{ env.SOURCE_HOLDOUT_SHA }}
          path: consumed-holdout
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_HOLDOUT_RUN_ID }}
      - name: Download frozen higher-level candidate ledger
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-three-session-replay-cell-${{ matrix.symbol }}-${{ env.SOURCE_HIGHER_SHA }}
          path: higher-source
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_HIGHER_RUN_ID }}
      - name: Run native-M1 consumed-evidence causal forensics
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_m1_loss_causal_forensics_v1 \
            market consumed-holdout m1-source higher-source forensic-output
      - name: Enforce forensic governance and completeness
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
          EXPECTED_SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ['EXPECTED_SYMBOL']
          path = Path('forensic-output') / f'capitalizer-{symbol.lower()}-m1-loss-causal-forensics-v1.json'
          report = json.loads(path.read_text())
          assert report['identity'] == 'QORE_CAPITALIZER_M1_LOSS_CAUSAL_FORENSICS_V1'
          assert report['symbol'] == symbol
          assert report['session'] == os.environ['EXPECTED_SESSION']
          assert report['source_trade_count'] > 0
          assert report['loss_count'] > 0
          assert report['entry_forensics_complete'] is True
          assert report['ob_reconstruction_mismatch_count'] == 0
          assert report['evidence_status'] == 'CONSUMED_FORENSIC_EVIDENCE'
          assert report['holdout_fresh_after_forensics'] is False
          assert report['methodology_changed'] is False
          assert report['entry_contract_changed'] is False
          assert report['stop_contract_changed'] is False
          assert report['target_contract_changed'] is False
          assert report['outcome_used_for_trade_selection'] is False
          assert report['rule_promotion_allowed'] is False
          assert report['economic_candidate'] is False
          assert report['trader_certified'] is False
          assert report['live_authorized'] is False
          assert report['real_capital_authorized'] is False
          labels = dict(report['loss_classification_counts'])
          assert 'UNKNOWN' not in labels
          assert sum(labels.values()) == report['loss_count']
          PY
      - name: Upload immutable market forensic dossier
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-m1-loss-causal-forensics-${{ matrix.symbol }}-${{ github.sha }}
          path: forensic-output
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: market_forensics
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE runtime
        run: python -m pip install -e .
      - name: Download all nine forensic dossiers
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-m1-loss-causal-forensics-*-${{ github.sha }}
          path: forensic-input
          merge-multiple: false
      - name: Build nine-market failure matrix
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_m1_loss_causal_forensics_v1 \
            matrix forensic-input matrix-output
      - name: Enforce matrix governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('matrix-output/capitalizer-nine-market-failure-matrix-v1.json').read_text())
          assert report['identity'] == 'QORE_CAPITALIZER_NINE_MARKET_FAILURE_MATRIX_V1'
          assert report['market_count'] == 9
          assert report['total_trades'] == 10991
          assert report['total_losses'] > 0
          assert report['evidence_status'] == 'CONSUMED_FORENSIC_EVIDENCE'
          assert report['holdout_fresh_after_forensics'] is False
          assert report['methodology_changed'] is False
          assert report['universal_rule_inferred'] is False
          assert report['rule_promotion_allowed'] is False
          assert report['economic_candidate'] is False
          assert report['trader_certified'] is False
          PY
      - name: Upload nine-market failure matrix
        uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-nine-market-failure-matrix-v1-${{ github.sha }}
          path: matrix-output
          if-no-files-found: error
          retention-days: 90
