name: QORE Scalper A2 Seventh M15 M1 Causal Stage Chain

on:
  push:
    branches:
      - agent/scalper-architect-b-methodology-20261010
    paths:
      - '.github/workflows/qore-scalper-a2-seventh-m1-stage-chain.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_m1_stage_chain_forensic_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_scalper_m1_stage_chain_forensic_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: scalper-a2-seventh-stage-chain-${{ github.ref }}
  cancel-in-progress: true

env:
  V49_ORIGINAL_RUN: '38053946695'
  V49_ORIGINAL_SHA: 'e356e7a52541e99533b25ecfef0ab9c4e9ce03c0'
  NATIVE_M1_RUN: '35548099334'
  NATIVE_M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Test first-route identity, stage dates and CISD zero execution lag
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_scalper_m1_stage_chain_forensic_v1.py tests/infrastructure/trader_lab/test_capitalizer_scalper_m1_stage_chain_forensic_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_scalper_m1_stage_chain_forensic_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_scalper_m1_stage_chain_forensic_v1.py

  market:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol: [USDJPY, AUDJPY, AUDUSD, GBPJPY, EURUSD, GBPUSD, XAUUSD, USDCAD, NAS100]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Get frozen exact original V49 ledger
        uses: actions/download-artifact@v4
        with:
          name: scalper-a2-v49-control-${{ matrix.symbol }}-${{ env.V49_ORIGINAL_SHA }}
          path: original-v49
          github-token: ${{ github.token }}
          run-id: ${{ env.V49_ORIGINAL_RUN }}
      - name: Get identical provider-native M1 for the selected symbol
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.NATIVE_M1_SHA }}
          path: original-m1
          github-token: ${{ github.token }}
          run-id: ${{ env.NATIVE_M1_RUN }}
      - name: Check native source and no synthetic or interpolated M1
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path("original-m1/m1-clone-manifest.json").read_text())
          assert d["canonical_symbol"]==os.environ["SYMBOL"]
          assert d["provider_native_m1"] is True and d["synthetic_m1"] is False
          assert d["interpolated_m1"] is False and d["contradictory_m1"] == 0
          assert d["read_only"] is True
          PY
      - name: Exact causal source-route reconstruction and 15/30/60 poststage research
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_m1_stage_chain_forensic_v1 market original-v49 original-m1 market-output
      - name: Fail closed on missing source IDs and on any modified trade
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path("market-output/scalper-m1-stage-market.json").read_text())
          assert r["symbol"]==os.environ["SYMBOL"]
          assert r["sources"]==r["forensic_rows"]
          assert r["post_cisd_execution_delay"] is False
          assert r["sweep_has_explicit_m1_protected_swing"] is False
          assert r["original_trade_changed"] is False
          assert r["outcome_used_for_stage_selection"] is False
          assert r["trader_certified"] is False and r["live_authorized"] is False
          print("M15 M1 STAGES MARKET",r)
          PY
      - name: Save audit per source with observed and missing stage details
        uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-seventh-stage-${{ matrix.symbol }}-${{ github.sha }}
          path: market-output/
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: market
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Fetch all nine original-source matched route-stage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: scalper-a2-seventh-stage-*-${{ github.sha }}
          path: stage-ledgers
          merge-multiple: false
      - name: Compare SAME 2020 MAX3 stages by route and session
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_m1_stage_chain_forensic_v1 matrix stage-ledgers matrix-output
      - name: Verify no synthetic trade or gate is certified
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("matrix-output/scalper-m1-stage-nine-market.json").read_text())
          assert x["market_count"]==9 and x["sources"]==2876
          assert x["max3_selected"]==2020
          assert x["original_positive_winners"]==1167
          assert x["no_source_outcome_used_to_choose_stage"] is True
          assert x["stage_outcomes_are_posthoc_labels"] is True
          assert x["sweep_pivot_not_claimed_to_be_protected"] is True
          assert x["no_original_v49_rule_changed"] is True
          assert not x["trader_certified"] and not x["live_authorized"]
          print("SEVENTH M1 STAGE ALL",x["all"])
          for dim in ("family","market","session"):
              for name,value in x[dim].items():
                  print("SEVENTH M1 STAGE GROUP",dim,name,value)
          PY
      - name: Publish read-only nine-market stage/paired difference report
        uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-seventh-m1-stage-nine-market-${{ github.sha }}
          path: matrix-output/
          retention-days: 90
          if-no-files-found: error
