name: VT08 B R13 M30 C2 Sweep vs Three-Bar Pivot Causal Audit
on:
  workflow_dispatch:
  push:
    branches:
      - agent/vt08-5m-cognition-replay-20261010
    paths:
      - src/qore/infrastructure/trader_lab/vt08_b_r13_m30_swept_pivot_temporal_v1.py
      - tests/infrastructure/trader_lab/test_vt08_b_r13_m30_swept_pivot_temporal_v1.py
      - .github/workflows/vt08-b-r13-m30-threebar-pivot-causal.yml
permissions:
  contents: read
  actions: read
jobs:
  original-native-m30-c2-pivots:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        market: [EURJPY, USDCHF, NZDUSD, CADJPY, USDCAD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Ruff and seven adversarial native-candle tests
        run: |
          ruff check src/qore/infrastructure/trader_lab/vt08_b_r13_m30_swept_pivot_temporal_v1.py tests/infrastructure/trader_lab/test_vt08_b_r13_m30_swept_pivot_temporal_v1.py
          pytest -q tests/infrastructure/trader_lab/test_vt08_b_r13_m30_swept_pivot_temporal_v1.py
      - uses: actions/download-artifact@v4
        with:
          name: vt08-a-frozen-m30m3-firstfail-${{ matrix.market }}-394116f13449fc310d7fbc5f0b5f60aa1bb247d4
          path: a-r3/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 38715560333
      - uses: actions/download-artifact@v4
        with:
          name: qore-vt08-m3-fractal-${{ matrix.market }}-bc1379d7661aac202495ec67afdd3098473ba723
          path: native-m3/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 35941643396
      - uses: actions/download-artifact@v4
        with:
          name: qore-vt08-cognitive-5m-fresh-${{ matrix.market }}-b2d33e1b4829d8b4afc76983decca8a99131403c
          path: native-m15/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 35934924907
      - name: Independently reconstruct C0 C1 C2 and frozen C2 source close
        env:
          MARKET: ${{ matrix.market }}
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json, os
          from pathlib import Path
          from qore.infrastructure.trader_lab.vt08_b_r13_m30_swept_pivot_temporal_v1 import (
              audit_m30_pivot_temporal_non_equivalence, result_sha256,
          )
          m=os.environ["MARKET"]
          a=list(Path("a-r3",m).rglob(m+"-frozen-source-firstfail.json"))
          n3=list(Path("native-m3",m).rglob("m3-evidence.json"))
          n15=list(Path("native-m15",m).rglob("market-evidence-1095d.json"))
          if len(a)!=1 or len(n3)!=1 or len(n15)!=1:
              raise SystemExit("B R13 missing fixed original source evidence")
          r3=json.loads(a[0].read_text(encoding="utf-8"))
          out=audit_m30_pivot_temporal_non_equivalence(
              r3,market=m,original_m3=n3[0],original_m15=n15[0],
          )
          expected={"EURJPY":538,"USDCHF":518,"NZDUSD":550,"CADJPY":516,"USDCAD":535}
          if out["frozen_events"]!=expected[m]:
              raise SystemExit("B R13 original denominator mismatch")
          for k in (
              "bullish_c2_source_closure_physical",
              "c1_center_bullish_three_m30_pivot_fails_right_side",
              "c2_center_bullish_three_m30_pivot_waits_for_c3_close",
          ):
              if out["counts"].get(k)!=expected[m]:
                  raise SystemExit("B R13 temporal pivot invariant broken")
          if out["ttrades_protected_swing_validated"] or out["fills"]:
              raise SystemExit("B R13 cannot manufacture author/trade status")
          dest=Path("evidence",m+"-B-R13-M30-C2-pivot-causal.json")
          dest.write_text(
              json.dumps(out,sort_keys=True,separators=(",",":"),allow_nan=False),
              encoding="utf-8",
          )
          print(json.dumps({
              "market":m,"cases":out["frozen_events"],
              "counts":out["counts"],"sha256":result_sha256(out),
              "author_status":"D_UNADJUDICATED","fills":out["fills"],
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vt08-b-r13-m30-pivot-${{ matrix.market }}-${{ github.sha }}
          path: evidence/*.json
          if-no-files-found: error
          retention-days: 30
