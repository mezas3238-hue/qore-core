name: QORE VT31 Architect B Edge Only Early No Progress V1

on:
  push:
    branches:
      - agent/vt31-edge-position-cert-b-001
    paths:
      - scripts/vt31_nas100_edge_only_early_no_progress_v1.py
      - .github/workflows/vt31-architect-b-edge-only-early-no-progress-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  scratch:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"

      - name: Static gate
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_edge_only_early_no_progress_v1.py
          ruff check             scripts/vt31_nas100_edge_only_early_no_progress_v1.py             scripts/vt31_nas100_cognitive_structural_protection_frontier_v1.py

      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"

      - name: Run early no-progress frontier
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python             scripts/vt31_nas100_edge_only_early_no_progress_v1.py             "input/${EVIDENCE_PATH}"             --output "result/early-no-progress-${PARTITION}.json"             | tee "result/summary-${PARTITION}.json"

      - name: Governance gate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=os.environ["PARTITION"]
          payload=json.loads(Path(f"result/early-no-progress-{p}.json").read_text())
          g=payload["governance"]
          assert g["trade_admission_changed"] is False
          assert g["entry_changed"] is False
          assert g["initial_stop_changed"] is False
          assert g["target_changed"] is False
          assert g["checkpoint_closed_m1_only"] is True
          assert g["exit_next_m1_open"] is True
          assert g["normalized_equal_r_economics"] is True
          assert g["capital_weighted_net_r_used"] is False
          assert g["position_sizing_used"] is False
          assert g["partial_exit_required"] is False
          assert g["absolute_volume_used"] is False
          assert g["opens_new_holdout"] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: vt31-architect-b-early-no-progress-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 30
