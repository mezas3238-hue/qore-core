name: QORE Shared WP05 Post-V14 Cross-Asset Sensor Availability

on:
  push:
    branches:
      - agent/qore-core-stack-v2-shared-001
    paths:
      - src/qore/infrastructure/core_stack_v2/active_perception_post_v14_cross_asset_availability.py
      - scripts/shared_wp05_post_v14_cross_asset_sensor_availability.py
      - tests/infrastructure/test_shared_wp05_post_v14_cross_asset_availability.py
      - docs/shared/QORE_SHARED_WP05_POST_V14_CROSS_ASSET_SENSOR_AVAILABILITY_PREREGISTRATION.md
      - .github/workflows/qore-shared-wp05-post-v14-cross-asset-sensor-availability.yml
  workflow_dispatch:

concurrency:
  group: qore-shared-wp05-post-v14-cross-asset-availability-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  SOURCE_MANIFEST_SHA256: "2f18b9f11d5893effa46ac85c712edd6646d1d90a9de521b235143e42155d191"
  SOURCE_MANIFEST_ARTIFACT_ID: "10982052296"
  SOURCE_MANIFEST_PRODUCER_SHA: "99e60783fb270c40ae23805fbb3d16ae76d9c4f2"
  PROVIDER_CATALOG_ARTIFACT_ID: "11024938966"
  PROVIDER_CATALOG_SHA256: "4c10aede99704b937caa772e1ae07257c8e12c3d0644c06ca751b6885b9a363f"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Shared
        run: pip install -e ".[dev]"
      - name: Validate post-V14 source-only availability contract
        run: |
          set -euo pipefail
          ruff check \
            src/qore/infrastructure/core_stack_v2/active_perception_post_v14_cross_asset_availability.py \
            scripts/shared_wp05_post_v14_cross_asset_sensor_availability.py \
            tests/infrastructure/test_shared_wp05_post_v14_cross_asset_availability.py
          mypy \
            src/qore/infrastructure/core_stack_v2/active_perception_post_v14_cross_asset_availability.py \
            scripts/shared_wp05_post_v14_cross_asset_sensor_availability.py
          pytest -q tests/infrastructure/test_shared_wp05_post_v14_cross_asset_availability.py

  audit:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
      QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
      QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
      QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
      QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Shared + cTrader runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ctrader]"

      - name: Verify DEMO secrets without printing values
        shell: bash
        run: |
          set -euo pipefail
          for name in QORE_CTRADER_CLIENT_ID QORE_CTRADER_CLIENT_SECRET QORE_CTRADER_ACCESS_TOKEN QORE_CTRADER_REFRESH_TOKEN
          do
            [ -n "${!name:-}" ] || exit 2
          done

      - name: Resolve single authorized DEMO account
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            [[ "$account_id" =~ ^[1-9][0-9]*$ ]]
            echo "::add-mask::$account_id"
            printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          else
            echo "::add-mask::$QORE_CTRADER_DEMO_ACCOUNT_ID"
          fi

      - name: Recover frozen R8 source manifest
        run: |
          set -euo pipefail
          mkdir -p input/manifest input/catalog result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_MANIFEST_ARTIFACT_ID}/zip" > manifest.zip
          unzip -q manifest.zip -d input/manifest
          (cd input/manifest && sha256sum -c SHA256SUMS)
          test "$(cat input/manifest/git-sha.txt)" = "$SOURCE_MANIFEST_PRODUCER_SHA"
          cp input/manifest/wp05-v12-r8-tick-acquisition-manifest.json result/source-manifest.json

      - name: Recover frozen post-V14 provider catalogue
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PROVIDER_CATALOG_ARTIFACT_ID}/zip" > catalog.zip
          unzip -q catalog.zip -d input/catalog
          cp input/catalog/post-v14-provider-catalog.json result/provider-catalog.json
          test "$(python -c 'import json; print(json.load(open("result/provider-catalog.json"))["provider_catalog_sha256"])')" = "$PROVIDER_CATALOG_SHA256"

      - name: Run source-only historical availability audit
        run: |
          set -euo pipefail
          python scripts/shared_wp05_post_v14_cross_asset_sensor_availability.py \
            --manifest result/source-manifest.json \
            --catalog result/provider-catalog.json \
            --expected-manifest-sha256 "$SOURCE_MANIFEST_SHA256" \
            --expected-catalog-sha256 "$PROVIDER_CATALOG_SHA256" \
            --output result/post-v14-cross-asset-availability.json \
            | tee result/post-v14-cross-asset-availability-summary.json

      - name: Validate governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/post-v14-cross-asset-availability.json").read_text())
          assert p["identity"] == "QORE_SHARED_WP05_POST_V14_CROSS_ASSET_SENSOR_AVAILABILITY_001"
          assert p["partition"] == "r8_source_only"
          assert p["selected_manifest_indices"] == [0,736,1473,2210,2947]
          assert [x["provider_symbol"] for x in p["candidate_reports"]] == ["US2000","XAUUSD","XTIUSD"]
          assert p["target_or_outcome_read"] is False
          assert p["r6_r5_read"] is False
          assert p["fresh_holdout_opened"] is False
          assert p["scientific_v15_opened"] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-shared-wp05-post-v14-cross-asset-availability-${{ github.sha }}
          path: |
            result/post-v14-cross-asset-availability.json
            result/post-v14-cross-asset-availability-summary.json
          if-no-files-found: warn
          retention-days: 90

      - name: Report to WP-05
        if: always()
        run: |
          if [ ! -f result/post-v14-cross-asset-availability.json ]; then
            gh issue comment 643 --body "WP-05 post-V14 cross-asset source audit run `${GITHUB_RUN_ID}` failed technically. No V15, R6/R5 or fresh holdout was opened."
            exit 0
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path("result/post-v14-cross-asset-availability.json").read_text())
          lines=[
            "## WP-05 post-V14 cross-asset source-only availability",
            "",
            f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
            f"- run: `{os.environ['GITHUB_RUN_ID']}`",
          ]
          for item in p["candidate_reports"]:
              lines.append(
                  f"- {item['provider_symbol']} / {item['semantic_role']}: "
                  f"**{item['coverage_status']}**; "
                  f"BID={item.get('bid_tick_count',0)}; ASK={item.get('ask_tick_count',0)}"
              )
          lines += [
            "- target/outcome read: **False**",
            "- R6/R5 read: **False**",
            "- fresh holdout opened: **False**",
            "- scientific V15 opened: **False**",
          ]
          Path("result/issue-comment.md").write_text("\n".join(lines)+"\n")
          PY
          gh issue comment 643 --body-file result/issue-comment.md
