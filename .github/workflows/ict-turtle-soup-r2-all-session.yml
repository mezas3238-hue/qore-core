name: QORE ICT Turtle Soup R2 All Session

on:
  workflow_dispatch:
  push:
    branches:
      - agent/ict-turtle-soup-r2-all-session-multiasset-001
    paths:
      - docs/research/ICT-TURTLE-SOUP-R2-ALL-SESSION-MULTIASSET-FREEZE.md
      - src/qore/infrastructure/trader_lab/ict_turtle_soup_r2_all_session.py
      - tests/infrastructure/trader_lab/test_ict_turtle_soup_r2_all_session.py
      - .github/workflows/ict-turtle-soup-r2-all-session.yml

concurrency:
  group: qore-ict-turtle-soup-r2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/ict_turtle_soup_r2_all_session.py \
            tests/infrastructure/trader_lab/test_ict_turtle_soup_r2_all_session.py
      - name: Mypy focused gate
        run: mypy src/qore/infrastructure/trader_lab/ict_turtle_soup_r2_all_session.py
      - name: Focused causal tests
        run: pytest -q tests/infrastructure/trader_lab/test_ict_turtle_soup_r2_all_session.py
      - name: Trader Lab regression
        run: pytest -q tests/infrastructure/trader_lab
      - name: Governance invariant
        run: |
          python - <<'PY'
          from pathlib import Path
          freeze = Path('docs/research/ICT-TURTLE-SOUP-R2-ALL-SESSION-MULTIASSET-FREEZE.md').read_text()
          module = Path('src/qore/infrastructure/trader_lab/ict_turtle_soup_r2_all_session.py').read_text()
          assert 'ICT_TURTLE_SOUP_R2_ALL_SESSION_MULTI_ASSET' in freeze
          assert 'Time-of-day alone is neither an inclusion nor exclusion condition' in freeze
          assert 'IDENTITY = "ICT_TURTLE_SOUP_R2_ALL_SESSION_MULTI_ASSET"' in module
          assert 'DEMO_ELIGIBLE=false' in freeze
          assert 'LIVE_AUTHORIZED=false' in freeze
          PY
