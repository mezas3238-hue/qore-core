name: QORE NQ AM TLR V3 TradeStation Exact-NQ Foundation

on:
  workflow_dispatch:
  push:
    branches:
      - agent/nq-am-temporal-liquidity-reversal-v1-001
    paths:
      - '.github/workflows/qore-nq-am-tlr-v3-tradestation-foundation.yml'
      - '.github/workflows/qore-nq-am-tlr-v3-tradestation-exact-nq-acquisition.yml'
      - 'src/qore/infrastructure/trader_lab/nq_am_tlr_v3_tradestation_nq_evidence.py'
      - 'tests/infrastructure/trader_lab/test_nq_am_tlr_v3_tradestation_nq_evidence.py'
      - 'docs/research/QORE-NQ-AM-TLR-V3-EXACT-NQ-EVIDENCE-CONTRACT.md'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install QORE development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff exact-NQ foundation
        run: |
          ruff check             src/qore/infrastructure/trader_lab/nq_am_tlr_v3_tradestation_nq_evidence.py             tests/infrastructure/trader_lab/test_nq_am_tlr_v3_tradestation_nq_evidence.py
      - name: Mypy exact-NQ foundation
        run: |
          mypy             src/qore/infrastructure/trader_lab/nq_am_tlr_v3_tradestation_nq_evidence.py
      - name: Focused exact-NQ foundation tests
        run: |
          pytest -q --no-cov             tests/infrastructure/trader_lab/test_nq_am_tlr_v3_tradestation_nq_evidence.py
      - name: Governance assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          contract = Path(
              'docs/research/QORE-NQ-AM-TLR-V3-EXACT-NQ-EVIDENCE-CONTRACT.md'
          ).read_text()
          module = Path(
              'src/qore/infrastructure/trader_lab/'
              'nq_am_tlr_v3_tradestation_nq_evidence.py'
          ).read_text()
          acquisition = Path(
              '.github/workflows/'
              'qore-nq-am-tlr-v3-tradestation-exact-nq-acquisition.yml'
          ).read_text()

          assert 'no order endpoint' in contract.lower()
          assert 'PROVIDER_AUTH_NOT_CONFIGURED' in contract
          assert 'QORE_TRADESTATION_REFRESH_TOKEN' in contract
          assert 'QORE_TRADESTATION_CLIENT_ID' in module
          assert 'marketdata/barcharts' in module
          assert 'brokerage_endpoint_used' in module
          assert 'order_endpoint_used' in module
          assert 'workflow_dispatch:' in acquisition
          assert 'Acquire exact NQ futures M1 evidence' in acquisition
          assert 'QORE_TRADESTATION_REFRESH_TOKEN' in acquisition
          for flag in (
              'DEMO_ELIGIBLE=false',
              'LIVE_AUTHORIZED=false',
              'REAL_CAPITAL_AUTHORIZED=false',
              'PRODUCTION_AUTHORIZED=false',
          ):
              assert flag in contract
          PY
