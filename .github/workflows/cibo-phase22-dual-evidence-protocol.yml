name: QORE CIBO Phase22 Dual-Evidence Protocol

on:
  push:
    branches:
      - agent/cibo-certification-architect-b-integration-001
    paths:
      - '.github/workflows/cibo-phase22-dual-evidence-protocol.yml'
      - 'src/qore/infrastructure/cibo_phase22_dual_evidence_plan.py'
      - 'src/qore/infrastructure/cibo_phase22_demo_execution_population_receipt.py'
      - 'src/qore/infrastructure/cibo_phase22_demo_empirical_provider_receipt.py'
      - 'src/qore/infrastructure/cibo_phase22_provider_execution_calibration_receipt.py'
      - 'tests/infrastructure/test_cibo_phase22_provider_execution_calibration_receipt.py'
      - 'tests/infrastructure/test_cibo_phase22_dual_evidence_plan.py'
  pull_request:
    paths:
      - '.github/workflows/cibo-phase22-dual-evidence-protocol.yml'
      - 'src/qore/infrastructure/cibo_phase22_dual_evidence_plan.py'
      - 'src/qore/infrastructure/cibo_phase22_demo_execution_population_receipt.py'
      - 'src/qore/infrastructure/cibo_phase22_demo_empirical_provider_receipt.py'
      - 'src/qore/infrastructure/cibo_phase22_provider_execution_calibration_receipt.py'
      - 'tests/infrastructure/test_cibo_phase22_provider_execution_calibration_receipt.py'
      - 'tests/infrastructure/test_cibo_phase22_dual_evidence_plan.py'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Quality
        run: |
          ruff check \
            src/qore/infrastructure/cibo_phase22_dual_evidence_plan.py \
            src/qore/infrastructure/cibo_phase22_demo_execution_population_receipt.py \
            src/qore/infrastructure/cibo_phase22_demo_empirical_provider_receipt.py \
            src/qore/infrastructure/cibo_phase22_provider_execution_calibration_receipt.py \
            tests/infrastructure/test_cibo_phase22_provider_execution_calibration_receipt.py \
            tests/infrastructure/test_cibo_phase22_dual_evidence_plan.py
          mypy \
            src/qore/infrastructure/cibo_phase22_dual_evidence_plan.py \
            src/qore/infrastructure/cibo_phase22_demo_execution_population_receipt.py \
            src/qore/infrastructure/cibo_phase22_demo_empirical_provider_receipt.py \
            src/qore/infrastructure/cibo_phase22_provider_execution_calibration_receipt.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_phase22_provider_execution_calibration_receipt.py \
            tests/infrastructure/test_cibo_phase22_dual_evidence_plan.py
      - name: Emit pre-outcome protocol
        run: |
          mkdir -p phase22-dual-evidence
          python - <<'PY'
          import json
          from pathlib import Path
          from qore.infrastructure.cibo_phase22_dual_evidence_plan import (
              phase22_dual_evidence_plan_payload,
          )
          p = phase22_dual_evidence_plan_payload()
          assert p["holdout_consumed"] is False
          assert p["activation_disposition"] == "READY_TO_ACTIVATE"
          Path("phase22-dual-evidence/plan.json").write_text(
              json.dumps(p, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-phase22-dual-evidence-${{ github.sha }}
          path: phase22-dual-evidence
          if-no-files-found: error
          retention-days: 90
