name: QORE Capitalizer Pre-entry Provider Microstructure V41

on:
  push:
    branches:
      - agent/capitalizer-preentry-provider-microstructure-v41-001
    paths:
      - '.github/workflows/qore-capitalizer-preentry-provider-microstructure-v41.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_preentry_provider_quote_microstructure_v41.py'
      - 'src/qore/infrastructure/trader_lab/capitalizer_preentry_provider_quote_microstructure_separability_v41.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_preentry_provider_quote_microstructure_v41.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-preentry-provider-microstructure-v41-${{ github.ref }}
  cancel-in-progress: true

env:
  QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID || secrets.QORE_CTRADER_DEMO_CLIENT_ID }}
  QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET || secrets.QORE_CTRADER_DEMO_CLIENT_SECRET }}
  QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN || secrets.QORE_CTRADER_DEMO_ACCESS_TOKEN }}
  QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN || secrets.QORE_CTRADER_DEMO_REFRESH_TOKEN }}
  QORE_CTRADER_DEMO_ACCOUNT_ID: ${{ secrets.QORE_CTRADER_DEMO_ACCOUNT_ID || secrets.QORE_CTRADER_ACCOUNT_ID }}
  V21_RUN_ID: '36264229554'
  V21_ARTIFACT_SHA: '05452328bbf5cbbc4b26210791d13114105e3f9d'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_preentry_provider_quote_microstructure_v41.py \
            src/qore/infrastructure/trader_lab/capitalizer_preentry_provider_quote_microstructure_separability_v41.py \
            tests/infrastructure/trader_lab/test_capitalizer_preentry_provider_quote_microstructure_v41.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_preentry_provider_quote_microstructure_v41.py \
            src/qore/infrastructure/trader_lab/capitalizer_preentry_provider_quote_microstructure_separability_v41.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_preentry_provider_quote_microstructure_v41.py

  market_microstructure:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol: [USDJPY, AUDJPY, AUDUSD, GBPJPY, EURUSD, GBPUSD, XAUUSD, USDCAD, NAS100]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[ctrader]'
      - name: Verify read-only cTrader inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in QORE_CTRADER_CLIENT_ID QORE_CTRADER_CLIENT_SECRET QORE_CTRADER_ACCESS_TOKEN QORE_CTRADER_REFRESH_TOKEN; do
            test -n "${!name:-}" || { echo "missing required read-only DEMO input: $name" >&2; exit 2; }
          done
      - name: Discover DEMO account when not configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QORE_CTRADER_DEMO_ACCOUNT_ID:-}" ]; then
            account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
            if ! [[ "$account_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "cTrader DEMO account discovery returned invalid id" >&2
              exit 3
            fi
            echo "::add-mask::$account_id"
            printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          fi
      - name: Download authoritative reconstructed selected populations
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v21-reconstructed-*-${{ env.V21_ARTIFACT_SHA }}
          path: reconstructed
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ env.V21_RUN_ID }}
      - name: Build frozen provider-native 18D microstructure state
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_preentry_provider_quote_microstructure_v41 \
            "${{ matrix.symbol }}" \
            reconstructed/development-input \
            reconstructed/validation-input \
            reconstructed/reserved-input \
            microstructure-output
      - name: Enforce exact causal coverage contract
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["SYMBOL"].lower()
          report = json.loads(
              Path(
                  f"microstructure-output/capitalizer-v41-{symbol}-microstructure-report.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_PREENTRY_PROVIDER_QUOTE_MICROSTRUCTURE_V41"
          )
          assert report["canonical_symbol"] == os.environ["SYMBOL"]
          assert report["feature_dimension"] == 18
          assert len(report["feature_names"]) == 18
          assert report["coverage"] == "1"
          assert report["provider_native"] is True
          assert report["response_must_be_complete"] is True
          assert report["min_ticks_per_side"] == 2
          assert report["max_quote_age_seconds"] == 30
          assert report["future_quote_used"] is False
          assert report["interpolation_used"] is False
          assert report["synthetic_quote_used"] is False
          assert report["outcome_used"] is False
          assert report["exit_used"] is False
          assert report["mae_mfe_used"] is False
          assert report["v11_features_used"] is False
          assert report["v38_geometry_features_used"] is False
          assert report["v40_m1_path_features_used"] is False
          assert report["fresh_holdout_opened"] is False
          assert report["runtime_policy_candidate"] is False
          assert report["trader_certified"] is False
          assert report["state_count"] == sum(report["period_counts"].values())
          print(json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-v41-microstructure-${{ matrix.symbol }}-${{ github.sha }}
          path: microstructure-output
          if-no-files-found: error
          retention-days: 90

  separability:
    needs: market_microstructure
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download nine V41 microstructure artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v41-microstructure-*-${{ github.sha }}
          path: microstructure-input
          merge-multiple: true
      - name: Download authoritative reconstructed selected populations
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v21-reconstructed-*-${{ env.V21_ARTIFACT_SHA }}
          path: reconstructed
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ env.V21_RUN_ID }}
      - name: Run frozen V41 cross-era information frontier
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_preentry_provider_quote_microstructure_separability_v41 \
            reconstructed/development-input \
            reconstructed/validation-input \
            reconstructed/reserved-input \
            microstructure-input \
            experiment-output
      - name: Enforce no-policy V41 contract and exact population
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "experiment-output/"
              "capitalizer-preentry-provider-quote-microstructure-separability-v41.json"
          )
          report = json.loads(path.read_text())
          assert report["identity"] == (
              "QORE_CAPITALIZER_PREENTRY_PROVIDER_QUOTE_MICROSTRUCTURE_SEPARABILITY_V41"
          )
          assert report["feature_source"] == (
              "PROVIDER_NATIVE_BID_ASK_PREENTRY_60S_ONLY_18D"
          )
          assert report["feature_dimension"] == 18
          assert report["v11_features_used"] is False
          assert report["v38_geometry_features_used"] is False
          assert report["v40_m1_path_features_used"] is False
          assert report["stop_target_labels_used_as_features"] is False
          assert report["current_outcome_visible_to_features"] is False
          assert report["future_exit_visible_to_features"] is False
          assert report["future_mfe_mae_visible_to_features"] is False
          assert report["symbol_identity_feature_used"] is False
          assert report["date_identity_feature_used"] is False
          assert report["two_external_worlds_required"] is True
          assert report["threshold_grid_searched"] is False
          assert report["policy_economics_run"] is False
          assert report["admission_changed"] is False
          assert report["sizing_changed"] is False
          assert report["protection_changed"] is False
          assert report["candidate_count"] == 0
          assert report["runtime_policy_candidate"] is False
          assert report["fresh_holdout_opened"] is False
          assert report["trader_certified"] is False
          assert len(report["heldout_results"]) == 3

          expected = {
              "DEVELOPMENT_2024_2026": 948,
              "CONSUMED_VALIDATION_2022_2024": 1034,
              "CONSUMED_RESERVED_2020_2022": 1088,
          }
          for period, count in expected.items():
              coverage = report["coverage_by_period"][period]
              assert coverage["selected_entrants"] == count
              assert coverage["microstructure_states"] == count
              assert coverage["coverage"] == "1"
              assert coverage["missing"] == 0
              assert coverage["extra"] == 0
          print(json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-preentry-provider-microstructure-v41-${{ github.sha }}
          path: experiment-output
          if-no-files-found: error
          retention-days: 90
