name: VT08 Index R102 Source Confidence Risk Ablation

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r102-source-confidence-risk-ablation.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r102_source_confidence_risk_ablation.py
      - tests/infrastructure/trader_lab/test_vt08_index_r102_source_confidence_risk_ablation.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r102_source_confidence_risk_ablation.py

  forensics:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R102 source-confidence risk ablation
        run: |
          mkdir -p artifacts/report
          python -m qore.infrastructure.trader_lab.vt08_index_r102_source_confidence_risk_ablation \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r102-source-confidence-risk-ablation.json

      - name: Verify R102 governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r102-source-confidence-risk-ablation.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R102_SOURCE_CONFIDENCE_RISK_TRANSPORT_ABLATION_001"
          )
          assert report["source_r100"]["run_id"] == 35553739444
          assert report["source_r100"]["artifact_id"] == 10619881275
          assert report["source_r100"]["artifact_digest"] == (
              "sha256:c58d8e8844c5b99e46ae94653ded118b0f6564d285afe8ecbcdff227d657bb4b"
          )

          contract = report["confidence_contract"]
          assert contract["standard_cisd_is_source_valid"] is True
          assert contract["explicit_ps_mechanism_is_extra_confirmation"] is True
          assert contract["signals_suppressed"] is False
          assert contract["entries_changed"] is False
          assert contract["stops_changed"] is False
          assert contract["targets_changed"] is False
          assert contract["new_risk_constants_introduced"] is False
          assert contract["minimum_effective_weight_r"] == "0.005"
          assert contract["maximum_requested_weight_r"] == "0.25"
          assert contract["portfolio_budget_r"] == "0.75"

          assert report["five_year"]["sample"] == 2448
          assert report["recent_two_year"]["sample"] == 1017
          assert report["r66_failed_holdout"]["sample"] == 773
          assert report["policies"] == [
              "EXACT_R58_CONTROL",
              "R47_BASE_CONTROL",
              "EXPLICIT_FULL_R58_STANDARD_BASE",
              "EXPLICIT_LATE_ONLY_STANDARD_BASE",
          ]
          for window in (
              "five_year",
              "recent_two_year",
              "r66_failed_holdout",
          ):
              section = report[window]
              for policy in report["policies"]:
                  assert section["policies"][policy]["metrics"]["sample"] == section["sample"]

          assert report["decision"] == (
              "R102_SOURCE_CONFIDENCE_RISK_ABLATION_COMPLETE_NO_CANDIDATE_SELECTED"
          )
          gov = report["governance"]
          assert gov["forensics_only"] is True
          assert gov["bounded_mechanistic_ablation"] is True
          assert gov["variant_grid_is_not_an_optimizer"] is True
          assert gov["r66_consumed_failure_evidence"] is True
          assert gov["fresh_holdout_claim"] is False
          assert gov["canonical_signal_surface_preserved"] is True
          assert gov["signals_suppressed"] is False
          assert gov["future_outcome_used_for_risk"] is False
          assert gov["numeric_risk_search"] is False
          assert gov["candidate_created"] is False
          assert gov["trader_certified"] is False
          assert gov["live_authorized"] is False
          assert gov["real_capital_authorized"] is False
          assert gov["production_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r102-source-confidence-risk-ablation-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
