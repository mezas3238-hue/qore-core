name: VT08 B Independent Native Raw-to-Receipt Verification

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vt08-5m-cognition-replay-20261010
    paths:
      - src/qore/infrastructure/trader_lab/vt08_5m_b_independent_raw_receipts_v1.py
      - tests/infrastructure/trader_lab/test_vt08_5m_b_independent_raw_receipts_v1.py
      - .github/workflows/vt08-b-independent-native-raw-receipt-audit.yml

permissions:
  contents: read
  actions: read

jobs:
  independent-native-source-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        market: [EURJPY, USDCHF, NZDUSD, CADJPY, USDCAD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: B independent verifier code and adversarial tests
        run: |
          ruff check src/qore/infrastructure/trader_lab/vt08_5m_b_independent_raw_receipts_v1.py tests/infrastructure/trader_lab/test_vt08_5m_b_independent_raw_receipts_v1.py
          mypy src/qore/infrastructure/trader_lab/vt08_5m_b_independent_raw_receipts_v1.py
          pytest -q tests/infrastructure/trader_lab/test_vt08_5m_b_independent_raw_receipts_v1.py
      # Read-only access to pinned upstream raw development artifacts and
      # A's PUBLISHED receipts. We never check out or execute A's producer.
      - uses: actions/download-artifact@v4
        with:
          name: vt08-a-native-raw-custody-${{ matrix.market }}-a63fc1618e4cd8c3a3358aa8cd43a93e4fb06b23
          path: a-receipts/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 38709570234
      - uses: actions/download-artifact@v4
        with:
          name: qore-vt08-cognitive-5m-fresh-${{ matrix.market }}-b2d33e1b4829d8b4afc76983decca8a99131403c
          path: m15/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 35934924907
      - uses: actions/download-artifact@v4
        with:
          name: qore-vt08-m3-fractal-${{ matrix.market }}-bc1379d7661aac202495ec67afdd3098473ba723
          path: m3/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 35941643396
      - name: B reconstruct each A receipt from original M3/M15 raw bytes
        env:
          MARKET: ${{ matrix.market }}
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from qore.infrastructure.trader_lab.vt08_5m_b_independent_raw_receipts_v1 import verify_raw_window, verify_full_native_census

          market = os.environ["MARKET"]
          a_file = Path("a-receipts", market, market + "-raw-custody-receipts.json")
          m15 = Path("m15", market, "market-evidence-1095d.json")
          m3_candidates = list(Path("m3", market).rglob("m3-evidence.json"))
          if not a_file.is_file() or not m15.is_file() or len(m3_candidates) != 1:
              raise SystemExit("B source custody requires exact three original artifacts")
          record = json.loads(a_file.read_text())
          receipts = record.get("receipts")
          if record.get("market") != market or not isinstance(receipts, list) or not receipts:
              raise SystemExit("A source receipt inventory incomplete or wrong market")
          observed = set()
          for item in receipts:
              report = verify_raw_window(item, m3_file=m3_candidates[0], m15_file=m15)
              if report["m30_opened_at_utc"] in observed:
                  raise SystemExit("A duplicated a source anchor receipt")
              observed.add(report["m30_opened_at_utc"])
              if report["m3_raw_sha256"] != record.get("m3_raw_sha256") or report["m15_raw_sha256"] != record.get("m15_raw_sha256"):
                  raise SystemExit("A inventory raw SHA mismatch")
          if len(receipts) != record.get("attested_windows"):
              raise SystemExit("A count mismatch for source sample")
          full = verify_full_native_census(
              record, m3_file=m3_candidates[0], m15_file=m15
          )
          if not full["independent_census_verified"]:
              raise SystemExit("B independent census not verified")
          output = {
              "schema": "qore.vt08.b.independent.raw_verification.v1",
              "market": market, "source_A_pinned_run": 38709570234,
              "source_A_pinned_sha": "a63fc1618e4cd8c3a3358aa8cd43a93e4fb06b23",
              "b_verified_sample_windows": len(receipts),
              "b_verified_m3_bars": len(receipts) * 10,
              "b_verified_m15_bars": len(receipts) * 2,
              "source_anchor_windows_observed_claim": record.get("source_anchor_windows_observed"),
              "source_anchor_windows_complete_claim": record.get("source_anchor_windows_complete"),
              "b_full_census": full,
              "raw_shas_cross_checked": True,
              "source_author_fidelity_certified": False,
              "cognitive_certified": False,
              "economic_gates_evaluated": False,
              "holdout_7y_accessed": False,
          }
          dest = Path("evidence", market + "-b-independent-raw-audit.json")
          dest.write_text(json.dumps(output, sort_keys=True, separators=(",", ":")))
          print(json.dumps(output, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vt08-b-native-verified-${{ matrix.market }}-${{ github.sha }}
          path: evidence/*.json
          retention-days: 30
          if-no-files-found: error
