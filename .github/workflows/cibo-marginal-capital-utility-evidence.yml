name: QORE CIBO GEN-C4 Marginal Capital Utility Evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-marginal-capital-utility-evidence.yml'
      - 'src/qore/infrastructure/cibo_marginal_capital_utility_evidence.py'
      - 'tests/infrastructure/test_cibo_marginal_capital_utility_evidence.py'
      - 'docs/research/CIBO-CE2I-ADR-003-SOVEREIGN-CAPITAL-INTELLIGENCE-COMPOUNDING.md'
      - 'docs/research/CIBO-SOVEREIGN-CAPITAL-INTELLIGENCE-COMPOUNDING-MASTER-ROADMAP-V3.md'
  push:
    branches:
      - agent/cibo-capital-efficiency-sizing-lab-001
    paths:
      - '.github/workflows/cibo-marginal-capital-utility-evidence.yml'
      - 'src/qore/infrastructure/cibo_marginal_capital_utility_evidence.py'
      - 'tests/infrastructure/test_cibo_marginal_capital_utility_evidence.py'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  marginal-capital-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: GEN-C4 marginal capital evidence quality
        run: |
          ruff check \
            src/qore/infrastructure/cibo_marginal_capital_utility_evidence.py \
            tests/infrastructure/test_cibo_marginal_capital_utility_evidence.py
          python -m py_compile \
            src/qore/infrastructure/cibo_marginal_capital_utility_evidence.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_marginal_capital_utility_evidence.py
