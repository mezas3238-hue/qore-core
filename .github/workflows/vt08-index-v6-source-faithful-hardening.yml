name: VT08 Index V6 Source Faithful Hardening

on:
  push:
    branches: [agent/vt08-index-v6-ttrades-source-faithful-001]
    paths:
      - .github/workflows/vt08-index-v6-source-faithful-hardening.yml
      - src/qore/infrastructure/trader_lab/vt08_index_v6_ttrades_source_faithful.py
      - tests/infrastructure/trader_lab/test_vt08_index_v6_ttrades_source_faithful.py
      - docs/research/VT08-INDEX-V6-TTRADES-SOURCE-FAITHFUL-FREEZE-001.md

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - name: Focused V6 source-faithful tests
        run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_v6_ttrades_source_faithful.py
      - name: Full QORE gate
        run: pytest --cov=src/qore --cov-report=term-missing

  hardening:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"

      - name: Download consumed 2022-23 evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-vt08-index-v3-fresh-decision-106a34282fe8eac2f8c466bcc8502d4ec8d73855
          path: artifacts/v3
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34798973408

      - name: Download consumed 2023-24 evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-vt08-index-v2-fresh-r2-decision-58dd289646de8814449f836ad617a51342eba0da
          path: artifacts/v2
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34795405536

      - name: Download consumed 2024-26 evidence
        uses: actions/download-artifact@v4
        with:
          pattern: qore-vt08-v2-source-executable-*-a5b9c6e0d65539c1f755dda8bb3d7ce7b1a839b0
          path: artifacts/dev
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34661791159

      - name: Execute source-faithful consumed replays
        shell: bash
        run: |
          set -euo pipefail
          dev_nas="$(find artifacts/dev -path '*NAS100*' -name market-evidence.json -print -quit)"
          dev_sp="$(find artifacts/dev -path '*SP500*' -name market-evidence.json -print -quit)"
          dev_us="$(find artifacts/dev -path '*US30*' -name market-evidence.json -print -quit)"
          test -n "$dev_nas" && test -n "$dev_sp" && test -n "$dev_us"
          mkdir -p artifacts/report

          python -m qore.infrastructure.trader_lab.vt08_index_v6_ttrades_source_faithful \
            --nas100 artifacts/v3/truncated/NAS100.json \
            --sp500 artifacts/v3/truncated/SP500.json \
            --us30 artifacts/v3/truncated/US30.json \
            --start-date 2022-09-15 --end-date-exclusive 2023-09-15 \
            --expected-software-sha 106a34282fe8eac2f8c466bcc8502d4ec8d73855 \
            --minimum-evidence-days 350 \
            --out artifacts/report/2022_23.json

          python -m qore.infrastructure.trader_lab.vt08_index_v6_ttrades_source_faithful \
            --nas100 artifacts/v2/truncated/NAS100.json \
            --sp500 artifacts/v2/truncated/SP500.json \
            --us30 artifacts/v2/truncated/US30.json \
            --start-date 2023-09-15 --end-date-exclusive 2024-08-13 \
            --expected-software-sha 58dd289646de8814449f836ad617a51342eba0da \
            --minimum-evidence-days 300 \
            --out artifacts/report/2023_24.json

          python -m qore.infrastructure.trader_lab.vt08_index_v6_ttrades_source_faithful \
            --nas100 "$dev_nas" --sp500 "$dev_sp" --us30 "$dev_us" \
            --start-date 2024-08-13 --end-date-exclusive 2026-09-12 \
            --expected-software-sha a5b9c6e0d65539c1f755dda8bb3d7ce7b1a839b0 \
            --minimum-evidence-days 700 \
            --out artifacts/report/2024_26.json

          printf '%s\n' "$GITHUB_SHA" > artifacts/report/git-sha.txt
          python - <<'PY'
          import json
          from pathlib import Path
          names = ('2022_23', '2023_24', '2024_26')
          fingerprints = set()
          for name in names:
              payload = json.loads(Path(f'artifacts/report/{name}.json').read_text())
              assert payload['candidate_id'] == 'VT08_INDEX_V6_TTRADES_SOURCE_FAITHFUL_001'
              fingerprints.add(payload['rule_fingerprint'])
              rules = payload['rules']
              assert rules['v3_geometry'] is False
              assert rules['daily_unique_only'] is False
              assert rules['d1_peer_count_gate'] is False
              assert rules['forced_h4_lifecycle'] is False
              assert rules['target_r'] == '2'
              assert rules['entry'] == 'continuation-close'
              print(name, json.dumps({
                  'sample': payload['metrics_raw']['sample'],
                  'primary': payload['metrics_primary_stress'],
                  'boundary_marks': payload['boundary_mark_count'],
              }, sort_keys=True))
          assert len(fingerprints) == 1
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-index-v6-source-faithful-hardening-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
