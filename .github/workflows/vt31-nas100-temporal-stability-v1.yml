name: QORE VT31 NAS100 Temporal Stability V1

on:
  push:
    branches:
      - agent/vt31-nas100-intelligence-pilot-001
    paths:
      - scripts/vt31_nas100_market_state_stability.py
      - .github/workflows/vt31-nas100-temporal-stability-v1.yml
  pull_request:
    paths:
      - scripts/vt31_nas100_market_state_stability.py
      - .github/workflows/vt31-nas100-temporal-stability-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  temporal-stability:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research runtime
        run: pip install -e .[dev]

      - name: Static validation
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_market_state_stability.py
          ruff check scripts/vt31_nas100_market_state_stability.py

      - name: Recover immutable Market State V2 artifacts
        run: |
          set -euo pipefail
          mkdir -p inputs/r8 inputs/r6 inputs/r5

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10523467443/zip" > r8.zip
          echo "81e4d0f4dcbdfa68d88f025f26789162c8c49c097e93844a2032dd225581f297  r8.zip" | sha256sum -c -
          unzip -q r8.zip -d inputs/r8
          (cd inputs/r8 && sha256sum -c SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10523433888/zip" > r6.zip
          echo "59123e3f8a8a128448f158cb798b15abfd1b683efdff7435973024fca8f99b9f  r6.zip" | sha256sum -c -
          unzip -q r6.zip -d inputs/r6
          (cd inputs/r6 && sha256sum -c SHA256SUMS)

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10523314097/zip" > r5.zip
          echo "4050271b86fa04d866ffd557056c32d5a563f583be2e288244d2f23c93d8abe3  r5.zip" | sha256sum -c -
          unzip -q r5.zip -d inputs/r5
          (cd inputs/r5 && sha256sum -c SHA256SUMS)

      - name: Analyze cross-fold and half-year stability
        run: |
          set -euo pipefail
          mkdir result
          python scripts/vt31_nas100_market_state_stability.py             --input inputs/r8/vt31-nas100-market-state-v2-r8_fresh.json             --input inputs/r6/vt31-nas100-market-state-v2-r6.json             --input inputs/r5/vt31-nas100-market-state-v2-r5.json             --output result/vt31-nas100-market-state-stability-v1.json             | tee result/summary.json

      - name: Governance validation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("result/vt31-nas100-market-state-stability-v1.json").read_text()
          )
          assert payload["schema"] == "qore.vt31.nas100.market_state_stability.v1"
          assert payload["research_only"] is True
          assert payload["opens_new_holdout"] is False
          assert payload["live_authorized"] is False
          assert payload["production_authorized"] is False
          governance = payload["selection_governance"]
          assert governance["hypotheses_are_diagnostics_not_rules"] is True
          assert governance["aggregate_profit_cannot_select_policy"] is True
          assert governance["halfyear_instability_blocks_freeze"] is True
          assert governance["date_level_lookup_prohibited"] is True
          print("VT31_NAS100 temporal stability governance PASS")
          PY

      - name: Bind result
        run: |
          set -euo pipefail
          echo "${GITHUB_SHA}" > result/git-sha.txt
          echo "market-state-run=35284479467" > result/source-run.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-temporal-stability-v1-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
