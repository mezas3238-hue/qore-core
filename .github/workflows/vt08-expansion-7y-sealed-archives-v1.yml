name: QORE VT08 Expansion 7Y Sealed M15-M3 Archives

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vt08-cognitive-expansion-5m-v1-001
    paths:
      - .github/workflows/vt08-expansion-7y-sealed-archives-v1.yml

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        symbol: [EURJPY, USDCHF, NZDUSD, CADJPY, USDCAD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cTrader runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ctrader]"
      - name: Discover authorized DEMO account
        env:
          QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID }}
          QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET }}
          QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN }}
          QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(python -m qore.infrastructure.ctrader_demo_account_discovery)"
          if ! [[ "$account_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "invalid cTrader DEMO account discovery" >&2
            exit 3
          fi
          echo "::add-mask::$account_id"
          printf 'QORE_CTRADER_DEMO_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
      - name: Collect sealed seven-year M5-M15-H4 base
        env:
          QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID }}
          QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET }}
          QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN }}
          QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN }}
          QORE_DEMO_LAB_SYMBOL: ${{ matrix.symbol }}
          QORE_SOFTWARE_SHA: ${{ github.sha }}
        run: |
          mkdir -p "artifacts/${QORE_DEMO_LAB_SYMBOL}"
          python -m qore.infrastructure.trader_lab.vt08_cognitive_expansion_7y_base_archive_v1 \
            > "artifacts/${QORE_DEMO_LAB_SYMBOL}/raw-7y-base.json"
      - name: Bind exact M3 archive boundaries
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["SYMBOL"]
          payload = json.loads(
              Path(f"artifacts/{symbol}/raw-7y-base.json").read_text()
          )
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"QORE_M3_REQUESTED_OPENED_AT={payload['requested_opened_at']}\n")
              handle.write(f"QORE_M3_CHECKED_AT={payload['checked_at']}\n")
          PY
      - name: Collect sealed seven-year M3
        env:
          QORE_CTRADER_CLIENT_ID: ${{ secrets.QORE_CTRADER_CLIENT_ID }}
          QORE_CTRADER_CLIENT_SECRET: ${{ secrets.QORE_CTRADER_CLIENT_SECRET }}
          QORE_CTRADER_ACCESS_TOKEN: ${{ secrets.QORE_CTRADER_ACCESS_TOKEN }}
          QORE_CTRADER_REFRESH_TOKEN: ${{ secrets.QORE_CTRADER_REFRESH_TOKEN }}
          QORE_DEMO_LAB_SYMBOL: ${{ matrix.symbol }}
          QORE_SOFTWARE_SHA: ${{ github.sha }}
        run: |
          python -m qore.infrastructure.trader_lab.vt08_cognitive_m3_evidence_probe_v1 \
            > "artifacts/${QORE_DEMO_LAB_SYMBOL}/raw-7y-m3.json"
      - name: Assert sealed archive semantics
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          symbol = os.environ["SYMBOL"]
          base = json.loads(Path(f"artifacts/{symbol}/raw-7y-base.json").read_text())
          m3 = json.loads(Path(f"artifacts/{symbol}/raw-7y-m3.json").read_text())
          assert base["sealed_raw_archive"] is True
          assert base["strategy_replay_performed"] is False
          assert m3["strategy_replay_performed"] is False
          assert base["requested_opened_at"] == m3["requested_opened_at"]
          assert base["checked_at"] == m3["checked_at"]
          first = datetime.fromisoformat(m3["first_opened_at"])
          last = datetime.fromisoformat(m3["last_closed_at"])
          assert (last - first).days >= 2545
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-expansion-7y-${{ matrix.symbol }}-${{ github.sha }}
          path: artifacts/${{ matrix.symbol }}
          if-no-files-found: error
          retention-days: 30
