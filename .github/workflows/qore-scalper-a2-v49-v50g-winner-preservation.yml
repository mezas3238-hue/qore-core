name: QORE Scalper A2 Matched V49 V50G Winner Preservation

on:
  push:
    branches:
      - agent/scalper-architect-b-methodology-20261010
    paths:
      - '.github/workflows/qore-scalper-a2-v49-v50g-winner-preservation.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: scalper-a2-nine-market-winner-preservation-${{ github.ref }}
  cancel-in-progress: true

env:
  V49_CONTROL_RUN: '38053946695'
  V49_CONTROL_SHA: 'e356e7a52541e99533b25ecfef0ab9c4e9ce03c0'
  V50_G_RUN: '38053723674'
  V50_G_SHA: 'cb897be93821fcb238c4a16a419dfff2814ec0f4'

jobs:
  matched_baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research-only source tools
        run: python -m pip install -e '.[dev]'
      - name: Verify post-hoc winner ID retention code
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_scalper_winner_retention_v1.py tests/infrastructure/trader_lab/test_capitalizer_scalper_winner_retention_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_scalper_winner_retention_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_scalper_winner_retention_v1.py
      - name: Download nine identical-M1 V49 control market ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: scalper-a2-v49-control-*-${{ env.V49_CONTROL_SHA }}
          path: v49-control
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.V49_CONTROL_RUN }}
      - name: Download nine V49 source-identified V50-G market ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: scalper-a2-paired-*-${{ env.V50_G_SHA }}
          path: v50-g-replay
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.V50_G_RUN }}
      - name: Download source-to-cognition drop waterfall from same V50-G run
        uses: actions/download-artifact@v4
        with:
          name: scalper-a2-v49-v50g-nine-market-research-${{ env.V50_G_SHA }}
          path: v50-g-waterfall
          github-token: ${{ github.token }}
          run-id: ${{ env.V50_G_RUN }}
      - name: Reconcile exact source-opportunity population across all nine markets
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_scalper_winner_retention_v1 \
            v49-control v50-g-replay matched-winner-output
      - name: Record actually retained original winning IDs and original R mass
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("matched-winner-output/scalper-v49-v50g-matched-winner-retention.json")
          r = json.loads(p.read_text())
          assert r["market_count"] == 9
          assert r["source_opportunities"] == 2876
          assert r["same_source_universe_confirmed"] is True
          assert r["frozen_v49_selected_trades"] == 2020
          assert r["trader_certified"] is False and r["live_authorized"] is False
          print("CONTROL V49 EXACT-SOURCE SELECTED", r["frozen_v49_selected_trades"])
          for name, m in r["policies"].items():
              print("ACTUAL V50G SOURCE-ID WINNER RETENTION", name, m)
              assert m["baseline_positive_winners"] == 1167
          w = json.loads(
              Path("v50-g-waterfall/waterfall-output/scalper-v49-v50-g-waterfall.json").read_text()
          )
          assert w["source_market_count"] == 9
          assert w["all_markets_trace_covered"] is True
          assert w["source_opportunities_total"] == r["source_opportunities"]
          assert w["trader_certified"] is False
          for market in w["markets"]:
              print("GATE DROPS", market["symbol"],
                    "source", market["source_opportunities"],
                    "not_ready", market["geometry_not_ready"],
                    "cognition_denied", market["cognitive_denied_among_geometry_ready"],
                    "after_max3", market["cognitive_policy_after_max3"])
          PY
      - name: Archive full matched winner IDs and preservation verdict
        uses: actions/upload-artifact@v4
        with:
          name: scalper-a2-matched-winner-preservation-${{ github.sha }}
          path: matched-winner-output/
          retention-days: 90
          if-no-files-found: error
