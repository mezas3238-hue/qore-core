name: QORE Turtle Soup XAUUSD R35 Final Certification Suite

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-xauusd-specialist-memory-v1-001
    paths:
      - '.github/workflows/turtle-soup-xauusd-r35-final-certification-suite.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r35_final_certification_suite.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r35_final_certification_suite.py'

permissions:
  contents: read
  actions: read

env:
  R34_RUN_ID: '35308785945'
  R34_ARTIFACT: 'qore-turtle-soup-xauusd-r34-frozen-r33-5y-validation-56ef138ee5ea1cde6d0bcf4c9e25e8b661c04e84'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check --ignore E501,I001             src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r35_final_certification_suite.py             tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r35_final_certification_suite.py
      - name: Mypy focused gate
        run: |
          mypy --disable-error-code attr-defined             src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r35_final_certification_suite.py
      - name: Focused tests
        run: |
          pytest -q --no-cov             tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r35_final_certification_suite.py

  certify:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download exact official R34 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.R34_ARTIFACT }}
          path: r34-source
          github-token: ${{ github.token }}
          run-id: ${{ env.R34_RUN_ID }}
      - name: Execute WFO Monte Carlo stress slippage robustness certification
        run: |
          mkdir -p r35-output
          python -m qore.infrastructure.trader_lab.turtle_soup_xauusd_r35_final_certification_suite             r34-source r35-output > r35-output/stdout.json
          echo "$GITHUB_SHA" > r35-output/git-sha.txt
      - name: Enforce fail-closed certification contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(Path('r35-output/r35-final-certification-report.json').read_text())
          assert report['identity']=='TURTLE_SOUP_XAUUSD_R35_FINAL_CERTIFICATION_SUITE_V1'
          contract=report['certification_contract']
          assert contract['internal_qore_research_certification'] is True
          assert contract['external_regulatory_certification'] is False
          assert contract['rules_reoptimized_after_r34'] is False
          assert contract['fresh_holdout_consumed'] is False
          assert contract['fail_closed'] is True

          gates=report['gate_results']
          status=report['certification']['status']
          certified=report['certification']['certified']
          assert certified == all(gates.values())
          assert status == ('TRADER_CERTIFIED' if certified else 'NOT_CERTIFIED')

          g=report['governance']
          assert g['fresh_holdout_consumed'] is False
          assert g['live_authorized'] is False
          assert g['real_capital_authorized'] is False
          assert g['production_authorized'] is False
          assert g['merge_authorized'] is False
          assert g['certification_does_not_authorize_live_capital'] is True
          PY
      - name: Hash certification evidence
        run: |
          cd r35-output
          sha256sum r35-final-certification-report.json r35-certification-manifest.json stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-xauusd-r35-final-certification-${{ github.sha }}
          path: r35-output
          if-no-files-found: error
          retention-days: 90
