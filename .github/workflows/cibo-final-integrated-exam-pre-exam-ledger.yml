name: QORE CIBO Final Integrated Exam Pre-Exam Ledger

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/qore/infrastructure/cibo_final_integrated_exam_pre_exam_ledger.py'
      - 'tests/infrastructure/test_cibo_final_integrated_exam_pre_exam_ledger.py'
      - '.github/workflows/cibo-final-integrated-exam-pre-exam-ledger.yml'

permissions:
  contents: read

jobs:
  pre-exam-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: A plus B to exact PRE_EXAM topology
        run: |
          ruff check \
            src/qore/infrastructure/cibo_final_integrated_exam_pre_exam_ledger.py \
            tests/infrastructure/test_cibo_final_integrated_exam_pre_exam_ledger.py
          mypy \
            src/qore/infrastructure/cibo_final_integrated_exam_pre_exam_ledger.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_final_integrated_exam_pre_exam_ledger.py
