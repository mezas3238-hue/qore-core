name: QORE Scalper A2 As-Of Entry Timing Sensor Panel

on:
  push:
    branches:
      - agent/scalper-architect-b-methodology-20261010
    paths:
      - '.github/workflows/qore-scalper-a2-entry-timing-sensors-shadow.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_scalper_entry_timing_sensors_shadow_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_scalper_entry_timing_sensors_shadow_v1.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scalper-a2-asof-entry-timing-sensors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sensors_causality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Check sensor type contracts and rigorous as-of regression
        run: |
          ruff check src/qore/infrastructure/trader_lab/capitalizer_scalper_entry_timing_sensors_shadow_v1.py tests/infrastructure/trader_lab/test_capitalizer_scalper_entry_timing_sensors_shadow_v1.py
          mypy src/qore/infrastructure/trader_lab/capitalizer_scalper_entry_timing_sensors_shadow_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_capitalizer_scalper_entry_timing_sensors_shadow_v1.py
      - name: Document sensor panels require independent evidence and do not trade
        run: |
          python - <<'PY'
          from qore.infrastructure.trader_lab.capitalizer_scalper_entry_timing_sensors_shadow_v1 import EntrySensorFrame
          assert EntrySensorFrame.__dataclass_fields__["execution_authorized"].default is False
          assert EntrySensorFrame.__dataclass_fields__["cognitive_master_frame_attested"].default is False
          assert EntrySensorFrame.__dataclass_fields__["live_authorized"].default is False
          assert EntrySensorFrame.__dataclass_fields__["trader_certified"].default is False
          PY
