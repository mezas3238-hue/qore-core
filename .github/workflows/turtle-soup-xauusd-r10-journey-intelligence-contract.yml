name: QORE Turtle Soup XAUUSD R10 Journey Intelligence Contract

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-xauusd-r3-forensics-001
    paths:
      - '.github/workflows/turtle-soup-xauusd-r10-journey-intelligence-contract.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r10_journey_intelligence_contract.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r10_journey_intelligence_contract.py'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QORE development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check --ignore E501,I001 \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r10_journey_intelligence_contract.py \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r10_journey_intelligence_contract.py
      - name: Mypy focused gate
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r10_journey_intelligence_contract.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r10_journey_intelligence_contract.py
      - name: Build immutable research contract
        run: |
          mkdir -p r10-output
          python -m qore.infrastructure.trader_lab.turtle_soup_xauusd_r10_journey_intelligence_contract \
            r10-output/journey-intelligence-contract.json > r10-output/stdout.json
          printf '%s\n' "$GITHUB_SHA" > r10-output/git-sha.txt
      - name: Enforce governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('r10-output/journey-intelligence-contract.json').read_text())
          assert p['identity']=='TURTLE_SOUP_XAUUSD_R10_CIBO_JOURNEY_INTELLIGENCE_CONTRACT_V1'
          assert p['evidence_status']=='CONSUMED_CIBO_10Y_JOURNEY_INTELLIGENCE_FOUNDATION_NOT_FRESH_HOLDOUT'
          assert p['intelligence_model']['return_maximising_score'] is False
          assert p['intelligence_model']['automatic_threshold_search'] is False
          assert p['intelligence_model']['date_or_year_operating_feature'] is False
          assert p['intelligence_model']['post_entry_feature_allowed_for_operating_decision'] is False
          assert p['governance']['candidate_promoted'] is False
          assert p['governance']['fresh_holdout_consumed'] is False
          assert p['governance']['demo_eligible'] is False
          assert p['governance']['live_authorized'] is False
          assert p['governance']['real_capital_authorized'] is False
          assert p['governance']['production_authorized'] is False
          PY
      - name: Hash immutable R10 contract
        run: |
          cd r10-output
          sha256sum journey-intelligence-contract.json stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-xauusd-r10-journey-intelligence-${{ github.sha }}
          path: r10-output
          if-no-files-found: error
          retention-days: 90
