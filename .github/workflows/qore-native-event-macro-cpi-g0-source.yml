name: QORE Native EVENT Macro CPI G0 — BLS Calendar and CIBO M1 Timestamp Only

on:
  push:
    branches:
      - research/qore-native-event-macro-cpi-g0-source-20261011
    paths:
      - '.github/workflows/qore-native-event-macro-cpi-g0-source.yml'
      - 'src/qore/infrastructure/trader_lab/qore_native_event_macro_cpi_g0_v1.py'
      - 'tests/infrastructure/trader_lab/test_qore_native_event_macro_cpi_g0_v1.py'
      - 'docs/research/QORE_NATIVE_EVENT_MACRO_CPI_G0_PREOUTCOME_SOURCE_PREREG_2026-10-11.md'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: qore-event-cpi-g0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local research code and pytest
        run: python -m pip install -e '.[dev]'
      - name: Confirm calendar prereg and no-price read boundaries
        run: |
          test -s docs/research/QORE_NATIVE_EVENT_MACRO_CPI_G0_PREOUTCOME_SOURCE_PREREG_2026-10-11.md
          python - <<'PY'
          from pathlib import Path
          p=Path("src/qore/infrastructure/trader_lab/qore_native_event_macro_cpi_g0_v1.py")
          source=p.read_text()
          assert 'PREREG_SHA = "621c55ffc21d31305fe0f623cb9822b7b7b2b476"' in source
          assert 'https://www.bls.gov/schedule/{year}/' in source
          assert 'CIBO_ARTIFACT = 10618862813' in source
          assert 'America/New_York' in source
          assert 'row.get("open_relative")' not in source
          assert "ProtoOA" not in source and "ctrader_open_api" not in source
          PY
          ruff check --select F,E4,E7,E9 src/qore/infrastructure/trader_lab/qore_native_event_macro_cpi_g0_v1.py tests/infrastructure/trader_lab/test_qore_native_event_macro_cpi_g0_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_qore_native_event_macro_cpi_g0_v1.py

  official_bls_calendar:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      result: ${{ steps.census.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only local code
        run: python -m pip install -e .
      - name: Query official BLS calendars 2016 through 2026, no market prices
        id: census
        run: |
          python -m qore.infrastructure.trader_lab.qore_native_event_macro_cpi_g0_v1 calendar cpi-event-g0-bls
          python - <<'PY'
          import json,os
          from pathlib import Path
          m=json.loads(Path("cpi-event-g0-bls/cpi-bls-g0-source-report.json").read_text())
          assert m["identity"]=="QORE_NATIVE_EVENT_MACRO_CPI_G0_SOURCE_ONLY_V1"
          assert m["no_price_or_economic_outcome_read"] is True
          assert m["prereg_sha"]=="621c55ffc21d31305fe0f623cb9822b7b7b2b476"
          assert m["status"] in ("BLS_CALENDAR_ROWS_VERIFIED","SOURCE_BLS_UNAVAILABLE")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("result="+m["status"]+"\n")
          print("BLS_CALENDAR_OFFICIAL_ONLY",m["status"],m["source_years_pass"],"of 11")
          PY
          (cd cpi-event-g0-bls && sha256sum *.json > OUTPUT_SHA256SUMS.txt)
      - name: Upload source inventory even if BLS is inaccessible
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qore-event-cpi-g0-bls-calendar-${{ github.sha }}
          path: cpi-event-g0-bls/
          retention-days: 90
          if-no-files-found: warn

  cibo_native_presence:
    needs: official_bls_calendar
    if: needs.official_bls_calendar.outputs.result == 'BLS_CALENDAR_ROWS_VERIFIED'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local script only — never cTrader OAuth
        run: python -m pip install -e .
      - name: Restore official calendar witness from same GitHub run
        uses: actions/download-artifact@v4
        with:
          name: qore-event-cpi-g0-bls-calendar-${{ github.sha }}
          path: cpi-event-g0-bls
      - name: Restore unchanged CIBO 2016–2026 NAS100 native M1 archive
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-NAS100-18c338aedd5013ce65a6cb6408ffbc2e904a6217
          run-id: '35548099334'
          github-token: ${{ github.token }}
          path: cibo-native-nas100-m1
      - name: Count M1 TIMESTAMPS only, never market prices or returns
        run: |
          python -m qore.infrastructure.trader_lab.qore_native_event_macro_cpi_g0_v1 coverage cibo-native-nas100-m1 cpi-event-g0-bls/cpi-bls-g0-dated-events.json cpi-event-g0-nas100
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("cpi-event-g0-nas100/cpi-nas100-m1-g0-coverage-report.json").read_text())
          assert r["source_cibo_artifact"]==10618862813
          assert r["all_11_original_annual_partition_sha256_verified"] is True
          assert r["zero_price_values_consumed"] is True
          assert r["zero_economic_outcomes_calculated"] is True
          assert r["consensus_asof_unverified"] is True
          assert r["event_spreads_and_fills_unverified"] is True
          assert r["no_trades_no_vps_no_mt5_no_live"] is True
          events=json.loads(Path("cpi-event-g0-nas100/cpi-nas100-m1-g0-event-presence.json").read_text())
          assert len(events)==r["cpi_calendar_events_in_window"]
          assert all(x["provider_ohlc_read"] is False for x in events)
          print("QORE_EVENT_CPI_G0_PRESENCE_ONLY",r["status"])
          PY
          printf '%s\n' "$GITHUB_SHA" > cpi-event-g0-nas100/source-code-sha.txt
          (cd cpi-event-g0-nas100 && sha256sum *.json *.txt > OUTPUT_SHA256SUMS.txt)
      - name: Upload timestamp-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qore-event-cpi-g0-cibo-nas100-presence-${{ github.sha }}
          path: cpi-event-g0-nas100/
          retention-days: 90
          if-no-files-found: warn
