name: QORE Alpha2 PATR Research CI
on:
  push:
    branches:
      - 'research/qore-alpha2-*'
  pull_request:
    paths:
      - 'src/qore/research/**'
      - 'tests/research/**'
      - 'docs/research/QORE_ALPHA2_*'
      - '.github/workflows/qore-alpha2-patr-research-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-causal-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install strict synthetic-test dependencies
        run: python -m pip install 'pytest>=8,<9' 'ruff>=0.5,<1'
      - name: Ruff syntax and quality
        run: ruff check src/qore/research/alpha2_intermarket.py tests/research/test_alpha2_intermarket.py
      - name: Synthetic first-online / anti-lookahead / G0 guards
        env:
          PYTHONPATH: src
        run: pytest -q -o addopts='' tests/research/test_alpha2_intermarket.py
      - name: Execution guard / research-only contract
        run: |
          python - <<'PY'
          from pathlib import Path
          code = Path('src/qore/research/alpha2_intermarket.py').read_text()
          forbidden = ('MetaTrader5', 'ctrader_open_api', 'send_order(', 'place_order(',
                       'subprocess.', 'requests.post(')
          assert all(token not in code for token in forbidden), 'live execution code prohibited'
          print('RESEARCH_ONLY, no live execution')
          PY
