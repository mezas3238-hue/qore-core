name: VT08 B R20 Intrac2 M3 CISD Sweep Source Chronology

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vt08-5m-cognition-replay-20261010
    paths:
      - src/qore/infrastructure/trader_lab/vt08_b_r20_intrac2_cisd_sweep_causal_order_v1.py
      - tests/infrastructure/trader_lab/test_vt08_b_r20_intrac2_cisd_sweep_causal_order_v1.py
      - .github/workflows/vt08-b-r20-intrac2-cisd-sweep-native-chronology.yml

permissions:
  contents: read
  actions: read

jobs:
  r20-causal-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Source-only causal adversarial test suite
        run: |
          ruff check src/qore/infrastructure/trader_lab/vt08_b_r20_intrac2_cisd_sweep_causal_order_v1.py tests/infrastructure/trader_lab/test_vt08_b_r20_intrac2_cisd_sweep_causal_order_v1.py
          pytest -q tests/infrastructure/trader_lab/test_vt08_b_r20_intrac2_cisd_sweep_causal_order_v1.py

  r20-original-m3:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: r20-causal-contract
    strategy:
      fail-fast: false
      matrix:
        market: [EURJPY, USDCHF, NZDUSD, CADJPY, USDCAD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: vt08-a-frozen-m30m3-firstfail-${{ matrix.market }}-394116f13449fc310d7fbc5f0b5f60aa1bb247d4
          path: r3/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 38715560333
      - uses: actions/download-artifact@v4
        with:
          name: vt08-a-blind-three-source-${{ matrix.market }}-385e89cb769eef36f85ddca56f3f3dcaf1e0f863
          path: r7/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 38765076497
      - uses: actions/download-artifact@v4
        with:
          name: qore-vt08-m3-fractal-${{ matrix.market }}-bc1379d7661aac202495ec67afdd3098473ba723
          path: original-m3/${{ matrix.market }}
          github-token: ${{ github.token }}
          run-id: 35941643396
      - name: All 2657 physical C1 sweep M3 CISD C2 closure by native M3 as-of
        env:
          MARKET: ${{ matrix.market }}
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json, os
          from pathlib import Path
          from qore.infrastructure.trader_lab.vt08_b_r20_intrac2_cisd_sweep_causal_order_v1 import audit_intrac2_sweep_cisd_source
          m=os.environ["MARKET"]
          source=list(Path("r3",m).rglob(m+"-frozen-source-firstfail.json"))
          joint=list(Path("r7",m).rglob(m+"-three-source-blind-review.json"))
          raw=list(Path("original-m3",m).rglob("m3-evidence.json"))
          if len(source)!=1 or len(joint)!=1 or len(raw)!=1:
              raise SystemExit("R20 requires EXACT pinned native M3 + original A R3/R7")
          r3=json.loads(source[0].read_text())
          r7=json.loads(joint[0].read_text())
          result=audit_intrac2_sweep_cisd_source(r3,r7,market=m,native_m3_file=raw[0])
          expected={"EURJPY":538,"USDCHF":518,"NZDUSD":550,"CADJPY":516,"USDCAD":535}
          if result["cases_audited"]!=expected[m]:
              raise SystemExit("R20 lost native M3 source universe")
          if sum(result["first_sweep_vs_cisd_counts"].values())!=expected[m]:
              raise SystemExit("R20 causal first-fail buckets not exhaustive")
          if (result["source_complete_entries"] or result["cognitive_admissions"] or
              result["broker_fills"] or result["economic_gates_evaluated"]):
              raise SystemExit("R20 source-only branch promoted to author cognitive trade")
          out=Path("evidence",m+"-r20-native-intrac2-sweep-cisd.json")
          out.write_text(json.dumps(result,sort_keys=True,separators=(",",":"),allow_nan=False))
          print(json.dumps({k:v for k,v in result.items() if k not in (
              "all_case_causal_index","blind_packet_causal_evidence"
          )},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vt08-b-r20-native-causal-review-${{ matrix.market }}-${{ github.sha }}
          path: evidence/*.json
          retention-days: 30
          if-no-files-found: error
