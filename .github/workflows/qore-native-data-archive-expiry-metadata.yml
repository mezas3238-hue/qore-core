name: QORE Native 33 M5 M1 Artifact Expiry Register (Metadata Only)

on:
  push:
    branches:
      - research/qore-native-icmarkets-universe33-m1-capture-20261012
    paths:
      - '.github/workflows/qore-native-data-archive-expiry-metadata.yml'
      - 'src/qore/infrastructure/trader_lab/qore_native_data_archive_expiry_register_v1.py'
      - 'tests/infrastructure/trader_lab/test_qore_native_data_archive_expiry_register_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source_metadata_only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Verify artifact ledger cannot confuse metadata with permanent SHA-restored backup
        run: |
          set -euo pipefail
          ruff check --select F,E4,E7,E9 src/qore/infrastructure/trader_lab/qore_native_data_archive_expiry_register_v1.py tests/infrastructure/trader_lab/test_qore_native_data_archive_expiry_register_v1.py
          PYTHONPATH=src python -m unittest discover -s tests/infrastructure/trader_lab -p 'test_qore_native_data_archive_expiry_register_v1.py' -v
      - name: Audit original + new M5/M1 artifacts by exact run, source SHA, expiry
        run: |
          set -euo pipefail
          mkdir -p source-vault-inventory
          PYTHONPATH=src python -m qore.infrastructure.trader_lab.qore_native_data_archive_expiry_register_v1 source-vault-inventory/33x2-artifacts-status.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("source-vault-inventory/33x2-artifacts-status.json").read_text())
          assert d["metadata_available"]["M5"]==33
          assert not d["all_artifacts_restored_and_hashed"]
          assert not d["all_artifacts_backed_up_permanently"]
          print("QORE_TEMPORARY_M5_33_EXISTS", "M1",d["metadata_available"]["M1"],"EARLIEST_EXPIRY",d["nearest_expiry_utc"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-native-source-vault-expiry-INVENTORY-ONLY-${{ github.sha }}
          path: source-vault-inventory/
          if-no-files-found: warn
          retention-days: 90
