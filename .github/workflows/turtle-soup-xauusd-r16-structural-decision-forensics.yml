name: QORE Turtle Soup XAUUSD R16 Structural Decision Forensics

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-xauusd-r3-forensics-001
    paths:
      - '.github/workflows/turtle-soup-xauusd-r16-structural-decision-forensics.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r16_structural_decision_forensics.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r16_structural_decision_forensics.py'

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-XAUUSD-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-XAUUSD-2f510461b3360e91d5ee70a72716a76cd6561f16'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check --ignore E501,I001 \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r16_structural_decision_forensics.py \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r16_structural_decision_forensics.py
      - name: Mypy focused gate
        run: |
          mypy --disable-error-code attr-defined \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r16_structural_decision_forensics.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r16_structural_decision_forensics.py

  forensics:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable consumed XAUUSD M5 corpus
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download immutable consumed XAUUSD Target Destination V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Run structural decision forensics
        run: |
          mkdir -p r16-output
          python -m qore.infrastructure.trader_lab.turtle_soup_xauusd_r16_structural_decision_forensics \
            source-xauusd target-xauusd r16-output > r16-output/stdout.json
          printf '%s\n' "$GITHUB_SHA" > r16-output/git-sha.txt
      - name: Enforce structural evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('r16-output/r16-structural-decision-report.json').read_text())
          assert p['identity']=='TURTLE_SOUP_XAUUSD_R16_STRUCTURAL_DECISION_FORENSICS_V1'
          assert p['reproduction']['retained_bars']==707716
          assert p['reproduction']['routed_setups']==12768
          assert p['reproduction']['unmatched']==4
          assert p['reproduction']['filled_action_rows'] > 0
          c=p['interpretation_contract']
          assert c['pnl_used'] is False
          assert c['return_maximising_selection'] is False
          assert c['automatic_threshold_search'] is False
          assert c['post_entry_path_allowed_as_operating_input'] is False
          assert c['rule_promoted'] is False
          g=p['governance']
          assert g['fresh_holdout_consumed'] is False
          assert g['no_entry_rule_promoted'] is True
          assert g['no_target_rule_promoted'] is True
          assert g['live_authorized'] is False
          assert g['real_capital_authorized'] is False
          PY
      - name: Hash immutable R16 result
        run: |
          cd r16-output
          sha256sum r16-structural-decision-report.json r16-action-ledger.json stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-xauusd-r16-structural-decision-${{ github.sha }}
          path: r16-output
          if-no-files-found: error
          retention-days: 90
