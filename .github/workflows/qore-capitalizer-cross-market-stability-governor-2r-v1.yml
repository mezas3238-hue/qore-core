name: QORE Capitalizer Cross Market Stability Governor 2R V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-cross-market-stability-governor-2r-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_cross_market_stability_governor_2r_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_cross_market_stability_governor_2r_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-cross-market-stability-governor-2r-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  DIRECT_RUN_ID: '36196002610'
  DIRECT_SHA: 'ddd00209e50d5ec16c8cb94f34e9e5e95f401839'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_cross_market_stability_governor_2r_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_cross_market_stability_governor_2r_v1.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_cross_market_stability_governor_2r_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_cross_market_stability_governor_2r_v1.py

  experiment:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download development direct-M1 ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-max-recovery-direct-m1-dev-*-${{ env.DIRECT_SHA }}
          path: development-input
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.DIRECT_RUN_ID }}
      - name: Download fresh holdout direct-M1 ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-max-recovery-direct-m1-holdout-*-${{ env.DIRECT_SHA }}
          path: holdout-input
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.DIRECT_RUN_ID }}
      - name: Run cross-market stability governor
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_cross_market_stability_governor_2r_v1 \
            development-input holdout-input experiment-output
      - name: Enforce causal integrity
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          report = json.loads(
              Path(
                  "experiment-output/"
                  "capitalizer-cross-market-stability-governor-2r-v1.json"
              ).read_text()
          )
          assert report["development_trades"] == 948
          assert report["fresh_holdout_trades"] == 1034
          assert report["policy_count"] == 5
          assert report["thresholds_selected_from_holdout_outcomes"] is False
          assert report["same_policy_definitions_on_development_and_holdout"] is True
          assert report["all_entries_preserved"] is True
          assert report["current_trade_outcome_visible_to_decision"] is False
          assert report["open_trade_future_visible_to_decision"] is False
          assert report["unchosen_counterfactual_visible_to_decision"] is False
          for row in report["results"]:
              dev = row["development"]
              hold = row["fresh_holdout"]
              assert dev["trades"] == 948
              assert hold["trades"] == 1034
              assert Decimal(dev["density_retention"]) == Decimal("1")
              assert Decimal(hold["density_retention"]) == Decimal("1")
              assert hold["current_outcome_visible_to_decision"] is False
              assert hold["unchosen_counterfactual_visible_to_decision"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-cross-market-stability-governor-2r-v1-${{ github.sha }}
          path: experiment-output
          if-no-files-found: error
          retention-days: 90
