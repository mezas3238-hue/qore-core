name: QORE Capitalizer V3 WAIT5 LATE60 Strict Continuity 2Y V1

on:
  push:
    branches:
      - agent/qore-capitalizer-cognitive-v1-001
    paths:
      - '.github/workflows/qore-capitalizer-v3-wait5-late60-strict-continuity-2y-v1.yml'
      - 'src/qore/infrastructure/trader_lab/capitalizer_v3_wait5_late60_strict_continuity_2y_v1.py'
      - 'tests/infrastructure/trader_lab/test_capitalizer_v3_wait5_late60_strict_continuity_2y_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-capitalizer-v3-wait5-late60-strict-continuity-2y-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  ATLAS_RUN_ID: '35861801861'
  ATLAS_SHA: 'afa45dca7db0f9dd3ee2f21050be94f8bd893055'
  LATE60_RUN_ID: '35850354903'
  LATE60_SHA: 'b8639455c31e35274dd100a650cc090da559f147'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check \
            src/qore/infrastructure/trader_lab/capitalizer_v3_wait5_late60_strict_continuity_2y_v1.py \
            tests/infrastructure/trader_lab/test_capitalizer_v3_wait5_late60_strict_continuity_2y_v1.py
      - name: Mypy
        run: |
          mypy \
            src/qore/infrastructure/trader_lab/capitalizer_v3_wait5_late60_strict_continuity_2y_v1.py
      - name: Focused tests
        run: |
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_capitalizer_v3_wait5_late60_strict_continuity_2y_v1.py

  experiment:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download frozen expiration atlas
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-nine-market-v3-wait5-late60-hypothesis-expiration-atlas-2y-v1-${{ env.ATLAS_SHA }}
          path: atlas-source
          github-token: ${{ github.token }}
          run-id: ${{ env.ATLAS_RUN_ID }}
      - name: Download frozen LATE60 ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: qore-capitalizer-v3-source-first-wait5-late60-2y-v1-*-${{ env.LATE60_SHA }}
          path: late60-source
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ env.LATE60_RUN_ID }}
      - name: Run strict-continuity consumed-window A/B
        run: |
          python -m qore.infrastructure.trader_lab.capitalizer_v3_wait5_late60_strict_continuity_2y_v1 \
            atlas-source late60-source experiment-output
      - name: Enforce frozen controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "experiment-output/"
                  "capitalizer-nine-market-v3-wait5-late60-strict-continuity-2y-v1.json"
              ).read_text()
          )
          assert report["identity"] == (
              "QORE_CAPITALIZER_V3_WAIT5_LATE60_STRICT_CONTINUITY_2Y_V1"
          )
          assert report["atlas_rows"] == 365
          assert report["late60_raw"] == 365
          assert report["eligible_late_structural"] == 57
          assert report["wait5_raw"] == 1003
          assert report["candidate_raw"] == 1060
          assert report["wait5_max3"] == 983
          assert report["outcome_used_for_admission"] is False
          assert report["component_dimensions_previously_outcome_described"] is True
          assert report["composite_rule_economics_previously_unread"] is True
          assert report["fresh_holdout_required"] is True
          assert report["fresh_holdout_claimed"] is False
          assert report["rule_promotion_allowed"] is False
          assert report["trader_certified"] is False
          assert report["live_authorized"] is False
          assert report["real_capital_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-capitalizer-nine-market-v3-wait5-late60-strict-continuity-2y-v1-${{ github.sha }}
          path: experiment-output
          if-no-files-found: error
          retention-days: 90
