name: QORE Shared A STI3 Source Stress

concurrency:
  group: qore-shared-a-sti3-source-stress
  cancel-in-progress: false

on:
  push:
    branches:
      - agent/shared-a-cognitive-science-001
    paths:
      - scripts/shared_sti3_global_opportunity_board_stress.py
      - .github/workflows/qore-shared-a-sti3-source-stress.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Recover immutable source evidence
        run: |
          set -euo pipefail
          mkdir -p input/{r8,r6,r5} result
          ruff check scripts/shared_sti3_global_opportunity_board_stress.py
          python -m py_compile scripts/shared_sti3_global_opportunity_board_stress.py
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10402199719/zip" > r8.zip
          unzip -q r8.zip -d input/r8
          (cd input/r8 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10389112524/zip" > r6.zip
          unzip -q r6.zip -d input/r6
          (cd input/r6 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10380044761/zip" > r5.zip
          unzip -q r5.zip -d input/r5
          (cd input/r5 && sha256sum -c fresh/EVIDENCE-SHA256SUMS)
          test "$(git rev-parse "1df8be7cfea2621a4bfcf6a7de741aa585a29f35:src/qore/infrastructure/core_stack_v2/shared_global_opportunity_trajectory_v2.py")" = "$(git rev-parse "HEAD:src/qore/infrastructure/core_stack_v2/shared_global_opportunity_trajectory_v2.py")"

      - name: Stress STI-3 on real causal source observations
        run: |
          set -euo pipefail
          python scripts/shared_sti3_global_opportunity_board_stress.py             --r8-nas input/r8/fresh/NAS100/market-evidence.json             --r8-sp input/r8/fresh/SP500/market-evidence.json             --r8-us input/r8/fresh/US30/market-evidence.json             --r6-nas input/r6/fresh/NAS100/market-evidence.json             --r6-sp input/r6/fresh/SP500/market-evidence.json             --r6-us input/r6/fresh/US30/market-evidence.json             --r5-nas input/r5/fresh/NAS100/market-evidence.json             --r5-sp input/r5/fresh/SP500/market-evidence.json             --r5-us input/r5/fresh/US30/market-evidence.json             --output result/sti3-source-stress.json             | tee result/summary.json

      - name: Validate stress disposition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/sti3-source-stress.json").read_text())
          assert p["status"] == "STI3_SOURCE_STRESS_PASS"
          assert p["proof"]["future_market_read"] is False
          assert p["proof"]["future_outcome_read"] is False
          assert p["proof"]["trader_methodology_read"] is False
          assert p["proof"]["higher_contradiction_never_increases_board_support"] is True
          assert p["proof"]["degraded_data_health_fails_closed"] is True
          assert p["governance"]["protected_certification_holdout_opened"] is False
          PY

      - name: Seal result
        run: |
          printf '%s\n' "${GITHUB_SHA}" > result/code-git-sha.txt
          (
            cd result
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: qore-shared-a-sti3-source-stress-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90

      - name: Report STI-3 stress
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p=json.loads(Path("result/sti3-source-stress.json").read_text())
          body="\n".join([
              "## Shared A STI-3 — Global Opportunity Board Source Stress",
              "",
              f"- Git SHA: `{os.environ['GITHUB_SHA']}`",
              f"- run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- disposition: **{p['status']}**",
              f"- R6: **{p['results']['r6']}**",
              f"- R5: **{p['results']['r5']}**",
              "- higher contradiction/uncertainty increases board support: **False**",
              "- degraded data health fails closed: **True**",
              "- outcome/future/Trader methodology read: **False / False / False**",
              "- productive authority: **False**",
          ])+"\n"
          Path("result/issue-comment.md").write_text(body)
          PY
          gh issue comment 638 --body-file result/issue-comment.md
