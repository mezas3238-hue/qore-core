name: VT08 Index R71 SAME C2 Body WAIT

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r71-same-c2-body-wait.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r71_same_c2_body_wait.py
      - tests/infrastructure/trader_lab/test_vt08_index_r71_same_c2_body_wait.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r71_same_c2_body_wait.py

  research:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R71 SAME_C2 body WAIT research
        run: |
          python -m qore.infrastructure.trader_lab.vt08_index_r71_same_c2_body_wait \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r71-same-c2-body-wait.json

      - name: Verify R71 remains research-only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r71-same-c2-body-wait.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R71_SAME_C2_BODY_TRANSITION_WAIT_RESEARCH_001"
          )
          assert report["five_year"]["canonical_sample"] == 2448
          assert report["recent_two_year"]["canonical_sample"] == 1017
          assert report["r66_failed_holdout"]["canonical_sample"] == 773
          assert report["source_failure"]["r66_density_gate"] == 1000
          assert report["source_contract"]["anchors_new_york"] == [22, 2, 6, 10]
          assert report["source_contract"]["protected_swing_preserved"] is True
          assert report["decision"] == (
              "R71_WAIT_RESEARCH_COMPLETE_NO_CANDIDATE"
          )
          governance = report["governance"]
          assert governance["research_only"] is True
          assert governance["fresh_holdout_claim"] is False
          assert governance["bounded_single_hypothesis"] is True
          assert governance["future_information_used"] is False
          assert governance["calendar_or_year_runtime_feature"] is False
          assert governance["anchors_changed"] is False
          assert governance["poi_families_changed"] is False
          assert governance["protected_swing_changed"] is False
          assert governance["target_changed"] is False
          assert governance["risk_changed"] is False
          assert governance["signal_suppression_performed"] is False
          assert governance["candidate_created"] is False
          assert governance["trader_certified"] is False
          assert governance["live_authorized"] is False
          assert governance["real_capital_authorized"] is False
          assert governance["production_authorized"] is False
          PY

      - name: Upload R71 evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r71-same-c2-body-wait-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: warn
          retention-days: 90
