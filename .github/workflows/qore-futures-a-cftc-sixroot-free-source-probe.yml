name: QORE Futures A CFTC six-root free weekly-source probe (NO OUTCOMES)

on:
  push:
    branches:
      - research/qore-futures-a-cftc-disagg-sixroots-source-20261013
    paths:
      - '.github/scripts/qore_futures_a_cftc_sixroots_public_source_probe_v1.py'
      - 'tests/infrastructure/trader_lab/test_qore_futures_a_cftc_source_probe_v1.py'
      - '.github/workflows/qore-futures-a-cftc-sixroot-free-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source_only:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      PYTHONPATH: src:.github/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install static checkers
        run: pip install "ruff>=0.5,<1" "mypy>=1.5,<2"
      - name: Ruff
        run: |
          ruff check .github/scripts/qore_futures_a_cftc_sixroots_public_source_probe_v1.py \
            tests/infrastructure/trader_lab/test_qore_futures_a_cftc_source_probe_v1.py
      - name: Mypy
        run: |
          mypy .github/scripts/qore_futures_a_cftc_sixroots_public_source_probe_v1.py \
            tests/infrastructure/trader_lab/test_qore_futures_a_cftc_source_probe_v1.py
      - name: Synthetic source trust-boundary tests
        run: python -m unittest discover -s tests/infrastructure/trader_lab -p test_qore_futures_a_cftc_source_probe_v1.py -v
      - name: Inspect actual official 2012 2018 2021 CFTC weekly archives
        run: python .github/scripts/qore_futures_a_cftc_sixroots_public_source_probe_v1.py
      - name: Enforce no outcome data, certification, trading or holdout
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/research/cftc_sixroots_source_audit.json")
          r=json.loads(p.read_text())
          assert r["source_archive_years_actually_checked"]==[2012,2018,2021]
          assert r["root_count_verified_in_sample"]==6
          assert r["source_has_native_expiry_ohlcv"] is False
          assert r["source_is_executable_futures_market_data"] is False
          assert r["hypothesis_tested"] is False
          assert r["net_trading_edge_demonstrated"] is False
          assert r["heldout_2022_plus_read"] is False
          assert r["market_data_spend_usd"]==0
          print("CFTC_SOURCE_ONLY_USD0_NO_EDGE_NO_HOLDOUT")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qore-futures-a-cftc-six-root-official-source-census-only
          path: artifacts/research/cftc_sixroots_source_audit.json
          retention-days: 90
          if-no-files-found: error
