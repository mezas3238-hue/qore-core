name: QORE CIBO GEN-C11 GEN-C13 Utility Wrapper

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cibo-genc11-genc13-utility-wrapper.yml'
      - 'src/qore/infrastructure/cibo_genc11_genc13_utility_gate.py'
      - 'tests/infrastructure/test_cibo_genc11_genc13_utility_gate.py'
      - 'docs/research/CIBO-GEN-C11-GEN-C13-NONCOMPENSATORY-UTILITY-WRAPPER-V1.md'
      - 'src/qore/infrastructure/cibo_genc9_economic_gate.py'
      - 'docs/research/CIBO-MASTER-OPEN-WORK-LEDGER-V1.json'

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  genc11-genc13-utility-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: GEN-C11 / GEN-C13 executable utility wrapper
        run: |
          ruff check \
            src/qore/infrastructure/cibo_genc11_genc13_utility_gate.py \
            tests/infrastructure/test_cibo_genc11_genc13_utility_gate.py
          mypy \
            src/qore/infrastructure/cibo_genc11_genc13_utility_gate.py
          python -m py_compile \
            src/qore/infrastructure/cibo_genc11_genc13_utility_gate.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_genc11_genc13_utility_gate.py
