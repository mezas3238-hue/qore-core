name: VT08 Index R66 Fresh Historical Holdout

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r66-fresh-holdout.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r66_fresh_historical_holdout.py
      - tests/infrastructure/trader_lab/test_vt08_index_r66_fresh_historical_holdout.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r66_fresh_historical_holdout.py

  holdout:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Run preregistered R66 fresh holdout
        run: |
          python -m qore.infrastructure.trader_lab.vt08_index_r66_fresh_historical_holdout \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r66-fresh-holdout.json

      - name: Verify fresh certification gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/report/vt08-index-r66-fresh-holdout.json")
          report = json.loads(path.read_text())
          assert report["window"]["status"] == (
              "PREREGISTERED_FRESH_HISTORICAL_HOLDOUT"
          )
          assert report["window"]["days"] == 728
          assert report["window"]["block_days"] == 364
          assert report["candidate"]["candidate_retuned"] is False
          assert report["sample"] >= 1000
          assert report["fresh_holdout_gate_pass"] is True
          assert report["decision"] == (
              "PASS_R66_FRESH_HOLDOUT_CERTIFICATION_EVIDENCE"
          )
          assert report["governance"]["fresh_holdout_claim"] is True
          assert report["governance"]["trader_certified"] is False
          assert report["governance"]["live_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r66-fresh-holdout-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: warn
          retention-days: 90
