name: VT08 Index R103 Confidence Temporal Failure Attribution

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r103-confidence-temporal-failure-attribution.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r103_confidence_temporal_failure_attribution.py
      - tests/infrastructure/trader_lab/test_vt08_index_r103_confidence_temporal_failure_attribution.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r103_confidence_temporal_failure_attribution.py

  forensics:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO evidence
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R103 temporal failure attribution
        run: |
          mkdir -p artifacts/report
          python -m qore.infrastructure.trader_lab.vt08_index_r103_confidence_temporal_failure_attribution \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r103-confidence-temporal-failure-attribution.json

      - name: Verify R103 governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r103-confidence-temporal-failure-attribution.json"
              ).read_text()
          )
          assert report["identity"] == (
              "VT08_INDEX_R103_SOURCE_CONFIDENCE_TEMPORAL_FAILURE_ATTRIBUTION_001"
          )
          assert report["source_r102"]["run_id"] == 35554460252
          assert report["source_r102"]["artifact_id"] == 10619927443
          assert report["source_r102"]["artifact_digest"] == (
              "sha256:cb9c87bca14b6ab00cb910bf5dde8e380dd3453ecc833f3402c545ae197106a4"
          )
          assert report["source_r102"]["policy_under_attribution"] == (
              "EXPLICIT_FULL_R58_STANDARD_BASE"
          )

          assert report["five_year"]["sample"] == 2448
          assert report["recent_two_year"]["sample"] == 1017
          assert report["r66_failed_holdout"]["sample"] == 773

          assert report["decision"] == (
              "R103_CONFIDENCE_TEMPORAL_FAILURE_ATTRIBUTION_COMPLETE_NO_RULE_CHANGE"
          )
          gov = report["governance"]
          assert gov["forensics_only"] is True
          assert gov["consumed_evidence_only"] is True
          assert gov["fresh_holdout_claim"] is False
          assert gov["policy_changed"] is False
          assert gov["signals_suppressed"] is False
          assert gov["pnl_used_for_runtime_rule"] is False
          assert gov["candidate_created"] is False
          assert gov["trader_certified"] is False
          assert gov["live_authorized"] is False
          assert gov["real_capital_authorized"] is False
          assert gov["production_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qore-vt08-index-r103-confidence-temporal-failure-attribution-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
