name: QORE Turtle Soup AUDJPY R41 5Y Structural Fragility Correction

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/turtle-soup-audjpy-r41-5y-structural-fragility-correction.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_audjpy_r41_5y_structural_fragility_correction.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_audjpy_r41_5y_structural_fragility_correction.py'
  push:
    branches:
      - agent/turtle-soup-audjpy-specialist-memory-v1-001
    paths:
      - '.github/workflows/turtle-soup-audjpy-r41-5y-structural-fragility-correction.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_audjpy_r41_5y_structural_fragility_correction.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_audjpy_r41_5y_structural_fragility_correction.py'

permissions:
  contents: read
  actions: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  R40_RUN_ID: '35397390781'
  R40_ARTIFACT: 'qore-turtle-soup-audjpy-r40-frozen-r39-5y-validation-a332b077598e070a42b2497b3766d55e731f7dca'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Focused quality
        run: |
          ruff check --ignore E501,I001 \
            src/qore/infrastructure/trader_lab/turtle_soup_audjpy_r41_5y_structural_fragility_correction.py \
            tests/infrastructure/trader_lab/test_turtle_soup_audjpy_r41_5y_structural_fragility_correction.py
          mypy --disable-error-code attr-defined \
            src/qore/infrastructure/trader_lab/turtle_soup_audjpy_r41_5y_structural_fragility_correction.py
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_turtle_soup_audjpy_r41_5y_structural_fragility_correction.py

  correction:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download exact consumed R40 5Y artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.R40_ARTIFACT }}
          path: r40-source
          github-token: ${{ github.token }}
          run-id: ${{ env.R40_RUN_ID }}
      - name: Run R41 structural fragility correction
        run: |
          mkdir -p r41-output
          python -m qore.infrastructure.trader_lab.turtle_soup_audjpy_r41_5y_structural_fragility_correction \
            r40-source r41-output > r41-output/stdout.json
          printf '%s\n' "$EVIDENCE_SHA" > r41-output/git-sha.txt
      - name: Enforce owner gates and governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('r41-output/r41-5y-structural-fragility-correction-report.json').read_text())
          assert p['identity']=='TURTLE_SOUP_AUDJPY_R41_5Y_STRUCTURAL_FRAGILITY_CORRECTION_V1'
          c=p['correction_contract']
          assert c['signals_added'] is False
          assert c['signals_removed'] is False
          assert c['trade_count_preserved'] is True
          assert c['post_entry_information_used_for_risk'] is False
          assert c['pre_entry_context_only'] is True
          assert c['risk_only_nonzero_scaling'] is True
          assert all(float(x) > 0 for x in c['second_layer_policy_0_1_2_3plus'])
          a=p['predeclared_acceptance']
          assert a['five_year']['minimum_trades']==800
          assert a['five_year']['minimum_pf']=='1.50'
          assert a['five_year']['maximum_dd_r']=='6.0'
          assert a['five_year']['required_positive_annual_blocks']==5
          assert a['two_year_revalidation']['minimum_trades']==350
          assert a['two_year_revalidation']['minimum_pf']=='1.90'
          assert a['two_year_revalidation']['maximum_dd_r']=='6.0'
          assert p['result_5y']['trades']==1039
          assert p['result_5y']['acceptance_pass'] is True
          assert p['result_2y']['acceptance_pass'] is True
          assert p['decision']['eligible_for_final_freeze'] is True
          g=p['governance']
          assert g['fresh_holdout_consumed'] is False
          assert g['trader_certified'] is False
          assert g['live_authorized'] is False
          assert g['real_capital_authorized'] is False
          assert g['merge_authorized'] is False
          PY
      - name: Hash R41 evidence
        run: |
          cd r41-output
          sha256sum r41-5y-structural-fragility-correction-report.json r41-5y-corrected-trades.jsonl stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-audjpy-r41-5y-fragility-correction-${{ env.EVIDENCE_SHA }}
          path: r41-output
          if-no-files-found: error
          retention-days: 90


  freeze-r42:
    needs: [quality, correction]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Focused R42 quality
        run: |
          ruff check --ignore E501,I001 \
            src/qore/infrastructure/trader_lab/turtle_soup_audjpy_r42_final_candidate_freeze.py \
            tests/infrastructure/trader_lab/test_turtle_soup_audjpy_r42_final_candidate_freeze.py
          mypy --disable-error-code attr-defined \
            src/qore/infrastructure/trader_lab/turtle_soup_audjpy_r42_final_candidate_freeze.py
          pytest -q --no-cov \
            tests/infrastructure/trader_lab/test_turtle_soup_audjpy_r42_final_candidate_freeze.py
      - name: Download exact official R41 artifact
        uses: actions/download-artifact@v4
        with:
          name: qore-turtle-soup-audjpy-r41-5y-fragility-correction-2976255f2459a17603b0b9385b4c249a720463b8
          path: r41-official
          github-token: ${{ github.token }}
          run-id: '35399430491'
      - name: Freeze exact R41 final candidate
        run: |
          mkdir -p r42-output
          python -m qore.infrastructure.trader_lab.turtle_soup_audjpy_r42_final_candidate_freeze \
            r41-official r42-output > r42-output/stdout.json
          printf '%s\n' "$EVIDENCE_SHA" > r42-output/git-sha.txt
      - name: Enforce R42 final freeze
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('r42-output/r42-final-candidate-freeze-manifest.json').read_text())
          assert p['identity']=='TURTLE_SOUP_AUDJPY_R42_FINAL_CANDIDATE_001'
          assert p['status']=='FROZEN_FOR_FINAL_ROBUSTNESS'
          assert p['consumed_5y_result']['trades']==1039
          assert p['consumed_5y_result']['profit_factor_scaled_net_010']=='1.957251590510384151212372667'
          assert p['consumed_5y_result']['max_drawdown_scaled_r']=='5.293573269867727808258117465'
          assert p['consumed_2y_result']['trades']==422
          assert p['governance']['candidate_frozen'] is True
          assert p['governance']['fresh_holdout_consumed'] is False
          assert p['governance']['trader_certified'] is False
          PY
      - name: Hash R42 evidence
        run: |
          cd r42-output
          sha256sum r42-final-candidate-freeze-manifest.json stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-audjpy-r42-final-freeze-${{ env.EVIDENCE_SHA }}
          path: r42-output
          if-no-files-found: error
          retention-days: 90
