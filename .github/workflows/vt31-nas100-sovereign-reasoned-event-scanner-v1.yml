name: QORE VT31 NAS100 Sovereign Reasoned Event Scanner V1

on:
  push:
    branches:
      - agent/vt31-nas100-intelligence-pilot-001
    paths:
      - scripts/vt31_nas100_sovereign_reasoned_event_scanner_v1.py
      - .github/workflows/vt31-nas100-sovereign-reasoned-event-scanner-v1.yml
  pull_request:
    paths:
      - scripts/vt31_nas100_sovereign_reasoned_event_scanner_v1.py
      - .github/workflows/vt31-nas100-sovereign-reasoned-event-scanner-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - partition: r5
            artifact_id: "10380044761"
            evidence_sha256: "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r6
            artifact_id: "10389112524"
            evidence_sha256: "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: r8
            artifact_id: "10402199719"
            evidence_sha256: "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb"
            evidence_path: "fresh/NAS100/market-evidence.json"
          - partition: consumed_holdout
            artifact_id: "10557487418"
            evidence_sha256: "acf2fa327a68a5a6d977dfdbc9c696cb13db6e0e7550b9da386f3699b5cf8d09"
            evidence_path: "NAS100/market-evidence.json"
    env:
      PARTITION: ${{ matrix.partition }}
      ARTIFACT_ID: ${{ matrix.artifact_id }}
      EXPECTED_EVIDENCE_SHA256: ${{ matrix.evidence_sha256 }}
      EVIDENCE_PATH: ${{ matrix.evidence_path }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Static gate
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_sovereign_reasoned_event_scanner_v1.py
          ruff check scripts/vt31_nas100_sovereign_reasoned_event_scanner_v1.py

      - name: Recover immutable consumed evidence
        run: |
          set -euo pipefail
          mkdir -p input result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > evidence.zip
          unzip -q evidence.zip -d input
          test -f "input/${EVIDENCE_PATH}"
          actual="$(sha256sum "input/${EVIDENCE_PATH}" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_EVIDENCE_SHA256"

      - name: Run sovereign reasoned-event scanner
        run: |
          set -euo pipefail
          python scripts/vt31_nas100_sovereign_reasoned_event_scanner_v1.py             "input/${EVIDENCE_PATH}"             --partition "$PARTITION"             --output "result/sovereign-${PARTITION}.json"             | tee "result/summary-${PARTITION}.json"

      - name: Governance gate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = os.environ["PARTITION"]
          payload = json.loads(
              Path(f"result/sovereign-{p}.json").read_text()
          )
          g = payload["governance"]
          assert g["consumed_evidence_only"] is True
          assert g["architecture_capacity_research"] is True
          assert g["reasoning_sovereign_for_every_execution"] is True
          assert g["wait_keeps_observing_same_source"] is True
          assert g["abstain_kills_current_source"] is True
          assert g["new_event_requires_new_raid_confirmation_decision"] is True
          assert g["same_source_secondary_disabled"] is True
          assert g["scout_after_wait_disabled"] is True
          assert g["post_exit_event_requires_structural_rearm"] is True
          assert g["max_one_trade_per_source_event"] is True
          assert g["uses_terminal_pnl_at_runtime"] is False
          assert g["uses_fold_identity_at_runtime"] is False
          assert g["uses_calendar_time_at_runtime"] is False
          assert g["opens_new_holdout"] is False
          assert g["policy_promoted"] is False
          assert g["candidate_certified"] is False
          assert g["live_authorized"] is False
          assert g["production_authorized"] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-sovereign-scanner-${{ matrix.partition }}-${{ github.sha }}
          path: result/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qore-vt31-nas100-sovereign-scanner-*-${{ github.sha }}
          path: input
          merge-multiple: true

      - name: Aggregate sovereign scanner evidence
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          folds = {}
          for path in Path("input").glob("sovereign-*.json"):
              payload = json.loads(path.read_text())
              folds[payload["partition"]] = payload
          assert set(folds) == {"r5", "r6", "r8", "consumed_holdout"}

          names = ("r5", "r6", "r8", "consumed_holdout")
          report = {
              "schema": (
                  "qore.vt31.nas100.sovereign_reasoned_event_scanner."
                  "aggregate.v1"
              ),
              "folds": {
                  fold: {
                      "trade_count": folds[fold]["trade_count"],
                      "unique_trade_days": folds[fold]["unique_trade_days"],
                      "events_per_day": folds[fold]["events_per_day"],
                      "metrics": folds[fold]["metrics_net_r"],
                      "monte_carlo": folds[fold]["monte_carlo_net_r"],
                      "annual_metrics": folds[fold][
                          "annual_metrics_net_r"
                      ],
                      "loss_path_counts": folds[fold]["loss_path_counts"],
                      "status_counts": folds[fold]["status_counts"],
                  }
                  for fold in names
              },
              "density_300_350": {
                  fold: 300 <= int(folds[fold]["trade_count"]) <= 350
                  for fold in names
              },
              "positive_pf_all_folds": all(
                  Decimal(
                      str(folds[fold]["metrics_net_r"]["profit_factor"])
                  ) > 1
                  for fold in names
              ),
              "pf_ge_1_50_all_folds": all(
                  Decimal(
                      str(folds[fold]["metrics_net_r"]["profit_factor"])
                  ) >= Decimal("1.50")
                  for fold in names
              ),
              "max_losing_streak_by_fold": {
                  fold: folds[fold]["metrics_net_r"]["max_losing_streak"]
                  for fold in names
              },
              "governance": {
                  "diagnostic_only": True,
                  "reasoning_sovereign": True,
                  "same_source_density_override_removed": True,
                  "opens_new_holdout": False,
                  "policy_promoted": False,
                  "candidate_certified": False,
              },
          }
          Path("result/aggregate.json").write_text(
              json.dumps(report, sort_keys=True, indent=2) + "\n"
          )
          print(json.dumps(report, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-sovereign-scanner-aggregate-${{ github.sha }}
          path: result/
          retention-days: 90
