name: QORE CIBO T11 Execution Cost Calibration

on:
  pull_request:
    paths:
      - 'src/qore/infrastructure/cibo_ce2i_t11_execution_cost_calibration.py'
      - 'tests/infrastructure/test_cibo_ce2i_t11_execution_cost_calibration.py'
      - '.github/workflows/cibo-t11-execution-cost-calibration.yml'
  push:
    paths:
      - 'src/qore/infrastructure/cibo_ce2i_t11_execution_cost_calibration.py'
      - 'tests/infrastructure/test_cibo_ce2i_t11_execution_cost_calibration.py'
      - '.github/workflows/cibo-t11-execution-cost-calibration.yml'

jobs:
  t11-linear-execution-cost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Validate T11 provider-bound linear cost calibration
        run: |
          ruff check \
            src/qore/infrastructure/cibo_ce2i_t11_execution_cost_calibration.py \
            tests/infrastructure/test_cibo_ce2i_t11_execution_cost_calibration.py
          mypy \
            src/qore/infrastructure/cibo_ce2i_t11_execution_cost_calibration.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_ce2i_t11_execution_cost_calibration.py
