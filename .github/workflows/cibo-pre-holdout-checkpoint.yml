name: QORE CIBO Pre-Holdout Checkpoint

on:
  push:
    branches:
      - agent/cibo-capital-efficiency-sizing-lab-001
    paths:
      - '.github/workflows/cibo-pre-holdout-checkpoint.yml'
      - 'scripts/cibo_pre_holdout_checkpoint.py'
      - 'src/qore/infrastructure/cibo_ce2i_calibration_registry.py'
      - 'src/qore/infrastructure/cibo_ce2i_calibration_matrix.py'
      - 'src/qore/infrastructure/cibo_ce2i_burned_calibration.py'
      - 'src/qore/infrastructure/cibo_ce2i_burned_lifecycle_calibration.py'
      - 'src/qore/infrastructure/cibo_ce2i_burned_t01_calibration.py'
      - 'src/qore/infrastructure/cibo_ce2i_burned_t07_calibration.py'
      - 'src/qore/infrastructure/cibo_ce2i_pre_holdout_gate.py'
      - 'src/qore/infrastructure/cibo_ce2i_holdout_registry.py'
      - 'src/qore/infrastructure/cibo_ce2i_usd60_six_month_certification.py'
      - 'src/qore/infrastructure/cibo_ce2i_provider_economics_evidence.py'
      - 'src/qore/infrastructure/cibo_ce2i_provider_economics_provenance.py'
      - 'tests/infrastructure/test_cibo_ce2i_provider_economics_evidence.py'
      - 'tests/infrastructure/test_cibo_ce2i_provider_economics_provenance.py'
  pull_request:
    paths:
      - '.github/workflows/cibo-pre-holdout-checkpoint.yml'
      - 'scripts/cibo_pre_holdout_checkpoint.py'
      - 'src/qore/infrastructure/cibo_ce2i_calibration_registry.py'
      - 'src/qore/infrastructure/cibo_ce2i_calibration_matrix.py'
      - 'src/qore/infrastructure/cibo_ce2i_burned_calibration.py'
      - 'src/qore/infrastructure/cibo_ce2i_burned_lifecycle_calibration.py'
      - 'src/qore/infrastructure/cibo_ce2i_burned_t01_calibration.py'
      - 'src/qore/infrastructure/cibo_ce2i_burned_t07_calibration.py'
      - 'src/qore/infrastructure/cibo_ce2i_pre_holdout_gate.py'
      - 'src/qore/infrastructure/cibo_ce2i_holdout_registry.py'
      - 'src/qore/infrastructure/cibo_ce2i_usd60_six_month_certification.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Quality
        run: |
          ruff check \
            scripts/cibo_pre_holdout_checkpoint.py \
            scripts/cibo_pre_holdout_gate.py \
            src/qore/infrastructure/cibo_ce2i_calibration_registry.py \
            src/qore/infrastructure/cibo_ce2i_calibration_matrix.py \
            src/qore/infrastructure/cibo_ce2i_burned_calibration.py \
            src/qore/infrastructure/cibo_ce2i_burned_lifecycle_calibration.py \
            src/qore/infrastructure/cibo_ce2i_burned_t01_calibration.py \
            src/qore/infrastructure/cibo_ce2i_burned_t07_calibration.py \
            src/qore/infrastructure/cibo_ce2i_pre_holdout_gate.py \
            src/qore/infrastructure/cibo_ce2i_holdout_registry.py \
            src/qore/infrastructure/cibo_ce2i_provider_economics_evidence.py \
            src/qore/infrastructure/cibo_ce2i_provider_economics_provenance.py \
            src/qore/infrastructure/cibo_ce2i_provider_economics_component_freeze.py \
            src/qore/infrastructure/cibo_ce2i_provider_execution_stress_bound.py \
            src/qore/infrastructure/cibo_ce2i_shadow_certification_receipts.py
          mypy \
            scripts/cibo_pre_holdout_checkpoint.py \
            scripts/cibo_pre_holdout_gate.py \
            src/qore/infrastructure/cibo_ce2i_calibration_registry.py \
            src/qore/infrastructure/cibo_ce2i_calibration_matrix.py \
            src/qore/infrastructure/cibo_ce2i_burned_calibration.py \
            src/qore/infrastructure/cibo_ce2i_burned_lifecycle_calibration.py \
            src/qore/infrastructure/cibo_ce2i_burned_t01_calibration.py \
            src/qore/infrastructure/cibo_ce2i_burned_t07_calibration.py \
            src/qore/infrastructure/cibo_ce2i_pre_holdout_gate.py \
            src/qore/infrastructure/cibo_ce2i_holdout_registry.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_ce2i_burned_calibration.py \
            tests/infrastructure/test_cibo_ce2i_burned_lifecycle_calibration.py \
            tests/infrastructure/test_cibo_ce2i_burned_t01_calibration.py \
            tests/infrastructure/test_cibo_ce2i_burned_t07_calibration.py \
            tests/infrastructure/test_cibo_ce2i_calibration_registry.py \
            tests/infrastructure/test_cibo_ce2i_calibration_matrix.py \
            tests/infrastructure/test_cibo_ce2i_pre_holdout_gate.py \
            tests/infrastructure/test_cibo_ce2i_holdout_registry.py \
            tests/infrastructure/test_cibo_ce2i_provider_economics_evidence.py \
            tests/infrastructure/test_cibo_ce2i_provider_economics_provenance.py

      - name: Emit checkpoint without reading 2017H1
        run: |
          mkdir -p pre-holdout
          python scripts/cibo_pre_holdout_checkpoint.py \
            --git-sha "$EVIDENCE_SHA" \
            --output pre-holdout/pre-holdout-checkpoint.json \
            > pre-holdout/pre-holdout-checkpoint.stdout.json

      - name: Enforce untouched holdout and not-ready status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(
              Path("pre-holdout/pre-holdout-checkpoint.json").read_text()
          )
          assert p["status"] == "PRE_HOLDOUT_NOT_READY"
          assert p["ready_to_unseal_2017h1"] is False
          assert p["phase20d_causal_tool_gate_passed"] is True
          assert p["phase21_policy_freeze_sealed"] is True
          assert "PHASE20D_CAUSAL_TOOL_GATE_NOT_PASSED" not in p["pre_holdout_blockers"]
          assert "PHASE21_POLICY_FREEZE_NOT_SEALED" not in p["pre_holdout_blockers"]
          assert "PROVIDER_ECONOMICS_NOT_FROZEN" not in p["pre_holdout_blockers"]
          assert "CALIBRATION_FREEZE_MANIFEST_NOT_SEALED" in p["pre_holdout_blockers"]
          assert p["provider_economics_freeze"]["ready"] is True
          assert p["provider_economics_freeze"]["empirical_slippage_frozen"] is False
          assert p["provider_economics_freeze"]["stress_bound_execution_model_frozen"] is True
          assert p["provider_economics_freeze"]["execution_model_basis"] == "STRESS_BOUND"
          assert p["provider_execution_stress_profile"]["scenario_count"] == 4
          assert p["provider_execution_stress_profile"]["empirical_slippage_claimed"] is False
          assert p["shadow_certification_receipts"]["phase21_policy_freeze"]["sealed"] is True
          assert p["fresh_holdout"]["outcomes_inspected"] is False
          assert p["fresh_holdout"]["market_data_read_by_this_checkpoint"] is False
          assert p["fresh_holdout"]["untouched_confirmation"] is True
          assert p["governance"]["holdout_used_for_calibration"] is False
          assert len(p["t01_t20_matrix"]) == 20
          PY

      - name: Seal checkpoint evidence
        run: |
          printf '%s\n' "$GITHUB_SHA" > pre-holdout/git-sha.txt
          cd pre-holdout
          sha256sum \
            pre-holdout-checkpoint.json \
            pre-holdout-checkpoint.stdout.json \
            git-sha.txt \
            > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: qore-cibo-pre-holdout-checkpoint-${{ env.EVIDENCE_SHA }}
          path: pre-holdout
          if-no-files-found: error
          retention-days: 90
