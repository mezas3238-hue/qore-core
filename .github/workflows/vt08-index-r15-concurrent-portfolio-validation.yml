name: VT08 Index R15 Concurrent Portfolio Validation

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r15-concurrent-portfolio-validation.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r15_concurrent_portfolio_validation.py
      - tests/infrastructure/trader_lab/test_vt08_index_r15_concurrent_portfolio_validation.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r15_concurrent_portfolio_validation.py

  validate:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute concurrent portfolio validation
        run: |
          python -m qore.infrastructure.trader_lab.vt08_index_r15_concurrent_portfolio_validation             --nas100-root artifacts/NAS100             --sp500-root artifacts/SP500             --us30-root artifacts/US30             --out artifacts/report/vt08-index-r15-concurrent-portfolio-validation.json

      - name: Verify Owner concurrency contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(
              Path("artifacts/report/vt08-index-r15-concurrent-portfolio-validation.json").read_text()
          )
          assert report["identity"] == "VT08_INDEX_R15_CONCURRENT_PORTFOLIO_VALIDATION_001"
          assert report["candidate"]["candidate_id"] == "VT08_INDEX_R14_ROLLING_1574_001"
          assert report["candidate"]["rules_changed"] is False
          assert report["sample"] == 1574
          d=report["decision"]
          assert d["all_three_markets_independent"] is True
          assert d["cross_market_concurrency_allowed"] is True
          assert d["one_active_position_per_symbol_only"] is True
          assert d["global_single_position_rule"] is False
          assert d["signal_suppression_allowed"] is False
          c=report["concurrency"]
          assert c["assigned_trade_count"] == 1574
          assert c["suppressed_trade_count"] == 0
          assert c["max_concurrent_open_positions"] >= 2
          g=report["governance"]
          assert g["no_retuning"] is True
          assert g["future_outcome_used_for_new_signal_risk"] is False
          assert g["same_timestamp_batch_uses_same_pre_batch_state"] is True
          assert g["live_authorized"] is False
          assert g["real_capital_authorized"] is False
          assert g["production_authorized"] is False
          PY

      - name: Build summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path("artifacts/report")
          r=json.loads(
              (root/"vt08-index-r15-concurrent-portfolio-validation.json").read_text()
          )
          p=r["primary_realized"]
          s=r["secondary_realized"]
          pc=r["primary_close_mark_to_market"]
          pa=r["primary_conservative_mark_to_market"]
          sa=r["secondary_conservative_mark_to_market"]
          c=r["concurrency"]
          d=r["decision"]
          lines=[
              "# VT08 INDEX R15 Concurrent Portfolio Validation",
              "",
              f"- candidate: {r['candidate']['candidate_id']}",
              f"- trades: {r['sample']}",
              f"- by market: {json.dumps(r['trade_count_by_market'], sort_keys=True)}",
              f"- suppressed trades: {c['suppressed_trade_count']}",
              f"- overlap entries: {c['overlap_entry_count']}",
              f"- max concurrent open positions: {c['max_concurrent_open_positions']}",
              f"- max committed structural risk: {c['max_committed_structural_risk_r']}R",
              f"- same-time signal batches: {c['same_timestamp_signal_batches']}",
              "",
              "## Primary -0.05R",
              f"- realized PF: {p['profit_factor']}",
              f"- realized DD: {p['max_drawdown_r']}R",
              f"- realized total: {p['total_r']}R",
              f"- close-MTM portfolio DD: {pc['max_drawdown_r']}R",
              f"- conservative intrabar portfolio DD: {pa['max_drawdown_r']}R",
              "",
              "## Secondary -0.10R",
              f"- realized PF: {s['profit_factor']}",
              f"- realized DD: {s['max_drawdown_r']}R",
              f"- conservative intrabar portfolio DD: {sa['max_drawdown_r']}R",
              "",
              "## Decision",
              f"- concurrency pass: {d['concurrency_contract_pass']}",
              f"- portfolio DD <= 6R: {d['portfolio_dd_pass']}",
              f"- contract pass: {d['contract_pass']}",
          ]
          (root/"VT08_INDEX_R15_CONCURRENT_PORTFOLIO_VALIDATION_SUMMARY.md").write_text(
              "\n".join(lines)+"\n"
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-index-r15-concurrent-portfolio-validation-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
