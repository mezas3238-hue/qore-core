name: VT08 Index R55 Distributed Causal Risk

on:
  push:
    branches: [agent/vt08-index-deep-behavior-lab-final]
    paths:
      - .github/workflows/vt08-index-r55-distributed-causal-risk.yml
      - src/qore/infrastructure/trader_lab/vt08_index_r55_distributed_causal_risk.py
      - tests/infrastructure/trader_lab/test_vt08_index_r55_distributed_causal_risk.py

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q tests/infrastructure/trader_lab/test_vt08_index_r55_distributed_causal_risk.py

  candidate:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Download NAS100 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-NAS100-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/NAS100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download SP500 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-SP500-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/SP500
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Download US30 CIBO raw M5
        uses: actions/download-artifact@v4
        with:
          name: qore-cibo-market-atlas-10y-windowed-US30-ab782b8e9f890f86a2b6500070f0556b4b685e3d
          path: artifacts/US30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35166210458

      - name: Execute R55 distributed causal candidate
        run: |
          python -m qore.infrastructure.trader_lab.vt08_index_r55_distributed_causal_risk \
            --nas100-root artifacts/NAS100 \
            --sp500-root artifacts/SP500 \
            --us30-root artifacts/US30 \
            --out artifacts/report/vt08-index-r55-distributed-causal-risk.json

      - name: Verify R55 governance and complete surface
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/report/vt08-index-r55-distributed-causal-risk.json"
              ).read_text()
          )
          assert report["identity"] == "VT08_INDEX_R55_DISTRIBUTED_CAUSAL_RISK_001"
          assert report["five_year"]["sample"] == 2448
          assert report["recent_two_year"]["sample"] >= 1000
          for key in ("five_year", "recent_two_year"):
              diagnostics = report[key]["r55_diagnostics"]
              assert diagnostics["suppressed_trade_count"] == 0
              assert float(diagnostics["minimum_effective_weight"]) >= 0.005
              assert float(diagnostics["maximum_effective_weight"]) <= 0.25
          g = report["governance"]
          assert g["development_only"] is True
          assert g["fresh_holdout_claim"] is False
          assert g["entry_changed"] is False
          assert g["stop_changed"] is False
          assert g["target_changed"] is False
          assert g["signals_suppressed"] is False
          assert g["post_entry_outcome_runtime_feature"] is False
          assert g["calendar_or_year_runtime_feature"] is False
          assert g["live_authorized"] is False
          assert g["real_capital_authorized"] is False
          assert g["production_authorized"] is False
          PY

      - name: Upload R55 evidence
        uses: actions/upload-artifact@v4
        with:
          name: qore-vt08-index-r55-distributed-causal-risk-${{ github.sha }}
          path: artifacts/report
          if-no-files-found: error
          retention-days: 90
