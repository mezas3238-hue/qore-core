name: QORE VT31 Sovereign Pure Edge Runtime
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  push:
    branches:
      - agent/vt31-edge-position-cert-b-001
    paths:
      - src/qore/infrastructure/traders/vt31_nas100_reasoning_engine.py
      - src/qore/infrastructure/traders/vt31_nas100_situation_model.py
      - src/qore/infrastructure/traders/vt31_nas100_position_intelligence.py
      - src/qore/infrastructure/traders/vt31_nas100_post_entry_cognitive_runtime.py
      - src/qore/infrastructure/traders/vt31_nas100_edge_certification.py
      - src/qore/infrastructure/traders/vt31_nas100_strategy_identity_memory.py
      - src/qore/infrastructure/traders/vt31_nas100_trader_experience_memory.py
      - scripts/vt31_nas100_specialist_r1_candidate.py
      - tests/infrastructure/test_vt31_nas100_sovereign_pure_edge_runtime.py
      - tests/infrastructure/test_vt31_nas100_cognitive_reasoning.py
      - tests/infrastructure/test_vt31_nas100_position_intelligence.py
      - tests/infrastructure/test_vt31_nas100_post_entry_cognitive_runtime.py
      - tests/infrastructure/test_vt31_nas100_edge_certification.py
      - .github/workflows/vt31-sovereign-pure-edge-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Static gates
        run: |
          set -euo pipefail
          python -m py_compile             src/qore/infrastructure/traders/vt31_nas100_reasoning_engine.py             src/qore/infrastructure/traders/vt31_nas100_situation_model.py             src/qore/infrastructure/traders/vt31_nas100_position_intelligence.py             src/qore/infrastructure/traders/vt31_nas100_post_entry_cognitive_runtime.py             src/qore/infrastructure/traders/vt31_nas100_edge_certification.py             scripts/vt31_nas100_specialist_r1_candidate.py
          ruff check             src/qore/infrastructure/traders/vt31_nas100_reasoning_engine.py             src/qore/infrastructure/traders/vt31_nas100_situation_model.py             src/qore/infrastructure/traders/vt31_nas100_position_intelligence.py             src/qore/infrastructure/traders/vt31_nas100_edge_certification.py             scripts/vt31_nas100_specialist_r1_candidate.py             tests/infrastructure/test_vt31_nas100_sovereign_pure_edge_runtime.py             tests/infrastructure/test_vt31_nas100_cognitive_reasoning.py             tests/infrastructure/test_vt31_nas100_position_intelligence.py             tests/infrastructure/test_vt31_nas100_post_entry_cognitive_runtime.py             tests/infrastructure/test_vt31_nas100_edge_certification.py
      - name: Sovereign pure-edge focused tests
        run: |
          set -euo pipefail
          pytest -q -o addopts=''             tests/infrastructure/test_vt31_nas100_sovereign_pure_edge_runtime.py             tests/infrastructure/test_vt31_nas100_cognitive_reasoning.py             tests/infrastructure/test_vt31_nas100_position_intelligence.py             tests/infrastructure/test_vt31_nas100_edge_certification.py             tests/infrastructure/test_vt31_nas100_specialist_r1_candidate.py
      - name: Candidate self-test
        run: |
          set -euo pipefail
          python scripts/vt31_nas100_specialist_r1_candidate.py --self-test
