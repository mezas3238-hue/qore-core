name: London TTrades-Inspired Asia Raid Price Paths (Source-Only)

on:
  push:
    branches: [research/london-after-asia-sweep-path-20261011]
    paths:
      - '.github/workflows/qore-london-ttrades-inspired-postraid-pricepath.yml'
      - 'src/qore/infrastructure/trader_lab/qore_london_after_asia_raid_paths_v1.py'
      - 'tests/infrastructure/trader_lab/test_qore_london_after_asia_raid_paths_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  M1_RUN: '35548099334'
  M1_SHA: '18c338aedd5013ce65a6cb6408ffbc2e904a6217'

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - name: Verify frozen preregistration and causal tests, NO ECONOMIC STOPS
        run: |
          test -s docs/research/QORE_LONDON_AFTER_ASIA_SWEEP_TTRADES_SOURCE_ALIGNED_REPLAY_PREREG_2026-10-11.md
          test -s docs/research/QORE_LONDON_YOUTUBE_METHODS_SOURCE_REVIEW_2026-10-11.md
          python -m compileall -q src/qore/infrastructure/trader_lab/qore_london_after_asia_raid_paths_v1.py
          ruff check --select F,E4,E7,E9 src/qore/infrastructure/trader_lab/qore_london_after_asia_raid_paths_v1.py tests/infrastructure/trader_lab/test_qore_london_after_asia_raid_paths_v1.py
          pytest -q --no-cov tests/infrastructure/trader_lab/test_qore_london_after_asia_raid_paths_v1.py

  markets:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        symbol: [EURUSD, GBPUSD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - name: 'Frozen provider-native M1 - no V49, no tick, no BID/ASK'
        uses: actions/download-artifact@v4
        with:
          name: qore-capitalizer-cibo-10y-native-m1-${{ matrix.symbol }}-${{ env.M1_SHA }}
          path: native
          github-token: ${{ github.token }}
          run-id: ${{ env.M1_RUN }}
      - name: Check native M1 provenance
        env: {SYMBOL: '${{ matrix.symbol }}'}
        run: |
          python - <<'PY'
          import os, json
          from pathlib import Path
          x=json.loads(Path("native/m1-clone-manifest.json").read_text())
          assert x["canonical_symbol"]==os.environ["SYMBOL"]
          assert x["provider_native_m1"] and not x["synthetic_m1"]
          assert not x["interpolated_m1"] and x["contradictory_m1"]==0
          assert x["read_only"]
          print("SOURCE_NATIVE_M1_CONTRACT",x["canonical_symbol"])
          PY
      - name: Replay every eligible first Asian raid in London and later price paths
        run: |
          python -m qore.infrastructure.trader_lab.qore_london_after_asia_raid_paths_v1 market native MARKET
      - uses: actions/upload-artifact@v4
        with:
          name: london-ttrades-source-only-${{ matrix.symbol }}-${{ github.sha }}
          path: MARKET/
          retention-days: 90
          if-no-files-found: error

  consolidate:
    needs: markets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: london-ttrades-source-only-*-${{ github.sha }}
          path: MARKETS
      - name: Freeze comprehensive first-raid and 30 60 120m price-route results
        run: |
          python -m qore.infrastructure.trader_lab.qore_london_after_asia_raid_paths_v1 aggregate MARKETS RESULTS
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("RESULTS/london-ttrades-inspired-postraid-two-market-results.json").read_text())
          assert set(x["markets"])=={"EURUSD","GBPUSD"}
          assert x["no_trades_or_PF"] and x["no_broker_quotes_required"]
          assert x["cisd_and_structure_are_QORE_proxies_not_exact_author"]
          assert all(x["markets"][s]["date_rows_total"]>200 for s in x["markets"])
          print("LONDON_SOURCE_ONLY_CENSUS",json.dumps({
            s: {"statuses":z["status_counts"],
                "N_checkpoint":z["checkpoint_valid"],
                "state_outcomes":z["by_state"],
                "cisd_proxy_outcomes":z["by_cisd_proxy"],
                "structure_proxy_outcomes":z["by_structure_proxy"],
                "CISD_vs_MSS_proxy":z["by_cisd_structure_order"],
                "horizons":z["horizons"],
                "bootstrap_state_delta":z["checkpoint_state_reversal_minus_acceptance_reversal_probability_bootstrap"]}
            for s,z in x["markets"].items()
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: london-ttrades-source-only-nine-states-aggregate-${{ github.sha }}
          path: RESULTS/
          retention-days: 90
          if-no-files-found: error
