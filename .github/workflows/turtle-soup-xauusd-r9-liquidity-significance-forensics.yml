name: QORE Turtle Soup XAUUSD R9 Liquidity Significance Forensics

on:
  workflow_dispatch:
  push:
    branches:
      - agent/turtle-soup-xauusd-r3-forensics-001
    paths:
      - '.github/workflows/turtle-soup-xauusd-r9-liquidity-significance-forensics.yml'
      - 'src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r9_liquidity_significance_forensics.py'
      - 'tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r9_liquidity_significance_forensics.py'

env:
  SOURCE_RUN_ID: '35166210458'
  SOURCE_ARTIFACT: 'qore-cibo-market-atlas-10y-windowed-XAUUSD-ab782b8e9f890f86a2b6500070f0556b4b685e3d'
  TARGET_RUN_ID: '35204892665'
  TARGET_ARTIFACT: 'qore-cibo-target-destination-v2-XAUUSD-2f510461b3360e91d5ee70a72716a76cd6561f16'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ruff focused gate
        run: |
          ruff check --ignore E501,I001,F401 \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r9_liquidity_significance_forensics.py \
            tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r9_liquidity_significance_forensics.py
      - name: Mypy focused gate
        run: |
          mypy --disable-error-code var-annotated --disable-error-code attr-defined --disable-error-code no-any-return \
            src/qore/infrastructure/trader_lab/turtle_soup_xauusd_r9_liquidity_significance_forensics.py
      - name: Focused tests
        run: pytest -q --no-cov tests/infrastructure/trader_lab/test_turtle_soup_xauusd_r9_liquidity_significance_forensics.py

  forensics:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download immutable consumed XAUUSD M5 corpus
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download immutable consumed XAUUSD Target Destination V2
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT }}
          path: target-xauusd
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_RUN_ID }}
      - name: Execute liquidity significance forensics
        run: |
          mkdir -p r9l-output
          python -m qore.infrastructure.trader_lab.turtle_soup_xauusd_r9_liquidity_significance_forensics \
            source-xauusd target-xauusd r9l-output > r9l-output/stdout.json
          printf '%s\n' "$GITHUB_SHA" > r9l-output/git-sha.txt
      - name: Enforce reproduction and governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('r9l-output/liquidity-significance-report.json').read_text())
          assert p['identity']=='TURTLE_SOUP_XAUUSD_R9_LIQUIDITY_SIGNIFICANCE_FORENSICS_V1'
          assert p['reproduction']['retained_bars']==707716
          assert p['reproduction']['r7_retained']==5612
          assert p['reproduction']['break_a_trades']==151
          assert p['reproduction']['break_b_trades']==88
          assert p['interpretation_contract']['automatic_threshold_search'] is False
          assert p['interpretation_contract']['return_maximising_feature_selection'] is False
          assert p['interpretation_contract']['candidate_rule_promoted'] is False
          assert p['governance']['fresh_holdout_consumed'] is False
          assert p['governance']['year_or_date_allowed_as_operating_rule'] is False
          assert p['governance']['demo_eligible'] is False
          assert p['governance']['live_authorized'] is False
          assert p['governance']['real_capital_authorized'] is False
          assert p['governance']['production_authorized'] is False
          PY
      - name: Hash immutable result
        run: |
          cd r9l-output
          sha256sum liquidity-significance-report.json break-a-liquidity.json break-b-liquidity.json stdout.json git-sha.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qore-turtle-soup-xauusd-r9-liquidity-significance-${{ github.sha }}
          path: r9l-output
          if-no-files-found: error
          retention-days: 90
