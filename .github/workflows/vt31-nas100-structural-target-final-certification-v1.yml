name: QORE VT31 NAS100 Structural Target Final Certification V1

on:
  push:
    branches:
      - agent/vt31-nas100-hypothesis-lifecycle-v1
    paths:
      - scripts/vt31_nas100_structural_target_final_certification_suite_v1.py
      - .github/workflows/vt31-nas100-structural-target-final-certification-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Static gate
        run: |
          set -euo pipefail
          python -m py_compile scripts/vt31_nas100_structural_target_final_certification_suite_v1.py
          ruff check scripts/vt31_nas100_structural_target_final_certification_suite_v1.py
      - name: Recover immutable R8 R6 R5 evidence
        run: |
          set -euo pipefail
          mkdir -p input/r8 input/r6 input/r5 result
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10402199719/zip" > r8.zip
          unzip -q r8.zip -d input/r8
          test -f input/r8/fresh/NAS100/market-evidence.json
          echo "4031c7e21bb311fdb99d7b1028fd9ff154ace1dc4886249ff978b700fdeeedcb  input/r8/fresh/NAS100/market-evidence.json" | sha256sum -c -
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10389112524/zip" > r6.zip
          unzip -q r6.zip -d input/r6
          test -f input/r6/fresh/NAS100/market-evidence.json
          echo "cf3ef22fa86916bfb2826f4fa48c7a9655b9509c76a05d9bb26d0d4cb6069581  input/r6/fresh/NAS100/market-evidence.json" | sha256sum -c -
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10380044761/zip" > r5.zip
          unzip -q r5.zip -d input/r5
          test -f input/r5/fresh/NAS100/market-evidence.json
          echo "7b1e3d9e2bfd17ccc6f043befabf464838d150bc6034ced1f76a24ee248611d7  input/r5/fresh/NAS100/market-evidence.json" | sha256sum -c -
      - name: Run final certification suite
        run: |
          set -euo pipefail
          python scripts/vt31_nas100_structural_target_final_certification_suite_v1.py \
            --r8 input/r8/fresh/NAS100/market-evidence.json \
            --r6 input/r6/fresh/NAS100/market-evidence.json \
            --r5 input/r5/fresh/NAS100/market-evidence.json \
            --output result/final-certification.json \
            | tee result/summary.json
      - name: Certification governance gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("result/final-certification.json").read_text())
          assert p["candidate_id"] == "VT31_NAS100_STRUCTURAL_TARGET_V1"
          assert p["selected_variant"] == "EQ50_COMPRESSED_ACCEPT_RUN25"
          assert p["contract_fingerprint"] == "089c41f98a72295278063cfc29caf8419538f68315d9f5e57be144fbdae15e08"
          g=p["governance"]
          assert g["parameter_scan_inside_suite"] is False
          assert g["variant_comparison_inside_suite"] is False
          assert g["retuning_after_5y"] is False
          assert g["fresh_holdout_claimed"] is False
          assert g["source_evidence_consumed"] is True
          assert g["silver_bullet_changed"] is False
          assert g["live_authorized"] is False
          assert g["real_capital_authorized"] is False
          assert g["production_authorized"] is False
          PY
      - name: Bind result
        run: |
          set -euo pipefail
          echo "$GITHUB_SHA" > result/git-sha.txt
          echo "freeze_run=35513305170" > result/bindings.txt
          echo "freeze_artifact=10605623133" >> result/bindings.txt
          echo "five_year_run=35513474108" >> result/bindings.txt
          echo "five_year_artifact=10605433453" >> result/bindings.txt
          (cd result && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd result && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: qore-vt31-nas100-structural-target-final-certification-${{ github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 90
