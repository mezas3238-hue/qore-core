name: QORE CIBO Final Integrated Exam External Blocker Reconciliation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/qore/infrastructure/cibo_final_integrated_exam_external_blocker_reconciliation.py'
      - 'tests/infrastructure/test_cibo_final_integrated_exam_external_blocker_reconciliation.py'
      - '.github/workflows/cibo-final-integrated-exam-external-blocker-reconciliation.yml'
      - 'docs/research/CIBO-MASTER-OPEN-WORK-LEDGER-V1.json'

permissions:
  contents: read

jobs:
  external-blocker-reconciliation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Exact 45-row external blocker reconciliation
        run: |
          ruff check \
            src/qore/infrastructure/cibo_final_integrated_exam_external_blocker_reconciliation.py \
            tests/infrastructure/test_cibo_final_integrated_exam_external_blocker_reconciliation.py
          mypy \
            src/qore/infrastructure/cibo_final_integrated_exam_external_blocker_reconciliation.py
          pytest -q --no-cov \
            tests/infrastructure/test_cibo_final_integrated_exam_external_blocker_reconciliation.py
