name: QORE CIBO Walk Forward Expectation

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cibo-causal-expectation-leakage-fix-001
    paths:
      - '.github/workflows/cibo-walk-forward-expectation.yml'
      - 'src/qore/infrastructure/cibo_ce2i_causal_expectation.py'
      - 'src/qore/infrastructure/cibo_walk_forward_expectation.py'
      - 'src/qore/infrastructure/cibo_single_account_manifest_settlement.py'
      - 'src/qore/infrastructure/cibo_single_account_manifest_economics.py'
      - 'src/qore/infrastructure/cibo_portfolio_allocation_engine.py'
      - 'src/qore/infrastructure/cibo_native_max_cognitive_episode.py'
      - 'scripts/cibo_build_walk_forward_expectation_manifest.py'
      - 'tests/infrastructure/test_cibo_walk_forward_expectation.py'
      - 'tests/infrastructure/test_cibo_walk_forward_manifest_builder.py'
      - 'tests/infrastructure/test_cibo_single_account_manifest_settlement.py'
      - 'tests/infrastructure/test_cibo_native_maximum_intelligence.py'

permissions:
  contents: read

concurrency:
  group: qore-cibo-walk-forward-expectation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  walk-forward:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Compile and lint
        run: |
          set -euo pipefail
          python -m py_compile             src/qore/infrastructure/cibo_ce2i_causal_expectation.py             src/qore/infrastructure/cibo_walk_forward_expectation.py             src/qore/infrastructure/cibo_single_account_manifest_settlement.py             src/qore/infrastructure/cibo_single_account_manifest_economics.py             src/qore/infrastructure/cibo_portfolio_allocation_engine.py             src/qore/infrastructure/cibo_native_max_cognitive_episode.py             scripts/cibo_build_walk_forward_expectation_manifest.py
          ruff check             src/qore/infrastructure/cibo_ce2i_causal_expectation.py             src/qore/infrastructure/cibo_walk_forward_expectation.py             src/qore/infrastructure/cibo_single_account_manifest_settlement.py             src/qore/infrastructure/cibo_single_account_manifest_economics.py             src/qore/infrastructure/cibo_portfolio_allocation_engine.py             src/qore/infrastructure/cibo_native_max_cognitive_episode.py             scripts/cibo_build_walk_forward_expectation_manifest.py             tests/infrastructure/test_cibo_walk_forward_expectation.py             tests/infrastructure/test_cibo_walk_forward_manifest_builder.py             tests/infrastructure/test_cibo_single_account_manifest_settlement.py             tests/infrastructure/test_cibo_native_maximum_intelligence.py

      - name: Prove causal walk-forward invariants
        run: |
          set -euo pipefail
          pytest -q --no-cov             tests/infrastructure/test_cibo_walk_forward_expectation.py             tests/infrastructure/test_cibo_walk_forward_manifest_builder.py             tests/infrastructure/test_cibo_single_account_manifest_settlement.py             tests/infrastructure/test_cibo_native_maximum_intelligence.py
