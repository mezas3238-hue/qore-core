[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qore-core"
version = "0.1.0"
description = "QORE Core"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tzdata>=2026.1,<2027",
]

[project.optional-dependencies]
ctrader = [
    "ctrader-open-api==0.9.2",
    "service-identity==24.2.0",
]
dev = [
    "mypy>=1.10,<2",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.5,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# MetaTrader5 is a third-party CamelCase module commonly imported as mt5.
# Runtime scripts are outside the typed src package and intentionally hash
# namedtuple-like provider objects without introducing a local protocol layer.
"scripts/fundednext_mt5_order_check_probe.py" = ["B009", "N813"]
"scripts/qore_fundednext_runtime.py" = ["B009", "I001", "N813"]
# The interrupted-attempt loop iterates stable key/value pairs for snapshot
# safety even though only the record is required by the current transition.
"src/qore/infrastructure/fundednext_live_mt5.py" = ["B007"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/qore --cov-report=term-missing"
